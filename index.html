 [отзыв в Steam](https://steamcommunity.com/app/252470/reviews/?browsefilter=toprated): сборка корабля сильна, а стратегический слой тонок — союзы ничего не дают, капитаны глуповаты, начало бедное, конец — прогулка. Продолжение сменило прямое управление маленьким флотом на одну тяжёлую матку и карту стратегии; на этом отзывы и разошлись.\n- **Взять:** постоянных капитанов с лицом, которые живут по правилам игрока и помнят его; награду за голову в обе стороны; бой, на который приходят падальщики; деталь, сбитую с врага и поставленную себе; нехватку (топлива) как причину всех ссор.\n- **Не переносится:** двести агентов и территории требуют отдельной карты-стратегии, и даже с ней рецензенты нашли этот слой тонким.\n\nАвторы о работе: докажи веселье рано — если игра становится приятной через год, что-то не так; лучшим решением назвали переделку почти всех экранов, чтобы игрок понимал игру. Страница SPAZ 2 говорит прямо: «The player is not special and is not the center of the Galaxy».\n\n### Grand Theft Auto\nDMA Design и Rockstar. Нам важны три вещи: игры с видом сверху (GTA, 1997; GTA 2, 1999; Chinatown Wars, 2009), розыск и кооп-ограбления GTA Online.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/271590/ss_da39c16db175f6973770bae6b91d411251763152.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/271590/ss_da39c16db175f6973770bae6b91d411251763152.600x338.jpg\" alt=\"GTA Online: четверо у стола плана\">GTA Online: четверо у стола плана<\/a>\n<\/div>\n\n- **Игра.** GTA: открытый город сверху, цель уровня — сумма очков; очки дают за всё, а больше всего за задания, взятые у звонящих телефонных будок, в любом порядке. Задание поднимает множитель, гибель его сбрасывает. GTA 2 добавила гаражи с доработками машин, побочные работы и спрятанные посылки.\n- **Сюжет.** В первых двух его почти нет: боссы говорят из телефонных будок. С GTA III задания дают знакомые, несколько сразу; правило Дэна Хаузера — история показывает механики, а механики рассказывают историю. Мир несёт радио: семь станций были уже в первой игре. В Chinatown Wars всё идёт через карманный компьютер: письма, навигатор, магазин.\n- **Уважение банд (GTA 2).** В районе три банды, каждая воюет с одной из двух других. У каждой шкала уважения на экране. Работа на банду и убийства её врагов поднимают её шкалу и роняют вражескую. Телефоны банды трёх цветов: зелёные дают лёгкие задания, жёлтые платят лучше и просят уважения, красные — лучшие и только при полном уважении. Банда, которая тебя не уважает, заданий не даёт и стреляет на своей земле ([Respect](https://www.grandtheftwiki.com/Respect), [Gangs in GTA 2](https://www.grandtheftwiki.com/Gangs_in_GTA_2)).\n- **Экономика (Chinatown Wars).** Единственная настоящая торговля в серии: шесть товаров; девять банд, у каждой свой район, один товар дёшев, другой дорог. Сумка на 50 мест, её теряешь при аресте; склад дома без предела. Стрелка у сделки показывает прибыль или убыток. Торговцы шлют письма-наводки — дешёвая партия или высокая цена, — и наводка сгорает через два игровых дня. Крупная сделка может кончиться облавой и двумя звёздами ([Drug Dealing](https://www.grandtheftwiki.com/Drug_Dealing)). Хаузер: торговля подходит к езде по карте, даёт игроку ещё один слой и идёт сама по себе, рядом с сюжетом.\n- **Розыск.** Шкала до пяти-шести звёзд, каждая звезда — ответ сильнее. Уйти можно, пропав из вида, перекрасив машину или заплатив. В GTA 2 у каждого района свой потолок звёзд, так что дальние районы жёстче. В Chinatown Wars звёзды снимают, разбивая полицейские машины.\n- **Заклятые враги.** Системы нет.\n- **Классы.** Нет. В ограблениях GTA Online роли раздают на задание: водитель, стрелок, взломщик.\n- **Кооп.** Ограбления GTA Online (2015): цепочки из подготовок и финала ровно на четверых. Лидер платит за подготовку, зовёт команду, раздаёт роли и доли и получает деньги только в финале; остальным платят за каждую подготовку ([IGN](https://www.ign.com/articles/2014/12/16/grand-theft-auto-5-online-heists-finally-revealed)).\n- **Как приняли.** Chinatown Wars — 93 на Metacritic, лучшая оценка на своей консоли, и рецензенты помнят именно торговлю. В GTA 2 хвалили банды. GTA Online ругали на старте за бесцельность, а ограбления приняли лучше всего.\n- **Взять:** шкалы уважения сторон с тремя ступенями заданий и сторону, что стреляет первой при плохом уважении; весь цикл торговли Chinatown Wars — мало товаров, у каждого продавца один дешёвый и один дорогой, маленький трюм, который теряешь, наводки со сроком, риск облавы на крупной сделке; радио как дешёвый рассказ о мире; задания-цепочки на четверых с лидером.\n- **Не переносится:** постановочные задания с озвученным составом; плотность города.\n\nImran Sarwar, продюсер GTA Online, об ограблениях: ранние версии были веселы для одного-двух игроков, а остальные стояли в стороне; задания несколько раз переделывали с нуля, пока каждый из четверых не стал нужен. По его словам, это оказалось «much more difficult than we anticipated». Первая GTA начиналась как игра про полицейских и гонщиков; она была скучной, пока игроку не дали быть плохим ([история](https://en.wikipedia.org/wiki/Grand_Theft_Auto_%28video_game%29)).\n\n### Sid Meier's Pirates!\nMicroProse, 1987; Firaxis, 2004. Образец того, как одна маленькая игра держит торговлю, войну наций, именных соперников, личную историю и улучшения корабля.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000679.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000679.600x338.jpg\" alt=\"бой: шлюп «Кассандра» против брига\">бой: шлюп «Кассандра» против брига<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000680.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000680.600x338.jpg\" alt=\"линейный корабль против военного галеона\">линейный корабль против военного галеона<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000676.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000676.600x338.jpg\" alt=\"дуэль на шпагах\">дуэль на шпагах<\/a>\n<\/div>\n\n- **Игра.** Карта Карибов сверху и короткие сцены на ней: морской бой, фехтование, штурм города, танец. В бою ведёшь один корабль, залп наводится сам, выбираешь заряд: ядра по корпусу, книппели по парусам, картечь по команде. У каждого корабля на карте видны флаг, груз, откуда и куда он идёт, так что добычу выбирают.\n- **Сюжет.** Рамка вокруг свободной карьеры: маркиз обратил семью героя в рабство. Сюжет — длинные необязательные нити внутри песочницы: найти родных, в конце взять логово маркиза. Рядом вторая нить — дочери губернаторов.\n- **Мир и экономика.** Четыре нации, чьи война и мир меняются сами; нападая на одну, радуешь её врагов, и они платят чинами и землёй. Цены зависят от места: города у пиратских гаваней дороже берут пушки, дальние — припасы; у маленького города мало золота и товара. Год начала меняет, кому принадлежат Карибы.\n- **Заклятые враги.** Лёгкая авторская форма: девять именных пиратов, у каждого флаг, гавань, корабль и клад, и все в списке десяти лучших, где игрок начинает десятым. Победил — забрал корабль и поднялся в списке. Выкопал клад пирата до победы — он охотится за тобой, как только увидит.\n- **Улучшения.** У корабелов в разных портах: бронзовые пушки, железный набор, медная обшивка. Мастера (парусный, бондарь) приходят с захваченных кораблей.\n- **Классы.** Один выбор в начале: умение, которое помогает в одной из сцен. Второй «класс» — тип корабля: шлюп для разбоя, фрегат для боя, галеон медленный и крепкий.\n- **Кооп.** На PC нет.\n- **Возраст.** У карьеры есть часы: с годами капитан фехтует медленнее. Когда делить добычу и когда уйти на покой — часть игры; в конце счёт славы.\n- **Как приняли.** 94 % из 4 797, Metacritic 88. IGN хвалил, как много занятий сложены вместе и дают выбрать стиль, и ругал повторы со временем.\n- **Взять:** список десяти именных соперников с игроком внизу, у каждого флаг, дом и приз; соперника, который начинает охоту, когда ограбишь его тайник; стороны, чья война и мир меняют, кто сегодня добыча; корабли, у которых виден груз и путь; личную нить, живущую внутри открытого мира как длинные необязательные задания.\n- **Не переносится:** карьера одного капитана с возрастом спорит с коопом, куда входят и выходят; фехтование, танцы и бой на суше — отдельные игры со своей ценой.\n\nSoren Johnson о [правилах Сида Мейера](https://www.gamedeveloper.com/game-platforms/analysis-sid-meier-s-key-design-lessons): одна хорошая игра лучше двух отличных, и Pirates! избегает этой беды только потому, что её сцены длятся несколько минут и каждая — шаг на длинном пути. Сам Мейер строил игру вокруг фантазии о пиратах, а не вокруг истории.\n\n### King of Seas\n3DClouds, около 18 человек, 2021. Тот же жанр и почти та же камера. Обещал почти всё из списка владельца и получил средние оценки, поэтому это главный урок отчёта.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a71a2d50aa80f013120250a63db016a7859e5e2e.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a71a2d50aa80f013120250a63db016a7859e5e2e.600x338.jpg\" alt=\"бой\">бой<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a20cc91be2c16752c7336c7a3e175b9c2c30219c.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a20cc91be2c16752c7336c7a3e175b9c2c30219c.600x338.jpg\" alt=\"порт\">порт<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_580c9435a810bbc79ea9836d664bd8e199e1bc06.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_580c9435a810bbc79ea9836d664bd8e199e1bc06.600x338.jpg\" alt=\"кракен\">кракен<\/a>\n<\/div>\n\n- **Игра.** Ход задают три паруса, пушки бьют с борта на малую дальность. Сверху — до двадцати умений, большей частью магия, вдвое дальше пушек; у врагов их почти нет. Бои — медленные круги на краю секторов огня ([PC Gamer](https://www.pcgamer.com/king-of-seas-review/)).\n- **Сюжет.** Написанная кампания: дитя короля, обвинённое в его убийстве. PC Gamer: история уместится в один твит. [Nintendo Life](https://www.nintendolife.com/reviews/switch-eshop/king_of_seas): многообещающее начало, которое сразу выдаёт свои сюрпризы. Позже сюжет требует уровня: «достигни 35-го».\n- **Мир и экономика.** Обещано: процедурная карта и мир, который меняется от поступков игрока. Сделано: порт делает много одного товара и мало другого, цены разные, торговля бывает выгоднее разбоя; по карте ходят купцы и патрули; порты берут, кружа у башен. PC Gamer: проступков игрока никто долго не помнит.\n- **Заклятые враги.** Нет. Награда за голову — число, которое усиливает охотников.\n- **Улучшения.** Больше 900 предметов трёх редкостей с воды, обломков, пляжей и рынков; уровни. Враги растут вместе с игроком.\n- **Классы.** Пять типов кораблей.\n- **Кооп.** Нет.\n- **Как приняли.** 57 % из 607 в Steam, Metacritic 68. PC Gamer (78): рулить и уворачиваться приятно, но игра плохо говорит, что делать; побочные задания трёх видов — доставь, сопроводи, уничтожь. Nintendo Life (5 из 10): хорошее управление, а потом изнурительная прокачка, далёкое возрождение и одинаковая добыча.\n- **Взять:** никогда не сходить с корабля; умения с перезарядкой, которые бьют дальше пушек и есть только у игрока; порт с одним дешёвым и одним дорогим товаром; добычу, плавающую на воде.\n- **Чего избегать:** процедурная карта, таблица добычи и кривая уровней не сложились в мир. Три вида заданий, пороги уровня, враги, растущие вместе с игроком, мир, который назван отзывчивым и ничего не помнит, долгий путь назад после гибели. Сюжет остался рамкой, которую никто не запомнил.\n\nРуководитель игры Luca Cafasso: студия делала гонки и хотела остаться в технике; сходить на берег пробовали и отказались — «the scope of the game became too broad» ([превью](https://filmstories.co.uk/gaming/king-of-seas-arrrrr-its-a-pirate-game/)).\n\n### Rebel Galaxy\nDouble Damage Games, два человека, 2015. Морской бой в космосе: корабль ходит только по плоскости и бьёт бортом.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_af43bf50a4a6f0369568988628deb12c4840df17.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_af43bf50a4a6f0369568988628deb12c4840df17.600x338.jpg\" alt=\"бортовой бой\">бортовой бой<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_b233b7a42575a16f12cff89e9a1d31efcdc0a3eb.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_b233b7a42575a16f12cff89e9a1d31efcdc0a3eb.600x338.jpg\" alt=\"верфь\">верфь<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_c15c9476b66a30d8325b56d587ee222b035aed02.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_c15c9476b66a30d8325b56d587ee222b035aed02.600x338.jpg\" alt=\"бармен\">бармен<\/a>\n<\/div>\n\n- **Игра.** Бортовой залп заряжают, держа кнопку: конус уже, урон больше. Башни стреляют сами, одну можно взять в руки. Отражатель, нажатый вовремя, сбивает ракеты, но на миг отключает свои пушки. Лучшее — большие бои фракций, в которые попадаешь случайно ([PC Gamer](https://www.pcgamer.com/rebel-galaxy-review/)).\n- **Сюжет.** Тонкая линия сюжетных заданий через случайную песочницу. Задание решается по-разному: первое же позволяет заплатить торговцу, запугать его, расстрелять или забрать деньги и купить дешевле в другом месте ([интервью](https://classic.rpgfan.com/features/Rebel_Galaxy_Interview/)).\n- **Мир и экономика.** Станции покупают и продают товары. Стороны: расы, гильдии и местные пираты; отношение двигают и ответы в разговоре, и дела в космосе. Высокое отношение открывает оружие и корабли стороны и приводит помощь; низкое — засады, а при ненависти сторона шлёт убийц. События системы меняют спрос: при голоде можно привезти еду, а можно грабить корабли с помощью и продлить голод ([интервью](https://gamingbolt.com/rebel-galaxy-interview-loot-drops-from-the-edge-of-the-universe)).\n- **Заклятые враги.** По имени нет.\n- **Улучшения.** Вся прогрессия: заработать и купить лучше — пушки, башни, щиты, двигатели, потом корпус крупнее.\n- **Классы.** Нет. **Кооп.** Нет: два человека, осознанно.\n- **Как приняли.** 86 % из 5 326, Metacritic 75. PC Gamer (70): красиво, большие бои захватывают; но слабый корабль в начале, случайные перехваты в каждом рейсе и рост, который про вещи, а не про умение: «Earn more, buy more, win more, repeat».\n- **Взять:** доказательство, что бортовой бой работает как аркада у крошечной команды; отношение сторон, которое открывает детали, приводит помощь или убийц; события мира, которые игрок может облегчить или использовать; сигнал бедствия с двумя сторонами на выбор.\n- **Не переносится:** лестница «деньги за вещи» — именно её рецензенты назвали рутиной.\n\n### Assassin's Creed IV: Black Flag и Skull and Bones\nUbisoft, 2013 и 2024. Первая — лучший морской цикл с одним кораблём за десять лет. Вторая взяла её бой, добавила кооп и экономику и провалилась; разбирать их стоит вместе.\n\n- **Игра (Black Flag).** Оружие выбирает сторона, куда смотрит камера: с борта — залп, вперёд — книппели по парусам, назад — бочки-мины; мортиры вдаль. Побитый корабль можно взять на абордаж за весь груз (потопишь — половина), а победу тратишь на одно из трёх: ремонт, сброс розыска или команду. Подзорная труба показывает груз и силу корабля до боя ([PC Gamer](https://www.pcgamer.com/assassins-creed-4-black-flag-review/)).\n- **Мир.** Корабли разных классов возят материалы для улучшений и товар на продажу. Розыск в море растёт с каждым разбоем и приводит охотников под красными парусами. Форт закрывает район: пока он не взят, карта не показывает занятий района ([Forts](https://www.ign.com/wikis/assassins-creed-4-black-flag/Forts)).\n- **Заклятые враги.** Системы нет. Есть пять легендарных кораблей по углам карты, и у каждого своё правило: один прячется в тумане и бьёт мортирами, другой пробивается только с кормы, двое зажимают между бортами, пятый быстрее игрока и таранит ([Legendary Ships](https://www.ign.com/wikis/assassins-creed-4-black-flag/Legendary_Ships)).\n- **Улучшения.** Корабль растёт за деньги и добытые материалы; добыча крупнее требует корабля сильнее и оплачивает следующий шаг. PC Gamer: хорошая экономика, которая открывает всё более трудные бои, а не тянет время.\n- **Skull and Bones.** Бой и кооп (флот до трёх игроков) рецензенты хвалят. Но всё стоящее надо построить по чертежу: сначала ранг, потом материалы, потом рейс. [Eurogamer](https://www.eurogamer.net/skull-and-bones-review): игрок там «more grocery delivery driver than pirate». [PC Gamer](https://www.pcgamer.com/skull-and-bones-review/) (68): каждое простое дело разбито на три долгих перехода. Стороны забывают игрока, как только он ушёл из вида.\n- **Как приняли.** Black Flag: 85 % из 30 910, Metacritic 88. Skull and Bones: 67 % из 2 283, Metacritic 59.\n- **Взять:** цикл «рассмотреть — обездвижить — взять целиком или потопить за половину — выбрать, на что потратить победу»; несколько материалов улучшения, которые возят заметные типы кораблей; форт, который закрывает район и после взятия открывает его дела; четыре-пять ручных кораблей-боссов по краям карты, каждый ломает одно правило.\n- **Чего избегать:** экономика, превращающая каждое улучшение в три рейса, читается как работа, а мир без памяти — как декорация.\n\n### Middle-earth: Shadow of Mordor и Shadow of War\nMonolith Productions, 2014 и 2017. Отсюда само слово «nemesis»: враг, который помнит игрока и растёт от встречи к встрече.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/241930/ss_68697a274ce491c11d94c0cc94a213177945919c.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/241930/ss_68697a274ce491c11d94c0cc94a213177945919c.600x338.jpg\" alt=\"Shadow of Mordor: подчинение капитана\">Shadow of Mordor: подчинение капитана<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/356190/ss_096538495a348e1bff5432353cbee8e28fb3cee8.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/356190/ss_096538495a348e1bff5432353cbee8e28fb3cee8.600x338.jpg\" alt=\"Shadow of War: осада, штурм против обороны\">Shadow of War: осада, штурм против обороны<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/356190/ss_451734c9d8cfeb70c922f2de7b3ccb0bee99e169.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/356190/ss_451734c9d8cfeb70c922f2de7b3ccb0bee99e169.600x338.jpg\" alt=\"Shadow of War: карта региона\">Shadow of War: карта региона<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/593380/ss_2ffbc740db7e25b2a8967f7018845ef1641ab330.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/593380/ss_2ffbc740db7e25b2a8967f7018845ef1641ab330.600x338.jpg\" alt=\"XCOM 2: один из Избранных\">XCOM 2: один из Избранных<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/593380/ss_bac5218209a7c33b0718c6546018244a33be0858.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/593380/ss_bac5218209a7c33b0718c6546018244a33be0858.600x338.jpg\" alt=\"XCOM 2: Избранный в бою\">XCOM 2: Избранный в бою<\/a>\n<\/div>\n\n- **Как рождается.** Безымянный орк, который убил игрока или пережил бой, становится капитаном с сильными и слабыми сторонами. Убивший игрока набирает силу; сброшенный в огонь возвращается мстить ([Википедия](https://en.wikipedia.org/wiki/Middle-earth:_Shadow_of_Mordor)).\n- **Как становится личным.** Имя, прозвище и свои реплики; его бойцы скандируют имя. Mike Bithell сводит всю систему к двум вещам: непрерывность и личные приметы, имена собраны из частей ([PC Gamer](https://www.pcgamer.com/why-hasnt-anyone-copied-shadow-of-mordors-nemesis-system/)).\n- **Что помнит.** Игра хранит каждый бой; то, что сделал игрок, остаётся шрамами на лице и теле орка.\n- **Как меняется.** Растёт с каждой победой над игроком. Одна слабость закреплена и не снимается никогда. Скрытый счёт встреч с игроком решает, кому позволено «обмануть смерть» и вернуться ([PC Gamer](https://www.pcgamer.com/the-guy-who-designed-shadow-of-wars-orcs-is-super-proud-that-theyre-such-dicks/)).\n- **Как встречают снова и чем кончается.** В Shadow of War у крепости есть владыка и вожди; орки вспоминают прошлые встречи; слабости узнают, допрашивая мелких. Орка можно убить, опозорить или завербовать; свои спасают игрока, дарят и предают.\n- **Зачем это сделано.** Michael de Plater перечислил события, которые игроки запоминают; очевиднее всех — собственная гибель. Поэтому система привязана к убийце и отвечает только на яркие моменты ([GamesBeat](https://gamesbeat.com/shadow-of-mordors-nemesis-system-draws-from-burnout-football-and-an-architecture-book/)).\n- **Слабое место.** По словам Bob Roberts, хуже всех система показывала себя самым сильным игрокам: они не проигрывали. В Shadow of War добавили предательство, чтобы драма не требовала гибели игрока ([Game Developer](https://www.gamedeveloper.com/design/upgrading-the-nemesis-system-for-i-middle-earth-shadow-of-war-i-)).\n- **Цена.** Около трёх лет; задумка выросла до фракций с боевым духом и была урезана после тестов ([Kotaku](https://kotaku.com/shadow-of-mordors-nemesis-system-couldve-been-way-more-1681120649)). Dan Abnett написал около шестидесяти характеров орков и с трудом прошёл тридцатый ([PC Gamer](https://www.pcgamer.com/dan-abnett-wrote-all-the-orc-dialogue-in-both-mordor-games-and-has-never-recovered/)).\n- **Как приняли.** Shadow of Mordor: 91 % из 33 835, Metacritic 84 на PC. Shadow of War: 88 % из 37 174, Metacritic 75 на PC.\n- **Взять:** враг, потопивший игрока, получает имя, повышение и говорит об этом; одна постоянная слабость; редкие возвращения; конец в его логове.\n- **Не переносится:** лицо во весь экран со шрамами, тысячи озвученных реплик, шестьдесят характеров.\n\n**Патент.** Warner Bros. держит патент США [10,926,179](https://patents.google.com/patent/US10926179B2/en): подан в 2016, выдан 23 февраля 2021, действует до 11 августа 2036. Первый пункт простыми словами: игрок взаимодействует с одним врагом, игра из-за этого меняет хранимые свойства второго врага и показывает игроку перемену. Зависимые пункты добавляют гибель игрока как повод, иерархию по рангам и месть между играми разных игроков. Есть два выданных продолжения (2023, 2025) и ещё одна заявка; все записи — только США. Заявку отклоняли и правили шесть раз ([Patent Arcade](https://www.patentarcade.com/2021/02/warner-brothers-granted-patent-for-nemesis-system-from-middle-earth-video-games.html)). Юрист Richard Hoeg называет патент очень широким и «eminently challengeable», но оспаривание стоит денег ([VGC](https://videogameschronicle.com/features/opinion/is-warners-nemesis-patent-really-gross-im-not-sure-id-go-that-far)). Сообщений о том, что Warner применяла патент против кого-то, мы не нашли. Monolith закрыта в 2025; патенты остались у Warner ([TechRadar](https://www.techradar.com/gaming/shadow-of-mordors-nemesis-system-will-remain-warner-bros-property-until-2036)). Это пересказ источников, а не совет юриста. Формы, что существовали до патента или не касаются его первого пункта, — постоянный список соперников, написанные злодеи, один личный враг — выглядят безопаснее.\n\n### Заклятые враги в других играх\nСистемы, родственные Mordor: что из них сработало и что нет.\n\n- **XCOM 2: War of the Chosen** (Firaxis, 2017; Metacritic 88, 80 % из 2 316). Трое написанных злодеев, сделанных после того, как команда увидела систему Mordor. Они приходят в обычные задания, отступают побитыми и возвращаются сильнее; убить их можно только в их цитадели. Между боями вредят, похищают бойца (его можно спасти) и копят знание, пока не смогут сбить базу игрока; дразнят, вспоминая прошлые встречи ([PC Gamer](https://www.pcgamer.com/xcom-2-war-of-the-chosen-revealed-at-the-pc-gaming-show/)). Взять: троих написанных вместо генератора, вторжение в обычный выход, похищение вместо убийства, логово как конец.\n- **Warframe, Kuva Liches** (Digital Extremes, 2019; кооп на четверых; 91 % из 304 372). Враг рождается выбором игрока: добил особого противника — получил лича со случайным именем и причудами. У игрока активен только один; в отряде личи приходят по очереди ([вики](https://wiki.warframe.com/w/Adversary_System)). Лич берёт долю добычи на своих узлах и возвращает её при поражении. В конце выбор: уничтожить и взять его оружие или сделать союзником. Не сработало: добивание превратилось в рутину, а неверная попытка убивала игрока, пока это не убрали в феврале 2020.\n- **Assassin's Creed Odyssey, наёмники** (Ubisoft Quebec, 2018; 89 % из 60 638). Преступления наполняют награду за голову до пяти уровней; за игроком идут именные наёмники, и в море тоже. Выходы: убить их, заплатить или убить заказчика. Их пятьдесят, запас пополняется; есть лестница, на которой стоит и игрок ([GamesRadar](https://www.gamesradar.com/assassins-creed-odysseys-wanted-system-is-enforced-by-mordor-style-mercenary-characters/)). Игрока они не помнят. [Vice](https://www.vice.com/en/article/assassins-creed-odyssey-mercenaries/): «They show up at the worst times». Это ближе всего к нашему розыску, и это же пример того, как именной охотник без памяти становится помехой.\n- **Path of Exile, Betrayal** (Grinding Gear Games, 2018; изометрия). Доска из семнадцати написанных членов синдиката с рангами; зелёные нити между друзьями, красные между соперниками. После боя игрок выбирает: допросить, казнить (вернётся рангом выше), сторговаться, предать или отпустить ([разбор](https://www.poe-vault.com/guides/immortal-syndicate-guide)). Не сработало: одна из самых сложных механик игры, и она стала таблицей наград.\n- **Need for Speed: Most Wanted** (EA Black Box, 2005; Metacritic 82). Постоянная лестница из пятнадцати именных гонщиков; вызов заслуживают победами, погонями и наградой за голову. Главный соперник в начале отбирает машину игрока и всю игру ездит на ней на первом месте ([Википедия](https://en.wikipedia.org/wiki/Need_for_Speed:_Most_Wanted_%282005_video_game%29)).\n- **Burnout Revenge и Burnout Paradise** (Criterion, 2005 и 2008). В Revenge машина, которая тебя разбила, получает красную метку, а её уничтожение считается местью. В Paradise игра объявляет, что в городе новый водитель; найдёшь и разобьёшь эту машину — она твоя ([обзор](https://bit-tech.net/reviews/gaming/xbox/burnout_paradise/2/)).\n- **Mercenaries: Playground of Destruction** (Pandemic, 2005). Колода из 52 именных целей четырёх мастей; тузов открывают разведкой; живой стоит вдвое ([Википедия](https://en.wikipedia.org/wiki/Mercenaries:_Playground_of_Destruction)).\n- **Armored Core VI** (FromSoftware, 2023; 93 % из 41 309). Пилоты-соперники возвращаются всю игру и известны по голосу в эфире, позывному, эмблеме и машине.\n\n### Space Rangers 2 («Космические рейнджеры 2»)\nElemental Games, Владивосток, 2004; на Steam — HD: A War Apart, 2013. Образец мира, который живёт без игрока, и рейнджеров ИИ — ровни игроку.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_fb79012ccd8dccecf6bbd251d5f09fd8658e552a.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_fb79012ccd8dccecf6bbd251d5f09fd8658e552a.600x338.jpg\" alt=\"карта галактики по секторам\">карта галактики по секторам<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_e5eb4d80d6f24ac9f8c3e1f323f060e9cee7cdc6.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_e5eb4d80d6f24ac9f8c3e1f323f060e9cee7cdc6.600x338.jpg\" alt=\"система: корабли идут по своим делам\">система: корабли идут по своим делам<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_bfef25f0186f84a1d6138deb985fb7c2f1cf8039.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_bfef25f0186f84a1d6138deb985fb7c2f1cf8039.600x338.jpg\" alt=\"ангар: оборудование корабля\">ангар: оборудование корабля<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_5cd1bf7ca5252f1356ffe0bd471c65cb45b9764b.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_5cd1bf7ca5252f1356ffe0bd471c65cb45b9764b.600x338.jpg\" alt=\"правительство планеты\">правительство планеты<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_5ae8bd8428bdabb40bd7a6778c5ffb778b46a920.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/214730/ss_5ae8bd8428bdabb40bd7a6778c5ffb778b46a920.600x338.jpg\" alt=\"текстовый квест\">текстовый квест<\/a>\n<\/div>\n\n- **Что симулируется.** Галактика из секторов и планет; у каждой планеты своя экономика, власть и мнение об игроке, цены ходят за спросом. Рейнджеры ИИ — постоянные корабли с теми же делами, что у игрока: торгуют, бьют доминаторов, пиратствуют, улучшают корабль ([Википедия](https://ru.wikipedia.org/wiki/Космические_рейнджеры_2:_Доминаторы)). Война идёт сама: системы захватывают и освобождают. На высокой сложности враг может забрать галактику; на низкой рейнджеры освободят её без игрока ([RPG Codex](https://rpgcodex.net/content.php?id=126)).\n- **Как это видит игрок.** Таблица, где игрок стоит в одном ряду с именными рейнджерами. В системе десятки кораблей идут по своим делам; корабль зовёт на помощь или предлагает напасть вместе. Новости на планетах: урожай — значит, еда подешевела. Карта показывает, какие системы у врага и где нужна помощь.\n- **Что игрок из-за этого делает.** Торгует на разнице цен, которая тает, пока её используют; возит запрещённое ценой отношения; отвечает на зов системы; идёт в военную операцию; нанимает рейнджеров ведомыми; оплачивает новую базу.\n- **Чего это стоило.** Около пятнадцати человек, полтора-два года. Программист Алексей Дубовой больше всего жалеет об ИИ: трёх месяцев на поведение кораблей не хватило. Издатель HD-версии: игра прежде всего тактическая, а не экономический симулятор, и делать экономику весомее смысла нет ([Хабр](https://habr.com/en/post/177819)).\n- **Как приняли.** Оригинал — 84 на Metacritic; HD — 87 % из 1 056 отзывов в Steam. Хвалили живую вселенную и смесь жанров, ругали интерфейс и отсутствие направления.\n- **Взять:** горстку именных лодок-ровней с делами игрока и таблицу, где игрок среди них; линию фронта, которую показывает карта и которая движется без игрока; новость, которая заодно подсказывает цену; лодку, которая зовёт на помощь прямо сейчас.\n- **Не переносится:** время по ходам — из-за него десятки агентов читаются ясно: игрок может остановиться и посмотреть.\n\n### Starsector\nFractal Softworks, три человека, в разработке с 2011, продаётся только с сайта автора. Вид сверху, флот игрока в секторе с колониями, конвоями и пиратами. Лучший пример экономики, которую пять раз переписывали в сторону простоты.\n\n- **Что симулируется.** Колония производит и просит товары в малых целых единицах, от одной до десяти. «Доступность» — один процент на колонию, в который сложены расстояние, порт, войны, пираты и блокада. Нехватка действует прямо: нет единицы еды — минус один к стабильности ([вики](https://starsector.wiki.gg/wiki/Colony)).\n- **Конвои.** Торговые конвои — настоящие флоты на карте. Пираты охотятся на них; уничтоженный конвой вешает на колонию временный «сбой поставок». База пиратов выбирает систему и давит на её колонии, пока базу не уничтожат; тогда штраф снимается сразу.\n- **Что подделано.** Товары не едут к спросу физически: производитель пяти единиц покрывает спрос нескольких рынков сразу. Конвой — картинка торговли и рычаг на неё, а не её носитель.\n- **Что игрок из-за этого делает.** По замыслу автора, в покое торговля не приносит ничего; прибыль даёт нарушение — нехватка, потопленный конвой, блокада. При голоде можно привезти еду, а можно перехватить чужие конвои с едой, продать её дороже и продлить голод. Каждое сообщение о сбое несёт новые цены. Это мы знаем по выдержкам из [блога автора](https://fractalsoftworks.com/2014/03/02/on-trade-design/): сайт не открывается автоматически.\n- **Что говорит автор.** Alexander Mosolov в [интервью 2020 года](https://www.indieretronews.com/2020/10/an-exclusive-interview-with-starsector.html): экономика была самым трудным местом проекта, её переписывали четыре-пять раз, каждый раз абстрактнее. Он начинал с симуляции в надежде на неожиданную игру и нашёл, что её плоды часто нежеланны, скрыты от игрока и стоят времени процессора. И ещё: долго было неясно, для чего экономика нужна, пока не появилась остальная игра.\n- **Взять:** одно число на гавань, на которое действует всякая беда, и оно видно на карте; рабочие лодки, чья гибель вешает на гавань названный штраф на время; базу налётчиков, что давит на гавань, пока её не уберут; прибыль от нарушений, а не от маршрутов.\n- **Не переносится:** свои колонии, флот, карта, которую читают на паузе.\n\n### Mount & Blade: Warband и Bannerlord\nTaleWorlds, 2010 и 2022. Песочница, которую чаще всех ставят в пример живого мира. Исследователь прочёл опубликованные скрипты Warband: экономика там намного меньше, чем кажется.\n\n- **Что там на самом деле.** Запасов товара в мире нет. У города и деревни одно число на товар — цена. Раз в трое игровых суток цена сдвигается на «потребление минус производство» со случайной долей и на 4 % возвращается к средней ([скрипты игры](https://github.com/int19h/mb_warband_module_system)).\n- **Караван.** Груза караван не везёт. Он помнит цены города, где торговал последним, и, придя, сдвигает цены нового города на несколько процентов к ним. Комментарий в коде говорит, что пробовали 10, 20 и 30 %, и торговля теряла смысл: цены переставали различаться. Караван — видимый курьер выравнивания цен, и его можно ограбить.\n- **Достаток.** Одно число на город, и оно идёт за ценами: чем дороже то, что едят жители, тем ниже цель. Прямые шаги: разграбленная деревня — минус 60, осада — до минус 4 в день, благополучный приход каравана — шанс на плюс 1. Штрафа за ограбленный караван нет: разрыв цен просто остаётся открытым.\n- **Лорды.** У каждого один из нескольких типов характера (воинственный, сварливый, честный, хитрый, добродушный и другие), число отношений с каждым, ссоры и переходы на другую сторону.\n- **Что видит игрок.** Всё важное — отряд на карте с подписью: караван, крестьяне по пути на рынок, разбойники, армия лорда. Видно, как гонят караван, как горит деревня.\n- **Bannerlord** перешёл к настоящим товарам на настоящих складах, и именно на этот слой жалуются: обвалы цен после патчей, караваны и мастерские, которые почти не платят.\n- **Как приняли.** Warband: 97 % из 55 123, Metacritic 78. Bannerlord: 87 % из 99 248, Metacritic 77.\n- **Взять:** весь приём Warband. Товара в мире нет; у гавани одно число на товар, которое тянется к среднему; рабочие лодки несут «цены прошлой гавани» и, придя, подтягивают к ним цены новой. Потопил лодку — разрыв остался. Одно число достатка на гавань. Несколько типов характера для именных капитанов и одно число отношений.\n- **Не переносится:** армии, осады, владения.\n\nArmagan Yavuz выбрал открытый мир вместо истории на десять-пятнадцать часов, чтобы у игрока было время освоить бой: песочница служит действию ([пересказ](http://www.gamebanshee.com/k46uy)).\n\n### Drox Operative и Drox Operative 2\nSoldak Entertainment, один разработчик, 2012 и 2021. Устроена ближе всех к мечте владельца: один корабль сверху, кооп, детали, расы-«классы» и мир, который играет сам с собой. И осталась игрой для нескольких сотен человек.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1305310/ss_1f31741323e794ab01cb9e5692d3452d4c9f93f6.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1305310/ss_1f31741323e794ab01cb9e5692d3452d4c9f93f6.600x338.jpg\" alt=\"строка событий: шпионаж одной расы против другой провален\">строка событий: шпионаж одной расы против другой провален<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1305310/ss_5c2f47c31c50768c88559bd007ff820b5358ba12.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1305310/ss_5c2f47c31c50768c88559bd007ff820b5358ba12.600x338.jpg\" alt=\"сектор со своим модификатором\">сектор со своим модификатором<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1305310/ss_e5269a2a6a5c3355c0e03bbde2a2d0859a39ebc8.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1305310/ss_e5269a2a6a5c3355c0e03bbde2a2d0859a39ebc8.600x338.jpg\" alt=\"планеты рас\">планеты рас<\/a>\n<\/div>\n\n- **Что симулируется.** Вокруг игрока расы ИИ играют в стратегию: разведывают, заселяют планеты, строят флоты, заключают союзы и воюют. На планетах случаются беды — мятежи, эпидемии, рои; нерешённая беда растёт и ведёт к следующей. Кто-то возьмёт верх в секторе в любом случае; игрок побеждает, оказавшись в союзе с победителем ([интервью](https://classic.rpgfan.com/features/Steven_Peeler_Interview/)).\n- **Как это видит игрок.** Задания рождаются из состояния мира и проваливаются, когда мир ушёл дальше: планету, куда вёз груз, уничтожили. Поток дипломатических сообщений и требований. Большие бои нескольких рас, в которые можно влететь.\n- **Что хвалили.** Срочность и выбор, какое задание взять; большие бои; саму идею ([SpaceSector](https://www.spacesector.com/blog/2013/01/drox-operative-review/), 7 из 10).\n- **Что ругали, и одинаково.** Заданий слишком много, дипломатия дёргает без конца, игрок — посыльный. Задания гибнут по дороге без предупреждения; долгие рейсы пропадают зря; сведения неясны ([IndieRPGs](https://indierpgs.com/?p=3717), 3 из 5). Во второй игре на экране много быстрой информации, и она подавляет.\n- **Как приняли.** Обе — 88 % в Steam, но из 276 и 275 отзывов за тринадцать и пять лет.\n- **Что говорит автор.** Steven Peeler хочет мир, который отвечает игроку и не ждёт его. В каждой новой игре ему приходилось делать причину и следствие яснее ([Game Developer](https://gamedeveloper.com/design/q-a-soldak-s-lessons-learned-in-13-years-of-making-rpgs)). В первой Drox он бы поменял движение: вышло медленно, и вторая сделала полёт быстрее.\n- **Взять:** саму рамку — игрок как наёмная лодка среди сторон, которые действуют; задание, рождённое из сегодняшней беды мира; беду, которая, оставленная, растёт в следующую по короткой написанной цепочке.\n- **Чего избегать:** многих таймеров сразу; провала без отсчёта; потока сообщений. Отзывы говорят одно: симуляция получилась, а читаемость — нет.\n\n### Живые миры, коротко\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/335620/ss_3c892dce8a31b83d55e1767e7373ba532cbed201.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/335620/ss_3c892dce8a31b83d55e1767e7373ba532cbed201.600x338.jpg\" alt=\"контакты: услуги, влияние, черты\">контакты: услуги, влияние, черты<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/335620/ss_588d98af6a15b168f53615d5f40a0f0b9a375890.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/335620/ss_588d98af6a15b168f53615d5f40a0f0b9a375890.600x338.jpg\" alt=\"рынок\">рынок<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/335620/ss_ea2c2be63e653465970570b78c29fba3e6f01fed.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/335620/ss_ea2c2be63e653465970570b78c29fba3e6f01fed.600x338.jpg\" alt=\"карта квадранта\">карта квадранта<\/a>\n<\/div>\n\n- **S.T.A.L.K.E.R.** (GSC Game World, 2007; 94 % из 15 124). У каждого персонажа два уровня подробности: «онлайн» в радиусе около 150 м от игрока, с анимацией и настоящим путём, и «офлайн» дальше — упрощённая копия, чьи бои решает формула со случайной долей. То, что случилось за кадром, приходит игроку новостью. «Умные места» берут пришедшего персонажа и дают ему дело: сесть у костра, стоять на посту. КПК ставит игрока в таблицу среди сталкеров ([интервью с программистом ИИ](https://www.gamedeveloper.com/game-platforms/interview-inside-the-ai-of-i-s-t-a-l-k-e-r-i-)). Обещали больше: нужды каждого персонажа и сталкеров, которые пройдут сюжет раньше игрока; это вырезали сами авторы. Stalker 2 вышел в 2024 с обещанной симуляцией, которая не работала, и игроки это заметили сразу.\n- **Star Traders: Frontiers** (Trese Brothers, два человека, 2018; 83 % из 3 272). Состояние мира — небольшая колода названных условий со сроком, у каждого одно правило: блокада у планеты, плотные патрули в квадранте, торговая война двух сторон. Значки слухов стоят на карте. Контакты — постоянные именные люди, которые растут в чине и получают новые услуги, пока игрок с ними работает ([RPGFan](https://www.rpgfan.com/review/star-traders-frontiers/)). Потока товаров между мирами нет.\n- **Freelancer** (2003; Metacritic 85). Цены постоянны, земли сторон не меняются. Живым мир делает движение: купцы идут торговыми путями, пираты на них нападают, патрули ходят у столиц. Отношение сторон меняется от того, в кого стреляешь, и задевает их союзников и врагов. В 1999 обещали галактику, живущую отдельно от игроков; это вырезали, и игра всё равно получила 85. Жалоба одна: когда маршруты выучены, мир повторяется ([Википедия](https://en.wikipedia.org/wiki/Freelancer_%28video_game%29)).\n- **Endless Sky** (открытый код, 2015; 93 % из 6 469). Вся экономика — около тридцати строк: постоянная базовая цена товара в системе и одно число «запаса», которое каждый день частью уходит к соседям и получает случайный толчок ([код](https://github.com/endless-sky/endless-sky)). Корабли в системе — таблица появления. Карту меняют написанные события: у системы другая власть, другие корабли, другие новости.\n- **Port Royale 4** (2020; 56 % из 1 417) и **X4: Foundations** (2018; 78 % из 14 117). Настоящие склады, производство и перевозки. На них же и жалобы: автоконвои с непроданным грузом, перепроизводство до цен ниже себестоимости; у X4 — крутая кривая и «a broken in-game economy» в одной из рецензий ([Metacritic](https://www.metacritic.com/game/x4-foundations/critic-reviews/?platform=pc)).\n- **Helldivers 2** (Arrowhead, 2024). «Симуляция» — люди с инструментами: сотрудники смотрят игру и отвечают, как ведущий настольной игры, а враги отвечают на сделанное сообществом, меняя карту галактики ([PC Gamer](https://www.pcgamer.com/helldivers-2-kept-its-most-exciting-feature-secret-until-launch-human-dungeon-masters-responding-in-real-time-and-messing-with-players/)). Игрок видит общие приказы со сроком и процент освобождения планеты.\n- **RimWorld** (Ludeon, 2018; 97 % из 120 631). Вместо симуляции — рассказчик: он смотрит на богатство колонии, недавние потери и время с прошлого события и выбирает следующую беду и передышку ([вики](https://rimworldwiki.com/wiki/AI_Storytellers)).\n\n### Hades и Hades II\nSupergiant Games, около двадцати человек, 2020 и 2025. Изометрия, один герой, бой в подземелье и дом между попытками. Лучший пример сюжета в игре, которую проходят десятки раз: за сценарий — Nebula, Hugo и BAFTA ([Википедия](https://en.wikipedia.org/wiki/Hades_%28video_game%29)).\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1145360/ss_8a9f0953e8a014bd3df2789c2835cb787cd3764d.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1145360/ss_8a9f0953e8a014bd3df2789c2835cb787cd3764d.600x338.jpg\" alt=\"разговор с отцом после побега\">разговор с отцом после побега<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1145360/ss_2a9e3f9ad4d29d900b890d56361be5b1634225a0.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1145360/ss_2a9e3f9ad4d29d900b890d56361be5b1634225a0.600x338.jpg\" alt=\"дар Афины\">дар Афины<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1145360/ss_68300459a8c3daacb2ec687adcdbf4442fcc4f47.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1145360/ss_68300459a8c3daacb2ec687adcdbf4442fcc4f47.600x338.jpg\" alt=\"бой\">бой<\/a>\n<\/div>\n\n- **Зачем так.** В их прошлой игре, Pyre, были настоящие ветки, но её проходили один раз, и ветвей никто не видел. Игру, которую повторяют десятки раз, один и тот же текст окупает многократно ([RPS](https://www.rockpapershotgun.com/2020/02/12/how-hades-plays-with-greek-myths/)).\n- **Где игрок встречает историю.** Между попытками — дома: у каждого персонажа может найтись новое, отношения растут. Во время попытки — когда бог даёт дар, перед боссом, в комнатах с дружественными тенями. Каждый кусок — несколько реплик рядом с портретом.\n- **Как выбираются реплики.** Игра смотрит, что происходит, и сверяет это с большим списком написанных событий. Одни — разовые отклики: встретил Зевса почти мёртвым — он говорит о твоём состоянии; босс замечает купленный предмет. Другие — звенья линий. Сценарист направляет выбор весом важности; порядок у каждого игрока свой ([Game Developer](https://www.gamedeveloper.com/design/how-supergiant-weaves-narrative-rewards-into-i-hades-i-cycle-of-perpetual-death)).\n- **Цепочки между походом и домом.** Встретил Эвридику в походе — дома Орфей говорит об этом и просит передать весточку; следующая встреча с Эвридикой играет следующее звено.\n- **Поражение двигает историю.** Greg Kasavin: целью было «to take the pain out of dying and having to restart». Гибель возвращает домой, где ждут новые разговоры, подарки и насмешливый отец, так что проигранная попытка всё равно платит. Комический тон выбран потому, что провал в такой игре — комедия положений. Режим бога делает героя крепче после каждой гибели, чтобы слабый игрок увидел всю историю.\n- **Персонажи важнее сюжета.** Боги — одна большая ссорящаяся семья; сила каждого бога — его характер, поэтому его читаешь сразу. [Polygon](https://www.polygon.com/hades-2-story-misses-one-thing-hades-got-extremely-right/): у персонажей своя жизнь, и герой — только её часть.\n- **Объём.** Около десяти часов диалогов, полностью озвученный состав, тысячи событий.\n- **Hades II: та же подача, история слабее.** Финал сочли пустым, и через месяц студия добавила сцены. Polygon объясняет: злодей прост, все союзники с первого часа хотят одного и служат герою, и никто не меняется. Подача не спасла сюжет без конфликта среди своих.\n- **Кооп.** Нет и не планируется: игра и история сделаны для одного ([FAQ студии](https://www.supergiantgames.com/blog/hades2-faq)). В игре на нескольких игроков этот способ ещё не выходил.\n- **Как приняли.** Hades: 98 % из 143 387, Metacritic 93. Hades II: 96 % из 66 389, Metacritic 94.\n- **Взять:** разговоры в гавани, которые отвечают на последний выход в море; цепочки «море — гавань — море»; вес у каждой сцены; поражение, после которого дома есть новый разговор. Наша система сцен уже устроена так: условия на сохранённые факты и приоритет ([Сцены сюжета](../story/scenes.md)).\n- **Не переносится:** полная озвучка (лепет делает это намного дешевле); цикл «попытка — гибель» как рамка; один герой в центре.\n\n### Sunless Sea\nFailbetter Games, 2015. Корабль сверху на тёмном море, а в портах — текст. Самый близкий к нам пример «лодка плюс написанная история» и пример того, чего стоит медленный ход.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/304650/ss_6b46ee1e4dca7a927fcdb2729e0aae7fd1e7e928.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/304650/ss_6b46ee1e4dca7a927fcdb2729e0aae7fd1e7e928.600x338.jpg\" alt=\"порт: Fallen London\">порт: Fallen London<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/304650/ss_ae2b617e2ca6d55caeb38e833f1f15000d57e5d7.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/304650/ss_ae2b617e2ca6d55caeb38e833f1f15000d57e5d7.600x338.jpg\" alt=\"море, офицеры в углу\">море, офицеры в углу<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/304650/ss_8969a7855d1d5c73d01e9798f702cfe4ee7902fc.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/304650/ss_8969a7855d1d5c73d01e9798f702cfe4ee7902fc.600x338.jpg\" alt=\"бой у города\">бой у города<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/304650/ss_49b62919e157bd10fcaeb87080b7e30f6a94612c.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/304650/ss_49b62919e157bd10fcaeb87080b7e30f6a94612c.600x338.jpg\" alt=\"The Dawn Machine\">The Dawn Machine<\/a>\n<\/div>\n\n- **Сторилеты.** Кусок текста, условия, при которых он может сыграть, и его следствия для мира. Emily Short называет их простыми, атомарными, прочными и складываемыми: из них собираются обычные формы ветвления, и их можно добавлять после выхода ([статья](https://emshort.blog/2019/11/29/storylets-you-want-them/)). Условия — числа («качества»): товары, умения, шаг истории.\n- **В игре.** У каждого острова свои истории. Чтобы продвинуть историю, нужен предмет или проверка одного из пяти умений; выборы — карточки ([Википедия](https://en.wikipedia.org/wiki/Sunless_Sea)).\n- **Текст и плавание чередуются.** Выходишь с ограниченным топливом и припасами, швартуешься, читаешь и выбираешь, везёшь новости домой. Каждый порт даёт отчёт, за который в Лондоне платит Адмиралтейство: прочесть порт — это и есть торговля. [Eurogamer](https://www.eurogamer.net/articles/2015-02-06-sunless-sea-review) описывает круг так: выход, открытие, страх, пока тают припасы, облегчение дома.\n- **Офицеры.** У команды свои надежды; капитан может им помочь и в конце отпустить.\n- **Смерть.** Навсегда; наследник получает часть имущества по завещанию.\n- **Темп.** Википедия называет ход корабля очень медленным. Критики разошлись именно на этом: Eurogamer поставил 10 из 10, GameSpot — 6 из 10. Шесть сценаристов на двух программистов и одного художника.\n- **Как приняли.** 83 % из 5 691, Metacritic 81; лучшее письмо 2014 года по версии Rock Paper Shotgun.\n- **Взять:** отчёт порта — короткий текст за посещение места, который стоит денег дома; истории персонажей, которые продвигаются в местах на карте; условия как простые сохранённые числа.\n- **Не переносится:** долгое чтение у стоящей лодки; медленный ход как источник напряжения — тот самый, который владелец снял вместе с симулятором.\n\n### Как игра выбирает реплику\n- **Left 4 Dead** (Valve). Elan Ruskin на GDC 2012: система держит сотни фактов о мире и сверяет их с тысячами возможных реплик; персонажи помнят, что было, и отступают от частного случая к общему; сценаристы добавляют частные случаи и сквозные шутки без программиста ([GDC Vault](https://www.gdcvault.com/play/1015528/AI-driven-Dynamic-Dialog-through)). Emily Short называет этот род выбором по уместности: лучшую реплику из большого запаса выбирает система, а не игрок; начинают с общих реплик и добавляют частные со временем ([статья](https://emshort.blog/2016/04/12/beyond-branching-quality-based-and-salience-based-narrative-structures/)).\n- **Bastion** (Supergiant, семь человек, 2011). Рассказчик говорит короткими фразами с долгими паузами, чтобы бой не замедлялся, и мешает сюжет с замечаниями об оружии игрока и ходе боя. Больше 3 000 реплик, записанных в шкафу композитора; самое хвалимое в игре ([Википедия](https://en.wikipedia.org/wiki/Bastion_%28video_game%29)).\n- **Нам.** Наша система сцен уже из этого рода. Образцы добавляют четыре правила: побеждает самая частная подходящая реплика; реплика записывает память обратно; у каждого повода есть общая реплика на случай, когда частных нет; недавно виденное выпадает реже.\n\n### Сюжет, коротко\nИгры, где история любима, а средства — как у нас: портрет, текст, радио.\n\n- **Dredge** (Black Salt Games, 2023; 96 % из 33 172). Лодка, рыбалка и тайна. История идёт в разговорах у причала: нарисованный портрет, текст, вместо речи короткий звук. Правила команды: не больше четырёх-пяти окон текста подряд, и каждый текст делает одно из трёх — говорит, что делать, двигает историю или пугает ([Game Developer](https://www.gamedeveloper.com/design/dredge-wasn-t-originally-going-to-be-a-narrative-game-but-then-it-became-one-of-2023-s-best)). Предысторию несут бутылки с записками, найденные в море; концовок две, и вторая открыта находкой, а не выбором реплики. Один сценарист, он же программист. Номинации за сюжет от BAFTA и Nebula. Команда сначала считала, что сюжетную игру ей не сделать, и добавила историю, когда тестерам понравился мир.\n- **GTA: Chinatown Wars** (Rockstar Leeds, 2009). Вся история рассказана сверху: неподвижные картинки с текстом вместо роликов, без голоса ([Eurogamer](https://www.eurogamer.net/grand-theft-auto-chinatown-wars-review)). Лица персонажей собраны так, чтобы одному лицу можно было дать новое выражение, а не рисовать картинку на сцену. Задания приходят письмами. Двигатель сюжета комический: герой работает на всех сразу, и никто этого не замечает.\n- **Borderlands 2** (Gearbox, 2012). Злодей — голос по радио: в начале взрывает поезд игроков и дразнит их всю игру. Реплика срабатывает, когда игрок дошёл до точки, и слышна всем, где бы они ни были; игра не останавливается. Первая версия злодея шутила без конца, и коллеги назвали её одной нотой на сорок часов; исправили одним событием — после гибели дочери шуток больше нет ([блог студии](http://web.archive.org/web/20160506223932/http://www.gearboxsoftware.com:80/2013/09/inside-the-box-writing-handsome-jack/)).\n- **Deep Rock Galactic** (Ghost Ship, 2020). Сюжета нет и не будет: по словам руководителя, истории — то, что случилось с командой на задании ([интервью](https://www.avclub.com/the-future-and-past-of-deep-rock-galactic)). Мир держат реплики гномов о том, что они видят и делают, голос диспетчера по радио и одна кнопка приветствия, добавленная как ответ на кнопку «позвать»: командам нужен был отклик ([пост студии](https://devtrackers.gg/deep-rock-galactic/p/43cb6d0d-a-song-of-rock-and-stone)). Имя «Карл» гномы поминают постоянно, и кто это, игра не объясняет.\n- **Spiritfarer** (Thunder Lotus, 2020; 94 % из 19 012). Пассажиры живут на корабле, у каждого линия, которая кончается прощанием; ушедший оставляет пустое место и то, что он добавил к игре. Около 90 000 слов на трёх авторов.\n- **Wildermyth** (Worldwalker, 2021; 95 % из 11 739). Сцены-комиксы без анимации и голоса. Сцена набирает роли из героев, что есть сейчас: «самый смелый», «тот, кто был ранен»; сцена без состава не идёт ([вики](https://wildermyth.com/wiki/Story_Inputs_and_Outputs)). Сюжет-хребет написан, сцены между его ударами тянутся из колоды. В коопе выбор делает первый, кто щёлкнул; голосование обещали и не выпустили.\n- **Subnautica** (Unknown Worlds, 2018). История приходит по радио: вызов из двух-четырёх фраз называет место. Вызов срабатывает после нужного шага игрока или по времени, что наступит раньше ([вики](https://subnautica.fandom.com/wiki/Radio)): застрявшего выручают часы, быстрого — прогресс.\n- **Cat Quest III** (The Gentlebros, 2024). Ближайший образец по форме: высокая камера, маленькие герои, текст, корабль в открытом море, кооп. Очень короткие задания, каждое — шутка или маленький поворот; длинные истории нарезаны цепочкой коротких. Рядом с главной линией — доска разыскиваемых: необязательные именные боссы.\n- **FTL** (Subset Games, 2012). Событие — две фразы, выбор в одну строку. Синим цветом напечатан вариант, который есть только с нужным экипажем или оборудованием ([вики](https://ftl.fandom.com/wiki/Blue_Options)): игрок видит, что игра заметила его корабль. Текст писали в обычном редакторе и вставляли как есть.\n\n### Deep Rock Galactic\nGhost Ship Games, 2020. Кооп на четверых в пещерах, четыре класса. Лучший пример классов, которые нужны друг другу: 97 % из 171 703 отзывов и восемь миллионов копий к январю 2024 ([Википедия](https://en.wikipedia.org/wiki/Deep_Rock_Galactic)).\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/548430/cf8c347fac940f99a9a256730aca3cb647cb563f/ss_cf8c347fac940f99a9a256730aca3cb647cb563f.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/548430/cf8c347fac940f99a9a256730aca3cb647cb563f/ss_cf8c347fac940f99a9a256730aca3cb647cb563f.600x338.jpg\" alt=\"четверо в бою\">четверо в бою<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/548430/03ac295f55defe10866d07a6f81329751c5abfb7/ss_03ac295f55defe10866d07a6f81329751c5abfb7.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/548430/03ac295f55defe10866d07a6f81329751c5abfb7/ss_03ac295f55defe10866d07a6f81329751c5abfb7.600x338.jpg\" alt=\"выбор задания\">выбор задания<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/548430/5be477305106e6849cd4dab968fa38f87f5cb46c/ss_5be477305106e6849cd4dab968fa38f87f5cb46c.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/548430/5be477305106e6849cd4dab968fa38f87f5cb46c/ss_5be477305106e6849cd4dab968fa38f87f5cb46c.600x338.jpg\" alt=\"оружие на верстаке\">оружие на верстаке<\/a>\n<\/div>\n\n- **Классы.** Перед заданием каждый выбирает разведчика, инженера, пулемётчика или бурильщика. У каждого своё оружие и свои инструменты, и каждый по-своему и дерётся, и проходит пещеру. Пример из Википедии: инженер стреляет платформой под жилу высоко на стене, разведчик цепляется к ней крюком и добывает её.\n- **В одиночку.** С игроком летает робот Bosco: помогает в бою и по команде добывает то, до чего не дотянуться.\n- **Улучшения.** Оружие, улучшения снаряжения и внешность — за кредиты и минералы с заданий; перки — за испытания, например бежать быстрее.\n- **Ветеран и новичок.** Образцом были Left 4 Dead и Minecraft. Бедой Left 4 Dead авторы сочли то, что новичку трудно играть с ветеранами, и хотели игру, где в команде все на равных при любом опыте. Игра никогда не говорит игроку, что кто-то лучше него ([PC Gamer](https://www.pcgamer.com/meet-one-of-the-last-positive-communities-left-in-gaming/)).\n- **Задание.** Необязательные вторые цели дают кредиты и опыт; Game Informer хвалит, что они ставят риск против награды. Отход к капсуле обратно через пещеру PC Gamer называет самым напряжённым местом задания.\n- **Как приняли.** Rock Paper Shotgun: каждый класс и жизнеспособен, и приятен. IGN хвалил разные умения гномов и ругал разрывы связи примерно в каждом пятом задании.\n- **Взять:** классы, которые различаются тем, как проходят путь, а не только уроном; умение одного, которое раскрывает умение другого (платформа и крюк); помощника для одиночки; вторые цели с риском; отход как последний бой.\n- **Не переносится:** разрушаемые пещеры и вид от первого лица.\n\n### Helldivers и Helldivers 2\nArrowhead Game Studios, 2015 и 2024. Первая — кооп сверху, по сети и на одном экране; вторая — от третьего лица, до четырёх игроков. Классов нет: роль даёт снаряжение, выбранное перед высадкой.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/394510/ss_487d792377661b10a8ed2a5765cfcfc6893f7dbb.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/394510/ss_487d792377661b10a8ed2a5765cfcfc6893f7dbb.600x338.jpg\" alt=\"Helldivers: четверо на одном экране\">Helldivers: четверо на одном экране<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/394510/ss_f6075b6b574caaaed53905ed75160100486f307d.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/394510/ss_f6075b6b574caaaed53905ed75160100486f307d.600x338.jpg\" alt=\"Helldivers: снаряжение перед высадкой\">Helldivers: снаряжение перед высадкой<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/394510/ss_5c23061c02f10d4a4ac580aa5e2e7d1177e4c00c.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/394510/ss_5c23061c02f10d4a4ac580aa5e2e7d1177e4c00c.600x338.jpg\" alt=\"Helldivers: общая война, оборона Супер-Земли\">Helldivers: общая война, оборона Супер-Земли<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/553850/ss_3d075daf49e21731cd768ee2ea3adf63857f798c.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/553850/ss_3d075daf49e21731cd768ee2ea3adf63857f798c.600x338.jpg\" alt=\"Helldivers 2: отряд\">Helldivers 2: отряд<\/a>\n<\/div>\n\n- **Снаряжение вместо классов.** Перед заданием игрок выбирает оружие и стратагемы — вызовы с корабля: удар с воздуха, турель, тяжёлое оружие, поддержка. Вызов набирают последовательностью стрелок посреди боя. Во второй игре берут до четырёх стратагем и одно усиление на весь отряд ([Википедия](https://en.wikipedia.org/wiki/Helldivers_2)).\n- **Огонь по своим всегда включён.** Бьют и оружие, и удары с воздуха, и турели; ящик снабжения может раздавить товарища. Игроки улучшают турели, чтобы те не целились в своих, и берут оружие, которое стреляет поверх ([Википедия](https://en.wikipedia.org/wiki/Helldivers)).\n- **Зачем вместе.** Товарищ поднимает упавшего, делится лечением и патронами; у тяжёлого оружия есть рюкзак, из которого второй помогает перезаряжать. Случайные игроки могут войти в идущее задание.\n- **Враг бесконечен.** За убийства наград нет. Заметивший игрока враг поднимает тревогу, и подкрепления идут, пока тревогу не снимут; часто выгоднее обойти, чем драться. Отход — девяносто секунд боя у площадки.\n- **Общая война.** Задания всех игроков складываются в ход войны за галактику (раздел о живом мире выше).\n- **Как приняли.** Helldivers: 91 % из 10 301, Metacritic 83. Helldivers 2: 78 % из 646 150.\n- **Взять:** роль из снаряжения, выбранного перед выходом, и одно усиление на всю группу; тяжёлое оружие, которому нужен второй; тревогу поста, которую можно не поднять, и подкрепления, пока она горит; отход как последний бой.\n- **Не переносится:** огонь по своим на четырёх лодках в аркаде — вопрос вкуса; его можно пробовать, но не брать по образцу.\n\n### Sea of Thieves\nRare, 2018. Кооп на корабле без классов и без улучшений силы: всё, что другие игры делают прогрессией, здесь сделано общим делом.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1172620/ss_1d1989435afbc1ff8d8ec4d61283e41a30208337.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1172620/ss_1d1989435afbc1ff8d8ec4d61283e41a30208337.600x338.jpg\" alt=\"команда у пушек\">команда у пушек<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1172620/ss_d431abb7120aa4a6cbc0be82e5a2cdcca62917b2.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1172620/ss_d431abb7120aa4a6cbc0be82e5a2cdcca62917b2.600x338.jpg\" alt=\"событие мира: череп в небе\">событие мира: череп в небе<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1172620/ss_ec623c77d75dfa098c622b547b1ab21ad4cae0a8.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1172620/ss_ec623c77d75dfa098c622b547b1ab21ad4cae0a8.600x338.jpg\" alt=\"корабли под флагами компаний\">корабли под флагами компаний<\/a>\n<\/div>\n\n- **Роли без классов.** У всех пиратов одни инструменты. Роли — места на корабле: штурвал, паруса и якорь, пушки, починка и вычерпывание, карта и мачта. Мест больше, чем рук, они далеко друг от друга, и в бою нужны все разом, поэтому команда делит работу заново каждую минуту ([Eurogamer](https://www.eurogamer.net/sea-of-thieves-review)).\n- **Добыча.** Сундук несут в руках, он ничей, пока не продан; продажа платит всей команде поровну. Design director Mike Chapman: общая награда была принципом с самого начала, и сундук несут именно затем, чтобы команда берегла носильщика, а не спорила с ним ([интервью](https://www.windowscentral.com/the-sea-of-thieves-vision-interview)).\n- **Потеря.** При потоплении пропадает только непроданное на борту; золото, покупки и репутация остаются.\n- **Улучшения.** Силы нет: прогресс открывает только внешность. Chapman объясняет: «we want to remove barriers that stop players playing together». Игры, что делят игроков по силе, заставляют друзей играть в одном темпе; здесь ветеран с сотней часов и новичок идут в одной команде в первый же вечер.\n- **Сюжет.** На старте его не было намеренно. В 2019 пришли Tall Tales: написанные задания внутри общего моря. Их начинают голосованием у книги рядом с персонажем; книга лежит у каждого в руках, и любой может открыть её и перечитать подсказку. Позже сюжетные сцены вынесли в закрытые зоны, а потом дали и закрытые серверы: каждый шаг убирал способ, которым общий мир ломал написанную историю.\n- **Оживление.** Пятнадцать секунд, чтобы дойти до упавшего; оживление длится около четырёх, и оживляющий в это время беззащитен.\n- **Как приняли.** 88 % из 148 037, Metacritic 69. На старте хвалили бой, кооп и воду и ругали прогрессию и нехватку содержания; игру подняли обновления.\n- **Взять:** продажу, которая платит всем лодкам группы; потерю только непроданного; ранг, открывающий более трудные и богатые дела, куда ветеран может взять кого угодно; трофеи, видимые на лодке; книгу задания, общую для всех; голосование как начало сюжетного дела.\n- **Не переносится:** прогрессия одной внешностью требует живой публики и потока вещей. Истории «сами собой» рождаются от встреч с чужими командами и от многих рук на одном корабле; четверо на четырёх лодках этого даром не получают.\n\n### Кооп на лодках и машинах, коротко\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1286580/ss_f1fd6422f8e242591fd155fa599f2062fe7fa155.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1286580/ss_f1fd6422f8e242591fd155fa599f2062fe7fa155.600x338.jpg\" alt=\"Ship of Fools: двое на одной лодке\">Ship of Fools: двое на одной лодке<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1286580/ss_142ba65198b8807c3fdfa0f3ca035da836cfdcde.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1286580/ss_142ba65198b8807c3fdfa0f3ca035da836cfdcde.600x338.jpg\" alt=\"Ship of Fools: карта, шторм наступает\">Ship of Fools: карта, шторм наступает<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/99300/ss_49a9a3da0baef8ab6d743e0d02ac1b84b1ef7e60.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/99300/ss_49a9a3da0baef8ab6d743e0d02ac1b84b1ef7e60.600x338.jpg\" alt=\"Renegade Ops: двое на разделённом экране\">Renegade Ops: двое на разделённом экране<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/99300/ss_84da40df62e26d7e7a5790dffff74bb287805fa8.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/99300/ss_84da40df62e26d7e7a5790dffff74bb287805fa8.600x338.jpg\" alt=\"Renegade Ops: машина сверху\">Renegade Ops: машина сверху<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/602960/ss_cdf5cbde141fb93a0b23c6adca5378f73e1beeca.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/602960/ss_cdf5cbde141fb93a0b23c6adca5378f73e1beeca.600x338.jpg\" alt=\"Barotrauma: подлодка в разрезе\">Barotrauma: подлодка в разрезе<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/602960/ss_99e0455cbbf263fe6a900f11890519b3f340ffa3.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/602960/ss_99e0455cbbf263fe6a900f11890519b3f340ffa3.600x338.jpg\" alt=\"Barotrauma: карта кампании\">Barotrauma: карта кампании<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/799600/09a81962fe37ec21a377a113cb28459cd0ac8d11/ss_09a81962fe37ec21a377a113cb28459cd0ac8d11.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/799600/09a81962fe37ec21a377a113cb28459cd0ac8d11/ss_09a81962fe37ec21a377a113cb28459cd0ac8d11.600x338.jpg\" alt=\"Cosmoteer: корабль из отсеков\">Cosmoteer: корабль из отсеков<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/799600/ss_769330b214586e3cf13525b24fe0dd929429d119.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/799600/ss_769330b214586e3cf13525b24fe0dd929429d119.600x338.jpg\" alt=\"Cosmoteer: карта с фракциями\">Cosmoteer: карта с фракциями<\/a>\n<\/div>\n\n- **Renegade Ops** (Avalanche, 2011; 85 % из 1 019). Машины сверху, до четырёх игроков. Четыре персонажа — это машина и одно умение с перезарядкой; всё остальное общее. У умения встроенная слабость: щит не даёт стрелять, тяжёлое орудие не даёт ехать. Рецензенты сами называют связки: один глушит оружие группы, второй ставит орудие; один идёт под щитом и собирает огонь, второй вызывает удар с воздуха ([обзор](https://web.archive.org/web/2012/https://xblafans.com/renegade-ops-review-xbla-26493.html)). Но [Game Informer](https://gameinformer.com/games/renegade_ops/b/ps3/archive/2011/09/20/team-avalanche-embraces-the-heights-of-destruction.aspx) замечает, что персонажи «not especially distinct»: одного умения мало, чтобы машина ощущалась другой. Прогресс у каждого игрока свой. Автор о вождении: машину скорее наводишь, чем ведёшь ([Game Developer](https://www.gamedeveloper.com/design/q-a-avalanche-studios-talks-up-i-renegade-ops-i-16-bit-style)).\n- **Ship of Fools** (Fika, 2022; 87 % из 2 280). Двое на одной лодке: зарядить пушку, перенести её на другой борт, выстрелить, отбить веслом, починить. У лодки одна полоска здоровья на двоих. Персонажи — не классы: у каждого одна пассивная черта, которая клонит его к одному из дел. В одиночку напарника заменяет самострельная пушка.\n- **Barotrauma** (FakeFish и Undertow, 2023; 95 % из 29 025). До шестнадцати на одной подлодке, шесть профессий. Любой может взяться за любое дело, но неумелый чинит впятеро дольше и может покалечиться: умение — это скорость и риск, а не замок ([вики](https://barotraumagame.com/baro-wiki/index.php?title=Skills)). Деньги — общий банк и личные кошельки, с долей по умолчанию для тех, кто вошёл позже. Прогресс хранит сохранение хоста.\n- **Cosmoteer** (Walternate Realities, 2022; 94 % из 7 689). Корабль строят из отсеков; карьера в коопе до четырёх, в мире хоста. Самая частая жалоба: нельзя прыгнуть в другую систему, пока не готовы напарники; автор обещает это снять ([новости игры](https://steamcommunity.com/app/799600/allnews/)). В первые дни главной бедой коопа было отсутствие возрождения: потопленный игрок загружал сохранение.\n- **Valheim** (Iron Gate; 94 % из 268 208). Персонаж с вещами ходит между мирами, а мир хоста хранит то, что сделано с миром. Так друзья заходят друг к другу, не теряя вечера работы.\n\n### Классы и сборки, коротко\nКак игры с техникой делают «классы»: готовым классом, набором снаряжения или сборкой из деталей.\n\n- **Starsector.** У корпуса один бюджет очков на всё, что на него ставят; оставшиеся очки всегда можно вложить в простое и полезное, так что пустых очков нет ([экран сборки](https://starsector.wiki.gg/wiki/Refit_Screen)). Особые модификации меняют правила с громкой ценой: одна делает корабль быстрее и горячее, но укорачивает дальность ([Hullmod](https://starsector.wiki.gg/wiki/Hullmod)). Неподвижные носовые установки против башен: сектор установки, а не числа оружия, решает, надо ли целить носом. Сохранённые сборки и кнопка «собрать за меня» дают новичку рабочий корабль сразу.\n- **Armored Core VI** (FromSoftware, 2023; 93 % из 41 309). Детали продаются по цене покупки: неверная покупка ничего не стоит, и игроки пробуют сборки ([интервью](https://ungeek.ph/2023/07/armored-core-vi-no-penalties-for-buying-and-selling-parts-says-fromsoftware)). После гибели сборку меняют из уже купленного и пробуют снова, без пути назад. Одна деталь — ноги — владеет способом движения: каждая добавляет или убирает приём, а не процент.\n- **FTL** (Subset Games, 2012; 95 % из 47 164). Класс — стартовый корабль: набор, заданный тем, что в нём есть и чего нет. Недостающая часть и делает старт другим. Новые корабли расширяют выбор, а не поднимают силу. Авторы жалели об открытиях, которые зависели от случайных событий ([интервью](https://www.shacknews.com/article/78422/ftl-devs-there-are-some-things-we-should-have-done)).\n- **Everspace 2** (Rockfish, 2023; 87 % из 7 350). Три веса, десять подклассов. У каждого одно постоянное правило, которое платит за способ летать: урон растёт с расстоянием, или с числом врагов рядом, или щит перезаряжается только на большой скорости ([вики](https://everspace.fandom.com/wiki/Ships_%28ES2%29)). Слабость приходит даром: правило перестаёт платить, когда летишь иначе. Вышла без коопа, и [PC Gamer](https://www.pcgamer.com/everspace-2-review/) записал это в минусы.\n- **World of Warships** (Wargaming, 2015). Эсминец, крейсер, линкор и авианосец — треугольник, который выходит из свойств, а не из таблицы урона: торпедам всё равно, какого размера цель; быстрые пушки ловят малые корпуса; большие снаряды пробивают тонкую броню ([Википедия](https://en.wikipedia.org/wiki/World_of_Warships)). Классы различаются временем ответа руля, а не только скоростью: тяжёлый корпус слушается на секунды позже и поэтому ощущается тяжёлым.\n- **Crossout** (Targem, 2017). Три бюджета вместо классов: энергия ограничивает оружие, грузоподъёмность — броню, кабина меняет скорость на энергию. Лёгкая кабина с большей энергией — настоящая причина оставаться лёгким ([обзор](https://www.gamereactor.eu/crossout-review)). Детали отстреливают в бою и возвращают после: разоружённая машина читается с первого взгляда.\n- **Risk of Rain 2** (Hopoo, 2020; 95 % из 165 516). У всех классов одна рамка: основная атака, вторая, приём движения, большое умение. Новый класс осваивают за минуту, потому что места значат одно и то же. С числом игроков растёт число врагов и цены, а не их живучесть ([вики](https://riskofrain2.wiki.gg/wiki/Items)).\n- **Monster Hunter: World** (Capcom, 2018; 92 % из 116 827). Оружие — это класс, и его свободно меняют в лагере. Награда у каждого своя и полная. У группы общий запас неудач: три падения на всех проваливают охоту, и поэтому ветеран бережёт новичка ([Википедия](https://en.wikipedia.org/wiki/Monster_Hunter)).\n- **Borderlands 2** (Gearbox, 2012; 90 % из 123 301). Один боевой приём на класс и три ветки под него. Упавший игрок ещё может стрелять и встаёт, убив врага; второй путь — товарищ ([Википедия](https://en.wikipedia.org/wiki/Borderlands_2)). Так гибель — последний бой, а не ожидание.\n- **Vermintide 2** (Fatshark, 2018). Виды врагов, каждый из которых просит своего ответа: толпа, бронированный, тот, кто хватает одного игрока, пока его не освободит другой ([Википедия](https://en.wikipedia.org/wiki/Warhammer:_Vermintide_2)). Это и делает сборки нужными друг другу, без лекаря и без правил о ролях.\n\n## Что общего у лучших\n\nПо каждому желанию: что повторяется у игр, где оно получилось, и самая малая форма, которая годится игре с лодкой и видом сверху. «Нам» — это предложение, а не решение.\n\n### Весёлая игра\n1. **Хвалят само управление.** У Windward, King of Seas и Skull and Bones рецензенты ругают почти всё, но хвалят ход корабля и бой, у Skull and Bones ещё и кооп. Значит, первое желание держит остальные, а не наоборот.\n2. **Ругают круги.** Медленные круги на краю секторов огня у King of Seas, бег по кругу у Tempest, сливающиеся бои у Windward. Бой, где два корабля кружат и ждут перезарядки, надоедает везде.\n3. **Что спасает бой от кругов.** Оружие по стороне, куда смотришь (Black Flag); залп, который заряжают, держа кнопку (Rebel Galaxy); броня по бортам (Windward Horizon); отражатель, который на миг глушит свои пушки (Rebel Galaxy); умения дальше пушек, которые есть только у игрока (King of Seas).\n4. **Три вида заданий — приговор.** «Доставь, сопроводи, уничтожь» у King of Seas; одни и те же задания десятки раз у Windward; поручения-доставки у Skull and Bones.\n5. **Плотность важнее размера.** В Cat Quest III находка — каждые несколько секунд. Dredge полгода делал первый район и управление лодкой, прежде чем браться за остальные.\n6. **Веселье доказывают рано.** Авторы SPAZ: если игра становится приятной только через год, что-то не так. Windward выбросил всё, кроме арта, когда версия с аренами не пошла.\n7. **Побочное — коротким.** Сцены Pirates! длятся минуты, и каждая — шаг к большой цели. Правило Сида Мейера: одна хорошая игра лучше двух отличных.\n\n**Нам.** Наш бой уже отвечает на второй пункт: турель бьёт сама, а мастерство — руль, рывок, парирование и таран ([Бой](../gameplay/combat.md)). Желания из этого отчёта стоит проверять одним вопросом: даёт ли это лодке новое дело в бою или повод выйти в море.\n\n### Сюжет\n1. **Малые куски в естественных паузах.** Hades, Dredge, Cat Quest, Subnautica, FTL, Bastion. Долгого сидения нет нигде.\n2. **Персонажи важнее сюжета.** У каждого одно ясное отношение и своя жизнь: Hades, Spiritfarer, Dave the Diver, Borderlands 2.\n3. **Игра замечает, что ты сделал.** Hades, Bastion, Left 4 Dead, синие варианты FTL, подбор ролей Wildermyth.\n4. **Поражение — ход истории.** Hades (снова дома, новый разговор), Sunless Sea (наследник), Pirates! (злодей ушёл), Helldivers 2 (проигранный приказ).\n5. **Голос в ухе за игрой.** Злодей Borderlands 2, диспетчер Deep Rock Galactic, звонки в GTA, радио Subnautica.\n6. **Дающие задания — это и есть состав.** Несколько линий открыто сразу: GTA, Dave the Diver, Dredge, доска разыскиваемых Cat Quest III.\n7. **Хребет написан, середина меняется.** Hades, Wildermyth, FTL, Pirates!.\n8. **Случившееся в море меняет разговор дома, и обратно.** Цепочки Hades, отчёты портов Sunless Sea.\n9. **Тайну находит игрок.** Subnautica, бутылки Dredge, Sunless Sea.\n10. **Серьёзный герой в нелепом мире.** GTA, Dave the Diver, Chinatown Wars, Cat Quest. Вторая версия реплик для повторного захода при тексте и лепете стоит только написания (GTA).\n11. **Подача не спасает сюжет без конфликта.** Hades II.\n\nМаленькие команды получали любимую историю дёшево: текст, портрет и звук вместо актёров (Dredge, Cat Quest, Chinatown Wars, FTL); строгая мера длины (четыре-пять окон у Dredge, две-четыре фразы у Subnautica); условия вместо веток (FTL, Hades, Wildermyth, Sunless Sea); один сильный голос (Bastion, Borderlands 2); персонаж, который вводит каждую систему игры (Dave the Diver).\n\nВ коопе: когда четверо разом задевают несколько поводов, говорящие перебивают друг друга (Borderlands 2). Решение — одна очередь речи, реплика не обрывается, текст остаётся на экране, а сказанное можно перечитать. Голосовой чат заглушает диалог, поэтому ничего важного не говорится только раз.\n\n
