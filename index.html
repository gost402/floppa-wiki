42 |\n\nИз шести вещей на обломках 3 ящика, 2 бочки, сундук (`Salvage.Kinds`). Обломки, которым в [редакторе карт](../tools/map-editor.md) дан список ящиков (на Арене все четыре), держат эти ящики и платят за них их добычу.\n\n## Что выглядит не в ладу\n- Провизия и ценности не идут ни в один рецепт: их только продают. Ценности — вдвое дороже любого другого ящика, так что полный трюм быстро становится сундуками, а металл для ремонта вытесняется первым.\n- Рыба и вещи с обломков занимают те же места, что и ящики охотников, а стоят меньше большинства из них ([Q31](../questions/haul.md#q31)).\n- Монеты не на что тратить, когда верфь куплена ([Чего нам не хватает](../questions/gaps.md)).\n"}, {"id": "balance-weapons", "path": "balance/weapons.md", "title": "Баланс оружия", "section": "balance", "date": "2026-11-12", "md": "# Баланс оружия\n\nСнимок значений из кода на 2026-11-12. Источник — код; меняешь число в коде — обнови эту страницу в том же коммите. Все числа — стартовые значения для настройки.\n\nЗдесь числа всего, чем лодка причиняет вред, и как они соотносятся. Как устроены выстрел, таран и опасности, написано на страницах тем: [Бой](../gameplay/combat.md), [Сборки и стили игры](../gameplay/builds.md), [Припасы](../gameplay/pickups.md), [Зоны и опасности](../world/areas.md), [Охотники и ИИ](../gameplay/hunters.md), [Верфь](../base/boatyard.md). Попадания корпусов — в [Балансе лодок](boats.md). Термины — в [глоссарии](../glossary.md).\n\nВред мерится **попаданиями** (`strikes`): корпус стоит столько попаданий, сколько записано в его `Strikes`, и тонет, когда они выбраны.\n\n## 1. Пусковые установки\n\nИсточник: `game/ships/Parts.cs`, `Parts.Rockets`, `Parts.ChaseRacks`, `Parts.Torpedoes`, `Parts.Turret`, `Parts.MineRail`, `Parts.Cradle`; поля `Launcher` (`Reload`, `Damage`, `Rails`, `Blast`). Скорости и досягаемости: `Rockets.Motor`, `Boat.Reach`, `Torpedoes.Motor`, `Torpedoes.Run`, `Turrets.Reach`, `Floaters`. Массу даёт деталь, цену — верфь.\n\nФормулы: попаданий за залп на борт = `Rails` × `Damage`; попаданий в секунду на борт = залп ÷ `Reload`. Каждый борт перезаряжается сам, обе стойки пары заряжены в начале боя.\n\n| Установка (код) | Попаданий за снаряд | Снарядов на борт за залп | Перезарядка, с | Попаданий за залп на борт | Попаданий в с на борт | «Взрыв», м | Масса, т | Цена, монет |\n|---|---|---|---|---|---|---|---|---|\n| [Ракеты I](../weapons/rockets-i.md) (`Rockets[0]`) | 1 | 2 | 2,0 | 2 | 1,00 | 0,25 | 0,1 | 40 |\n| [Ракеты II](../weapons/rockets-ii.md) (`Rockets[1]`) | 1 | 3 | 2,5 | 3 | 1,20 | 0,25 | 0,2 | 75 |\n| [Ракеты III](../weapons/rockets-iii.md) (`Rockets[2]`) | 1 | 4 | 3,0 | 4 | 1,33 | 0,25 | 0,3 | 120 |\n| [Ракеты IV](../weapons/rockets-iv.md) (`Rockets[3]`) | 1 | 5 | 3,5 | 5 | 1,43 | 0,25 | 0,4 | 210 |\n| [Носовая стойка I](../weapons/chase-rack-i.md) (`ChaseRacks[0]`) | 1 | 2 | 2,0 | 2 | 1,00 | 0,25 | 0,12 | 90 |\n| [Носовая стойка II](../weapons/chase-rack-ii.md) (`ChaseRacks[1]`) | 1 | 3 | 2,5 | 3 | 1,20 | 0,25 | 0,24 | 170 |\n| [Торпеды](../weapons/torpedoes.md) (`Torpedoes`) | 12 | 1 | 10,0 | 12 | 1,20 | 1 | 0,8 | 450 |\n| [Турель](../weapons/turret.md) (`Turret`) | 1 | 1 | 0,8 | 1 | 1,25 (одна на лодку) | 0,2 | 0,3 | 0 |\n| [Минный жёлоб](../weapons/mine-rail.md) (`MineRail`) | 5 | 1 | 2,5 | 5 | 2,00 | 6 | 0,45 | 300 |\n| [Люлька](../weapons/cradle.md) (`Cradle`), дрон | 1 | 2 | 2,0 | 2 | 1,00 за дрон | — | 0,7 | 480 |\n\nПримечания к таблице.\n- «Взрыв» — поле `Blast`. У ракет, торпед и турели это запас касания: снаряд бьёт, если проходит в этом зазоре от корпуса, а попадание одно и полное (`Gunnery.Strike`). Настоящий взрыв по площади только у мины: удар `Damage` у корпуса, к радиусу 6 м спадает до нуля (`Blasts.Burst`), и он задевает всех, кроме своей стороны.\n- Носовая стойка I и II стреляют теми же числами, что Ракеты I и II (`Rockets[level - 1].Launcher with { Facing = Bow }`), и стоят дороже.\n- Турель одна на лодку по оси, а не пара. Она стреляет сама, по стволу за раз, и в Q и E не входит (`Weapon.Turrets`). Она стоит на стартовой лодке (`Designs.Starter`), поэтому бесплатна.\n- Люлька держит два дрона (`Parts.CradleDrones`), по одному на борт; каждый несёт одну ракетную стойку Ракеты I (`Drone.Design`) и два попадания корпуса. Потерянный дрон строится заново за 20 с (`Parts.CradleRebuild`).\n- Масса и цена детали — на одну деталь: пару бортов она даёт сама.\n\nПолёт снаряда.\n\n| Установка | Скорость снаряда, м/с | Досягаемость, м | Разброс (σ), рад | Масса снаряда, т |\n|---|---|---|---|---|\n| Ракеты I–IV, носовые стойки | у игроков 25 при пуске, 100 у цели (`Rockets.Motor`, разгон за 0,15 с); у других сторон 20 и 40, разгон за 0,3 с | 80 (`Boat.Reach`); ≈0,91 с полёта, у других сторон ≈2,15 с | 0,012 (`Rockets.Spread`) | 0,022 |\n| Торпеды | 6 при пуске, 14 после разгона (`Torpedoes.Motor`, 0,8 с) | 100 (`Torpedoes.Run`); ≈7,6 с хода | 0,008 (`Torpedoes.Spread`) | 0,35 |\n| Турель | снаряд, 40 у всех сторон (`Rockets.Shell`) | 45 (`Turrets.Reach`); ≈1,1 с полёта | 0,012 | 0,010 |\n| Мина | бросок 4 м/с за корму, замирает за ~2 с (`Floaters.Toss`, `Slowing`) | ложится в паре метров за кормой | — | 0,17 |\n| Дрон | сам лодка, ракета как у Ракет I | ракета 80; дрон уходит от носителя не дальше 60 м (`Wingman.Leash`) | — | — |\n\nРакету и торпеду игрока наводка поворачивает не дальше 0,6 рад в каждую сторону от линии установки (`Boat.Fan`). Снаряд несёт ещё и ход лодки. Взрыв торпеды заодно подбрасывает корпус (`Torpedoes.Heave`, импульс 12 т·м/с).\n\nГде можно стоять (`DeckPart.Fits`, `Build.Fault`).\n- Ракеты I–IV, торпеды, турель: на любой станции корпуса.\n- Носовые стойки: только на станциях впереди 5% длины от миделя (`DeckPart.Front`). На Катерке (единственная станция чуть позади миделя) их не поставить.\n- Минный жёлоб и люлька: только на станции на миделе или позади, и не больше одного жёлоба и одной люльки на лодку.\n- Станций: Катерок 1, Ялик 2, Плоскодонка 2, Гонщик 3, Патрульный катер 4, Канонерка 5 (`Hull.Stations`). Тепловизор тоже занимает станцию.\n\nСборки и их задачи — на странице [Сборки и стили игры](../gameplay/builds.md), покупка деталей — в [Верфи](../base/boatyard.md).\n\n## 2. Сколько тонуть\n\nИсточник: `HullPart.Strikes` (`Parts.RunaboutHull` и остальные), `Belt.Strikes`, `ArmourPart.Share` (`Parts.ArmourBelt` 1/3, `Parts.HeavyBelt` 2/3).\n\nФормула: корпусу с `S` попаданиями нужно `n = ⌈S ÷ попаданий за залп⌉` залпов; пушка заряжена в начале боя, поэтому время = `(n − 1) × перезарядка`. Это стрельба одним бортом без промахов, без ряби залпа (до 0,27 с на залп), без времени полёта. Пояс добавляет `⌈S × Share⌉` попаданий (`Belt.Strikes`). Ноль значит, что хватает первого залпа.\n\nПопадания корпусов, без пояса, с поясом (+1/3), с тяжёлым поясом (+2/3):\n\n| Корпус | Катерок | Ялик | Плоскодонка | Гонщик | Патрульный катер | Канонерка |\n|---|---|---|---|---|---|---|\n| Без пояса | 2 | 4 | 5 | 6 | 10 | 16 |\n| Броневой пояс | 3 | 6 | 7 | 8 | 14 | 22 |\n| Тяжёлый пояс | 4 | 7 | 9 | 10 | 17 | 27 |\n\nСекунд до гибели, **без пояса**:\n\n| Установка | Катерок (2) | Ялик (4) | Плоскодонка (5) | Гонщик (6) | Патрульный (10) | Канонерка (16) |\n|---|---|---|---|---|---|---|\n| Ракеты I / Нос. I / дрон | 0 | 2 | 4 | 4 | 8 | 14 |\n| Ракеты II / Нос. II | 0 | 2,5 | 2,5 | 2,5 | 7,5 | 12,5 |\n| Ракеты III | 0 | 0 | 3 | 3 | 6 | 9 |\n| Ракеты IV | 0 | 0 | 0 | 3,5 | 3,5 | 10,5 |\n| Торпеды | 0 | 0 | 0 | 0 | 0 | 10 |\n| Турель | 0,8 | 2,4 | 3,2 | 4 | 7,2 | 12 |\n| Мина (в цель) | 0 | 0 | 0 | 2,5 | 2,5 | 7,5 |\n\nС **броневым поясом**:\n\n| Установка | Катерок (3) | Ялик (6) | Плоскодонка (7) | Гонщик (8) | Патрульный (14) | Канонерка (22) |\n|---|---|---|---|---|---|---|\n| Ракеты I / Нос. I / дрон | 2 | 4 | 6 | 6 | 12 | 20 |\n| Ракеты II / Нос. II | 0 | 2,5 | 5 | 5 | 10 | 17,5 |\n| Ракеты III | 0 | 3 | 3 | 3 | 9 | 15 |\n| Ракеты IV | 0 | 3,5 | 3,5 | 3,5 | 7 | 14 |\n| Торпеды | 0 | 0 | 0 | 0 | 10 | 10 |\n| Турель | 1,6 | 4 | 4,8 | 5,6 | 10,4 | 16,8 |\n| Мина (в цель) | 0 | 2,5 | 2,5 | 2,5 | 5 | 10 |\n\nС **тяжёлым поясом**:\n\n| Установка | Катерок (4) | Ялик (7) | Плоскодонка (9) | Гонщик (10) | Патрульный (17) | Канонерка (27) |\n|---|---|---|---|---|---|---|\n| Ракеты I / Нос. I / дрон | 2 | 6 | 8 | 8 | 16 | 26 |\n| Ракеты II / Нос. II | 2,5 | 5 | 5 | 7,5 | 12,5 | 20 |\n| Ракеты III | 0 | 3 | 6 | 6 | 12 | 18 |\n| Ракеты IV | 0 | 3,5 | 3,5 | 3,5 | 10,5 | 17,5 |\n| Торпеды | 0 | 0 | 0 | 0 | 10 | 20 |\n| Турель | 2,4 | 4,8 | 6,4 | 7,2 | 12,8 | 20,8 |\n| Мина (в цель) | 0 | 2,5 | 2,5 | 2,5 | 7,5 | 12,5 |\n\nМина считается как бьющая в цель с полной силой: сила спадает с расстоянием до корпуса, и ей нужно, чтобы цель на неё наехала. Дрон считается одним: второй, с другого борта, удваивает темп, но дрон ещё должен долететь. Запасы припасов брони (раздел 5) в таблицу не входят.\n\n## 3. Прочий вред\n\n### Таран\nИсточник: `game/combat/Ramming.cs`, `Ramming.Land`; `Parts.Ram`.\n- Удар корпусов разных сторон: попаданий `= импульс × (1 − 3 ÷ скорость сближения) ÷ 10`, и **такое же число обоим корпусам** (`Gentle` = 3 м/с — слабее толчок ничего не бьёт, `PerStrike` = 10 т·м/с). Большой корпус выдерживает удар, который топит ялик.\n- Таран (`Parts.Ram`, 0,4 т, 180 монет): удар, пришедшийся в нос за корнем тарана, не бьёт свою лодку (`Hurt.OnRam`); чужую бьёт как всегда. Удар в борт или корму вред как обычно.\n- Удар носовой четвертью с горящим нитро (`Ramming.Charging`): своя лодка получает ×0,5 (`Braced`), чужая ×1,5 (`Driven`).\n- Толчок внутри одной стороны ничего не бьёт.\n\n### Прицел турели и дронов\n- Турель: берёт ближайшую лодку другой стороны в пределах 45 м, не сквозь дым (`Turrets.Reach`, `Screens.Sees`); голова поворачивается на 2,5 рад/с и стреляет, когда отклонена меньше чем на 3° (`Turrets`).\n- Дроны (`Wing`, `Wingman`): сами идут на лодку другой стороны в пределах 30 м от носителя (`Threat`), держат цель, пока она в 45 м (`Chased`); посланный на цель отпускает её дальше 70 м от носителя (`Wingman.Reaching` = `Leash` 60 + `Passing` 10) плюс 15 м, если она его добыча (`Letting`). Возвращаются домой с последним попаданием корпуса (`Spent` = 1). Принятый на борт дрон чинится 5 с (`Mending`), потерянный строится 20 с.\n\n### Мины\nИсточник: `game/combat/Floaters.cs`, `Floater.cs`, `Parts.MineRail`.\n- На плаву у лодки не больше шести (`Floaters.Keep`): седьмая топит самую старую без взрыва.\n- Взводится через 1,2 с (`Arming`), тонет сама через 45 с (`Life`).\n- Взрывается под живым корпусом другой стороны или от снаряда; своей стороны не бьёт. Взрыв — 5 попаданий у корпуса, спад к 6 м (`Burst`).\n- Цепочка: взрыв поджигает мины в радиусе взрыва через 0,1–0,25 с (`Mines.Fuse`), и это относится и к чужим, и к своим минам на плаву. Охотник считает жёлоб «досягаемым» на 25 м позади (`Floaters.Reach`).\n\n### Дым\nИсточник: `game/ships/Smoke.cs`; `Parts.SmokeGenerator`.\n- Дымогенератор (0,3 т, 240 монет) ставит завесу 5 с (`Smoke.Lasting`) и перезаряжается 25 с (`Smoke.Recharging`) — после выстрела в целом 30 с до следующей. Охотники и турель сквозь неё не видят; тепловизор (180 монет) видит.\n\n### Плотники\nИсточник: `game/combat/Carpenters.cs`; `Parts.Carpenters`.\n- За каждую лодку, потопленную снарядом или тараном, чинят четверть её попаданий (`Share` 0,25 × её `Stood`), но не больше, чем выбрано. Плотники 0,35 т, 210 монет.\n\n## 4. Огонь охотников\n\nИсточник: `game/ai/Crew.cs` (`Crew.Green` и остальные), `Boat` (`_reload = Reload × slowness`), `Captain.Aim`.\n\nМастерство — три числа: `Tick`, секунды между мыслями капитана; `Slack`, на сколько метров мимо цели снаряд может пройти, чтобы капитан стрелял; `Slowness`, во сколько раз его перезарядка больше, чем у игрока.\n\n| Экипаж (код) | Реакция (`Tick`), с | Прицел (`Slack`), м | Перезарядка (`Slowness`), × |\n|---|---|---|---|\n| Новички (`Green`) | 0,5 | 5 | 2,2 |\n| Бывалые (`Seasoned`) | 0,35 | 2,5 | 1,9 |\n| Ветераны (`Veteran`) | 0,25 | 0 | 1,6 |\n| Асы (`Ace`) | 0,15 | 0 | 1,2 |\n\nВыстрел проверяется каждые 0,05 с (`Captain.Aiming`); `Slack` прибавляется к запасу касания снаряда. Перезарядка ×`Slowness` касается всех установок охотника, в секундах:\n\n| Установка | Игрок | Новички | Бывалые | Ветераны | Асы |\n|---|---|---|---|---|---|\n| Ракеты I | 2 | 4,4 | 3,8 | 3,2 | 2,4 |\n| Ракеты II | 2,5 | 5,5 | 4,75 | 4,0 | 3,0 |\n| Ракеты III | 3 | 6,6 | 5,7 | 4,8 | 3,6 |\n| Ракеты IV | 3,5 | 7,7 | 6,65 | 5,6 | 4,2 |\n| Торпеды | 10 | 22 | 19 | 16 | 12 |\n| Турель | 0,8 | 1,76 | 1,52 | 1,28 | 0,96 |\n| Минный жёлоб | 2,5 | 5,5 | 4,75 | 4,0 | 3,0 |\n\nЭкипаж охотников поста выбирают в редакторе карт (`Post.Hunters`; на Арене новички, бывалые и один ветеран), охотников заданий — их код (`missions/Cargo.cs` и другие; до ветеранов на канонерке и броненосце). Асов сейчас не ставит никто. Вопрос: [Q29](../questions/combat.md#q29).\n\n## 5. Припасы\n\nИсточник: `game/pickups/Pickups.cs` (`Pickups.Take`, `Pickups.Mending`), `game/ships/Nitro.cs`.\n\n| Припас | Что даёт |\n|---|---|\n| Ремонт | Чинит `⌈Stood × 1/3⌉` попаданий (`Boat.Mend`), где `Stood` — все попадания лодки с поясом |\n| Броня | Пополняет запас брони до `⌈Stood × 1/3⌉` (не прибавляет, а доводит до этого; `Boat.Reinforce`); он снимается раньше плит и корпуса |\n| Нитро | Заполняет шкалу (`Nitro.Fill`); это два рывка (`Nitro`, [лодки](boats.md)) |\n| Топливо | Доливает половину бака (`Pickups.Refuelling`) |\n\nПрипас лежит 30 с, последние 5 мигает (`Lasting`, `Blinking`); берёт любая лодка, чей корпус подошёл к нему на 1,8 м (`Reach`). Ремонт и броня за подбор, для лодок без пояса:\n\n| Корпус | Катерок | Ялик | Плоскодонка | Гонщик | Патрульный | Канонерка |\n|---|---|---|---|---|---|---|\n| Попаданий | 1 | 2 | 2 | 2 | 4 | 6 |\n\nС поясом: 1, 2, 3, 3, 5, 8; с тяжёлым: 2, 3, 3, 4, 6, 9. Решение: [Припасы](../gameplay/pickups.md).\n\n## 6. Опасности\n\nИсточник: `game/areas/`. Силу даёт `Blasts.Burst`: попаданий у корпуса, спад к нулю на радиусе; взрывы задевают все стороны.\n\n| Опасность (код) | Вред корпусу |\n|---|---|\n| Мины (`Mines`) | 8 попаданий у корпуса, радиус 10 м; корпус, коснувшийся мины, или снаряд взрывает её; цепочка за 0,1–0,25 с |\n| Бочки (`Drums`) | 5 попаданий, радиус 7 м; взрыв от снаряда, взрыва рядом или от встречи корпуса с бочкой на скорости сближения больше 6 м/с |\n| Нефтяные пятна (`Slicks`) | Горящее пятно: 0,6 попадания в секунду, пока часть корпуса над огнём (`Scorching`); поджигает бочки внутри; поджигает его снаряд или взрыв |\n| Обстрелы (`Barrages`) | Падение 1,25 попадания у корпуса, радиус 9 м; предупреждение кольцом 1,4 с, падение ещё 0,7 с |\n| Батареи (`Batteries`) | Залп 4 красных ракеты (по 1 попаданию) раз в 6 с; сама батарея стоит 16 попаданий, а добитая рвётся (2 попадания, радиус 6 м) |\n| Импульсные башни (`Towers`), на Арене нет | Кольцо раз в импульс (заряд 1,5 с, ход 20 м/с): 1 попадание у основания, 0,4 у края радиуса; выбрасывает корпус наружу; в кольце до двух щелей |\n| Боны (`Booms`) | Не бьют: закрытые держат как стена. Лебёдочная будка стоит 4 попадания снарядов — разбитая отпускает бон насовсем |\n| Прожекторы (`Searchlights`), на Арене нет | Не бьют, только замечают лодку игрока (вне дыма) |\n| Течения (`Currents`) | Не бьют, несут лодки и всё на плаву, вдоль коридора или по кругу водоворота |\n\nСтраница темы: [Зоны и опасности](../world/areas.md).\n\n## 7. Заметки\n\n- Ракеты: попаданий в секунду на борт растёт всё медленнее: 1,00 → 1,20 → 1,33 → 1,43 (+0,20, +0,13, +0,10), а цена идёт 40 → 75 → 120 → 210. Четвёртый уровень почти втрое дороже третьего ради +0,14.\n- Носовые стойки I и II бьют тем же, что Ракеты I и II, но стоят 90 и 170 против 40 и 75. Их единственное отличие — стрельба вперёд, и Катерок не может их нести вовсе.\n- Турель, бесплатная и весом 0,3 т, даёт 1,25 попадания в секунду одной стойкой, чуть больше, чем Ракеты II на борт (1,20). Платой служит досягаемость 45 м против 80.\n- Мина — самый плотный вред на секунду на борт (2,00) при цене 300, но бьёт только по лодке, наехавшей на неё; в таблице времени «Мина (в цель)» оптимистична.\n- Торпеда: 12 попаданий за снаряд топят любой корпус без пояса, кроме Канонерки (16), одним попаданием; с броневым поясом одним не топится уже Патрульный катер (14). Взамен она перезаряжается 10 с, идёт ≈7,6 с и стоит 450 монет и 0,8 т. Канонерке с тяжёлым поясом (27) нужны три залпа.\n- Дрон бьёт в том же темпе, что Ракеты I на борт (1,00), а пара с люлькой стоит 480 монет против 40; взамен он стреляет сам, не требует вывода борта, но стоит всего два попадания и должен долететь до цели.\n- Охотник даже ас стреляет в 1,2 раза медленнее игрока с такой же установкой, а новичок в 2,2 раза. Потому охотнику той же установки нужно больше времени: например, Ракеты IV ас бьёт 1,19 попадания в секунду против 1,43 у игрока.\n- Мина (5 у корпуса) и бочка (5) равны и бьют сильнее ракеты в пять раз; мина-ловушка поля (8) сильнее любой мины игрока (5).\n- Тяжёлый пояс на Катерке — +2 при 2 попаданиях корпуса, то есть вдвое больше; на Канонерке +11 из 16.\n- Разрыв между сборками велик: Канонерку без пояса Торпеды топят за два залпа (10 с), мины — за четыре (7,5 с), а Ракеты I — за восемь (14 с).\n"}, {"id": "base-boatyard", "path": "base/boatyard.md", "title": "Верфь", "section": "base", "date": "2026-11-13", "md": "# Верфь\n\n![Верфь: карточки деталей и панель показателей](../img/boatyard.jpg)\n\nВерфь — экран у причала [гавани](pier.md), где лодка собирается из деталей. Открывается только у причала, с ленты пришвартованной лодки. Цены и массы деталей — в [Балансе лодок](../balance/boats.md) и [Балансе оружия](../balance/weapons.md).\n\n## Решения владельца\n- 2026-11-10: вид сверху не годится, верфь смотрят низко, сбоку и немного сверху. Вход на верфь — плавный переход камеры с лёгким приближением, лодка сама подъезжает в кадр. Выбор детали почти не двигает камеру: игрок крутит вид сам.\n- Верфь у пирса: лодка настраивается там, где стоит, на живой воде. Не в открытом море.\n- Верфь — нижняя лента, как гараж NFS: категории плитками вдоль низа, над ними ряд карточек деталей с ценой и весом, показатели справа, кошелёк; мышь, клавиши и геймпад. Значков на лодке, по которым надо щёлкать, нет.\n- Верфь открывается только в гавани у причала, никогда в море.\n- Верфь показывает монеты на руках в углу, на глянцевой табличке-кошельке рядом с жетоном-монетой: монеты везде выглядят одинаково. Счёт убывает по мере покупки детали, а каждая цена показывает, хватает ли монет. Деталь, на которую наведён фокус в ряду, имеет фокус меню, светится аква под аквамариновым кольцом; оранжевым отмечена только установленная деталь.\n- Деталь, на которую наведён фокус, стоит на лодке призраком: прозрачным и светящимся аква, корпус показан призраком целиком, и лодка сидит в воде так, как села бы с ней. Если снова навести на установленную деталь или выйти, лодка возвращается к установленному. Установленная деталь встаёт с небольшой осадкой и бликом.\n- 2026-11-12: карточки деталей и экран показателей — в стекле, как плитки ([Компоненты](../art/components.md)).\n- Выход с верфи: «Готово», Esc и Tab оставляют лодку как построена. Проект, который утонул бы, сперва предупреждает, потом оставляет последний проект за визит, который держался на плаву.\n\n## Как устроено\nПри загрузке игра один раз открывает верфь на несколько кадров за шторкой загрузки (`Boatyard.Rehearse`): всё, что её экран строит и компилирует в первый раз, ждёт там, и первое открытие не подвисает. Открывается только у причала, плиткой «Верфь» или `Tab` на ленте пришвартованной лодки (`Game.OpenYard`): `Boatyard` держит лодку, как она спроектирована, на первом месте у причала (`Dock.Berth`) на живой воде, поэтому вес виден по осадке, дифференту и опрокидыванию. Лодка игрока в мире на это время убрана, а без связи бой в море ждёт; в коопе он идёт дальше. Выход (`Game.Refit`) возвращает лодку в мир на её место, заново построенную, если проект изменился, с тем же трюмом, и возвращает ленту.\n`camera/YardCamera.cs` (`OrbitView`, как и круговой вид демо) стоит над водой у пирса (`Dock.Room`) и показывает всю лодку низко, под небольшим углом над горизонтом, в левой части экрана между краем экрана и статистикой, над карточками. Объектив смещён от оси (сдвиг усечённой пирамиды), поэтому лодка лежит в этой доле экрана и остаётся прямой; там, где комната держит вид близко, объектив расширяется, а угол не растёт. Первый вид — с солнечной стороны, где вид стоит дальше всего ([Q66](../questions/interface.md#q66)). Пирс, вставший между видом и лодкой, растворяется дизерингом вокруг неё, как земля в виде боя ([Камера и картинка](../gameplay/camera.md)), так что корпус виден до воды с любой стороны: решение без владельца, [Q187](../questions/interface.md#q187).\nВход — переход от вида боя к виду верфи за секунду с небольшим приближением; лодка в это время сама переходит с места, где стояла, на первое место у причала. Она больше не приходит с моря: она уже пришвартована (решение без владельца, [Q179](../questions/interface.md#q179)). Выход возвращает вид назад, а `Esc` сразу после входа не ломает переход. Только вид местного игрока: мир не останавливается.\nВыбор места или детали вид не двигает. Игрок крутит его сам: перетаскивание мышью вне интерфейса, правый стик, Q и E (рыскание свободно, наклон зажат низко над водой); колесо, триггеры, R и F приближают в небольших пределах.\n\nМеста лодки — стеклянные плитки ленты вдоль низа (`ui/Ribbon.cs`, [Компоненты](../art/components.md)): корпус, мотор, броня, станции и снаряжение, каждая с пиктограммой; свет скользит к выбранной и заливает её аква, вид при этом остаётся на месте. Над лентой ряд стеклянных карточек деталей этого места (`Choices`, [Компоненты](../art/components.md), решение без владельца: [Q166](../questions/interface.md#q166)), каждая с весом, а у корпуса ещё длина, станции, удары, места трюма и бак; установленная обведена тонким оранжевым кольцом и светится оранжевым снизу, карточка под фокусом наливается светом лагуны, не купленная лежит матовой под замком с ценой на белом ярлычке, зелёной, если монет хватает, и красной, если нет. A и D меняют место, W и S ходят по карточкам, Enter ставит. Не купленная деталь по нажатию предлагает себя выноской, и второе нажатие покупает и ставит её, а если монет не хватает, карточка вздрагивает (`yard/Choices.cs`); монеты убывают в кошельке рядом с «Готово» (`ui/Purse.cs`). Корпус с большим числом станций возвращает детали, которые держали его станции за этот визит (`Design.WithHull`). Снаряжение — свои плитки ленты («Снаряжение 1, 2, 3», по числу мест корпуса, `Place.Gear`): каждое заполняется снаряжением или остаётся пустым, а вид, уже стоящий на другом месте, в ряду не предлагается. Смена корпуса сохраняет снаряжение по местам, а то, что не поместилось, снимается. Экран статистики перечисляет снаряжение по местам.\nПоказатели — на высокой панели из того же стекла, что карточки и кошелёк (`StatsPanel`, `ui/Glass.cs`), затемнённой под белые слова с тёмным ореолом: они читаются и над светлой лагуной, и над тёмным пирсом. Панель в том же слое, что карточки, и не добавляет копии экрана. Имя лодки — мелкими белыми капителями над панелью, гоночный номер — на круглой стеклянной бусине цвета её полосы. Каждый показатель — в единицах самой детали, на полоске стекла, залитой аква; то, что изменит подсвеченная деталь, на ней зелёное, где лучше, и красное, где хуже ([Q52](../questions/interface.md#q52)); сцепление, где нет ни лучше, ни хуже, у подсвеченной детали белое. Нагрузка — стеклянные бусины цвета деталей, а дальше того, что корпус держит на плаву, красные; вес, который добавляет подсвеченная деталь, обведён, а то, что она снимает, остаётся пустыми ободками. Строки на плаву показывают каждое изменение. Панель растёт вместе со словами детали, а лампа под ней — зелёная или красная бусина — говорит всё: лодка годна к морю или почему утонет. Значки деталей на карточках и плитках — такие же стеклянные бусины. Размеры, шрифты и затемнение панели — в теме, тип `Stats`; поля экрана и виньетка — общий тип `Screen`; заголовок «Верфь» — тот же печатный заголовок, что у базы. «Готово» и «Испытать» (T, [Полигон](testing-ground.md)) — стеклянные `Pill`. Выход делает проект лодкой, которая выйдет от пирса; та, что утонула бы, предупреждает выноской (`Balloon.Draw`, как и выноска с ценой), а повторный выход оставляет последний проект за визит, который держался на плаву, или лодку как была.\n\nЛодка у пирса — подсвеченный проект, поэтому она держится на воде так, как держался бы он. То, что у неё есть сверх установленного, рисуется отдельно (`Boat.Mark`) в `yard/ghost.gdshader`, аквамариновым стеклом прицела (`ui/glow_glass.gdshaderinc`), скрытым за лодкой и под водой; установленная деталь сохраняет его, угасая, и лодка оседает. Почему сама лодка: одна сборка и держит её на воде, и рисует её.\n\nЧто хранит `Progress` и как сохраняется, см. в [Прогресс и сохранения](../gameplay/progression.md).\n"}, {"id": "base-pier", "path": "base/pier.md", "title": "Гавань: мастерская корабела", "section": "base", "date": "2026-11-13", "md": "# Гавань: мастерская корабела\n\n![Мастерская корабела в лагуне, лодка у причала](../img/pier.jpg)\n\n![Лодка у причала: вид боя придвинут, над морем лента](../img/pier-moored.jpg)\n\n![Корабел принимает добычу у причала](../img/trader-harbour.jpg)\n\nГавань — мастерская корабела на сваях в лагуне острова `Home cay` на карте [Арены](../gameplay/missions.md). Это место открытого мира, а не отдельный экран: к ней доплывают, швартуются на `Space`, продают добычу корабелу, заходят на [верфь](boatyard.md) и отчаливают.\n\n## Решения владельца\n- Пирс на острове — не хаб, а одно из мест открытого мира; его облик строится под вид боя (2026-11-13).\n- Это мастерская корабела: один короткий причал и мастерская на сваях — сарай, слип с лодкой на тележке, лебёдка, топливная колонка. Сразу видно, что здесь чинят, строят и покупают добычу (2026-11-13).\n- Дух — старое дерево, канат и латунь, плюс немного соларпанка в родстве со [станцией «Мария»](../world/outpost.md): грядки и зелень на крышах, солнечные панели, маленький ветряк, стеклянные поплавки (2026-11-13).\n- Экрана базы нет. Пришвартованная лодка остаётся в мире у причала, вид боя лишь плавно приближается к ней. Над морем короткая лента: «Торговец», «Верфь», «Отчалить». Кооператив, судовой журнал и настройки — в меню `Esc`. Товарищи видят лодку у причала прямо в мире (2026-11-13).\n- Плитка «Торговец» продаёт и то, что осталось непроданным: ящики можно продать позже, не выходя снова в море (2026-11-13).\n- Ориентир — высокая сигнальная мачта у причала: вымпел по ветру днём, тёплый фонарь ночью. Вещь мира, без лучей и неона (2026-11-13).\n- Игра начинается сразу в открытом мире в море, а в гавань нужно приплыть самому и пришвартоваться на `Space` (или D-pad Вниз на геймпаде), сбавив ход вдали от охотников (2026-11-10).\n- У причала кнопки, как в NFS или World of Warships, а не предметы, по которым надо щёлкать (2026-11-10). Монеты показаны жетоном и числом, без подписи.\n- Место швартовки отмечено кольцом стеклянных поплавков, как старые рыбацкие: в каждом маленький тёплый огонёк, они качаются на волне, под ними мягкий бирюзовый свет в воде. Цвета — аква и тёплые огоньки. Столба света и лампы, красящей всё вокруг, нет. Издалека кольцо спокойно; когда лодка подошла и можно причалить, свет мягко разгорается и дышит (2026-11-12). Так же отмечена станция.\n- Неоновый танцующий свет, как маркеры миссий в Vice City (2026-11-11), владелец увидел и отверг: слишком ярко, слишком пёстро, неестественно.\n- Модель сделана в Blender.\n\n## Как устроено\n- **Модель** (`tools/dock.py`, `blender -b -P tools/dock.py` пишет `base/dock.glb`): цвет и отделка каждой грани лежат в вершинах, как у лодок, поэтому `surface.gdshader` рисует мастерскую в едином свете сцены. Мастерская стоит на сваях в лагуне, а не на песке: пляж пологий, и ближе 34 м от берега лодкам мелко. С пляжем её связывают длинные узкие мостки с калиткой и фонарём у берега. На помосте: сарай под двускатной крышей, открытый к морю, — на морском скате солнечные панели, на береговом грядка очитка, внутри верстак и доска на козлах; слип из двух рельсов, уходящих под воду, с тележкой, корпусом в наборе и ручной лебёдкой; топливный бак на стойке и оранжевая колонка; сигнальная мачта 13,6 м с фонарём, шаром и конусом на рее, флажками и оранжевым вымпелом; ветряк на растяжках; гирлянды стеклянных поплавков, перевёрнутая шлюпка, подвесные моторы, бочки, ящики и грядки в кадках. От помоста в море идёт короткий причал пониже, с кранцами, утками и двумя оранжево-белыми сваями на конце. Сваи, мостки и состав мастерской — решение без владельца ([Q182](../questions/world.md#q182)).\n- **Живые части** (`Dock._Process`): вымпел полощется по пассату (`Trades.Fluttered`, то же правило у станции), ветряк крутится тем быстрее, чем сильнее ветер. Ночью у каждого фонаря модели горит тёплый ореол (`Daylight.Night`, узлы `Lantern…`); света на настил фонари не бросают.\n- **Настилы и места** (`Dock`): настилы входят в землю для столкновений, снарядов и щупов охотников (`World.Ground`), но не для глубины моря. Мест у причала четыре, по одному на игрока (`Dock.Berths`, `Dock.Berth`): по обе стороны причала, вдоль левого края помоста и у конца причала. Лодки стоят носом к морю. `Dock.Free` находит ближайшее место, где не стоит чужая лодка. Твёрды только настилы и слип: сарай, мачта и корпус на слипе снаряды пропускают.\n- **Швартовка** (`Game.Offered`, `Game.Moor`, `Game.Berthing`, `Game.CastOff` в `Game.Home.cs`): когда лодка сбавила ход ниже `Site.Slow` в пределах кольца швартовки (`Mooring.Reaches`) и рядом нет охотников (`Game.Hunting`), под лодкой встаёт подсказка `Space` «Гавань», а если охотники рядом — «ОХОТНИКИ РЯДОМ». По `Space` лодка сама доходит до ближайшего свободного места и стоит там; корпус и броня целы, бак полон, игра сохранена. Вид боя приближается к причалу (`IsometricCamera.Hold`), HUD уходит, встаёт лента. Мир при этом живёт: бой не останавливается, а охотники, подошедшие на дистанцию боя, снимают лодку с причала с предупреждением «Охотники рядом». «Отчалить» или `Space` возвращают штурвал; лодка стоит носом к морю. Всё это — решение без владельца ([Q179](../questions/interface.md#q179)).\n- **Лента** (`base/Quayside.cs`, `ui/Ribbon.cs`): вдоль низа экрана три прозрачные стеклянные плитки ([Компоненты](../art/components.md)): «Торговец», «Верфь» и справа вдвое шире «Отчалить» с оранжевым светом игрока. Сначала выбрана «Торговец», если в трюме есть ящики, иначе «Отчалить». Курсор или `A` и `D` ведут свет к плитке, подпись над лентой («// что делает» и точки по числу плиток) едет за ним; щелчок или `Enter` открывает, `Tab` открывает верфь, `Esc` — меню. Монеты — в стеклянном кошельке вверху справа. Плитки приходят по очереди и опускаются, когда сверху ложится меню, экран корабела или верфь. Стекло, подпись и движение — решение без владельца ([Q160](../questions/interface.md#q160)).\n- **Корабел**: «Торговец» (значок — стопка монет) открывает экран торговца ([Добыча](../gameplay/haul.md)); закрытый, он возвращает ленту. С пустым трюмом корабел говорит, что на борту ничего нет.\n- **Место швартовки** (`Mooring`, `mooring_ring.gdshader`): у первого места на воде лежит кольцо шириной 16 м из двенадцати стеклянных поплавков на пеньковом лине. Поплавок — шар дутого стекла, трёх оттенков аква и пяти размеров, в ромбической сетке из линя; там, где сетка сходится, лежит латунное кольцо, а в макушку шара утоплен маленький янтарный фонарь-банка под латунной крышкой с солнечной батареей. На каждом четвёртом пророс росток, и каждый поплавок чуть наклонён по-своему. Стекло — свой материал (`Surfaces.Blown`, `common/blown.gdshader`): сплошное, но солнце проходит сквозь него, и сторона от солнца светится цветом стекла; блик на нём один, как отражение окна, и лежит целым поверх стекла и сетки. Поплавки качаются на зыби, расступаются перед корпусом лодки (`SeaSurface.Hulls`) и возвращаются на лине. Тень на море бросает плоская заглушка у ватерлинии: сам шар тени не бросает, иначе затенил бы свою светящуюся сторону. Поплавки лежат только там, куда от середины кольца доходит открытая вода: не под настилом, не на пляже и не по другую сторону причала, так что у причала кольцо — дуга от помоста до причала. В воде шейдер кладёт под кольцом полосу воды глубже цветом (читается над светлой отмелью), мягкий бирюзовый свет под кольцом и под каждым поплавком (читается над глубокой водой и в тени), тёплое пятно под каждым горящим фонарём, светлую линию там, где вода смачивает шар, и рисует линь между поплавками. Пока лодка далеко, фонари не горят; в пределах `Site.Reach` светят вполсилы; когда лодка сбавила ход и можно пришвартоваться, горят ясно и медленно дышат вместе со светом в воде. Когда рядом охотники, фонари гаснут, а свет в воде тускнеет. Фонари ничего вокруг не освещают. На верфи кольца нет. Кольцо ставит каждая машина сама, в кооперативе его видит и гость. Число, размеры и оттенки поплавков, сетка, фонарь-банка, росток, свет и полоса в воде и то же кольцо у станции — решение без владельца ([Q158](../questions/world.md#q158)). Демо `Harbour`.\n- **Товарищи**: в кооперативе лодка товарища у причала — это его лодка в мире: её ведёт хост, и её видит каждая машина ([Онлайн-кооп](../online.md)). Имён над лодками товарищей теперь нет ([Q140](../questions/online.md#q140)).\n\n## Открытые вопросы\n- [Q182](../questions/world.md#q182): мастерская на сваях в лагуне и её состав.\n- [Q179](../questions/interface.md#q179): как лодка швартуется и что происходит у причала.\n- [Q140](../questions/online.md#q140): имена над лодками товарищей.\n- [Q158](../questions/world.md#q158), [Q160](../questions/interface.md#q160).\n\nСм. также: [Верфь](boatyard.md), [Экраны и меню](../interface/screens.md), [Онлайн-кооп](../online.md).\n"}, {"id": "base-testing-ground", "path": "base/testing-ground.md", "title": "Полигон", "section": "base", "date": "2026-11-13", "md": "# Полигон\n\nПолигон — место у гавани, куда «Испытать» на верфи выводит лодку проверить в деле.\n\n## Решения владельца\n- «Испытать» на верфи выводит лодку на полигон у гавани и после него возвращает на верфь. Его мишени-макеты — фанерные макеты лодок на пластиковых бочках, жёлто-чёрные с белым номером. Некоторые ходят кругами; ни одна не стреляет. Потопленная мишень через некоторое время снова поднимается из моря в пене. Топлива там лодка не жжёт, а потопленная сразу снова на воде. Появляются только припасы.\n\n## Как устроено\n«Испытать» (T) на верфи выводит лодку на полигон у гавани (`Game.Try` в `Game.SettingOut.cs`, `range/TestingGround.cs`). Полигон оформлен как своя миссия (`TestingGround.Mission`, `Play` равен `\"range\"`) в том же мире Арены, мористее пирса. Выход на полигон очищает море (`Game.ClearSea`): заход на Арене кончается, охотников, мест промысла и кольца швартовки на полигоне нет. Игра сохраняется.\n`TestingGround` ставит шесть мишеней-макетов (`Designs.Dummy`, корпус вне списков верфи, `Outfit.Mockup`) впереди и мористее старта: четыре стоят на якоре бортом к нему, две ходят по кругу. Они на отдельной стороне (`TestingGround.Side`), враги для каждого игрока, и ничего не стреляют. Мишень, ушедшая под воду, снова поднимается на своём месте (`Boat.Raise`) до того, как мир её отпустит, а потопленная лодка игрока поднимается сразу на старте. Почему поднимается, а не выводится заново: зеркало гостя хранит ту же лодку. Поднявшаяся лодка выходит из моря в кипении пены (`Boat.Rise`, `Afloat`), и пока она не поднялась, её никто не таранит. Цель на HUD — «Потопите макеты» со счётом потопленных. Вернуться можно только «На базу» в меню Esc, без предупреждения: оно открывает верфь (`Game.Home`). Плитка «На арену» после этого начинает новый заход со старта Арены ([Арена](../gameplay/missions.md)). Бак остаётся полным; припасы появляются, как в море ([Q76](../questions/missions.md#q76)).\n\nСм. также: [Верфь](boatyard.md).\n"}, {"id": "decisions", "path": "decisions.md", "title": "Журнал решений", "section": "", "date": "2026-11-13", "md": "# Журнал решений\n\nКрупные решения владельца по датам, с отвергнутым и откаченным, чтобы не повторять. Само решение — на странице темы; здесь только когда и почему. Почти всё сделанное с конца октября 2026 владелец ещё не играл.\n\n## Октябрь 2026\n- **10-15** Игра должна играться: всё встраивать в живую игру, настоящий прототип, а не «текст и кнопки».\n- **10-26** Симулятор архипелага снят целиком; вся игра — аркадный морской бой: статичный изометрический вид, одна лодка без физики, но с ощущением моторной лодки, огонь с бортов на `Q`/`E`. «Ощущается потрясающе». Старая игра хранится под git-тегом `simulator-game`. → [Об игре](vision.md)\n- **10-26** Лодку собирают из деталей на верфи; вес важен; красивый экран характеристик; без свободных корпусов и многокорпусных. Нарисованный корпус — это физический корпус. → [Верфь](base/boatyard.md)\n- **10-26** Один остров на банке с мелководьем рядом, чтобы море было красивым. → [Море](world/sea.md)\n- **10-26** 60 кадров в секунду достаточно, качество важнее. → [Об игре](vision.md)\n- **10-26** Отвергнуто: глиссирование, поднявшее корпус, — пропало «прыгание по волнам», откачено; корпуса едут по кильватерам. 10-31: это весело, но не опора игры.\n- **10-26** Отвергнуто: тёмные стеклянные карточки интерфейса — «безлико, как сгенерировано ИИ». → [Арт-дирекшн](art/README.md)\n- **10-27** Делать, как делают игры: сначала выпущенные игры и самый простой подход, симуляции и статьи — только когда простого не хватает. → [CLAUDE.md](../CLAUDE.md)\n- **10-27** Отвергнуто: погода (туман, дождь, шторм, гром) построена и снята целиком. → [Q6](questions/world.md#q6)\n- **10-27** Отвергнуто: лор с придуманными словами — откачен; владелец выбирает лор по кускам. → [Сеттинг и лор](story/setting.md)\n- **10-28** Настоящие моторные лодки вместо коробок на плите. → [Облик лодок](art/boats.md)\n- **10-28** Ракеты на открытых рельсовых стойках, прямые и быстрые. Раньше плоские выстрелы были «слишком быстрыми», потом были дуговые шары. → [Бой](gameplay/combat.md)\n- **10-28** Пена симулирована и принадлежит воде; брызги урезаны как «чрезмерные». → [Облик мира](art/world-look.md)\n- **10-28** Звук — слои записей CC0 с Freesound; список загрузок одобряет владелец. → [Звук](audio/sound.md)\n- **10-29** Каждая деталь — лучший выбор для какой-то лодки; детали, худшие во всём, убраны. Вес стоит скорости. → [Лодка](gameplay/boat.md)\n- **10-29** Демо и проверки в `game/demos`; игра ничего не несёт для тестов. → [Демо](tools/demos.md)\n- **10-29** Сборки для Mac и Windows, версия на каждый пост. → [Сборки и посты](tools/release.md)\n- **10-29** Отвергнуто: образец HUD из авиасимулятора снят. → [Стиль интерфейса](art/interface.md)\n- **10-30** Отвергнуто: усиленные стилизованные кильватерные волны — «выглядят плохо», откачены. → [Арт-дирекшн](art/README.md)\n- **10-30** Охотники: таранщики, торпеды, стаи, припасы, дым, один ИИ-планировщик на всех. → [Охотники и ИИ](gameplay/hunters.md)\n- **10-31** Миссии, а не открытый мир; топливо ограничено; база — эллинг из Blender, с неё начинается игра. Отвергнуто: первая база, жёлтый дом с красной крышей. Миссии сменила арена 11-09, эллинг — пирс 11-10. → [Арена](gameplay/missions.md), [Пирс](base/pier.md)\n- **10-31** Миссия начинается в море, со вступительного пролёта низко у борта. Пролёт снят 11-11. → [Миссии](gameplay/missions.md)\n- **10-31 — 11-01** Лунная ночь и тёплый рассвет. → [Свет и время суток](art/light.md)\n\n## Ноябрь 2026\n- **11-01 — 11-02** Места промысла с видом сбоку; редактор карт с картами в JSON. → [Места промысла](gameplay/sites.md), [Редактор карт](tools/map-editor.md)\n- **11-02** Гоночные ливреи, банда охотников в малиновом, рубки и приметы соларпанка. → [Облик лодок](art/boats.md)\n- **11-02** Интерфейс — вещи мира; образцы Frutiger Aero и Utopian Scholastic. → [Стиль интерфейса](art/interface.md)\n- **11-02** Сеттинг назван: оптимистичный соларпанк после падения. → [Сеттинг и лор](story/setting.md)\n- **11-02** Посты в канале по-русски, каждый одобряет владелец; вышла 0.0.2. → [Сборки и посты](tools/release.md)\n- **11-03** Название — Floppa Tropical Adventures. Все жители — флоппы. → [Люди: флоппы](art/people.md)\n- **11-03** Кампании пока нет; детали покупают за монеты; пустой бак проваливает миссию (снято 11-09); без тепловизора дым прячет цели; автосохранение. Отвергнуто: открытие деталей с каждых обломков. → [Прогресс и сохранения](gameplay/progression.md)\n- **11-03** Музыка на семплах инструментов CC0. → [Музыка](audio/music.md)\n- **11-04** Все замечания QA по интерфейсу исправлены, добавлен геймпад. → [Управление](interface/controls.md)\n- **11-04** Простейший кооп по локальной сети. → [Онлайн-кооп](online.md)\n- **11-06** Никто из флопп ничего не держит в лапах. → [Люди: флоппы](art/people.md)\n- **11-06** Голос — кошачий лепет на каждую букву, а не речь; анимированные метки текста. → [Диалоги и голос](story/dialogue.md)\n- **11-06** Сюжет — сцены во встроенном редакторе: граф и сценарий, ветки, условия, приоритеты, триггеры. → [Сцены сюжета](story/scenes.md)\n- **11-06** Топливо считается расстоянием, лимита скорости нет, броня — броневой пояс на своём месте верфи, торпедные аппараты под водой. → [Лодка](gameplay/boat.md)\n- **11-06** Директор шлёт набеги в затишья по бюджету угрозы. → отменено 11-11\n- **11-06** Зоны и опасности на картах. → [Зоны и опасности](world/areas.md)\n- **11-06** Полигон у базы с мишенями-макетами. → [Полигон](base/testing-ground.md)\n- **11-06** Горы, барьерные рифы, морские столбы, косы и отмели. → [Рельеф](world/ground.md)\n- **11-06** Мир — как на картинках меню. → [Облик мира](art/world-look.md)\n- **11-06 — 11-07** Отвергнуты все облики меню с картинок, громкие и утончённые. → [Арт-дирекшн](art/README.md)\n- **11-07** Никаких картинок, сгенерированных ИИ. → [Арт-дирекшн](art/README.md)\n- **11-07** Страница настроек и русский перевод. → [Язык](interface/language.md)\n- **11-07** После игры: вид слишком близко, открытое море бледное — зум и тон возвращены. → [Q77](questions/world.md#q77)\n- **11-07** Пять новых стилей игры: преследователь, турельщик, носитель дронов, минёр, загонщик; без подлодки и без медленного танка. → [Сборки и стили игры](gameplay/builds.md)\n- **11-07** Облик всей игры заново, от геймплея: шесть обликов на стенде. Владелец ещё не выбрал. → [Кандидаты на облик](art/candidates.md)\n- **11-08** Документация переехала в эту вики, по-русски; `docs/` убран. → [Главная](README.md)\n- **11-08** Сеть за кормой заменена трюмом, как рюкзак в шутерах с выносом добычи: сетка клеток по корпусу, предметы ложатся сами, защищённого контейнера нет. Сетку сменили ящики 11-11. → [Добыча](gameplay/haul.md)\n- **11-08** Вступительный пролёт быстрый, 2–3 секунды, с целью миссии под названием; карточки врагов убраны 11-10, сам пролёт — 11-11. → [Миссии](gameplay/missions.md)\n- **11-09** Вид следует за лодкой, а в аренах стоит над ареной, и миссия проигрывает вставки по кадрам из редактора карт; лодка несёт снаряжение по размеру корпуса; крафта нет, детали только покупаются; в коопе товарищ возвращает потопленную лодку у обломков, а меню паузы онлайн не останавливает бой. → [Камера и картинка](gameplay/camera.md), [Лодка](gameplay/boat.md), [Прогресс и сохранения](gameplay/progression.md), [Онлайн-кооп](online.md)\n- **11-09** Уровней и выбора уровня нет, торговой точки тоже: в эллинге одна кнопка «На арену», она начинает единственный уровень. Монеты остаются и покупают детали в верфи, добыча продаётся сама на квитке по возвращении домой. → [Пирс](base/pier.md), [Прогресс и сохранения](gameplay/progression.md), [Добыча](gameplay/haul.md)\n- **11-09** Основное оружие — турель, она стоит на стартовой лодке; ракеты — дополнение, покупаются в верфи. → [Бой](gameplay/combat.md)\n- **11-09** Дельфины убраны из игры: модель, код и демо. → [Об игре](vision.md)\n- **11-09** Арена — один большой уровень и бесконечный заход, внутри случаются события из прежних видов миссий (конвой, курьер, маяки, груз, броненосец); кончается выходом или гибелью, добыча продаётся на квитке. → [Арена](gameplay/missions.md)\n- **11-09** Крюка нет: владелец убрал крюк, лебёдку и буксир. → [Лодка](gameplay/boat.md)\n- **11-09** Ракеты и торпеды наводит курсор в веере своего борта, щелчок стреляет бортом под курсором; клавиши смены захвата нет. Мышь снята 11-10: точку прицела даёт правый стик. → [Бой](gameplay/combat.md)\n- **11-09** Ракеты врагов летят медленнее ракет игрока, чтобы от них уворачиваться; удар носом на нитро — приём любой лодки. → [Бой](gameplay/combat.md)\n- **11-09** Пустой бак больше не проваливает поездку: лодка ползёт домой с добычей. Вес добычи не наказывает за полный трюм. → [Лодка](gameplay/boat.md), [Добыча](gameplay/haul.md)\n- **11-10** База — открытый пирс в лагуне вместо эллинга; база и верфь на лентах плиток, как гараж NFS, без предметов и значков для щелчка; лодки товарищей по кооперативу стоят у того же пирса. → [Пирс](base/pier.md), [Верфь](base/boatyard.md)\n- **11-10** Ракету парируют ракетой; нитро — рывок, которым уходят от ракет, крутой, а не правдоподобный. → [Бой](gameplay/combat.md), [Лодка](gameplay/boat.md)\n- **11-10** Соперников в игре нет; у каждого врага случайное лицо. → [HUD](interface/hud.md)\n- **11-10** Открытый мир вместо «хаб + миссии»: игра по умолчанию сразу начинается в море на арене, а база — это гавань (пирс) на острове, к которой нужно доплыть и пришвартоваться на `Space`; буи выхода убраны из игры, выход из гавани возвращает лодку от пирса в то же живое море, а гибель показывает «Погиб» и перезагружает последнее сохранение. → [Арена](gameplay/missions.md), [Пирс](base/pier.md), [Добыча](gameplay/haul.md)\n- **11-11** В море стоит плавучая торговая ботаническая станция, большой корабль по картинке владельца, смоделированный в Blender; у неё продают добычу; её стёкла прозрачные, новый материал для игры. Этим отменено «торговой точки нет» от 11-09 в части места в море. → [Станция](world/outpost.md)\n- **11-11** Директора нет: охотники выходят только с постов, поставленных на карте, их виды выбирают в редакторе; охотник гонится за лодкой, пока видит её, и забывает, когда она ушла из вида. → [Зоны и опасности](world/areas.md), [Охотники и ИИ](gameplay/hunters.md)\n- **11-11** Разовые расходники, собранные из добычи в трюме, и панель быстрого доступа на 1–4; детали по-прежнему только покупаются. → [Добыча](gameplay/haul.md), [Управление](interface/controls.md)\n- **11-11** Вступительной сцены нет: заход сразу начинается в виде боя, руль у игрока, HUD на месте, охотники живы. → [Арена](gameplay/missions.md)\n- **11-11** Стрелок вокруг лодки на HUD нет: HUD не указывает на то, что за экраном. → [HUD](interface/hud.md)\n- **11-11** У ракет и снарядов предельная дальность: на краю досягаемости заряд гаснет в воздухе, дальше ничего не летит. → [Бой](gameplay/combat.md)\n- **11-11** Место швартовки отмечено цветным медленно танцующим светом на воде, как маркеры миссий Vice City, вместо пунктирного круга HUD. Сменён поплавками 11-12. → [Пирс](base/pier.md)\n- **11-11** Ящики вместо сетки: экран трюма и сетка ушли, добыча — несколько видов ящиков в ряду слотов на HUD, расходники тратят ящики клавишами 1–4, полный трюм сам меняет дешёвое на дорогое, утонув, теряешь всё. Отменяет сетку от 11-08 и «HUD не показывает счёта добычи». → [Добыча](gameplay/haul.md), [HUD](interface/hud.md)\n- **11-11** Интерфейс — прозрачное стекло Frutiger Aero с красивым движением, начиная с кнопок базы; у игры официальная палитра и базовые компоненты. → [Арт-дирекшн](art/README.md), [Палитра](art/palette.md), [Компоненты](art/components.md)\n- **11-12** Место швартовки — кольцо стеклянных поплавков с тёплыми фонарями: неоновый свет владелец увидел и отверг как слишком яркий, пёстрый и неестественный. → [Пирс](base/pier.md)\n- **11-12** Стекло идёт дальше плиток базы: меню, карточки деталей верфи и HUD. → [Компоненты](art/components.md), [HUD](interface/hud.md), [Экраны и меню](interface/screens.md)\n- **11-12** Облик интерфейса живёт в одной теме Godot (`game/ui/look.tres`): палитра, шрифты, роды стекла, размеры деталей; его меняют там, а не переносят по частям. Стекло чуть менее прозрачно. → [Компоненты](art/components.md), [Палитра](art/palette.md)\n- **11-12** Цель игры — сюжетная линия поручений флопп в гавани и на станции: по одному разом, выполненное открывает следующее, новые детали и места, в конце финальный босс; первое поручение — обучение по рации. Сложность одна: её задаёт мир (слабые посты у гавани, сильные дальше), в коопе посты крепнут с числом игроков; у старта новой игры слабый пост. «Арена» и «заход» переименовываются везде (плитка «В море», мир — мир). → [Об игре](vision.md), [Прогресс и сохранения](gameplay/progression.md), [Сцены сюжета](story/scenes.md)\n- **11-12** Станция покупает добычу дешевле гавани и продаёт ремонт и топливо за монеты, деталей не продаёт. → [Станция](world/outpost.md)\n- **11-12** Бой: гонщик, преследователь и таранщик остаются на 22–23 м/с; ракеты врагов быстрее (около 55 м/с на ходу), увернуться было слишком легко; неуязвимость в рывке нитро только у лодок игроков; таран снимает с целой лодки не больше половины корпуса; турель игрока бьёт по захваченной цели, пока та в радиусе, иначе по ближайшей; припасы падают реже, раз в ~40 с. → [Бой](gameplay/combat.md), [Лодка](gameplay/boat.md), [Припасы](gameplay/pickups.md), [Охотники и ИИ](gameplay/hunters.md)\n- **11-12** В стекло переходят диалог (ответы списком, как меню, имя мелкой подписью), циферблат рыбалки и экран показателей верфи; стекло HUD остаётся без преломления. → [Компоненты](art/components.md), [HUD](interface/hud.md)\n- **11-12** Тема одна на всё: каждая деталь интерфейса, диалог тоже, берёт облик из `look.tres`; прежние решения о виде отдельной детали исключением не служат. → [Компоненты](art/components.md)\n- **11-13** Вся бумага интерфейса становится стеклом: бумажных вещей, скотча и рукописного шрифта в нём не остаётся. Карта — прозрачное стекло с линиями света; судовой журнал — окно матового стекла со строками. Заменяет «интерфейс из вещей мира» (11-02). → [Компоненты](art/components.md), [Стиль интерфейса](art/interface.md)\n- **11-13** Продажа — экран торговца, как в играх о рыбалке и торговле с лодки: слева торговец с короткой репликой в стеклянной выноске (в гавани корабел, на «Марии» мытарь), справа трюм ящиками с ценами; ящик продаётся выбором, есть «Продать всё», непроданное остаётся на борту и продаётся позже с плитки «Торговец» на ленте причала. Итог захода не показывается. → [Добыча](gameplay/haul.md), [Станция](world/outpost.md)\n- **11-13** Дорожная карта до полного релиза в Steam, планка — 90 на Metacritic. Порядок этапов: что это за игра; срез и рядом с ним чужие машины и страница Steam; демо; ранний доступ; релиз 1.0. Что внутри этапов и сроки — пока предложение. → [Дорожная карта](roadmap.md)\n- **11-13** Гавань на острове — не хаб, а место открытого мира: мастерская корабела на сваях (сарай, слип, лебёдка, топливная колонка, один короткий причал), дерево и немного соларпанка, сигнальная мачта с вымпелом и фонарём. Экрана базы нет: пришвартованная лодка остаётся в мире, над морем лента «Торговец», «Верфь», «Отчалить», а кооператив, журнал и настройки — в меню `Esc`. Сменено: пирс с четырьмя местами и экран базы с плиткой «На арену» (11-10). → [Гавань](base/pier.md), [Экраны и меню](interface/screens.md), [Онлайн-кооп](online.md)\n"}, {"id": "gameplay-boat", "path": "gameplay/boat.md", "title": "Лодка", "section": "gameplay", "date": "2026-11-12", "md": "# Лодка\n\n![Лодка игрока вблизи](../img/boat.jpg)\n\nЕдинственная лодка игрока: как она управляется, плавает, горит топливом и что на неё ставят. Числа корпусов, моторов и брони — в [Балансе лодок](../balance/boats.md).\n\n## Решения владельца\n- Лодка кренится в повороте слабо (2026-11-10): крен каждого корпуса (`Feel.Lean`) срезан вдвое.\n- Никакой физики, но весёлое ощущение управления катером.\n- Она управляется как твёрдое тело, толкаемое в точках корпуса, по образцу 2D-машины Пэта Керра (patkerr.co.uk/2d-vehicles), а не чистым сглаживанием.\n- Перевёрнутая лодка выпрямляется, против физики, если нужно, как аркады переворачивают машину обратно на колёса.\n- Она едет по волнам — своим и чужим следам.\n- Несколько типов лодок: простые катера, от самых примитивных. В каждый должно быть круто запрыгнуть и управлять им.\n- Вес важен: у каждой детали есть масса, и лодка держится на воде, дифферентуется, встаёт и управляется по ним. Вес стоит скорости, как на настоящем глиссирующем катере.\n- Ничто не ограничивает скорость лодки: чем безумнее, тем лучше.\n- Крюка нет: владелец убрал крюк, лебёдку и буксир 2026-11-09.\n- Стоящая лодка разворачивается на месте одним рулём, без газа.\n- Каждая деталь — лучший выбор для какой-то лодки: деталь, во всём хуже другой, убирается.\n- Никаких свободных корпусов и многокорпусных лодок; крайние проекты не требуют особой обработки.\n- Нитро — рывок (2026-11-10): нажатие на Shift бросает лодку вперёд, и рывком уходят от ракет. Он должен быть крутым и весёлым, а не правдоподобным. Заряд восстанавливается со временем. Охотники тоже его жгут.\n- Топливо ограничено: лодка несёт только свой бак. Оно сгорает по пройденному пути, а не по времени: лодка, стоящая на месте или идущая накатом, не жжёт ничего.\n- Снаряжение добавляет приём: таран ([Бой](combat.md)), дым, сбивающий охотнику прицел, помпа, чинящая корпус в море, плотники, которые латают его за каждую лодку, которую она топит ([Бой](combat.md)).\n- Прицел, установленный на лодку, показывает корпуса сквозь дым силуэтами. Без него дым скрывает охотников от захвата цели игрока и от HUD.\n- Посадка на мель не вредит.\n- У брони в верфи есть собственное место, как у мотора, и она не занимает станцию: пояс клёпаных стальных плит, изогнутых по корпусу вдоль обоих бортов по ватерлинии; платится весом и монетами. Плита, принявшая свои попадания, падает в море, и лодка становится легче и быстрее.\n- Лодка несёт снаряжение по размеру корпуса: малый корпус одну деталь, больший больше.\n- Охотник, затонувший на мелководье, лежит на дне до конца захода: обломки для захвата ([Места промысла](sites.md)).\n- У каждого корпуса свой бак, у каждого мотора свой расход; охотники топлива не жгут. Топливо встречается и припасом ([Припасы](pickups.md)). Пустой бак не кончает заход (2026-11-09): лодка игрока ползёт домой малым ходом, с добычей и без нитро.\n\n## Как устроено\n- **Проекты** (`Parts`, `Design`, `Designs`, `Build`): корпус, мотор, деталь или ничего на каждой палубной станции, снаряжение или ничего и броня или ничего, у каждого масса и цена в монетах. `Build.Of` ставит каждую деталь на корпус так, чтобы лодка плавала, как нарисована; проект, который затонул бы, отвергается (`Build.Fault`).\n- **Направление** (`Launcher.Facing`, `DeckPart.Fits`): пусковая установка смотрит в какую-то сторону: поперёк (стойки, трубы) или вперёд (носовые стойки). Деталь предлагается только на тех станциях, куда она подходит. Носовые стойки стреляют вперёд с обеих сторон форштевня, их потоки пересекаются впереди: Q — левая, E — правая. Рулетка показывает их как отдельный вид. `Boat.Covers` говорит, достаёт ли какая-нибудь установка до точки.\n- **Модели** (`Part.Model`, `PartModel`, `Figure.Piece`): деталь может быть нарисована по модели, сделанной в Blender по скрипту в `tools/`; `Layout` ставит её туда, куда идёт её станция или снаряжение, на основание твёрдого тела, по которому бьют снаряды, а ливрея её отделывает.\n- **Снаряжение** (`GearPart`, `Design.Gears`, `HullPart.GearPlaces`, `Layout.Gear`): его вид размещает, взвешивает и рисует его: управление огнём, таран, помпа, дымогенератор, плотницкий лес. У корпуса столько мест снаряжения, сколько в `GearPlaces`: от одного у малых до трёх у канонерки и броненосца, охотники и макет без своих мест. Деталь каждого вида на лодке одна; места не обязаны быть заняты. Каждая деталь занимает ближайшее место, свободное от мотора, деталей станций и деталей снаряжения, поставленных раньше, как это делает оснастка. Всё, что читает снаряжение лодки (дым, помпа, таран, плотники, управление огнём, цена и вес), читает все её детали (`Design.Has`). Старый проект и старая карта с одной деталью читаются как проект с ней на первом месте (`Progress.Saved.Gear`, `Design.Names`). Числа мест временные, решение без владельца ([Q8](../questions/boat.md#q8)).\n- **Броня** (`ArmourPart`, `Belt`): пояс клёпаных стальных плит, изогнутых вдоль обоих бортов по ватерлинии, со своим местом в верфи. Он добавляет долю к числу попаданий корпуса, каждая плита — равную долю их и стали пояса ([Q30](../questions/boat.md#q30)). Патрульный катер носит лёгкий пояс, канонерка и броненосец — тяжёлый.\n- **Тепловизор** (`DeckKind.Sight`, `Boat.Thermal`): палубная деталь, занимающая станцию, которую заняла бы пусковая установка. Лодка с ним видит сквозь дым (`Screens.Sees`), а лодка игрока с ним рисует каждый корпус, который скрывает дым, как глянцевый силуэт (`ui/Silhouettes.cs`, `silhouette.gdshader` на `glow_glass.gdshaderinc`). Зачем станция, а не снаряжение: места снаряжения считаны, а лодка с дымом ещё и несёт дым.\n- **Корпуса** (`HullForm`, `ShipClass`, `Stability`, `BoatModel`): одно параметрическое тело даёт объём, центры и метацентр, и корпус рисуется по нему как настоящий катер ([Q11](../questions/world.md#q11)).\n- **Под водой** (`BoatModel.Lie`, `common/surface_shading.gdshaderinc`): корпус затеняется под водой по высоте моря у миделя, как это читает его мореходность, так что лодка во впадине не рисуется мокрой.\n- **Управление** (`Manoeuvring`, `Handling`, `Afloat`): твёрдое тело, толкаемое в точках корпуса. Корпус цепляется против бокового хода, так что скользит на поворотах. С закрытым газом руль крутит лодку на месте вокруг центра тяжести, с той долей поворота, что у мотора на месте (`TurnAtRest`); привод перехватывает поворот, когда лодка набирает ход. Максимальная скорость растёт как корень из мощности, делённой на вес, так что каждая тонна стоит скорости, как в вышедших играх с весом сборки. Ничто её не ограничивает ([Q20](../questions/boat.md#q20)).\n- **Нитро и брызги** (`Nitro`, `RoosterTail`, `Spray`, `BowSheets`): нажатие тратит половину шкалы на рывок: лодка разом получает скорость вперёд (`Nitro.Kick`), и полсекунды мотор тянет с умноженной мощностью; удержанная клавиша второй раз не рвёт. Пока рывок горит (`Nitro.Lit`), ракеты и снаряды проходят сквозь лодку (`Projectile.Meets`), у охотников тоже: решение без владельца, [Q146](../questions/boat.md#q146). Привод в рывке бросает петушиный хвост ([Q9](../questions/boat.md#q9)). Зачем брызги: это то, что лодка на полной мощности бросает, как в аркадных гонках на катерах. Брошенная вода летит комьями и всплесками и пенит море там, где падает. `BowSheets` бьют струями из каждого сечения корпуса в зависимости от того, как быстро его днище погружается.\n- **Мореходность** (`Seakeeping`, `WakeUnder`): теория полос: вертикальная, килевая и бортовая качка от давления воды на сечения, срезанные вдоль корпуса, со слемингом и глиссирующим подъёмом. Вода — это волны плюс следы каждого корпуса, так что корпус едет на своей носовой волне и перепрыгивает следы. Перевёрнутая лодка выпрямляется, если крен превышает метацентрическую высоту при нём, как аркады переворачивают машину обратно; вне воды её дифферент выравнивается, как в аркадных гонках, так что прыжок никогда не кончается на спине. Демпфирование берётся неявно, чтобы оно не могло сбросить корпус с моря. Зачем фиксированный такт и сдвиг корпусов: чтение моря — большая часть цены корпуса; всё остальное, что плавает на этой воде, берёт свои отсчёты, переносимые между тактами (см. [Охотники и ИИ](hunters.md)).\n- **Видимые и невидимые** (`Boat.Seen`, `camera/Sight.cs`): невидимая лодка не бросает брызг, но всё равно едет на каждом такте, так как корпус, читаемый реже, подпрыгивал бы при появлении в кадре. Зачем: брызги — самая большая статья расходов лодки, а игры отсекают то, что вне экрана.\n- **Осадка и контакт** (`ShipClass.Settling`, `Afloat`, `Contact`): корпус, не выдержавший, тонет и переворачивается, а на мелководье лежит на грунте до конца захода. Корпуса встречаются тестом разделяющих осей по своим ватерлиниям (`Touch`). `Contact.Ground` делает грунт таким же твёрдым, как другой корпус; посадка на мель не вредит.\n- **Топливо** (`ships/Fuel.cs`, `Design.Range`): у каждого корпуса свой бак в литрах (`HullPart.Tank`), у каждого мотора свой расход в литрах на километр (`EnginePart.Burn`); дальность полного бака — их отношение. Бак опустошается по тому, как мотор ведёт лодку, так что лодка, идущая накатом или стоящая, не жжёт ничего; насухо лодка игрока идёт на доле газа, а нитро закрыто (`Player.Limp`); доля — решение без владельца, [Q137](../questions/boat.md#q137). Охотники не жгут ничего. Когда топливо уходит в запас (`Fuel.Reserve`), HUD предупреждает: «Мало топлива», «Идите в гавань». Числа бака и расхода — временные, решение без владельца ([Q8](../questions/boat.md#q8)); стартовый ялик с подвесным мотором идёт 6 км, как шёл при едином баке. Верфь показывает дальность строкой «Запас хода» на экране статистики, бак и расход — в строке детали.\n\nОблик лодок (ливреи и оснастка) описан в [Облик лодок](../art/boats.md).\n"}, {"id": "gameplay-builds", "path": "gameplay/builds.md", "title": "Сборки и стили игры", "section": "gameplay", "date": "2026-11-13", "md": "# Сборки и стили игры\n\nСборки — это разные способы играть, которые игрок собирает из деталей в верфи.\n\n## Решения владельца\n- Сборки играются по-настоящему по-разному, каждая из деталей, купленных в верфи:\n  - Бортовой залп: борт, выведенный на цель на параллельном курсе.\n  - Преследователь: две короткие ракетные рейки у форштевня, стреляющие вперёд, наводимые поворотом на врага.\n  - Турельщик: круглые двуствольные турели, которые поворачиваются и стреляют сами по ближайшему врагу, пока игрок только ведёт.\n  - Носитель дронов: маленькие безэкипажные морские дроны, бегущие по воде, кружащие вокруг врага и стреляющие ракетами; Q и E посылают и отзывают их. Дрон не стреляет, пока его носитель лежит на линии огня.\n  - Минёр: чёрные шаровые мины со светом цвета стороны сверху, сбрасываемые за корму, взводящиеся через мгновение и взрывающиеся под любым другим корпусом.\n- Ни одна сборка не является простым медленным танком: одно только принятие ударов — не способ играть.\n- Никакой подлодки, ни как корпуса, ни как способа играть: под синим морем её не видно с камеры, а над банкой в 5 м она не может нырнуть. Нырок на две-три секунды, как снаряжение, может появиться позже.\n\n## Как устроено\nДроны — маленькие лодки на собственном корпусе (`Drone`), стороны своего носителя, под капитаном с ролью `Wingman`. Люлька держит двух, по одному на борт. Когда дроны есть в рулетке, Q посылает левого на цель захвата, а E правого; повторное нажатие отзывает его. Потерянный дрон отстраивается на борту, а принятый на борт чинится. Крыло (`Wing`) хранит упоры, выводит дрон в море у кормовой четверти носителя, шагает капитанами на хосте, стреляет их залпами и принимает их на борт.\n\n- **Люлька**: каждый упор готов, вышел, чинится или отстраивается, как говорит `Wing.State`; лампы рулетки показывают это, а `Cradles` рисует неподвижный дрон в каждом упоре, где он есть. Твёрдое тело люльки — место обоих дронов; она предлагается только там, где они целиком лежат в кокпите, вдали от мотора и других деталей (`Layout.Fits`, который делят верфь и каталог). `Wing.Toggle` — нажатие клавиши: готовый дрон посылается на цель захвата или на ближайшего врага впереди траверза, иначе он охраняет; вышедший отзывается. Гость видит, сколько дронов вышло, но не из какого упора.\n- Вышедший без цели дрон кружит вокруг носителя вдали от его корпуса и берёт ближайшего враждебного, подошедшего близко.\n- Посланный на цель (`Wing.Send`), он влетает и стреляет по траверзу, как лодка роя, проходит дальше и заходит снова. Пока стойки заряжаются, он держит своё место: оно лежит по дальнюю от носителя сторону цели и качается по этой половине (`Wingman.Slot`), так что носитель не стоит на его линии (решение без владельца, [Q138](../questions/combat.md#q138)).\n- Цель, которая держится дальше, чем дрон может уйти от носителя, он не бросает: выходит к краю своей досягаемости и идёт поперёк линии на цель заряженным бортом к ней, пока не выстрелит. Со своего места он тоже стреляет, когда борт смотрит на цель (решение без владельца, [Q188](../questions/combat.md#q188)).\n- **Ход с носителем** (`Wingman.Handle`): всё, что дрон делает, он делает поверх хода носителя. Его ход от носителя наружу тает, не доходя до поводка, и считается от места, где дрон окажется, пока развернётся; так поводок не рвётся. Против хода носителя дрон не идёт: он сбрасывает ход и даёт носителю уйти вперёд, а возвращается, набирая ход, без разворота. Когда нужный курс далеко от носа, он закрывает газ и крутится на месте рулём, потом даёт ход; лишний ход гасит задним. Зачем: дрон поворачивает тягой, на малом газу он шёл широкой дугой, и носитель уходил.\n- Отозванный (`Wing.Recall`) или при последнем попадании он идёт к кормовой четверти носителя. Близко к любому борту, на любом ходу, крыло берёт его в руки: он подводится вплотную к своему упору по кривой в системе носителя, кинематически и вне контакта (`Drone.Passes`), затем поднимается на борт, как шлюпбалкой (`Cradles`). Зачем: игры стыкуют истребители так; дрон, поворачиваемый тягой, не наведётся на причал.\n- Потопленный носитель затапливает свои дроны. Дрон не берёт припасов.\n- Это лодки, поэтому гость отражает их, как любую лодку; они никогда не считаются лодками игроков.\n\n`Senses.Assign` отдаёт капитану цель снаружи, так что цель дрона выбирает крыло, а не его собственные чувства. Дрон не держит расстояния от носителя (`Senses.Escort`).\n\n## Как выбирали сборки\n- В ноябре 2026 владелец попросил не менее пяти по-настоящему разных способов играть, собираемых в верфи, и никакого медленного танка. Затравкой были автоматические турели, дроны, огонь с носа и носитель дронов; владелец спросил о подлодке и минёре.\n- Исследование вышедших игр дало каждому способу свой основной глагол: бортовой залп выводит борт на цель на параллельном курсе; преследователь направляет нос и целит поворотом; турельщик только ведёт, пока стреляют его турели; носитель дронов посылает и отзывает крыло; минёра преследуют, и он ведёт преследователей над своими минами. Шестой, загонщик, держался на крюке и ушёл вместе с крюком 2026-11-09.\n\nОружие описано в [Бой](combat.md).\n"}, {"id": "gameplay-camera", "path": "gameplay/camera.md", "title": "Камера и картинка", "section": "gameplay", "date": "2026-11-13", "md": "# Камера и картинка\n\nВид на бой: фиксированная изометрия, зум и разрешение, в котором рисуется мир.\n\n## Решения владельца\n- Статичный 2.5D изометрический вид: фиксированный азимут и наклон, чуть круче изометрического, как мир показан на картинах меню.\n- Игрок приближает и отдаляет, только зум: камера остаётся на месте. Бой начинается отдалённым, примерно в пятнадцать корпусов лодки поперёк кадра.\n- Вид следует за лодкой. В кругах, которые карта размечает как арены, он вместо этого стоит неподвижно над ареной, а при входе играется короткая вставка по кадрам, заданным в редакторе карт.\n\n## Как устроено\n- **Вид** (`camera/IsometricCamera.cs`): наклон чуть круче изометрического, издалека, через узкое поле зрения, глядя немного левее солнца, чтобы блики лежали вдали от HUD. Земля, вставшая между камерой и лодкой, за которой она следует, растворяется дизерингом вокруг лодки (`camera/seethrough.gdshaderinc`), как изометрические игры вырезают то, что закрывает игрока; тени сохраняют свою форму. Вид верфи так же растворяет пирс перед лодкой (`common/surface_cut.gdshader`). Что и откуда резать, говорит вид, который сейчас показан (`camera/Cutaway.cs`): вид боя режет только землю, выше двух метров, вид верфи — только пирс, до воды; пирс в виде боя и дно под пирсом на верфи остаются целыми.\n- **Арена** (`areas/Area.cs` `Arena`, `areas/Arenas.cs`): круг карты. Пока лодка игрока в нём (с запасом 8 м на выход, чтобы лодка на кромке не дёргала вид), вид перестаёт следовать за лодкой и стоит над серединой круга; зум игрока работает и в арене, но не ближе, чем нужно, чтобы круг поместился в кадр с запасом (`IsometricCamera.Hold`); круг шире примерно 170 м не помещается и в самом широком поле. Выйдя, вид возвращается к лодке тем же плавным шагом, каким следует. Меняется только вид игрока: в бою, в сети и на море ничего, и арена ничего не рисует. Почему так: вид, привязанный к лодке, не показывает место боя целиком, а в арене важно видеть всё.\n- **У причала**: пока лодка пришвартована в гавани, вид так же стоит над её местом, но приближается, чтобы в кадре были лодка и причал, и не слушает зум игрока (`IsometricCamera.Hold` с `near`); отчалив, он плавно возвращается к виду боя ([Гавань](../base/pier.md)).\n- **Вставки** (`camera/Shot.cs`, `camera/ShotCamera.cs`, `Game.Cut`): карта несёт вставки (`Mission.Cutscenes`), каждая из нескольких кадров; на Арене одна, у поста броненосца. Кадр — точка, на которую смотрит камера, сколько секунд она на ней, куда сползает, если движется (`To`), высота кадра в метрах воды, наклон и поворот относительно вида боя; между кадрами жёсткая склейка, как в игровых вставках на движке. Вставка играется под чёрными полосами (`ui/Letterbox.cs`), без слов; Space, Enter, Esc или щелчок её пропускают; HUD уходит на её время. Бой идёт дальше: вставка двигает только камеру игрока и в сети никого не останавливает. Руль держит последнюю команду (ход, поворот и нитро; огонь и трюм не держатся), пока игрок не взял руль обратно.\n- **Когда играется вставка**: арена называет её (`Arena.Scene`), и она играется на машине игрока, когда его лодка впервые входит в эту арену (решение без владельца, [Q118](../questions/interface.md#q118)). Руль и бой во время неё — тоже решение без владельца ([Q119](../questions/interface.md#q119)).\n- **Разрешение**: на экране Retina мир рисуется в точках и растягивается поверх кадров (`Settings.Fit`), либо в доле от этого, которую задаёт игрок, апскейлером MetalFX Temporal на macOS и FSR 2 в остальных случаях, либо пространственным апскейлером по выбору игрока (MetalFX Spatial, FSR 1) под TAA. Зачем: полное разрешение не держит 60 FPS, а временной апскейлер выравнивает детали тоньше пикселя, такие как блики; пространственный дешевле.\n- **Вид верфи** (`camera/YardCamera.cs`, `camera/OrbitView.cs`): низкий вид в три четверти на всю лодку, как в автосалоне, свой вид, не вид боя; вход и выход — плавный переход от вида боя. Выбор детали вид не двигает: игрок крутит его сам (мышью, правым стиком, Q и E) и приближает (колесом, R и F). Подробнее в [верфи](../base/boatyard.md).\n"}, {"id": "gameplay-combat", "path": "gameplay/combat.md", "title": "Бой", "section": "gameplay", "date": "2026-11-13", "md": "# Бой\n\n![Ракеты бьют в охотника](../img/combat.jpg)\n\nОружие лодки, захват цели, попадания, дым и таран.\n\n## Решения владельца\n- Мышью не целятся (2026-11-10): ракеты и торпеды идут в захваченную цель внутри веера своего борта, а если её в веере нет, в ближайшего видимого охотника в нём (2026-11-11). У каждого борта и у носовых стоек свой широкий веер на воде, и чтобы навести веер на цель, лодку поворачивают. Q и E стреляют каждая своим бортом, щелчок — бортом, который достаёт цель. Откуда стреляет оружие, приходит с деталью, купленной в верфи: стойки над каждым бортом (Q — левый, E — правый), носовые стойки, стреляющие вперёд, мины, сбрасываемые за корму, и турели, целящиеся сами.\n- Основное оружие — турель: она стоит на стартовой лодке и стреляет сама. Ракеты — дополнение, их стойки покупают в верфи.\n- Ракеты выпускаются с рельсовых стоек рябью залпов. Они летят прямо и быстро в захваченную цель; сама выбирает цель только турель. Ракеты скользят над волнами на постоянной высоте, так что крен или волна никогда не портят выстрел.\n- Ракетные стойки растут в уровнях: первая стреляет двумя ракетами на борт, и ракеты залпа уходят одна за другой с небольшой задержкой (2026-11-10).\n- У турели свой снаряд, заметно медленнее ракеты, и выглядит он иначе: светящийся трассер без дыма (2026-11-10).\n- Захвачен один враг за раз. Клавиши смены захвата нет; когда захваченный враг тонет, захват переходит сам. Борт, чьи ракеты, выпущенные сейчас, попали бы в цель, зажигает свою клавишу, Q или E, у борта лодки и у цели: ярко, когда борт заряжен, и тускло, пока он перезаряжается. Клавиша торпеды ждёт попадания в районе середины корпуса.\n- Торпеды — второе бортовое оружие: медленные, идущие под волнами, топящие лодку за одно-два попадания. Их трубы лежат в корпусе под водой: на палубе ничего не видно, а торпеда выходит под поверхностью.\n- C переключает оружие, которым стреляют Q и E, по видам пусковых установок на борту; дым держит свою клавишу, F. HUD показывает выбор маленькой рулеткой ромбовидных значков в глянцевом аква-стекле приборов.\n- Ракету парируют ракетой (2026-11-10): ракеты двух сторон, встретившись в воздухе, взрывают друг друга.\n- У ракет и снарядов есть предельная дальность (2026-11-11): дальше неё ничего не летит.\n- Попадание есть попадание: где ракета ударила в корпус, не меняет того, что она делает.\n- Таран вредит обеим лодкам, но лодка с тараном не страдает от собственного тарана. Таран защищает только нос своей лодки: удар в нос приходится на таран, удар в борт или корму вредит лодке как любой. Ни один удар не топит целую лодку разом.\n- Удар носом на нитро — приём любой лодки: она получает меньше, а бьёт сильнее. Таран делает его ещё сильнее.\n- Ракеты охотников горят красным, а игрока — оранжевым, так что перекрёстный огонь читается с первого взгляда. Они летят медленнее ракет игрока, так что от них можно увернуться.\n- Охотники стреляют независимо от того, стоит ли на пути остров.\n- Плотники латают за каждую лодку, которую потопила их лодка, четверть того, что та выдерживала; их несёт охотник-гонщик.\n- Дымовая завеса медленно дрейфует с ветром, оставаясь около того места, где поставлена. Её перезарядка — шкала в кластере приборов.\n\nКакие стили игры строятся из этого оружия, описано в [Сборки и стили игры](builds.md); числа оружия — в [Балансе оружия](../balance/weapons.md).\n\n## Как устроено\nКаждая лодка стреляет из пусковых установок (`ships/Racks.cs`): ракеты из рельсовых стоек, торпеды из труб в корпусе под водой, мины из жёлобов за кормой; ракеты и торпеды игрока в пределах веера борта берут упреждение по захваченной цели, а установка, чей веер её не держит, по ближайшему видимому охотнику в своём веере (`Boat.Aimed`); турель целится сама. Q или E стреляет заряженными установками выбранного вида на борту, щелчок — бортом, который достаёт захваченную цель; C поворачивает рулетку к следующему виду. Охотник стреляет тем видом, который попал бы, сначала ракетами (`Captain.Aim`). `Gunnery` летит и ведёт выстрелы, наносит их удары и сообщает, что они делают, через свои события (`Shots.cs`); эффекты, звук, вид и HUD слушают. Охотники перезаряжаются медленнее игрока, по своей команде. Суша, стоящая между охотником и лодкой, прячет её от него, как дым (`Lookout.Sees`), так что сквозь остров он не стреляет; это спорит с решением «охотники стреляют независимо от острова» ([Q78](../questions/world.md#q78)).\n\n- **Полёт** (`Rockets`, `Projectile`, `Shot`): ракета скользит над водой на фиксированной высоте, так что волны и крен лодки никогда не портят выстрел. Зачем: прямой выстрел поверх планширя прошёл бы над низким корпусом. Ракета любой стороны, кроме игроков, летит медленнее (`Rockets.Motor`); насколько — решение без владельца, [решено 11-12](../decisions.md).\n- **Предел** (`Projectile`, `Rockets.Reach`, `Gunnery.Fizzled`): пролетев по своей линии досягаемость (у ракеты `Boat.Reach`, край веера на воде; у снаряда турели `Turrets.Reach`), заряд гаснет в воздухе маленькой вспышкой с искрами и тихим хлопком и исчезает, никого не задев. Так у гостя то же: его копии зарядов летят по тому же коду. Вспышка без урона — решение без владельца, [Q157](../questions/combat.md#q157). Торпеда, пройдя `Torpedoes.Run`, теряет ход и тонет, никого не задев.\n- **Парирование** (`Projectile.Meets`, `Rockets.Parry`, `Gunnery.Parried`): ракета или снаряд, подошедшие вплотную к летящему заряду другой стороны, взрываются вместе с ним. Снаряд турели парирует наравне с ракетой: решение без владельца, [Q145](../questions/combat.md#q145).\n- **Турели** (`Turrets`, `Rockets.Lead`): турель сама целится и стреляет по ближайшей враждебной лодке, которую видит в зоне досягаемости, беря упреждение, как батарея. Дым её ослепляет (`Screens.Sees`). Хост целит каждую турель; её снаряды доходят до каждого гостя, в том числе до её владельца, а гость поворачивает головки для вида. Она стоит на диаметральной плоскости, рисуется по модели (`tools/turret.py`) и не входит в рулетку: руль только ведёт.\n- **Минные жёлоба** (`Floaters`, `Floater`, `tools/minerail.py`): жёлоб вдоль планширя каждой кормовой четверти, наклонённый наружу, скатывает мину за корму через свою заслонку: Q — из левого, E — из правого. В каждом жёлобе нарисованы две мины; обе исчезают при сбросе и возвращаются по перезарядке. Один жёлоб на лодку, и он лежит в стороне от головы подвесного мотора и пилонов вентилятора (`Layout.Fits`), а твёрдое тело держит мины и их рожки. Мина успокаивается за мгновения, взводится через короткое время (загорается её огонёк) и взрывается, когда её касается корпус другой стороны, когда в неё стреляют или от другого взрыва, давая цепь, как мины карты (`Mines.Fuse`). Для своей стороны она не взрывается никогда. Лодка держит на плаву несколько мин, следующая топит самую старую невзорвавшуюся, и каждая со временем тонет сама. Щупальца охотников обходят их, как мины карты (`Obstacles`), а охотник берёт минный жёлоб, чтобы доставать на некоторое расстояние за кормой (`Captain.Reach`); `Boat.Covers` его не учитывает, так что таранщики всё равно гонятся за минёром. Мина — это снаряд: она доходит до гостей в `Fired`, как ракеты, а поплавок гостя только плавает и исчезает, когда до него доходит `Say.Blast` хоста ([Q88](../questions/combat.md#q88)).\n- **Торпеды** (`Torpedoes`, `Torpedo`, `ships/RoundModel.cs`): выйдя из трубы под водой, с побелевшим от кипения портом, торпеда идёт прямо на заданной глубине, пока ход не израсходован; где вода мелеет, она взрывается о грунт. Рядом с ракетой она медленная, и от неё можно уклониться. Её пузыри ложатся пенным следом (`Effects.Run`, `Wakes.Splash`). Зачем след: с высоты боя торпеда слишком тонка, чтобы её увидеть. Торпеды — самый тяжёлый удар и самая дальняя дальность, ракеты — лёгкие, верные и быстрые.\n- **Уровни ракет** (`Parts.Rockets`): стойки бывают четырёх уровней, каждая тяжелее, медленнее перезаряжается и дороже. Стартовая лодка несёт только турель (`Designs.Starter`), а стойки игрок покупает в верфи, как любую деталь. Зачем детали: более тяжёлая стойка стоит скорости, так что низший уровень остаётся выбором для лёгкой лодки.\n- **Таран** (`Ramming`, `Contact.Part`): корпуса двух сторон, сильно сталкиваясь, получают один импульс, так что большой корпус отмахивается от удара, топящего ялик. Лодки одной стороны толкаются без вреда. Удар по передней части тарана не вредит тарану; в других местах вредит, как любому. Лодка, бьющая носовой четвертью с горящим нитро, получает меньше и бьёт сильнее (`Ramming.Charging`); числа — решение без владельца, [Q136](../questions/combat.md#q136). Целая лодка сохраняет последнее попадание: удар не отнимает у неё больше, чем всё, кроме одного (`Ramming.Take`), решение без владельца, [решено 11-12](../decisions.md). `Ramming.Rammed` бросает брызги, щепки и искры, играет сигнал, трясёт вид и отмечает охотника, как попадание ракеты. Зачем по импульсу: вес и ход решают удар, как вес важен здесь везде.\n- **Помпа** (`Pump`, `Boat.Mend`): корпус с помпой, не получавший ударов некоторое время, время от времени чинит попадание, а вода бьёт через оба борта брызгами. Зачем оба борта: одна струя спряталась бы за корпусом.\n- **Плотники** (`Carpenters`): за каждую лодку, которую их лодка топит снарядом или тараном, плотники латают в её корпус ча
