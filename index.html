е, вода спокойная, белое только у корпусов.\n- **Взять:** бурун у носа, кайму и отражение или тень вместе: корабль сидит в воде, а не лежит на ней; дорожку пятном в углу.\n- **Не переносится:** низкая камера рекламных кадров и размер кораблей.\n\nРазработчики о воде не рассказывали. Сторонний [разбор кадра](https://blog.thomaspoulet.fr/posts/anno-1800-frame-analysis/) (Thomas Poulet, 2025) находит океан на БПФ и отдельную местную симуляцию у берегов.\n\n### Lost Ark\nSmilegate RPG, 2019. Камера в море — точно наша: фиксированная изометрия, корабль в центре, вода во весь кадр. Пример дорогой воды, которая сверху читается плохо.\n\nВидео: [открытое море, 1:01](https://www.youtube.com/watch?v=KNCe1oN6CFU&t=61s) и [у берега, 15:57](https://www.youtube.com/watch?v=KNCe1oN6CFU&t=957s).\n\n- **Волна.** Реалистичная вода. Крупные тёмные и светлые пятна дают масштаб.\n- **Цвет и мель.** Бледная серо-голубая. У берега зелёная мель с видимым дном и водорослями.\n- **Пена.** Мелкий белый крап по всей поверхности.\n- **След.** Короткая мягкая белая полоса.\n- **Читаемость.** Вода светлая и шумная. Корабль читается цветом парусов и подписью, а не силуэтом.\n- **Взять:** крупные пятна тона и зелёную мель.\n- **Не брать:** крап по всей воде. Это зерно, которое у нас убрано шагом 1.\n\nРазработчики о воде не рассказывали.\n\n### Command & Conquer: Red Alert 3\nEA Los Angeles, 2008. Стратегия, где половина боя идёт на воде; водой игру и продавали.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006507.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006507.600x338.jpg\" alt=\"бой у берега\">бой у берега<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006514.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006514.600x338.jpg\" alt=\"ночной бой\">ночной бой<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006501.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006501.600x338.jpg\" alt=\"бой у платформ\">бой у платформ<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006504.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006504.600x338.jpg\" alt=\"база ночью\">база ночью<\/a>\n<\/div>\n\n- **Волна.** Почти нет: рябь и блеск.\n- **Цвет и мель.** Прозрачная бирюза, под ней нарисованное дно: песок, камни, тёмные пятна. Дно делает половину картинки.\n- **Пена.** Каждый корабль и каждая платформа стоят в кольце белого кружева. У берега несколько тонких параллельных линий.\n- **Ночь.** Насыщенный ультрамарин с белыми бликами; корабли светятся своими огнями.\n- **Читаемость.** Вода пёстрая. Спасают корабли: крупные блоки чистого белого, жёлтого и красного.\n- **Взять:** кольцо пены у всего, что стоит в воде (сваи, станция, пирс); дно под прозрачной мелью; ночь синюю, а не чёрную.\n- **Не брать:** общую пестроту. Наши лодки меньше и её не выдержат.\n\nРазработчики о воде не рассказывали, есть только пресса.\n\n### Port Royale 4\nGaming Minds Studios, 2020. Торговая стратегия на Карибах. Карта снята с высоты спутника, но ход цвета — лучший из всех.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_76136c89743d27c01850dbc4d8f3cf4e4815147f.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_76136c89743d27c01850dbc4d8f3cf4e4815147f.600x338.jpg\" alt=\"карта днём\">карта днём<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_dd47fb3f3cf2762dfa0f38e405d1af45224c2b57.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_dd47fb3f3cf2762dfa0f38e405d1af45224c2b57.600x338.jpg\" alt=\"карта ночью\">карта ночью<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_6f2a51539c075abbba137d18df4f79686a7e7ba0.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_6f2a51539c075abbba137d18df4f79686a7e7ba0.600x338.jpg\" alt=\"берег у города\">берег у города<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_92da3335425f328152282a2ada5c92785b4024a3.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_92da3335425f328152282a2ada5c92785b4024a3.600x338.jpg\" alt=\"берег и солнечная дорожка\">берег и солнечная дорожка<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_a10bf0a124cdc76a18d72ce136fa0db4a044b25e.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_a10bf0a124cdc76a18d72ce136fa0db4a044b25e.600x338.jpg\" alt=\"корабли ночью\">корабли ночью<\/a>\n<\/div>\n\n- **Цвет и мель.** Белёсый песок, широкий бирюзовый шельф с тёмно-зелёным крапом рифа, потом свал в индиго. Край свала размыт, но перепад тона большой. Острова стоят на широких светлых шельфах.\n- **Волна.** Вблизи — ровные полосы ряби вдоль берега.\n- **Пена.** Тонкая линия у пляжа.\n- **Ночь.** Глубина почти чёрная. Шельф остаётся тусклым зелёным свечением вокруг островов.\n- **Взять:** ширину шельфа и ход цвета от песка до индиго; ночь, в которой мели видны, а глубина гаснет.\n- **Не переносится:** высота камеры карты.\n\nРазработчики о воде не рассказывали.\n\n### Shadow Gambit: The Cursed Crew\nMimimi Games, 2023. Стелс на карибских островах, пешком. Взята ради солнца на воде.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1545560/ss_82623aed56e92c85b8c0fdb618871162003006c6.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1545560/ss_82623aed56e92c85b8c0fdb618871162003006c6.600x338.jpg\" alt=\"лагуна и островок\">лагуна и островок<\/a>\n<\/div>\n\n- **Цвет и мель.** Ярко-зелёная вода над песком, глубже сине-зелёная. Под водой тёмные пятна водорослей.\n- **Солнце.** Искры собраны в пятна на освещённых участках, не по всему кадру. Каждая искра — яркая белая точка с ореолом.\n- **Пена.** Мягкая кромка у песка.\n- **Прочее.** На воду падают тени пальм.\n- **Взять:** искры пятнами и тени на воде.\n- **Не переносится:** лодок на ходу нет, следа и открытого моря не видно.\n\nРазработчики о воде не рассказывали.\n\n### Ещё четыре, коротко\n- **Animal Crossing: New Horizons.** Накат на песок: впереди белая кромка, за ней прозрачная зелёная вода, после отхода волны остаётся тёмная полоса мокрого песка. Ночью пена остаётся светло-голубой на тёмно-синей воде. Видели два кадра из записи игрока с опущенной камерой: [закат](https://www.youtube.com/watch?v=Q21T5KUPiVY&t=61s) и [ночь](https://www.youtube.com/watch?v=Q21T5KUPiVY&t=18708s).\n- **Terra Nil.** Глубина показана ступенями, у каждой свой тон и тонкий контур, как на карте глубин. Под водой пастельные кораллы. К пляжу идут две-три белые линии с кружевом.\n- **Don't Starve: Shipwrecked.** Волны — счётные белые рисованные значки на ровной заливке; между «значком» и «ничем» нет ничего.\n- **Path of Exile 2.** Волны наката собраны слоями, у каждой волны светлая пенная кайма и прозрачное тело. Это единственная игра списка, где разработчик показал, как это сделано: [доклад, 24:01](https://www.youtube.com/watch?v=TrHHTQqmAaM&t=1441s).\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1593030/ss_586d1a2ef80bcf7e18d1d91afa284eb5245d4bd7.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1593030/ss_586d1a2ef80bcf7e18d1d91afa284eb5245d4bd7.600x338.jpg\" alt=\"Terra Nil: риф и линии наката\">Terra Nil: риф и линии наката<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_4a608cebce8d77000c6f92860d2bbfe306ab160c.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_4a608cebce8d77000c6f92860d2bbfe306ab160c.600x338.jpg\" alt=\"Don't Starve: Shipwrecked: шторм\">Don't Starve: Shipwrecked: шторм<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_51f9b5164ba8122fe821a835107f4dd9b9ccf50b.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_51f9b5164ba8122fe821a835107f4dd9b9ccf50b.600x338.jpg\" alt=\"Don't Starve: Shipwrecked: волны-значки\">Don't Starve: Shipwrecked: волны-значки<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_08f5d676e87583c64a897829de54a6a7fb3b72f1.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_08f5d676e87583c64a897829de54a6a7fb3b72f1.600x338.jpg\" alt=\"Don't Starve: Shipwrecked: мель\">Don't Starve: Shipwrecked: мель<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_bf68d2d933102471be63278902c4d4d4b6cdf5ee.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_bf68d2d933102471be63278902c4d4d4b6cdf5ee.600x338.jpg\" alt=\"Don't Starve: Shipwrecked: зелёная мель\">Don't Starve: Shipwrecked: зелёная мель<\/a>\n<\/div>\n\n## Кадры остальных игр\n\nПо одному-два кадра на каждую игру таблицы, у которой нет разбора. Подписи называют игру и то, что на кадре.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/553420/ss_9c0184ba83022786f74f4a70ebae5c47d2a3c35c.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/553420/ss_9c0184ba83022786f74f4a70ebae5c47d2a3c35c.600x338.jpg\" alt=\"Tunic: две светящиеся лин 8.jpg\" alt=\"Havendock: город на настилах\">Havendock: город на настилах<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1562430/ss_6e4d73bdbea2f723b66aabf92a6bf19bdd35e9d1.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1562430/ss_6e4d73bdbea2f723b66aabf92a6bf19bdd35e9d1.600x338.jpg\" alt=\"Dredge: деревня на сваях\">Dredge: деревня на сваях<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1562430/ss_d98d0c25d9cdb72f4d8e78818a49a34ace974d47.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1562430/ss_d98d0c25d9cdb72f4d8e78818a49a34ace974d47.600x338.jpg\" alt=\"Dredge: ночь\">Dredge: ночь<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1031460/ss_4a9474c77349be335d65b39f3ff8d5537faa9eb0.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1031460/ss_4a9474c77349be335d65b39f3ff8d5537faa9eb0.600x338.jpg\" alt=\"Sail Forth: бой\">Sail Forth: бой<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1031460/ss_67c8fbbcfebe2768a59b48a91e40ee25cfdcd18a.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1031460/ss_67c8fbbcfebe2768a59b48a91e40ee25cfdcd18a.600x338.jpg\" alt=\"Sail Forth: у острова\">Sail Forth: у острова<\/a>\n<\/div>\n\n## Что рассказали разработчики\n\nМало: о воде с такой камеры писали пять студий.\n\n- **Path of Exile, 2017.** Вода — плоская геометрия, рельеф подделан в шейдере. Пена у предметов по экранной глубине и экранные отражения были опробованы и выброшены как дорогие. Волны идут вдоль сглаженной линии берега. Труднее всего далась пена: первый шум вышел «слишком правильным» ([пост студии](https://www.pathofexile.com/forum/view-thread/2051424)).\n- **Path of Exile 2, 2023.** Alexander Sannikov называет волны наката самой трудной частью воды: готовых решений почти нет. Его способ: зоны вдоль берега, по одной волне на слой; высота волны ограничена так, чтобы в любой точке пересекалось не больше двух слоёв; затем цвет, шум и искажение ([доклад](https://www.youtube.com/watch?v=TrHHTQqmAaM&t=1218s), раздел примерно с 20:18).\n- **Dredge, 2025.** Волны Герстнера заменили синусами: гребни подбрасывали лодку. Одна большая текстура-маска задаёт, где видна рябь и как далеко тянется туман ([материал Unity](https://unity.com/resources/crafting-dredge-cozy-atmospheric-horror)).\n- **Flotsam, 2016.** Четыре способа рисовать пену вокруг плавающих вещей. Пена по глубине в шейдере зависит от угла камеры и сверху не работает ([статья](https://80.lv/articles/defining-the-look-of-the-water-in-unity)).\n- **Windward** и **Bad North** — в разборах выше.\n\nОбщие разборы для вида сверху:\n- [Croakwood, дневник №5](https://www.texelraptor.com/blog/croakwood-devlog-5) (Texel Raptor, 2024): камера строго сверху пишет маску суши, из маски на GPU строится поле расстояний до берега, по нему идут линии волн к берегу. Тот же приём советует [Alexander Ameye](https://ameye.dev/notes/stylized-water-shader/).\n- [Around The World, часть 15](https://frozenfractal.com/blog/2024/5/31/around-the-world-15-making-waves/) (Godot, 2024): высота волны падает на мели, прибой белый там, где глубина с волной меньше метра.\n- След лодки симуляцией ряби в текстуре, в которую лодка ставит отпечаток, — [дневник James Finlay](https://jfinlay.substack.com/p/devlog-godot-boat-wake) (Godot, 2026). Он же отмечает беду: след уезжает от лодки, когда основные волны двигают воду вбок.\n\nThe Wind Waker Nintendo не объясняла. Сторонний разбор: море — одна огромная плоскость, а настоящие волны несёт второй, подробный участок сетки под лодкой, который едет вместе с ней ([simonschreibt.de](https://simonschreibt.de/gat/zelda-wind-waker-hyrule-travel-guide/)).\n\n## Что общего у лучших\n\nПо важности для нашей камеры, от главного.\n\n1. **Мель отделена от глубины цветом и светлотой, и полоса широкая.** Два-три корпуса у King of Seas, шире самого острова у Abandon Ship и Port Royale 4. С высоты узкая полоса пропадает.\n2. **Белое — только событие.** Корпус, берег, камень, свая. На открытой воде белого мало, и оно мягче, чем белое у лодки (Bad North, Len's Island, King of Seas).\n3. **Корпус посажен в воду.** Кайма или воротник по ватерлинии, тень или отражение на воде, след. Без каймы корабль лежит поверх картинки (Anno 1800, Cat Quest III).\n4. **След — форма, а не пятно.** Четыре-десять корпусов. У кормы плотный, дальше кружево, потом ничего. Лучший — в два слоя: бирюзовая полоса и белые нити (Len's Island).\n5. **Крупный медленный рисунок вместо мелкого шума.** Тени и отражения облаков, пятна зыби (Cat Quest III, Anno 1800). Мелкий крап по всей воде читается как зерно (Lost Ark, Windward).\n6. **Солнце либо выключено, либо собрано в пятно у края кадра** (Anno 1800, Shadow Gambit, Windward Horizon). У половины лучших игр бликов нет вовсе.\n7. **Берег — две-три линии, идущие к песку, кружево за кромкой и тёмный мокрый песок** (Len's Island, Animal Crossing, Terra Nil).\n8. **Ночью вода тёмно-синяя, а не чёрная.** Белое остаётся белым, мели светятся, огни красят воду рядом (King of Seas, Port Royale 4, Red Alert 3).\n9. **Волну в геометрии сверху почти никто не показывает.** Наш цвет по форме волны — отличие игры. Но и подсмотреть его негде: проверять придётся игрой.\n\n## К шагам плана воды\n\n**Шаг 3, пена.**\n- Len's Island, [накат](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/e9fb3aab2c7ab7a4ba0f0cd1be6d24132e7d4060/ss_e9fb3aab2c7ab7a4ba0f0cd1be6d24132e7d4060.1920x1080.jpg): как сплошная кромка за собой распадается на ячейки и точки. Это рисунок свежей и старой пены.\n- King of Seas, [27:30](https://www.youtube.com/watch?v=Vpm2RsP-E9M&t=1650s): барашки открытого моря. Мягкие мазки по ветру, длиной с корпус, заметно тише следа.\n- Bad North, [следы ладей](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/688420/ss_87ffd543439fb835b2ffac3ccec014fdd0c3e260.1920x1080.jpg): как плотная пена рвётся в крап порогом по текстуре.\n\n**Шаг 4, след и касание воды.**\n- Len's Island, [плоты](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/58a05ec8ebb31d896573d0dfaa924ed7f9b213ac/ss_58a05ec8ebb31d896573d0dfaa924ed7f9b213ac.1920x1080.jpg): два слоя следа, его длина и расширение, дуги от носа.\n- Anno 1800, [5:08](https://www.youtube.com/watch?v=zZegAxKrgHc&t=308s): бурун у носа, белое V и кайма у борта.\n- Cat Quest III, [корабли](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_461f0794e63768bb991735c69b6ba7c10d741b5b.1920x1080.jpg): белый воротник и тень под корпусом. Sea of Stars — запасной вид следа: [две тонкие линии](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1244090/ss_3444baf45a5dc2b27d0c7d385dbcad7e4b121791.1920x1080.jpg).\n\n**Шаг 5, солнце.**\n- Anno 1800, [5:08](https://www.youtube.com/watch?v=zZegAxKrgHc&t=308s): дорожка в правом нижнем углу, остальная вода чистая.\n- Shadow Gambit, [лагуна](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1545560/ss_82623aed56e92c85b8c0fdb618871162003006c6.1920x1080.jpg): размер и редкость искр, пятна вместо россыпи.\n- Windward, [бой](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/326410/ss_aec4a17f4b449f32a82ff8913def9c3ab4dfa56c.1920x1080.jpg): как не надо.\n\n**Шаг 6, мели и берег.**\n- Port Royale 4, [карта](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_76136c89743d27c01850dbc4d8f3cf4e4815147f.1920x1080.jpg): ход цвета от песка до индиго и ширина шельфа.\n- King of Seas, [вид сверху](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_7da957df9f6fdfbc0b154ffe392b9473dd3776f4.1920x1080.jpg): та же полоса с нашей высоты, кромка и дуги у берега.\n- Animal Crossing, [закат](https://www.youtube.com/watch?v=Q21T5KUPiVY&t=61s): мокрый песок за отходящей волной. Как строить волны наката — доклад Path of Exile 2, [24:01](https://www.youtube.com/watch?v=TrHHTQqmAaM&t=1441s).\n\n**Ночь** (в плане её нет, но она названа пустой).\n- King of Seas, [ночной бой](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a71a2d50aa80f013120250a63db016a7859e5e2e.1920x1080.jpg): след, кромка берега и свет огня на воде.\n- Port Royale 4, [ночная карта](https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_dd47fb3f3cf2762dfa0f38e405d1af45224c2b57.1920x1080.jpg): мели остаются видны.\n"}, {"id": "reports-2026-11-14-water-overhaul", "path": "reports/2026-11-14-water-overhaul.md", "title": "Вода заново: исследование и план", "section": "reports", "date": "2026-11-16", "md": "# Вода заново: исследование и план\n\n2026-11-14. Владелец попросил переделать воду целиком: посмотреть, как её делают игры и открытые проекты на GitHub, и составить план. Это снимок на свою дату. Решения владельца записаны в [Облике мира](../art/world-look.md) и в [Камере и картинке](../gameplay/camera.md); как море устроено сегодня — в [Море](../world/sea.md).\n\n## Коротко\n- **Форму волн оставляем.** Океан на БПФ — то же, на чём стоит Sea of Thieves. Rare пробовали упростить форму волн, и стало хуже.\n- **Облик строим заново:** цвет воды, пену, след лодки, блики. Именно эти вещи Rare стилизовали, оставив волны как есть.\n- **Вид сверху съедает главный эффект Sea of Thieves** — свет сквозь гребни при взгляде вдоль воды. Поэтому форму волны рисуем цветом (синяя ложбина, бирюзовый гребень) и пеной, а камеру делаем положе.\n- **Чужой проект за основу не берём.** Берём из открытых проектов отдельные куски, все под лицензией MIT.\n- Каждый шаг попадает в игру отдельно, и его можно оценить игрой. Старое удаляем только после того, как новое принято.\n\n## Что сказал владелец\n- Не нравится: рябь и зерно (сверху море — шумная текстура, крупных волн не видно); плоский цвет (одна синева); пена и след (пятна). Мелководье и берег не названы.\n- Облик: как Sea of Thieves — крупные плавные валы, бирюзовый свет в гребнях, белая пена узором, насыщенные цвета.\n- Волны умеренные: хорошо видны и качают лодку, управлению не мешают.\n- Камеру можно сделать положе.\n\n## Почему сегодня выходит так\n- **Зерно.** Третий каскад волн (`Waves.Lengths`, плитка 20 м) держит волны от 0,16 до 3,3 м. При виде в пятнадцать корпусов пиксель — около 10 см воды, так что эти волны занимают от 2 до 30 пикселей и наклоняют поверхность в каждом из них. Это и есть зерно. Rare говорят о том же: сырой БПФ «очень шумный», а их облик не терпит мелких деталей.\n- **Плоский цвет.** Цвет считается из поглощения и рассеяния воды (`optics.gdshaderinc`), и на глубине он один. Гребень светлее ложбины на 18 %. Свечение гребня есть (`CREST_SCATTER`), но только при взгляде против солнца, и сверху оно около нуля. Отражает вода под нашим углом около 3 % света, так что почти всё, что видит игрок, — её собственный цвет.\n- **Пена и след.** Пена — модель слоёв пузырьков со статистикой узора (`foam.gdshaderinc`, `FoamPattern`). Густая пена выходит сплошным белым, узор виден только в редеющей. След за кормой — толстое белое пятно.\n\n## Как это делают игры\n\n**Sea of Thieves** (доклад Rare на SIGGRAPH 2018 и их дневник разработки):\n- Волны — обычный БПФ по Тессендорфу. Освещение не физическое.\n- Цвет — смесь двух выбранных художником цветов, глубокого и «подповерхностного». Смешивают по маске гребня (горизонтальное смещение волны, БПФ его уже считает), углу взгляда и направлению солнца. Рассеяние намеренно завышено.\n- Пена: там, где гребень заламывается, в текстуру вокруг игрока пишется пятно. Каждый кадр текстуру немного размывают, так что свежая пена резкая, а старая мягкая. По этой маске смешивают две нарисованные текстуры: мелкую у гребня и крупную там, где пена тает. Для штиля, обычной погоды и шторма свои настройки.\n- След корабля, пена у бортов и у берега — один приём: в окне вокруг игрока отмечается всё, что пересекает воду, добавляется к прошлому кадру, сносится и размывается. Стоит меньше 0,1 мс. Волн от корабля нет.\n- Отражения плоские, не экранные. Солнце — широкий блик.\n- Вода — самое дорогое в игре: около 8 мс при воде во весь экран на Xbox One.\n- Море одно у всех игроков: оно восстанавливается из начального числа и времени. У нас так же.\n\n**Что общего почти у всех** (Assassin's Creed III и Black Flag, Skull and Bones, Atlas, Uncharted, Unreal, Crest, World of Warships):\n- Цвет и рассеяние выбирает художник, с множителями, а не физика.\n- Волны собраны из нескольких плиток разного масштаба и зависят только от времени.\n- Гребень подсвечен по его высоте или смещению.\n- Пена: порог на гребне пишет в угасающий буфер, буфер проявляет нарисованную текстуру.\n- След — пена, спрайты или частицы, а не волны. Симуляцию волн от корпуса держат только Crest и Unreal; в Atlas она осталась прототипом.\n- Отражения дешёвые. Симуляция воды стоит 0,5–2 мс.\n- Состояние моря — набор заготовок (в Assassin's Creed шкала от 0 до 12), а не следствие ветра: так им управляет дизайн.\n\n**Игры с видом сверху** (технических рассказов мало; лучший — Diablo IV, GDC 2024):\n- Картинку несёт цвет: горизонта нет, отражение почти постоянно.\n- Волны крупные и их немного; всё, что близко к размеру пикселя, убрано. World of Warships усредняет мелкие волны вместо того, чтобы рисовать их.\n- Волны у берега в Diablo IV нарисованы: полосы бегут по высоте дна, пену на них несёт карта течения к берегу.\n- Блик солнца ставят туда, где он не мешает бою. У нас вид уже смотрит левее солнца.\n- Вода спокойнее по контрасту, чем то, что на ней происходит: белое и быстрое оставлено следам, попаданиям и берегу.\n- Отражений либо нет, либо это цвет неба.\n\n## Открытые проекты\n\nПроектов «как Sea of Thieves» на GitHub около десятка. Лицензии, звёзды и даты прочитаны на GitHub 2026-11-14; код сильнейших прочитан, но не запускался.\n\n| Проект | Что это | Что берём |\n|---|---|---|\n| [2Retr0/GodotOceanWaves](https://github.com/2Retr0/GodotOceanWaves) | Godot 4, MIT, 3350 звёзд. Самый известный; его чаще всего и сравнивают с Sea of Thieves. Только открытое море: нет берега, цвета по глубине и высот для корпусов | Ориентир |\n| [Chin-Wee/GodotOceanWaves](https://github.com/Chin-Wee/GodotOceanWaves) | Его форк под Godot 4.7, MIT. Самый буквальный рецепт Sea of Thieves | Маску гребня и цвет гребня, широкий блик солнца, пену касания |\n| [alozionn/ocean-renderer-godot-csharp](https://github.com/alozionn/ocean-renderer-godot-csharp) | Godot 4.7 на C#, как у нас, MIT. Пена по докладу Rare | Цепочку пены: плотность и свежесть, резкая текстура стареет в размытую. Каскады, обновляемые по очереди |\n| [wave-harmonic/crest](https://github.com/wave-harmonic/crest) | Unity, MIT (версия для встроенного рендера) | Свечение гребня, которому не нужен взгляд на солнце. Пену, проявляемую порогом по текстуре |\n| [gasgiant/Ocean-URP](https://github.com/gasgiant/Ocean-URP) | Unity, MIT | Более чистые линии барашков |\n| [Humpalumps/Ultra-Water](https://github.com/Humpalumps/Ultra-Water) | three.js, MIT. Отсюда уже взяты блики | Подсветку воды над песком, буруны у берега, петлю волн для коопа |\n| [owenyuwono/poseidon](https://github.com/owenyuwono/poseidon) | three.js, MIT. Тёмно-бирюзовая зыбь под закатными облаками | Ориентир по настроению |\n| [2600th/web-ocean-3d](https://github.com/2600th/web-ocean-3d) | three.js, лицензии на код нет. Яркая бирюза, галеон, тропический остров; [живое демо](https://web-ocean-3d.vercel.app/) | Только идеи. Ближе всех к «открытке» |\n\nПочему не берём готовый проект за основу. Ближе всех `alozionn`: тот же движок и язык. Но ему четыре недели, у него 8 звёзд, он замерен только на Windows и не умеет следов. Наш движок волн уже умеет то, чего у него нет: укрытие за островом, высоты для корпусов без чтения с GPU, движение моря для апскейлера, сухие кокпиты, и он замерен на Mac владельца.\n\nКуски под MIT требуют сохранить строку об авторе: она ляжет рядом с `game/waters/UltraWater-LICENSE.txt`.\n\n## План\n\nРабота идёт в демо `Sea` и `Instruments`; для следа лодки нужен кейс с лодкой на ходу. Шаги идут по убыванию того, насколько они меняют картинку.\n\n**1. Цвет и зерно.** Самый заметный шаг, на сегодняшних волнах.\n- Цвет глубокой воды — смесь двух цветов локации: глубокого синего и бирюзы гребня. Смешиваем по маске гребня, по склону к солнцу и по взгляду сверху; слагаемое «против солнца» остаётся для пологой камеры. Цвета задаёт палитра локации (`WaterBody`), как сейчас поглощение и рассеяние.\n- Третий каскад больше не наклоняет поверхность: он остаётся только блеском и шероховатостью.\n- Камера: пробуем наклон 35° и 30° вместо 42° и выбираем по кадрам.\n- Что увидит владелец: синие ложбины, бирюзовые гребни, форма волн читается, зерна нет.\n- Сделан 2026-11-14 ([Море](../world/sea.md), [Q250](../questions/world.md#q250), [Q251](../questions/world.md#q251)). Первый вариант, бирюзовые пятна на гребнях, проверка облика не пропустила: на экране владельца гребни были того же цвета, что мели, и читались как мели. Второй, плоские синие ленты на гребнях, читался как рисунок. Третий рисует волну по её фазе: гребень светится, резко спереди и тая по спине, перед ним тёмная вода, цвет гребня сине-бирюзовый. Вышло иначе, чем задумано: цвет гребня один для всех локаций; рябь убрана усреднением по доле высоты кадра, а не выключением третьего каскада; камера стоит на 35°; из шага 5 сюда перенесён блик солнца, который берёт цвет воды.\n\n**2. Волны под вид.**\n- Состояние моря становится заготовкой локации: высота, длина главной волны, острота гребня, разброс по направлениям. Высота остаётся умеренной.\n- Гребни острее (больше горизонтального смещения): маска гребня сильнее, барашки чище.\n- Два каскада двигают воду, третий даёт только блеск; каскады обновляются по очереди, и симуляция дешевеет.\n- Корпуса читают те же волны, что и сейчас; для коопа ничего не меняется.\n- Сделан 2026-11-14 ([Q252](../questions/world.md#q252)). Вышло иначе, чем задумано: у ветровых волн заданы высота и длина, а острота гребня и разброс по направлениям одни для всех локаций; обновление каскадов по очереди отложено до замера кадра на шаге 7, потому что поверхность, которая движется через кадр, может дрожать под апскейлером; сверх плана направление ветра стало частью карты, потому что при случайном ветре море у старта менялось от запуска к запуску.\n\n**3. Пена.**\n- Одно поле пены вокруг вида вместо нынешних слоёв: плотность и свежесть. Каждый такт поле сносится течением, слегка размывается и угасает.\n- В него пишут гребни, прибой, корпуса, всплески и взрывы.\n- Рисуется через две текстуры: резкое мелкое кружево у свежей пены, мягкое крупное у старой. Порог идёт по текстуре, так что и густая пена остаётся узором, а не заливкой.\n- Под тающей пеной пузырьки сдвигают цвет воды к бирюзе гребня. Это и есть «кружево и светлая бирюза» из решений владельца.\n- Текстуры сначала запекаем кодом.\n- Первым делом уходит бледная полоса старой плёнки прибоя у пляжа под мостками причала Арены: проверка облика оставила её этому шагу.\n- Сделан 2026-11-15 ([Q253](../questions/world.md#q253)). Вышло иначе, чем задумано: новое поле не понадобилось, барашки пишутся в карту следов, где уже жили пена корпусов, всплесков и взрывов; свежесть не хранится отдельно, а следует из числа слоёв; прибой остался своим расчётом по дну и рисуется тем же узором (в карту он перейдёт на шаге 6, если будет зачем); узоров два, оба запечены кодом, и они держат размер на экране при любом зуме. Полоса у причала Арены ушла вместе с пятнами у причала острова базы: прибой теперь кладёт пену только там, где волны ломаются всерьёз. Барашки сделаны реже и бледнее следов и попаданий: на широком виде густые барашки спорили с боем.\n\n**4. След и всё, что касается воды.**\n- Бурун за кормой и тонкая линия у бортов пишутся в поле пены по обводам корпуса (`WakeSource`). Дальше след стареет сам: кружево, бирюза, ничего.\n- Так же пишут ракеты, взрывы, тонущие лодки, ящики, сваи и берег.\n- Волны от корпуса на этом шаге не трогаем.\n- Сделан 2026-11-15 ([Q254](../questions/world.md#q254)). Вышло иначе, чем задумано: бурун за кормой лежит полосами вдоль хода, чтобы след тянулся по пути лодки; пену у борта кладёт и гребень, который бьёт в корпус; попадание оставляет вокруг воронки пятна пены и пузырьков; кромка у берега считается по расстоянию до уреза воды, запечённому в сетке земли, а не пишется в карту; сваи и стены форта пены не дают, потому что они не часть рельефа. Отдельное «бурление» воды из карты ушло: бурун теперь просто пена.\n\n**5. Блики и отражение.**\n- Солнце: широкий мягкий блик и редкая россыпь на гребнях. Проверяем, что под апскейлером россыпь не мерцает.\n- Блики сделаны раньше и иначе, поправкой после плейтеста (ниже): белые искры на ряби по всему морю, а не мягкий блик.\n- Экранные отражения моря и три их пирамиды (`reflection`, `tracing`, `DepthPyramid`, `LightPyramid`, `ScreenPyramid`) снимаем, если кадры у причала и у станции от этого ничего не теряют. Кроме моря, ими никто не пользуется. Вместо них остаётся цвет неба.\n- Сделан 2026-11-16 ([Q261](../questions/world.md#q261), [Q262](../questions/world.md#q262)). Экранные отражения сняты: кадры у причала и у станции с высоты боя без них те же. Вышло иначе, чем задумано: пирамиды глубины и трассировка остались, потому что через них видно дно (преломление), а пирамида света стала одним уровнем, светом сцены под морем. Ночь, самый слабый кадр сравнения, стала контрастнее: её небо темнее и синее, а блики луны сильнее, так что серебряная россыпь и блеск на бортах выходят из темноты ([Свет и время суток](../art/light.md)). Россыпь под апскейлером по умолчанию не мерцает: на фильме неподвижного вида днём и ночью искры меняются от кадра к кадру плавно; виды в движении так не проверялись.\n\n**6. Мелководье и берег.**\n- Преломление, каустика и песок остаются: владелец их не называл.\n- Новые цвета проходят через глубину: бирюза над банкой, синева на глубине. Зерно уходит и над банкой.\n- Пена прибоя пишется в то же поле.\n- Луч преломления на глубокой воде заменяется сравнением глубин: это самая дорогая часть шейдера моря.\n- Сделан 2026-11-16 ([Q265](../questions/world.md#q265)). Вышло иначе, чем задумано: цвета уже шли через глубину (бирюза над банкой — это песок сквозь воду, а цвет гребней показывается только мористее 6–20 м), и зерна над банкой на кадрах не нашлось, кроме слабой сетки от масштаба 80 %, которая есть во всех версиях. Поэтому шаг занялся прибоем, которого у рифов и скал не было вовсе. Пена прибоя не пишется в карту следов: постоянная полоса считается в шейдере по глубине в сторону моря, а кольцо у скал — по расстоянию до уреза, которое теперь запечено на 8 м вместо 4. Над водой глубже 15 м преломлённый луч не ведут: дно считается ровным, а глубина экрана в конце луча говорит, во что он упёрся; кадры глубокой воды от этого не изменились.\n\n**7. Уборка и замер.**\n- Удаляем всё, что заменено. Правим страницы [Моря](../world/sea.md) и [Облика мира](../art/world-look.md).\n- Замеряем кадр во весь экран, как в [замере кадра](2026-11-14-performance.md).\n\n**Цена.** Сегодня в открытом море шейдер моря стоит 1,6–2,5 мс, симуляция около 2 мс, проходы отражений 0,6–0,9 мс. Новая вода не должна стоить больше. Ждём, что она выйдет дешевле: уходят трассировка отражений и луч преломления, а каскады считаются по очереди.\n\n**Чего не берём из Sea of Thieves:** плоские отражения, штормовые волны, воду на палубе, брызги с гребней (брызги владелец уже урезал как чрезмерные).\n\n**Риски.**\n- С нашего угла море не станет кадром из Sea of Thieves: её знаменитый вид снят с палубы. От неё останутся палитра, волна, нарисованная цветом, и пена. Пологая камера вернёт часть света в гребнях со стороны солнца.\n- Цвет «по выбору», а не «по физике» должен держаться в любой час: цвета умножаются на свет солнца и неба, и это проверяется в демо `Lights`.\n- Текстуры пены — это арт. Если запечённые кодом выглядят искусственно, понадобятся текстуры CC0, а их загрузку одобряет владелец.\n\n## Плейтест 2026-11-15 и поправка\n\nПосле шага 4 владелец сыграл сам, показал другим сравнение с прежним морем (кадры 4K, слева игра до шага 1) и передал вердикт: людям больше нравится прежнее море. Новое слишком гладкое, у него не чувствуется текстура, пропали блики, а они давали морю жизнь.\n\n**Почему так вышло.** Шаг 1 прочёл «рябь и зерно» как «убрать всю мелкую деталь»: наклоны коротких волн усреднялись по тридцатой доле высоты кадра, а белые искры остались только в сердце солнечной дорожки. План возвращал россыпь лишь на шаге 5, и скупо. По кадрам сравнения днём мелкой текстуры осталось 0,4–0,6 от прежней, ярких искр — от трети до половины. Проверка облика при этом ставила открытому морю 7 из 10: она находит дефекты, а что нравится игрокам больше, не говорит.\n\n**Образцы.** Владелец назвал их по [отчёту об играх с морем](2026-11-14-sea-camera-games.md): Port Royale 4 (особенно солнце на воде), Anno 1800, Anno 117; King of Seas слишком блёклая, Bad North — стилизация. Облик воды он доверил Claude и проверке ([Облик мира](../art/world-look.md)).\n\n**Что сделано** ([Q255](../questions/world.md#q255), [Q254](../questions/world.md#q254)):\n- лицо воды читает наклоны так же мелко, как прежнее море (три пикселя на экране владельца), со своей шероховатостью: текстура и мягкая дорожка солнца прежние;\n- над дорожкой мелкие искры на гранях самой короткой ряби, слабее пены; вдали от солнца их нет; ночью то же под луной;\n- свежая пена держится белой на треть дольше, бурун за кормой чуть длиннее и расходится веером;\n- вода мира так же прозрачна, как у острова базы, и его открытое море стало синим, а не серым;\n- исправлено: вода над камнем вровень с морем рисовалась чёрной (с шага 1).\n\nГребни, барашки, узор пены и более пологая камера остались. Кадр дороже не стал: один и тот же прогон в размере экрана владельца занял 40,8 с против 39,3–40,8 с (замер первого варианта поправки; последний читает столько же текстур).\n\n**Первый вариант перестарался.** В нём искры рисовались на всей ряби, втрое круче, белые, как пена, а лицо воды было глаже своего. Проверка облика намерила светлых крапин в 3–8 раз больше, чем у прежнего моря, зерна вдвое больше, нашла мелкую сетку на самой яркой воде (ячейки россыпи под слишком ярким бликом), штрихи по всему морю в полдень и след сплошной лентой. По её словам, у прежнего моря солнце было мягкой дорожкой, а у Port Royale 4 это дорожка с тонкими искрами вдоль волн и чистая вода в стороне. Второй вариант вернул лицу воды его шероховатость и прежнюю мелкость, оставил искры только самой короткой ряби и укоротил след. По тем же замерам на кадрах 4K (прежнее море / шаги 1–4 / первый вариант / итог): светлые крапины на солнечной стороне, лодка на ходу — 0,5 / 0,1 / 3,9 / 1,3 %, погоня — 1,9 / 0,1 / 5,2 / 1,7 %; вдали от солнца — 0,06 / 0,01 / 0,5–0,7 / 0,07 %; зерно на солнечной стороне — 3,2 / 1,2 / 7,9 / 4,5, вдали от солнца — 2,0 / 0,5 / 3,8 / 2,2.\n\nПовторный заход проверки на итоге оборвался на середине: кончился лимит модели. Его скриптами итог перепроверен вручную: на самой широкой воде под солнцем при увеличении вчетверо сетки не видно, как и у прежнего моря (слабый узор в 2,5 пикселя есть во всех версиях, включая прежнюю: это масштаб 80 %), полуденных штрихов нет, подписи HUD на солнечной стороне читаются, белого в следах меньше, чем в первом варианте. Кадры и фильмы проверка снять успела, а отчёт — нет.\n\n**Замечания владельца после поправки** (2026-11-15). Море стало лучше, а следы, по его ощущению, прежде были лучше. Отдельная сессия разобрала следы обеих версий в коде и на кадрах и подтвердила четыре его замечания. Бурун появлялся сразу целой полосой, потому что был штампом длиной 0,7 корпуса, привязанным к лодке. В повороте он заметал воду снаружи хода и не рвался в полёте. После посадки на воде почти ничего не оставалось: ломающиеся волны клали в шесть раз меньше пены, чем прежде. Сделано: бурун кладётся полосой у транца и остаётся позади, в полёте его нет, ломающиеся волны снова кладут пену, длинный корпус кладёт бурун гуще. Ещё два замечания: тёмная «тень» у лодки на границе бирюзы и синевы — это пузырьки следа, которые прятали свет песка над банкой, теперь они только светлеют; жёсткая линия между водой и песком и накат на песке, не связанный с водой, — теперь пена у уреза и накат одно целое, а вода проявляется над последними 20 см глубины.\n\nПробовали и отложили свечение ярких пятен (bloom): вблизи оно почти ничего не добавляет, а на самом широком виде превращает солнечную сторону в белый туман, в котором не видно лодок.\n\n**Урок.** Когда новый облик заменяет прежний, сравнение с прежним показывают владельцу после первого же шага, который меняет картинку, а не после четвёртого.\n\n## Проверка облика\n\nШаги 1 и 2 судил отдельный проверяющий: кадры и фильмы размера экрана владельца (3024×1964) против лучших инди и ранних AAA, шесть заходов. Шаг 1 прошёл с третьего захода. Шаг 2 прошёл с шестого, с одной оговоркой: полоса старой плёнки прибоя у причала Арены оставлена шагу 3. Шаг 3 (2026-11-15) прошёл со второго захода. Первый завернул три вещи: сетку точек в редеющей пене на широком виде, одиночные крапины по всему открытому морю и барашки длиной в две-три лодки, почти такие же белые, как след. Шаг 4 (2026-11-15) прошёл с первого захода. Проверяющий отметил одно: у большой и у быстрой лодки белого в следе стало вдвое меньше, и в бою их труднее найти; после этого бурун стал шире и длиннее. Повторный заход подтвердил, что кляксой он не стал, но искать лодки в бою легче не стало: оценка «бой читается» осталась 6,5 против 7 после шага 3. Бурун после этого сделан ещё белее; это проверяющий уже не смотрел.\n\n| Что судили, из десяти | До | После шагов 1 и 2 | После шага 3 | После шага 4 |\n| --- | --- | --- | --- | --- |\n| Открытое море на кадре | 4 | 7 | 7 | 7 |\n| Море в движении | 5 | 6,5 | 7 | 7 |\n| Лодка и след | 4 | 4,5 | 6 | 6,5 |\n| Бой читается | 5 | 7 | 7 | 6,5 |\n| Мели и причал | 6 | 6 | 6,5 | 7 |\n| Ночь | 4 | 4,5 | 4,5 | 4,5 |\n\nПо словам проверяющего, вода прошла около двух третей пути. Что держит остальное:\n- узор пены вблизи читается как сгенерированный: хвост следа за буруном остаётся сеткой ячеек, у ячеек одно семейство размеров, у барашка нет яркого фронта, который идёт с гребнем;\n- взрыв мины не оставляет пятна пузырьков, у свай причала и стен форта нет пены;\n- дорожки солнца и луны нет, ночь пустая (бледные барашки формы ей не дают): шаг 5;\n- у рифа и берегов нет прибоя, только тонкая кромка: шаг 6;\n- вода Арены тусклее воды острова базы; в плане этого нет (исправлено поправкой после плейтеста);\n- мир рисуется мягко, на 80 % разрешения ([Q249](../questions/gaps.md#q249)).\n\nЧто проверка показала о самой работе: обычный кадр демо рисует мир в 640×360 и льстит воде, судить надо на размере экрана владельца (`tools/demo.sh --size 3024x1964`); при случайном ветре одно и то же место выглядит по-разному от запуска к запуску.\n\n## Что нужно от владельца\n1. Какой проект с GitHub вы видели? Тогда под него можно подогнать палитру и пену.\n2. Волны от корпуса. Сейчас корпус давит воду, и лодки подпрыгивают на чужих следах (`Wakes`, `WakeUnder`). В играх след — только пена. Убрать волны от корпуса, облегчить или оставить? Решим после шага 4, игрой.\n3. Наклон камеры — по кадрам шага 1.\n\n## Источники\n- Sea of Thieves: [тезисы доклада SIGGRAPH 2018](https://history.siggraph.org/wp-content/uploads/2022/09/2018-Talks-Ang_The-Technical-Art-of-Sea-of-Thieves.pdf), [запись доклада](https://www.youtube.com/watch?v=y9BOz2dFZzs), [дневник Rare о воде](https://www.youtube.com/watch?v=9nxlmCq4220).\n- Atlas: [слайды GDC 2019](https://gpuopen.com/gdc-presentations/2019/gdc-2019-agtd6-interactive-water-simulation-in-atlas.pdf).\n- Crest: [слайды SIGGRAPH 2019](https://advances.realtimerendering.com/s2019/CrestSIGGRAPH2019-Final-for_web.pptx).\n- Uncharted: [вода Uncharted 3, GDC 2012](https://www.slideshare.net/slideshow/water-technologyofunchartedgdc2012/12977478), [пороги Uncharted 4](https://advances.realtimerendering.com/s2016/Rendering%20rapids%20in%20Uncharted%204.pptx).\n- Assassin's Creed III: [интервью fxguide](https://www.fxguide.com/fxfeatured/assassins-creed-iii-the-tech-behind-or-beneath-the-action/).\n- World of Warships: [тезисы SIGGRAPH 2016](https://history.siggraph.org/wp-content/uploads/2022/09/2016-Talks-Kryachko_Sea-Surface-Visualization-in-World-of-Warships.pdf).\n- Diablo IV: [слайды GDC 2024 «H2O in H3LL»](https://media.gdcvault.com/gdc2024/Slides/GDC+slide+presentations/Aikman_Aaron_H2O_in_H3LL.pdf).\n- Horizon Forbidden West: [слайды SIGGRAPH 2022](https://advances.realtimerendering.com/s2022/SIGGRAPH2022-Advances-Water-Malan.pdf).\n- Riptide GP: [разбор Vector Unit](https://www.gamedeveloper.com/design/postmortem-vector-unit-s-i-riptide-gp-i-).\n\nНе нашлось технических рассказов о воде Anno, Tropico, Sail Forth, King of Seas, Windbound, Raft и The Legend of Zelda с видом сверху. Видео проектов с GitHub не смотрели: описания взяты из их страниц и кадров.\n"}, {"id": "reports-2026-11-15-dream-games", "path": "reports/2026-11-15-dream-games.md", "title": "Семь желаний: игры-ориентиры", "section": "reports", "date": "2026-11-15", "md": "# Семь желаний: игры-ориентиры\n\n2026-11-15. Владелец назвал семь вещей, о которых мечтает: весёлая игра, сильный сюжет, живой мир с экономикой, система заклятых врагов («nemesis»), улучшения, «классы» и кооп. Отчёт смотрит, как это сделано в вышедших играх, похожих на нашу, — Windward, SPAZ, GTA и ещё в полусотне, — что сработало, что нет и какая самая малая форма годится игре с одной лодкой на игрока и видом сверху. Картинка моря разобрана в [отчёте о камере](2026-11-14-sea-camera-games.md), бой морских аркад — в [отчёте от 28 октября](2026-10-28-arcade-naval-reference.md); здесь их не повторяем.\n\nКак смотрели. Страницы магазинов, рецензии, вики игр, интервью и статьи разработчиков, открытые 2026-11-15; для двух игр прочитан опубликованный код. В игры не играли, докладов на видео не смотрели: их знаем в пересказе. Каждая ссылка ведёт на страницу, которую мы открывали. Оценка Steam — доля положительных среди отзывов на английском, как на странице магазина в этот день; у малых игр магазин показывает одну общую строку. Кадры магазинов показаны прямо на странице, как в отчёте о камере. Слова «взять» и «нам» — наше прочтение, а не решения; в игре ничего не изменено.\n\n## Где мы сегодня\n\nЧто из семи желаний уже есть в игре и что владелец о нём решал. Подробности — на страницах тем.\n\n| Желание | Что есть | Чего нет |\n|---|---|---|\n| Весёлая игра | Ход моторной лодки, а не физика; турель бьёт сама, ракеты идут в захват, рывок, парирование, таран ([Бой](../gameplay/combat.md)); розыск и патруль ([Розыск](../gameplay/wanted.md)); буйства, прыжки, посылки ([Забавы](../gameplay/toys.md)) | Почти ничего из сделанного в ноябре владелец ещё не играл; глубина боя стоит в [дорожной карте](../roadmap.md) на этапе среза |\n| Сюжет | Сцены с ветками, условиями и приоритетами, свой редактор, радио в бою, голос-лепет, портреты ([Сцены сюжета](../story/scenes.md)); цель игры — линия поручений с финальным боссом (решено 11-12) | Самой истории: написана одна сцена-заглушка; кто капитан и зачем он в море, не решено ([Q104](../questions/gaps.md#q104)) |\n| Живой мир с экономикой | Рабочие лодки с расписанием, рейсы идут и вне кадра; пять сторон; две точки продажи с разной ценой, восемь видов ящиков ([Жизнь моря](../world/life.md), [Баланс экономики](../balance/economy.md)) | Цен, которые зависят от места и времени; торговцев с грузом и караванов; следов того, что сделал игрок |\n| Заклятые враги | Случайное лицо у таблички цели; мировой босс; форт пиратов ([Форт](../world/fort.md)) | Врага, который помнит игрока. Соперников владелец снял 11-10 |\n| Улучшения | Лодка из деталей верфи: корпус, мотор, броневой пояс, оружие; вес стоит скорости ([Верфь](../base/boatyard.md)) | Цены, при которой покупка — событие: новая игра начинается с 10 000 монет, а самый дорогой корпус стоит 1050 ([Q101](../questions/gaps.md#q101)) |\n| Классы | Пять стилей как сборки: бортовой залп, преследователь, турельщик, носитель дронов, минёр ([Сборки](../gameplay/builds.md)) | Ролей, которые нужны друг другу в коопе |\n| Кооп | До четырёх игроков, у каждого своя лодка, через Steam или локальную сеть; мир ведёт хост; товарищ поднимает потопленного ([Онлайн-кооп](../online.md)) | Части игры ещё не онлайн; с чужими людьми не играли ни разу |\n\nДва желания спорят с прежними решениями владельца. Это может быть перемена мнения, а может быть оговорка; строить по ним без его слова нельзя.\n\n- **Заклятые враги.** 2026-11-10 владелец снял соперников со словами, что это надо было сделать давно ([Журнал решений](../decisions.md)). Те соперники были другими командами, которые собирали добычу рядом с игроком: восемь капитанов с портретами и репликами по радио, две команды в море разом. Система «nemesis» в играх ниже — другое: враг получает имя потому, что победил игрока, и возвращается за ним. Вопрос владельцу — [Q257](../questions/gaps.md#q257).\n- **Живой мир с экономикой.** 2026-10-26 симулятор архипелага снят целиком: симуляция делала игру пустой и медленной. 2026-11-09 сняты торговая точка и уровни. Но 2026-11-13 владелец сам назвал мирные лодки основой для торговцев и караванов. Отчёт ищет форму, которая не возвращает первую беду.\n\n## Кандидаты\n\nПятьдесят игр. Отметки — наше прочтение: ● — сильная сторона игры, ○ — есть отчасти, — — нет. Весёлая игра в столбцы не вынесена: её судят по отзывам. Первые шестнадцать разобраны подробно, остальные — коротко или в выводах.\n\n| Игра | Год | Студия | Вид | Сюжет | Мир | Враги | Улучш. | Классы | Кооп | Steam |\n|---|---|---|---|---|---|---|---|---|---|---|\n| [Windward](https://store.steampowered.com/app/326410/) | 2015 | Tasharen | сверху | — | ● | — | ○ | ○ | ● | 80 % из 1 933 |\n| [Windward Horizon](https://store.steampowered.com/app/2665460/) | 2025 | Tasharen | сверху | ttps://en.wikipedia.org/wiki/Uncharted_Waters) | 1993 | Koei | сверху | ● | ● | ○ | ○ | ● | — | нет в Steam |\n| [Sea Dogs: To Each His Own](https://store.steampowered.com/app/223330/) | 2012 | BlackMark Studio | от третьего лица | ● | ● | — | ● | ○ | — | 72 % из 1 931 |\n| [Wildermyth](https://store.steampowered.com/app/763890/) | 2021 | Worldwalker Games | тактика по ходам | ● | — | ○ | ● | ● | ● | 95 % из 11 739 |\n| [Spiritfarer](https://store.steampowered.com/app/972660/) | 2020 | Thunder Lotus | сбоку, 2D | ● | — | — | ● | — | ○ | 94 % из 19 012 |\n| [Kenshi](https://store.steampowered.com/app/233860/) | 2018 | Lo-Fi Games | свободная камера | — | ● | — | ○ | — | — | 95 % из 49 183 |\n| [X4: Foundations](https://store.steampowered.com/app/392160/) | 2018 | Egosoft | из кабины | ○ | ● | — | ● | — | — | 78 % из 14 117 |\n| [Need for Speed: Most Wanted](https://en.wikipedia.org/wiki/Need_for_Speed:_Most_Wanted_%282005_video_game%29) | 2005 | EA Black Box | за машиной | ○ | — | ● | ● | — | — | нет в Steam |\n| [Valheim](https://store.steampowered.com/app/892970/) | с 2021 | Iron Gate | от третьего лица | — | — | — | ● | — | ● | 94 % из 268 208 |\n\nНи одна игра не закрывает все шесть столбцов. Ближе всех Windward Horizon и Drox Operative 2 — и у обеих меньше пятисот отзывов. Игры с оценкой выше 95 % сильны в двух-трёх столбцах, не больше.\n\nУже разобраны раньше: [Escape from Duckov](2026-11-07-escape-from-duckov.pdf) и [Dave the Diver](2026-11-07-dave-the-diver.pdf).\n\n## Разборы\n\nСначала игры, названные владельцем, и самые близкие к нашей; дальше — лучшие образцы каждого желания.\n\n### Windward и Windward Horizon\nTasharen Entertainment, 2015 и 2025. Один парусник на игрока, вид сверху, кооп, торговля и война фракций: ближе всех к тому, о чём мечтает владелец, кроме сюжета и заклятых врагов.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/326410/ss_c4f36d433f4f4417ba249a411476313536e899eb.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/326410/ss_c4f36d433f4f4417ba249a411476313536e899eb.600x338.jpg\" alt=\"Windward: бой эскадр\">Windward: бой эскадр<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/326410/ss_17db8e667f62ac59107341dab2ae664f58bc4dba.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/326410/ss_17db8e667f62ac59107341dab2ae664f58bc4dba.600x338.jpg\" alt=\"Windward: таланты и три специализации\">Windward: таланты и три специализации<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/326410/ss_6c204bb80e7e036946cd0c3a64b5c39712bb8e10.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/326410/ss_6c204bb80e7e036946cd0c3a64b5c39712bb8e10.600x338.jpg\" alt=\"Windward: карта региона\">Windward: карта региона<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/326410/ss_d42a7826ff881724e82d97bb4e6d0f244393645c.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/326410/ss_d42a7826ff881724e82d97bb4e6d0f244393645c.600x338.jpg\" alt=\"Windward: поручение — охота на пирата\">Windward: поручение — охота на пирата<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/a44e8f413c84a7bcb0388c54dcaf27466782e15e/ss_a44e8f413c84a7bcb0388c54dcaf27466782e15e.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/a44e8f413c84a7bcb0388c54dcaf27466782e15e/ss_a44e8f413c84a7bcb0388c54dcaf27466782e15e.600x338.jpg\" alt=\"Horizon: карта мира, регионы в цветах фракций\">Horizon: карта мира, регионы в цветах фракций<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/91101d3c7de58c3ee3d12b1a02a21cd4c28acdbe/ss_91101d3c7de58c3ee3d12b1a02a21cd4c28acdbe.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/91101d3c7de58c3ee3d12b1a02a21cd4c28acdbe/ss_91101d3c7de58c3ee3d12b1a02a21cd4c28acdbe.600x338.jpg\" alt=\"Horizon: рынок провинции, товары и цены\">Horizon: рынок провинции, товары и цены<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/9f0ec64229c2b072d1d90c13544185102a2b10d3/ss_9f0ec64229c2b072d1d90c13544185102a2b10d3.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/9f0ec64229c2b072d1d90c13544185102a2b10d3/ss_9f0ec64229c2b072d1d90c13544185102a2b10d3.600x338.jpg\" alt=\"Horizon: верфь, три корабля на выбор\">Horizon: верфь, три корабля на выбор<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/56557dd25ea89aec39a58a4bd092d36d44b8a61f/ss_56557dd25ea89aec39a58a4bd092d36d44b8a61f.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/56557dd25ea89aec39a58a4bd092d36d44b8a61f/ss_56557dd25ea89aec39a58a4bd092d36d44b8a61f.600x338.jpg\" alt=\"Horizon: дерево талантов\">Horizon: дерево талантов<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/e7f80b8a6f438a91d467f0a96ad48b120f2c8e67/ss_e7f80b8a6f438a91d467f0a96ad48b120f2c8e67.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2665460/e7f80b8a6f438a91d467f0a96ad48b120f2c8e67/ss_e7f80b8a6f438a91d467f0a96ad48b120f2c8e67.600x338.jpg\" alt=\"Horizon: доска заданий провинции\">Horizon: доска заданий провинции<\/a>\n<\/div>\n\n- **Игра.** Пушки стреляют сами, пока корабли кружат; игрок рулит и жмёт несколько умений: порвать паруса, спутать такелаж, сбросить горящие бочки. Города берут, расстреляв их башни ([PC Gamer](https://www.pcgamer.com/windward-review/)). Horizon добавил броню по бортам: пока борт не пробит, корпус цел, и важно, каким бортом стоишь ([превью](https://gamersocialclub.ca/2025/02/21/windward-horizon-demo-preview)).\n- **Сюжет.** В первой игре его нет: песочница с повторяющимися заданиями городов. В Horizon короткое вступление, именованные персонажи и цепочки заданий лидеров фракций.\n- **Мир и экономика.** Процедурная карта из зон; четыре фракции и пираты делят её, цель — закрасить карту своим флагом. У городов свой спрос и предложение; снабжённый город растёт и продаёт лучшие корабли. Дружественные капитаны ИИ подсказывают, где купить и где продать. В зону, у которой не все соседи свои, приходят пираты ([CGMagazine](https://www.cgmagonline.com/review/game/windward-pc-review/)). В Horizon задания, торговля и убитые пираты двигают влияние лидера фракции, пока провинция не перейдёт к нему без боя.\n- **Заклятые враги.** Нет.\n- **Улучшения.** Золото покупает корабль крупнее; снаряжение и команда — с добычи и из лавок; таланты дают по несколько процентов. В Horizon пушки и броню ставят в сетку, свою у каждого типа корабля, и три дерева талантов: атака, защита, поддержка.\n- **Классы.** Выбора класса нет. Четыре фракции — четыре способа играть, и каждая даёт больше опыта за своё: бой, задания, разведку, торговлю. Роль складывается из типа корабля и талантов.\n- **Кооп.** Суть обеих игр: игроки под одним флагом двигают карту вместе. Horizon автор называет сделанным под кооп; пиратские армады рассчитаны на группу ([обзор](https://roundtablecoop.com/reviews/windward-horizon-review-a-worthy-and-chill-sequel)).\n- **Как приняли.** Windward: 80 % из 1 933 отзывов в Steam, Metacritic 61. PC Gamer (65): легко начать и трудно бросить, но каждая система мелкая, одни и те же задания десятки раз, бои сливаются. CGMagazine: приятно быть винтиком войны, а не героем; но захват одной зоны — часы, и зоны становятся проверкой снаряжения. Horizon: 79 % из 404; в превью за десять часов репутация ничего видимого не изменила, мир со временем почти не менялся.\n- **Взять:** фракции как способы играть с бонусом за своё; город, который растёт от снабжения и за это продаёт лучшие детали; капитаны ИИ, которые подсказывают сделки; карту, которую группа отбивает у пиратов зона за зоной; броню по бортам.\n- **Не переносится:** сервер на десятки игроков; долгий захват карты; процедурные карты как главное содержание — миры красивые, но в них не случается ничего памятного.\n\nАвтор, Michael Lyashenko, в [разборе разработки](https://www.tasharen.com/?p=4745): версия 2012 года была схватками на аренах, за восемь месяцев заработала около 800 долларов и ушла от приключения, которого он хотел. В 2014 он выбросил всё, кроме арта, и строил по порядку: мир, города со спросом, бой, ИИ. Из Pirates! взял плавание и бой, убрал танцы и фехтование, добавил мультиплеер.\n\n### Space Pirates and Zombies и SPAZ 2\nMinMax Games, два человека, 2011 и 2017. Первая — аркада сверху с кампанией и исследованиями; вторая — живая галактика из двухсот капитанов.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/107200/ss_46881b9add2af2a9dc7e153483f99df421bac6ff.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/107200/ss_46881b9add2af2a9dc7e153483f99df421bac6ff.600x338.jpg\" alt=\"SPAZ: бой\">SPAZ: бой<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/107200/ss_6cbe5995a32179a43d6c4a46a174e090620744b9.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/107200/ss_6cbe5995a32179a43d6c4a46a174e090620744b9.600x338.jpg\" alt=\"SPAZ: исследования\">SPAZ: исследования<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/107200/ss_fd84047f9a0651a914d0a00dc2061087c59fb890.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/107200/ss_fd84047f9a0651a914d0a00dc2061087c59fb890.600x338.jpg\" alt=\"SPAZ: карта системы\">SPAZ: карта системы<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_d8a7ff3166fd94e8a8a71568c4d1ab77290ed571.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_d8a7ff3166fd94e8a8a71568c4d1ab77290ed571.600x338.jpg\" alt=\"SPAZ 2: галактика, поделённая фракциями\">SPAZ 2: галактика, поделённая фракциями<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_7981dd396f8849d4896496566fb9a6012ae8b835.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_7981dd396f8849d4896496566fb9a6012ae8b835.600x338.jpg\" alt=\"SPAZ 2: карта, капитаны ходят сами\">SPAZ 2: карта, капитаны ходят сами<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_e097543d67973b392dc7cbcca090d6c7c0d62d73.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_e097543d67973b392dc7cbcca090d6c7c0d62d73.600x338.jpg\" alt=\"SPAZ 2: лица капитанов и награда за голову\">SPAZ 2: лица капитанов и награда за голову<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_5320590a77caf2bf1438a4fa53ef37a311f69e54.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_5320590a77caf2bf1438a4fa53ef37a311f69e54.600x338.jpg\" alt=\"SPAZ 2: торг деталями с капитаном\">SPAZ 2: торг деталями с капитаном<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_5e8385aea0c85e7085d3fa34201a75085c1df6a9.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/252470/ss_5e8385aea0c85e7085d3fa34201a75085c1df6a9.600x338.jpg\" alt=\"SPAZ 2: бой\">SPAZ 2: бой<\/a>\n<\/div>\n\n- **Игра.** SPAZ: ведёшь один корабль маленького флота и пересаживаешься между ними; щиты, броня и корпус слабы к разному оружию, поэтому флот смешанный. SPAZ 2: один большой корабль-матка; любую деталь можно отстрелить, подхватить лучом и прикрутить прямо в бою; важно, чем повёрнут к врагу.\n- **Сюжет.** В первой — написанная кампания с предательством и чумой зомби, шутки в описаниях. Во второй та же команда выбирает сторону в общей войне; [Cubed3](https://www.cubed3.com/games/reviews/pc/space-pirates-and-zombies-2) нашёл историю неожиданно мрачной и недоиспользованной.\n- **Мир и экономика.** В SPAZ 2 около двухсот постоянных капитанов ИИ делают то же, что игрок: собирают лом, торгуют, вступают во фракции и выходят из них, строят базы, держат территорию, воюют. Топлива мало, и это двигатель конфликта: слабые фракции становятся бандитами, на бой слетаются охотники за ломом. Лидер фракции собирает налог с баз, объявляет войну и зовёт ведомых ([страница Steam](https://store.steampowered.com/app/252470/), [StopGame](https://stopgame.ru/show/95946/space_pirates_and_zombies_2_review)).\n- **Заклятые враги.** Отдельной системы нет, но ближе всех к ней: каждый капитан с именем и лицом, живёт всю игру и помнит отношение к игроку; награду за голову назначают в обе стороны. Рецензент StopGame привязался к одним капитанам и возненавидел других.\n- **Улучшения.** SPAZ: 43 корабля пяти размеров, детали открывает дерево исследований. SPAZ 2: детали со случайными свойствами; масса, форма и место меняют поворот и сектора огня.\n- **Классы.** Нет: роль даёт сборка.\n- **Кооп.** Нет в обеих. Мультиплеер для первой авторы назвали непосильным: он бы их разорил ([интервью](https://www.gamedeveloper.com/business/from-indies-to-indies-space-pirates-and-zombies-spaz-)).\n- **Как приняли.** SPAZ: 91 % из 1 890, Metacritic 74. SPAZ 2: 77 % из 2 054. Самый полезный [отзыв в Steam](https://steamcommunity.com/app/252470/reviews/?browsefilter=toprated): сборка корабля сильна, а стратегический слой тонок — союзы ничего не дают, капитаны глуповаты, начало бедное, конец — прогулка. Продолжение сменило прямое управление маленьким флотом на одну тяжёлую матку и карту стратегии; на этом отзывы и разошлись.\n- **Взять:** постоянных капитанов с лицом, которые живут по правилам игрока и помнят его; награду за голову в обе стороны; бой, на который приходят падальщики; деталь, сбитую с врага и поставленную себе; нехватку (топлива) как причину всех ссор.\n- **Не переносится:** двести агентов и территории требуют отдельной карты-стратегии, и даже с ней рецензенты нашли этот слой тонким.\n\nАвторы о работе: докажи веселье рано — если игра становится приятной через год, что-то не так; лучшим решением назвали переделку почти всех экранов, чтобы игрок понимал игру. Страница SPAZ 2 говорит прямо: «The player is not special and is not the center of the Galaxy».\n\n### Grand Theft Auto\nDMA Design и Rockstar. Нам важны три вещи: игры с видом сверху (GTA, 1997; GTA 2, 1999; Chinatown Wars, 2009), розыск и кооп-ограбления GTA Online.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/271590/ss_da39c16db175f6973770bae6b91d411251763152.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/271590/ss_da39c16db175f6973770bae6b91d411251763152.600x338.jpg\" alt=\"GTA Online: четверо у стола плана\">GTA Online: четверо у стола плана<\/a>\n<\/div>\n\n- **Игра.** GTA: открытый город сверху, цель уровня — сумма очков; очки дают за всё, а больше всего за задания, взятые у звонящих телефонных будок, в любом порядке. Задание поднимает множитель, гибель его сбрасывает. GTA 2 добавила гаражи с доработками машин, побочные работы и спрятанные посылки.\n- **Сюжет.** В первых двух его почти нет: боссы говорят из телефонных будок. С GTA III задания дают знакомые, несколько сразу; правило Дэна Хаузера — история показывает механики, а механики рассказывают историю. Мир несёт радио: семь станций были уже в первой игре. В Chinatown Wars всё идёт через карманный компьютер: письма, навигатор, магазин.\n- **Уважение банд (GTA 2).** В районе три банды, каждая воюет с одной из двух других. У каждой шкала уважения на экране. Работа на банду и убийства её врагов поднимают её шкалу и роняют вражескую. Телефоны банды трёх цветов: зелёные дают лёгкие задания, жёлтые платят лучше и просят уважения, красные — лучшие и только при полном уважении. Банда, которая тебя не уважает, заданий не даёт и стреляет на своей земле ([Respect](https://www.grandtheftwiki.com/Respect), [Gangs in GTA 2](https://www.grandtheftwiki.com/Gangs_in_GTA_2)).\n- **Экономика (Chinatown Wars).** Единственная настоящая торговля в серии: шесть товаров; девять банд, у каждой свой район, один товар дёшев, другой дорог. Сумка на 50 мест, её теряешь при аресте; склад дома без предела. Стрелка у сделки показывает прибыль или убыток. Торговцы шлют письма-наводки — дешёвая партия или высокая цена, — и наводка сгорает через два игровых дня. Крупная сделка может кончиться облавой и двумя звёздами ([Drug Dealing](https://www.grandtheftwiki.com/Drug_Dealing)). Хаузер: торговля подходит к езде по карте, даёт игроку ещё один слой и идёт сама по себе, рядом с сюжетом.\n- **Розыск.** Шкала до пяти-шести звёзд, каждая звезда — ответ сильнее. Уйти можно, пропав из вида, перекрасив машину или заплатив. В GTA 2 у каждого района свой потолок звёзд, так что дальние районы жёстче. В Chinatown Wars звёзды снимают, разбивая полицейские машины.\n- **Заклятые враги.** Системы нет.\n- **Классы.** Нет. В ограблениях GTA Online роли раздают на задание: водитель, стрелок, взломщик.\n- **Кооп.** Ограбления GTA Online (2015): цепочки из подготовок и финала ровно на четверых. Лидер платит за подготовку, зовёт команду, раздаёт роли и доли и получает деньги только в финале; остальным платят за каждую подготовку ([IGN](https://www.ign.com/articles/2014/12/16/grand-theft-auto-5-online-heists-finally-revealed)).\n- **Как приняли.** Chinatown Wars — 93 на Metacritic, лучшая оценка на своей консоли, и рецензенты помнят именно торговлю. В GTA 2 хвалили банды. GTA Online ругали на старте за бесцельность, а ограбления приняли лучше всего.\n- **Взять:** шкалы уважения сторон с тремя ступенями заданий и сторону, что стреляет первой при плохом уважении; весь цикл торговли Chinatown Wars — мало товаров, у каждого продавца один дешёвый и один дорогой, маленький трюм, который теряешь, наводки со сроком, риск облавы на крупной сделке; радио как дешёвый рассказ о мире; задания-цепочки на четверых с лидером.\n- **Не переносится:** постановочные задания с озвученным составом; плотность города.\n\nImran Sarwar, продюсер GTA Online, об ограблениях: ранние версии были веселы для одного-двух игроков, а остальные стояли в стороне; задания несколько раз переделывали с нуля, пока каждый из четверых не стал нужен. По его словам, это оказалось «much more difficult than we anticipated». Первая GTA начиналась как игра про полицейских и гонщиков; она была скучной, пока игроку не дали быть плохим ([история](https://en.wikipedia.org/wiki/Grand_Theft_Auto_%28video_game%29)).\n\n### Sid Meier's Pirates!\nMicroProse, 1987; Firaxis, 2004. Образец того, как одна маленькая игра держит торговлю, войну наций, именных соперников, личную историю и улучшения корабля.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000679.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000679.600x338.jpg\" alt=\"бой: шлюп «Кассандра» против брига\">бой: шлюп «Кассандра» против брига<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000680.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000680.600x338.jpg\" alt=\"линейный корабль против военного галеона\">линейный корабль против военного галеона<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000676.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3920/0000000676.600x338.jpg\" alt=\"дуэль на шпагах\">дуэль на шпагах<\/a>\n<\/div>\n\n- **Игра.** Карта Карибов сверху и короткие сцены на ней: морской бой, фехтование, штурм города, танец. В бою ведёшь один корабль, залп наводится сам, выбираешь заряд: ядра по корпусу, книппели по парусам, картечь по команде. У каждого корабля на карте видны флаг, груз, откуда и куда он идёт, так что добычу выбирают.\n- **Сюжет.** Рамка вокруг свободной карьеры: маркиз обратил семью героя в рабство. Сюжет — длинные необязательные нити внутри песочницы: найти родных, в конце взять логово маркиза. Рядом вторая нить — дочери губернаторов.\n- **Мир и экономика.** Четыре нации, чьи война и мир меняются сами; нападая на одну, радуешь её врагов, и они платят чинами и землёй. Цены зависят от места: города у пиратских гаваней дороже берут пушки, дальние — припасы; у маленького города мало золота и товара. Год начала меняет, кому принадлежат Карибы.\n- **Заклятые враги.** Лёгкая авторская форма: девять именных пиратов, у каждого флаг, гавань, корабль и клад, и все в списке десяти лучших, где игрок начинает десятым. Победил — забрал корабль и поднялся в списке. Выкопал клад пирата до победы — он охотится за тобой, как только увидит.\n- **Улучшения.** У корабелов в разных портах: бронзовые пушки, железный набор, медная обшивка. Мастера (парусный, бондарь) приходят с захваченных кораблей.\n- **Классы.** Один выбор в начале: умение, которое помогает в одной из сцен. Второй «класс» — тип корабля: шлюп для разбоя, фрегат для боя, галеон медленный и крепкий.\n- **Кооп.** На PC нет.\n- **Возраст.** У карьеры есть часы: с годами капитан фехтует медленнее. Когда делить добычу и когда уйти на покой — часть игры; в конце счёт славы.\n- **Как приняли.** 94 % из 4 797, Metacritic 88. IGN хвалил, как много занятий сложены вместе и дают выбрать стиль, и ругал повторы со временем.\n- **Взять:** список десяти именных соперников с игроком внизу, у каждого флаг, дом и приз; соперника, который начинает охоту, когда ограбишь его тайник; стороны, чья война и мир меняют, кто сегодня добыча; корабли, у которых виден груз и путь; личную нить, живущую внутри открытого мира как длинные необязательные задания.\n- **Не переносится:** карьера одного капитана с возрастом спорит с коопом, куда входят и выходят; фехтование, танцы и бой на суше — отдельные игры со своей ценой.\n\nSoren Johnson о [правилах Сида Мейера](https://www.gamedeveloper.com/game-platforms/analysis-sid-meier-s-key-design-lessons): одна хорошая игра лучше двух отличных, и Pirates! избегает этой беды только потому, что её сцены длятся несколько минут и каждая — шаг на длинном пути. Сам Мейер строил игру вокруг фантазии о пиратах, а не вокруг истории.\n\n### King of Seas\n3DClouds, около 18 человек, 2021. Тот же жанр и почти та же камера. Обещал почти всё из списка владельца и получил средние оценки, поэтому это главный урок отчёта.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a71a2d50aa80f013120250a63db016a7859e5e2e.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a71a2d50aa80f013120250a63db016a7859e5e2e.600x338.jpg\" alt=\"бой\">бой<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a20cc91be2c16752c7336c7a3e175b9c2c30219c.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a20cc91be2c16752c7336c7a3e175b9c2c30219c.600x338.jpg\" alt=\"порт\">порт<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_580c9435a810bbc79ea9836d664bd8e199e1bc06.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1209410/ss_580c9435a810bbc79ea9836d664bd8e199e1bc06.600x338.jpg\" alt=\"кракен\">кракен<\/a>\n<\/div>\n\n- **Игра.** Ход задают три паруса, пушки бьют с борта на малую дальность. Сверху — до двадцати умений, большей частью магия, вдвое дальше пушек; у врагов их почти нет. Бои — медленные круги на краю секторов огня ([PC Gamer](https://www.pcgamer.com/king-of-seas-review/)).\n- **Сюжет.** Написанная кампания: дитя короля, обвинённое в его убийстве. PC Gamer: история уместится в один твит. [Nintendo Life](https://www.nintendolife.com/reviews/switch-eshop/king_of_seas): многообещающее начало, которое сразу выдаёт свои сюрпризы. Позже сюжет требует уровня: «достигни 35-го».\n- **Мир и экономика.** Обещано: процедурная карта и мир, который меняется от поступков игрока. Сделано: порт делает много одного товара и мало другого, цены разные, торговля бывает выгоднее разбоя; по карте ходят купцы и патрули; порты берут, кружа у башен. PC Gamer: проступков игрока никто долго не помнит.\n- **Заклятые враги.** Нет. Награда за голову — число, которое усиливает охотников.\n- **Улучшения.** Больше 900 предметов трёх редкостей с воды, обломков, пляжей и рынков; уровни. Враги растут вместе с игроком.\n- **Классы.** Пять типов кораблей.\n- **Кооп.** Нет.\n- **Как приняли.** 57 % из 607 в Steam, Metacritic 68. PC Gamer (78): рулить и уворачиваться приятно, но игра плохо говорит, что делать; побочные задания трёх видов — доставь, сопроводи, уничтожь. Nintendo Life (5 из 10): хорошее управление, а потом изнурительная прокачка, далёкое возрождение и одинаковая добыча.\n- **Взять:** никогда не сходить с корабля; умения с перезарядкой, которые бьют дальше пушек и есть только у игрока; порт с одним дешёвым и одним дорогим товаром; добычу, плавающую на воде.\n- **Чего избегать:** процедурная карта, таблица добычи и кривая уровней не сложились в мир. Три вида заданий, пороги уровня, враги, растущие вместе с игроком, мир, который назван отзывчивым и ничего не помнит, долгий путь назад после гибели. Сюжет остался рамкой, которую никто не запомнил.\n\nРуководитель игры Luca Cafasso: студия делала гонки и хотела остаться в технике; сходить на берег пробовали и отказались — «the scope of the game became too broad» ([превью](https://filmstories.co.uk/gaming/king-of-seas-arrrrr-its-a-pirate-game/)).\n\n### Rebel Galaxy\nDouble Damage Games, два человека, 2015. Морской бой в космосе: корабль ходит только по плоскости и бьёт бортом.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_af43bf50a4a6f0369568988628deb12c4840df17.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_af43bf50a4a6f0369568988628deb12c4840df17.600x338.jpg\" alt=\"бортовой бой\">бортовой бой<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_b233b7a42575a16f12cff89e9a1d31efcdc0a3eb.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_b233b7a42575a16f12cff89e9a1d31efcdc0a3eb.600x338.jpg\" alt=\"верфь\">верфь<\/a>\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_c15c9476b66a30d8325b56d587ee222b035aed02.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/290300/ss_c15c9476b66a30d8325b56d587ee222b035aed02.600x338.jpg\" alt=\"бармен\">бармен<\/a>\n<\/div>\n\n- **Игра.** Бортовой залп заряжают, держа кнопку: конус уже, урон больше. Башни стреляют сами, одну можно взять в руки. Отражатель, нажатый вовремя, сбивает ракеты, но на миг отключает свои пушки. Лучшее — большие бои фракций, в которые попадаешь случайно ([PC Gamer](https://www.pcgamer.com/rebel-galaxy-review/)).\n- **Сюжет.** Тонкая линия сюжетных заданий через случайную песочницу. Задание решается по-разному: первое же позволяет заплатить торговцу, запугать его, расстрелять или забрать деньги и купить дешевле в другом месте ([интервью](https://classic.rpgfan.com/features/Rebel_Galaxy_Interview/)).\n- **Мир и экономика.** Станции покупают и продают товары. Стороны: расы, гильдии и местные пираты; отношение двигают и ответы в разговоре, и дела в космосе. Высокое отношение открывает оружие и корабли стороны и приводит помощь; низкое — засады, а при ненависти сторона шлёт убийц. События системы меняют спрос: при голоде можно привезти еду, а можно грабить корабли с помощью и продлить голод ([интервью](https://gamingbolt.com/rebel-galaxy-interview-loot-drops-from-the-edge-of-the-universe)).\n- **Заклятые враги.** По имени нет.\n- **Улучшения.** Вся прогрессия: заработать и купить лучше — пушки, башни, щиты, двигатели, потом корпус крупнее.\n- **Классы.** Нет. **Кооп.** Нет: два человека, осознанно.\n- **Как приняли.** 86 % из 5 326, Metacritic 75. PC Gamer (70): красиво, большие бои захватывают; но слабый корабль в начале, случайные перехваты в каждом рейсе и рост, который про вещи, а не про умение: «Earn more, buy more, win more, repeat».\n- **Взять:** доказательство, что бортовой бой работает как аркада у крошечной команды; отношение сторон, которое открывает детали, приводит помощь или убийц; события мира, которые игрок может облегчить или использовать; сигнал бедствия с двумя сторонами на выбор.\n- **Не переносится:** лестница «деньги за вещи» — именно её рецензенты назвали рутиной.\n\n### Assassin's Creed IV: Black Flag и Skull and Bones\nUbisoft, 2013 и 2024. Первая — лучший морской цикл с одним кораблём за десять лет. Вторая взяла её бой, добавила кооп и экономику и провалилась; разбирать их стоит вместе.\n\n- **Игра (Black Flag).** Оружие выбирает сторона, куда смотрит камера: с борта — залп, вперёд — книппели по парусам, назад — бочки-мины; мортиры вдаль. Побитый корабль можно взять на абордаж за весь груз (потопишь — половина), а победу тратишь на одно из трёх: ремонт, сброс розыска или команду. Подзорная труба показывает груз и силу корабля до боя ([PC Gamer](https://www.pcgamer.com/assassins-creed-4-black-flag-review/)).\n- **Мир.** Корабли разных классов возят материалы для улучшений и товар на продажу. Розыск в море растёт с каждым разбоем и приводит охотников под красными парусами. Форт закрывает район: пока он не взят, карта не показывает занятий района ([Forts](https://www.ign.com/wikis/assassins-creed-4-black-flag/Forts)).\n- **Заклятые враги.** Системы нет. Есть пять легендарных кораблей по углам карты, и у каждого своё правило: один прячется в тумане и бьёт мортирами, другой пробивается только с кормы, двое зажимают между бортами, пятый быстрее игрока и таранит ([Legendary Ships](https://www.ign.com/wikis/assassins-creed-4-black-flag/Legendary_Ships)).\n- **Улучшения.** Корабль растёт за деньги и добытые материалы; добыча крупнее требует корабля сильнее и оплачивает следующий шаг. PC Gamer: хорошая экономика, которая открывает всё более трудные бои, а не тянет время.\n- **Skull and Bones.** Бой и кооп (флот до трёх игроков) рецензенты хвалят. Но всё стоящее надо построить по чертежу: сначала ранг, потом материалы, потом рейс. [Eurogamer](https://www.eurogamer.net/skull-and-bones-review): игрок там «more grocery delivery driver than pirate». [PC Gamer](https://www.pcgamer.com/skull-and-bones-review/) (68): каждое простое дело разбито на три долгих перехода. Стороны забывают игрока, как только он ушёл из вида.\n- **Как приняли.** Black Flag: 85 % из 30 910, Metacritic 88. Skull and Bones: 67 % из 2 283, Metacritic 59.\n- **Взять:** цикл «рассмотреть — обездвижить — взять целиком или потопить за половину — выбрать, на что потратить победу»; несколько материалов улучшения, которые возят заметные типы кораблей; форт, который закрывает район и после взятия открывает его дела; четыре-пять ручных кораблей-боссов по краям карты, каждый ломает одно правило.\n- **Чего избегать:** экономика, превращающая каждое улучшение в три рейса, читается как работа, а мир без памяти — как декорация.\n\n### Middle-earth: Shadow of Mordor и Shadow of War\nMonolith Productions, 2014 и 2017. Отсюда само слово «nemesis»: враг, который помнит игрока и растёт от встречи к встрече.\n\n<div class=\"gallery\">\n<a href=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/241930/ss_68697a274ce491c11d94c0cc94a213177945919c.1920x1080.jpg\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/241930/ss_68697a274ce491c11
