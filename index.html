<script id="data" type="application/json">{"pages": [{"id": "README", "path": "README.md", "title": "Floppa Tropical Adventures — вики", "section": "", "date": "2026-11-13", "md": "# Floppa Tropical Adventures — вики\n\nВся документация игры: решения владельца, как устроена каждая система, открытые вопросы и инструменты. Начать стоит с [Об игре](vision.md).\n\nЭту же вики можно читать как сайт с поиском и картинками: [вики игры](https://gost402.github.io/floppa-wiki/). Его собирает `tools/wiki.py` из этих страниц, а выкладывает `tools/wiki-pages.sh`.\n\n## Разделы\n- **[Об игре](vision.md)** — игра коротко. **[Дорожная карта](roadmap.md)** — что сделать до релиза в Steam. **[Журнал решений](decisions.md)** — что решили и что отвергли, по датам. **[Глоссарий](glossary.md)** — термины игры по-английски и по-русски.\n- **Геймплей:** [Арена](gameplay/missions.md), [Камера и картинка](gameplay/camera.md), [Лодка](gameplay/boat.md), [Бой](gameplay/combat.md), [Сборки и стили игры](gameplay/builds.md), [Охотники и ИИ](gameplay/hunters.md), [Припасы](gameplay/pickups.md), [Добыча](gameplay/haul.md), [Места промысла](gameplay/sites.md), [Прогресс и сохранения](gameplay/progression.md).\n- **Баланс:** [Оружие](balance/weapons.md), [Лодки](balance/boats.md), [Экономика](balance/economy.md).\n- **Гавань:** [Мастерская корабела](base/pier.md), [Верфь](base/boatyard.md), [Полигон](base/testing-ground.md).\n- **Мир:** [Море](world/sea.md), [Локации](world/locations.md), [Рельеф](world/ground.md), [Зоны и опасности](world/areas.md), [Станция](world/outpost.md).\n- **[Онлайн-кооп](online.md).**\n- **Интерфейс:** [HUD](interface/hud.md), [Экраны и меню](interface/screens.md), [Управление](interface/controls.md), [Язык](interface/language.md).\n- **[Арт-дирекшн](art/README.md):** [Облик мира](art/world-look.md), [Облик лодок](art/boats.md), [Люди: флоппы](art/people.md), [Палитра](art/palette.md), [Компоненты интерфейса](art/components.md), [Стиль интерфейса](art/interface.md), [Свет и время суток](art/light.md), [Кандидаты на облик](art/candidates.md).\n- **Звук:** [Звук](audio/sound.md), [Музыка](audio/music.md).\n- **Сюжет:** [Сеттинг и лор](story/setting.md), [Сцены сюжета](story/scenes.md), [Диалоги и голос](story/dialogue.md).\n- **[Инструменты](tools/README.md):** [Код](tools/code.md), [Демо](tools/demos.md), [Редактор карт](tools/map-editor.md), [Редактор сюжета](tools/story-editor.md), [Ассеты](tools/assets.md), [Сборки и посты](tools/release.md).\n- **[Открытые вопросы](questions/README.md)** — всё, что ждёт ответа владельца, и [Чего нам не хватает](questions/gaps.md).\n- **[Отчёты](reports/README.md)** — отчёты и исследования, что были артефактами Claude: выбор облика, разборы, другие игры.\n- **[Известные недочёты](known-issues.md)** — что игрок видит или чувствует неправильным и что пока не исправлено.\n\n## Как вести вики\n- Всё — прототип, и ничто не высечено в камне. Решение — направление, в котором строить сейчас; любое может измениться, когда игра покажет лучшее.\n- То, что в игре уже есть, скорее всего имеет смысл: считать это выбранным или временной заменой, прежде чем называть пробелом.\n- Строить по решениям, но говорить, когда игра спорит с решением. Числа в игре — стартовые значения для настройки.\n- Где решения нет, построить самое простое, что оставляет варианты открытыми, описать это на странице темы как «решение без владельца» со ссылкой на вопрос и добавить вопрос.\n- Когда владелец отвечает, записать решение в «Решения владельца» на странице темы и удалить вопрос; историю хранит git. Крупное решение — строка в [Журнале решений](decisions.md).\n- Любой лор, фракцию или механику сверх решённого помечать как предложение ([Сеттинг и лор](story/setting.md)).\n\n## Как устроена страница\n- «Решения владельца» — только то, что решил владелец.\n- «Как устроено» — что игра делает сегодня, с файлами кода. Решения без владельца помечены там же со ссылкой на вопрос.\n- «Открытые вопросы» — ссылки на вопросы темы. Вопрос живёт под заголовком своего номера (`### Q17`), так что ссылка `questions/missions.md#q17` ведёт прямо к нему.\n- Коротко и простыми фразами: что делает система, приём, одна строка «почему», какие файлы. Каждый факт — в одном месте, на другие ссылаемся. Числа настройки живут в коде; исключение — страницы [баланса](balance/weapons.md): это снимок значений, у каждой таблицы назван источник, и число на них правится в том же коммите, что и в коде.\n- Вики пишется по-русски; идентификаторы кода, пути, клавиши и имена демо — как в коде. Правила проекта для агентов — в [CLAUDE.md](../CLAUDE.md), по-английски.\n- Лодка — вещь: в русском у неё род своего существительного (лодка — она, катер — он), без олицетворения.\n"}, {"id": "art-README", "path": "art/README.md", "title": "Арт-дирекшн", "section": "art", "date": "2026-11-13", "md": "# Арт-дирекшн\n\nКак игра выглядит и как мы приходим к её облику. Каждая тема облика — на своей странице.\n\n## Направление\nМир — солнечный тропический архипелаг: бирюзовая лагуна над белым песком, сочная зелень и пальмы, мечтательная вода пляжных уровней начала 2000-х, мягкий яркий свет и тени облаков. Интерфейс — стекло в духе Frutiger Aero поверх этого мира: прозрачное, с водой и светом за ним, с бликом и кромкой, сдержанное и спокойное, с широкими полями. Материал там, где он важен, остальное тихо.\n\n2026-11-11 владелец решил: интерфейс берёт стиль Frutiger Aero, прозрачное стекло и красивое движение уровня лучших инди, начиная с кнопок базы; у игры есть официальная [палитра](palette.md) и [базовые компоненты](components.md). 2026-11-12, увидев кадры плиток, он сказал нести стекло дальше: на меню, карточки верфи и HUD.\n\n## Страницы\n- [Палитра](palette.md): цвета игры по ролям.\n- [Компоненты интерфейса](components.md): базовые детали, их состояния и движение.\n- [Облик мира](world-look.md): море, острова, песок, зелень, кильватер.\n- [Облик лодок](boats.md): корпуса, ливреи, оснастка, банда охотников.\n- [Люди: флоппы](people.md): все жители мира — каракалы-флоппы, и их портреты.\n- [Стиль интерфейса](interface.md): вещи мира, шрифты, материалы, выноски.\n- [Свет и время суток](light.md): небо, солнце, ночь, рассвет.\n- [Кандидаты на облик](candidates.md): целые облики игры и облики меню, построенные на выбор. Владелец ещё не выбрал.\n\n## Правила\n- Один облик везде: затенение, цвет и свет одни для всей игры ([CLAUDE.md](../../CLAUDE.md), принцип 3).\n- Сначала спросить, какой облик владелец себе представляет. Перед тем как моделировать или перекрашивать что-то видимое, задать короткий раунд вопросов по-русски: форма, материал, цвет, главные детали. Облик по догадке уже промахивался: первая база, погода.\n- Никаких картинок, сгенерированных ИИ (владелец, 2026-11-07). Облик показывают кадры самой игры из [демо](../tools/demos.md) или ссылки на настоящие игры. Портреты, уже нарисованные локальной моделью, остаются, пока владелец не скажет иначе ([Люди: флоппы](people.md)).\n- Владелец судит облик, играя, и по кадрам игры, а не по описаниям.\n- Ни одна другая игра не называется в интерфейсе, в коде и в вики.\n- Откуда берутся модели, звук и шрифты: [Ассеты](../tools/assets.md).\n\n## Что владелец отверг\nЧтобы не повторять.\n- **Карточки «как у приложения»** (2026-10-26): первый HUD и верфь — скруглённые тёмные стеклянные карточки, шрифт по умолчанию — владелец назвал безликими и «сгенерированными ИИ». Никаких карточек и скруглённых стеклянных панелей.\n- **HUD из тонких светящихся линий по образцу военного авиасимулятора** (2026-10-26 — 2026-10-29): образец снят, интерфейс стал вещами мира.\n- **Погода** (2026-10-27): туман, дождь, шторм и гром, построенные как физические модели, сняты целиком: «не так, как я представлял». Вопрос [Q6](../questions/world.md#q6).\n- **Пена по неподвижному V от носа** (2026-10-28): пена должна быть симулированной и принадлежать воде. Брызги потом урезаны как «чрезмерные».\n- **Усиленные стилизованные кильватерные волны** (2026-10-30): «выглядят плохо», откачены. Перед новой попыткой спросить, что владелец представляет.\n- **Первая база** (2026-10-31): жёлтый дом с красной жестяной крышей. Владелец представлял открытый деревянный эллинг; 2026-11-10 эллинг сменил открытый пирс, а 2026-11-13 пирс с гребёнкой мест под экран базы — мастерская корабела, место открытого мира ([Гавань](../base/pier.md)).\n- **Персонажи с вещами в лапах** (2026-11-06): никто ничего не держит.\n- **Неоновый свет причала** (2026-11-12): кольцо и столб неонового света, как маркеры миссий Vice City, — «слишком ярко, слишком пёстро, неестественно». Место отмечает вещь мира со сдержанным светом: стеклянные поплавки с тёплыми огоньками ([Пирс](../base/pier.md)).\n- **Меню с картинок** (2026-11-06 — 2026-11-07): стопки толстых глянцевых кнопок во всю ширину по центру, жирный шрифт с обводкой и логотип с фаской — «дешёвая мобильная игра». Яркие меню пляжного уровня, каждая строка в плашке, блики — «дёшево, громко, без вкуса». Мраморная табличка и алюминиевая панель с тонкой антиквой — «ни то ни другое». Небольшой список простых слов слева, широкие поля и материал только на выбранном пункте читались как консольная игра.\n- **Слишком близкая камера и бледное открытое море** (2026-11-07, после игры): зум и тон картинки вернули ([Q77](../questions/world.md#q77)).\n\n## Что владельцу понравилось\n- Frutiger Aero и Utopian Scholastic (2026-11-02): «потрясающе» — теперь это образцы интерфейса ([Стиль интерфейса](interface.md)). 2026-11-11 — постер Frutiger Aero (стеклянный шар, прозрачная волна с пузырьками, небо, листья, полосы света, мелкие подписи «// discover»): по нему сделаны кнопки базы.\n- Мир на картинках меню (2026-11-06): песок, зелень, пальмы, каустика, облачные тени ([Облик мира](world-look.md)).\n- Материалы: стекло в шлифованном алюминии и белый мрамор с хромом (2026-11-06, этюды).\n- Мечтательная ностальгическая вода пляжных уровней начала 2000-х — как вдохновение, а не как бирюзовый оттенок на всём (2026-11-06).\n\n## Открытые вопросы\n- [Q6](../questions/world.md#q6): погода.\n- [Q166](../questions/interface.md#q166): меню и верфь в стекле. HUD остаётся стеклом без преломления, а диалог, циферблат рыбалки и показатели верфи переходят в стекло ([решено 11-12](../decisions.md)).\n- [Q159](../questions/interface.md#q159), [Q160](../questions/interface.md#q160), [Q161](../questions/interface.md#q161): палитра, стеклянные плитки и движение, базовые компоненты.\n- Какой облик взять со стендов: [Кандидаты на облик](candidates.md).\n"}, {"id": "art-boats", "path": "art/boats.md", "title": "Облик лодок", "section": "art", "date": "2026-11-11", "md": "# Облик лодок\n\n![Все корпуса в ряд](../img/fleet.jpg)\n\nКак выглядят лодки игрока и охотников. Как лодка устроена и ходит: [Лодка](../gameplay/boat.md).\n\n## Решения владельца\n- Лодки выглядят как настоящие моторные: седловатость, наклонённый и развалистый нос, планширь, кокпит, настоящие моторы, рубки и оснастка, у каждой поверхности своя краска, лак или металл.\n- Ливреи — гоночная графика: смелые полосы от носа до кормы, крупный номер на носу, палуба контрастного цвета. Лодки освещены как море, но ярче: насыщенная краска, чёткий лак и хром, тёмный привальный брус обводит корпус.\n- Корпуса побольше несут рубку или пульт под жёсткой крышей; они нарисованы, но это не деталь. На палубах оснастка (леера, утки, бортовые огни, антенны, бухты троса, канистры) и приметы сеттинга: солнечные панели на крышах, парусиновые тенты, ветряки, зелень в кадках.\n- Пропорции слегка преувеличены, чтобы лодка читалась с высоты боя: борта выше, моторы и ветровые стёкла крупнее, нос острее.\n- Охотники — банда со своим обликом: малиновый и чёрный, акульи зубы на носу, рваные полосы, потёртая краска.\n\n## Как устроено\n- **Ливреи** (`Livery`, `LiveryModel`, `HullMesh`): у каждого корпуса игрока свои цвета и номер ([Q14](../questions/world.md#q14)); каждый охотник носит малиновую ливрею своей банды. Графика лежит чуть над корпусом, как игры кладут декали; цифры номера — скруглённые штрихи, потому что пересекающиеся контуры вариативного Nunito не триангулируются. Почему облик несут полосы и палуба: с высоты боя лодка занимает около 70 px.\n- **Наряд** (`OutfitModel`): тенты, рубки, крыши, солнечные панели, леера и огни рисуются там, где не стоит деталь, и ничего не весят. Какой корпус что несёт: [Q14](../questions/world.md#q14).\n\n## Как к этому пришли\n- 2026-10-28: владелец попросил модели лучше и выбрал настоящие моторные лодки — не пухлые стилизованные и не рейдеров из хлама. Прежние корпуса были неверны во всём: форма, голые палубы, детали-коробки, плоское затенение.\n- 2026-11-02: на вопрос, что значит «стильнее», владелец выбрал гоночную графику, реалистичный, но более яркий свет, все детали с приметами сеттинга и банду охотников со своим обликом.\n\n## Открытые вопросы\n- [Q11](../questions/world.md#q11): какой настоящей лодкой должен быть каждый корпус.\n- [Q14](../questions/world.md#q14): ливреи и наряды.\n"}, {"id": "art-candidates", "path": "art/candidates.md", "title": "Кандидаты на облик", "section": "art", "date": "2026-11-12", "md": "# Кандидаты на облик\n\nОблики, построенные на выбор владельцу. Каждый живёт в своём демо-стенде; в игре их нет, пока владелец не выберет. Владелец ещё не выбрал ни один.\n\nКак смотреть: `Esc` → «Инструменты» → «Демо» → стенд → облик. `Current` — игра как есть. Оценки ниже — наши, не владельца.\n\n## Облик всей игры: стенд `Art`\n- 2026-11-07 владелец попросил заново придумать облик, «не глядя на нынешний дизайн, а думая о геймплее». Шесть целых обликов, каждый с тем, как в нём ощущается игра. Стенд `game/demos/Art/` подменяет шейдеры игры на одном бое и снимает кадры: общий, залп, попадание, враг, потопление, мелководье, крупно.\n- **Ink** 7.8 — комикс в заливке.\n- **Lagoon** 7.3 — светлый ключ, гоночные ливреи; самый дешёвый: перенастраивает нынешние шейдеры.\n- **Poster** 7.2 — приглушённая трафаретная печать.\n- **Logbook** 7.0 — акварель.\n- **Deep** 6.8 — сумерки и свечение.\n- **Tin** 5.5 — игрушки на смоле.\n- Наш выбор: Ink. [Отчёт](../reports/2026-11-07-art-directions/index.html).\n- Если выбран облик или куски нескольких: перенести его шейдеры в шейдеры игры (небо, море, земля, поверхности, бой, HUD), а не держать подмену из демо, и убрать остальные.\n\n## Облик меню: стенд `Menus`\n- 2026-11-06 владельцу не понравились меню и кнопки. Шесть обликов меню в `game/demos/Menus/Looks/`, каждый показан на базе и на море.\n- **Quiet** 8.4 — консольный список, по нему скользит одна гелевая плашка.\n- **Glass** 7.9 — матовое стекло.\n- **Notebook** 7.8 — карточка, приклеенная и написанная от руки.\n- **Atlas** 7.0 — страница атласа в духе Utopian Scholastic.\n- **Device** 6.8 — починенный аква-прибор в руке.\n- **Dashboard** 6.5 — пузыри на ватерлинии.\n- Наш выбор: Quiet; Glass, если нужен материал; Notebook, если нужна вещь мира. [Отчёт](../reports/2026-11-06-menu-looks/index.html).\n- `Current` на стенде — прежние глянцевые пилюли; меню игры с 2026-11-12 — стекло ([Экраны и меню](../interface/screens.md)).\n- Если выбран: перенести в `game/ui` (`Menu`, `Pill`), поправить [Экраны и меню](../interface/screens.md), убрать остальные. Выбранный облик должен рисовать шкалы настроек.\n\n## Проверка интерфейса\n- 2026-11-03 отчёт QA по интерфейсу: 102 замечания, все исправлены 2026-11-04. [Отчёт](../reports/2026-11-04-interface-qa/index.html).\n\n## Открытые вопросы\n- [Q89](../questions/world.md#q89): облик со стенда `Art`.\n- [Q90](../questions/world.md#q90): облик меню со стенда `Menus`.\n"}, {"id": "art-components", "path": "art/components.md", "title": "Компоненты интерфейса", "section": "art", "date": "2026-11-13", "md": "# Компоненты интерфейса\n\n![Компоненты на стенде Components](../img/components.jpg)\n\n![Меню, клавиши, карточки и выноски на стенде Components](../img/components-glass.jpg)\n\n![Окно инструмента и его элементы на стенде Components](../img/tool-window.jpg)\n\nБазовые детали, из которых собран интерфейс, каждая в своих состояниях. Все видны разом на стенде `Components` ([Демо](../tools/demos.md)). Цвета — из [палитры](palette.md).\n\n## Решения владельца\n- 2026-11-11: интерфейс — стекло в духе Frutiger Aero: полупрозрачное, с настоящим светом и водой за ним, с красивой «инди» анимацией; у игры есть базовые компоненты ([Арт-дирекшн](README.md)). Первыми так сделаны кнопки базы.\n- 2026-11-12: стекло идёт дальше: на меню, карточки деталей верфи и HUD.\n- 2026-11-12: облик не переносят по частям: у игры одна тема Godot со всем обликом, чтобы менять его быстро.\n- 2026-11-12: стекло было слишком прозрачным; оно стало чуть менее прозрачным: оттенок прозрачного стекла закрывает 26–32% сцены, приборы HUD дымчатее на шаг. Владелец посмотрел: пока достаточно.\n- 2026-11-12: тема одна на всё: каждая деталь интерфейса берёт облик из неё, диалог тоже; прежние решения о виде отдельной детали исключением не служат. Диалог (ответы списком, как меню, имя мелкой подписью), циферблат рыбалки и экран показателей верфи — стекло.\n- 2026-11-13: вся бумага интерфейса становится стеклом: бумажных вещей, скотча и рукописного шрифта в нём не остаётся. Карта — прозрачное стекло, на котором берег, глубины и отметки нарисованы светом; судовой журнал — окно матового стекла со строками; продажа — экран торговца ([Добыча](../gameplay/haul.md)).\n\n## Как устроено\nРешения без владельца: что считается базовым компонентом ([Q161](../questions/interface.md#q161)); рецепт стеклянных плиток и движения ([Q160](../questions/interface.md#q160)); меню, колпачки, выноски и карточки верфи в стекле ([Q166](../questions/interface.md#q166)); диалог и радио в стекле ([Q171](../questions/interface.md#q171)); панель показателей верфи ([Q172](../questions/interface.md#q172)); окна инструментов в стекле выносок ([Q58](../questions/interface.md#q58)); что держит тема ([Q173](../questions/interface.md#q173)); последние глянцевые детали HUD ([Q175](../questions/interface.md#q175)); экран торговца ([Q176](../questions/haul.md#q176)); журнал, карта и мелкие бывшие бумажные вещи в стекле ([Q178](../questions/interface.md#q178)); HUD в стекле ([решено 11-12](../decisions.md)).\n\n### Тема\nВесь облик интерфейса лежит в одном файле — теме Godot `game/ui/look.tres`; код читает её через `ui/Look.cs`. Правка файла меняет игру без сборки: она читает его при старте.\n- **Палитра** (тип `Hue`): цвет на каждую роль. Имена ролей и их смысл — в `ui/Hue.cs`, значения — в теме ([Палитра](palette.md)).\n- **Шрифты** (тип `Faces`): по одному на начертание: обычный, средний, жирный, капители (одни: `caps`), антиква и другие; рукописного нет. Основной шрифт — файл `nunito` в начале темы.\n- **Роды стекла** — стилбоксы двух своих классов с настоящими числами: `clear` (плитки, пилюли, карточки, кошелёк) и `frosted` (выноски, реплика диалога, окна инструментов и их листы) — стекло, которое читает экран (`GlassKind`); `hud` — стекло HUD (`LensKind`). В стилбоксе всё, что решает вид материала: сколько сцены закрывает оттенок, смягчение, изгиб и глубина кромки, дым, тень, блики, пойманный свет. Деталь называет свой род, а чисел не держит.\n- **Детали** (типы `Tile`, `Menu`, `Pill`, `Card`, `Purse`, `Balloon`, `KeyCap`, `Dial`, `Kit`, `Slot`, `Wheel`, `Plate`, `Notice`, `Speech`, `Radio`, `Stats`, `LineDial`, `Dash`, `Markers`, `ToolWindow` и другие): размеры, скругления, зазоры и кегли в целых пикселях, род стекла, и доли вроде дыма панели — в сотых (`Kit/constants/smoke = 70`).\n- **Общее для нескольких деталей**: `Screen` — поля и виньетка всякого полноэкранного экрана (верфь, вид сбоку); `Note` — панель-список HUD в углу экрана (`ListPane`): цели в бою и дело вида сбоку; `Motion` — общие длительности движения, в миллисекундах; `Light` — место единственного света над экраном, который ловит всякое стекло.\n- **Окна инструментов** целиком из той же темы: собственные элементы Godot (кнопка, поле, выбор, число, ползунок, переключатель, список, вкладки) получают облик по своим типам и вариациям темы (`Window.Theme`), без правок на каждом элементе; их размеры и кегли — в типе `ToolWindow` и типах Godot.\n- Чего в теме нет: пружин и собственной хореографии детали (они в `ui/Motion.cs` и в самой детали), пропорций внутри рисунка (штрихи пиктограмм, дуги циферблатов, ширина кромки) и долей внутри шейдеров. В теме то, что меняют при смене облика: цвета, шрифты, кегли, размер, углы, поля и зазоры детали, насколько она дымчата или притемнена.\n- Четыре главные ручки: прозрачность стекла — `CoverTop` и `CoverFoot` рода `clear`; дым HUD — `SmokeKeepsTop` и `SmokeKeepsFoot` рода `hud` и `smoke` у каждой детали; акценты — `Hue/colors/player`, `hostile`, `aim`, `caution`, `aqua`; основной шрифт — файл `nunito`.\n- Другой материал вместо стекла всё ещё потребует нового рисования, но в двух компонентах стекла (`Glass`, `Lens`), а не в каждой детали.\n\n### Стекло\nСтекло двух родов:\n- **Читает экран** (`Glass`, `ui/glass.gdshader`; выноски, реплика диалога, окна инструментов и их листы — `ui/frosted.gdshader`; общее — `ui/glass.gdshaderinc`): сцена за стеклом чуть смягчена и преломлена по толстой кромке. Так сделаны плитки, пилюли, карточки и выноски: там преломление и есть облик. Цена — копия всего экрана раз в кадр на каждый слой холста, где такое стекло видно: около 1,0–1,3 мс при 3024×1964, сколько бы стёкол в слое ни было. Поэтому на каждом экране такой слой один, а ушедшие плитка и кошелёк ничего не рисуют.\n- **Смешивается со сценой** (`Lens`, `ui/lens.gdshader`; форма и свет — `ui/glass_shape.gdshaderinc`): сцена видна сквозь стекло как есть, без преломления; толщину кромки дают тень внутри неё, серп света и ответный блик. Так сделан HUD в бою: он стоит около 0,1 мс кадра. С чтением экрана он стоил 1,0 мс, и вся цена была в копии экрана. Все стёкла одной части HUD рисует один материал: форму и состояние каждого несёт его четырёхугольник.\n\nСлова на стекле белые, с тёмным ореолом своей формы и тонкой тёмной тенью (`Pill.Engrave`): так они читаются и над песком, и над пирсом, и над глубокой водой. Тёмные слова остались только на матовой выноске. Так пишется всё на стекле: и HUD, и буквы колпачков клавиш; слова прямо над водой — со своей тёмной каймой (`Style.Write`).\n\nВ стекле:\n- **Стеклянная плитка** (`Ribbon`, `Glass`): кнопки причала и места верфи. Сквозь неё ясно видна лагуна, чуть смягчённая, под едва заметным аква-оттенком; толстая кромка преломляет то, что под ней, как край волны на образце, с лёгким цветным разводом; внутри нижнего края тень для глубины; серп света в двух пикселях под верхней кромкой, толще и ярче посередине и сходящий на нет к углам, от одного света над экраном, поэтому на каждой плитке блик лежит чуть иначе, и слабый ответный блик на нижней правой кромке; мягкая тень на воде. Состояния: покой; под указателем (чуть светлее и выше); выбрана (в стекле пойман свет лагуны, светлый сверху, где видна вода, и глубже в полосе за словами, мягкое свечение вокруг, приподнята, у краёв медленно всплывают и гаснут пузырьки); нажата (сжата к низу, пружинит назад чуть больше своей формы, пиктограмма приседает и садится на кадр позже, по контуру бежит рябь света, из точки нажатия наружу всплывают пузырьки); путь вперёд (прозрачная сверху, оранжевый свет поднимается снизу примерно на треть, кромка тёплая, шевроны каждые несколько секунд подаются вперёд); путь вперёд выбран (насыщенный оранжевый свет, сверху видна вода, мягкое свечение вокруг, без пузырьков).\n- **Строка меню и пилюля** (`Menu`, `Pill`): невыбранный пункт меню — только слова. Стекло видно под линзой света и на выбранном пункте: прозрачная пилюля, сцена преломлена по кромке, свет лагуны лежит мягкими овальными пятнами под словами (под надписью и под значением отдельно), стекло между ними прозрачно, вокруг пилюли мягкое аква-свечение. Пилюля, которую жмут клавишей («Готово» и «Испытать» верфи), — прозрачное стекло всегда: под указателем наливается светом, путь вперёд светится оранжевым снизу, неактивная бледнеет.\n- **Переключатель, шкала и стрелки** (`Gloss.Switch`, `Gloss.Gauge`, `Gloss.Nudger`, `Gloss.Bead`): маленькие прозрачные стёклышки с тонкой кромкой и бликом. Ручка переключателя — белое стекло на пружине; включённый светится зелёным.\n- **Колпачок клавиши и подсказки** (`Gloss.Key`, `Gloss.Cap`, `Gloss.Hints`, `Buttons`): дымчатое стекло с белыми буквами, как у кошелька; кнопки A, B, X и Y геймпада — стеклянные бусины своих цветов.\n- **Выноска** (`Balloon`, `Gloss.Balloon`): стекло, прозрачное у кромки и матовое глубже, под бледной аквой; матовость идёт по её собственному контуру. Слова тёмные. С предупреждением — янтарная кромка и знак. Бумажной бирки больше нет: имена товарищей у пирса — та же стеклянная выноска.\n- **Карточка** (`ui/Card.cs`): общая стеклянная карточка: детали верфи (`Choices.Choice`), ящики и товары экрана торговца. Под фокусом наливается светом лагуны и светится вокруг; установленная деталь — тонкое оранжевое кольцо и оранжевый свет снизу; некупленная — матовая под замком; товар, которого не надо, стоит бледным (`Card/faded`). Цена — на ярлыке белого стекла с монетой (`Purse.Tag`), зелёная или красная ([Верфь](../base/boatyard.md)).\n- **Кошелёк** (`Purse`): пилюля из дымчатого стекла (глубокая на светлом небе), белое число, яркий золотой жетон с бликом.\n- **Подпись** (`Quayside`): над лентой причала — квадратные точки по числу плиток, выбранная залита, и «// что делает плитка» мелкими капителями.\n- **Пиктограммы** (`Icons`): простые линейные рисунки в коде: ключ, двое, книга, три полосы, шевроны.\n- **Линза прибора** (`Dash`, `Lens`): корпус, нитро, топливо и дым — круглые дымчатые линзы, море видно сквозь них, к середине, за цифрами, дым гуще; показания рисуются поверх. Нитро в работе наливает линзу оранжевым, дым — аквой; лампа топлива — своя маленькая линза, янтарная, пока топлива мало, красная, когда бак сух, и дымчатая, пока не горит; удар пускает по линзе корпуса кольцо света. Подписи под приборами — мелкие белые капители с тёмным ореолом (`Gloss.Caption`), без плашки; трещина топливного стекла осталась ([HUD](../interface/hud.md)).\n- **Ромб рулетки** (`Roulette`): дымчатое стекло, выбранный ловит свет лагуны, по нему проходит блик (`Gloss.Glint`); лампы гнёзд дронов — маленькие линзы своего смысла; указатель — плоский оранжевый треугольник.\n- **Плитка расходника и слот трюма** (`KitBar`, `HoldRow`): маленькие стёкла. Плитка ловит свет, ближайший к цвету её расходника, гуще у дна: ярко, пока его можно взять, слабо, пока нет; пустой слот едва виден.\n- **Уведомление и табличка** (`Toasts`, `Markers`): дымчатые стеклянные пилюли с белыми словами. Табличка ловит цвет своего смысла: красный охотника, золото цели, акву союзника; предупреждение — красный. Значок уведомления — круглая линза в свете своего вида. Предложение работы под лодкой лежит на такой же пилюле. Метки и таблички редактора карт на море — то же стекло.\n- **Диалог** (`talk/Dialogue.cs`, тип `Speech`): выноска реплики — матовое стекло подсказок (`Gloss.Balloon`), крупнее, хвост к говорящему, буквы тёмные; имя — мелкая подпись прописными над выноской, белая с ореолом; ответы — список, как меню (`Pill.Row`), выбранный на стеклянной пилюле со светом, у каждого бледная цифра; Enter — клавиша дымчатого стекла (`Gloss.Key`). Стекло видит притемнённый мир и портреты: под ним экран копируется только в его прямоугольнике (`BackBufferCopy`) ([Диалог](../story/dialogue.md)).\n- **Радио** (`talk/Radio.cs`, тип `Radio`): стекло HUD (`Lens`): реплика белыми буквами с ореолом на дымчатой панели, портрет в стеклянной рамке, имя — та же мелкая подпись.\n- **Экран показателей верфи** (`StatsPanel`, `Glass`, тип `Stats`): высокая панель стекла карточек, затемнённая под белые слова с тёмным ореолом. Показатели — полоски стекла, залитые аква; изменение от подсвеченной детали зелёное или красное. Нагрузка и лампа — стеклянные бусины (`Gloss.Bead`). Имя — мелкими белыми капителями над панелью, номер — на круглой стеклянной бусине цвета полосы корпуса. Значки деталей (`Badge`) — тоже бусины ([Верфь](../base/boatyard.md)).\n- **Циферблат рыбалки** (`LineDial`, `Lens`, тип `LineDial`): круглая дымчатая линза, как приборы лодки, стрелка та же; лампа — маленькая линза, ловящая красный, пока рыба рвётся.\n- **Окно инструмента** (`Window`, `Pane`, `ui/frosted.gdshader`, тип `ToolWindow`): то же матовое стекло, что у выносок, со своим радиусом углов. Заголовок — тёмные слова на стекле над гравированной линией, закрыть — стеклянная бусина с крестиком. Кнопки — прозрачные стеклянные пилюли, которые под указателем наливаются светом лагуны, путь вперёд — оранжевым; поля, выборы и числа — вдавленное стекло с тёмными словами; переключатель — `Gloss.Switch`, ползунок — стеклянная ручка на дорожке, залитой светом. Внутри окна ничего не читает экран. На верстаке `Components` — кадр `tools`.\n- **Экран торговца** (`ui/Counter.cs`, тип `Trade`): портрет и реплика торговца — портрет и матовая выноска диалога (`Speech`); карточки трюма и товаров — `Card`; «Продать всё» и «Готово» — пилюли с клавишами; кошелёк — `Purse`; всё стекло в одном слое холста ([Добыча](../gameplay/haul.md)).\n- **Судовой журнал** (`ui/Logbook.cs`, `ui/SaveRow.cs`, тип `Logbook`): панель того же матового стекла, что и окна; каждый слот — строка со снимком лодки со скруглёнными углами и тёмными словами, выбранная строка — строка меню (`Pill.Row`) со светом лагуны и белыми словами, к ней скользит линза; «Сохранить сюда», «Загрузить» и «Новая игра» — обычные пилюли `Pill`, предупреждения — стеклянная выноска ([Экраны и меню](../interface/screens.md)).\n- **Карта** (`MapView`, `MapPlot`, тип `Map`): большое стекло HUD (`Lens`): сквозь него видно море, а суша, берег, изобаты, мели, сетка и роза ветров нарисованы на нём светом из `Aqua` и `White`; гавань — оранжевое кольцо, задания — золотые, слова — белые с ореолом. Пока она открыта, отметки и уведомления под ней гаснут ([Добыча](../gameplay/haul.md)).\n- **Список** (`ListPane`, тип `Note`): дымчатая панель HUD слева вверху, заголовок капителями, строки белыми словами с ореолом, счёт справа. У строки, которую можно выполнить, — круглая линза; выполненная наливается зелёным, в ней проступает галочка, строка тускнеет. Цели в бою (`Objectives`, падает сверху и уходит вверх) и вид сбоку.\n- **Карточка улова** (`HaulCard`, тип `HaulCard`): дымчатое стекло HUD, ровная; образец в скруглённом окне с водой, название и факты белыми словами, подписи капителями.\n\nНе стекло: только монета кошелька (`Gloss.Bubble`), глянцевый кружок самой вещи. Старые глянцевые и бумажные приёмы живут лишь на стенде кандидатов `Menus` (`demos/Menus/Looks/Old.cs`); игра их не несёт.\n\n## Движение\nПримитивы в `ui/Motion.cs`: именованные длительности, значения которых лежат в теме (тип `Motion`): (`Quick` — нажатие, `Brisk` — свет и затухание, `Settle` — возврат на место, `Arrive` — приход и уход вещей экрана), шаг между вещами, приходящими по очереди (`Stagger`), появление вещи (`Pop`), раскрытие и складывание листа (`SheetOpen`, `SheetClose`), медленное дыхание (`Breath`) и пружины `Spring` трёх настроек: `Snappy` (выбор скользит, чуть проскакивая), `Bouncy` (вещь прилетает, проскакивает и садится), `Soft` (без перелёта). Пружины шагают мелкими равными долями, поэтому одинаковы при любой частоте кадров.\n\nПравила:\n- Всё приходит с замедлением и чуть проскакивает; вещи появляются по очереди. Страница меню приходит целиком не дольше полсекунды; надпись строки и её переключатель приходят вместе.\n- Выбор скользит: выбранная плитка наливается светом сразу, прежняя гаснет чуть медленнее, а между ними по ряду и узким свечением по воде в промежутках проезжает линза света, появляясь вместе со своей плиткой; плитки по пути не загораются. Клавиши, стик и указатель двигают её одинаково. Подпись едет за линзой и меняет слова, когда свет над плиткой. В меню линза скользит по столбцу, и стекло пункта видно, только пока она над ним; по ряду карточек верфи она идёт к карточке под фокусом.\n- Нажатие сжимает плитку к низу и отпускает с пружиной чуть дальше формы; слова отстают на кадр; по контуру бежит рябь света, всплывают пузырьки. У пилюли и карточки вспышка и рябь сильнее, пузырьков два, крупных.\n- Приход: плитки поднимаются по очереди, один раз проскакивают и садятся, слегка вырастая. Уход: ряд замирает на миг, плитки опускаются по очереди, выбранная приподнимается и тает, кошелёк уезжает вверх, слова и подсказки уходят вниз вместе с рядом.\n- В покое экран живёт: плитки чуть покачиваются, шевроны «Отчалить» подаются вперёд, одна полоса света иногда проходит вдоль всей ленты.\n- Монеты набегают, жетон переворачивается, число подпрыгивает.\n- HUD в бою спокоен: из нового движения там только кольцо света по линзе корпуса при ударе.\n- Между игроком и тем, что он нажал, не больше полсекунды; действие не ждёт анимации.\n- Движение только рисуется: области нажатия стоят на месте под указателем.\n\n## Открытые вопросы\n- [Q58](../questions/interface.md#q58): окна инструментов.\n- [Q160](../questions/interface.md#q160): стеклянные плитки и движение.\n- [Q161](../questions/interface.md#q161): базовые компоненты.\n- [Q166](../questions/interface.md#q166): меню, колпачки, выноски и карточки верфи в стекле.\n- [Q171](../questions/interface.md#q171): диалог и радио в стекле.\n- [Q172](../questions/interface.md#q172): панель показателей верфи.\n- [Q173](../questions/interface.md#q173): что держит тема.\n- [Q174](../questions/interface.md#q174): цвета-сигналы мира; импульсная башня в цвете, близком к акве.\n- [Q175](../questions/interface.md#q175): последние глянцевые детали HUD стали стеклом.\n- [Q176](../questions/haul.md#q176), [Q177](../questions/haul.md#q177): экран торговца и цены «Марии».\n- [Q178](../questions/interface.md#q178): журнал, карта, список, подписи и карточка улова в стекле.\n"}, {"id": "art-interface", "path": "art/interface.md", "title": "Стиль интерфейса", "section": "art", "date": "2026-11-13", "md": "# Стиль интерфейса\n\nИз чего сделан интерфейс и как он выглядит. Что где на экране: [HUD](../interface/hud.md), [Экраны и меню](../interface/screens.md).\n\n## Решения владельца\n- Интерфейс был задуман из вещей мира: старая печатная карта, найденные и починенные приборы (2026-11-02). С 2026-11-13 бумаги в нём нет: всё — стекло ([Компоненты](components.md)).\n- Образцы интерфейса — Frutiger Aero и Utopian Scholastic: оптимистичный глянец 2000-х, аква, небо и природа вместе с техникой и классическая антиква обучающих программ той эпохи.\n- 2026-11-11: интерфейс — прозрачное стекло Frutiger Aero с красивым движением, начиная с кнопок базы; официальная палитра и базовые компоненты ([Палитра](palette.md), [Компоненты](components.md)).\n- 2026-11-12: стекло перенесено на меню, карточки деталей верфи и HUD.\n- 2026-11-13: вся бумага в интерфейсе становится стеклом; квиток, его штамп и скотч ушли совсем ([Добыча](../gameplay/haul.md)).\n- 2026-11-12: у игры одна тема Godot со всем обликом, чтобы он менялся быстро и его не приходилось переносить по частям; стекло чуть менее прозрачно.\n- Выноска везде одна, стеклянная (2026-11-13; бумажной бирки больше нет). Предупреждение несёт свою метку, маленький знак предупреждения, и янтарную кромку.\n- В интерфейсе простые слова (влево, вправо, старт, цель), и ни одна другая игра не называется ни в интерфейсе, ни в коде, ни в вики.\n\n## Как устроено\n- **Тема.** Весь облик — палитра, шрифты, роды стекла, размеры деталей — лежит в одной теме Godot, `game/ui/look.tres` ([Компоненты](components.md)).\n- **Цвета** — из палитры (`Hue`, [Палитра](palette.md)). **Стекло** — плитки, меню, карточки верфи, выноски и колпачки клавиш (`Glass`, читает экран и преломляет сцену) и HUD в бою (`Lens`, только смешивается со сценой); что в стекле, а что ещё в старом глянце: [Компоненты](components.md).\n- **Облик** (`Style`, `Gloss`): вещи мира в духе Frutiger Aero и Utopian Scholastic. Слова набраны Nunito поверх мягкой тёмной кромки, чтобы читались на бликах и пене; приборы — глянцевая аква под стеклом; EB Garamond — для печати старого мира и заголовков (`assets/fonts/`). Тени мягкие (`Gloss.Shadow`). Клавиши показаны на колпачках из дымчатого стекла (`Gloss.Key`, `Gloss.Hints`; кнопки геймпада на своём месте, см. [Управление](../interface/controls.md)), клавиши экрана — вдоль его низа слева (`Gloss.Foot`). Цвет детали (`Hue.Of`) не берёт ни враждебный красный, ни оранжевый игрока.\n- **Выноски** (`Balloon`, `Gloss.Balloon`): стеклянная плашка с хвостиком к тому, о чём она говорит (в диалоге — прежняя глянцевая аква-плашка); предупреждение обведено янтарём под маленьким янтарным знаком (`Gloss.Caution`).\n\n## Как к этому пришли\n- 2026-10-26: тёмные стеклянные карточки отвергнуты; HUD стал тонкими светящимися линиями; 2026-10-29 этот образец снят ([Арт-дирекшн](README.md)).\n- 2026-11-02: владелец выбрал интерфейс как вещи мира: старая карта на базе, на море — кластер глянцевых аква-приборов. Шрифты он оставил на наш выбор: Nunito, Caveat, а для печати старого мира сначала Saira. В тот же день Frutiger Aero и Utopian Scholastic стали образцами, и EB Garamond заменил Saira.\n- 2026-11-03: тем же стилем переделаны сеть, карта на море, рулетка и окна инструментов.\n- 2026-11-08: сеть заменена трюмом; его экран — глянцевый аква-прибор с сеткой клеток ([Добыча](../gameplay/haul.md)).\n- 2026-11-11: экрана трюма и сетки больше нет; добыча — ряд слотов на HUD над панелью расходников ([Добыча](../gameplay/haul.md)).\n- 2026-11-06 — 2026-11-07: владельцу не нравятся меню и кнопки; построены варианты на выбор ([Кандидаты на облик](candidates.md)).\n- 2026-11-11: кнопки базы и места верфи стали прозрачными стеклянными плитками с движением; палитра собрана в одном месте.\n- 2026-11-12: весь облик собран в одной теме Godot, чтобы менять его одной правкой; стекло стало чуть менее прозрачным.\n- 2026-11-12: в стекле меню, колпачки клавиш, выноски, карточки верфи и HUD. Проверка облика в два круга; HUD отказался от преломления ради времени кадра.\n\n## Открытые вопросы\n- [Q159](../questions/interface.md#q159), [Q160](../questions/interface.md#q160), [Q161](../questions/interface.md#q161): палитра, стекло и движение, компоненты.\n- [Q166](../questions/interface.md#q166): меню и верфь в стекле. HUD остаётся стеклом без преломления, а диалог, циферблат рыбалки и показатели верфи переходят в стекло ([решено 11-12](../decisions.md)).\n- [Q55](../questions/interface.md#q55): полировка интерфейса.\n- Облик меню: [Кандидаты на облик](candidates.md).\n"}, {"id": "art-light", "path": "art/light.md", "title": "Свет и время суток", "section": "art", "date": "2026-11-13", "md": "# Свет и время суток\n\nОдно небо и одно солнце на всю сцену; час суток держится весь заход.\n\n## Решения владельца\n- Каждый час суток выглядит правильно. Ночь для скрытности появится позже.\n- Час держится на месте весь заход.\n- Ночь лунная и синяя: прохладный лунный свет с серебряной дорожкой бликов на воде, заметно темнее дня, но всё читается.\n- Рассвет и закат тёплые и проходят через сумерки в синюю ночь.\n\n## Как устроено (`sky/`)\n\nОдно небо на всю сцену и на отражение в море: модель Godot PhysicalSkyMaterial, посчитанная по каждому направлению (`sky/sky.gdshaderinc`), её параметры заданы для удерживаемого часа. Почему не симулированная атмосфера: игрок видит небо в основном в море, с большой высоты, в один час. `Daylight` (`sky/Daylight.cs`) держит солнце на час карты (`Hour` в её JSON; у Арены 16:30) и мерит экспозицию по серой карточке, под собственным контрастом AgX: подъём мягкой кривой смыл море в серое ([Q77](../questions/world.md#q77)). Тени облаков плывут по всему, что солнце освещает, по ветру (`sunlight_clouded`), шумом, который двигает `Daylight`; самих облаков в кадре никогда нет. Вид настроен на дневное солнце коралловой отмели (`HeldHour`); в другие часы солнце держит это направление, и меняется только его высота. Низкое солнце согревает воздух и море. Ночью полная луна освещает сцену как прохладное солнце на месте удерживаемого, а кадр сидит на два стопа ниже дня, как кино снимает день под ночь; сумерки переходят от солнца к луне. Звёзд нет, тумана нет. Твёрдые поверхности, и лодки тоже, освещает `sky/sunlight.gdshaderinc` (`common/Surfaces.cs`, `common/surface.gdshader`), под водой — `waters/underwater.gdshaderinc`. Стекло станции — тот же шейдер, видимый насквозь (`common/glass.gdshader`, [Станция](../world/outpost.md)). Дутое стекло поплавков — он же, сплошной, но пропускающий солнце (`common/blown.gdshader`, [Гавань](../base/pier.md)). Godot не переимпортирует `.glsl`, когда меняется включаемый им `.glslinc`: после правки include тронь файлы `.glsl`.\n\nТени солнца подгоняются под вид, который рисует кадр (`Daylight.Fit`, перед каждой отрисовкой, когда все виды уже встали). Карты теней тянутся до места, где вид в последний раз видит дно моря, а не на постоянную дальность. Вид издалека сверху (бой, редактор карт, кадры вставок) видит море почти на одной дальности и берёт одну карту во весь атлас. Вид, который видит и лодку рядом, и горизонт (база, верфь, вид сбоку), берёт две карты, ближнюю и дальнюю, и тени не дальше предела. Почему: постоянная дальность клала весь бой в дальнюю карту, растянутую до предела, и края теней шли ступенями. Карты держат небольшой запас, чтобы тряска и покачивание вида не меняли их размер: карта, меняющая размер каждый кадр, ползёт по краям теней.\n"}, {"id": "art-palette", "path": "art/palette.md", "title": "Палитра", "section": "art", "date": "2026-11-13", "md": "# Палитра\n\n![Палитра на стенде Components](../img/palette.jpg)\n\nОфициальная палитра игры: каждый цвет интерфейса назван по своей роли. Имена ролей — в `game/ui/Hue.cs`, значения — в теме игры `game/ui/look.tres` (тип `Hue`, [Компоненты](components.md)); здесь — роли. Стенд `Components` рисует палитру прямо из темы.\n\n## Решения владельца\n- 2026-11-11: у игры есть официальная палитра и базовые компоненты; интерфейс — стекло в духе Frutiger Aero ([Арт-дирекшн](README.md)).\n- Цвета держат по одному смыслу: оранжевый — игрок и захват, красный — охотники, золотой — цель и места, аква — союзники и приборы, синий — броня ([HUD](../interface/hud.md)).\n\n## Как устроено\nРешение без владельца: какие цвета вошли в палитру и как они названы ([Q159](../questions/interface.md#q159)).\n\n- **Смыслы.** `Player` — игрок, его лодка, захват, путь вперёд. `Hostile` — охотники, вред и то, что хуже. `Aim` — цель миссии и места. `Caution` — предупреждение и металл монет. `Armour` — броня. `Aqua` — союзники и приборы, три тона: светлый для слов на тёмном стекле, основной для подсветки, глубокий. `Better` — то, что лучше или включено. `Muted` — выключенное.\n- **Сигналы мира**, смыслы вещей на воде: `Nitro` — нитро (шкала, расходник, припас), `Repair` — ремонт (расходник, припас), `Fuel` — топливо (припас, фиолетовый), `LampHostile`, `LampBetter`, `LampCaution` — лампа в мире, говорящая то же, что `Hostile`, `Better`, `Caution`, но глубже, потому что светится (лампа мины, лампы бона, пойманный лучом прожектор), `Pulse` — холодный свет башни-импульса и её колец, `Boost` — полосы ускорения течения. Красный охотников, оранжевый игрока и золото цели в мире читаются из `Hostile`, `Player` и `Aim`: ракеты охотников, предупреждающее кольцо, огонь ракет игрока, лампа маяка.\n- **Стекло и гель.** `Ahead` — оранжевый гель пути вперёд, `Frosted` — матовое стекло выноски и некупленной детали, `Bead` — маленькое прозрачное стёклышко (дорожка переключателя, бусина шкалы, стрелка), `Knob` — белое стекло ручки, `Smoke` — дымчатое стекло колпачка клавиши, `CaughtHostile`, `CaughtAim`, `CaughtArmour` и `CaughtLeaf` — свет смысла, пойманный в стекле HUD (красный, золотой, синий, зелёный), `Lagoon` — лёгкий аква-оттенок стеклянных плиток над лагуной, `Caught` и `CaughtWarm` — свет лагуны и оранжевый свет игрока, пойманные в выбранной стеклянной плитке, `CaughtDeep` — тот же свет глубже, под белыми словами, `Chrome` — хром и перламутр, `Screen` — экран с подсветкой, `Smoked` — тёмная глянцевая табличка.\n- **Чернила.** `White` — блик и слова на цветном стекле; `Ink` — слова на светлом стекле; `Accent` — крупные слова реплики на светлой выноске, тёмно-оранжевые; `Faint` — тихие слова; `Heading` — заголовок на светлом стекле; `Engraved` и `EngravedWarm` — тень под словами на аква и на оранжевом стекле; `Shade` — мягкие тени и тёмная кромка слов; `Night` — ночная вода (ободок, шторка); `Card` — белая кромка знака предупреждения; `WarningInk` — слова предупреждения на светлом стекле и цена, на которую не хватает монет.\n- **Ноты мира**, на которые отвечает интерфейс, сняты с кадров игры и образца: `Turquoise` (лагуна над песком), `Deep` (глубина за банкой), `Sand`, `Leaf`.\n- **Место швартовки** берёт цвета палитры ([Гавань](../base/pier.md)): стекло поплавков — `Turquoise`, `Aqua` и `Leaf`, огонь фонарей — `Aim` (золотой — цвет мест), латунь — `Caution`, линь — `Sand`.\n- **Свои цвета вещей** вне смыслов: виды деталей (`Hue.Of`), напечатанные кнопки геймпада.\n- **Карта** рисует светом из `Aqua` и `White`, своих цветов у неё нет ([Добыча](../gameplay/haul.md)).\n- Оттенки внутри материала берутся из его трёх тонов или из `Lightened` и `Darkened` его цвета, а не из нового числа.\n- При переносе почти одинаковые числа слились в один цвет палитры; кадры `Base`, `Yard/Keys` и `Menus/Current` до и после не отличаются на глаз.\n\nСм. также: [Компоненты](components.md), [Стиль интерфейса](interface.md).\n\n## Открытые вопросы\n- [Q159](../questions/interface.md#q159): палитра.\n"}, {"id": "art-people", "path": "art/people.md", "title": "Люди: флоппы", "section": "art", "date": "2026-11-13", "md": "# Люди: флоппы\n\n![Капитан](../img/captain.jpg)\n\nКто живёт в мире и как выглядит. Как они говорят: [Диалоги и голос](../story/dialogue.md).\n\n## Решения владельца\n- Все в мире — флоппы: каракалы, круглые и тяжёлые, с высокими ушами в чёрных кисточках, тёмными полосами от глаз к носу и светлыми подбородком и грудью. Людей нет.\n- Флоппы сидят, как сидят кошки, передние лапы рядом перед собой; никто ничего не держит (владелец, 2026-11-06). На них немного одежды мира: старого — найденной, выцветшей и залатанной, — с льном и плетёными вещами нового.\n- Каждый — свой вкус флоппы: окрас шерсти, сложение и возраст, одежда и снаряжение на нём (шляпа, очки, фартук, бухта троса, свисток). Сверху их узнают по этому.\n- Они живут в гавани, на верфи и в море: на берегах и причалах. На лодках команд не видно.\n- Они окрашены и освещены как лодки: насыщенные цвета, тот же свет.\n- Флоппы на берегах и причалах — жизнь вокруг боя, с ними не играют.\n- Их моделируют в Blender из кода, как пирс.\n\n## Как устроено\n- В мире флопп пока нет: моделей нет, они видны только портретами в диалогах.\n\n## Портреты\n- Большие портреты для диалогов — заглушки до рисунков художника ближе к релизу. Их нарисовала локальная модель изображений по фото настоящего флоппы. С 2026-11-07 владелец запретил картинки от ИИ: новые портреты так не делаются, а уже нарисованные остаются, пока владелец не скажет иначе. Скрипты, которыми их рисовали, убраны из `tools/` 2026-11-08 и остались в истории git.\n- Портреты есть у ролей без имён: капитан, корабел, мытарь. У каждого портрета четыре лица: ровный взгляд, доволен, удивлён, сердит. У врагов восемь безымянных лиц (`foe-1`…`foe-8`), у каждого три: ровный взгляд, удивлён, сердит ([HUD](../interface/hud.md)) ([Q7](../questions/world.md#q7)).\n- Файлы: [Ассеты](../tools/assets.md).\n\n## Открытые вопросы\n- [Q7](../questions/world.md#q7): какие ещё лица нужны портретам.\n- Кто нарисует портреты к релизу: [Чего нам не хватает](../questions/gaps.md).\n"}, {"id": "art-world-look", "path": "art/world-look.md", "title": "Облик мира", "section": "art", "date": "2026-11-08", "md": "# Облик мира\n\nКаким выглядит мир: острова, мелководье, открытое море и след лодки. Как море устроено, на странице [Море](../world/sea.md); свет и часы — [Свет и время суток](light.md).\n\n## Решения владельца\n- Мир выглядит так, как его показывают картинки меню: кремовый песок, сочная яркая зелень и пышные пальмы на острове базы, спокойное прозрачное море у островов с мягкой широкой каустикой на песчаном дне — видной, но не рябящей, и слабые тени облаков, плывущие над водой и сушей. Остров базы сохраняет своё низкое послеполуденное солнце.\n- В открытом море вода глубокая, насыщенно-синяя, с видными волнами и бликами солнца, без зерна.\n- След лодки: короткий белый бурун сразу за кормой, дальше след распадается на тонкое кружево и светлую бирюзу от пузырьков и быстро тает; никаких клякс. Пена принадлежит воде.\n\n## Как к этому пришли\n- **Морской проход** (2026-10-29): экспозиция под удерживаемый час, прибой как боры, кусты морской травы.\n- **Картинки меню** (2026-11-06): владельцу понравился мир на картинках меню, и облик подогнали под них: песок, зелень, пальмы, каустика, мягкая светлая картинка, облачные тени. Угол и дальность камеры выбрал QA-агент за несколько проходов ([Камера и картинка](../gameplay/camera.md)).\n- **После игры** (2026-11-07): вид оказался слишком близким, а открытое море бледным. Зум и тон вернули, спокойная поверхность осталась только над банками, каустика стала мягче, пена — кружевом ([Q77](../questions/world.md#q77)).\n- Картинки меню были нарисованы моделью; с 2026-11-07 облик показывают только кадры игры ([Арт-дирекшн](README.md)).\n\n## Открытые вопросы\n- [Q77](../questions/world.md#q77): тон картинки.\n- Целые облики игры на стенде `Art`: [Кандидаты на облик](candidates.md).\n"}, {"id": "audio-music", "path": "audio/music.md", "title": "Музыка", "section": "audio", "date": "2026-11-12", "md": "# Музыка\n\nМузыка складывается прямо во время игры и растёт вместе с боем. Остальной звук: [Звук](sound.md).\n\n## Решения владельца\n- Музыка делается на ходу, как её делает Sonic Pi: она нарастает вместе с боем, а события играют собственные мелодии, все в одной гармонии.\n- Её звук — глянцевый джаз-фьюжн 2000-х, под стать интерфейсу, на записанных инструментах: аккорды FM-электропиано, мелодия маримбы, электробас, ведущая партия чистой электрогитары, живые барабаны с конгами и бонго и трубы для фанфар при победе.\n- Музыка верна; у каждой локации своя тональность, лад и темп.\n\n## Как устроено (`audio/music/`)\n\n`Music` сочиняет на ходу, как музыка с живым кодом: готовых записанных треков нет. Пьеса (`Score`, `music/Harmony.cs`) — это тональность, лад, темп и зерно; у базы своя (`Score.Home`), и у каждой локации своя, она хранится в её карте (`Setting.Score`). `Composer` выращивает из зерна последовательность аккордов и играет по ней на часах качающихся шестнадцатых, слоями, которые вступают с интенсивностью боя, как адаптивные партитуры слоят стемы. Интенсивность растёт сразу и падает только после затишья (`Music.Feel`), от близких охотников, корпуса, нитро и недавних ударов. Мотивы отвечают на события боя на ближайшем делении такта (`Motif`). Решённое задание кончается фанфарами или плачем, гибель — плачем (`Music.End`); у пирса играет пьеса базы (`Music.Base`), а когда игра открывает мир другой локации, музыка тянется в неё (`Music.Now`, `Music.Resume`). Каждая нота — ступень звучащего аккорда, поэтому всё движется в одной гармонии. Инструменты сэмплированы, как их играют трекеры и саундфонты (`Voices`): записи CC0 (`assets/sounds/music/`, импортированы без сжатия), каждая нота играется от ближайшего дубля, с передискретизацией. Они играют в комнату и эхо (`Space`) под лимитером, рендерятся чуть вперёд в генератор потока. Пауза, верфь и квиток продажи у станции приглушают музыку.\n"}, {"id": "audio-sound", "path": "audio/sound.md", "title": "Звук", "section": "audio", "date": "2026-11-12", "md": "# Звук\n\nКак в игре звучат бой, лодки и интерфейс. Музыка описана отдельно: [Музыка](music.md).\n\n## Решения владельца\n- Звук по умолчанию включён. Кадры демо немые.\n\n## Как устроено (`audio/`)\n\n`Sounds` расставляет в мире многослойные реплики CC0, слышимые из «уха» вида (`assets/sounds`, источники в его `Licenses.txt`); голоса идут по громкости у уха, поэтому далёкий огонь никогда не заглушает ближний. `ShotSounds` взвешивает реплики по силе взрыва; `Motor` зацикливает мотор лодки и останавливает петлю, пока она слишком тиха, чтобы её слышать. Море и ветер звучат петлёй под всем. Что бы ни делала любая лодка, слышно там, где она это делает, и охотничью тоже: припасы (`World`), знак охотника перед залпом (`Boat.Told`) и дым (`Hiss`).\n\n`Chimes` играет звуки интерфейса (`assets/sounds/ui`), одинаково слышные везде и заметно тише боя: по одной реплике на каждый момент HUD, базы, верфи, вида сбоку и меню. Добыча самого игрока принадлежит интерфейсу, поскольку она только его. Лебёдка захвата в виде сбоку — петля в `Salvaging`. Дубли каждой реплики слегка разнесены по высоте (`AudioStreamRandomizer`), полифония ограничивает число голосов, а реплика никогда не играет снова раньше своего промежутка. Она живёт в корне дерева, поэтому любой экран играет её через `Chimes.Play`. Скрытые прогоны демо немые на «пустом» аудиодрайвере Godot. Музыка играет на шине Music, всё остальное на Effects, обе под Master, чьи громкости задают настройки.\n\n## Открытые вопросы\n- [Q23](../questions/audio.md#q23): звуки припасов, дыма, добычи, рыбы, лебёдки и знака охотника.\n"}, {"id": "balance-boats", "path": "balance/boats.md", "title": "Баланс лодок", "section": "balance", "date": "2026-11-12", "md": "# Баланс лодок\n\n![Все корпуса в ряд](../img/fleet.jpg)\n\nСнимок значений из кода на 2026-11-12. Источник — код; меняешь число в коде — обнови эту страницу в том же коммите. Все числа — стартовые значения для настройки.\n\nЗдесь все числа, от которых зависит, как лодка идёт и сколько стоит. Как лодка устроена и управляется — на странице [Лодка](../gameplay/boat.md); как собирают в верфи — [Верфь](../base/boatyard.md); деньги и сохранения — [Прогресс](../gameplay/progression.md); охотники — [Охотники и ИИ](../gameplay/hunters.md); как лодки выглядят — [Облик лодок](../art/boats.md). Оружие и его числа — в [балансе оружия](weapons.md).\n\nМасса везде в тоннах, цена в монетах, мощность в кВт, скорость в м/с. Название детали — по-русски, как в игре, рядом имя в коде.\n\n## 1. Корпуса\n\nИсточник: `game/ships/Parts.cs`, `Parts.Hulls` и поля `HullPart`, `HullForm`, `Feel`.\n\n| Корпус (`Hull`) | Длина, м | Ширина, м | Масса, т | Удары | Станции | Трюм, мест | Бак, л (`Tank`) | Мест снаряжения (`GearPlaces`) | Цена | Сцепление (`Grip`) | Круг, длин (`Circle`) | Ответ поворота, с (`TurnAnswer`) | Ход (`Pace`) |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| [Катерок](../hulls/runabout.md) (`RunaboutHull`) | 4,8 | 2 | 0,9 | 2 | 1 | 4 | 27 | 1 | 120 | 2 | 1,5 | 0,15 | 2,9 |\n| [Ялик](../hulls/skiff.md) (`SkiffHull`) | 6 | 2,2 | 1,75 | 4 | 2 | 5 | 30 | 1 | 0 | 2,2 | 1,6 | 0,18 | 2,85 |\n| [Плоскодонка](../hulls/punt.md) (`PuntHull`) | 7 | 3 | 2,8 | 5 | 2 | 6 | 42 | 1 | 90 | 0,5 | 1,2 | 0,12 | 3,05 |\n| [Гонщик](../hulls/racer.md) (`RacerHull`) | 11 | 2,6 | 4 | 6 | 3 | 4 | 66 | 2 | 240 | 1,2 | 2,6 | 0,3 | 3 |\n| [Патрульный катер](../hulls/patrol-boat.md) (`PatrolHull`) | 12 | 3,8 | 14,3 | 10 | 4 | 7 | 120 | 2 | 540 | 1,8 | 2 | 0,25 | 3,55 |\n| [Канонерка](../hulls/gunboat.md) (`GunboatHull`) | 16 | 5,5 | 54,5 | 16 | 5 | 8 | 200 | 3 | 1050 | 2,6 | 1,5 | 0,4 | 3 |\n\nВне верфи: броненосец (`IroncladHull`, 22 × 6,8 м, 95 т, 20 ударов, 6 станций, трюм 10 мест, бак 300 л, 3 места снаряжения, цена 0, сцепление 2,6, круг 1,6, ответ 0,45, ход 3) и макет полигона (`DummyHull`, 7,5 × 2,8 м, 1,4 т, 4 удара, 1 станция, трюм 3 места, бак 30 л, мест снаряжения нет, цена 0, сцепление 1,6, круг 1,8, ответ 0,2, ход 2,6).\n\nЧто значат поля `Feel`: сцепление — как корпус держит боковой ход, 1/с; круг — диаметр поворота в длинах корпуса; ответ — за сколько секунд поворот отвечает; ход (`Pace`) — лучшая скорость на одном кВт на тонну. Поля `Lean`, `BowLift`, `Squat` (крен, подъём носа, посадка кормы) тут не нужны: на ход и цену они не влияют.\n\nДля чего корпус:\n- **Катерок** — самый лёгкий и резкий, но держит два удара. Под сильным мотором самый быстрый.\n- **Ялик** — стартовый, бесплатный, открытый; четыре удара, две станции.\n- **Плоскодонка** — плоская: скользит, как по льду, крутится на месте (сцепление 0,5), берёт больше всего ударов и трюма среди малых.\n- **Гонщик** — длинный, три станции, широкий поворот (круг 2,6 длины).\n- **Патрульный катер** — середняк: четыре станции, лучший ход (3,55), десять ударов.\n- **Канонерка** — тяжёлый, пять станций, шестнадцать ударов; медленный.\n\n## 2. Моторы\n\nИсточник: `game/ships/Parts.cs`, `Parts.Engines`, `EnginePart`.\n\n| Мотор | Мощность, кВт | Масса, т | Цена | Назад (доля хода, `Astern`) | Поворот на месте (`TurnAtRest`) | Расход, л/км (`Burn`) | Привод (`Drive`) |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| [Подвесной мотор](../engines/outboard.md) (`Outboard`) | 45 | 0,12 | 0 | 0,4 | 0,5 | 5 | `Outboard`, на транце |\n| [Воздушный винт](../engines/air-fan.md) (`AirFan`) | 150 | 0,5 | 90 | 0,5 | 0,9 | 6 | `Fan`, на пилоне над кормой |\n| [Два подвесных](../engines/twin-outboards.md) (`TwinOutboards`) | 300 | 0,6 | 360 | 0,35 | 0,55 | 8 | `TwinOutboard`, два на транце |\n| [Водомёт](../engines/water-jet.md) (`WaterJet`) | 700 | 1,2 | 780 | 0,3 | 0,6 | 10 | `Jet`, низко в корпусе |\n\n«Поворот на месте» — доля полного поворота, которой лодка рулит на стоянке при полном газе (`Manoeuvring`). С закрытым газом лодка крутится на месте одним рулём в меру этой доли.\n\nМощность на тонну мотора и на монету: подвесной 375 кВт/т, винт 300, два подвесных 500, водомёт 583; кВт на монету: винт 1,67, водомёт 0,90, два подвесных 0,83.\n\n## 3. Максимальная скорость\n\nИсточник: `game/ships/Handling.cs`, `Handling.Of`.\n\n```\nмасса = сумма масс всех деталей на борту (корпус, мотор, палубные детали, снаряжение, пояс), т\nTop = max( Pace × √( мощность, кВт / масса, т ), 3 )     м/с\n```\n\nЭто и есть правило √(P/W): корень из мощности на вес (кВт на тонну), умноженный на `Pace` корпуса. Сверху скорость ничем не ограничена ([Q20](../questions/boat.md#q20)). Снизу есть пол: 3 м/с. Среди голых корпусов он срабатывает только у канонерки и броненосца с подвесным мотором (по формуле вышло бы 2,7 и 2,1).\n\nДальше от этой же скорости считаются:\n- **Нитро:** рывок разом прибавляет `Nitro.Kick` = 14 м/с и полсекунды умножает мощность на `Nitro.Power` = 2,5.\n- **Добыча в трюме:** время разгона умножается на `(масса + груз, т) / масса`, а максимальная скорость не меняется (`Boat.Laden`, `Boat.cs`, [Q43](../questions/haul.md#q43)).\n- **Поворот на полном ходу:** `TurnRate = clamp(Top / (Circle × длина), 0,25; 2)` рад/с.\n- **Разгон:** `clamp(0,25 × m × Top² / 2 / P + 0,25 × ∛(m/1000), 0,5; 5)` с, где m в кг и P в Вт. **Накат:** `clamp(m × Top² / (2P), 1,5; 8)` с.\n\n### Голые корпуса\n\nБез палубных деталей, снаряжения и брони. В ячейке: скорость, м/с (масса лодки, т). Звёздочка — сработал пол в 3 м/с.\n\n| Корпус | Подвесной | Воздушный винт | Два подвесных | Водомёт |\n| --- | --- | --- | --- | --- |\n| Катерок | 19,3 (1,02) | 30,0 (1,40) | 41,0 (1,50) | 52,9 (2,10) |\n| Ялик | 14,0 (1,87) | 23,3 (2,25) | 32,2 (2,35) | 43,9 (2,95) |\n| Плоскодонка | 12,0 (2,92) | 20,6 (3,30) | 28,6 (3,40) | 40,3 (4,00) |\n| Гонщик | 9,9 (4,12) | 17,3 (4,50) | 24,2 (4,60) | 34,8 (5,20) |\n| Патрульный катер | 6,3 (14,42) | 11,3 (14,80) | 15,9 (14,90) | 23,9 (15,50) |\n| Канонерка | 3,0\\* (54,62) | 5,0 (55,00) | 7,0 (55,10) | 10,6 (55,70) |\n| Броненосец (вне верфи) | 3,0\\* (95,12) | 3,8 (95,50) | 5,3 (95,60) | 8,1 (96,20) |\n\n### Что стоит вес\n\nПалубные детали весят от 0,08 до 0,8 т (таблица ниже, числа их действия — в [балансе оружия](weapons.md)). Скорость считается по всей сумме.\n\n| Деталь (`Parts.Deck`) | Масса, т | Цена |\n| --- | --- | --- |\n| Ракеты I–IV (`Rockets`) | 0,1 / 0,2 / 0,3 / 0,4 | 40 / 75 / 120 / 210 |\n| Носовая стойка I–II (`ChaseRacks`) | 0,12 / 0,24 | 90 / 170 |\n| Торпеды (`Torpedoes`) | 0,8 | 450 |\n| Турель (`Turret`) | 0,3 | 0 |\n| Минный жёлоб (`MineRail`) | 0,45 | 300 |\n| Люлька (`Cradle`) | 0,7 | 480 |\n| Тепловизор (`ThermalSight`) | 0,08 | 180 |\n\nПримеры сборок (скорость по формуле; цена — сумма цен деталей; станции не названные пусты):\n\n| Сборка | Масса, т | Скорость, м/с | Удары | Цена |\n| --- | --- | --- | --- | --- |\n| Ялик, подвесной, турель (стартовая) | 2,17 | 13,0 | 4 | 0 |\n| Ялик, подвесной, Ракеты I | 1,97 | 13,6 | 4 | 40 |\n| Ялик, водомёт, 2 × Ракеты II | 3,35 | 41,2 | 4 | 930 |\n| Плоскодонка, винт, 2 × Ракеты I | 3,50 | 20,0 | 5 | 260 |\n| Гонщик, два подвесных, 3 × Ракеты IV | 5,80 | 21,6 | 6 | 1230 |\n| То же, тяжёлый пояс | 7,04 | 19,6 | 10 | 2130 |\n| Гонщик, водомёт, 3 × Ракеты IV | 6,40 | 31,4 | 6 | 1650 |\n| То же, тяжёлый пояс | 7,64 | 28,7 | 10 | 2550 |\n| Патрульный катер, водомёт, 4 × Торпеды | 18,70 | 21,7 | 10 | 3120 |\n| Патрульный катер, водомёт, 4 × Ракеты IV, трюмная помпа, тяжёлый пояс | 19,32 | 21,4 | 17 | 3360 |\n| Канонерка, водомёт, 5 × Ракеты IV, трюмная помпа, тяжёлый пояс | 61,79 | 10,1 | 27 | 4080 |\n\nВес на малых лодках стоит заметно: тяжёлый пояс, добавивший гонщику 1,24 т, снимает около десятой доли скорости, а на канонерке 3,84 т того же пояса стоят около трёх процентов.\n\n## 4. Броня\n\nИсточник: `game/ships/Parts.cs`, `Parts.ArmourBelt`, `Parts.HeavyBelt`; `game/ships/Belt.cs`.\n\n| Пояс | Цена | Толщина, м | Доля ударов корпуса |\n| --- | --- | --- | --- |\n| Броневой пояс (`ArmourBelt`) | 270 | 0,01 | 1/3 |\n| Тяжёлый пояс (`HeavyBelt`) | 900 | 0,02 | 2/3 |\n\nДобавка ударов — `ceil(удары корпуса × доля)` (`Belt.Strikes`), масса — `2 × 0,78 × длина × (верх − низ) × толщина × 7,85` (`Belt.Mass`), где пояс идёт от 0,46 длины позади миделя до 0,32 впереди, снизу на 0,6 ватерлинии, сверху на ватерлинию плюс треть высоты борта над ней. Сама деталь массы не имеет (`Mass` = 0), весит только пояс по корпусу. Плиты и мелочи: [Q30](../questions/boat.md#q30).\n\n| Корпус | Плит на борт | Лёгкий: + ударов | Лёгкий: масса, т | Тяжёлый: + ударов | Тяжёлый: масса, т |\n| --- | --- | --- | --- | --- | --- |\n| Катерок | 2 | +1 | 0,235 | +2 | 0,470 |\n| Ялик | 3 | +2 | 0,309 | +3 | 0,617 |\n| Плоскодонка | 4 | +2 | 0,249 | +4 | 0,499 |\n| Гонщик | 6 | +2 | 0,620 | +4 | 1,239 |\n| Патрульный катер | 6 | +4 | 0,985 | +7 | 1,969 |\n| Канонерка | 8 | +6 | 1,920 | +11 | 3,840 |\n| Броненосец | 11 | +7 | 3,044 | +14 | 6,089 |\n\nСкорость, которую пояс отнимает на типичной сборке: корпус, два подвесных или водомёт, Ракеты II на каждой станции.\n\n| Корпус | Мотор | Без пояса | Лёгкий пояс | Тяжёлый пояс |\n| --- | --- | --- | --- | --- |\n| Катерок | водомёт | 50,6 | 48,2 (−5%) | 46,1 (−9%) |\n| Ялик | водомёт | 41,2 | 39,4 (−4%) | 37,9 (−8%) |\n| Плоскодонка | водомёт | 38,5 | 37,4 (−3%) | 36,5 (−5%) |\n| Гонщик | два подвесных | 22,8 | 21,5 (−5%) | 20,5 (−10%) |\n| Гонщик | водомёт | 33,0 | 31,3 (−5%) | 29,9 (−9%) |\n| Патрульный катер | два подвесных | 15,5 | 15,1 (−3%) | 14,6 (−6%) |\n| Патрульный катер | водомёт | 23,3 | 22,6 (−3%) | 22,0 (−6%) |\n| Канонерка | два подвесных | 6,9 | 6,8 (−2%) | 6,7 (−3%) |\n| Канонерка | водомёт | 10,5 | 10,4 (−2%) | 10,2 (−3%) |\n\nЦена за добавленный удар: лёгкий пояс — 270 / 135 / 135 / 135 / 68 / 45 монет на катерке, ялике, плоскодонке, гонщике, патрульном катере, канонерке; тяжёлый — 450 / 300 / 225 / 225 / 129 / 82.\n\nПлита, принявшая свои удары, падает, и лодка становится легче и быстрее.\n\n## 5. Снаряжение\n\nИсточник: `game/ships/Parts.cs`, `Parts.Gear`; `Pump.cs`, `Smoke.cs`; `game/combat/Carpenters.cs`. Число деталей на лодке — по её корпусу (`HullPart.GearPlaces`, таблица 1), по одной каждого вида; места не обязаны быть заняты.\n\n| Снаряжение | Масса, т | Цена | Что делает, числа |\n| --- | --- | --- | --- |\n| Управление огнём (`FireControl`) | 0,15 | 360 | Рисует на воде линию огня каждой заряженной стойки. Чисел нет |\n| Таран (`Ram`) | 0,4 | 180 | Удар передней частью тарана не вредит своей лодке; остальные удары — как обычно |\n| Трюмная помпа (`BilgePump`) | 0,25 | 300 | После 4 с без ударов (`Pump.Waiting`) чинит 0,2 удара в секунду (`Pump.Mending`), то есть удар за 5 с |\n| Дымогенератор (`SmokeGenerator`) | 0,3 | 240 | Дым 5 с (`Smoke.Lasting`), перезарядка 25 с (`Smoke.Recharging`); готов снова через 30 с после включения |\n| Плотники (`Carpenters`) | 0,35 | 210 | За каждую потопленную лодку чинят 0,25 её ударов (`Carpenters.Share`, от того, сколько она выдерживала) |\n\nМеханика каждого — в [Бое](../gameplay/combat.md).\n\n## 6. Топливо и нитро\n\nИсточник: `game/ships/Fuel.cs`, `Design.Range`, `game/players/Player.cs`; `game/ships/Nitro.cs`, `game/pickups/Pickups.cs`.\n\n**Топливо.** У каждого корпуса свой бак в литрах (`Tank`, таблица 1), у каждого мотора свой расход в литрах на километр (`Burn`, таблица 2); числа временные ([Q8](../questions/boat.md#q8)). Дальность полного бака — `Design.Range` = бак / расход × 1000 м. За шаг сгорает `|газ| × скорость × время`, метров, делённых на дальность; так что лодка на накате или стоящая не жжёт ничего. Запас (`Fuel.Reserve`) — 20% бака; ниже него HUD зовёт в гавань. Пустой бак не останавливает лодку: она идёт на 0,25 газа (`Player.Limp`). Охотники топливо не жгут. Время зависит от скорости: на полном газе бак хватает на дальность / `Top` секунд, то есть на стартовом ялике (6 км, 13,0 м/с) около 462 с, на катерке с водомётом (2,7 км, 51,7 м/с) около 52 с.\n\nДальность полного бака, км (бак / расход):\n\n| Корпус | Подвесной | Воздушный винт | Два подвесных | Водомёт |\n| --- | --- | --- | --- | --- |\n| Катерок | 5,4 | 4,5 | 3,4 | 2,7 |\n| Ялик | 6,0 | 5,0 | 3,8 | 3,0 |\n| Плоскодонка | 8,4 | 7,0 | 5,3 | 4,2 |\n| Гонщик | 13,2 | 11,0 | 8,3 | 6,6 |\n| Патрульный катер | 24,0 | 20,0 | 15,0 | 12,0 |\n| Канонерка | 40,0 | 33,3 | 25,0 | 20,0 |\n| Броненосец (вне верфи) | 60,0 | 50,0 | 37,5 | 30,0 |\n\nСтартовый ялик с подвесным идёт 6 км, как шёл при едином баке; больший корпус уходит дальше, более жадный мотор — не так далеко. Припас топлива (`Supply.Fuel`) доливает половину бака (`Pickups.Refuelling` = 0,5). Насухо нитро закрыто.\n\n**Нитро.**\n\n| Параметр | Значение |\n| --- | --- |\n| Толчок рывка (`Nitro.Kick`) | +14 м/с вперёд разом |\n| Мощность в рывке (`Nitro.Power`) | ×2,5 мощности мотора |\n| Рывок длится | 0,5 с (`Dashing`), ракеты в это время проходят сквозь лодку |\n| Рывок стоит | половину шкалы (`Cost`): полная шкала — два рывка |\n| Заряд восстанавливается | за 6 с (`Refilling`), после 1 с без рывка (`Pause`) |\n| Нитро включает | полный газ вперёд, назад не работает |\n\n## 7. Лодки охотников и прочие\n\nИсточник: `game/ships/Design.cs`, `Designs`; `game/drones/Drone.cs`. «Цена» — сумма цен деталей по таблицам выше; охотник её не платит. «Добыча» — сколько очков добычи сыплет его обломок (`Designs.Hunters`, `Worth`).\n\n### Охотники\n\n| Лодка (`Designs`) | Корпус | Мотор | Станции | Снаряжение | Броня | Масса, т | Удары | Скорость, м/с | Цена | Добыча |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| [Ялик](../hunters/skiff.md) (`Skiff`) | Ялик | Подвесной | Ракеты I, пусто | — | — | 1,97 | 4 | 13,6 | 40 | 10 |\n| [Глиссер](../hunters/skimmer.md) (`Skimmer`) | Плоскодонка | Воздушный винт | Ракеты I, пусто | — | — | 3,40 | 5 | 20,3 | 220 | 15 |\n| [Гонщик](../hunters/racer.md) (`Racer`) | Гонщик | Два подвесных | Ракеты II, пусто, Ракеты II | Плотники | — | 5,35 | 6 | 22,5 | 960 | 25 |\n| [Патрульный катер](../hunters/patrol-boat.md) (`PatrolBoat`) | Патрульный | Два подвесных | Ракеты III, пусто, Торпеды, Ракеты III | Дымогенератор | Броневой пояс | 17,59 | 14 | 14,7 | 2100 | 40 |\n| [Канонерка](../hunters/gunboat.md) (`Gunboat`) | Канонерка | Водомёт | Ракеты IV, три пустых, Ракеты IV | Трюмная помпа | Тяжёлый пояс | 60,59 | 27 | 10,2 | 3450 | 70 |\n| [Таранщик](../hunters/rammer.md) (`Rammer`) | Гонщик | Два подвесных | три пустых | Таран | — | 5,00 | 6 | 23,2 | 780 | 20 |\n| [Катерок](../hunters/runabout.md) (`Runabout`) | Катерок | Подвесной | Ракеты I | — | — | 1,12 | 2 | 18,4 | 160 | 10 |\n| [Курьер](../hunters/courier.md) (`Courier`) | Гонщик | Подвесной | три пустых | — | — | 4,12 | 6 | 9,9 | 240 | 30 |\n| [Броненосец](../hunters/ironclad.md) (`Ironclad`) | Броненосец | Водомёт | Ракеты III, пусто, Ракеты III, Торпеды, пусто, Ракеты III | Таран | Тяжёлый пояс | 104,39 | 34 | 7,8 | 2670 | 120 |\n| [Дымовой катер](../hunters/smoke-boat.md) (`SmokeBoat`) | Ялик | Воздушный винт | Ракеты I, Тепловизор | Дымогенератор | — | 2,73 | 4 | 21,1 | 550 | 15 |\n| [Преследователь](../hunters/chaser.md) (`Chaser`) | Гонщик | Два подвесных | пусто, пусто, Носовая стойка I | Плотники | — | 5,07 | 6 | 23,1 | 900 | 30 |\n| [Бегун с турелью](../hunters/turret-runner.md) (`TurretRunner`) | Плоскодонка | Воздушный винт | Турель, пусто | — | — | 3,60 | 5 | 19,7 | 180 | 30 |\n| [Минёр](../hunters/minelayer.md) (`Minelayer`) | Патрульный | Два подвесных | Ракеты III, Минный жёлоб, пусто, Ракеты III | Дымогенератор | Броневой пояс | 17,24 | 14 | 14,8 | 1950 | 45 |\n\n### Другие\n\n| Лодка | Из чего | Масса, т | Удары | Скорость, м/с | Цена |\n| --- | --- | --- | --- | --- | --- |\n| Судно снабжения (`SupplyBoat`), союзник в эскорте | Патрульный катер, два подвесных, без оружия | 14,90 | 10 | 15,9 | 900 |\n| Макет полигона (`Dummy`) | Макет, подвесной, без оружия | 1,52 | 4 | 14,1 | 0 |\n| Дрон (`Drone.Design`), его выпускает люлька | корпус 3 м и 0,25 т, 2 удара, мотор 220 кВт и 0,03 т, Ракеты I | 0,38 | 2 | около 70 | — |\n\nДрон считается по той же формуле: `2,9 × √(220 / 0,38)`.\n\n## 8. Хозяйство верфи\n\nИсточник: `game/progress/Progress.cs`, `game/ships/Design.cs`.\n\n- **Старт:** 10 000 монет (`Progress.StartingCoins`). Стартовая лодка — `Designs.Starter`: ялик, подвесной мотор, турель на второй станции, первая свободна под ракеты; цена 0, так что у игрока уже есть эти три детали.\n- **Покупка:** каждая деталь продаётся за свою цену (`Progress.Buy`); деталь, которую уже имеешь, не покупается.\n- **Самая дешёвая полная сборка**, все станции заняты, без снаряжения и брони: ялик, подвесной мотор, Ракеты I и турель — 40 монет. С самым дешёвым снаряжением (таран, 180) и лёгким поясом (270) — 490. Дешевле стартовой по ценам нет, потому что она бесплатна.\n- **Самая дорогая:** канонерка 1050 + водомёт 780 + люлька 480 + четыре Торпеды 4 × 450 + управление огнём 360 + тяжёлый пояс 900 = 5370 монет, масса 63,59 т, скорость 10,0 м/с, 27 ударов. Это сумма цен, без проверки, поместятся ли детали (`Layout.Crowded`) и всплывёт ли лодка.\n- **Дорогие готовые сборки игры:** канонерка охотника — 3450, патрульный катер охотника — 2100.\n\n## 9. Заметки\n\n- **Курьер (гонщик с подвесным) идёт 9,9 м/с.** Это медленнее стартового ялика (13,0), хотя в коде он помечен как «построен бежать» (комментарий к `Designs.Courier`).\n- **Водомёт — лучший мотор по скорости на каждом корпусе, а «два подвесных» хуже водомёта и по цене за кВт (1,20 против 1,11), и по массе за кВт.** Они выигрывают только ценой в целом: 360 против 780. Правило проекта «деталь хуже другой во всём — убирается» ([Лодка](../gameplay/boat.md)) тут держится на цене.\n- **Воздушный винт — самый дешёвый кВт (0,60 монеты) и лучший поворот на месте (0,9)**; по скорости он между подвесным и двумя подвесными.\n- **Канонерке и броненосцу нужен водомёт**: с двумя подвесными они идут 7,0 и 5,3 м/с, с подвесным упираются в пол 3 м/с. С двумя подвесными они идут медленнее голого ялика на подвесном (14,0).\n- **У плоскодонки ход (3,05) выше, чем у ялика (2,85), но скорость ниже на каждом моторе** (12,0 против 14,0 с подвесным), потому что она на 1,05 т тяжелее. Зато она берёт 5 ударов и 6 мест трюма против 4 и 5 за 90 монет.\n- **Гонщик (6 ударов, 4 места трюма) уступает плоскодонке (5 ударов, 6 мест)** по трюму при цене 240 против 90; его преимущество — три станции и длина.\n- **Катерок на водомёте 52,9 м/с без деталей и около 50 с ракетой**; дрон — около 70 м/с. [Q20](../questions/boat.md#q20) спрашивает, не слишком ли это.\n- **Броня на малых корпусах дорога:** лёгкий пояс на катерке даёт 1 удар за 270, больше цены самого катерка (120). На канонерке тяжёлый пояс даёт 11 ударов за 900 и весит 3,84 т, то есть 7% её массы.\n- **Турель бесплатна и весит 0,3 т, Ракеты I стоят 40 и весят 0,1 т**; вес палубных деталей заметен лишь на корпусах легче 5 т, на патрульном катере и канонерке он тонет в массе корпуса.\n- **Патрульный катер охотника** идёт 14,7 м/с и держит 14 ударов: пояс весит 0,985 т и даёт 4 удара.\n- **Катерок на водомёте уходит всего на 2,7 км (около 52 с на полном газе)**, канонерка с водомётом — на 20 км; малому корпусу дальность заменяет только то, что он быстр.\n"}, {"id": "balance-economy", "path": "balance/economy.md", "title": "Баланс экономики", "section": "balance", "date": "2026-11-13", "md": "# Баланс экономики\n\nСнимок значений из кода на 2026-11-13. Источник — код; меняешь число в коде — обнови эту страницу в том же коммите. Все числа — стартовые значения для настройки.\n\nОткуда берутся монеты и на что уходят. Как устроены трюм и продажа: [Добыча](../gameplay/haul.md); цены деталей: [Баланс лодок](boats.md), [Баланс оружия](weapons.md).\n\n## Поток монет\n- Новая игра начинается с 10 000 монет, на Ялике (`Progress.StartingCoins`, `Designs.Starter`).\n- Монеты приходят из двух мест: проданная добыча (в гавани у корабела и у станции, `Game.Trade`) и сцены сюжета (`give coins N`, `story/Teller.cs`).\n- Монеты уходят на детали верфи (`Progress.Buy`, [Q56](../questions/missions.md#q56)) и на ремонт и топливо у станции (`Progress.Pay`, ниже).\n- Добыча — ценность ящика в очках; каждое очко — три монеты (`Progress.Rate`, [Q128](../questions/missions.md#q128)). Утонувшая лодка ничего не продаёт: игра загружает последнее сохранение.\n\n## Ящики\nИсточник: `game/haul/Items.cs`, `Items.Crates`. Вид, цена и вес — решение без владельца ([Q162](../questions/haul.md#q162)). Ресурс идёт только на расходники (ниже), детали только покупаются ([Прогресс](../gameplay/progression.md)). Каждый ящик занимает одно место трюма; вес трюма замедляет разгон лодки ([Добыча](../gameplay/haul.md)).\n\n| Ящик | Ресурс | Вид | кг | Добыча | Монеты | Идёт на |\n| --- | --- | --- | --- | --- | --- | --- |\n| Ящик металла (`Metal`) | металл | серый ящик, гайка | 25 | 5 | 15 | ремкомплект, бронеплита |\n| Ящик механизмов (`Machinery`) | механизмы | оливковый ящик, шестерня | 25 | 9 | 27 | баллон нитро |\n| Ящик электрики (`Electrics`) | электрика | синий ящик, молния | 12 | 8 | 24 | заряд |\n| Бочка топлива (`Fuel`) | топливо | красная бочка | 40 | 5 | 15 | баллон нитро |\n| Ящик взрывчатки (`Explosives`) | взрывчатка | оранжевый ящик, взрыв | 15 | 10 | 30 | заряд |\n| Тюк ткани (`Cloth`) | ткань | светлый тюк | 8 | 3 | 9 | ремкомплект |\n| Сундук ценностей (`Valuables`) | ценности | золотой сундук | 15 | 20 | 60 | — |\n| Ящик провизии (`Provisions`) | провизия | деревянный ящик | 15 | 4 | 12 | — |\n\n## Станция «Мария»\nИсточник: `game/areas/Outposts.cs`, `Outposts.Pays`, `Outposts.Mending`, `Outposts.Fuelling`; цены считает `game/haul/Terms.cs`. В гавани ящик идёт по полной цене, ремонт и заправка там бесплатны ([Добыча](../gameplay/haul.md)). Решение без владельца ([Q177](../questions/haul.md#q177)).\n\n| Что | Цена |\n| --- | --- |\n| Ящик | 70 % цены в гавани, округлённо, не меньше 1 монеты (провизия 8, ткань 6, ценности 42) |\n| Ремонт | 15 монет за удар, которого не хватает корпусу |\n| Топливо | 1 монета за литр, которого не хватает баку |\n\nПолный ремонт и полный бак ялика (4 удара, 30 л) — 90 монет.\n\n## Места в трюме\nИсточник: `game/ships/Parts.cs`, `HullPart.Hold`. Решение без владельца ([Q162](../questions/haul.md#q162)).\n\n| Корпус | Мест |\n| --- | --- |\n| Катерок (`RunaboutHull`) | 4 |\n| Гонщик (`RacerHull`) | 4 |\n| Ялик (`SkiffHull`) | 5 |\n| Плоскодонка (`PuntHull`) | 6 |\n| Патрульный катер (`PatrolHull`) | 7 |\n| Канонерка (`GunboatHull`) | 8 |\n\nВне верфи: броненосец 10, макет полигона 3.\n\n## Расходники\nИсточник: `game/haul/Kits.cs`, `Kits.All`. Оплачиваются прямо из трюма самыми дешёвыми ящиками нужных ресурсов ([Добыча](../gameplay/haul.md)). Действие — как у одноимённого припаса ([Припасы](../gameplay/pickups.md)); заряд — `Kits.Reach` и `Kits.Strikes`. «Цена» — сколько монет те же ящики дали бы при продаже.\n\n| Клавиша | Расходник | Рецепт | Действие | Цена, монет |\n| --- | --- | --- | --- | --- |\n| 1 | Ремкомплект (`Patch`) | металл + ткань | корпус, как припас «ремонт» | 24 |\n| 2 | Бронеплита (`Plate`) | металл + металл | броня, как припас брони | 30 |\n| 3 | Баллон нитро (`Bottle`) | топливо + механизмы | полный нитро | 42 |\n| 4 | Заряд (`Charge`) | взрывчатка + электрика | взрыв на 10 м от борта, 6 попаданий у корпуса | 54 |\n\n## Что несут охотники\nИсточник: `game/ships/Design.cs`, `Designs.Hunters` (добыча проекта); `game/haul/Items.cs`, `Items.Carried`. Обломок высыпает случайные ящики из списка своего проекта (вид, названный дважды, выпадает вдвое чаще), пока их добыча не дойдёт до добычи проекта, но не больше 8 (`Items.Most`).\n\n| Охотник | Добыча | Что несёт |\n| --- | --- | --- |\n| Ялик (`Skiff`) | 10 | топливо, ткань, провизия ×2, металл, взрывчатка, механизмы |\n| Катерок (`Runabout`) | 10 | топливо, ценности ×2, ткань, взрывчатка, провизия, металл |\n| Глиссер (`Skimmer`) | 15 | топливо, механизмы, металл, ткань ×3, провизия |\n| Преследователь (`Chaser`) | 30 | механизмы, взрывчатка, топливо, ценности ×3 |\n| Бегун с турелью (`TurretRunner`) | 30 | топливо, механизмы, электрика, металл, провизия, ткань |\n| Минёр (`Minelayer`) | 45 | взрывчатка, электрика ×2, топливо, металл ×2, ценности |\n| Дымовой катер (`SmokeBoat`) | 15 | топливо ×2, электрика, взрывчатка, ткань, механизмы |\n| Таранщик (`Rammer`) | 20 | металл ×2, механизмы ×3, топливо |\n| Гонщик (`Racer`) | 25 | механизмы, топливо, взрывчатка, ценности ×4 |\n| Курьер (`Courier`) | 30 | ценности ×6, электрика ×3 |\n| Патрульный катер (`PatrolBoat`) | 40 | электрика ×2, взрывчатка ×2, металл ×2, провизия, ценности |\n| Канонерка (`Gunboat`) | 70 | металл ×3, взрывчатка, механизмы, топливо, провизия, ценности |\n| Броненосец (`Ironclad`) | 120 | ценности ×2, взрывчатка, металл, механизмы, электрика, топливо, провизия |\n\nГруз судна снабжения (`SupplyBoat`) — провизия ×3, топливо, ткань ×2, механизмы, электрика.\n\nЯщик может перескочить добычу проекта: обломок с дорогим последним ящиком даёт больше.\n\n## Задания\nИсточник: `game/missions/Run.cs`, `Run.Reward`; `game/missions/Cargo.cs`. Выполненное задание высыпает ящики из списка курьера (ценности и электрика) на столько добычи на каждого игрока и даёт каждой лодке игроков припасы ([Арена](../gameplay/missions.md), [Q129](../questions/missions.md#q129)).\n\n| Задание | Добыча на игрока | Припасы каждой лодке |\n| --- | --- | --- |\n| Конвой (`Escort`) | 30, у последней точки маршрута | топливо, ремонт |\n| Курьер (`Courier`) | 40, у первой лодки игроков | топливо |\n| Маяки (`Beacons`) | 50, у последнего маяка | топливо, нитро |\n| Броненосец (`Ironclad`) | — (его обломок, как у любого охотника) | ремонт, броня |\n\nГруз (`Cargo`) ничего не платит сверху: сам груз — 30 добычи на игрока из списка судна снабжения, рассыпанные вокруг его точек.\n\n## Места промысла\nИсточник: `game/activities/Shoal.cs`, `Catch`; `game/activities/Wreck.cs`, `Salvage`. Поднятое в виде сбоку ложится в трюм и продаётся, как любая добыча ([Места промысла](../gameplay/sites.md), [Q31](../questions/haul.md#q31)). В трюме у каждого вида два размера по половинам диапазона (`Catch.Sizes`, `Items`); каждая вещь занимает одно место, как ящик.\n\n| Рыба | Длина, м | Добыча | Монеты |\n| --- | --- | --- | --- |\n| Скумбрия (`Mackerel`) | 0,3–0,5 | 2 | 6 |\n| Луциан (`Snapper`) | 0,45–0,85 | 4 | 12 |\n| Барракуда (`Barracuda`) | 0,8–1,4 | 6 | 18 |\n| Групер (`Grouper`) | 0,65–1,2 | 9 | 27 |\n\nВ косяке восемь рыб; скумбрии втрое чаще групера: из семи 3 скумбрии, 2 луциана, барракуда, групер (`Catch.Kinds`).\n\n| На обломках | Вес, кг | Добыча | Монеты |\n| --- | --- | --- | --- |\n| Ящик (`Crate`) | 12–35; в трюме 18 или 29 | 5 | 15 |\n| Бочка (`Barrel`) | 40–110; в трюме 58 или 92 | 4 | 12 |\n| Сундук (`Chest`) | 20–60; в трюме 30 или 50 | 14 |
