/questions/missions.md#q76)).\n\nСм. также: [Верфь](boatyard.md).\n"}, {"id": "decisions", "path": "decisions.md", "title": "Журнал решений", "section": "", "date": "2026-11-11", "md": "# Журнал решений\n\nКрупные решения владельца по датам, с отвергнутым и откаченным, чтобы не повторять. Само решение — на странице темы; здесь только когда и почему. Почти всё сделанное с конца октября 2026 владелец ещё не играл.\n\n## Октябрь 2026\n- **10-15** Игра должна играться: всё встраивать в живую игру, настоящий прототип, а не «текст и кнопки».\n- **10-26** Симулятор архипелага снят целиком; вся игра — аркадный морской бой: статичный изометрический вид, одна лодка без физики, но с ощущением моторной лодки, огонь с бортов на `Q`/`E`. «Ощущается потрясающе». Старая игра хранится под git-тегом `simulator-game`. → [Об игре](vision.md)\n- **10-26** Лодку собирают из деталей на верфи; вес важен; красивый экран характеристик; без свободных корпусов и многокорпусных. Нарисованный корпус — это физический корпус. → [Верфь](base/boatyard.md)\n- **10-26** Один остров на банке с мелководьем рядом, чтобы море было красивым. → [Море](world/sea.md)\n- **10-26** 60 кадров в секунду достаточно, качество важнее. → [Об игре](vision.md)\n- **10-26** Отвергнуто: глиссирование, поднявшее корпус, — пропало «прыгание по волнам», откачено; корпуса едут по кильватерам. 10-31: это весело, но не опора игры.\n- **10-26** Отвергнуто: тёмные стеклянные карточки интерфейса — «безлико, как сгенерировано ИИ». → [Арт-дирекшн](art/README.md)\n- **10-27** Делать, как делают игры: сначала выпущенные игры и самый простой подход, симуляции и статьи — только когда простого не хватает. → [CLAUDE.md](../CLAUDE.md)\n- **10-27** Отвергнуто: погода (туман, дождь, шторм, гром) построена и снята целиком. → [Q6](questions/world.md#q6)\n- **10-27** Отвергнуто: лор с придуманными словами — откачен; владелец выбирает лор по кускам. → [Сеттинг и лор](story/setting.md)\n- **10-28** Настоящие моторные лодки вместо коробок на плите. → [Облик лодок](art/boats.md)\n- **10-28** Ракеты на открытых рельсовых стойках, прямые и быстрые. Раньше плоские выстрелы были «слишком быстрыми», потом были дуговые шары. → [Бой](gameplay/combat.md)\n- **10-28** Пена симулирована и принадлежит воде; брызги урезаны как «чрезмерные». → [Облик мира](art/world-look.md)\n- **10-28** Звук — слои записей CC0 с Freesound; список загрузок одобряет владелец. → [Звук](audio/sound.md)\n- **10-29** Каждая деталь — лучший выбор для какой-то лодки; детали, худшие во всём, убраны. Вес стоит скорости. → [Лодка](gameplay/boat.md)\n- **10-29** Демо и проверки в `game/demos`; игра ничего не несёт для тестов. → [Демо](tools/demos.md)\n- **10-29** Сборки для Mac и Windows, версия на каждый пост. → [Сборки и посты](tools/release.md)\n- **10-29** Отвергнуто: образец HUD из авиасимулятора снят. → [Стиль интерфейса](art/interface.md)\n- **10-30** Отвергнуто: усиленные стилизованные кильватерные волны — «выглядят плохо», откачены. → [Арт-дирекшн](art/README.md)\n- **10-30** Охотники: таранщики, торпеды, стаи, припасы, дым, один ИИ-планировщик на всех. → [Охотники и ИИ](gameplay/hunters.md)\n- **10-31** Миссии, а не открытый мир; топливо ограничено; база — эллинг из Blender, с неё начинается игра. Отвергнуто: первая база, жёлтый дом с красной крышей. → [Миссии](gameplay/missions.md), [База: эллинг](base/boathouse.md)\n- **10-31** Миссия начинается в море, со вступительного пролёта низко у борта. → [Миссии](gameplay/missions.md)\n- **10-31 — 11-01** Лунная ночь и тёплый рассвет. → [Свет и время суток](art/light.md)\n\n## Ноябрь 2026\n- **11-01 — 11-02** Места промысла с видом сбоку; редактор карт с картами в JSON. → [Места промысла](gameplay/sites.md), [Редактор карт](tools/map-editor.md)\n- **11-02** Гоночные ливреи, банда охотников в малиновом, рубки и приметы соларпанка. → [Облик лодок](art/boats.md)\n- **11-02** Интерфейс — вещи мира; образцы Frutiger Aero и Utopian Scholastic. → [Стиль интерфейса](art/interface.md)\n- **11-02** Сеттинг назван: оптимистичный соларпанк после падения. → [Сеттинг и лор](story/setting.md)\n- **11-02** Посты в канале по-русски, каждый одобряет владелец; вышла 0.0.2. → [Сборки и посты](tools/release.md)\n- **11-03** Название — Floppa Tropical Adventures. Все жители — флоппы. → [Люди: флоппы](art/people.md)\n- **11-03** Кампании пока нет; детали покупают за монеты; пустой бак проваливает миссию; без тепловизора дым прячет цели; автосохранение. Отвергнуто: открытие деталей с каждых обломков. → [Прогресс и сохранения](gameplay/progression.md)\n- **11-03** Музыка на семплах инструментов CC0. → [Музыка](audio/music.md)\n- **11-04** Все замечания QA по интерфейсу исправлены, добавлен геймпад. → [Управление](interface/controls.md)\n- **11-04** Простейший кооп по локальной сети. → [Онлайн-кооп](online.md)\n- **11-06** Никто из флопп ничего не держит в лапах. → [Люди: флоппы](art/people.md)\n- **11-06** Голос — кошачий лепет на каждую букву, а не речь; анимированные метки текста. → [Диалоги и голос](story/dialogue.md)\n- **11-06** Сюжет — сцены во встроенном редакторе: граф и сценарий, ветки, условия, приоритеты, триггеры. → [Сцены сюжета](story/scenes.md)\n- **11-06** Топливо считается расстоянием, лимита скорости нет, броня — броневой пояс на своём месте верфи, торпедные аппараты под водой. → [Лодка](gameplay/boat.md)\n- **11-06** Директор шлёт набеги в затишья по бюджету угрозы. → [Директор](gameplay/director.md)\n- **11-06** Зоны и опасности на картах. → [Зоны и опасности](world/areas.md)\n- **11-06** Полигон у базы с мишенями-макетами. → [Полигон](base/testing-ground.md)\n- **11-06** Горы, барьерные рифы, морские столбы, косы и отмели. → [Рельеф](world/ground.md)\n- **11-06** Мир — как на картинках меню. → [Облик мира](art/world-look.md)\n- **11-06 — 11-07** Отвергнуты все облики меню с картинок, громкие и утончённые. → [Арт-дирекшн](art/README.md)\n- **11-07** Никаких картинок, сгенерированных ИИ. → [Арт-дирекшн](art/README.md)\n- **11-07** Страница настроек и русский пер т набеги, внутри случаются события из прежних видов миссий (конвой, курьер, маяки, груз, броненосец); кончается выходом или гибелью, добыча продаётся на квитке. → [Арена](gameplay/missions.md)\n- **11-09** Крюка нет: владелец убрал крюк, лебёдку и буксир. → [Лодка](gameplay/boat.md)\n- **11-09** Ракеты и торпеды наводит курсор в веере своего борта, щелчок стреляет бортом под курсором; клавиши смены захвата нет. → [Бой](gameplay/combat.md)\n- **11-09** Ракеты врагов летят медленнее ракет игрока, чтобы от них уворачиваться; удар носом на нитро — приём любой лодки. → [Бой](gameplay/combat.md)\n- **11-09** Пустой бак больше не проваливает поездку: лодка ползёт домой с добычей. Вес добычи не наказывает за полный трюм. → [Лодка](gameplay/boat.md), [Добыча](gameplay/haul.md)\n- **11-10** База — открытый пирс в лагуне вместо эллинга; база и верфь на лентах плиток, как гараж NFS, без предметов и значков для щелчка; лодки товарищей по кооперативу стоят у того же пирса. → [Пирс](base/pier.md), [Верфь](base/boatyard.md)\n- **11-10** Ракету парируют ракетой; нитро — рывок, которым уходят от ракет, крутой, а не правдоподобный. → [Бой](gameplay/combat.md), [Лодка](gameplay/boat.md)\n- **11-10** Соперников в игре нет; у каждого врага случайное лицо. → [HUD](interface/hud.md)\n- **11-10** Открытый мир вместо «хаб + миссии»: игра по умолчанию сразу начинается в море на арене, а база — это гавань (пирс) на острове, к которой нужно доплыть и пришвартоваться на `Space`; буи выхода убраны из игры, выход из гавани возвращает лодку от пирса в то же живое море, а гибель показывает «Погиб» и перезагружает последнее сохранение. → [Арена](gameplay/missions.md), [Пирс](base/pier.md), [Добыча](gameplay/haul.md)\n"}, {"id": "gameplay-boat", "path": "gameplay/boat.md", "title": "Лодка", "section": "gameplay", "date": "2026-11-11", "md": "# Лодка\n\n![Лодка игрока вблизи](../img/boat.jpg)\n\nЕдинственная лодка игрока: как она управляется, плавает, горит топливом и что на неё ставят. Числа корпусов, моторов и брони — в [Балансе лодок](../balance/boats.md).\n\n## Решения владельца\n- Лодка кренится в повороте слабо (2026-11-10): крен каждого корпуса (`Feel.Lean`) срезан вдвое.\n- Никакой физики, но весёлое ощущение управления катером.\n- Она управляется как твёрдое тело, толкаемое в точках корпуса, по образцу 2D-машины Пэта Керра (patkerr.co.uk/2d-vehicles), а не чистым сглаживанием.\n- Перевёрнутая лодка выпрямляется, против физики, если нужно, как аркады переворачивают машину обратно на колёса.\n- Она едет по волнам — своим и чужим следам.\n- Несколько типов лодок: простые катера, от самых примитивных. В каждый должно быть круто запрыгнуть и управлять им.\n- Вес важен: у каждой детали есть масса, и лодка держится на воде, дифферентуется, встаёт и управляется по ним. Вес стоит скорости, как на настоящем глиссирующем катере.\n- Ничто не ограничивает скорость лодки: чем безумнее, тем лучше.\n- Крюка нет: владелец убрал крюк, лебёдку и буксир 2026-11-09.\n- Стоящая лодка разворачивается на месте одним рулём, без газа.\n- Каждая деталь — лучший выбор для какой-то лодки: деталь, во всём хуже другой, убирается.\n- Никаких свободных корпусов и многокорпусных лодок; крайние проекты не требуют особой обработки.\n- Нитро — рывок (2026-11-10): нажатие на Shift бросает лодку вперёд, и рывком уходят от ракет. Он должен быть крутым и весёлым, а не правдоподобным. Заряд восстанавливается со временем. Охотники тоже его жгут.\n- Топливо ограничено: лодка несёт только столько, и если оно кончилось, миссия провалена. Оно сгорает по тому, как мотор ведёт лодку, а не по времени: лодка, стоящая на месте или идущая накатом, не жжёт ничего.\n- Снаряжение добавляет приём: таран ([Бой](combat.md)), дым, сбивающий охотнику прицел, помпа, чинящая корпус в море, плотники, которые латают его за каждую лодку, которую она топит ([Бой](combat.md)).\n- Прицел, установленный на лодку, показывает корпуса сквозь дым силуэтами. Без него дым скрывает охотников от захвата цели игрока и от HUD.\n- Посадка на мель не вредит.\n- У брони в верфи есть собственное место, как у мотора, и она не занимает станцию: пояс клёпаных стальных плит, изогнутых по корпусу вдоль обоих бортов по ватерлинии; платится весом и монетами. Плита, принявшая свои попадания, падает в море, и лодка становится легче и быстрее.\n- Лодка несёт снаряжение по размеру корпуса: малый корпус одну деталь, больший больше.\n- Охотник, затонувший на мелководье, лежит на дне до конца миссии: обломки для захвата ([Места промысла](sites.md)).\n- У каждого корпуса свой бак, у каждого мотора свой расход; охотники топлива не жгут. Топливо встречается и припасом ([Припасы](pickups.md)). С пустым баком лодка игрока не выбывает: она ползёт домой малым ходом, с добычей и без нитро.\n\n## Как устроено\n- **Проекты** (`Parts`, `Design`, `Designs`, `Build`): корпус, мотор, деталь или ничего на каждой палубной станции, снаряжение или ничего и броня или ничего, у каждого масса и цена в монетах. `Build.Of` ставит каждую деталь на корпус так, чтобы лодка плавала, как нарисована; проект, который затонул бы, отвергается (`Build.Fault`).\n- **Направление** (`Launcher.Facing`, `DeckPart.Fits`): пусковая установка смотрит в какую-то сторону: поперёк (стойки, трубы) или вперёд (носовые стойки). Деталь предлагается только на тех станциях, куда она подходит. Носовые стойки стреляют вперёд с обеих сторон форштевня, их потоки пересекаются впереди: Q — левая, E — правая. Рулетка показывает их как отдельный вид. `Boat.Covers` говорит, достаёт ли какая-нибудь установка до точки.\n- **Модели** (`Part.Model`, `PartModel`, `Look.Piece`): деталь может быть нарисована по модели, сделанной в Blender по скрипту в `tools/`; `Layout` ставит её туда, куда идёт её станция или снаряжение, на основание твёрдого тела, по которому бьют снаряды, а ливрея её отделывает.\n- **Снаряжение** (`GearPart`, `Design.Gears`, `HullPart.GearPlaces`, `Layout.Gear`): его вид размещает, взвешивает и рисует его: управление огнём, таран, помпа, дымогенератор, плотницкий лес. У корпуса столько мест снаряжения, сколько в `GearPlaces`: от одного у малых до трёх у канонерки и броненосца, охотники и макет без своих мест. Деталь каждого вида на лодке одна; места не обязаны быть заняты. Каждая деталь занимает ближайшее место, свободное от мотора, деталей станций и деталей снаряжения, поставленных раньше, как это делает оснастка. Всё, что читает снаряжение лодки (дым, помпа, таран, плотники, управление огнём, цена и вес), читает все её детали (`Design.Has`). Старый проект и старая карта с одной деталью читаются как проект с ней на первом месте (`Progress.Saved.Gear`, `Design.Names`). Числа мест временные, решение без владельца ([Q8](../questions/boat.md#q8)).\n- **Броня** (`ArmourPart`, `Belt`): пояс клёпаных стальных плит, изогнутых вдоль обоих бортов по ватерлинии, со своим местом в верфи. Он добавляет долю к числу попаданий корпуса, каждая плита — равную долю их и стали пояса ([Q30](../questions/boat.md#q30)). Патрульный катер носит лёгкий пояс, канонерка и броненосец — тяжёлый.\n- **Тепловизор** (`DeckKind.Sight`, `Boat.Thermal`): палубная деталь, занимающая станцию, которую заняла бы пусковая установка. Лодка с ним видит сквозь дым (`Screens.Sees`), а лодка игрока с ним рисует каждый корпус, который скрывает дым, как глянцевый силуэт (`ui/Silhouettes.cs`, `silhouette.gdshader` на `glow_glass.gdshaderinc`). Зачем станция, а не снаряжение: места снаряжения считаны, а лодка с дымом ещё и несёт дым.\n- **Корпуса** (`HullForm`, `ShipClass`, `Stability`, `BoatModel`): одно параметрическое тело даёт объём, центры и метацентр, и корпус рисуется по нему как настоящий катер ([Q11](../questions/world.md#q11)).\n- **Под водой** (`BoatModel.Lie`, `common/surface_shading.gdshaderinc`): корпус затеняется под водой по высоте моря у миделя, как это читает его мореходность, так что лодка во впадине не рисуется мокрой.\n- **Управление** (`Manoeuvring`, `Handling`, `Afloat`): твёрдое тело, толкаемое в точках корпуса. Корпус цепляется против бокового хода, так что скользит на поворотах. С закрытым газом руль крутит лодку на месте вокруг центра тяжести, с той долей поворота, что у мотора на месте (`TurnAtRest`); привод перехватывает поворот, когда лодка набирает ход. Максимальная скорость растёт как корень из мощности, делённой на вес, так что каждая тонна стоит скорости, как в вышедших играх с весом сборки. Ничто её не ограничивает ([Q20](../questions/boat.md#q20)).\n- **Нитро и брызги** (`Nitro`, `RoosterTail`, `Spray`, `BowSheets`): нажатие тратит половину шкалы на рывок: лодка разом получает скорость вперёд (`Nitro.Kick`), и полсекунды мотор тянет с умноженной мощностью; удержанная клавиша второй раз не рвёт. Пока рывок горит (`Nitro.Lit`), ракеты и снаряды проходят сквозь лодку (`Projectile.Meets`), у охотников тоже: решение без владельца, [Q146](../questions/boat.md#q146). Привод в рывке бросает петушиный хвост ([Q9](../questions/boat.md#q9)). Зачем брызги: это то, что лодка на полной мощности бросает, как в аркадных гонках на катерах. Брошенная вода летит комьями и всплесками и пенит море там, где падает. `BowSheets` бьют струями из каждого сечения корпуса в зависимости от того, как быстро его днище погружается.\n- **Мореходность** (`Seakeeping`, `WakeUnder`): теория полос: вертикальная, килевая и бортовая качка от давления воды на сечения, срезанные вдоль корпуса, со слемингом и глиссирующим подъёмом. Вода — это волны плюс следы каждого корпуса, так что корпус едет на своей носовой волне и перепрыгивает следы. Перевёрнутая лодка выпрямляется, если крен превышает метацентрическую высоту при нём, как аркады переворачивают машину обратно; вне воды её дифферент выравнивается, как в аркадных гонках, так что прыжок никогда не кончается на спине. Демпфирование берётся неявно, чтобы оно не могло сбросить корпус с моря. Зачем фиксированный такт и сдвиг корпусов: чтение моря — большая часть цены корпуса; всё остальное, что плавает на этой воде, берёт свои отсчёты, переносимые между тактами (см. [Охотники и ИИ](hunters.md)).\n- **Видимые и невидимые** (`Boat.Seen`, `camera/Sight.cs`): невидимая лодка не бросает брызг, но всё равно едет на каждом такте, так как корпус, читаемый реже, подпрыгивал бы при появлении в кадре. Зачем: брызги — самая большая статья расходов лодки, а игры отсекают то, что вне экрана.\n- **Осадка и контакт** (`ShipClass.Settling`, `Afloat`, `Contact`): корпус, не выдержавший, тонет и переворачивается, а на мелководье лежит на грунте, пока бой не начнётся заново. Корпуса встречаются тестом разделяющих осей по своим ватерлиниям (`Touch`). `Contact.Ground` делает грунт таким же твёрдым, как другой корпус; посадка на мель не вредит.\n- **Топливо** (`ships/Fuel.cs`, `Design.Range`): у каждого корпуса свой бак в литрах (`HullPart.Tank`), у каждого мотора свой расход в литрах на километр (`EnginePart.Burn`); дальность полного бака — их отношение. Бак опустошается по тому, как мотор ведёт лодку, так что лодка, идущая накатом или стоящая, не жжёт ничего; насухо лодка игрока идёт на доле газа, а нитро закрыто (`Player.Limp`); доля — решение без владельца, [Q137](../questions/boat.md#q137). Охотники не жгут ничего. Когда топливо уходит в запас, HUD предупреждает и показывает путь домой ([Q63](../questions/interface.md#q63)). Числа бака и расхода — временные, решение без владельца ([Q8](../questions/boat.md#q8)); стартовый ялик с подвесным мотором идёт 6 км, как шёл при едином баке. Верфь показывает дальность строкой «Запас хода» на экране статистики, бак и расход — в строке детали.\n\nОблик лодок (ливреи и оснастка) описан в [Облик лодок](../art/boats.md).\n"}, {"id": "gameplay-builds", "path": "gameplay/builds.md", "title": "Сборки и стили игры", "section": "gameplay", "date": "2026-11-10", "md": "# Сборки и стили игры\n\nСборки — это разные способы играть, которые игрок собирает из деталей в верфи.\n\n## Решения владельца\n- Сборки играются по-настоящему по-разному, каждая из деталей, купленных в верфи:\n  - Бортовой залп: борт, выведенный на цель на параллельном курсе.\n  - Преследователь: две короткие ракетные рейки у форштевня, стреляющие вперёд, наводимые поворотом на врага.\n  - Турельщик: круглые двуствольные турели, которые поворачиваются и стреляют сами по ближайшему врагу, пока игрок только ведёт.\n  - Носитель дронов: маленькие безэкипажные морские дроны, бегущие по воде, кружащие вокруг врага и стреляющие ракетами; Q и E посылают и отзывают их. Дрон не стреляет, пока его носитель лежит на линии огня.\n  - Минёр: чёрные шаровые мины со светом цвета стороны сверху, сбрасываемые за корму, взводящиеся через мгновение и взрывающиеся под любым другим корпусом.\n- Ни одна сборка не является простым медленным танком: одно только принятие ударов — не способ играть.\n- Никакой подлодки, ни как корпуса, ни как способа играть: под синим морем её не видно с камеры, а над банкой в 5 м она не может нырнуть. Нырок на две-три секунды, как снаряжение, может появиться с ночными миссиями.\n\n## Как устроено\nДроны — маленькие лодки на собственном корпусе (`Drone`), стороны своего носителя, под капитаном с ролью `Wingman`. Люлька держит двух, по одному на борт. Когда дроны есть в рулетке, Q посылает левого на цель захвата, а E правого; повторное нажатие отзывает его. Потерянный дрон отстраивается на борту, а принятый на борт чинится. Крыло (`Wing`) хранит упоры, выводит дрон в море у кормовой четверти носителя, шагает капитанами на хосте, стреляет их залпами и принимает их на борт.\n\n- **Люлька**: каждый упор готов, вышел, чинится или отстраивается, как говорит `Wing.State`; лампы рулетки показывают это, а `Cradles` рисует неподвижный дрон в каждом упоре, где он есть. Твёрдое тело люльки — место обоих дронов; она предлагается только там, где они целиком лежат в кокпите, вдали от мотора и других деталей (`Layout.Fits`, который делят верфь и каталог). `Wing.Toggle` — нажатие клавиши: готовый дрон посылается на цель захвата или на ближайшего врага впереди траверза, иначе он охраняет; вышедший отзывается. Гость видит, сколько дронов вышло, но не из какого упора.\n- Вышедший без цели дрон кружит вокруг носителя вдали от его корпуса и берёт ближайшего враждебного, подошедшего близко.\n- Посланный на цель (`Wing.Send`), он влетает и стреляет по траверзу, как лодка роя, затем уходит на свой круг. Круг лежит по дальнюю от носителя сторону цели и качается по этой половине (`Wingman.Slot`), так что носитель не стоит на его линии (решение без владельца, [Q138](../questions/combat.md#q138)). Поводок держит его близко к носителю.\n- Отозванный (`Wing.Recall`) или при последнем попадании он идёт к кормовой четверти носителя. Близко к любому борту, на любом ходу, крыло берёт его в руки: он подводится вплотную к своему упору по кривой в системе носителя, кинематически и вне контакта (`Drone.Passes`), затем поднимается на борт, как шлюпбалкой (`Cradles`). Зачем: игры стыкуют истребители так; дрон, поворачиваемый тягой, не наведётся на причал.\n- Потопленный носитель затапливает свои дроны. Дрон не берёт припасов.\n- Это лодки, поэтому гость отражает их, как любую лодку; они никогда не считаются лодками игроков.\n\n`Senses.Assign` отдаёт капитану цель снаружи, так что цель дрона выбирает крыло, а не его собственные чувства. Дрон не держит расстояния от носителя (`Senses.Escort`).\n\n## Как выбирали сборки\n- В ноябре 2026 владелец попросил не менее пяти по-настоящему разных способов играть, собираемых в верфи, и никакого медленного танка. Затравкой были автоматические турели, дроны, огонь с носа и носитель дронов; владелец спросил о подлодке и минёре.\n- Пять направлений исследования (морские игры, игры-конструкторы, шутеры, кооперативные игры, игры с машинами) смотрели, как вышедшие игры дают каждому способу играть свой основной глагол. Валидатор выбрал шесть: бортовой залп (оставлен), преследователь, турельщик, носитель дронов, минёр и загонщик. На каждый вопрос о внешнем виде владелец ответил рекомендуемым вариантом.\n- Основной глагол каждого: бортовой залп выводит борт на цель на параллельном курсе; преследователь направляет нос и преследует, целя поворотом; турельщик ведёт, лишь пока стреляют его турели; носитель дронов посылает и отзывает крыло дронов; минёра преследуют, и он ведёт преследователей над своими минами.\n- Состояние: преследователь, турель, крыло дронов, люлька вошли в `main` 2026-11-07. Минёр (минный жёлоб), третья волна, вошёл в `main` 2026-11-07 — 2026-11-08.\n- Заметки исследования лежат вне репозитория, в `~/Library/Caches/Pirates/archetypes/` (`picks.md` хранит выбор, волны и задания).\n\nОружие описано в [Бой](combat.md).\n"}, {"id": "gameplay-camera", "path": "gameplay/camera.md", "title": "Камера и картинка", "section": "gameplay", "date": "2026-11-10", "md": "# Камера и картинка\n\nВид на бой: фиксированная изометрия, зум и разрешение, в котором рисуется мир.\n\n## Решения владельца\n- Статичный 2.5D изометрический вид: фиксированный азимут и наклон, чуть круче изометрического, как мир показан на картинах меню.\n- Игрок приближает и отдаляет, только зум: камера остаётся на месте. Бой начинается отдалённым, примерно в пятнадцать корпусов лодки поперёк кадра.\n- Вид следует за лодкой. В областях, которые карта размечает как арены, он вместо этого стоит неподвижно над ареной, а миссия проигрывает короткие вставки по кадрам, заданным для неё в редакторе карт.\n\n## Как устроено\n- **Вид** (`camera/IsometricCamera.cs`): наклон чуть круче изометрического, издалека, через узкое поле зрения, глядя немного левее солнца, чтобы блики лежали вдали от HUD. Земля, вставшая между камерой и лодкой, за которой она следует, растворяется дизерингом вокруг лодки (`camera/seethrough.gdshaderinc`), как изометрические игры вырезают то, что закрывает игрока; тени сохраняют свою форму.\n- **Арена** (`areas/Area.cs` `Arena`, `areas/Arenas.cs`): круг карты. Пока лодка игрока в нём (с запасом 8 м на выход, чтобы лодка на кромке не дёргала вид), вид перестаёт следовать за лодкой и стоит над серединой круга; зум игрока работает и в арене, но не ближе, чем нужно, чтобы круг поместился в кадр с запасом (`IsometricCamera.Hold`); круг шире примерно 170 м не помещается и в самом широком поле. Выйдя, вид возвращается к лодке тем же плавным шагом, каким следует. Меняется только вид игрока: в бою, в сети и на море ничего, и арена ничего не рисует. Почему так: вид, привязанный к лодке, не показывает место боя целиком, а в арене важно видеть всё.\n- **Вставки** (`camera/Shot.cs`, `camera/ShotCamera.cs`, `Game.Cut`): миссия несёт вставки (`Mission.Cutscenes`), каждая из нескольких кадров. Кадр — точка, на которую смотрит камера, сколько секунд она на ней, куда сползает, если движется (`To`), высота кадра в метрах воды, наклон и поворот относительно вида боя; между кадрами жёсткая склейка, как в игровых вставках на движке. Вставка играется под чёрными полосами вступительного пролёта (`Titles.Letterbox`), без слов; Space, Enter, Esc или щелчок её пропускают, как пролёт; HUD уходит на её время. Бой идёт дальше: вставка двигает только камеру игрока и в сети никого не останавливает. Руль держит последнюю команду (ход, поворот и нитро; огонь и трюм не держатся), пока игрок не взял руль обратно.\n- **Когда играется вставка**: арена называет её (`Arena.Scene`), и она играется на машине игрока, когда его лодка впервые входит в эту арену (решение без владельца, [Q118](../questions/interface.md#q118)). Руль и бой во время неё — тоже решение без владельца ([Q119](../questions/interface.md#q119)).\n- **Разрешение**: на экране Retina мир рисуется в точках и растягивается поверх кадров (`Settings.Fit`), либо в доле от этого, которую задаёт игрок, апскейлером MetalFX Temporal на macOS и FSR 2 в остальных случаях, либо пространственным апскейлером по выбору игрока (MetalFX Spatial, FSR 1) под TAA. Зачем: полное разрешение не держит 60 FPS, а временной апскейлер выравнивает детали тоньше пикселя, такие как блики; пространственный дешевле.\n- **Вид верфи** (`camera/YardCamera.cs`): низкий вид сбоку на всю лодку, свой вид, не вид боя; вход и выход — плавный переход от вида базы с лёгким приближением. Выбор детали вид не двигает, игрок крутит его сам. Подробнее в [верфи](../base/boatyard.md).\n"}, {"id": "gameplay-combat", "path": "gameplay/combat.md", "title": "Бой", "section": "gameplay", "date": "2026-11-11", "md": "# Бой\n\n![Ракеты бьют в охотника](../img/combat.jpg)\n\nОружие лодки, захват цели, попадания, дым и таран.\n\n## Решения владельца\n- Мышью не целятся (2026-11-10): ракеты и торпеды идут в захваченную цель внутри веера своего борта, а если её в веере нет, в ближайшего видимого охотника в нём (2026-11-11). У каждого борта и у носовых стоек свой широкий веер на воде, и чтобы навести веер на цель, лодку поворачивают. Q и E стреляют каждая своим бортом, щелчок — бортом, который достаёт цель. Откуда стреляет оружие, приходит с деталью, купленной в верфи: стойки над каждым бортом (Q — левый, E — правый), носовые стойки, стреляющие вперёд, мины, сбрасываемые за корму, и турели, целящиеся сами.\n- Основное оружие — турель: она стоит на стартовой лодке и стреляет сама. Ракеты — дополнение, их стойки покупают в верфи.\n- Ракеты выпускаются с рельсовых стоек рябью залпов. Они летят прямо и быстро в захваченную цель; сама выбирает цель только турель. Ракеты скользят над волнами на постоянной высоте, так что крен или волна никогда не портят выстрел.\n- Ракетные стойки растут в уровнях: первая стреляет двумя ракетами на борт, и ракеты залпа уходят одна за другой с небольшой задержкой (2026-11-10).\n- У турели свой снаряд, заметно медленнее ракеты, и выглядит он иначе: светящийся трассер без дыма (2026-11-10).\n- Захвачен один враг за раз. Клавиши смены захвата нет; когда захваченный враг тонет, захват переходит сам. Борт, чьи ракеты, выпущенные сейчас, попали бы в цель, зажигает свою клавишу, Q или E, у борта лодки и у цели: ярко, когда борт заряжен, и тускло, пока он перезаряжается. Клавиша торпеды ждёт попадания в районе середины корпуса.\n- Торпеды — второе бортовое оружие: медленные, идущие под волнами, топящие лодку за одно-два попадания. Их трубы лежат в корпусе под водой: на палубе ничего не видно, а торпеда выходит под поверхностью.\n- C переключает оружие, которым стреляют Q и E, по видам пусковых установок на борту; дым держит свою клавишу, F. HUD показывает выбор маленькой рулеткой ромбовидных значков в глянцевом аква-стекле приборов.\n- Ракету парируют ракетой (2026-11-10): ракеты двух сторон, встретившись в воздухе, взрывают друг друга.\n- Попадание есть попадание: где ракета ударила в корпус, не меняет того, что она делает.\n- Таран вредит обеим лодкам, но лодка с тараном не страдает от собственного тарана. Таран защищает только нос своей лодки: удар в нос приходится на таран, удар в борт или корму вредит лодке как любой. Ни один удар не топит целую лодку разом.\n- Удар носом на нитро — приём любой лодки: она получает меньше, а бьёт сильнее. Таран делает его ещё сильнее.\n- Ракеты охотников горят красным, а игрока — оранжевым, так что перекрёстный огонь читается с первого взгляда. Они летят медленнее ракет игрока, так что от них можно увернуться.\n- Охотники стреляют независимо от того, стоит ли на пути остров.\n- Плотники латают за каждую лодку, которую потопила их лодка, четверть того, что та выдерживала; их несёт охотник-гонщик.\n- Дымовая завеса медленно дрейфует с ветром, оставаясь около того места, где поставлена. Её перезарядка — шкала в кластере приборов.\n\nКакие стили игры строятся из этого оружия, описано в [Сборки и стили игры](builds.md); числа оружия — в [Балансе оружия](../balance/weapons.md).\n\n## Как устроено\nКаждая лодка стреляет из пусковых установок (`ships/Racks.cs`): ракеты из рельсовых стоек, торпеды из труб в корпусе под водой, мины из жёлобов за кормой; ракеты и торпеды игрока в пределах веера борта берут упреждение по захваченной цели, а установка, чей веер её не держит, по ближайшему видимому охотнику в своём веере (`Boat.Aimed`); турель целится сама. Q или E стреляет заряженными установками выбранного вида на борту, щелчок — бортом, который достаёт захваченную цель; C поворачивает рулетку к следующему виду. Охотник стреляет тем видом, который попал бы, сначала ракетами (`Captain.Aim`). `Gunnery` летит и ведёт выстрелы, наносит их удары и сообщает, что они делают, через свои события (`Shots.cs`); эффекты, звук, вид и HUD слушают. Охотники перезаряжаются медленнее игрока, по своей команде.\n\n- **Полёт** (`Rockets`, `Projectile`, `Shot`): ракета скользит над водой на фиксированной высоте, так что волны и крен лодки никогда не портят выстрел. Зачем: прямой выстрел поверх планширя прошёл бы над низким корпусом. Ракета любой стороны, кроме игроков, летит медленнее (`Rockets.Motor`); насколько — решение без владельца, [Q135](../questions/combat.md#q135).\n- **Парирование** (`Projectile.Meets`, `Rockets.Parry`, `Gunnery.Parried`): ракета или снаряд, подошедшие вплотную к летящему заряду другой стороны, взрываются вместе с ним. Снаряд турели парирует наравне с ракетой: решение без владельца, [Q145](../questions/combat.md#q145).\n- **Турели** (`Turrets`, `Rockets.Lead`): турель сама целится и стреляет по ближайшей враждебной лодке, которую видит в зоне досягаемости, беря упреждение, как батарея. Дым её ослепляет (`Screens.Sees`). Хост целит каждую турель; её снаряды доходят до каждого гостя, в том числе до её владельца, а гость поворачивает головки для вида. Она стоит на диаметральной плоскости, рисуется по модели (`tools/turret.py`) и не входит в рулетку: руль только ведёт.\n- **Минные жёлоба** (`Floaters`, `Floater`, `tools/minerail.py`): жёлоб вдоль планширя каждой кормовой четверти, наклонённый наружу, скатывает мину за корму через свою заслонку: Q — из левого, E — из правого. В каждом жёлобе нарисованы две мины; обе исчезают при сбросе и возвращаются по перезарядке. Один жёлоб на лодку, и он лежит в стороне от головы подвесного мотора и пилонов вентилятора (`Layout.Fits`), а твёрдое тело держит мины и их рожки. Мина успокаивается за мгновения, взводится через короткое время (загорается её огонёк) и взрывается, когда её касается корпус другой стороны, когда в неё стреляют или от другого взрыва, давая цепь, как мины карты (`Mines.Fuse`). Для своей стороны она не взрывается никогда. Лодка держит на плаву несколько мин, следующая топит самую старую невзорвавшуюся, и каждая со временем тонет сама. Щупальца охотников обходят их, как мины карты (`Obstacles`), а охотник берёт минный жёлоб, чтобы доставать на некоторое расстояние за кормой (`Captain.Reach`); `Boat.Covers` его не учитывает, так что таранщики всё равно гонятся за минёром. Мина — это снаряд: она доходит до гостей в `Fired`, как ракеты, а поплавок гостя только плавает и исчезает, когда до него доходит `Say.Blast` хоста ([Q88](../questions/combat.md#q88)).\n- **Торпеды** (`Torpedoes`, `Torpedo`, `ships/RoundModel.cs`): выйдя из трубы под водой, с побелевшим от кипения портом, торпеда идёт прямо на заданной глубине, пока ход не израсходован; где вода мелеет, она взрывается о грунт. Рядом с ракетой она медленная, и от неё можно уклониться. Её пузыри ложатся пенным следом (`Effects.Run`, `Wakes.Splash`). Зачем след: с высоты боя торпеда слишком тонка, чтобы её увидеть. Торпеды — самый тяжёлый удар и самая дальняя дальность, ракеты — лёгкие, верные и быстрые.\n- **Уровни ракет** (`Parts.Rockets`): стойки бывают четырёх уровней, каждая тяжелее, медленнее перезаряжается и дороже; корпуса несут одну по умолчанию, а остальные игрок покупает, как любую деталь. Зачем детали: более тяжёлая стойка стоит скорости, так что низший уровень остаётся выбором для лёгкой лодки.\n- **Таран** (`Ramming`, `Contact.Part`): корпуса двух сторон, сильно сталкиваясь, получают один импульс, так что большой корпус отмахивается от удара, топящего ялик. Лодки одной стороны толкаются без вреда. Удар по передней части тарана не вредит тарану; в других местах вредит, как любому. Лодка, бьющая носовой четвертью с горящим нитро, получает меньше и бьёт сильнее (`Ramming.Charging`); числа — решение без владельца, [Q136](../questions/combat.md#q136). Целая лодка сохраняет последнее попадание: удар не отнимает у неё больше, чем всё, кроме одного (`Ramming.Take`), решение без владельца, [Q109](../questions/combat.md#q109). `Ramming.Rammed` бросает брызги, щепки и искры, играет сигнал, трясёт вид и отмечает охотника, как попадание ракеты. Зачем по импульсу: вес и ход решают удар, как вес важен здесь везде.\n- **Помпа** (`Pump`, `Boat.Mend`): корпус с помпой, не получавший ударов некоторое время, время от времени чинит попадание, а вода бьёт через оба борта брызгами. Зачем оба борта: одна струя спряталась бы за корпусом.\n- **Плотники** (`Carpenters`): за каждую лодку, которую их лодка топит снарядом или тараном, плотники латают в её корпус часть попаданий, которые та выдерживала. Зачем при потоплении: это окупает напор в бою.\n- **Дым** (`ships/Smoke.cs`, `Screens`): F ставит завесу за кормой из канистр дымогенератора, затем он перезаряжается. Завеса — это клубы дыма боя (`Medium.Smoke`), которые жмутся к воде, вздымаются, дрейфуют и редеют. Она прячет лодки от любой лодки без тепловизора, и охотников, и захват цели игрока вместе с HUD (`Screens.Sees`): это оптическая толщина вдоль линии взгляда сквозь клубы в том виде, как они нарисованы (`Swarm.Through`), так что ослепляет то, что видно. Захват, оставленный на скрытом охотнике, держится, но не показывается. Завеса дрейфует на доле ветра, поскольку игры держат дым примерно там, где его поставили ([Q22](../questions/combat.md#q22)).\n- **Попадания** (`Boat.Touches`, `Boat.TouchesUnder`, `Boat.Strike`): ракета взрывается, когда её взрыв достаёт до того, что стоит выше ватерлинии; торпеда — когда достаёт до корпуса под ней, и подбрасывает корпус, не оставляя копоти. Лодка тонет, когда получает столько попаданий, сколько выдерживают её корпус и броня. Броня из припасов принимает удар первой (`Boat.Armour`), затем ближайшая на её борту плита пояса; плита, принявшая всё, что выдерживала, падает в море (`Boat.Shed`), и лодка перестраивается на плиту легче (`Build.Shed`), а её попадания по-прежнему считаются против того, что она выдерживала при постройке; ничто её не чинит ([Q30](../questions/boat.md#q30)). Снаряды проходят сквозь лодки своей стороны.\n- **Наводка** (`Controls.Sight`, `Command.Sight`, `Boat.Aimed`, `Boat.Fans`): мышь не целится — только правый стик геймпада даёт точку прицела на воде на дальности огня от лодки. Установка поворачивает выстрел к цели в пределах своего веера (`Boat.Fan`), дальше не поворачивает. Захват берёт ближайшего видимого врага (или врага на линии правого стика), а также цель задания (`Player.Lock`). Внутри веера выстрел берёт упреждение по захваченной цели (`Burn.Lead`). Щелчок стреляет каждым бортом, чей веер держит цель, а вне вееров — бортом со стороны цели (`Order.Fire`, `Boat.Sights`). Капитаны охотников наводят так же: их выстрел берёт упреждение по добыче в пределах веера (`Captain`), иначе медленная ракета не догоняет идущую лодку. HUD рисует веера у лодки игрока ([HUD](../interface/hud.md)). Ширина веера, выбор захвата и упреждение — решение без владельца, [Q134](../questions/combat.md#q134).\n- **Прицел** (`Boat.Strikes`): попал бы борт, выстрелив сейчас, в лодку, держащую свой ход; по умолчанию считаются только заряженные установки, так что охотник стреляет по тому, что долетело бы, а клавиша HUD ещё и тускнеет на борту, который перезаряжается (`loaded: false`). Торпедный прицел должен держаться и будь лодка чуть быстрее или медленнее.\n- **Взрывы** (`Blasts`, `Strikable.cs`): мина, бочка или снаряд, взрываясь, бьют каждый корпус в зоне досягаемости, меньше с расстоянием, и подбрасывают его вверх и в стороны; это показано, слышно и ощущается как взрыв ракеты. Снаряды взрываются о вещи карты как о корпуса (`IStrikable`, `Gunnery.Add`).\n- **Вид** (`Glow`, `Medium`, `Effects`, `ShotFeel`): одна модель огня, лампы которой освещают корпуса, дым и волны, и одна для дыма, тумана, пыли и брызг; `Effects` сочетает их для каждого события. Ракета горит цветом своей стороны (`Rockets.Tracer`), как трассеры красят по сторонам.\n- **Следы боя** (`Flashes`, `Trails`, `Burn`, `Debris`, `Scorch`): вспышка — огненный шар, который растёт, угасая, и светит вокруг. За ракетой тянется светящаяся лента (`trail.gdshader`), чтобы ракету в несколько пикселей было видно; `Burn` — её скорость от пуска до полного хода. Удар выбивает из корпуса щепки: они плавают, пока не намокнут и не утонут, так что бой оставляет обломки на воде. На корпусе и земле остаётся подпалина с остывающими углями. Вспышка и лента держат по запасному экземпляру с начала, чтобы их шейдеры собирались за шторкой загрузки.\n"}, {"id": "gameplay-director", "path": "gameplay/director.md", "title": "Директор", "section": "gameplay", "date": "2026-11-10", "md": "# Директор\n\nДиректор (`missions/Director.cs`) — это то, что решает, когда и кого послать на игроков на Арене.\n\n## Как устроено\n- **Начало захода** (решение без владельца, [Q141](../questions/combat.md#q141)): владелец увидел Арену без врагов. Первый набег идёт через пару секунд после старта, и каждый набег выходит не из логова, а с его стороны на удалении `Offing` от цели, так что он в бою за секунды.\n- **Директор** (`missions/Director.cs`): принадлежит хосту и задаёт темп боя в заходе, как это делают директора в шутерах; набеги он раздаёт так, как генератор историй раздаёт происшествия. Его напряжение растёт от попаданий по лодкам игроков и от потопленных охотников и остывает. После передышки, с которой открывается заход, затишье без охотников поблизости приносит набег: один вид из колоды (скиммеры, гонщики, преследователи, патрульный катер, бегуны с турелью, канонерка, минёры, таранщики, катерки или рой с дымом); новые виды колода открывает по минутам боя (`Raid.From`): чем дольше заход, тем тяжелее враг, столько лодок, сколько угроза покупает по их стоимости, со стороны моря за пределами обзора, с объявлением на HUD. Угроза растёт со временем захода, добычей в трюмах и числом игроков и по мере роста покупает лучшие команды; когда команда поднимается на ступень (зелёные, бывалые, ветераны, асы), HUD объявляет это (`Director.Tier`, оно же в строке захода на квитке). Бой на пике даёт передышку: поблизости от больше всего пострадавшей лодки раскидываются ремонт (иначе броня) и нитро. Директор держит не больше шести лодок помимо лодок игроков, но считает только те, что в пределах дальности набега от какого-нибудь игрока: дальние посты места не занимают ([Q130](../questions/combat.md#q130)). Заход бесконечен, так что директор работает до его конца ([Q70](../questions/missions.md#q70)). Зачем затишья: посты и задания Арены остаются как сделаны, а директор заполняет то, что лежит между ними, так что два захода не играются одинаково.\n\nОхотники — в [Охотники и ИИ](hunters.md).\n"}, {"id": "gameplay-haul", "path": "gameplay/haul.md", "title": "Добыча", "section": "gameplay", "date": "2026-11-11", "md": "# Добыча\n\n![Открытый трюм](../img/hold.jpg)\n\nМиссия — выход за добычей и возвращение домой. Здесь предметы, трюм, карта в море, точки выхода и возвращение. Ценность предметов и пошлины — в [Балансе экономики](../balance/economy.md).\n\n## Решения владельца\n- Кооперативная добыча: миссия — выход за добычей и возвращение домой с ней, пока охотники не потопили лодку. Всё считается на базе, а добыча продаётся за монеты сразу, на квитке.\n- Карта мира миссии показывает землю и её точки выхода, пути домой, и почти ничего больше. У некоторых точек выхода есть требования: цель миссии выполнена, пошлина, уплаченная предметами, мелкий проход, который пересекает только лёгкая лодка, или время, когда она открывается.\n- Потопленный охотник роняет свою добычу на воду, и лодка собирает её, проезжая по ней. Она плавает, пока её не соберут.\n- Добыча — это предметы, каждый разный, у каждого свой вес. Каждая лодка несёт предметы по-своему.\n- Собранное лежит в трюме лодки, как в рюкзаке шутеров с выносом добычи: сетка клеток, каждый предмет занимает свои. Размер сетки у каждого корпуса свой. Предмет, по которому лодка проезжает, сам ложится в свободное место; не поместившийся остаётся на плаву, а HUD говорит, что трюм полон.\n- Открытый трюм — инвентарь: что у лодки есть и сколько весит каждый предмет; игрок перекладывает предметы и выбрасывает их за борт. Бой тем временем продолжается, лодка рулится, но не стреляет. Вес добычи замедляет лодку, но не наказывает за полный трюм.\n- Лодка, ушедшая под воду, сохраняет себя и свои детали; её трюм высыпается на воду, чтобы другие его собрали. Защищённого контейнера нет: теряется всё.\n- Трюм — глянцевый аква-экран прибора из 2000-х: сетка клеток, в них объёмные картинки предметов, вес на циферблате. Карта в море — это старая печатная карта, сложенная, с точками выхода, обведёнными маркером, и стикерами.\n- Лодка передаёт предметы другой лишь так: выбрасывает их из трюма, а другая подбирает.\n\n## Как устроено\nПринесённое лодкой домой считается и продаётся на базе, и только там.\n\n- **Предметы** (`Items`): заглушки, придуманные, чтобы опробовать добычу ([Q42](../questions/haul.md#q42)), у каждого вес, добыча, за которую он засчитывается, ресурс, который он даёт, клетки, которые он занимает в трюме, и вид. Каждый проект охотника несёт несколько видов; охотник тянет свои по шансу миссии, пока их добыча не сойдётся к стоимости его проекта, и его обломок их высыпает.\n- **На плаву** (`Flotsam`, `Pile`): предметы качаются на волнах, пока их не соберут. Лодка игрока подтягивает те, что в досягаемости, каждый к ближайшей лодке, в трюме которой ему есть место (`Flotsam.Room`). Выброшенный остаётся другим, пока выбросивший не отойдёт. Груз миссии плавает так же, но берётся на борт, а не в трюм.\n- **Трюм** (`Hold`): сетка клеток корпуса (`HullPart.Hold`). Предмет занимает свои клетки (`Item.Cells`) и ложится в первые свободные, ряд за рядом, сперва как лежит, потом повёрнутым (решение без владельца, [Q107](../questions/haul.md#q107)). Когда рядом плавает предмет, которому нет места, HUD один раз объявляет «Трюм полон». Вес трюма замедляет только разгон лодки, полный ход остаётся (`Boat.Laden`); предела веса нет (решение без владельца, [Q43](../questions/haul.md#q43)). Пошлину трюм платит предметами, начиная с самых дешёвых. Лодка, уходящая под воду, высыпает свой трюм.\n- **Открытый трюм** (`HoldView`): глянцевый аква-прибор у левого края экрана. В клетках картинки предметов по их моделям (`ItemArt`) и вес каждого; заголовок — добыча в трюме, циферблат — вес добычи против веса самой лодки. Предмет перетаскивают мышью на свободные клетки, R или правая кнопка поворачивают его; отпущенный за прибором, он падает за корму. Приказы идут командой игрока (`Command.Stow`). Бой продолжается; лодка рулится, но держит огонь, и нажатые тем временем Q или E выводят FIRE HELD ([Q63](../questions/interface.md#q63)). Esc закрывает карту, затем трюм.\n- **Добыча из вида сбоку** (`SideView.Landed`): пойманная рыба и поднятая с обломка вещь — предметы трюма (`Items.Crate`, `Catch.Sizes`) и ложатся в него; без места остаются в воде ([Места промысла](sites.md)).\n- **Гавань на острове** (`Dock`, `Game.Offered`, `Game.Harbour`, `Game.LeaveHarbour`): буёв выхода в игре нет; единственное место сдачи добычи и посещения базы — пирс на острове (`Home cay`). На воде и за краем экрана гавань отмечена золотым маркером «Гавань», как места промысла, и обведена на печатной карте (`MapView`). Когда лодка сбавляет ход (`Site.Slow`) в пределах `Site.Reach` от первого места пирса и рядом нет охотников (`Game.Hunting`), под лодкой появляется подсказка `Space` («Гавань», или «Рядом охотники», если охотники близко). По `Space` добыча из трюма продаётся за монеты (`Progress.Earn`), бак заправляется, игра сохраняется, открывается экран базы (`Hub`) и, если в трюме была добыча, поверх него выезжает квиток (`Report`). Выход с базы возвращает починенную (и при необходимости пересобранную в верфи) лодку от пирса обратно в то же живое море. Классы `Ways`, `Exit` и `Exits` сохранены только для стенда демо `Hud/Exits` и значка на печатной карте.\n- **Карта** (`MapView`): сложенная в четыре панели карта, собственный рельеф мира, запечённый и напечатанный как старая карта (`MapPrint.Printed`), с обведённой маркером гаванью на острове. Без лодок.\n- **Гибель в море**: когда лодка каждого игрока ушла под воду (`Game.Returned`), чёрные полосы закрываются с надписью «Погиб» (`Hud.Died`), бой продолжается ещё `Homeward` секунд, и игра загружает последнее сохранение в открытый мир. Возвращение на базу из меню паузы (`Game.Home`) сбрасывает текущий заход без продажи трюма.\n"}, {"id": "gameplay-hunters", "path": "gameplay/hunters.md", "title": "Охотники и ИИ", "section": "gameplay", "date": "2026-11-11", "md": "# Охотники и ИИ\n\n![Охотники заходят на лодку игрока](../img/hunters.jpg)\n\nОхотники — враги игрока в море. Здесь их виды и единый ИИ, управляющий каждой лодкой, кроме лодки игрока. Числа их лодок — в [Балансе лодок](../balance/boats.md), их огня — в [Балансе оружия](../balance/weapons.md).\n\n## Решения владельца\n- Охотники нескольких видов идут разом: таранщики, которые бросаются в атаку, рои маленьких, слабых и очень быстрых лодок и лодки, которые кладут игрока на траверз и стреляют. Дымовой рой маленьких юрких лодок ставит много дыма и видит сквозь него.\n- На Арене к ним добавляются преследователь, бегун с турелью и минёр: лодки позднего боя, которые директор открывает по минутам захода ([Директор](director.md), [Q130](../questions/combat.md#q130)).\n- Охотник дерётся до конца: ни один не выходит из боя и не идёт чиниться.\n- Охотники различаются мастерством, от зелёных команд до асов: как быстро отвечают, как аккуратно стреляют, как медленно перезаряжаются.\n- Броненосец, босс, имеет собственный корпус, больше любого, который может построить игрок, и дерётся этапами по мере того, как его броня сбивается.\n- Каждой лодкой, кроме лодки игрока, управляет один ИИ, планировщик действий по целям (GOAP), так что торговцы и караваны с охраной смогут присоединиться позже.\n- Много лодок разом остаются дешёвыми: ни одна не читает море каждый кадр.\n- Охотник стреляет, когда его выстрел попадёт, любым видом пусковой установки, который попал бы. За миг до выстрела его стойка на этом борту светится красным, и короткий звук выдаёт выстрел.\n- Рои идут на катерках: малом корпусе на два попадания, открытой спортивной лодке в 4–5 м с большим подвесным мотором.\n\n## Как устроено\n- **Скорость роя** (решение без владельца, [Q142](../questions/combat.md#q142)): владелец сказал, что быстрые враги слишком быстры. Катерок роя идёт на подвесном моторе вместо водомёта, дымовой катер — на воздушном винте; числа в [Балансе лодок](../balance/boats.md).\nУ каждой лодки, кроме лодки игрока, есть `Captain`, планировщик действий по целям. Зачем GOAP: новый вид лодки приходит как данные, роль из целей и действий, без изменения планировщика.\n\n- **Факты** (`Facts.cs`): именованные булевы значения, упакованные в битовую маску. Факт с чувством читается на такте мысли; факт без него только порождается действиями и желается целями.\n- **Роли** (`Role.cs`): роль — это её цели и действия. Цель хочет фактов и говорит, насколько она важна сейчас. Действие стоит, требует фактов, приносит факты и, однажды начавшись, рулит лодкой каждый кадр и говорит, продолжается ли оно, закончено или провалено.\n- **Планировщик** (`Planner`): A* по фактам от того, что знает капитан, к тому, чего хочет его цель.\n- **Капитаны** (`Captain`): думает несколько раз в секунду, вразнобой между капитанами, преследует самую подходящую цель, для которой может составить план, и планирует заново, когда цель меняется, действие проваливается или потребности следующего действия перестают выполняться. Капитан стреляет установкой любого вида, ракетами первыми, когда его добыча лежит в её секторе, `Boat.Strikes` говорит, что попадёт, и ни одна лодка его стороны ближе добычи не лежит на линии (`Captain.Fouls`). Снаряды и так проходят сквозь свои лодки: это о том, как читается бой (решение без владельца, [Q139](../questions/combat.md#q139)). Выстрелу предшествует знак (`Captain.Fire`): `Boat.Telling` зажигает красным стойки того борта и вида (`Racks.Tell`, шар света `Glow.Halo`, как у мины) и играет короткий щелчок (`Cue.Tell`), и через мгновение капитан стреляет, если выстрел всё ещё попал бы. Хост шлёт знак в `Lie`, так что он виден на каждой машине. Знак дают только по лодке игроков: его читает игрок, а по чужой лодке капитан стреляет сразу (решение без владельца, [Q110](../questions/combat.md#q110)). Дроны стреляют без знака: они слишком быстры. Длина знака — решение без владельца, [Q110](../questions/combat.md#q110). Руль встречает размах носа.\n- **Команды** (`Crew`): зелёная, бывалая, ветеранская или ас ([Q29](../questions/combat.md#q29)). Более зелёная команда думает реже, стреляет по промахам и медленнее перезаряжается. Каждая миссия называет команду каждого охотника.\n- **Чувства** (`Senses`, `Lookout`, `Feelers`): наблюдатель — это то, что видит каждый капитан: лодки, грунт, дым, припасы на плаву, удары между корпусами и время боя (`World.Clock`). Добыча капитана — ближайшая лодка другой стороны на плаву, удерживаемая, пока другая не окажется намного ближе; он видит её через тепловизор или пока между ними нет дыма (`Lookout.Sees`) и помнит, где видел её в последний раз. Действия рулят и целятся только по увиденной добыче (`Captain.Quarry`), так что ослеплённый капитан держит огонь. Щупы прощупывают грунт по кругу, и руль берёт свободный курс, ближайший к желаемому. Новое чувство читается в `Senses` и показывается планам как факт.\n- **Рулёжка** (`Steering`): поведения, общие для действий: преследование с упреждением, укладка лодки на траверз на дистанции, прибытие в точку, бегство, обход по широкой дуге, следование по треку. Зачем трек: корпус скользит на повороте, так что рулёжка только по курсу идёт широко. Руль (`Captain.Steer`) отворачивает каждый курс от лодок близко впереди или на траверзе, но никогда от добычи, так что охотники держатся друг от друга подальше, а таранщик всё равно таранит.\n- **Стаи** (`Pack`): капитаны, делящие румбы вокруг лодки, расставленные равномерно.\n\nКапитан с радиусом тревоги (`Captain.Alarm`) берёт добычу только внутри него, пока не поднят, так что страж ходит вокруг своего поста. Роли охотников (`ai/roles/`) все хотят потопить свою добычу (`Hunting`), крейсируют, пока её нет, и ищут там, где видели её в последний раз, когда она скрыта:\n\n- **Broadsider**: кладёт добычу на траверз на дистанции, готовым бортом к ней, и стреляет, когда борт попал бы; минёр (`Designs.Minelayer`) — тяжёлый патрульный с минным жёлобом: кладёт мины за кормой, когда добыча идёт следом (`Captain.Reach`).\n- **Rammer**: гонщик с тараном; преследователь (`Designs.Chaser`) идёт этой ролью на двух подвесных и с носовой стойкой и тараном. Он заходит туда, где не достаёт ни одна установка его добычи, бросается на нитро по упреждению, а после удара или промаха расходится и заходит снова.\n- **Swarm**: катерки на подвесном моторе; бегуны с турелью (`Designs.TurretRunner`) идут ею парами на воздушном винте. Они занимают места, по которым стая расставляется вокруг добычи, бросаются на нитро, стреляют проходя по траверзу и разворачиваются перезаряжаться. Зачем броски: пересекая траверз так быстро, они трудны для бортового залпа. Дымовой рой ставит завесы, бросаясь в атаку (`Designs.SmokeBoat`; [Q38](../questions/combat.md#q38)).\n- **Trader** идёт по маршруту отметка за отметкой, замедляясь, пока отстаёт его эскорт; **Runner** бежит к цели полным газом.\n\nОхотник дерётся до конца: ни один не выходит из боя и не идёт чиниться, хотя берёт любой припас, на который наехал. Охотники жгут нитро ([Q9](../questions/boat.md#q9)); таранщики и рои идут за плавающим нитро, когда их собственное израсходовано (`Fetching`), замедляясь, чем дальше от их трека лежит припас. Зачем: скользящий корпус кружит около припаса рядом по траверзу, а не достаёт его. Цель, причина которой меняется по ходу плана, остаётся актуальной, пока её план не кончится (`Captain.Pursuing`).\n\nДроны, которыми командует `Wingman`, — в [Сборки и стили игры](builds.md).\n"}, {"id": "gameplay-missions", "path": "gameplay/missions.md", "title": "Арена", "section": "gameplay", "date": "2026-11-11", "md": "# Арена\n\nАрена — единственный уровень игры: одна большая карта и бесконечный заход, в котором директор усиливает набеги, а задания старых миссий случаются внутри. Здесь заход, задания, броненосец и то, как заход начинается и кончается.\n\n## Решения владельца\n- Открытый мир: игра по умолчанию сразу начинается в море на арене (запуск игры, новая игра и загрузка сохранения), со вступительного пролёта у борта уже идущей лодки.\n- Арена — одна большая карта и бесконечный заход: директор усиливает набеги, а события из каждого вида прежних миссий (конвой, курьер, маяки, груз, броненосец) случаются внутри.\n- База — это гавань (пирс) на острове посреди карты (`Home cay`), к которой нужно доплыть: остановившись у пирса вдали от охотников, игрок жмёт `Space` и швартуется. В гавани продаётся добыча на квитке, чинится корпус и броня, заправляется топливо, игра сохраняется, и открываются плитки базы и верфи. Выход из гавани выводит (возможно, пересобранную) лодку от пирса обратно в то же живое море.\n- Буёв выхода в море больше нет: единственное место сдачи добычи и посещения базы — гавань на острове.\n- Когда все лодки игроков потоплены, чёрные полосы закрываются с надписью «Погиб» (`Died`), и игра перезагружает последнее сохранение в открытый мир.\n- Вступительный пролёт быстрый, 2–3 секунды. Под названием стоит цель. Карточек врагов на нём нет (2026-11-10).\n- Старт — своё место в стороне от середины карты: лодка идёт вдоль берега, суша по левому борту. Охотники не видны, пока руль не стал игрока. Пролёт пропускают Space, Enter или Esc.\n\n## Как устроено\n- **Арена** (`progress/Missions.cs`, `maps/arena.json`, `Missions.Arena`): карта и её «миссия» в одном файле, `Play` равен `\"run\"`, `Setting.Base` равен `true` (так что `World` ставит `Dock` у острова `Home cay`). Заход начинается при старте игры (`Game._Ready`), новой игре или загрузке сохранения на достаточно глубокой воде у старта карты, полным ходом, с сушей по левому борту и на полном баке. Швартовка у пирса (`Game.Harbour`) и выход обратно (`Game.LeaveHarbour`) происходят в том же живом мире без перезагрузки сцены; смена сцены за шторкой загрузки (`Game.Sail`, `Game.TakeUp`) нужна при загрузке сохранения, гибели всех лодок игроков или переходе между разными локациями. Когда все лодки игроков ушли под воду (`Game.Returned`), `Hud.Died` закрывает полосы с надписью «Погиб», и через `Homeward` секунд загружается последнее сохранение (`_progress.LoadFrom(_progress.Slot); Sail(Missions.Arena);`). Карта описана в [Карта и редактор](../tools/map-editor.md).\n- **Заход** (`missions/Run.cs`, `Operation`): никогда не выигрывается и не проигрывается сам; идёт в открытом мире, пока игрок плавает и заходит в гавань. Лодки в море выводит `Sortie`. Его цели: «Продержались» со временем захода, отсчёт до броненосца, затем цели открытых заданий.\n- **События** (`Mission.Events`, `Event`): список в файле карты, у каждого `Play` и точки на карте (`Marks`): конвой — маршрут, курьер — откуда и куда, маяки — по порядку, груз — центры россыпей, броненосец — стоянка и точка, куда он смотрит. У каждого вида по две постановки на разных сторонах карты, кроме броненосца. Зачем точки в карте, а не в коде: карту делают и правят в редакторе, события едут с ней. Постановки видов:\n  - **Конвой** (`Escort`): судно снабжения идёт по маршруту и ждёт, пока отстаёт эскорт; задание проиграно, если оно тонет.\n  - **Маяки** (`Beacons`, `Beacon`): по очереди зажечь буи, проходя мимо охраны; ждут сколько угодно.\n  - **Курьер** (`Courier`): потопить безоружного курьера, уходящего в открытое море; проиграно, если он ушёл.\n  - **Груз** (`Cargo`): настоящие предметы на воде вокруг точек, груз потерянного судна снабжения (`Flotsam.Float`); кончается, когда на воде не осталось ничего, кто бы его ни взял.\n  - **Броненосец** (`Ironclad`): босс на собственном корпусе (`Parts.IroncladHull`); держит свой пост, пока в броне, ложится бортом, а когда броня сбита, идёт на таран.\n- **Предложения** (`Run.Judge`): первое задание через 90 с, дальше примерно раз в 100 с, чуть вразброс. Виды берутся из мешка по разу за круг, не больше одного задания вида разом, курьера нет, пока на море броненосец (на HUD одна отмеченная цель). Постановка — ближайшая к игроку, но не ближе 250 м к любому игроку и не ближе 400 м к точкам открытого задания. Предложение — строка цели, объявление и маркер; взять задание значит дойти. Маркер гаснет, когда лодка подошла на 150 м. Зачем так: игрок сам идёт на задание, как в рейсах Sea of Thieves, а не ждёт, пока оно придёт. Такт и награды — решение без владельца ([Q129](../questions/missions.md#q129)).\n- **Итоги задания**: выигранное объявляется («Готово: …»), платит и убирается со списка вместе с маркерами; проигранное объявляет свою причину. Конвой, курьер и маяки платят добычей на воде у лодок и припасами у каждого игрока; цифры в [Балансе экономики](../balance/economy.md).\n- **Броненосец**: за минуту до срока HUD отсчитывает «Идёт броненосец», в срок он выходит на свою стоянку в бухте с объявлением «Броненосец здесь». Он ждёт в бухте; идти к нему — выбор игрока. Потопленный, он платит припасами, выход у бухты открывается (`Run.Opens`, объявление «Выход в бухте открыт»). Не тронутый, он остаётся, и бухта остаётся опасной ([Q131](../questions/missions.md#q131)).\n- **Квиток** (`ui/Report.cs`): под строками добычи с монетами стоит строка захода: время, мастерство охотников, задания, потопленные, потоплен ли броненосец (`Run.Summary`). Продажа идёт в `Game.Homecoming`.\n- **Вступительный пролёт** (`camera/Flyby.cs`, `ui/Titles.cs`): низкий проход у носа лодки, затем подъём к виду боя; чёрные полосы называют арену и её первую цель, а клавиши пропуска тихо стоят внизу. Охотники ждут, а руль заблокирован, пока пролёт не кончится.\n- **Круги арены и вставки** (`areas/Arenas.cs`, `camera/ShotCamera.cs`, `Game.Stage`, `Game.Cut`): карта может отметить круг, и вид игрока стоит над ним, пока лодка внутри; вставка, названная кругом, играется при первом входе ([Камера и картинка](camera.md)). Имя «арена» здесь занято дважды: уровень и вид зоны ([Q127](../questions/missions.md#q127)).\n\nЧто решает, кто и когда нападает: [Директор](director.md), [Охотники и ИИ](hunters.md). Выходы и трюм: [Добыча](haul.md).\n"}, {"id": "gameplay-pickups", "path": "gameplay/pickups.md", "title": "Припасы", "section": "gameplay", "date": "2026-11-10", "md": "# Припасы\n\nПрипасы — нитро, ремонт, броня и топливо, которые время от времени всплывают в море.\n\n## Решения владельца\n- Припасы нитро, ремонта и брони появляются в море случайно, как аркадные припасы: наезд на один пополняет нитро, чинит корпус или прибавляет брони. Припасы брони синие. Любая лодка, и охотник тоже, берёт каждый, на который наехала, нужен он ей или нет.\n- Ремонт чинит треть того, что выдерживает корпус; броня пополняет запас попаданий брони, которые принимаются раньше попаданий корпуса, до трети того, что выдерживает корпус. Встречается и топливо: оно пополняет бак.\n\n- 2026-11-10: нужно больше припасов, например ремонт, спускающийся с неба на парашютах.\n\n## Как устроено\nВремя от времени припас поднимается из моря вокруг лодки игрока (`Strewing`): нитро, ремонт, броня или топливо с равными шансами, в кадре или рядом, в воде, до которой лодка может добраться, несколько на плаву сразу. Любая лодка, и охотник тоже, берёт каждый, на который наехала (`Pickups`): нитро пополняет шкалу (`Nitro.Fill`), ремонт чинит попадания (`Boat.Mend`), броня пополняет запас попаданий брони, принимаемых раньше плит и корпуса (`Boat.Reinforce`), топливо доливает половину бака (`Fuel.Add`, `Pickups.Refuelling`; охотник, который топлива не жжёт, берёт его так же, без толку). Половина бака — число без владельца ([Q112](../questions/boat.md#q112)). Нитро ещё и восстанавливается со временем (см. [Лодка](boat.md)).\n\n- **Вид** (`PickupModel`, `Glow.Halo`): эмблема, лежащая плашмя в своём цвете, так что читается с высоты: двойной шеврон для нитро, гаечный ключ для ремонта (никогда не красный крест, защищённая эмблема), светло-голубой щит в белом ободе для брони, поскольку тёмно-синий теряется на синем море, фиолетовая капля для топлива: цвет, которого нет ни у нитро, ремонта и брони, ни у HUD (оранжевый игрок, красные охотники, золотые цели, аква союзники, синяя броня). Взятое топливо звучит как нитро: своего звука у него нет. Когда припас взят, `Effects` бросает искры, а HUD пишет, что он дал.\n- **Сброс с неба** (`Pickups.Airdrop`, `PickupModel.CrateOf/CanopyOf/RingOf`): ящик под круглым куполом из ярких долей цвета припаса и белых медленно спускается, качаясь, над кольцом на воде, которое сужается к месту посадки. Пока он в воздухе (`Pickups.Descending`), взять его нельзя, и охотники его не видят. На воде он плюхает всплеском (`World`, `Pickups.Landed`), купол складывается и тает, а ящик становится обычным припасом. Припас может сойти и без парашюта (всплытие из моря), как прежде. Зачем: аркадные сбросы читаются издали и дают игроку цель. Гостям хост сообщает каждый припас и кто его взял (`Pickups.Supplied`, `Say.Supplied`, `Say.Took`); гость сам припасов не берёт (`Pickups.Told`).\n- **Ритм сбросов** (`Strewing`, `Director.Resupply`): раз в 20–25 секунд (пока на воде и в воздухе меньше шести) с неба падает припас в 40–80 м от случайной лодки игрока, в воде, куда она доберётся. Вид выбирается по нужде лодки (`Pickups.Lacking`): ремонт, если корпус меньше двух третей, иначе топливо, нитро или броня, тем вероятнее, чем меньше их осталось. Припасы привала директора (ремонт или броня, нитро) тоже спускаются на парашютах. Ритм и подбор — решение без владельца ([Q144](../questions/boat.md#q144)).\n- **Езда** (`waters/Riding.cs`): небольшой поплавок (припас, предмет на плаву) читает высоту и уклон моря в трёх точках раз в такт и сглаживает между чтениями. Зачем: поплавки остаются дешёвыми.\n"}, {"id": "gameplay-progression", "path": "gameplay/progression.md", "title": "Прогресс и сохранения", "section": "gameplay", "date": "2026-11-10", "md": "# Прогресс и сохранения\n\nЧто игра помнит между миссиями: монеты и купленные детали, и как она сохраняется.\n\n## Решения владельца\n- Кампании и уровней нет: в игре одна арена, на неё выводит кнопка «На арену» на базе.\n- Игрок строит лодку из деталей, покупаемых за деньги в верфи. Монеты остаются: на них покупают детали в верфи.\n- Игра сохраняется сама по ходу: при выходе на арену, при возвращении домой и при выходе из верфи.\n- Добыча превращается в монеты сразу, на квитке по возвращении домой; торговой точки нет.\n- Сохранение хранит прогресс (монеты, детали, лодку), а не бой как он стоит.\n- Новая игра начинается с 10 000 монет.\n- Крафта нет: каждая деталь только покупается за монеты, как сейчас.\n\n## Как устроено\n`Progress` хранит монеты, купленные детали, проект, с которым выходили в последний раз, и факты сюжета. Каждая деталь продаётся, стартовая принадлежит с самого начала ([Q56](../questions/missions.md#q56)). Он сохраняется сам в слот, который в игре, на каждом шаге (выход в море, возвращение домой, выход из верфи, загрузка или начало игры); новая игра занимает первый пустой слот, а когда заняты все, сохраняется только вручную ([Q50](../questions/interface.md#q50)). Сохранение пишется рядом со слотом и переименовывается поверх него, так что неудачная запись оставляет слот как был; слот, который не читается, ничего не загружает.\n\nВерфь, где покупаются детали, описана в [Верфь](../base/boatyard.md).\n"}, {"id": "gameplay-sites", "path": "gameplay/sites.md", "title": "Места промысла", "section": "gameplay", "date": "2026-11-09", "md": "# Места промысла\n\nМеста в море, где работают внутри миссии: косяки, где ловят рыбу, и обломки, которые поднимают. Каждое открывает вид сбоку.\n\n## Решения владельца\n- Места в море для работы внутри миссий: косяки для рыбалки и обломки для подъёма. Каждое открывает вид сбоку, трёхмерный разрез через воду с лодкой игрока над ним, в собственном свете игры. Рыбалка идёт в нём; подъём — это захват на тросе с лодки, как автомат-кран в аркаде. Рыба считается добычей.\n- В виде сбоку натяжение лески видно на самой леске и на глянцевом циферблате у удилища, а пойманная рыба или поднятая вещь показывается крупно на карточке: её название, длина, вес и добыча.\n- То, что поднято на борт видом сбоку, идёт в трюм, как добыча, а не продаётся сразу; бой тем временем идёт дальше.\n\n## Как устроено\nКаждая миссия разбрасывает косяк и обломок (`Site.Strew`) в своей локации, в воде, достаточно глубокой, чтобы работать, и достаточно мелкой, чтобы видеть дно ([Q31](../questions/haul.md#q31)). Когда лодка медленно лежит в досягаемости места, и охотников рядом нет, Space открывает вид сбоку. Бой идёт дальше за ним: лодка лежит без хода, как держала бы её команда с убранным газом, а охотник, подошедший ближе, закрывает вид и предупреждает «Охотники близко» (решение без владельца, [Q115](../questions/haul.md#q115)). Вид только у местного игрока.\n\n- **Косяк** (`Shoal`, `Gull`): всплески вскипают воду под кружащими чайками ([Q34](../questions/haul.md#q34)). Его стая (`Catch`) держится всю миссию.\n- **Обломок** (`Wreck`): корпус охотника на дне, у него буй, поднимаются пузыри. Его вещи (`Salvage`) держатся всю миссию. Охотник, затонувший там, где дно в досягаемости захвата (`Site.Reached`, глубина от 4,5 до 12 м), становится таким обломком на месте: его корпус — тот самый, что лежит на дне, а вещи — из того, что несёт его проект (`Wreck.Of`, `Game`). Затонувшие вне досягаемости высыпают добычу на воду. Пока места промысла не онлайн, обломок из затонувшего охотника рождается только в игре без связи ([Q117](../questions/haul.md#q117)).\n- **Вид сбоку** (`SideView`, `waters/Section.cs`): вертикальная плоскость срезает море и грунт (`section.gdshaderinc`), а грань вдоль плоскости рисует воду сбоку и дно в разрезе (`section.gdshader`, `sediment.gdshaderinc`), читая те же следы, что и море. Вид ныряет сверху лодки и уходит, поднимаясь. Зачем разрез в мире: вид сбоку показывает воду под лодкой в собственных море, грунте и свете игры. Его заметка, значки клавиш и новости используют детали HUD (`Gloss.Note`, `Gloss.Hints`, `Toasts`).\n- **Карточка добычи** (`HaulCard`, `Specimen`): то, что подняли на борт, всплывает на белой карточке, как энциклопедии той эпохи показывали образец: его собственная модель, один раз нарисованная в маленьком `SubViewport`, с названием, длиной, весом и добычей. Поднятое не продаётся: оно ложится в трюм местного игрока (`SideView.Landed`, `Hold.Take`), если там есть место, а без места рыба отпускается, вещь падает обратно на обломок, и заметка об этом говорит ([Q31](../questions/haul.md#q31)).\n- **Рыбалка** (`Fishing`, `Swimmer`, `FishModel`, `FishForm`): леска вытравливается и сматывается до глубины рыбы; рыба у крючка клюёт, затем борется рывками, и сматывание во время рывка напрягает леску ([Q32](../questions/haul.md#q32)). Когда рыба на крючке, заметка говорит, рвётся ли она (перестать сматывать) или отдыхает (сматывать), а циферблат мигает красной лампой весь рывок ([Q65](../questions/interface.md#q65)). У каждого вида своя форма (`FishForm`). У рыбы своя длина в пределах диапазона её вида (`Catch`), а весит она как её длина в кубе ([Q51](../questions/haul.md#q51)). В трюме рыба и вещь — предметы каталога (`Items`): у вида два размера, обычный и «большой» (`Catch.Sizes`, `Salvage.Light`/`Heavy`), потому что прогресс хранит предметы по названию ([Q116](../questions/haul.md#q116)); в клетках трюма вес размера, на карточке настоящий. Леска — полоса, рисуемая каждый кадр, которая краснеет по мере приближения натяжения к разрыву; циферблат у кончика удилища (`LineDial`) его показывает. Наживка большая и яркая, мягко светится (`Glow.Halo`), так что читается в мути.\n- **Подъём** (`Salvaging`): захват на тросе, маятник, который толкает ход лодки. Space его роняет; он смыкается на том, что лежит под ним, и поднимает, а вещь, схваченная не за середину, может соскользнуть обратно ([Q33](../questions/haul.md#q33)); сомкнувшийся на пустоте получает об этом сообщение. Каждая вещь весит своё в пределах диапазона её вида (`Salvage`).\n\nЧто делают с добытым, описано в [Добыча](haul.md).\n"}, {"id": "glossary", "path": "glossary.md", "title": "Глоссарий", "section": "", "date": "2026-11-10", "md": "# Глоссарий\n\nТермины игры по-английски (как в коде) и по-русски (как в игре и в вики). Слова интерфейса берутся из перевода игры, `game/locale/ru.po` ([Язык](interface/language.md)); новое слово сначала ищи там: `grep -A1 'msgid \"Term\"' game/locale/ru.po`.\n\n## Игра\n| English | Русский |\n| --- | --- |\n| mission, objective | миссия (задание), цель |\n| Mission complete / Sunk / Out of fuel | Задание выполнено / Потоплен / Кончилось топливо |\n| hunter, band | охотник, банда |\n| director, raid, lull, rest, threat | директор, набег, затишье, передышка, угроза |\n| haul, salvage, item, hold | добыча, добыча (её ценность), предмет, трюм |\n| extraction point, way home, toll | точка выхода, путь домой, пошлина |\n| site, shoal, wreck, side view, claw | место промысла, косяк, обломки, вид сбоку, захват |\n| pickup, repair, fuel, tank, nitro, smoke | припас, ремонт, топливо, бак, нитро, дым |\n| strike, lock, target, roulette | попадание, захват цели, цель, рулетка |\n| setting, landform, area, hazard | локация, форма рельефа, зона, опасность |\n| opening shot, curtain, toast | вступительный пролёт, шторка загрузки, уведомление |\n| arena, cut scene, shot | арена, вставка, кадр |\n| host, guest | хост, гость |\n\n## База и лодка\n| English | Русский |\n| --- | --- |\n| base, pier, boatyard, testing ground | база, пирс, Верфь, Полигон |\n| logbook | Судовой журнал |\n| keeper, shipwright, tollkeeper | хозяин (капитан игрока), корабел, мытарь |\n| coins, ticket | монеты, квиток |\n| dummy | мишень-макет |\n| part, station, gear, hull, engine | деталь, станция, снаряжение, корпус, мотор |\n| skiff, punt, racer, patrol boat, gunboat, runabout, ironclad | Ялик, Плоскодонка, Гонщик, Патрульный катер, Канонерка, Катерок, Броненосец |\n| rack, chase rack, launcher, turret, drone | ракетная стойка, носовая стойка, пусковая установка, турель, дрон |\n| cradle, mine | люлька, мина |\n| armour belt, plate, ram, rammer | броневой пояс, плита, таран, таранщик |\n| thermal sight, fire control, bilge pump, carpenters, smoke generator | тепловизор, управление огнём, помпа, плотники, дымогенератор |\n\n## Сюжет и интерфейс\n| English | Русский |\n| --- | --- |\n| scene, passage, screenplay, trigger | сцена, отрывок, сценарий, триггер |\n| radio, portrait, balloon, pill | рация, портрет, выноска, глянцевая кнопка-пилюля |\n\n## Разработка\n| English | Русский |\n| --- | --- |\n| owner | владелец |\n| my call | решение без владельца |\n| demo, case, selector, check | демо, кейс, селектор, проверка |\n"}, {"id": "interface-controls", "path": "interface/controls.md", "title": "Управление", "section": "interface", "date": "2026-11-10", "md": "# Управление\n\nИгра идёт с клавиатуры, курсором и геймпадом. Геймпад работает везде, кроме редактора карт.\n\n## Решения владельца\n- Мышью в море не целятся (2026-11-10): ракеты и торпеды идут в захваченную цель. Стик геймпада целит как раньше.\n- Игра идёт и с геймпада, и с клавиш и курсора: в море, в меню, на базе, на верфи и в виде сбоку, везде, кроме редактора карт. Пока геймпад использовался последним, подсказки клавиш показывают кнопки геймпада.\n\n## Клавиши в море\nТолько те, что названы в этой документации.\n\n| Клавиша | Что делает |\n| --- | --- |\n| `W` `A` `S` `D` или стрелки | руль и газ |\n| `Shift` | нитро (рывок) |\n| `Q` / `E` | огонь левым / правым бортом |\n| Левая кнопка мыши | огонь бортом, который достаёт захваченную цель |\n| `F` | дым |\n| `I` | трюм |\n| `C` | следующее оружие |\n| `Space` | работа на месте промысла |\n| `M` | карта |\n| `Esc` | пауза |\n| `F3` | отладочная карточка |\n\n## Как устроено\n- **Клавиши экранов** (`Keys`): W A S D двигают фокус в экранах, как стрелки, — так же, как правят лодкой.\n- **Геймпад** (`Pad`, `Buttons`): один узел превращает кнопки геймпада в события клавиш, которые экраны и лодка уже принимают, так что каждый обработчик клавиш и зажатая клавиша работают как раньше. Два слоя, у каждого своя таблица: морской, пока лодка местного игрока принимает команды, и экранный в остальных случаях (`Game.Helming`); то, что зажато при смене слоя, ничего не делает в новом, пока не отпущено. Стик тоже рулит в море (`Pad.Helm`, читается `Controls`): его x — руль, курки (RT вперёд, LT назад) или его y — газ. В экранах движение стика или D-pad повторяется, как зажатая стрелка в меню. Трюм и карта остаются на морском слое; Start отступает на один уровень в обоих. Вещи, рассчитанные только на курсор (раскладка трюма, мини-игры верстака), остаются для курсора. Последнее использованное устройство (событие геймпада или клавиша) заставляет `Gloss.Key` рисовать кнопку, которая посылает клавишу (`Buttons`), так что каждый ряд подсказок, пилюля и выноска следуют за ним.\n  - **Море**: стик — руль; RT/LT — газ; A — нитро (`Shift`); LB/RB — огонь левым/правым бортом (`Q`/`E`); B — дым (`F`); Y — трюм (`I`); правый стик — наводка (`Pad.Aim`); D-pad вверх — следующее оружие (`C`), вниз — работа на месте промысла (`Space`); Start — `Esc`; Back — карта (`M`).\n  - **Экраны**: D-pad или стик — стрелки; A — `Enter`; B и Start — `Esc`; Back — `Tab`; X — `Space`; Y — `T` («Испытать» на верфи); LB/RB — `Q`/`E`; LT/RT — `F`/`R` (поворот и приближение на верфи) ([Q67](../questions/interface.md#q67)).\n"}, {"id": "interface-hud", "path": "interface/hud.md", "title": "HUD", "section": "interface", "date": "2026-11-11", "md": "# HUD\n\nHUD — то, что видно на экране в море: цели миссии, кольца на воде, приборы лодки и уведомления.\n\n## Решения владельца\n- HUD показывает только то, на чём держится игра: ни часов боя, ни радара, ни значка лодки, ни счёта добычи, ни показаний стоек, скорости или повреждений, кроме попаданий в корпус. Стрелки указывают на охотников за пределами экрана. Клавиши перечислены на отладочной карточке, а не на HUD; она закрыта, пока её не откроют F3 (2026-11-10). Нет красной вспышки, когда лодку бьют, и нет предупреждения о ракетах, выпущенных по игроку.\n- Линия огня каждой заряженной стойки ложится на воду только при управлении огнём на борту: это снаряжение, которое игрок получает для лодки на верфи.\n- В море охотник отмечен кольцом на воде вокруг него, его попадания остаются дугой кольца: у малой лодки дуга на каждое попадание, у большого корпуса одна дуга, которая пустеет с каждым попаданием и размечена через каждые пять. Названа только цель, на глянцевой табличке. Новости приходят глянцевыми уведомлениями, выезжающими сверху; цели миссии написаны на записке, приклеенной в углу.\n- В море приборы лодки собраны в кластер в углу экрана, в глянцевом аквамариновом ретро-футуризме 2000-х: найденные и починенные устройства старого мира.\n- HUD в море появляется по частям, когда сходят полосы вступительного пролёта. Решённая миссия снова закрывает полосы на вердикте, пока набранная добыча считается вверх, и они открываются снова, пока лодка на плаву, чтобы она шла к точке выхода. Цвета держат по одному смыслу: оранжевый — игрок и захват, красный — охотники, золотой — цель миссии и места для работы, аква — союзники.\n- HUD не указывает ни на какие предметы на плаву, ящики тоже.\n- У каждого врага случайное лицо (11-10).\n\n## Как устроено\n- **Лицо врага** (`Markers.Face`): рядом с табличкой цели портрет, один из восьми (`assets/portraits/foe-*`), выбранный по лодке; сердит сразу после попадания по ней, удивлён на последнем ударе. Решение без владельца: [Q147](../questions/interface.md#q147).\n- **HUD** (`Hud`, `Objectives`, `Dash`, `Roulette`, `Markers`, `Toasts`, `Verdict`, `Motion`): только то, на чём держится игра, появляется, когда сходят полосы вступительного пролёта. Цвета держат один смысл: оранжевый для игрока и захвата, красный для охотников, золотой для цели миссии и мест, которые нужно сделать, аква для союзников и приборов, синий для брони.\n  - `Objectives`: цели миссии на приклеенной записке, отмечаются по мере выполнения; условие, по которому миссия проигрывается (удержать на плаву), пишется без галочки, так как оно никогда не выполнено.\n  - `Markers`: кольца на воде вокруг лодок, которые видит игрок, дуга на каждое попадание, которое корпус выдерживает, или, после нескольких, одна пустеющая дуга с отметкой через каждые пять ([Q63](../questions/interface.md#q63)), синие для брони, аква для союзников, золотые для целей; поворачивающиеся дуги захвата; клавиша стороны, которая попала бы в цель захвата (`Player.Target`, `Boat.Strikes`): яркая, пока борт заряжен, и тусклая под вуалью, пока он перезаряжается; места промысла и места, которые нужно сделать; шевроны вокруг лодки игрока для тех, кто за экраном или под приборами или запиской. Когда миссия решена или бак на исходе, точки выхода, открытые лодке, обводятся золотом и подписываются ([Q63](../questions/interface.md#q63)). У лодки игрока на воде лежат веера выбранного оружия, тот, что держит наводку, ярче, а в точке наводки кольцо (`Markers.Fans`, [Бой](../gameplay/combat.md)). Управление огнём рисует ещё и линии огня выбранного оружия. Пока трюм открыт, ни веера, ни линии, ни клавиши не показываются. Метки охотника, скрытого дымом, исчезают и возвращаются; кольца захвата сходятся один раз, когда он впервые виден.\n  - Под лодкой: вход в гавань у пирса или работа на месте промысла, и предупреждение, что рядом охотники.\n  - `Toasts`: новости на глянцевых табличках сверху, не больше нескольких, среди них бак на исходе («Идите в гавань»); потопленный охотник на оранжевом значке игрока, красный оставлен для предупреждений ([Q65](../questions/interface.md#q65)).\n  - `Verdict`: закрывает полосы на решённой миссии (с тем, почему она проиграна, или с подсчёто
