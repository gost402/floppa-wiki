дания.\n- **Задания**: буи дающих — хоста; он раз в секунду говорит гостям, у каких буёв есть задание, а гость берёт его словом хосту (`Order.Work`). Реплику дающего по рации слышит только хост.\n- **Пока не онлайн**: добыча на воде (и ящики наград за буйства и посылки: их видит и берёт только сам игрок, на своём море), места промысла и обломки затонувших охотников (онлайн их не разбрасывают и не создают), тайники и точки припасов зон, прогресс и сохранения (у каждого игрока свои).\n- **Не сделано вовсе**: возвращение затонувшей лодки припасами после окна.\n"}, {"id": "questions-README", "path": "questions/README.md", "title": "Открытые вопросы", "section": "questions", "date": "2026-11-15", "md": "# Открытые вопросы\n\nВсё, что ждёт ответа владельца. Вопрос живёт под заголовком своего номера (`### Q17`), так что ссылка `missions.md#q17` ведёт прямо к нему; номера не переиспользуются. Под каждым вопросом — ссылка на страницу его темы.\n\nКогда владелец отвечает: решение пишется в «Решения владельца» на странице темы, вопрос удаляется, а крупное решение получает строку в [Журнале решений](../decisions.md). Новый вопрос получает следующий свободный номер и встаёт на страницу своей области.\n\n## По областям\n- [Открытый мир](missions.md): мир и его события, прогресс, зоны.\n- [Лодка](boat.md): управление, вес, топливо, броня, припасы.\n- [Бой](combat.md): оружие, охотники, сборки.\n- [Добыча](haul.md): места промысла, добыча.\n- [Мир и облик](world.md): облик, люди, рельеф, свет, станция и выбор облика со стендов.\n- [Интерфейс](interface.md): HUD, экраны, верфь, управление, язык, компоненты и палитра.\n- [Сюжет](story.md): сеттинг, сцены.\n- [Звук](audio.md): звук и музыка.\n- [Онлайн](online.md): кооператив.\n- [Инструменты](tools.md): редактор карт и демо.\n- [Чего нам не хватает](gaps.md): то, что выпущенные игры обычно решают, а у нас пока не решено.\n"}, {"id": "questions-audio", "path": "questions/audio.md", "title": "Вопросы: звук", "section": "questions", "date": "2026-11-16", "md": "# Вопросы: звук\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q23\nЗвуки, выбранные для взятия припаса, постановки дыма, добычи, пойманной рыбы и лебёдки захвата: верно?\n\nТема: [Звук](../audio/sound.md)\n\n### Q225\nБаланс звука выставлен по приборам, без прослушивания: верен ли он на слух? Раньше бой упирался в ограничитель (залп ракет мерился в −8 LUFS, пики срезались примерно на 10 дБ). Теперь тот же залп звучит около −13 LUFS и срезается не больше чем на децибел, тихое море с мотором на холостом ходу осталось около −28 LUFS. Разрывы стали тише относительно остального на 7 дБ, пуски на 2 дБ, но их больше не сплющивает. Шум воды у борта на ходу поднят: он играл на 10 дБ тише, чем значилось в таблице.\n\nТема: [Звук](../audio/sound.md)\n\n### Q226\nМузыка, море и моторы приседают под взрывами: музыка до 8 дБ, море до 6, лодки до 4. Мина на дальности боя приседает музыку примерно на 4 дБ, море на 5, моторы на 4 и держит их так, пока звучит сама, три-четыре секунды. У взрывов короткий тихий хвост, как эхо над открытой водой. Глубже, мельче, без хвоста?\n\nТема: [Звук](../audio/sound.md)\n\n### Q227\nМир звучит приглушённо под меню, у торговца и на верфи и ещё глуше, пока лодка игрока потоплена; интерфейс и голоса остаются чистыми. В одиночной игре под меню бой стоит и слышно только море; онлайн бой идёт и звучит приглушённо. Так?\n\nТема: [Звук](../audio/sound.md)\n\n### Q228\nЗалп: та же реплика, пришедшая в пределах 0,07 с и 15 м, вливается в уже звучащую и делает её тяжелее; звук, начатый в толпе, играет на 2 дБ тише за каждый соседний, до 12 дБ; тяжёлый взрыв (торпеда, мина) звучит ниже и не больше чем на 6 дБ громче ракеты. Числа подобраны по замерам.\n\nТема: [Звук](../audio/sound.md)\n\n### Q229\nМотор лодки, идущей мимо, слышен выше при сближении и ниже при расхождении, до 30 %. Оставить, и хватает ли?\n\nТема: [Звук](../audio/sound.md)\n\n### Q230\nВзрывы звучат по весу, как их показывают: снаряд турели — треск и щепки, не приседающие музыку; ракета — разрыв; заряд — разрыв ниже и тяжелее с глухим ударом и столбом воды; гибель лодки — треск, удар и падающая вода. Каждый слой слышен на своё расстояние: треск и щепки до нескольких десятков метров, тело разрыва — на дальности боя, раскат одинаково громок до 600 м и тише дальше, так что бой за краем вида слышен глухим раскатом на 5–7 дБ над шумом моря. Так ли звучат вес и даль? Удар под зарядом и хвост раската синтезированы как подложка под записи.\n\nТема: [Звук](../audio/sound.md)\n\n### Q231\nВзрыв за краем вида слышен с опозданием по расстоянию, но не позже чем через 0,45 с; в кадре звук всегда вместе с картинкой. Читается ли это как даль, а не как задержка?\n\nТема: [Звук](../audio/sound.md)\n\n### Q232\nУ мотора есть звук без газа: это те же записи мотора без верхов и с колыханием, а не отдельная запись. Газ, сброшенный на ходу, даёт пару бульков; в прыжке обороты взлетают, на посадке мотор проседает. Хватает ли этого, или нужна настоящая запись мотора на сбросе газа?\n\nТема: [Звук](../audio/sound.md)\n\n### Q233\nРывок нитро звучит свистом воздуха (запись фейерверка ниже тоном), восходящим шумом и воем турбины, который растёт полсекунды рывка и гаснет за 0,6 с. Вой — запись запуска реактивного двигателя. Это то, что нужно нитро?\n\nТема: [Звук](../audio/sound.md)\n\n### Q234\nПосадка с прыжка шлёпает корпусом по воде, если лодка пробыла в воздухе не меньше 0,3 с и падала быстрее 2,5 м/с, а с 6,6 м/с — ещё и с глухим ударом. На полном ходу гонщик на волнах открытого мира так приземляется раз в несколько секунд. Корпус на мели скребёт доской по дереву и гравием по глубине и скорости. Верно ли выбраны пороги и звуки?\n\nТема: [Звук](../audio/sound.md)\n\n### Q235\nМоменты, у которых не было звука, звучат так: парирование — звон металла и сухой треск; сбитая бронеплита — низкий звон и всплеск; починка — три удара молотка, а помпа стучит раз за каждое откачанное попадание; дрон — лязг люльки и всплеск; прожектор, поймавший лодку, — лязг шторки и гул дуги; горящее пятно — вспышка и гул пламени, пока горит; башня — нарастающий гул катушки Теслы и треск импульса. Записи — металлические удары, молоток, огонь и катушка Теслы (CC0). Так?\n\nТема: [Звук](../audio/sound.md)\n\n### Q236\nТик попадания поднимается на полтона с каждым попаданием серии, до квинты, и сбрасывается после полутора секунд. Охотник, по которому игрок попал в последние три секунды и который затонул, отмечен звоном стекла. Знак залпа охотника — щелчок стоек и втянутый воздух за 0,35 с до пуска, вместо прежнего храповика. Читаются ли серия, победа и знак?\n\nТема: [Звук](../audio/sound.md)\n\n### Q237\nГеймпад вибрирует от удара по своему корпусу, гибели своей лодки, жёсткой посадки и тяжёлого взрыва ближе 40 м; шкала «Вибрация геймпада» в четыре деления рядом с тряской экрана, по умолчанию полная. Что ещё должно вибрировать (свой залп, нитро), а что нет?\n\nТема: [Звук](../audio/sound.md)\n\n### Q238\nОстров звучит: прибой вдоль берега, чайки над ближним пляжем, пальмы по силе ветра, у пирса молоток и пила мастерской; ветер в ушах растёт со скоростью лодки. Громкость и плотность — по приборам. Так ли должен звучать берег, и нужна ли мастерская, пока рядом бой?\n\nТема: [Звук](../audio/sound.md)\n\n### Q239\nЗвуки интерфейса выверены по приборам против нового боя: тик попадания поднят на 6 дБ, треск удара по своему корпусу — на 5 дБ, новый звон победы громче всех; остальные звучат на 2–6 дБ над шумом моря и на 5–10 дБ тише попадания ракеты на дальности боя. Слышны ли они в бою и не громки ли вне его?\n\nТема: [Звук](../audio/sound.md)\n\n### Q204\nРадио лодки: пять станций и «выключено»; пятую, «Шанти», решил владелец. Верны ли число и четыре джазовые станции? Сейчас это «Маримба» (музыка локации как была, стоит по умолчанию), «Вибрафон» (медленная, мажор), «Труба» (быстрее, духовые) и «Гитара» (быстрая, минор, том-томы). Названия временные, по тому, что на станции слышно: нужны ли другие названия или номера на шкале? Станции собраны и выровнены по громкости без прослушивания, по числам; их стоит послушать в демо `Music`, кейс `Stations`.\n\nТема: [Музыка](../audio/music.md)\n\n### Q205\n«Выключено» глушит всю музыку: и мотивы на события боя, и фанфары с плачем; у событий остаются звуки интерфейса. Или мотивы и фанфары должны звучать и при выключенном радио? У пирса радио остаётся на выбранной станции и играет пьесу базы. Смена станции слышна как короткий шум эфира. Так?\n\nТема: [Музыка](../audio/music.md)\n\n### Q279\nЗвуки меню из уже взятых записей: открытие — шорох верфи ниже тоном и тихо, закрытие — ещё ниже и тише, смена страницы — шелест карточки, шаг шкалы — стеклянный тик, на октаву выше от пустой шкалы к полной, предупреждение — всплеск. Уровни выставлены по приборам: шорохи примерно на уровне шума моря. Не слишком ли тихо, громко или навязчиво? Подходит ли стеклянный тик к шкалам?\n\nТема: [Звук](../audio/sound.md), [Экраны и меню](../interface/screens.md)\n\n### Q292\nЖурнал стал стеклом, а звучал бумагой: книга при открытии, галочка карандашом при записи. Теперь он открывается шелестом карточки, как смена страницы меню, а запись — стеклянный звон захвата на терцию выше. Подходит ли звон к записи, или ей нужен свой звук?\n\nТема: [Звук](../audio/sound.md)\n\n### Q293\nСтанция «Шанти» поёт шесть старинных шанти по кругу: Drunken Sailor, Wellerman, Haul Away Joe, Santiana, South Australia, John Kanaka; по два-три куплета, около минуты каждая. Песни звучат в тональности локации, но в своём ладу и темпе. Ансамбль растёт с боем: спокойно — запевала и аккордеон; на ходу — туба, банджо, топот и хлопки; охотники близко — бубен, рамочный барабан и аккордеон по мелодии; в разгар — скрипка и вся команда. Станция стоит последней на шкале. Те ли песни, сколько их, и так ли растёт ансамбль? Громкость выставлена по приборам: в каждой фазе боя станция в пределах децибела от «Маримбы».\n\nТема: [Музыка](../audio/music.md)\n\n### Q294\nКоты поют зёрнами мяуканья из голоса диалогов: зерно по первой букве слога, на высоте ноты, середина тянется, пока длится нота, с вибрато. Запевала поёт на высоте мелодии, около ноты, на которой мяукает котёнок; команда — до пяти голосов, один на октаву ниже, один на октаву выше. Похоже ли на поющих котов, нужно ли пение ниже и басовитее, больше или меньше голосов?\n\nТема: [Музыка](../audio/music.md)\n"}, {"id": "questions-boat", "path": "questions/boat.md", "title": "Вопросы: лодка", "section": "questions", "date": "2026-11-12", "md": "# Вопросы: лодка\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q8\nКакие корпуса, моторы и палубные детали нужны и чем должна отличаться каждая? Сколько мест снаряжения у каждого корпуса, как далеко ведёт его бак, и как быстро жжёт каждый мотор?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q9\nВид нитро сейчас: во время рывка из-под транца бьёт петух из брызг от любого мотора, у воздушного винта тоже: оставить? Охотники дают рывок нитро, чтобы идти в таран, сближаться и подходить издали: этого достаточно?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q20\nСкорость сверху не ограничена: голый катерок на водомёте идёт 53 м/с (около 50 м/с со стойкой), а рывок нитро прибавляет 14 м/с и полсекунды даёт 2,5× мощности. Достаточно быстро, или самые дорогие моторы должны идти ещё быстрее?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q30\nБроневой пояс: лёгкий пояс добавляет треть попаданий корпуса, тяжёлый две трети, каждая плита получает равную долю; удар берёт ближайшую плиту своего борта, а упавшая плита облегчает лодку равномерно, а не на своём борту. Верно?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q112\nПрипас топлива доливает половину бака, выпадает тем вероятнее, чем меньше топлива в баке ([Q144](#q144)), а берётся со звуком нитро: этого достаточно, или он должен давать больше или меньше, выпадать реже и звучать по-своему? Цвет у него фиолетовый.\n\nТема: [Припасы](../gameplay/pickups.md)\n\n### Q137\nС пустым баком лодка игрока идёт на четверти газа, и нитро закрыто; топлива это не просит, сколько бы ни пришлось идти. Верна ли доля, и должен ли малый ход чего-то стоить (времени, добычи)?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q146\n_Частично: неуязвимость решена 11-12 (только игрокам), открыты сила, цена и время ([Журнал решений](../decisions.md))._ Нитро стало рывком: нажатие тратит половину шкалы, толкает лодку вперёд на 14 м/с и полсекунды тянет в 2,5 раза сильнее; в эти полсекунды ракеты и снаряды проходят сквозь лодку. Полная шкала — два рывка, она наполняется за 6 секунд. Рывок — одно нажатие: удержанная клавиша второй раз не рвёт. Охотники рвут так же и так же неуязвимы для ракет. Верны ли сила, цена и время неуязвимости, и нужна ли неуязвимость охотникам?\n\nТема: [Лодка](../gameplay/boat.md)\n"}, {"id": "questions-combat", "path": "questions/combat.md", "title": "Вопросы: бой", "section": "questions", "date": "2026-11-15", "md": "# Вопросы: бой\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q22\nДым скрывает лодки чужой стороны без тепловизора, а своих охотники видят сквозь дым, когда расходятся бортами и придерживают огонь ([Q139](#q139)). Должен ли дым слепить охотников и для своих лодок?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q29\nЭкипажи: охране постов выучку выбирают в редакторе карт (в мире новички, бывалые и один ветеран), охотникам заданий она задана в их коде (до ветеранов на канонерке и броненосце); асов не ставит никто. Насколько силён должен быть ас и где какой экипаж уместен?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q38\nРой дыма гонит ялики с воздушным винтом, ракетами, тепловизором и дымогенератором, ставящие дым на рывке вперёд: верно, или он должен гнать катерки, как обычный рой?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q82\nПреследователь: носовые стойки стоят у форштевня на носовой и передних станциях и бьют вперёд со схождением в 40 м; таранщики заходят преследователю на траверз или раковину, где носовые стойки не достают. В мире преследователь стоит на посту. Верно ли это и нужна ли ещё носовая торпедная труба?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q84\nДроны: морские дроны (70 м/с) быстрее любой лодки с верфи на обычном ходу, вблизи охраняют свой носитель, а посланные по цели ходят дугой по дальнюю от носителя сторону в пределах поводка в 60 м, стреляют бортом и возвращаются на борт. Охотники и батареи бьют ближайшего врага, часто дрона; дроны тонут вместе со своим носителем; у всех дронов игрока одна ливрея. Верно?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q85\n_Частично: цель турели решена 11-12 (захваченная), открыто поведение бегунов с турелью ([Журнал решений](../decisions.md))._ Турель: спаренная турель на вертлюге сама бьёт по ближайшему видимому врагу в радиусе 45 м, а не по захваченной цели. Бегуны с турелью стоят парой на посту карты и ходят роем: бросаются на нитро и бьют, проходя по траверзу. Должна ли турель игрока бить по захваченной цели вместо ближайшей, и верно ли ведут себя бегуны с турелью?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q86\nЛюлька: два дрона, по одному на борт; клавиша борта запускает его дрон или зовёт домой, потерянный восстанавливается бесплатно через какое-то время. Ей нужно место для обоих, так что её несут только патрульный катер и канонерка. Верно? Должна ли люлька на один дрон позволить нести дронов и меньшим корпусам?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q88\nМинный жёлоб: жёлоб на каждой кормовой четверти сбрасывает мину за корму (Q — левый, E — правый, до шести мин на воде от установки); она взводится через 1,2 с и взрывается от чужого корпуса, снаряда или соседнего взрыва, не трогая свою сторону и союзников в кооперативе. Охотник-минёр стоит на посту карты и ставит мины тоже. Верны ли устройство и числа (задержка, радиус, урон)?\n\nТема: [Бой](../gameplay/combat.md), [Сборки и стили игры](../gameplay/builds.md)\n\n### Q110\nЗнак охотника: за 0,35 с до залпа стойки охотника на этом борту светятся красным и щёлкают, и он стреляет, если выстрел всё ещё попал бы. Эти числа — заглушка. Верно ли, что хватает времени заметить знак с высоты боя и увернуться, а красный шар у стойки читается? Должны ли зелёные команды выдавать залп дольше асов? Знак дают только по лодке игроков, а в бою ИИ с ИИ стреляют сразу. Так ли?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q134\nВеера и захват цели: мышь не целится — захват сам берёт ближайшего видимого врага на любом расстоянии, а внутри веера шириной ±34° ракеты и торпеды берут упреждение по захваченной цели. Щелчок по воде стреляет теми установками, в чей веер попадает цель, а вне вееров — бортом со стороны цели; Q и E бьют левым и правым бортом. На геймпаде правый стик двигает прицел по воде для выбора цели и наводки внутри веера, а стреляют бамперы. Веера видны у любой лодки игрока, а управление огнём добавляет точные линии хода снарядов. Верно ли это, и не слишком ли широк или узок веер?\n\nТема: [Бой](../gameplay/combat.md), [Управление](../interface/controls.md)\n\n### Q136\nУдар носом в рывке нитро: лодка, бьющая носовой четвертью во время рывка нитро, получает половину урона от столкновения, а чужая — полтора. С носовым тараном её нос не страдает вовсе, как и без нитро. Верны ли числа, и должен ли таран добавлять ещё и к удару по чужой лодке?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q138\nПосланный дрон кружит по дальнюю от носителя сторону цели, качаясь по этой половине, так что носитель не стоит на линии его огня, и цель оказывается в клещах. Так ли, или дрону лучше кружить по всему кругу и просто ждать чистой линии?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q188\nЦель дальше досягаемости дрона (до 70 м от носителя): дрон выходит к краю своей досягаемости, идёт поперёк линии на цель и стреляет оттуда бортом, а со своего места стреляет, когда борт смотрит на цель. Раньше он бил только с прохода вплотную и такую цель то брал, то бросал. Дроны теперь попадают заметно чаще: пара топит патрульный катер секунд за восемь, если по ним не стреляют. Так, или дрон должен бить только с прохода вплотную?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q139\nВладелец решил, что дрон не стреляет через свой носитель. Так же держат огонь все капитаны ИИ: охотники и дроны не стреляют, пока лодка их стороны лежит на линии ближе добычи. Снаряды и так проходят сквозь свои лодки. Так ли, или стая должна стрелять сквозь своих?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q145\nРакеты двух сторон взрывают друг друга, сойдясь ближе 3 м. Снаряд турели считается наравне с ракетой, так что турель сама сбивает часть вражеских ракет, а вражеская турель — ракеты игрока. Оставить так, или парировать должны только ракеты? Достаточно ли 3 м, чтобы парировать получалось нарочно?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q148\nЗрение охотников: стража постов видит на 160 м (две дальности ракет), охрана конвоя на 200 м, груза на 140 м, броненосец на 220 м; суша и дым закрывают вид. Потеряв лодку из вида, охотник ищет её 8 с там, где видел в последний раз, затем забывает и возвращается к посту. Налёты заданий видят на любом расстоянии, их скрывают только суша и дым. Охотники в погоне жгут нитро, так что уйти можно только на быстрой лодке или своим рывком. Верны ли дальности и память, и нужно ли охотникам беречь нитро?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q157\nРакета, долетевшая до предела досягаемости, гаснет маленькой безвредной вспышкой. Так, или она должна рваться с уроном, или дальность должна быть другой?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q186\nЗастрявший охотник: капитан, который просит ход и три секунды не сдвигается с места (упёрся в скалу, в берег или в чужой корпус), три секунды отходит задним ходом и заходит снова. Так, или он должен выбираться иначе, раньше или позже?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q191\nЧисла розыска: четыре уровня; попадание по мирной лодке или патрулю даёт 0,1 уровня за удар, но не больше 0,75 за один раз; потопление даёт целый уровень; двадцать секунд вне вида патруля снимают один уровень; розыск меньше уровня забывается за полминуты. Правило добычи: мирная лодка, которую ударил игрок, двадцать секунд считается врагом для турелей и захвата всех игроков, иначе турель её не трогает. Верны ли числа и правило?\n\nТема: [Розыск и патруль](../gameplay/wanted.md)\n\n### Q192\nУдар корпусом и розыск: за жёсткий удар о мирную лодку отвечает игрок, кто бы в кого ни въехал; за удар о лодку патруля — только пока игрок не в розыске, потому что потом патруль таранит его сам. Нужно ли разбирать, кто в кого въехал?\n\nТема: [Розыск и патруль](../gameplay/wanted.md)\n\n### Q210\nРазмер и время взрывов. Огонь ракеты — шесть с половиной метров в поперечнике, половина двенадцатиметровой лодки; снаряда турели — около двух; торпеды — двенадцать; мины и другого заряда — полторы его досягаемости (у мины пятнадцать метров: огонь закрывает три четверти воды, которую бьёт взрыв); гибели лодки — чуть больше её длины, не меньше семи метров. Белое сердце держится десятую секунды, оранжевый шар от 0,2 до 0,6 с, потом он скатывается в тёмный дым. Раньше попадание ракеты было точкой с рубку лодки, а мина — мягким свечением без шара. Не слишком ли крупно, не закрывает ли огонь лодки в бою?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q211\nДым взрывов тёмный, огонь насыщенно-оранжевый: на синем море их видно, а белое остаётся брызгам и пене. Дым висит меньше секунды после снаряда турели, до двух секунд после ракеты, до трёх после заряда и гибели лодки. Так, или дым должен висеть дольше, быть светлее?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q213\nСвечение (bloom) остаётся выключенным: проба на кадрах дала почти ту же картинку, только сердца взрывов белее. Эффекты рисуются без текстур и флипбуков. Включить ли bloom и замерить его цену? Нужны ли текстуры (CC0: флипбуки Unity Labs, объёмы JangaFX, набор Kenney, RPicster)?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q214\nОтвет корпуса: в миг удара вся лодка вспыхивает белым примерно на десятую долю секунды, тем ярче, чем тяжелее удар; от снаряда турели тоже. Починка от половины удара и больше заливает лодку зелёным светом починки на треть секунды, а струйка помпы не светится. Своя лодка игрока вспыхивает так же, как чужая. Так? Нужна ли своей лодке вспышка, или хватит прибора корпуса на HUD?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q215\nТряска: снаряд турели вид больше не трясёт (его видно по вспышке корпуса), и близкий пролёт снаряда тоже. В настройках вместо выключателя — шкала силы тряски в четыре деления; по умолчанию полная, как была; тот, кто выключал тряску, получает ноль. Так?\n\nТема: [Бой](../gameplay/combat.md), [Экраны и меню](../interface/screens.md)\n\n### Q216\nСтадии повреждений: лодка, побитая на четверть, дымит светлым дымом, на половину — чёрным с искрами, на три четверти — горит; всё это из одного места на палубе, своего у каждой лодки, и уходит, когда лодку чинят. Верны ли пороги и вид? Видно ли с высоты боя, кто почти потоплен?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q217\nГибель лодки: после самого тяжёлого взрыва по корпусу идут ещё четыре взрыва поменьше за две секунды, огонь, пока часть над водой, потом пузыри; где лодка ушла под воду, вода кипит две с половиной секунды и расходится последнее кольцо пены. Своя лодка игрока — восемь взрывов за четыре с половиной секунды и кипение вдвое дольше. Девять секунд, за которые корпус уходит на дно, остались. Так, или своя гибель должна быть ещё заметнее?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q218\nРакеты в полёте: голова — яркий шар с тусклым ореолом цвета стороны, за ней лента длиной в четверть секунды полёта, а белый дым редкий, тонкий и держится меньше секунды (раньше — две секунды, полосой в ширину лодки). Так? Не слишком ли мало теперь дыма за залпом?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q219\nМалые моменты боя. Парирование — два кольца цвета обеих сторон и пламя ракет, вылетающее дальше искрами. Лодка в рывке светится цветом своей стороны, пульсируя, а ракета, прошедшая сквозь неё, вспыхивает на корпусе. Дрон, спущенный или поднятый, — всплеск и кольцо цвета своей стороны. Жёсткая посадка после прыжка — низкий веер брызг и немного пены, мягкая — ничего. Так? Не слишком ли ярко светится лодка в рывке?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q220\nДобыча летит на борт: ящик с воды, подойдя к лодке, перелетает дугой на палубу за треть секунды, кувыркаясь и уменьшаясь, и только тогда ложится в трюм; припас так же летит на палубу и вспыхивает там. Так?\n\nТема: [Бой](../gameplay/combat.md), [Добыча](../gameplay/haul.md), [Припасы](../gameplay/pickups.md)\n\n### Q221\nБюджет эффектов: живых полупрозрачных клубов (дым, брызги, дым ракет) не больше 900; с трети бюджета новые рождаются всё реже, щепки тоже. В самом тяжёлом залпе стенда это убрало около 2200 клубов дыма ракет, 1600 брызг и 460 щепок за десять секунд, а кадр видом почти не изменился. Сердце взрыва, огонь, искры, кольца и предупреждения не редеют. Вне кадра эффекты не рождаются. Так, или в больших боях дыма должно оставаться больше?\n\nТема: [Бой](../gameplay/combat.md)\n"}, {"id": "questions-gaps", "path": "questions/gaps.md", "title": "Чего нам не хватает", "section": "questions", "date": "2026-11-16", "md": "# Чего нам не хватает\n\nЧего пока нет ни в решениях, ни в вики, хотя у выпущенных игр это обычно решено. Каждый пункт — вопрос владельцу; здесь ничего не решено. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n## Видение\n\n### Q92\n_Частично: 2026-11-15 владелец назвал, о чём мечтает: весёлая игра, сильный сюжет, живой мир с экономикой, система заклятых врагов («nemesis»), улучшения, «классы» и кооп. Как это делают вышедшие игры: отчёт [Семь желаний](../reports/2026-11-15-dream-games.md). Открыто, какие из семи станут опорами._ Опоры игры: какие три-четыре вещи делают эту игру ею, чтобы по ним судить каждую новую функцию? Сейчас записаны «веселье важнее реализма» и ощущение моторной лодки; «прыгание по волнам» вычеркнуто как опора.\n\nТема: [Об игре](../vision.md)\n\n### Q93\nДля кого игра: какой игрок, какие жанры он любит, сколько длится одна сессия и один заход?\n\nТема: [Об игре](../vision.md), [Открытый мир](../gameplay/missions.md)\n\n### Q95\n_Частично: порядок этапов решён 11-13, альфа первым этапом — 11-16 ([Дорожная карта](../roadmap.md)); открыто, что внутри этапов, и их сроки._ Дорожная карта: верно ли то, что карта кладёт в каждый этап, и её грубые сроки? Альфа вобрала прежний первый этап «Что это за игра»; так ли? Карта выпускает альфу версией 0.1; сейчас версии 0.0.N выходят с постами.\n\nТема: [Дорожная карта](../roadmap.md), [Сборки и посты](../tools/release.md)\n\n### Q185\nИмя и кот: «Флоппа» — мем о настоящем каракале. Отчёт [Greenlight](../reports/2026-11-08-greenlight-review/index.html) нашёл, что его хозяева уже лицензируют его для игрушек, а портреты игры нарисованы по его фото ([Люди: флоппы](../art/people.md)); это быстрый поиск, а не проверка юриста. Просим у хозяев письменную лицензию или меняем имя и рисуем своих каракалов? Карта ставит ответ до страницы Steam (решение без владельца).\n\nТема: [Об игре](../vision.md), [Дорожная карта](../roadmap.md)\n\n### Q96\n_Частично: решено 11-13 — полный релиз в Steam, до него демо и ранний доступ ([Дорожная карта](../roadmap.md)); открыты цена и когда делать остальное в Steam._ Где выходит игра: Steam (страница, цена, ранний доступ) или ещё где-то? Решено только «PC» и лобби Steam или локальной сети; построены оба, Steam на тестовом App ID ([Q108](online.md#q108)). Когда делать остальное в Steam: облачные сохранения, достижения?\n\nТема: [Об игре](../vision.md), [Онлайн-кооп](../online.md)\n\n### Q97\nЖелезо: на каком самом слабом компьютере должна идти игра? Сборку для Windows ещё ни разу не запускали; кто проверит её на машине с Windows?\n\nТема: [Сборки и посты](../tools/release.md)\n\n## Игроку\n\n### Q100\nДоступность: нужен ли режим для дальтоников (свои и чужие ракеты различаются оранжевым и красным), крупный текст, подписи к звукам боя? Переназначение клавиш уже спрошено в [Q74](interface.md#q74).\n\nТема: [Экраны и меню](../interface/screens.md), [Бой](../gameplay/combat.md)\n\n### Q101\nЭкономика целиком: сколько заходов должна стоить деталь, на что ещё тратятся монеты, куда уходят лишние? Цены сейчас стартовые ([Q56](missions.md#q56)).\n\nТема: [Прогресс и сохранения](../gameplay/progression.md)\n\n## Облик и сюжет\n\n### Q102\nЛоготип, ключевой арт, титульный экран и обложка магазина: кто их сделает, раз картинки от ИИ запрещены? Сейчас у игры их нет.\n\nТема: [Арт-дирекшн](../art/README.md)\n\n### Q103\nПортреты к релизу: кто нарисует портреты говорящих и врагов — художник со стороны? До тех пор остаются нынешние заглушки, нарисованные моделью до запрета картинок от ИИ.\n\nТема: [Люди: флоппы](../art/people.md)\n\n### Q104\n_Частично: путь сюжета решён 11-12 (поручения флопп), открыто: кто капитан и зачем он в море ([Журнал решений](../decisions.md))._ Сюжет: есть ли у игры сквозная история, кто капитан игрока и зачем он выходит в море? Сейчас есть сеттинг, роли без имён и система сцен с одной сценой-заглушкой ([Q48](story.md#q48)).\n\nТема: [Сеттинг и лор](../story/setting.md), [Сцены сюжета](../story/scenes.md)\n\n## Работа\n\n### Q105\nИгроки со стороны: когда показывать игру людям кроме владельца, и как собирать их впечатления?\n\nТема: [Об игре](../vision.md)\n\n### Q106\nНазвание в коде: оставить Pirates в коде и репозитории или переименовать под Floppa Tropical Adventures?\n\nТема: [Код](../tools/code.md)\n\n### Q249\nКартинка по умолчанию: апскейлер MetalFX Temporal (на других системах FSR 2), а мир рисуется на две ступени ниже точек экрана (80 %, «Разрешение» 3 из 5). Замер 11-14 во весь экран: из апскейлеров Настроек Temporal даёт лучшую картинку за свою цену; Spatial и FSR 1 под TAA дешевле на 2 мс, но заметно мягче, FSR 2 стоит столько же, сколько Temporal. Две ступени ниже экономят около 2,8 мс; блики на воде чуть мягче, такелаж тот же. Так 90–100 к/с. Не слишком ли мягко? Если да, «Разрешение» 4 или 5 вернёт резкость ценой 1,2 или 2,8 мс.\n\nТема: [Камера и картинка](../gameplay/camera.md)\n"}, {"id": "questions-haul", "path": "questions/haul.md", "title": "Вопросы: добыча", "section": "questions", "date": "2026-11-15", "md": "# Вопросы: добыча\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q31\nМеста промысла: в мире четыре косяка и четыре обломка закреплены на карте, у обломков свои ящики; на карте без закреплённых мест косяк и обломок раскидываются случайно на глубине от 4,5 до 12 м. Места подписаны на HUD; вид сбоку не открывается, пока охотник ближе 160 м; пойманное ложится в трюм и продаётся, как ящики. Верно?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q32\nРыбалка: четыре вида (скумбрия, луциан, барракуда, групер) на своих глубинах, по восемь на косяк; рыба борется рывками, и подматывание во время рывка напрягает леску, пока она не порвётся. Оставить и должны ли удилище или наживка быть деталью с верфи?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q33\nДобыча с обломков: четыре сброса захвата на обломки, шесть предметов на их дне, и предмет, схваченный не за середину захвата, может соскользнуть обратно. Оставить?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q34\nВид мест промысла в море: чайки, кружащие над бурлением, нарисованы крупнее настоящих, чтобы читались с высоты боя; сине-жёлтый буй обломков над корпусом, лежащим на дне. Оставить?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q43\nВес добычи замедляет только разгон: полный трюм не отнимает полного хода (решение без владельца; владелец решил, что вес не наказывает за полный трюм). Так, или вес должен отнимать и немного хода?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q51\nВид сбоку: как он стоит на приклеенной записке, леска, отсчитываемая по циферблату удилища, у каждой рыбы своя длина в диапазоне её вида, а у поднятых вещей свой вес. Верно, и должна ли более крупная добыча давать больше добычи?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q115\nВид сбоку не мешает бою: охотник, подошедший ближе 160 м, закрывает его с предупреждением «Охотники близко», а пойманное уже лежит в трюме. Оставить, или дать время поднять снасть?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q116\nРыба и вещи с обломков в трюме: у вида два размера (обычный и «большой»), потому что прогресс хранит предметы по названию, а настоящие длина и вес видны лишь на карточке. Оставить, или хранить настоящий размер каждого предмета?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q117\nОхотник, затонувший там, где дно в досягаемости захвата, становится обломком на месте со своими предметами; онлайн таких обломков нет, как и мест промысла. Оставить, и когда делать места промысла общими для всех игроков?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q151\nРасходников четыре: ремкомплект (металл + ткань), бронеплита (металл + металл), баллон нитро (топливо + механизмы) и заряд (взрывчатка + электрика), заряд рвётся на 10 м вокруг лодки. Первые три действуют как одноимённые припасы, заряд — как большая мина. Каждый оплачивают двумя ящиками своих ресурсов. Те ли это виды и рецепты, и нужны ли другие (дымовая шашка, канистра топлива, приманка)?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q162\nЯщики: восемь видов, по одному на ресурс — металл (25 кг, 5), механизмы (25 кг, 9), электрика (12 кг, 8), топливо (бочка, 40 кг, 5), взрывчатка (15 кг, 10), ткань (тюк, 8 кг, 3), ценности (сундук, 15 кг, 20), провизия (15 кг, 4); в скобках вес и добыча, монет втрое больше. Мест в трюме: катерок и гонщик 4, ялик 5, плоскодонка 6, патрульный катер 7, канонерка 8. Те ли это виды, цены и места, или видов должно быть меньше (провизия и ценности не идут ни в один рецепт)?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q163\nРасходник не хранится в трюме: клавиша 1–4 сразу тратит два ящика рецепта, самые дешёвые каждого ресурса, и делает дело. Так, или собирать расходник заранее в своё место трюма?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q164\nПолный трюм сам берёт ящик дороже самого дешёвого на борту, а дешёвый падает за корму; ящик не дороже остаётся на плаву. Выбросить ящик руками нельзя, поэтому лодки больше не передают друг другу добычу. Так, или нужна клавиша «выбросить самый дешёвый» и передача товарищу?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q176\nЭкран торговца: у причала его открывает плитка «Торговец», и с пустым трюмом тоже (корабел говорит, что на борту ничего нет), а «Готово» возвращает к ленте; у «Марии» он открывается по `Space`, и с пустым трюмом, когда есть что купить. Клавиши: `W` `A` `S` `D` — по карточкам, `Enter` — продать или купить, `Space` — «Продать всё», `Esc` — «Готово». Корабел говорит тепло и коротко, мытарь — сухо. Так?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q177\n«Мария» платит за ящик 70 % цены гавани, целыми монетами, не меньше одной. Ремонт стоит 15 монет за удар, которого не хватает корпусу, топливо — 1 монету за литр, которого не хватает баку. Полный ремонт и полный бак ялика (4 удара, 30 л) стоят 90 монет — примерно столько «Мария» даёт за трюм ялика из пяти обычных ящиков. Те ли это числа?\n\nТема: [Станция](../world/outpost.md)\n\n### Q194\nПерекраска, которая снимает розыск, продаётся на экране корабела в гавани: 40 монет за уровень. До сих пор гавань ничего не продавала; карточка «Перекраска» видна всегда и блёкнет, пока розыска нет. Лодка получает следующую из шести окрасок по кругу (борт, полосы, акцент), выбрать её нельзя. Верны ли цвета, давать ли выбор, и там ли её продавать: на экране корабела или отдельной плиткой на ленте причала?\n\nТема: [Розыск и патруль](../gameplay/wanted.md), [Гавань](../base/pier.md)\n"}, {"id": "questions-interface", "path": "questions/interface.md", "title": "Вопросы: интерфейс", "section": "questions", "date": "2026-11-16", "md": "# Вопросы: интерфейс\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q50\nСудовой журнал: открывается пунктами «Сохранить» и «Загрузить» в меню `Esc`; лента на каждой записи сохраняет или загружает её, а New game лежит лентой на последней странице. Игра сама сохраняется в текущую запись (новая игра — в первую пустую, а когда все пять записей заняты — только вручную). Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q52\nВерфь: вдоль низа идёт лента мест лодки (корпус, мотор, станции палубы, снаряжение, броня), над ней — ряд карточек деталей для выбранного места, у некупленной цена, установленная светится оранжевым, а справа на аква-экране показаны характеристики лодки и сравнение с деталью под курсором. По самой лодке места больше не кликаются. Верно?\n\nТема: [Верфь](../base/boatyard.md)\n\n### Q55\nОтделка интерфейса: меню озаглавлены шрифтом EB Garamond, на верфи заголовок наклеен лентой вверху слева, пилюли и плитки отзываются при наведении и нажатии, цвета мест на верфи отделены от враждебного красного и оранжевого игрока (мотор бирюзовый, оружие розовое), а лента базы, верфь и меню управляются стрелками и Enter так же, как мышью. Верно?\n\nТема: [Стиль интерфейса](../art/interface.md)\n\n### Q58\nОкна инструментов (2026-11-13): то же матовое стекло, что у выносок, без глянцевой строки заголовка: заголовок — тёмные слова на стекле, закрыть — стеклянная бусина; кнопки — прозрачные стеклянные пилюли, под указателем наливаются светом лагуны, «Играть» оранжевая; поля, выборы и числа — вдавленное стекло; ползунок — стеклянная ручка; метки и таблички редактора карт — стекло HUD; команды редактора в окне вверху, его клавиши на колпачках в строке состояния; шторка — такое же окно на глубоком море. Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q62\nУход и возвращение домой: Esc закрывает открытый экран по шагам (в море — карту, затем открывает паузу); выбор, который теряет добычу в трюме или несохранённый прогресс (выход, загрузка, инструменты, уход в море хоста), сперва предупреждает. Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q63\nПодсказки HUD в море: когда в баке остаётся меньше пятой части топлива, лампа топлива мигает и приходит уведомление «Мало топлива» с «Идите в гавань»; кольцо вокруг лодки поделено на дуги по числу попаданий (до восьми), дальше одна пустеющая дуга с отметкой через каждые пять. Верно?\n\nТема: [HUD](../interface/hud.md)\n\n### Q64\nУ причала вверху справа висит кошелёк с монетами; судовой журнал выделяет активную запись и предупреждает при старте новой игры, если все записи заняты. Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q65\nПочинка HUD: метки охотника тают в дыму; красный значок уведомления оставлен для предупреждений; условия записки (держать на плаву) без рамки; записка рыбалки говорит, бежит ли рыба или отдыхает, циферблат лески мигает лампой на протяжении рывка; захват, закрывшийся на пустоте, сообщает Nothing caught. Верно?\n\nТема: [HUD](../interface/hud.md)\n\n### Q66\nПримерка на верфи: если примерить другой корпус и вернуть прежний за тот же визит, детали его станций возвращаются на место; полоса нагрузки показывает четыре деления сверх водоизмещения корпуса; окно характеристик помечено бортовым номером корпуса. Верно?\n\nТема: [Верфь](../base/boatyard.md)\n\n### Q67\nКнопки геймпада: в море левый стик рулит, триггеры дают передний и задний ход, нажатие A делает рывок нитро, бамперы стреляют левым и правым бортом, B пускает дым, правый стик водит прицел по воде для выбора цели и наводки в веере, D-pad вверх переключает оружие, а вниз открывает промысел, Start ставит на паузу, Back открывает карту; в меню и на верфи D-pad и левый стик переводят выбор, A подтверждает, B или Start возвращает назад, Back работает как Tab. Верно?\n\nТема: [Управление](../interface/controls.md)\n\n### Q74\nНастройки: громкость музыки и эффектов, полный экран, VSync, масштаб разрешения, масштабирование (MetalFX Temporal / Spatial на Mac, FSR 2 / FSR 1), тряска камеры и язык. Верно? Нужны ли ещё переназначение клавиш и геймпада, предел частоты кадров, масштаб HUD?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q75\nЯзыки: английский и русский, старт на языке системы, выбор на странице Settings. Верно? Какие ещё? Русский мой: верны ли его термины (детали лодки, охотники, добыча)?\n\nТема: [Язык](../interface/language.md)\n\n### Q118\nВставка запускается кругом арены: первый вход лодки игрока в круг, названный в `Arena.Scene`, играет её один раз за миссию. Кнопки, миссионный триггер (цель выполнена, волна пришла) и повтор не сделаны. Верно? Что ещё должно запускать вставку?\n\nТема: [Камера и картинка](../gameplay/camera.md)\n\n### Q119\nПока играет вставка, руль держит последнюю команду игрока (ход, поворот, нитро), огонь и расходники сброшены, а бой, охотники и сеть идут как шли: лодку могут топить. Верно? Нужны ли остановка боя в одиночной игре, защита лодки на время вставки или своя вставка у каждого игрока в сети?\n\nТема: [Камера и картинка](../gameplay/camera.md)\n\n### Q147\nВладелец решил, что у врагов случайные лица. Лицо показано только у захваченной цели, слева от её таблички, 40 пикселей; оно одно из восьми и держится за лодкой весь бой; после попадания оно сердится, на последнем ударе удивлено. Там ли ему место, и нужно ли лицо каждому врагу на экране или на рации? С 11-15 эти восемь портретов снова принадлежат капитанам-соперникам: у соперника лицо его капитана, а у охотника — случайное из тех же восьми, так что охотник может носить лицо соперника. Оставить охотникам лица, дать им другие или убрать?\n\nТема: [HUD](../interface/hud.md)\n\n### Q153\nПанель быстрого доступа — четыре постоянные ячейки внизу, по виду расходника на клавишу, с ящиками его рецепта и тем, сколько раз трюм может за него заплатить. На геймпаде это D-pad влево и вправо, X и Y. Так ли, или ячейки назначает сам игрок?\n\nТема: [HUD](../interface/hud.md)\n\n### Q159\nОфициальная палитра (`game/ui/Hue.cs`). 2026-11-13 владелец сказал, что она слишком большая и не все цвета сочетаются, велел не бояться убирать цвета и взять все четыре оставшихся места. После проверки ([отчёт](../reports/2026-11-13-palette-audit.md)) из 82 хранимых цветов осталось 21. Какой цвет остался в каждой паре, решено без владельца:\n- Зелёный один, зелёный шкалы корпуса: его взяли числа верфи и ремонт.\n- Жёлтый один, золото цели: его взяли монеты, предупреждения, средняя шкала корпуса и лампа топлива. Предупреждение теперь золотое, а не янтарное.\n- Лампы мин и прожектора горят цветом своего смысла.\n- Крупные слова реплики — оранжевый игрока глубже.\n- Детали верфи: корпус — аква, мотор — бирюза лагуны, ракеты — песок, торпеды — фиолетовый топлива, броня — синий брони.\n- Ящики: бочка топлива фиолетовая, взрывчатка красная, электрика — аква, механизмы — бирюза, ценности — золото.\n- Стекло с пойманным светом повёрнуто к лагуне наполовину: между аквой приборов и водой. Целиком в тон лагуны выбранные строки окон инструментов зеленели; это три значения в теме.\n\nТак?\n\nТема: [Палитра](../art/palette.md)\n\n### Q160\nКнопки причала и места верфи — прозрачные стеклянные плитки: лагуна видна сквозь них ясно, толстая кромка её преломляет, серп света под верхней кромкой, у слов мягкий ореол их формы; в выбранной пойман свет лагуны и она светится вокруг; «Отчалить» прозрачная сверху с оранжевым светом снизу на треть, выбранная — насыщенно-оранжевая с водой сверху. Движение: плитки приходят по очереди с одним отскоком; выбранная наливается светом, а линза света проезжает к ней по ряду; нажатие сжимает к низу, по контуру бежит рябь, всплывают пузырьки; в покое лёгкое покачивание и полоса света вдоль ряда; на уходе ряд замирает и опускается по очереди. Выноска у плиток стала подписью «// что делает» с точками. Так ли? Достаточно ли прозрачно стекло, не много ли движения?\n\nТема: [Компоненты](../art/components.md)\n\n### Q161\nБазовые компоненты интерфейса: стеклянная плитка, пилюля и строка меню, переключатель и шкала, колпачок клавиши и подсказки, выноска, карточка (детали верфи, ящики и товары торговца), кошелёк, подпись, пиктограммы, линза прибора, ромб рулетки, плитка расходника и слот трюма, уведомление и табличка, список, диалог и радио, панель показателей верфи, циферблат рыбалки, карточка улова, карта, судовой журнал, экран торговца, окно инструмента. Всё в стекле; бумаги нет. Тот ли это набор?\n\nТема: [Компоненты](../art/components.md)\n\n### Q165\nС HUD убраны стрелки вокруг лодки; чтобы задание можно было найти, его место отмечено на карте (M). Так, или нужен другой указатель?\n\nТема: [Открытый мир](../gameplay/missions.md)\n\n### Q166\nМеню, колпачки, выноски и карточки верфи в стекле (2026-11-12). Меню: невыбранные пункты — только белые слова, стекло лишь на выбранном, свет лагуны пятном вокруг слов; пилюли меньше прежних (сцену за меню паузы владелец решил размыть и притемнить, 2026-11-16). Слова на любом стекле, плитки базы тоже, белые с тёмным ореолом своей формы, а не тёмные на прозрачном. Колпачки клавиш — дымчатое стекло с белыми буквами, а не прозрачное. Выноска прозрачна у кромки и матова глубже. У некупленной детали цена на белом стеклянном ярлычке; установленная светится оранжевым снизу. Так?\n\nТема: [Компоненты](../art/components.md), [Экраны и меню](../interface/screens.md), [Верфь](../base/boatyard.md)\n\n### Q171\nДиалог и радио в стекле (2026-11-13). Реплика — матовое стекло подсказок с тёмными буквами и хвостом к говорящему; имя — мелкая подпись без таблички; ответы — список, как меню, стекло только под выбранным; молчащий портрет сереет, а не синеет; мир за диалогом притемнён и чуть смягчён. Радио в бою — дымчатая панель HUD с белыми буквами, без хвоста, портрет в стеклянной рамке. Так?\n\nТема: [Диалог](../story/dialogue.md), [Компоненты](../art/components.md)\n\n### Q172\nПанель показателей верфи — одно дымчатое стекло с белыми словами: показатели сплошными стеклянными полосками (было 14 сегментов), нагрузка бусинами, лампа — бусина; имя на скотче, номер на наклейке, вторая наклейка с видом корпуса убрана. Заголовок верфи печатный, как у базы (был на скотче); поля экрана 32 (были 28). Так?\n\nТема: [Верфь](../base/boatyard.md)\n\n### Q173\nЧто держит тема (`game/ui/look.tres`): цвета, шрифты, кегли, размер, углы, поля и зазоры каждой детали, насколько она дымчата или притемнена, общие длительности движения и место света. Пропорции внутри рисунка и собственная хореография детали остаются в коде. Так?\n\nТема: [Компоненты](../art/components.md)\n\n### Q174\nЦвета-сигналы мира: у каждого смысла одно значение в палитре. Ракеты охотников и кольцо падающего снаряда — красный интерфейса, ракеты игроков — оранжевый игрока, лампа маяка задания — золото цели; лампы мин и прожектора — свои, более густые роли; огонь остаётся цветом огня. Импульсная башня светится почти аквой союзников: оставить, или у опасности должен быть другой цвет?\n\nТема: [Палитра](../art/palette.md)\n\n### Q175\nПоследние глянцевые детали HUD стали стеклом: лампа топлива и лампы гнёзд дронов — маленькие линзы, значок уведомления — круглая линза (бледнее прежнего шарика), плитка расходника ловит свет сама, таблички ловят цвет ярче; все слова на стекле — с одним ореолом. Так?\n\nТема: [HUD](../interface/hud.md)\n\n### Q178\nБывшие бумажные вещи в стекле (2026-11-13), как именно. Журнал: «Сохранить сюда» и «Загрузить» стоят рядом с выбранной строкой и едут за ней, «Новая игра» внизу; щелчок по строке жмёт выбранную рядом пилюлю; запись в игре помечена оранжевыми словами; звуки журнала пока бумажные. Карта: стекло HUD без преломления; гавань — оранжевое кольцо игрока; карта проявляется и растёт, а не выезжает; отметки на воде и уведомления под ней гаснут; глубины — сегодняшние. Список целей больше не качается, выполненная строка тускнеет; подписи приборов — голые капители без плашки; карточка улова — ровное дымчатое стекло; у счёта целей регистр как в коде («HULL 100%»). Так?\n\nТема: [Экраны и меню](../interface/screens.md), [Добыча](../gameplay/haul.md), [HUD](../interface/hud.md), [Места промысла](../gameplay/sites.md)\n\n### Q179\nШвартовка в гавани без экрана базы (ваше решение 2026-11-13); остальное я решил сам. По `Space` лодка сама доходит до ближайшего свободного места у причала и стоит носом к морю, целая и с полным баком. Бой при этом не останавливается; если охотники подходят на дистанцию боя, лодка сама отчаливает с предупреждением. `Space` ещё раз — «Отчалить». Первой выбрана «Торговец», если в трюме есть ящики, иначе «Отчалить». При входе на верфь лодка больше не приходит с моря, а переходит на первое место от того, где стояла. Сцена сюжета `briefing` теперь звучит, когда лодка отчаливает. Так? Должен ли мир ждать, пока лодка у причала?\n\nТема: [Гавань](../base/pier.md)\n\n### Q180\nМеню теперь одно, по `Esc`, в море и у причала: «Продолжить», «Сохранить», «Загрузить», «Кооператив», «Настройки», «Инструменты», «Выход». Демо и оба редактора лежат на странице «Инструменты». Пункта «На базу» нет: заход кончается гибелью или загрузкой сохранения. Так? Нужно ли прятать «Инструменты» от игрока ближе к релизу?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q207\nВид верфи — обычный изометрический вид боя (ваше решение 2026-11-13); остальное я решил сам. Вид стоит ближе, чем у причала: лодка занимает примерно треть ширины экрана, в свободной части между краем экрана и показателями. Игрок его не крутит и не приближает, и клавиши вида (`Q` `E`, `R` `F`, правый стик) на верфи убраны. Мачта, ванты и флажки пирса перед лодкой растворяются вокруг неё, чтобы не закрывать корму; настил остаётся целым. Так? Нужно ли на верфи приближение колесом или поворот лодки, чтобы рассмотреть дальний борт?\n\nТема: [Верфь](../base/boatyard.md)\n\n### Q206\nРадио листается клавишей `R` в море, на геймпаде — нажатием правого стика: все кнопки и крестовина там заняты. В настройках есть строка «Радио». Станцию называет маленькая стеклянная шкала слева от приборов, пару секунд после смены, с точкой на каждую станцию. Верны ли клавиша, кнопка и место шкалы? У пирса клавиша не работает: там станцию меняют в настройках.\n\nТема: [Управление](../interface/controls.md), [HUD](../interface/hud.md), [Музыка](../audio/music.md)\n\n### Q209\nКрупная строка диктора: одно-два слова белой антиквой прямо над морем, в верхней трети экрана, под ними тонкая линия света и подпись на маленькой стеклянной табличке; держится около полутора секунд. Без плашки под словами: читаемость дают тёмный ореол и размер. Так, или слова должны лежать на стекле, быть крупнее, цветными, другим шрифтом? Верно ли место: под уведомлениями и над лодкой?\n\nТема: [HUD](../interface/hud.md), [Компоненты интерфейса](../art/components.md)\n\n### Q208\nЧто объявляет строка диктора. Сейчас: каждая потопленная лодка («Потоплен», название на табличке в оранжевом цвете игрока, без звука); уведомлений об этом больше нет. Не слишком ли часто она появляется, если тонет несколько лодок подряд? «Погиб» и исход миссии своей карты остаются на чёрных полосах.\n\nТема: [HUD](../interface/hud.md)\n\n\n### Q280\nГде ты, в меню паузы: справа вверху имя ближайшего места по карте — гавань, станция «Мария», форт пиратов, «Пост броненосца»; остров, риф или скалы по имени, если их берег недалеко; иначе «Открытое море». Под ним лодка и монеты, ниже «Сохранено 2 мин назад»; онлайн — команда: лодка каждого и на плаву она или на дне, а заголовка «Пауза» нет. Так? Нужны ли карта мира, время суток или погода?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q281\nМягкий фокус за меню паузы: насколько сильно размыт мир (лодка — мягкое пятно со следом), насколько он темнее и насколько приближен. Фокус держится и под судовым журналом, открытым из меню. Так?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q260\nКольцо соперника на HUD красное, как у всех врагов: до 11-10 у каждой команды был свой цвет кольца, но палитра теперь держит один цвет на смысл (11-13). Соперников различают табличка, которая видна всегда, лицо капитана рядом с ней и ливрея лодки. Хватает ли этого, или кольцу нужен цвет команды?\n\nТема: [Соперники](../gameplay/rivals.md), [HUD](../interface/hud.md)\n\n### Q277\nТихий выбранный пункт (ваше решение 2026-11-16) сделан у всех пилюль: в меню, в журнале, в ответах диалога, у пилюль с клавишей на верфи и у торговца. Плитки ленты причала и карточки деталей верфи, выбранные, по-прежнему наливаются светом лагуны, с мягким свечением вокруг. Делать ли их тоже тихими — кромка и блик? У строки журнала слова остаются тёмными: на прозрачном стекле над матовой панелью белые читались бы хуже. Так?\n\nТема: [Компоненты интерфейса](../art/components.md), [Экраны и меню](../interface/screens.md)\n\n### Q278\nКак меню уходит и как устроен столбец. Закрываясь, меню сразу отдаёт клавиши и руль, а пункты за пятую долю секунды уходят влево и тают, снизу вверх; новая страница приходит, пока прежняя за восьмую долю секунды уходит влево. Заголовок стоит прямо над столбцом, у начала слов; в главном меню — по центру. «Выход» отделён от остальных пунктов промежутком в меню паузы, главном меню и меню обоих редакторов. Вокруг середины экрана под главным меню — лёгкое круглое затемнение. Так? Не слишком ли быстро или медленно?\n\nТема: [Экраны и меню](../interface/screens.md), [Компоненты интерфейса](../art/components.md)\n\n### Q290\nЛодки игроков на карте (M): глянцевые стрелки по курсу поверх всего, своя — оранжевая, товарищей — аква, каждая в мягком ореоле своего цвета, чтобы читалась над облаком шторма; лодка за краем карты держится у края, затонувшая с карты уходит; подписей у стрелок нет. Ваше решение для HUD — без радара и значка лодки; карта открывается только по M, поэтому я счёл, что оно её не касается. Так? Нужны ли на карте имена товарищей?\n\nТема: [Добыча](../gameplay/haul.md), [Погода](../world/weather.md), [Компоненты интерфейса](../art/components.md)\n\n### Q291\nМир за открытой картой в мягком фокусе, как за меню паузы, с той же силой размытия, притемнением и приближением. Приборы, трюм и расходники остаются резкими; дождь не прячется, а размывается вместе с миром. Так?\n\nТема: [Экраны и меню](../interface/screens.md), [Добыча](../gameplay/haul.md)\n"}, {"id": "questions-missions", "path": "questions/missions.md", "title": "Вопросы: миссии", "section": "questions", "date": "2026-11-16", "md": "# Вопросы: миссии\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q1\n_Частично: сюжет и цель решены 11-12, открыты сами поручения и боссы ([Журнал решений](../decisions.md))._ Задания и боссы: сейчас в бесконечном заходе по счётчику предлагаются четыре вида заданий (конвой, курьер, маяки, груз), а в бухте стоит броненосец, мировой босс ([Q129](#q129), [Q131](#q131)). Какими должны быть настоящие задания и боссы вместо заглушек? Насколько далеко должен заходить стартовый ялик с турелью, и должен ли заход давать что-то сверх монет и трофеев — например, звание или лучшее время?\n\nТема: [Открытый мир](../gameplay/missions.md)\n\n### Q17\nСоставы охотников: сейчас в мире стоят посты охраны у проливов, рифов и бухты, и охотники выходят только оттуда. Какие виды охотников должны стоять вместе на постах?\n\nТема: [Открытый мир](../gameplay/missions.md)\n\n### Q56\nЦены деталей: детали только покупаются (решение владельца), и все лежат в продаже на верфи со старта; цены стоят по три монеты за прежний порог очков добычи (см. [Q128](#q128)). Сколько должна стоить каждая деталь?\n\nТема: [Прогресс и сохранения](../gameplay/progression.md)\n\n### Q72\nЗоны и опасности: размечаются кругами или коридорами в редакторе карт; охотники огибают минные поля, бочки, горящую нефть и основания башен, батарей и прожекторов, но не заградительный огонь и не круги импульсных башен, которые бьют любую сторону; гость в кооперативе видит зоны хоста; береговая батарея обведена на HUD как враг, а горящая нефть подрывает бочки. В мире стоят минное поле, бочки, горящая нефть, заградительный огонь и береговые батареи, а ещё посты охотников, тайники, точки снабжения, круг стоянки броненосца и станция (башни и прожекторы из мира убраны, см. [Q143](world.md#q143)). Верно ли это и какие зоны должны стоять в мире?\n\nТема: [Зоны и опасности](../world/areas.md)\n\n### Q81\nСвоя карта в редакторе с режимом «банда» без охотников: банда из нуля лодок никогда не считается побеждённой (решение без владельца), а точек выхода больше нет, поэтому такой заход кончается только потоплением или выходом в редактор. Должна ли у такой карты быть своя цель (дойти до метки, продержаться время) или редактор не должен позволять пустую банду?\n\nТема: [Открытый мир](../gameplay/missions.md)\n\n### Q199\nБуйства (2026-11-13 вы одобрили сами буйства; всё остальное выбрано без вас). Жетон лежит у каждого из четырёх больших постов охраны, в открытой воде в 130 м от линии поста: у северо-восточного и северного — потопить 3 лодки за 90 с, у западного — 2 за 60 с, у юго-западного — 3 за 75 с. Считается лодка любой стороны, и рабочая тоже, потопленная ракетой, торпедой, турелью, своим дроном, тараном, своей миной или зарядом; мины карты, бочки, нефть и обстрел не считаются. Награда — ящики на 15 добычи за каждую лодку задачи (45 за три), как у заданий; не успел — ничего. Жетон возвращается через минуту. У лодки одно буйство разом. На карте (M) жетоны не обведены. Верны ли числа и места? Должно ли буйство требовать определённого оружия, как в таких играх («только тараном», «только минами»), и расти от раза к разу?\n\nТема: [Забавы](../gameplay/toys.md)\n\n### Q200\nПрыжки на счёт (вы одобрили сами прыжки; пороги выбраны без вас, по замерам в открытом мире). Лодка в воздухе, пока ни одна часть днища не в воде. Полёт от 1 с объявлен уведомлением, короче — молчание; полёт от 1,25 с доливает четверть нитро. Гонщик на нитро даёт около семи полётов от секунды в минуту, ялик — около трёх, канонерка почти не летает. Рекорд — самый долгий полёт, хранится в сохранении. Верны ли пороги и прибавка? Должны ли прыжки давать что-то ещё (монеты, очки), и считать ли высоту или дальность, а не только время?\n\nТема: [Забавы](../gameplay/toys.md)\n\n### Q201\nОблик и слова забав — временные замены. Жетон буйства — красная восьмиконечная звезда-вспышка с белым краем плашмя в красном свечении; на объявлениях и в списке целей оно зовётся «Буйство». Спрятанная посылка — золотая коробка, перевязанная белым, в золотом свечении. Каким должен быть жетон (череп, вещь мира?) и как это называть по-русски?\n\nТема: [Забавы](../gameplay/toys.md)\n\n### Q202\nСпрятанные посылки (вы одобрили сами посылки; число, места и награда выбраны без вас). В мире их десять: в лагуне атолла, среди южных кекуров, среди кекуров бухты, за вулканом у края его бомб, в лагуне за барьерным рифом, в заводи между `Home cay` и косой, в протоке через отмели, за `Cargo cay` под его батареей и в двух дальних углах карты. Найденная посылка ничего не даёт, кроме счёта «Посылка 3 из 10»; последняя высыпает ящики на 100 добычи (около 300 монет). Игра сохраняется при каждой находке, чтобы гибель её не отнимала. В кооперативе посылки у каждого игрока свои, в его сохранении. На карте (M) их нет. Верны ли места и число? Должна ли каждая посылка что-то давать сразу, а последняя — что-то особенное (деталь, лодку)?\n\nТема: [Забавы](../gameplay/toys.md)\n\n### Q203\nЗабавы в кооперативе. Буйство решает хост, но награду за него, как и за посылки, высыпает игра самого игрока у его лодки: трюм у каждого на своей машине, а добыча на воде пока не онлайн, так что товарищи этих ящиков не видят. Спрятанные посылки у каждого игрока свои: гость находит посылки карты хоста в собственное сохранение, по имени карты, и находка одного не снимает посылку у другого. Рекорд полёта тоже у каждого свой. Так, или посылки и награды должны быть общими для банды?\n\nТема: [Забавы](../gameplay/toys.md)\n\n### Q128\nДобыча идёт по три монеты за очко (`Progress.Rate`): бесконечный заход приносит больше добычи, чем короткая миссия, а монеты по-прежнему только покупают детали. Верна ли ставка и не слишком ли быстро хватает на верфь?\n\nТема: [Открытый мир](../gameplay/missions.md)\n\n### Q129\nЗадания дают буи флопп (ваше решение 2026-11-13: несколько дающих в мире): корабел у причала даёт конвой и груз, мытарь у «Марии» — курьера и маяки, каждый по очереди. Задание одно разом; после него буи загораются через двадцать секунд; оно ставится на постановке, что начинается ближе к лодке. Награда: конвой 30, курьер 40, маяки 50 очков на игрока плюс припасы. Верно ли, кто что даёт, перерыв и награды? Нужны ли ещё дающие и свои буи вдали от гавани? Реплики дающих по рации — заглушки ([Q48](story.md#q48)).\n\nТема: [Открытый мир](../gameplay/missions.md)\n\n### Q131\nБроненосец — мировой босс (ваше решение 2026-11-14): стоит в бухте с начала, без часов. Потопленный, он даёт ремонт и броню и не возвращается, пока мир не поднимут заново (загрузка, «Продолжить», гибель). Нужно ли ему возвращаться и в том же мире, через какое-то время, как мировые боссы в WoW? Его охрана, два катерка, видит не дальше его самого (220 м), чтобы не гоняться за лодкой через всю карту с начала игры; это касается и миссии броненосца на своей карте.\n\nТема: [Открытый мир](../gameplay/missions.md)\n\n\n### Q241\nЧто сохраняется из мира (ваше решение 2026-11-14: игра продолжается с последнего сохранения). Сейчас сохраняются зерно мира, лодка у причала или её место и курс в море, бак, повреждения корпуса и плит и ящики трюма. Не сохраняются охотники и их посты, броненосец, патруль, рабочие лодки, предметы на воде, открытое задание и розыск: после загрузки они встают заново, как при старте, а задание снова дают буи. Так, или что-то из этого должно сохраняться (взятое задание, розыск, потопленные посты)?\n\nТема: [Прогресс и сохранения](../gameplay/progression.md)\n\n\n### Q258\nСоперники в открытом мире: две команды входят в море с края карты, у выхода, от которого все лодки игроков дальше 600 м, бродят в 250 м от ближайшей лодки игрока (место выбирается заново каждые полминуты), видят, как охотник поста, и забывают через 8 с; уходят к ближайшему выходу с 30–70 добычи, с полным трюмом, с побитым корпусом или через 4–6 минут; ушедшую или потопленную заменяет другая через 90 с. Раньше они начинали каждую миссию рядом с игроками и видели всю арену. Так ли им жить в мире, чаще ли встречаться с игроками, или реже?\n\nТема: [Соперники](../gameplay/rivals.md)\n\n### Q259\nСоперник помнит, чем кончилась прошлая встреча (потопил лодку игрока, потоплен игроком, вничью), и говорит об этом при следующей. Гибель загружает последнее сохранение, но записи соперников переживают загрузку: тот, кто потопил лодку, злорадствует при следующей встрече. Так ли, или и память соперника откатывается к сохранению?\n\nТема: [Соперники](../gameplay/rivals.md), [Прогресс и сохранения](../gameplay/progression.md)\n"}, {"id": "questions-online", "path": "questions/online.md", "title": "Вопросы: онлайн", "section": "questions", "date": "2026-11-13", "md": "# Вопросы: онлайн\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q108\nКооп через Steam: хост выбирает, открыть игру друзьям в Steam или своей сети, а гость — где её искать (по две кнопки), — или открывать и искать сразу и там и там? Лобби видно только друзьям: нужен ли публичный список игр? Пока игра в Steam — тестовый Spacewar (480), и приглашения и «Присоединиться» из списка друзей Steam не работают: они ждут страницы игры в Steamworks и своего App ID. Когда её заводить?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q124\nСколько длится окно, пока затонувшую лодку игрока может поднять товарищ? Пока взято 60 секунд с момента, когда лодка пошла ко дну (`Revive.Window`), дольше, чем лодка тонет (9 секунд). Окно общее для всех лодок, а его остаток виден только в подписи у кольца. Лучше короче, или считать его от чего-то другого, например от миссии?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q125\nКак товарищу держаться у обломков, чтобы поднять лодку? Пока он должен быть в море, ближе 25 м к обломкам и идти медленнее 4 м/с, 5 секунд (`Revive`); кольцо заполняется золотом, а если он отошёл, заполненное тает с той же скоростью. Подойдёт любой товарищ с целой лодкой, даже с пустым баком. Поднятая лодка целая, на месте, с пустым трюмом (добыча при затоплении высыпалась) и с тем топливом, что было. Так ли, или поднятая должна платить (часть корпуса, монеты), а товарищем считаться только тот, у кого есть топливо?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q133\nХост сообщает гостям цели захода и метки заданий раз в секунду, а объявления сразу, как прозвучали. Достаточно ли такта для меток, и не нужно ли гостю видеть задания, которые взял товарищ, отдельно от общих?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q140\nЛодка товарища у причала — его лодка в мире; после верфи она меняется, когда он из неё выходит, а не по каждой детали. Имена игроков стояли только над лодками на экране базы, а экрана базы больше нет (2026-11-13), так что имён над лодками товарищей сейчас нет нигде. Нужны ли имена над лодками товарищей в море и у причала, своё имя игрока в настройках и обновление по детали?\n\nТема: [Гавань](../base/pier.md)\n\n### Q181\nКооператив начинается из меню `Esc` прямо в море (экрана базы нет, ваше решение 2026-11-13); остальное я решил сам. Хост открывает своё море посреди захода. Гость, присоединяясь, оставляет своё море и добычу в трюме (меню предупреждает), а уйдя или оставшись без хоста, возвращается в своё море с последнего сохранения. Места промысла и обломки, которые были у хоста до того, как он открыл игру, гости не видят. Так?\n\nТема: [Онлайн-кооп](../online.md)\n"}, {"id": "questions-story", "path": "questions/story.md", "title": "Вопросы: сюжет", "section": "questions", "date": "2026-11-13", "md": "# Вопросы: сюжет\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q5\nПодробности сеттинга: его люди, названия мест и что осталось от старого мира? Прежние предложения лежат в [lore-proposals.html](../story/lore-proposals.html).\n\nТема: [Сеттинг и лор](../story/setting.md)\n\n### Q48\nС кем говорит игрок и о чём? Портреты говорящих сделаны для капитана, корабела и мытаря (плюс восемь случайных портретов врагов в бою, см. [Q147](interface.md#q147)): верно? В игре сейчас звучит одна сцена — приветствие корабела на верфи, с репликами-заглушками. Мытарь говорил по радио у точек выхода с пошлиной; его сцены ушли вместе с точками, остались портреты. Нужен ли мытарь, и где ему говорить?\n\nТема: [Сцены сюжета](../story/scenes.md)\n\n### Q69\nПоводы сюжета и редактор: радио говорит, когда начинается заход, при первом потопленном охотнике и при последнем попадании по лодке; за игрока говорит капитан; гость онлайн не получает брифинга (заход выбирает хозяин игры), но слышит радио и разбор; редактор сохраняет собственные сцены игры, так что только из проекта. Повода «подход к флоппе» из решения пока нет. Верно? Какие ещё моменты и флоппы должны рассказывать сцены?\n\nТема: [Сцены сюжета](../story/scenes.md)\n\n### Q193\nКто такой патруль? Вы сказали: позже, пока просто полиция. Сейчас банда охотников и патруль друг друга не трогают, а охотники не трогают мирные лодки. Оставить так, или банда должна нападать на мирных, а патруль — на банду?\n\nТема: [Розыск и патруль](../gameplay/wanted.md), [Сеттинг и лор](../story/setting.md)\n"}, {"id": "questions-tools", "path": "questions/tools.md", "title": "Вопросы: инструменты", "section": "questions", "date": "2026-11-15", "md": "# Вопросы: инструменты\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q35\nРедактор карт: чего не хватает или что мешает? Сейчас в самом редакторе руками ставятся рельеф, зоны и опасности (с постами охраны и видами их охотников), круги арены, станция, старт, охотники, маяки, места промысла и кадры вставок, а события мира (пути конвоя, курьера, маяков, груза, броненосца) заданы только в JSON карты. Должен ли редактор позволять расставлять и события?\n\nТема: [Редактор карт](../tools/map-editor.md)\n\n### Q68\nИнструменты после QA (см. [демо](../tools/demos.md)): селектор принимает Esc перед кейсом и имеет «Назад» в списке, который сворачивается; кликнутая строка держит клавиши для W S и Enter. В редакторе «Выбрано» и «Задания» делят боковую сторону две части к трём, каждое окно сворачивается, меню и «Открыть» стоят над ним, «Открыть» переименовывает и убирает в корзину карты игрока, «Играть» возвращается в редактор на несохраняемом прогрессе, «Сохранить как свою» пишет поверх своей копии после первого раза; числа словами и единицами (16:30, узлы, метры, градусы; планктон, танин и ил для воды); охотники пронумерованы, закреплены переключателем, оранжевый оставлен для «Играть»; шторка говорит, что поднимает («Поднимаем Coral cay»). Верно?\n\nТема: [Демо](../tools/demos.md), [Редактор карт](../tools/map-editor.md)\n"}, {"id": "questions-world", "path": "questions/world.md", "title": "Вопросы: мир и облик", "section": "questions", "date": "2026-11-16", "md": "# Вопросы: мир и облик\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q7\nВыражения портретов: у каждого говорящего (капитан, корабел, мытарь) сейчас четыре выражения — ровный взгляд, довольный, удивлённый и сердитый, а у восьми портретов врагов три (ровный, удивлённый и сердитый). Какие ещё нужны?\n\nТема: [Люди: флоппы](../art/people.md)\n\n### Q11\nКакой настоящей лодкой должен быть каждый корпус? Сейчас: катерок — малый открытый катер, ялик — панга, плоскодонка — джонбот аэролодки, гонщик — офшорный катер, патрульный катер — патрульный катер, канонерка — вооружённый буксир.\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q14\nЛивреи и наряды: цвета и номер каждого корпуса и какой корпус несёт тент, арку, пульт или рубку. Верно?\n\nТема: [Облик лодок](../art/boats.md)\n\n### Q61\nМангры (палитра рельефа Delta): кайма куполообразных крон в несколько метров шириной на ходульных корнях над мелководьем, в своём тёмно-зелёном цвете, и лодки проходят под внешним краем крон. Верно?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q77\nТон картинки: яркая мягкая картинка прохода по картинам (экспозиция поднята, контраст AgX смягчён) сделала море серым, так что оно возвращено к тому, что было до прохода. Верно или картинка должна быть ярче как-то иначе?\n\nТема: [Свет и время суток](../art/light.md)\n\n### Q78\nГоры: конус, вытянутый вдоль гребня, седловины между плечами, расходящиеся от вершины отроги, отвесный обрыв у воды и кратер у вулкана; в мире и в редакторе карт есть формы Peak, Ridge и Volcano. Земля, заслоняющая лодку от камеры, просвечивает кругом вокруг лодки, как в изометрических играх. Верно? Суша сейчас закрывает лодку от охотника, как дым ([Q148](combat.md#q148)), так что сквозь остров он не стреляет, а ракеты рвутся о землю. Это спорит с прежним решением «охотники стреляют независимо от острова» ([Бой](../gameplay/combat.md)): оставить так или вернуть стрельбу сквозь сушу?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q79\nБарьерный риф и кекуры: барьерный риф (Barrier reef) изгибается дугой с полосой лагуны за ним и лежит у края банки на острове базы и в мире; морские столбы стоят на мелкой полке группой (Sea stacks) или поодиночке (Lone stack), без подмыва у воды, так как карта высот не даёт нависаний. Верно?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q80\nКосы и отмели: в редакторе и на картах есть Sandbar (белый песок чуть выше воды), Hooked spit (загнутая коса с травой на дюнах и пальмами на оконечности, отходящая от острова базы и в мире) и Sand bars (три подводные отмели подряд, где средняя держит патрульный катер, но пропускает ялик, а внешняя на метр глубже). Прибой пенится над первой к зыби и средней отмелью, но не над дальней, потому что волна уже погашена мелководьем. Верно ли это, или прибой должен бить над каждой грядой?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q90\nОблик меню со стенда `Menus`: Quiet, Glass, Notebook, Atlas, Device, Dashboard или ни один? Наш выбор — Quiet; Glass, если нужен материал; Notebook, если нужна вещь мира.\n\nТема: [Кандидаты на облик](../art/candidates.md)\n\n### Q143\nИмпульсные башни и прожекторы владельцу показались странными, и в мире вместо них стоят батареи. Убрать ли башни и прожекторы из игры совсем, или переделать их вид и оставить для своих карт?\n\nТема: [Зоны и опасности](../world/areas.md)\n\n### Q149\nПосты охраны: пост выводит охотников заново через «Вернуться через» секунд после гибели последнего, но только когда ни одна лодка игрока не ближе 160 м к его зоне. Пока лодка игрока в зоне поста или когда бьют его охотника, весь пост берёт ближайшую лодку на любом расстоянии. Составы шести постов и время их возврата (75–180 с) поставлены без владельца. Верно ли это и где в мире стоять каким постам?\n\nТема: [Зоны и опасности](../world/areas.md)\n\n### Q155\nГде стоит станция и сколько их? В мире она одна, в открытой воде к западу от `Home cay`, носом влево-вверх на экране, плотом к виду; место и курс выбраны без владельца. Радиус, в котором идёт торговля, 70 м от середины корпуса: подойти можно с любого борта, хотя плот стоит по левому.\n\nТема: [Станция](../world/outpost.md)\n\n### Q156\nПрозрачное стекло есть только у станции. Ветровые стёкла и рубки лодок и фонари пирса по-прежнему рисуются непрозрачным глянцем. Перевести ли их на то же прозрачное стекло (`Surfaces.Glass`), чтобы стекло в игре было одно?\n\nТема: [Станция](../world/outpost.md)\n\n### Q158\nКольцо поплавков у пирса и у станции. Владелец выбрал: стеклянные поплавки с тёплыми огоньками, аква и тёплый свет, без столба и без лампы, спокойно издалека и оживает рядом. Остальное я решил сам, по оценкам агента-рецензента на кадрах игры: двенадцать поплавков радиусом около полуметра, пяти размеров и трёх оттенков; сплошное дутое стекло, сквозь которое проходит солнце, с одним бликом; ромбическая сетка, латунное кольцо, маленький янтарный фонарь-банка в макушке шара под крышкой с солнечной батареей, росток на каждом четвёртом; полоса и свет в воде под кольцом, тёплые пятна под горящими фонарями; поплавки расступаются перед лодкой; у причала кольцо неполное, только на открытой воде; у станции оно такое же. Так ли?\n\nТема: [Гавань](../base/pier.md)\n\n### Q182\nМастерская корабела (ваше решение 2026-11-13) стоит на сваях в лагуне, в 34–48 м от пляжа, а не на песке: пляж пологий, и ближе лодкам мелко. С пляжем её связывают длинные узкие мостки, так что «короткий причал» — это палец от помоста, а не путь от берега. Состав я выбрал сам. Так? Или углубить дно у берега и поставить мастерскую на песок?\n\nТема: [Гавань](../base/pier.md)\n\n### Q189\nОблик рабочих лодок и патруля временный, из того, что уже есть. Рабочие лодки — корпуса верфи без оружия в рабочей краске: одна полоса вдоль борта (рыбацкая лодка на корпусе катерка, паром на корпусе патрульного катера, сухогруз на корпусе канонерки). Патруль — корпуса охотников в бело-синей краске с косыми полосами; мигалки и сирены нет. Вы сказали: позже. Какими вы видите мирные лодки и патруль?\n\nТема: [Жизнь моря](../world/life.md), [Розыск и патруль](../gameplay/wanted.md)\n\n### Q190\nЖизнь моря: в мире шесть рейсов разом (три рыбака, паром, два сухогруза), потопленную лодку через полторы минуты сменяет новая с края карты. Гавани лодок выводятся из карты: причал, станции, косяки рыбы и восемь выходов у края; маршруты ищет игра. Лодка появляется у рейса в 450 м от игрока. Верно ли число лодок и их занятия? Рисовать ли порты и маршруты в редакторе карт? Что строить на этой основе дальше: торговцев с товаром и ценами, караваны с охраной?\n\nТема: [Жизнь моря](../world/life.md)\n\n### Q196\nПосты патруля в мире: три — у гавани (ялик и гонщик), у станции (ялик и патрульный катер) и к северу от гавани (преследователь и канонерка); лодки возвращаются через 120 с после гибели поста. По уровню розыска идут: одна лодка ближнего поста, весь ближний пост, два ближних поста, все посты. Верно ли, где им стоять, чем ходить и сколько слать?\n\nТема: [Розыск и патруль](../gameplay/wanted.md)\n\n### Q212\nКольца на воде от взрывов. От ракеты, заряда и гибели лодки по воде разбегается тонкое светлое кольцо (от 0,2 до 0,55 с). От заряда и гибели за ним остаётся кольцо пены в два с лишним размера взрыва: меньше слоя пузырьков, пятнами, сразу кружевом, тает за секунды; под водой коротко вспыхивает бирюзой. Брызг у взрывов стало примерно вдвое меньше. Кольцо пены близко к кляксам и к усиленным следам, которые вы отвергли, хотя пену кладёт сама вода. Оставить, сделать слабее или убрать?\n\nТема: [Море](../world/sea.md), [Облик мира](../art/world-look.md)\n\n### Q240\nМирные лодки получили расписание и поведение (вы просили 2026-11-14). Паром выходит из гавани каждые 2,5 минуты, со станции через полпериода, а отстав, прибавляет ход. Рыбак работает смену: выходит раз в 4 минуты в своё время, тралит два косяка с остановками выбрать сети и везёт домой улов (полный трюм — 16 добычи вместо прежних 8, пустой — четверть). Лодки сбавляют ход у стоянки, отворачивают от лодки игрока, которая идёт на них, бегут к гавани или посту патруля, а задетые потом идут домой. Часы расписания — время захода: час неба на карте стоит, поэтому рыбаки не уходят на рассвете. Так? Нужна ли смена дня и ночи, чтобы расписание шло по часам? Гудок при опасном сближении требует скачать звук: искать?\n\nТема: [Жизнь моря](../world/life.md)\n\n### Q244\nРыбалка сетью (вы выбрали сеть со стрелы, всплески рыбы и снасть чуть крупнее жизни, 2026-11-14). Стрела с лебёдкой стоит на правом борту у кормы; на ходу сеть лежит кучей на палубе. На косяке за кормой тянется линия оранжевых поплавков с буйком и красным флажком. Каждые 20 секунд лодка 8 секунд выбирает сеть: тёмно-зелёная сеть в верёвочной оплётке с бьющейся рыбой поднимается, с неё течёт вода, стрела переносит её на палубу, сеть пустеет и уходит в воду. На косяке рыба выпрыгивает дугой раз в 1–3,5 секунды. Так? Что поменять: цвета, размер, как часто выбирать сеть?\n\nТема: [Жизнь моря](../world/life.md), [Места промысла](../gameplay/sites.md)\n\n### Q245\nКто отвечает пиратам. Пираты бьют всех; банда охотников и патруль считают пиратов врагами и бьют их в ответ, так что у форта банда и пираты дерутся между собой, а патруль гонится за пиратами, если те подойдут к его посту. Рабочие лодки ни с кем не воюют: от пиратской лодки, идущей на них, они отворачивают, как от лодки игрока, а под огнём убегают. За потопленных пиратов розыска нет. Так?\n\nТема: [Форт пиратов](../world/fort.md)\n\n### Q246\nФорт и его орудия. Форт звёздный, из светлого кораллового известняка, с четырьмя острыми бастионами, донжоном под чёрным флагом, знамёнами с черепом и причалом на сваях; стоит на низкой голой скале, пол двора в трёх метрах над водой: стены, двор, башня и причал твёрды для лодок и снарядов. На каждом бастионе пиратская ракетная установка, как у батареи банды: залп из четырёх ракет раз в шесть секунд по ближайшей лодке не дальше 80 м. Попадания в бастион бьют его орудие (16 попаданий), разбитое горит и не возвращается; сам форт не разрушается. Бастионы низкие, потому что ракеты идут над самой водой и иначе орудия были бы неуязвимыми. Так? Нужно ли, чтобы орудия возвращались, а форт можно было взять целиком?\n\nТема: [Форт пиратов](../world/fort.md)\n\n### Q247\nЛодки пиратов и место форта. У ворот форта стоят канонерка, преследователь и два катерка, теми же ролями, что охотники, и возвращаются через 150 с после гибели последнего; потопленные высыпают добычу, как охотники. Облик: дёготно-чёрный борт над тёмно-красным днищем, просмолённая палуба, рваная полоса цвета кости, череп с костями на скуле, мачта перед кокпитом, чёрный гафельный парус с черепом и чёрный
