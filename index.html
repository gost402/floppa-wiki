<script id="data" type="application/json">{"pages": [{"id": "README", "path": "README.md", "title": "Floppa Tropical Adventures — вики", "section": "", "date": "2026-11-17", "md": "# Floppa Tropical Adventures — вики\n\nЧто владелец решил об игре, что отверг и что делаем дальше. Начать стоит с [Об игре](vision.md).\n\nЭту же вики можно читать как сайт с поиском и картинками: [вики игры](https://gost402.github.io/floppa-wiki/). Его собирает `tools/wiki.py` из этих страниц, а выкладывает `tools/wiki-pages.sh`.\n\n## Разделы\n- **[Об игре](vision.md)** — игра коротко. **[Дорожная карта](roadmap.md)** — что сделать до релиза в Steam. **[Журнал решений](decisions.md)** — что решили и что отвергли, по датам.\n- **Геймплей:** [Открытый мир](gameplay/missions.md), [Камера и картинка](gameplay/camera.md), [Лодка](gameplay/boat.md), [Бой](gameplay/combat.md), [Сборки и стили игры](gameplay/builds.md), [Охотники и ИИ](gameplay/hunters.md), [Соперники](gameplay/rivals.md), [Розыск и патруль](gameplay/wanted.md), [Припасы](gameplay/pickups.md), [Добыча](gameplay/haul.md), [Места промысла](gameplay/sites.md), [Забавы](gameplay/toys.md), [Прогресс и сохранения](gameplay/progression.md).\n- **Гавань:** [Мастерская корабела](base/pier.md), [Верфь](base/boatyard.md).\n- **Мир:** [Море](world/sea.md), [Жизнь моря](world/life.md), [Локации](world/locations.md), [Рельеф](world/ground.md), [Зоны и опасности](world/areas.md), [Станция](world/outpost.md), [Корабль на мели](world/hulk.md), [Форт пиратов](world/fort.md), [Погода](world/weather.md).\n- **[Онлайн-кооп](online.md).**\n- **Интерфейс:** [HUD](interface/hud.md), [Экраны и меню](interface/screens.md), [Управление](interface/controls.md), [Язык](interface/language.md).\n- **[Арт-дирекшн](art/README.md):** [Облик мира](art/world-look.md), [Облик лодок](art/boats.md), [Люди: флоппы](art/people.md), [Палитра](art/palette.md), [Компоненты интерфейса](art/components.md), [Стиль интерфейса](art/interface.md), [Свет и время суток](art/light.md), [Материалы](art/materials.md).\n- **Звук:** [Звук](audio/sound.md), [Музыка](audio/music.md).\n- **Сюжет:** [Сеттинг и лор](story/setting.md), [Сцены сюжета](story/scenes.md), [Диалоги и голос](story/dialogue.md).\n- **[Инструменты в игре](tools/README.md):** [Редактор карт](tools/map-editor.md), [Редактор сюжета](tools/story-editor.md), [Меню читов](tools/cheats.md).\n- **[Отчёты](reports/README.md)** — отчёты и исследования, что были артефактами Claude: выбор облика, разборы, другие игры.\n- **[Известные недочёты](known-issues.md)** — что игрок видит или чувствует неправильным и что пока не исправлено.\n- **[Задачи](todo.md)** — что владелец решил, но в игре ещё не сделано.\n\n## Как вести вики\n- Всё — прототип, и ничто не высечено в камне. Решение — направление, в котором строить сейчас; любое может измениться, когда игра покажет лучшее.\n- Страница темы — пара фраз о том, что это в игре, и «Решения владельца»: только слова владельца, с датой. Ещё на ней бывает то, что владелец отверг или как к этому пришли, если это тоже его слова.\n- Как игра устроена, вики не пересказывает: это видно в игре, а код ведёт Claude. Там, где владелец молчит, Claude решает сам и в вики это не пишет; что не понравится в игре, владелец поменяет (2026-11-17).\n- Крупное решение — ещё и строка в [Журнале решений](decisions.md); историю хранит git.\n- Любой лор, фракцию или механику сверх решённого помечать как предложение ([Сеттинг и лор](story/setting.md)).\n- Коротко, простыми фразами, по-русски; лодка — вещь: род своего существительного (лодка — она, катер — он), без олицетворения.\n"}, {"id": "art-README", "path": "art/README.md", "title": "Арт-дирекшн", "section": "art", "date": "2026-11-17", "md": "# Арт-дирекшн\n\nКак игра выглядит и как мы приходим к её облику. Каждая тема облика — на своей странице.\n\n## Направление\nМир — солнечный тропический архипелаг: бирюзовая лагуна над белым песком, сочная зелень и пальмы, мечтательная вода пляжных уровней начала 2000-х, мягкий яркий свет и тени облаков. Интерфейс — стекло в духе Frutiger Aero поверх этого мира: прозрачное, с водой и светом за ним, с бликом и кромкой, сдержанное и спокойное, с широкими полями. Материал там, где он важен, остальное тихо.\n\n2026-11-11 владелец решил: интерфейс берёт стиль Frutiger Aero, прозрачное стекло и красивое движение уровня лучших инди, начиная с кнопок базы; у игры есть официальная [палитра](palette.md) и [базовые компоненты](components.md). 2026-11-12, увидев кадры плиток, он сказал нести стекло дальше: на меню, карточки верфи и HUD.\n\n## Страницы\n- [Палитра](palette.md): цвета игры по ролям.\n- [Компоненты интерфейса](components.md): базовые детали, их состояния и движение.\n- [Облик мира](world-look.md): море, острова, песок, зелень, кильватер.\n- [Облик лодок](boats.md): корпуса, ливреи, оснастка, банда охотников.\n- [Люди: флоппы](people.md): все жители мира — каракалы-флоппы, и их портреты.\n- [Стиль интерфейса](interface.md): вещи мира, шрифты, материалы, выноски.\n- [Свет и время суток](light.md): небо, солнце, ночь, рассвет.\n- [Материалы](materials.md): дерево и металл.\n\n## Правила\n- Один облик везде: затенение, цвет и свет одни для всей игры ([CLAUDE.md](../../CLAUDE.md), принцип 3).\n- Сначала спросить, какой облик владелец себе представляет. Перед тем как моделировать или перекрашивать что-то видимое, задать короткий раунд вопросов по-русски: форма, материал, цвет, главные детали. Облик по догадке уже промахивался: первая база, погода.\n- Никаких картинок, сгенерированных ИИ (владелец, 2026-11-07). Облик показывают кадры самой игры из демо или ссылки на настоящие игры. Портреты, уже нарисованные локальной моделью, остаются, пока владелец не скажет иначе ([Люди: флоппы](people.md)).\n- Владелец судит облик, играя, и по кадрам игры, а не по описаниям.\n- Ни одна другая игра не называется в интерфейсе, в коде и в вики.\n\n## Что владелец отверг\nЧтобы не повторять.\n- **Карточки «как у приложения»** (2026-10-26): первый HUD и верфь — скруглённые тёмные стеклянные карточки, шрифт по умолчанию — владелец назвал безликими и «сгенерированными ИИ». Никаких карточек и скруглённых стеклянных панелей.\n- **HUD из тонких светящихся линий по образцу военного авиасимулятора** (2026-10-26 — 2026-10-29): образец снят, интерфейс стал вещами мира.\n- **Погода** (2026-10-27): туман, дождь, шторм и гром, построенные как физические модели, сняты целиком: «не так, как я представлял». 2026-11-16 владелец вернул шторм, каким его видит сам ([Погода](../world/weather.md)).\n- **Пена по неподвижному V от носа** (2026-10-28): пена должна быть симулированной и принадлежать воде. Брызги потом урезаны как «чрезмерные».\n- **Усиленные стилизованные кильватерные волны** (2026-10-30): «выглядят плохо», откачены. Перед новой попыткой спросить, что владелец представляет.\n- **Первая база** (2026-10-31): жёлтый дом с красной жестяной крышей. Владелец представлял открытый деревянный эллинг; 2026-11-10 эллинг сменил открытый пирс, а 2026-11-13 пирс с гребёнкой мест под экран базы — мастерская корабела, место открытого мира ([Гавань](../base/pier.md)).\n- **Персонажи с вещами в лапах** (2026-11-06): никто ничего не держит.\n- **Неоновый свет причала** (2026-11-12): кольцо и столб неонового света, как маркеры миссий Vice City, — «слишком ярко, слишком пёстро, неестественно». Место отмечает вещь мира со сдержанным светом: стеклянные поплавки с тёплыми огоньками ([Пирс](../base/pier.md)).\n- **Меню с картинок** (2026-11-06 — 2026-11-07): стопки толстых глянцевых кнопок во всю ширину по центру, жирный шрифт с обводкой и логотип с фаской — «дешёвая мобильная игра». Яркие меню пляжного уровня, каждая строка в плашке, блики — «дёшево, громко, без вкуса». Мраморная табличка и алюминиевая панель с тонкой антиквой — «ни то ни другое». Небольшой список простых слов слева, широкие поля и материал только на выбранном пункте читались как консольная игра.\n- **Шесть целых обликов игры со стенда `Art`** (2026-11-14): Ink, Lagoon, Poster, Logbook, Deep и Tin сняты, ни один не взят.\n- **Облики меню со стенда `Menus`** (2026-11-17): Quiet, Glass, Notebook, Atlas, Device и Dashboard; ни один не взят, меню остаётся стеклянным.\n- **Слишком близкая камера и бледное открытое море** (2026-11-07, после игры): зум и тон картинки вернули.\n\n## Что владельцу понравилось\n- Frutiger Aero и Utopian Scholastic (2026-11-02): «потрясающе» — теперь это образцы интерфейса ([Стиль интерфейса](interface.md)). 2026-11-11 — постер Frutiger Aero (стеклянный шар, прозрачная волна с пузырьками, небо, листья, полосы света, мелкие подписи «// discover»): по нему сделаны кнопки базы.\n- Мир на картинках меню (2026-11-06): песок, зелень, пальмы, каустика, облачные тени ([Облик мира](world-look.md)).\n- Материалы: стекло в шлифованном алюминии и белый мрамор с хромом (2026-11-06, этюды).\n- Мечтательная ностальгическая вода пляжных уровней начала 2000-х — как вдохновение, а не как бирюзовый оттенок на всём (2026-11-06).\n"}, {"id": "art-boats", "path": "art/boats.md", "title": "Облик лодок", "section": "art", "date": "2026-11-17", "md": "# Облик лодок\n\n![Все корпуса в ряд](../img/fleet.jpg)\n\nКак выглядят лодки игрока, охотников и соперников. Как лодка устроена и ходит: [Лодка](../gameplay/boat.md).\n\n## Решения владельца\n- Лодки выглядят как настоящие моторные: седловатость, наклонённый и развалистый нос, планширь, кокпит, настоящие моторы, рубки и оснастка, у каждой поверхности своя краска, лак или металл.\n- Ливреи — гоночная графика: смелые полосы от носа до кормы, крупный номер на носу, палуба контрастного цвета. Лодки освещены как море, но ярче: насыщенная краска, чёткий лак и хром, тёмный привальный брус обводит корпус.\n- Корпуса побольше несут рубку или пульт под жёсткой крышей; они нарисованы, но это не деталь. На палубах оснастка (леера, утки, бортовые огни, антенны, бухты троса, канистры) и приметы сеттинга: солнечные панели на крышах, парусиновые тенты, ветряки, зелень в кадках.\n- Пропорции слегка преувеличены, чтобы лодка читалась с высоты боя: борта выше, моторы и ветровые стёкла крупнее, нос острее.\n- Охотники — банда со своим обликом: малиновый и чёрный, акульи зубы на носу, рваные полосы, потёртая краска.\n\n## Как к этому пришли\n- 2026-10-28: владелец попросил модели лучше и выбрал настоящие моторные лодки — не пухлые стилизованные и не рейдеров из хлама. Прежние корпуса были неверны во всём: форма, голые палубы, детали-коробки, плоское затенение.\n- 2026-11-02: на вопрос, что значит «стильнее», владелец выбрал гоночную графику, реалистичный, но более яркий свет, все детали с приметами сеттинга и банду охотников со своим обликом.\n"}, {"id": "art-components", "path": "art/components.md", "title": "Компоненты интерфейса", "section": "art", "date": "2026-11-17", "md": "# Компоненты интерфейса\n\n![Компоненты на стенде Components](../img/components.jpg)\n\n![Меню, клавиши, карточки и выноски на стенде Components](../img/components-glass.jpg)\n\n![Окно инструмента и его элементы на стенде Components](../img/tool-window.jpg)\n\nБазовые детали, из которых собран интерфейс, каждая в своих состояниях. Все видны разом на стенде `Components`. Цвета — из [палитры](palette.md).\n\n## Решения владельца\n- 2026-11-11: интерфейс — стекло в духе Frutiger Aero: полупрозрачное, с настоящим светом и водой за ним, с красивой «инди» анимацией; у игры есть базовые компоненты ([Арт-дирекшн](README.md)). Первыми так сделаны кнопки базы.\n- 2026-11-12: стекло идёт дальше: на меню, карточки деталей верфи и HUD.\n- 2026-11-12: облик не переносят по частям: у игры одна тема Godot со всем обликом, чтобы менять его быстро.\n- 2026-11-12: стекло было слишком прозрачным; оно стало чуть менее прозрачным: оттенок прозрачного стекла закрывает 26–32% сцены, приборы HUD дымчатее на шаг. Владелец посмотрел: пока достаточно.\n- 2026-11-12: тема одна на всё: каждая деталь интерфейса берёт облик из неё, диалог тоже; прежние решения о виде отдельной детали исключением не служат. Диалог (ответы списком, как меню, имя мелкой подписью), циферблат рыбалки и экран показателей верфи — стекло.\n- 2026-11-13: вся бумага интерфейса становится стеклом: бумажных вещей, скотча и рукописного шрифта в нём не остаётся. Карта — прозрачное стекло, на котором берег, глубины и отметки нарисованы светом; судовой журнал — окно матового стекла со строками; продажа — экран торговца ([Добыча](../gameplay/haul.md)).\n- 2026-11-17: стеклянные плитки причала и верфи — как сейчас.\n- 2026-11-17: базовые компоненты — как сейчас.\n- 2026-11-17: меню, колпачки, выноски и карточки в стекле — как сейчас.\n- 2026-11-17: что держит тема — как сейчас.\n- 2026-11-17: тихий выбранный пункт у всех пилюль — как сейчас.\n- 2026-11-17: красивый, быстрый интерфейс: каждая деталь появляется, быстро въезжая из-за края экрана, ближайшего к ней, и уходит за тот же край — например, когда начинается диалог.\n"}, {"id": "art-interface", "path": "art/interface.md", "title": "Стиль интерфейса", "section": "art", "date": "2026-11-17", "md": "# Стиль интерфейса\n\nИз чего сделан интерфейс и как он выглядит. Что где на экране: [HUD](../interface/hud.md), [Экраны и меню](../interface/screens.md).\n\n## Решения владельца\n- Интерфейс был задуман из вещей мира: старая печатная карта, найденные и починенные приборы (2026-11-02). С 2026-11-13 бумаги в нём нет: всё — стекло ([Компоненты](components.md)).\n- Образцы интерфейса — Frutiger Aero и Utopian Scholastic: оптимистичный глянец 2000-х, аква, небо и природа вместе с техникой и классическая антиква обучающих программ той эпохи.\n- 2026-11-11: интерфейс — прозрачное стекло Frutiger Aero с красивым движением, начиная с кнопок базы; официальная палитра и базовые компоненты ([Палитра](palette.md), [Компоненты](components.md)).\n- 2026-11-12: стекло перенесено на меню, карточки деталей верфи и HUD.\n- 2026-11-13: вся бумага в интерфейсе становится стеклом; квиток, его штамп и скотч ушли совсем ([Добыча](../gameplay/haul.md)).\n- 2026-11-12: у игры одна тема Godot со всем обликом, чтобы он менялся быстро и его не приходилось переносить по частям; стекло чуть менее прозрачно.\n- Выноска везде одна, стеклянная (2026-11-13; бумажной бирки больше нет). Предупреждение несёт свою метку, маленький знак предупреждения, и золотую кромку.\n- В интерфейсе простые слова (влево, вправо, старт, цель), и ни одна другая игра не называется ни в интерфейсе, ни в коде, ни в вики.\n- Шрифт интерфейса — Nunito: владельцу он нравится (2026-11-16, после того как он посмотрел семь других открытых шрифтов).\n- 2026-11-17: отделка интерфейса — как сейчас.\n\n## Как к этому пришли\n- 2026-10-26: тёмные стеклянные карточки отвергнуты; HUD стал тонкими светящимися линиями; 2026-10-29 этот образец снят ([Арт-дирекшн](README.md)).\n- 2026-11-02: владелец выбрал интерфейс как вещи мира: старая карта на базе, на море — кластер глянцевых аква-приборов. Шрифты он оставил на наш выбор: Nunito, Caveat, а для печати старого мира сначала Saira. В тот же день Frutiger Aero и Utopian Scholastic стали образцами, и EB Garamond заменил Saira.\n- 2026-11-03: тем же стилем переделаны сеть, карта на море, рулетка и окна инструментов.\n- 2026-11-08: сеть заменена трюмом; его экран — глянцевый аква-прибор с сеткой клеток ([Добыча](../gameplay/haul.md)).\n- 2026-11-11: экрана трюма и сетки больше нет; добыча — ряд слотов на HUD над панелью расходников ([Добыча](../gameplay/haul.md)).\n- 2026-11-06 — 2026-11-07: владельцу не нравятся меню и кнопки; построены варианты на выбор.\n- 2026-11-11: кнопки базы и места верфи стали прозрачными стеклянными плитками с движением; палитра собрана в одном месте.\n- 2026-11-12: весь облик собран в одной теме Godot, чтобы менять его одной правкой; стекло стало чуть менее прозрачным.\n- 2026-11-12: в стекле меню, колпачки клавиш, выноски, карточки верфи и HUD. Проверка облика в два круга; HUD отказался от преломления ради времени кадра.\n"}, {"id": "art-light", "path": "art/light.md", "title": "Свет и время суток", "section": "art", "date": "2026-11-17", "md": "# Свет и время суток\n\nОдно небо и одно солнце на всю сцену; час суток держится весь заход.\n\n## Решения владельца\n- Каждый час суток выглядит правильно. Ночь для скрытности появится позже.\n- Время суток идёт: сутки за 12 минут игры (2026-11-16). Сменено: час держался на месте весь заход.\n- Ночь лунная и синяя: прохладный лунный свет с серебряной дорожкой бликов на воде, заметно темнее дня, но всё читается.\n- Рассвет и закат тёплые и проходят через сумерки в синюю ночь.\n- Все модели, и из Blender, и построенные в коде, несут запечённое затенение неба: свет неба гаснет в углах, под палубами, в комнатах и между листьями. Оно гасит только свет неба, а тени солнца и луны остаются живыми, поэтому верно в любой час, и когда солнце и луна будут двигаться (2026-11-16).\n- Ночь проходит быстрее дня: около восьми с половиной минут светло, две с половиной ночь, сумерки по полминуты; мир начинается в 13:00 (2026-11-17).\n- 2026-11-17: час суток и погода сохраняются вместе с миром: загруженная игра продолжается с того же часа и той же погоды.\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n"}, {"id": "art-materials", "path": "art/materials.md", "title": "Материалы", "section": "art", "date": "2026-11-17", "md": "# Материалы\n\n![Палуба ялика из выгоревшего тика у пирса](../img/materials.jpg)\n\nИз чего сделаны твёрдые поверхности сверх краски: дерево и металл. Свет на них — [Свет и время суток](light.md).\n\n## Решения владельца\n- Дерево похоже на дерево: видны доски и швы, волокна только вблизи, тон немного разный от доски к доске. Дерево — выгоревший тик (2026-11-16).\n- Металл блестит (2026-11-16). Если блеск дорог для кадра, он не нужен: металл видно в основном издалека; его можно включать по условию.\n- Только шейдер, без скачанных текстур (2026-11-16).\n"}, {"id": "art-palette", "path": "art/palette.md", "title": "Палитра", "section": "art", "date": "2026-11-17", "md": "# Палитра\n\n![Палитра на стенде Components](../img/palette.jpg)\n\nОфициальная палитра игры: каждый цвет интерфейса назван по своей роли. Имена ролей — в `game/ui/Hue.cs`, значения — в теме игры `game/ui/look.tres` (тип `Hue`, [Компоненты](components.md)); здесь — роли. Стенд `Components` рисует хранимые цвета прямо из темы.\n\n## Решения владельца\n- 2026-11-11: у игры есть официальная палитра и базовые компоненты; интерфейс — стекло в духе Frutiger Aero ([Арт-дирекшн](README.md)).\n- Цвета держат по одному смыслу: оранжевый — игрок и захват, красный — охотники, золотой — цель и места, аква — союзники и приборы, синий — броня ([HUD](../interface/hud.md)).\n- 2026-11-13: палитра слишком большая, и не все цвета сочетаются. Не бояться убрать цвет и взять на его место другой. Оставшиеся четыре места — два жёлтых, свои цвета деталей, краски ящиков, стекло синее лагуны — взять все.\n- 2026-11-17: палитра — как сейчас.\n- 2026-11-17: цвета-сигналы мира — как сейчас.\n"}, {"id": "art-people", "path": "art/people.md", "title": "Люди: флоппы", "section": "art", "date": "2026-11-17", "md": "# Люди: флоппы\n\n![Капитан](../img/captain.jpg)\n\nКто живёт в мире и как выглядит. Как они говорят: [Диалоги и голос](../story/dialogue.md).\n\n## Решения владельца\n- Все в мире — флоппы: каракалы, круглые и тяжёлые, с высокими ушами в чёрных кисточках, тёмными полосами от глаз к носу и светлыми подбородком и грудью. Людей нет.\n- Флоппы сидят, как сидят кошки, передние лапы рядом перед собой; никто ничего не держит (владелец, 2026-11-06). На них немного одежды мира: старого — найденной, выцветшей и залатанной, — с льном и плетёными вещами нового.\n- Каждый — свой вкус флоппы: окрас шерсти, сложение и возраст, одежда и снаряжение на нём (шляпа, очки, фартук, бухта троса, свисток). Сверху их узнают по этому.\n- Они живут в гавани, на верфи и в море: на берегах и причалах. На лодках команд не видно.\n- Они окрашены и освещены как лодки: насыщенные цвета, тот же свет.\n- Флоппы на берегах и причалах — жизнь вокруг боя, с ними не играют.\n- Их моделируют в Blender из кода, как пирс.\n- 2026-11-17: выражений портретов пока хватает: портреты — заглушки, их набор решим ближе к релизу.\n\n## Портреты\n- Большие портреты для диалогов — заглушки до рисунков художника ближе к релизу. Их нарисовала локальная модель изображений по фото настоящего флоппы. С 2026-11-07 владелец запретил картинки от ИИ: новые портреты так не делаются, а уже нарисованные остаются, пока владелец не скажет иначе. Скрипты, которыми их рисовали, убраны из `tools/` 2026-11-08 и остались в истории git.\n- Портреты есть у ролей без имён: капитан, корабел, мытарь. У каждого портрета четыре лица: ровный взгляд, доволен, удивлён, сердит. У восьми капитанов-соперников свои портреты с теми же четырьмя лицами (`rival-*`, [Соперники](../gameplay/rivals.md)); охотникам на HUD достаётся случайное лицо из этих восьми ([HUD](../interface/hud.md)).\n"}, {"id": "art-world-look", "path": "art/world-look.md", "title": "Облик мира", "section": "art", "date": "2026-11-17", "md": "# Облик мира\n\nКаким выглядит мир: острова, мелководье, открытое море и след лодки. Как море устроено, на странице [Море](../world/sea.md); свет и часы — [Свет и время суток](light.md).\n\n## Решения владельца\n- Мир выглядит так, как его показывают картинки меню: кремовый песок, сочная яркая зелень и пышные пальмы на острове базы, спокойное прозрачное море у островов с мягкой широкой каустикой на песчаном дне — видной, но не рябящей, и слабые тени облаков, плывущие над водой и сушей. Остров базы сохраняет своё низкое послеполуденное солнце.\n- В открытом море вода глубокая, насыщенно-синяя, с видными волнами и бликами солнца, без зерна.\n- След лодки: короткий белый бурун сразу за кормой, дальше след распадается на тонкое кружево и светлую бирюзу от пузырьков и быстро тает; никаких клякс. Пена принадлежит воде.\n- 2026-11-14: воду переделать целиком. Облик — как в Sea of Thieves: крупные плавные валы, бирюзовый свет в гребнях, белая пена узором, насыщенные цвета. В нынешней воде не нравятся рябь и зерно, плоский цвет, пена и след. Волны умеренные: хорошо видны и качают лодку, управлению не мешают. [План](../reports/2026-11-14-water-overhaul.md).\n- 2026-11-15, после плейтеста: в сравнении игрокам больше нравилось прежнее море. Новое слишком гладкое, у него не чувствуется текстура и нет бликов, а они давали морю жизнь. Образцы воды — Port Royale 4 (особенно солнце на воде), Anno 1800 и Anno 117. King of Seas слишком блёклая, Bad North — стилизация, не наша вода. Планка — лучшие инди или начальный AAA. Облик воды владелец доверил Claude и проверке облика: что улучшает вид, делается без вопроса. Эта запись меняет «без зерна» и «не нравятся рябь и зерно» выше: рябь и блики морю нужны.\n\n## Как к этому пришли\n- **Морской проход** (2026-10-29): экспозиция под удерживаемый час, прибой как боры, кусты морской травы.\n- **Картинки меню** (2026-11-06): владельцу понравился мир на картинках меню, и облик подогнали под них: песок, зелень, пальмы, каустика, мягкая светлая картинка, облачные тени. Угол и дальность камеры выбрал QA-агент за несколько проходов ([Камера и картинка](../gameplay/camera.md)).\n- **После игры** (2026-11-07): вид оказался слишком близким, а открытое море бледным. Зум и тон вернули, спокойная поверхность осталась только над банками, каустика стала мягче, пена — кружевом.\n- **Вода заново, шаги 1 и 2** (2026-11-14): открытое море получило цвет по форме волны: гребень светится, резко спереди и тая по спине, перед ним тёмная вода, а цвет гребня держится отдельно от бирюзы мелководья; рябь перестала наклонять поверхность, блик солнца берёт цвет воды, камера стала положе, а волны локаций заданы высотой и длиной. Проверка облика на экране владельца завернула два варианта: бирюзовые пятна на гребнях читались как мели, а плоские синие ленты — как рисунок.\n- **Вода заново, шаг 3** (2026-11-15): вся пена рисуется узором: свежая — белая с дырами, старая — кружево из нитей, под ней вода светлеет к бирюзе. На самых крутых гребнях открытого моря появились барашки: короткие кружевные полосы, которые тают за пару секунд; они реже и бледнее следа лодки и попаданий, чтобы бой читался. Прибой кладёт пену только там, где волны ломаются всерьёз, и вода у причалов чистая.\n- **Вода заново, шаг 4** (2026-11-15): след лодки — белый бурун за кормой длиной около корпуса, который распадается на струи вдоль хода, потом на кружево над светлой бирюзой; на малом ходу остаётся одно кружево. У бортов на ходу идёт тонкая линия пены, а у лодки на волне пену бьёт о борт. Попадание оставляет на воде пятна пены и бирюзы на несколько секунд. У скал, останцев и берегов море белеет тонкой кромкой.\n- **Поправка после плейтеста** (2026-11-15): лицо воды снова читает волны так же мелко, как прежнее море, поэтому вернулись его текстура и мягкая серебряная дорожка к солнцу; над дорожкой лежат мелкие искры, ночью то же под луной. Форму длинных волн по-прежнему рисует цвет. Свежая пена держится белой чуть дольше, бурун за кормой чуть длиннее и расходится веером. Позже в тот же день, по замечаниям владельца: бурун снова остаётся за кормой и рвётся в полёте, посадка оставляет белое пятно, след над банкой больше не темнит воду, а пена у берега выходит на песок накатом без линии у уреза. Первый вариант поправки перестарался: искр было в несколько раз больше, чем у прежнего моря, и белых, как пена; проверка облика это завернула ([как это вышло](../reports/2026-11-14-water-overhaul.md)).\n- **Вода заново, шаг 6** (2026-11-16): с той стороны, откуда идут волны, у края рифа лежит белая полоса прибоя, а подножие скал стоит в белом кольце, как у Anno 117.\n- Картинки меню были нарисованы моделью; с 2026-11-07 облик показывают только кадры игры ([Арт-дирекшн](README.md)).\n"}, {"id": "audio-music", "path": "audio/music.md", "title": "Музыка", "section": "audio", "date": "2026-11-17", "md": "# Музыка\n\nМузыка складывается прямо во время игры и растёт вместе с боем; играет её радио лодки, станции которого игрок листает. Остальной звук: [Звук](sound.md).\n\n## Решения владельца\n- 2026-11-13: игра должна ощущаться как старые GTA с видом сверху. Музыка — радио лодки, как радио в машине: несколько станций, которые игрок листает, и «выключено». Убийства и задания объявляют крупные строки диктора ([HUD](../interface/hud.md)).\n- Музыка делается на ходу, как её делает Sonic Pi: она нарастает вместе с боем, а события играют собственные мелодии, все в одной гармонии.\n- Её звук — глянцевый джаз-фьюжн 2000-х, под стать интерфейсу, на записанных инструментах: аккорды FM-электропиано, мелодия маримбы, электробас, ведущая партия чистой электрогитары, живые барабаны с конгами и бонго и трубы для фанфар при победе.\n- Музыка верна; у каждой локации своя тональность, лад и темп.\n- 2026-11-16: шанти поют команды рабочих лодок, а не радио: они лучше подходят другим лодкам ([Звук](sound.md)). Поёт команда котов: запевала мяукает мелодию по слогам настоящих слов, как коты говорят в диалогах, команда отвечает хором. Песни — старинные народные шанти XIX века, общее достояние. Инструменты — записи CC0. Сменено: пятая станция радио «Шанти» (в тот же день).\n- 2026-11-17: шанти поют только рыбаки и грузовозы, паром молчит. Песни, слышимость до 150 м и радио, уступающее поющей команде, остаются как есть.\n- 2026-11-17: на ответах шанти поёт больше котов, целый хор, а не двое ([Задачи](../todo.md)).\n- 2026-11-17: четыре станции радио и «выключено» — как сейчас.\n- 2026-11-17: «выключено» глушит всю музыку, и мотивы, и фанфары — как сейчас.\n"}, {"id": "audio-sound", "path": "audio/sound.md", "title": "Звук", "section": "audio", "date": "2026-11-17", "md": "# Звук\n\nКак в игре звучат бой, лодки и интерфейс. Музыка описана отдельно: [Музыка](music.md).\n\n## Решения владельца\n- Звук по умолчанию включён. Кадры демо немые.\n- 2026-11-13: звуки нужно улучшить радикально; сначала исследовать, как это делают на GitHub, потом применить лучшее из исследования целиком, ничего не оставляя на потом. Новые записи — только CC0 с Freesound.\n- 2026-11-16: фона открытого моря слишком много. Волны стали тише на 6 дБ, ветер — на 3.\n- 2026-11-16: шанти поют команды рабочих лодок, а не радио ([Музыка](music.md)).\n- 2026-11-17: стеклянный журнал звучит так: открывается шелестом карточки, запись — стеклянный звон захвата на терцию выше.\n- 2026-11-17: звуки припасов, дыма, добычи, рыбы и лебёдки — как сейчас; владелец поправит на слух.\n- 2026-11-17: приседание музыки, моря и моторов под взрывами — как сейчас; владелец поправит на слух.\n- 2026-11-17: приглушение мира под меню — как сейчас; владелец поправит на слух.\n- 2026-11-17: слияние залпа — как сейчас; владелец поправит на слух.\n- 2026-11-17: мотор мимо выше и ниже — как сейчас; владелец поправит на слух.\n- 2026-11-17: взрывы по весу — как сейчас; владелец поправит на слух.\n- 2026-11-17: опоздание звука далёкого взрыва — как сейчас; владелец поправит на слух.\n- 2026-11-17: холостой ход мотора — как сейчас; владелец поправит на слух.\n- 2026-11-17: звук рывка нитро — как сейчас; владелец поправит на слух.\n- 2026-11-17: шлепок посадки — как сейчас; владелец поправит на слух.\n- 2026-11-17: звуки моментов — как сейчас; владелец поправит на слух.\n- 2026-11-17: тик попадания — как сейчас; владелец поправит на слух.\n- 2026-11-17: вибрация геймпада — как сейчас; владелец поправит на слух.\n- 2026-11-17: звуки острова — как сейчас; владелец поправит на слух.\n- 2026-11-17: звуки меню — как сейчас; владелец поправит на слух.\n"}, {"id": "base-boatyard", "path": "base/boatyard.md", "title": "Верфь", "section": "base", "date": "2026-11-17", "md": "# Верфь\n\n![Верфь: карточки деталей и панель показателей](../img/boatyard.jpg)\n\nВерфь — экран у причала [гавани](pier.md), где лодка собирается из деталей. Открывается только у причала, с ленты пришвартованной лодки.\n\n## Решения владельца\n- 2026-11-13: верфь показывает обычный изометрический вид, тот же, что в бою. Низкий вид сбоку, который игрок крутил сам (решение 2026-11-10), владелец увидел и назвал странным. Лодка по-прежнему сама подъезжает в кадр, а выбор детали вид не двигает.\n- Верфь у пирса: лодка настраивается там, где стоит, на живой воде. Не в открытом море.\n- Верфь — нижняя лента, как гараж NFS: категории плитками вдоль низа, над ними ряд карточек деталей с ценой и весом, показатели справа, кошелёк; мышь, клавиши и геймпад. Значков на лодке, по которым надо щёлкать, нет.\n- Верфь открывается только в гавани у причала, никогда в море.\n- Верфь показывает монеты на руках в углу, на глянцевой табличке-кошельке рядом с жетоном-монетой: монеты везде выглядят одинаково. Счёт убывает по мере покупки детали, а каждая цена показывает, хватает ли монет. Деталь, на которую наведён фокус в ряду, имеет фокус меню, светится аква под аквамариновым кольцом; оранжевым отмечена только установленная деталь.\n- Деталь, на которую наведён фокус, стоит на лодке призраком: прозрачным и светящимся аква, корпус показан призраком целиком, и лодка сидит в воде так, как села бы с ней. Если снова навести на установленную деталь или выйти, лодка возвращается к установленному. Установленная деталь встаёт с небольшой осадкой и бликом.\n- 2026-11-12: карточки деталей и экран показателей — в стекле, как плитки ([Компоненты](../art/components.md)).\n- Выход с верфи: «Готово», Esc и Tab оставляют лодку как построена. Проект, который утонул бы, сперва предупреждает, потом оставляет последний проект за визит, который держался на плаву.\n- 2026-11-13: кнопки «Испытать» и полигона нет, владелец убрал их целиком.\n- 2026-11-17: панель показателей верфи — как сейчас.\n- 2026-11-17: верфь — как сейчас.\n- 2026-11-17: примерка на верфи — как сейчас.\n- 2026-11-17: вид верфи — как сейчас.\n"}, {"id": "base-pier", "path": "base/pier.md", "title": "Гавань: мастерская корабела", "section": "base", "date": "2026-11-17", "md": "# Гавань: мастерская корабела\n\n![Мастерская корабела в лагуне, лодка у причала](../img/pier.jpg)\n\n![Лодка у причала: вид боя придвинут, над морем лента](../img/pier-moored.jpg)\n\n![Корабел принимает добычу у причала](../img/trader-harbour.jpg)\n\nГавань — мастерская корабела на сваях в лагуне острова `Home cay` на карте [мира](../gameplay/missions.md). Это место открытого мира, а не отдельный экран: к ней доплывают, швартуются на `Space`, продают добычу корабелу, заходят на [верфь](boatyard.md) и отчаливают.\n\n## Решения владельца\n- Пирс на острове — не хаб, а одно из мест открытого мира; его облик строится под вид боя (2026-11-13).\n- Это мастерская корабела: один короткий причал и мастерская на сваях — сарай, слип с лодкой на тележке, лебёдка, топливная колонка. Сразу видно, что здесь чинят, строят и покупают добычу (2026-11-13).\n- Дух — старое дерево, канат и латунь, плюс немного соларпанка в родстве со [станцией «Мария»](../world/outpost.md): грядки и зелень на крышах, солнечные панели, маленький ветряк, стеклянные поплавки (2026-11-13).\n- Экрана базы нет. Пришвартованная лодка остаётся в мире у причала, вид боя лишь плавно приближается к ней. Над морем короткая лента: «Торговец», «Верфь», «Отчалить». Кооператив, судовой журнал и настройки — в меню `Esc`. Товарищи видят лодку у причала прямо в мире (2026-11-13).\n- Плитка «Торговец» продаёт и то, что осталось непроданным: ящики можно продать позже, не выходя снова в море (2026-11-13).\n- Ориентир — высокая сигнальная мачта у причала: вымпел по ветру днём, тёплый фонарь ночью. Вещь мира, без лучей и неона (2026-11-13).\n- Игра начинается сразу в открытом мире в море, а в гавань нужно приплыть самому и пришвартоваться на `Space` (или D-pad Вниз на геймпаде), сбавив ход вдали от охотников (2026-11-10).\n- У причала кнопки, как в NFS или World of Warships, а не предметы, по которым надо щёлкать (2026-11-10). Монеты показаны жетоном и числом, без подписи.\n- Место швартовки отмечено кольцом стеклянных поплавков, как старые рыбацкие: в каждом маленький тёплый огонёк, они качаются на волне, под ними мягкий бирюзовый свет в воде. Цвета — аква и тёплые огоньки. Столба света и лампы, красящей всё вокруг, нет. Издалека кольцо спокойно; когда лодка подошла и можно причалить, свет мягко разгорается и дышит (2026-11-12). Так же отмечена станция.\n- Неоновый танцующий свет, как маркеры миссий в Vice City (2026-11-11), владелец увидел и отверг: слишком ярко, слишком пёстро, неестественно.\n- Модель сделана в Blender.\n- 2026-11-17: мастерская корабела стоит на сваях в лагуне, с длинными мостками к пляжу, как сейчас.\n- 2026-11-17: кольцо стеклянных поплавков у пирса и станции — как сейчас; оно же и граница, где торгуют.\n- 2026-11-17: швартоваться можно и на скорости: лодка просто резко останавливается у места. Остальное о швартовке — как сейчас.\n- 2026-11-17: над лодками товарищей в мире видны их имена.\n"}, {"id": "decisions", "path": "decisions.md", "title": "Журнал решений", "section": "", "date": "2026-11-19", "md": "# Журнал решений\n\nКрупные решения владельца по датам, с отвергнутым и откаченным, чтобы не повторять. Само решение — на странице темы; здесь только когда и почему. Почти всё сделанное с конца октября 2026 владелец ещё не играл.\n\n## Октябрь 2026\n- **10-15** Игра должна играться: всё встраивать в живую игру, настоящий прототип, а не «текст и кнопки».\n- **10-26** Симулятор архипелага снят целиком; вся игра — аркадный морской бой: статичный изометрический вид, одна лодка без физики, но с ощущением моторной лодки, огонь с бортов на `Q`/`E`. «Ощущается потрясающе». Старая игра хранится под git-тегом `simulator-game`. → [Об игре](vision.md)\n- **10-26** Лодку собирают из деталей на верфи; вес важен; красивый экран характеристик; без свободных корпусов и многокорпусных. Нарисованный корпус — это физический корпус. → [Верфь](base/boatyard.md)\n- **10-26** Один остров на банке с мелководьем рядом, чтобы море было красивым. → [Море](world/sea.md)\n- **10-26** 60 кадров в секунду достаточно, качество важнее. → [Об игре](vision.md)\n- **10-26** Отвергнуто: глиссирование, поднявшее корпус, — пропало «прыгание по волнам», откачено; корпуса едут по кильватерам. 10-31: это весело, но не опора игры.\n- **10-26** Отвергнуто: тёмные стеклянные карточки интерфейса — «безлико, как сгенерировано ИИ». → [Арт-дирекшн](art/README.md)\n- **10-27** Делать, как делают игры: сначала выпущенные игры и самый простой подход, симуляции и статьи — только когда простого не хватает. → [CLAUDE.md](../CLAUDE.md)\n- **10-27** Отвергнуто: погода (туман, дождь, шторм, гром) построена и снята целиком. → [Погода](world/weather.md)\n- **10-27** Отвергнуто: лор с придуманными словами — откачен; владелец выбирает лор по кускам. → [Сеттинг и лор](story/setting.md)\n- **10-28** Настоящие моторные лодки вместо коробок на плите. → [Облик лодок](art/boats.md)\n- **10-28** Ракеты на открытых рельсовых стойках, прямые и быстрые. Раньше плоские выстрелы были «слишком быстрыми», потом были дуговые шары. → [Бой](gameplay/combat.md)\n- **10-28** Пена симулирована и принадлежит воде; брызги урезаны как «чрезмерные». → [Облик мира](art/world-look.md)\n- **10-28** Звук — слои записей CC0 с Freesound; список загрузок одобряет владелец. → [Звук](audio/sound.md)\n- **10-29** Каждая деталь — лучший выбор для какой-то лодки; детали, худшие во всём, убраны. Вес стоит скорости. → [Лодка](gameplay/boat.md)\n- **10-29** Демо и проверки в `game/demos`; игра ничего не несёт для тестов.\n- **10-29** Сборки для Mac и Windows, версия на каждый пост.\n- **10-29** Отвергнуто: образец HUD из авиасимулятора снят. → [Стиль интерфейса](art/interface.md)\n- **10-30** Отвергнуто: усиленные стилизованные кильватерные волны — «выглядят плохо», откачены. → [Арт-дирекшн](art/README.md)\n- **10-30** Охотники: таранщики, торпеды, стаи, припасы, дым, один ИИ-планировщик на всех. → [Охотники и ИИ](gameplay/hunters.md)\n- **10-31** Миссии, а не открытый мир; топливо ограничено; база — эллинг из Blender, с неё начинается игра. Отвергнуто: первая база, жёлтый дом с красной крышей. Миссии сменила арена 11-09, эллинг — пирс 11-10. → [Открытый мир](gameplay/missions.md), [Пирс](base/pier.md)\n- **10-31** Миссия начинается в море, со вступительного пролёта низко у борта. Пролёт снят 11-11. → [Миссии](gameplay/missions.md)\n- **10-31 — 11-01** Лунная ночь и тёплый рассвет. → [Свет и время суток](art/light.md)\n\n## Ноябрь 2026\n- **11-01 — 11-02** Места промысла с видом сбоку; редактор карт с картами в JSON. → [Места промысла](gameplay/sites.md), [Редактор карт](tools/map-editor.md)\n- **11-02** Гоночные ливреи, банда охотников в малиновом, рубки и приметы соларпанка. → [Облик лодок](art/boats.md)\n- **11-02** Интерфейс — вещи мира; образцы Frutiger Aero и Utopian Scholastic. → [Стиль интерфейса](art/interface.md)\n- **11-02** Сеттинг назван: оптимистичный соларпанк после падения. → [Сеттинг и лор](story/setting.md)\n- **11-02** Посты в канале по-русски, каждый одобряет владелец; вышла 0.0.2.\n- **11-03** Название — Floppa Tropical Adventures. Все жители — флоппы. → [Люди: флоппы](art/people.md)\n- **11-03** Кампании пока нет; детали покупают за монеты; пустой бак проваливает миссию (снято 11-09); без тепловизора дым прячет цели; автосохранение. Отвергнуто: открытие деталей с каждых обломков. → [Прогресс и сохранения](gameplay/progression.md)\n- **11-03** Музыка на семплах инструментов CC0. → [Музыка](audio/music.md)\n- **11-04** Все замечания QA по интерфейсу исправлены, добавлен геймпад. → [Управление](interface/controls.md)\n- **11-04** Простейший кооп по локальной сети. → [Онлайн-кооп](online.md)\n- **11-06** Никто из флопп ничего не держит в лапах. → [Люди: флоппы](art/people.md)\n- **11-06** Голос — кошачий лепет на каждую букву, а не речь; анимированные метки текста. → [Диалоги и голос](story/dialogue.md)\n- **11-06** Сюжет — сцены во встроенном редакторе: граф и сценарий, ветки, условия, приоритеты, триггеры. → [Сцены сюжета](story/scenes.md)\n- **11-06** Топливо считается расстоянием, лимита скорости нет, броня — броневой пояс на своём месте верфи, торпедные аппараты под водой. → [Лодка](gameplay/boat.md)\n- **11-06** Директор шлёт набеги в затишья по бюджету угрозы.\n- **11-06** Зоны и опасности на картах. → [Зоны и опасности](world/areas.md)\n- **11-06** Полигон у базы с мишенями-макетами.\n- **11-06** Горы, барьерные рифы, морские столбы, косы и отмели. → [Рельеф](world/ground.md)\n- **11-06** Мир — как на картинках меню. → [Облик мира](art/world-look.md)\n- **11-06 — 11-07** Отвергнуты все облики меню с картинок, громкие и утончённые. → [Арт-дирекшн](art/README.md)\n- **11-07** Никаких картинок, сгенерированных ИИ. → [Арт-дирекшн](art/README.md)\n- **11-07** Страница настроек и русский перевод. → [Язык](interface/language.md)\n- **11-07** После игры: вид слишком близко, открытое море бледное — зум и тон возвращены. → [Камера и картинка](gameplay/camera.md)\n- **11-07** Пять новых стилей игры: преследователь, турельщик, носитель дронов, минёр, загонщик; без подлодки и без медленного танка. → [Сборки и стили игры](gameplay/builds.md)\n- **11-07** Облик всей игры заново, от геймплея: шесть обликов на стенде. Владелец ещё не выбрал.\n- **11-08** Документация переехала в эту вики, по-русски; `docs/` убран. → [Главная](README.md)\n- **11-08** Сеть за кормой заменена трюмом, как рюкзак в шутерах с выносом добычи: сетка клеток по корпусу, предметы ложатся сами, защищённого контейнера нет. Сетку сменили ящики 11-11. → [Добыча](gameplay/haul.md)\n- **11-08** Вступительный пролёт быстрый, 2–3 секунды, с целью миссии под названием; карточки врагов убраны 11-10, сам пролёт — 11-11. → [Миссии](gameplay/missions.md)\n- **11-09** Вид следует за лодкой, а в аренах стоит над ареной, и миссия проигрывает вставки по кадрам из редактора карт; лодка несёт снаряжение по размеру корпуса; крафта нет, детали только покупаются; в коопе товарищ возвращает потопленную лодку у обломков, а меню паузы онлайн не останавливает бой. → [Камера и картинка](gameplay/camera.md), [Лодка](gameplay/boat.md), [Прогресс и сохранения](gameplay/progression.md), [Онлайн-кооп](online.md)\n- **11-09** Уровней и выбора уровня нет, торговой точки тоже: в эллинге одна кнопка «На арену», она начинает единственный уровень. Монеты остаются и покупают детали в верфи, добыча продаётся сама на квитке по возвращении домой. → [Пирс](base/pier.md), [Прогресс и сохранения](gameplay/progression.md), [Добыча](gameplay/haul.md)\n- **11-09** Основное оружие — турель, она стоит на стартовой лодке; ракеты — дополнение, покупаются в верфи. → [Бой](gameplay/combat.md)\n- **11-09** Дельфины убраны из игры: модель, код и демо. → [Об игре](vision.md)\n- **11-09** Арена — один большой уровень и бесконечный заход, внутри случаются события из прежних видов миссий (конвой, курьер, маяки, груз, броненосец); кончается выходом или гибелью, добыча продаётся на квитке. → [Открытый мир](gameplay/missions.md)\n- **11-09** Крюка нет: владелец убрал крюк, лебёдку и буксир. → [Лодка](gameplay/boat.md)\n- **11-09** Ракеты и торпеды наводит курсор в веере своего борта, щелчок стреляет бортом под курсором; клавиши смены захвата нет. Мышь снята 11-10: точку прицела даёт правый стик. → [Бой](gameplay/combat.md)\n- **11-09** Ракеты врагов летят медленнее ракет игрока, чтобы от них уворачиваться; удар носом на нитро — приём любой лодки. → [Бой](gameplay/combat.md)\n- **11-09** Пустой бак больше не проваливает поездку: лодка ползёт домой с добычей. Вес добычи не наказывает за полный трюм. → [Лодка](gameplay/boat.md), [Добыча](gameplay/haul.md)\n- **11-10** База — открытый пирс в лагуне вместо эллинга; база и верфь на лентах плиток, как гараж NFS, без предметов и значков для щелчка; лодки товарищей по кооперативу стоят у того же пирса. → [Пирс](base/pier.md), [Верфь](base/boatyard.md)\n- **11-10** Ракету парируют ракетой; нитро — рывок, которым уходят от ракет, крутой, а не правдоподобный. → [Бой](gameplay/combat.md), [Лодка](gameplay/boat.md)\n- **11-10** Соперников в игре нет; у каждого врага случайное лицо. Соперники вернулись 11-15. → [HUD](interface/hud.md)\n- **11-10** Открытый мир вместо «хаб + миссии»: игра по умолчанию сразу начинается в море на арене, а база — это гавань (пирс) на острове, к которой нужно доплыть и пришвартоваться на `Space`; буи выхода убраны из игры, выход из гавани возвращает лодку от пирса в то же живое море, а гибель показывает «Погиб» и перезагружает последнее сохранение. → [Открытый мир](gameplay/missions.md), [Пирс](base/pier.md), [Добыча](gameplay/haul.md)\n- **11-11** В море стоит плавучая торговая ботаническая станция, большой корабль по картинке владельца, смоделированный в Blender; у неё продают добычу; её стёкла прозрачные, новый материал для игры. Этим отменено «торговой точки нет» от 11-09 в части места в море. → [Станция](world/outpost.md)\n- **11-11** Директора нет: охотники выходят только с постов, поставленных на карте, их виды выбирают в редакторе; охотник гонится за лодкой, пока видит её, и забывает, когда она ушла из вида. → [Зоны и опасности](world/areas.md), [Охотники и ИИ](gameplay/hunters.md)\n- **11-11** Разовые расходники, собранные из добычи в трюме, и панель быстрого доступа на 1–4; детали по-прежнему только покупаются. → [Добыча](gameplay/haul.md), [Управление](interface/controls.md)\n- **11-11** Вступительной сцены нет: заход сразу начинается в виде боя, руль у игрока, HUD на месте, охотники живы. → [Открытый мир](gameplay/missions.md)\n- **11-11** Стрелок вокруг лодки на HUD нет: HUD не указывает на то, что за экраном. → [HUD](interface/hud.md)\n- **11-11** У ракет и снарядов предельная дальность: на краю досягаемости заряд гаснет в воздухе, дальше ничего не летит. → [Бой](gameplay/combat.md)\n- **11-11** Место швартовки отмечено цветным медленно танцующим светом на воде, как маркеры миссий Vice City, вместо пунктирного круга HUD. Сменён поплавками 11-12. → [Пирс](base/pier.md)\n- **11-11** Ящики вместо сетки: экран трюма и сетка ушли, добыча — несколько видов ящиков в ряду слотов на HUD, расходники тратят ящики клавишами 1–4, полный трюм сам меняет дешёвое на дорогое, утонув, теряешь всё. Отменяет сетку от 11-08 и «HUD не показывает счёта добычи». → [Добыча](gameplay/haul.md), [HUD](interface/hud.md)\n- **11-11** Интерфейс — прозрачное стекло Frutiger Aero с красивым движением, начиная с кнопок базы; у игры официальная палитра и базовые компоненты. → [Арт-дирекшн](art/README.md), [Палитра](art/palette.md), [Компоненты](art/components.md)\n- **11-12** Место швартовки — кольцо стеклянных поплавков с тёплыми фонарями: неоновый свет владелец увидел и отверг как слишком яркий, пёстрый и неестественный. → [Пирс](base/pier.md)\n- **11-12** Стекло идёт дальше плиток базы: меню, карточки деталей верфи и HUD. → [Компоненты](art/components.md), [HUD](interface/hud.md), [Экраны и меню](interface/screens.md)\n- **11-12** Облик интерфейса живёт в одной теме Godot (`game/ui/look.tres`): палитра, шрифты, роды стекла, размеры деталей; его меняют там, а не переносят по частям. Стекло чуть менее прозрачно. → [Компоненты](art/components.md), [Палитра](art/palette.md)\n- **11-12** Цель игры — сюжетная линия поручений флопп в гавани и на станции: по одному разом, выполненное открывает следующее, новые детали и места, в конце финальный босс; первое поручение — обучение по рации. Сложность одна: её задаёт мир (слабые посты у гавани, сильные дальше), в коопе посты крепнут с числом игроков; у старта новой игры слабый пост. «Арена» и «заход» переименовываются везде (плитка «В море», мир — мир). → [Об игре](vision.md), [Прогресс и сохранения](gameplay/progression.md), [Сцены сюжета](story/scenes.md)\n- **11-12** Станция покупает добычу дешевле гавани и продаёт ремонт и топливо за монеты, деталей не продаёт. → [Станция](world/outpost.md)\n- **11-12** Бой: гонщик, преследователь и таранщик остаются на 22–23 м/с; ракеты врагов быстрее (около 55 м/с на ходу), увернуться было слишком легко; неуязвимость в рывке нитро только у лодок игроков; таран снимает с целой лодки не больше половины корпуса; турель игрока бьёт по захваченной цели, пока та в радиусе, иначе по ближайшей; припасы падают реже, раз в ~40 с. → [Бой](gameplay/combat.md), [Лодка](gameplay/boat.md), [Припасы](gameplay/pickups.md), [Охотники и ИИ](gameplay/hunters.md)\n- **11-12** В стекло переходят диалог (ответы списком, как меню, имя мелкой подписью), циферблат рыбалки и экран показателей верфи; стекло HUD остаётся без преломления. → [Компоненты](art/components.md), [HUD](interface/hud.md)\n- **11-12** Тема одна на всё: каждая деталь интерфейса, диалог тоже, берёт облик из `look.tres`; прежние решения о виде отдельной детали исключением не служат. → [Компоненты](art/components.md)\n- **11-13** Вся бумага интерфейса становится стеклом: бумажных вещей, скотча и рукописного шрифта в нём не остаётся. Карта — прозрачное стекло с линиями света; судовой журнал — окно матового стекла со строками. Заменяет «интерфейс из вещей мира» (11-02). → [Компоненты](art/components.md), [Стиль интерфейса](art/interface.md)\n- **11-13** Продажа — экран торговца, как в играх о рыбалке и торговле с лодки: слева торговец с короткой репликой в стеклянной выноске (в гавани корабел, на «Марии» мытарь), справа трюм ящиками с ценами; ящик продаётся выбором, есть «Продать всё», непроданное остаётся на борту и продаётся позже с плитки «Торговец» на ленте причала. Итог захода не показывается. → [Добыча](gameplay/haul.md), [Станция](world/outpost.md)\n- **11-13** Дорожная карта до полного релиза в Steam, планка — 90 на Metacritic. Порядок этапов: что это за игра; срез и рядом с ним чужие машины и страница Steam; демо; ранний доступ; релиз 1.0. Что внутри этапов и сроки — пока предложение. → [Дорожная карта](roadmap.md)\n- **11-13** Гавань на острове — не хаб, а место открытого мира: мастерская корабела на сваях (сарай, слип, лебёдка, топливная колонка, один короткий причал), дерево и немного соларпанка, сигнальная мачта с вымпелом и фонарём. Экрана базы нет: пришвартованная лодка остаётся в мире, над морем лента «Торговец», «Верфь», «Отчалить», а кооператив, журнал и настройки — в меню `Esc`. Сменено: пирс с четырьмя местами и экран базы с плиткой «На арену» (11-10). → [Гавань](base/pier.md), [Экраны и меню](interface/screens.md), [Онлайн-кооп](online.md)\n- **11-13** Полигона нет: владелец убрал кнопку «Испытать» на верфи и полигон с мишенями-макетами. → [Верфь](base/boatyard.md)\n- **11-13** Палитра слишком большая, и не все цвета сочетаются: не бояться убрать цвет и взять другой. Из 82 хранимых цветов осталось 21. → [Палитра](art/palette.md)\n- **11-13** Вид верфи — обычный изометрический, как в бою. Низкий вид сбоку, который крутил игрок (11-10), владелец увидел и назвал странным. → [Верфь](base/boatyard.md)\n- **11-13** Звук и эффекты боя улучшить радикально: исследовать, как это делают на GitHub и в других играх, и применить лучшее целиком, ничего не оставляя на потом; новые записи — только CC0 с Freesound. Вопросы облика для этой работы сняты, решения без владельца — в вопросах Q210–Q221 и Q225–Q239. → [Звук](audio/sound.md), [Бой](gameplay/combat.md)\n- **11-13** Игра должна ощущаться как старые GTA: море живёт своей жизнью, неприятности начинает игрок, ответ растёт с тем, что он натворил, и от него можно уйти. Одобрено всё: мирные лодки на маршрутах, уровень розыска и патруль с постов карты, несколько дающих задания, мелкие забавы (буйства на время, очки за прыжки, спрятанные посылки), музыка как радио лодки и крупные строки диктора. Мирные лодки — основа для подробной жизни мира с торговцами и караванами. Не берём: угон лодок, всё пешком, криминальную сатиру, неон; вид сам не отъезжает от скорости. Заморозка новых систем снята. Розыск как второй источник сложности — годится. Кто такой патруль — позже, пока просто полиция; облик мирных лодок — позже. → [Жизнь моря](world/life.md), [Розыск и патруль](gameplay/wanted.md), [Открытый мир](gameplay/missions.md)\n- **11-14** Течений и бонов нет: владелец убрал оба вида зон из игры. Сменено: течения-ускорители с бирюзовыми шевронами (11-10, 11-11). → [Зоны и опасности](world/areas.md)\n- **11-14** Мирным лодкам — расписание и живое поведение. → [Жизнь моря](world/life.md)\n- **11-14** Рыбак ловит сетью со стрелы, снасть чуть крупнее жизни; на косяке плещется рыба. → [Жизнь моря](world/life.md)\n- **11-14** Открытый мир — состояние без задания, а не выживание: часов «Продержались» и «Вперёд» нет. Игра сохраняет состояние мира и продолжается с последнего сохранения; при запуске — главное меню «Продолжить», «Новая игра», «Настройки», «Выход». Сменено: игра сразу начинается в море (11-10), сохранение хранит только прогресс. → [Открытый мир](gameplay/missions.md), [Прогресс и сохранения](gameplay/progression.md), [Экраны и меню](interface/screens.md)\n- **11-14** Броненосец — мировой босс, как в WoW: стоит на стоянке с начала, без часов, отсчёта и объявлений. Сменено: броненосец приходит по часам на десятой минуте (11-09). → [Открытый мир](gameplay/missions.md)\n- **11-14** Пиратский остров: старый каменный форт на скале с бастионами, батареями и флагом над башней, чёрные моторные лодки под чёрным косым парусом и флоппы-пираты на причале, крышах, у костра и на башне. Пираты — новая сторона, отдельная от банды: нападают на любую лодку рядом и далеко от форта не гонятся. → [Форт пиратов](world/fort.md)\n- **11-14** Воду переделываем целиком, облик — как в Sea of Thieves: плавные валы, бирюза в гребнях, белая пена узором; волны умеренные; камеру можно сделать положе. → [План воды](reports/2026-11-14-water-overhaul.md)\n- **11-14** Шесть кандидатов на облик всей игры со стенда `Art` сняты, стенд удалён; облик игры — нынешний.\n- **11-15** Имени «Арена» у уровня больше нет: это просто мир; круг карты, над которым стоит вид, зовётся кругом арены. Сменено: арена как имя уровня (11-09). → [Открытый мир](gameplay/missions.md), [Камера и картинка](gameplay/camera.md)\n- **11-15** Соперники вернулись: система заклятых врагов, о которой мечтает владелец, — это они. Восемь капитанов с командами, ливреями, портретами и голосами, две команды в море разом; они помнят прошлую встречу с игроками и говорят о ней по радио. Сменено: соперников нет (11-10). → [Соперники](gameplay/rivals.md)\n- **11-16** Шанти поют команды рабочих лодок: команда котов мяуканьем по слогам настоящих слов, старинные народные шанти XIX века. Сменено в тот же день: пятая станция радио «Шанти» — шанти лучше подходят другим лодкам. → [Звук](audio/sound.md), [Музыка](audio/music.md)\n- **11-16** Облака объёмные, как их строят игры; в облачную погоду тени туч хорошо видны на воде. → [Погода](world/weather.md)\n- **11-16** Время суток идёт: сутки за 12 минут. Сменено: час держится на месте весь заход. → [Свет и время суток](art/light.md)\n- **11-16** Погода меняется: над миром сменяют друг друга периоды — ясно, облачно, лёгкий дождь, туман, — поверх плывут штормы, в непогоду чаще; шторм виден издалека шапкой туч, прозрачной вокруг лодки, край плавный. → [Погода](world/weather.md)\n- **11-16** Погода вернулась штормом, каким его видит владелец: огромные волны, тёмные тучи, ливень, молнии и гром; штормы и стоят на карте, и приходят сами; мешают заметно, но играть можно; образец — Sea of Thieves. Сменено: погоды нет (10-27). → [Погода](world/weather.md)\n- **11-16** Все модели несут запечённое затенение неба: оно гасит только свет неба, тени солнца и луны остаются живыми, и потому верно при любом часе и движущихся солнце и луне. → [Свет и время суток](art/light.md)\n- **11-16** Главное меню — над водой в виде боя, посередине экрана, заголовком — название игры; в нём есть «Загрузить». Пляж с кокосами и вывеской сделан и снят в тот же день. В море игра сохраняется сама раз в минуту, когда рядом нет охотников. → [Экраны и меню](interface/screens.md), [Прогресс и сохранения](gameplay/progression.md)\n- **11-16** Меню поднимаем до уровня больших игр: тихий выбор пункта (кромка и блик), игра поднимается из тёмного, мир за паузой размыт. → [Экраны и меню](interface/screens.md)\n- **11-16** За меню паузы мир размыт, как будто у камеры ушёл фокус, чуть притемнён и приближен; меню показывает, где ты. Сменено: сцена под меню затемнена слегка и только слева, чтобы стекло оставалось стеклом. → [Экраны и меню](interface/screens.md)\n- **11-16** Дерево похоже на дерево: доски и швы видны, волокна вблизи, тон разный от доски к доске, дерево — выгоревший тик; металл блестит; всё в шейдере, без скачанных текстур. → [Материалы](art/materials.md)\n- **11-16** Сначала альфа: довести до ума то, что в игре уже есть, а потом строить срез. В альфе новых систем не начинаем; новая система встаёт после альфы или вместо чего-то из её списка. Сменено: заморозки нет (11-13). Что входит в альфу — пока предложение. → [Дорожная карта](roadmap.md)\n- **11-17** Проверка демо должна идти быстро: медленные кейсы убраны (десять `Coop` и ещё пять), у кооператива — один короткий кейс, после каждого прогона — отчёт о времени кейсов и их кадрах.\n- **11-17** Лодки игроков втрое крепче таких же корпусов у охотников, и ни один залп не топит целую лодку игрока; охотники не видят лодку игрока, пока он смотрит вставку; новая игра начинается со 150 монет. → [Бой](gameplay/combat.md), [Камера и картинка](gameplay/camera.md), [Прогресс](gameplay/progression.md)\n- **11-17** Вопросов владельцу не оставлять: где вики молчит, Claude решает сам и пишет это как устройство игры, без пометок; страниц открытых вопросов больше нет. Что не понравится в игре, владелец поменяет. → [Как вести вики](README.md)\n- **11-17** Меню читов в самой игре: монеты, припасы и охотники, чтобы проверять верфь и бой. → [Меню читов](tools/cheats.md)\n- **11-17** Каждая деталь интерфейса въезжает из-за ближайшего к ней края экрана и уходит за тот же край: диалог, меню, HUD, карта, журнал, экраны причала, верфи и торговца. Сменено в тот же день: меню уходило за пятую долю секунды, меняло страницы за восьмую. → [Компоненты](art/components.md)\n- **11-17** В тихом глазу вечного шторма за Отмелями — корабль на мели: ржавый контейнеровоз с садами на контейнерах, на его пирсе старьёвщик на горе хлама продаёт странные припасы со смешным действием. → [Корабль на мели](world/hulk.md)\n- **11-19** Буйства и подъём ящиков захватом у обломков убраны. Из забав остались прыжки с волн и спрятанные посылки; из мест промысла — только косяки с рыбалкой, а потопленные охотники всегда рассыпают ящики на воде. → [Забавы](gameplay/toys.md), [Места промысла](gameplay/sites.md)\n"}, {"id": "gameplay-boat", "path": "gameplay/boat.md", "title": "Лодка", "section": "gameplay", "date": "2026-11-19", "md": "# Лодка\n\n![Лодка игрока вблизи](../img/boat.jpg)\n\nЕдинственная лодка игрока: как она управляется, плавает, горит топливом и что на неё ставят.\n\n## Решения владельца\n- Лодка кренится в повороте слабо (2026-11-10): крен каждого корпуса (`Feel.Lean`) срезан вдвое.\n- Никакой физики, но весёлое ощущение управления катером.\n- Она управляется как твёрдое тело, толкаемое в точках корпуса, по образцу 2D-машины Пэта Керра (patkerr.co.uk/2d-vehicles), а не чистым сглаживанием.\n- Перевёрнутая лодка выпрямляется, против физики, если нужно, как аркады переворачивают машину обратно на колёса.\n- Она едет по волнам — своим и чужим следам.\n- Несколько типов лодок: простые катера, от самых примитивных. В каждый должно быть круто запрыгнуть и управлять им.\n- Вес важен: у каждой детали есть масса, и лодка держится на воде, дифферентуется, встаёт и управляется по ним. Вес стоит скорости, как на настоящем глиссирующем катере.\n- Ничто не ограничивает скорость лодки: чем безумнее, тем лучше.\n- Крюка нет: владелец убрал крюк, лебёдку и буксир 2026-11-09.\n- Стоящая лодка разворачивается на месте одним рулём, без газа.\n- Каждая деталь — лучший выбор для какой-то лодки: деталь, во всём хуже другой, убирается.\n- Никаких свободных корпусов и многокорпусных лодок; крайние проекты не требуют особой обработки.\n- Нитро — рывок (2026-11-10): нажатие на Shift бросает лодку вперёд, и рывком уходят от ракет. Он должен быть крутым и весёлым, а не правдоподобным. Заряд восстанавливается со временем. Охотники тоже его жгут.\n- Топливо ограничено: лодка несёт только свой бак. Оно сгорает по пройденному пути, а не по времени: лодка, стоящая на месте или идущая накатом, не жжёт ничего.\n- Снаряжение добавляет приём: таран ([Бой](combat.md)), дым, сбивающий охотнику прицел, помпа, чинящая корпус в море, плотники, которые латают его за каждую лодку, которую она топит ([Бой](combat.md)).\n- Прицел, установленный на лодку, показывает корпуса сквозь дым силуэтами. Без него дым скрывает охотников от захвата цели игрока и от HUD.\n- Посадка на мель не вредит.\n- У брони в верфи есть собственное место, как у мотора, и она не занимает станцию: пояс клёпаных стальных плит, изогнутых по корпусу вдоль обоих бортов по ватерлинии; платится весом и монетами. Плита, принявшая свои попадания, падает в море, и лодка становится легче и быстрее.\n- Лодка несёт снаряжение по размеру корпуса: малый корпус одну деталь, больший больше.\n- Охотник, затонувший на мелководье, лежит на дне до конца захода; с 2026-11-19 его добыча всегда рассыпается на воде, обломков для захвата нет ([Места промысла](sites.md)).\n- У каждого корпуса свой бак, у каждого мотора свой расход; охотники топлива не жгут. Топливо встречается и припасом ([Припасы](pickups.md)). Пустой бак не кончает заход (2026-11-09): лодка игрока ползёт домой малым ходом, с добычей и без нитро.\n- 2026-11-17: нитро как рывок работает идеально; к нему хочется ещё какой-то длящийся эффект.\n- 2026-11-17: длящийся эффект — дожиг: рывок остаётся точно как есть, а если после рывка держать Shift, лодка идёт быстрее своей обычной предельной скорости и жжёт шкалу, пока клавиша зажата, как нитро в гонках; отпущенная клавиша или пустая шкала его кончают. Он должен читаться: петух брызг или пламя и звук мотора, пока горит, шкала заметно пустеет. Онлайн это `Command` игрока, как рывок. Числа — настройка, в коде.\n- 2026-11-17: петух брызг при рывке нитро и рывки охотников — как сейчас.\n- 2026-11-17: скорость лодок — как сейчас, без предела сверху.\n- 2026-11-17: с пустым баком лодка идёт на четверти газа без нитро — как сейчас.\n- 2026-11-17: корпуса, моторы и детали, их бак и расход — как сейчас, на усмотрение разработки.\n- 2026-11-17: броневой пояс — как сейчас, на усмотрение разработки.\n"}, {"id": "gameplay-builds", "path": "gameplay/builds.md", "title": "Сборки и стили игры", "section": "gameplay", "date": "2026-11-17", "md": "# Сборки и стили игры\n\nСборки — это разные способы играть, которые игрок собирает из деталей в верфи.\n\n## Решения владельца\n- Сборки играются по-настоящему по-разному, каждая из деталей, купленных в верфи:\n  - Бортовой залп: борт, выведенный на цель на параллельном курсе.\n  - Преследователь: две короткие ракетные рейки у форштевня, стреляющие вперёд, наводимые поворотом на врага.\n  - Турельщик: круглые двуствольные турели, которые поворачиваются и стреляют сами по ближайшему врагу, пока игрок только ведёт.\n  - Носитель дронов: маленькие безэкипажные морские дроны, бегущие по воде, кружащие вокруг врага и стреляющие ракетами; Q и E посылают и отзывают их. Дрон не стреляет, пока его носитель лежит на линии огня.\n  - Минёр: чёрные шаровые мины со светом цвета стороны сверху, сбрасываемые за корму, взводящиеся через мгновение и взрывающиеся под любым другим корпусом.\n- Ни одна сборка не является простым медленным танком: одно только принятие ударов — не способ играть.\n- Никакой подлодки, ни как корпуса, ни как способа играть: под синим морем её не видно с камеры, а над банкой в 5 м она не может нырнуть. Нырок на две-три секунды, как снаряжение, может появиться позже.\n- 2026-11-17: носовые стойки преследователя — как сейчас.\n- 2026-11-17: дроны — как сейчас; владелец поправит, играя.\n- 2026-11-17: люлька с двумя дронами — как сейчас; владелец поправит, играя.\n- 2026-11-17: посланный дрон кружит по дальнюю сторону цели — как сейчас; владелец поправит, играя.\n- 2026-11-17: дрон у края досягаемости — как сейчас; владелец поправит, играя.\n\n## Как выбирали сборки\n- В ноябре 2026 владелец попросил не менее пяти по-настоящему разных способов играть, собираемых в верфи, и никакого медленного танка. Затравкой были автоматические турели, дроны, огонь с носа и носитель дронов; владелец спросил о подлодке и минёре.\n- Исследование вышедших игр дало каждому способу свой основной глагол: бортовой залп выводит борт на цель на параллельном курсе; преследователь направляет нос и целит поворотом; турельщик только ведёт, пока стреляют его турели; носитель дронов посылает и отзывает крыло; минёра преследуют, и он ведёт преследователей над своими минами. Шестой, загонщик, держался на крюке и ушёл вместе с крюком 2026-11-09.\n\nОружие описано в [Бой](combat.md).\n"}, {"id": "gameplay-camera", "path": "gameplay/camera.md", "title": "Камера и картинка", "section": "gameplay", "date": "2026-11-17", "md": "# Камера и картинка\n\nВид на бой: фиксированная изометрия, зум и разрешение, в котором рисуется мир.\n\n## Решения владельца\n- Статичный 2.5D изометрический вид: фиксированный азимут и наклон, чуть круче изометрического, как мир показан на картинах меню.\n- Игрок приближает и отдаляет, только зум: камера остаётся на месте. Бой начинается отдалённым, примерно в пятнадцать корпусов лодки поперёк кадра.\n- Вид следует за лодкой. В кругах арены, которые размечает карта, он вместо этого стоит неподвижно над кругом, а при входе играется короткая вставка по кадрам, заданным в редакторе карт.\n- Круг карты, над которым стоит вид, зовётся кругом арены (2026-11-15): Ареной перестал зваться только уровень.\n- 2026-11-14: игра идёт на 90–100 кадров в секунду во весь экран; по умолчанию стоит лучший из апскейлеров, что есть в Настройках.\n- 2026-11-14: наклон камеры можно сделать положе, чтобы склоны волн и свет в гребнях читались лучше. Этим снято «чуть круче изометрического» ([план воды](../reports/2026-11-14-water-overhaul.md)).\n- 2026-11-17: вставки запускаются кругом арены — как сейчас.\n- 2026-11-17: бой идёт во время вставки, но лодку игрока, пока он смотрит вставку, охотники не видят, как за дымом.\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n- 2026-11-17: картинка по умолчанию (апскейлер, разрешение 80 %) — пока как сейчас; вернёмся к демо.\n"}, {"id": "gameplay-combat", "path": "gameplay/combat.md", "title": "Бой", "section": "gameplay", "date": "2026-11-17", "md": "# Бой\n\n![Ракеты бьют в охотника](../img/combat.jpg)\n\nОружие лодки, захват цели, попадания, дым и таран.\n\n## Решения владельца\n- Мышью не целятся (2026-11-10): ракеты и торпеды идут в захваченную цель внутри веера своего борта, а если её в веере нет, в ближайшего видимого охотника в нём (2026-11-11). У каждого борта и у носовых стоек свой широкий веер на воде, и чтобы навести веер на цель, лодку поворачивают. Q и E стреляют каждая своим бортом, щелчок — бортом, который достаёт цель. Откуда стреляет оружие, приходит с деталью, купленной в верфи: стойки над каждым бортом (Q — левый, E — правый), носовые стойки, стреляющие вперёд, мины, сбрасываемые за корму, и турели, целящиеся сами.\n- Основное оружие — турель: она стоит на стартовой лодке и стреляет сама. Ракеты — дополнение, их стойки покупают в верфи.\n- Ракеты выпускаются с рельсовых стоек рябью залпов. Они летят прямо и быстро в захваченную цель; сама выбирает цель только турель. Ракеты скользят над волнами на постоянной высоте, так что крен или волна никогда не портят выстрел.\n- Ракетные стойки растут в уровнях: первая стреляет двумя ракетами на борт, и ракеты залпа уходят одна за другой с небольшой задержкой (2026-11-10).\n- У турели свой снаряд, заметно медленнее ракеты, и выглядит он иначе: светящийся трассер без дыма (2026-11-10).\n- Захвачен один враг за раз. Клавиши смены захвата нет; когда захваченный враг тонет, захват переходит сам. Борт, чьи ракеты, выпущенные сейчас, попали бы в цель, зажигает свою клавишу, Q или E, у борта лодки и у цели: ярко, когда борт заряжен, и тускло, пока он перезаряжается. Клавиша торпеды ждёт попадания в районе середины корпуса.\n- Торпеды — второе бортовое оружие: медленные, идущие под волнами, топящие лодку за одно-два попадания. Их трубы лежат в корпусе под водой: на палубе ничего не видно, а торпеда выходит под поверхностью.\n- C переключает оружие, которым стреляют Q и E, по видам пусковых установок на борту; дым держит свою клавишу, F. HUD показывает выбор маленькой рулеткой ромбовидных значков в глянцевом аква-стекле приборов.\n- Ракету парируют ракетой (2026-11-10): ракеты двух сторон, встретившись в воздухе, взрывают друг друга.\n- У ракет и снарядов есть предельная дальность (2026-11-11): дальше неё ничего не летит.\n- Попадание есть попадание: где ракета ударила в корпус, не меняет того, что она делает.\n- Таран вредит обеим лодкам, но лодка с тараном не страдает от собственного тарана. Таран защищает только нос своей лодки: удар в нос приходится на таран, удар в борт или корму вредит лодке как любой. Ни один удар не топит целую лодку разом.\n- Удар носом на нитро — приём любой лодки: она получает меньше, а бьёт сильнее. Таран делает его ещё сильнее.\n- Ракеты охотников горят красным, а игрока — оранжевым, так что перекрёстный огонь читается с первого взгляда. Они летят медленнее ракет игрока, так что от них можно увернуться.\n- Охотники стреляют независимо от того, стоит ли на пути остров.\n- Плотники латают за каждую лодку, которую потопила их лодка, четверть того, что та выдерживала; их несёт охотник-гонщик.\n- Дымовая завеса медленно дрейфует с ветром, оставаясь около того места, где поставлена. Её перезарядка — шкала в кластере приборов.\n- 2026-11-13: эффекты боя нужно улучшить радикально; сначала исследовать, как это делают на GitHub и в других играх, потом применить лучшее из исследования целиком, ничего не оставляя на потом.\n- 2026-11-17: лодки игроков втрое крепче таких же корпусов у охотников: ракета снимает с ялика игрока двенадцатую долю, а не четверть, и ни один залп не топит целую лодку игрока. Охотники тонут так же быстро, как раньше.\n\nКакие стили игры строятся из этого оружия, описано в [Сборки и стили игры](builds.md).\n- 2026-11-17: остров закрывает лодку от охотника, как дым: сквозь сушу не стреляют, ракеты рвутся о землю. Сменено: «охотники стреляют независимо от острова». Горы и просвечивание суши вокруг лодки — как сейчас.\n- 2026-11-17: размер и время взрывов — как сейчас.\n- 2026-11-17: тёмный дым и оранжевый огонь взрывов — как сейчас.\n- 2026-11-17: bloom выключен, эффекты без текстур — как сейчас.\n- 2026-11-17: вспышка корпуса при ударе и свет починки — как сейчас.\n- 2026-11-17: тряска шкалой силы — как сейчас.\n- 2026-11-17: стадии повреждений — как сейчас.\n- 2026-11-17: гибель лодки — как сейчас.\n- 2026-11-17: ракеты в полёте — как сейчас.\n- 2026-11-17: малые моменты боя — как сейчас.\n- 2026-11-17: добыча летит на борт — как сейчас.\n- 2026-11-17: бюджет эффектов — как сейчас.\n- 2026-11-17: дым не слепит охотников для своих лодок — как сейчас.\n- 2026-11-17: турель бьёт сама — как сейчас.\n- 2026-11-17: минный жёлоб — как сейчас.\n- 2026-11-17: удар носом в рывке нитро — как сейчас.\n- 2026-11-17: ракеты сбивают друг друга — как сейчас.\n- 2026-11-17: ракета на пределе дальности гаснет без урона — как сейчас.\n- 2026-11-17: веер борта очень узкий, почти как раньше: широкий угол с автоприцелом убирает сложность наведения. Ракеты залпа идут с небольшим разбросом, а не в одну точку. Сменено: широкий веер у каждого борта (11-10, 11-11).\n"}, {"id": "gameplay-haul", "path": "gameplay/haul.md", "title": "Добыча", "section": "gameplay", "date": "2026-11-17", "md": "# Добыча\n\n![Ряд трюма над панелью расходников](../img/hold.jpg)\n\n![Экран торговца на «Марии»: трюм, товары и реплика мытаря](../img/trader.jpg)\n\n![Карта: стекло с линиями света](../img/map.jpg)\n\nДобыча — ящики, которые лодка собирает в море и продаёт за монеты. Здесь ящики, трюм, расходники, карта в море и продажа.\n\n## Решения владельца\n- Кооперативная добыча: лодки выходят в море за добычей и довозят её до места продажи, пока охотники их не потопили.\n- Добыча продаётся за монеты сразу: в гавани у пирса (2026-11-09, 2026-11-10) и у плавучей станции в море (2026-11-11, [Станция](../world/outpost.md)). Буёв выхода нет (2026-11-10).\n- Продажа — экран торговца, как в играх о рыбалке и торговле с лодки (2026-11-13): слева торговец с короткой репликой, справа трюм ящиками с ценами. Ящик продаётся выбором, есть «Продать всё», монеты набегают в кошельке; непроданное остаётся на борту для расходников. В гавани торгует корабел, на «Марии» — мытарь, у каждого короткая реплика в стеклянной выноске, как в диалоге. Квитка и итога захода нет: хватает кошелька.\n- Непроданные ящики можно продать позже, не выходя снова в море: плиткой «Торговец» на ленте причала (2026-11-13, [Гавань](../base/pier.md)).\n- Потопленный охотник роняет свою добычу на воду, и лодка собирает её, проезжая по ней. Она плавает, пока её не соберут.\n- Ящики вместо сетки (2026-11-11): «Ящики вместо сетки. Экран трюма и сетка уходят. Добыча — несколько понятных видов ящиков в ряду слотов прямо на HUD. Расходники собираются клавишами 1–4. Полный трюм сам меняет дешёвое на дорогое. Всё теряется, если утонуть.»\n- Вес добычи замедляет лодку, но не наказывает за полный трюм.\n- Лодка, ушедшая под воду, высыпает трюм на воду, чтобы другие его собрали. Защищённого контейнера нет: теряется всё.\n- Карта (2026-11-13): «Прозрачная, линии светом». Это стекло, сквозь которое видно море; берег, глубины и метки нарисованы на нём линиями света, как на навигационном приборе. Бумаги в интерфейсе больше нет.\n- Расходники (2026-11-11) тратят в море клавишами 1–4, по панели быстрого доступа на HUD.\n- 2026-11-17: лодки игроков на карте — глянцевые стрелки по курсу, своя оранжевая, товарищей аква, без имён.\n- 2026-11-17: как сейчас (принято владельцем вместе с остальной добычей).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальной добычей).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальной добычей).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальной добычей).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальной добычей).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальной добычей).\n"}, {"id": "gameplay-hunters", "path": "gameplay/hunters.md", "title": "Охотники и ИИ", "section": "gameplay", "date": "2026-11-17", "md": "# Охотники и ИИ\n\n![Охотники заходят на лодку игрока](../img/hunters.jpg)\n\nОхотники — враги игрока в море. Здесь их виды и единый ИИ, управляющий каждой лодкой, кроме лодки игрока.\n\n## Решения владельца\n- Охотники нескольких видов идут разом: таранщики, которые бросаются в атаку, рои маленьких, слабых и очень быстрых лодок и лодки, которые кладут игрока на траверз и стреляют. Дымовой рой маленьких юрких лодок ставит много дыма и видит сквозь него.\n- Директора нет (2026-11-11): охотники стоят на постах карты, и какие на каком — выбирают в редакторе ([Зоны и опасности](../world/areas.md)).\n- У охотника есть зрение: он гонится за лодкой игрока, только пока видит её, а когда она ушла из вида, забывает о ней.\n- Охотник дерётся до конца: ни один не выходит из боя и не идёт чиниться.\n- Охотники различаются мастерством, от зелёных команд до асов: как быстро отвечают, как аккуратно стреляют, как медленно перезаряжаются.\n- Броненосец, босс, имеет собственный корпус, больше любого, который может построить игрок, и дерётся этапами по мере того, как его броня сбивается.\n- Каждой лодкой, кроме лодки игрока, управляет один ИИ, планировщик действий по целям (GOAP), так что торговцы и караваны с охраной смогут присоединиться позже.\n- Много лодок разом остаются дешёвыми: ни одна не читает море каждый кадр.\n- Охотник стреляет, когда его выстрел попадёт, любым видом пусковой установки, который попал бы. За миг до выстрела его стойка на этом борту светится красным, и короткий звук выдаёт выстрел.\n- Рои идут на катерках: малом корпусе на два попадания, открытой спортивной лодке в 4–5 м с большим подвесным мотором.\n- 2026-11-17: рой дыма на яликах с дымогенератором — как сейчас.\n- 2026-11-17: знак охотника перед залпом — как сейчас.\n- 2026-11-17: зрение охотников и поиск потерянной лодки — как сейчас.\n- 2026-11-17: как застрявший охотник выбирается — как сейчас.\n- 2026-11-17: выучку экипажей пока убрать совсем; может, вернём позже.\n- 2026-11-17: ИИ не стреляет через свои лодки — как сейчас; владелец поправит, играя.\n"}, {"id": "gameplay-missions", "path": "gameplay/missions.md", "title": "Открытый мир", "section": "gameplay", "date": "2026-11-17", "md": "# Открытый мир\n\nОткрытый мир — единственный уровень игры: одна большая карта и бесконечный заход. Охотники стоят на постах, задания старых миссий случаются внутри, а гавань у пирса — на острове той же карты. Здесь заход, задания, броненосец и то, как заход начинается и кончается.\n\n## Решения владельца\n- Открытый мир: игра идёт в море. При запуске — главное меню поверх моря там, где игра сохранилась: «Продолжить», «Новая игра», «Настройки», «Выход»; игра продолжается с последнего сохранения (2026-11-14, [Прогресс и сохранения](progression.md); до того она сразу начиналась в море).\n- Открытый мир — состояние без задания, а не выживание (2026-11-14): часов «Продержались» в целях и «Вперёд» в начале захода нет.\n- Броненосец живёт в открытом мире, как мировой босс в WoW (2026-11-14): стоит на своей стоянке с начала, без часов, отсчёта и объявлений.\n- Имени «Арена» у уровня нет: это просто мир (2026-11-15).\n- Мир — одна большая карта и бесконечный заход, а события из каждого вида прежних миссий (конвой, курьер, маяки, груз, броненосец) случаются внутри.\n- Задания берут у флопп, как в старых GTA (2026-11-13): несколько флопп дают их по рации в местах на карте, задание идёт в живом море, а проваленное просто кончается, без перезагрузки.\n- Гавань — мастерская корабела на острове, к которой доплывают сами; экрана базы нет, это место открытого мира ([Гавань](../base/pier.md), 2026-11-13). Буёв выхода нет (2026-11-10).\n- Когда все лодки игроков потоплены, чёрные полосы закрываются с надписью «Погиб», и игра загружает последнее сохранение в открытый мир (2026-11-10).\n- Вступительной сцены нет (2026-11-11): заход сразу начинается в виде боя, руль сразу у игрока, HUD на месте, охотники живы.\n- Директора нет (2026-11-11): охотники стоят на постах карты ([Зоны и опасности](../world/areas.md)).\n- Старт — своё место в стороне от середины карты: лодка идёт вдоль берега, суша по левому борту.\n- 2026-11-17: задание отмечено только на карте — как сейчас.\n- 2026-11-17: пока как сейчас.\n- 2026-11-17: пока как сейчас.\n- 2026-11-17: пока как сейчас.\n- 2026-11-17: пока как сейчас.\n"}, {"id": "gameplay-pickups", "path": "gameplay/pickups.md", "title": "Припасы", "section": "gameplay", "date": "2026-11-17", "md": "# Припасы\n\nПрипасы — нитро, ремонт, броня и топливо, которые всплывают в море и спускаются с неба.\n\n## Решения владельца\n- Припасы нитро, ремонта и брони появляются в море случайно, как аркадные припасы: наезд на один пополняет нитро, чинит корпус или прибавляет брони. Припасы брони синие. Любая лодка, и охотник тоже, берёт каждый, на который наехала, нужен он ей или нет.\n- Ремонт чинит треть того, что выдерживает корпус; броня пополняет запас попаданий брони, которые принимаются раньше попаданий корпуса, до трети того, что выдерживает корпус. Встречается и топливо: оно пополняет бак.\n- 2026-11-10: нужно больше припасов, например ремонт, спускающийся с неба на парашютах.\n- 2026-11-17: припас топлива — как сейчас, на усмотрение разработки.\n"}, {"id": "gameplay-progression", "path": "gameplay/progression.md", "title": "Прогресс и сохранения", "section": "gameplay", "date": "2026-11-17", "md": "# Прогресс и сохранения\n\nЧто игра помнит между заходами: монеты, купленные детали, лодку и где стоит заход, и как она сохраняется.\n\n## Решения владельца\n- Кампании и уровней нет: в игре один [открытый мир](missions.md), в котором игра и начинается.\n- Игрок строит лодку из деталей, покупаемых за монеты в верфи. Деталей не крафтят: каждая только покупается (2026-11-09). Расходники оплачивают ящиками из трюма (2026-11-
