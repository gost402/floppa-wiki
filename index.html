сть попаданий, которые та выдерживала. Зачем при потоплении: это окупает напор в бою.\n- **Дым** (`ships/Smoke.cs`, `Screens`): F ставит завесу за кормой из канистр дымогенератора, затем он перезаряжается. Завеса — это клубы дыма боя (`Medium.Smoke`), которые жмутся к воде, вздымаются, дрейфуют и редеют. Она прячет лодки от любой лодки без тепловизора, и охотников, и захват цели игрока вместе с HUD (`Screens.Sees`): это оптическая толщина вдоль линии взгляда сквозь клубы в том виде, как они нарисованы (`Swarm.Through`), так что ослепляет то, что видно. Захват, оставленный на скрытом охотнике, держится, но не показывается. Завеса дрейфует на доле ветра, поскольку игры держат дым примерно там, где его поставили ([Q22](../questions/combat.md#q22)).\n- **Попадания** (`Boat.Touches`, `Boat.TouchesUnder`, `Boat.Strike`): ракета взрывается, когда её взрыв достаёт до того, что стоит выше ватерлинии; борта побитой лодки, осевшей от набранной воды, считаются такими же высокими, какими стояли у целой (`Afloat.Settled`), иначе ракета, идущая на своей высоте над морем, проходила бы над палубой лодки на последнем попадании; торпеда — когда достаёт до корпуса под ней, и подбрасывает корпус, не оставляя копоти. Лодка тонет, когда получает столько попаданий, сколько выдерживают её корпус и броня. Броня из припасов принимает удар первой (`Boat.Armour`), затем ближайшая на её борту плита пояса; плита, принявшая всё, что выдерживала, падает в море (`Boat.Shed`), и лодка перестраивается на плиту легче (`Build.Shed`), а её попадания по-прежнему считаются против того, что она выдерживала при постройке; ничто её не чинит ([Q30](../questions/boat.md#q30)). Снаряды проходят сквозь лодки своей стороны.\n- **Наводка** (`Controls.Sight`, `Command.Sight`, `Boat.Aimed`, `Boat.Fans`): мышь не целится — только правый стик геймпада даёт точку прицела на воде на дальности огня от лодки. Установка поворачивает выстрел к цели в пределах своего веера (`Boat.Fan`), дальше не поворачивает. Захват (`Player.Lock`) берёт врага на линии правого стика; иначе держится, пока его охотник на плаву, а потом переходит на цель задания, если её видно, или на ближайшего видимого охотника, на любом расстоянии. Внутри веера выстрел берёт упреждение по захваченной цели (`Burn.Lead`). Щелчок стреляет каждым бортом, чей веер держит цель, а вне вееров — бортом со стороны цели (`Order.Fire`, `Boat.Sights`). Капитаны охотников наводят так же: их выстрел берёт упреждение по добыче в пределах веера (`Captain`), иначе медленная ракета не догоняет идущую лодку. HUD рисует веера у лодки игрока ([HUD](../interface/hud.md)). Ширина веера, выбор захвата и упреждение — решение без владельца, [Q134](../questions/combat.md#q134).\n- **Прицел** (`Boat.Strikes`): попал бы борт, выстрелив сейчас, в лодку, держащую свой ход; по умолчанию считаются только заряженные установки, так что охотник стреляет по тому, что долетело бы, а клавиша HUD ещё и тускнеет на борту, который перезаряжается (`loaded: false`). Торпедный прицел должен держаться и будь лодка чуть быстрее или медленнее.\n- **Взрывы** (`Blasts`, `Strikable.cs`): мина, бочка или снаряд, взрываясь, бьют каждый корпус в зоне досягаемости, меньше с расстоянием, и подбрасывают его вверх и в стороны; это показано, слышно и ощущается как взрыв ракеты. Снаряды взрываются о вещи карты как о корпуса (`IStrikable`, `Gunnery.Add`).\n- **Вид** (`Glow`, `Medium`, `Effects`, `ShotFeel`): одна модель огня, лампы которой освещают корпуса, дым и волны, и одна для дыма, тумана, пыли и брызг; `Effects` сочетает их для каждого события. Ракета горит цветом своей стороны (`Rockets.Tracer`), как трассеры красят по сторонам.\n- **Следы боя** (`Flashes`, `Trails`, `Burn`, `Debris`, `Scorch`): вспышка — огненный шар, который растёт, угасая, и светит вокруг. За ракетой тянется светящаяся лента (`trail.gdshader`), чтобы ракету в несколько пикселей было видно; `Burn` — её скорость от пуска до полного хода. Удар выбивает из корпуса щепки: они плавают, пока не намокнут и не утонут, так что бой оставляет обломки на воде. На корпусе и земле остаётся подпалина с остывающими углями. Вспышка и лента держат по запасному экземпляру с начала, чтобы их шейдеры собирались за шторкой загрузки.\n"}, {"id": "gameplay-haul", "path": "gameplay/haul.md", "title": "Добыча", "section": "gameplay", "date": "2026-11-13", "md": "# Добыча\n\n![Ряд трюма над панелью расходников](../img/hold.jpg)\n\n![Экран торговца на «Марии»: трюм, товары и реплика мытаря](../img/trader.jpg)\n\n![Карта: стекло с линиями света](../img/map.jpg)\n\nДобыча — ящики, которые лодка собирает в море и продаёт за монеты. Здесь ящики, трюм, расходники, карта в море и продажа. Цены ящиков, места трюма и рецепты — в [Балансе экономики](../balance/economy.md).\n\n## Решения владельца\n- Кооперативная добыча: лодки выходят в море за добычей и довозят её до места продажи, пока охотники их не потопили.\n- Добыча продаётся за монеты сразу: в гавани у пирса (2026-11-09, 2026-11-10) и у плавучей станции в море (2026-11-11, [Станция](../world/outpost.md)). Буёв выхода нет (2026-11-10).\n- Продажа — экран торговца, как в играх о рыбалке и торговле с лодки (2026-11-13): слева торговец с короткой репликой, справа трюм ящиками с ценами. Ящик продаётся выбором, есть «Продать всё», монеты набегают в кошельке; непроданное остаётся на борту для расходников. В гавани торгует корабел, на «Марии» — мытарь, у каждого короткая реплика в стеклянной выноске, как в диалоге. Квитка и итога захода нет: хватает кошелька.\n- Непроданные ящики можно продать позже, не выходя снова в море: плиткой «Торговец» на ленте причала (2026-11-13, [Гавань](../base/pier.md)).\n- Потопленный охотник роняет свою добычу на воду, и лодка собирает её, проезжая по ней. Она плавает, пока её не соберут.\n- Ящики вместо сетки (2026-11-11): «Ящики вместо сетки. Экран трюма и сетка уходят. Добыча — несколько понятных видов ящиков в ряду слотов прямо на HUD. Расходники собираются клавишами 1–4. Полный трюм сам меняет дешёвое на дорогое. Всё теряется, если утонуть.»\n- Вес добычи замедляет лодку, но не наказывает за полный трюм.\n- Лодка, ушедшая под воду, высыпает трюм на воду, чтобы другие его собрали. Защищённого контейнера нет: теряется всё.\n- Карта (2026-11-13): «Прозрачная, линии светом». Это стекло, сквозь которое видно море; берег, глубины и метки нарисованы на нём линиями света, как на навигационном приборе. Бумаги в интерфейсе больше нет.\n- Расходники (2026-11-11) тратят в море клавишами 1–4, по панели быстрого доступа на HUD.\n\n## Как устроено\n- **Ящики** (`haul/Items.cs`): восемь видов, по одному на ресурс (`Resource`): металл, механизмы, электрика, топливо, взрывчатка, ткань, ценности, провизия. У вида одна цена, один вес, свой цвет и силуэт, видный с высоты боя: топливо — красная бочка, ткань — тюк, ценности — золотой сундук, остальные — ящики своего цвета с трафаретным знаком (гайка, шестерня, молния, взрыв; у провизии — перекрещённые планки). Каждый проект охотника несёт свои виды (`Items.Carried`); его обломок роняет их, пока их добыча не сойдётся к добыче проекта. Виды, цены и места трюма — решение без владельца, [Q162](../questions/haul.md#q162).\n- **На плаву** (`Flotsam`, `Pile`): ящики качаются на волнах и плывут по течениям, пока их не соберут. Лодка игрока подтягивает те, что в досягаемости, каждый к ближайшей лодке, чей трюм его возьмёт (`Flotsam.Room`, `Hold.Takes`). Вытесненный из трюма ящик остаётся другим, пока его лодка не отойдёт (`Flotsam.Throw`). Ящики задания «груз» и тайников карты ([Зоны и опасности](../world/areas.md)) плавают так же.\n- **Трюм** (`Hold`): ряд мест, у каждого корпуса своё число (`HullPart.Hold`), в месте одна вещь. Ящик ложится в первое свободное место. В полном трюме ящик дороже самого дешёвого на борту встаёт на его место, а дешёвый падает за корму (`Hold.Pushed`); обмена в убыток нет. Ящик, которому нет места, остаётся на плаву, и HUD один раз объявляет «Трюм полон». Руками ничего не выбросить, поэтому лодки не передают друг другу ящики (решение без владельца, [Q164](../questions/haul.md#q164)). Вес трюма замедляет только разгон лодки, полный ход остаётся (`Boat.Laden`; решение без владельца, [Q43](../questions/haul.md#q43)). Лодка, уходящая под воду, высыпает все места.\n- **Ряд трюма на HUD** (`HoldRow`, `CrateArt`): над панелью расходников, внизу слева. Каждое место — маленькое стекло: пустое едва видно, в занятом картинка ящика; в конце ряда монета и сколько монет стоит трюм. Новый ящик выскакивает в своё место, вытесненный или потраченный улетает ([HUD](../interface/hud.md)).\n- **Расходники** (`Kits`, `KitBar`; решение без владельца, [Q151](../questions/haul.md#q151), [Q163](../questions/haul.md#q163)): четыре вида, в трюме их нет. Клавиша 1–4 сразу тратит ящики рецепта, самые дешёвые каждого ресурса, и делает дело (`Order.Patch` … `Order.Charge`, `Hold.Spend`). Ремкомплект латает корпус, бронеплита ставит броню, баллон нитро заправляет нитро — как одноимённые припасы (`Pickups.Give`); заряд рвётся вокруг лодки и бьёт всех чужих рядом. Если ящиков нет или лодке это не нужно (корпус цел, броня полна, нитро полон), плитка вздрагивает, и ничего не тратится. На плитке два значка ящиков рецепта и сколько раз трюм может за неё заплатить.\n- **Добыча из вида сбоку** (`SideView.Landed`): пойманная рыба и поднятая с обломка вещь ложатся в трюм, как любой ящик ([Места промысла](sites.md)).\n- **Экран торговца** (`ui/Counter.cs`, `Game.Trade`, `Game.Sell`, `haul/Terms.cs`): сцена за ним чуть притемнена. Слева внизу стоит портрет торговца, и его реплика пишется буквами в стеклянной выноске его голосом, как в [диалоге](../story/dialogue.md): приветствие, затем короткий ответ на продажу, на проданный трюм, на «Продать всё» без ящиков и на нехватку монет. Справа «Ваш трюм» — стеклянные карточки ящиков в порядке мест трюма: картинка, название и цена этого торговца на ярлыке с монетой. Выбранная карточка наполняется светом лагуны, как карточка верфи ([Компоненты](../art/components.md)). `Enter` или щелчок продаёт ящик: он летит к торговцу, остальные сдвигаются, кошелёк вверху справа набегает. «Продать всё» продаёт оставшиеся по одному, быстро. «Готово» закрывает экран, и игра сохраняется. Клавиши — [Управление](../interface/controls.md). Всё стекло экрана лежит в одном слое, HUD спрятан.\n- **В гавани** (`Game.Moor`): по `Space` у причала лодка швартуется, корпус чинится и бак заправляется; плитка «Торговец» на ленте открывает экран корабела, а «Готово» возвращает к ленте ([Гавань](../base/pier.md)). Корабел платит полную цену ящика и ничего не продаёт: ремонт и заправка в гавани бесплатны.\n- **У станции** (`Game.Trade`): экран мытаря; «Мария» платит меньше и продаёт ремонт и топливо ([Станция](../world/outpost.md)).\n- **Пока экран открыт**, в одиночной игре море ждёт, в коопе идёт дальше, а лодка стоит без хода. Каждый игрок продаёт свой трюм на своей машине: трюм и монеты лежат у него, как раньше. Ремонт, купленный гостем, уходит хосту приказом, как расходник, и хост чинит корпус ([Кооператив](../online.md)). Потопленную лодку экран отпускает.\n- Непроданный ящик остаётся в трюме: плитка «Торговец» на ленте причала открывает тот же экран снова ([Гавань](../base/pier.md)). Клавиши экрана и реплики торговцев — решение без владельца, [Q176](../questions/haul.md#q176).\n- **Карта** (`MapView`, клавиша M): большое стекло HUD (`Lens`) посреди экрана. Оно смешивается со сценой и не читает экран, поэтому стоит поверх боя дёшево. Дым стекла — ровно такой, чтобы линии читались над светлой лагуной. Рельеф мира запекается один раз, и шейдер `map_plot.gdshader` рисует его светом (`MapPlot.Plotted`): суша — мягкая заливка под яркой белой линией берега, мели — слабая светлая заливка, изобаты 2, 5, 10 и 20 м — тонкие линии аква, чем глубже, тем бледнее, и сетка через 400 м. Поверх — несколько глубин цифрами и тонкая роза ветров. Гавань обведена оранжевым кольцом игрока с белым домиком, места заданий — золотыми кольцами цели. Название и подписи — белые слова с тёмным ореолом (`Pill.Engrave`), название — капителями вверху стекла. Лодок нет; метки на воде гаснут под стеклом, пока карта открыта. Карта проявляется, чуть вырастая, и закрывается, тая. Цвета — `Aqua` и `White` палитры, размеры, дым и яркость линий — в теме, тип `Map` ([Компоненты](../art/components.md)). Видно в демо `Instruments` (кадр `map` над глубиной, у отмели и ночью) и `Run/Offers`.\n- **Без продажи** трюм пропадает: при гибели (игра загружает последнее сохранение) и когда игрок уходит в море хоста или из него, о чём меню предупреждает.\n"}, {"id": "gameplay-hunters", "path": "gameplay/hunters.md", "title": "Охотники и ИИ", "section": "gameplay", "date": "2026-11-13", "md": "# Охотники и ИИ\n\n![Охотники заходят на лодку игрока](../img/hunters.jpg)\n\nОхотники — враги игрока в море. Здесь их виды и единый ИИ, управляющий каждой лодкой, кроме лодки игрока. Числа их лодок — в [Балансе лодок](../balance/boats.md), их огня — в [Балансе оружия](../balance/weapons.md).\n\n## Решения владельца\n- Охотники нескольких видов идут разом: таранщики, которые бросаются в атаку, рои маленьких, слабых и очень быстрых лодок и лодки, которые кладут игрока на траверз и стреляют. Дымовой рой маленьких юрких лодок ставит много дыма и видит сквозь него.\n- Директора нет (2026-11-11): охотники стоят на постах карты, и какие на каком — выбирают в редакторе ([Зоны и опасности](../world/areas.md)).\n- У охотника есть зрение: он гонится за лодкой игрока, только пока видит её, а когда она ушла из вида, забывает о ней.\n- Охотник дерётся до конца: ни один не выходит из боя и не идёт чиниться.\n- Охотники различаются мастерством, от зелёных команд до асов: как быстро отвечают, как аккуратно стреляют, как медленно перезаряжаются.\n- Броненосец, босс, имеет собственный корпус, больше любого, который может построить игрок, и дерётся этапами по мере того, как его броня сбивается.\n- Каждой лодкой, кроме лодки игрока, управляет один ИИ, планировщик действий по целям (GOAP), так что торговцы и караваны с охраной смогут присоединиться позже.\n- Много лодок разом остаются дешёвыми: ни одна не читает море каждый кадр.\n- Охотник стреляет, когда его выстрел попадёт, любым видом пусковой установки, который попал бы. За миг до выстрела его стойка на этом борту светится красным, и короткий звук выдаёт выстрел.\n- Рои идут на катерках: малом корпусе на два попадания, открытой спортивной лодке в 4–5 м с большим подвесным мотором.\n\n## Как устроено\nУ каждой лодки, кроме лодки игрока, есть `Captain`, планировщик действий по целям. Зачем GOAP: новый вид лодки приходит как данные, роль из целей и действий, без изменения планировщика.\n\n- **Факты** (`Facts.cs`): именованные булевы значения, упакованные в битовую маску. Факт с чувством читается на такте мысли; факт без него только порождается действиями и желается целями.\n- **Роли** (`Role.cs`): роль — это её цели и действия. Цель хочет фактов и говорит, насколько она важна сейчас. Действие стоит, требует фактов, приносит факты и, однажды начавшись, рулит лодкой каждый кадр и говорит, продолжается ли оно, закончено или провалено.\n- **Планировщик** (`Planner`): A* по фактам от того, что знает капитан, к тому, чего хочет его цель.\n- **Капитаны** (`Captain`): думает несколько раз в секунду, вразнобой между капитанами, преследует самую подходящую цель, для которой может составить план, и планирует заново, когда цель меняется, действие проваливается или потребности следующего действия перестают выполняться. Капитан стреляет установкой любого вида, ракетами первыми, когда его добыча лежит в её секторе, `Boat.Strikes` говорит, что попадёт, и ни одна лодка его стороны ближе добычи не лежит на линии (`Captain.Fouls`). Снаряды и так проходят сквозь свои лодки: это о том, как читается бой (решение без владельца, [Q139](../questions/combat.md#q139)). Выстрелу предшествует знак (`Captain.Fire`): `Boat.Telling` зажигает красным стойки того борта и вида (`Racks.Tell`, шар света `Glow.Halo`, как у мины) и играет короткий щелчок (`Cue.Tell`), и через мгновение капитан стреляет, если выстрел всё ещё попал бы. Хост шлёт знак в `Lie`, так что он виден на каждой машине. Знак дают только по лодке игроков: его читает игрок, а по чужой лодке капитан стреляет сразу (решение без владельца, [Q110](../questions/combat.md#q110)). Дроны стреляют без знака: они слишком быстры. Длина знака — решение без владельца, [Q110](../questions/combat.md#q110). Руль встречает размах носа.\n- **Команды** (`Crew`): зелёная, бывалая, ветеранская или ас ([Q29](../questions/combat.md#q29)). Более зелёная команда думает реже, стреляет по промахам и медленнее перезаряжается. Команду охотника поста выбирают в редакторе карт (`Post.Hunters`), охотников заданий — их код (`missions/`).\n- **Чувства** (`Senses`, `Lookout`, `Feelers`): наблюдатель — это то, что видит каждый капитан: лодки, грунт, дым, припасы на плаву, удары между корпусами и время боя (`World.Clock`). Добыча капитана — ближайшая лодка другой стороны на плаву, удерживаемая, пока другая не окажется намного ближе; он видит её в пределах своего зрения (`Captain.Sight`), если между ними нет суши, а дыма нет или у него тепловизор (`Lookout.Sees`), и помнит, где видел её в последний раз. Потеряв её из вида, он ищет её там ещё `Memory` секунд, затем забывает. Стража постов видит на `Senses.Seeing` (две дальности ракет); охотники заданий — своё зрение; налёты заданий и банд других карт видят на любом расстоянии, их скрывают только суша и дым (решение без владельца, [Q148](../questions/combat.md#q148)). Действия рулят и целятся только по увиденной добыче (`Captain.Quarry`), так что ослеплённый капитан держит огонь. Щупы прощупывают грунт по кругу, по обе стороны каждого курса на ширину корпуса с запасом, так что щель уже корпуса для них закрыта. Руль берёт свободный курс, ближайший к желаемому, и держит выбранную сторону, пока желаемый курс закрыт: обходя скалу, охотник не мечется между двумя сторонами. Новое чувство читается в `Senses` и показывается планам как факт.\n- **Рулёжка** (`Steering`): поведения, общие для действий: преследование с упреждением, укладка лодки на траверз на дистанции, прибытие в точку, бегство, обход по широкой дуге, следование по треку. Зачем трек: корпус скользит на повороте, так что рулёжка только по курсу идёт широко. Руль (`Captain.Steer`) отворачивает каждый курс от лодок близко впереди или на траверзе, но никогда от добычи, так что охотники держатся друг от друга подальше, а таранщик всё равно таранит. Капитан, который просит ход и несколько секунд не сдвигается с места (упёрся в скалу, в берег или в чужой корпус), ненадолго отходит задним ходом с переложенным рулём и заходит снова (`Captain.Unstick`): так выходят из затора ИИ в играх (решение без владельца, [Q186](../questions/combat.md#q186)).\n- **Стаи** (`Pack`): капитаны, делящие румбы вокруг лодки, расставленные равномерно.\n\nКапитан с домом (`Captain.Home`) крейсирует вокруг него и поворачивает назад, отойдя дальше `Strays`, так что забывший добычу страж возвращается к посту. Роли охотников (`ai/roles/`) все хотят потопить свою добычу (`Hunting`), крейсируют, пока её нет, и ищут там, где видели её в последний раз, когда она скрыта:\n\n- **Broadsider**: кладёт добычу на траверз на дистанции, готовым бортом к ней, и стреляет, когда борт попал бы; минёр (`Designs.Minelayer`) — тяжёлый патрульный с минным жёлобом: кладёт мины за кормой, когда добыча идёт следом (`Captain.Reach`).\n- **Rammer**: гонщик с тараном; преследователь (`Designs.Chaser`) идёт этой ролью на двух подвесных и с носовой стойкой и тараном. Он заходит туда, где не достаёт ни одна установка его добычи, бросается на нитро по упреждению, а после удара или промаха расходится и заходит снова.\n- **Swarm**: катерки на подвесном моторе; бегуны с турелью (`Designs.TurretRunner`) идут ею парами на воздушном винте. Они занимают места, по которым стая расставляется вокруг добычи, бросаются на нитро, стреляют проходя по траверзу и разворачиваются перезаряжаться. Зачем броски: пересекая траверз так быстро, они трудны для бортового залпа. Дымовой рой ставит завесы, бросаясь в атаку (`Designs.SmokeBoat`; [Q38](../questions/combat.md#q38)).\n- **Trader** идёт по маршруту отметка за отметкой, замедляясь, пока отстаёт его эскорт; **Runner** бежит к цели полным газом.\n\nОхотник дерётся до конца: ни один не выходит из боя и не идёт чиниться, хотя берёт любой припас, на который наехал. Охотники жгут нитро ([Q9](../questions/boat.md#q9)); таранщики и рои идут за плавающим нитро, когда их собственное израсходовано (`Fetching`), замедляясь, чем дальше от их трека лежит припас. Зачем: скользящий корпус кружит около припаса рядом по траверзу, а не достаёт его. Цель, причина которой меняется по ходу плана, остаётся актуальной, пока её план не кончится (`Captain.Pursuing`).\n\nДроны, которыми командует `Wingman`, — в [Сборки и стили игры](builds.md).\n"}, {"id": "gameplay-missions", "path": "gameplay/missions.md", "title": "Арена", "section": "gameplay", "date": "2026-11-13", "md": "# Арена\n\nАрена — единственный уровень игры: одна большая карта и бесконечный заход. Охотники стоят на постах, задания старых миссий случаются внутри, а гавань у пирса — на острове той же карты. Здесь заход, задания, броненосец и то, как заход начинается и кончается.\n\n## Решения владельца\n- Открытый мир: игра сразу начинается в море на Арене — при запуске, в новой игре и при загрузке сохранения.\n- Арена — одна большая карта и бесконечный заход, а события из каждого вида прежних миссий (конвой, курьер, маяки, груз, броненосец) случаются внутри.\n- Гавань — мастерская корабела на острове, к которой доплывают сами; экрана базы нет, это место открытого мира ([Гавань](../base/pier.md), 2026-11-13). Буёв выхода нет (2026-11-10).\n- Когда все лодки игроков потоплены, чёрные полосы закрываются с надписью «Погиб», и игра загружает последнее сохранение в открытый мир (2026-11-10).\n- Вступительной сцены нет (2026-11-11): заход сразу начинается в виде боя, руль сразу у игрока, HUD на месте, охотники живы.\n- Директора нет (2026-11-11): охотники Арены стоят на постах карты ([Зоны и опасности](../world/areas.md)).\n- Старт — своё место в стороне от середины карты: лодка идёт вдоль берега, суша по левому борту.\n\n## Как устроено\n- **Арена** (`progress/Missions.cs`, `maps/arena.json`, `Missions.Arena`): карта и её единственная «миссия» в одном файле. `Play` равен `\"run\"`, а `Setting.Base` равен `true`, так что `World` ставит пирс (`Dock`) у первого острова карты, `Home cay`. Карта описана в [Редакторе карт](../tools/map-editor.md).\n- **Старт** (`Game._Ready`, `Game.Embark` в `Game.SettingOut.cs`): игра загружает последнее сохранение и выводит лодку на старт Арены — по курсу `Mission.Bearing` от морской стороны пирса, в `Mission.Offing` от середины мира, на глубокой воде, полным ходом, сушей по левому борту, на полном баке. Игра сохраняется. Сразу вид боя и руль игрока (`Game.Start`): HUD въезжает сам, звучит «Вперёд», рация играет сцену `radio-start`. Так же начинает гость в коопе (`Game.Board`) и проба карты из редактора.\n- **Заход** (`missions/Run.cs`, `Operation`): сам не выигрывается и не проигрывается; идёт, пока лодки плавают. Лодки в море выводит `Sortie`. Цели на HUD: «Продержались» со временем захода, отсчёт «Идёт броненосец», затем цели открытых заданий.\n- **Гавань и снова в море**: швартовка у причала (`Game.Moor`) и отход от него (`Game.CastOff`) идут в том же живом мире, лодка его не покидает ([Гавань](../base/pier.md)). Сцена меняется за шторкой загрузки (`Game.Sail`, `Game.TakeUp`) только при загрузке сохранения, после гибели и когда гость уходит в море хоста или возвращается в своё.\n- **Заход не бросают**: пункта «На базу» в меню нет, заход кончается только гибелью или загрузкой сохранения. После [полигона](../base/testing-ground.md) (`Game.Leave`) начинается новый заход, а лодка стоит у причала на открытой верфи (`Game.Embark` с лодкой у причала).\n- **Гибель** (`Game.Returned`, `Hud.Died`): когда все лодки игроков ушли под воду, полосы закрываются с «Погиб», и через `Homeward` секунд игра загружает последнее сохранение. Заход сам гибель не судит (`Run.Lost`); миссия своей карты гибелью проигрывается («Ваша лодка потоплена»).\n- **События** (`Mission.Events`, `Event`): список в файле карты, у каждого `Play` и точки на карте (`Marks`): конвой — маршрут, курьер — откуда и куда, маяки — по порядку, груз — центры россыпей, броненосец — стоянка и точка, куда он смотрит. У каждого вида по две постановки на разных сторонах карты, у броненосца одна. Зачем точки в карте: карту делают и правят в редакторе, события едут с ней. Каждое задание выводит своих охотников (`Sortie.Muster`), сверх тех, что выходят с постов. Виды:\n  - **Конвой** (`Escort`): судно снабжения идёт по маршруту, налётчики идут на него; проиграно, если оно тонет.\n  - **Маяки** (`Beacons`, `Beacon`): по очереди пройти буи мимо охраны; ждут сколько угодно.\n  - **Курьер** (`Courier`): потопить безоружного курьера, уходящего в открытое море; проиграно, если он ушёл.\n  - **Груз** (`Cargo`): ящики потерянного судна снабжения на воде вокруг точек (`Sortie.Spill`); кончается, когда на воде не осталось ничего, кто бы его ни взял.\n  - **Броненосец** (`Ironclad`): босс на собственном корпусе (`Parts.IroncladHull`); держит свой пост, пока в броне, ложится бортом, с первой сбитой плитой зовёт двух гонщиков, а без брони идёт на таран.\n- **Предложения** (`Run.Judge`, `Run.Offer`): первое задание через 90 с, дальше примерно раз в 100 с, чуть вразброс. Виды берутся из мешка по разу за круг, не больше одного задания вида разом, курьера нет, пока на море броненосец. Постановка — ближайшая к игроку, но не ближе 250 м к любому игроку и не ближе 400 м к точкам открытого задания. Предложение — строка цели, объявление и маркер; взять задание значит дойти. Маркер гаснет, когда лодка подошла на 150 м. Место предложенного или открытого задания обведено маленьким золотым кольцом на карте (M, `MapView`); на HUD оно видно только на экране, золотой рябью — решение без владельца ([Q165](../questions/interface.md#q165)). Зачем так: игрок сам идёт на задание, как в рейсах Sea of Thieves. Такт и награды — решение без владельца ([Q129](../questions/missions.md#q129)).\n- **Итоги задания**: выигранное объявляется («Готово: …»), платит и убирается со списка вместе с маркерами; проигранное объявляет свою причину. Конвой, курьер и маяки платят ящиками на воде и припасами у каждой лодки игроков (`Run.Reward`); цифры в [Балансе экономики](../balance/economy.md).\n- **Броненосец**: за минуту до срока HUD отсчитывает «Идёт броненосец», в срок он выходит на свою стоянку в бухте с объявлением «Броненосец здесь». Идти к нему — выбор игрока. Потопленный, он даёт ремонт и броню каждой лодке, а квиток захода пишет «броненосец потоплен». Нетронутый, он остаётся, и бухта остаётся опасной ([Q131](../questions/missions.md#q131)).\n- **Круги арены и вставки** (`areas/Arenas.cs`, `camera/ShotCamera.cs`, `Game.Stage`, `Game.Cut` в `Game.Cuts.cs`): карта может отметить круг, и вид игрока стоит над ним, пока лодка внутри; вставка, названная кругом, играется при первом входе ([Камера и картинка](camera.md)). На Арене один такой круг — стоянка броненосца. Имя «арена» здесь занято дважды: уровень и вид зоны ([решено 11-12](../decisions.md)).\n\nКто и когда нападает: [Зоны и опасности](../world/areas.md), [Охотники и ИИ](hunters.md). Трюм и продажа: [Добыча](haul.md).\n\n## Открытые вопросы\n- [Q1](../questions/missions.md#q1): настоящие задания и боссы.\n- [Q17](../questions/missions.md#q17): какие охотники стоят вместе на постах.\n- [Q81](../questions/missions.md#q81): своя карта без охотников.\n- [Q128](../questions/missions.md#q128), [Q129](../questions/missions.md#q129), [Q131](../questions/missions.md#q131).\n"}, {"id": "gameplay-pickups", "path": "gameplay/pickups.md", "title": "Припасы", "section": "gameplay", "date": "2026-11-13", "md": "# Припасы\n\nПрипасы — нитро, ремонт, броня и топливо, которые всплывают в море и спускаются с неба.\n\n## Решения владельца\n- Припасы нитро, ремонта и брони появляются в море случайно, как аркадные припасы: наезд на один пополняет нитро, чинит корпус или прибавляет брони. Припасы брони синие. Любая лодка, и охотник тоже, берёт каждый, на который наехала, нужен он ей или нет.\n- Ремонт чинит треть того, что выдерживает корпус; броня пополняет запас попаданий брони, которые принимаются раньше попаданий корпуса, до трети того, что выдерживает корпус. Встречается и топливо: оно пополняет бак.\n- 2026-11-10: нужно больше припасов, например ремонт, спускающийся с неба на парашютах.\n\n## Как устроено\nЛюбая лодка, и охотник тоже, берёт каждый припас, на который наехала (`pickups/Pickups.cs`): нитро пополняет шкалу (`Nitro.Fill`), ремонт чинит попадания (`Boat.Mend`), броня пополняет запас попаданий брони, принимаемых раньше плит и корпуса (`Boat.Reinforce`), топливо доливает половину бака (`Fuel.Add`, `Pickups.Refuelling`; охотник, который топлива не жжёт, берёт его так же, без толку). Половина бака — число без владельца ([Q112](../questions/boat.md#q112)). Нитро ещё и восстанавливается со временем ([Лодка](boat.md)). Не взятый припас через полминуты мигает и гаснет; припас точки снабжения лежит, пока его не взяли.\n\n- **Откуда берутся** (`Strewing`): время от времени припас всплывает из моря вокруг случайной лодки игрока, вид с равными шансами, в кадре или рядом, в воде, до которой она доберётся, не больше трёх на плаву. Реже с неба падает сброс в 40–80 м от случайной лодки игрока (пока на воде и в воздухе меньше шести), и его вид выбирается по нужде лодки (`Pickups.Lacking`): ремонт, если корпус меньше двух третей, иначе топливо, нитро или броня, тем вероятнее, чем меньше их осталось. Ритм и подбор — решение без владельца ([решено 11-12](../decisions.md)). Кроме того, припасы лежат в точках снабжения карты (`Depots`, [Зоны и опасности](../world/areas.md)), и их раздают выполненные задания ([Арена](missions.md)). Расходники из трюма действуют как те же припасы ([Добыча](haul.md)).\n- **Вид** (`PickupModel`, `Glow.Halo`): эмблема, лежащая плашмя в своём цвете, так что читается с высоты: двойной шеврон для нитро, гаечный ключ для ремонта (никогда не красный крест, защищённая эмблема), светло-голубой щит в белом ободе для брони, поскольку тёмно-синий теряется на синем море, фиолетовая капля для топлива: цвет, которого нет ни у нитро, ремонта и брони, ни у HUD (оранжевый игрок, красные охотники, золотые цели, аква союзники, синяя броня). Взятое топливо звучит как нитро: своего звука у него нет. Когда припас взят, `Effects` бросает искры, а HUD пишет, что он дал.\n- **Сброс с неба** (`Pickups.Airdrop`, `PickupModel.CrateOf`, `PickupModel.CanopyOf`, `PickupModel.RingOf`): ящик под круглым куполом из ярких долей цвета припаса и белых медленно спускается, качаясь, над кольцом на воде, которое сужается к месту посадки. Пока он в воздухе (`Pickups.Descending`), взять его нельзя, и охотники его не видят. На воде он плюхает всплеском (`Pickups.Landed`), купол складывается и тает, а ящик становится обычным припасом. Зачем: аркадные сбросы читаются издали и дают игроку цель. Гостям хост сообщает каждый припас, кто его взял и сколько он дал (`Pickups.Supplied`, `Say.Supplied`, `Say.Took`); гость сам припасов не берёт (`Pickups.Told`), а надпись пишет по числу хоста (`Pickups.Take`). Свой бак гость доливает у себя.\n- **Езда** (`waters/Riding.cs`): небольшой поплавок (припас, ящик на плаву) читает высоту и уклон моря в трёх точках раз в такт и сглаживает между чтениями. Зачем: поплавки остаются дешёвыми.\n"}, {"id": "gameplay-progression", "path": "gameplay/progression.md", "title": "Прогресс и сохранения", "section": "gameplay", "date": "2026-11-13", "md": "# Прогресс и сохранения\n\nЧто игра помнит между заходами: монеты, купленные детали и лодку, и как она сохраняется.\n\n## Решения владельца\n- Кампании и уровней нет: в игре одна [Арена](missions.md), открытый мир, в котором игра и начинается.\n- Игрок строит лодку из деталей, покупаемых за монеты в верфи. Деталей не крафтят: каждая только покупается (2026-11-09). Расходники оплачивают ящиками из трюма (2026-11-11, [Добыча](haul.md)).\n- Добыча превращается в монеты сразу, когда её продают: в гавани у пирса или у плавучей станции в море ([Добыча](haul.md)).\n- Игра сохраняется сама по ходу.\n- Сохранение хранит прогресс (монеты, детали, лодку), а не бой как он стоит. Гибель загружает последнее сохранение ([Арена](missions.md)).\n- Новая игра начинается с 10 000 монет.\n\n## Как устроено\n`Progress` (`progress/Progress.cs`) хранит монеты, купленные детали, проект лодки, с которым выходили в последний раз, и факты сюжета (`Facts`). Каждая деталь продаётся на верфи, детали стартовой лодки принадлежат с самого начала ([Q56](../questions/missions.md#q56)). Монеты приходят от проданной добычи (`Progress.Earn`) и из сцен сюжета, уходят на детали (`Progress.Buy`); цифры в [Балансе экономики](../balance/economy.md).\n\nАвтосохранение (`Progress.Autosave`) пишет в слот, который в игре: при старте захода (запуск, новая игра, загрузка), при швартовке у причала, при уходе с экрана торговца, при выходе на полигон и при выходе из верфи. Новая игра занимает первый пустой слот, а когда заняты все, сохраняется только вручную ([Q50](../questions/interface.md#q50)). Слотов пять; сохранить, загрузить и начать заново можно в судовом журнале ([Экраны и меню](../interface/screens.md)). Сохранение пишется рядом со слотом и переименовывается поверх него, так что неудачная запись оставляет слот как был; слот, который не читается, ничего не загружает.\n\nВерфь, где покупаются детали, описана в [Верфь](../base/boatyard.md).\n"}, {"id": "gameplay-sites", "path": "gameplay/sites.md", "title": "Места промысла", "section": "gameplay", "date": "2026-11-13", "md": "# Места промысла\n\nМеста в море, где работают во время захода: косяки, где ловят рыбу, и обломки, которые поднимают. Каждое открывает вид сбоку.\n\n## Решения владельца\n- Места в море для работы: косяки для рыбалки и обломки для подъёма. Каждое открывает вид сбоку, трёхмерный разрез через воду с лодкой игрока над ним, в собственном свете игры. Рыбалка идёт в нём; подъём — это захват на тросе с лодки, как автомат-кран в аркаде. Рыба считается добычей.\n- В виде сбоку натяжение лески видно на самой леске и на стеклянном циферблате у удилища, а пойманная рыба или поднятая вещь показывается крупно на карточке: её название, длина, вес и добыча.\n- То, что поднято на борт видом сбоку, идёт в трюм, как добыча, а не продаётся сразу; бой тем временем идёт дальше.\n\n## Как устроено\nМеста ставит `Site.Strew` (`activities/Site.cs`) при старте захода. Карта может закрепить их: на Арене (`maps/arena.json`) четыре косяка и четыре обломка, у обломков свои списки ящиков. Карта без закреплённых мест получает один косяк и один обломок в случайной воде, достаточно глубокой, чтобы работать, и достаточно мелкой, чтобы видеть дно ([Q31](../questions/haul.md#q31)). HUD подписывает места на экране. Когда лодка медленно лежит в досягаемости места, и охотников рядом нет, `Space` открывает вид сбоку. Бой идёт дальше за ним: лодка лежит без хода, как держала бы её команда с убранным газом, а охотник, подошедший ближе, закрывает вид и предупреждает «Охотники близко» (решение без владельца, [Q115](../questions/haul.md#q115)). Вид только у местного игрока.\n\n- **Косяк** (`Shoal`, `Gull`): всплески вскипают воду под кружащими чайками ([Q34](../questions/haul.md#q34)). Его стая (`Catch`) держится весь заход.\n- **Обломок** (`Wreck`): корпус охотника на дне, у него буй, поднимаются пузыри. Его вещи (`Salvage`) держатся весь заход. Охотник, затонувший там, где дно в досягаемости захвата (`Site.Reached`, глубина от 4,5 до 12 м), становится таким обломком на месте: его корпус — тот самый, что лежит на дне, а вещи — из того, что несёт его проект (`Wreck.Of`, `Game`). Затонувшие вне досягаемости высыпают добычу на воду. Пока места промысла не онлайн, обломок из затонувшего охотника рождается только в игре без связи ([Q117](../questions/haul.md#q117)).\n- **Вид сбоку** (`SideView`, `waters/Section.cs`): вертикальная плоскость срезает море и грунт (`section.gdshaderinc`), а грань вдоль плоскости рисует воду сбоку и дно в разрезе (`section.gdshader`, `sediment.gdshaderinc`), читая те же следы, что и море. Вид ныряет сверху лодки и уходит, поднимаясь. Зачем разрез в мире: вид сбоку показывает воду под лодкой в собственных море, грунте и свете игры. Слева вверху — тот же список на дымчатом стекле, что у целей HUD (`ListPane`): название дела капителями и что сейчас происходит. Значки клавиш и новости — тоже детали HUD (`Gloss.Hints`, `Toasts`). Размеры списка — в теме, тип `Note`, поля и виньетка — тип `Screen`. Циферблат лески подписан капителями, как приборы HUD.\n- **Карточка добычи** (`HaulCard`, `Specimen`): то, что подняли на борт, всплывает на карточке из дымчатого стекла HUD (`Lens`), ровной, без скотча: его собственная модель, один раз нарисованная в маленьком `SubViewport`, в скруглённом окне с водой; под ней белыми словами название, длина, вес и добыча, подписи капителями. Размеры и шрифты — в теме, тип `HaulCard`. Поднятое не продаётся: оно ложится в трюм местного игрока (`SideView.Landed`, `Hold.Take`), если там есть место, а без места рыба отпускается, вещь падает обратно на обломок, и заметка об этом говорит ([Q31](../questions/haul.md#q31)).\n- **Рыбалка** (`Fishing`, `Swimmer`, `FishModel`, `FishForm`): леска вытравливается и сматывается до глубины рыбы; рыба у крючка клюёт, затем борется рывками, и сматывание во время рывка напрягает леску ([Q32](../questions/haul.md#q32)). Когда рыба на крючке, заметка говорит, рвётся ли она (перестать сматывать) или отдыхает (сматывать), а лампа циферблата мигает красным весь рывок ([Q65](../questions/interface.md#q65)). У каждого вида своя форма (`FishForm`). У рыбы своя длина в пределах диапазона её вида (`Catch`), а весит она как её длина в кубе ([Q51](../questions/haul.md#q51)). В трюме рыба и вещь — предметы каталога (`Items`): у вида два размера, обычный и «большой» (`Catch.Sizes`, `Salvage.Light`/`Heavy`), потому что прогресс хранит предметы по названию ([Q116](../questions/haul.md#q116)); в трюме вес размера, на карточке настоящий; в трюме рыба или вещь занимает одно место, как ящик, и в полном трюме тоже вытесняет дешёвое. Леска — полоса, рисуемая каждый кадр, которая краснеет по мере приближения натяжения к разрыву; циферблат у кончика удилища (`LineDial`) его показывает: круглая линза стекла HUD (`ui/Lens.cs`), как приборы лодки; море видно сквозь неё, к середине она темнее, стрелка та же, что у приборов, а лампа — маленькая линза, ловящая красный цвет охотников. Размеры — в теме, тип `LineDial`. Наживка большая и яркая, мягко светится (`Glow.Halo`), так что читается в мути.\n- **Подъём** (`Salvaging`): захват на тросе, маятник, который толкает ход лодки. Space его роняет; он смыкается на том, что лежит под ним, и поднимает, а вещь, схваченная не за середину, может соскользнуть обратно ([Q33](../questions/haul.md#q33)); сомкнувшийся на пустоте получает об этом сообщение. Каждая вещь весит своё в пределах диапазона её вида (`Salvage`).\n\nЧто делают с добытым, описано в [Добыча](haul.md).\n"}, {"id": "glossary", "path": "glossary.md", "title": "Глоссарий", "section": "", "date": "2026-11-13", "md": "# Глоссарий\n\nТермины игры по-английски (как в коде) и по-русски (как в игре и в вики). Слова интерфейса берутся из перевода игры, `game/locale/ru.po` ([Язык](interface/language.md)); новое слово сначала ищи там: `grep -A1 'msgid \"Term\"' game/locale/ru.po`.\n\n## Игра\n| English | Русский |\n| --- | --- |\n| arena, run, mission, objective | арена, заход, задание, цель |\n| Mission complete / Sunk / Died / Out of fuel / Extracted | Задание выполнено / Потоплен / Погиб / Кончилось топливо / Вышли |\n| hunter, band, post | охотник, банда, пост |\n| haul, salvage, item, hold, slot, kit | добыча, добыча (её ценность), вещь, трюм, место, расходник |\n| crate, drum, bale, chest | ящик, бочка, тюк, сундук |\n| site, shoal, wreck, side view, claw | место промысла, косяк, обломки, вид сбоку, захват |\n| pickup, supplies, repair, fuel, tank, nitro, smoke | припас, припасы, ремонт, топливо, бак, нитро, дым |\n| strike, lock, target, roulette | попадание, захват цели, цель, рулетка |\n| setting, landform, area, hazard | локация (в игре «Место»), форма рельефа, зона, опасность |\n| outpost, Mariia, Trade at Mariia | станция, «Мария», Торговать на «Марии» |\n| curtain, toast | шторка загрузки, уведомление |\n| cut scene, shot | вставка, кадр |\n| host, guest | хозяин игры (хост), гость |\n\n## Гавань и лодка\n| English | Русский |\n| --- | --- |\n| harbour, pier, shipwright, boatyard, testing ground, cast off | Гавань, причал, Корабел, Верфь, Полигон, Отчалить |\n| logbook | Судовой журнал |\n| captain, shipwright, tollkeeper | капитан, корабел, мытарь |\n| trader's screen, Trader (the pier's tile) | экран торговца, «Торговец» (плитка причала) |\n| coins | монеты |\n| dummy | макет |\n| part, station, gear, hull, engine | деталь, место, снаряжение, корпус, двигатель |\n| skiff, punt, racer, patrol boat, gunboat, runabout, ironclad | Ялик, Плоскодонка, Гонщик, Патрульный катер, Канонерка, Катерок, Броненосец |\n| racks, chase rack, launcher, turret, drone | направляющие, носовая стойка, пусковая установка, турель, дрон |\n| cradle, mine rail, mine | люлька, минный жёлоб, мина |\n| armour belt, plate, ram, rammer | броневой пояс, плита, таран, таранщик |\n| thermal sight, fire control, bilge pump, carpenters, smoke generator | тепловизор, управление огнём, трюмная помпа, плотники, дымогенератор |\n\n## Сюжет и интерфейс\n| English | Русский |\n| --- | --- |\n| scene, passage, screenplay, trigger, requires | сцена, эпизод, сценарий, повод, условие |\n| radio, portrait, balloon, pill | радио, портрет, выноска, глянцевая кнопка-пилюля |\n\n## Разработка\n| English | Русский |\n| --- | --- |\n| owner | владелец |\n| my call | решение без владельца |\n| demo, case, selector, check | демо, кейс, селектор, проверка |\n"}, {"id": "interface-controls", "path": "interface/controls.md", "title": "Управление", "section": "interface", "date": "2026-11-13", "md": "# Управление\n\nИгра идёт с клавиатуры, курсором и геймпадом. Геймпад работает везде, кроме редактора карт.\n\n## Решения владельца\n- Мышью в море не целятся (2026-11-10): ракеты и торпеды идут в захваченную цель. Стик геймпада целит как раньше.\n- Игра идёт и с геймпада, и с клавиш и курсора: в море, в меню, у причала, на верфи и в виде сбоку, везде, кроме редактора карт. Пока геймпад использовался последним, подсказки клавиш показывают кнопки геймпада.\n- Расходники — на клавишах 1–4 (2026-11-11, [Добыча](../gameplay/haul.md)).\n\n## Клавиши в море\n\n| Клавиша | Что делает |\n| --- | --- |\n| `W` `A` `S` `D` или стрелки | руль и газ |\n| `Shift` | нитро (рывок) |\n| `Q` / `E` | огонь левым / правым бортом |\n| Левая кнопка мыши | огонь бортом, который достаёт захваченную цель |\n| `F` | дым |\n| `C` | следующее оружие |\n| `1`–`4` | расходник: ремкомплект, бронеплита, баллон нитро, заряд, оплаченный ящиками из трюма |\n| `Space` | то, что предложено под лодкой: швартовка в гавани, торговля у станции, работа на месте промысла |\n| Колесо мыши | ближе / дальше |\n| `M` | карта |\n| `Esc` | закрыть карту, иначе пауза |\n| `F3` | отладочная карточка |\n\nВставку пропускают `Esc`, `Space`, `Enter` или щелчок.\n\n## Клавиши вне моря\n- **У причала** (`Quayside`): `A` `D` или стрелки — по плиткам, `Enter` или щелчок — открыть, `Tab` — верфь, `Space` — отчалить, `Esc` — меню.\n- **Верфь** (`Boatyard`, `YardCamera`): `A` `D` — место, `W` `S` — деталь, `Enter` — поставить, `T` — «Испытать», `Esc` или `Tab` — готово; перетаскивание или `Q` `E` вращают вид, колесо или `R` `F` приближают.\n- **Вид сбоку** (`SideView`): `A` `D` — лодка вдоль места, `Space` — подъём груза, `W` `S` — леска на рыбалке, `Esc` или `Tab` — уйти.\n- **Диалог** (`talk/Dialogue.cs`): `Enter` или `Space` — дальше, `W` `S` — ответ, `1`–`9` — ответ по номеру, `Esc` — пропустить, пока ответов нет.\n- **Экран торговца** (`ui/Counter.cs`): `W` `A` `S` `D` или стрелки — по карточкам и между рядами, `Enter` или щелчок — продать ящик или купить товар, `Space` — «Продать всё», `Esc` — «Готово» ([Q176](../questions/haul.md#q176)).\n\n## Как устроено\n- **Клавиши моря** (`players/Controls.cs`): читают команду местного игрока (`Command`): зажатые клавиши и приказы, нажатые с прошлого чтения. Щелчок по морю — приказ огня по захвату; курсор ничего не наводит. Остальные клавиши моря разбирает `Game._UnhandledInput`, колесо — `IsometricCamera`.\n- **Клавиши экранов** (`ui/Keys.cs`): W A S D двигают фокус в экранах, как стрелки, — так же, как правят лодкой.\n- **Геймпад** (`players/Pad.cs`, `ui/Buttons.cs`): один узел превращает кнопки геймпада в события клавиш, которые экраны и лодка уже принимают, так что каждый обработчик клавиш и зажатая клавиша работают как раньше. Два слоя, у каждого своя таблица: морской, пока лодка местного игрока принимает команды, и экранный в остальных случаях (`Game.Helming`); то, что зажато при смене слоя, ничего не делает в новом, пока не отпущено. Стик тоже рулит в море (`Pad.Helm`, читается `Controls`): его x — руль, курки (RT вперёд, LT назад) или его y — газ. В экранах движение стика или D-pad повторяется, как зажатая стрелка в меню. Start отступает на один уровень в обоих слоях. Последнее использованное устройство (событие геймпада или клавиша) заставляет `Gloss.Key` рисовать кнопку, которая посылает клавишу (`Buttons`), так что каждый ряд подсказок, пилюля и выноска следуют за ним.\n  - **Море**: стик — руль; RT/LT — газ; A — нитро (`Shift`); LB/RB — огонь левым/правым бортом (`Q`/`E`); B — дым (`F`); правый стик — наводка (`Pad.Aim`); D-pad вверх — следующее оружие (`C`), вниз — `Space`; Start — `Esc`; Back — карта (`M`); D-pad влево и вправо, X и Y — расходники `1`–`4` ([Q153](../questions/interface.md#q153)).\n  - **Экраны**: D-pad или стик — стрелки; A — `Enter`; B и Start — `Esc`; Back — `Tab`; X — `Space`; Y — `T` («Испытать» на верфи); LB/RB — `Q`/`E`; LT/RT — `F`/`R` (поворот и приближение на верфи); правый стик вращает вид верфи (`Pad.Looking`) ([Q67](../questions/interface.md#q67)).\n- Клавиши моря перечислены на отладочной карточке (`ui/DebugPanel.cs`, [HUD](hud.md)).\n"}, {"id": "interface-hud", "path": "interface/hud.md", "title": "HUD", "section": "interface", "date": "2026-11-13", "md": "# HUD\n\n![HUD над глубокой водой](../img/hud.jpg)\n\nHUD — то, что видно на экране в море: цели захода, кольца на воде, приборы лодки, расходники и трюм, уведомления.\n\n## Решения владельца\n- HUD показывает только то, на чём держится игра: ни часов боя, ни радара, ни значка лодки, ни показаний стоек, скорости или повреждений, кроме попаданий в корпус. Стрелок вокруг лодки нет: на то, что за экраном, HUD не указывает (2026-11-11). Клавиши перечислены на отладочной карточке, а не на HUD; она закрыта, пока её не откроют F3 (2026-11-10). Нет красной вспышки, когда лодку бьют, и нет предупреждения о ракетах, выпущенных по игроку.\n- Линия огня каждой заряженной стойки ложится на воду только при управлении огнём на борту: это снаряжение, которое игрок получает для лодки на верфи.\n- В море охотник отмечен кольцом на воде вокруг него, его попадания остаются дугой кольца: у малой лодки дуга на каждое попадание, у большого корпуса одна дуга, которая пустеет с каждым попаданием и размечена через каждые пять. Названа только цель, на табличке. Новости приходят уведомлениями, выезжающими сверху; цели написаны на записке, приклеенной в углу.\n- В море приборы лодки собраны в кластер в углу экрана: найденные и починенные устройства старого мира.\n- 2026-11-12: стекло Frutiger Aero перенесено на HUD ([Компоненты](../art/components.md)): приборы, рулетка, расходники, трюм, уведомления и таблички.\n- HUD в море въезжает по частям в начале захода. Решённая миссия закрывает чёрные полосы на вердикте, пока набранная добыча считается вверх, и они открываются снова, пока лодка на плаву, чтобы она шла домой. Цвета держат по одному смыслу: оранжевый — игрок и захват, красный — охотники, золотой — цель и места для работы, аква — союзники ([Палитра](../art/palette.md)).\n- HUD не указывает ни на какие предметы на плаву, ящики тоже.\n- У каждого врага случайное лицо (11-10).\n- Добыча — ряд слотов трюма прямо на HUD (11-11, [Добыча](../gameplay/haul.md)). Панель расходников — в левом нижнем углу (11-11).\n\n## Как устроено\n- **HUD** (`ui/Hud.cs`; части `Objectives`, `Dash`, `Roulette`, `KitBar`, `HoldRow`, `Markers`, `Toasts`, `Verdict`; движение `Motion`): въезжает по частям в начале захода и после выхода из гавани. Синий в нём — броня. Его стёкла (`Lens`) смешиваются со сценой и экран не читают: море видно сквозь них без преломления, и весь HUD стоит около 0,1 мс кадра ([Компоненты](../art/components.md)). Лампы и значки в нём — тоже маленькие круглые линзы этого стекла, ловящие свет своего смысла; глянцевого геля в HUD не осталось. Слова на стекле пишутся одним способом, белыми с тёмным ореолом своей формы (`Pill.Engrave`); слова прямо над водой — со своей тёмной каймой (`Style.Write`). Размеры, места, кегли и доли дыма и света каждой части — в теме (`ui/look.tres`, типы `Dash`, `Dial`, `Wheel`, `Kit`, `Slot`, `Notice`, `Plate`, `Markers`, `Note`, `Verdict`, `Letterbox`). Решение без владельца, как и остальной облик стекла HUD: [решено 11-12](../decisions.md).\n  - `Objectives`: цели слева вверху на панели-списке (`ListPane`, тип темы `Note`): дымчатое стекло, белые слова, у каждой цели круглая линза; выполненная линза наливается зелёным, в ней проступает галочка, строка тускнеет. Счёт — справа, при смене он вспухает. Панель падает сверху и уходит вверх. Тот же список — у вида сбоку ([Места промысла](../gameplay/sites.md)). На Арене это время захода, отсчёт до броненосца и открытые задания ([Арена](../gameplay/missions.md)). Условие, по которому миссия своей карты проигрывается (удержать на плаву), пишется без галочки, так как оно никогда не выполнено.\n  - `Markers`: кольца на воде вокруг лодок, которые видит игрок, дуга на каждое попадание, которое корпус выдерживает, или, после восьми, одна пустеющая дуга с отметкой через каждые пять ([Q63](../questions/interface.md#q63)), аква для союзников, золотые для цели; береговые батареи окольцованы, как охотники; поворачивающиеся дуги захвата; клавиша стороны, которая попала бы в цель захвата (`Player.Target`, `Boat.Strikes`): яркая, пока борт заряжен, и тусклая под вуалью, пока он перезаряжается; места промысла (пунктирный круг с названием) и места заданий (золотая рябь). Гавань и станцию HUD не отмечает: место швартовки — кольцо стеклянных поплавков на воде ([Гавань](../base/pier.md)). Метки рисуются только у того, что на экране. У лодки игрока на воде лежат веера выбранного оружия, тот, что держит наводку, ярче, а в точке наводки кольцо (`Markers.Fans`, [Бой](../gameplay/combat.md)). Управление огнём рисует ещё и линии огня выбранного оружия. Метки охотника, скрытого дымом, исчезают и возвращаются; кольца захвата сходятся один раз, когда он впервые виден. Над лодкой всплывают попадания, взятая добыча и припасы; у обломков лодки игрока — кольцо подъёма ([Онлайн-кооп](../online.md)).\n  - **Лицо врага** (`Markers.Face`): рядом с табличкой захваченной цели портрет, один из восьми (`assets/portraits/foe-*`), выбранный по лодке; сердит сразу после попадания по ней, удивлён на последнем ударе. Решение без владельца: [Q147](../questions/interface.md#q147).\n  - Под лодкой на стеклянной пилюле — то, что делается на `Space`: «Гавань», «Торговать на „Марии“» у станции или работа на месте промысла, — или предупреждение «Охотники рядом». Табличка цели и имена — тоже дымчатое стекло, ловящее цвет своего смысла, слова белые; цвет дают только линза и её свет.\n  - `Toasts`: новости на дымчатых стеклянных пилюлях сверху, не больше трёх; предупреждение ловит красный свет. Среди них бак на исходе («Мало топлива», «Идите в гавань»), полный трюм и пустой бак. Значок слева — круглая линза: зелёная у хорошей новости, оранжевая у потопленного охотника (цвет игрока), красная у предупреждения ([Q65](../questions/interface.md#q65)). По хорошей новости проходит блик, тот же, что по ромбу рулетки (`Gloss.Glint`).\n  - `Verdict`: закрывает полосы при гибели всех лодок игроков («Погиб», `Hud.Died`) и на решённой миссии своей карты (с тем, почему она проиграна, или с подсчётом добычи). Заход Арены сам не решается.\n  - `Dash`: приборы лодки внизу справа: деления корпуса вокруг большого циферблата, броня, нитро, топливо над красным запасом, его лампа мигает, когда оно на исходе, заряд дыма. Каждый прибор — круглая дымчатая линза, показания поверх стекла; кронштейна под ними нет. Подпись под прибором — мелкие белые капители с тёмным ореолом (`Gloss.Caption`), прямо на воде, без плашки: они читаются и над отмелью, и ночью. Нитро в работе наливает линзу оранжевым, дым — аквой; лампа топлива — своя маленькая линза под стрелкой, она загорается красным вместе с линзой топлива и дымчатая, пока не горит; удар пускает по линзе корпуса кольцо света. `Roulette` лежит над циферблатом: колесо стеклянных ромбов по видам пусковых установок, которое поворачивается к выбранному; над ним плоский оранжевый указатель, под ним имя выбранного такими же капителями. Лампы гнёзд дронов на их ромбе — маленькие линзы: зелёная, пока дрон в гнезде, оранжевая, пока он вышел, дымчатая и мигающая, пока его чинят или отстраивают.\n  - `KitBar`: панель расходников в левом нижнем углу, вровень с планкой приборов, поднимается и опускается вместе с ними: плитка на каждый расходник с клавишей 1–4, двумя ящиками рецепта (яркие, когда они на борту) и тем, сколько раз трюм может за него заплатить; плитка — маленькое стекло, которое ловит свет, ближайший к цвету расходника (зелёный ремонт, синяя броня, оранжевое нитро, красный заряд), гуще у дна; тусклая, пока платить нечем или лодке он не нужен, и вздрагивает со щелчком на отказ ([Добыча](../gameplay/haul.md)).\n  - `HoldRow`: ряд трюма прямо над панелью расходников, одной группой с ней: место на каждый слот корпуса, пустое — едва видное стекло, занятое — дымчатое стекло с плоской картинкой ящика в его цвете (`CrateArt`), в конце монета и цена трюма в монетах. Новый ящик выскакивает в место, вытесненный или потраченный улетает, вытесненный — с всплеском. Решение без владельца, как и виды ящиков: [Q162](../questions/haul.md#q162).\n- **Карта** (`MapView`, `MapPlot`): стекло с рельефом мира в линиях света ([Добыча](../gameplay/haul.md)) стоит поверх HUD, пока открыта (M), и метки на воде под ней гаснут; на ней обведены гавань и места заданий ([Арена](../gameplay/missions.md), [Q165](../questions/interface.md#q165)). Рельеф карта берёт у мира, как он уже поднят (`World.Landforms`): поднимать его заново стоило от четверти секунды при первом открытии.\n- **Отладочная карточка** (`DebugPanel`): окно ([Экраны и меню](screens.md)) с частотой кадров и клавишами моря.\n"}, {"id": "interface-language", "path": "interface/language.md", "title": "Язык", "section": "interface", "date": "2026-11-13", "md": "# Язык\n\nСлова игры переведены на язык игрока.\n\n## Решения владельца\n- Игра переведена: её слова на языке игрока.\n\n## Как устроено\nСлова игры пишутся по-английски и ищутся в каталогах gettext, `game/locale/<lang>.po`, через `TranslationServer` Godot: `Tr`, `Format` (формат из {0}), `Plural` (собственные формы множественного числа языка) и `Marked` (имя, оставленное по-английски и ищущееся там, где показывается). `Marked` с вставками даёт фразу (`Phrase`): английский формат и то, что в него вставлено; она переводится там, где показана (`Phrase.Said`). Фразами говорят задания: цели, объявления и причина вердикта идут гостю по сети по-английски, и он читает их на своём языке ([Онлайн](../online.md)). Почему gettext: Godot читает .po как есть, а недостающее слово остаётся английским. `tools/locale.py` собирает слова из кода, названий карт и реплик сюжета в каждый каталог, сохраняя переведённое; `--check` падает, пока слова не хватает или его {0} не совпадают с английскими. Язык меняется сразу, без перезапуска: меню собирает свои пункты заново при каждом открытии (`Game.Pause`), лента причала, верфь, журнал и экран торговца, построенные один раз, переписывают плитки, заголовок и пилюли по уведомлению Godot о смене перевода (`Quayside`, `Boatyard`, `Logbook`, `Counter`), а остальное пишет слова при отрисовке. Английский и русский; игра стартует на языке системы, а «Язык» на странице настроек идёт по кругу между ними ([Q75](../questions/interface.md#q75)).\n"}, {"id": "interface-screens", "path": "interface/screens.md", "title": "Экраны и меню", "section": "interface", "date": "2026-11-13", "md": "# Экраны и меню\n\n![Меню базы](../img/menu.jpg)\n\n![Судовой журнал: окно матового стекла со строками](../img/logbook.jpg)\n\nЭкраны поверх моря: меню, экран торговца, настройки, судовой журнал и окна инструментов. Ленты плиток причала и верфи — на страницах [Гавань](../base/pier.md) и [Верфь](../base/boatyard.md).\n\n## Решения владельца\n- Интерфейс сделан из вещей мира. У причала и на верфи — ленты плиток вдоль низа экрана, как в гараже NFS ([Гавань](../base/pier.md), [Верфь](../base/boatyard.md)); 2026-11-11 плитки стали прозрачным стеклом Frutiger Aero с движением ([Компоненты](../art/components.md)).\n- 2026-11-12: стекло перенесено с плиток базы на меню, карточки верфи и HUD ([Компоненты](../art/components.md)).\n- 2026-11-13: судовой журнал — окно матового стекла со строками. Каждое сохранение — строка с маленьким снимком; выбранная строка — в стекле со светом, как в меню. Бумаги, скотча и рукописного шрифта в нём нет.\n- Добыча продаётся на экране торговца, а не на квитке (2026-11-13): бумаги в интерфейсе больше нет, квиток, его штамп и скотч ушли ([Добыча](../gameplay/haul.md)).\n- Редактор карт, отладочная карточка, селектор демо и шторка загрузки — программные окна 2000-х: матовое аквамариновое стекло и глянцевые кнопки.\n- Меню паузы в бою, с сохранением и загрузкой по слотам. Онлайн оно не останавливает бой ([Онлайн-кооп](../online.md)).\n- Страница настроек в меню с тем, что игроку нужно задать. Апскейлер — одна из настроек; MetalFX Temporal пока остаётся по умолчанию. Общего выключателя звука нет: музыку и эффекты убавляют их шкалами. У шкал есть стрелки влево и вправо.\n- Игра сохраняется сама: см. [Прогресс и сохранения](../gameplay/progression.md).\n\n## Как устроено\n- **Меню** (`ui/Menu.cs`, `ui/Pill.cs`): столбец простых белых слов у левого края, приходящих одно за другим; стекло только на выбранном пункте — прозрачная пилюля со светом лагуны вокруг слов, к которой по столбцу скользит линза света ([Компоненты](../art/components.md), решение без владельца: [Q166](../questions/interface.md#q166)); курсор берёт фокус, так что выбран один. Затемнение сцены лёгкое и только у левого края, чтобы стекло оставалось стеклом. `Pill` — одна пилюля; у верфи они прозрачные всегда, несут колпачок клавиши и никогда не берут фокус. Стрелки или W A S D и Enter управляют меню. Заметка меню встаёт выноской у пункта, который её вызвал. Выбор, теряющий прогресс, предупреждает выноской при первом нажатии и действует при втором: «На базу», «Выход», «Демо», редакторы, «Загрузить» и «Новая игра» журнала предупреждают о добыче в трюме, иначе о несохранённом прогрессе ([Q62](../questions/interface.md#q62)).\n  - **Меню одно** (`Game.Pause`, Esc в море и у причала), отдельного меню базы нет (2026-11-13): «Продолжить», «Сохранить», «Загрузить», «Кооператив», «Настройки», «Инструменты», «Выход». «Инструменты» — страница с «Демо», «Редактор карт», «Редактор сюжета». В одиночной игре меню ставит игру на паузу; со связью бой идёт дальше. «Выход», «Инструменты» и вход в чужую игру с первого нажатия только предупреждают о том, что пропадёт: добыча в трюме, несохранённое или заход в море; у причала с пустым трюмом и сохранённой игрой предупреждать не о чем. В пробе карты из редактора пункты — «Продолжить», «Настройки», «В редактор», «Выход»; на полигоне вместо «В редактор» — «Назад на верфь». Состав меню и страница «Инструменты» — решение без владельца ([Q180](../questions/interface.md#q180)).\n- **Экран торговца** (`ui/Counter.cs`): у пирса и у станции, поверх сцены; как он устроен — [Добыча](../gameplay/haul.md).\n- **Настройки** (`ui/Settings.cs`): страница стеклянных переключателей, шкал и выборов (`Gloss.Switch`, `Gloss.Gauge`): язык ([Язык](language.md)), громкость музыки и эффектов, полный экран, VSync, разрешение, масштабирование и тряска экрана (`IsometricCamera.Jolted`); каждая устанавливается сразу, как задана, и хранится в `user://settings.cfg` отдельно от сохранений; никогда не заданная остаётся такой, как игра стартует ([Q74](../questions/interface.md#q74)). Шкала (`Menu.Gauge`) поднимается на нажатие, за полной идёт к нулю, а «Влево» и «Вправо» шагают по ней, как и стрелки по её бокам (`Gloss.Nudger`); щелчок по делениям ставит шкалу на них. Выбор (язык, масштабирование) — та же шкала с именами: стрелки и «Влево»/«Вправо» листают их по кругу. Страница, показанная заново, оставляет фокус на той же кнопке.\n- **Судовой журнал** (`ui/Logbook.cs`, `SaveRow`, `Snapshot`): панель матового стекла, выезжающая снизу в середину экрана; сцена за ней слегка затемнена. Заголовок — тёмные слова на стекле над гравированной линией. Каждый слот сохранения — строка `SaveRow`: бледный номер слева, снимок лодки со скруглёнными углами, имя лодки, дата и монеты (`Progress.InSlot`). Слот, в который игра сохраняется сама, подписан оранжевым «в игре, сохраняется само»; пустой пишет «Пусто». Снимок — маленький `SubViewport` с собственным миром, рисуется один раз на сборку. Почему рендер: это лодка как собрана, а не заменитель. Выбранная строка стоит на стеклянной пилюле строки меню (`Pill.Row`), залитой светом лагуны, и её слова белеют; линза света скользит к ней, как в меню. Справа от неё — пилюли «Сохранить сюда» и «Загрузить» (у пустой строки бледная), внизу — «Новая игра» (решение без владельца). W S выбирают строку, за последней — «Новую игру»; A D — пилюлю; Enter нажимает. Указатель выбирает строку, щелчок по строке нажимает выбранную у неё пилюлю. Перезапись, загрузка с потерей прогресса и новая игра при занятых слотах сначала предупреждают стеклянной выноской над пилюлей. Строки, которые не помещаются, прокручиваются к выбранной. Стекло строк и пилюль видит матовую панель через копию экрана по её прямоугольнику. Все размеры — тип `Logbook` в `ui/look.tres`. На базе его открывает плитка «Судовой журнал», в море — «Сохранить» и «Загрузить» меню паузы ([Q50](../questions/interface.md#q50)).\n- **Окна инструментов** (`ui/Window.cs`, `Pane`, `Skin`, `Drawn`, `Tools`, `ui/frosted.gdshader`): редактор карт, редактор сюжета, отладочная карточка, селектор демо и шторка загрузки (`Curtain`) — панели того же матового стекла, что и выноски ([Компоненты](../art/components.md)): по краю прозрачное, сцена преломлена по кромке, глубже — бледная аква с матовостью, сверху тонкий светлый кант и серп света. Заголовок — тёмные слова прямо на стекле над гравированной линией; закрыть — маленькая стеклянная бусина с крестиком. Окно всплывает с лёгким перелётом (`Motion.Back`) и может сворачиваться к заголовку (`Pane.Folded`). Внутри окна ничего не читает экран: всё лежит на матовом стекле и просто смешивается с ним. Собственные элементы Godot (`Button`, `LineEdit`, `OptionButton`, `SpinBox`, `HSlider`, `CheckButton`, `ItemList`, `Tree`, `TabBar`, `PopupMenu`, подсказки, полосы прокрутки, `GraphEdit`, `CodeEdit`) получают облик от темы окон (`Window.Theme`), заданной один раз на корне инструмента: инструмент строит обычный `Button` и получает стекло без своих переопределений. Тема рисует их детали в коде (`Skin` — стилбоксы, `Drawn` — значки), цвета берёт из палитры, а размеры, отступы, промежутки и шрифты — из `ui/look.tres` (тип `ToolWindow` и собственные типы Godot с вариациями: `Row`, `AheadButton`, `BarButton`, `CloseButton`, `Told`, `Caption`, `Heading`, `Window*`). Кнопка — прозрачная стеклянная пилюля с тёмными словами; под указателем и нажатая она наполняется светом лагуны, слова белеют с тёмным ореолом; путь вперёд («Играть») горит оранжевым светом игрока; недоступная бледнеет. Поля, выборы и числа — вдавленное стекло с тёмными словами, в фокусе обведены светом лагуны; переключатель — `Gloss.Switch`, ползунок — стеклянная ручка на прозрачной дорожке, залитой светом до ручки; выбранная строка списка горит светом лагуны; полосы прокрутки — тонкое стекло. Отступы окон от краёв экрана, ширина боковых окон, высота подвала и промежутки строк у редакторов и селектора общие. То, что прокручивается, гаснет у края, за которым есть ещё, под маской `ClipChildren` (`Scroll`), так что ни одна строка не обрезается посреди буквы. Всплывающие листы получают тень и матовое стекло от слоя под ними (`Sheets`): Godot рисует всплывающее окно в собственном вьюпорте, который не может матовить за собой; подсказка поэтому — та же бледная аква, но непрозрачная. У полей нет обычного контекстного меню по правой кнопке (`Window.Field`). Окно поверх базы или верфи добавляет вторую копию экрана за кадр.\n"}, {"id": "known-issues", "path": "known-issues.md", "title": "Известные недочёты", "section": "", "date": "2026-11-13", "md": "# Известные недочёты\n\nЧто игрок может увидеть или почувствовать неправильным и что ещё не исправлено. У каждого сказано, что его исправит.\n\n- **В полноэкранном режиме верфь и море идут примерно по 16 мс на кадр, на грани 60 к/с**, и время от времени кадр выходит за 16,7 мс. Предел задаёт GPU, а масштабирование MetalFX Temporal забирает у него примерно на 4 мс больше, чем TAA под MetalFX Spatial, при более мягкой картинке. В Настройках «Масштабирование» выбирает Spatial; по умолчанию остаётся Temporal.\n- **Первое открытие карты занимает один-два кадра**: она один раз рисует дно. Исправит рисование дна за шторкой загрузки.\n- **После сна Mac с открытой игрой она идёт кадром раз в одну-две секунды, пока её не закроют.** По журналу владельца за 11-12: крышку закрыли через две минуты после запуска, и драйвер Metal 277 раз не дождался GPU (`timeout waiting for fence`), из них почти три минуты уже после открытия крышки. То же записали четыре скрытых кейса демо, пережившие тот же сон. Это открытая ошибка Godot ([godotengine/godot#119436](https://github.com/godotengine/godot/issues/119436)): драйвер ждёт кадр не дольше секунды и идёт дальше. Дело в сне системы, а не в выключенном экране: 557 скрытых прогонов демо, шедших при выключенном экране без сна, этой ошибки не записали. Нарочно не воспроизводили: сон обрывает все сессии агентов. Исправит новая версия движка.\n- **Редактор карт замирает на десятки секунд на форме рельефа почти предельного размера**, на верхе ползунка «Радиус» или на 1500 м у ручки края: сетка земли растёт вместе с площадью суши и поднимается в главном потоке. Исправит ограничение размера или подъём земли вне главного потока.\n- **Охотник на полном ходу всё ещё влетает в воронку между двумя морскими столбами, стоящими теснее его ширины**: щупы видят тупик лишь за несколько секунд хода, а на такой скорости корпус не успевает отвернуть. Он упирается, через несколько секунд отходит задним ходом и обходит столбы. Лодку игрока оттуда выводит сам игрок. Исправит взгляд охотника дальше вперёд или сброс хода перед закрытым курсом.\n- **Ракеты пролетают сквозь сарай, мачту и корпус на слипе мастерской**: в гавани твёрды только настилы и слип ([Гавань](base/pier.md)). Исправят преграды по надстройкам модели.\n- **У причала лента лежит поверх сарая и слипа, а лодку у первого места частично закрывают ванты и флажки мачты.** Исправит сдвиг вида у причала или перенос мачты.\n- **Слишком тяжёлая лодка на верфи тонет у причала, и на её месте видна яма в пене**: вид верфи стоит неподвижно и за корпусом под воду не идёт. Исправит лодка верфи, которую держат на плаву.\n- **Гости не видят мель и затонувшее судно хоста, если он начал кооператив посреди захода**: места промысла хоста появились до гостей ([Q181](questions/online.md#q181)). Исправит рассказ о них пришедшему гостю.\n- **Имён игроков над лодками товарищей нет нигде**: они были только на экране базы ([Q140](questions/online.md#q140)). Исправят имена над лодками в мире.\n- **Две лодки роя могут на мгновение коснуться бортами, когда трогаются с места**: медленные корпуса расходятся позже. Видно в демо Hunters/Swarm. Исправит расхождение, которое смотрит дальше вперёд на малом ходу.\n- **Лодка, зашедшая за станцию, скрыта её надстройкой**, как за горой: силуэта сквозь неё нет. Исправит силуэт лодки игрока за высокими вещами.\n- **Охотник видит лодку сквозь станцию**: её корпус закрывает путь ракетам и лодкам, но не взгляду, который проверяет только сушу (`Lookout.Sees`). Исправит станция как преграда взгляду.\n- **Ящики на воде с высоты боя различаются почти только цветом**: силуэты бочки, тюка и сундука на таком расстоянии сливаются. Исправят более крупные или более разные силуэты.\n- **Часть интерфейса после перевода на стекло видели только на кадрах демо**: диалог, радио, циферблат рыбалки и окна инструментов; подсказки и деревья в окнах инструментов не попали ни в один кадр. Старт, бой, карту, меню, журнал, настройки, экран торговца, ленту причала, верфь, отладочную карточку и гибель видели на кадрах самой игры (демо `Opening`, полный размер, 2026-11-13); играть в них владельцу ещё предстоит.\n- **Гостю в кооперативе негде взять ящики**: добыча на воде не онлайн. Ящики потопленных охотников плавают только на море хоста; лодка гостя собирает их там в трюм, которого гость не видит, а трюм на его машине пуст: нечего продать и нечем заплатить за расходник. Исправит добыча на воде онлайн ([Онлайн](online.md)).\n- **Стекло ленты причала, верфи и меню стоит 1,0–1,3 мс кадра** при 3024×1964: оно читает экран, а это копия всего экрана раз в кадр ([Компоненты](art/components.md)). HUD в бою экран не читает и стоит 0,1 мс. Лента причала теперь лежит над видом боя, и её кадр не замерен. Исправит копия только той части экрана, где лежит стекло, если она окажется дешевле.\n- **Окно инструмента поверх ленты причала или верфи добавляет вторую копию экрана** (уже без цепочки мипов): отладочная карточка (F3), редактор, селектор демо. Диалог копирует экран только в прямоугольнике своей выноски и ответов; эта цена не замерена.\n"}, {"id": "online", "path": "online.md", "title": "Онлайн-кооп", "section": "", "date": "2026-11-13", "md": "# Онлайн-кооп\n\n![Мастерская корабела, у причала которой встречаются лодки товарищей](img/pier.jpg)\n\nКооператив по сети: до четырёх игроков, каждый в своей лодке. Хост ведёт бой, гости присоединяются к нему.\n\n## Решения владельца\n- Кооператив, онлайн: до четырёх игроков, каждый в своей лодке, встречаются в лобби Steam или локальной сети. Мир хоста хранит прогресс и добычу каждого игрока, у каждого свои. Игрок присоединяется к заходу, который уже идёт, а выбывший возвращается в него. Игрока, чья лодка затонула, можно вернуть, пока идёт таймер; после него вернуть лодку могут припасы позже в заходе.\n- Инженерное правило «онлайн с самого начала» (каждая система написана для лодок нескольких игроков и хоста, который ведёт бой: ввод только как `Command` игрока, один игрок выделяется только для местного вида, мир поднимается из зёрен, общих для всех игроков, ничто не останавливает мир для всех) записано в `CLAUDE.md`, принцип 6: [CLAUDE.md](../CLAUDE.md).\n- Потопленную лодку, пока идёт её таймер, возвращает товарищ, который несколько секунд держится рядом с её обломками. Банда играет задания, открытые на арене хоста. Онлайн меню паузы открывается поверх боя, который идёт дальше: лодка игрока сбрасывает газ и дрейфует; в одиночной игре бой встаёт на паузу.\n\n## Как устроено\nКооператив онлайн, до четырёх игроков, каждый в своей лодке. Две или более игр соединяются через «Кооператив» в меню `Esc`, прямо в море (`Game.CoOp`): один открывает своё море для друзей в Steam или в своей сети, остальные находят его и присоединяются. Хост открывает игру посреди захода (`Game.Serve`). Гость, присоединяясь, оставляет своё море и свой трюм, о чём меню предупреждает; уйдя сам («Покинуть игру») или оставшись без хоста, он возвращается в своё море с последнего сохранения (`Game.Leave`). Решение без владельца ([Q181](questions/online.md#q181)).\n\n- **Игроки** (`Player`): у каждого игрока в море есть своя лодка, трюм, топливо, захват цели и выбранное оружие, и он управляет лодкой по последней отправленной `Command`: газ, руль, нитро, отданные приказы (огонь бортом или по курсору, дым, следующее оружие), точка, куда он целит; расходники — среди приказов. Команда местного игрока приходит от его клавиш и геймпада (`Controls`, `Pad`); гостя — по сети. Только местный вид (камера, HUD, силуэты, ощущение выстрелов, музыка) выделяет одного игрока; всё остальное берёт лодки игроков как набор.\n- **Связь** (`Link`): пир Godot (`MultiplayerPeer`) в чистом виде, хост и до трёх гостей, сообщения (`Say`) как варианты Godot: надёжные по одному каналу, состояние каждого кадра ненадёжно по другому, чтобы никогда не ждать за ними. Каждая сторона сначала здоровается версией игры, и пир другой версии отвергается (гостю говорят); сообщение, в котором не хватает слов, нужных читателю, отбрасывается. Она стоит в корне дерева, поэтому переживает переход `Game` между мирами и хранит услышанное для того `Game`, что играет. Связь гостя закрывается, когда он открывает редакторы или демо.\n- **Сеть или Steam** (`Lan`, `Lobby`, `SteamPeer`, `Steam`): хост выбирает одно из двух (решение без владельца, [Q108](questions/online.md#q108)). В своей сети связь идёт по ENet, и гость находит хосты широковещательным UDP-окликом по сети и на этой машине (`Lan`). Порт ENet можно задать в командной строке игры (`--port`, оклик идёт на следующий), чтобы на одной машине хостили две игры: так рядом идут кейсы `Coop` в прогонах демо. Для друзей в Steam хост открывает лобби, видное только друзьям (`Lobby`), а связь идёт через сеть Steam, по ретрансляторам Valve, так что порты открывать не нужно (`SteamPeer`); номер гостя берётся из его Steam ID. Гость так же выбирает, где искать игру: «Присоединиться к другу в Steam» показывает друзей, у чьей игры есть лобби. Steam запускается, только когда игрок открывает игру для друзей или ищет их игры. Пока у игры нет своего App ID, в Steam она числится тестовым Spacewar (480). Steamworks.NET лежит локальным пакетом в `game/online/steamworks/`, его собирает `tools/steamworks.sh`: сборки самого проекта только x64 или x86 и на Apple silicon не грузятся.\n- **Модель** — как в кооперативных боевиках, сервер-слушатель. `Game` хоста ведёт бой (`Relay`): охотников, ракеты и попадания, корпуса, нитро, заход и задания, исход миссии своей карты. Лодка каждого игрока движется на его машине по его клавишам, так что управление остаётся мгновенным, и шлёт свою команду и где лежит, с баком и оружием, как они там стоят; хост ведёт эту лодку по команде, подтягивая её к тому, где она лежит там, и шлёт часы своего боя вместе с лодками. Хост шлёт состояние каждой лодки (`Lie`: ход, корпус, нитро и залп, который охотник выдаёт свечением стоек) в каждом кадре и каждый выпущенный снаряд; `Mirror` гостя выводит каждую лодку в море, рисует её по ходу от руля и подтягивает к хосту, её корпус таким, каким он у хоста, и пускает снаряды других, а свои пускает локально, и там они безвредны (`Boat.Mirrored`).\n- **Один мир**: хост шлёт свою миссию (JSON карты, так что работают и карты самого игрока) и зерно своего мира; игра гостя плывёт в этот мир и просит лодку своего проекта, которую хост выводит в море рядом со своей. Игрок, присоединившийся на ходу, тоже выходит в море.\n- **Зоны карты**: хост шлёт зерно раскладки, и каждая машина раскладывает по нему зоны миссии (`areas/Laying.cs`). Опасности хоста сообщают опасностям гостя, что делать (`Hazards`, `Showing`): мины и бочки пропали, пятно зажглось, бон развёрнут, импульс и просветы башни, залпы батареи, прицел и обломки, ход и захват луча, каждый взрыв; опасности гостя никому не вредят (`Shown`). Стены и течения всё равно действуют на лодку самого гостя там (`Boat.Eased`). Гость, присоединившийся посреди огня, пропускает заряд башни. См. [Зоны и опасности](world/areas.md).\n- **Удары между корпусами**: хост сообщает каждый (`Say.Blow`, из `Ramming.Rammed`), в том числе по лодке самого гостя, и гость показывает его один раз: искру, звук, метку попадания и сигнал музыки. Собственные касания гостя между его копиями лодок ударов не дают (`Ramming.Told`), так что медленный удар не теряется и ни один не показывается дважды; таран самого гостя показывается через мгновение после касания, когда до него доходит слово хоста.\n- **Плотники**: заплату лодке гостя делает хост и сообщает её (`Say.Patched`, из `Carpenters.Patched`); гость показывает её на своём HUD, как игрок в одиночной игре (`Carpenters.Show`). См. [Бой](gameplay/combat.md).\n- **Пауза**: онлайн меню Esc ничего не останавливает (бой встаёт на паузу, только когда нет связи), а команда игрока, пока оно открыто, пустая: газ и руль по центру, приказов нет, так что лодка сбрасывает газ и дрейфует (Coop/Paused). Торговля у станции и стоянка у причала тоже не ставят бой на паузу ([Станция](world/outpost.md), [Гавань](base/pier.md)).\n- **Подъём затонувшей лодки** (`Revive`): пока идёт окно затонувшей лодки, товарищ в море, который медленно держится рядом с её обломками, поднимает её (`Boat.Raise`: целая, на месте, трюм пуст). Хост решает и считает; `Lie` уже несёт корпус, и `Boat.Match` поднимает лодку у гостя. Гость считает то же только для показа: кольцо на воде вокруг обломков с золотой дугой удержания и секундами окна (`Markers`); свою лодку игрок видит в кольце с подписью. Затонувшая лодка (`Gone`) остаётся в мире и у гостя, пока она нужна (`Mirror.Crews`). Окно, расстояние, скорость и время удержания — решение без владельца, [Q124](questions/online.md#q124), [Q125](questions/online.md#q125). Coop/Revive. Пока на плаву нет ни одного товарища, окно не показывается: одинокой потопленной лодке HUD подъёма не обещает.\n- **Сухая лодка**: с пустым баком лодка ползёт малым ходом ([Лодка](gameplay/boat.md)); гость ведёт её сам, как с топливом.\n- **Припасы**: описаны в [Припасах](gameplay/pickups.md) (`Say.Supplied`, `Say.Took`).\n- **Расходники**: трюм гостя лежит на его машине; гость платит ящиками у себя, и трата идёт хосту приказом, как огонь; хост чинит, заправляет или взрывает. Что дал расходник, хост сообщает тем же словом, что и взятый припас (`Say.Took`), и гость видит ту же надпись и слышит тот же звук, что в одиночной игре (Coop/Kits). Взять ящики гостю пока негде: добыча на воде не онлайн.\n- **Торговля**: каждый игрок продаёт свой трюм на экране торговца у себя, и монеты его; мир при этом не встаёт. Ремонт, купленный у «Марии», гость оплачивает у себя, а починка идёт хосту приказом `Order.Mend`, как расходник; топливо гостя и так лежит у него ([Добыча](gameplay/haul.md)).\n- **Заход онлайн**: хост раз в секунду сообщает гостям цели захода и метки заданий, а каждое объявление — когда оно прозвучало (`Say.Run`, `Say.Told`, `Relay.Run`, `Mirror.Ran`, `Mirror.Called`). Гость показывает их на своём HUD ([Q133](questions/online.md#q133)). Слова хоста (цели, объявления, причина вердикта) идут фразами: английский текст и вставленные в него числа (`Phrases`), и гость переводит их сам ([Язык](interface/language.md)). Хост решает и платит за задания.\n- **Пока не онлайн**: добыча на воде, дым на других машинах, места промысла и обломки затонувших охотников (онлайн их не разбрасывают и не создают), тайники и точки припасов зон, прогресс и сохранения (у каждого игрока свои). На полигоне лодка гостя поднимается там, где затонула.\n- **Не сделано вовсе**: возвращение затонувшей лодки припасами после окна.\n"}, {"id": "questions-README", "path": "questions/README.md", "title": "Открытые вопросы", "section": "questions", "date": "2026-11-12", "md": "# Открытые вопросы\n\nВсё, что ждёт ответа владельца. Вопрос живёт под заголовком своего номера (`### Q17`), так
