rt_Strike)\n- Jungle Strike: [Wikipedia](https://en.wikipedia.org/wiki/Jungle_Strike)\n- Cleared Hot: [Steam](https://store.steampowered.com/app/1710820/)\n- Megacopter: Blades of the Goddess: [Steam](https://store.steampowered.com/app/1228360/)\n- Return Fire: [Wikipedia](https://en.wikipedia.org/wiki/Return_Fire), [PSX Data Center](https://psxdatacenter.com/games/U/R/SLUS-00184.html)\n- Naval Ops: Warship Gunner: [Wikipedia](https://en.wikipedia.org/wiki/Naval_Ops:_Warship_Gunner)\n- Windward: [Steam](https://store.steampowered.com/app/326410/)\n"}, {"id": "reports-README", "path": "reports/README.md", "title": "Отчёты", "section": "reports", "date": "2026-11-09", "md": "# Отчёты\n\nОтчёты и исследования, которые раньше жили артефактами Claude. Пока хранятся здесь как есть, на языке оригинала. Это снимки на свою дату: решения и то, как устроена игра, — на страницах тем.\n\n## Выбор облика\n- 2026-11-07 [Облик всей игры](2026-11-07-art-directions/index.html) — шесть обликов на стенде `Art`. Наш выбор Ink; владелец ещё не выбрал.\n- 2026-11-06 [Облик меню](2026-11-06-menu-looks/index.html) — шесть обликов на стенде `Menus`. Наш выбор Quiet; владелец ещё не выбрал.\n- 2026-11-06 [Картины меню](2026-11-06-menu-paintings/index.html) — пауза и настройки, нарисованные FLUX. Владелец отверг; с 2026-11-07 картинки нейросетью не рисуем.\n\n## Проверки и разборы\n- 2026-11-08 [Greenlight](2026-11-08-greenlight-review/index.html) — пять издателей оценивают прототип, 4.6 из 10: «вернитесь с вертикальным срезом».\n- 2026-11-08 [Что убрать из игры](2026-11-08-cleanup-audit/index.html) — аудит лишнего. Владелец взял только пункты по коду (4a7b9a56).\n- 2026-11-04 [QA интерфейса](2026-11-04-interface-qa/index.html) — 102 замечания, все исправлены.\n- 2026-11-03 [Пресса](2026-11-03-press-review/index.html) — десять критиков, 63 из 100.\n\n## Другие игры\n- 2026-11-07 [Escape from Duckov](2026-11-07-escape-from-duckov.pdf) и [Dave the Diver](2026-11-07-dave-the-diver.pdf) — разборы игр (PDF).\n- 2026-10-28 [Аркадные морские игры](2026-10-28-arcade-naval-reference.md) — восемь игр-ориентиров для аркадного поворота.\n\n## Времён симулятора\nДо аркадного поворота 2026-10-26; игра с тех пор другая (тег `simulator-game`).\n- 2026-10-13 [Подходы к карте](2026-10-13-map-approaches.md) — как строить карту морской песочницы.\n- 2026-10-11 [Судовой журнал идей](2026-10-11-captains-ledger/index.html) — 518 идей по системам.\n- 2026-10-11 [Becoming Windward](2026-10-11-becoming-windward/index.html) — Windward, WaveWorks и выбор движка.\n- 2026-10-11 [Фэнтезийный архипелаг](2026-10-11-fantasy-archipelago/index.html) — исследование кооп-песочницы.\n- 2026-10-09 [Вода](2026-10-09-water-field-guide/index.html) — справочник по воде.\n\nПредложения по сеттингу лежат на своём месте: [story/lore-proposals.html](../story/lore-proposals.html).\n"}, {"id": "story-dialogue", "path": "story/dialogue.md", "title": "Диалоги и голос", "section": "story", "date": "2026-11-11", "md": "# Диалоги и голос\n\n![Корабел](../img/shipwright.jpg)\n\nКак показан разговор: портреты, выноска, буквы по одной и кошачий лепет вместо слов. Сами сцены описаны в [Сценах сюжета](scenes.md).\n\n## Решения владельца\n- Разговор с кем-то — диалог, как в визуальной новелле: большой нарисованный портрет каждого говорящего рядом с репликами, лицо меняется по реакции.\n- Портреты стоят у нижнего края экрана, говорящий подсвечен; его реплика в глянцевой аквамариновой выноске между ними, его имя на табличке.\n- Говорящие лепечут, а не произносят слова: каждая буква — короткий кошачий звук, высота зависит от говорящего, одни и те же буквы звучат всегда одинаково. Злые слова рычат.\n- Реплики движутся: буквы выскакивают, когда их произносят; слова волнуются, трясутся, стоят крупно цветом с блеском или переливаются радугой; некоторые говорятся медленно, паузы держат слова, а лицо посреди реплики меняется с прыжком.\n- Корабел здоровается с игроком на верфи.\n- Пока идёт диалог, экран за ним не отвлекает: мир и приборы уходят на задний план.\n\n## Как устроено (`talk/`)\n\n`Dialogue` показывает разговор, как визуальная новелла: портрет каждого говорящего (`assets/portraits/<speaker>-<face>.png`) у нижнего края экрана, второй справа, при необходимости каждый отражён, чтобы смотреть на другого, говорящий подсвечен, его реплика в `Gloss.Balloon` между ними. Реплика пишется с метками, которые читает `Speech`: [wave], [shake], [big], [rainbow] и [slow] вокруг слов, [face=pleased] и [pause] там, где они стоят; точки и запятые держат слова. Каждая буква рисуется отдельно и выскакивает, когда её произносят. Enter, Space или щелчок показывают реплику целиком, а затем просят следующую; ответы стоят глянцевыми пилюлями над выноской, их выбирают W S и Enter, цифрой или щелчком; Esc просит пропустить. Пока диалог идёт, он берёт клавиши и указатель, а мир и приборы за ним размыты и притемнены тем же матовым стеклом, что у окон интерфейса (`ui/frost.gdshader`). Портрет покачивается, пока говорит, подпрыгивает, когда меняется его лицо, и дёргается на трясущихся словах.\n\n`Voice` лепечет по буквам: у каждой буквы своё зерно котячьего мяуканья, вырезанное при загрузке из одной полосы (`assets/sounds/voice/mews.wav`), по высоте подстроенное под говорящего (`Speaker.Pitch`) и на пентатонической ступени, которую эта буква хранит, поэтому одни и те же слова звучат всегда одинаково. Зёрна разнесены так, чтобы быстрые буквы не сливались. Последнее слово вопроса поднимается, крупные слова громче и ниже, а трясущиеся рычат зовами каракала (`growls.wav`).\n"}, {"id": "story-scenes", "path": "story/scenes.md", "title": "Сцены сюжета", "section": "story", "date": "2026-11-11", "md": "# Сцены сюжета\n\n![Мытарь](../img/tollkeeper.jpg)\n\nКак игра рассказывает сюжет: сцены, их триггеры, условия, рация. Сцены пишут в [редакторе сюжета](../tools/story-editor.md); как звучат и выглядят сами диалоги, описано в [Диалогах и голосе](dialogue.md).\n\n## Решения владельца\n- Сюжет рассказывают сценами, которые пишут во встроенном редакторе сюжета.\n- Сцена — это граф отрывков на холсте. Каждый отрывок — сценарий: кто говорит, с каким лицом, и реплика с метками.\n- Сцены ветвятся по ответам игрока, проверяют условия по флагам и по игре, ставят флаги и действуют в игре, например дают монеты или деталь.\n- Триггер рассказывает одну сцену: из тех, чьи требования выполнены, ту, у которой наивысший приоритет. Сцену можно рассказать только один раз.\n- Сцены запускаются в местах на базе, до и после миссии, рацией в бою и подходом к флоппе.\n\n## Как устроено (`story/`)\n\n`Teller` рассказывает сцены сюжета на собственном слое холста. Сцена (`Scene`) — это JSON-файл в `res://story` (`Scenes`); его читают заново при каждом триггере, поэтому правки редактора рассказываются сразу. Триггер (`Triggers`) вызывает `Teller.Tell`, который выбирает сцену (`Teller.Pick`): из тех, что он запускает, чьё требование выполнено и которые, если они разовые, ещё не рассказаны, берётся с наивысшим приоритетом, а затем самая реже рассказанная. Нет сцены — ничего не происходит, и `Tell` завершается сразу.\n\nВ каждом отрывке сцены лежит сценарий (`Screenplay`), по шагу в строке:\n\n```\nShipwright: [face=pleased]Will you take it out?\n* Not yet -> later\n* Right now! -> now if coins > 10\n-> keen if eager\nset visits = visits + 1\ndo give coins 50\nstop\n```\n\nРеплика ждёт Enter. Ответы сразу после реплики предлагаются, пока их условие выполнено, и ведут в свой отрывок или дальше, мимо ответов. Отрывок, который кончился без перехода, завершает сцену. Esc пропускает ещё не сказанное до ближайших ответов или до конца. Условия и значения — это `Expression` Godot над `Facts`: флаги, которые ставят сцены (0, пока не поставлены; булево, число или текст, как их хранит сохранение), `coins` и `Seen(\"Scene name\")`, хранятся в сохранении (`Progress`). `do` запускает `Teller.Order`: give coins N, give part Name, wait seconds (короткое ожидание). `Screenplay.Faults` перечисляет строки, которые сцена не может рассказать. Рассказ, который идёт по отрывкам, где нечего ждать, завершается. Почему сценарий в каждом отрывке: реплики печатают быстрее, чем соединяют блоки, а граф показывает только ветки.\n\nПриветствие верфи (`story/yard-greeting.json`) рассказывается один раз, его реплики — заглушки ([Q48](../questions/story.md#q48)).\n\n**Мытарь** (`Speaker.Tollkeeper`, портреты `tollkeeper-*`): смотрит вправо. Он неспешный и низкий, говорит по рации, когда лодка игрока впервые подходит к точке с пошлиной, сердитый или довольный в зависимости от того, хватает ли добычи в его трюме на пошлину (`radio-toll`, `story/tollkeeper-*.json`). Его реплики — заглушки ([Q48](../questions/story.md#q48)).\n\n**Триггеры** (их запускает `Game.cs`, каждый рядом с тем, за чем следует):\n\n| Триггер | Когда | О чём |\n| --- | --- | --- |\n| `yard` | открывается верфь | |\n| `briefing` | нажата «На арену»; арена отплывает, когда сцена кончится | `mission` |\n| `debrief`, `home` | квиток поездки убран: разбор, затем возвращение домой | `mission`, `won` |\n| `radio-start`, `radio-first-sunk`, `radio-last-strike` | приземляется вступительный пролёт; идёт ко дну первый охотник боя; у лодки игрока остаётся последнее попадание | `mission` |\n| `radio-toll` | лодка игрока впервые подходит к точке выхода с пошлиной (`story/TollCalls.cs`) | `paid` (добычи в трюме хватает на пошлину), `mission` |\n\nРассказ может быть о чём-то: `Tell(trigger, about)` приносит факты, которые видят только его условия, — `mission` (название) и `won`. Сцена, которой нужен такой факт, называет его в своём требовании или условиях. Гость в онлайне не видит брифинга, потому что не выбирает миссию, но слышит рацию и разбор.\n\n**Счёт**: каждая оконченная поездка (домой, потоплен или на сухом баке; не «Назад на базу») записывает миссию выигранной или проигранной по названию в `Facts`, это хранится в сохранении. Условия видят `wins` и `losses` (итоги), `Won(\"Mission\")` и `Lost(\"Mission\")`.\n\n**Рация** (`talk/Radio.cs`): сцена, чей триггер начинается с `radio-`, говорится в левом верхнем углу экрана, под заметкой о задачах, а не в диалоге. Маленький портрет (голова с портрета говорящего; пузырь с его инициалом, если портрета нет) и маленькая глянцевая выноска говорят каждую реплику по буквам голосом говорящего, держат её мгновение и идут дальше; сцена кончается сама. Рация не берёт ни клавиш, ни указателя, поэтому бой идёт дальше и ничто не ставится на паузу. Ответы по рации не выбрать, поэтому `Screenplay.Faults` их помечает. Сцена рации — только вид локального игрока. Одна сцена рации за раз: триггер рации, пока идёт другая или диалог, отбрасывается. Триггер диалога рация не блокирует: он обрывает её на полуслове, и тот рассказ не засчитывается. `Dialogue` и `Radio` делят `Lettering` (раскладку и отрисовку букв и таблички с именем). Моменты самого боя читаются с лодок как они стоят (`Game.Calls`), поэтому их слышит и гость.\n\n"}, {"id": "story-setting", "path": "story/setting.md", "title": "Сеттинг и лор", "section": "story", "date": "2026-11-10", "md": "# Сеттинг и лор\n\nМир, в котором идёт игра, и правила, по которым в неё попадает лор.\n\n## Решения владельца\n- Сеттинг: оптимистичный мир соларпанка спустя долгое время после падения. Современный мир, из которого он вырос, — далёкое прошлое, и о нём мало что помнят (владелец, 2026-11-02).\n- Все жители — флоппы ([Люди: флоппы](../art/people.md)).\n\n## Где сеттинг виден в игре\n- Старая печатная карта старого мира с новыми берегами, дорисованными маркером ([Экраны и меню](../interface/screens.md)).\n- Приборы старого мира, найденные и починенные ([HUD](../interface/hud.md), [Стиль интерфейса](../art/interface.md)).\n- Солнечные панели, тенты, ветряки и зелень в кадках на лодках ([Облик лодок](../art/boats.md)).\n- Одежда старого мира, выцветшая и залатанная, с льном и плетёным нового ([Люди: флоппы](../art/people.md)).\n\n## Правила лора\n- Лор попадает в игру и в вики только тогда, когда владелец назовёт кусок. Понравившееся предложение — не приказ его строить.\n- Любой лор, фракцию или механику сверх решённого помечать как предложение.\n- Мир описывают простыми идеями: места и люди — по тому, что они есть («закрытый остров», «наставник на верфи»), а не придуманными именами. Без глоссариев, придуманных эпох и календарей, списков титулов и именованного состава: придуманные слова владелец читает как сгенерированный мусор (2026-10-27).\n- Персонажи — роли без имён: капитан, корабел, мытарь.\n\n## Предложения\n- [Предложения по сеттингу](lore-proposals.html) (на английском): пять миров соларпанка после падения и смесь двух из них — затопленного города и закрытого острова. Каждая вкладка — питч, идеи мира, карта, как это играется, таблица идей, сюжет и повороты, мудборд. Ничего из этого нет в игре; владелец выберет куски сам.\n- Владелец читает их с телефона как артефакт: https://claude.ai/artifact/7xXEeNLqmCzpaGSYH9rbZt. Правишь страницу — опубликуй артефакт заново.\n\n## Открытые вопросы\n- [Q5](../questions/story.md#q5): подробности сеттинга — его люди, названия мест, что осталось от старого мира.\n"}, {"id": "tools-README", "path": "tools/README.md", "title": "Инструменты", "section": "tools", "date": "2026-11-08", "md": "# Инструменты\n\nЧем собирают, проверяют и выпускают игру, и чем в ней самой делают карты и сюжет.\n\n## Страницы\n- [Код](code.md): как устроен проект `game/`.\n- [Демо](demos.md): отдельные сцены для каждой части игры и их проверки.\n- [Редактор карт](map-editor.md): карты и миссии над живым миром.\n- [Редактор сюжета](story-editor.md): сцены и сценарии.\n- [Ассеты](assets.md): откуда берутся модели, звук, шрифты и портреты.\n- [Сборки и посты](release.md): экспорт сборок и посты в канал.\n\n## Команды\n\n| Команда | Что делает |\n| --- | --- |\n| `make` | Собирает игру и запускает её в окне (`make build` только компилирует). |\n| `tools/demo.sh <out dir> [Demo ... \\| --since <rev>]` | Запускает демо скрытно с их проверками ([Демо](demos.md)). |\n| `tools/build.sh` | Экспортирует `main` для macOS и Windows в zip-архивы, названные по версии из `game/project.godot` ([Сборки и посты](release.md)). |\n| `tools/steamworks.sh <tag>` | Собирает Steamworks.NET под каждую ОС и пакует с библиотеками Valve в локальный пакет игры ([Онлайн-кооп](../online.md)). |\n\n## Правила разработки\nПринципы разработки, проверки перед тем, как назвать работу готовой, и правила коммитов лежат в [`CLAUDE.md`](../../CLAUDE.md).\n\n## Старая версия\nЗаброшенная песочница-архипелаг хранится под git-тегом `simulator-game`.\n"}, {"id": "tools-assets", "path": "tools/assets.md", "title": "Ассеты", "section": "tools", "date": "2026-11-10", "md": "# Ассеты\n\nОткуда в игре берутся модели, звук, шрифты и портреты.\n\n## Как устроено\n\n- **Модели.** Пирс, турель и люлька моделируются в Blender из скриптов в `tools/` (`blender -b -P tools/dock.py` пишет `game/base/dock.glb`; `tools/turret.py`, `tools/cradle.py`); цвет и отделка каждой грани лежат на её вершинах. Лодки строятся в коде по линиям корпуса (`game/ships/`). `tools/catalogue.sh <out>` рисует каждую лодку, которую строит верфь, в `<out>/index.html` с фильтром по деталям.\n- **Звук.** Нарезан из записей CC0 на Freesound (`game/assets/sounds/`, источники в его `Licenses.txt`); перед скачиванием владелец одобряет список (идентификаторы, авторы, размеры).\n- **Музыка.** Играет на инструментах, сэмплированных из библиотек CC0 (`game/assets/sounds/music/`).\n- **Шрифты.** Гарнитуры интерфейса Nunito, Caveat и EB Garamond имеют открытую лицензию OFL (`game/assets/fonts/`).\n- **Портреты диалогов** (`game/assets/portraits/<speaker>-<face>.png`) — заглушки до рисунков художника; откуда они и что с ними дальше: [Люди: флоппы](../art/people.md).\n"}, {"id": "tools-code", "path": "tools/code.md", "title": "Код", "section": "tools", "date": "2026-11-10", "md": "# Код\n\nКак устроен проект `game/`: старт, корень композиции и общие части.\n\n## Как устроено\n\n`game/` — игра на Godot 4.7 (.NET), спроектированная в [Журнале решений](../decisions.md). Вики говорит, что игра делает сегодня, с решениями без владельца там, где дизайн молчит (каждое называет свой вопрос). Числа настройки живут в коде. `Pirates.sln` содержит проект, `Directory.Build.props` задаёт параметры сборки.\n\nИгра стартует на базе (`base/`), пирсе у острова, на последнем сохранённом прогрессе: лодка игрока, как её запускали в последний раз, стоит у пирса, а пассат дует с направления, выбираемого заново при каждом старте. Оттуда игрок выходит на миссии и возвращается домой через точку выхода с тем, что собрал (`haul/`). `ui/Curtain.cs` скрывает мир, пока не скомпилирован код игры без демо (`common/Precompiling.cs`, в пуле потоков, ведь первый запуск метода, оставленный JIT, задерживает свой кадр) и пока шейдерные пайплайны не перестанут компилироваться, в окне с названием игры, и пишет, что поднимается. Приложение называется Floppa Tropical Adventures (`project.godot`); его пользовательские данные остаются в `app_userdata/Pirates` (`custom_user_dir_name`), где лежали сохранения, настройки и логи.\n\n`Game.cs` — корень композиции. `World.cs` строит общий мир (небо, море, землю, бой, припасы, эффекты, звук) из локации (`scenery/`), которую собирают и `Game`, и `Stage` демо. `common/` хранит то, что общее для всех систем; каждая другая папка — одна система. Единицы — метры.\n"}, {"id": "tools-demos", "path": "tools/demos.md", "title": "Демо", "section": "tools", "date": "2026-11-11", "md": "# Демо\n\nМаленькие сцены, каждая из которых показывает одну часть игры отдельно, чтобы увидеть и проверить её вне остального.\n\n## Как устроено\n\n`game/demos/` хранит маленькие сцены, каждая ставит одну часть игры отдельно, чтобы увидеть и проверить её вне остального (правило есть в [`CLAUDE.md`](../../CLAUDE.md)). Демо — это папка: его скрипт и по сцене на каждый кейс с заданными в инспекторе значениями скрипта, как хочет этот кейс. Они входят в каждую сборку.\n\nЗапустить демо можно из меню базы (Esc), пункт «Демо» (селектор, `demos/Demos.tscn`), из редактора Godot по F6 на его сцене или скрытно через `tools/demo.sh`: четыре кейса сразу на машине, какая бы сессия их ни запускала (у каждого из четырёх мест свои порты кооператива, так что кейсы `Coop` идут рядом), самые долгие первыми, чтобы места кончали вместе, и каждый проваливается, проработав втрое дольше своего прошлого удачного прогона (не меньше двух минут; десять минут, `DEMO_LIMIT`, если удачного не было), в 640x360 (`--full` для размера игры), фиксированными шагами, чтобы прогон играл одинаково при любой нагрузке. `--since <rev>` запускает демо, которые показывают файлы, изменившиеся с `<rev>`; медленные (`Opening`, `Coop`, верстаки `Art` и `Menus`) идут тогда только за своими файлами или по имени. Прогон печатает только проваленное: проверки, ошибки и предупреждения; кадры и логи лежат в папке вывода. Окно «Кейс» селектора хранит значения инспектора показанного кейса в их единицах; изменение одного открывает кейс заново с ним. Esc и «Назад» в списке покидают селектор раньше, чем кейс успеет взять клавишу, а список складывается в полоску. Щёлкнутая строка держит клавиши: W S или стрелки шагают по списку, Enter открывает строку, щелчок по сцене возвращает клавиши кейсу.\n\n`Opening` (`demos/Opening.tscn`, вне селектора) проверяет старт игры: шторку, базу и её меню, плитку «Go to Arena» базы, вступительный пролёт арены, пропущенный щелчком или Space, и её бой и трюм, закрытый Esc, предупреждение «Назад на базу», выход через точку выхода, квиток поездки, купленную деталь. `Selecting` (`demos/Selecting.tscn`, тоже вне селектора) проверяет селектор над кейсом меню базы: Esc и «Назад» покидают его, клавиши шагают и открывают строки, список складывается. `Catalogue` (`demos/Catalogue.tscn`, тоже вне селектора) рисует каждую лодку, которую строит верфь, по кадру на лодку: `tools/catalogue.sh <out>` запускает его примерно за минуту и раскладывает кадры в `<out>/index.html`, с фильтром по деталям. `Gallery` (`demos/Gallery.tscn`, тоже вне селектора) — тот же `Catalogue` с `Gallery = true`: по кадру на корпус, мотор, палубную деталь и охотника для их страниц в [сайте вики](../README.md); `tools/demo.sh <out> Gallery`, кадры кладутся в `wiki/img/parts/` без приставки `Gallery-`.\n\n| Демо | Что показывает |\n| --- | --- |\n| `Art` | Верстак для художественных направлений всей игры: фиксированная перестрелка у мелководья острова (ялик, три охотника, ракеты, потопление, дым, HUD) с кадрами `wide`, `volley`, `hit`, `hostile`, `sinking`, `shallows` и `close`; облик в `Art/Looks/<Name>/` (`ILook`) переодевает её через dresser, а его проверки убеждаются, что его замены дошли до моря, лодок и того, что появилось позже. Виды: игра как есть (`Current`), облик `Sample` и предложенные облики `Ink`, `Poster`, `Lagoon`, `Deep`, `Tin` и `Logbook`. |\n| `Base` | База у пирса: плитки ленты, судовой журнал и меню поверх; `Mates` — лодки трёх товарищей у соседних мест под именами. |\n| `Broadside` | Лодка, стреляющая ракетами или торпедами в другую: попадания, потопление, высыпавшиеся предметы, сбитые плиты, плотники. Aim: гонщик под HUD наводит точку на охотника впереди траверза правого борта, потом на другого позади траверза левого, потом на открытую воду, и стреляет только тот борт, чей веер держит точку. Hunter: стреляет охотник, и его ракета летит заметно дольше ракеты игрока. Lock: ракеты по захваченной цели под HUD, клавиша борта тускнеет, пока он перезаряжается, и загорается снова. Chaser: гонщик с носовыми стойками, преследующий лодку, идущую прямо от него, каждый залп уходит впереди её носа. Mines: гонщик с минным жёлобом сбрасывает по мине с борта, за ним по пятам таранщик, и правила жёлоба по одному (никогда для своей стороны, взвод, седьмая мина, выстрел и его цепь). |\n| `Coop` | Две игры на одной машине, одна хостит, другая присоединяется из меню базы: лодка каждого у пирса другого, обе лодки в ходу на обоих морях, пауза гостя, гость дома; опасности хоста (мины, башня, бон, батарея, пятно) у гостя; дроны хоста и тот, что взят на борт, выброшенный; турели обеих лодок, летящие на море гостя, когда хост стреляет; свечение стоек охотника хоста перед залпом у гостя (Coop/Tell); потопленную лодку гостя поднимает хост, державшийся рядом с обломками (Coop/Revive); меню паузы гостя сбрасывает газ, а бой идёт дальше (Coop/Paused). |\n| `Crowd` | Двенадцать охотников на постоянных приказах: много лодок сразу, внеэкранные дешевле. |\n| `Dialogue` | Сцена сюжета, рассказанная капитаном и корабелом: реплика с каждой меткой, сказанная по буквам, пролистываемая Enter, ответ, выбранный номером, ставит флаг и прыгает по нему, Esc прокручивает до ответов и до конца, а триггер выбирает свою сцену. Radio: ялик в ходу под HUD, пока сцена триггера рации говорится в углу, клавиши доходят до боя, диалог её выключает. |\n| `Director` | Директор, задающий темп боя вокруг кружащего ялика: начальная передышка, затем набег в затишье из-за пределов вида. Rest: ялик побеждён, бой достигает пика и отдыхает, вокруг рассыпаны припасы. Lair: набег, приходящий из логова карты. |\n| `Drones` | Носитель спускает на воду двух дронов рядом с собой: они охраняют его, их посылают на охотника, и они его бьют, а один отозван и взят на борт. Carrier: люлька патрульного катера под управлением игрока под HUD: «Дроны» выбраны на рулетке, Q и E посылают дронов на захват цели, Q снова отзывает одного, а потерянный дрон отстраивается в своём гнезде. |\n| `Editor` | Редактор карт, сыгранный указателем и клавишами: форма рельефа перетащена, мир поднят заново, отмена, охотник удалён, карта переименована, добавлено минное поле, точка добавлена и перетащена, а её радиус задан, меню и окно «Открыть». |\n| `Extraction` | Точки выхода локации с лодками в их кольцах: открытые, с пошлиной, с ограничением веса, ждущие цели. Мытарь говорит по рации у точки с пошлиной, довольный (Making) или сердитый, когда добычи в трюме мало (Short). |\n| `Fleet` | Один проект бортом к виду, на месте и в ходу; Spinning: разворот на месте одним рулём; все корпуса в ряд. |\n| `Fuel` | Dry: два гонщика бок о бок на полном газу с нитро, у одного бак пуст: он идёт, но меньше чем вполовину хода другого, и нитро закрыто. |\n| `Gamepad` | Только события геймпада: ялик, которым рулят, стреляют, ставят дым и открывают трюм в море; база игры, судовой журнал, меню и верфь, сыгранные геймпадом, миссия, пройденная и поставленная на паузу. Подсказки показывают кнопки геймпада. |\n| `Arena` | Арена карты: Held — вид стоит над ареной, пока лодка внутри, и возвращается к лодке за её пределами; Cut — первый вход играет вставку под полосами; Skipped — Space пропускает её; Placed — редактор, управляемый указателем: ставит арену, вставку и два кадра, привязывает, играет просмотр, сохраняет карту и читает её обратно. |\n| `Hazards` | Опасности карты в открытом море: минное поле, взрывающееся цепочкой, мина, расстрелянная рядом с охотником, таранщик, огибающий мины, течение, уносящее ялик, и водоворот, затягивающий его; снаряды и бомбы, падающие в свои кольца, кольцо башни-импульса и его бреши, батарея, ведущая огонь и разбитая в куски, прожектор, замечающий ялик, горящая нефть, бочки, которые толкают и взрывают, бон, преграждающий путь и открывающийся. |\n| `Haul` | Ялик собирает предметы потопленного гонщика в свой трюм, выбрасывает один за борт и перекладывает другой, повернув. Второй ялик с полным трюмом отстаёт и оставляет редуктор на плаву. HoldOpen: трюм открыт, огонь удержан. Cache: тайник карты на плаву, его предметы собираются. |\n| `Hunters` | Охотники одной роли за кружащей канонеркой: планирование, рулёж, стрельба, таран, подбор припасов. Post: сторожевой пост держится, пока ялик не подойдёт к нему. Chased: два таранщика за гонщиком бьют его с борта или с кормовой четверти. Tell: охотник виден вблизи, стойки светятся красным перед залпом. |\n| `InterfaceSounds` | Каждая реплика интерфейса, сыгранная по очереди или та, по которой щёлкнули, чтобы её послушать. |\n| `Landforms` | Одна из форм рельефа редактора по своему пресету в открытом море локации, лодка идёт на неё, пока берег не удержит лодку: Peak спереди, Volcano из-за неё, кромка перед лодкой, виденная насквозь; Barrier reef с моря, её отмель держит лодку; Sea stacks спереди; Grazing, кромка одинокого столба, пройденная вплотную, её камень удерживает борт корпуса; Sandbar и Spit спереди, кончик косы с пальмами; Bars, три отмели удерживают броненосец. |\n| `Lights` | Единственный свет сцены на лодке и шарах в море на рассвете, в полдень, на закате, в сумерки и ночью. |\n| `Menus` | Один облик меню и кнопок на кейс, над базой (или пауза над боем, `AtSea`): меню, сыгранное клавишами, геймпадом и указателем, переключатель и шкала его страницы «Настройки» (шкалу шагает только собственное меню игры), предупреждение «Выход», уведомление и его отдельные кнопки; на каждом кадр сохраняется. `Current` — собственный облик игры; `Quiet`, `Glass`, `Notebook`, `Atlas`, `Device` и `Dashboard` — предложенные облики, каждый в `Looks/<Look>/`. |\n| `Music` | Одна музыка: нарастает от спокойствия до пика боя с каждым мотивом, затем её фанфары или плач. |\n| `Objectives` | Игра миссии арены под HUD: её лодки выходят в море, её задачи, её проигрыш. |\n| `Pickups` | Лодка, проезжающая по припасам нитро, ремонта и брони, и припасы, появляющиеся вокруг неё. Supplies: припас точки снабжения взят и снова на месте. |\n| `Ramming` | Лодка таранит другую в борт: удар, невредимый таран, чинящая помпа; на нитро в ялик — удар не топит целую лодку. Charging: удар носом на нитро без тарана: бьющий получает меньше, а бьёт сильнее. |\n| `Range` | Полигон у острова: лодка въезжает среди пришвартованных и плещущихся мишеней-макетов, ближайшая тонет и снова поднимается на своём месте, лодка тонет и снова поднимается на старте. |\n| `Run` | Бесконечный заплыв Арены под HUD, его часы прокручены со стороны демо до открытия кейса. Offers: первое задание предложено около девяностой секунды, его маяк горит вдали от старта. Done: маяки пройдены один за другим, задание выплачено добычей и припасами. Failed: транспорт эскорта потоплен, задание снято вместе с маяком. Ironclad: отсчёт, броненосец у причала, после его гибели выход через бухту открыт. Ticket: билет возвращения со сводкой заплыва. |\n| `Sea` | Одно море и с островом на его банке: волны, пена, блики, прибой, укрытие. |\n| `Settings` | Каждая локация (Coral cay и Arena) с точки зрения боя: её вода, час, земля и досягаемость канонерки в ней. |\n| `Sites` | Косяк и обломки с точки зрения боя и в виде сбоку: рыбалка и подъём, карточка рыбы. Chosen: закреплённые обломки с предметами карты. Sunk: затонувший охотник становится обломком. Salvaged: поднятое ложится в трюм. Full: без места добыча остаётся. |\n| `Smoke` | Дымовая завеса поставлена, дрейфует и редеет, и ослеплённый ею охотник, под HUD; тепловизор. |\n| `StoryEditor` | Редактор сюжета, сыгранный указателем и клавишами на приветствии верфи, никогда не сохраняется: отрывок добавлен двойным щелчком, набрана реплика, протянут провод, показана и исправлена ошибка, сцена рассказана как отредактирована. |\n| `Turrets` | Гонщик с двумя турелями, кружащий вокруг трёх стоящих патрульных катеров, снабженец его стороны, ложащийся в дрейф среди них, и недосягаемый ялик: турели сами поворачиваются, упреждают и стреляют только по катерам в досягаемости. Smoke: завеса патрульного катера слепит турель. |\n| `Yard` | Верфь, сыгранная указателем и клавишами: места, детали, показатели, покупка, проект, который тонет, корпус, опробованный и взятый обратно, клавиши вида; деталь, предлагаемая только на станциях, куда она подходит. Cradle: патрульный катер с люлькой, которую предлагают только позади миделя, по одной на лодку. |\n\n## Как написать демо\n\nКейс заслуживает сцены, если держит прогон на проверках, которых нет у остальных, или показывает то, чего не показывают остальные; другой ветер, зерно, проект или вид — дело окна «Кейс». Новый кейс — это сцена: скопируй одну в папке демо и поменяй значения её инспектора. Новое демо — папка со скриптом, наследующим от `Stage`, переопределяющим `Set`, чтобы поставить его вещи на воду (`Launch` выводит лодку в море), и `Checks` для того, чему прогон должен соответствовать в конце; `Seconds` — сколько прогон даёт ему играть. Сцена без моря наследует от `Demo` и строит в `Build`.\n"}, {"id": "tools-map-editor", "path": "tools/map-editor.md", "title": "Редактор карт", "section": "tools", "date": "2026-11-09", "md": "# Редактор карт\n\nРедактор в игре, в котором правят карты и их миссии над живым миром.\n\n## Решения владельца\n- Редактор карт в игре, открывается из меню базы: локация карты (острова, рифы, отмели, вода, час, ветер, зыбь) и её миссии (старт, охотники и их команды, маяки, косяки и обломки), правятся над живым миром, виденным сверху. Карты — файлы: собственные карты игрока и собственные локации и миссии игры, которые открываются в нём, чтобы их чинить.\n- Редактор расставляет арены и кадры вставок ([Камера и картинка](../gameplay/camera.md)).\n\n## Как устроено (`editor/`)\n\nОткрывается из меню базы или из «Ваших карт» на карте (`editor/Editor.tscn`) и правит карту над её живым миром: последнюю открытую карту, её миссию и вид, иначе карту базы (`user://editor.cfg`). Файл, в котором нет карты, никогда не открывается (`Maps.TryRead`). Вид двигается клавишами, перетаскиванием правой или средней кнопкой, колесом и прокруткой трекпада (`EditorCamera`). Формы рельефа перетаскивают, растягивают и поворачивают; числа выбранной и числа локации — ползунки со словами и единицами, которые оставляют колесо прокручивать их окно (`Inspector`, `scenery/Fields.cs`). Почему ползунки через рефлексию: в записях карты по десятку чисел, и одна панель обслуживает их все. Земля добавляется из готовых пресетов игры, с сохранением имени пресета (`Presets.Forms`, `IForm.Name`); «Удиви меня» рисует карту случайно. Мир поднимается заново, когда локация постоит неподвижно мгновение, а её название не учитывается. Старт миссии, закреплённые охотники, маяки и места промысла — метки, которые перетаскивают по морю, охотники пронумерованы как в своих строках; её игра, числа и музыка — в окне «Задания». Её зоны (Areas) добавляются из «Зон и опасностей» этого окна в середине вида и рисуются на море, угрозы красным, путь течения шевронами, тайник янтарным, припасы цветом своего предмета; точки выбранной перетаскивают, добавляют и убирают, а её числа, охотников, предметы или припасы задают в «Выбрано» (`Editor.Areas.cs`). Арена добавляется там же и рисуется сиреневым кругом, как остальные зоны; в «Выбрано» у неё список вставок, из которого её привязывают к вставке.\n\nВставки миссии (`Editor.Scenes.cs`) — в окне «Задания», под зонами: у каждой строка с названием и кнопками «+ Shot» (кадр ставится в середине вида), «Preview» и «Delete». Кадр рисуется на море сиреневой меткой с подписью «название · номер»; его перетаскивают, а у движущегося («Drifts» в «Выбрано») вторая метка, куда он сползает, тоже перетаскивается. В «Выбрано» у кадра ползунки секунд, высоты кадра, наклона и поворота. Предпросмотр играет вставку над живым миром под полосами, окна уходят, Space, Enter, Esc или щелчок кончают его (`ShotCamera`, `Titles.Letterbox`). Переименование вставки переименовывает её и у арен, а удаление её или её последнего кадра снимает привязку. Почему так: кадры и арены — те же метки на море, что остальное, и правятся тем же перетаскиванием.\n\n\nCtrl+Z отменяет; серия изменений одной вещи — как одно, вместе с тем, что было выбрано; не отменяются сохранение, переименование и корзина. Строка состояния сообщает о каждом изменении и отмене и о том, отличается ли карта от последней открытой или сохранённой; заголовок говорит, где она хранится. Его окна (`Editor.Panels.cs`) и строка состояния — окна инструментов ([Экраны и меню](../interface/screens.md)): «Выбрано» и «Задания» делят боковую сторону в фиксированных частях, чтобы ни одно не оттесняло другое, и каждое окно складывается. Меню и окно «Открыть» берут клавиши и указатель, пока стоят (затемнение поверх окон, `EditorCamera.Still`). «Открыть» — окно карт игры и игрока, которые оно переименовывает и кладёт в корзину (`Maps.Rename`, `Maps.Delete`); нажатие, которое потеряло бы изменения или удалило, просит второго нажатия.\n\nКарты — JSON (`scenery/Maps.cs`): собственные карты игры лежат в `maps/`, карты игрока в `user://maps`. Почему JSON: карта — несколько записей, читаемых и чинимых вручную. Карта чинится при загрузке (`Mending`): то, что уронило бы игру, повесило бы её или сломало бы море (пропавший список, неизвестный вид, число за пределами диапазона своего ползунка, охотник, которого нет в этой сборке), исправляется или выбрасывается с предупреждением, а карта, которую нельзя прочесть, говорит почему. Собственные локации игры узнают по имени их файла, поэтому переименование одной не ломает игру. «Сохранить» пишет карту туда, где её открыли, собственную карту игры только когда игра запущена из своего проекта; «Сохранить как свою» пишет среди карт игрока, а затем поверх этой копии. Неудачное сохранение говорит почему словами (`Maps.Write`). «Играть» сохраняет и выводит выбранную миссию на копии последнего прогресса, которая никогда не сохраняется (`Progress.Copy`), и возвращается в редактор, когда миссия кончается или нажато «В редактор» в меню паузы (`back` у `Game.TakeUp`).\n"}, {"id": "tools-release", "path": "tools/release.md", "title": "Сборки и посты", "section": "tools", "date": "2026-11-08", "md": "# Сборки и посты\n\nКак экспортируют сборки игры и публикуют новости в канал.\n\n## Как устроено\n\n- **Сборки.** `tools/build.sh` экспортирует сборки для macOS (universal) и Windows в zip-архивы, названные по `config/version` в `game/project.godot`. Версии вида 0.0.N, последнее число растёт после каждого поста; когда версия станет 0.1, говорит владелец. Сборки уходят на Google Drive через rclone на Mac владельца, и посты ссылаются на них (файлы Telegram бросили: у бота потолок загрузки). Сборку для Windows никогда не запускали. Веб-экспорт сделать нельзя: Godot 4.7 не экспортирует C# в веб, а в WebGL 2 нет вычислительных шейдеров для моря. Экспорт Godot завершается с кодом 0, даже когда терпит неудачу.\n- **Посты.** `tools/post.sh` публикует в Telegram-канал игры (короткий русский текст, скриншоты, клипы, ссылки на сборки) через навык `.claude/skills/telegram-post`. Публикация публична, поэтому владелец заранее одобряет текст и медиа каждого поста. Пост о возможностях — трейлер над списком: строка на возможность, эмодзи и название из двух-трёх слов.\n- **Облачная сессия.** `tools/cloud/setup.sh` готовит машину облачной сессии (.NET SDK, Godot, Xvfb с программным Vulkan от Mesa для прогонов демо; Blender как `blender` при `BLENDER=1`); хук начала сессии `.claude/hooks/session-start.sh` запускает его, когда чего-то не хватает.\n"}, {"id": "tools-story-editor", "path": "tools/story-editor.md", "title": "Редактор сюжета", "section": "tools", "date": "2026-11-08", "md": "# Редактор сюжета\n\nРедактор в игре, в котором пишут сцены сюжета. Как сцены устроены и когда запускаются: [Сцены сюжета](../story/scenes.md).\n\n## Решения владельца\n- Сюжет рассказывают сценами, которые пишут во встроенном редакторе сюжета.\n- Сцена — это граф отрывков на холсте. Каждый отрывок — сценарий: кто говорит, с каким лицом, и реплика с метками.\n\n## Как устроено (`storyeditor/`)\n\nРедактор сюжета (в меню базы после редактора карт) пишет сцены в окнах инструментов редактора карт (`Tools`). Его окно «Сцены» перечисляет файлы в `res://story`: набранное там имя переименовывает сцену и её файл, если оно не занято другой сценой; «Открыть» и «Удалить» (в корзину) просят второго нажатия, если потеряли бы изменения. Холст (`Canvas`, `GraphEdit`) показывает каждый отрывок узлом с первыми строками, первый помечен как начало; провода читаются с переходов и ответов (`Screenplay.Parse`) и никогда не хранятся, а провод, протянутый между двумя отрывками, пишет `-> target` в конец сценария первого. Двойной щелчок по холсту или «+ Эпизод» добавляет отрывок; перетаскивание сохраняется как его X и Y; переименование переписывает переходы и ответы, которые его называют. Сценарий выбранного отрывка — `CodeEdit` (`ScriptEdit`), раскрашенный `Colours`, с палитрой, печатающей говорящих, лица, метки и шаги; отмена в нём — собственная для редактора. Под ним перечислены ошибки (`Screenplay.Faults`), берущие клавиши к своей строке, а строки с ошибками помечаются по мере набора сценария. Окно «Сцена» хранит имя, триггер, требование, приоритет и признак «только раз». Сохранить (Ctrl+S) пишет файл; Играть (F5) рассказывает сцену как она есть, сохранённую или нет, с `Teller` на копии последнего прогресса, которая никогда не сохраняется, и редактор снова берёт клавиши, когда она кончится.\n"}, {"id": "vision", "path": "vision.md", "title": "Об игре", "section": "", "date": "2026-11-11", "md": "# Об игре\n\n![Арена: охотники идут на лодку игрока у острова](img/arena.jpg)\n\nFloppa Tropical Adventures коротко: что это за игра и в каком она состоянии.\n\n## Решения владельца\n- Игра называется Floppa Tropical Adventures. Код и репозиторий по-прежнему называют её Pirates; игроку это слово не показывается.\n- Аркадная морская игра: одна лодка, которой управляешь с весёлым ощущением моторной лодки, а не физикой, бой с вражескими лодками на красивом море, статичный изометрический вид 2.5D.\n- Веселье важнее реализма: где реалистичная модель делает игру медленной или раздражающей, делаем то, что делают выпущенные игры. Реализм оставляем только там, где он делает игру лучше.\n- PC.\n- Кооператив по сети до четырёх игроков, каждый в своей лодке ([Онлайн-кооп](online.md)).\n- Сеттинг — оптимистичный соларпанк спустя долгое время после падения ([Сеттинг и лор](story/setting.md)).\n- 60 кадров в секунду достаточно; качество картинки важнее (2026-10-26).\n\n## Как играется\n- Игра начинается на [базе](base/pier.md): пирс у острова, [верфь](base/boatyard.md), где лодку собирают из деталей, [полигон](base/testing-ground.md).\n- С базы лодка уходит на арену ([заход](gameplay/missions.md) на единственной карте, [локация](world/locations.md)), дерётся с [охотниками](gameplay/hunters.md), собирает [добычу](gameplay/haul.md) и везёт её домой через точку выхода. Набеги шлёт [директор](gameplay/director.md).\n- Дома добыча сразу продаётся на квитке за монеты, на монеты покупают детали ([Прогресс и сохранения](gameplay/progression.md)).\n\n## Состояние\n- Всё — прототип, и ничто не высечено в камне ([Главная](README.md)).\n- Миссии и боссы — заглушки, а не настоящие. Честность и доступность настраиваются ближе к релизу. Будут новые функции.\n- Владелец судит игру, играя; многое из сделанного в ноябре 2026 он ещё не играл ([Журнал решений](decisions.md)).\n- Версии 0.0.N выходят с постами в канале игры ([Сборки и посты](tools/release.md)).\n- Как мы делаем игру — принципы и правила проекта: [CLAUDE.md](../CLAUDE.md).\n"}, {"id": "world-areas", "path": "world/areas.md", "title": "Зоны и опасности", "section": "world", "date": "2026-11-11", "md": "# Зоны и опасности\n\n![Горящее нефтяное пятно](../img/slick.jpg)\n\nЗоны — места на карте миссии: логова, посты, минные поля, течения и прочие опасности.\n\n## Решения владельца\n- Течения аркадные и лежат поверх моря (2026-11-11): бирюзовые светящиеся шевроны-стрелки, как ускоритель на гоночной трассе, без видимых краёв коридора.\n\n## Как устроено\n- **Арена** (`maps/arena.json`). Владелец решил (2026-11-10): течения — ускорители, аркадный элемент; их коридоры разложены по Арене и несут лодку заметно быстрее её хода. Импульсные башни и прожекторы на Арене заменены батареями, которые просто стреляют (решение без владельца, [Q143](../questions/world.md#q143)): владельцу они показались странными, башня «толкала» лодку. Сами виды зон остались для своих карт.\nКарта миссии отмечает зоны (`Area.cs`, хранятся в её файле по видам): круг вокруг одной точки или коридор вдоль цепочки точек шириной в свой радиус в каждую сторону (`Shape`). Почему одна форма: редактор рисует, двигает и размеряет любой вид одинаково, а коридор угроз получается даром. Каждая зона ставится при открытии миссии и убирается вместе с ней, только на хосте, кроме течений ([Онлайн-кооп](../online.md)).\n\n- **Логова** (`missions/Director.cs`, `Band`): набеги приходят из ближайшего к их добыче вне вида места логова, а охотники банды, не прикованные к месту, — из логова, ближайшего к старту.\n- **Посты охраны** (`Posts`, `Places`): охотники вдоль поста лицом в его сторону или вокруг середины круга лицом наружу держатся, пока лодка игрока не войдёт в него или одного из них не ударят; тогда охотится весь пост (`Captain.Rouse`).\n- **Минные поля** (`Mines`, `MineModel`): старые рогатые мины на плаву, качающиеся, с красной мигающей лампой, не менее метра глубины. Корпус, коснувшийся мины, или попавший в неё снаряд подрывает её; её взрыв после короткого запала подрывает те, что в досягаемости, так что поле взлетает цепью.\n- **Течения** (`Currents`, `Chevrons`, `chevrons.gdshader`): вода, бегущая вдоль коридора со своей скоростью, рисуется рядами шевронов, бегущих с водой по ленте, лежащей на волнах; ряды гаснут к краям коридора и к его концам. Вокруг одной точки — водоворот, который поворачивает корпуса вокруг своей середины и втягивает их; его шевроны — четыре спиральных рукава, гаснущих в тихой середине. Лодка движется собственным ходом через воду плюс ходом воды (`Boat.Water`, `Manoeuvring`), а плавающий хлам дрейфует вместе с ней.\n- **Обстрелы** (`Barrages`, `Warnings`, `Descents`, `FallModel`): пока лодка в нём или рядом, каждые несколько секунд падение, чаще всего на лодку в нём: на воде заполняется красное кольцо, затем снаряд с дымным хвостом или горящая вулканическая бомба, парящая там, где упала, падает в него и разрывается. Почему кольцо: быстрая лодка его читает и уходит.\n- **Импульсные башни** (`Towers`, `TowerModel`, `PulseRings`, `pulse.gdshader`): старая стальная решётчатая мачта на скале, стеклянный шар которой набухает перед каждым импульсом. Сине-белая стена брызг расширяется до радиуса, медленнее лодки на ходу, с одним или двумя просветами, ставящимися заново при каждом импульсе (`Gap`); корпус, который она пересекает вне просвета, получает удар и выбывает.\n- **Батареи** (`Batteries`, `BatteryModel`): ракетная установка охотников на сваях, её пусковая поворачивается к ближайшей лодке игрока в досягаемости и бьёт красными залпами с упреждением, с установки, а не с лодки (`Gunnery.Launch`). Снаряды и взрывы разносят её на куски: пусковая падает, и она горит. HUD обводит кольцом стоящую так же, как охотника (`combat/Mark.cs`).\n- **Прожекторы** (`Searchlights`, `SearchlightModel`, `beam.gdshader`): стальная башня, чей луч шарит по кругу. Лодку игрока, на которую он падает, вне дыма, замечают: луч держится на ней красным, HUD предупреждает, поднимаются все посты, а директор сразу шлёт набег (`Director.Summon`). Лодку замечают снова лишь после передышки.\n- **Нефтяные пятна** (`Slicks`, `Spill`, `oil.gdshader`): тёмная плёнка на море с бочками на плаву в ней. Снаряд, упавший в неё, взрыв бочки или взрыв поджигает её; огонь идёт оттуда, каждая часть горит какое-то время и гаснет, бьёт корпуса, лежащие в ней, и подрывает бочки в ней. Её нефть и огонь — сетка, которую шейдер читает как текстуру.\n- **Бочки с топливом** (`Drums`, `DrumModel`): красные бочки на плаву. Снаряд, взрыв или корпус и бочка, сошедшиеся резко (таранщик, пролетающий насквозь), взрывают её цепью, как мины; медленный нос толкает её, и она дрейфует, замедляясь, по течениям.\n- **Боны** (`Booms`, `BoomModel`): малиновые поплавки на цепи, лебёдочная будка у первой точки с лампой: зелёная — открыто, красная — закрыто, янтарная — перед сменой. Закрытый, он для корпусов стена (`ships/Contact.cs`); открытый — отведён в сторону вокруг своей лебёдки. Открывается и закрывается по таймеру или остаётся закрытым, пока лебёдку не разнесут на куски.\n- **Основания** (`Footings`): скала башни, сваи батареи и опоры прожектора — тоже стены.\n- **Препятствия** (`Obstacles`, `ai/Feelers.cs`): охотники обходят мины (карты и сброшенные лодкой), бочки, горящую нефть, боны и основания.\n- **Тайники** (`Caches`): предметы, названные картой, на плаву вокруг неё и больше нигде не находимые, собираются в трюм.\n- **Точки припасов** (`Depots`): припас своего вида лежит в ней, пока его не возьмут, а через некоторое время появляется другой.\n- **Арены** (`Arena`, `Arenas`): круг, внутри которого вид игрока стоит над серединой вместо того, чтобы следовать за лодкой ([Камера и картинка](../gameplay/camera.md)), и откуда первый вход лодки игрока запускает вставку, названную в `Scene`. Это только вид: ни хост, ни бой, ни сеть арены не читают, и на море она ничего не рисует; редактор рисует её, как остальные зоны.\n- **Затонувшие тайники** (`activities/Site.cs`, `Wreck`): обломки, отмеченные на карте, хранят названные предметы, которые кран-захват поднимает вместо добычи.\n"}, {"id": "world-ground", "path": "world/ground.md", "title": "Рельеф", "section": "world", "date": "2026-11-11", "md": "# Рельеф\n\n![Остров на отмели и коса](../img/shallows.jpg)\n\nРельеф — земля локации, склеенная из форм рельефа в одно поле высот.\n\n## Решения владельца\n- Карты содержат больше видов земли, каждый ставится в редакторе карт и разнообразится зерном и несколькими числами: горы и вулканы, барьерные рифы, кекуры, косы и песчаные отмели.\n- Горы — голый камень примерно до 120 м: серый камень и отвесные скалы, зелень только у подножия. Земля, закрывающая лодку, становится прозрачной вокруг неё.\n- Барьерный риф — полоса коралла прямо под водой, вдоль берега или дугой в море: зыбь белым разбивается вдоль неё, за ней лежит спокойная бирюзовая лагуна, и в ней прорезаны проходы.\n- Кекуры — карстовые башни высотой от 10 до 40 м: серые столбы с отвесными стенами, подточенные у воды, увенчанные джунглями, как в заливах Пханг Нга или Халонг.\n- Косы и песчаные отмели: белые отмели чуть над водой среди светящегося бирюзового мелководья; длинные косы, загибающиеся от берега, с травой на дюнах и пальмами на конце; и валы чуть под водой, через которые прибой разбивается рядами, слишком мелкие для тяжёлой лодки.\n\n## Как устроено\nФормы рельефа локации сводятся в одно поле высот (`Ground`): каждая точка так высока, как самая высокая форма там, скруглена там, где две встречаются, и покрыта так, как покрывает та форма. Оно обслуживает меш земли, море над ней, кили, рули и ракеты (`World.Ground`, который добавляет палубы дока).\n\n- **Острова** (`Island`, `IslandForm`): берег, пляж, холмы и песчаная банка мористее, уходящая к открытому дну. Берег меняется от песчаных бухт до скальных обрывов. Овраги режут холмы шумом эродированного рельефа, закэшированным на сетке (`common/Raster.cs`). Почему не эрозия: с большой высоты острову нужны лишь долины, которые читаются. Почему банка кея лежит на 5 м: глубже, чем ломаются волны открытого моря, поэтому они пересекают её целиком и разбиваются на пляже.\n- **Горы** (`Mountain`): голый камень от открытого дна, зелёный только у подножия: конус, вытянутый вдоль хребта, опущенный в седловинах между плечами широким шумом, с отрогами, расходящимися от вершины хребтовым шумом, обвитым вокруг и вытянутым вниз по склону, поднимающийся отвесным обрывом от ватерлинии, с дном, уходящим под обрыв и сходящим на нет у пляжа. Кратер выдалбливает вершину вулкана. Почему не террасные полосы обрыва и не эрозия: с большой высоты и то и другое читается как ямы и ступени, а не как камень. «Пик», «Хребет» и «Вулкан» в редакторе, обведённые на протяжении хребта; вулкан вулканического острова и хребет гранитного пролива.\n- **Рифы и отмели** (`Atoll`, `Reef`, `Flats`): кольцо рифа атолла вокруг лагуны с проходами и пятнами рифов; барьерный риф — дуга такого, изогнутая от почти прямой до полукольца, с лагуной полосой позади, сужающейся к концам, за которыми оба уходят к открытому дну; отмели дельты — мелкое дно с протоками там, где шум пересекает нуль, как рисуют реки в играх. «Барьерный риф» в редакторе; у острова базы он есть с дальней стороны, на краю его банки.\n- **Кекуры** (`Stacks`): карстовые башни на мелком шельфе, держащиеся порознь, самая высокая первой: бугристые столбы с отвесными стенами, куполообразные верхушки под джунглями. Почему нет подмыва: земля — поле высот, оно не может нависать. «Кекуры» и «Одинокий кекур» в редакторе.\n- **Косы и отмели** (`Spit`): вал песка вдоль линии, загибающийся всё круче к концу, купол поперёк него от гребня к песчаному подножию, достаточно широкий, чтобы гребень стоял на уклоне, на котором лежит песок, и сужающийся к концам, с дюнами вдоль гребня, достаточно высокими для травы, с бирюзовым мелководьем вокруг; валы рядом рядами разной длины, каждый дальше от первого на шаг глубже, так как укрытие успокаивает волну до самой мелкой глубины, которую она прошла, и зыбь разбилась бы лишь на первом валу. Пальмы растут вдоль гребня высокого конца (`Palms`). «Песчаная отмель», «Коса с загибом» и «Подводные валы» в редакторе, размеры по их ширине; у острова базы есть коса с загибом.\n- **Покров и меш** (`Cover`, `Vegetation`, `Crowns`, `Palms`, `GroundMesh`, `Seabed`, `ground.gdshader`, `Palette`): зонирование как у карибского острова, от песка до леса, в цветах локации. Один меш на всю землю: ограниченное квадродерево, мелкое над сушей и у ватерлинии и крупнее под водой, веером к более мелкому соседу, чтобы не открывалась щель. Почему один: формы рельефа пересекаются, и два меша там боролись бы. Луга морской травы получаются из шума, запечённого в текстуру, которую шейдер читает по пикселям (`Meadows`). Каждый бор, дошедший до ватерлинии, посылает плёнку вверх по пляжу позади пенного фронта.\n- **Мангровая кайма** (`Mangroves`, `mangroves.gdshader`): там, где локация растит мангры, берег каждого острова несёт кайму, построенную отдельно от меша земли, так что земля и море под ней не меняются: купол на ячейку решётки у ватерлинии, смыкающиеся в один полог, с корнями-подпорками, уходящими в воду, в листве леса (`ground_foliage`). Почему купола: кроны — лопасти края, без выреза, который надо согласовывать. Лодки проходят сквозь неё без помех.\n\nСм. также: [Локации](locations.md), [Редактор карт](../tools/map-editor.md).\n"}, {"id": "world-locations", "path": "world/locations.md", "title": "Локации", "section": "world", "date": "2026-11-11", "md": "# Локации\n\nЛокация — набор значений для общих моделей мира: она выглядит и играется так, как велит её природа.\n\n## Решения владельца\n- Открытый мир сражается в локации Арены со своей водой, часом, ветром и волнами: открытые банки под сильными пассатами, а пирс базы (`Dock`) стоит на главном острове в центре карты (`Home cay`).\n\n## Как устроено\nЛокация (`Setting`) — один набор значений для общих моделей: час, на котором держится небо, пассаты и зыбь (`Trades`, `Swell`), что содержит вода, палитра земли и что на ней растёт, и её формы рельефа; всё это хранится вместе с миссиями, которые в ней сражаются, в файле карты (`maps/*.json`, `Maps`). `World` поднимается из неё за шторкой загрузки; направление пассатов по-прежнему выбирается заново. На картах с `Setting.Base` (`arena.json` и `coral-cay.json`) `World` ставит пирс (`Dock`) у первого острова. Миссия расставляет свои лодки вокруг `World.Centre`, в пределах `World.Reach`, на воде, которую `World.Deep` находит достаточно глубокой для их килей.\n\nСм. также: [Рельеф](ground.md), [Море](sea.md), [Редактор карт](../tools/map-editor.md).\n"}, {"id": "world-sea", "path": "world/sea.md", "title": "Море", "section": "world", "date": "2026-11-11", "md": "# Море\n\n![След лодки на открытом море](../img/sea.jpg)\n\nМоре — вода игры: волны, укрытие и прибой, кильватерные следы, пена, отражение и цвет.\n\n## Решения владельца\n- Красивый океан.\n- Остров с большой площадью мелководья рядом, чтобы море выглядело красиво.\n\n## Как устроено\n`sea.gdshader` собирает всё это под единой световой моделью сцены (`sky/sunlight.gdshaderinc`). Облик моря по решениям владельца — в [Облик мира](../art/world-look.md).\n\n- **Волны** (`Waves`, `WaveSpectrum`, `WaveSimulation`, `waves_*.glsl`): океан на БПФ на GPU, ветровое волнение и зыбь локации в трёх каскадах, уложенных со случайными смещениями, так что узор не повторяется (`Tiling`). Длинные волны считает CPU: `SeaSurface.HeightAt` и `HeadAt` читают их с учётом укрытия и глубины. Клипмапы (`clipmap.gdshaderinc`) центрируются на фокусе вида, их ячейки так же грубы, как пиксели вида в фокусе позволяют, а далёкая от вида вода не читает волн. Почему: каждая вершина читает волны, около миллисекунды на кадр при полном размере. `SeaMotion` пишет движение моря для апскейлера.\n- **Укрытие и прибой** (`Shelter`, `SeaGround`, `surf.gdshaderinc`, `bores.gdshaderinc`): при загрузке земля сэмплируется на сетку, которую читают шейдер и корпуса, и это стоит одинаково, сколько бы форм рельефа ни присоединилось. Каждая ячейка другой сетки смотрит против ветра через разброс волн; земля останавливает волны, мелководье срезает их, как обрушение, а размытие загибает их в подветренную сторону. То, что убрала глубина, уходит бором, который катится вдоль изобат и кладёт пену. Почему рваные фронты: с высоты боя гладкий бор читается как жёсткая полоса.\n- **Следы** (`Wakes`, `wakes_*.glsl`, `wakes.gdshaderinc`): карта вокруг вида, которую каждый корпус давит по своим обводам и смещает там, где прошло его тело (`WakeSource`), поэтому она плотная и тянет кельвиновский след. Вода бурлит там, где ломается гребень и за корпусом на ходу; пена и бурление дрейфуют вместе с течением поверхности, так что след остаётся там, где создан. `Wakes.Splash` открывает воронку там, где что-то бьёт по воде. Проходы идут после движения корпусов (`common/AfterMoves.cs`).\n- **Пена** (`Foam`, `FoamPattern`, `foam.*`): одна модель для барашков, прибоя, следов и брызг, освещённая как рассеивающий слой. Редеющая пена вытягивается в линии там, где течение сходится, сохраняя пузырьки, так что старый след распадается на кружево, а не на серую плёнку. Почему одно значение бурления, а не модель турбулентности: с высоты боя она читается так же.\n- **Сухие кокпиты** (`Cockpit`, `cockpits.gdshaderinc`): море не рисуется в открытом кокпите корпуса. Почему: поле высот стоит внутри корпуса лишь настолько низко, насколько его продавленная впадина.\n- **Отражение** (`reflection.gdshaderinc`, `tracing.gdshaderinc`, `DepthPyramid`, `LightPyramid`, `ScreenPyramid`): отражения в экранном пространстве, трассируемые конусом через пирамиду глубины; за экраном — небо. Почему хватает экрана: при изометрическом наклоне отражённый луч покидает его только у верхнего края. `facets.gdshaderinc` усредняет наклоны, которые пиксель не разрешает, в том числе волны короче нескольких пикселей, так что они читаются как блеск, а не зерно; `glints.gdshaderinc` мерцает солнечной россыпью (`UltraWater-LICENSE.txt`), редкой и яркой, без пыли одиноких граней вне её пути.\n- **Цвет и каустика** (`optics.gdshaderinc`, `refraction.gdshaderinc`, `WaterBody`, `Caustics`): цвет воды из того, что она содержит, дно видно через преломление, каустика ложится на то, что под водой. Только во внешнем виде: тонкая каустическая сеть коротких волн показывается наполовину поверх широкой сети длинных, а лицо воды над отмелями спокойнее, чем стоят волны, и возвращается к ним мористее ([Облик мира](../art/world-look.md)).\n"}, {"id": "hulls-runabout", "path": "hulls/runabout.md", "title": "Катерок", "section": "hulls", "date": "", "md": "# Катерок\n\n![Катерок](../img/parts/Hull-Runabout.jpg)\n\nМеньше и легче всех: быстрее всех разгоняется и поворачивает, но держит мало ударов.\n\nсамый лёгкий и резкий, но держит два удара. Под сильным мотором самый быстрый.\n\nЗначения — из таблицы «1. Корпуса» на странице [Баланс лодок](../balance/boats.md#1-корпуса).\n\n## Упоминания\n- [Баланс экономики](../balance/economy.md)\n- [Баланс оружия](../balance/weapons.md)\n- [Охотники и ИИ](../gameplay/hunters.md)\n- [Глоссарий](../glossary.md)\n- [Вопросы: лодка](../questions/boat.md)\n- [Вопросы: бой](../questions/combat.md)\ utboards.md)"], ["Станции", "[Ракеты III](../weapons/rockets-iii.md), [Минный жёлоб](../weapons/mine-rail.md), пусто, [Ракеты III](../weapons/rockets-iii.md)"], ["Снаряжение", "Дымогенератор"], ["Броня", "Броневой пояс"], ["Масса, т", "17,24"], ["Удары", "14"], ["Скорость, м/с", "14,8"], ["Цена", "1950"], ["Добыча", "45"]], "src": "wiki/balance/boats.md"}], "sections": [{"dir": "", "label": "Об игре"}, {"dir": "gameplay", "label": "Геймплей"}, {"dir": "balance", "label": "Баланс"}, {"dir": "hulls", "label": "Корпуса"}, {"dir": "engines", "label": "Моторы"}, {"dir": "weapons", "label": "Оружие"}, {"dir": "hunters", "label": "Охотники"}, {"dir": "base", "label": "База"}, {"dir": "world", "label": "Мир"}, {"dir": "interface", "label": "Интерфейс"}, {"dir": "art", "label": "Арт-дирекшн"}, {"dir": "audio", "label": "Звук"}, {"dir": "story", "label": "Сюжет"}, {"dir": "tools", "label": "Инструменты"}, {"dir": "questions", "label": "Открытые вопросы"}, {"dir": "reports", "label": "Отчёты"}], "repo": ""}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const byId = new Map(D.pages.map(p => [p.id, p]));
const byPath = new Map(D.pages.map(p => [p.path, p]));
const label = dir => (D.sections.find(s => s.dir === dir) || {}).label || dir;
const catId = dir => dir || 'main';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const day = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${MONTHS[m - 1]} ${y}`; };
const plural = (n, f) => `${n} ${f[n % 10 === 1 && n % 100 !== 11 ? 0 : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2]}`;
const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
const plain = md => md.replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[#*`>|_]+/g, ' ').replace(/\s+/g, ' ').trim();

// A file in the repo, on GitHub; the public site has no repo to link to, so the link goes.
const gh = path => D.repo ? { ext: D.repo + path } : {};

// Resolves a link in a page's Markdown against the page: a wiki page, a wiki file, or an outside URL.
function resolve(from, href) {
  if (/^[a-z]+:/i.test(href)) return { ext: href };
  const u = new URL(href, 'https://w.invalid/wiki/' + from);
  const path = decodeURIComponent(u.pathname), anchor = decodeURIComponent(u.hash.slice(1));
  if (!path.startsWith('/wiki/')) return gh(path.slice(1) + u.hash);
  const rel = path.slice(6);
  if (rel.endsWith('.md')) return byPath.has(rel) ? { page: byPath.get(rel), anchor } : gh('wiki/' + rel);
  // ponytail: only wiki/img ships with the page; reports and PDFs open on GitHub
  return rel.startsWith('img/') ? { file: rel } : gh('wiki/' + rel);
}
const href = (p, anchor) => '#' + (p.path === 'README.md' && !anchor ? '' : p.id) + (anchor && /^[\w-]+$/.test(anchor) ? '--' + anchor : '');

for (const p of D.pages) {
  let body = p.md.replace(/^# .*\n/, '');
  const im = body.split(/\n## /)[0].match(/^!\[([^\]]*)\]\(([^)\s]+)\)[ \t]*$/m);
  if (im) { p.img = resolve(p.path, im[2]).file; p.cap = im[1]; body = body.replace(im[0], ''); }
  p.body = body;
  p.lead = plain((body.trim().split(/\n\s*\n/).find(b => !/^\s*[#|<-]/.test(b)) || ''));
  p.text = plain(body);
}
const sectionPages = dir => D.pages.filter(p => p.section === dir).sort((a, b) => (a.path.endsWith('README.md') ? -1 : 0) - (b.path.endsWith('README.md') ? -1 : 0) || a.title.localeCompare(b.title, 'ru'));
const sectionImage = dir => (sectionPages(dir).find(p => p.img) || {}).img;

// ---- page parts
function head(crumbs, title, meta, action) {
  $('crumbs').innerHTML = crumbs; $('title').textContent = title; $('meta').innerHTML = meta || ''; $('action').innerHTML = action || '';
  document.title = title === 'Floppa Tropical Adventures Wiki' ? title : `${title} | Floppa Tropical Wiki`;
}

// Only Markdown goes through here: the page's own links and images are resolved against its file.
function render(md, from) {
  const d = document.createElement('div');
  d.innerHTML = marked.parse(md); fixup(d, from);
  return d.innerHTML;
}

// A Markdown value of an infobox row, inline.
function inline(md, from) {
  const s = document.createElement('span');
  s.innerHTML = marked.parseInline(md); fixup(s, from);
  return s.innerHTML;
}

function fixup(root, from) {
  const seen = {};
  root.querySelectorAll('h2, h3, h4').forEach(h => {
    let s = slug(h.textContent); seen[s] = (seen[s] || 0) + 1; if (seen[s] > 1) s += '-' + (seen[s] - 1);
    h.id = 'h-' + s; h.dataset.anchor = s;
  });
  root.querySelectorAll('a[href]').forEach(a => {
    const r = resolve(from, a.getAttribute('href'));
    if (r.page) { a.href = href(r.page, r.anchor); if (r.anchor) a.dataset.anchor = r.anchor; a.dataset.page = r.page.id; }
    else if (r.file) { a.href = r.file; a.target = '_blank'; a.className = 'file'; }
    else if (r.ext) { a.href = r.ext; a.target = '_blank'; a.rel = 'noopener'; a.className = 'ext'; }
    else a.replaceWith(...a.childNodes);
  });
  root.querySelectorAll('img').forEach(i => { const r = resolve(from, i.getAttribute('src')); if (r.file) i.src = r.file; i.loading = 'lazy'; });
  root.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-scroll'; t.before(w); w.append(t); });
}

function toc(root) {
  const hs = [...root.querySelectorAll('h2, h3')];
  const first = root.querySelector('h2');
  if (hs.length < 3 || !first) return;
  let a = 0, b = 0;
  const items = hs.map(h => {
    const n = h.tagName === 'H2' ? (b = 0, ++a) : `${a}.${++b}`;
    return `<li class="${h.tagName === 'H2' ? 'l2' : 'l3'}"><a data-to="${h.id}"><span class="n">${n}</span>${esc(h.textContent)}</a></li>`;
  }).join('');
  const box = document.createElement('nav');
  box.className = 'toc' + (hs.length > 30 ? ' closed' : '');
  box.innerHTML = `<div class="toc-head">Содержание <button type="button">${hs.length > 30 ? 'показать' : 'скрыть'}</button></div><ol>${items}</ol>`;
  box.querySelector('button').onclick = e => { const c = box.classList.toggle('closed'); e.target.textContent = c ? 'показать' : 'скрыть'; };
  first.before(box);
}

function infobox(p) {
  const rows = [...(p.info || []).map(([k, v]) => [esc(k), inline(v, p.path)]), ['Раздел', `<a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>`]];
  if (p.date) rows.push(['Правка', day(p.date)]);
  const dec = (p.md.split(/^## Решения владельца\s*$/m)[1] || '').split(/^## /m)[0].match(/^- /gm);
  if (dec) rows.push(['Решений владельца', dec.length]);
  const qs = (p.md.match(/^### Q\d+/gm) || []).length;
  if (qs) rows.push(['Вопросов', qs]);
  const open = new Set(p.md.match(/questions\/[\w-]+\.md#q\d+/g) || []).size;
  if (open && !qs) rows.push(['Открытых вопросов', open]);
  const code = [...new Set((p.md.match(/`[\w./-]+\.(?:cs|gdshader|gdshaderinc|glsl|glslinc|py|sh|json|tscn|glb)`/g) || []).map(c => c.slice(1, -1)))];
  if (code.length) rows.push(['Код', code.slice(0, 6).map(c => `<code>${esc(c.split('/').pop())}</code>`).join('') + (code.length > 6 ? ` и ещё ${code.length - 6}` : '')]);
  return `<aside class="infobox"><div class="ib-title">${esc(p.title)}</div>` +
    (p.img ? `<figure><img src="${esc(p.img)}" alt="${esc(p.cap)}"><figcaption>${esc(p.cap)}</figcaption></figure>` : '') +
    `<div class="ib-group">${p.info ? 'Характеристики' : 'Сведения'}</div><table>${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table></aside>`;
}

function rail(p) {
  const recent = [...D.pages].filter(x => x.date).sort((a, b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title, 'ru')).slice(0, 8);
  const li = x => `<li${p && x.id === p.id ? ' class="here"' : ''}><span class="thumb" style="${x.img ? `background-image:url('${x.img}')` : ''}"></span><span><a href="${href(x)}">${esc(x.title)}</a><small>${esc(label(x.section))} · ${day(x.date)}</small></span></li>`;
  let html = `<section><h3>Свежие правки</h3><ul>${recent.map(li).join('')}</ul></section>`;
  if (p) {
    const same = sectionPages(p.section);
    html += `<section><h3>${esc(label(p.section))}</h3><ul>${same.map(x => `<li${x.id === p.id ? ' class="here"' : ''}><a href="${href(x)}">${esc(x.title)}</a></li>`).join('')}</ul></section>`;
  } else {
    const qs = sectionPages('questions').filter(x => !x.path.endsWith('README.md'));
    html += `<section><h3>Открытые вопросы</h3><ul>${qs.map(x => `<li><a href="${href(x)}">${esc(x.title)}</a><small style="margin-left:auto">${(x.md.match(/^### Q\d+/gm) || []).length}</small></li>`).join('')}</ul></section>`;
  }
  $('rail').innerHTML = html;
}

// ---- views
function article(p, anchor) {
  head(`в: <a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>`, p.title,
    p.date ? `Последняя правка: ${day(p.date)}` : '',
    D.repo ? `<a class="btn" href="${D.repo}${encodeURI(p.src || 'wiki/' + p.path)}" target="_blank" rel="noopener">Исходник ↗</a>` : '');
  const c = $('content');
  c.innerHTML = (p.path === 'README.md' ? '' : infobox(p)) + render(p.body, p.path);
  toc(c);
  $('cats').hidden = false;
  $('cats').innerHTML = `Категории: <a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>` +
    (/^## Решения владельца/m.test(p.md) ? '<a href="#cat-main">Решения владельца</a>' : '') +
    (p.img ? '<a href="#">Страницы с изображениями</a>' : '');
  rail(p);
  jump(anchor);
}

function category(dir) {
  const pages = sectionPages(dir);
  head('Категория', `Категория: ${label(dir)}`, `В категории ${plural(pages.length, ['страница', 'страницы', 'страниц'])}.`);
  $('content').innerHTML = `<div class="cards">${pages.map(p => `<a class="card" href="${href(p)}"><span class="thumb" style="${p.img ? `background-image:url('${p.img}')` : ''}">${p.img ? '' : esc(p.title[0])}</span><span><b>${esc(p.title)}</b><small>${esc(p.lead)}</small></span></a>`).join('')}</div>`;
  $('cats').hidden = true; rail(null); jump();
}

function home() {
  const readme = byPath.get('README.md');
  const latest = D.pages.reduce((a, b) => (b.date > a ? b.date : a), '');
  head('', 'Floppa Tropical Adventures Wiki', `${plural(D.pages.length, ['страница', 'страницы', 'страниц'])} · последняя правка ${day(latest)}`);
  const intro = readme.body.trim().split(/\n\s*\n/)[0];
  const decisions = byPath.get('decisions.md');
  const news = decisions.md.split('\n').filter(l => /^- \*\*\d\d-\d\d\*\*/.test(l)).slice(-8).reverse()
    .map(l => l.replace(/^- \*\*(\d\d)-(\d\d)\*\*\s*/, (_, m, d) => `- <b class="d">${+d} ${MONTHS[m - 1].slice(0, 3)}</b> `)).join('\n');
  const tiles = D.sections.map(s => {
    const n = sectionPages(s.dir).length, img = sectionImage(s.dir);
    return n ? `<a class="tile" href="#cat-${catId(s.dir)}"${img ? ` style="background-image:url('${img}')"` : ''}><span>${esc(s.label)}<small>${plural(n, ['страница', 'страницы', 'страниц'])}</small></span></a>` : '';
  }).join('');
  const gallery = D.pages.filter(p => p.img && !p.info).filter((p, i, a) => a.findIndex(q => q.img === p.img) === i)
    .map(p => `<a href="${href(p)}"><img src="${esc(p.img)}" alt="" loading="lazy">${esc(p.cap)}</a>`).join('');
  const c = $('content');
  c.innerHTML = `<div class="welcome">${render(intro, 'README.md')}
      <a class="btn" href="#vision">Об игре</a><a class="btn" href="#decisions">Решения</a><a class="btn" href="#known-issues">Известные недочёты</a><a class="btn" href="#glossary">Глоссарий</a></div>
    <h2>Разделы</h2><div class="tiles">${tiles}</div>
    <h2>Последние решения</h2><div class="news-wrap">${render(news, 'decisions.md')}</div>
    <h2>Галерея</h2><div class="gallery">${gallery}</div>`;
  c.querySelector('.news-wrap ul')?.classList.add('news');
  $('cats').hidden = true; rail(null); jump();
}

function jump(anchor) {
  const el = anchor && document.getElementById('h-' + anchor);
  if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
}

let pending = '';
function route() {
  document.querySelectorAll('#nav details[open]').forEach(d => d.open = false);
  const [id, anchor] = decodeURIComponent(location.hash.slice(1)).split('--');
  const a = anchor || pending; pending = '';
  if (!id) return home();
  if (id.startsWith('cat-')) return category(id === 'cat-main' ? '' : id.slice(4));
  const p = byId.get(id);
  if (p) return article(p, a);
  head('', 'Страница не найдена', `Нет страницы «${esc(id)}». <a href="#">На заглавную</a>`); $('content').innerHTML = ''; $('cats').hidden = true; rail(null);
}

// ---- nav and search
const GROUPS = [['Об игре', ['']], ['Геймплей', ['gameplay', 'balance']], ['Лодки', ['hulls', 'engines', 'weapons', 'hunters']], ['Мир и база', ['world', 'base']], ['Интерфейс', ['interface']],
  ['Арт и звук', ['art', 'audio']], ['Сюжет', ['story']], ['Разработка', ['tools', 'questions', 'reports']]];
$('nav').insertAdjacentHTML('afterbegin', GROUPS.map(([name, dirs]) => `<details><summary>${name}</summary><div class="menu">${dirs.map(d =>
  (dirs.length > 1 ? `<b>${esc(label(d))}</b>` : '') + sectionPages(d).map(p => `<a href="${href(p)}">${esc(p.title)}</a>`).join('')).join('')}</div></details>`).join(''));
document.querySelectorAll('#nav details').forEach(d => d.addEventListener('toggle', () => {
  if (d.open) document.querySelectorAll('#nav details[open]').forEach(o => o !== d && (o.open = false));
}));
document.addEventListener('click', e => {
  if (!e.target.closest('#nav details')) document.querySelectorAll('#nav details[open]').forEach(d => d.open = false);
  if (!e.target.closest('.search')) $('results').hidden = true;
  const to = e.target.closest('[data-to]');
  if (to) { e.preventDefault(); document.getElementById(to.dataset.to)?.scrollIntoView({ behavior: 'smooth' }); return; }
  const a = e.target.closest('a[data-page]');
  if (!a) return;
  const anchor = a.dataset.anchor || '';
  if (a.getAttribute('href') === (location.hash || '#')) { e.preventDefault(); jump(anchor); }
  else if (!/^[\w-]+$/.test(anchor)) pending = anchor;
});

let hits = [], on = 0;
function search() {
  const q = $('q').value.trim().toLowerCase(), box = $('results');
  if (q.length < 2) { box.hidden = true; hits = []; return; }
  hits = D.pages.map(p => {
    const t = p.title.toLowerCase().indexOf(q), b = p.text.toLowerCase().indexOf(q);
    return { p, b, score: t === 0 ? 3 : t > 0 ? 2 : b >= 0 ? 1 : 0 };
  }).filter(h => h.score).sort((a, b) => b.score - a.score).slice(0, 8);
  on = 0;
  const mark = s => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
  box.innerHTML = hits.length ? hits.map((h, i) => `<a href="${href(h.p)}" class="${i ? '' : 'on'}">${mark(h.p.title)}<small>${h.b >= 0 ? '…' + mark(h.p.text.slice(Math.max(0, h.b - 50), h.b + 90)) + '…' : esc(label(h.p.section))}</small></a>`).join('')
    : '<b>Ничего не найдено</b>';
  box.hidden = false;
}
$('q').addEventListener('input', search);
$('q').addEventListener('focus', search);
$('q').addEventListener('keydown', e => {
  const items = $('results').querySelectorAll('a');
  if (e.key === 'Escape') { $('results').hidden = true; $('q').blur(); }
  if (!items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); items[on].classList.remove('on');
    on = (on + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length; items[on].classList.add('on');
  }
  if (e.key === 'Enter') { location.hash = items[on].getAttribute('href'); $('results').hidden = true; $('q').value = ''; $('q').blur(); }
});
$('results').addEventListener('click', e => { if (e.target.closest('a')) { $('results').hidden = true; $('q').value = ''; } });

history.scrollRestoration = 'manual';
addEventListener('hashchange', route);
route();
</script>
