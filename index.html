м добычи) и при гибели всех лодок игроков («Погиб», `Hud.Died`).\n  - `Dash`: приборы лодки внизу справа: деления корпуса вокруг большого циферблата, броня, нитро, топливо над красным запасом, его лампа мигает, когда оно на исходе, заряд дыма. `Roulette` лежит над циферблатом: колесо видов пусковых установок, которое поворачивается к выбранному.\n  - `HoldView` и `MapView` лежат поверх HUD, пока открыты ([Добыча](../gameplay/haul.md)). `DebugPanel` — окно ([Экраны и меню](screens.md)) с частотой кадров и клавишами.\n"}, {"id": "interface-language", "path": "interface/language.md", "title": "Язык", "section": "interface", "date": "2026-11-08", "md": "# Язык\n\nСлова игры переведены на язык игрока.\n\n## Решения владельца\n- Игра переведена: её слова на языке игрока.\n\n## Как устроено\nСлова игры пишутся по-английски и ищутся в каталогах gettext, `game/locale/<lang>.po`, через `TranslationServer` Godot: `Tr`, `Format` (формат из {0}), `Plural` (собственные формы множественного числа языка) и `Marked` (имя, оставленное по-английски и ищущееся там, где показывается). Почему gettext: Godot читает .po как есть, а недостающее слово остаётся английским. `tools/locale.py` собирает слова из кода, названий карт и реплик сюжета в каждый каталог, сохраняя переведённое; `--check` падает, пока слова не хватает или его {0} не совпадают с английскими. Английский и русский; игра стартует на языке системы, а «Язык» на странице настроек идёт по кругу между ними ([Q75](../questions/interface.md#q75)).\n"}, {"id": "interface-screens", "path": "interface/screens.md", "title": "Экраны и меню", "section": "interface", "date": "2026-11-11", "md": "# Экраны и меню\n\n![Меню базы](../img/menu.jpg)\n\nЭкраны вне моря: карта на базе, меню, квитки, настройки, судовой журнал и окна инструментов.\n\n## Решения владельца\n- Интерфейс сделан из вещей мира. База и верфь — ленты глянцевых плиток вдоль низа экрана, как в гараже NFS ([Пирс](../base/pier.md), [Верфь](../base/boatyard.md)).\n- Судовой журнал — настоящая записная книжка: каждый слот сохранения — запись, написанная от руки. Меню базы и паузы и страница настроек — глянцевые кнопки-пилюли из аквамаринового стекла.\n- Возвращаясь домой, привезённое перечислено на бумажном квитке, написанном от руки, с килограммами и монетами за каждую добычу, набегающими счётом, и общим итогом; на него опускается штамп: «Задание выполнено», когда победа, «Потоплен» или «Кончилось топливо», когда проигрыш, с потерянной добычей. Глянцевая пилюля «Продолжить» убирает его, как и Enter, Esc или клик.\n- Редактор карт, отладочная карточка, селектор демо и шторка загрузки — программные окна 2000-х: матовое аквамариновое стекло и глянцевые кнопки.\n- Меню паузы в бою. Между базой и им: «Продолжить», «Новая игра», «Сохранить», «Загрузить», «Выход». У сохранения и загрузки есть слоты.\n- Страница настроек в меню с тем, что игроку нужно задать. Апскейлер — одна из настроек; MetalFX Temporal пока остаётся по умолчанию. Общего выключателя звука нет: музыку и эффекты убавляют их шкалами. У шкал есть стрелки влево и вправо.\n- Игра сохраняется сама: см. [Прогресс и сохранения](../gameplay/progression.md).\n\n## Как устроено\n- **Меню** (`Menu`, `Pill`): глянцевые пилюли из аквамаринового стекла выезжают одна за другой, настолько широкие, насколько хотят слова самой длинной; курсор берёт фокус, так что подсвечена одна. `Pill` — одна пилюля; у верфи они несут колпачок клавиши и никогда не берут фокус. Меню базы лежит над базой, открывается Esc или плиткой «Меню», его заголовок стоит неподвижно; меню паузы ставят дерево на паузу. Стрелки или W A S D и Enter управляют ими. Выбор, теряющий прогресс, предупреждает выноской при первом нажатии и действует при втором: в море «На базу», «Выход» и «Загрузить» и «Новая игра» журнала предупреждают о добыче, иначе о несохранённом прогрессе ([Q62](../questions/interface.md#q62)).\n- **Квитки домой** (`Report`, `Ticket`): что принёс выход, на квитке, приклеенном над базой: каждая добыча с килограммами и монетами, итог внизу, подпись «Продано за монеты». Строки вписываются одна за другой, цифры набегают, затем штамп: «Задание выполнено», «Вышли», «Потоплен» или «Кончилось топливо» ([Q62](../questions/interface.md#q62)). Любая клавиша или клик убирает его.\n- **Настройки** (`Settings`): страница глянцевых переключателей, шкал и выборов (`Gloss.Switch`, `Gloss.Gauge`): язык ([Язык](language.md)), громкость музыки и эффектов, полный экран, VSync, разрешение, апскейлер и тряска экрана (`IsometricCamera.Jolted`); каждая устанавливается сразу, как задана, и хранится в `user://settings.cfg` отдельно от сохранений; никогда не заданная остаётся такой, как игра стартует ([Q74](../questions/interface.md#q74)). Шкала (`Menu.Gauge`) поднимается на нажатие, за полной идёт к нулю, а «Влево» и «Вправо» шагают по ней, как и стрелки по её бокам (`Gloss.Nudger`); щелчок по делениям ставит шкалу на них. Выбор (язык, апскейлер) — та же шкала с именами: стрелки и «Влево»/«Вправо» листают их по кругу. Страница, показанная заново, оставляет фокус на той же кнопке.\n- **Судовой журнал** (`Logbook`, `Entry`, `Snapshot`, `TapeButton`): тканевая записная книжка, выезжающая открытой. Каждый слот сохранения — запись от руки: когда, лодка, монеты (`Progress.InSlot`) и вклеенный снимок лодки. Снимок — маленький `SubViewport` с собственным миром, рисуется один раз на сборку. Почему рендер: это лодка как собрана, а не заменитель. Лента на записи сохраняет или загружает её; «Новая игра» — лента после последней записи, сначала предупреждает, когда заняты все записи. Запись в игре, в которую игра сохраняется сама, имеет номер, обведённый оранжевым маркером. Стол открывает его на базе, «Сохранить» и «Загрузить» меню паузы — в море.\n- **Окна инструментов** (`Window`, `Pane`, `Skin`, `Fader`, `Switch`, `frost.gdshader`): редактор карт, отладочная карточка, селектор демо и шторка загрузки — программные окна 2000-х ([Q58](../questions/interface.md#q58)): панель из аквамаринового стекла, матовящая то, что за ней, под глянцевой полосой заголовка. Её материал читает мипы, которые Godot размывает при копировании экрана, и матовит только то, что нарисовано с помеченными UV. Собственные поля, меню и полосы прокрутки Godot берут тему окон (`Window.Theme`), стилбоксы которой рисуют детали набора (`Skin`). Окно может сворачиваться к полосе заголовка (`Pane.Folded`). То, что прокручивается, гаснет у края, за которым есть ещё, под маской `ClipChildren` (`Scroll`), так что ни одна строка не обрезается посреди буквы. Всплывающие листы получают тень и матовость от слоя под ними (`Sheets`): Godot рисует всплывающее окно в собственном вьюпорте, который не может матовить за собой. У полей нет обычного контекстного меню по правой кнопке (`Window.Field`).\n"}, {"id": "known-issues", "path": "known-issues.md", "title": "Известные недочёты", "section": "", "date": "2026-11-10", "md": "# Известные недочёты\n\nЧто игрок может увидеть или почувствовать неправильным и что ещё не исправлено. У каждого сказано, что его исправит.\n\n- **В полноэкранном режиме верфь и море идут примерно по 16 мс на кадр, на грани 60 к/с**, и время от времени кадр выходит за 16,7 мс. Предел задаёт GPU, а масштабирование MetalFX Temporal забирает у него примерно на 4 мс больше, чем TAA под MetalFX Spatial, при более мягкой картинке. В Настройках «Масштабирование» выбирает Spatial; по умолчанию остаётся Temporal.\n- **Первое открытие верфи, карты и старт миссии подвисают на 70–110 мс**: движок строит списки верфи, карту или лодки миссии, плюс несколько мс обобщённого кода, скомпилированного при первом использовании, до которого не дотягивается компиляция при загрузке. Исправит построение их за несколько кадров.\n- **Редактор карт замирает на десятки секунд на форме рельефа почти предельного размера**, на верхе ползунка «Радиус» или на 1500 м у ручки края: сетка земли растёт вместе с площадью суши и поднимается в главном потоке. Исправит ограничение размера или подъём земли вне главного потока.\n- **Лодка, выставленная рядом с отвесным столбом или утёсом, может стартовать с камнем внутри корпуса**, и её несколько секунд выталкивает наружу: `World.Deep` читает глубину только посередине лодки. Исправит чтение глубины вокруг корпуса.\n- **Корпус, заехавший в щель между двумя морскими столбами уже его ширины, заклинивает там**, немного дребезжа, и охотник не умеет выбраться задним ходом. Исправит прокладывание охотниками маршрута вокруг башен.\n- **Язык, выбранный в Настройках, оставляет меню базы, паузу и хаб на старом до перезапуска**: их слова переводятся один раз, при создании. Исправят меню, которые хранят английские слова и переводят их при отрисовке.\n- **Гость видит причину вердикта хоста на языке хоста**: причина передаётся словами. Исправит передача её ключа.\n- **Гость с плотниками никогда не видит «+КОРПУС» на своём HUD**: заплата — у хоста и доходит до гостя только как корпус. Исправит сообщение о ремонте, как сообщают удары.\n- **Дрон иногда уходит за свой поводок, до 70–75 м от носителя вместо 60**, и порой не успевает ударить посланный на цель. Бортовик со знаком держится примерно в 70 м, на краю досягаемости дронов: дрон то берёт его, то бросает. Когда цель тонет или отходит, дрон разворачивается к кругу у носителя, теряет на развороте ход, а носитель уходит. Видно в демо Drones/Wing, его проверки падают примерно в одном прогоне из трёх. Исправит возвращение дрона, которое идёт с ходом носителя, а не на круг.\n- **На верфи доски пирса с некоторых сторон закрывают низ корпуса**: камера теперь низкая и её крутит игрок. Исправит причал верфи, у которого борт лодки открыт.\n- **Две лодки роя могут на мгновение коснуться бортами, когда трогаются с места**: медленные корпуса расходятся позже. Видно в демо Hunters/Swarm. Исправит расхождение, которое смотрит дальше вперёд на малом ходу.\n"}, {"id": "online", "path": "online.md", "title": "Онлайн-кооп", "section": "", "date": "2026-11-11", "md": "# Онлайн-кооп\n\n![Лодки товарищей у пирса](img/pier.jpg)\n\nКооператив по сети: до четырёх игроков, каждый в своей лодке. Хост ведёт бой, гости присоединяются к нему.\n\n## Решения владельца\n- Кооператив, онлайн: до четырёх игроков, каждый в своей лодке, встречаются в лобби Steam или локальной сети. Мир хоста хранит прогресс и добычу каждого игрока, у каждого свои. Игрок присоединяется к миссии, которая уже идёт, зрителем, а выбывший возвращается в неё. Игрока, чья лодка затонула, можно вернуть, пока идёт таймер; после него вернуть лодку могут припасы позже в миссии.\n- Инженерное правило «онлайн с самого начала» (каждая система написана для лодок нескольких игроков и хоста, который ведёт бой: ввод только как `Command` игрока, один игрок выделяется только для местного вида, мир поднимается из зёрен, общих для всех игроков, ничто не останавливает мир для всех) записано в `CLAUDE.md`, принцип 6: [CLAUDE.md](../CLAUDE.md).\n- Потопленную лодку, пока идёт её таймер, возвращает товарищ, который несколько секунд держится рядом с её обломками. Банда играет миссии и задания, открытые на карте хоста. Онлайн меню паузы открывается поверх боя, который идёт дальше: лодка игрока сбрасывает газ и дрейфует; в одиночной игре бой встаёт на паузу.\n\n## Как устроено\nКооператив онлайн, до четырёх игроков, каждый в своей лодке. Две или более игр соединяются из меню базы, «Кооператив»: один открывает игру для друзей в Steam или в своей сети, остальные находят её и присоединяются.\n\n- **Игроки** (`Player`): у каждого игрока в море есть своя лодка, трюм, топливо, захват цели и выбранное оружие, и он управляет лодкой по последней отправленной `Command`: газ, руль, нитро, отданные приказы (огонь бортом или по курсору, дым, следующее оружие), точка, куда он целит, открытый трюм и приказ трюму (переложить предмет или выбросить его). Команда местного игрока приходит от его клавиш и геймпада (`Controls`, `Pad`); гостя — по сети. Только местный вид (камера, вступительный пролёт, HUD, силуэты, ощущение выстрелов, музыка) выделяет одного игрока; всё остальное берёт лодки игроков как набор.\n- **Связь** (`Link`): пир Godot (`MultiplayerPeer`) в чистом виде, хост и до трёх гостей, сообщения (`Say`) как варианты Godot: надёжные по одному каналу, состояние каждого кадра ненадёжно по другому, чтобы никогда не ждать за ними. Каждая сторона сначала здоровается версией игры, и пир другой версии отвергается (гостю говорят); сообщение, в котором не хватает слов, нужных читателю, отбрасывается. Она стоит в корне дерева, поэтому переживает переход `Game` между мирами и хранит услышанное для того `Game`, что играет. Связь гостя закрывается, когда он открывает редакторы или демо.\n- **Сеть или Steam** (`Lan`, `Lobby`, `SteamPeer`, `Steam`): хост выбирает одно из двух (решение без владельца, [Q108](questions/online.md#q108)). В своей сети связь идёт по ENet, и гость находит хосты широковещательным UDP-окликом по сети и на этой машине (`Lan`). Порт ENet можно задать в командной строке игры (`--port`, оклик идёт на следующий), чтобы на одной машине хостили две игры: так рядом идут кейсы `Coop` в прогонах демо. Для друзей в Steam хост открывает лобби, видное только друзьям (`Lobby`), а связь идёт через сеть Steam, по ретрансляторам Valve, так что порты открывать не нужно (`SteamPeer`); номер гостя берётся из его Steam ID. Гость так же выбирает, где искать игру: «Присоединиться к другу в Steam» показывает друзей, у чьей игры есть лобби. Steam запускается, только когда игрок открывает игру для друзей или ищет их игры. Пока у игры нет своего App ID, в Steam она числится тестовым Spacewar (480). Steamworks.NET лежит локальным пакетом в `game/online/steamworks/`, его собирает `tools/steamworks.sh`: сборки самого проекта только x64 или x86 и на Apple silicon не грузятся.\n- **Модель** — как в кооперативных боевиках, сервер-слушатель. `Game` хоста ведёт бой (`Relay`): охотников, ракеты и попадания, корпуса, нитро, миссию и её исход, путь домой. Лодка каждого игрока движется на его машине по его клавишам, так что управление остаётся мгновенным, и шлёт свою команду и где лежит, с баком и оружием, как они там стоят; хост ведёт эту лодку по команде, подтягивая её к тому, где она лежит там, и шлёт часы своего боя вместе с лодками. Хост шлёт состояние каждой лодки (`Lie`: ход, корпус, нитро и залп, который охотник выдаёт свечением стоек) в каждом кадре и каждый выпущенный снаряд; `Mirror` гостя выводит каждую лодку в море, рисует её по ходу от руля и подтягивает к хосту, её корпус таким, каким он у хоста, и пускает снаряды других, а свои пускает локально, и там они безвредны (`Boat.Mirrored`).\n- **Один мир**: хост шлёт свою миссию (JSON карты, так что работают и карты самого игрока) и зерно своего мира; игра гостя плывёт в этот мир и просит лодку своего проекта, которую хост выводит в море рядом со своей. Игрок, присоединившийся на ходу, тоже выходит и слышит уже вынесенный исход.\n- **Зоны карты**: хост шлёт зерно раскладки, и каждая машина раскладывает по нему зоны миссии (`areas/Laying.cs`). Опасности хоста сообщают опасностям гостя, что делать (`Hazards`, `Showing`): мины и бочки пропали, пятно зажглось, бон развёрнут, импульс и просветы башни, залпы батареи, прицел и обломки, ход и захват луча, каждый взрыв; опасности гостя никому не вредят (`Shown`). Стены и течения всё равно действуют на лодку самого гостя там (`Boat.Eased`). Гость, присоединившийся посреди огня, пропускает заряд башни. См. [Зоны и опасности](world/areas.md).\n- **Удары между корпусами**: хост сообщает каждый (`Say.Blow`, из `Ramming.Rammed`), в том числе по лодке самого гостя, и гость показывает его один раз: искру, звук, метку попадания и сигнал музыки. Собственные касания гостя между его копиями лодок ударов не дают (`Ramming.Told`), так что медленный удар не теряется и ни один не показывается дважды; таран самого гостя показывается через мгновение после касания, когда до него доходит слово хоста.\n- **Пауза**: онлайн меню Esc ничего не останавливает (бой встаёт на паузу, только когда нет связи), а команда игрока, пока оно открыто, пустая: газ и руль по центру, приказов нет, так что лодка сбрасывает газ и дрейфует (Coop/Paused). «На базу» там уводит домой одного гостя, а хоста — домой со всеми.\n- **Подъём затонувшей лодки** (`Revive`): пока идёт окно затонувшей лодки, товарищ в море, который медленно держится рядом с её обломками, поднимает её (`Boat.Raise`: целая, на месте, трюм пуст). Хост решает и считает; `Lie` уже несёт корпус, и `Boat.Match` поднимает лодку у гостя. Гость считает то же только для показа: кольцо на воде вокруг обломков с золотой дугой удержания и секундами окна (`Markers`), стрелка к чужим обломкам за экраном; свою лодку игрок видит в кольце с подписью. Затонувшая лодка (`Gone`) остаётся в мире и у гостя, пока она нужна (`Mirror.Crews`). Окно, расстояние, скорость и время удержания — решение без владельца, [Q124](questions/online.md#q124), [Q125](questions/online.md#q125). Coop/Revive.\n- **Сухая лодка**: с пустым баком лодка ползёт малым ходом ([Лодка](gameplay/boat.md)); гость ведёт её сам, как с топливом.\n- **Припасы**: описаны в [Припасах](gameplay/pickups.md) (`Say.Supplied`, `Say.Took`).\n- **Заход онлайн**: хост раз в секунду сообщает гостям цели захода, метки заданий, открытый выход и каждое объявление, когда оно прозвучало (`Say.Run`, `Say.Told`, `Relay.Run`, `Mirror.Ran`, `Mirror.Called`). Гость показывает их на своём HUD ([Q133](questions/online.md#q133)). Хост решает и платит за задания.\n- **Пока не онлайн**: припасы, добыча, дым на других машинах, места промысла и обломки затонувших охотников (онлайн их не разбрасывают и не создают), тайники и точки припасов, возвращение затонувшего игрока припасами после окна (товарищ поднимает его и так; на полигоне лодка гостя поднимается там, где затонула), прогресс и сохранения (у каждого игрока свои).\n"}, {"id": "questions-README", "path": "questions/README.md", "title": "Открытые вопросы", "section": "questions", "date": "2026-11-10", "md": "# Открытые вопросы\n\nВсё, что ждёт ответа владельца. Вопрос живёт под заголовком своего номера (`### Q17`), так что ссылка `missions.md#q17` ведёт прямо к нему; номера не переиспользуются. Под каждым вопросом — ссылка на страницу его темы.\n\nКогда владелец отвечает: решение пишется в «Решения владельца» на странице темы, вопрос удаляется, а крупное решение получает строку в [Журнале решений](../decisions.md). Новый вопрос получает следующий свободный номер и встаёт на страницу своей области.\n\n## По областям\n- [Миссии](missions.md): миссии, прогресс, директор, зоны, полигон.\n- [Лодка](boat.md): управление, вес, топливо, броня, припасы.\n- [Бой](combat.md): оружие, охотники, сборки.\n- [Добыча](haul.md): места промысла, добыча.\n- [Мир и облик](world.md): облик, люди, рельеф, свет и выбор облика со стендов.\n- [Интерфейс](interface.md): HUD, экраны, верфь, управление, язык.\n- [Сюжет](story.md): сеттинг, сцены.\n- [Звук](audio.md): звук и музыка.\n- [Онлайн](online.md): кооператив.\n- [Инструменты](tools.md): редактор карт и демо.\n- [Чего нам не хватает](gaps.md): то, что выпущенные игры обычно решают, а у нас пока не решено.\n"}, {"id": "questions-audio", "path": "questions/audio.md", "title": "Вопросы: звук", "section": "questions", "date": "2026-11-09", "md": "# Вопросы: звук\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q23\nЗвуки, выбранные для взятия припаса, постановки дыма, добычи, пойманной рыбы и лебёдки захвата: верно? Охотнику перед выстрелом тоже нужен звук, который выдаёт выстрел: пока это щелчок храповика из записи подбора ремонта (`pickup/repair_`, `Cue.Tell`), временная замена.\n\nТема: [Звук](../audio/sound.md)\n"}, {"id": "questions-boat", "path": "questions/boat.md", "title": "Вопросы: лодка", "section": "questions", "date": "2026-11-10", "md": "# Вопросы: лодка\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q8\nКакие корпуса, моторы и палубные детали нужны и чем должна отличаться каждая? Сколько мест снаряжения у каждого корпуса, как далеко ведёт его бак, и как быстро жжёт каждый мотор?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q9\nВид нитро сейчас: во время рывка из-под транца бьёт петух из брызг от любого мотора, у воздушного винта тоже: оставить? Охотники дают рывок нитро, чтобы идти в таран, сближаться и подходить издали: этого достаточно?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q20\nСкорость сверху не ограничена: голый катерок на водомёте идёт 53 м/с (около 50 м/с со стойкой), а рывок нитро прибавляет 14 м/с и полсекунды даёт 2,5× мощности. Достаточно быстро, или самые дорогие моторы должны идти ещё быстрее?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q30\nБроневой пояс: лёгкий пояс добавляет треть попаданий корпуса, тяжёлый две трети, каждая плита получает равную долю; удар берёт ближайшую плиту своего борта, а упавшая плита облегчает лодку равномерно, а не на своём борту. Верно?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q112\nПрипас топлива доливает половину бака, выпадает с теми же шансами, что нитро, ремонт и броня, а берётся с звуком нитро: этого достаточно, или он должен давать больше или меньше, выпадать реже и звучать по-своему? Цвет у него фиолетовый.\n\nТема: [Припасы](../gameplay/pickups.md)\n\n### Q137\nС пустым баком лодка игрока идёт на четверти газа, и нитро закрыто; топлива это не просит, сколько бы ни пришлось идти. Верна ли доля, и должен ли малый ход чего-то стоить (времени, добычи)?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q144\nПрипасы падают с неба на парашютах: раз в 20–25 секунд один, в 40–80 м от лодки игрока, и ещё один с каждым привалом директора. Это не слишком часто или редко? Ремонт выпадает, если корпус меньше двух третей, иначе топливо, нитро или броня, тем вероятнее, чем меньше их у лодки: так ли нужно подбирать, или пусть падает что придётся? Падение занимает пять секунд, припас нельзя взять, пока он в воздухе.\n\nТема: [Припасы](../gameplay/pickups.md)\n\n### Q146\nНитро стало рывком: нажатие тратит половину шкалы, толкает лодку вперёд на 14 м/с и полсекунды тянет в 2,5 раза сильнее; в эти полсекунды ракеты и снаряды проходят сквозь лодку. Полная шкала — два рывка, она наполняется за 6 секунд. Рывок — одно нажатие: удержанная клавиша второй раз не рвёт. Охотники рвут так же и так же неуязвимы для ракет. Верны ли сила, цена и время неуязвимости, и нужна ли неуязвимость охотникам?\n\nТема: [Лодка](../gameplay/boat.md)\n"}, {"id": "questions-combat", "path": "questions/combat.md", "title": "Вопросы: бой", "section": "questions", "date": "2026-11-10", "md": "# Вопросы: бой\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q22\nДым скрывает лодки чужой стороны без тепловизора, а своих охотники видят сквозь дым, когда расходятся бортами и придерживают огонь ([Q139](#q139)). Должен ли дым слепить охотников и для своих лодок?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q29\nЭкипажи: на Арене директор поднимает выучку налётов по росту угрозы (зелёные ниже 60, бывалые до 100, ветераны до 160, асы от 160), а охране постов и заданий выучка задана на карте (вплоть до аса на канонерке и броненосце). Насколько силён должен быть ас и где какой экипаж уместен?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q38\nРой дыма гонит ялики с воздушным винтом, ракетами, тепловизором и дымогенератором, ставящие дым на рывке вперёд: верно, или он должен гнать катерки, как обычный рой?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q82\nПреследователь: носовые стойки стоят у форштевня на носовой и передних станциях и бьют вперёд со схождением в 40 м; таранщики заходят преследователю на траверз или раковину, где носовые стойки не достают. С третьей минуты Арены директор присылает охотников-преследователей с носовыми стойками. Верно ли это и нужна ли ещё носовая торпедная труба?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q84\nДроны: морские дроны (70 м/с) быстрее любой лодки с верфи на обычном ходу, вблизи охраняют свой носитель, а посланные по цели ходят дугой по дальнюю от носителя сторону в пределах поводка в 60 м, стреляют бортом и возвращаются на борт. Охотники и батареи бьют ближайшего врага, часто дрона; в шесть лодок директора дроны не входят и тонут вместе со своим носителем; у всех дронов игрока одна ливрея. Верно?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q85\nТурель: спаренная турель на вертлюге сама бьёт по ближайшему видимому врагу в радиусе 80 м, а не по захваченной цели, и продолжает стрелять при открытом трюме. С пятой минуты Арены приходят бегуны с турелью, а охотники на катерах с турелью держат дистанцию. Должна ли турель игрока бить по захваченной цели вместо ближайшей, и верно ли ведут себя бегуны с турелью?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q86\nЛюлька: два дрона, по одному на борт; клавиша борта запускает его дрон или зовёт домой, потерянный восстанавливается бесплатно через какое-то время. Ей нужно место для обоих, так что её несут только патрульный катер и канонерка. Верно? Должна ли люлька на один дрон позволить нести дронов и меньшим корпусам?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q88\nМинный жёлоб: жёлоб на каждой кормовой четверти сбрасывает мину за корму (Q — левый, E — правый, до шести мин на воде от установки); она взводится через 0,8 с и взрывается от чужого корпуса, снаряда или соседнего взрыва, не трогая свою сторону и союзников в кооперативе. С седьмой минуты Арены мины ставит и охотник-минёр. Верны ли устройство и числа (задержка, радиус, урон)?\n\nТема: [Бой](../gameplay/combat.md), [Сборки и стили игры](../gameplay/builds.md)\n\n### Q109\nУдар тарана: ни один удар не топит целую лодку разом. Построено так: целая лодка, ни разу не побитая, теряет от одного удара не больше, чем всё, кроме последнего попадания, а броня из припасов считается сверх этого. Лодка, уже побитая, тонет от удара как раньше. Верно ли это правило и не должен ли такой удар оставлять не одно попадание, а долю корпуса?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q110\nЗнак охотника: за 0,35 с до залпа стойки охотника на этом борту светятся красным и щёлкают, и он стреляет, если выстрел всё ещё попал бы. Эти числа — заглушка. Верно ли, что хватает времени заметить знак с высоты боя и увернуться, а красный шар у стойки читается? Должны ли зелёные команды выдавать залп дольше асов? Знак дают только по лодке игроков, а в бою ИИ с ИИ стреляют сразу. Так ли?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q130\nДиректор открывает новые виды налётов по минутам боя: преследователь с третьей, патрульный с четвёртой, бегуны с турелью с пятой, канонерка с шестой, минёр с седьмой; а число лодок считает только вблизи игроков. Верна ли лестница, и не слишком ли рано налёты становятся тяжёлыми?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q134\nВеера и захват цели: мышь не целится — захват сам берёт ближайшего видимого врага в радиусе 95 м, а внутри веера шириной ±34° ракеты и торпеды берут упреждение по захваченной цели. Щелчок по воде стреляет теми установками, в чей веер попадает цель, а вне вееров — бортом со стороны цели; Q и E бьют левым и правым бортом. На геймпаде правый стик двигает прицел по воде для выбора цели и наводки внутри веера, а стреляют бамперы. Веера видны у любой лодки игрока, а управление огнём добавляет точные линии хода снарядов. Верно ли это, и не слишком ли широк или узок веер?\n\nТема: [Бой](../gameplay/combat.md), [Управление](../interface/controls.md)\n\n### Q135\nРакеты всех сторон, кроме игроков, летят 20 м/с при пуске и 40 м/с на ходу против 25 и 100 у игрока: 80 м за две с лишним секунды. Так же медленны снаряды вражеских турелей и батарей. Достаточно ли медленно, чтобы уворачиваться, и не слишком ли? Чтобы такие ракеты попадали, охотники берут упреждение в веере, как игрок, а стая проходит в 30 м от добычи вместо 14: не слишком ли метко по лодке, которая держит курс?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q136\nУдар носом в рывке нитро: лодка, бьющая носовой четвертью во время рывка нитро, получает половину урона от столкновения, а чужая — полтора. С носовым тараном её нос не страдает вовсе, как и без нитро. Верны ли числа, и должен ли таран добавлять ещё и к удару по чужой лодке?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q138\nПосланный дрон кружит по дальнюю от носителя сторону цели, качаясь по этой половине, так что носитель не стоит на линии его огня, и цель оказывается в клещах. Так ли, или дрону лучше кружить по всему кругу и просто ждать чистой линии?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q139\nВладелец решил, что дрон не стреляет через свой носитель. Так же держат огонь все капитаны ИИ: охотники и дроны не стреляют, пока лодка их стороны лежит на линии ближе добычи. Снаряды и так проходят сквозь свои лодки. Так ли, или стая должна стрелять сквозь своих?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q141\nВладелец увидел Арену без врагов в начале. Сейчас первый набег идёт через две секунды после старта, а любой набег появляется со стороны своего логова на удалении 240 м от цели, а не в самом логове за километр. Так ли, или набег должен честно идти от логова, а логова надо поставить ближе?\n\nТема: [Директор](../gameplay/director.md)\n\n### Q142\nВладелец сказал, что быстрые враги слишком быстры. Сейчас катерок роя идёт 18 м/с (было 52), дымовой катер 21 (было 41); гонщик, преследователь и таранщик остались на 22–23 при 13 у стартовой лодки игрока. Замедлить ли и их?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q145\nРакеты двух сторон взрывают друг друга, сойдясь ближе 3 м. Снаряд турели считается наравне с ракетой, так что турель сама сбивает часть вражеских ракет, а вражеская турель — ракеты игрока. Оставить так, или парировать должны только ракеты? Достаточно ли 3 м, чтобы парировать получалось нарочно?\n\nТема: [Бой](../gameplay/combat.md)\n"}, {"id": "questions-gaps", "path": "questions/gaps.md", "title": "Чего нам не хватает", "section": "questions", "date": "2026-11-10", "md": "# Чего нам не хватает\n\nЧего пока нет ни в решениях, ни в вики, хотя у выпущенных игр это обычно решено. Каждый пункт — вопрос владельцу; здесь ничего не решено. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n## Видение\n\n### Q92\nОпоры игры: какие три-четыре вещи делают эту игру ею, чтобы по ним судить каждую новую функцию? Сейчас записаны «веселье важнее реализма» и ощущение моторной лодки; «прыгание по волнам» вычеркнуто как опора.\n\nТема: [Об игре](../vision.md)\n\n### Q93\nДля кого игра: какой игрок, какие жанры он любит, сколько длится одна сессия и один заход на Арену?\n\nТема: [Об игре](../vision.md), [Миссии](../gameplay/missions.md)\n\n### Q94\nЦель и конец: к чему игрок идёт за много заходов на Арену, и есть ли у игры конец? Отдельных миссий больше нет — вся игра идёт на Арене, а квесты и прогресс ещё предстоит определить.\n\nТема: [Прогресс и сохранения](../gameplay/progression.md)\n\n## План\n\n### Q95\nДорожная карта: что должно войти в 0.1, что — в первый публичный релиз, и примерно когда? Сейчас версии 0.0.N выходят с постами.\n\nТема: [Сборки и посты](../tools/release.md)\n\n### Q96\nГде выходит игра: Steam (страница, цена, ранний доступ) или ещё где-то? Решено только «PC» и лобби Steam или локальной сети; построены оба, Steam на тестовом App ID ([Q108](online.md#q108)). Когда делать остальное в Steam: облачные сохранения, достижения?\n\nТема: [Об игре](../vision.md), [Онлайн-кооп](../online.md)\n\n### Q97\nЖелезо: на каком самом слабом компьютере должна идти игра? Сборку для Windows ещё ни разу не запускали; кто проверит её на машине с Windows?\n\nТема: [Сборки и посты](../tools/release.md)\n\n## Игроку\n\n### Q98\nОбучение: как новый игрок узнаёт управление и цикл «база → Арена → домой»? Сейчас обучения нет, есть только подсказки клавиш.\n\nТема: [Экраны и меню](../interface/screens.md), [Управление](../interface/controls.md)\n\n### Q99\nСложность: одна для всех или выбор сложности? Честность настраивается ближе к релизу, но выбор сложности меняет директор и охотников, и его лучше знать раньше.\n\nТема: [Директор](../gameplay/director.md), [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q100\nДоступность: нужен ли режим для дальтоников (свои и чужие ракеты различаются оранжевым и красным), крупный текст, подписи к звукам боя? Переназначение клавиш уже спрошено в [Q74](interface.md#q74).\n\nТема: [Экраны и меню](../interface/screens.md), [Бой](../gameplay/combat.md)\n\n### Q101\nЭкономика целиком: сколько заходов на Арену должна стоить деталь, на что ещё тратятся монеты, куда уходят лишние? Цены сейчас стартовые ([Q56](missions.md#q56)).\n\nТема: [Прогресс и сохранения](../gameplay/progression.md)\n\n## Облик и сюжет\n\n### Q102\nЛоготип, ключевой арт, титульный экран и обложка магазина: кто их сделает, раз картинки от ИИ запрещены? Сейчас у игры их нет.\n\nТема: [Арт-дирекшн](../art/README.md)\n\n### Q103\nПортреты к релизу: кто нарисует портреты говорящих и врагов — художник со стороны? До тех пор остаются нынешние процедурные заглушки.\n\nТема: [Люди: флоппы](../art/people.md)\n\n### Q104\nСюжет: есть ли у игры сквозная история, кто капитан игрока и зачем он выходит в море? Сейчас есть сеттинг, роли без имён и система сцен с репликами-заглушками ([Q48](story.md#q48)).\n\nТема: [Сеттинг и лор](../story/setting.md), [Сцены сюжета](../story/scenes.md)\n\n## Работа\n\n### Q105\nИгроки со стороны: когда показывать игру людям кроме владельца, и как собирать их впечатления?\n\nТема: [Об игре](../vision.md)\n\n### Q106\nНазвание в коде: оставить Pirates в коде и репозитории или переименовать под Floppa Tropical Adventures?\n\nТема: [Код](../tools/code.md)\n"}, {"id": "questions-haul", "path": "questions/haul.md", "title": "Вопросы: добыча", "section": "questions", "date": "2026-11-10", "md": "# Вопросы: добыча\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q31\nМеста промысла: косяки рыбы и обломки раскидываются случайно в каждом заходе на глубине от 4,5 до 12 м (если не закреплены на карте в редакторе), отмечены на HUD и стрелкой у края экрана; вид сбоку не открывается, пока охотник ближе 160 м. Верно?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q32\nРыбалка: четыре вида (скумбрия, люциан, барракуда, групер) на своих глубинах, по восемь на косяк; рыба борется рывками, и подматывание во время рывка напрягает леску, пока она не порвётся. Оставить и должны ли удилище или наживка быть деталью с верфи?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q33\nДобыча с обломков: четыре сброса захвата на обломки, шесть предметов на их дне, и предмет, схваченный не за середину захвата, может соскользнуть обратно. Оставить?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q34\nВид мест промысла в море: чайки, кружащие над бурлением, нарисованы крупнее настоящих, чтобы читались с высоты боя; сине-жёлтый буй обломков над корпусом, лежащим на дне. Оставить?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q42\nПредметы это заглушки, придуманные, чтобы пробовать добычу: какие должны быть?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q43\nВес добычи замедляет только разгон: полный трюм не отнимает полного хода (решение без владельца). Так, или вес должен отнимать и немного хода? Нужен ли трюму, кроме клеток, ещё и предел веса?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q51\nВид сбоку: как он стоит на приклеенной записке, леска, отсчитываемая по циферблату удилища, у каждой рыбы своя длина в диапазоне её вида, а у поднятых вещей свой вес. Верно, и должна ли более крупная добыча давать больше добычи?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q107\nТрюм: клетки каждого предмета и трюм каждого корпуса придуманы; предмет ложится в первое свободное место ряд за рядом, сперва как лежит, потом повёрнутым; перекладывают мышью, R или правая кнопка поворачивают, отпущенный за экраном прибора падает за корму; HUD один раз говорит «Трюм полон», когда рядом плавает предмет, которому нет места; геймпадом трюм только открывается. Верно? Показывать ли трюм корпуса на верфи?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q115\nВид сбоку не мешает бою: охотник, подошедший ближе 160 м, закрывает его с предупреждением «Охотники близко», а пойманное уже лежит в трюме. Оставить, или дать время поднять снасть?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q116\nРыба и вещи с обломков в трюме: у вида два размера (обычный и «большой»), потому что прогресс хранит предметы по названию, а настоящие длина и вес видны лишь на карточке. Оставить, или хранить настоящий размер каждого предмета?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q117\nОхотник, затонувший там, где дно в досягаемости захвата, становится обломком на месте со своими предметами; онлайн таких обломков нет, как и мест промысла. Оставить, и когда делать места промысла общими для всех игроков?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n"}, {"id": "questions-interface", "path": "questions/interface.md", "title": "Вопросы: интерфейс", "section": "questions", "date": "2026-11-10", "md": "# Вопросы: интерфейс\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q25\nГлавный экран базы — лента плиток вдоль низа: «Верфь», «Кооператив», «Журнал», «Меню» и большая оранжевая «На арену» справа (вы просили выбрать лучший интерфейс без списка). Верно? Что ещё должно быть на ленте? Редактор карт, настройки и демо остались в «Меню».\n\nТема: [База: пирс](../base/pier.md)\n\n### Q50\nСудовой журнал: открывается плиткой «Журнал» на базе и пунктами Save / Load / New game в меню паузы в море; лента на каждой записи сохраняет или загружает её, а New game лежит лентой на последней странице. Игра сама сохраняется в текущую запись (новая игра — в первую пустую, а когда все пять записей заняты — только вручную). Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q52\nВерфь: вдоль низа идёт лента мест лодки (корпус, мотор, станции палубы, снаряжение, броня), над ней — ряд карточек деталей для выбранного места с ценой или плашкой «Стоит», а справа на аква-экране показаны характеристики лодки и сравнение с деталью под курсором. По самой лодке места больше не кликаются. Верно?\n\nТема: [Верфь](../base/boatyard.md)\n\n### Q55\nОтделка интерфейса: меню озаглавлены шрифтом EB Garamond, на верфи заголовок наклеен лентой вверху слева, пилюли и плитки отзываются при наведении и нажатии, цвета мест на верфи отделены от враждебного красного и оранжевого игрока (мотор бирюзовый, оружие розовое), а лента базы, верфь и меню управляются стрелками и Enter так же, как мышью. Верно?\n\nТема: [Стиль интерфейса](../art/interface.md)\n\n### Q58\nОкна инструментов: стекло, матирующее то, что за ним, под глянцевой аква-строкой заголовка; всплывающие кнопки, ползунки и переключатели в том же глянцевом аква; команды редактора в окне вверху, а его клавиши на колпачках в строке состояния; кейсы селектора списком, показанный глянцевым аква; шторка это окно с названием игры, Loading над занятым индикатором, на глубоком море, пузыри поднимаются за ним. Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q59\nЭкраны в море: бумажная карта по M рисует землю текущего уровня и точки выхода — зелёные, пока открыты, и блёклые, когда закрыты, со значком своего условия; над прибором корпуса крутится колесо рулетки оружия на хромированной дуге под оранжевым указателем; в зоне выхода плашка вверху экрана наливается золотом по мере стоянки. Верно?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q62\nУход и возвращение домой: Esc закрывает открытый экран по шагам (в море — карту, затем трюм, затем открывает паузу); выход на базу из меню паузы сперва предупреждает, что добыча в трюме пропадёт; в отчёте после возвращения перечислены предметы из трюма. На Арене выход через точку выхода засчитывает победу (штамп Mission complete), а на своих картах из редактора уход через точку выхода до выполнения цели ставит штамп Extracted. Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q63\nПодсказки HUD в море: когда в баке остаётся меньше пятой части топлива (или выполнена цель карты), HUD обводит золотом открытые точки выхода и ведёт к ним стрелкой, а лампа топлива мигает; кольцо вокруг лодки поделено на дуги по числу попаданий (до восьми); нажатие Q или E при открытом трюме напоминает, что с открытым трюмом стрельба закрыта. Верно?\n\nТема: [HUD](../interface/hud.md)\n\n### Q64\nЭкраны базы: вверху справа висит кошелёк с монетами, а «Меню» стоит плиткой на нижней ленте (и открывается по Esc); возвращение с моря проявляется из темноты; вступительный пролёт камеры на базе показывает подсказку пропуска; судовой журнал выделяет активную запись и предупреждает при старте новой игры, если все записи заняты. Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q65\nПочинка HUD: метки охотника тают в дыму; потопленный охотник объявляется на оранжевом значке, красный оставлен для предупреждений; условия записки (держать на плаву) без рамки; записка рыбалки говорит, бежит ли рыба или отдыхает, циферблат лески мигает лампой на протяжении рывка; захват, закрывшийся на пустоте, сообщает Nothing caught. Верно?\n\nТема: [HUD](../interface/hud.md)\n\n### Q66\nКамера и примерка на верфи: при входе с пирса лодка сама заходит в причал, а камера переходит от вида базы к низкому обзору в три четверти, сдвигая линзу так, чтобы лодка стояла в просвете над карточками деталей и левее экрана характеристик; перетаскивание мышью, правый стик и Q / E вращают камеру вокруг лодки, а колесо мыши и R / F приближают и отдаляют её (выбор места камеру не дёргает); если примерить другой корпус и вернуть прежний за тот же визит, детали его станций возвращаются на место; полоса нагрузки показывает четыре деления сверх водоизмещения корпуса; окно характеристик помечено бортовым номером корпуса. Верно?\n\nТема: [Верфь](../base/boatyard.md)\n\n### Q67\nКнопки геймпада: в море левый стик рулит, триггеры дают передний и задний ход, нажатие A делает рывок нитро, бамперы стреляют левым и правым бортом, B пускает дым, Y открывает трюм, правый стик водит прицел по воде для выбора цели и наводки в веере, D-pad вверх переключает оружие, а вниз открывает промысел, Start ставит на паузу, Back открывает карту; в меню и на верфи D-pad и левый стик переводят выбор, A подтверждает, B или Start возвращает назад, Back работает как Tab, а правый стик вращает камеру вокруг лодки на верфи. Верно?\n\nТема: [Управление](../interface/controls.md)\n\n### Q74\nНастройки: общая громкость, музыка и эффекты, полный экран, VSync, масштаб разрешения (до половины точек экрана), масштабирование (MetalFX Temporal / Spatial на Mac, FSR 2 / FSR 1), тряска камеры и язык. Верно? Нужны ли ещё переназначение клавиш и геймпада, предел частоты кадров, масштаб HUD?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q75\nЯзыки: английский и русский, старт на языке системы, выбор на странице Settings. Верно? Какие ещё? Русский мой: верны ли его термины (детали лодки, охотники, добыча)?\n\nТема: [Язык](../interface/language.md)\n\n### Q118\nВставка запускается ареной: первый вход лодки игрока в круг, названный в `Arena.Scene`, играет её один раз за миссию. Кнопки, миссионный триггер (цель выполнена, волна пришла) и повтор не сделаны. Верно? Что ещё должно запускать вставку?\n\nТема: [Камера и картинка](../gameplay/camera.md)\n\n### Q119\nПока играет вставка, руль держит последнюю команду игрока (ход, поворот, нитро), огонь и трюм сброшены, а бой, охотники и сеть идут как шли: лодку могут топить. Верно? Нужны ли остановка боя в одиночной игре, защита лодки на время вставки или своя вставка у каждого игрока в сети?\n\nТема: [Камера и картинка](../gameplay/camera.md)\n\n### Q147\nВладелец решил, что у врагов случайные лица. Лицо показано только у захваченной цели, слева от её таблички, 40 пикселей; оно одно из восьми и держится за лодкой весь бой; после попадания оно сердится, на последнем ударе удивлено. Там ли ему место, и нужно ли лицо каждому врагу на экране или на рации?\n\nТема: [HUD](../interface/hud.md)\n"}, {"id": "questions-missions", "path": "questions/missions.md", "title": "Вопросы: миссии", "section": "questions", "date": "2026-11-10", "md": "# Вопросы: миссии\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q1\nЗадания и боссы Арены: сейчас в бесконечном заходе по счётчику выходят четыре задания (конвой, курьер, маяки, груз), а на десятой минуте в бухте появляется броненосец ([Q129](#q129), [Q131](#q131)). Какими должны быть настоящие задания и боссы вместо заглушек? Насколько далеко должен заходить стартовый ялик с турелью, и должен ли заход давать что-то сверх монет и трофеев — например, звание или лучшее время?\n\nТема: [Миссии](../gameplay/missions.md)\n\n### Q17\nСоставы охотников: сейчас на Арене стоят посты охраны у проливов, рифов и бухты, а директор присылает налёты одного вида из колоды (включая рой дыма с четвёртой минуты), держа вблизи игроков не больше шести лодок. Какие виды охотников должны приходить вместе в одном налёте или стоять вместе на постах?\n\nТема: [Миссии](../gameplay/missions.md)\n\n### Q56\nЦены и открытие деталей: сейчас все детали продаются на верфи сразу за монеты (цены стоят по три монеты за прежний порог очков добычи, см. [Q128](#q128)). Должна ли часть деталей открываться квестами или прогрессом, а не просто лежать в продаже со старта, и сколько должна стоить каждая деталь?\n\nТема: [Прогресс и сохранения](../gameplay/progression.md)\n\n### Q70\nДиректор: налёты приходят в затишьях по одному виду охотников из колоды, их угроза растёт со временем захода, очками добычи и числом игроков ([Q130](combat.md#q130)), а после пика боя наступает передышка со сбросом припаса. На Арене заход бесконечный и идёт до выхода или потопления (на своих картах из редактора директор шлёт налёты и на пути к выходу после выполнения цели). Верно ли устроен цикл директора, какие ещё налёты нужны и должен ли игрок выбирать сложность?\n\nТема: [Директор](../gameplay/director.md)\n\n### Q72\nЗоны и опасности: размечаются кругами или коридорами в редакторе карт; охотники огибают минные поля, бочки, горящую нефть, боны и опоры моста, но не заградительный огонь и не круги импульсных башен, которые бьют любую сторону; гость в кооперативе видит зоны хоста; береговая батарея обведена на HUD как враг, а горящая нефть подрывает бочки. На Арене стоят течения, ветровые коридоры, водовороты, минные поля, бочки, боны, опоры, заградительный огонь и береговые батареи (башни и прожекторы с Арены убраны, см. [Q143](world.md#q143)). Верно ли это и какие зоны должны стоять на Арене?\n\nТема: [Зоны и опасности](../world/areas.md)\n\n### Q76\nПолигон: шесть мишеней-макетов, четыре пришвартованы бортом к старту и две кружат по кольцам, каждая выдерживает четыре попадания и поднимается на своём посту через шесть секунд после погружения; потопленная лодка поднимается на старте; выходов нет, «На базу» возвращает на пирс; лодка гостя, потопленная там, поднимается там, где затонула. Верно? Должен ли он засекать круги или считать попадания?\n\nТема: [Полигон](../base/testing-ground.md)\n\n### Q81\nСвоя карта в редакторе с режимом «банда» без охотников: банда из нуля лодок никогда не считается побеждённой (решение без владельца), поэтому такой заход кончается только на точке выхода или потоплением. Должна ли у такой карты быть своя цель (дойти до метки, продержаться время) или редактор не должен позволять пустую банду?\n\nТема: [Миссии](../gameplay/missions.md)\n\n### Q127\nСлово «арена» занято дважды: Арена — уровень игры, а «круги арены» (`areas/Arenas.cs`) — зона, над которой вид игрока встаёт повыше. Переименовать зону, например в «площадку», или оставить как есть?\n\nТема: [Арена](../gameplay/missions.md)\n\n### Q128\nДобыча идёт по три монеты за очко (`Progress.Rate`): бесконечный заход приносит больше добычи, чем короткая миссия, а монеты по-прежнему только покупают детали. Верна ли ставка и не слишком ли быстро хватает на верфь?\n\nТема: [Арена](../gameplay/missions.md)\n\n### Q129\nЗадания приходят по счётчику: первое через 90 секунд, дальше раз в 100 с, по одному виду разом, не ближе 250 м к игроку, награда с задания: конвой 30, курьер 40, маяки 50 очков на игрока плюс припасы. Верны ли такт и награды, и должно ли задание, не взятое долго, уходить само?\n\nТема: [Арена](../gameplay/missions.md)\n\n### Q131\nБроненосец выходит на десятой минуте и стоит в бухте, пока его не потопят; потопленный, он открывает выход у бухты один раз и больше не приходит. Должен ли он приходить снова (раз в какое-то время, после потопления) или уходить, если его не тронули?\n\nТема: [Арена](../gameplay/missions.md)\n"}, {"id": "questions-online", "path": "questions/online.md", "title": "Вопросы: онлайн", "section": "questions", "date": "2026-11-10", "md": "# Вопросы: онлайн\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q108\nКооп через Steam: хост выбирает, открыть игру друзьям в Steam или своей сети, а гость — где её искать (по две кнопки), — или открывать и искать сразу и там и там? Лобби видно только друзьям: нужен ли публичный список игр? Пока игра в Steam — тестовый Spacewar (480), и приглашения и «Присоединиться» из списка друзей Steam не работают: они ждут страницы игры в Steamworks и своего App ID. Когда её заводить?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q124\nСколько длится окно, пока затонувшую лодку игрока может поднять товарищ? Пока взято 60 секунд с момента, когда лодка пошла ко дну (`Revive.Window`), дольше, чем лодка тонет (9 секунд). Окно общее для всех лодок, а его остаток виден только в подписи у кольца. Лучше короче, или считать его от чего-то другого, например от миссии?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q125\nКак товарищу держаться у обломков, чтобы поднять лодку? Пока он должен быть в море, ближе 25 м к обломкам и идти медленнее 4 м/с, 5 секунд (`Revive`); кольцо заполняется золотом, а если он отошёл, заполненное тает с той же скоростью. Подойдёт любой товарищ с целой лодкой, даже с пустым баком. Поднятая лодка целая, на месте, с пустым трюмом (добыча при затоплении высыпалась) и с тем топливом, что было. Так ли, или поднятая должна платить (часть корпуса, монеты), а товарищем считаться только тот, у кого есть топливо?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q133\nХост сообщает гостям цели захода, метки заданий и открытый выход раз в секунду, а объявления сразу, как прозвучали. Достаточно ли такта для меток, и не нужно ли гостю видеть задания, которые взял товарищ, отдельно от общих?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q140\nЛодка товарища у пирса обновляется, когда он выходит из верфи, а не по каждой детали. Имя над ней — из Steam, в локальной сети имя пользователя компьютера. Товарищей видно только на базе, в верфи их лодок нет. Верно? Нужны ли своё имя игрока в настройках и обновление по детали?\n\nТема: [База: пирс](../base/pier.md)\n"}, {"id": "questions-story", "path": "questions/story.md", "title": "Вопросы: сюжет", "section": "questions", "date": "2026-11-10", "md": "# Вопросы: сюжет\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q5\nПодробности сеттинга: его люди, названия мест и что осталось от старого мира? Прежние предложения лежат в [lore-proposals.html](../story/lore-proposals.html).\n\nТема: [Сеттинг и лор](../story/setting.md)\n\n### Q48\nС кем говорит игрок и о чём? Портреты говорящих сделаны для капитана, корабела и мытаря у платного выхода (плюс восемь случайных портретов врагов в бою, см. [Q147](interface.md#q147)): верно? Мытарь выходит на связь по рации у пункта пошлины с репликами-заглушками, которые нужно переписать владельцу.\n\nТема: [Сцены сюжета](../story/scenes.md)\n\n### Q69\nТриггеры сюжета и редактор: рация говорит, когда начинается бой, при первом потопленном охотнике и при последнем попадании по лодке; хозяин это капитан; гость онлайн не получает брифинга (арену выбирает хозяин), но слышит рацию и разбор; редактор сохраняет собственные сцены игры, так что только из проекта. Верно? Какие ещё моменты и флоппы должны рассказывать сцены?\n\nТема: [Сцены сюжета](../story/scenes.md)\n"}, {"id": "questions-tools", "path": "questions/tools.md", "title": "Вопросы: инструменты", "section": "questions", "date": "2026-11-10", "md": "# Вопросы: инструменты\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q35\nРедактор карт: чего не хватает или что мешает? Сейчас на Арене точки выхода, посты охраны, логова директора и маршруты заданий (конвой, курьер, маяки, груз, броненосец) заданы в JSON карты, а в самом редакторе руками ставятся рельеф, зоны, старт, охотники банды, маяки, места промысла и кадры вставки. Должен ли редактор позволять расставлять на карте точки выхода, посты и маршруты заданий?\n\nТема: [Редактор карт](../tools/map-editor.md)\n\n### Q68\nИнструменты после QA (см. [демо](../tools/demos.md)): селектор принимает Esc перед кейсом и имеет Back в списке, который сворачивается; кликнутая строка держит клавиши для W S и Enter. В редакторе Picked и Missions делят боковые две части к трём, каждое окно сворачивается, меню и Open стоят над ним, Open переименовывает и убирает в корзину карты игрока, Play возвращается в редактор на несохранявшемся прогрессе, Save as mine пишет поверх своей копии после первого раза; числа словами и единицами (16:30, узлы, метры, градусы; планктон, танин и ил для воды); охотники пронумерованы, закреплены переключателем, оранжевый оставлен для Play; шторка говорит, что поднимает («Raising Coral cay»). Верно?\n\nТема: [Демо](../tools/demos.md)\n"}, {"id": "questions-world", "path": "questions/world.md", "title": "Вопросы: мир и облик", "section": "questions", "date": "2026-11-10", "md": "# Вопросы: мир и облик\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q6\nПогода: дождь, грозы с громом и туманные полосы, скрывающие лодки, были построены как физические модели и сняты, потому что вышли не такими, как задумано: какой должна быть погода, если вообще нужна?\n\nТема: [Арт-дирекшн](../art/README.md)\n\n### Q7\nВыражения портретов: у каждого говорящего (капитан, корабел, мытарь) сейчас четыре выражения — ровный взгляд, довольный, удивлённый и сердитый, а у восьми портретов врагов три (ровный, удивлённый и сердитый). Какие ещё нужны?\n\nТема: [Люди: флоппы](../art/people.md)\n\n### Q11\nКакой настоящей лодкой должен быть каждый корпус? Сейчас: катерок — малый открытый катер, ялик — панга, плоскодонка — джонбот аэролодки, гонщик — офшорный катер, патрульный катер — патрульный катер, канонерка — вооружённый буксир.\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q14\nЛивреи и наряды: цвета и номер каждого корпуса и какой корпус несёт тент, арку, пульт или рубку. Верно?\n\nТема: [Облик лодок](../art/boats.md)\n\n\n### Q61\nМангры (палитра рельефа Delta): кайма куполообразных крон в несколько метров шириной на ходульных корнях над мелководьем, в своём тёмно-зелёном цвете, и лодки проходят под внешним краем крон. Верно?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q77\nТон картинки: яркая мягкая картинка прохода по картинам (экспозиция поднята, контраст AgX смягчён) сделала море серым, так что оно возвращено к тому, что было до прохода. Верно или картинка должна быть ярче как-то иначе?\n\nТема: [Свет и время суток](../art/light.md)\n\n### Q78\nГоры: конус, вытянутый вдоль гребня, седловины между плечами, расходящиеся от вершины отроги, отвесный обрыв у воды и кратер у вулкана; на Арене и в редакторе карт есть формы Peak, Ridge и Volcano. Земля, заслоняющая лодку от камеры, просвечивает кругом вокруг лодки, как в изометрических играх. Верно? Должна ли суша закрывать обзор охотникам и ракетам так же, как дым?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q79\nБарьерный риф и кекуры: барьерный риф (Barrier reef) изгибается дугой с полосой лагуны за ним и лежит у края банки на острове базы и на Арене; морские столбы стоят на мелкой полке группой (Sea stacks) или поодиночке (Lone stack), без подмыва у воды, так как карта высот не даёт нависаний. Верно?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q80\nКосы и отмели: в редакторе и на картах есть Sandbar (белый песок чуть выше воды), Hooked spit (загнутая коса с травой на дюнах и пальмами на оконечности, отходящая от острова базы и на Арене) и Sand bars (три подводные отмели подряд, где средняя держит патрульный катер, но пропускает ялик, а внешняя на метр глубже). Прибой пенится над первой к зыби и средней отмелью, но не над дальней, потому что волна уже погашена мелководьем. Верно ли это, или прибой должен бить над каждой грядой?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q89\nОблик всей игры со стенда `Art` (Esc → Демо → Art): Ink, Lagoon, Poster, Logbook, Deep, Tin, куски нескольких (например, карточки потопления от Ink на воде Lagoon) или ни один? Наш выбор — Ink.\n\nТема: [Кандидаты на облик](../art/candidates.md)\n\n### Q90\nОблик меню со стенда `Menus`: Quiet, Glass, Notebook, Atlas, Device, Dashboard или ни один? Наш выбор — Quiet; Glass, если нужен материал; Notebook, если нужна вещь мира.\n\nТема: [Кандидаты на облик](../art/candidates.md)\n\n\n### Q143\nИмпульсные башни и прожекторы владельцу показались странными, и на Арене вместо них стоят батареи. Убрать ли башни и прожекторы из игры совсем, или переделать их вид и оставить для своих карт?\n\nТема: [Зоны и опасности](../world/areas.md)\n"}, {"id": "reports-2026-10-13-map-approaches", "path": "reports/2026-10-13-map-approaches.md", "title": "Map approaches for a naval sandbox", "section": "reports", "date": "2026-11-09", "md": "# Map approaches for a naval sandbox\n\nOct 13, 2026 · @Denis\n\n## Summary\n\nNaval games handle the sea in three ways: sail the real world at full scale, move an icon across a strategic overworld while in-game days pass, or sail directly on a compressed top-down map. For an archipelago sandbox with a faction war and a threat meter, the overworld or the compressed hybrid fits best. The world simulation needs in-game time to move fast, and crossing the map should cost minutes, not half an hour.\n\n## How each approach plays out\n\n&#91;embedded content: how a voyage plays out · 3 approaches, 4 steps each\\]\n\nA and C keep sailing and fighting in one view on a real-time clock. B splits travel and battle into two modes, so the world can move in days while you cross the map.\n\n## Approach A: direct sailing at full scale\n\nYou steer the ship through one continuous world, so map size is felt directly as travel time, and battles happen in the same space you sail through.\n\n- **Assassin's Creed IV: Black Flag.** The game director put a full crossing at about half an hour, and players can warp to any sync point they have already found ([Cinemablend](https://www.cinemablend.com/games/Assassin-Creed-4-15-20-Hours-Long-58111.html)).\n- **Sea of Thieves.** Rare tuned the map by how often crews meet, not by its size, aiming for a ship encounter every 15 to 30 minutes on average ([TweakTown](https://www.tweaktown.com/news/60911/sea-thieves-map-15-30-minute-ship-encounters/index.html)). Its shortcut is diving the ship to the next voyage, which leaves loot behind and can't target an exact spot ([Gfinity](https://www.gfinityesports.com/article/sea-of-thieves-fast-travel)).\n\n**Strengths:** strong immersion, seamanship matters every minute, and crew roles on deck suit co-op.\n\n**Costs:** long trips that need fast travel and dense content, and a world simulation that moves slowly because real minutes are the only clock.\n\n## Approach B: strategic overworld with compressed time\n\nThe ship is an icon on a strategic map, in-game days pass quickly while you travel, and a battle opens a separate tactical scene. Distance is measured in days, so the world can change a lot while you sail.\n\n- **Sid Meier's Pirates! (2004).** You cross a Caribbean sailing map between colonies, missions and pirate havens. Winds mostly blow west, storms move across the map, other ships are visible with their destination and nationality, and battles open as their own scene ([Wikipedia](<https://en.wikipedia.org/wiki/Sid_Meier%27s_Pirates!_(2004_video_game)>)). Capturing a city can switch it to another nation, so the map itself changes hands.\n- **Mount & Blade II: Bannerlord.** The developers describe the overworld as where much of the gameplay lies. Villages, peasants and caravans are simulated parties, mountain chokepoints concentrate fights over trade routes, and the year was shortened to twelve weeks ([TaleWorlds blog](https://www.taleworlds.com/en/Games/Bannerlord/Blog/14)).\n- **Space Rangers 2.** Space travel is turn-based and switches to real time for planetary battles. A reviewer notes the game pauses at each decision and fast-forwards over long trips, while the Dominators' attacks shift across the map ([MobyGames](https://www.mobygames.com/game/19891)).\n\n**Warning about shrinking too far:** in one forum test, the same Pirates! crossing took 29 in-game days on PC and 14 on the Xbox port. The tester found the compressed map cramped, with less ship traffic, less distinct islands and a navigation skill that no longer mattered ([Quarter To Three forum](https://forum.quartertothree.com/t/pirates-xbox/19918)).\n\n**Strengths:** fast trips, a world simulation that visibly moves, and natural room for factions, trade and a threat meter.\n\n**Costs:** sailing on the map is less physical, and two modes (map and battle) mean two sets of systems to build.\n\n## Approach C: direct sailing on a compressed top-down map\n\nYou steer the ship yourself in real time, but from a high camera over a smaller world, and combat happens in the same view without a mode switch.\n\n- **Windward (Tasharen Entertainment, 2015).** A top-down sailing sandbox with online co-op for up to 4 players ([co-op.gg](https://www.co-op.gg/game/windward)). Each campaign generates a new world, danger and rewards grow with distance from the start, and AI captains have to explore the map just like players ([Fandom launch article](https://www.fandom.com/articles/733-windward-sailing-sandbox-adventure-game-launches)). One review praised it as a relaxing co-op game but found movement slow and combat mostly circling, and wished for a lower camera ([LinuxGameCast](https://linuxgamecast.com/2017/05/linuxgamecast-reviews-windward/)).\n\n**Strengths:** one mode to build, steering skill matters both when sailing and in combat, and a high camera shows threats and islands early.\n\n**Costs:** in-game time still runs at real speed, so faction wars move slowly unless the clock is sped up separately. Close combat can feel shallow from far above.\n\n## Comparison\n\nThe overworld is the only approach where in-game time runs faster than real time by design, which is what a faction war and threat meter need.\n\n| Approach | Examples | Crossing the map | Where combat happens | World clock | Fit for faction war and threat meter |\n| --- | --- | --- | --- | --- | --- |\n| A. Full-scale direct sailing | Black Flag, Sea of Thieves | About 30 real minutes in Black Flag, with fast travel | Same world, same view | Real time | Weak: fronts move slowly |\n| B. Strategic overworld | Pirates!, Bannerlord, Space Rangers 2 | Measured in in-game days (29 days in one Pirates! PC test) | Separate tactical scene | Compressed days | Strong: built for it |\n| C. Compressed top-down sailing | Windward | Real time; no published figure found | Same view | Real time | Medium: needs a sped-up clock |\n\n## Recommendation for this game\n\nUse a strategic overworld (B), or top-down sailing (C) with a separately sped-up world clock, and build the map as sea regions linked by straits.\n\n&#91;embedded content: example archipelago: 7 sea regions linked by straits\\]\n\nThe threat can only move along links, so holding a strait is a real goal and fronts stay readable. Region names here are placeholders taken from the faction ideas so far.\n\nStarting targets to tune in a prototype, not measured figures:\n\n| Target | Value |\n| --- | --- |\n| Crossing the whole map | 3-5 real minutes |\n| Sailing to a neighboring island | 20-60 seconds |\n| Something to react to (sail, wreck, storm) | Every 30-60 seconds |\n| Islands in total | 40-60, about 20 of them settlements |\n| Factions | 4-5, each with 3-5 settlements |\n| Sea regions | 5-8, linked by straits |\n| Unchecked threat overruns the map | 15-25 hours of play |\n| First prototype | 12-15 islands, 3 factions, 1 threat core |\n\n## References\n\n- [Assassin's Creed 4 Is 15-20 Hours Long](https://www.cinemablend.com/games/Assassin-Creed-4-15-20-Hours-Long-58111.html), Cinemablend, 2013: Black Flag crossing time and sync-point fast travel.\n- [Sea of Thieves map will have 15 - 30 minute ship encounters](https://www.tweaktown.com/news/60911/sea-thieves-map-15-30-minute-ship-encounters/index.html), TweakTown, 2018: Rare's encounter-rate target.\n- [How to fast travel in Sea of Thieves](https://www.gfinityesports.com/article/sea-of-thieves-fast-travel), Gfinity, 2024: diving to a voyage and its limits.\n- [Sid Meier's Pirates! (2004 video game)](<https://en.wikipedia.org/wiki/Sid_Meier%27s_Pirates!_(2004_video_game)>), Wikipedia: sailing map, wind, storms, separate battles, city capture.\n- [Pirates! Xbox](https://forum.quartertothree.com/t/pirates-xbox/19918), Quarter To Three forum, 2005: PC vs Xbox crossing test and effects of a compressed map.\n- [Bannerlord Developer Blog 12: The Passage Of Time](https://www.taleworlds.com/en/Games/Bannerlord/Blog/14), TaleWorlds: overworld simulation, chokepoints, twelve-week year.\n- [Space Rangers 2: Dominators](https://www.mobygames.com/game/19891), MobyGames: turn-based travel, real-time battles, shifting Dominator attacks.\n- [Windward co-op](https://www.co-op.gg/game/windward), co-op.gg: up to 4 players online.\n- [Windward launches on Steam](https://www.fandom.com/articles/733-windward-sailing-sandbox-adventure-game-launches), Fandom, 2015: procedural world, distance-based difficulty, AI that explores.\n- [LinuxGameCast Reviews: Windward](https://linuxgamecast.com/2017/05/linuxgamecast-reviews-windward/), 2017: player view of pace, combat and camera.\n"}, {"id": "reports-2026-10-28-arcade-naval-reference", "path": "reports/2026-10-28-arcade-naval-reference.md", "title": "Arcade Naval & Isometric Mission Games — Reference Report", "section": "reports", "date": "2026-11-09", "md": "# Arcade Naval & Isometric Mission Games — Reference Report\n\nOct 28, 2026 · @Denis\n\nEight games that are the closest references for a simple isometric arcade naval game: fight ships, run missions, pick a ship type.\n\nThey fall into three groups. **Naval arcade** (Battle Stations, Overboard!, Naval Ops, Windward) covers ship classes, broadside combat and local versus play. **Isometric mission shooters** (Desert Strike, Jungle Strike, Cleared Hot, Megacopter) cover the mission structure on an open map. **Hybrid** (Return Fire) uses a roster of vehicle roles in a two-player capture-the-flag game.\n\n## 1. Battle Stations (EA, 1997)\n\n**The PS1 game you played.** A two-player naval fighting game: pick one of 8 modern warships and duel a friend or the CPU. Developed by Realtime Associates, published by Electronic Arts for PlayStation and Sega Saturn.\n\n&#91;image: Battle Stations: ship select, a ship-to-ship duel, and the War Games map\\]\n\n*Left to right: ship select (Player 1 vs Computer), a 1-on-1 duel, the War Games strategic map.*\n\n**Gameplay.** Every fight is a 1-on-1 duel in a small arena seen from above. You steer your ship, move a targeting reticle onto the enemy and dodge its shots. In War Games mode, fleets move as pieces on a map; when two ships meet, the game cuts to a duel.\n\n**Features**\n\n- 8 ship types: aircraft carrier, battleship, cruiser, destroyer, submarine, patrol boat, mine layer, troop transport.\n- Each ship is rated on 6 stats: top speed, target range, hull strength, main guns, special weapon, defensive weapon.\n- Arcade mode: quick duels; sinking ships earns points to climb 10 ranks, Ensign to Fleet Admiral.\n- Campaign: single-player missions against 5 enemy commanders, each with its own style.\n- War Games (2 players): capture the flag (sink the flag ship, bring its flag home) and harbor assaults (land marines from a troop transport).\n- Fleets: pick a country, a balanced fleet or a custom one; over 30 fleets in total.\n- 76 missions: 50 single-player, 26 multiplayer.\n\n**Reception.** Mixed. Magazines called it a 32-bit update of the Intellivision game Sea Battle.\n\n**What to take for your game:** the ship roster. Clear roles with a stat card and one special weapon per class make choosing a ship a decision, not a skin.\n\n## 2. Overboard! / Shipwreckers! (Psygnosis, 1997)\n\n**A cartoon pirate-ship shooter for PS1 and PC with a 5-player party mode.** Called Shipwreckers! in North America and Overboard! in Europe.\n\n&#91;image: Overboard!: a harbour level and an ice level with a sea monster\\]\n\n*Top-down 3D view: harbour level (left) and an ice world (right). HUD shows lives, treasure count and hull bar.*\n\n**Gameplay.** You steer one pirate ship through maze-like waterways seen from above. Each world hides map bottles you need to unlock the exit, guarded by enemy ships, shore turrets, traps and sea creatures. When the ship takes fire, the crew jump overboard one by one as the hull bar drains.\n\n**Features**\n\n- Broadside cannons: you turn side-on to the target to hit it.\n- Special weapons: rockets, mines, lightning bolts, plus power-ups such as speed boosts and shields.\n- 5 themed worlds with puzzles and secret routes; saves on memory card or by password.\n- Multiplayer for up to 5 players with the PS1 Multitap: 10 arenas, deathmatch and capture the flag.\n\n**Reception.** Mixed. Critics found the single-player steering too simple (no wind), while several said multiplayer was the strong point and an addictive party game.\n\n**What to take for your game:** broadside aiming as the core skill, and small arenas for local versus.\n\n## 3. Desert Strike (1992) & Jungle Strike (1993), EA\n\n**The isometric helicopter mission games you were thinking of.** Desert Strike launched on Sega Genesis, became EA's best-selling game at the time, and spawned Jungle, Urban, Soviet and Nuclear Strike.\n\n&#91;image: Desert Strike and Jungle Strike gameplay\\]\n\n*Desert Strike (left) and Jungle Strike (right): an open isometric map with the helicopter, targets and pickups.*\n\n**Gameplay.** You fly an attack helicopter over a large, open isometric map. Each level holds several missions: destroy installations, rescue hostages, capture enemy officers. You pick the order yourself, so planning the route matters.\n\n**Features**\n\n- Resource triangle: limited armor, fuel that drains over time, and ammo; fuel barrels and ammo crates are scattered on the map.\n- 3 weapons with a trade-off: machine gun (plenty), Hydra rockets (fewer), Hellfire missiles (fewest, strongest).\n- Rescued people delivered to a landing zone restore armor.\n- Jungle Strike adds other vehicles: a hovercraft, a motorbike and an F-117, plus a co-pilot choice before each level.\n- Fail one mission objective and you restart the level.\n\n**Reception.** Strong: several magazines scored Desert Strike above 90%, praising the mix of action and strategy.\n\n**What to take for your game:** the mission-on-an-open-map structure, with fuel and ammo as a route-planning puzzle. Jungle Strike's hovercraft shows how a water vehicle fits the format.\n\n## 4. Cleared Hot (MicroProse, PC)\n\n**A modern Desert Strike homage built on physics.** Published by MicroProse on Steam; the store page lists a Nov 20, 2025 release and an Early Access tag.\n\n&#91;image: Cleared Hot: a helicopter on a mission to destroy radar installations\\]\n\n*An objective tracker (top right), minimap and weapon HUD over a desert base.*\n\n**Gameplay.** You fly a helicopter over a 3D map seen from a high angle, completing objectives like knocking out radar sites. A rope and magnet lets you lift almost anything: rocks to throw, tanks to carry, even incoming heat-seeking missiles to redirect. You also ferry and position a squad of soldiers to take or hold ground.\n\n**Features**\n\n- Fully physics-based combat; ragdolling enemies and emergent tricks.\n- 8 playable helicopters with custom loadouts.\n- 3 biomes (desert, jungle, arctic), day and night missions.\n- Enemies include tanks, jeeps, anti-air turrets, fighter jets and boats.\n- Single-player campaign; Steam Workshop support.\n\n**What to take for your game:** one signature verb (the magnet) that makes missions playful. A ship equivalent could be a towing cable or grappling hook.\n\n## 5. Megacopter: Blades of the Goddess (Pizza Bear Games, 2024)\n\n**The closest modern match to the classic Strike look.** Released on Steam on Jun 21, 2024; a sci-fi, comic-book take on Desert Strike and Choplifter.\n\n&#91;image: Megacopter: attacking an enemy dome base on an isometric beach map\\]\n\n*Isometric map with an alert meter (top left), minimap and objective panel (top right), weapon HUD (bottom).*\n\n**Gameplay.** You pilot a sentient helicopter against alien Reptoid forces across isometric maps. Each mission has a clear type, and enemy pressure ramps up as you push deeper.\n\n**Features**\n\n- 4 mission types: seek and destroy (threat level rises as you go deeper), rescue (Choplifter style), defense (enemy waves), boss hunt.\n- 4 biomes, over a dozen missions.\n- Armory: spend tokens on new guns between missions.\n- Ability pairings (AZ-TECH) chosen per mission loadout.\n- Single-player; original retro soundtrack.\n\n**What to take for your game:** a small set of named mission types, and the escalating threat meter inside a mission.\n\n## 6. Return Fire (Silent Software, 1995)\n\n**A two-player capture-the-flag game where picking the right vehicle is everything.** Released on 3DO in 1995, then PC and PlayStation in 1996.\n\n&#91;image: Return Fire: the vehicle bunker and a helicopter over an island\\]\n\n*Left: the underground bunker where you choose your next vehicle. Right: a helicopter attacking an island bunker.*\n\n**Gameplay.** Each player has a base on an island map, seen from a 3D bird's-eye view. You pick a vehicle from your bunker, push into enemy territory, find their flag and bring it home. Lose a vehicle and you go back to the bunker for another.\n\n**Features**\n\n- 4 vehicles with sharp roles:\n  - Helicopter: strafes, destroys mines and bridges, fragile, refuels only at base.\n  - Tank: 360° turret.\n  - Armored support vehicle: toughest and slowest, lays mines.\n  - Jeep: fastest, dies in one hit, the only vehicle that can carry the flag; inflates its tires to cross deep water.\n- Fuel and ammo per vehicle, refilled at depots and ammo tents.\n- Leave the map edge and a submarine surfaces to fire a homing missile.\n- Split-screen two-player mode, praised as the highlight; a classical soundtrack with a theme per vehicle.\n\n**Note:** there are no boats in Return Fire. The jeep's water crossing is the closest it gets.\n\n**What to take for your game:** a rock-paper-scissors vehicle roster where only one class can win the objective. In a naval version, a fast, fragile boat could be the only one able to carry the flag.\n\n## 7. Naval Ops: Warship Gunner (Micro Cabin / Koei, 2003)\n\n**Mission-based arcade naval combat with deep ship building.** PlayStation 2; released in the US in June 2004. Single-player only, third-person camera rather than isometric.\n\n&#91;image: Naval Ops: Warship Gunner gameplay\\]\n\n*Third-person view behind the player's warship in open-sea combat.*\n\n**Gameplay.** You command one warship in real time through 40 missions across 4 theaters (Mediterranean/Atlantic, Pacific, Indian Ocean, worldwide). Each theater ends with a boss fight against a giant \"supership\". Between missions you spend money on parts and research.\n\n**Features**\n\n- Start in a generic destroyer and grow into cruisers, battleships, aircraft carriers and battlecarriers.\n- Build your own ship from hulls, weapons, armor and equipment, or buy pre-built designs and scrap them for parts.\n- Research in 5 areas: aircraft, weapons, metallurgy, engines, electronics.\n- 4 nations (US, UK, Japan, Germany) change the available ship types and parts.\n- WWII mode with period tech, or Normal mode with sci-fi weapons like rail guns and lasers.\n\n**What to take for your game:** the between-mission upgrade loop and boss ships that end each chapter.\n\n## 8. Windward (Tasharen Entertainment, 2015)\n\n**Top-down arcade sailing and ship combat, built for co-op.** Released on Steam on May 12, 2015.\n\n&#91;image: Windward: top-down ship combat with broadsides and area effects\\]\n\n*Bird's-eye view of a sea battle: ships trade broadsides while skill effects burst around them.*\n\n**Gameplay.** You sail one ship around a procedurally generated world, fighting pirates, trading with towns and taking quests. Combat is real-time and arcade: you steer to bring your guns to bear and use active skills. The further you sail from the start, the harder and more rewarding it gets.\n\n**Features**\n\n- Ship classes with clear roles: fast schooners for exploring, heavy ships of the line for firepower.\n- Solo or online co-op, with cross-platform multiplayer.\n- Towns grow as you supply them and unlock better ships and upgrades.\n- Reputation system: AI factions challenge you, avoid you, or follow and help you.\n- AI ships play by the same rules as the player.\n\n**What to take for your game:** readable top-down ship combat at arcade speed, and distance from the start as a simple difficulty curve.\n\n## At a glance\n\nBattle Stations and Return Fire are the best models for local versus play with ship classes; Desert Strike and Megacopter are the best models for missions.\n\n| Game | Year | View | Players | Core loop | Idea to borrow |\n| --- | --- | --- | --- | --- | --- |\n| Battle Stations | 1997 | Top-down duel arena | 1–2 local | Pick 1 of 8 warships, duel | Ship classes with stat cards and a special weapon each |\n| Overboard! | 1997 | Top-down 3D | 1–5 local | Sail mazes, sink ships, find exits | Broadside aiming; small versus arenas |\n| Desert / Jungle Strike | 1992–93 | Isometric | 1 | Open-map missions, manage fuel and ammo | Mission lists on one open map |\n| Return Fire | 1995 | Bird's-eye 3D | 1–2 split-screen | Capture the flag with 4 vehicle roles | Only one fragile class can carry the flag |\n| Naval Ops: Warship Gunner | 2003 | Third-person | 1 | 40 missions, build and upgrade your ship | Upgrade loop; chapter boss ships |\n| Windward | 2015 | Top-down | 1 + online co-op | Sail, fight, trade, quest | Readable arcade broadsides |\n| Megacopter | 2024 | Isometric | 1 | 4 named mission types | In-mission threat meter |\n| Cleared Hot | 2025 | High-angle 3D | 1 | Physics missions with rope and magnet | One signature verb, like a towing cable |\n\n## Sources\n\nScreenshots: Wikipedia, PSX Data Center and Steam store pages, linked below.\n\n- Battle Stations: [Wikipedia](<https://en.wikipedia.org/wiki/Battle_Stations_(1997_video_game)>), [StrategyWiki](https://strategywiki.org/wiki/Battle_Stations), [MobyGames](https://www.mobygames.com/game/47361/battle-stations/), [PSX Data Center](https://psxdatacenter.com/games/U/B/SLUS-00456.html)\n- Overboard! / Shipwreckers!: [Wikipedia](<https://en.wikipedia.org/wiki/Overboard!_(1997_video_game)>), [PSX Data Center](https://psxdatacenter.com/games/U/S/SLUS-00558.html), [PPE.pl](https://www.ppe.pl/gry/Overboard/6480), [The Video Game Critic](https://videogamecritic.com/ps1ss.htm)\n- Desert Strike: [Wikipedia](https://en.wikipedia.org/wiki/Dese
