нках от ИИ.\n- Свой App ID вместо тестового ([Q108](questions/online.md#q108)), страница Steam ([Q96](questions/gaps.md#q96)), закрытый тест через Steam.\n\nГотово, когда: срез идёт на 60 к/с на названном слабом PC и на Steam Deck, и страница Steam открыта.\n\n### 4. Демо — два-три месяца\n- Срез выходит публичным демо и собирает желающих на странице Steam.\n- Смотрим, где игру бросают и где тонут, и правим срез, пока его не доигрывают.\n- В кооп по интернету сыграли чужие люди. Всё из «Пока не онлайн» ([Онлайн-кооп](online.md)) становится онлайн, либо кооп в релизе не обещаем.\n\nГотово, когда: демо доигрывают до босса, и отзывы на него в основном хорошие.\n\n### 5. Ранний доступ — шесть-двенадцать месяцев\n- **Линия поручений** до финального босса (решено [11-12](decisions.md)): четыре-пять районов моря со своим светом, опасностями и охотниками (так умеют [Локации](world/locations.md)), 25–40 поручений, пять-шесть боссов, каждый учит своей [сборке](gameplay/builds.md), финал. Итог — 10–15 часов.\n- **Новое каждые полчаса**: деталь, охотник, опасность или место.\n- **Экономика целиком** ([Q101](questions/gaps.md#q101)): детали приходят с поручениями, и на десятом часу ещё есть чего хотеть.\n- **Реплики**: маленький состав флопп (корабел, мытарь, торговец) с живыми голосами и шутками ([Q48](questions/story.md#q48), [Q104](questions/gaps.md#q104)). Лор по-прежнему выбирает владелец ([Сеттинг и лор](story/setting.md)).\n- **Довести или вырезать** каждую побочную систему: [места промысла](gameplay/sites.md), расходники, дроны, редакторы карт и сюжета.\n\nГотово, когда: игру проходят до финала, и отзывы в Steam «очень положительные» или лучше.\n\n### 6. Релиз 1.0\n- Доступность ([Q100](questions/gaps.md#q100)): свои и чужие ракеты различимы не только цветом, крупный текст. Переназначение клавиш и геймпада ([Q74](questions/interface.md#q74)).\n- Языки сверх английского и русского ([Q75](questions/interface.md#q75)).\n- Облачные сохранения и достижения ([Q96](questions/gaps.md#q96)).\n- Звук: сведение, временные звуки заменены ([Q23](questions/audio.md#q23)), одна тема, которую напевают.\n- [Известные недочёты](known-issues.md) пусты.\n- Пресса: Metacritic ставит оценку только после нескольких рецензий критиков, так что нужны издатель или PR, ключи заранее и трейлер.\n\n## Открытые вопросы\n- [Q95](questions/gaps.md#q95): что внутри этапов, их сроки и какая версия станет 0.1.\n- [Q185](questions/gaps.md#q185): имя и кот.\n- [Q92](questions/gaps.md#q92), [Q93](questions/gaps.md#q93), [Q96](questions/gaps.md#q96), [Q97](questions/gaps.md#q97), [Q105](questions/gaps.md#q105).\n"}, {"id": "story-dialogue", "path": "story/dialogue.md", "title": "Диалоги и голос", "section": "story", "date": "2026-11-13", "md": "# Диалоги и голос\n\n![Корабел](../img/shipwright.jpg)\n\n![Диалог: реплика в матовом стекле, ответы списком](../img/dialogue.jpg)\n\nКак показан разговор: портреты, выноска, буквы по одной и кошачий лепет вместо слов. Сами сцены описаны в [Сценах сюжета](scenes.md).\n\n## Решения владельца\n- Разговор с кем-то — диалог, как в визуальной новелле: большой нарисованный портрет каждого говорящего рядом с репликами, лицо меняется по реакции.\n- Портреты стоят у нижнего края экрана, говорящий подсвечен; его реплика в выноске между ними.\n- Выноска — из стекла, как всё стекло интерфейса; ответы стоят списком, как меню; имя говорящего — мелкая подпись (решение 2026-11-12, [решения](../decisions.md)).\n- Говорящие лепечут, а не произносят слова: каждая буква — короткий кошачий звук, высота зависит от говорящего, одни и те же буквы звучат всегда одинаково. Злые слова рычат.\n- Реплики движутся: буквы выскакивают, когда их произносят; слова волнуются, трясутся, стоят крупно цветом с блеском или переливаются радугой; некоторые говорятся медленно, паузы держат слова, а лицо посреди реплики меняется с прыжком.\n- Корабел здоровается с игроком на верфи.\n- Пока идёт диалог, экран за ним не отвлекает: мир и приборы уходят на задний план.\n\n## Как устроено (`talk/`)\n\n`Dialogue` показывает разговор, как визуальная новелла: портрет каждого говорящего (`assets/portraits/<speaker>-<face>.png`) у нижнего края экрана, капитан справа, собеседник слева, при необходимости каждый отражён, чтобы смотреть на другого; говорящий подсвечен. Его реплика — в стеклянной выноске между ними (`Gloss.Balloon`, матовое стекло `frosted`, как у подсказок меню, только крупнее): у края прозрачная, сцена гнётся вдоль кромки, глубже — матовая под бледной бирюзой, буквы тёмные. Хвост выноски указывает на говорящего. Имя — мелкая подпись прописными над верхним краем выноски, с его стороны: белая, с тёмным ореолом. Говорящие — `Speaker`: капитан, корабел и мытарь, у каждого четыре лица. Реплика пишется с метками, которые читает `Speech`: [wave], [shake], [big], [rainbow] и [slow] вокруг слов, [face=pleased] и [pause] там, где они стоят; точки и запятые держат слова. Каждая буква рисуется отдельно и выскакивает, когда её произносят; крупные слова — оранжевые. Enter, Space или щелчок показывают реплику целиком, а затем просят следующую; на выноске тогда покачивается клавиша Enter (на геймпаде — его кнопка). Ответы стоят над правым краем выноски списком, как меню (`Pill.Row`): белые слова с бледной цифрой перед каждым, выбранный — на стеклянной пилюле, налитой светом, свет скользит от строки к строке. Ответы выезжают по одному, их выбирают W S и Enter, цифрой или щелчком; Esc просит пропустить. Пока диалог идёт, он берёт клавиши и указатель, а мир и приборы за ним размыты и притемнены тем же матовым стеклом, что у окон интерфейса и выносок (`ui/frosted.gdshader`). Стекло выноски и ответов видит уже притемнённый мир и портреты: под ними экран копируется ещё раз, только в их прямоугольнике (`BackBufferCopy`). Портрет покачивается, пока говорит, подпрыгивает, когда меняется его лицо, и дёргается на трясущихся словах. Размеры, притемнение и цвета — в теме `ui/look.tres`, тип `Speech`.\n\n`Voice` лепечет по буквам: у каждой буквы своё зерно кошачьего мяуканья, вырезанное при загрузке из одной полосы (`assets/sounds/voice/mews.wav`), по высоте подстроенное под говорящего (`Speaker.Pitch`) и на пентатонической ступени, которую эта буква хранит, поэтому одни и те же слова звучат всегда одинаково. Зёрна разнесены так, чтобы быстрые буквы не сливались. Последнее слово вопроса поднимается, крупные слова громче и ниже, а трясущиеся рычат зовами каракала (`growls.wav`).\n"}, {"id": "story-scenes", "path": "story/scenes.md", "title": "Сцены сюжета", "section": "story", "date": "2026-11-13", "md": "# Сцены сюжета\n\n![Мытарь](../img/tollkeeper.jpg)\n\nКак игра рассказывает сюжет: сцены, их поводы, условия, радио. Сцены пишут в [редакторе сюжета](../tools/story-editor.md); как звучат и выглядят сами диалоги, описано в [Диалогах и голосе](dialogue.md).\n\n## Решения владельца\n- Сюжет рассказывают сценами, которые пишут во встроенном редакторе сюжета.\n- Сцена — это граф эпизодов на холсте. Каждый эпизод — сценарий: кто говорит, с каким лицом, и реплика с метками.\n- Сцены ветвятся по ответам игрока, проверяют условия по флагам и по игре, ставят флаги и действуют в игре, например дают монеты или деталь.\n- Повод рассказывает одну сцену: из тех, чьи условия выполнены, ту, у которой наивысший приоритет. Сцену можно рассказать только один раз.\n- Сцены запускаются в местах на базе, до и после захода, по радио в бою и при подходе к флоппе. Базы как экрана с 2026-11-13 нет: её места — причал гавани и верфь.\n\n## Как устроено (`story/`)\n\n`Teller` рассказывает сцены на собственном слое холста. Сцена (`Scene`) — JSON-файл в `res://story` (`Scenes`); его читают заново при каждом поводе, поэтому правки редактора рассказываются сразу. Повод (`Triggers`) вызывает `Teller.Tell`, а тот выбирает сцену (`Teller.Pick`): из тех, что этот повод запускает, чьё условие выполнено и которые, если они разовые, ещё не рассказаны, — с наивысшим приоритетом, а затем реже всех рассказанную. Нет сцены — ничего не происходит.\n\nВ игре сейчас одна сцена — приветствие корабела на верфи (`story/yard-greeting.json`), с репликами-заглушками ([Q48](../questions/story.md#q48)).\n\nВ каждом эпизоде лежит сценарий (`Screenplay`), по шагу в строке:\n\n```\nShipwright: [face=pleased]Will you take it out?\n* Not yet -> later\n* Right now! -> now if coins > 10\n-> keen if eager\nset visits = visits + 1\ndo give coins 50\nstop\n```\n\nРеплика ждёт Enter. Ответы сразу после реплики предлагаются, пока их условие выполнено, и ведут в свой эпизод или дальше, мимо ответов. Эпизод, который кончился без перехода, завершает сцену. Esc пропускает ещё не сказанное до ближайших ответов или до конца. Условия и значения — `Expression` Godot над `Facts`: флаги, которые ставят сцены (0, пока не поставлены; булево, число или текст), `coins` и `Seen(\"Scene name\")`; всё это хранит сохранение (`Progress`). `do` запускает `Teller.Order`: `give coins N`, `give part Name`, `wait seconds`. `Screenplay.Faults` перечисляет строки, которые сцена не может рассказать. Сцена, которая идёт по эпизодам, где нечего ждать, обрывается. Почему сценарий в каждом эпизоде: реплики печатают быстрее, чем соединяют блоки, а граф показывает только ветки.\n\n**Поводы** (их запускает `Game`, каждый рядом с тем, за чем следует):\n\n| Повод | Когда | О чём |\n| --- | --- | --- |\n| `yard` | открывается верфь | |\n| `briefing` | лодка отчалила от причала гавани (решение без владельца, [Q179](../questions/interface.md#q179)). | `mission` |\n| `home` | лодка пришвартовалась у причала гавани. | `mission` |\n| `debrief` | лодка продала добычу корабелу и закрыла его экран. | `mission`, `won` |\n| `radio-start`, `radio-first-sunk`, `radio-last-strike` | начинается заход; идёт ко дну первый охотник; у лодки игрока остаётся последнее попадание | `mission` |\n\n`Tell(trigger, about)` приносит факты, которые видят только условия этого рассказа: `mission` (название) и `won`. После швартовки у пирса `won` всегда истинно. Гость в онлайне не видит брифинга, потому что заход выбирает хозяин игры, но слышит радио и разбор.\n\n**Счёт**: `Facts.Finish` записывает задание выигранным или проигранным по названию, условия видят `wins` и `losses`, `Won(\"Mission\")` и `Lost(\"Mission\")`. Пишет его конец поездки гостя, полигона и прогона из редактора; швартовка у пирса и гибель в одиночной игре счёт не трогают.\n\n**Мытарь** (`Speaker.Tollkeeper`, портреты `tollkeeper-*`) смотрит вправо, говорит неспешно и низко. Своих сцен у него нет: они звучали у точек выхода с пошлиной и ушли вместе с ними ([Q48](../questions/story.md#q48)).\n\n**Радио** (`talk/Radio.cs`): сцена, чей повод начинается с `radio-`, звучит в левом верхнем углу экрана, под заметкой о задачах, а не в диалоге. Радио — часть приборов и из их стекла (`Lens`, тип `Radio` в теме): маленький портрет (голова с портрета говорящего; его инициал, если портрета нет) в стеклянной рамке, имя мелкой подписью и реплика белыми буквами на панели дымчатого стекла. Реплика говорится по буквам голосом говорящего, держат её мгновение и идут дальше; сцена кончается сама. Радио не берёт ни клавиш, ни указателя, поэтому бой идёт дальше и ничто не встаёт на паузу. Ответы по радио не выбрать, поэтому `Screenplay.Faults` их помечает. Радио — только вид локального игрока. Одна сцена радио за раз: повод радио, пока идёт другая или диалог, отбрасывается. Повод диалога радио не блокирует: диалог обрывает радио на полуслове, и тот рассказ не засчитывается. `Dialogue` и `Radio` делят `Lettering`: раскладку и отрисовку букв (тёмных на матовой выноске, белых с ореолом на дымчатом стекле), подпись с именем и общие времена появления и ухода. Моменты боя читаются с лодок как они стоят (`Game.Calls`), поэтому их слышит и гость.\n\n## Открытые вопросы\n- [Q48](../questions/story.md#q48): с кем говорит игрок и о чём.\n- [Q69](../questions/story.md#q69): поводы сюжета и редактор.\n"}, {"id": "story-setting", "path": "story/setting.md", "title": "Сеттинг и лор", "section": "story", "date": "2026-11-13", "md": "# Сеттинг и лор\n\nМир, в котором идёт игра, и правила, по которым в неё попадает лор.\n\n## Решения владельца\n- Сеттинг: оптимистичный мир соларпанка спустя долгое время после падения. Современный мир, из которого он вырос, — далёкое прошлое, и о нём мало что помнят (владелец, 2026-11-02).\n- Все жители — флоппы ([Люди: флоппы](../art/people.md)).\n\n## Где сеттинг виден в игре\n- Приборы старого мира, найденные и починенные ([HUD](../interface/hud.md), [Стиль интерфейса](../art/interface.md)).\n- Солнечные панели, тенты, ветряки и зелень в кадках на лодках ([Облик лодок](../art/boats.md)).\n- Одежда старого мира, выцветшая и залатанная, с льном и плетёным нового ([Люди: флоппы](../art/people.md)).\n\n## Правила лора\n- Лор попадает в игру и в вики только тогда, когда владелец назовёт кусок. Понравившееся предложение — не приказ его строить.\n- Любой лор, фракцию или механику сверх решённого помечать как предложение.\n- Мир описывают простыми идеями: места и люди — по тому, что они есть («закрытый остров», «наставник на верфи»), а не придуманными именами. Без глоссариев, придуманных эпох и календарей, списков титулов и именованного состава: придуманные слова владелец читает как сгенерированный мусор (2026-10-27).\n- Персонажи — роли без имён: капитан, корабел, мытарь.\n\n## Предложения\n- [Предложения по сеттингу](lore-proposals.html) (на английском): пять миров соларпанка после падения и смесь двух из них — затопленного города и закрытого острова. Каждая вкладка — питч, идеи мира, карта, как это играется, таблица идей, сюжет и повороты, мудборд. Ничего из этого нет в игре; владелец выберет куски сам.\n- Владелец читает их с телефона как артефакт: https://claude.ai/artifact/7xXEeNLqmCzpaGSYH9rbZt. Правишь страницу — опубликуй артефакт заново.\n\n## Открытые вопросы\n- [Q5](../questions/story.md#q5): подробности сеттинга — его люди, названия мест, что осталось от старого мира.\n"}, {"id": "tools-README", "path": "tools/README.md", "title": "Инструменты", "section": "tools", "date": "2026-11-12", "md": "# Инструменты\n\nЧем собирают, проверяют и выпускают игру, и чем в ней самой делают карты и сюжет.\n\n## Страницы\n- [Код](code.md): как устроен проект `game/`.\n- [Демо](demos.md): отдельные сцены для каждой части игры и их проверки.\n- [Редактор карт](map-editor.md): карты и их задания над живым миром.\n- [Редактор сюжета](story-editor.md): сцены и сценарии.\n- [Ассеты](assets.md): откуда берутся модели, звук, шрифты и портреты.\n- [Сборки и посты](release.md): экспорт сборок и посты в канал.\n\n## Команды\n\n| Команда | Что делает |\n| --- | --- |\n| `make` | Собирает игру и запускает её в окне (`make build` только компилирует, `make wiki` показывает вики на `127.0.0.1:8000`). |\n| `tools/demo.sh <out dir> [Demo ... \\| --since <rev>]` | Запускает демо скрытно с их проверками ([Демо](demos.md)). |\n| `tools/catalogue.sh <out dir>` | Рисует каждую лодку верфи на одной странице ([Ассеты](assets.md)). |\n| `tools/locale.py [--check]` | Собирает слова игры в каталоги перевода `game/locale/` ([Язык](../interface/language.md)). |\n| `tools/build.sh` | Экспортирует `main` для macOS и Windows ([Сборки и посты](release.md)). |\n| `tools/post.sh` | Публикует пост в канал игры, только с одобрения владельца ([Сборки и посты](release.md)). |\n| `tools/wiki.py <out dir>`, `tools/wiki-pages.sh` | Собирает вики сайтом; второй выкладывает публичную копию на GitHub Pages ([Главная](../README.md)). |\n| `tools/steamworks.sh <tag>` | Собирает Steamworks.NET под каждую ОС и пакует с библиотеками Valve в локальный пакет игры ([Онлайн-кооп](../online.md)). |\n\n## Правила разработки\nПринципы разработки, проверки перед тем, как назвать работу готовой, и правила коммитов лежат в [`CLAUDE.md`](../../CLAUDE.md).\n\n## Старая версия\nЗаброшенная песочница-архипелаг хранится под git-тегом `simulator-game`.\n"}, {"id": "tools-assets", "path": "tools/assets.md", "title": "Ассеты", "section": "tools", "date": "2026-11-12", "md": "# Ассеты\n\nОткуда в игре берутся модели, звук, шрифты и портреты.\n\n## Как устроено\n\n- **Модели.** Пирс, станция и детали лодок — турель, люлька и минный жёлоб — моделируются в Blender из скриптов в `tools/`: `blender -b -P tools/dock.py` пишет `game/base/dock.glb`, `tools/outpost.py` — `game/areas/outpost.glb`, `tools/turret.py`, `tools/cradle.py` и `tools/minerail.py` — в `game/ships/parts/`. Цвет и отделка каждой грани лежат на её вершинах. Лодки строятся в коде по линиям корпуса (`game/ships/`). `tools/catalogue.sh <out>` рисует каждую лодку, которую строит верфь, в `<out>/index.html` с фильтром по деталям.\n- **Звук.** Нарезан из записей CC0 на Freesound (`game/assets/sounds/`, источники в его `Licenses.txt`); перед скачиванием владелец одобряет список (идентификаторы, авторы, размеры).\n- **Музыка.** Играет на инструментах, сэмплированных из библиотек CC0 (`game/assets/sounds/music/`).\n- **Шрифты.** Гарнитуры интерфейса Nunito, Caveat и EB Garamond имеют открытую лицензию OFL (`game/assets/fonts/`, лицензии рядом).\n- **Портреты диалогов** (`game/assets/portraits/<speaker>-<face>.png`) — заглушки до рисунков художника; откуда они и что с ними дальше: [Люди: флоппы](../art/people.md).\n"}, {"id": "tools-code", "path": "tools/code.md", "title": "Код", "section": "tools", "date": "2026-11-13", "md": "# Код\n\nКак устроен проект `game/`: старт, корень композиции и общие части.\n\n## Как устроено\n\n`game/` — игра на Godot 4.7 (.NET). Вики говорит, что игра делает сегодня, с решениями без владельца там, где дизайн молчит (каждое называет свой вопрос). Числа настройки живут в коде. `Pirates.sln` содержит проект, `Directory.Build.props` задаёт параметры сборки.\n\nИгра стартует сразу в море, на Арене (`Missions.Arena`, карта `maps/arena.json`), на последнем сохранённом прогрессе (`Progress.Latest`); пассат дует с направления, выбираемого заново при каждом старте. Гавань (`base/`) — мастерская корабела на сваях в лагуне острова: к ней доплывают и швартуются, не покидая мира, там продаётся добыча из трюма (`haul/`) и открывается верфь ([Арена](../gameplay/missions.md), [Гавань](../base/pier.md)). `ui/Curtain.cs` скрывает мир, пока не скомпилирован код игры без демо (`common/Precompiling.cs`, в пуле потоков, ведь первый запуск метода, оставленный JIT, задерживает свой кадр) и пока шейдерные пайплайны не перестанут компилироваться, в окне с названием игры, и пишет, что поднимается. Приложение называется Floppa Tropical Adventures (`project.godot`); его пользовательские данные остаются в `app_userdata/Pirates` (`custom_user_dir_name`), где лежали сохранения, настройки и логи.\n\n`Game.cs` — корень композиции, разложенный по частям: выход в море (`Game.SettingOut.cs`), швартовка в гавани, торговцы и конец захода (`Game.Home.cs`), арены и их вставки (`Game.Cuts.cs`), кооператив (`Game.Online.cs`). `World.cs` строит общий мир (небо, море, землю, бой, припасы, эффекты, звук) из локации (`scenery/`), которую собирают и `Game`, и `Stage` демо. Новая локация — новая сцена: небо, вода и земля мира — глобальные для рендерера, поэтому стоит один мир за раз. `common/` хранит то, что общее для всех систем; каждая другая папка — одна система. Единицы — метры.\n\n## Открытые вопросы\n- [Q106](../questions/gaps.md#q106): оставить ли имя Pirates в коде.\n"}, {"id": "tools-demos", "path": "tools/demos.md", "title": "Демо", "section": "tools", "date": "2026-11-13", "md": "# Демо\n\nМаленькие сцены, каждая из которых показывает одну часть игры отдельно, чтобы увидеть и проверить её вне остального.\n\n## Как устроено\n\n`game/demos/` хранит маленькие сцены, каждая ставит одну часть игры отдельно, чтобы увидеть и проверить её вне остального (правило есть в [`CLAUDE.md`](../../CLAUDE.md)). Демо — это папка: его скрипт и по сцене на каждый кейс с заданными в инспекторе значениями скрипта, как хочет этот кейс. Они входят в каждую сборку.\n\nЗапустить демо можно из меню игры (Esc), «Инструменты» → «Демо» (селектор, `demos/Demos.tscn`), из редактора Godot по F6 на его сцене или скрытно через `tools/demo.sh`: четыре кейса сразу на машине, какая бы сессия их ни запускала (у каждого из четырёх мест свои порты кооператива, так что кейсы `Coop` идут рядом), самые долгие первыми, чтобы места кончали вместе, и каждый проваливается, проработав втрое дольше своего прошлого удачного прогона (не меньше двух минут; десять минут, `DEMO_LIMIT`, если удачного не было), в 640x360 (`--full` для размера игры), фиксированными шагами, чтобы прогон играл одинаково при любой нагрузке. Без имён идут `Opening` и все демо. `--since <rev>` запускает демо, которые показывают файлы, изменившиеся с `<rev>`, и незакоммиченные тоже; медленные (`Opening`, `Coop`, верстаки `Art` и `Menus`) идут тогда только за своими файлами или по имени. Прогон печатает только проваленное: проверки, ошибки и предупреждения; кадры и логи лежат в папке вывода. Окно «Кейс» селектора хранит значения инспектора показанного кейса в их единицах; изменение одного открывает кейс заново с ним. Esc и «Назад» в списке покидают селектор раньше, чем кейс успеет взять клавишу, а список складывается в полоску. Щёлкнутая строка держит клавиши: W S или стрелки шагают по списку, Enter открывает строку, щелчок по сцене возвращает клавиши кейсу.\n\n`Opening` (`demos/Opening.tscn`, вне селектора) проверяет старт игры, сыгранный указателем и клавишами: игра начинается сразу в бою на Арене, с видом, HUD и рулём у игрока; отладочная карточка закрыта; карта открыта и закрыта Esc; меню, его настройки, строки судового журнала и страница «Инструменты», «Выход», который с первого нажатия только предупреждает, и Esc, возвращающий в бой; швартовка на `Space` у пирса с добычей в трюме, лента пирса, экран корабела с плитки «Торговец», где `Enter` продаёт ящик, а `Esc` ведёт назад к ленте, верфь, меню над лентой, «Отчалить» в то же живое море и гибель в море: кадр `died` — полосы с «Погиб», затем загрузка последнего сохранения. `Selecting` (`demos/Selecting.tscn`, тоже вне селектора) проверяет селектор над кейсом `Pause/Menu`: Esc и «Назад» покидают его, клавиши шагают и открывают строки, список складывается. `Catalogue` (`demos/Catalogue.tscn`, тоже вне селектора) рисует каждую лодку, которую строит верфь, по кадру на лодку: `tools/catalogue.sh <out>` запускает его примерно за минуту и раскладывает кадры в `<out>/index.html`, с фильтром по деталям. `Gallery` (`demos/Gallery.tscn`, тоже вне селектора) — тот же `Catalogue` с `Gallery = true`: по кадру на корпус, мотор, палубную деталь и охотника для их страниц в [сайте вики](../README.md); `tools/demo.sh <out> Gallery`, кадры кладутся в `wiki/img/parts/` без приставки `Gallery-`.\n\n| Демо | Что показывает |\n| --- | --- |\n| `Art` | Верстак для художественных направлений всей игры: фиксированная перестрелка у мелководья острова (ялик, три охотника, ракеты, потопление, дым, HUD) с кадрами `wide`, `volley`, `hit`, `hostile`, `sinking`, `shallows` и `close`; облик в `Art/Looks/<Name>/` (`ILook`) переодевает её через dresser, а его проверки убеждаются, что его замены дошли до моря, лодок и того, что появилось позже. Виды: игра как есть (`Current`), облик `Sample` и предложенные облики `Ink`, `Poster`, `Lagoon`, `Deep`, `Tin` и `Logbook`. |\n| `Broadside` | Лодка, стреляющая ракетами (`Rockets`) или торпедами (`Torpedoes`, `TorpedoesShoreward` — к берегу) в другую: попадания, потопление, высыпавшиеся предметы, сбитые плиты, плотники. Parry: ракеты двух сторон сбивают друг друга в воздухе. Awash: курьер на последнем попадании, осевший в воду, тонет от залпа с траверза, и ни одна ракета не проходит над ним. Aim: гонщик под HUD наводит точку на охотника впереди траверза правого борта, потом на другого позади траверза левого, потом на открытую воду, и стреляет только тот борт, чей веер держит точку; ракеты, пущенные в открытую воду, гаснут на краю досягаемости, не дальше. Hunter: стреляет охотник, и его ракета летит заметно дольше ракеты игрока. Lock: ракеты по захваченной цели под HUD, клавиша борта тускнеет, пока он перезаряжается, и загорается снова. Chaser: гонщик с носовыми стойками, преследующий лодку, идущую прямо от него, каждый залп уходит впереди её носа. Mines: гонщик с минным жёлобом сбрасывает по мине с борта, за ним по пятам таранщик, и правила жёлоба по одному (никогда для своей стороны, взвод, седьмая мина, выстрел и его цепь). |\n| `Components` | Верстак системы интерфейса над видом боя на лодку у пирса, кейс `Sheet`: кадр `palette` — вся [палитра](../art/palette.md) именованными образцами на матовом окне; кадр `components` — стеклянные плитки над пирсом и над мелководьем и стёкла HUD (линза, уведомление, плитка расходника, слот трюма); кадр `glass` — пилюли меню и клавишные пилюли, карточки деталей, колпачки клавиш и кнопки геймпада над мелководьем и над песком, выноски. Кадр `tools` — окно инструмента с одним элементом каждого вида над лагуной (`Tooling.cs`): кнопки в покое, под указателем, путь вперёд и недоступная, поля, выбор с открытым листом, число, ползунок, переключатели, вкладки, строки и список. Всё — [базовые компоненты](../art/components.md) в своих состояниях. |\n| `Coop` | Две игры на одной машине, каждая начинает в своём море: одна открывает игру со страницы «Кооператив» меню, другая находит её в сети из своего меню и входит в море хоста: обе лодки в ходу на обоих морях, меню гостя не останавливает бой, гость швартуется у пирса хоста, и хост видит его лодку у места, гость переоснащает лодку на верфи, и хост видит лодку с новым корпусом, гость выходит из игры в своё море; опасности хоста (мины, башня, бон, батарея, пятно) у гостя (Coop/Hazards); дроны хоста и тот, что взят на борт, выброшенный (Coop/Drones); турели обеих лодок, летящие на море гостя, когда хост стреляет (Coop/Turret); свечение стоек охотника хоста перед залпом у гостя (Coop/Tell); потопленную лодку гостя поднимает хост, державшийся рядом с обломками (Coop/Revive); меню гостя сбрасывает газ, а бой идёт дальше (Coop/Paused); гость платит ящиками своего трюма за ремкомплект и бронеплиту, хост чинит и бронирует его лодку, и гость видит надпись о каждом, как и о заплате своих плотников за катерок, потопленный его ракетами, и о ремонте, который его лодка взяла с воды; хост говорит по-русски, а цель и объявление его задания гость читает по-английски (Coop/Kits). |\n| `Crowd` | Двенадцать охотников на постоянных приказах: много лодок сразу, внеэкранные дешевле. |\n| `Dialogue` | Lines: сцена сюжета, рассказанная капитаном и корабелом: реплика с каждой меткой, сказанная по буквам, пролистываемая Enter, ответ, выбранный номером, даёт монеты, ставит флаг и прыгает по нему, Esc прокручивает до ответов и до конца, а повод выбирает свою сцену. Radio: ялик в ходу под HUD, пока сцена повода радио говорится в углу, клавиши доходят до боя, второй повод радио отброшен, диалог её выключает. |\n| `Drones` | Носитель спускает на воду двух дронов рядом с собой: они охраняют его, их посылают на охотника, и они его бьют, а один отозван и взят на борт. Carrier: люлька патрульного катера под управлением игрока под HUD: «Дроны» выбраны на рулетке, Q и E посылают дронов на захват цели, Q снова отзывает одного, а потерянный дрон отстраивается в своём гнезде. Standoff: лодка другой стороны держится в стороне от носителя на ходу, дальше поводка дронов; оба дрона, посланные на неё, бьют её с края своей досягаемости и не уходят за поводок. Где она лежит (`Ahead`, `Aside`) и газ обоих (`Throttle`) — в окне «Кейс». |\n| `Editor` | Редактор карт, сыгранный указателем и клавишами: форма рельефа перетащена, мир поднят заново, отмена, охотник удалён, карта переименована, добавлено минное поле, точка добавлена и перетащена, а её радиус задан, меню и окно «Открыть». |\n| `Fleet` | UnderWay: один проект бортом к виду и в ходу; Spinning: разворот на месте одним рулём; Lineup: все корпуса в два ряда. |\n| `Fuel` | Dry: два гонщика бок о бок на полном газу с нитро, у одного бак пуст: он идёт, но меньше чем вполовину хода другого, и нитро закрыто. |\n| `Gamepad` | Только события геймпада. Sea: ялик под HUD, которым рулят, жгут нитро, стреляют, ставят дым и тратят заряд кнопкой Y. Sailing: сама игра: лодка в море, меню на Start и его страница «Инструменты», швартовка у пирса крестовиной вниз, плитки ленты, меню над лентой, верфь и «Отчалить». Подсказки показывают кнопки геймпада. |\n| `Arena` | Арена карты: Cut — первый вход играет вставку под полосами, вид стоит над ареной, пока лодка внутри, и возвращается к лодке за её пределами; Skipped — Space пропускает её; Placed — редактор, управляемый указателем: ставит арену, вставку и два кадра, привязывает, играет просмотр, сохраняет карту и читает её обратно. |\n| `Harbour` | Кольцо поплавков у пирса: Arriving — лодка с моря входит в кольцо и сбавляет ход, поплавки расступаются, фонари разгораются; кадры вида боя по секунде (час — `Hour` в окне «Кейс», ночь там же). Docking — сама игра: лодка в кольце без охотников рядом — фонари горят, охотник рядом — фонари гаснут и `Space` не швартует; без охотника `Space` швартует: лодка, пришедшая с моря носом к пирсу, встаёт у места (кадры `gliding 0`–`3`), лента поднята, HUD убран (кадр `moored`), плитка «Торговец» с пустым трюмом открывает экран корабела, `Tab` открывает верфь (кадры `coming over 0`–`3` — её вид приходит от вида боя), `Esc` возвращает к ленте, `Space` отчаливает, и руль снова ведёт лодку; охотник, подошедший к пришвартованной лодке, снимает её с места. Selling — то же с двумя ящиками в трюме: горит «Торговец», `Enter` открывает экран корабела, `Enter` продаёт выбранный ящик по полной цене, `Space` — второй, `Esc` ведёт к ленте, монеты в сохранении. Testing — `T` на верфи уводит лодку на полигон, «Назад на верфь» в его меню возвращает её к пирсу с открытой верфью, в то же море. |\n| `Hazards` | Опасности карты в открытом море: минное поле, взрывающееся цепочкой, мина, расстрелянная рядом с охотником, таранщик, огибающий мины, течение, уносящее ялик, и водоворот, затягивающий его; снаряды, падающие в своё кольцо (бомбы — тот же вид в окне «Кейс», `Kind`), кольцо башни-импульса и его бреши, батарея, ведущая огонь и разбитая в куски, прожектор, замечающий ялик, горящая нефть, бочки, которые толкают и взрывают, бон, преграждающий путь и открывающийся. |\n| `Haul` | Slots: ялик с четырьмя тюками ткани на борту собирает ящики потопленного гонщика: первый ложится в свободное место, каждый следующий встаёт на место тюка, а тюк падает за корму и остаётся; тюк дальше по курсу, не дороже самого дешёвого на борту, остаётся на плаву. Ряд трюма на HUD. Второй ялик с трюмом бочек топлива отстаёт, оставляет тюк на плаву, а в конце тонет и высыпает все бочки. Cache: тайник карты на плаву, его ящики собираются. |\n| `Hunters` | Охотники одной роли за кружащей лодкой (`Rammer`, `Swarm`): планирование, рулёж, стрельба, таран; InItsWay: побитый охотник подбирает ремонт на своём пути. Post: сторожевой пост из двух канонерок держится, пока гонщик не войдёт в зону их зрения, гонится за ним, пока видит, а когда гонщик, жгущий нитро, уходит из вида, забывает о нём и возвращается к постам. Chased: два таранщика за гонщиком бьют его с борта или с кормовой четверти. Narrows: путь таранщика к стоящей добыче лежит между двумя кекурами, стоящими теснее его ширины (`Gap` в окне «Кейс»): он нигде не застревает дольше нескольких секунд и выходит за кекуры к добыче; кадр `astern` — задний ход из щели. |\n| `Instruments` | HUD целиком над одним морем на кейс: Deep — глубокая вода, Shallows — яркое мелководье и пляж, Night — ночь. Лодка под HUD с низким топливом получает удар, жжёт нитро и ставит дым и остаётся почти без топлива; на кадрах приборы, рулетка, панель расходников, ряд трюма, уведомление, таблички цели и охотника и предложение работы. Кадр `map` — карта кораллового острова, открытая над этим морем, с кольцом на месте цели. |\n| `InterfaceSounds` | Каждая реплика интерфейса, сыгранная по очереди или та, по которой щёлкнули, чтобы её послушать. |\n| `Kits` | Расходники, оплаченные ящиками прямо из трюма: целому ялику ремкомплект не дают, ящики остаются; получив удар, он чинится (металл + ткань) и ставит бронеплиту (два металла); с почти пустым нитро баллон не дают, пока на борт не придёт ящик механизмов к бочке топлива, потом он пьёт его; заряд (взрывчатка + электрика) бьёт охотника рядом, щадя ялик, а второй, без ящиков, не дают. Панель расходников и ряд трюма в левом нижнем углу. |\n| `Landforms` | Одна из форм рельефа редактора по своему пресету в открытом море локации, лодка идёт на неё, пока берег не удержит лодку: Peak спереди, кромка перед лодкой, виденная насквозь; Reef — барьерный риф с моря, его отмель держит лодку; Sea stacks спереди; Spit спереди, кончик косы с пальмами; Bars, три отмели удерживают броненосец; Beside — броненосец без хода поставлен вплотную к отвесному кекуру: в его корпусе нет камня, и берег его не выталкивает. Вулкан, сандбар и одинокий столб выбираются в окне «Кейс» (`Form`). |\n| `Lights` | Единственный свет сцены на лодке и шарах в море, в полдень. Час (`Hour`), конструкция (`Design`) и кружение камеры (`Circling`) — в окне «Кейс»: рассвет, закат, сумерки, ночь и патрульный катер тоже там. |\n| `Menus` | Один облик меню и кнопок на кейс, над лодкой у пирса (или над боем, `AtSea`): меню, сыгранное клавишами, геймпадом и указателем, переключатель и шкала его страницы «Настройки» (шкалу шагает только собственное меню игры), предупреждение «Выход», уведомление и его отдельные кнопки; на каждом кадр сохраняется. `Current` — собственный облик игры; `Quiet`, `Glass`, `Notebook`, `Atlas`, `Device` и `Dashboard` — предложенные облики, каждый в `Looks/<Look>/`. `Motion` — движение меню полосой кадров `Menus-Motion-NNN-<этап>.jpg`: приход, линза света по клавишам и за указателем, нажатие клавишей и указателем, переключатель. |\n| `Music` | Одна музыка: нарастает от спокойствия до пика боя с каждым мотивом, затем её фанфары или плач. |\n| `Objectives` | Одно событие Арены на кейс (`Escort`, `Beacons`, `Courier`, `Cargo`, `Ironclad`) с того места, где оно начинается, под HUD: его лодки выходят в море, лодка игрока доходит до первой отметки, а потопленная проигрывает задание. |\n| `Outpost` | Станция в открытом море в свете Арены: Alongside — гонщик у её плота даёт залп в корпус, и ракеты рвутся о него, ялик, идущий в другой борт, упирается в корпус, а станция качается на зыби там, где стоит; его кадры — вид боя и шесть ближних видов (борт, нос, корма, крыши, плот, сверху). Trade — сама игра на Арене (как `Opening`): у станции с пустым трюмом, целым корпусом и полным баком Space ничего не открывает; с тремя ящиками открывает экран мытаря, Enter продаёт выбранный ящик по цене станции, остальные остаются, Space продаёт их, монеты попадают в сохранение, Esc возвращает руль. Buying — побитая лодка с полупустым баком и десятью монетами: ремонт, на который монет мало, вздрагивает и не покупается; после продажи сундука ремонт чинит корпус, топливо заполняет бак, каждое за свою цену, и обе карточки бледнеют с «полно». |\n| `Pause` | Меню игры над лодкой в море. `Menu` — страница «Инструменты» открывается вместо пунктов меню, Esc возвращает к ним, Esc на них берёт «Продолжить», «Выход» с первого нажатия только предупреждает. `Saves` — судовой журнал поверх моря: S проходит по строкам, «Загрузить» есть только у строк с сохранением; кадр `row` — выбрана строка в игре, `overwrite` — «Сохранить сюда» поверх сохранения только предупреждает; «Новая игра» с первого нажатия только предупреждает. |\n| `Pickups` | ThreeInItsPath: лодка, проезжающая по припасам нитро, ремонта, брони и топлива; TurningUp: припасы, появляющиеся вокруг неё. Supplies: припас точки снабжения взят и снова на месте. Airdrop: ящик спускается на парашюте, и взять его можно, только когда он сел на воду. |\n| `Quay` | Лодка у пирса под лентой: вид боя, придвинутый к месту у пирса, и лента «Торговец», «Верфь», «Отчалить» внизу экрана. `Moored` — лодка лежит у своего места, плитки на экране (час — `Hour` в окне «Кейс», ночь там же); `RacerRammingIt` — лодка, пущенная на настил у первого места, не въезжает на него (кадр `at the deck`). `Motion` — движение ленты полосами кадров: приход плиток, покой, свет, скользящий по клавишам и за указателем, нажатие клавишей и указателем, уход; кадры `Quay-Motion-NNN-<этап>.jpg` по порядку в папке вывода, каждые два кадра (в покое реже, пока по ряду не пойдёт полоса света), и кадр ряда в окне 1280×720. |\n| `Ramming` | Лодка таранит другую в борт: удар, невредимый таран, чинящая помпа. Charging: удар носом на нитро без тарана: бьющий получает меньше, а бьёт сильнее. |\n| `Range` | Полигон у острова: лодка въезжает среди пришвартованных и плещущихся мишеней-макетов, ближайшая тонет и снова поднимается на своём месте, лодка тонет и снова поднимается на старте. |\n| `Run` | Бесконечный заплыв Арены под HUD, его часы прокручены со стороны демо до открытия кейса. Offers: первое задание предложено около девяностой секунды, его маяк горит вдали от старта, место обведено на карте (кадр `map`). Done: маяки пройдены один за другим, задание выплачено добычей и припасами. Failed: транспорт эскорта потоплен, задание снято вместе с маяком. Ironclad: отсчёт, броненосец у причала, после его гибели он снят со списка вместе с отсчётом. |\n| `Sea` | Море с островом на его банке: волны, пена, блики, прибой, укрытие; `Shallows` выключен — открытое море. |\n| `Settings` | Локация (`Place`: Arena или Coral cay) с точки зрения боя: её вода, час, земля и досягаемость канонерки в ней. |\n| `Sites` | Косяк и обломки с точки зрения боя и в виде сбоку: рыбалка и подъём, карточка рыбы. Chosen: закреплённые обломки с ящиками карты, поднятое ложится в трюм. Sunk: затонувший охотник становится обломком. Full: в трюме без мест добыча остаётся. Косяк или обломки выбирает `Site` в окне «Кейс». |\n| `Smoke` | Дымовая завеса поставлена, дрейфует и редеет, и ослеплённый ею охотник, под HUD; тепловизор. |\n| `StoryEditor` | Редактор сюжета, сыгранный указателем и клавишами на приветствии верфи, никогда не сохраняется: отрывок добавлен двойным щелчком, набрана реплика, протянут провод, показана и исправлена ошибка, сцена рассказана как отредактирована. |\n| `Turrets` | Гонщик с двумя турелями, кружащий вокруг трёх стоящих патрульных катеров, снабженец его стороны, ложащийся в дрейф среди них, и недосягаемый ялик: турели сами поворачиваются, упреждают и стреляют только по катерам в досягаемости. Smoke: завеса патрульного катера слепит турель. |\n| `Yard` | Верфь, сыгранная указателем и клавишами: места, детали, показатели, покупка, проект, который тонет, корпус, опробованный и взятый обратно, клавиши вида; деталь, предлагаемая только на станциях, куда она подходит. Cradle: патрульный катер с люлькой, которую предлагают только позади миделя, по одной на лодку. |\n\n## Как написать демо\n\nКейс заслуживает сцены, если держит прогон на проверках, которых нет у остальных, или показывает то, чего не показывают остальные; другой ветер, зерно, проект или вид — дело окна «Кейс». Новый кейс — это сцена: скопируй одну в папке демо и поменяй значения её инспектора. Новое демо — папка со скриптом, наследующим от `Stage`, переопределяющим `Set`, чтобы поставить его вещи на воду (`Launch` выводит лодку в море), и `Checks` для того, чему прогон должен соответствовать в конце; `Seconds` — сколько прогон даёт ему играть. Сцена без моря наследует от `Demo` и строит в `Build`.\n\n## Открытые вопросы\n- [Q68](../questions/tools.md#q68): селектор и окна редактора после QA.\n"}, {"id": "tools-map-editor", "path": "tools/map-editor.md", "title": "Редактор карт", "section": "tools", "date": "2026-11-13", "md": "# Редактор карт\n\n![Редактор карт: окна в матовом стекле](../img/map-editor.jpg)\n\nРедактор в игре, в котором правят карты и их задания над живым миром.\n\n## Решения владельца\n- Редактор карт в игре, открывается из меню (с 2026-11-13 — `Esc`, «Инструменты»): локация карты (острова, рифы, отмели, вода, час, ветер, зыбь) и её задания (старт, охотники и их команды, маяки, косяки и обломки), правятся над живым миром, виденным сверху. Карты — файлы: собственные карты игрока и собственные карты игры, которые открываются в нём, чтобы их чинить.\n- Редактор расставляет арены и кадры вставок ([Камера и картинка](../gameplay/camera.md)).\n\n## Как устроено (`editor/`)\n\nОткрывается из меню `Esc`, «Инструменты», пункт «Редактор карт» (`editor/Editor.tscn`), и правит карту над её живым миром: последнюю открытую карту, её задание и вид (`user://editor.cfg`), иначе первую карту игры без заданий, Coral cay. Карт у игры две: Арена (`maps/arena.json`, одно задание, игра `run`) и Coral cay (`maps/coral-cay.json`, без заданий). Файл, в котором нет карты, никогда не открывается (`Maps.TryRead`). Вид двигается клавишами, перетаскиванием правой или средней кнопкой, колесом и прокруткой трекпада (`EditorCamera`). Формы рельефа перетаскивают, растягивают и поворачивают; числа выбранной и числа локации — ползунки со словами и единицами, которые оставляют колесо прокручивать их окно (`Inspector`, `scenery/Fields.cs`). Почему ползунки через рефлексию: в записях карты по десятку чисел, и одна панель обслуживает их все. Земля добавляется из готовых пресетов игры, с сохранением имени пресета (`Presets.Forms`, `IForm.Name`); «Удиви меня» рисует карту случайно. Мир поднимается заново, когда локация постоит неподвижно мгновение, а её название не учитывается. Старт задания, закреплённые охотники, маяки и места промысла — метки, которые перетаскивают по морю, охотники пронумерованы как в своих строках; его игра, числа и музыка — в окне «Задания». События Арены (`Events`: пути конвоя, курьера, маяков, груза, броненосца) редактор не показывает: они правятся только в JSON карты ([Q35](../questions/tools.md#q35)). Его зоны (`Areas`), среди них посты охраны с видами их охотников, добавляются из «Зон и опасностей» этого окна в середине вида и рисуются на море, угрозы красным, путь течения шевронами, тайник янтарным, припасы цветом своего предмета; точки выбранной перетаскивают, добавляют и убирают, а её числа, охотников, предметы или припасы задают в «Выбрано» (`Editor.Areas.cs`). Арена добавляется там же и рисуется сиреневым кругом, как остальные зоны; в «Выбрано» у неё список вставок, из которого её привязывают к вставке. Станция ([Станция](../world/outpost.md)) рисуется голубым: круг — вода, где идёт торговля, черта — её корпус по курсу, который задаёт ползунок.\n\nВставки задания (`Editor.Scenes.cs`) — в окне «Задания», под зонами: у каждой строка с названием и кнопками «+ Shot» (кадр ставится в середине вида), «Preview» и «Delete». Кадр рисуется на море сиреневой меткой с подписью «название · номер»; его перетаскивают, а у движущегося («Drifts» в «Выбрано») вторая метка, куда он сползает, тоже перетаскивается. В «Выбрано» у кадра ползунки секунд, высоты кадра, наклона и поворота. Предпросмотр играет вставку над живым миром под полосами, окна уходят, Space, Enter, Esc или щелчок кончают его (`ShotCamera`, `Letterbox`). Переименование вставки переименовывает её и у арен, а удаление её или её последнего кадра снимает привязку. Почему так: кадры и арены — те же метки на море, что остальное, и правятся тем же перетаскиванием.\n\nCtrl+Z отменяет; серия изменений одной вещи — как одно, вместе с тем, что было выбрано; не отменяются сохранение, переименование и корзина. Строка состояния сообщает о каждом изменении и отмене и о том, отличается ли карта от последней открытой или сохранённой; заголовок говорит, где она хранится. Его окна (`Editor.Panels.cs`) и строка состояния — окна инструментов ([Экраны и меню](../interface/screens.md)); метки и таблички на море — стекло HUD, как у охотников в бою (`Lens`, тип `Plate` в `ui/look.tres`), подсвеченное ближайшим к цвету метки светом; «Выбрано» и «Задания» делят боковую сторону в фиксированных частях, чтобы ни одно не оттесняло другое, и каждое окно складывается. Меню и окно «Открыть» берут клавиши и указатель, пока стоят (затемнение поверх окон, `EditorCamera.Still`). «Открыть» — окно карт игры и игрока, которые оно переименовывает и кладёт в корзину (`Maps.Rename`, `Maps.Delete`); нажатие, которое потеряло бы изменения или удалило, просит второго нажатия.\n\nКарты — JSON (`scenery/Maps.cs`): собственные карты игры лежат в `maps/`, карты игрока в `user://maps`. Почему JSON: карта — несколько записей, читаемых и чинимых вручную. Карта чинится при загрузке (`Mending`): то, что уронило бы игру, повесило бы её или сломало бы море (пропавший список, неизвестный вид, число за пределами диапазона своего ползунка, охотник, которого нет в этой сборке), исправляется или выбрасывается с предупреждением, а карта, которую нельзя прочесть, говорит почему. Собственные локации игры узнают по имени их файла, поэтому переименование одной не ломает игру. «Сохранить» пишет карту туда, где её открыли, собственную карту игры только когда игра запущена из своего проекта; «Сохранить как свою» пишет среди карт игрока, а затем поверх этой копии. Неудачное сохранение говорит почему словами (`Maps.Write`). «Играть» сохраняет и выводит выбранное задание на копии последнего прогресса, которая никогда не сохраняется (`Progress.Copy`), и возвращается в редактор, когда заход кончается или нажато «В редактор» в меню паузы (`back` у `Game.TakeUp`).\n\n## Открытые вопросы\n- [Q35](../questions/tools.md#q35): чего не хватает редактору карт.\n- [Q68](../questions/tools.md#q68): окна редактора и селектора после QA.\n"}, {"id": "tools-release", "path": "tools/release.md", "title": "Сборки и посты", "section": "tools", "date": "2026-11-13", "md": "# Сборки и посты\n\nКак экспортируют сборки игры и публикуют новости в канал.\n\n## Как устроено\n\n- **Сборки.** `tools/build.sh` экспортирует закоммиченный `main` из временного worktree для macOS (universal) и Windows (x86_64) в zip-архивы `builds/Pirates-<version>-<platform>.zip`, по `config/version` в `game/project.godot`, и ставит коммиту тег `v<version>`. Версии вида 0.0.N, последнее число растёт с каждым постом; когда версия станет 0.1, говорит владелец. Сборки уходят на Google Drive через rclone на Mac владельца, и посты ссылаются на них (файлы Telegram бросили: у бота потолок загрузки). Сборку для Windows никогда не запускали. Веб-экспорт сделать нельзя: Godot 4.7 не экспортирует C# в веб, а в WebGL 2 нет вычислительных шейдеров для моря. Экспорт Godot завершается с кодом 0, даже когда терпит неудачу.\n- **Посты.** `tools/post.sh` публикует в Telegram-канал игры короткий русский текст, скриншоты, клипы и ссылки на сборки (он же выкладывает их на Drive) через навык `.claude/skills/telegram-post`. Публикация публична, поэтому владелец заранее одобряет текст и медиа каждого поста. Пост о возможностях — трейлер над списком: строка на возможность, эмодзи и название из двух-трёх слов.\n- **Облачная сессия.** `tools/cloud/setup.sh` готовит машину облачной сессии (.NET SDK, Godot, Xvfb с программным Vulkan от Mesa для прогонов демо; Blender как `blender` при `BLENDER=1`); хук начала сессии `.claude/hooks/session-start.sh` запускает его, когда чего-то не хватает.\n\n## Открытые вопросы\n- [Q95](../questions/gaps.md#q95): что войдёт в 0.1 и в первый публичный релиз; предложение — [Дорожная карта](../roadmap.md).\n- [Q97](../questions/gaps.md#q97): самый слабый компьютер и проверка сборки для Windows.\n"}, {"id": "tools-story-editor", "path": "tools/story-editor.md", "title": "Редактор сюжета", "section": "tools", "date": "2026-11-13", "md": "# Редактор сюжета\n\nРедактор в игре, в котором пишут сцены сюжета. Как сцены устроены и когда запускаются: [Сцены сюжета](../story/scenes.md).\n\n## Решения владельца\n- Сюжет рассказывают сценами, которые пишут во встроенном редакторе сюжета.\n- Сцена — это граф эпизодов на холсте. Каждый эпизод — сценарий: кто говорит, с каким лицом, и реплика с метками.\n\n## Как устроено (`storyeditor/`)\n\nРедактор сюжета (в меню `Esc`, «Инструменты», после редактора карт) пишет сцены в окнах инструментов редактора карт (`Tools`). Его окно «Сцены» перечисляет файлы в `res://story`: набранное там имя переименовывает сцену и её файл, если оно не занято другой сценой; «Открыть» и «Удалить» (в корзину) просят второго нажатия, если потеряли бы изменения. Холст (`Canvas`, `GraphEdit`) показывает каждый эпизод узлом с первыми строками, первый помечен как начало; провода читаются с переходов и ответов (`Screenplay.Parse`) и никогда не хранятся, а провод, протянутый между двумя эпизодами, пишет `-> target` в конец сценария первого. Двойной щелчок по холсту или «+ Эпизод» добавляет эпизод; перетаскивание сохраняется как его X и Y; переименование переписывает переходы и ответы, которые его называют. Узлы — бледное стекло с полосой заголовка в цвете проводов, первый — зелёный, выбранный — оранжевый; их и холст рисует тема окон. Сценарий выбранного эпизода — `CodeEdit` (`ScriptEdit`), раскрашенный `Colours`: цвета строк по их роли, цвет проводов и тень строки с ошибкой — группа `Screenplay` в `ui/look.tres`. Над ним палитра печатает говорящих, лица, метки и шаги; отмена в нём — собственная для редактора. Под ним перечислены ошибки (`Screenplay.Faults`), берущие клавиши к своей строке, а строки с ошибками помечаются по мере набора сценария. Окно «Сцена» хранит имя, повод, условие, приоритет и признак «Только один раз». Сохранить (Ctrl+S) пишет файл; Играть (F5) рассказывает сцену как она есть, сохранённую или нет, с `Teller` на копии последнего прогресса, которая никогда не сохраняется, и редактор снова берёт клавиши, когда она кончится.\n"}, {"id": "vision", "path": "vision.md", "title": "Об игре", "section": "", "date": "2026-11-13", "md": "# Об игре\n\n![Арена: охотники идут на лодку игрока у острова](img/arena.jpg)\n\nFloppa Tropical Adventures коротко: что это за игра и в каком она состоянии.\n\n## Решения владельца\n- Игра называется Floppa Tropical Adventures. Код и репозиторий по-прежнему называют её Pirates; игроку это слово не показывается.\n- Аркадная морская игра: одна лодка, которой управляешь с весёлым ощущением моторной лодки, а не физикой, бой с вражескими лодками на красивом море, статичный изометрический вид 2.5D.\n- Веселье важнее реализма: где реалистичная модель делает игру медленной или раздражающей, делаем то, что делают выпущенные игры. Реализм оставляем только там, где он делает игру лучше.\n- PC.\n- Кооператив по сети до четырёх игроков, каждый в своей лодке ([Онлайн-кооп](online.md)).\n- Сеттинг — оптимистичный соларпанк спустя долгое время после падения ([Сеттинг и лор](story/setting.md)).\n- 60 кадров в секунду достаточно; качество картинки важнее (2026-10-26).\n\n## Как играется\n- Игра сразу начинается в море, на [Арене](gameplay/missions.md): одна большая карта ([локация](world/locations.md)) и бесконечный заход. Лодка дерётся с [охотниками](gameplay/hunters.md), которые выходят с [постов](world/areas.md) карты, берёт задания и собирает [добычу](gameplay/haul.md) в трюм.\n- Добычу продают за монеты в [гавани](base/pier.md), мастерской корабела на острове, или у плавучей [станции](world/outpost.md). К причалу доплывают сами и швартуются на `Space`: лодка остаётся в мире, а над морем встаёт лента «Торговать», «Верфь», «Отчалить». На [верфи](base/boatyard.md) на монеты покупают детали лодки, оттуда же выходят на [полигон](base/testing-ground.md).\n- Утонув, лодка теряет трюм, а игра загружается с последнего сохранения ([Прогресс и сохранения](gameplay/progression.md)).\n\n## Состояние\n- Всё — прототип, и ничто не высечено в камне ([Главная](README.md)).\n- Задания и броненосец Арены — заглушки, а не настоящие. Честность и доступность настраиваются ближе к релизу. Будут новые функции.\n- Владелец судит игру, играя; многое из сделанного в ноябре 2026 он ещё не играл ([Журнал решений](decisions.md)).\n- Версии 0.0.N выходят с постами в канале игры ([Сборки и посты](tools/release.md)).\n- Игра идёт к полному релизу в Steam; что делаем до него и в каком порядке: [Дорожная карта](roadmap.md).\n- Как мы делаем игру — принципы и правила проекта: [CLAUDE.md](../CLAUDE.md).\n"}, {"id": "world-areas", "path": "world/areas.md", "title": "Зоны и опасности", "section": "world", "date": "2026-11-12", "md": "# Зоны и опасности\n\n![Горящее нефтяное пятно](../img/slick.jpg)\n\nЗоны — места на карте: посты охраны, минные поля, течения и прочие опасности. На Арене (`maps/arena.json`) их около сорока.\n\n## Решения владельца\n- Директора нет (2026-11-11): охотники выходят только с постов охраны, поставленных на карте. Охотников поста выбирают в редакторе по одному: проект, роль, команда.\n- Течения — ускорители, аркадный элемент (2026-11-10): их коридоры несут лодку заметно быстрее её хода. Они лежат поверх моря (2026-11-11): бирюзовые светящиеся шевроны-стрелки, как ускоритель на гоночной трассе, без видимых краёв коридора; водоворот — четыре спиральных рукава.\n\n## Как устроено\nКарта отмечает зоны (`Area.cs`, хранятся в её файле по видам): круг вокруг одной точки или коридор вдоль цепочки точек шириной в свой радиус в каждую сторону (`Shape`). Почему одна форма: редактор рисует, двигает и размеряет любой вид одинаково, а коридор угроз получается даром. Зоны ставятся в начале захода и убираются вместе с ним. Опасности, течения и станция ложатся на каждой машине из общего зерна (`Laying`): решают опасности хоста, у гостя они только показаны. Посты, тайники и точки припасов (`Places`) живут только на хосте ([Онлайн-кооп](../online.md)).\n\nНа Арене стоят шесть постов, семь течений, пять батарей, восемь точек припасов, тайники, обстрелы, нефть, бочки, боны, минное поле, арена у поста броненосца и станция. Импульсных башен и прожекторов на ней нет: владельцу они показались странными, башня «толкала» лодку, и их место заняли батареи (решение без владельца, [Q143](../questions/world.md#q143)). Сами виды остались для других карт.\n\n- **Посты охраны** (`Posts`, `Places`): охотники вдоль поста лицом в его сторону или вокруг середины круга лицом наружу ходят у поста и охотятся на ту лодку, которую видят ([Охотники и ИИ](../gameplay/hunters.md)). Пока лодка игрока внутри зоны поста или когда бьют одного из его охотников, весь пост берёт ближайшую лодку на любом расстоянии (`Captain.Rouse`). «Вернуться через» (`Post.Every`): столько секунд после гибели последнего охотника пост выводит их заново, но только когда ни одна лодка игрока не видит зону (ближе дальности зрения стражи); 0 — не возвращаются. Почему вне вида: охотники не появляются из воздуха на глазах (решение без владельца, [Q149](../questions/world.md#q149)).\n- **Минные поля** (`Mines`, `MineModel`): старые рогатые мины на плаву, качающиеся, с красной мигающей лампой, не менее метра глубины. Корпус, коснувшийся мины, или попавший в неё снаряд подрывает её; её взрыв после короткого запала подрывает те, что в досягаемости, так что поле взлетает цепью.\n- **Течения** (`Currents`, `Chevrons`, `chevrons.gdshader`): вода, бегущая вдоль коридора со своей скоростью, рисуется рядами шевронов, бегущих с водой по ленте, лежащей на волнах; ряды гаснут к краям коридора и к его концам. Вокруг одной точки — водоворот, который поворачивает корпуса вокруг своей середины и втягивает их; его шевроны — четыре спиральных рукава, гаснущих в тихой середине. Лодка движется собственным ходом через воду плюс ходом воды (`Boat.Water`, `Manoeuvring`), а плавающий хлам дрейфует вместе с ней.\n- **Обстрелы** (`Barrages`, `Warnings`, `Descents`, `FallModel`): пока лодка в нём или рядом, каждые несколько секунд падение, чаще всего на лодку в нём: на воде заполняется красное кольцо, затем снаряд с дымным хвостом или горящая вулканическая бомба, парящая там, где упала, падает в него и разрывается. Почему кольцо: быстрая лодка его читает и уходит.\n- **Импульсные башни** (`Towers`, `TowerModel`, `PulseRings`, `pulse.gdshader`): старая стальная решётчатая мачта на скале, стеклянный шар которой набухает перед каждым импульсом. Сине-белая стена брызг расширяется до радиуса, медленнее лодки на ходу, с одним или двумя просветами, ставящимися заново при каждом импульсе (`Gap`); корпус, который она пересекает вне просвета, получает удар и отбрасывается наружу.\n- **Батареи** (`Batteries`, `BatteryModel`): ракетная установка охотников на сваях, её пусковая поворачивается к ближайшей лодке игрока в досягаемости и бьёт красными залпами с упреждением, с установки, а не с лодки (`Gunnery.Launch`). Снаряды и взрывы разносят её на куски: пусковая падает, и она горит. HUD обводит кольцом стоящую так же, как охотника (`combat/Mark.cs`).\n- **Прожекторы** (`Searchlights`, `SearchlightModel`, `beam.gdshader`): стальная башня, чей луч шарит по кругу. Лодку игрока, на которую он падает, вне дыма, замечают: луч держится на ней красным, HUD предупреждает, поднимаются все посты. Лодку замечают снова лишь после передышки.\n- **Нефтяные пятна** (`Slicks`, `Spill`, `oil.gdshader`): тёмная плёнка на море с бочками на плаву в ней. Снаряд, упавший в неё, взрыв бочки или взрыв поджигает её; огонь идёт оттуда, каждая часть горит какое-то время и гаснет, бьёт корпуса, лежащие в ней, и подрывает бочки в ней. Её нефть и огонь — сетка, которую шейдер читает как текстуру.\n- **Бочки с топливом** (`Drums`, `DrumModel`): красные бочки на плаву. Снаряд, взрыв или корпус и бочка, сошедшиеся резко (таранщик, пролетающий насквозь), взрывают её цепью, как мины; медленный нос толкает её, и она дрейфует, замедляясь, по течениям.\n- **Боны** (`Booms`, `BoomModel`): малиновые поплавки на цепи, лебёдочная будка у первой точки с лампой: зелёная — открыто, красная — закрыто, янтарная — перед сменой. Закрытый, он для корпусов стена (`ships/Contact.cs`); открытый — отведён в сторону вокруг своей лебёдки. Открывается и закрывается по таймеру или остаётся закрытым, пока лебёдку не разнесут на куски.\n- **Основания** (`Footings`): скала башни, сваи батареи, опоры прожектора и корпус станции — тоже стены.\n- **Препятствия** (`Obstacles`, `ai/Feelers.cs`): охотники обходят мины (карты и сброшенные лодкой), бочки, горящую нефть, боны и основания.\n- **Тайники** (`Caches`): ящики, названные картой, на плаву вокруг неё и больше нигде не находимые, собираются в трюм.\n- **Точки припасов** (`Depots`): припас своего вида лежит в ней, пока его не возьмут, а через некоторое время появляется другой.\n- **Арены** (`Arena`, `Arenas`): круг, внутри которого вид игрока стоит над серединой вместо того, чтобы следовать за лодкой ([Камера и картинка](../gameplay/camera.md)), и откуда первый вход лодки игрока запускает вставку, названную в `Scene`. Это только вид: ни хост, ни бой, ни сеть арены не читают, и на море она ничего не рисует; редактор рисует её, как остальные зоны.\n- **Станция** (`Outpost`, `Outposts`): плавучая торговая станция, единственная мирная зона; у неё своя страница, [Станция](outpost.md).\n- **Затонувшие тайники** (`activities/Site.cs`, `Wreck`): обломки, отмеченные на карте, хранят названные предметы, которые кран-захват поднимает вместо добычи.\n"}, {"id": "world-ground", "path": "world/ground.md", "title": "Рельеф", "section": "world", "date": "2026-11-12", "md": "# Рельеф\n\n![Остров на отмели и коса](../img/shallows.jpg)\n\nРельеф — земля локации, склеенная из форм рельефа в одно поле высот.\n\n## Решения владельца\n- Карты содержат больше видов земли, каждый ставится в редакторе карт и разнообразится зерном и несколькими числами: горы и вулканы, барьерные рифы, кекуры, косы и песчаные отмели.\n- Горы — голый камень примерно до 120 м: серый камень и отвесные скалы, зелень только у подножия. Земля, закрывающая лодку, становится прозрачной вокруг неё.\n- Барьерный риф — полоса коралла прямо под водой, вдоль берега или дугой в море: зыбь белым разбивается вдоль неё, за ней лежит спокойная бирюзовая лагуна, и в ней прорезаны проходы.\n- Кекуры — карстовые башни высотой от 10 до 40 м: серые столбы с отвесными стенами, подточенные у воды, увенчанные джунглями, как в заливах Пханг Нга или Халонг.\n- Косы и песчаные отмели: белые отмели чуть над водой среди светящегося бирюзового мелководья; длинные косы, загибающиеся от берега, с травой на дюнах и пальмами на конце; и валы чуть под водой, через которые прибой разбивается рядами, слишком мелкие для тяжёлой лодки.\n\n## Как устроено\nФормы рельефа локации сводятся в одно поле высот (`Ground`): каждая точка так высока, как самая высокая форма там, скруглена там, где две встречаются, и покрыта так, как покрывает та форма. Оно обслуживает меш земли, море над ней, кили, рули и ракеты (`World.Ground`, где палубы пирса стоят как земля).\n\n- **Острова** (`Island`, `IslandForm`): берег, пляж, холмы и песчаная банка мористее, уходящая к открытому дну. Берег меняется от песчаных бухт до скальных обрывов. Овраги режут холмы шумом эродированного рельефа, закэшированным на сетке (`common/Raster.cs`). Почему не эрозия: с большой высоты острову нужны лишь долины, которые читаются. Почему банка кея лежит на 5 м: глубже, чем ломаются волны открытого моря, поэтому они пересекают её целиком и разбиваются на пляже.\n- **Горы** (`Mountain`): голый камень от открытого дна, зелёный только у подножия: конус, вытянутый вдоль хребта, опущенный в седловинах между плечами широким шумом, с отрогами, расходящимися от вершины хребтовым шумом, обвитым вокруг и вытянутым вниз по склону, поднимающийся отвесным обрывом от ватерлинии, с дном, уходящим под обрыв и сходящим на нет у пляжа. Кратер выдалбливает вершину вулкана. Почему не террасные полосы обрыва и не эрозия: с большой высоты и то и другое читается как ямы и ступени, а не как камень. «Пик», «Хребет» и «Вулкан» в редакторе, обведённые на протяжении хребта; на Арене стоят хребет (`Ridge`) на западном острове пролива и вулкан (`Volcano`).\n- **Рифы и отмели** (`Atoll`, `Reef`, `Flats`): кольцо рифа атолла вокруг лагуны с проходами и пятнами рифов; барьерный риф — дуга такого, изогнутая от почти прямой до полукольца, с лагуной полосой позади, сужающейся к концам, за которыми оба уходят к открытому дну; отмели дельты — мелкое дно с протоками там, где шум пересекает нуль, как рисуют реки в играх. «Барьерный риф» в редакторе; он есть на Арене и на карте Coral cay; на Арене есть ещё атолл и отмели дельты (`The flats`).\n- **Кекуры** (`Stacks`): карстовые башни на мелком шельфе, держащиеся порознь, самая высокая первой: бугристые столбы с отвесными стенами, куполообразные верхушки под джунглями. Почему нет подмыва: земля — поле высот, оно не может нависать. «Кекуры» и «Одинокий кекур» в редакторе.\n- **Косы и отмели** (`Spit`): вал песка вдоль линии, загибающийся всё круче к концу, купол поперёк него от гребня к песчаному подножию, достаточно широкий, чтобы гребень стоял на уклоне, на котором лежит песок, и сужающийся к концам, с дюнами вдоль гребня, достаточно высокими для травы, с бирюзовым мелководьем вокруг; валы рядом рядами разной длины, каждый дальше от первого на шаг глубже, так как укрытие успокаивает волну до самой мелкой глубины, которую она прошла, и зыбь разбилась бы лишь на первом валу. Пальмы растут вдоль гребня высокого конца (`Palms`). «Песчаная отмель», «Коса с загибом» и «Подводные валы» в редакторе, размеры по их ширине; на Арене у острова базы есть коса с загибом, а дальше — подводные валы.\n- **Покров и меш** (`Cover`, `Vegetation`, `Crowns`, `Palms`, `GroundMesh`, `Seabed`, `ground.gdshader`, `Palette`): зонирование как у карибского острова, от песка до леса, в цветах локации. Один меш на всю землю: ограниченное квадродерево, мелкое над сушей и у ватерлинии и крупнее под водой, веером к более мелкому соседу, чтобы не открывалась щель. Почему один: формы рельефа пересекаются, и два меша там боролись бы. Луга морской травы получаются из шума, запечённого в текстуру, которую шейдер читает по пикселям (`Meadows`). Каждый бор, дошедший до ватерлинии, посылает плёнку вверх по пляжу позади пенного фронта.\n- **Мангровая кайма** (`Mangroves`, `mangroves.gdshader`): там, где локация растит мангры, берег каждого острова несёт кайму, построенную отдельно от меша земли, так что земля и море под ней не меняются: купол на ячейку решётки у ватерлинии, смыкающиеся в один полог, с корнями-подпорками, уходящими в воду, в листве леса (`ground_foliage`). Почему купола: кроны — лопасти края, без выреза, который надо согласовывать. Лодки проходят сквозь неё без помех.\n\nСм. также: [Локации](locations.md), [Редактор карт](../tools/map-editor.md).\n"}, {"id": "world-locations", "path": "world/locations.md", "title": "Локации", "section": "world", "date": "2026-11-13", "md": "# Локации\n\nЛокация — набор значений для общих моделей мира: она выглядит и играется так, как велит её природа.\n\n## Решения владельца\n- Открытый мир сражается в локации Арены со своей водой, часом, ветром и волнами: открытые банки под сильными пассатами, а гавань, мастерская корабела (`Dock`), стоит у острова `Home cay`.\n\n## Как устроено\nЛокация (`scenery/Setting.cs`) — один набор значений для общих моделей: час, на котором держится небо, сила пассатов и зыбь (`Knots`, `Swell`), что содержит вода, палитра земли и что на ней растёт, формы рельефа, стоит ли база и музыка; всё это хранится вместе с миссией карты в её файле (`maps/*.json`, `scenery/Maps.cs`). `World` поднимается из неё за шторкой загрузки, из зерна мира, общего для всех игроков в коопе; направление пассатов (`Trades`) каждый раз выбирается заново. На картах с `Setting.Base` `World` ставит пирс (`Dock`) у первого острова карты.\n\nВ игре одна локация, Арена (`maps/arena.json`, `Setting.Arena`). Вторая, коралловый островок (`maps/coral-cay.json`, `Setting.CoralCay`), без миссий: на ней стоят демо. Лодки встают на ближайшей воде, которую `World.Deep` находит достаточно глубокой для их килей по всему кругу корпуса, каким бы курсом он ни встал, так что рядом с отвесной скалой ни одна не стартует с камнем внутри; старт Арены — в [Арене](../gameplay/missions.md).\n\nСм. также: [Рельеф](ground.md), [Море](sea.md), [Редактор карт](../tools/map-editor.md).\n"}, {"id": "world-outpost", "path": "world/outpost.md", "title": "Станция", "section": "world", "date": "2026-11-13", "md": "# Станция\n\n![Станция на Арене, лодка у её плота](../img/outpost.jpg)\n\nПлавучая торговая ботаническая станция «Мария»: большой старый корпус, поставленный на якорь навсегда, с садом и рынком на нём. К ней подходят продать добычу, не возвращаясь в гавань у пирса.\n\n## Решения владельца\n- В игре есть плавучая торговая ботаническая станция, большой корабль-станция по картинке владельца (2026-11-11): синий деревянный корпус-бочонок, надстройка в несколько ярусов с открытыми галереями, стеклянный свод оранжереи, сад на каждой палубе и крыше, мачта с гирляндами. Смоделирована в Blender.\n- Станцию зовут «Мария», по-английски Mariia (2026-11-12).\n- Имя написано на носу по обоим бортам, латиницей (MARIIA), золотыми прописными с засечками, на тёмно-синей панели фальшборта под планширем, где его видно из вида боя; кустов над ним нет (2026-11-12).\n- Облик проверяет QA-агент, пока станция не выглядит как в лучших инди-играх.\n- Стёкла станции настоящие, прозрачные: сад виден сквозь них (2026-11-11). Это новый материал для игры.\n- «Мария» покупает ящики дешевле гавани и продаёт за монеты ремонт и топливо; деталей не продаёт (2026-11-12). Торгует на ней мытарь, на экране торговца ([Добыча](../gameplay/haul.md), 2026-11-13).\n\n## Как устроено\n- **Модель** (`tools/outpost.py`, `blender -b -P tools/outpost.py` пишет `game/areas/outpost.glb`): строится из кода, цвет и отделка каждой грани лежат в вершинах, как у пирса ([Ассеты](../tools/assets.md)). Корпус-бочонок 46 м с золотыми поясами, борта выпуклые и завалены внутрь. На баке рынок под навесами вокруг грядки с большим деревом. Посередине дом в четыре яруса: открытая галерея с прилавками, над ней остеклённый ярус с балконом, выше остеклённый зал оранжереи под стеклянным сводом. Посередине свод раскрыт, и сквозь проём в латунной раме растут пальмы. На корме башня в два этажа с садом на крыше и гигантскими листьями. Мачта с фонарями и флажками. По левому борту плавучий плот с лавкой под самым большим навесом и высоким шестом с золотой монетой и листом на ней; с плота лестница на палубу. У деревьев раздвоенный ствол и широкие гранёные кроны трёх складов, растения грядок десяти видов и стоят неровно. Окна прорезаны в стенах насквозь, и за стёклами зала, яруса и башни стоят настоящие грядки и банановые пальмы. Два проёма зала по левому борту открыты, и листья растут из них наружу.\n- **Имя** (`name()` в `tools/outpost.py`): буквы шрифта EB Garamond из игры, выпуклые и золочёные, лежат по обшивке вдоль её поясов на тёмно-синей панели фальшборта в золотой рамке, между верхним золотым поясом и планширем. По левому борту имя читается от носа к корме, по правому — к носу. Панель стоит под планширем, а не ниже, между золотыми поясами: там имя из вида боя закрывают плот, шест с монетой и флаг. Кустов на планшире над именем нет.\n- **Стекло** (`common/glass.gdshader`, `Surfaces.Glass`): все стёкла станции лежат в сетке `Glass`. Её рисует вариант шейдера поверхностей: тот же свет, но стекло видно насквозь, яснее при взгляде прямо и зеркальнее при скользящем, а блик остаётся целым. Стекло не пишет глубину, рисуется после моря и не бросает тени: солнце освещает сад внутри сквозь него. Стёкла лодок и фонари пирса остались непрозрачными ([Q156](../questions/world.md#q156)).\n- **Что в модели кроме сеток**: круги `Foot…`, где станция твёрдая, точки `Lap…` по её ватерлинии и `Berth`, середина плота. Тени бросает всё, кроме стёкол: мачта, флажки, деревья и рёбра оранжереи ложатся на море тонкими ровными линиями, потому что тени солнца подогнаны под вид ([Свет и время суток](../art/light.md)).\n- **Зона карты** (`Outpost` в `areas/Area.cs`, `Outposts`): точка, радиус и курс носа. `Laying` ставит станцию на каждой машине одинаково, на ближайшей к точке воде глубже её киля на всю длину корпуса. Корпуса упираются в неё, как в основания башен (`Footings`), охотники её обходят, а снаряд рвётся о неё без вреда. Она слегка качается на зыби, у её ватерлинии зыбь оставляет тонкую пену, а вымпел повёрнут по ветру и полощется.\n- **Торговля** (`Game.Offered`, `Game.Trade`, `ui/Counter.cs`): лодка, сбавившая ход в радиусе станции, когда рядом нет охотников, получает подсказку `Space` «Торговать на „Марии“». По `Space` открывается экран мытаря ([Добыча](../gameplay/haul.md)). «Мария» платит за ящик долю цены гавани, целыми монетами, не меньше одной, и продаёт «Ремонт» и «Топливо»: ремонт — за удары, которых не хватает корпусу, топливо — за литры, которых не хватает баку. Когда не хватает ничего, карточка бледнеет с надписью «полно». Если монет мало, карточка вздрагивает, а цена на ней красная, как у детали на верфи. Купленное действует сразу. С пустым трюмом, целым корпусом и полным баком экран не открывается, а HUD говорит «Торговать нечем». Доля и цены — [Баланс экономики](../balance/economy.md), решение без владельца, [Q177](../questions/haul.md#q177).\n- **Место швартовки**: у внешнего края плота на воде то же кольцо стеклянных поплавков с фонарями, что у пирса (`Mooring`, [Гавань](../base/pier.md)): спокойное вдали, фонари ярче у плота, гаснут, когда рядом охотники. Кольцо у станции — решение без владельца ([Q158](../questions/world.md#q158)).\n- **На Арене** (`maps/arena.json`): одна станция в открытой воде примерно в 400 м от середины `Home cay`, левым бортом и плотом к виду (решение без владельца, [Q155](../questions/world.md#q155)).\n- **В редакторе карт**: «+ Станция» в «Зонах и опасностях»; круг — вода, где идёт торговля, черта — корпус по курсу, курс задаётся ползунком ([Редактор карт](../tools/map-editor.md)).\n- **Демо** `Outpost` ([Демо](../tools/demos.md)).\n\n## Открытые вопросы\n- [Q155](../questions/world.md#q155): где стоит станция и сколько их.\n- [Q156](../questions/world.md#q156): прозрачное стекло на лодках и пирсе.\n"}, {"id": "world-sea", "path": "world/sea.md", "title": "Море", "section": "world", "date": "2026-11-12", "md": "# Море\n\n![След лодки на открытом море](../img/sea.jpg)\n\nМоре — вода игры: волны, укрытие и прибой, кильватерные следы, пена, отражение и цвет.\n\n## Решения владельца\n- Красивый океан.\n- Остров с большой площадью мелководья рядом, чтобы море выглядело красиво.\n\n## Как устроено\n`sea.gdshader` собирает всё это под единой световой моделью сцены (`sky/sunlight.gdshaderinc`). Облик моря по решениям владельца — в [Облик мира](../art/world-look.md).\n\n- **Волны** (`Waves`, `WaveSpectrum`, `WaveSimulation`, `waves_*.glsl`): океан на БПФ на GPU, ветровое волнение и зыбь локации в трёх каскадах, уложенных со случайными смещениями, так что узор не повторяется (`Tiling`). Длинные волны считает CPU: `SeaSurface.HeightAt` и `HeadAt` читают их с учётом укрытия и глубины. Клипмапы (`clipmap.gdshaderinc`) центрируются на фокусе вида, их ячейки так же грубы, как пиксели вида в фокусе позволяют, а далёкая от вида вода не читает волн. Почему: каждая вершина читает волны, около миллисекунды на кадр при полном размере. `SeaMotion` пишет движение моря для апскейлера.\n- **Укрытие и прибой** (`Shelter`, `SeaGround`, `surf.gdshaderinc`, `bores.gdshaderinc`): при загрузке земля сэмплируется на сетку, которую читают шейдер и корпуса, и это стоит одинаково, сколько бы форм рельефа ни присоединилось. Каждая ячейка другой сетки смотрит против ветра через разброс волн; земля останавливает волны, мелководье срезает их, как обрушение, а размытие загибает их в подветренную сторону. То, что убрала глубина, уходит бором, который катится вдоль изобат и кладёт пену. Почему рваные фронты: с высоты боя гладкий бор читается как жёсткая полоса.\n- **Следы** (`Wakes`, `wakes_*.glsl`, `wakes.gdshaderinc`): карта вокруг вида, которую каждый корпус давит по своим обводам и смещает там, где прошло его тело (`WakeSource`), поэтому она плотная и тянет кельвиновский след. Вода бурлит там, где ломается гребень и за корпусом на ходу; пена и бурление дрейфуют вместе с течением поверхности, так что след остаётся там, где создан. `Wakes.Splash` открывает воронку там, где что-то бьёт по воде. Проходы идут после движения корпусов (`common/AfterMoves.cs`).\n- **Пена** (`Foam`, `FoamPattern`, `foam.*`): одна модель для барашков, прибоя, следов и брызг, освещённая как рассеивающий слой. Редеющая пена вытягивается в линии там, где течение сходится, сохраняя пузырьки, так что старый след распадается на кружево, а не на серую плёнку. Почему одно значение бурления, а не модель турбулентности: с высоты боя она читается так же.\n- **Сухие кокпиты** (`Cockpit`, `cockpits.gdshaderinc`): море не рисуется в открытом кокпите корпуса. Почему: поле высот стоит внутри корпуса лишь настолько низко, насколько его продавленная впадина.\n- **Отражение** (`reflection.gdshaderinc`, `tracing.gdshaderinc`, `DepthPyramid`, `LightPyramid`, `ScreenPyramid`): отражения в экранном пространстве, трассируемые конусом через пирамиду глубины; за экраном — небо. Конус собирает свет только с того, что стоит над уровнем тихой воды, чтобы дно и подводные борта не попадали в отражение; в ложбине волны низ поплавка или борта стоит над водой, но ниже этого уровня, и там луч берёт свет самого пикселя, в который попал, а не неба. Почему хватает экрана: при изометрическом наклоне отражённый луч покидает его только у верхнего края. `facets.gdshaderinc` усредняет наклоны, которые пиксель не разрешает, в том числе волны короче нескольких пикселей, так что они читаются как блеск, а не зерно; `glints.gdshaderinc` мерцает солнечной россыпью (`UltraWater-LICENSE.txt`), редкой и яркой, без пыли одиноких граней вне её пути.\n- **Цвет и каустика** (`optics.gdshaderinc`, `refraction.gdshaderinc`, `WaterBody`, `Caustics`): цвет воды из того, что она содержит, дно видно через преломление, каустика ложится на то, что под водой. Только во внешнем виде: тонкая каустическая сеть коротких волн показывается наполовину поверх широкой сети длинных, а лицо воды над отмелями спокойнее, чем стоят волны, и возвращается к ним мористее ([Облик мира](../art/world-look.md)).\n"}, {"id": "hulls-runabout", "path": "hulls/runabout.md", "title": "Катерок", "section": "hulls", "date": "", "md": "# Катерок\n\n![Катерок](../img/parts/Hull-Runabout.jpg)\n\nМеньше и легче всех: быстрее всех разгоняется и поворачивает, но держит мало ударов.\n\nсамый лёгкий и резкий, но держит два удара. Под сильным мотором самый быстрый.\n\nЗначения — из таблицы «1. Корпуса» на странице [Баланс лодок](../balance/boats.md#1-корпуса).\n\n## Упоминания\n- [Баланс экономики](../balance/economy.md)\n- [Баланс оружия](../balance/weapons.md)\n- [Глоссарий](../glossary.md)\n- [Вопросы: лодка](../questions/boat.md)\n- [Вопросы: добыча](../questions/haul.md)\n- [Вопросы: мир и облик](../questions/world.md)\n- [Демо](../tools/demos.md)\n", "info": [["Длина, м", "4,8"], ["Ширина, м", "2"], ["Масса, т", "0,9"], ["Удары", "2"], ["Станции", "1"], ["Трюм, мест", "4"], ["Бак, л", "27"], ["Мест снаряжения", "1"], ["Цена", "120"], ["Сцепление", "2"], ["Круг, длин", "1,5"], ["Ответ поворота, с", "0,15"], ["Ход", "2,9"]], "src": "wiki/balance/boats.md"}, {"id": "hulls-skiff", "path": "hulls/skiff.md", "title": "Ялик", "section": "hulls", "date": "", "md": "# Ялик\n\n![Ялик](../img/parts/Hull-Skiff.jpg)\n\nМаленькая открытая лодка: лёгкая, вёрткая, потопить нетрудно.\n\nстартовый, бесплатный, открытый; четыре удара, две станции.\n\nЗначения — из таблицы «1. Корпуса» на странице [Баланс лодок](../balance/boats.md#1-корпуса).\n\n## Упоминания\n- [Баланс экономики](../balance/economy.md)\n- [Баланс оружия](../balance/weapons.md)\n- [Лодка](../gameplay/boat.md)\n- [Бой](../gameplay/combat.md)\n- [Глоссарий](../glossary.md)\n- [Вопросы: добыча](../questions/haul.md)\n- [Вопросы: миссии](../questions/missions.md)\n- [Вопросы: мир и облик](../questions/world.md)\n- [Демо](../tools/demos.md)\n", "info": [["Длина, м", "6"], ["Ширина, м", "2,2"], ["Масса, т", "1,75"], ["Удары", "4"], ["Станции", "2"], ["Трюм, мест", "5"], ["Бак, л", "30"], ["Мест снаряжения", "1"], ["Цена", "0"], ["Сцепление", "2,2"], ["Круг, длин", "1,6"], ["Ответ поворота, с", "0,18"], ["Ход", "2,85"]], "src": "wiki/balance/boats.md"}, {"id": "hulls-punt", "path": "hulls/punt.md", "title": "Плоскодонка", "section": "hulls", "date": "", "md": "# Плоскодонка\n\n![Плоскодонка](../img/parts/Hull-Punt
