y.md).\n\n**Где стоит заход** (`Whereabouts` в `progress/Progress.cs`, `Game.Note`, `Game.Resumed`): с прогрессом сохраняются зерно мира, лодка у причала (номер места) или в море (место и курс), её бак, повреждения корпуса и плит и ящики трюма по названию. Загрузка поднимает тот же мир из того же зерна и ставит лодку как была, в покое. Охотники, броненосец, патруль, рабочие лодки, предметы на воде, открытое задание и розыск не сохраняются: они встают заново, как при старте. Это решение без владельца ([Q241](../questions/missions.md#q241)). Гость в коопе, проба карты и своя карта места не пишут: остаётся прежнее.\n\nАвтосохранение (`Progress.Autosave`, через `Game.Save`) пишет в слот, который в игре: при старте захода (новая игра, загрузка, после гибели; при запуске под главным меню — нет, игра стоит как загружена), при швартовке у причала, при уходе с экрана торговца (в гавани и у станции), при выходе из верфи, при «Выходе» и закрытии окна, перед «Инструментами», перед входом в чужую игру и перед загрузкой другой записи. При новом рекорде полёта и найденной посылке оно пишет только прогресс, а место лодки остаётся прежним. В море она сохраняется сама, когда с последнего сохранения прошла минута и рядом нет охотников (`Game.Autosaving`, те же охотники, что не дают швартоваться); гость и пробный заход так не сохраняются. Новая игра занимает первый пустой слот, а когда заняты все, сохраняется только вручную ([Q50](../questions/interface.md#q50)). Слотов пять; сохранить, загрузить и начать заново можно в судовом журнале ([Экраны и меню](../interface/screens.md)). Сохранение пишется рядом со слотом и переименовывается поверх него, так что неудачная запись оставляет слот как был; слот, который не читается, ничего не загружает.\n\nВерфь, где покупаются детали, описана в [Верфь](../base/boatyard.md).\n"}, {"id": "gameplay-rivals", "path": "gameplay/rivals.md", "title": "Соперники", "section": "gameplay", "date": "2026-11-15", "md": "# Соперники\n\nСоперники — другие команды в море, которые собирают добычу и дерутся со всеми. Это и есть система заклятых врагов игры: команда помнит, чем кончилась прошлая встреча с игроками, и говорит об этом по радио.\n\n## Решения владельца\n- 2026-11-15 соперники вернулись. Владелец назвал систему заклятых врагов («nemesis») среди того, о чём мечтает ([отчёт](../reports/2026-11-15-dream-games.md)), и на вопрос, не о соперниках ли это, снятых 11-10, ответил: да, вернуть их.\n- Соперники, как в шутере с добычей: кроме охотников, по морю ходят другие команды. Они грабят и бьют всех — игроков, охотников и друг друга — и со временем растут, как и игроки.\n- Восемь капитанов-соперников, каждый — архетип флоппы с командой, лодкой в своих цветах, портретом и голосом: старый морской волк, молодой гонщик, громила, контрабандист, мастеровой, сорока, наёмник и дуэлянт. У каждого свой тон: одни честные, спортивные соперники, другие злые и опасные. Они говорят по радио.\n- В море разом две команды соперников.\n\n## Как устроено\n- **Команды** (`rivals/Rivals.cs`, `progress/Rival.cs`): их ведёт хост. Две команды из восьми, записанных в сохранении, названные по архетипам своих капитанов (`Rival.Names`). Каждая ходит на своей стороне (`Sides.Rivals` плюс её место в составе) и в своей ливрее ([Облик лодок](../art/boats.md)). Соперник бьёт банду, пиратов, другие команды и лодки игроков, а рабочие лодки и патруль не трогает; удар по соперничьей лодке не поднимает розыск (`Sides.Fights`, [Розыск и патруль](wanted.md)).\n- **Откуда приходят и куда уходят** (решение без владельца, [Q258](../questions/missions.md#q258)): команда входит в море с края карты, у выхода, от которого все лодки игроков дальше 600 м, — у тех же выходов, что и рабочие лодки ([Жизнь моря](../world/life.md)). Она бродит возле ближайшей лодки игрока: выбирает место в 250 м от неё и каждые полминуты выбирает заново. Видит, как охотник поста (`Senses.Seeing`), и забывает через 8 секунд, как охотники ([Охотники и ИИ](hunters.md)). У неё свой трюм, как у игрока: собранные ящики замедляют её, а её обломок их высыпает (`Flotsam.Looters`). Она идёт к ближайшему выходу и уходит с моря, когда в трюме набралось 30–70 добычи, когда трюм полон или корпус побит больше чем наполовину и что-то есть на борту, или через 4–6 минут в море (`Looter.Ready`). Добыча уходит в её запись: 3 монеты за очко, как у игрока. Потопленную или ушедшую команду через 90 с заменяет другая из тех, что не в море.\n- **Капитан** (`ai/roles/Looter.cs`): дерётся с врагом рядом, собирает ящики в пределах 300 м, гонится за врагом подальше, пока собирать нечего, бродит по своему месту и стреляет во всё, во что попадёт.\n- **Лодка растёт с командой**: добыча, привезённая домой, покупает самую дорогую лодку её лестницы — ялик, глиссер, гонщик, патрульный катер, канонерка, — которая стоит не больше лодки игрока и монет команды (`Rival.Boat`). Так команда идёт вровень с игроком и вырывается вперёд, когда возит добычу домой.\n- **Память**: запись команды помнит, встречала ли она игроков и чем кончилась последняя встреча: она потопила лодку игрока, игрок потопил её, или вничью (`Rival.Met`, `Rival.Last`). Запись живёт в сохранении. Гибель всех лодок игроков загружает последнее сохранение, но записи команд остаются, какими были: соперник помнит бой, после которого игра загрузилась (`Progress.Remember`; решение без владельца, [Q259](../questions/missions.md#q259)).\n- **Радио** (`story/RivalCalls.cs`, сцены `story/rival-*.json`): каждый капитан — `Speaker` по названию своей команды (`Speaker.Rivals`). Соперник говорит, когда впервые за выход оказывается в 300 м от лодки любого игрока: в первый раз в сохранении он представляется; после встречи, кончившейся потоплением, он таит обиду (его потопил игрок) или злорадствует (он потопил лодку игрока); иначе он здоровается. Он говорит и когда ракета, торпеда или таран игрока впервые попадает в него; когда идёт ко дну (прощальные слова игрокам, если его потопил игрок); когда берёт в трюм ящик с обломка, потопленного игроком; когда его побили так, что он идёт домой с чем-то на борту; когда топит лодку, только что ударившую лодку игрока; и когда уходит с моря со своей добычей. Между репликами команда молчит 20 с (`RivalCalls.Quiet`): первыми идут её последние слова, потом встреча, затем моменты по ходу, разрыв и приветствие; момент по ходу, не сказанный за 8 с, пропускается. Зачем: несколько реплик на поворотах боя, а не болтовня. Сцен по десять на капитана, восемьдесят в сумме ([Сцены сюжета](../story/scenes.md)).\n- **HUD**: табличка соперника видна всегда, не только у захваченной цели: название команды и лицо её капитана рядом, сердитое после попадания, удивлённое на последнем ударе (`Markers.Face`). Кольцо — красное, как у всех врагов: палитра держит один цвет на смысл ([Палитра](../art/palette.md)); соперников различают табличка, лицо и ливрея (решение без владельца, [Q260](../questions/interface.md#q260)). О потопленном сопернике HUD говорит «Потоплен», об ушедшем — «Соперник ушёл с добычей: …» с названием команды.\n- **В коопе**: команды ведёт хост, гость видит их, как любую лодку хоста. Реплики соперников решает хост и сообщает гостям (`Say.Radio`), и у гостя они звучат так же ([Онлайн-кооп](../online.md)).\n\nДемо: `Rivals` ([Демо](../tools/demos.md)).\n\n## Открытые вопросы\n- [Q258](../questions/missions.md#q258): откуда приходят соперники, где бродят и как видят.\n- [Q259](../questions/missions.md#q259): память соперника переживает загрузку после гибели.\n- [Q260](../questions/interface.md#q260): кольцо соперника красное, а не в цвет команды.\n- [Q147](../questions/interface.md#q147): лица охотников из тех же восьми портретов.\n"}, {"id": "gameplay-sites", "path": "gameplay/sites.md", "title": "Места промысла", "section": "gameplay", "date": "2026-11-15", "md": "# Места промысла\n\nМеста в море, где работают во время захода: косяки, где ловят рыбу, и обломки, которые поднимают. Каждое открывает вид сбоку.\n\n## Решения владельца\n- Места в море для работы: косяки для рыбалки и обломки для подъёма. Каждое открывает вид сбоку, трёхмерный разрез через воду с лодкой игрока над ним, в собственном свете игры. Рыбалка идёт в нём; подъём — это захват на тросе с лодки, как автомат-кран в аркаде. Рыба считается добычей.\n- В виде сбоку натяжение лески видно на самой леске и на стеклянном циферблате у удилища, а пойманная рыба или поднятая вещь показывается крупно на карточке: её название, длина, вес и добыча.\n- То, что поднято на борт видом сбоку, идёт в трюм, как добыча, а не продаётся сразу; бой тем временем идёт дальше.\n\n## Как устроено\nМеста ставит `Site.Strew` (`activities/Site.cs`) при старте захода. Карта может закрепить их: в мире (`maps/world.json`) четыре косяка и четыре обломка, у обломков свои списки ящиков. Карта без закреплённых мест получает один косяк и один обломок в случайной воде, достаточно глубокой, чтобы работать, и достаточно мелкой, чтобы видеть дно ([Q31](../questions/haul.md#q31)). HUD подписывает места на экране. Когда лодка медленно лежит в досягаемости места, и охотников рядом нет, `Space` открывает вид сбоку. Бой идёт дальше за ним: лодка лежит без хода, как держала бы её команда с убранным газом, а охотник, подошедший ближе, закрывает вид и предупреждает «Охотники близко» (решение без владельца, [Q115](../questions/haul.md#q115)). Вид только у местного игрока.\n\n- **Косяк** (`Shoal`, `Gull`, `Leaps`): всплески вскипают воду под кружащими чайками ([Q34](../questions/haul.md#q34)), и раз в пару секунд рыба его стаи выпрыгивает дугой, блеснув, со всплеском на выходе и входе; рыба в полтора раза крупнее жизни, чтобы читаться сверху. Его стая (`Catch`) держится весь заход.\n- **Обломок** (`Wreck`): корпус охотника на дне, у него буй, поднимаются пузыри. Его вещи (`Salvage`) держатся весь заход. Охотник, затонувший там, где дно в досягаемости захвата (`Site.Reached`, глубина от 4,5 до 12 м), становится таким обломком на месте: его корпус — тот самый, что лежит на дне, а вещи — из того, что несёт его проект (`Wreck.Of`, `Game`). Затонувшие вне досягаемости высыпают добычу на воду. Пока места промысла не онлайн, обломок из затонувшего охотника рождается только в игре без связи ([Q117](../questions/haul.md#q117)).\n- **Вид сбоку** (`SideView`, `waters/Section.cs`): вертикальная плоскость срезает море и грунт (`section.gdshaderinc`), а грань вдоль плоскости рисует воду сбоку и дно в разрезе (`section.gdshader`, `sediment.gdshaderinc`), читая те же следы, что и море. Вид ныряет сверху лодки и уходит, поднимаясь. Зачем разрез в мире: вид сбоку показывает воду под лодкой в собственных море, грунте и свете игры. Слева вверху — тот же список на дымчатом стекле, что у целей HUD (`ListPane`): название дела капителями и что сейчас происходит. Значки клавиш и новости — тоже детали HUD (`Gloss.Hints`, `Toasts`). Размеры списка — в теме, тип `Note`, поля и виньетка — тип `Screen`. Циферблат лески подписан капителями, как приборы HUD.\n- **Карточка добычи** (`HaulCard`, `Specimen`): то, что подняли на борт, всплывает на карточке из дымчатого стекла HUD (`Lens`), ровной, без скотча: его собственная модель, один раз нарисованная в маленьком `SubViewport`, в скруглённом окне с водой; под ней белыми словами название, длина, вес и добыча, подписи капителями. Размеры и шрифты — в теме, тип `HaulCard`. Поднятое не продаётся: оно ложится в трюм местного игрока (`SideView.Landed`, `Hold.Take`), если там есть место, а без места рыба отпускается, вещь падает обратно на обломок, и заметка об этом говорит ([Q31](../questions/haul.md#q31)).\n- **Рыбалка** (`Fishing`, `Swimmer`, `FishModel`, `FishForm`): леска вытравливается и сматывается до глубины рыбы; рыба у крючка клюёт, затем борется рывками, и сматывание во время рывка напрягает леску ([Q32](../questions/haul.md#q32)). Когда рыба на крючке, заметка говорит, рвётся ли она (перестать сматывать) или отдыхает (сматывать), а лампа циферблата мигает красным весь рывок ([Q65](../questions/interface.md#q65)). У каждого вида своя форма (`FishForm`). У рыбы своя длина в пределах диапазона её вида (`Catch`), а весит она как её длина в кубе ([Q51](../questions/haul.md#q51)). В трюме рыба и вещь — предметы каталога (`Items`): у вида два размера, обычный и «большой» (`Catch.Sizes`, `Salvage.Light`/`Heavy`), потому что прогресс хранит предметы по названию ([Q116](../questions/haul.md#q116)); в трюме вес размера, на карточке настоящий; в трюме рыба или вещь занимает одно место, как ящик, и в полном трюме тоже вытесняет дешёвое. Леска — полоса, рисуемая каждый кадр, которая краснеет по мере приближения натяжения к разрыву; циферблат у кончика удилища (`LineDial`) его показывает: круглая линза стекла HUD (`ui/Lens.cs`), как приборы лодки; море видно сквозь неё, к середине она темнее, стрелка та же, что у приборов, а лампа — маленькая линза, ловящая красный цвет охотников. Размеры — в теме, тип `LineDial`. Наживка большая и яркая, мягко светится (`Glow.Halo`), так что читается в мути.\n- **Подъём** (`Salvaging`): захват на тросе, маятник, который толкает ход лодки. Space его роняет; он смыкается на том, что лежит под ним, и поднимает, а вещь, схваченная не за середину, может соскользнуть обратно ([Q33](../questions/haul.md#q33)); сомкнувшийся на пустоте получает об этом сообщение. Каждая вещь весит своё в пределах диапазона её вида (`Salvage`).\n\nЧто делают с добытым, описано в [Добыча](haul.md).\n"}, {"id": "gameplay-toys", "path": "gameplay/toys.md", "title": "Забавы", "section": "gameplay", "date": "2026-11-15", "md": "# Забавы\n\nМелкие забавы на манер игр про открытый город: буйства, которые подбирают на воде, прыжки с волн на счёт и спрятанные посылки.\n\n## Решения владельца\n- 2026-11-13: игра должна ощущаться как старые GTA с видом сверху. Среди одобренного — буйства, которые подбирают на воде, прыжки с волн на счёт и спрятанные посылки.\n\n## Как устроено\nВсе облики здесь — временные замены из того, что игра уже рисует: владелец их не описывал ([Q201](../questions/missions.md#q201)).\n\n- **Буйства** (`toys/Rampages.cs`, зона `Rampage` в `areas/Area.cs`): на карте отмечены места, в каждом на воде лежит жетон (`toys/Token.cs`, `TokenModel`): красная звезда-вспышка с белым краем плашмя, как эмблемы припасов. Лодка игрока, наехавшая на жетон, получает задачу зоны: потопить `Sink` лодок за `Seconds` секунд. Считается любая лодка любой стороны (охотник, рабочая лодка, патруль), которую потопила эта лодка: ракетой, торпедой или снарядом турели (`Gunnery.Struck`), ракетой своего дрона, тараном (`Ramming.Rammed`), своей миной или зарядом из трюма (`Blast.By`). Не считаются лодки, потопленные минами карты, бочками, горящей нефтью, обстрелом и батареями: такой взрыв игра ни одной лодке не приписывает. Потопленный дрон не считается.\n  - Счёт и часы стоят строкой «Буйство» в списке целей ([HUD](../interface/hud.md)); начало, успех и срыв говорит крупная строка (`Hud.Banner`, `Game.Toys.cs`).\n  - Успела — вокруг лодки всплывают ящики из списка курьера на `Rampages.Worth` добычи за каждую заказанную лодку ([Баланс экономики](../balance/economy.md)), как платят задания, только высыпает их игра самого игрока на его море (`Game.Reward`). Не успела — ничего. Лодка, потопленная во время буйства, теряет его молча.\n  - Жетон возвращается на место через `Rampages.Back` секунд после конца буйства. У одной лодки одно буйство разом; у разных игроков они идут рядом.\n  - В мире жетонов четыре, по одному у каждого большого поста охраны, в открытой воде в 130 м от линии поста со стороны середины карты. На карте игрока (M) они не обведены: их находят глазами.\n  - Числа, места и то, что считается, — решение без владельца ([Q199](../questions/missions.md#q199)).\n  - Онлайн: решает хост, гостю он сообщает, какие жетоны взяты и как идёт буйство каждой лодки ([Онлайн-кооп](../online.md)).\n- **Прыжки на счёт** (`toys/Jumps.cs`): лодка игрока, оторвавшаяся от воды и севшая обратно, узнаёт, сколько секунд летела. В воздухе она, пока ни одна часть днища не мокрая (`Boat.Airborne`, `Seakeeping.Clear`): это та же проверка, по которой лодка в воздухе выравнивает нос. Полёт короче `Jumps.Least` — подскок на ряби, о нём молчат. Полёт от `Jumps.Long` доливает нитро на `Jumps.Bonus` и показан как взятый припас: «+НИТРО» над лодкой и звук нитро ([Припасы](pickups.md)). Как лодки идут и прыгают, не тронуто.\n  - О полёте, который долил нитро, говорит уведомление «Полёт: 1.3 с»; о более коротком молчат, чтобы уведомления не шли подряд. Самый долгий полёт лежит в сохранении (`Progress.Flight`, [Прогресс](progression.md)); побив его, игрок видит крупную строку «Рекорд полёта», и игра сразу сохраняется: гибель загружает последнее сохранение.\n  - Пороги и прибавка — решение без владельца ([Q200](../questions/missions.md#q200)); цифры в [Балансе лодок](../balance/boats.md).\n  - Онлайн: считает хост, как и нитро; гостю он сообщает полёт его лодки, а рекорд гость хранит у себя ([Онлайн-кооп](../online.md)).\n- **Спрятанные посылки** (`toys/Packages.cs`, зона `Package`): в каждой точке, отмеченной картой, лежит посылка — золотая коробка, перевязанная белым, с тем же жетоном-поплавком (`Token`). Лодка игрока, наехавшая на неё, находит её один раз и навсегда: крупная строка «Посылка 3 из 10», а сохранение запоминает её по имени карты (`Setting.Name`) и номеру посылки среди посылок карты (`Progress.Find`, [Прогресс](progression.md)). Игра сразу сохраняется. Найденные посылки больше не всплывают: при раскладке карты `Packages.Lay` спрашивает сохранение (`Packages.Known`).\n  - Последняя найденная посылка карты платит: «Все посылки найдены», и вокруг лодки всплывают ящики на `Packages.Worth` добычи ([Баланс экономики](../balance/economy.md)).\n  - В мире посылок десять: в лагуне атолла, среди южных кекуров, среди кекуров бухты, за вулканом, в лагуне за барьерным рифом, в заводи между `Home cay` и косой, в протоке через отмели, за `Cargo cay` под его батареей и в двух дальних углах карты, юго-восточном и северо-западном. Каждая лежит на воде, глубокой для самого глубокого корпуса верфи и соединённой со стартом; это проверяет кейс `Toys/World`. На карте (M) их нет.\n  - Сколько их, где они и чем платят — решение без владельца ([Q202](../questions/missions.md#q202)).\n  - Онлайн: посылки у каждого игрока свои. Каждая машина раскладывает посылки карты хоста, показывает те, что не нашёл её игрок, и пишет находки в его собственное сохранение; лодки товарищей чужих посылок не берут ([Онлайн-кооп](../online.md)).\n\nМеста на карте ставит [редактор карт](../tools/map-editor.md). Проверяет демо `Toys` ([Демо](../tools/demos.md)).\n\n## Открытые вопросы\n- [Q199](../questions/missions.md#q199): числа и места буйств, что считается.\n- [Q200](../questions/missions.md#q200): пороги прыжков и прибавка нитро.\n- [Q201](../questions/missions.md#q201): облик жетонов и слова.\n- [Q202](../questions/missions.md#q202): число, места и награда посылок.\n- [Q203](../questions/missions.md#q203): забавы в кооперативе — свои у каждого или общие.\n"}, {"id": "gameplay-wanted", "path": "gameplay/wanted.md", "title": "Розыск и патруль", "section": "gameplay", "date": "2026-11-15", "md": "# Розыск и патруль\n\nУровень розыска лодки игрока и патруль, который за ней приходит, как в играх с открытым миром про город: игрок начинает неприятности, ответ растёт с тем, что он натворил, и от погони можно уйти.\n\n## Решения владельца\n- 2026-11-13 владелец попросил сделать игру похожей на старые GTA и одобрил уровень розыска: неприятности с мирными лодками поднимают его, каждая отметка шлёт больше лодок патруля и сильнее, вне вида он падает, перекраска снимает его.\n- Патруль выходит только с постов карты, ничто не появляется из воздуха (2026-11-13). Это согласуется с решением 2026-11-11: охотники выходят только с постов ([Зоны и опасности](../world/areas.md)).\n- Розыск — второй источник сложности рядом с миром; владелец с этим согласен (2026-11-13).\n- Кто такой патруль, владелец решит позже; пока это просто полиция (2026-11-13).\n\n## Как устроено (`law/`)\n- **Уровень** (`Warrants`): у каждой лодки игрока свой, от нуля до четырёх. Попадание по рабочей лодке ([Жизнь моря](../world/life.md)) или по лодке патруля поднимает его понемногу, потопленная лодка — на целый уровень. Лодка, потопленная своей миной игрока или зарядом из его трюма, считается тоже. Удар корпусом считается так же; за удар о лодку патруля, который уже гонится, игрок не отвечает ([Q192](../questions/combat.md#q192)). Потопленная лодка игрока свой розыск теряет. Числа — решение без владельца ([Q191](../questions/combat.md#q191)).\n- **Добыча турели**: рабочая лодка, которую ударил игрок, двадцать секунд считается врагом лодок игроков (`Boat.Prey`, `Sides.Fights`): по ней бьёт турель и на неё ложится захват. Зачем: турель целится сама, мышь не целится, и иначе стартовая лодка не могла бы потопить рыбака. Нетронутую мирную лодку турель не трогает ([Q191](../questions/combat.md#q191)).\n- **Патруль** (`Patrols`): лодки постов патруля (`Post.Patrol`) стоят у своих постов и никого не трогают, пока лодка игрока не в розыске. Тогда посты, ближайшие к месту, где её видели в последний раз, шлют лодки по уровню: на первом одну лодку ближайшего поста, на втором весь ближайший пост, на третьем два ближайших, на четвёртом все. Посланные идут туда, где лодку видели в последний раз, и ищут там; увидевший сообщает остальным (`Senses.Report`). Любая лодка патруля, которая сама видит лодку в розыске, гонится за ней. Пост выставляет лодки заново, как пост охотников. В море лодки поста стоят, только пока лодка игрока ближе 450 м к посту или пока их шлют; пост в покое вдали от игроков убирает их, как рейсы убирают рабочие лодки ([Жизнь моря](../world/life.md)). Зачем: патруль, которого никто не видит, не стоит кадру ничего.\n- **Уйти от погони**: уровень держится, пока хоть одна лодка патруля видит лодку игрока (160 м, суша и дым мешают, как охотникам) и пока посланные ещё в пути. Двадцать секунд вне вида, и уровень падает на один; так до нуля. Тогда патруль забывает лодку и идёт к посту.\n- **Перекраска**: корабел в гавани продаёт перекраску, 40 монет за уровень ([Баланс экономики](../balance/economy.md)), и розыск снимается сразу. К причалу не встать, пока патруль рядом, как и пока рядом охотники. Перекрашенная лодка получает следующую из шести окрасок по кругу (`Livery.Coated`, `Design.Coat`): борт, полосы и акцент. Окраску помнит сохранение и видят гости. Цвета временные ([Q194](../questions/haul.md#q194)). Переоснащение на верфи розыск не снимает: новая лодка наследует его.\n- **HUD** (`ui/WantedRow.cs`): звёзды на стекле справа вверху, по одной на уровень. Они мигают, пока патруль видит лодку, и дышат, пока не видит. Крупная строка «В розыске» с каждым новым уровнем и уведомление «Патруль вас потерял» ([HUD](../interface/hud.md)).\n- **В мире** три поста патруля: у гавани, у станции и к северу от гавани; какие лодки на каком — решение без владельца ([Q196](../questions/world.md#q196)). Пост патруля ставят в [редакторе карт](../tools/map-editor.md).\n- **Облик**: корпуса охотников в бело-синей краске с косыми полосами (`Livery.Patrol`), временный ([Q189](../questions/world.md#q189)). Мигалки и сирены нет.\n- **В коопе** розыск ведёт хост и говорит гостям с каждой лодкой, как она стоит (`online/Lie.cs`); перекраску гостя даёт хост по его слову ([Онлайн-кооп](../online.md)). Патруль гонится только за лодкой в розыске, товарища без розыска не трогает.\n\nДемо: `Wanted` ([Демо](../tools/demos.md)).\n\n## Открытые вопросы\n- [Q191](../questions/combat.md#q191): числа розыска и правило добычи турели.\n- [Q192](../questions/combat.md#q192): кто отвечает за удар корпусом.\n- [Q193](../questions/story.md#q193): кто такой патруль и как он относится к банде.\n- [Q194](../questions/haul.md#q194): перекраска у корабела.\n- [Q196](../questions/world.md#q196): посты патруля в мире.\n"}, {"id": "glossary", "path": "glossary.md", "title": "Глоссарий", "section": "", "date": "2026-11-16", "md": "# Глоссарий\n\nТермины игры по-английски (как в коде) и по-русски (как в игре и в вики). Слова интерфейса берутся из перевода игры, `game/locale/ru.po` ([Язык](interface/language.md)); новое слово сначала ищи там: `grep -A1 'msgid \"Term\"' game/locale/ru.po`.\n\n## Игра\n| English | Русский |\n| --- | --- |\n| world, run, mission, objective | мир, заход, задание, цель |\n| Mission complete / Sunk / Died / Out of fuel / Extracted | Задание выполнено / Потоплен / Погиб / Кончилось топливо / Вышли |\n| hunter, band, post | охотник, банда, пост |\n| pirates, fort, pirate post | пираты, форт, пост пиратов |\n| storm, storm zone | шторм, зона шторма |\n| rival, rival crew, captain | соперник, команда соперника, капитан |\n| working boat, fisher, ferry, freighter, haven, voyage | рабочая лодка, рыбак, паром, сухогруз, гавань (место захода), рейс |\n| patrol, patrol post, wanted level, Wanted, repaint | патруль, пост патруля, уровень розыска, «В розыске», перекраска |\n| job, giver, buoy | работа (задание), дающий, буй |\n| haul, salvage, item, hold, slot, kit | добыча, добыча (её ценность), вещь, трюм, место, расходник |\n| crate, drum, bale, chest | ящик, бочка, тюк, сундук |\n| site, shoal, wreck, side view, claw | место промысла, косяк, обломки, вид сбоку, захват |\n| pickup, supplies, repair, fuel, tank, nitro, smoke | припас, припасы, ремонт, топливо, бак, нитро, дым |\n| strike, lock, target, roulette | попадание, захват цели, цель, рулетка |\n| setting, landform, area, hazard | локация (в игре «Место»), форма рельефа, зона, опасность |\n| outpost, Mariia, Trade at Mariia | станция, «Мария», Торговать на «Марии» |\n| curtain, toast, banner | шторка загрузки, уведомление, строка диктора |\n| arena circle, cut scene, shot | круг арены (над ним стоит вид), вставка, кадр |\n| rampage, token, hidden package, flight, best flight | буйство, жетон, спрятанная посылка, полёт, рекорд полёта |\n| host, guest | хозяин игры (хост), гость |\n\n## Гавань и лодка\n| English | Русский |\n| --- | --- |\n| harbour, pier, shipwright, boatyard, cast off | Гавань, причал, Корабел, Верфь, Отчалить |\n| logbook | Судовой журнал |\n| captain, shipwright, tollkeeper | капитан, корабел, мытарь |\n| trader's screen, Trader (the pier's tile) | экран торговца, «Торговец» (плитка причала) |\n| coins | монеты |\n| part, station, gear, hull, engine | деталь, место, снаряжение, корпус, двигатель |\n| skiff, punt, racer, patrol boat, gunboat, runabout, ironclad | Ялик, Плоскодонка, Гонщик, Патрульный катер, Канонерка, Катерок, Броненосец |\n| racks, chase rack, launcher, turret, drone | направляющие, носовая стойка, пусковая установка, турель, дрон |\n| cradle, mine rail, mine | люлька, минный жёлоб, мина |\n| armour belt, plate, ram, rammer | броневой пояс, плита, таран, таранщик |\n| thermal sight, fire control, bilge pump, carpenters, smoke generator | тепловизор, управление огнём, трюмная помпа, плотники, дымогенератор |\n\n## Сюжет и интерфейс\n| English | Русский |\n| --- | --- |\n| scene, passage, screenplay, trigger, requires | сцена, эпизод, сценарий, повод, условие |\n| radio, portrait, balloon, pill | радио, портрет, выноска, глянцевая кнопка-пилюля |\n| station (of the radio), dial, static | станция радио, шкала радио, шум эфира |\n| shanty, shantyman, crew (singing) | шанти, запевала, команда |\n\n## Разработка\n| English | Русский |\n| --- | --- |\n| owner | владелец |\n| my call | решение без владельца |\n| demo, case, selector, check | демо, кейс, селектор, проверка |\n"}, {"id": "interface-controls", "path": "interface/controls.md", "title": "Управление", "section": "interface", "date": "2026-11-13", "md": "# Управление\n\nИгра идёт с клавиатуры, курсором и геймпадом. Геймпад работает везде, кроме редактора карт.\n\n## Решения владельца\n- Мышью в море не целятся (2026-11-10): ракеты и торпеды идут в захваченную цель. Стик геймпада целит как раньше.\n- Игра идёт и с геймпада, и с клавиш и курсора: в море, в меню, у причала, на верфи и в виде сбоку, везде, кроме редактора карт. Пока геймпад использовался последним, подсказки клавиш показывают кнопки геймпада.\n- Расходники — на клавишах 1–4 (2026-11-11, [Добыча](../gameplay/haul.md)).\n\n## Клавиши в море\n\n| Клавиша | Что делает |\n| --- | --- |\n| `W` `A` `S` `D` или стрелки | руль и газ |\n| `Shift` | нитро (рывок) |\n| `Q` / `E` | огонь левым / правым бортом |\n| Левая кнопка мыши | огонь бортом, который достаёт захваченную цель |\n| `F` | дым |\n| `C` | следующее оружие |\n| `1`–`4` | расходник: ремкомплект, бронеплита, баллон нитро, заряд, оплаченный ящиками из трюма |\n| `Space` | то, что предложено под лодкой: швартовка в гавани, торговля у станции, работа на месте промысла |\n| Колесо мыши | ближе / дальше |\n| `M` | карта |\n| `R` | радио: следующая станция, после последней — выключено ([Музыка](../audio/music.md)) |\n| `Esc` | закрыть карту, иначе пауза |\n| `F3` | отладочная карточка |\n\nВставку пропускают `Esc`, `Space`, `Enter` или щелчок.\n\n## Клавиши вне моря\n- **У причала** (`Quayside`): `A` `D` или стрелки — по плиткам, `Enter` или щелчок — открыть, `Tab` — верфь, `Space` — отчалить, `Esc` — меню.\n- **Верфь** (`Boatyard`): `A` `D` — место, `W` `S` — деталь, `Enter` — поставить, `Esc` или `Tab` — готово.\n- **Вид сбоку** (`SideView`): `A` `D` — лодка вдоль места, `Space` — подъём груза, `W` `S` — леска на рыбалке, `Esc` или `Tab` — уйти.\n- **Диалог** (`talk/Dialogue.cs`): `Enter` или `Space` — дальше, `W` `S` — ответ, `1`–`9` — ответ по номеру, `Esc` — пропустить, пока ответов нет.\n- **Экран торговца** (`ui/Counter.cs`): `W` `A` `S` `D` или стрелки — по карточкам и между рядами, `Enter` или щелчок — продать ящик или купить товар, `Space` — «Продать всё», `Esc` — «Готово» ([Q176](../questions/haul.md#q176)).\n\n## Как устроено\n- **Клавиши моря** (`players/Controls.cs`): читают команду местного игрока (`Command`): зажатые клавиши и приказы, нажатые с прошлого чтения. Щелчок по морю — приказ огня по захвату; курсор ничего не наводит. Остальные клавиши моря разбирает `Game._UnhandledInput`, колесо — `IsometricCamera`. Радио — не приказ лодке: `R` меняет только настройку этого игрока.\n- **Клавиши экранов** (`ui/Keys.cs`): W A S D двигают фокус в экранах, как стрелки, — так же, как правят лодкой.\n- **Геймпад** (`players/Pad.cs`, `ui/Buttons.cs`): один узел превращает кнопки геймпада в события клавиш, которые экраны и лодка уже принимают, так что каждый обработчик клавиш и зажатая клавиша работают как раньше. Два слоя, у каждого своя таблица: морской, пока лодка местного игрока принимает команды, и экранный в остальных случаях (`Game.Helming`); то, что зажато при смене слоя, ничего не делает в новом, пока не отпущено. Стик тоже рулит в море (`Pad.Helm`, читается `Controls`): его x — руль, курки (RT вперёд, LT назад) или его y — газ. В экранах движение стика или D-pad повторяется, как зажатая стрелка в меню. Start отступает на один уровень в обоих слоях. Последнее использованное устройство (событие геймпада или клавиша) заставляет `Gloss.Key` рисовать кнопку, которая посылает клавишу (`Buttons`), так что каждый ряд подсказок, пилюля и выноска следуют за ним.\n  - **Море**: стик — руль; RT/LT — газ; A — нитро (`Shift`); LB/RB — огонь левым/правым бортом (`Q`/`E`); B — дым (`F`); правый стик — наводка (`Pad.Aim`); D-pad вверх — следующее оружие (`C`), вниз — `Space`; Start — `Esc`; Back — карта (`M`); D-pad влево и вправо, X и Y — расходники `1`–`4` ([Q153](../questions/interface.md#q153)); нажатие правого стика — радио (`R`, [Q206](../questions/interface.md#q206)).\n  - **Экраны**: D-pad или стик — стрелки; A — `Enter`; B и Start — `Esc`; Back — `Tab`; X — `Space` ([Q67](../questions/interface.md#q67)).\n- Клавиши моря перечислены на отладочной карточке (`ui/DebugPanel.cs`, [HUD](hud.md)).\n"}, {"id": "interface-hud", "path": "interface/hud.md", "title": "HUD", "section": "interface", "date": "2026-11-16", "md": "# HUD\n\n![HUD над глубокой водой](../img/hud.jpg)\n\nHUD — то, что видно на экране в море: цели захода, кольца на воде, приборы лодки, расходники и трюм, уведомления.\n\n## Решения владельца\n- HUD показывает только то, на чём держится игра: ни часов боя, ни радара, ни значка лодки, ни показаний стоек, скорости или повреждений, кроме попаданий в корпус. Стрелок вокруг лодки нет: на то, что за экраном, HUD не указывает (2026-11-11). Клавиши перечислены на отладочной карточке, а не на HUD; она закрыта, пока её не откроют F3 (2026-11-10). Нет красной вспышки, когда лодку бьют, и нет предупреждения о ракетах, выпущенных по игроку.\n- Линия огня каждой заряженной стойки ложится на воду только при управлении огнём на борту: это снаряжение, которое игрок получает для лодки на верфи.\n- В море охотник отмечен кольцом на воде вокруг него, его попадания остаются дугой кольца: у малой лодки дуга на каждое попадание, у большого корпуса одна дуга, которая пустеет с каждым попаданием и размечена через каждые пять. Названа только цель, на табличке. Новости приходят уведомлениями, выезжающими сверху; цели написаны в углу, на стекле (записка ушла, когда бумага стала стеклом, 2026-11-13).\n- В море приборы лодки собраны в кластер в углу экрана: найденные и починенные устройства старого мира.\n- 2026-11-12: стекло Frutiger Aero перенесено на HUD ([Компоненты](../art/components.md)): приборы, рулетка, расходники, трюм, уведомления и таблички.\n- HUD в море въезжает по частям в начале захода. Решённая миссия закрывает чёрные полосы на вердикте, пока набранная добыча считается вверх, и они открываются снова, пока лодка на плаву, чтобы она шла домой. Цвета держат по одному смыслу: оранжевый — игрок и захват, красный — охотники, золотой — цель и места для работы, аква — союзники ([Палитра](../art/palette.md)).\n- HUD не указывает ни на какие предметы на плаву, ящики тоже.\n- У каждого врага случайное лицо (11-10).\n- Добыча — ряд слотов трюма прямо на HUD (11-11, [Добыча](../gameplay/haul.md)). Панель расходников — в левом нижнем углу (11-11).\n- 2026-11-13: игра должна ощущаться как старые GTA с видом сверху: убийства и задания объявляют крупные строки диктора посреди экрана, а музыка — радио лодки ([Музыка](../audio/music.md)).\n\n## Как устроено\n- **HUD** (`ui/Hud.cs`; части `Objectives`, `Dash`, `Roulette`, `Tuner`, `KitBar`, `HoldRow`, `Markers`, `Toasts`, `Banner`, `Verdict`; движение `Motion`): въезжает по частям в начале захода и после выхода из гавани. Синий в нём — броня. Его стёкла (`Lens`) смешиваются со сценой и экран не читают: море видно сквозь них без преломления, и весь HUD стоит около 0,1 мс кадра ([Компоненты](../art/components.md)). Лампы и значки в нём — тоже маленькие круглые линзы этого стекла, ловящие свет своего смысла; глянцевого геля в HUD не осталось. Слова на стекле пишутся одним способом, белыми с тёмным ореолом своей формы (`Pill.Engrave`); слова прямо над водой — со своей тёмной каймой (`Style.Write`). Размеры, места, кегли и доли дыма и света каждой части — в теме (`ui/look.tres`, типы `Dash`, `Dial`, `Wheel`, `Tuner`, `Kit`, `Slot`, `Notice`, `Banner`, `Plate`, `Markers`, `Note`, `Verdict`, `Letterbox`). Решение без владельца, как и остальной облик стекла HUD: [решено 11-12](../decisions.md).\n  - `Objectives`: цели слева вверху на панели-списке (`ListPane`, тип темы `Note`): дымчатое стекло, белые слова, у каждой цели круглая линза; выполненная линза наливается зелёным, в ней проступает галочка, строка тускнеет. Счёт — справа, при смене он вспухает. Панель падает сверху и уходит вверх. Тот же список — у вида сбоку ([Места промысла](../gameplay/sites.md)). В открытом мире это цели открытого задания ([Открытый мир](../gameplay/missions.md)), а под ними счёт и часы буйства самого игрока ([Забавы](../gameplay/toys.md)). Условие, по которому миссия своей карты проигрывается (удержать на плаву), пишется без галочки, так как оно никогда не выполнено.\n  - `Markers`: кольца на воде вокруг лодок, которые видит игрок, дуга на каждое попадание, которое корпус выдерживает, или, после восьми, одна пустеющая дуга с отметкой через каждые пять ([Q63](../questions/interface.md#q63)), аква для союзников, золотые для цели; береговые батареи окольцованы, как охотники; поворачивающиеся дуги захвата; клавиша стороны, которая попала бы в цель захвата (`Player.Target`, `Boat.Strikes`): яркая, пока борт заряжен, и тусклая под вуалью, пока он перезаряжается; места промысла (пунктирный круг с названием) и места заданий (золотая рябь). Гавань и станцию HUD не отмечает: место швартовки — кольцо стеклянных поплавков на воде ([Гавань](../base/pier.md)). Метки рисуются только у того, что на экране. У лодки игрока на воде лежат веера выбранного оружия, тот, что держит наводку, ярче, а в точке наводки кольцо (`Markers.Fans`, [Бой](../gameplay/combat.md)). Управление огнём рисует ещё и линии огня выбранного оружия. Метки охотника, скрытого дымом, исчезают и возвращаются; кольца захвата сходятся один раз, когда он впервые виден. Над лодкой всплывают попадания, взятая добыча и припасы; у обломков лодки игрока — кольцо подъёма ([Онлайн-кооп](../online.md)).\n  - **Лицо врага** (`Markers.Face`): рядом с табличкой портрет: у соперника — его капитана, и табличка соперника видна всегда ([Соперники](../gameplay/rivals.md)); у захваченного охотника — один из тех же восьми, выбранный по лодке. Сердит сразу после попадания, удивлён на последнем ударе. Решение без владельца: [Q147](../questions/interface.md#q147), [Q260](../questions/interface.md#q260).\n  - Под лодкой на стеклянной пилюле — то, что делается на `Space`: «Гавань», «Торговать на „Марии“» у станции или работа на месте промысла, — или предупреждение «Охотники рядом». Табличка цели и имена — тоже дымчатое стекло, ловящее цвет своего смысла, слова белые; цвет дают только линза и её свет.\n  - `Toasts`: новости на дымчатых стеклянных пилюлях сверху, не больше трёх; предупреждение ловит красный свет. Среди них бак на исходе («Мало топлива», «Идите в гавань»), полный трюм и пустой бак. Значок слева — круглая линза: зелёная у хорошей новости, красная у предупреждения ([Q65](../questions/interface.md#q65)). По хорошей новости проходит блик, тот же, что по ромбу рулетки (`Gloss.Glint`).\n  - `Banner`: крупная строка диктора (`Hud.Banner`): одно-два слова антиквой старого мира прямо над морем в верхней трети экрана, выше лодки и в стороне от приборов. Слова белые, с тёмным ореолом своей формы, так что читаются и над отмелью, и ночью. Под ними тонкая линия света, а на ней, если есть подпись или награда, маленькая стеклянная табличка с капителями. Линия и табличка ловят свет смысла: акву у обычной строки, красный у предупреждения, оранжевый игрока у потопленной лодки. Строка приходит чуть крупнее и садится, держится около полутора секунд и уходит вверх; новая сменяет ту, что на экране. Таблички лодок её обходят, под открытой картой она гаснет. Обычная строка звучит репликой хорошей новости, предупреждение — своей. Где стоит и как выглядит — решение без владельца: [Q209](../questions/interface.md#q209).\n  - Строкой диктора объявляются потопленная лодка («Потоплен» и её название на табличке, без звука: само потопление слышно) ; раньше это были уведомления. «Вперёд» в начале захода больше нет (2026-11-14). Строки заданий, розыска и трюков приходят туда же из своих систем. Решение без владельца: [Q208](../questions/interface.md#q208).\n  - `Verdict`: закрывает полосы при гибели всех лодок игроков («Погиб», `Hud.Died`) и на решённой миссии своей карты (с тем, почему она проиграна, или с подсчётом добычи). Заход открытого мира сам не решается.\n  - `Dash`: приборы лодки внизу справа: деления корпуса вокруг большого циферблата, броня, нитро, топливо над красным запасом, его лампа мигает, когда оно на исходе, заряд дыма. Каждый прибор — круглая дымчатая линза, показания поверх стекла; кронштейна под ними нет. Подпись под прибором — мелкие белые капители с тёмным ореолом (`Gloss.Caption`), прямо на воде, без плашки: они читаются и над отмелью, и ночью. Нитро в работе наливает линзу оранжевым, дым — аквой; лампа топлива — своя маленькая линза под стрелкой, она загорается красным вместе с линзой топлива и дымчатая, пока не горит; удар пускает по линзе корпуса кольцо света. `Roulette` лежит над циферблатом: колесо стеклянных ромбов по видам пусковых установок, которое поворачивается к выбранному; над ним плоский оранжевый указатель, под ним имя выбранного такими же капителями. Лампы гнёзд дронов на их ромбе — маленькие линзы: зелёная, пока дрон в гнезде, оранжевая, пока он вышел, дымчатая и мигающая, пока его чинят или отстраивают.\n  - `Tuner`: шкала радио слева от приборов, поднимается и опускается вместе с ними. Когда игрок меняет станцию ([Музыка](../audio/music.md)), маленькая дымчатая пилюля пару секунд называет её: круглая линза-лампа горит аквой, пока радио играет, и дымчатая, когда оно выключено; над названием подпись «РАДИО» и точка на каждую станцию, выбранная залита. Решение без владельца: [Q206](../questions/interface.md#q206).\n  - `KitBar`: панель расходников в левом нижнем углу, вровень с планкой приборов, поднимается и опускается вместе с ними: плитка на каждый расходник с клавишей 1–4, двумя ящиками рецепта (яркие, когда они на борту) и тем, сколько раз трюм может за него заплатить; плитка — маленькое стекло, которое ловит свет, ближайший к цвету расходника (зелёный ремонт, синяя броня, оранжевое нитро, красный заряд), гуще у дна; тусклая, пока платить нечем или лодке он не нужен, и вздрагивает со щелчком на отказ ([Добыча](../gameplay/haul.md)).\n  - `HoldRow`: ряд трюма прямо над панелью расходников, одной группой с ней: место на каждый слот корпуса, пустое — едва видное стекло, занятое — дымчатое стекло с плоской картинкой ящика в его цвете (`CrateArt`), в конце монета и цена трюма в монетах. Новый ящик выскакивает в место, вытесненный или потраченный улетает, вытесненный — с всплеском. Решение без владельца, как и виды ящиков: [Q162](../questions/haul.md#q162).\n- **Карта** (`MapView`, `MapPlot`): стекло с рельефом мира в линиях света ([Добыча](../gameplay/haul.md)) стоит поверх HUD, пока открыта (M), и метки на воде под ней гаснут; на ней обведены гавань и места заданий ([Открытый мир](../gameplay/missions.md), [Q165](../questions/interface.md#q165)). Рельеф карта берёт у мира, как он уже поднят (`World.Landforms`): поднимать его заново стоило от четверти секунды при первом открытии.\n- **Розыск** (`WantedRow`): звёзды на стекле справа вверху, по одной на уровень ([Розыск и патруль](../gameplay/wanted.md)). Плашка опускается, когда лодка в розыске, и уходит вверх, когда розыск снят.\n- **Отладочная карточка** (`DebugPanel`): окно ([Экраны и меню](screens.md)) с частотой кадров и клавишами моря.\n"}, {"id": "interface-language", "path": "interface/language.md", "title": "Язык", "section": "interface", "date": "2026-11-13", "md": "# Язык\n\nСлова игры переведены на язык игрока.\n\n## Решения владельца\n- Игра переведена: её слова на языке игрока.\n\n## Как устроено\nСлова игры пишутся по-английски и ищутся в каталогах gettext, `game/locale/<lang>.po`, через `TranslationServer` Godot: `Tr`, `Format` (формат из {0}), `Plural` (собственные формы множественного числа языка) и `Marked` (имя, оставленное по-английски и ищущееся там, где показывается). `Marked` с вставками даёт фразу (`Phrase`): английский формат и то, что в него вставлено; она переводится там, где показана (`Phrase.Said`). Фразами говорят задания: цели, объявления и причина вердикта идут гостю по сети по-английски, и он читает их на своём языке ([Онлайн](../online.md)). Почему gettext: Godot читает .po как есть, а недостающее слово остаётся английским. `tools/locale.py` собирает слова из кода, названий карт и реплик сюжета в каждый каталог, сохраняя переведённое; `--check` падает, пока слова не хватает или его {0} не совпадают с английскими. Язык меняется сразу, без перезапуска: меню собирает свои пункты заново при каждом открытии (`Game.Pause`), лента причала, верфь, журнал и экран торговца, построенные один раз, переписывают плитки, заголовок и пилюли по уведомлению Godot о смене перевода (`Quayside`, `Boatyard`, `Logbook`, `Counter`), а остальное пишет слова при отрисовке. Английский и русский; игра стартует на языке системы, а «Язык» на странице настроек идёт по кругу между ними ([Q75](../questions/interface.md#q75)).\n"}, {"id": "interface-screens", "path": "interface/screens.md", "title": "Экраны и меню", "section": "interface", "date": "2026-11-16", "md": "# Экраны и меню\n\n![Меню базы](../img/menu.jpg)\n\n![Судовой журнал: окно матового стекла со строками](../img/logbook.jpg)\n\nЭкраны поверх моря: меню, экран торговца, настройки, судовой журнал и окна инструментов. Ленты плиток причала и верфи — на страницах [Гавань](../base/pier.md) и [Верфь](../base/boatyard.md).\n\n## Решения владельца\n- Интерфейс сделан из вещей мира. У причала и на верфи — ленты плиток вдоль низа экрана, как в гараже NFS ([Гавань](../base/pier.md), [Верфь](../base/boatyard.md)); 2026-11-11 плитки стали прозрачным стеклом Frutiger Aero с движением ([Компоненты](../art/components.md)).\n- 2026-11-12: стекло перенесено с плиток базы на меню, карточки верфи и HUD ([Компоненты](../art/components.md)).\n- 2026-11-13: судовой журнал — окно матового стекла со строками. Каждое сохранение — строка с маленьким снимком; выбранная строка — в стекле со светом, как в меню. Бумаги, скотча и рукописного шрифта в нём нет.\n- Добыча продаётся на экране торговца, а не на квитке (2026-11-13): бумаги в интерфейсе больше нет, квиток, его штамп и скотч ушли ([Добыча](../gameplay/haul.md)).\n- Редактор карт, отладочная карточка, селектор демо и шторка загрузки — программные окна 2000-х: матовое аквамариновое стекло и глянцевые кнопки. С 2026-11-16 сама игра (запуск, загрузка, новая игра, возврат после гибели) поднимается из тёмного без окна; окно 2000-х осталось инструментам и редакторам.\n- Главное меню при запуске: «Продолжить», «Новая игра», «Настройки», «Выход» (2026-11-14).\n- 2026-11-16: за главным меню — вид боя на воду там, где игра сохранилась; меню — посередине экрана, заголовком — название игры, как раньше. В нём есть «Загрузить». Пляж с кокосами, рисунками на песке и вывеской с названием владелец посмотрел и снял в тот же день.\n- 2026-11-16: выбранный пункт меню тише — тонкая кромка света и блик в стекле вместо пилюли с широким свечением; за меню паузы мир размыт и видно, где ты; сама игра поднимается из тёмного, а окно 2000-х осталось инструментам и редакторам.\n- Меню паузы в бою, с сохранением и загрузкой по слотам. Онлайн оно не останавливает бой ([Онлайн-кооп](../online.md)).\n- 2026-11-16: за меню паузы мир размыт, как будто у камеры ушёл фокус, чуть притемнён, а вид немного приближается, пока меню открыто; меню показывает, где ты. Сменено: сцена под меню затемнена слегка и только слева, чтобы стекло оставалось стеклом (решение без владельца, [Q166](../questions/interface.md#q166)).\n- Страница настроек в меню с тем, что игроку нужно задать. Апскейлер — одна из настроек; MetalFX Temporal пока остаётся по умолчанию. Общего выключателя звука нет: музыку и эффекты убавляют их шкалами. У шкал есть стрелки влево и вправо.\n- Игра сохраняется сама: см. [Прогресс и сохранения](../gameplay/progression.md).\n\n## Как устроено\n- **Меню** (`ui/Menu.cs`, `ui/Pill.cs`): столбец простых белых слов у левого края, приходящих одно за другим, заголовок — прямо над ним; стекло только на выбранном пункте — прозрачная пилюля с тонкой светлой кромкой и бликом, к которой по столбцу скользит линза света ([Компоненты](../art/components.md), решение без владельца: [Q166](../questions/interface.md#q166)); курсор берёт фокус, так что выбран один. Пилюли столбца одной ширины — по самой широкой. «Выход» отделён от остальных пунктов промежутком (`Menu.Choice.Apart`). Закрываясь, меню сразу отдаёт клавиши и указатель, а пункты уходят влево и тают; новая страница приходит, пока прежняя уходит ([Компоненты](../art/components.md)). Открытие и закрытие звучат тихим низким шорохом, смена страницы — шелестом, шаг шкалы — стеклянным тиком, тем выше, чем полнее шкала, предупреждение — всплеском ([Звук](../audio/sound.md)). Заголовок над столбцом, промежуток перед «Выходом», движение и звуки — решения без владельца ([Q278](../questions/interface.md#q278), [Q279](../questions/audio.md#q279)). Затемнение сцены лёгкое и только у левого края, чтобы стекло оставалось стеклом. `Pill` — одна пилюля; у верфи они прозрачные всегда, несут колпачок клавиши и никогда не берут фокус. Стрелки или W A S D и Enter управляют меню. Заметка меню встаёт выноской у пункта, который её вызвал. Выбор, теряющий прогресс, предупреждает выноской при первом нажатии и действует при втором. Уход из игры её сначала сохраняет, так что «Выход», «Демо», редакторы, вход в чужую игру, «Загрузить» и «Новая игра» журнала предупреждают, только когда сохранить некуда (новая игра при занятых записях), а гость — о добыче в трюме в море хоста ([Q62](../questions/interface.md#q62)).\n  - **Главное меню** (`Game.Welcome`): то же меню посередине экрана (`Menu.Centred`): название игры по центру над пунктами, пункты одной ширины со словами посередине, вокруг середины экрана лёгкое затемнение, чтобы слова читались над морем. При запуске оно стоит над водой там, где игра сохранилась, в виде боя; бой под ним стоит, а море, небо и часы мира идут. «Продолжить» (есть сохранение) отдаёт руль; «Новая игра» начинает с начала в первой пустой записи (когда заняты все, с первого нажатия предупреждает, что сама она не сохранится); «Загрузить» (есть хоть одна запись) открывает журнал; «Настройки»; «Выход». Esc на его собственных пунктах ничего не делает (`Menu.Root`). Мир игры поднимается за тёмной шторкой с маленьким кольцом загрузки в углу и проявляется из тёмного за секунду с небольшим (`Curtain` без слов).\n  - **Меню одно** (`Game.Pause`, Esc в море и у причала), отдельного меню базы нет (2026-11-13): «Продолжить», «Сохранить», «Загрузить», «Кооператив», «Настройки», «Инструменты», «Выход». «Инструменты» — страница с «Демо», «Редактор карт», «Редактор сюжета». В одиночной игре меню ставит игру на паузу; со связью бой идёт дальше, и заголовка «Пауза» у меню нет. «Выход», «Инструменты» и вход в чужую игру сохраняют игру и действуют сразу ([Прогресс и сохранения](../gameplay/progression.md)). В пробе карты из редактора пункты — «Продолжить», «Настройки», «В редактор», «Выход». Состав меню и страница «Инструменты» — решение без владельца ([Q180](../questions/interface.md#q180)).\n  - **Мягкий фокус за меню паузы и за картой** (`ui/SoftFocus.cs`, `ui/soft_focus.gdshader`): пока меню открыто, мир за ним плавно размывается, чуть темнеет к тени палитры и приближается на несколько процентов, а с закрытием возвращается; под судовым журналом, открытым из меню, он остаётся. За меню он лежит своим слоем над HUD; за картой (M) — первым в HUD (`Hud`), поэтому мягкими становятся только мир, дождь и взрывы, а приборы, трюм и расходники остаются резкими (решение без владельца, [Q291](../questions/interface.md#q291)). Приём: один проход на весь экран под слоями меню читает экран через цепочку мип-уровней, которую Godot строит размытой, — девять выборок при любой силе размытия. Приближение — масштаб картинки к её середине: для камеры это то же, что сузить поле зрения. Меняется только картинка, поэтому онлайн бой под ним идёт; пока меню и карта закрыты, он ничего не стоит. Сила размытия, притемнение и приближение — тип `SoftFocus` в `ui/look.tres`; они и то, что фокус держится под журналом, — решение без владельца ([Q281](../questions/interface.md#q281)).\n  - **Где ты, в меню паузы** (`ui/Bearings.cs`), справа вверху: имя ближайшего места, которое называет карта (`areas/Gazetteer.cs`): гавань, станция «Мария», форт пиратов, круг арены по имени её вставки («Пост броненосца»); дальше от них — остров, риф или скалы по имени, если берег недалеко, а в стороне от всего — «Открытое море». Под именем — лодка и монеты в руках, ниже — когда игра сохранилась («Сохранено 2 мин назад», `Progress.SavedAt`); в пробе карты строки о сохранении нет. Онлайн ниже — команда: лодка каждого товарища и на плаву она или на дне. Пока меню открыто, строки обновляются сами. Состав, место и названия — решение без владельца ([Q280](../questions/interface.md#q280)).\n- **Экран торговца** (`ui/Counter.cs`): у пирса и у станции, поверх сцены; как он устроен — [Добыча](../gameplay/haul.md).\n- **Настройки** (`ui/Settings.cs`): страница стеклянных переключателей, шкал и выборов (`Gloss.Switch`, `Gloss.Gauge`): язык ([Язык](language.md)), громкость музыки и эффектов, полный экран, VSync, разрешение, масштабирование и сила тряски экрана шкалой в четыре деления, от «нет» до той, что была всегда (`IsometricCamera.Jolt`; прежний выключатель «выключено» становится нулём), и такая же шкала вибрации геймпада (`Rumble.Strength`, [Звук](../audio/sound.md)), выключатель «Меньше вспышек» для молний (`Lightning.Gentle`, [Погода](../world/weather.md)); каждая устанавливается сразу, как задана, и хранится в `user://settings.cfg` отдельно от сохранений; никогда не заданная остаётся такой, как игра стартует ([Q74](../questions/interface.md#q74)). Шкала (`Menu.Gauge`) поднимается на нажатие, за полной идёт к нулю, а «Влево» и «Вправо» шагают по ней, как и стрелки по её бокам (`Gloss.Nudger`); щелчок по делениям ставит шкалу на них. Выбор (язык, масштабирование) — та же шкала с именами: стрелки и «Влево»/«Вправо» листают их по кругу. Страница, показанная заново, оставляет фокус на той же кнопке.\n- **Судовой журнал** (`ui/Logbook.cs`, `SaveRow`, `Snapshot`): панель матового стекла, выезжающая снизу в середину экрана; сцена за ней слегка затемнена. Заголовок — тёмные слова на стекле над гравированной линией. Каждый слот сохранения — строка `SaveRow`: бледный номер слева, снимок лодки со скруглёнными углами, имя лодки, дата и монеты (`Progress.InSlot`). Слот, в который игра сохраняется сама, подписан оранжевым «в игре, сохраняется само»; пустой пишет «Пусто». Снимок — маленький `SubViewport` с собственным миром, рисуется один раз на сборку. Почему рендер: это лодка как собрана, а не заменитель. Выбранная строка стоит на стеклянной пилюле строки меню (`Pill.Row`) с тонкой светлой кромкой и бликом, а её слова остаются тёмными; линза света скользит к ней, как в меню. Справа от неё — пилюли «Сохранить сюда» и «Загрузить» (у пустой строки бледная), внизу — «Новая игра» (решение без владельца). W S выбирают строку, за последней — «Новую игру»; A D — пилюлю; Enter нажимает. Указатель выбирает строку, щелчок по строке нажимает выбранную у неё пилюлю. Перезапись, загрузка с потерей прогресса и новая игра при занятых слотах сначала предупреждают стеклянной выноской над пилюлей. Строки, которые не помещаются, прокручиваются к выбранной. Стекло строк и пилюль видит матовую панель через копию экрана по её прямоугольнику. Все размеры — тип `Logbook` в `ui/look.tres`. Его открывают «Сохранить» и «Загрузить» меню паузы и «Загрузить» главного меню ([Q50](../questions/interface.md#q50)).\n- **Окна инструментов** (`ui/Window.cs`, `Pane`, `Skin`, `Drawn`, `Tools`, `ui/frosted.gdshader`): редактор карт, редактор сюжета, отладочная карточка, селектор демо и шторка загрузки редакторов (`Curtain`) — панели того же матового стекла, что и выноски ([Компоненты](../art/components.md)): по краю прозрачное, сцена преломлена по кромке, глубже — бледная аква с матовостью, сверху тонкий светлый кант и серп света. Заголовок — тёмные слова прямо на стекле над гравированной линией; закрыть — маленькая стеклянная бусина с крестиком. Окно всплывает с лёгким перелётом (`Motion.Back`) и может сворачиваться к заголовку (`Pane.Folded`). Внутри окна ничего не читает экран: всё лежит на матовом стекле и просто смешивается с ним. Собственные элементы Godot (`Button`, `LineEdit`, `OptionButton`, `SpinBox`, `HSlider`, `CheckButton`, `ItemList`, `Tree`, `TabBar`, `PopupMenu`, подсказки, полосы прокрутки, `GraphEdit`, `CodeEdit`) получают облик от темы окон (`Window.Theme`), заданной один раз на корне инструмента: инструмент строит обычный `Button` и получает стекло без своих переопределений. Тема рисует их детали в коде (`Skin` — стилбоксы, `Drawn` — значки), цвета берёт из палитры, а размеры, отступы, промежутки и шрифты — из `ui/look.tres` (тип `ToolWindow` и собственные типы Godot с вариациями: `Row`, `AheadButton`, `BarButton`, `CloseButton`, `Told`, `Caption`, `Heading`, `Window*`). Кнопка — прозрачная стеклянная пилюля с тёмными словами; под указателем и нажатая она наполняется светом лагуны, слова белеют с тёмным ореолом; путь вперёд («Играть») горит оранжевым светом игрока; недоступная бледнеет. Поля, выборы и числа — вдавленное стекло с тёмными словами, в фокусе обведены светом лагуны; переключатель — `Gloss.Switch`, ползунок — стеклянная ручка на прозрачной дорожке, залитой светом до ручки; выбранная строка списка горит светом лагуны; полосы прокрутки — тонкое стекло. Отступы окон от краёв экрана, ширина боковых окон, высота подвала и промежутки строк у редакторов и селектора общие. То, что прокручивается, гаснет у края, за которым есть ещё, под маской `ClipChildren` (`Scroll`), так что ни одна строка не обрезается посреди буквы. Всплывающие листы получают тень и матовое стекло от слоя под ними (`Sheets`): Godot рисует всплывающее окно в собственном вьюпорте, который не может матовить за собой; подсказка поэтому — та же бледная аква, но непрозрачная. У полей нет обычного контекстного меню по правой кнопке (`Window.Field`). Окно поверх ленты причала или верфи добавляет вторую копию экрана за кадр.\n"}, {"id": "known-issues", "path": "known-issues.md", "title": "Известные недочёты", "section": "", "date": "2026-11-16", "md": "# Известные недочёты\n\nЧто игрок может увидеть или почувствовать неправильным и что ещё не исправлено. У каждого сказано, что его исправит.\n\n- **Первые две секунды после открытия верфи кадр дольше остального** (около 15 мс, пока камера подходит к лодке); почему, не искали. В остальном кадр во весь экран держит цель 90–100 к/с: море около 10,7 мс, причал и верфь 10–10,7 мс ([замер 11-14](reports/2026-11-14-performance.md)). Исправит то, что найдёт замер этих секунд.\n- **Однажды в долгом бою кадр вырос с 14 до 17 мс** за полторы минуты у поста охотников; во втором таком бою, 85 с, он держался ровно. Вызовы отрисовки и главный поток не росли, значит копилась работа GPU ([замер 11-14](reports/2026-11-14-performance.md)). Исправит то, что найдёт повтор.\n- **У свай причала и у стен форта нет пены**: кромка пены идёт только вдоль рельефа, а сваи и стены — модели. Исправит пена у моделей, стоящих в воде, если её не хватит в игре.\n- **У борта лодки, стоящей у причала в штиль, видны белые полосы брызг** (демо `Quay/Moored`; у причала гавани в игре не замечены): корпус, который чуть покачивается, бросает брызги, как на ходу (`ships/BowSheets.cs`). Исправит порог скорости погружения, ниже которого брызг нет.\n- **На самом широком зуме у краёв кадра нет барашков и следов**: пена живёт в карте 512 м вокруг вида. Исправит карта, которая растёт с видом, если это окажется заметно в игре.\n- **Ракета может пройти над бочкой, миной или нефтью, не задев их**: она скользит над водой и на спуске с волны идёт выше, а нефть поджигает, только упав в неё на склоне волны. Надёжно нефть зажигает взрыв бочки в ней. Исправит попадание ракеты по плавучим целям, считаемое без высоты.\n- **Лодка нового проекта, появившись впервые, задерживает кадр примерно на 30 мс сверх прежнего**: игра один раз на проект запекает её затенение неба ([Свет](art/light.md)), на всех ядрах. Замер вне игры, на загруженной другими сессиями машине: лодки из 8–10 тысяч треугольников по 28–31 мс. Исправит запекание вне главного потока или заранее, за шторкой загрузки.\n- **Загрузка локации с островами длится дольше**: игра запекает затенение неба земли по сетке высот, на всех ядрах. Замер на загруженной другими сессиями машине: 50–310 мс на сетке 1024², 70–105 мс на сетке мира 2048². Исправит запекание вне главного потока, если загрузка станет заметной.\n- **Первое открытие карты занимает один-два кадра**: она один раз рисует дно. Исправит рисование дна за шторкой загрузки.\n- **После сна Mac с открытой игрой она идёт кадром раз в одну-две секунды, пока её не закроют.** По журналу владельца за 11-12: крышку закрыли через две минуты после запуска, и драйвер Metal 277 раз не дождался GPU (`timeout waiting for fence`), из них почти три минуты уже после открытия крышки. То же записали четыре скрытых кейса демо, пережившие тот же сон. Это открытая ошибка Godot ([godotengine/godot#119436](https://github.com/godotengine/godot/issues/119436)): драйвер ждёт кадр не дольше секунды и идёт дальше. Дело в сне системы, а не в выключенном экране: 557 скрытых прогонов демо, шедших при выключенном экране без сна, этой ошибки не записали. Нарочно не воспроизводили: сон обрывает все сессии агентов. Исправит новая версия движка.\n- **Редактор карт замирает на десятки секунд на форме рельефа почти предельного размера**, на верхе ползунка «Радиус» или на 1500 м у ручки края: сетка земли растёт вместе с площадью суши и поднимается в главном потоке. Исправит ограничение размера или подъём земли вне главного потока.\n- **Охотник на полном ходу всё ещё влетает в воронку между двумя морскими столбами, стоящими теснее его ширины**: щупы видят тупик лишь за несколько секунд хода, а на такой скорости корпус не успевает отвернуть. Он упирается, через несколько секунд отходит задним ходом и обходит столбы. Лодку игрока оттуда выводит сам игрок. Исправит взгляд охотника дальше вперёд или сброс хода перед закрытым курсом.\n- **Ракеты пролетают сквозь сарай, мачту и корпус на слипе мастерской**: в гавани твёрды только настилы и слип ([Гавань](base/pier.md)). Исправят преграды по надстройкам модели.\n- **У причала лента лежит поверх сарая и слипа, а лодку у первого места частично закрывают ванты и флажки мачты.** Исправит сдвиг вида у причала или перенос мачты.\n- **Слишком тяжёлая лодка на верфи тонет у причала, и на её месте видна яма в пене**: вид верфи стоит неподвижно и за корпусом под воду не идёт. Исправит лодка верфи, которую держат на плаву.\n- **На верфи лента мест самой большой лодки заходит под кошелёк и «Готово»**: у канонерки с тремя местами снаряжения одиннадцать плиток, и ряд шире места слева от показателей. Исправит лента, которая сжимает плитки, когда их много.\n- **Гости не видят мель и затонувшее судно хоста, если он начал кооператив посреди захода**: места промысла хоста появились до гостей ([Q181](questions/online.md#q181)). Исправит рассказ о них пришедшему гостю.\n- **Имён игроков над лодками товарищей нет нигде**: они были только на экране базы ([Q140](questions/online.md#q140)). Исправят имена над лодками в мире.\n- **Две лодки роя могут на мгновение коснуться бортами, когда трогаются с места**: медленные корпуса расходятся позже. Видно в демо Hunters/Swarm. Исправит расхождение, которое смотрит дальше вперёд на малом ходу.\n- **Лодка, зашедшая за станцию, скрыта её надстройкой**, как за горой: силуэта сквозь неё нет. Исправит силуэт лодки игрока за высокими вещами.\n- **Охотник видит лодку сквозь станцию**: её корпус закрывает путь ракетам и лодкам, но не взгляду, который проверяет только сушу (`Lookout.Sees`). Исправит станция как преграда взгляду.\n- **Ящики на воде с высоты боя различаются почти только цветом**: силуэты бочки, тюка и сундука на таком расстоянии сливаются. Исправят более крупные или более разные силуэты.\n- **Часть интерфейса после перевода на стекло видели только на кадрах демо**: диалог, радио, циферблат рыбалки и окна инструментов; подсказки и деревья в окнах инструментов не попали ни в один кадр. Старт, бой, карту, меню, журнал, настройки, экран торговца, ленту причала, верфь, отладочную карточку и гибель видели на кадрах самой игры (демо `Opening`, полный размер, 2026-11-13); играть в них владельцу ещё предстоит.\n- **Гостю в кооперативе негде взять ящики**: добыча на воде не онлайн. Ящики потопленных охотников плавают только на море хоста; лодка гостя собирает их там в трюм, которого гость не видит, а трюм на его машине пуст: нечего продать и нечем заплатить за расходник. Исправит добыча на воде онлайн ([Онлайн](online.md)).\n- **Каждый слой стекла, читающего экран, стоит около 0,4–0,7 мс кадра** при 3024×1964: всё нарисованное под первым стеклом проходит по экрану отдельно, и экран копируется. У причала, торговца и меню копируется только прямоугольник под стеклом; верфь копирует весь экран ([Компоненты](art/components.md)). HUD в бою экран не читает. Исправило бы стекло без чтения экрана там, где преломление не видно.\n- **Окно инструмента поверх ленты причала или верфи добавляет вторую копию экрана** (уже без цепочки мипов): отладочная карточка (F3), редактор, селектор демо. Диалог копирует экран только в прямоугольнике своей выноски и ответов; эта цена не замерена.\n- **Новый звук никто не слушал, а новые эффекты видели только на кадрах**: уровни, приседание музыки, звуки моментов, живой остров и громкость интерфейса выставлены по приборам на фильмах скрытых прогонов ([Звук](audio/sound.md), [Q225](questions/audio.md#q225)–[Q239](questions/audio.md#q239)); вибрация проверена по значениям движка, без геймпада в руках; движение взрывов, колец и потопления оценено по полосам кадров, не в игре; Windows не пробовали. Исправит игра владельцем: демо `Sounds` и `Effects`, затем бой. Станцию «Шанти» тоже никто не слушал: её громкость и голоса котов выставлены по приборам на отрисовке вне игры ([Q293](questions/audio.md#q293), [Q294](questions/audio.md#q294)).\n- **Гость в кооперативе не слышит реплику дающего задание и не видит его буй на воде**: буй и рация только у хоста, гостю видны золотая рябь и кольцо на карте ([Онлайн-кооп](online.md)). Исправят буи и реплика, рассказанные гостям.\n- **Строка «Потоплен» выходит в цвете игрока и за лодку, которую потопил не он**: рабочую лодку на мине или лодку, потопленную охотником ([HUD](interface/hud.md)). Исправит строка, которая знает, кто потопил.\n- **Лодку, подброшенную взрывом, игра считает прыжком** и может долить за него нитро ([Забавы](gameplay/toys.md)). Исправит прыжок, который не считается сразу после взрыва.\n- **Награда за буйство или за последнюю посылку может не влезть в маленький трюм**: выходит «Трюм полон», и лишние ящики остаются на воде. Исправит награда по размеру трюма или монетами ([Q199](questions/missions.md#q199)).\n- **У патруля нет мигалки и сирены, а рабочие лодки и патруль одеты во временную краску** ([Q189](questions/world.md#q189)). Исправит облик, который опишет владелец.\n- **На карте (M) нет жетонов буйств, посылок и постов патруля**: их находят глазами. Исправит решение, что из этого должно быть на карте ([Q199](questions/missions.md#q199)).\n- **Гость в кооперативе не видит баннер «Потоплен», не слышит его музыку и не узнаёт, что соперник ушёл с добычей**: эти моменты висят на событиях миссии, которые есть только у хоста (`Game.SettingOut`). Исправят моменты на событиях, которые есть у каждой машины (`Boat.GaveWay`), и уход соперника, рассказанный гостям.\n- **Гость не видит цель задания и его союзников**: курьер, броненосец и сухогруз конвоя отмечены только у хоста (`Game.Marked`), так что у гостя нет ни метки цели, ни её силуэта. Исправят метки цели и союзника, переданные гостям с лодкой (`Say.Launched`).\n- **Когда тонет вся команда, гость не видит «Погиб»**: конец показывает и сохранение грузит только хост, а гостя просто снова сажают в мир хоста. Исправит слово хоста о гибели команды перед загрузкой.\n- **Снимки лодок в журнале и картинки улова, нарисованные в дождь, темнее**: их маленькие миры берут облака и бурю главного мира (`sky/sunlight.gdshaderinc`), а рисуются один раз. Исправит снимок, который облака не берёт.\n- **Мангры и пальмы не тают перед лодкой, как земля**: растворение перед лодкой есть только у земли (`ground.gdshader`), и лодку в кромке мангров закрывают кроны. Исправит то же растворение у мангров и пальм.\n- **В облачную погоду волны выше, а барашков не больше**: проход барашков (`waters/wakes_press.glsl`) не знает о ветре облачной погоды, который поднимает волны. Исправит ветер, переданный этому проходу.\n- **Шипение дымовой завесы глухо, когда нарастает и стихает**: его громкость меняется громкостью проигрывателя, которую движок принимает за расстояние (`audio/Hiss.cs`; [Звук](audio/sound.md)). Исправит громкость внутри голоса, как у мотора и киля.\n"}, {"id": "online", "path": "online.md", "title": "Онлайн-кооп", "section": "", "date": "2026-11-16", "md": "# Онлайн-кооп\n\n![Мастерская корабела, у причала которой встречаются лодки товарищей](img/pier.jpg)\n\nКооператив по сети: до четырёх игроков, каждый в своей лодке. Хост ведёт бой, гости присоединяются к нему.\n\n## Решения владельца\n- Кооператив, онлайн: до четырёх игроков, каждый в своей лодке, встречаются в лобби Steam или локальной сети. Мир хоста хранит прогресс и добычу каждого игрока, у каждого свои. Игрок присоединяется к заходу, который уже идёт, а выбывший возвращается в него. Игрока, чья лодка затонула, можно вернуть, пока идёт таймер; после него вернуть лодку могут припасы позже в заходе.\n- Инженерное правило «онлайн с самого начала» (каждая система написана для лодок нескольких игроков и хоста, который ведёт бой: ввод только как `Command` игрока, один игрок выделяется только для местного вида, мир поднимается из зёрен, общих для всех игроков, ничто не останавливает мир для всех) записано в `CLAUDE.md`, принцип 6: [CLAUDE.md](../CLAUDE.md).\n- Потопленную лодку, пока идёт её таймер, возвращает товарищ, который несколько секунд держится рядом с её обломками. Банда играет задания, открытые в мире хоста. Онлайн меню паузы открывается поверх боя, который идёт дальше: лодка игрока сбрасывает газ и дрейфует; в одиночной игре бой встаёт на паузу.\n\n## Как устроено\nКооператив онлайн, до четырёх игроков, каждый в своей лодке. Две или более игр соединяются через «Кооператив» в меню `Esc`, прямо в море (`Game.CoOp`): один открывает своё море для друзей в Steam или в своей сети, остальные находят его и присоединяются. Хост открывает игру посреди захода (`Game.Serve`). Гость, присоединяясь, оставляет своё море и свой трюм, о чём меню предупреждает; уйдя сам («Покинуть игру») или оставшись без хоста, он возвращается в своё море с последнего сохранения (`Game.Leave`). Решение без владельца ([Q181](questions/online.md#q181)).\n\n- **Игроки** (`Player`): у каждого игрока в море есть своя лодка, трюм, топливо, захват цели и выбранное оружие, и он управляет лодкой по последней отправленной `Command`: газ, руль, нитро, отданные приказы (огонь бортом или по курсору, дым, следующее оружие), точка, куда он целит; расходники — среди приказов. Команда местного игрока приходит от его клавиш и геймпада (`Controls`, `Pad`); гостя — по сети. Только местный вид (камера, HUD, силуэты, ощущение выстрелов, музыка) выделяет одного игрока; всё остальное берёт лодки игроков как набор.\n- **Связь** (`Link`): пир Godot (`MultiplayerPeer`) в чистом виде, хост и до трёх гостей, сообщения (`Say`) как варианты Godot: надёжные по одному каналу, состояние каждого кадра ненадёжно по другому, чтобы никогда не ждать за ними. Каждая сторона сначала здоровается версией игры, и пир другой версии отвергается (гостю говорят); сообщение, в котором не хватает слов, нужных читателю, отбрасывается. Она стоит в корне дерева, поэтому переживает переход `Game` между мирами и хранит услышанное для того `Game`, что играет. Связь гостя закрывается, когда он открывает редакторы или демо.\n- **Сеть или Steam** (`Lan`, `Lobby`, `SteamPeer`, `Steam`): хост выбирает одно из двух (решение без владельца, [Q108](questions/online.md#q108)). В своей сети связь идёт по ENet, и гость находит хосты широковещательным UDP-окликом по сети и на этой машине (`Lan`). Порт ENet можно задать в командной строке игры (`--port`, оклик идёт на следующий), чтобы на одной машине хостили две игры: так рядом идут кейсы `Coop` в прогонах демо. Для друзей в Steam хост открывает лобби, видное только друзьям (`Lobby`), а связь идёт через сеть Steam, по ретрансляторам Valve, так что порты открывать не нужно (`SteamPeer`); номер гостя берётся из его Steam ID. Гость так же выбирает, где искать игру: «Присоединиться к другу в Steam» показывает друзей, у чьей игры есть лобби. Steam запускается, только когда игрок открывает игру для друзей или ищет их игры. Пока у игры нет своего App ID, в Steam она числится тестовым Spacewar (480). Steamworks.NET лежит локальным пакетом в `game/online/steamworks/`, его собирает `tools/steamworks.sh`: сборки самого проекта только x64 или x86 и на Apple silicon не грузятся.\n- **Модель** — как в кооперативных боевиках, сервер-слушатель. `Game` хоста ведёт бой (`Relay`): охотников, ракеты и попадания, корпуса, нитро, заход и задания, исход миссии своей карты. Лодка каждого игрока движется на его машине по его клавишам, так что управление остаётся мгновенным, и шлёт свою команду и где лежит, с баком и оружием, как они там стоят; хост ведёт эту лодку по команде, подтягивая её к тому, где она лежит там, и шлёт часы своего боя вместе с лодками. Хост шлёт состояние каждой лодки (`Lie`: ход, корпус, нитро и залп, который охотник выдаёт свечением стоек) в каждом кадре и каждый выпущенный снаряд; `Mirror` гостя выводит каждую лодку в море, рисует её по ходу от руля и подтягивает к хосту, её корпус таким, каким он у хоста, и пускает снаряды других, а свои пускает локально, и там они безвредны (`Boat.Mirrored`).\n- **Один мир**: хост шлёт свою миссию (JSON карты, так что работают и карты самого игрока) и зерно своего мира; игра гостя плывёт в этот мир и просит лодку своего проекта, которую хост выводит в море рядом со своей: на ходу борт о борт, у причала — к свободному месту (`Game.Beside`). Игрок, присоединившийся на ходу, тоже выходит в море.\n- **Зоны карты**: хост шлёт зерно раскладки, и каждая машина раскладывает по нему зоны миссии (`areas/Laying.cs`). Опасности хоста сообщают опасностям гостя, что делать (`Hazards`, `Showing`): мины и бочки пропали, пятно зажглось, импульс и просветы башни, залпы батареи, прицел и обломки (батарею называют её номером в порядке, в каком их ставили, так что и орудия форта пиратов), ход и захват луча, каждый взрыв; опасности гостя никому не вредят (`Shown`). Стены всё равно действуют на лодку самого гостя там (`Boat.Eased`). Гость, присоединившийся посреди огня, пропускает заряд башни. См. [Зоны и опасности](world/areas.md).\n- **Буйства** (Coop/Toys): жетоны лежат на каждой машине, как остальные зоны; решает хост. Он сообщает, что жетон взят или вернулся (`Say.Offered`) и как идёт буйство лодки: счёт, оставшиеся секунды и чем кончилось (`Say.Rampage`, `Hazards`, `Showing`, `Rampages.Show`). Гость видит свой счёт и часы на своём HUD, а награду высыпает его собственная игра у его лодки: трюм гостя лежит на его машине ([Забавы](gameplay/toys.md)).\n- **Прыжки** (Coop/Toys): полёты лодок игроков считает хост и сам доливает нитро; гостю он сообщает полёт (`Say.Flew`, `Relay`, `Mirror`, `Jumps.Show`), а «+НИТРО» приходит тем же словом, что взятый припас. Рекорд каждый хранит в своём сохранении ([Забавы](gameplay/toys.md)).\n- **Спрятанные посылки**: у каждого игрока свои, на его машине: игра гостя раскладывает посылки карты хоста, показывает те, что не нашёл её игрок, берёт их только его лодкой, пишет в его сохранение и сама высыпает награду у его лодки ([Забавы](gameplay/toys.md)).\n- **Звук гибели**: треск ломающегося корпуса, его уход под воду и шлепок посадки с прыжка звучат от событий самой лодки (`Boat.GaveWay`, `WentUnder`, `CameDown`), так что гость слышит их на своей машине, как хост ([Звук](audio/sound.md)).\n- **Удары между корпусами**: хост сообщает каждый (`Say.Blow`, из `Ramming.Rammed`), в том числе по лодке самого гостя, и гость показывает его один раз: искру, звук, метку попадания и сигнал музыки. Собственные касания гостя между его копиями лодок ударов не дают (`Ramming.Told`), так что медленный удар не теряется и ни один не показывается дважды; таран самого гостя показывается через мгновение после касания, когда до него доходит слово хоста.\n- **Плотники**: заплату лодке гостя делает хост и сообщает её (`Say.Patched`, из `Carpenters.Patched`); гость показывает её на своём HUD, как игрок в одиночной игре (`Carpenters.Show`). См. [Бой](gameplay/combat.md).\n- **Моменты боя** (Coop/Fight): картинка и звук боя висят на событиях, которые есть на каждой машине. Удар по корпусу, починка, гибель и уход под воду гость получает из корпуса, который шлёт хост (`Boat.Beaten`, `Mended`, `GaveWay`, `WentUnder`, из `Boat.Match`). Парирование и приводнение после прыжка каждая машина считает сама (`Gunnery.Parried`, `Boat.CameDown`): заряды и качка у неё свои. События зон и дронов гость поднимает по словам хоста и по лодкам на своём море (`Slicks.Lit`, `Searchlights.Caught`, `Barrages.Warned`, `Wing.Launched`, `Aboard`, `Lost`).\n- **Дым**: хост шлёт с каждой лодкой, ставит ли она завесу (`Lie.Smoking`), и её копия у гостя зажигает свой дымогенератор (`Smoke.Match`). Клубы у каждой машины свои; кого завеса прячет от охотников, решает хост.\n- **Пауза**: онлайн меню Esc ничего не останавливает (бой встаёт на паузу, только когда нет связи), а команда игрока, пока оно открыто, пустая: газ и руль по центру, приказов нет, так что лодка сбрасывает газ и дрейфует (Coop/Paused). Бой при этом слышен приглушённо ([Звук](audio/sound.md)). Торговля у станции и стоянка у причала тоже не ставят бой на паузу ([Станция](world/outpost.md), [Гавань](base/pier.md)).\n- **Подъём затонувшей лодки** (`Revive`): пока идёт окно затонувшей лодки, товарищ в море, который медленно держится рядом с её обломками, поднимает её (`Boat.Raise`: целая, на месте, трюм пуст). Хост решает и считает; `Lie` уже несёт корпус, и `Boat.Match` поднимает лодку у гостя. Гость считает то же только для показа: кольцо на воде вокруг обломков с золотой дугой удержания и секундами окна (`Markers`); свою лодку игрок видит в кольце с подписью. Затонувшая лодка (`Gone`) остаётся в мире и у гостя, пока она нужна (`Mirror.Crews`). Окно, расстояние, скорость и время удержания — решение без владельца, [Q124](questions/online.md#q124), [Q125](questions/online.md#q125). Coop/Revive. Пока на плаву нет ни одного товарища, окно не показывается: одинокой потопленной лодке HUD подъёма не обещает.\n- **Сухая лодка**: с пустым баком лодка ползёт малым ходом ([Лодка](gameplay/boat.md)); гость ведёт её сам, как с топливом.\n- **Припасы**: описаны в [Припасах](gameplay/pickups.md) (`Say.Supplied`, `Say.Took`).\n- **Расходники**: трюм гостя лежит на его машине; гость платит ящиками у себя, и трата идёт хосту приказом, как огонь; хост чинит, заправляет или взрывает. Что дал расходник, хост сообщает тем же словом, что и взятый припас (`Say.Took`), и гость видит ту же надпись и слышит тот же звук, что в одиночной игре (Coop/Kits). Взять ящики гостю пока негде: добыча на воде не онлайн.\n- **Торговля**: каждый игрок продаёт свой трюм на экране торговца у себя, и монеты его; мир при этом не встаёт. Ремонт, купленный у «Марии», гость оплачивает у себя, а починка идёт хосту приказом `Order.Mend`, как расходник; топливо гостя и так лежит у него ([Добыча](gameplay/haul.md)).\n- **Соперники**: команды ведёт хост, гость видит их, как всякую лодку хоста; реплики капитанов решает хост и сообщает гостям (`Say.Radio`), и у гостя они звучат так же ([Соперники](gameplay/rivals.md)).\n- **Жизнь моря и розыск**: рабочие лодки и патруль ведёт хост, гость видит их, как всякую лодку хоста. Уровень розыска каждой лодки, видит ли её патруль, добыча ли она для турелей и что делает сеть рыбака идут с каждой лодкой каждый кадр (`Lie`); перекраску гостя даёт хост по его слову (`Order.Repaint`).\n- **Заход онлайн**: хост раз в секунду сообщает гостям цели захода и метки заданий, а каждое объявление — когда оно прозвучало (`Say.Run`, `Say.Told`, `Relay.Run`, `Mirror.Ran`, `Mirror.Called`). Гость показывает их на своём HUD ([Q133](questions/online.md#q133)). Слова хоста (цели, объявления, причина вердикта) идут фразами: английский текст и вставленные в него числа (`Phrases`), и гость переводит их сам ([Язык](interface/language.md)). Хост решает и платит за за
