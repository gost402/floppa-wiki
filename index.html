t=\"Vacuum\"> **Водоворот-буй** | Dark Seer *Vacuum* | По носу (бросок) / 20 с | Бросаешь буй перед собой: через 0,8 с закручивается белая воронка, стягивающая все малые и средние лодки в центр под торпеду или залп. | **A:** притягивает заодно плавающие ящики добычи · **B:** дольше крутит, но меньше радиус |\n\n### 3. Защита, парирование и выживание\n\n| Умение | Ориентир | Прицел / КД | Как работает на воде и как читается | Модификаторы A / B |\n|---|---|---|---|---|\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/abaddon_aphotic_shield.png\" alt=\"Shield\"> **Аварийный барьер** | Abaddon *Aphotic Shield* / Priest *PW: Shield* | Себе / Союзнику / 14 с | Кольцо-щит вокруг корпуса на 4 с: снимает горение и замедление, поглощает 3 попадания, а при пробитии **взрывается волной** по врагам вокруг. | **A:** вешается на ближайшего раненого союзника · **B:** 3 чётких сегмента-отражателя (как *Refraction*) |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/nyx_assassin_spiked_carapace.png\" alt=\"Carapace\"> **Отражающий корпус** | Nyx *Spiked Carapace* / Warrior *Spell Reflect* | Себе / 12 с | Короткое окно 1,4 с (яркая аква-обводка борта): первая попавшая ракета не наносит урона, а **летит строго обратно** в стрелка и глушит его на 1,2 с. | **A:** отражает весь залп 0,7 с вместо 1 ракеты · **B:** после отражения сбрасывает кд нитро |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/puck_phase_shift.png\" alt=\"Phase Shift\"> **Краткий нырок** | Puck *Phase Shift* / Rogue *Vanish* | Себе / 16 с | То самое снаряжение, о котором владелец упоминал в [Сборках](../gameplay/builds.md): лодка уходит под волну на **2 с** (виден тёмный силуэт и пузыри) — неуязвима, сбрасывает захват, но не стреляет. | **A:** всплытие даёт всплеск-отталкивание вокруг · **B:** можно медленно подруливать под водой |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/weaver_time_lapse.png\" alt=\"Time Lapse\"> **Отмотка курса** | Weaver *Time Lapse* | Себе / 30 с | Пунктирная дуга тянет лодку назад в точку, где она была **3,5 секунды назад**, возвращая прочность (если была выше) и снимая дебаффы. | **A:** оставляет в старой точке взрывную приманку · **B:** кд 22 с, но возвращает только позицию |\n\n### 4. Подвижность, таран и манёвр\n\n| Умение | Ориентир | Прицел / КД | Как работает на воде и как читается | Модификаторы A / B |\n|---|---|---|---|---|\n| <img class=\"sk-ico\" src=\"https://wow.zamimg.com/images/wow/icons/large/ability_warrior_charge.jpg\" alt=\"Charge\"> **Разгонный таран** | Warrior *Charge* + Primal Beast *Onslaught* | Зарядка на ходу / 14 с | Удерживаешь кнопку — лодка рычит и набирает форсаж, отпускаешь — бросок вперёд. Столкновение отбрасывает и оглушает врага на 1,5 с. | **A:** увозит врага на носу до острова (Magnus *Skewer*) · **B:** при убийстве врага кд сбрасывается |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/kunkka_x_marks_the_spot.png\" alt=\"X-Mark\"> **Буй возврата** | Kunkka *X Marks* / Ember *Remnant* | Себе / 18 с | Первое нажатие бросает яркий маяк на воду; за следующие 6 с можно ворваться, дать бортовой залп и вторым нажатием **рывком вернуться к бую**. | **A:** возврат бьёт волной на финише · **B:** можно повесить на врага и дёрнуть его назад (*Glimpse*) |\n| <img class=\"sk-ico\" src=\"https://wow.zamimg.com/images/wow/icons/large/ability_whirlwind.jpg\" alt=\"Whirlwind\"> **Полицейский разворот** | Warrior *Whirlwind* + Juggernaut *Blade Fury* | Вокруг / 11 с | Резкий разворот на 180° с петухом брызг: сметает круговой шрапнелью рои катерков и на 1 с срезает входящие ракеты с бортов. | **A:** сбрасывает 2 мины веером в процессе разворота · **B:** мгновенно заряжает противоположный борт |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/keeper_of_the_light_blinding_light.png\" alt=\"Gust\"> **Встречная волна** | Drow *Gust* + KotL *Blinding Light* | Конус по носу / 12 с | Мощный вал воды отталкивает таранщиков и сносит летящие в тебя ракеты в стороны. Спасает дальнобойный турельщик и носитель дронов. | **A:** ставится на оба борта вместо носа · **B:** дополнительно замедляет отброшенных на 2 с |\n\n### 5. Поддержка, ауры и кооп (работают и в соло!)\n\n| Умение | Ориентир | Прицел / КД | Как работает на воде и как читается | Модификаторы A / B |\n|---|---|---|---|---|\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/wisp_tether.png\" alt=\"Tether\"> **Буксирный трос** | Io *Tether* | Умный союзник / 12 с | Цепляет трос к ближайшему товарищу на 8 с: оба идут со скоростью более быстрого, ремонт одного чинит второго, а враг, пересекший трос, получает удар и замедление. *(В соло цепляется к дрону/буйку и даёт ускорение).* | **A:** позволяет буксировать обломки товарища в безопасное место для подъёма! · **B:** передаёт +25 % темпа стрельбы |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/juggernaut_healing_ward.png\" alt=\"Ward\"> **Ремонтный буй** | Juggernaut *Healing Ward* / Shaman *Totem* | Вокруг (сброс) / 24 с | Зелёное кольцо на воде на 8 с: быстро чинит все союзные лодки внутри. У буя есть 2 попадания — враги могут его расстрелять, так что его надо прикрывать! | **A:** вместо ремонта ускоряет перезарядку ракет и умений вдвое · **B:** медленно плывёт за твоей лодкой |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/bounty_hunter_track.png\" alt=\"Track\"> **Сигнальная ракета** | Bounty Hunter *Track* + Slardar *Corrosive* | Захват цели / 10 с | Красный сигнальный огонь над врагом на 10 с: виден сквозь дым и за островами, получает +25 % урона от всех игроков и роняет **+1 лишний ящик добычи** при потоплении. | **A:** союзники, идущие к цели, получают +20 % хода · **B:** при смерти метка перепрыгивает на соседа |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/dazzle_shallow_grave.png\" alt=\"Grave\"> **Аварийный клапан** | Dazzle *Shallow Grave* / Paladin *Divine Shield* | Умный союзник / 32 с | Откачка трюма на пределе: 4 секунды выбранная союзная лодка (или своя) **не может опуститься ниже 1 прочности**. Яркий золотой ореол вокруг корпуса. | **A:** в конце возвращает 25 % корпуса · **B:** снимает все замедления и даёт бесплатный рывок |\n\n### 6. Коронные приёмы — «Ульты» (1 слот, долгий откат 40–60 с)\n\n| Умение | Ориентир | Прицел / КД | Как работает на воде и как читается | Модификаторы A / B |\n|---|---|---|---|---|\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/tidehunter_ravage.png\" alt=\"Ravage\"> **Глубинный вал** | Tidehunter *Ravage* | Вокруг (широкий) / 50 с | Три расходящихся кольца подводных взрывов от твоей лодки на пол-экрана: подбрасывает все вражеские лодки, сбивает их залпы и оглушает на 2 с. | **A:** глушит и башни форта/броненосца · **B:** стягивает врагов внутрь вместо подброса (*RP*) |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/ringmaster_wheel.png\" alt=\"Wheel\"> **Буй-карусель** | Ringmaster *Wheel of Wonder* + Axe *Call* | По носу (бросок) / 45 с | Выбрасывает крутящийся музыкальный буй с фейерверками: все охотники в зоне разворачиваются и плывут прямо на него, а через 3,5 с буй сносит всех мощным взрывом. | **A:** взрывается быстрее (2 с) и поджигает воду · **B:** перепрошивает цели стрелять друг в друга (*Winter's Curse*) |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/gyrocopter_call_down.png\" alt=\"Call Down\"> **Наводка арт-удара** | Gyrocopter *Call Down* + Invoker *Sun Strike* | Захват цели / 45 с | Две белые мишени на воде с обратным отсчётом 1,4 с: первый залп замедляет и сбивает броню, второй накрывает крупным взрывом. Идеально против Броненосца и Форта. | **A:** 5 малых залпов по дуге (*Mortimer Kisses*) · **B:** один узкий сверхмощный удар без замедления |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/centaur_stampede.png\" alt=\"Stampede\"> **Шанти-горн отряда** | Centaur *Stampede* + Largo *Rhapsody* + Shaman *Bloodlust* | Команда / 45 с | Капитан включает боевую шанти ([Шанти](../audio/shanties.md)!): на 6 с вся команда рядом получает **+35 % скорости, +30 % темпа залпов** и таран с оглушением. | **A:** мелодия «Штормовой вал» (броня + авто-ремонт) · **B:** переключаемая стойка как у Largo |\n\n### 7. Реакции среды и приёмы Larian (DOS2 & BG3)\n\n| Умение | Ориентир | Прицел / КД | Как работает на воде и как читается | Модификаторы A / B |\n|---|---|---|---|---|\n| <img class=\"sk-ico\" src=\"https://divinityoriginalsin2.wiki.fextralife.com/file/Divinity-Original-Sin-2/nether_swap.png\" alt=\"Nether Swap\"> **Подмена с миной** | DOS2 *Nether Swap* + Vengeful *Swap* | Захват цели / 18 с | Мгновенно меняет местами захваченного охотника с твоей ближайшей плавучей миной, бочкой или с тобой самим. Два ярких кольца-вспышки на воде. | **A:** меняет местами *двух врагов* (бросить таранщика в свой же тыл!) · **B:** оставляет на твоём старом месте дым |\n| <img class=\"sk-ico\" src=\"https://bg3.wiki/w/images/d/da/Thunderwave.webp\" alt=\"Thunderwave\"> **Громовой толчок** | BG3 *Thunderwave* + *Shove* | Конус по носу / 12 с | Ударная волна с огромным импульсом: отбрасывает охотников на 20 м — при ударе о скалу, форт или мель цель получает **двойной урон и оглушение на 1,5 с**! | **A:** круговой взрыв вокруг корпуса · **B:** швыряет заодно и твои плавучие мины вперёд |\n| <img class=\"sk-ico\" src=\"https://bg3.wiki/w/images/0/05/Activate_Call_Lightning.webp\" alt=\"Call Lightning\"> **Штормовая концентрация** | BG3 *Call Lightning* + *Spirit Guardians* + DOS2 *Aero* | Концентрация / 28 с | Пока держишь концентрацию (до 10 с, сбивается торпедой или тараном!), каждые 2,5 с в захваченную цель бьёт молния, **электризуя воду** и дымовые завесы рядом. В дождь/шторм радиус ×1,5! | **A:** защитная аура молний вокруг своего корпуса (*Spirit Guardians*) · **B:** не сбивается от одиночных ракет |\n| <img class=\"sk-ico\" src=\"https://bg3.wiki/w/images/d/d0/Hellish_Rebuke.webp\" alt=\"Hellish Rebuke\"> **Огненный ответ** | BG3 *Hellish Rebuke* + *Counterspell* | Реакция / 14 с | Включается на 4 с (или загорается проком после попадания): первый охотник, попавший в тебя, тут же получает самонаводящуюся зажигательную ракету, **поджигающую нефть под ним**. | **A:** вместо урона срывает спецприём/замах врага (*Counterspell*) · **B:** срабатывает также при попадании по союзнику рядом |\n\n---\n\n## Кооп-комбо на 4 лодки и умения у врагов\n\nВ [«Семи желаниях»](2026-11-15-dream-games.md) отмечена главная проблема коопа без ролей: *«четверым выгоднее прийти на четырёх лучших лодках»*. Система из 3+1 умений решает это сразу в двух направлениях:\n\n1. **Командные цепочки в духе Dota 2.** Один игрок делает то, чем тут же пользуется второй — и оба чувствуют себя героями:\n\n<figure class=\"sk-svg\">\n<svg viewBox=\"0 0 900 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Цепочка комбо на 4 лодки в онлайн-коопе\">\n  <defs>\n    <marker id=\"arr2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\">\n      <path d=\"M 0 1 L 10 5 L 0 9 z\" fill=\"#ef8b2c\"/>\n    <\/marker>\n  <\/defs>\n  <rect x=\"8\" y=\"8\" width=\"884\" height=\"204\" rx=\"12\" fill=\"#0d313b\" stroke=\"#2c7a88\" stroke-width=\"1.4\"/>\n  <text x=\"450\" y=\"34\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"14\" fill=\"#e7f6f6\">ПРИМЕР КОМБО-ЦЕПОЧКИ НА 4 ЛОДКИ ПРОТИВ ПОСТА ОХОТНИКОВ / БРОНЕНОСЦА<\/text>\n\n  <!-- Step 1 -->\n  <rect x=\"24\" y=\"54\" width=\"192\" height=\"140\" rx=\"9\" fill=\"#134552\" stroke=\"#3cc3ce\" stroke-width=\"1.6\"/>\n  <text x=\"120\" y=\"76\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"12.5\" fill=\"#63d1db\">1. АВАНГАРД (ТАНК)<\/text>\n  <text x=\"120\" y=\"96\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">Влетает с «Разгонным<\/text>\n  <text x=\"120\" y=\"111\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">тараном» + жмёт<\/text>\n  <text x=\"120\" y=\"126\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11.5\" fill=\"#ffd29d\">«Глубинный вал»<\/text>\n  <text x=\"120\" y=\"148\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#a8d5dc\">Оглушает рой и берёт<\/text>\n  <text x=\"120\" y=\"162\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#a8d5dc\">огонь на себя (Таунт)<\/text>\n  <text x=\"120\" y=\"182\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" fill=\"#63d1db\">t = 0.0 s<\/text>\n\n  <!-- Step 2 -->\n  <rect x=\"244\" y=\"54\" width=\"192\" height=\"140\" rx=\"9\" fill=\"#134552\" stroke=\"#3cc3ce\" stroke-width=\"1.6\"/>\n  <text x=\"340\" y=\"76\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"12.5\" fill=\"#63d1db\">2. МИНЁР / КОНТРОЛЬ<\/text>\n  <text x=\"340\" y=\"96\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">Кидает «Водоворот-буй»<\/text>\n  <text x=\"340\" y=\"111\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">и чертит вокруг<\/text>\n  <text x=\"340\" y=\"126\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11.5\" fill=\"#ffd29d\">«Нефтяной шлейф»<\/text>\n  <text x=\"340\" y=\"148\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#a8d5dc\">Стягивает врагов в кучу<\/text>\n  <text x=\"340\" y=\"162\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#a8d5dc\">и вешает «Сигнальную»<\/text>\n  <text x=\"340\" y=\"182\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" fill=\"#63d1db\">t = 1.0 s<\/text>\n\n  <!-- Step 3 -->\n  <rect x=\"464\" y=\"54\" width=\"192\" height=\"140\" rx=\"9\" fill=\"#134552\" stroke=\"#ef8b2c\" stroke-width=\"1.8\"/>\n  <text x=\"560\" y=\"76\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"12.5\" fill=\"#f5a04f\">3. БОРТОВОЙ ЗАЛП<\/text>\n  <text x=\"560\" y=\"96\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">Заходит на траверз,<\/text>\n  <text x=\"560\" y=\"111\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">поджигает нефть залпом<\/text>\n  <text x=\"560\" y=\"126\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11.5\" fill=\"#ffd29d\">«Веерный форсаж» + Торп.<\/text>\n  <text x=\"560\" y=\"148\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#a8d5dc\">+25 % урона по метке,<\/text>\n  <text x=\"560\" y=\"162\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#a8d5dc\">цели не могут уплыть<\/text>\n  <text x=\"560\" y=\"182\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" fill=\"#f5a04f\">t = 1.8 s<\/text>\n\n  <!-- Step 4 -->\n  <rect x=\"684\" y=\"54\" width=\"192\" height=\"140\" rx=\"9\" fill=\"#134552\" stroke=\"#63e29e\" stroke-width=\"1.6\"/>\n  <text x=\"780\" y=\"76\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"12.5\" fill=\"#63e29e\">4. ПОДДЕРЖКА<\/text>\n  <text x=\"780\" y=\"96\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">Держит «Буксирный трос»<\/text>\n  <text x=\"780\" y=\"111\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">с танком, вешает щит и<\/text>\n  <text x=\"780\" y=\"126\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11.5\" fill=\"#a8f5cb\">«Аварийный клапан»<\/text>\n  <text x=\"780\" y=\"148\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#a8d5dc\">Снимает горение, ставит<\/text>\n  <text x=\"780\" y=\"162\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#a8d5dc\">Ремонтный буй, даёт Шанти<\/text>\n  <text x=\"780\" y=\"182\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" fill=\"#63e29e\">t = 0.5–4.0 s<\/text>\n\n  <!-- Arrows -->\n  <line x1=\"216\" y1=\"124\" x2=\"240\" y2=\"124\" stroke=\"#ef8b2c\" stroke-width=\"2.4\" marker-end=\"url(#arr2)\"/>\n  <line x1=\"436\" y1=\"124\" x2=\"460\" y2=\"124\" stroke=\"#ef8b2c\" stroke-width=\"2.4\" marker-end=\"url(#arr2)\"/>\n  <line x1=\"656\" y1=\"124\" x2=\"680\" y2=\"124\" stroke=\"#ef8b2c\" stroke-width=\"2.4\" marker-end=\"url(#arr2)\"/>\n<\/svg>\n<figcaption>Рис. 5. Как 4 разные сборки создают «вау-момент» коопа: каждая лодка усиливает ходы остальных, но при этом самодостаточна в одиночку.<\/figcaption>\n<\/figure>\n\n2. **Те же умения — на охотниках и боссах (симметрия и читаемость).**\n   По решению о [глубине боя](../roadmap.md) *«каждый вид охотника просит своего ответа»*. Если выдать элитным охотникам и боссам **5–6 самых наглядных умений из этого же списка** (с яркой подготовкой 1 с и звуком, как уже сделано с красной вспышкой ракетной стойки в [Охотниках](../gameplay/hunters.md)):\n   - **Охотник-гарпунщик** тянет зазевавшегося игрока → контрится *Нырком*, *Отражающим корпусом* или *Встречной волной*.\n   - **Охотник-поджигатель** льёт *Нефтяной шлейф* → контрится *Аварийным барьером* (диспел) или обходом с фланга.\n   - **Охотник-ремонтник** бросает *Ремонтный буй* → приоритетная цель: нужно расстрелять буй или вытащить врага *Гарпуном* из зелёного круга!\n   - **Броненосец ([Ironclad](../world/ironclad.md))** использует фазы *Глубинного вала* (три расширяющихся кольца, через которые нужно прыгать рывком в окно неуязвимости!) и *Наводку арт-удара*.\n\n---\n\n## Как встроить в код и дорожную карту (поэтапный MVP)\n\nСистема не требует переписывать игру — она опирается на уже существующие модули:\n- **Ввод и онлайн (`game/players/Command.cs`):** добавить 4 флага в `Order` (`Skill1`, `Skill2`, `Skill3`, `Ultimate`) + опциональный `SkillHold` для заряжаемых умений. Вся логика перезарядок и снарядов работает на хосте ([Онлайн-кооп](../online.md), принцип 6 `CLAUDE.md`).\n- **Верфь (`game/ships/Parts.cs`, `game/yard/`):** расширить `GearPlaces` (или ввести отдельную категорию палубных модулей `SkillPart : Part` с массой, ценой, моделью на корпусе, кд и ссылкой на обработчик) — тогда **призрак на верфи, вес, цена и отрисовка на лодке заработают автоматически**.\n- **Единый статус-слой (`game/combat/`):** короткий набор из 5–6 универсальных состояний на лодке (`Burn`, `Slow`, `Stun`, `Shield`, `Marked`, `Submerged`), которые одинаково понимают игроки, охотники и `Burn.cs`/`Smoke.cs`.\n\n### Три шага после альфы\n\n1. **Шаг 1 — Вертикальная проба (1 неделя, 1 демо-сцена `Skills`):**\n   - Ввести единый интерфейс `Skill` и перевести существующий **Дым** (`Smoke.cs`) на этот интерфейс.\n   - Добавить **4 тестовых модуля** разных геометрий: **Гарпун** (по носу), **Нефтяной шлейф** (за кормой), **Аварийный барьер** (вокруг/на союзника), **Ремонтный буй** (объект на воде).\n   - Проверить на живой игре: как ощущается на геймпаде, не мешают ли кнопки `Q/E` и `Shift`, читаются ли эффекты на 1080p днём и ночью.\n2. **Шаг 2 — Привязка к 5 сборкам и коопу (2–3 недели):**\n   - Добавить по 1 **врождённой пассивке (Innate)** каждому корпусу (в духе Dota 7.36) и довести библиотеку модулей до **12–15 умений**.\n   - Добавить **1 реактивный прок** на чистое уклонение рывком и парирование ракетой (закрывает пункт «Глубина боя» в этапе Среза!).\n   - Дать 2–3 видам охотников читаемые умения (*Ремонтный буй*, *Гарпун*, *Огненный шлейф*).\n3. **Шаг 3 — Модификаторы A/B и Ульты (Ранний доступ):**\n   - Добавить **4–5 коронных приёмов (Ульт)** для крупных корпусов / наград за боссов.\n   - Для каждого модуля открыть **выбор 1 из 2 переломных модификаторов** (гибрид Dota Facets и ключевых талантов Classic WoW), чтобы две лодки с одинаковыми деталями игрались по-разному.\n\n---\n\n## Открытые вопросы владельцу и границы отчёта\n\nЧтобы перейти от исследования к прототипу после альфы, нужно решить четыре вопроса:\n\n1. **Откуда берутся умения?** Ставятся как детали с весом в `GearPlaces` на [верфи](../base/boatyard.md) (наш совет — вариант А/В), или открываются в отдельной ветке талантов капитана как в Classic WoW (вариант Б)?\n2. **Нужен ли отдельный ресурс или только перезарядки?** Советуем **чистые перезарядки + проки** (без полоски маны), но для агрессивных сборок можно сделать пассивную шкалу *Накала* (как Ярость Воина в WoW).\n3. **Что делать с [расходниками `1–4`](../gameplay/kits.md) и [диковинами `5`](../world/hulk.md)?** Если умения займут `F / R / ПКМ / G` — расходники остаются на `1–4`. Если отдать умениям `1–3` — расходники стоит сжать до одной кнопки или перевести часть диковин (Фейерверк, Магнит) в постоянные модули умений.\n4. **Когда начинать?** По решению 2026-11-16 ([Дорожная карта](../roadmap.md)) новых систем в альфе не начинаем — встанет ли система умений в этап **Среза** (часть «Глубины боя») или позже?\n\n### Чего не проверили\n- Прототипов умений в коде ещё не строили и с геймпада в реальном бою не проверяли: все оценки удобства клавиш (`F / ПКМ / R / G` и `X / Y / B / LB+RB`) — расчётные.\n- Анализ всех 127 героев Dota 2 выполнен по состоянию патча **7.40** (включая Ringmaster, Kez и Largo); после будущих крупных патчей Valve отдельные способности героев могут измениться.\n- Значки умений Dota 2 (`cdn.cloudflare.steamstatic.com`), Classic WoW (`wow.zamimg.com`), Baldur's Gate 3 (`bg3.wiki`) и Divinity: Original Sin 2 (`divinityoriginalsin2.wiki.fextralife.com`), а также шапки Steam подгружаются напрямую с внешних серверов, копий в репозитории нет (при офлайн-сборке срабатывает штатный резерв `tools/wiki.html`).\n"}, {"id": "reports-README", "path": "reports/README.md", "title": "Отчёты", "section": "reports", "date": "2026-11-20", "md": "# Отчёты\n\nОтчёты и исследования, которые раньше жили артефактами Claude. Пока хранятся здесь как есть, на языке оригинала. Это снимки на свою дату: решения и то, как устроена игра, — на страницах тем.\n\n## Выбор облика\n- 2026-11-07 [Облик всей игры](2026-11-07-art-directions/index.html) — шесть обликов на стенде `Art`. Владелец снял их 2026-11-14, стенд удалён.\n- 2026-11-06 [Облик меню](2026-11-06-menu-looks/index.html) — шесть обликов на стенде `Menus`. Наш выбор был Quiet; владелец не взял ни одного, и стенд убран (2026-11-17).\n- 2026-11-06 [Картины меню](2026-11-06-menu-paintings/index.html) — пауза и настройки, нарисованные FLUX. Владелец отверг; с 2026-11-07 картинки нейросетью не рисуем.\n\n## Проверки и разборы\n- 2026-11-14 [Вода заново](2026-11-14-water-overhaul.md) — как делают воду Sea of Thieves, другие игры и открытые проекты на GitHub, и план переделки по шагам.\n- 2026-11-14 [Замер кадра](2026-11-14-performance.md) — кадр по местам во весь экран, цена каждой части на GPU и в главном потоке, что исправить по выгоде.\n- 2026-11-13 [Палитра](2026-11-13-palette-audit.md) — QA проверил палитру: 82 хранимых цвета, из них около 36 независимых. Осталось 21.\n- 2026-11-13 [Список для игры](2026-11-13-play-checklist/index.html) — что построено с конца октября и ждёт оценки владельца, в порядке одной поездки: где это в игре и на что смотреть. Живёт артефактом https://claude.ai/artifact/WDVtDp2GJuSBonAw4hSy8u: оценки («Остаётся», «Чинить», «Вырезать») и заметки хранит его база, коллекция `verdicts`, по документу на вещь. Правишь список — опубликуй артефакт заново из этого файла.\n- 2026-11-08 [Greenlight](2026-11-08-greenlight-review/index.html) — пять издателей оценивают прототип, 4.6 из 10: «вернитесь с вертикальным срезом».\n- 2026-11-08 [Что убрать из игры](2026-11-08-cleanup-audit/index.html) — аудит лишнего. Владелец взял только пункты по коду (4a7b9a56).\n- 2026-11-04 [QA интерфейса](2026-11-04-interface-qa/index.html) — 102 замечания, все исправлены.\n- 2026-11-03 [Пресса](2026-11-03-press-review/index.html) — десять критиков, 63 из 100.\n\n## Другие игры\n- 2026-11-20 [Система умений: Dota 2, Classic WoW, BG3 и DOS2](2026-11-20-dota2-wow-skills.md) — разбор всех 127 героев Dota 2 (включая Ringmaster, Kez и Largo), 9 классов Classic WoW, Divinity: Original Sin 2 и Baldur's Gate 3 с портретами, значками и 5 схемами: архитектура гибридной системы умений поверх верфи, химия поверхностей на воде, 6 геометрий прицеливания под руль и геймпад, каталог из 28 умений и кооп-связки на 4 лодки.\n- 2026-11-15 [Семь желаний](2026-11-15-dream-games.md) — как вышедшие игры делают то, о чём мечтает владелец: сюжет, живой мир с экономикой, заклятых врагов, улучшения, классы и кооп. Пятьдесят игр, от Windward, SPAZ и GTA до Hades и Deep Rock Galactic, кадры магазинов на странице; что общего у лучших, где желания спорят и самая малая форма каждого для нашей игры.\n- 2026-11-14 [Море с нашей камеры](2026-11-14-sea-camera-games.md) — тридцать девять игр с морем сверху, тринадцать разобраны по кадрам, кадры магазинов на странице: мель, пена, след, солнце, берег, ночь; на что смотреть перед шагами 3–6 плана воды.\n- 2026-11-07 [Escape from Duckov](2026-11-07-escape-from-duckov.pdf) и [Dave the Diver](2026-11-07-dave-the-diver.pdf) — разборы игр (PDF).\n- 2026-10-28 [Аркадные морские игры](2026-10-28-arcade-naval-reference.md) — восемь игр-ориентиров для аркадного поворота.\n\n## Времён симулятора\nДо аркадного поворота 2026-10-26; игра с тех пор другая (тег `simulator-game`).\n- 2026-10-13 [Подходы к карте](2026-10-13-map-approaches.md) — как строить карту морской песочницы.\n- 2026-10-11 [Судовой журнал идей](2026-10-11-captains-ledger/index.html) — 518 идей по системам.\n- 2026-10-11 [Becoming Windward](2026-10-11-becoming-windward/index.html) — Windward, WaveWorks и выбор движка.\n- 2026-10-11 [Фэнтезийный архипелаг](2026-10-11-fantasy-archipelago/index.html) — исследование кооп-песочницы.\n- 2026-10-09 [Вода](2026-10-09-water-field-guide/index.html) — справочник по воде.\n\nПредложения по сеттингу лежат на своём месте: [story/lore-proposals.html](../story/lore-proposals.html).\n"}, {"id": "roadmap", "path": "roadmap.md", "title": "Дорожная карта", "section": "", "date": "2026-11-20", "md": "# Дорожная карта\n\nЧто сделать до полного релиза в Steam и в каком порядке. Порядок этапов решил владелец; что внутри этапов и их сроки — наш план.\n\n## Решения владельца\n- Дорожная карта ведёт к полному релизу в Steam; планка — 90 на Metacritic (2026-11-13).\n- Этапы по порядку: альфа — довести до ума то, что в игре уже есть; срез и рядом с ним чужие машины и страница Steam; демо; ранний доступ; релиз 1.0 (2026-11-16).\n- Новая система, о которой попросит владелец, встаёт после альфы или вместо чего-то из её списка (2026-11-16).\n- Железо и проверку сборки для Windows решают к демо (2026-11-17).\n\n## Планка\n90 — мерка для каждой части игры, а не прогноз: столько получают единицы независимых игр в год. У них общее:\n- цикл хорош и в первую минуту, и на двадцатом часу;\n- облик узнаётся по одному кадру;\n- каждые полчаса игрок встречает новое;\n- ничто не мешает: обучение, скорость, управление, доступность;\n- игру долго правили на живых игроках до релиза.\n\nОткуда идём: [Greenlight](reports/2026-11-08-greenlight-review/index.html) поставил прототипу 4,6 из 10 и просил вертикальный срез, [Пресса](reports/2026-11-03-press-review/index.html) — 63 из 100. С тех пор игра выросла: цель с поручениями и финальным боссом ([Задания](gameplay/jobs.md)), кооп через Steam ([Онлайн-кооп](online.md)), одна тема интерфейса ([Компоненты](art/components.md)), жизнь моря, розыск, форт, соперники, открытый мир с сохранением, сутки и погода. Почти всё это ждёт игры владельца, отсюда альфа.\n\n## Порядок\nЭтап начинается, когда у предыдущего выполнено «Готово, когда». Порядок важнее сроков; сроки грубые. Что это за игра, решается в альфе, пока владелец играет то, что есть.\n\n### 1. Альфа: довести то, что есть — около трёх недель\nАльфа — игра, где всё построенное работает, читается и держится вместе. Задания, броненосец, портреты и краска патруля пока заглушки, но не ломаются. Её можно дать друзьям, не извиняясь за поломки.\n\nНовых систем в альфе не начинаем (2026-11-16, выше).\n\n**Владелец играет и решает**\n- Оценки идут в [Список для игры](https://claude.ai/artifact/WDVtDp2GJuSBonAw4hSy8u). Владелец играет одну часть за раз и про каждую говорит: оставить, поправить или убрать. Правки идут между сессиями, поправленное он играет снова.\n- Части по порядку: лодка и бой; гавань, торговец, верфь и первая покупка; жизнь моря, розыск, забавы, форт и соперники; задания и броненосец; погода, сутки и море; звук и музыка; меню, HUD, карта и настройки; кооператив с другом.\n- Убранное уходит целиком: код, демо, слова и страницы вики.\n- После игры [Об игре](vision.md) называет крючок одной фразой, опоры и игрока: какие из [семи желаний](reports/2026-11-15-dream-games.md) стали опорами. Наше предложение опор: лодкой весело править, и руль — это прицел; каждая сборка дерётся по-своему; добычу надо довезти; мир флопп тёплый и смешной; с друзьями лучше.\n\n**Держится вместе**\n- Час игры без вылета и без ошибок в журнале игры (`app_userdata/Pirates/logs`).\n- Сохранения не теряют прогресс: «Продолжить», «Загрузить», автосохранение и загрузка после гибели; сохранение прошлой версии открывается.\n- Кадр без рывков: затенение неба новой лодки и земли, первое открытие карты и первые секунды верфи уходят за шторку загрузки или из главного потока ([Известные недочёты](known-issues.md)).\n- Кадр замерен заново после работы 2026-11-16 (штормы, объёмные облака, ночь, долгий бой) и держит 90–100 к/с во весь экран на Mac владельца.\n- Бой читается на 1080p днём, ночью и в шторм: лодка игрока отличима от охотников, ракеты и попадания видны. Это отметили все пять оценок Greenlight 2026-11-08.\n- Исправлен каждый [недочёт](known-issues.md), который новый игрок встретит в первый час: например, ракеты сквозь сарай мастерской, лента причала поверх сарая, ящики, различимые только цветом. Остальные владелец принимает на время до среза.\n\n**Одна игра, а не стопка прототипов**\n- Весь текст есть по-русски и по-английски, `tools/locale.py --check` чист.\n- Новый звук и эффекты владелец услышал и увидел (демо `Sounds` и `Effects`, затем бой), и их уровни сведены на его слух ([Звук](audio/sound.md)).\n- Управление можно узнать без отладки: сейчас клавиши видны только на отладочной карточке (F3) и в настройках клавиш ([Управление](interface/controls.md)).\n\n**Цикл от начала до цели**\n- Новая игра, первый бой, продажа, первая покупка, задание и броненосец проходятся подряд без тупика, пусть и на заглушках.\n- Первая деталь стоит одного-двух выходов в море ([Прогресс и сохранения](gameplay/progression.md)).\n\n**Кооператив держится**\n- Всё, что есть в игре, либо работает онлайн, либо в кооперативе не появляется ([Онлайн-кооп](online.md)). Гостю есть что подобрать, продать и купить; гость видит буи дающих задания и слышит их реплики; над лодками товарищей их имена.\n- В кооп через Steam сыграли с другом по интернету.\n\n**Сборки**\n- Сборка игрока без демо и стендов: сейчас экспорт берёт весь проект (`game/export_presets.cfg`).\n- Сборку для Windows запустили и сыграли хотя бы раз.\n- Альфа выходит версией 0.1.\n\nГотово, когда: владелец сыграл каждую часть игры и про каждую сказал «оставить», «поправить» или «убрать», а поправленное сыграл снова; час игры у владельца и у двух-трёх друзей, один раз в кооперативе по интернету, прошёл без вылета, потерянного сохранения и тупика; сборки для Mac и Windows без демо вышли версией 0.1.\n\n### 2. Срез — один-два месяца\nТридцать–сорок пять минут игры в качестве релиза: обучение, первый район с его поручениями, первый босс.\n- **Обучение по рации** — первое поручение (2026-11-12, [Задания](gameplay/jobs.md)): руль, рывок, захват цели, швартовка, продажа. Кончается победой.\n- **Глубина боя.** Турель целится сама, ракеты идут в захват, целятся рулём ([Прицел и захват](gameplay/aiming.md)): мастерство — это руль, рывок, парирование и таран. Каждый вид охотника просит своего ответа; после чистого уклонения есть окно для удара; парирование что-то возвращает. Стартовая лодка с одной турелью должна быть интересной: с неё начинает каждый.\n- **Проверка прицела рулём** на игроках с клавиатурой.\n- **Настоящие поручения и босс** вместо заглушек заданий и броненосца.\n- **Флоппы в мире**: модели в гавани и на станции; сейчас флоппы сидят у форта и на корабле на мели ([Люди: флоппы](art/people.md)).\n\nГотово, когда: владелец и его друзья прошли срез до конца и хотят ещё; людям со стороны его покажет демо ([Об игре](vision.md)).\n\n### 3. Чужие машины и страница Steam — рядом с этапом 2\n- Названо самое слабое железо; есть низкий уровень качества; игра идёт на Steam Deck.\n- Бой одинаков на 30 и на 144 кадрах в секунду: лодки и снаряды шагают по времени кадра (`Boat._Process`, `Projectile._Process`). Если расходится — фиксированный такт.\n- Имя и кот решены до любой публичной страницы. «Флоппа» — мем о настоящем каракале; его хозяева уже лицензируют его для игрушек, а портреты игры нарисованы по его фото ([Greenlight](reports/2026-11-08-greenlight-review/index.html): быстрый поиск, не проверка юриста). Нужна письменная лицензия хозяев, или своё имя и свои каракалы.\n- Портреты, логотип и ключевой арт от художника — тоже до неё: Steam спрашивает о картинках от ИИ.\n- Свой App ID вместо тестового, страница Steam и цена, закрытый тест через Steam.\n\nГотово, когда: срез идёт на 60 к/с на названном слабом PC и на Steam Deck, и страница Steam открыта.\n\n### 4. Демо — два-три месяца\n- Срез выходит публичным демо и собирает желающих на странице Steam.\n- Смотрим, где игру бросают и где тонут, и правим срез, пока его не доигрывают.\n- В кооп по интернету сыграли чужие люди.\n\nГотово, когда: демо доигрывают до босса, и отзывы на него в основном хорошие.\n\n### 5. Ранний доступ — шесть-двенадцать месяцев\n- **Линия поручений** до финального босса (2026-11-12, [Задания](gameplay/jobs.md)): четыре-пять районов моря со своим светом, опасностями и охотниками (так умеют [Локации](world/locations.md)), 25–40 поручений, пять-шесть боссов, каждый учит своей [сборке](gameplay/builds.md), финал. Итог — 10–15 часов.\n- **Новое каждые полчаса**: деталь, охотник, опасность или место.\n- **Экономика целиком**: детали приходят с поручениями, и на десятом часу ещё есть чего хотеть.\n- **Реплики**: маленький состав флопп (корабел, мытарь, торговец) с живыми голосами и шутками. Лор по-прежнему выбирает владелец ([Сеттинг и лор](story/setting.md)).\n- **Довести или вырезать** каждую побочную систему, что пережила альфу: [места промысла](gameplay/sites.md), расходники, дроны, редакторы карт и сюжета.\n\nГотово, когда: игру проходят до финала, и отзывы в Steam «очень положительные» или лучше.\n\n### 6. Релиз 1.0\n- Доступность: переназначение кнопок геймпада.\n- Языки сверх английского и русского.\n- Облачные сохранения и достижения.\n- Звук: сведение, временные звуки заменены, одна тема, которую напевают.\n- [Известные недочёты](known-issues.md) пусты.\n- Пресса: Metacritic ставит оценку только после нескольких рецензий критиков, так что нужны издатель или PR, ключи заранее и трейлер.\n"}, {"id": "story-dialogue", "path": "story/dialogue.md", "title": "Диалоги и голос", "section": "story", "date": "2026-11-20", "md": "# Диалоги и голос\n\n![Корабел](../img/shipwright.jpg)\n\n![Диалог: реплика в матовом стекле, ответы списком](../img/dialogue.jpg)\n\nКак показан разговор: портреты, выноска, буквы по одной и кошачий лепет вместо слов. Сами сцены описаны в [Сценах сюжета](scenes.md).\n\n## Решения владельца\n- Разговор с кем-то — диалог, как в визуальной новелле: большой нарисованный портрет каждого говорящего рядом с репликами, лицо меняется по реакции.\n- Портреты стоят у нижнего края экрана, говорящий подсвечен; его реплика в выноске между ними.\n- Выноска — из стекла, как всё стекло интерфейса; ответы стоят списком, как меню; имя говорящего — мелкая подпись (2026-11-12).\n- Говорящие лепечут: каждая буква — короткий кошачий звук, высота зависит от говорящего, одни и те же буквы звучат всегда одинаково. Злые слова рычат (2026-11-06).\n- Реплики движутся: буквы выскакивают, когда их произносят; слова волнуются, трясутся, стоят крупно цветом с блеском или переливаются радугой; некоторые говорятся медленно, паузы держат слова, а лицо посреди реплики меняется с прыжком (2026-11-06).\n- Корабел здоровается с игроком на верфи.\n- Пока идёт диалог, мир и приборы за ним уходят на задний план.\n- Реплики по радио идут в том же стекле, что диалог (2026-11-17).\n"}, {"id": "story-scenes", "path": "story/scenes.md", "title": "Сцены сюжета", "section": "story", "date": "2026-11-20", "md": "# Сцены сюжета\n\n![Мытарь](../img/tollkeeper.jpg)\n\nКак игра рассказывает сюжет: сцены, их поводы, условия, радио. Сцены пишут в [редакторе сюжета](../tools/story-editor.md); как звучат и выглядят сами диалоги, описано в [Диалогах и голосе](dialogue.md).\n\n## Решения владельца\n- Сюжет рассказывают сценами из встроенного редактора сюжета (2026-11-06).\n- Сцены ветвятся по ответам игрока, проверяют условия по флагам и по игре, ставят флаги и действуют в игре, например дают монеты или деталь.\n- Повод рассказывает одну сцену: из тех, чьи условия выполнены, ту, у которой наивысший приоритет. Сцену можно рассказать только один раз.\n- Сцены запускаются у причала гавани и на верфи, до и после выхода в море, по радио в бою и при подходе к флоппе.\n"}, {"id": "story-setting", "path": "story/setting.md", "title": "Сеттинг и лор", "section": "story", "date": "2026-11-20", "md": "# Сеттинг и лор\n\nМир, в котором идёт игра, и правила, по которым в неё попадает лор. Кто в нём живёт: [Люди: флоппы](../art/people.md).\n\n## Решения владельца\n- Сеттинг: оптимистичный мир соларпанка спустя долгое время после падения. Современный мир, из которого он вырос, — далёкое прошлое, и о нём мало что помнят (2026-11-02).\n- Лор попадает в игру и в вики только тогда, когда владелец назовёт кусок. Понравившееся предложение — не приказ его строить.\n- Любой лор, фракцию или механику сверх решённого помечать как предложение.\n- Мир описывают простыми идеями: места и люди — по тому, что они есть («закрытый остров», «наставник на верфи»). Лор держится на простых словах, без глоссариев, придуманных эпох, календарей и титулов: придуманные слова владелец читает как сгенерированный мусор (2026-10-27).\n- Персонажи — роли без имён: капитан, корабел, мытарь.\n\n## Предложения\n- [Предложения по сеттингу](lore-proposals.html) (на английском): пять миров соларпанка после падения и смесь двух из них — затопленного города и закрытого острова. Каждая вкладка — питч, идеи мира, карта, как это играется, таблица идей, сюжет и повороты, мудборд. Ничего из этого нет в игре; владелец выберет куски сам.\n- Владелец читает их с телефона как артефакт: https://claude.ai/artifact/7xXEeNLqmCzpaGSYH9rbZt. Правишь страницу — опубликуй артефакт заново.\n"}, {"id": "todo", "path": "todo.md", "title": "Задачи", "section": "", "date": "2026-11-17", "md": "# Задачи\n\nЧто владелец решил, но в игре ещё не сделано. Задача живёт здесь, пока её не сделают; сделанную удаляют, а решение остаётся на странице темы.\n\n## Мир\n- **Рабочие лодки живее: с ними говорят** — реплики на ходу, когда лодка игрока проходит рядом, разговор с выбором, как с корабелом, и поручения от них (проводить, отбить). Лодок уже меньше (2026-11-17). Разговоры и поручения — новые системы: по [Дорожной карте](roadmap.md) они встают после альфы или вместо чего-то из её списка. Решение: [Жизнь моря](world/life.md), 2026-11-17.\n"}, {"id": "tools-README", "path": "tools/README.md", "title": "Инструменты в игре", "section": "tools", "date": "2026-11-20", "md": "# Инструменты в игре\n\nЧем в самой игре делают карты и сюжет и чем её проверяют в бою. Все открываются из меню `Esc`, страница «Инструменты».\n\n- [Редактор карт](map-editor.md): карты и их задания над живым миром.\n- [Редактор сюжета](story-editor.md): сцены и сценарии.\n- [Меню читов](cheats.md): монеты, припасы и охотники прямо в игре, для проверки.\n\n## Решения владельца\n- Окна инструментов и редакторов — программные окна 2000-х: матовое аквамариновое стекло и глянцевые кнопки.\n"}, {"id": "tools-cheats", "path": "tools/cheats.md", "title": "Меню читов", "section": "tools", "date": "2026-11-20", "md": "# Меню читов\n\nОкно в самой игре, которое даёт монеты, поднимает припасы у лодки и вызывает охотников: чтобы проверять верфь и бой, не зарабатывая монеты и не ища охотников по карте.\n\n## Решения владельца\n- Меню читов в самой игре даёт монеты, припасы и охотников (2026-11-17).\n"}, {"id": "tools-map-editor", "path": "tools/map-editor.md", "title": "Редактор карт", "section": "tools", "date": "2026-11-20", "md": "# Редактор карт\n\n![Редактор карт: окна в матовом стекле](../img/map-editor.jpg)\n\nРедактор в игре, в котором правят карты и их задания над живым миром.\n\n## Решения владельца\n- Редактор карт в игре, открывается из меню `Esc`, «Инструменты». В нём правят локацию карты (острова, рифы, отмели, вода, час, ветер, ветровые волны, зыбь) и её задания (старт, охотники и их роли, маяки и косяки) над живым миром, видным сверху. Карты — файлы JSON: свои карты игрока и карты самой игры; карты игры открываются в нём, чтобы их чинить (2026-11-02).\n- Редактор расставляет круги арены и кадры вставок ([Камера и картинка](../gameplay/camera.md)).\n"}, {"id": "tools-story-editor", "path": "tools/story-editor.md", "title": "Редактор сюжета", "section": "tools", "date": "2026-11-20", "md": "# Редактор сюжета\n\nРедактор в игре, в котором пишут сцены сюжета. Как сцены устроены и когда запускаются: [Сцены сюжета](../story/scenes.md).\n\n## Решения владельца\n- Сцену пишут на холсте графом эпизодов; каждый эпизод — сценарий: кто говорит, с каким лицом, и реплика с метками (2026-11-06).\n"}, {"id": "vision", "path": "vision.md", "title": "Об игре", "section": "", "date": "2026-11-20", "md": "# Об игре\n\n![Охотники идут на лодку игрока у острова](img/world.jpg)\n\nFloppa Tropical Adventures коротко: что это за игра и в каком она состоянии. Мир игры — [Сеттинг и лор](story/setting.md), игра с друзьями — [Онлайн-кооп](online.md).\n\n## Решения владельца\n- Игрок знает игру как Floppa Tropical Adventures (2026-11-03); код и репозиторий зовут её Pirates.\n- Аркадная морская игра: одна лодка, которой управляешь с весёлым ощущением моторной лодки, бой с вражескими лодками на красивом море, статичный изометрический вид 2.5D (2026-10-26).\n- Игра с самого начала живая: всё встраивается в саму игру, настоящий прототип, а не «текст и кнопки» (2026-10-15).\n- Веселье важнее реализма: где реалистичная модель делает игру медленной или раздражающей, делаем то, что делают выпущенные игры (2026-10-27). Реализм оставляем только там, где он делает игру лучше.\n- Игра ощущается как старые GTA: море живёт своей жизнью, неприятности начинает игрок, ответ растёт с тем, что он натворил, и от него можно уйти; игрок всегда в своей лодке (2026-11-13).\n- Платформа — PC. Версии 0.0.N для Mac и Windows выходят с постами в канале игры, по-русски; каждый пост одобряет владелец (2026-11-02).\n- До демо в Steam в игру играет владелец; людям со стороны её показывают с демо (2026-11-17).\n\n## Как играется\nИгра открывается [главным меню](interface/screens.md) над морем и продолжается с последнего [сохранения](gameplay/progression.md) в [открытом мире](gameplay/missions.md). Лодка дерётся с [охотниками](gameplay/hunters.md) с [постов](world/posts.md) карты, берёт [задания](gameplay/jobs.md) и собирает [добычу](gameplay/haul.md), а [продаёт](gameplay/trade.md) её в [гавани](base/pier.md) или на [станции](world/outpost.md); на монеты на [верфи](base/boatyard.md) покупают детали. По морю ходят [рабочие лодки](world/life.md); кто их трогает, попадает в [розыск](gameplay/wanted.md). Ещё в мире стоят [форт пиратов](world/fort.md) и [корабль на мели](world/hulk.md), бродят [соперники](gameplay/rivals.md) и [броненосец](world/ironclad.md).\n\n## Состояние\n- Всё — прототип, и ничто не высечено в камне ([Главная](README.md)).\n- Задания и броненосец пока заглушки. Баланс и доступность настраиваются ближе к релизу. Будут новые функции.\n- Владелец судит игру, играя.\n- Игра идёт к полному релизу в Steam; ближайший этап — альфа, доводка того, что уже есть. Что делаем до релиза и в каком порядке: [Дорожная карта](roadmap.md).\n- Как мы делаем игру — принципы и правила проекта: [CLAUDE.md](../CLAUDE.md).\n"}, {"id": "world-areas", "path": "world/areas.md", "title": "Зоны и опасности", "section": "world", "date": "2026-11-20", "md": "# Зоны и опасности\n\n![Горящее нефтяное пятно](../img/slick.jpg)\n\nЗоны — места на карте: посты охраны, минные поля, нефтяные пятна и прочие опасности. В мире (`maps/world.json`) их около пятидесяти; их ставят в [редакторе карт](../tools/map-editor.md). Откуда выходят охотники: [Посты охраны](posts.md).\n"}, {"id": "world-fort", "path": "world/fort.md", "title": "Форт пиратов", "section": "world", "date": "2026-11-20", "md": "# Форт пиратов\n\n![Форт пиратов на своей скале, чёрные лодки у ворот](../img/fort.jpg)\n\nПиратский остров: старый каменный форт на скале, чёрные лодки под чёрными парусами и флоппы-пираты вокруг.\n\n## Решения владельца\n- Пиратский остров в углу карты — старый каменный форт на скале: стены, бастионы, батареи, флаг над башней; лодки стоят в бухте под ним (2026-11-14).\n- Пираты — своя сторона, заодно с бандой охотников (2026-11-17): форт и его лодки нападают на любую другую лодку рядом — игроков, рабочие лодки и патруль — и ушедшую далеко от форта не преследуют (2026-11-14). Патруль бьёт пиратов, рабочие лодки от них убегают, пиратов топят без розыска (2026-11-17).\n- Их корабли — моторные лодки старого мира, переделанные пиратами: мачта и чёрный косой парус над палубой, флаг на топе (2026-11-14).\n- Пираты — флоппы и сидят на причале, на крышах, у костра и на башне: повязка на глаз, бандана или треуголка, серьга, рваный жилет; чуть крупнее жизни, чтобы читались сверху (2026-11-14). Они поворачивают голову, хвост качается (2026-11-17).\n- Форт можно взять (2026-11-17): когда разбиты все его орудия, форт пал и даёт награду — сокровище из своего двора: монеты (около 300) и россыпь ящиков с добычей на воде у ворот; ящики подбирают и везут к торговцу, как добычу с потопленных лодок.\n- Пираты возвращаются: примерно через игровые сутки они снова держат форт, и его можно взять снова (2026-11-17).\n"}, {"id": "world-ground", "path": "world/ground.md", "title": "Рельеф", "section": "world", "date": "2026-11-20", "md": "# Рельеф\n\n![Остров на отмели и коса](../img/shallows.jpg)\n\nРельеф — земля локации, склеенная из форм рельефа в одно поле высот.\n\n## Решения владельца\n- Карты содержат больше видов земли, каждый ставится в редакторе карт и разнообразится зерном и несколькими числами: горы и вулканы, барьерные рифы, кекуры, косы и песчаные отмели.\n- Горы — голый камень примерно до 120 м: серый камень и отвесные скалы, зелень только у подножия. Земля, закрывающая лодку, становится прозрачной вокруг неё.\n- Барьерный риф — полоса коралла прямо под водой, вдоль берега или дугой в море: зыбь белым разбивается вдоль неё, за ней лежит спокойная бирюзовая лагуна, и в ней прорезаны проходы.\n- Кекуры — карстовые башни высотой от 10 до 40 м: серые столбы с отвесными стенами, подточенные у воды, увенчанные джунглями, как в заливах Пхангнга или Халонг.\n- Косы и песчаные отмели: белые отмели чуть над водой среди светящегося бирюзового мелководья; длинные косы, загибающиеся от берега, с травой на дюнах и пальмами на конце; и валы чуть под водой, через которые прибой разбивается рядами, слишком мелкие для тяжёлой лодки.\n"}, {"id": "world-hulk", "path": "world/hulk.md", "title": "Корабль на мели", "section": "world", "date": "2026-11-20", "md": "# Корабль на мели\n\nВ тихом глазу шторма, который никогда не уходит, за Отмелями, на песчаной банке навсегда сел старый контейнеровоз. На его пирсе на горе хлама сидит старьёвщик и продаёт диковины — странные припасы со смешным действием: фейерверк, магнит и шарики, которые пускают в ход клавишей `5`.\n\n## Решения владельца\n- В тихом глазу шторма, который не уходит, стоит корабль на мели: огромный ржавый контейнеровоз старого мира, накренившийся на песчаной банке; на контейнерах сады и пальмы, на надстройке солнечные панели и ветряк; пирс у борта (2026-11-17, [Шторм](storm.md)).\n- Старьёвщик сидит на горе хлама, который принёс шторм: буи, бочки, старая техника. К нему плывут сквозь шторм за диковинами со смешными эффектами (2026-11-17).\n"}, {"id": "world-ironclad", "path": "world/ironclad.md", "title": "Броненосец", "section": "world", "date": "2026-11-20", "md": "# Броненосец\n\nБроненосец — босс открытого мира. Пока он заглушка.\n\n## Решения владельца\n- Броненосец — мировой босс, как в WoW (2026-11-14): стоит на своей стоянке с начала, без часов, отсчёта и объявлений.\n- У него собственный корпус, больше любого, который может построить игрок, и он дерётся этапами по мере того, как его броня сбивается.\n"}, {"id": "world-life", "path": "world/life.md", "title": "Жизнь моря", "section": "world", "date": "2026-11-20", "md": "# Жизнь моря\n\nРабочие лодки, которые живут на море и ни с кем не воюют: рыбаки, паромы, сухогрузы. Море живёт своей жизнью, а неприятности начинает игрок. Ими, как всеми лодками, правит один ИИ ([Охотники и ИИ](../gameplay/hunters.md)); их команды поют [шанти](../audio/shanties.md).\n\n## Решения владельца\n- Рабочие лодки ходят по маршрутам между гаванью, станцией и краем карты: они сторонятся, убегают, их можно таранить и топить ради ящиков (2026-11-13). У них расписание и живое поведение (2026-11-14).\n- Рыбак ловит сетью со стрелы, снасть чуть крупнее жизни; на косяке плещется рыба (2026-11-14).\n- Рабочие лодки — основа для более подробной жизни мира: торговцев, караванов и прочего (2026-11-13).\n- Рабочих лодок в мире немного, и они живые: с ними говорят — реплики на ходу, разговор с выбором и поручения от них (2026-11-17, [Задачи](../todo.md)).\n- Облик рабочих лодок пока временный (2026-11-17).\n"}, {"id": "world-locations", "path": "world/locations.md", "title": "Локации", "section": "world", "date": "2026-11-20", "md": "# Локации\n\nЛокация — природа места: вода, час, ветер и волны, по которым мир выглядит и играется.\n\n## Решения владельца\n- Открытый мир стоит в своей локации: открытые банки под сильными пассатами.\n"}, {"id": "world-outpost", "path": "world/outpost.md", "title": "Станция", "section": "world", "date": "2026-11-20", "md": "# Станция\n\n![Станция в открытом море, лодка у её плота](../img/outpost.jpg)\n\nПлавучая торговая ботаническая станция «Мария»: большой старый корпус, поставленный на якорь навсегда, с садом и рынком на нём. К ней подходят [торговать](../gameplay/trade.md), не возвращаясь в гавань.\n\n## Решения владельца\n- В море стоит плавучая торговая ботаническая станция, большой корабль-станция по картинке владельца (2026-11-11): синий деревянный корпус-бочонок, надстройка в несколько ярусов с открытыми галереями, стеклянный свод оранжереи, сад на каждой палубе и крыше, мачта с гирляндами. Смоделирована в Blender.\n- Станция одна (2026-11-17).\n- Станцию зовут «Мария», по-английски Mariia (2026-11-12). Имя написано на носу по обоим бортам, латиницей (MARIIA), золотыми прописными с засечками, на тёмно-синей панели фальшборта под планширем, где его видно из вида боя (2026-11-12).\n- Облик станции — уровня лучших инди-игр.\n- Стёкла станции настоящие, прозрачные: сад виден сквозь них (2026-11-11).\n"}, {"id": "world-posts", "path": "world/posts.md", "title": "Посты охраны", "section": "world", "date": "2026-11-20", "md": "# Посты охраны\n\nПосты на карте, с которых выходят [охотники](../gameplay/hunters.md) и [патруль](../gameplay/wanted.md).\n\n## Решения владельца\n- Каждый охотник и каждая лодка патруля выходят со своего поста на карте (2026-11-13).\n- Охотников поста выбирают в редакторе по одному: проект и роль (2026-11-17).\n- Охотников в мире немного; пост выпускает новых, пока игрока нет рядом (2026-11-17).\n- Уровень сложности один, её задаёт мир: слабые посты у гавани, сильные дальше; в коопе посты крепнут с числом игроков; у старта новой игры слабый пост (2026-11-12).\n"}, {"id": "world-sea", "path": "world/sea.md", "title": "Море", "section": "world", "date": "2026-11-20", "md": "# Море\n\n![След лодки на открытом море](../img/sea.jpg)\n\nМоре — вода игры: волны, укрытие и прибой, кильватерные следы, пена, отражение и цвет.\n\n## Решения владельца\n- Цель для воды — самая красивая вода (2026-11-20).\n- Кильватерный след и пена идут от самой лодки и остаются на воде: их рождает и ведёт симуляция воды, а не скорость лодки (2026-11-20).\n"}, {"id": "world-storm", "path": "world/storm.md", "title": "Шторм", "section": "world", "date": "2026-11-20", "md": "# Шторм\n\n![Шторм: тёмные валы с белыми гребнями под ливнем](../img/storm.jpg)\n\nШтормы плывут по миру поверх [погоды](weather.md); один шторм не уходит никогда, и в его тихом глазу стоит [корабль на мели](hulk.md). Как штормы видны на карте: [Карта](../interface/map.md).\n\n## Решения владельца\n- Шторм — огромные волны, тёмные тучи, ливень, молнии со вспышками и гром, сумрак и дымка, а море при этом живое; образец — штормы Sea of Thieves (2026-11-16).\n- Один шторм стоит на карте всегда; другие приходят, плывут по карте и уходят сами, в непогоду чаще (2026-11-16), и приходят редко (2026-11-17).\n- Шторм заметно мешает, но играть в нём можно (2026-11-16). Его волны тормозят лодку на встречной волне, ветер её сносит, а молния бьёт по лодкам рядом, с уроном (2026-11-17).\n- Шторм видно издалека: над ним шапка туч, которая становится прозрачной вокруг лодки игрока, когда та внутри; край шторма широкий и плавный — море темнеет, волны растут, дождь густеет постепенно, ступенями (2026-11-16).\n- Звук шторма — записи CC0 с Freesound: близкие раскаты, далёкий гром, сильный ливень (2026-11-16).\n- Экспозиция в шторме меряется по всему морю в кадре (2026-11-17).\n"}, {"id": "world-weather", "path": "world/weather.md", "title": "Погода", "section": "world", "date": "2026-11-20", "md": "# Погода\n\nНад всем миром сменяют друг друга периоды погоды: ясно, облачно, лёгкий дождь, туман. Поверх них по миру плывут [штормы](storm.md).\n\n## Решения владельца\n- Погода меняется со временем (2026-11-16): над всем миром сменяют друг друга периоды по четыре минуты — ясно, облачно, лёгкий дождь, туман (2026-11-17).\n- Облака рисуются только у шторма (2026-11-20). Тени облаков плывут над водой и сушей (2026-11-06); в облачную погоду тени туч хорошо видны на воде: тёмные пятна бегут по морю (2026-11-16).\n- Туман — пласты ниже палуб, плывут прядями по ветру и прячут море и чужие лодки, вокруг своей лодки рваная прогалина, общая дымка слабая (2026-11-17).\n- В дождь дальше, чем видно с лодки, лежит слабая серая дымка (2026-11-17).\n- Круги и брызги от капель дождя принадлежат морю: лежат на его волнах, как его собственная рябь (2026-11-20).\n"}], "sections": [{"dir": "", "label": "Об игре"}, {"dir": "gameplay", "label": "Геймплей"}, {"dir": "base", "label": "Гавань"}, {"dir": "world", "label": "Мир"}, {"dir": "interface", "label": "Интерфейс"}, {"dir": "art", "label": "Арт-дирекшн"}, {"dir": "audio", "label": "Звук"}, {"dir": "story", "label": "Сюжет"}, {"dir": "tools", "label": "Инструменты"}, {"dir": "reports", "label": "Отчёты"}], "repo": ""}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const byId = new Map(D.pages.map(p => [p.id, p]));
const byPath = new Map(D.pages.map(p => [p.path, p]));
const label = dir => (D.sections.find(s => s.dir === dir) || {}).label || dir;
const catId = dir => dir || 'main';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const day = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${MONTHS[m - 1]} ${y}`; };
const plural = (n, f) => `${n} ${f[n % 10 === 1 && n % 100 !== 11 ? 0 : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2]}`;
const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-').replace(/-+/g, '-');
const anchored = a => /^[\p{L}\p{N}_-]+$/u.test(a);
const norm = s => s.toLowerCase().replace(/ё/g, 'е');
const plain = md => md.replace(/`/g, '').replace(/^\s*(?:[-*]|\d+\.)\s+/gm, '').replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[#*`>|_]+/g, ' ').replace(/\s+/g, ' ').trim();

// A file in the repo, on GitHub; the public site has no repo to link to, so the link goes.
const gh = path => D.repo ? { ext: D.repo + path } : {};

// Resolves a link in a page's Markdown against the page: a wiki page, a wiki file, or an outside URL.
function resolve(from, href) {
  if (/^[a-z]+:/i.test(href)) return { ext: href };
  const u = new URL(href, 'https://w.invalid/wiki/' + from);
  const path = decodeURIComponent(u.pathname), anchor = decodeURIComponent(u.hash.slice(1));
  if (!path.startsWith('/wiki/')) return gh(path.slice(1) + u.hash);
  const rel = path.slice(6);
  if (rel.endsWith('.md')) return byPath.has(rel) ? { page: byPath.get(rel), anchor } : gh('wiki/' + rel);
  // ponytail: only wiki/img ships with the page; reports and PDFs open on GitHub
  return rel.startsWith('img/') ? { file: rel } : gh('wiki/' + rel);
}
const href = (p, anchor) => '#' + (p.path === 'README.md' && !anchor ? '' : p.id) + (anchor && anchored(anchor) ? '--' + anchor : '');

// A page's owner decisions, each with the newest date it carries.
const facts = p => ((p.md.split(/^## Решения владельца\s*$/m)[1] || '').split(/^## /m)[0].match(/^- .*$/gm) || [])
  .map(l => ({ p, l, d: (l.match(/\b\d{4}-\d\d-\d\d\b/g) || []).sort().pop() || '' }));
for (const p of D.pages) {
  let body = p.md.replace(/^# .*\n/, '');
  const pics = [...body.split(/\n## /)[0].matchAll(/^!\[([^\]]*)\]\(([^)\s]+)\)[ \t]*$/gm)];
  for (const m of pics) body = body.replace(m[0], '');
  p.pics = pics.map(m => ({ img: resolve(p.path, m[2]).file, cap: m[1] })).filter(x => x.img);
  if (p.pics.length) ({ img: p.img, cap: p.cap } = p.pics[0]);
  p.body = body;
  p.lead = plain((body.trim().split(/\n\s*\n/).find(b => !/^\s*[#|<!-]/.test(b)) || ''));
  p.text = plain(body);
  p.ntitle = norm(p.title); p.ntext = norm(p.text);
  p.facts = facts(p);
  p.decided = p.facts.reduce((a, f) => (f.d > a ? f.d : a), '');
}
const sectionPages = dir => D.pages.filter(p => p.section === dir).sort((a, b) => (a.path.endsWith('README.md') ? -1 : 0) - (b.path.endsWith('README.md') ? -1 : 0) || a.title.localeCompare(b.title, 'ru'));
const sectionImage = dir => (sectionPages(dir).find(p => p.img) || {}).img;

// ---- page parts
function head(crumbs, title, meta, action) {
  $('crumbs').innerHTML = crumbs; $('title').textContent = title; $('meta').innerHTML = meta || ''; $('action').innerHTML = action || '';
  document.title = title === 'Floppa Tropical Adventures Wiki' ? title : `${title} | Floppa Tropical Adventures Wiki`;
}

// Only Markdown goes through here: the page's own links and images are resolved against its file.
function render(md, from) {
  const d = document.createElement('div');
  d.innerHTML = marked.parse(md); fixup(d, from);
  return d.innerHTML;
}

function fixup(root, from) {
  const seen = {};
  root.querySelectorAll('h2, h3, h4').forEach(h => {
    let s = slug(h.textContent); seen[s] = (seen[s] || 0) + 1; if (seen[s] > 1) s += '-' + (seen[s] - 1);
    h.id = 'h-' + s; h.dataset.anchor = s;
  });
  root.querySelectorAll('a[href]').forEach(a => {
    const r = resolve(from, a.getAttribute('href'));
    if (r.page) { a.href = href(r.page, r.anchor); if (r.anchor) a.dataset.anchor = r.anchor; a.dataset.page = r.page.id; }
    else if (r.file) { a.href = r.file; a.target = '_blank'; a.className = 'file'; }
    else if (r.ext) { a.href = r.ext; a.target = '_blank'; a.rel = 'noopener'; a.className = 'ext'; }
    else a.replaceWith(...a.childNodes);
  });
  root.querySelectorAll('img').forEach(i => { const r = resolve(from, i.getAttribute('src')); if (r.file) i.src = r.file; i.loading = 'lazy'; });
  root.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-scroll'; t.before(w); w.append(t); });
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), dated = [];
  for (let n; (n = walk.nextNode());) if (/\d{4}-\d\d-\d\d/.test(n.nodeValue) && !n.parentElement.closest('code, pre')) dated.push(n);
  for (const n of dated) {
    const s = document.createElement('span');
    s.innerHTML = esc(n.nodeValue).replace(/\b\d{4}-\d\d-\d\d\b(?![\w-])/g, '<span class="date">$&</span>');
    n.replaceWith(...s.childNodes);
  }
}

// The Artifact loads no picture from another site: a copy published beside the page stands in, and with none the caption stays alone.
document.addEventListener('error', e => {
  const i = e.target, src = i.tagName === 'IMG' && i.getAttribute('src');
  if (/^https?:\/\//.test(src)) i.src = 'img/ext/' + src.replace(/^https?:\/\//, '').split('?')[0];
  else if (src && src.startsWith('img/ext/')) i.remove();
}, true);

function toc(root, p) {
  const hs = [...root.querySelectorAll('h2, h3')];
  const first = root.querySelector('h2');
  if (hs.length < 3 || !first) return;
  let a = 0, b = 0;
  const items = hs.map(h => {
    const n = h.tagName === 'H2' ? (b = 0, ++a) : `${a}.${++b}`;
    return `<li class="${h.tagName === 'H2' ? 'l2' : 'l3'}"><a href="${href(p, h.dataset.anchor)}" data-to="${h.id}"><span class="n">${n}</span>${esc(h.textContent)}</a></li>`;
  }).join('');
  const box = document.createElement('nav');
  box.className = 'toc' + (hs.length > 30 ? ' closed' : '');
  box.innerHTML = `<div class="toc-head">Содержание <button type="button">${hs.length > 30 ? 'показать' : 'скрыть'}</button></div><ol>${items}</ol>`;
  box.querySelector('button').onclick = e => { const c = box.classList.toggle('closed'); e.target.textContent = c ? 'показать' : 'скрыть'; };
  first.before(box);
}

function infobox(p) {
  const rows = [['Раздел', `<a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>`]];
  if (p.date) rows.push(['Правка', day(p.date)]);
  if (p.facts.length) rows.push(['Решений владельца', p.facts.length]);
  const fig = (x, lazy) => `<figure><img src="${esc(x.img)}" alt="${esc(x.cap)}"${lazy ? ' loading="lazy"' : ''}><figcaption>${esc(x.cap)}</figcaption></figure>`;
  return `<aside class="infobox"><div class="ib-title">${esc(p.title)}</div>` +
    (p.img ? fig(p.pics[0]) : '') + (p.pics.length > 1 ? `<div class="ib-pics">${p.pics.slice(1).map(x => fig(x, true)).join('')}</div>` : '') +
    `<div class="ib-group">Сведения</div><table>${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table></aside>`;
}

function rail(p) {
  const recent = [...D.pages].filter(x => x.decided).sort((a, b) => b.decided.localeCompare(a.decided) || b.date.localeCompare(a.date) || a.title.localeCompare(b.title, 'ru')).slice(0, 8);
  const li = x => `<li${p && x.id === p.id ? ' class="here"' : ''}><span class="thumb" style="${x.img ? `background-image:url('${x.img}')` : ''}">${x.img ? '' : esc(x.title[0])}</span><span><a href="${href(x)}">${esc(x.title)}</a><small>${esc(label(x.section))} · ${day(x.decided)}</small></span></li>`;
  let html = `<section><h3>Свежие решения</h3><ul>${recent.map(li).join('')}</ul></section>`;
  if (p) {
    const same = sectionPages(p.section);
    html += `<section><h3>${esc(label(p.section))}</h3><ul>${same.map(x => `<li${x.id === p.id ? ' class="here"' : ''}><a href="${href(x)}">${esc(x.title)}</a></li>`).join('')}</ul></section>`;
  }
  $('rail').innerHTML = html;
}

// ---- views
function article(p, anchor) {
  head(`в: <a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>`, p.title,
    p.date ? `Последняя правка: ${day(p.date)}` : '',
    D.repo ? `<a class="btn" href="${D.repo}${encodeURI('wiki/' + p.path)}" target="_blank" rel="noopener">Исходник ↗</a>` : '');
  const c = $('content');
  c.innerHTML = (p.path === 'README.md' ? '' : infobox(p)) + render(p.body, p.path);
  toc(c, p);
  $('cats').hidden = false;
  $('cats').innerHTML = `Категория: <a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>`;
  rail(p);
  jump(anchor);
}

function category(dir) {
  const pages = sectionPages(dir);
  head('Категория', `Категория: ${label(dir)}`, `В категории ${plural(pages.length, ['страница', 'страницы', 'страниц'])}.`);
  $('content').innerHTML = `<div class="cards">${pages.map(p => `<a class="card" href="${href(p)}"><span class="thumb" style="${p.img ? `background-image:url('${p.img}')` : ''}">${p.img ? '' : esc(p.title[0])}</span><span><b>${esc(p.title)}</b><small>${esc(p.lead)}</small></span></a>`).join('')}</div>`;
  $('cats').hidden = true; rail(null); jump();
}

function home() {
  const readme = byPath.get('README.md');
  const latest = D.pages.reduce((a, b) => (b.date > a ? b.date : a), '');
  head('', 'Floppa Tropical Adventures Wiki', `${plural(D.pages.length, ['страница', 'страницы', 'страниц'])} · последняя правка ${day(latest)}`);
  const intro = readme.body.trim().split(/\n\s*\n/)[0];
  const shown = new Set();
  const news = D.pages.flatMap(p => p.facts).filter(x => x.d && !/:\s*$/.test(x.l))
    .sort((a, b) => b.d.localeCompare(a.d) || a.p.title.localeCompare(b.p.title, 'ru'))
    .filter(x => !shown.has(x.p) && shown.add(x.p)).slice(0, 8)
    .map(({ p, l, d }) => {
      const [, m, dd] = d.split('-');
      const text = l.split(` (${d})`).join('').split(`(${d}, `).join('(').split(`, ${d})`).join(')');
      const li = render(text, p.path).replace(/^\s*<ul>\s*<li>|<\/li>\s*<\/ul>\s*$/g, '');
      return `<li><b class="d">${+dd} ${MONTHS[m - 1].slice(0, 3)}</b> ${li} · <a href="${href(p)}">${esc(p.title)}</a></li>`;
    }).join('');
  const tiles = D.sections.map(s => {
    const n = sectionPages(s.dir).length, img = sectionImage(s.dir);
    return n ? `<a class="tile" href="#cat-${catId(s.dir)}"${img ? ` style="background-image:url('${img}')"` : ''}><span>${esc(s.label)}<small>${plural(n, ['страница', 'страницы', 'страниц'])}</small></span></a>` : '';
  }).join('');
  const gallery = D.pages.filter(p => p.img).filter((p, i, a) => a.findIndex(q => q.img === p.img) === i)
    .map(p => `<a href="${href(p)}"><img src="${esc(p.img)}" alt="" loading="lazy">${esc(p.cap)}</a>`).join('');
  const c = $('content');
  c.innerHTML = `<div class="welcome">${render(intro, 'README.md')}
      <a class="btn" href="#vision">Об игре</a><a class="btn" href="#roadmap">Дорожная карта</a><a class="btn" href="#known-issues">Известные недочёты</a></div>
    <h2>Разделы</h2><div class="tiles">${tiles}</div>
    <h2>Последние решения</h2><ul class="news">${news}</ul>
    <h2>Галерея</h2><div class="gallery">${gallery}</div>`;
  $('cats').hidden = true; rail(null); jump();
}

function jump(anchor) {
  const el = anchor && document.getElementById('h-' + anchor);
  if (el) el.scrollIntoView(); else window.scrollTo(0, (history.state && history.state.y) || 0);
}

let pending = '';
function route() {
  document.querySelectorAll('#nav details[open]').forEach(d => d.open = false);
  const raw = decodeURIComponent(location.hash.slice(1)), cut = raw.indexOf('--');
  const [id, anchor] = cut < 0 ? [raw, ''] : [raw.slice(0, cut), raw.slice(cut + 2)];
  const a = anchor || pending; pending = '';
  if (!id) return home();
  const dir = id === 'cat-main' ? '' : id.slice(4);
  if (id.startsWith('cat-') && D.sections.some(s => s.dir === dir)) return category(dir);
  const p = byId.get(id);
  if (p) return article(p, a);
  head('', 'Страница не найдена', `Нет страницы «${esc(id)}». <a href="#">На заглавную</a>`); $('content').innerHTML = ''; $('cats').hidden = true; rail(null);
}

// ---- nav and search
const GROUPS = [['Об игре', ['']], ['Геймплей', ['gameplay']], ['Мир и гавань', ['world', 'base']], ['Интерфейс', ['interface']],
  ['Арт и звук', ['art', 'audio']], ['Сюжет', ['story']], ['Разработка', ['tools', 'reports']]];
$('nav').insertAdjacentHTML('afterbegin', GROUPS.map(([name, dirs]) => `<details><summary>${name}</summary><div class="menu">${dirs.map(d =>
  (dirs.length > 1 ? `<b>${esc(label(d))}</b>` : '') + sectionPages(d).map(p => `<a href="${href(p)}">${esc(p.title)}</a>`).join('')).join('')}</div></details>`).join(''));
document.querySelectorAll('#nav details').forEach(d => d.addEventListener('toggle', () => {
  if (d.open) document.querySelectorAll('#nav details[open]').forEach(o => o !== d && (o.open = false));
}));
document.addEventListener('click', e => {
  if (!e.target.closest('#nav details') || e.target.closest('#nav .menu a')) document.querySelectorAll('#nav details[open]').forEach(d => d.open = false);
  if (!e.target.closest('.search')) $('results').hidden = true;
  const to = e.target.closest('[data-to]');
  if (to) {
    e.preventDefault(); document.getElementById(to.dataset.to)?.scrollIntoView({ behavior: 'smooth' });
    try { history.replaceState(history.state, '', to.getAttribute('href')); } catch (_) {}
    return;
  }
  const a = e.target.closest('a[data-page]');
  if (!a) return;
  const anchor = a.dataset.anchor || '';
  if (a.getAttribute('href') === (location.hash || '#')) { e.preventDefault(); jump(anchor); }
  else if (!anchored(anchor)) pending = anchor;
});

let hits = [], on = 0;
function search() {
  const q = norm($('q').value.trim()), box = $('results');
  if (q.length < 2) { box.hidden = true; hits = []; return; }
  hits = D.pages.filter(p => p.path !== 'README.md').map(p => {
    const t = p.ntitle.indexOf(q), b = p.ntext.indexOf(q);
    return { p, b, score: t === 0 ? 3 : t > 0 ? 2 : b >= 0 ? 1 : 0 };
  }).filter(h => h.score).sort((a, b) => b.score - a.score).slice(0, 8);
  on = 0;
  const mark = s => esc(s).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/е/g, '[её]'), 'gi'), m => `<mark>${m}</mark>`);
  box.innerHTML = hits.length ? hits.map((h, i) => `<a href="${href(h.p)}" class="${i ? '' : 'on'}">${mark(h.p.title)}<small>${h.b >= 0 ? (h.b > 50 ? '…' : '') + mark(h.p.text.slice(Math.max(0, h.b - 50), h.b + 90)) + (h.b + 90 < h.p.text.length ? '…' : '') : esc(label(h.p.section))}</small></a>`).join('')
    : '<div class="none">Ничего не найдено</div>';
  box.hidden = false;
}
$('q').addEventListener('input', search);
$('q').addEventListener('focus', search);
$('q').addEventListener('keydown', e => {
  const items = $('results').querySelectorAll('a');
  if (e.key === 'Escape') { $('results').hidden = true; $('q').blur(); }
  if (!items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); items[on].classList.remove('on');
    on = (on + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length; items[on].classList.add('on'); items[on].scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter') { location.hash = items[on].getAttribute('href'); $('results').hidden = true; $('q').value = ''; $('q').blur(); }
});
$('results').addEventListener('click', e => { if (e.target.closest('a')) { $('results').hidden = true; $('q').value = ''; } });

history.scrollRestoration = 'manual';
let keeping;
addEventListener('scroll', () => { clearTimeout(keeping); keeping = setTimeout(() => { try { history.replaceState({ y: scrollY }, ''); } catch (_) {} }, 150); }, { passive: true });
addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('#nav details[open]').forEach(d => d.open = false); });
addEventListener('hashchange', route);
route();
</script>
