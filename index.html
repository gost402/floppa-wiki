 тряской экрана.\n- **Живой остров** (`Shores`): вдоль берега каждой суши через 30 м стоит прибой (запись волн на пляже), звучат три ближайших к уху; над ближним к уху участком пляжа кричат чайки; пальмы шумят по силе ветра локации; у пирса мастерская корабела то стучит молотком, то пилит, когда ухо ближе 300 м. Звук с точкой ставится на волну, только когда он среди ближайших к уху своей записи: дальний прибой, чайки и пальмы не читают ни волн, ни земли. Ветер в ушах растёт со скоростью лодки, на которой едет ухо (`Sounds`, по скорости уха).\n- **Шторм** (`StormSounds`, [Погода](../world/weather.md)): шум ливня и низкий ветер растут с силой шторма над видом; ветер — с квадратом силы, так что ревёт только в глубине шторма. Гром приходит позже вспышки на столько, сколько звук идёт до вида, и с той стороны, где ударило (`AudioStreamPlayer3D` у места удара только ради стороны, громкость считает `StormSounds`): вблизи целый раскат с треском (три записи), дальше далёкий гул (четыре), и разом звучат не больше двух. Дальше 600 м слышен не каждый удар, а тем реже, чем дальше (на 1,7 км — примерно каждый восьмой), дальше 2 км — ни один, у всех игроков одни и те же. Ливень — две петли из разных записей, звучащие вместе. В сердце шторма фон около −16 LUFS, примерно на 10 LU громче, чем та же лодка на ходу в тихую погоду, раскат поднимается над ним ещё на 5. Звуки шторма идут по шине моря, а её ограничитель держит треск ливня и грома не выше −4 dBFS на выходе; пики до −1 dBFS в сердце шторма дают удары корпуса о волны (шина Boats). Уровни — решение без владельца, [Q286](../questions/world.md#q286).\n- **Петли в мире** (`Sounds.Hold`): огонь, вода, прибой, чайки и пальмы держатся в мире петлями, которые звучат, только пока слышны и пока их место среди ближайших к уху; так их сколько угодно, а играет несколько.\n- **Замеры**: скрытый прогон немой, поэтому `tools/demo.sh --film` снимает кейс фильмом со звуком, а `tools/sounds.py mix` меряет его громкость и пики; кейсы демо `Sounds` печатают показания шин (строки `METER` в логе). На слух ничего не оценивалось: все уровни выставлены по приборам.\n\n`Chimes` играет звуки интерфейса (`assets/sounds/ui`), одинаково слышные везде и заметно тише боя (на 2–6 дБ над шумом моря, кроме тика попадания, треска своего корпуса и звона победы, которые слышны и в бою): по одной реплике на каждый момент HUD, базы, верфи, вида сбоку и меню. Добыча самого игрока принадлежит интерфейсу, поскольку она только его. Лебёдка захвата в виде сбоку — петля в `Salvaging`. Дубли каждой реплики слегка разнесены по высоте (`AudioStreamRandomizer`), полифония ограничивает число голосов, а реплика никогда не играет снова раньше своего промежутка. Она живёт в корне дерева, поэтому любой экран играет её через `Chimes.Play`. Скрытые прогоны демо немые на «пустом» аудиодрайвере Godot.\n\nМеню звучит теми же дублями (`Chimes`): открытие — шорох верфи, пониженный и тихий, закрытие — ещё ниже и тише; смена страницы — шелест карточки из записи рыбалки; шаг шкалы в настройках — стеклянный тик захвата, на октаву выше от пустой шкалы к полной (выбор из имён тикает посередине); предупреждение в выноске меню и журнала — всплеск. Новых записей нет. Решение без владельца: [Q279](../questions/audio.md#q279). Стеклянный журнал открывается шелестом карточки, а запись в нём — стеклянный звон захвата, на терцию выше; звуки бумаги (книга, галочка карандашом) ушли вместе с бумагой. Решение без владельца: [Q292](../questions/audio.md#q292).\n\nРешения без владельца: уровни и баланс микса ([Q225](../questions/audio.md#q225)), приседание и хвост ([Q226](../questions/audio.md#q226)), приглушение ([Q227](../questions/audio.md#q227)), залп ([Q228](../questions/audio.md#q228)), высота проходящей лодки ([Q229](../questions/audio.md#q229)), взрывы по весу и расстоянию ([Q230](../questions/audio.md#q230)), опоздание за краем вида ([Q231](../questions/audio.md#q231)), мотор без газа и в воздухе ([Q232](../questions/audio.md#q232)), нитро ([Q233](../questions/audio.md#q233)), посадка и мель ([Q234](../questions/audio.md#q234)), звуки моментов и опасностей ([Q235](../questions/audio.md#q235)), серия попаданий, победа и знак охотника ([Q236](../questions/audio.md#q236)), вибрация ([Q237](../questions/audio.md#q237)), живой остров и ветер ([Q238](../questions/audio.md#q238)), громкость интерфейса ([Q239](../questions/audio.md#q239)).\n\n## Открытые вопросы\n- [Q23](../questions/audio.md#q23): звуки припасов, дыма, добычи, рыбы, лебёдки и знака охотника.\n- [Q225](../questions/audio.md#q225)–[Q229](../questions/audio.md#q229): микс, выставленный по приборам.\n- [Q230](../questions/audio.md#q230)–[Q234](../questions/audio.md#q234): взрывы по весу и расстоянию, мотор, нитро, посадка и мель.\n- [Q235](../questions/audio.md#q235)–[Q239](../questions/audio.md#q239): моменты и опасности, попадания и знак охотника, вибрация, живой остров, громкость интерфейса.\n- [Q279](../questions/audio.md#q279): звуки меню.\n- [Q286](../questions/world.md#q286): громкость шторма и далёкий гром.\n"}, {"id": "balance-boats", "path": "balance/boats.md", "title": "Баланс лодок", "section": "balance", "date": "2026-11-13", "md": "# Баланс лодок\n\n![Все корпуса в ряд](../img/fleet.jpg)\n\nСнимок значений из кода на 2026-11-12. Источник — код; меняешь число в коде — обнови эту страницу в том же коммите. Все числа — стартовые значения для настройки.\n\nЗдесь все числа, от которых зависит, как лодка идёт и сколько стоит. Как лодка устроена и управляется — на странице [Лодка](../gameplay/boat.md); как собирают в верфи — [Верфь](../base/boatyard.md); деньги и сохранения — [Прогресс](../gameplay/progression.md); охотники — [Охотники и ИИ](../gameplay/hunters.md); как лодки выглядят — [Облик лодок](../art/boats.md). Оружие и его числа — в [балансе оружия](weapons.md).\n\nМасса везде в тоннах, цена в монетах, мощность в кВт, скорость в м/с. Название детали — по-русски, как в игре, рядом имя в коде.\n\n## 1. Корпуса\n\nИсточник: `game/ships/Parts.cs`, `Parts.Hulls` и поля `HullPart`, `HullForm`, `Feel`.\n\n| Корпус (`Hull`) | Длина, м | Ширина, м | Масса, т | Удары | Станции | Трюм, мест | Бак, л (`Tank`) | Мест снаряжения (`GearPlaces`) | Цена | Сцепление (`Grip`) | Круг, длин (`Circle`) | Ответ поворота, с (`TurnAnswer`) | Ход (`Pace`) |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| [Катерок](../hulls/runabout.md) (`RunaboutHull`) | 4,8 | 2 | 0,9 | 2 | 1 | 4 | 27 | 1 | 120 | 2 | 1,5 | 0,15 | 2,9 |\n| [Ялик](../hulls/skiff.md) (`SkiffHull`) | 6 | 2,2 | 1,75 | 4 | 2 | 5 | 30 | 1 | 0 | 2,2 | 1,6 | 0,18 | 2,85 |\n| [Плоскодонка](../hulls/punt.md) (`PuntHull`) | 7 | 3 | 2,8 | 5 | 2 | 6 | 42 | 1 | 90 | 0,5 | 1,2 | 0,12 | 3,05 |\n| [Гонщик](../hulls/racer.md) (`RacerHull`) | 11 | 2,6 | 4 | 6 | 3 | 4 | 66 | 2 | 240 | 1,2 | 2,6 | 0,3 | 3 |\n| [Патрульный катер](../hulls/patrol-boat.md) (`PatrolHull`) | 12 | 3,8 | 14,3 | 10 | 4 | 7 | 120 | 2 | 540 | 1,8 | 2 | 0,25 | 3,55 |\n| [Канонерка](../hulls/gunboat.md) (`GunboatHull`) | 16 | 5,5 | 54,5 | 16 | 5 | 8 | 200 | 3 | 1050 | 2,6 | 1,5 | 0,4 | 3 |\n\nВне верфи: броненосец (`IroncladHull`, 22 × 6,8 м, 95 т, 20 ударов, 6 станций, трюм 10 мест, бак 300 л, 3 места снаряжения, цена 0, сцепление 2,6, круг 1,6, ответ 0,45, ход 3).\n\nЧто значат поля `Feel`: сцепление — как корпус держит боковой ход, 1/с; круг — диаметр поворота в длинах корпуса; ответ — за сколько секунд поворот отвечает; ход (`Pace`) — лучшая скорость на одном кВт на тонну. Поля `Lean`, `BowLift`, `Squat` (крен, подъём носа, посадка кормы) тут не нужны: на ход и цену они не влияют.\n\nДля чего корпус:\n- **Катерок** — самый лёгкий и резкий, но держит два удара. Под сильным мотором самый быстрый.\n- **Ялик** — стартовый, бесплатный, открытый; четыре удара, две станции.\n- **Плоскодонка** — плоская: скользит, как по льду, крутится на месте (сцепление 0,5), берёт больше всего ударов и трюма среди малых.\n- **Гонщик** — длинный, три станции, широкий поворот (круг 2,6 длины).\n- **Патрульный катер** — середняк: четыре станции, лучший ход (3,55), десять ударов.\n- **Канонерка** — тяжёлый, пять станций, шестнадцать ударов; медленный.\n\n## 2. Моторы\n\nИсточник: `game/ships/Parts.cs`, `Parts.Engines`, `EnginePart`.\n\n| Мотор | Мощность, кВт | Масса, т | Цена | Назад (доля хода, `Astern`) | Поворот на месте (`TurnAtRest`) | Расход, л/км (`Burn`) | Привод (`Drive`) |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| [Подвесной мотор](../engines/outboard.md) (`Outboard`) | 45 | 0,12 | 0 | 0,4 | 0,5 | 5 | `Outboard`, на транце |\n| [Воздушный винт](../engines/air-fan.md) (`AirFan`) | 150 | 0,5 | 90 | 0,5 | 0,9 | 6 | `Fan`, на пилоне над кормой |\n| [Два подвесных](../engines/twin-outboards.md) (`TwinOutboards`) | 300 | 0,6 | 360 | 0,35 | 0,55 | 8 | `TwinOutboard`, два на транце |\n| [Водомёт](../engines/water-jet.md) (`WaterJet`) | 700 | 1,2 | 780 | 0,3 | 0,6 | 10 | `Jet`, низко в корпусе |\n\n«Поворот на месте» — доля полного поворота, которой лодка рулит на стоянке при полном газе (`Manoeuvring`). С закрытым газом лодка крутится на месте одним рулём в меру этой доли.\n\nМощность на тонну мотора и на монету: подвесной 375 кВт/т, винт 300, два подвесных 500, водомёт 583; кВт на монету: винт 1,67, водомёт 0,90, два подвесных 0,83.\n\n## 3. Максимальная скорость\n\nИсточник: `game/ships/Handling.cs`, `Handling.Of`.\n\n```\nмасса = сумма масс всех деталей на борту (корпус, мотор, палубные детали, снаряжение, пояс), т\nTop = max( Pace × √( мощность, кВт / масса, т ), 3 )     м/с\n```\n\nЭто и есть правило √(P/W): корень из мощности на вес (кВт на тонну), умноженный на `Pace` корпуса. Сверху скорость ничем не ограничена ([Q20](../questions/boat.md#q20)). Снизу есть пол: 3 м/с. Среди голых корпусов он срабатывает только у канонерки и броненосца с подвесным мотором (по формуле вышло бы 2,7 и 2,1).\n\nДальше от этой же скорости считаются:\n- **Нитро:** рывок разом прибавляет `Nitro.Kick` = 14 м/с и полсекунды умножает мощность на `Nitro.Power` = 2,5.\n- **Добыча в трюме:** время разгона умножается на `(масса + груз, т) / масса`, а максимальная скорость не меняется (`Boat.Laden`, `Boat.cs`, [Q43](../questions/haul.md#q43)).\n- **Поворот на полном ходу:** `TurnRate = clamp(Top / (Circle × длина), 0,25; 2)` рад/с.\n- **Разгон:** `clamp(0,25 × m × Top² / 2 / P + 0,25 × ∛(m/1000), 0,5; 5)` с, где m в кг и P в Вт. **Накат:** `clamp(m × Top² / (2P), 1,5; 8)` с.\n\n### Голые корпуса\n\nБез палубных деталей, снаряжения и брони. В ячейке: скорость, м/с (масса лодки, т). Звёздочка — сработал пол в 3 м/с.\n\n| Корпус | Подвесной | Воздушный винт | Два подвесных | Водомёт |\n| --- | --- | --- | --- | --- |\n| Катерок | 19,3 (1,02) | 30,0 (1,40) | 41,0 (1,50) | 52,9 (2,10) |\n| Ялик | 14,0 (1,87) | 23,3 (2,25) | 32,2 (2,35) | 43,9 (2,95) |\n| Плоскодонка | 12,0 (2,92) | 20,6 (3,30) | 28,6 (3,40) | 40,3 (4,00) |\n| Гонщик | 9,9 (4,12) | 17,3 (4,50) | 24,2 (4,60) | 34,8 (5,20) |\n| Патрульный катер | 6,3 (14,42) | 11,3 (14,80) | 15,9 (14,90) | 23,9 (15,50) |\n| Канонерка | 3,0\\* (54,62) | 5,0 (55,00) | 7,0 (55,10) | 10,6 (55,70) |\n| Броненосец (вне верфи) | 3,0\\* (95,12) | 3,8 (95,50) | 5,3 (95,60) | 8,1 (96,20) |\n\n### Что стоит вес\n\nПалубные детали весят от 0,08 до 0,8 т (таблица ниже, числа их действия — в [балансе оружия](weapons.md)). Скорость считается по всей сумме.\n\n| Деталь (`Parts.Deck`) | Масса, т | Цена |\n| --- | --- | --- |\n| Ракеты I–IV (`Rockets`) | 0,1 / 0,2 / 0,3 / 0,4 | 40 / 75 / 120 / 210 |\n| Носовая стойка I–II (`ChaseRacks`) | 0,12 / 0,24 | 90 / 170 |\n| Торпеды (`Torpedoes`) | 0,8 | 450 |\n| Турель (`Turret`) | 0,3 | 0 |\n| Минный жёлоб (`MineRail`) | 0,45 | 300 |\n| Люлька (`Cradle`) | 0,7 | 480 |\n| Тепловизор (`ThermalSight`) | 0,08 | 180 |\n\nПримеры сборок (скорость по формуле; цена — сумма цен деталей; станции не названные пусты):\n\n| Сборка | Масса, т | Скорость, м/с | Удары | Цена |\n| --- | --- | --- | --- | --- |\n| Ялик, подвесной, турель (стартовая) | 2,17 | 13,0 | 4 | 0 |\n| Ялик, подвесной, Ракеты I | 1,97 | 13,6 | 4 | 40 |\n| Ялик, водомёт, 2 × Ракеты II | 3,35 | 41,2 | 4 | 930 |\n| Плоскодонка, винт, 2 × Ракеты I | 3,50 | 20,0 | 5 | 260 |\n| Гонщик, два подвесных, 3 × Ракеты IV | 5,80 | 21,6 | 6 | 1230 |\n| То же, тяжёлый пояс | 7,04 | 19,6 | 10 | 2130 |\n| Гонщик, водомёт, 3 × Ракеты IV | 6,40 | 31,4 | 6 | 1650 |\n| То же, тяжёлый пояс | 7,64 | 28,7 | 10 | 2550 |\n| Патрульный катер, водомёт, 4 × Торпеды | 18,70 | 21,7 | 10 | 3120 |\n| Патрульный катер, водомёт, 4 × Ракеты IV, трюмная помпа, тяжёлый пояс | 19,32 | 21,4 | 17 | 3360 |\n| Канонерка, водомёт, 5 × Ракеты IV, трюмная помпа, тяжёлый пояс | 61,79 | 10,1 | 27 | 4080 |\n\nВес на малых лодках стоит заметно: тяжёлый пояс, добавивший гонщику 1,24 т, снимает около десятой доли скорости, а на канонерке 3,84 т того же пояса стоят около трёх процентов.\n\n## 4. Броня\n\nИсточник: `game/ships/Parts.cs`, `Parts.ArmourBelt`, `Parts.HeavyBelt`; `game/ships/Belt.cs`.\n\n| Пояс | Цена | Толщина, м | Доля ударов корпуса |\n| --- | --- | --- | --- |\n| Броневой пояс (`ArmourBelt`) | 270 | 0,01 | 1/3 |\n| Тяжёлый пояс (`HeavyBelt`) | 900 | 0,02 | 2/3 |\n\nДобавка ударов — `ceil(удары корпуса × доля)` (`Belt.Strikes`), масса — `2 × 0,78 × длина × (верх − низ) × толщина × 7,85` (`Belt.Mass`), где пояс идёт от 0,46 длины позади миделя до 0,32 впереди, снизу на 0,6 ватерлинии, сверху на ватерлинию плюс треть высоты борта над ней. Сама деталь массы не имеет (`Mass` = 0), весит только пояс по корпусу. Плиты и мелочи: [Q30](../questions/boat.md#q30).\n\n| Корпус | Плит на борт | Лёгкий: + ударов | Лёгкий: масса, т | Тяжёлый: + ударов | Тяжёлый: масса, т |\n| --- | --- | --- | --- | --- | --- |\n| Катерок | 2 | +1 | 0,235 | +2 | 0,470 |\n| Ялик | 3 | +2 | 0,309 | +3 | 0,617 |\n| Плоскодонка | 4 | +2 | 0,249 | +4 | 0,499 |\n| Гонщик | 6 | +2 | 0,620 | +4 | 1,239 |\n| Патрульный катер | 6 | +4 | 0,985 | +7 | 1,969 |\n| Канонерка | 8 | +6 | 1,920 | +11 | 3,840 |\n| Броненосец | 11 | +7 | 3,044 | +14 | 6,089 |\n\nСкорость, которую пояс отнимает на типичной сборке: корпус, два подвесных или водомёт, Ракеты II на каждой станции.\n\n| Корпус | Мотор | Без пояса | Лёгкий пояс | Тяжёлый пояс |\n| --- | --- | --- | --- | --- |\n| Катерок | водомёт | 50,6 | 48,2 (−5%) | 46,1 (−9%) |\n| Ялик | водомёт | 41,2 | 39,4 (−4%) | 37,9 (−8%) |\n| Плоскодонка | водомёт | 38,5 | 37,4 (−3%) | 36,5 (−5%) |\n| Гонщик | два подвесных | 22,8 | 21,5 (−5%) | 20,5 (−10%) |\n| Гонщик | водомёт | 33,0 | 31,3 (−5%) | 29,9 (−9%) |\n| Патрульный катер | два подвесных | 15,5 | 15,1 (−3%) | 14,6 (−6%) |\n| Патрульный катер | водомёт | 23,3 | 22,6 (−3%) | 22,0 (−6%) |\n| Канонерка | два подвесных | 6,9 | 6,8 (−2%) | 6,7 (−3%) |\n| Канонерка | водомёт | 10,5 | 10,4 (−2%) | 10,2 (−3%) |\n\nЦена за добавленный удар: лёгкий пояс — 270 / 135 / 135 / 135 / 68 / 45 монет на катерке, ялике, плоскодонке, гонщике, патрульном катере, канонерке; тяжёлый — 450 / 300 / 225 / 225 / 129 / 82.\n\nПлита, принявшая свои удары, падает, и лодка становится легче и быстрее.\n\n## 5. Снаряжение\n\nИсточник: `game/ships/Parts.cs`, `Parts.Gear`; `Pump.cs`, `Smoke.cs`; `game/combat/Carpenters.cs`. Число деталей на лодке — по её корпусу (`HullPart.GearPlaces`, таблица 1), по одной каждого вида; места не обязаны быть заняты.\n\n| Снаряжение | Масса, т | Цена | Что делает, числа |\n| --- | --- | --- | --- |\n| Управление огнём (`FireControl`) | 0,15 | 360 | Рисует на воде линию огня каждой заряженной стойки. Чисел нет |\n| Таран (`Ram`) | 0,4 | 180 | Удар передней частью тарана не вредит своей лодке; остальные удары — как обычно |\n| Трюмная помпа (`BilgePump`) | 0,25 | 300 | После 4 с без ударов (`Pump.Waiting`) чинит 0,2 удара в секунду (`Pump.Mending`), то есть удар за 5 с |\n| Дымогенератор (`SmokeGenerator`) | 0,3 | 240 | Дым 5 с (`Smoke.Lasting`), перезарядка 25 с (`Smoke.Recharging`); готов снова через 30 с после включения |\n| Плотники (`Carpenters`) | 0,35 | 210 | За каждую потопленную лодку чинят 0,25 её ударов (`Carpenters.Share`, от того, сколько она выдерживала) |\n\nМеханика каждого — в [Бое](../gameplay/combat.md).\n\n## 6. Топливо и нитро\n\nИсточник: `game/ships/Fuel.cs`, `Design.Range`, `game/players/Player.cs`; `game/ships/Nitro.cs`, `game/pickups/Pickups.cs`.\n\n**Топливо.** У каждого корпуса свой бак в литрах (`Tank`, таблица 1), у каждого мотора свой расход в литрах на километр (`Burn`, таблица 2); числа временные ([Q8](../questions/boat.md#q8)). Дальность полного бака — `Design.Range` = бак / расход × 1000 м. За шаг сгорает `|газ| × скорость × время`, метров, делённых на дальность; так что лодка на накате или стоящая не жжёт ничего. Запас (`Fuel.Reserve`) — 20% бака; ниже него HUD зовёт в гавань. Пустой бак не останавливает лодку: она идёт на 0,25 газа (`Player.Limp`). Охотники топливо не жгут. Время зависит от скорости: на полном газе бак хватает на дальность / `Top` секунд, то есть на стартовом ялике (6 км, 13,0 м/с) около 462 с, на катерке с водомётом (2,7 км, 51,7 м/с) около 52 с.\n\nДальность полного бака, км (бак / расход):\n\n| Корпус | Подвесной | Воздушный винт | Два подвесных | Водомёт |\n| --- | --- | --- | --- | --- |\n| Катерок | 5,4 | 4,5 | 3,4 | 2,7 |\n| Ялик | 6,0 | 5,0 | 3,8 | 3,0 |\n| Плоскодонка | 8,4 | 7,0 | 5,3 | 4,2 |\n| Гонщик | 13,2 | 11,0 | 8,3 | 6,6 |\n| Патрульный катер | 24,0 | 20,0 | 15,0 | 12,0 |\n| Канонерка | 40,0 | 33,3 | 25,0 | 20,0 |\n| Броненосец (вне верфи) | 60,0 | 50,0 | 37,5 | 30,0 |\n\nСтартовый ялик с подвесным идёт 6 км, как шёл при едином баке; больший корпус уходит дальше, более жадный мотор — не так далеко. Припас топлива (`Supply.Fuel`) доливает половину бака (`Pickups.Refuelling` = 0,5). Насухо нитро закрыто.\n\n**Нитро.**\n\n| Параметр | Значение |\n| --- | --- |\n| Толчок рывка (`Nitro.Kick`) | +14 м/с вперёд разом |\n| Мощность в рывке (`Nitro.Power`) | ×2,5 мощности мотора |\n| Рывок длится | 0,5 с (`Dashing`), ракеты в это время проходят сквозь лодку |\n| Рывок стоит | половину шкалы (`Cost`): полная шкала — два рывка |\n| Заряд восстанавливается | за 6 с (`Refilling`), после 1 с без рывка (`Pause`) |\n| Нитро включает | полный газ вперёд, назад не работает |\n| Прыжок объявлен | от 1 с в воздухе (`Jumps.Least`, [Забавы](../gameplay/toys.md)) |\n| Прыжок доливает нитро | от 1,25 с в воздухе (`Jumps.Long`) четверть шкалы (`Jumps.Bonus`) |\n\n## 7. Лодки охотников и прочие\n\nИсточник: `game/ships/Design.cs`, `Designs`; `game/drones/Drone.cs`. «Цена» — сумма цен деталей по таблицам выше; охотник её не платит. «Добыча» — сколько очков добычи сыплет его обломок (`Designs.Hunters`, `Worth`).\n\n### Охотники\n\n| Лодка (`Designs`) | Корпус | Мотор | Станции | Снаряжение | Броня | Масса, т | Удары | Скорость, м/с | Цена | Добыча |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| [Ялик](../hunters/skiff.md) (`Skiff`) | Ялик | Подвесной | Ракеты I, пусто | — | — | 1,97 | 4 | 13,6 | 40 | 10 |\n| [Глиссер](../hunters/skimmer.md) (`Skimmer`) | Плоскодонка | Воздушный винт | Ракеты I, пусто | — | — | 3,40 | 5 | 20,3 | 220 | 15 |\n| [Гонщик](../hunters/racer.md) (`Racer`) | Гонщик | Два подвесных | Ракеты II, пусто, Ракеты II | Плотники | — | 5,35 | 6 | 22,5 | 960 | 25 |\n| [Патрульный катер](../hunters/patrol-boat.md) (`PatrolBoat`) | Патрульный | Два подвесных | Ракеты III, пусто, Торпеды, Ракеты III | Дымогенератор | Броневой пояс | 17,59 | 14 | 14,7 | 2100 | 40 |\n| [Канонерка](../hunters/gunboat.md) (`Gunboat`) | Канонерка | Водомёт | Ракеты IV, три пустых, Ракеты IV | Трюмная помпа | Тяжёлый пояс | 60,59 | 27 | 10,2 | 3450 | 70 |\n| [Таранщик](../hunters/rammer.md) (`Rammer`) | Гонщик | Два подвесных | три пустых | Таран | — | 5,00 | 6 | 23,2 | 780 | 20 |\n| [Катерок](../hunters/runabout.md) (`Runabout`) | Катерок | Подвесной | Ракеты I | — | — | 1,12 | 2 | 18,4 | 160 | 10 |\n| [Курьер](../hunters/courier.md) (`Courier`) | Гонщик | Подвесной | три пустых | — | — | 4,12 | 6 | 9,9 | 240 | 30 |\n| [Броненосец](../hunters/ironclad.md) (`Ironclad`) | Броненосец | Водомёт | Ракеты III, пусто, Ракеты III, Торпеды, пусто, Ракеты III | Таран | Тяжёлый пояс | 104,39 | 34 | 7,8 | 2670 | 120 |\n| [Дымовой катер](../hunters/smoke-boat.md) (`SmokeBoat`) | Ялик | Воздушный винт | Ракеты I, Тепловизор | Дымогенератор | — | 2,73 | 4 | 21,1 | 550 | 15 |\n| [Преследователь](../hunters/chaser.md) (`Chaser`) | Гонщик | Два подвесных | пусто, пусто, Носовая стойка I | Плотники | — | 5,07 | 6 | 23,1 | 900 | 30 |\n| [Бегун с турелью](../hunters/turret-runner.md) (`TurretRunner`) | Плоскодонка | Воздушный винт | Турель, пусто | — | — | 3,60 | 5 | 19,7 | 180 | 30 |\n| [Минёр](../hunters/minelayer.md) (`Minelayer`) | Патрульный | Два подвесных | Ракеты III, Минный жёлоб, пусто, Ракеты III | Дымогенератор | Броневой пояс | 17,24 | 14 | 14,8 | 1950 | 45 |\n\n### Другие\n\n| Лодка | Из чего | Масса, т | Удары | Скорость, м/с | Цена |\n| --- | --- | --- | --- | --- | --- |\n| Судно снабжения (`SupplyBoat`), союзник в эскорте | Патрульный катер, два подвесных, без оружия | 14,90 | 10 | 15,9 | 900 |\n| Рыбацкая лодка (`FishingBoat`), рабочая | Катерок, подвесной, без оружия | 1,02 | 2 | 19,3 | 120 |\n| Паром (`Ferry`), рабочая | Патрульный катер, два подвесных, без оружия | 14,90 | 10 | 15,9 | 900 |\n| Сухогруз (`Freighter`), рабочая | Канонерка, водомёт, без оружия | 55,70 | 16 | 10,6 | 1830 |\n| Дрон (`Drone.Design`), его выпускает люлька | корпус 3 м и 0,25 т, 2 удара, мотор 220 кВт и 0,03 т, Ракеты I | 0,38 | 2 | около 70 | — |\n\nДрон считается по той же формуле: `2,9 × √(220 / 0,38)`.\n\n## 8. Хозяйство верфи\n\nИсточник: `game/progress/Progress.cs`, `game/ships/Design.cs`.\n\n- **Старт:** 10 000 монет (`Progress.StartingCoins`). Стартовая лодка — `Designs.Starter`: ялик, подвесной мотор, турель на второй станции, первая свободна под ракеты; цена 0, так что у игрока уже есть эти три детали.\n- **Покупка:** каждая деталь продаётся за свою цену (`Progress.Buy`); деталь, которую уже имеешь, не покупается.\n- **Самая дешёвая полная сборка**, все станции заняты, без снаряжения и брони: ялик, подвесной мотор, Ракеты I и турель — 40 монет. С самым дешёвым снаряжением (таран, 180) и лёгким поясом (270) — 490. Дешевле стартовой по ценам нет, потому что она бесплатна.\n- **Самая дорогая:** канонерка 1050 + водомёт 780 + люлька 480 + четыре Торпеды 4 × 450 + управление огнём 360 + тяжёлый пояс 900 = 5370 монет, масса 63,59 т, скорость 10,0 м/с, 27 ударов. Это сумма цен, без проверки, поместятся ли детали (`Layout.Crowded`) и всплывёт ли лодка.\n- **Дорогие готовые сборки игры:** канонерка охотника — 3450, патрульный катер охотника — 2100.\n\n## 9. Заметки\n\n- **Курьер (гонщик с подвесным) идёт 9,9 м/с.** Это медленнее стартового ялика (13,0), хотя в коде он помечен как «построен бежать» (комментарий к `Designs.Courier`).\n- **Водомёт — лучший мотор по скорости на каждом корпусе, а «два подвесных» хуже водомёта и по цене за кВт (1,20 против 1,11), и по массе за кВт.** Они выигрывают только ценой в целом: 360 против 780. Правило проекта «деталь хуже другой во всём — убирается» ([Лодка](../gameplay/boat.md)) тут держится на цене.\n- **Воздушный винт — самый дешёвый кВт (0,60 монеты) и лучший поворот на месте (0,9)**; по скорости он между подвесным и двумя подвесными.\n- **Канонерке и броненосцу нужен водомёт**: с двумя подвесными они идут 7,0 и 5,3 м/с, с подвесным упираются в пол 3 м/с. С двумя подвесными они идут медленнее голого ялика на подвесном (14,0).\n- **У плоскодонки ход (3,05) выше, чем у ялика (2,85), но скорость ниже на каждом моторе** (12,0 против 14,0 с подвесным), потому что она на 1,05 т тяжелее. Зато она берёт 5 ударов и 6 мест трюма против 4 и 5 за 90 монет.\n- **Гонщик (6 ударов, 4 места трюма) уступает плоскодонке (5 ударов, 6 мест)** по трюму при цене 240 против 90; его преимущество — три станции и длина.\n- **Катерок на водомёте 52,9 м/с без деталей и около 50 с ракетой**; дрон — около 70 м/с. [Q20](../questions/boat.md#q20) спрашивает, не слишком ли это.\n- **Броня на малых корпусах дорога:** лёгкий пояс на катерке даёт 1 удар за 270, больше цены самого катерка (120). На канонерке тяжёлый пояс даёт 11 ударов за 900 и весит 3,84 т, то есть 7% её массы.\n- **Турель бесплатна и весит 0,3 т, Ракеты I стоят 40 и весят 0,1 т**; вес палубных деталей заметен лишь на корпусах легче 5 т, на патрульном катере и канонерке он тонет в массе корпуса.\n- **Патрульный катер охотника** идёт 14,7 м/с и держит 14 ударов: пояс весит 0,985 т и даёт 4 удара.\n- **Катерок на водомёте уходит всего на 2,7 км (около 52 с на полном газе)**, канонерка с водомётом — на 20 км; малому корпусу дальность заменяет только то, что он быстр.\n"}, {"id": "balance-economy", "path": "balance/economy.md", "title": "Баланс экономики", "section": "balance", "date": "2026-11-15", "md": "# Баланс экономики\n\nСнимок значений из кода на 2026-11-13. Источник — код; меняешь число в коде — обнови эту страницу в том же коммите. Все числа — стартовые значения для настройки.\n\nОткуда берутся монеты и на что уходят. Как устроены трюм и продажа: [Добыча](../gameplay/haul.md); цены деталей: [Баланс лодок](boats.md), [Баланс оружия](weapons.md).\n\n## Поток монет\n- Новая игра начинается с 10 000 монет, на Ялике (`Progress.StartingCoins`, `Designs.Starter`).\n- Монеты приходят из двух мест: проданная добыча (в гавани у корабела и у станции, `Game.Trade`) и сцены сюжета (`give coins N`, `story/Teller.cs`).\n- Монеты уходят на детали верфи (`Progress.Buy`, [Q56](../questions/missions.md#q56)), на ремонт и топливо у станции (`Progress.Pay`, ниже) и на перекраску у корабела, которая снимает розыск: 40 монет за уровень (`Warrants.Repaint`, [Q194](../questions/haul.md#q194)).\n- Добыча — ценность ящика в очках; каждое очко — три монеты (`Progress.Rate`, [Q128](../questions/missions.md#q128)). Утонувшая лодка ничего не продаёт: игра загружает последнее сохранение.\n\n## Ящики\nИсточник: `game/haul/Items.cs`, `Items.Crates`. Вид, цена и вес — решение без владельца ([Q162](../questions/haul.md#q162)). Ресурс идёт только на расходники (ниже), детали только покупаются ([Прогресс](../gameplay/progression.md)). Каждый ящик занимает одно место трюма; вес трюма замедляет разгон лодки ([Добыча](../gameplay/haul.md)).\n\n| Ящик | Ресурс | Вид | кг | Добыча | Монеты | Идёт на |\n| --- | --- | --- | --- | --- | --- | --- |\n| Ящик металла (`Metal`) | металл | серый ящик, гайка | 25 | 5 | 15 | ремкомплект, бронеплита |\n| Ящик механизмов (`Machinery`) | механизмы | оливковый ящик, шестерня | 25 | 9 | 27 | баллон нитро |\n| Ящик электрики (`Electrics`) | электрика | синий ящик, молния | 12 | 8 | 24 | заряд |\n| Бочка топлива (`Fuel`) | топливо | красная бочка | 40 | 5 | 15 | баллон нитро |\n| Ящик взрывчатки (`Explosives`) | взрывчатка | оранжевый ящик, взрыв | 15 | 10 | 30 | заряд |\n| Тюк ткани (`Cloth`) | ткань | светлый тюк | 8 | 3 | 9 | ремкомплект |\n| Сундук ценностей (`Valuables`) | ценности | золотой сундук | 15 | 20 | 60 | — |\n| Ящик провизии (`Provisions`) | провизия | деревянный ящик | 15 | 4 | 12 | — |\n\n## Станция «Мария»\nИсточник: `game/areas/Outposts.cs`, `Outposts.Pays`, `Outposts.Mending`, `Outposts.Fuelling`; цены считает `game/haul/Terms.cs`. В гавани ящик идёт по полной цене, ремонт и заправка там бесплатны ([Добыча](../gameplay/haul.md)). Решение без владельца ([Q177](../questions/haul.md#q177)).\n\n| Что | Цена |\n| --- | --- |\n| Ящик | 70 % цены в гавани, округлённо, не меньше 1 монеты (провизия 8, ткань 6, ценности 42) |\n| Ремонт | 15 монет за удар, которого не хватает корпусу |\n| Топливо | 1 монета за литр, которого не хватает баку |\n\nПолный ремонт и полный бак ялика (4 удара, 30 л) — 90 монет.\n\n## Места в трюме\nИсточник: `game/ships/Parts.cs`, `HullPart.Hold`. Решение без владельца ([Q162](../questions/haul.md#q162)).\n\n| Корпус | Мест |\n| --- | --- |\n| Катерок (`RunaboutHull`) | 4 |\n| Гонщик (`RacerHull`) | 4 |\n| Ялик (`SkiffHull`) | 5 |\n| Плоскодонка (`PuntHull`) | 6 |\n| Патрульный катер (`PatrolHull`) | 7 |\n| Канонерка (`GunboatHull`) | 8 |\n\nВне верфи: броненосец 10.\n\n## Расходники\nИсточник: `game/haul/Kits.cs`, `Kits.All`. Оплачиваются прямо из трюма самыми дешёвыми ящиками нужных ресурсов ([Добыча](../gameplay/haul.md)). Действие — как у одноимённого припаса ([Припасы](../gameplay/pickups.md)); заряд — `Kits.Reach` и `Kits.Strikes`. «Цена» — сколько монет те же ящики дали бы при продаже.\n\n| Клавиша | Расходник | Рецепт | Действие | Цена, монет |\n| --- | --- | --- | --- | --- |\n| 1 | Ремкомплект (`Patch`) | металл + ткань | корпус, как припас «ремонт» | 24 |\n| 2 | Бронеплита (`Plate`) | металл + металл | броня, как припас брони | 30 |\n| 3 | Баллон нитро (`Bottle`) | топливо + механизмы | полный нитро | 42 |\n| 4 | Заряд (`Charge`) | взрывчатка + электрика | взрыв на 10 м от борта, 6 попаданий у корпуса | 54 |\n\n## Что несут охотники\nИсточник: `game/ships/Design.cs`, `Designs.Hunters` (добыча проекта); `game/haul/Items.cs`, `Items.Carried`. Обломок высыпает случайные ящики из списка своего проекта (вид, названный дважды, выпадает вдвое чаще), пока их добыча не дойдёт до добычи проекта, но не больше 8 (`Items.Most`).\n\n| Охотник | Добыча | Что несёт |\n| --- | --- | --- |\n| Ялик (`Skiff`) | 10 | топливо, ткань, провизия ×2, металл, взрывчатка, механизмы |\n| Катерок (`Runabout`) | 10 | топливо, ценности ×2, ткань, взрывчатка, провизия, металл |\n| Глиссер (`Skimmer`) | 15 | топливо, механизмы, металл, ткань ×3, провизия |\n| Преследователь (`Chaser`) | 30 | механизмы, взрывчатка, топливо, ценности ×3 |\n| Бегун с турелью (`TurretRunner`) | 30 | топливо, механизмы, электрика, металл, провизия, ткань |\n| Минёр (`Minelayer`) | 45 | взрывчатка, электрика ×2, топливо, металл ×2, ценности |\n| Дымовой катер (`SmokeBoat`) | 15 | топливо ×2, электрика, взрывчатка, ткань, механизмы |\n| Таранщик (`Rammer`) | 20 | металл ×2, механизмы ×3, топливо |\n| Гонщик (`Racer`) | 25 | механизмы, топливо, взрывчатка, ценности ×4 |\n| Курьер (`Courier`) | 30 | ценности ×6, электрика ×3 |\n| Патрульный катер (`PatrolBoat`) | 40 | электрика ×2, взрывчатка ×2, металл ×2, провизия, ценности |\n| Канонерка (`Gunboat`) | 70 | металл ×3, взрывчатка, механизмы, топливо, провизия, ценности |\n| Броненосец (`Ironclad`) | 120 | ценности ×2, взрывчатка, металл, механизмы, электрика, топливо, провизия |\n\nГруз судна снабжения (`SupplyBoat`) — провизия ×3, топливо, ткань ×2, механизмы, электрика.\n\nЯщик может перескочить добычу проекта: обломок с дорогим последним ящиком даёт больше.\n\n## Что несут рабочие лодки\nИсточник: `game/life/Calling.cs` (добыча занятия); `game/haul/Items.cs`, `Items.Carried`. Потопленная рабочая лодка высыпает ящики, как охотник, по тому, насколько полон трюм, но не меньше четверти добычи; полон он у всех, кроме рыбака, который наполняет его на косяке ([Жизнь моря](../world/life.md)); числа — решение без владельца ([Q190](../questions/world.md#q190)).\n\n| Лодка | Добыча | Что несёт |\n| --- | --- | --- |\n| Рыбацкая лодка (`FishingBoat`) | 16 с полным трюмом, 4 с пустым | провизия ×4, ткань |\n| Паром (`Ferry`) | 25 | провизия ×2, ткань ×2, ценности, топливо |\n| Сухогруз (`Freighter`) | 70 | ценности ×2, механизмы ×2, электрика ×2, металл, взрывчатка |\n\n## Задания\nИсточник: `game/missions/Run.cs`, `Run.Reward`; `game/missions/Cargo.cs`. Выполненное задание высыпает ящики из списка курьера (ценности и электрика) на столько добычи на каждого игрока и даёт каждой лодке игроков припасы ([Открытый мир](../gameplay/missions.md), [Q129](../questions/missions.md#q129)).\n\n| Задание | Добыча на игрока | Припасы каждой лодке |\n| --- | --- | --- |\n| Конвой (`Escort`) | 30, у последней точки маршрута | топливо, ремонт |\n| Курьер (`Courier`) | 40, у первой лодки игроков | топливо |\n| Маяки (`Beacons`) | 50, у последнего маяка | топливо, нитро |\n| Броненосец (`Ironclad`) | — (его обломок, как у любого охотника) | ремонт, броня |\n\nГруз (`Cargo`) ничего не платит сверху: сам груз — 30 добычи на игрока из списка судна снабжения, рассыпанные вокруг его точек.\n\n## Забавы\nИсточник: `game/toys/Rampages.cs`, `Rampages.Worth`, `Rampages.Back`; задачи буйств — `game/maps/world.json`, зоны `rampage`. Ящики — из списка курьера, как у заданий ([Забавы](../gameplay/toys.md)). Решение без владельца ([Q199](../questions/missions.md#q199)).\n\n| Буйство на карте мира | Потопить | За | Добыча |\n| --- | --- | --- | --- |\n| У северо-восточного поста | 3 | 90 с | 45 |\n| У северного поста | 3 | 90 с | 45 |\n| У западного поста | 2 | 60 с | 30 |\n| У юго-западного поста | 3 | 75 с | 45 |\n\nДобыча буйства — 15 за каждую лодку задачи. Жетон возвращается через 60 с после конца буйства.\n\nСпрятанные посылки (`game/toys/Packages.cs`, `Packages.Worth`): сама посылка ничего не даёт, последняя из посылок карты высыпает ящики из списка курьера на 100 добычи (около 300 монет). В мире посылок десять. Решение без владельца ([Q202](../questions/missions.md#q202)).\n\n## Места промысла\nИсточник: `game/activities/Shoal.cs`, `Catch`; `game/activities/Wreck.cs`, `Salvage`. Поднятое в виде сбоку ложится в трюм и продаётся, как любая добыча ([Места промысла](../gameplay/sites.md), [Q31](../questions/haul.md#q31)). В трюме у каждого вида два размера по половинам диапазона (`Catch.Sizes`, `Items`); каждая вещь занимает одно место, как ящик.\n\n| Рыба | Длина, м | Добыча | Монеты |\n| --- | --- | --- | --- |\n| Скумбрия (`Mackerel`) | 0,3–0,5 | 2 | 6 |\n| Луциан (`Snapper`) | 0,45–0,85 | 4 | 12 |\n| Барракуда (`Barracuda`) | 0,8–1,4 | 6 | 18 |\n| Групер (`Grouper`) | 0,65–1,2 | 9 | 27 |\n\nВ косяке восемь рыб; скумбрии втрое чаще групера: из семи 3 скумбрии, 2 луциана, барракуда, групер (`Catch.Kinds`).\n\n| На обломках | Вес, кг | Добыча | Монеты |\n| --- | --- | --- | --- |\n| Ящик (`Crate`) | 12–35; в трюме 18 или 29 | 5 | 15 |\n| Бочка (`Barrel`) | 40–110; в трюме 58 или 92 | 4 | 12 |\n| Сундук (`Chest`) | 20–60; в трюме 30 или 50 | 14 | 42 |\n\nИз шести вещей на обломках 3 ящика, 2 бочки, сундук (`Salvage.Kinds`). Обломки, которым в [редакторе карт](../tools/map-editor.md) дан список ящиков (в мире все четыре), держат эти ящики и платят за них их добычу.\n\n## Что выглядит не в ладу\n- Провизия и ценности не идут ни в один рецепт: их только продают. Ценности — вдвое дороже любого другого ящика, так что полный трюм быстро становится сундуками, а металл для ремонта вытесняется первым.\n- Рыба и вещи с обломков занимают те же места, что и ящики охотников, а стоят меньше большинства из них ([Q31](../questions/haul.md#q31)).\n- Монеты не на что тратить, когда верфь куплена ([Чего нам не хватает](../questions/gaps.md)).\n"}, {"id": "balance-weapons", "path": "balance/weapons.md", "title": "Баланс оружия", "section": "balance", "date": "2026-11-15", "md": "# Баланс оружия\n\nСнимок значений из кода на 2026-11-12. Источник — код; меняешь число в коде — обнови эту страницу в том же коммите. Все числа — стартовые значения для настройки.\n\nЗдесь числа всего, чем лодка причиняет вред, и как они соотносятся. Как устроены выстрел, таран и опасности, написано на страницах тем: [Бой](../gameplay/combat.md), [Сборки и стили игры](../gameplay/builds.md), [Припасы](../gameplay/pickups.md), [Зоны и опасности](../world/areas.md), [Охотники и ИИ](../gameplay/hunters.md), [Верфь](../base/boatyard.md). Попадания корпусов — в [Балансе лодок](boats.md). Термины — в [глоссарии](../glossary.md).\n\nВред мерится **попаданиями** (`strikes`): корпус стоит столько попаданий, сколько записано в его `Strikes`, и тонет, когда они выбраны.\n\n## 1. Пусковые установки\n\nИсточник: `game/ships/Parts.cs`, `Parts.Rockets`, `Parts.ChaseRacks`, `Parts.Torpedoes`, `Parts.Turret`, `Parts.MineRail`, `Parts.Cradle`; поля `Launcher` (`Reload`, `Damage`, `Rails`, `Blast`). Скорости и досягаемости: `Rockets.Motor`, `Boat.Reach`, `Torpedoes.Motor`, `Torpedoes.Run`, `Turrets.Reach`, `Floaters`. Массу даёт деталь, цену — верфь.\n\nФормулы: попаданий за залп на борт = `Rails` × `Damage`; попаданий в секунду на борт = залп ÷ `Reload`. Каждый борт перезаряжается сам, обе стойки пары заряжены в начале боя.\n\n| Установка (код) | Попаданий за снаряд | Снарядов на борт за залп | Перезарядка, с | Попаданий за залп на борт | Попаданий в с на борт | «Взрыв», м | Масса, т | Цена, монет |\n|---|---|---|---|---|---|---|---|---|\n| [Ракеты I](../weapons/rockets-i.md) (`Rockets[0]`) | 1 | 2 | 2,0 | 2 | 1,00 | 0,25 | 0,1 | 40 |\n| [Ракеты II](../weapons/rockets-ii.md) (`Rockets[1]`) | 1 | 3 | 2,5 | 3 | 1,20 | 0,25 | 0,2 | 75 |\n| [Ракеты III](../weapons/rockets-iii.md) (`Rockets[2]`) | 1 | 4 | 3,0 | 4 | 1,33 | 0,25 | 0,3 | 120 |\n| [Ракеты IV](../weapons/rockets-iv.md) (`Rockets[3]`) | 1 | 5 | 3,5 | 5 | 1,43 | 0,25 | 0,4 | 210 |\n| [Носовая стойка I](../weapons/chase-rack-i.md) (`ChaseRacks[0]`) | 1 | 2 | 2,0 | 2 | 1,00 | 0,25 | 0,12 | 90 |\n| [Носовая стойка II](../weapons/chase-rack-ii.md) (`ChaseRacks[1]`) | 1 | 3 | 2,5 | 3 | 1,20 | 0,25 | 0,24 | 170 |\n| [Торпеды](../weapons/torpedoes.md) (`Torpedoes`) | 12 | 1 | 10,0 | 12 | 1,20 | 1 | 0,8 | 450 |\n| [Турель](../weapons/turret.md) (`Turret`) | 1 | 1 | 0,8 | 1 | 1,25 (одна на лодку) | 0,2 | 0,3 | 0 |\n| [Минный жёлоб](../weapons/mine-rail.md) (`MineRail`) | 5 | 1 | 2,5 | 5 | 2,00 | 6 | 0,45 | 300 |\n| [Люлька](../weapons/cradle.md) (`Cradle`), дрон | 1 | 2 | 2,0 | 2 | 1,00 за дрон | — | 0,7 | 480 |\n\nПримечания к таблице.\n- «Взрыв» — поле `Blast`. У ракет, торпед и турели это запас касания: снаряд бьёт, если проходит в этом зазоре от корпуса, а попадание одно и полное (`Gunnery.Strike`). Настоящий взрыв по площади только у мины: удар `Damage` у корпуса, к радиусу 6 м спадает до нуля (`Blasts.Burst`), и он задевает всех, кроме своей стороны.\n- Носовая стойка I и II стреляют теми же числами, что Ракеты I и II (`Rockets[level - 1].Launcher with { Facing = Bow }`), и стоят дороже.\n- Турель одна на лодку по оси, а не пара. Она стреляет сама, по стволу за раз, и в Q и E не входит (`Weapon.Turrets`). Она стоит на стартовой лодке (`Designs.Starter`), поэтому бесплатна.\n- Люлька держит два дрона (`Parts.CradleDrones`), по одному на борт; каждый несёт одну ракетную стойку Ракеты I (`Drone.Design`) и два попадания корпуса. Потерянный дрон строится заново за 20 с (`Parts.CradleRebuild`).\n- Масса и цена детали — на одну деталь: пару бортов она даёт сама.\n\nПолёт снаряда.\n\n| Установка | Скорость снаряда, м/с | Досягаемость, м | Разброс (σ), рад | Масса снаряда, т |\n|---|---|---|---|---|\n| Ракеты I–IV, носовые стойки | у игроков 25 при пуске, 100 у цели (`Rockets.Motor`, разгон за 0,15 с); у других сторон 20 и 40, разгон за 0,3 с | 80 (`Boat.Reach`); ≈0,91 с полёта, у других сторон ≈2,15 с | 0,012 (`Rockets.Spread`) | 0,022 |\n| Торпеды | 6 при пуске, 14 после разгона (`Torpedoes.Motor`, 0,8 с) | 100 (`Torpedoes.Run`); ≈7,6 с хода | 0,008 (`Torpedoes.Spread`) | 0,35 |\n| Турель | снаряд, 40 у всех сторон (`Rockets.Shell`) | 45 (`Turrets.Reach`); ≈1,1 с полёта | 0,012 | 0,010 |\n| Мина | бросок 4 м/с за корму, замирает за ~2 с (`Floaters.Toss`, `Slowing`) | ложится в паре метров за кормой | — | 0,17 |\n| Дрон | сам лодка, ракета как у Ракет I | ракета 80; дрон уходит от носителя не дальше 60 м (`Wingman.Leash`) | — | — |\n\nРакету и торпеду игрока наводка поворачивает не дальше 0,6 рад в каждую сторону от линии установки (`Boat.Fan`). Снаряд несёт ещё и ход лодки. Взрыв торпеды заодно подбрасывает корпус (`Torpedoes.Heave`, импульс 12 т·м/с).\n\nГде можно стоять (`DeckPart.Fits`, `Build.Fault`).\n- Ракеты I–IV, торпеды, турель: на любой станции корпуса.\n- Носовые стойки: только на станциях впереди 5% длины от миделя (`DeckPart.Front`). На Катерке (единственная станция чуть позади миделя) их не поставить.\n- Минный жёлоб и люлька: только на станции на миделе или позади, и не больше одного жёлоба и одной люльки на лодку.\n- Станций: Катерок 1, Ялик 2, Плоскодонка 2, Гонщик 3, Патрульный катер 4, Канонерка 5 (`Hull.Stations`). Тепловизор тоже занимает станцию.\n\nСборки и их задачи — на странице [Сборки и стили игры](../gameplay/builds.md), покупка деталей — в [Верфи](../base/boatyard.md).\n\n## 2. Сколько тонуть\n\nИсточник: `HullPart.Strikes` (`Parts.RunaboutHull` и остальные), `Belt.Strikes`, `ArmourPart.Share` (`Parts.ArmourBelt` 1/3, `Parts.HeavyBelt` 2/3).\n\nФормула: корпусу с `S` попаданиями нужно `n = ⌈S ÷ попаданий за залп⌉` залпов; пушка заряжена в начале боя, поэтому время = `(n − 1) × перезарядка`. Это стрельба одним бортом без промахов, без ряби залпа (до 0,27 с на залп), без времени полёта. Пояс добавляет `⌈S × Share⌉` попаданий (`Belt.Strikes`). Ноль значит, что хватает первого залпа.\n\nПопадания корпусов, без пояса, с поясом (+1/3), с тяжёлым поясом (+2/3):\n\n| Корпус | Катерок | Ялик | Плоскодонка | Гонщик | Патрульный катер | Канонерка |\n|---|---|---|---|---|---|---|\n| Без пояса | 2 | 4 | 5 | 6 | 10 | 16 |\n| Броневой пояс | 3 | 6 | 7 | 8 | 14 | 22 |\n| Тяжёлый пояс | 4 | 7 | 9 | 10 | 17 | 27 |\n\nСекунд до гибели, **без пояса**:\n\n| Установка | Катерок (2) | Ялик (4) | Плоскодонка (5) | Гонщик (6) | Патрульный (10) | Канонерка (16) |\n|---|---|---|---|---|---|---|\n| Ракеты I / Нос. I / дрон | 0 | 2 | 4 | 4 | 8 | 14 |\n| Ракеты II / Нос. II | 0 | 2,5 | 2,5 | 2,5 | 7,5 | 12,5 |\n| Ракеты III | 0 | 0 | 3 | 3 | 6 | 9 |\n| Ракеты IV | 0 | 0 | 0 | 3,5 | 3,5 | 10,5 |\n| Торпеды | 0 | 0 | 0 | 0 | 0 | 10 |\n| Турель | 0,8 | 2,4 | 3,2 | 4 | 7,2 | 12 |\n| Мина (в цель) | 0 | 0 | 0 | 2,5 | 2,5 | 7,5 |\n\nС **броневым поясом**:\n\n| Установка | Катерок (3) | Ялик (6) | Плоскодонка (7) | Гонщик (8) | Патрульный (14) | Канонерка (22) |\n|---|---|---|---|---|---|---|\n| Ракеты I / Нос. I / дрон | 2 | 4 | 6 | 6 | 12 | 20 |\n| Ракеты II / Нос. II | 0 | 2,5 | 5 | 5 | 10 | 17,5 |\n| Ракеты III | 0 | 3 | 3 | 3 | 9 | 15 |\n| Ракеты IV | 0 | 3,5 | 3,5 | 3,5 | 7 | 14 |\n| Торпеды | 0 | 0 | 0 | 0 | 10 | 10 |\n| Турель | 1,6 | 4 | 4,8 | 5,6 | 10,4 | 16,8 |\n| Мина (в цель) | 0 | 2,5 | 2,5 | 2,5 | 5 | 10 |\n\nС **тяжёлым поясом**:\n\n| Установка | Катерок (4) | Ялик (7) | Плоскодонка (9) | Гонщик (10) | Патрульный (17) | Канонерка (27) |\n|---|---|---|---|---|---|---|\n| Ракеты I / Нос. I / дрон | 2 | 6 | 8 | 8 | 16 | 26 |\n| Ракеты II / Нос. II | 2,5 | 5 | 5 | 7,5 | 12,5 | 20 |\n| Ракеты III | 0 | 3 | 6 | 6 | 12 | 18 |\n| Ракеты IV | 0 | 3,5 | 3,5 | 3,5 | 10,5 | 17,5 |\n| Торпеды | 0 | 0 | 0 | 0 | 10 | 20 |\n| Турель | 2,4 | 4,8 | 6,4 | 7,2 | 12,8 | 20,8 |\n| Мина (в цель) | 0 | 2,5 | 2,5 | 2,5 | 7,5 | 12,5 |\n\nМина считается как бьющая в цель с полной силой: сила спадает с расстоянием до корпуса, и ей нужно, чтобы цель на неё наехала. Дрон считается одним: второй, с другого борта, удваивает темп, но дрон ещё должен долететь. Запасы припасов брони (раздел 5) в таблицу не входят.\n\n## 3. Прочий вред\n\n### Таран\nИсточник: `game/combat/Ramming.cs`, `Ramming.Land`; `Parts.Ram`.\n- Удар корпусов разных сторон: попаданий `= импульс × (1 − 3 ÷ скорость сближения) ÷ 10`, и **такое же число обоим корпусам** (`Gentle` = 3 м/с — слабее толчок ничего не бьёт, `PerStrike` = 10 т·м/с). Большой корпус выдерживает удар, который топит ялик.\n- Таран (`Parts.Ram`, 0,4 т, 180 монет): удар, пришедшийся в нос за корнем тарана, не бьёт свою лодку (`Hurt.OnRam`); чужую бьёт как всегда. Удар в борт или корму вред как обычно.\n- Удар носовой четвертью с горящим нитро (`Ramming.Charging`): своя лодка получает ×0,5 (`Braced`), чужая ×1,5 (`Driven`).\n- Толчок внутри одной стороны ничего не бьёт.\n\n### Прицел турели и дронов\n- Турель: берёт ближайшую лодку другой стороны в пределах 45 м, не сквозь дым (`Turrets.Reach`, `Screens.Sees`); голова поворачивается на 2,5 рад/с и стреляет, когда отклонена меньше чем на 3° (`Turrets`).\n- Дроны (`Wing`, `Wingman`): сами идут на лодку другой стороны в пределах 30 м от носителя (`Threat`), держат цель, пока она в 45 м (`Chased`); посланный на цель отпускает её дальше 70 м от носителя (`Wingman.Reaching` = `Leash` 60 + `Passing` 10) плюс 15 м, если она его добыча (`Letting`). Возвращаются домой с последним попаданием корпуса (`Spent` = 1). Принятый на борт дрон чинится 5 с (`Mending`), потерянный строится 20 с.\n\n### Мины\nИсточник: `game/combat/Floaters.cs`, `Floater.cs`, `Parts.MineRail`.\n- На плаву у лодки не больше шести (`Floaters.Keep`): седьмая топит самую старую без взрыва.\n- Взводится через 1,2 с (`Arming`), тонет сама через 45 с (`Life`).\n- Взрывается под живым корпусом другой стороны или от снаряда; своей стороны не бьёт. Взрыв — 5 попаданий у корпуса, спад к 6 м (`Burst`).\n- Цепочка: взрыв поджигает мины в радиусе взрыва через 0,1–0,25 с (`Mines.Fuse`), и это относится и к чужим, и к своим минам на плаву. Охотник считает жёлоб «досягаемым» на 25 м позади (`Floaters.Reach`).\n\n### Дым\nИсточник: `game/ships/Smoke.cs`; `Parts.SmokeGenerator`.\n- Дымогенератор (0,3 т, 240 монет) ставит завесу 5 с (`Smoke.Lasting`) и перезаряжается 25 с (`Smoke.Recharging`) — после выстрела в целом 30 с до следующей. Охотники и турель сквозь неё не видят; тепловизор (180 монет) видит.\n\n### Плотники\nИсточник: `game/combat/Carpenters.cs`; `Parts.Carpenters`.\n- За каждую лодку, потопленную снарядом или тараном, чинят четверть её попаданий (`Share` 0,25 × её `Stood`), но не больше, чем выбрано. Плотники 0,35 т, 210 монет.\n\n## 4. Огонь охотников\n\nИсточник: `game/ai/Crew.cs` (`Crew.Green` и остальные), `Boat` (`_reload = Reload × slowness`), `Captain.Aim`.\n\nМастерство — три числа: `Tick`, секунды между мыслями капитана; `Slack`, на сколько метров мимо цели снаряд может пройти, чтобы капитан стрелял; `Slowness`, во сколько раз его перезарядка больше, чем у игрока.\n\n| Экипаж (код) | Реакция (`Tick`), с | Прицел (`Slack`), м | Перезарядка (`Slowness`), × |\n|---|---|---|---|\n| Новички (`Green`) | 0,5 | 5 | 2,2 |\n| Бывалые (`Seasoned`) | 0,35 | 2,5 | 1,9 |\n| Ветераны (`Veteran`) | 0,25 | 0 | 1,6 |\n| Асы (`Ace`) | 0,15 | 0 | 1,2 |\n\nВыстрел проверяется каждые 0,05 с (`Captain.Aiming`); `Slack` прибавляется к запасу касания снаряда. Перезарядка ×`Slowness` касается всех установок охотника, в секундах:\n\n| Установка | Игрок | Новички | Бывалые | Ветераны | Асы |\n|---|---|---|---|---|---|\n| Ракеты I | 2 | 4,4 | 3,8 | 3,2 | 2,4 |\n| Ракеты II | 2,5 | 5,5 | 4,75 | 4,0 | 3,0 |\n| Ракеты III | 3 | 6,6 | 5,7 | 4,8 | 3,6 |\n| Ракеты IV | 3,5 | 7,7 | 6,65 | 5,6 | 4,2 |\n| Торпеды | 10 | 22 | 19 | 16 | 12 |\n| Турель | 0,8 | 1,76 | 1,52 | 1,28 | 0,96 |\n| Минный жёлоб | 2,5 | 5,5 | 4,75 | 4,0 | 3,0 |\n\nЭкипаж охотников поста выбирают в редакторе карт (`Post.Hunters`; в мире новички, бывалые и один ветеран), охотников заданий — их код (`missions/Cargo.cs` и другие; до ветеранов на канонерке и броненосце). Асов сейчас не ставит никто. Вопрос: [Q29](../questions/combat.md#q29).\n\n## 5. Припасы\n\nИсточник: `game/pickups/Pickups.cs` (`Pickups.Take`, `Pickups.Mending`), `game/ships/Nitro.cs`.\n\n| Припас | Что даёт |\n|---|---|\n| Ремонт | Чинит `⌈Stood × 1/3⌉` попаданий (`Boat.Mend`), где `Stood` — все попадания лодки с поясом |\n| Броня | Пополняет запас брони до `⌈Stood × 1/3⌉` (не прибавляет, а доводит до этого; `Boat.Reinforce`); он снимается раньше плит и корпуса |\n| Нитро | Заполняет шкалу (`Nitro.Fill`); это два рывка (`Nitro`, [лодки](boats.md)) |\n| Топливо | Доливает половину бака (`Pickups.Refuelling`) |\n\nПрипас лежит 30 с, последние 5 мигает (`Lasting`, `Blinking`); берёт любая лодка, чей корпус подошёл к нему на 1,8 м (`Reach`). Ремонт и броня за подбор, для лодок без пояса:\n\n| Корпус | Катерок | Ялик | Плоскодонка | Гонщик | Патрульный | Канонерка |\n|---|---|---|---|---|---|---|\n| Попаданий | 1 | 2 | 2 | 2 | 4 | 6 |\n\nС поясом: 1, 2, 3, 3, 5, 8; с тяжёлым: 2, 3, 3, 4, 6, 9. Решение: [Припасы](../gameplay/pickups.md).\n\n## 6. Опасности\n\nИсточник: `game/areas/`. Силу даёт `Blasts.Burst`: попаданий у корпуса, спад к нулю на радиусе; взрывы задевают все стороны.\n\n| Опасность (код) | Вред корпусу |\n|---|---|\n| Мины (`Mines`) | 8 попаданий у корпуса, радиус 10 м; корпус, коснувшийся мины, или снаряд взрывает её; цепочка за 0,1–0,25 с |\n| Бочки (`Drums`) | 5 попаданий, радиус 7 м; взрыв от снаряда, взрыва рядом или от встречи корпуса с бочкой на скорости сближения больше 6 м/с |\n| Нефтяные пятна (`Slicks`) | Горящее пятно: 0,6 попадания в секунду, пока часть корпуса над огнём (`Scorching`); поджигает бочки внутри; поджигает его снаряд или взрыв |\n| Обстрелы (`Barrages`) | Падение 1,25 попадания у корпуса, радиус 9 м; предупреждение кольцом 1,4 с, падение ещё 0,7 с |\n| Батареи (`Batteries`) и орудия форта пиратов | Залп 4 красных ракеты (по 1 попаданию) раз в 6 с, не дальше 80 м; сама батарея стоит 16 попаданий, а добитая рвётся (2 попадания, радиус 6 м); орудие форта бьют попадания в его бастион |\n| Импульсные башни (`Towers`), в мире нет | Кольцо раз в импульс (заряд 1,5 с, ход 20 м/с): 1 попадание у основания, 0,4 у края радиуса; выбрасывает корпус наружу; в кольце до двух щелей |\n| Прожекторы (`Searchlights`), в мире нет | Не бьют, только замечают лодку игрока (вне дыма) |\n\nСтраница темы: [Зоны и опасности](../world/areas.md).\n\n## 7. Заметки\n\n- Ракеты: попаданий в секунду на борт растёт всё медленнее: 1,00 → 1,20 → 1,33 → 1,43 (+0,20, +0,13, +0,10), а цена идёт 40 → 75 → 120 → 210. Четвёртый уровень почти втрое дороже третьего ради +0,14.\n- Носовые стойки I и II бьют тем же, что Ракеты I и II, но стоят 90 и 170 против 40 и 75. Их единственное отличие — стрельба вперёд, и Катерок не может их нести вовсе.\n- Турель, бесплатная и весом 0,3 т, даёт 1,25 попадания в секунду одной стойкой, чуть больше, чем Ракеты II на борт (1,20). Платой служит досягаемость 45 м против 80.\n- Мина — самый плотный вред на секунду на борт (2,00) при цене 300, но бьёт только по лодке, наехавшей на неё; в таблице времени «Мина (в цель)» оптимистична.\n- Торпеда: 12 попаданий за снаряд топят любой корпус без пояса, кроме Канонерки (16), одним попаданием; с броневым поясом одним не топится уже Патрульный катер (14). Взамен она перезаряжается 10 с, идёт ≈7,6 с и стоит 450 монет и 0,8 т. Канонерке с тяжёлым поясом (27) нужны три залпа.\n- Дрон бьёт в том же темпе, что Ракеты I на борт (1,00), а пара с люлькой стоит 480 монет против 40; взамен он стреляет сам, не требует вывода борта, но стоит всего два попадания и должен долететь до цели.\n- Охотник даже ас стреляет в 1,2 раза медленнее игрока с такой же установкой, а новичок в 2,2 раза. Потому охотнику той же установки нужно больше времени: например, Ракеты IV ас бьёт 1,19 попадания в секунду против 1,43 у игрока.\n- Мина (5 у корпуса) и бочка (5) равны и бьют сильнее ракеты в пять раз; мина-ловушка поля (8) сильнее любой мины игрока (5).\n- Тяжёлый пояс на Катерке — +2 при 2 попаданиях корпуса, то есть вдвое больше; на Канонерке +11 из 16.\n- Разрыв между сборками велик: Канонерку без пояса Торпеды топят за два залпа (10 с), мины — за четыре (7,5 с), а Ракеты I — за восемь (14 с).\n"}, {"id": "base-boatyard", "path": "base/boatyard.md", "title": "Верфь", "section": "base", "date": "2026-11-13", "md": "# Верфь\n\n![Верфь: карточки деталей и панель показателей](../img/boatyard.jpg)\n\nВерфь — экран у причала [гавани](pier.md), где лодка собирается из деталей. Открывается только у причала, с ленты пришвартованной лодки. Цены и массы деталей — в [Балансе лодок](../balance/boats.md) и [Балансе оружия](../balance/weapons.md).\n\n## Решения владельца\n- 2026-11-13: верфь показывает обычный изометрический вид, тот же, что в бою. Низкий вид сбоку, который игрок крутил сам (решение 2026-11-10), владелец увидел и назвал странным. Лодка по-прежнему сама подъезжает в кадр, а выбор детали вид не двигает.\n- Верфь у пирса: лодка настраивается там, где стоит, на живой воде. Не в открытом море.\n- Верфь — нижняя лента, как гараж NFS: категории плитками вдоль низа, над ними ряд карточек деталей с ценой и весом, показатели справа, кошелёк; мышь, клавиши и геймпад. Значков на лодке, по которым надо щёлкать, нет.\n- Верфь открывается только в гавани у причала, никогда в море.\n- Верфь показывает монеты на руках в углу, на глянцевой табличке-кошельке рядом с жетоном-монетой: монеты везде выглядят одинаково. Счёт убывает по мере покупки детали, а каждая цена показывает, хватает ли монет. Деталь, на которую наведён фокус в ряду, имеет фокус меню, светится аква под аквамариновым кольцом; оранжевым отмечена только установленная деталь.\n- Деталь, на которую наведён фокус, стоит на лодке призраком: прозрачным и светящимся аква, корпус показан призраком целиком, и лодка сидит в воде так, как села бы с ней. Если снова навести на установленную деталь или выйти, лодка возвращается к установленному. Установленная деталь встаёт с небольшой осадкой и бликом.\n- 2026-11-12: карточки деталей и экран показателей — в стекле, как плитки ([Компоненты](../art/components.md)).\n- Выход с верфи: «Готово», Esc и Tab оставляют лодку как построена. Проект, который утонул бы, сперва предупреждает, потом оставляет последний проект за визит, который держался на плаву.\n- 2026-11-13: кнопки «Испытать» и полигона нет, владелец убрал их целиком.\n\n## Как устроено\nПри загрузке игра один раз открывает верфь на несколько кадров за шторкой загрузки (`Boatyard.Rehearse`): всё, что её экран строит и компилирует в первый раз, ждёт там, и первое открытие не подвисает. Открывается только у причала, плиткой «Верфь» или `Tab` на ленте пришвартованной лодки (`Game.OpenYard`): `Boatyard` держит лодку, как она спроектирована, на первом месте у причала (`Dock.Berth`) на живой воде, поэтому вес виден по осадке, дифференту и опрокидыванию. Лодка игрока в мире на это время убрана, а без связи бой в море ждёт; в коопе он идёт дальше. Выход (`Game.Refit`) возвращает лодку в мир на её место, заново построенную, если проект изменился, с тем же трюмом, и возвращает ленту.\nСвоей камеры у верфи нет: её показывает вид боя (`camera/IsometricCamera.cs`, [Камера и картинка](../gameplay/camera.md)). Пока верфь открыта, он стоит над первым местом у причала и приближается так, чтобы вся лодка лежала в свободной части экрана: левее показателей, под заголовком, над карточками (`Boatyard.Frame`, `IsometricCamera.Hold` с долей кадра). Вид не крутится и не приближается игроком. То, что пирс поднимает над настилом перед лодкой (мачта, ванты, флажки), растворяется дизерингом вокруг неё, а настил остаётся целым. Насколько близко стоит вид, что его нельзя крутить и что мачта растворяется, — решение без владельца, [Q207](../questions/interface.md#q207).\nВход: вид боя плавно приближается, как при швартовке, а лодка в это время сама переходит с места, где стояла, на первое место у причала. Она не приходит с моря: она уже пришвартована (решение без владельца, [Q179](../questions/interface.md#q179)). Выход сразу возвращает ленту, и вид отходит к виду причала. Только вид местного игрока: мир не останавливается.\n\nМеста лодки — стеклянные плитки ленты вдоль низа (`ui/Ribbon.cs`, [Компоненты](../art/components.md)): корпус, мотор, броня, станции и снаряжение, каждая с пиктограммой; свет скользит к выбранной и заливает её аква; выбор места или детали вид не двигает. Над лентой ряд стеклянных карточек деталей этого места (`Choices`, [Компоненты](../art/components.md), решение без владельца: [Q166](../questions/interface.md#q166)), каждая с весом, а у корпуса ещё длина, станции, удары, места трюма и бак; установленная обведена тонким оранжевым кольцом и светится оранжевым снизу, карточка под фокусом наливается светом лагуны, не купленная лежит матовой под замком с ценой на белом ярлычке, зелёной, если монет хватает, и красной, если нет. A и D меняют место, W и S ходят по карточкам, Enter ставит. Не купленная деталь по нажатию предлагает себя выноской, и второе нажатие покупает и ставит её, а если монет не хватает, карточка вздрагивает (`yard/Choices.cs`); монеты убывают в кошельке рядом с «Готово» (`ui/Purse.cs`). Корпус с большим числом станций возвращает детали, которые держали его станции за этот визит (`Design.WithHull`). Снаряжение — свои плитки ленты («Снаряжение 1, 2, 3», по числу мест корпуса, `Place.Gear`): каждое заполняется снаряжением или остаётся пустым, а вид, уже стоящий на другом месте, в ряду не предлагается. Смена корпуса сохраняет снаряжение по местам, а то, что не поместилось, снимается. Экран статистики перечисляет снаряжение по местам.\nПоказатели — на высокой панели из того же стекла, что карточки и кошелёк (`StatsPanel`, `ui/Glass.cs`), затемнённой под белые слова с тёмным ореолом: они читаются и над светлой лагуной, и над тёмным пирсом. Панель в том же слое, что карточки, и не добавляет копии экрана. Имя лодки — мелкими белыми капителями над панелью, гоночный номер — на круглой стеклянной бусине цвета её полосы. Каждый показатель — в единицах самой детали, на полоске стекла, залитой аква; то, что изменит подсвеченная деталь, на ней зелёное, где лучше, и красное, где хуже ([Q52](../questions/interface.md#q52)); сцепление, где нет ни лучше, ни хуже, у подсвеченной детали белое. Нагрузка — стеклянные бусины цвета деталей, а дальше того, что корпус держит на плаву, красные; вес, который добавляет подсвеченная деталь, обведён, а то, что она снимает, остаётся пустыми ободками. Строки на плаву показывают каждое изменение. Панель растёт вместе со словами детали, а лампа под ней — зелёная или красная бусина — говорит всё: лодка годна к морю или почему утонет. Значки деталей на карточках и плитках — такие же стеклянные бусины. Размеры, шрифты и затемнение панели — в теме, тип `Stats`; поля экрана и виньетка — общий тип `Screen`; заголовок «Верфь» — тот же печатный заголовок, что у базы. «Готово» — стеклянная `Pill`. Выход делает проект лодкой, которая выйдет от пирса; та, что утонула бы, предупреждает выноской (`Balloon.Draw`, как и выноска с ценой), а повторный выход оставляет последний проект за визит, который держался на плаву, или лодку как была.\n\nЛодка у пирса — подсвеченный проект, поэтому она держится на воде так, как держался бы он. То, что у неё есть сверх установленного, рисуется отдельно (`Boat.Mark`) в `yard/ghost.gdshader`, аквамариновым стеклом прицела (`ui/glow_glass.gdshaderinc`), скрытым за лодкой и под водой; установленная деталь сохраняет его, угасая, и лодка оседает. Почему сама лодка: одна сборка и держит её на воде, и рисует её.\n\nЧто хранит `Progress` и как сохраняется, см. в [Прогресс и сохранения](../gameplay/progression.md).\n"}, {"id": "base-pier", "path": "base/pier.md", "title": "Гавань: мастерская корабела", "section": "base", "date": "2026-11-15", "md": "# Гавань: мастерская корабела\n\n![Мастерская корабела в лагуне, лодка у причала](../img/pier.jpg)\n\n![Лодка у причала: вид боя придвинут, над морем лента](../img/pier-moored.jpg)\n\n![Корабел принимает добычу у причала](../img/trader-harbour.jpg)\n\nГавань — мастерская корабела на сваях в лагуне острова `Home cay` на карте [мира](../gameplay/missions.md). Это место открытого мира, а не отдельный экран: к ней доплывают, швартуются на `Space`, продают добычу корабелу, заходят на [верфь](boatyard.md) и отчаливают.\n\n## Решения владельца\n- Пирс на острове — не хаб, а одно из мест открытого мира; его облик строится под вид боя (2026-11-13).\n- Это мастерская корабела: один короткий причал и мастерская на сваях — сарай, слип с лодкой на тележке, лебёдка, топливная колонка. Сразу видно, что здесь чинят, строят и покупают добычу (2026-11-13).\n- Дух — старое дерево, канат и латунь, плюс немного соларпанка в родстве со [станцией «Мария»](../world/outpost.md): грядки и зелень на крышах, солнечные панели, маленький ветряк, стеклянные поплавки (2026-11-13).\n- Экрана базы нет. Пришвартованная лодка остаётся в мире у причала, вид боя лишь плавно приближается к ней. Над морем короткая лента: «Торговец», «Верфь», «Отчалить». Кооператив, судовой журнал и настройки — в меню `Esc`. Товарищи видят лодку у причала прямо в мире (2026-11-13).\n- Плитка «Торговец» продаёт и то, что осталось непроданным: ящики можно продать позже, не выходя снова в море (2026-11-13).\n- Ориентир — высокая сигнальная мачта у причала: вымпел по ветру днём, тёплый фонарь ночью. Вещь мира, без лучей и неона (2026-11-13).\n- Игра начинается сразу в открытом мире в море, а в гавань нужно приплыть самому и пришвартоваться на `Space` (или D-pad Вниз на геймпаде), сбавив ход вдали от охотников (2026-11-10).\n- У причала кнопки, как в NFS или World of Warships, а не предметы, по которым надо щёлкать (2026-11-10). Монеты показаны жетоном и числом, без подписи.\n- Место швартовки отмечено кольцом стеклянных поплавков, как старые рыбацкие: в каждом маленький тёплый огонёк, они качаются на волне, под ними мягкий бирюзовый свет в воде. Цвета — аква и тёплые огоньки. Столба света и лампы, красящей всё вокруг, нет. Издалека кольцо спокойно; когда лодка подошла и можно причалить, свет мягко разгорается и дышит (2026-11-12). Так же отмечена станция.\n- Неоновый танцующий свет, как маркеры миссий в Vice City (2026-11-11), владелец увидел и отверг: слишком ярко, слишком пёстро, неестественно.\n- Модель сделана в Blender.\n\n## Как устроено\n- **Модель** (`tools/dock.py`, `blender -b -P tools/dock.py` пишет `base/dock.glb`): цвет и отделка каждой грани лежат в вершинах, как у лодок, поэтому `surface.gdshader` рисует мастерскую в едином свете сцены. Мастерская стоит на сваях в лагуне, а не на песке: пляж пологий, и ближе 34 м от берега лодкам мелко. С пляжем её связывают длинные узкие мостки с калиткой и фонарём у берега. На помосте: сарай под двускатной крышей, открытый к морю, — на морском скате солнечные панели, на береговом грядка очитка, внутри верстак и доска на козлах; слип из двух рельсов, уходящих под воду, с тележкой, корпусом в наборе и ручной лебёдкой; топливный бак на стойке и оранжевая колонка; сигнальная мачта 13,6 м с фонарём, шаром и конусом на рее, флажками и оранжевым вымпелом; ветряк на растяжках; гирлянды стеклянных поплавков, перевёрнутая шлюпка, подвесные моторы, бочки, ящики и грядки в кадках. От помоста в море идёт короткий причал пониже, с кранцами, утками и двумя оранжево-белыми сваями на конце. Сваи, мостки и состав мастерской — решение без владельца ([Q182](../questions/world.md#q182)).\n- **Живые части** (`Dock._Process`): вымпел полощется по пассату (`Trades.Fluttered`, то же правило у станции), ветряк крутится тем быстрее, чем сильнее ветер. Ночью у каждого фонаря модели горит тёплый ореол (`Daylight.Night`, узлы `Lantern…`); света на настил фонари не бросают.\n- **Настилы и места** (`Dock`): настилы входят в землю для столкновений, снарядов и щупов охотников (`World.Ground`), но не для глубины моря. Мест у причала четыре, по одному на игрока (`Dock.Berths`, `Dock.Berth`): по обе стороны причала, вдоль левого края помоста и у конца причала. Лодки стоят носом к морю. `Dock.Free` находит ближайшее место, где не стоит чужая лодка. Твёрды только настилы и слип: сарай, мачта и корпус на слипе снаряды пропускают.\n- **Швартовка** (`Game.Offered`, `Game.Moor`, `Game.Berthing`, `Game.CastOff` в `Game.Home.cs`): когда лодка сбавила ход ниже `Site.Slow` в пределах кольца швартовки (`Mooring.Reaches`) и рядом нет охотников (`Game.Hunting`), под лодкой встаёт подсказка `Space` «Гавань», а если охотники рядом — «ОХОТНИКИ РЯДОМ». По `Space` лодка сама доходит до ближайшего свободного места и стоит там; корпус и броня целы, бак полон, игра сохранена. Вид боя приближается к причалу (`IsometricCamera.Hold`), HUD уходит, встаёт лента. Мир при этом живёт: бой не останавливается, а охотники, подошедшие на дистанцию боя, снимают лодку с причала с предупреждением «Охотники рядом». «Отчалить» или `Space` возвращают штурвал; лодка стоит носом к морю. Всё это — решение без владельца ([Q179](../questions/interface.md#q179)).\n- **Лента** (`base/Quayside.cs`, `ui/Ribbon.cs`): вдоль низа экрана три прозрачные стеклянные плитки ([Компоненты](../art/components.md)): «Торговец», «Верфь» и справа вдвое шире «Отчалить» с оранжевым светом игрока. Сначала выбрана «Торговец», если в трюме есть ящики, иначе «Отчалить». Курсор или `A` и `D` ведут свет к плитке, подпись над лентой («// что делает» и точки по числу плиток) едет за ним; щелчок или `Enter` открывает, `Tab` открывает верфь, `Esc` — меню. Монеты — в стеклянном кошельке вверху справа. Плитки приходят по очереди и опускаются, когда сверху ложится меню, экран корабела или верфь. Стекло, подпись и движение — решение без владельца ([Q160](../questions/interface.md#q160)).\n- **Корабел**: «Торговец» (значок — стопка монет) открывает экран торговца ([Добыча](../gameplay/haul.md)); закрытый, он возвращает ленту. С пустым трюмом корабел говорит, что на борту ничего нет.\n- **Место швартовки** (`Mooring`, `mooring_ring.gdshader`): у первого места на воде лежит кольцо шириной 16 м из двенадцати стеклянных поплавков на пеньковом лине. Поплавок — шар дутого стекла, трёх оттенков аква и пяти размеров, в ромбической сетке из линя; там, где сетка сходится, лежит латунное кольцо, а в макушку шара утоплен маленький золотой фонарь-банка под латунной крышкой с солнечной батареей. На каждом четвёртом пророс росток, и каждый поплавок чуть наклонён по-своему. Стекло — свой материал (`Surfaces.Blown`, `common/blown.gdshader`): сплошное, но солнце проходит сквозь него, и сторона от солнца светится цветом стекла; блик на нём один, как отражение окна, и лежит целым поверх стекла и сетки. Поплавки качаются на зыби, расступаются перед корпусом лодки (`SeaSurface.Hulls`) и возвращаются на лине. Тень на море бросает плоская заглушка у ватерлинии: сам шар тени не бросает, иначе затенил бы свою светящуюся сторону. Поплавки лежат только там, куда от середины кольца доходит открытая вода: не под настилом, не на пляже и не по другую сторону причала, так что у причала кольцо — дуга от помоста до причала. В воде шейдер кладёт под кольцом полосу воды глубже цветом (читается над светлой отмелью), мягкий бирюзовый свет под кольцом и под каждым поплавком (читается над глубокой водой и в тени), тёплое пятно под каждым горящим фонарём, светлую линию там, где вода смачивает шар, и рисует линь между поплавками. Пока лодка далеко, фонари не горят; в пределах `Site.Reach` светят вполсилы; когда лодка сбавила ход и можно пришвартоваться, горят ясно и медленно дышат вместе со светом в воде. Когда рядом охотники, фонари гаснут, а свет в воде тускнеет. Фонари ничего вокруг не освещают. На верфи кольца нет. Кольцо ставит каждая машина сама, в кооперативе его видит и гость. Число, размеры и оттенки поплавков, сетка, фонарь-банка, росток, свет и полоса в воде и то же кольцо у станции — решение без владельца ([Q158](../questions/world.md#q158)). Демо `Harbour`.\n- **Товарищи**: в кооперативе лодка товарища у причала — это его лодка в мире: её ведёт хост, и её видит каждая машина ([Онлайн-кооп](../online.md)). Имён над лодками товарищей теперь нет ([Q140](../questions/online.md#q140)).\n\n## Открытые вопросы\n- [Q182](../questions/world.md#q182): мастерская на сваях в лагуне и её состав.\n- [Q179](../questions/interface.md#q179): как лодка швартуется и что происходит у причала.\n- [Q140](../questions/online.md#q140): имена над лодками товарищей.\n- [Q158](../questions/world.md#q158), [Q160](../questions/interface.md#q160).\n\nСм. также: [Верфь](boatyard.md), [Экраны и меню](../interface/screens.md), [Онлайн-кооп](../online.md).\n"}, {"id": "decisions", "path": "decisions.md", "title": "Журнал решений", "section": "", "date": "2026-11-16", "md": "# Журнал решений\n\nКрупные решения владельца по датам, с отвергнутым и откаченным, чтобы не повторять. Само решение — на странице темы; здесь только когда и почему. Почти всё сделанное с конца октября 2026 владелец ещё не играл.\n\n## Октябрь 2026\n- **10-15** Игра должна играться: всё встраивать в живую игру, настоящий прототип, а не «текст и кнопки».\n- **10-26** Симулятор архипелага снят целиком; вся игра — аркадный морской бой: статичный изометрический вид, одна лодка без физики, но с ощущением моторной лодки, огонь с бортов на `Q`/`E`. «Ощущается потрясающе». Старая игра хранится под git-тегом `simulator-game`. → [Об игре](vision.md)\n- **10-26** Лодку собирают из деталей на верфи; вес важен; красивый экран характеристик; без свободных корпусов и многокорпусных. Нарисованный корпус — это физический корпус. → [Верфь](base/boatyard.md)\n- **10-26** Один остров на банке с мелководьем рядом, чтобы море было красивым. → [Море](world/sea.md)\n- **10-26** 60 кадров в секунду достаточно, качество важнее. → [Об игре](vision.md)\n- **10-26** Отвергнуто: глиссирование, поднявшее корпус, — пропало «прыгание по волнам», откачено; корпуса едут по кильватерам. 10-31: это весело, но не опора игры.\n- **10-26** Отвергнуто: тёмные стеклянные карточки интерфейса — «безлико, как сгенерировано ИИ». → [Арт-дирекшн](art/README.md)\n- **10-27** Делать, как делают игры: сначала выпущенные игры и самый простой подход, симуляции и статьи — только когда простого не хватает. → [CLAUDE.md](../CLAUDE.md)\n- **10-27** Отвергнуто: погода (туман, дождь, шторм, гром) построена и снята целиком. → [Погода](world/weather.md)\n- **10-27** Отвергнуто: лор с придуманными словами — откачен; владелец выбирает лор по кускам. → [Сеттинг и лор](story/setting.md)\n- **10-28** Настоящие моторные лодки вместо коробок на плите. → [Облик лодок](art/boats.md)\n- **10-28** Ракеты на открытых рельсовых стойках, прямые и быстрые. Раньше плоские выстрелы были «слишком быстрыми», потом были дуговые шары. → [Бой](gameplay/combat.md)\n- **10-28** Пена симулирована и принадлежит воде; брызги урезаны как «чрезмерные». → [Облик мира](art/world-look.md)\n- **10-28** Звук — слои записей CC0 с Freesound; список загрузок одобряет владелец. → [Звук](audio/sound.md)\n- **10-29** Каждая деталь — лучший выбор для какой-то лодки; детали, худшие во всём, убраны. Вес стоит скорости. → [Лодка](gameplay/boat.md)\n- **10-29** Демо и проверки в `game/demos`; игра ничего не несёт для тестов. → [Демо](tools/demos.md)\n- **10-29** Сборки для Mac и Windows, версия на каждый пост. → [Сборки и посты](tools/release.md)\n- **10-29** Отвергнуто: образец HUD из авиасимулятора снят. → [Стиль интерфейса](art/interface.md)\n- **10-30** Отвергнуто: усиленные стилизованные кильватерные волны — «выглядят плохо», откачены. → [Арт-дирекшн](art/README.md)\n- **10-30** Охотники: таранщики, торпеды, стаи, припасы, дым, один ИИ-планировщик на всех. → [Охотники и ИИ](gameplay/hunters.md)\n- **10-31** Миссии, а не открытый мир; топливо ограничено; база — эллинг из Blender, с неё начинается игра. Отвергнуто: первая база, жёлтый дом с красной крышей. Миссии сменила арена 11-09, эллинг — пирс 11-10. → [Открытый мир](gameplay/missions.md), [Пирс](base/pier.md)\n- **10-31** Миссия начинается в море, со вступительного пролёта низко у борта. Пролёт снят 11-11. → [Миссии](gameplay/missions.md)\n- **10-31 — 11-01** Лунная ночь и тёплый рассвет. → [Свет и время суток](art/light.md)\n\n## Ноябрь 2026\n- **11-01 — 11-02** Места промысла с видом сбоку; редактор карт с картами в JSON. → [Места промысла](gameplay/sites.md), [Редактор карт](tools/map-editor.md)\n- **11-02** Гоночные ливреи, банда охотников в малиновом, рубки и приметы соларпанка. → [Облик лодок](art/boats.md)\n- **11-02** Интерфейс — вещи мира; образцы Frutiger Aero и Utopian Scholastic. → [Стиль интерфейса](art/interface.md)\n- **11-02** Сеттинг назван: оптимистичный соларпанк после падения. → [Сеттинг и лор](story/setting.md)\n- **11-02** Посты в канале по-русски, каждый одобряет владелец; вышла 0.0.2. → [Сборки и посты](tools/release.md)\n- **11-03** Название — Floppa Tropical Adventures. Все жители — флоппы. → [Люди: флоппы](art/people.md)\n- **11-03** Кампании пока нет; детали покупают за монеты; пустой бак проваливает миссию (снято 11-09); без тепловизора дым прячет цели; автосохранение. Отвергнуто: открытие деталей с каждых обломков. → [Прогресс и сохранения](gameplay/progression.md)\n- **11-03** Музыка на семплах инструментов CC0. → [Музыка](audio/music.md)\n- **11-04** Все замечания QA по интерфейсу исправлены, добавлен геймпад. → [Управление](interface/controls.md)\n- **11-04** Простейший кооп по локальной сети. → [Онлайн-кооп](online.md)\n- **11-06** Никто из флопп ничего не держит в лапах. → [Люди: флоппы](art/people.md)\n- **11-06** Голос — кошачий лепет на каждую букву, а не речь; анимированные метки текста. → [Диалоги и голос](story/dialogue.md)\n- **11-06** Сюжет — сцены во встроенном редакторе: граф и сценарий, ветки, условия, приоритеты, триггеры. → [Сцены сюжета](story/scenes.md)\n- **11-06** Топливо считается расстоянием, лимита скорости нет, броня — броневой пояс на своём месте верфи, торпедные аппараты под водой. → [Лодка](gameplay/boat.md)\n- **11-06** Директор шлёт набеги в затишья по бюджету угрозы. → отменено 11-11\n- **11-06** Зоны и опасности на картах. → [Зоны и опасности](world/areas.md)\n- **11-06** Полигон у базы с мишенями-макетами. → отменено 11-13\n- **11-06** Горы, барьерные рифы, морские столбы, косы и отмели. → [Рельеф](world/ground.md)\n- **11-06** Мир — как на картинках меню. → [Облик мира](art/world-look.md)\n- **11-06 — 11-07** Отвергнуты все облики меню с картинок, громкие и утончённые. → [Арт-дирекшн](art/README.md)\n- **11-07** Никаких картинок, сгенерированных ИИ. → [Арт-дирекшн](art/README.md)\n- **11-07** Страница настроек и русский перевод. → [Язык](interface/language.md)\n- **11-07** После игры: вид слишком близко, открытое море бледное — зум и тон возвращены. → [Q77](questions/world.md#q77)\n- **11-07** Пять новых стилей игры: преследователь, турельщик, носитель дронов, минёр, загонщик; без подлодки и без медленного танка. → [Сборки и стили игры](gameplay/builds.md)\n- **11-07** Облик всей игры заново, от геймплея: шесть обликов на стенде. Владелец ещё не выбрал. → [Кандидаты на облик](art/candidates.md)\n- **11-08** Документация переехала в эту вики, по-русски; `docs/` убран. → [Главная](README.md)\n- **11-08** Сеть за кормой заменена трюмом, как рюкзак в шутерах с выносом добычи: сетка клеток по корпусу, предметы ложатся сами, защищённого контейнера нет. Сетку сменили ящики 11-11. → [Добыча](gameplay/haul.md)\n- **11-08** Вступительный пролёт быстрый, 2–3 секунды, с целью миссии под названием; карточки врагов убраны 11-10, сам пролёт — 11-11. → [Миссии](gameplay/missions.md)\n- **11-09** Вид следует за лодкой, а в аренах стоит над ареной, и миссия проигрывает вставки по кадрам из редактора карт; лодка несёт снаряжение по размеру корпуса; крафта нет, детали только покупаются; в коопе товарищ возвращает потопленную лодку у обломков, а меню паузы онлайн не останавливает бой. → [Камера и картинка](gameplay/camera.md), [Лодка](gameplay/boat.md), [Прогресс и сохранения](gameplay/progression.md), [Онлайн-кооп](online.md)\n- **11-09** Уровней и выбора уровня нет, торговой точки тоже: в эллинге одна кнопка «На арену», она начинает единственный уровень. Монеты остаются и покупают детали в верфи, добыча продаётся сама на квитке по возвращении домой. → [Пирс](base/pier.md), [Прогресс и сохранения](gameplay/progression.md), [Добыча](gameplay/haul.md)\n- **11-09** Основное оружие — турель, она стоит на стартовой лодке; ракеты — дополнение, покупаются в верфи. → [Бой](gameplay/combat.md)\n- **11-09** Дельфины убраны из игры: модель, код и демо. → [Об игре](vision.md)\n- **11-09** Арена — один большой уровень и бесконечный заход, внутри случаются события из прежних видов миссий (конвой, курьер, маяки, груз, броненосец); кончается выходом или гибелью, добыча продаётся на квитке. → [Открытый мир](gameplay/missions.md)\n- **11-09** Крюка нет: владелец убрал крюк, лебёдку и буксир. → [Лодка](gameplay/boat.md)\n- **11-09** Ракеты и торпеды наводит курсор в веере своего борта, щелчок стреляет бортом под курсором; клавиши смены захвата нет. Мышь снята 11-10: точку прицела даёт правый стик. → [Бой](gameplay/combat.md)\n- **11-09** Ракеты врагов летят медленнее ракет игрока, чтобы от них уворачиваться; удар носом на нитро — приём любой лодки. → [Бой](gameplay/combat.md)\n- **11-09** Пустой бак больше не проваливает поездку: лодка ползёт домой с добычей. Вес добычи не наказывает за полный трюм. → [Лодка](gameplay/boat.md), [Добыча](gameplay/haul.md)\n- **11-10** База — открытый пирс в лагуне вместо эллинга; база и верфь на лентах плиток, как гараж NFS, без предметов и значков для щелчка; лодки товарищей по кооперативу стоят у того же пирса. → [Пирс](base/pier.md), [Верфь](base/boatyard.md)\n- **11-10** Ракету парируют ракетой; нитро — рывок, которым уходят от ракет, крутой, а не правдоподобный. → [Бой](gameplay/combat.md), [Лодка](gameplay/boat.md)\n- **11-10** Соперников в игре нет; у каждого врага случайное лицо. Соперники вернулись 11-15. → [HUD](interface/hud.md)\n- **11-10** Открытый мир вместо «хаб + миссии»: игра по умолчанию сразу начинается в море на арене, а база — это гавань (пирс) на острове, к которой нужно доплыть и пришвартоваться на `Space`; буи выхода убраны из игры, выход из гавани возвращает лодку от пирса в то же живое море, а гибель показывает «Погиб» и перезагружает последнее сохранение. → [Открытый мир](gameplay/missions.md), [Пирс](base/pier.md), [Добыча](gameplay/haul.md)\n- **11-11** В море стоит плавучая торговая ботаническая станция, большой корабль по картинке владельца, смоделированный в Blender; у неё продают добычу; её стёкла прозрачные, новый материал для игры. Этим отменено «торговой точки нет» от 11-09 в части места в море. → [Станция](world/outpost.md)\n- **11-11** Директора нет: охотники выходят только с постов, поставленных на карте, их виды выбирают в редакторе; охотник гонится за лодкой, пока видит её, и забывает, когда она ушла из вида. → [Зоны и опасности](world/areas.md), [Охотники и ИИ](gameplay/hunters.md)\n- **11-11** Разовые расходники, собранные из добычи в трюме, и панель быстрого доступа на 1–4; детали по-прежнему только покупаются. → [Добыча](gameplay/haul.md), [Управление](interface/controls.md)\n- **11-11** Вступительной сцены нет: заход сразу начинается в виде боя, руль у игрока, HUD на месте, охотники живы. → [Открытый мир](gameplay/missions.md)\n- **11-11** Стрелок вокруг лодки на HUD нет: HUD не указывает на то, что за экраном. → [HUD](interface/hud.md)\n- **11-11** У ракет и снарядов предельная дальность: на краю досягаемости заряд гаснет в воздухе, дальше ничего не летит. → [Бой](gameplay/combat.md)\n- **11-11** Место швартовки отмечено цветным медленно танцующим светом на воде, как маркеры миссий Vice City, вместо пунктирного круга HUD. Сменён поплавками 11-12. → [Пирс](base/pier.md)\n- **11-11** Ящики вместо сетки: экран трюма и сетка ушли, добыча — несколько видов ящиков в ряду слотов на HUD, расходники тратят ящики клавишами 1–4, полный трюм сам меняет дешёвое на дорогое, утонув, теряешь всё. Отменяет сетку от 11-08 и «HUD не показывает счёта добычи». → [Добыча](gameplay/haul.md), [HUD](interface/hud.md)\n- **11-11** Интерфейс — прозрачное стекло Frutiger Aero с красивым движением, начиная с кнопок базы; у игры официальная палитра и базовые компоненты. → [Арт-дирекшн](art/README.md), [Палитра](art/palette.md), [Компоненты](art/components.md)\n- **11-12** Место швартовки — кольцо стеклянных поплавков с тёплыми фонарями: неоновый свет владелец увидел и отверг как слишком яркий, пёстрый и неестественный. → [Пирс](base/pier.md)\n- **11-12** Стекло идёт дальше плиток базы: меню, карточки деталей верфи и HUD. → [Компоненты](art/components.md), [HUD](interface/hud.md), [Экраны и меню](interface/screens.md)\n- **11-12** Облик интерфейса живёт в одной теме Godot (`game/ui/look.tres`): палитра, шрифты, роды стекла, размеры деталей; его меняют там, а не переносят по частям. Стекло чуть менее прозрачно. → [Компоненты](art/components.md), [Палитра](art/palette.md)\n- **11-12** Цель игры — сюжетная линия поручений флопп в гавани и на станции: по одному разом, выполненное открывает следующее, новые детали и места, в конце финальный босс; первое поручение — обучение по рации. Сложность одна: её задаёт мир (слабые посты у гавани, сильные дальше), в коопе посты крепнут с числом игроков; у старта новой игры слабый пост. «Арена» и «заход» переименовываются везде (плитка «В море», мир — мир). → [Об игре](vision.md), [Прогресс и сохранения](gameplay/progression.md), [Сцены сюжета](story/scenes.md)
