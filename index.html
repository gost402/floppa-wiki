 что ссылка `missions.md#q17` ведёт прямо к нему; номера не переиспользуются. Под каждым вопросом — ссылка на страницу его темы.\n\nКогда владелец отвечает: решение пишется в «Решения владельца» на странице темы, вопрос удаляется, а крупное решение получает строку в [Журнале решений](../decisions.md). Новый вопрос получает следующий свободный номер и встаёт на страницу своей области.\n\n## По областям\n- [Арена](missions.md): Арена и её события, прогресс, зоны, полигон.\n- [Лодка](boat.md): управление, вес, топливо, броня, припасы.\n- [Бой](combat.md): оружие, охотники, сборки.\n- [Добыча](haul.md): места промысла, добыча.\n- [Мир и облик](world.md): облик, люди, рельеф, свет, станция и выбор облика со стендов.\n- [Интерфейс](interface.md): HUD, экраны, верфь, управление, язык, компоненты и палитра.\n- [Сюжет](story.md): сеттинг, сцены.\n- [Звук](audio.md): звук и музыка.\n- [Онлайн](online.md): кооператив.\n- [Инструменты](tools.md): редактор карт и демо.\n- [Чего нам не хватает](gaps.md): то, что выпущенные игры обычно решают, а у нас пока не решено.\n"}, {"id": "questions-audio", "path": "questions/audio.md", "title": "Вопросы: звук", "section": "questions", "date": "2026-11-09", "md": "# Вопросы: звук\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q23\nЗвуки, выбранные для взятия припаса, постановки дыма, добычи, пойманной рыбы и лебёдки захвата: верно? Охотнику перед выстрелом тоже нужен звук, который выдаёт выстрел: пока это щелчок храповика из записи подбора ремонта (`pickup/repair_`, `Cue.Tell`), временная замена.\n\nТема: [Звук](../audio/sound.md)\n"}, {"id": "questions-boat", "path": "questions/boat.md", "title": "Вопросы: лодка", "section": "questions", "date": "2026-11-12", "md": "# Вопросы: лодка\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q8\nКакие корпуса, моторы и палубные детали нужны и чем должна отличаться каждая? Сколько мест снаряжения у каждого корпуса, как далеко ведёт его бак, и как быстро жжёт каждый мотор?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q9\nВид нитро сейчас: во время рывка из-под транца бьёт петух из брызг от любого мотора, у воздушного винта тоже: оставить? Охотники дают рывок нитро, чтобы идти в таран, сближаться и подходить издали: этого достаточно?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q20\nСкорость сверху не ограничена: голый катерок на водомёте идёт 53 м/с (около 50 м/с со стойкой), а рывок нитро прибавляет 14 м/с и полсекунды даёт 2,5× мощности. Достаточно быстро, или самые дорогие моторы должны идти ещё быстрее?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q30\nБроневой пояс: лёгкий пояс добавляет треть попаданий корпуса, тяжёлый две трети, каждая плита получает равную долю; удар берёт ближайшую плиту своего борта, а упавшая плита облегчает лодку равномерно, а не на своём борту. Верно?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q112\nПрипас топлива доливает половину бака, выпадает тем вероятнее, чем меньше топлива в баке ([Q144](#q144)), а берётся со звуком нитро: этого достаточно, или он должен давать больше или меньше, выпадать реже и звучать по-своему? Цвет у него фиолетовый.\n\nТема: [Припасы](../gameplay/pickups.md)\n\n### Q137\nС пустым баком лодка игрока идёт на четверти газа, и нитро закрыто; топлива это не просит, сколько бы ни пришлось идти. Верна ли доля, и должен ли малый ход чего-то стоить (времени, добычи)?\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q146\n_Частично: неуязвимость решена 11-12 (только игрокам), открыты сила, цена и время ([Журнал решений](../decisions.md))._ Нитро стало рывком: нажатие тратит половину шкалы, толкает лодку вперёд на 14 м/с и полсекунды тянет в 2,5 раза сильнее; в эти полсекунды ракеты и снаряды проходят сквозь лодку. Полная шкала — два рывка, она наполняется за 6 секунд. Рывок — одно нажатие: удержанная клавиша второй раз не рвёт. Охотники рвут так же и так же неуязвимы для ракет. Верны ли сила, цена и время неуязвимости, и нужна ли неуязвимость охотникам?\n\nТема: [Лодка](../gameplay/boat.md)\n"}, {"id": "questions-combat", "path": "questions/combat.md", "title": "Вопросы: бой", "section": "questions", "date": "2026-11-13", "md": "# Вопросы: бой\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q22\nДым скрывает лодки чужой стороны без тепловизора, а своих охотники видят сквозь дым, когда расходятся бортами и придерживают огонь ([Q139](#q139)). Должен ли дым слепить охотников и для своих лодок?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q29\nЭкипажи: охране постов выучку выбирают в редакторе карт (на Арене новички, бывалые и один ветеран), охотникам заданий она задана в их коде (до ветеранов на канонерке и броненосце); асов не ставит никто. Насколько силён должен быть ас и где какой экипаж уместен?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q38\nРой дыма гонит ялики с воздушным винтом, ракетами, тепловизором и дымогенератором, ставящие дым на рывке вперёд: верно, или он должен гнать катерки, как обычный рой?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q82\nПреследователь: носовые стойки стоят у форштевня на носовой и передних станциях и бьют вперёд со схождением в 40 м; таранщики заходят преследователю на траверз или раковину, где носовые стойки не достают. На Арене преследователь стоит на посту. Верно ли это и нужна ли ещё носовая торпедная труба?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q84\nДроны: морские дроны (70 м/с) быстрее любой лодки с верфи на обычном ходу, вблизи охраняют свой носитель, а посланные по цели ходят дугой по дальнюю от носителя сторону в пределах поводка в 60 м, стреляют бортом и возвращаются на борт. Охотники и батареи бьют ближайшего врага, часто дрона; дроны тонут вместе со своим носителем; у всех дронов игрока одна ливрея. Верно?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q85\n_Частично: цель турели решена 11-12 (захваченная), открыто поведение бегунов с турелью ([Журнал решений](../decisions.md))._ Турель: спаренная турель на вертлюге сама бьёт по ближайшему видимому врагу в радиусе 45 м, а не по захваченной цели. Бегуны с турелью стоят парой на посту Арены и ходят роем: бросаются на нитро и бьют, проходя по траверзу. Должна ли турель игрока бить по захваченной цели вместо ближайшей, и верно ли ведут себя бегуны с турелью?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q86\nЛюлька: два дрона, по одному на борт; клавиша борта запускает его дрон или зовёт домой, потерянный восстанавливается бесплатно через какое-то время. Ей нужно место для обоих, так что её несут только патрульный катер и канонерка. Верно? Должна ли люлька на один дрон позволить нести дронов и меньшим корпусам?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q88\nМинный жёлоб: жёлоб на каждой кормовой четверти сбрасывает мину за корму (Q — левый, E — правый, до шести мин на воде от установки); она взводится через 1,2 с и взрывается от чужого корпуса, снаряда или соседнего взрыва, не трогая свою сторону и союзников в кооперативе. Охотник-минёр стоит на посту Арены и ставит мины тоже. Верны ли устройство и числа (задержка, радиус, урон)?\n\nТема: [Бой](../gameplay/combat.md), [Сборки и стили игры](../gameplay/builds.md)\n\n### Q110\nЗнак охотника: за 0,35 с до залпа стойки охотника на этом борту светятся красным и щёлкают, и он стреляет, если выстрел всё ещё попал бы. Эти числа — заглушка. Верно ли, что хватает времени заметить знак с высоты боя и увернуться, а красный шар у стойки читается? Должны ли зелёные команды выдавать залп дольше асов? Знак дают только по лодке игроков, а в бою ИИ с ИИ стреляют сразу. Так ли?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q134\nВеера и захват цели: мышь не целится — захват сам берёт ближайшего видимого врага на любом расстоянии, а внутри веера шириной ±34° ракеты и торпеды берут упреждение по захваченной цели. Щелчок по воде стреляет теми установками, в чей веер попадает цель, а вне вееров — бортом со стороны цели; Q и E бьют левым и правым бортом. На геймпаде правый стик двигает прицел по воде для выбора цели и наводки внутри веера, а стреляют бамперы. Веера видны у любой лодки игрока, а управление огнём добавляет точные линии хода снарядов. Верно ли это, и не слишком ли широк или узок веер?\n\nТема: [Бой](../gameplay/combat.md), [Управление](../interface/controls.md)\n\n### Q136\nУдар носом в рывке нитро: лодка, бьющая носовой четвертью во время рывка нитро, получает половину урона от столкновения, а чужая — полтора. С носовым тараном её нос не страдает вовсе, как и без нитро. Верны ли числа, и должен ли таран добавлять ещё и к удару по чужой лодке?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q138\nПосланный дрон кружит по дальнюю от носителя сторону цели, качаясь по этой половине, так что носитель не стоит на линии его огня, и цель оказывается в клещах. Так ли, или дрону лучше кружить по всему кругу и просто ждать чистой линии?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q188\nЦель дальше досягаемости дрона (до 70 м от носителя): дрон выходит к краю своей досягаемости, идёт поперёк линии на цель и стреляет оттуда бортом, а со своего места стреляет, когда борт смотрит на цель. Раньше он бил только с прохода вплотную и такую цель то брал, то бросал. Дроны теперь попадают заметно чаще: пара топит патрульный катер секунд за восемь, если по ним не стреляют. Так, или дрон должен бить только с прохода вплотную?\n\nТема: [Сборки и стили игры](../gameplay/builds.md)\n\n### Q139\nВладелец решил, что дрон не стреляет через свой носитель. Так же держат огонь все капитаны ИИ: охотники и дроны не стреляют, пока лодка их стороны лежит на линии ближе добычи. Снаряды и так проходят сквозь свои лодки. Так ли, или стая должна стрелять сквозь своих?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q145\nРакеты двух сторон взрывают друг друга, сойдясь ближе 3 м. Снаряд турели считается наравне с ракетой, так что турель сама сбивает часть вражеских ракет, а вражеская турель — ракеты игрока. Оставить так, или парировать должны только ракеты? Достаточно ли 3 м, чтобы парировать получалось нарочно?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q148\nЗрение охотников: стража постов видит на 160 м (две дальности ракет), охрана конвоя на 200 м, груза на 140 м, броненосец на 220 м; суша и дым закрывают вид. Потеряв лодку из вида, охотник ищет её 8 с там, где видел в последний раз, затем забывает и возвращается к посту. Налёты заданий видят на любом расстоянии, их скрывают только суша и дым. Охотники в погоне жгут нитро, так что уйти можно только на быстрой лодке или своим рывком. Верны ли дальности и память, и нужно ли охотникам беречь нитро?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n\n### Q157\nРакета, долетевшая до предела досягаемости, гаснет маленькой безвредной вспышкой. Так, или она должна рваться с уроном, или дальность должна быть другой?\n\nТема: [Бой](../gameplay/combat.md)\n\n### Q186\nЗастрявший охотник: капитан, который просит ход и три секунды не сдвигается с места (упёрся в скалу, в берег или в чужой корпус), три секунды отходит задним ходом и заходит снова. Так, или он должен выбираться иначе, раньше или позже?\n\nТема: [Охотники и ИИ](../gameplay/hunters.md)\n"}, {"id": "questions-gaps", "path": "questions/gaps.md", "title": "Чего нам не хватает", "section": "questions", "date": "2026-11-13", "md": "# Чего нам не хватает\n\nЧего пока нет ни в решениях, ни в вики, хотя у выпущенных игр это обычно решено. Каждый пункт — вопрос владельцу; здесь ничего не решено. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n## Видение\n\n### Q92\nОпоры игры: какие три-четыре вещи делают эту игру ею, чтобы по ним судить каждую новую функцию? Сейчас записаны «веселье важнее реализма» и ощущение моторной лодки; «прыгание по волнам» вычеркнуто как опора.\n\nТема: [Об игре](../vision.md)\n\n### Q93\nДля кого игра: какой игрок, какие жанры он любит, сколько длится одна сессия и один заход на Арену?\n\nТема: [Об игре](../vision.md), [Арена](../gameplay/missions.md)\n\n### Q95\n_Частично: порядок этапов решён 11-13 ([Дорожная карта](../roadmap.md)); открыто, что внутри этапов, и их сроки._ Дорожная карта: верно ли то, что карта кладёт в каждый этап, и её грубые сроки? Какая версия станет 0.1 — срез? Сейчас версии 0.0.N выходят с постами.\n\nТема: [Дорожная карта](../roadmap.md), [Сборки и посты](../tools/release.md)\n\n### Q185\nИмя и кот: «Флоппа» — мем о настоящем каракале. Отчёт [Greenlight](../reports/2026-11-08-greenlight-review/index.html) нашёл, что его хозяева уже лицензируют его для игрушек, а портреты игры нарисованы по его фото ([Люди: флоппы](../art/people.md)); это быстрый поиск, а не проверка юриста. Просим у хозяев письменную лицензию или меняем имя и рисуем своих каракалов? Карта ставит ответ до страницы Steam (решение без владельца).\n\nТема: [Об игре](../vision.md), [Дорожная карта](../roadmap.md)\n\n### Q96\n_Частично: решено 11-13 — полный релиз в Steam, до него демо и ранний доступ ([Дорожная карта](../roadmap.md)); открыты цена и когда делать остальное в Steam._ Где выходит игра: Steam (страница, цена, ранний доступ) или ещё где-то? Решено только «PC» и лобби Steam или локальной сети; построены оба, Steam на тестовом App ID ([Q108](online.md#q108)). Когда делать остальное в Steam: облачные сохранения, достижения?\n\nТема: [Об игре](../vision.md), [Онлайн-кооп](../online.md)\n\n### Q97\nЖелезо: на каком самом слабом компьютере должна идти игра? Сборку для Windows ещё ни разу не запускали; кто проверит её на машине с Windows?\n\nТема: [Сборки и посты](../tools/release.md)\n\n## Игроку\n\n### Q100\nДоступность: нужен ли режим для дальтоников (свои и чужие ракеты различаются оранжевым и красным), крупный текст, подписи к звукам боя? Переназначение клавиш уже спрошено в [Q74](interface.md#q74).\n\nТема: [Экраны и меню](../interface/screens.md), [Бой](../gameplay/combat.md)\n\n### Q101\nЭкономика целиком: сколько заходов на Арену должна стоить деталь, на что ещё тратятся монеты, куда уходят лишние? Цены сейчас стартовые ([Q56](missions.md#q56)).\n\nТема: [Прогресс и сохранения](../gameplay/progression.md)\n\n## Облик и сюжет\n\n### Q102\nЛоготип, ключевой арт, титульный экран и обложка магазина: кто их сделает, раз картинки от ИИ запрещены? Сейчас у игры их нет.\n\nТема: [Арт-дирекшн](../art/README.md)\n\n### Q103\nПортреты к релизу: кто нарисует портреты говорящих и врагов — художник со стороны? До тех пор остаются нынешние заглушки, нарисованные моделью до запрета картинок от ИИ.\n\nТема: [Люди: флоппы](../art/people.md)\n\n### Q104\n_Частично: путь сюжета решён 11-12 (поручения флопп), открыто: кто капитан и зачем он в море ([Журнал решений](../decisions.md))._ Сюжет: есть ли у игры сквозная история, кто капитан игрока и зачем он выходит в море? Сейчас есть сеттинг, роли без имён и система сцен с одной сценой-заглушкой ([Q48](story.md#q48)).\n\nТема: [Сеттинг и лор](../story/setting.md), [Сцены сюжета](../story/scenes.md)\n\n## Работа\n\n### Q105\nИгроки со стороны: когда показывать игру людям кроме владельца, и как собирать их впечатления?\n\nТема: [Об игре](../vision.md)\n\n### Q106\nНазвание в коде: оставить Pirates в коде и репозитории или переименовать под Floppa Tropical Adventures?\n\nТема: [Код](../tools/code.md)\n"}, {"id": "questions-haul", "path": "questions/haul.md", "title": "Вопросы: добыча", "section": "questions", "date": "2026-11-13", "md": "# Вопросы: добыча\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q31\nМеста промысла: на Арене четыре косяка и четыре обломка закреплены на карте, у обломков свои ящики; на карте без закреплённых мест косяк и обломок раскидываются случайно на глубине от 4,5 до 12 м. Места подписаны на HUD; вид сбоку не открывается, пока охотник ближе 160 м; пойманное ложится в трюм и продаётся, как ящики. Верно?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q32\nРыбалка: четыре вида (скумбрия, луциан, барракуда, групер) на своих глубинах, по восемь на косяк; рыба борется рывками, и подматывание во время рывка напрягает леску, пока она не порвётся. Оставить и должны ли удилище или наживка быть деталью с верфи?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q33\nДобыча с обломков: четыре сброса захвата на обломки, шесть предметов на их дне, и предмет, схваченный не за середину захвата, может соскользнуть обратно. Оставить?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q34\nВид мест промысла в море: чайки, кружащие над бурлением, нарисованы крупнее настоящих, чтобы читались с высоты боя; сине-жёлтый буй обломков над корпусом, лежащим на дне. Оставить?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q43\nВес добычи замедляет только разгон: полный трюм не отнимает полного хода (решение без владельца; владелец решил, что вес не наказывает за полный трюм). Так, или вес должен отнимать и немного хода?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q51\nВид сбоку: как он стоит на приклеенной записке, леска, отсчитываемая по циферблату удилища, у каждой рыбы своя длина в диапазоне её вида, а у поднятых вещей свой вес. Верно, и должна ли более крупная добыча давать больше добычи?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q115\nВид сбоку не мешает бою: охотник, подошедший ближе 160 м, закрывает его с предупреждением «Охотники близко», а пойманное уже лежит в трюме. Оставить, или дать время поднять снасть?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q116\nРыба и вещи с обломков в трюме: у вида два размера (обычный и «большой»), потому что прогресс хранит предметы по названию, а настоящие длина и вес видны лишь на карточке. Оставить, или хранить настоящий размер каждого предмета?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q117\nОхотник, затонувший там, где дно в досягаемости захвата, становится обломком на месте со своими предметами; онлайн таких обломков нет, как и мест промысла. Оставить, и когда делать места промысла общими для всех игроков?\n\nТема: [Места промысла](../gameplay/sites.md)\n\n### Q151\nРасходников четыре: ремкомплект (металл + ткань), бронеплита (металл + металл), баллон нитро (топливо + механизмы) и заряд (взрывчатка + электрика), заряд рвётся на 10 м вокруг лодки. Первые три действуют как одноимённые припасы, заряд — как большая мина. Каждый оплачивают двумя ящиками своих ресурсов. Те ли это виды и рецепты, и нужны ли другие (дымовая шашка, канистра топлива, приманка)?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q162\nЯщики: восемь видов, по одному на ресурс — металл (25 кг, 5), механизмы (25 кг, 9), электрика (12 кг, 8), топливо (бочка, 40 кг, 5), взрывчатка (15 кг, 10), ткань (тюк, 8 кг, 3), ценности (сундук, 15 кг, 20), провизия (15 кг, 4); в скобках вес и добыча, монет втрое больше. Мест в трюме: катерок и гонщик 4, ялик 5, плоскодонка 6, патрульный катер 7, канонерка 8. Те ли это виды, цены и места, или видов должно быть меньше (провизия и ценности не идут ни в один рецепт)?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q163\nРасходник не хранится в трюме: клавиша 1–4 сразу тратит два ящика рецепта, самые дешёвые каждого ресурса, и делает дело. Так, или собирать расходник заранее в своё место трюма?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q164\nПолный трюм сам берёт ящик дороже самого дешёвого на борту, а дешёвый падает за корму; ящик не дороже остаётся на плаву. Выбросить ящик руками нельзя, поэтому лодки больше не передают друг другу добычу. Так, или нужна клавиша «выбросить самый дешёвый» и передача товарищу?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q176\nЭкран торговца: у причала его открывает плитка «Торговец», и с пустым трюмом тоже (корабел говорит, что на борту ничего нет), а «Готово» возвращает к ленте; у «Марии» он открывается по `Space`, и с пустым трюмом, когда есть что купить. Клавиши: `W` `A` `S` `D` — по карточкам, `Enter` — продать или купить, `Space` — «Продать всё», `Esc` — «Готово». Корабел говорит тепло и коротко, мытарь — сухо. Так?\n\nТема: [Добыча](../gameplay/haul.md)\n\n### Q177\n«Мария» платит за ящик 70 % цены гавани, целыми монетами, не меньше одной. Ремонт стоит 15 монет за удар, которого не хватает корпусу, топливо — 1 монету за литр, которого не хватает баку. Полный ремонт и полный бак ялика (4 удара, 30 л) стоят 90 монет — примерно столько «Мария» даёт за трюм ялика из пяти обычных ящиков. Те ли это числа?\n\nТема: [Станция](../world/outpost.md)\n"}, {"id": "questions-interface", "path": "questions/interface.md", "title": "Вопросы: интерфейс", "section": "questions", "date": "2026-11-13", "md": "# Вопросы: интерфейс\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q50\nСудовой журнал: открывается пунктами «Сохранить» и «Загрузить» в меню `Esc`; лента на каждой записи сохраняет или загружает её, а New game лежит лентой на последней странице. Игра сама сохраняется в текущую запись (новая игра — в первую пустую, а когда все пять записей заняты — только вручную). Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q52\nВерфь: вдоль низа идёт лента мест лодки (корпус, мотор, станции палубы, снаряжение, броня), над ней — ряд карточек деталей для выбранного места, у некупленной цена, установленная светится оранжевым, а справа на аква-экране показаны характеристики лодки и сравнение с деталью под курсором. По самой лодке места больше не кликаются. Верно?\n\nТема: [Верфь](../base/boatyard.md)\n\n### Q55\nОтделка интерфейса: меню озаглавлены шрифтом EB Garamond, на верфи заголовок наклеен лентой вверху слева, пилюли и плитки отзываются при наведении и нажатии, цвета мест на верфи отделены от враждебного красного и оранжевого игрока (мотор бирюзовый, оружие розовое), а лента базы, верфь и меню управляются стрелками и Enter так же, как мышью. Верно?\n\nТема: [Стиль интерфейса](../art/interface.md)\n\n### Q58\nОкна инструментов (2026-11-13): то же матовое стекло, что у выносок, без глянцевой строки заголовка: заголовок — тёмные слова на стекле, закрыть — стеклянная бусина; кнопки — прозрачные стеклянные пилюли, под указателем наливаются светом лагуны, «Играть» оранжевая; поля, выборы и числа — вдавленное стекло; ползунок — стеклянная ручка; метки и таблички редактора карт — стекло HUD; команды редактора в окне вверху, его клавиши на колпачках в строке состояния; шторка — такое же окно на глубоком море. Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q62\nУход и возвращение домой: Esc закрывает открытый экран по шагам (в море — карту, затем открывает паузу); выбор, который теряет добычу в трюме или несохранённый прогресс (выход, загрузка, инструменты, уход в море хоста), сперва предупреждает. Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q63\nПодсказки HUD в море: когда в баке остаётся меньше пятой части топлива, лампа топлива мигает и приходит уведомление «Мало топлива» с «Идите в гавань»; кольцо вокруг лодки поделено на дуги по числу попаданий (до восьми), дальше одна пустеющая дуга с отметкой через каждые пять. Верно?\n\nТема: [HUD](../interface/hud.md)\n\n### Q64\nУ причала вверху справа висит кошелёк с монетами; судовой журнал выделяет активную запись и предупреждает при старте новой игры, если все записи заняты. Верно?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q65\nПочинка HUD: метки охотника тают в дыму; потопленный охотник объявляется на оранжевом значке, красный оставлен для предупреждений; условия записки (держать на плаву) без рамки; записка рыбалки говорит, бежит ли рыба или отдыхает, циферблат лески мигает лампой на протяжении рывка; захват, закрывшийся на пустоте, сообщает Nothing caught. Верно?\n\nТема: [HUD](../interface/hud.md)\n\n### Q66\nКамера и примерка на верфи: при входе в верфь камера переходит от вида боя к низкому обзору в три четверти, сдвигая линзу так, чтобы лодка стояла в просвете над карточками деталей и левее экрана характеристик; перетаскивание мышью, правый стик и Q / E вращают камеру вокруг лодки, а колесо мыши и R / F приближают и отдаляют её (выбор места камеру не дёргает); если примерить другой корпус и вернуть прежний за тот же визит, детали его станций возвращаются на место; полоса нагрузки показывает четыре деления сверх водоизмещения корпуса; окно характеристик помечено бортовым номером корпуса. Верно?\n\nТема: [Верфь](../base/boatyard.md)\n\n### Q67\nКнопки геймпада: в море левый стик рулит, триггеры дают передний и задний ход, нажатие A делает рывок нитро, бамперы стреляют левым и правым бортом, B пускает дым, правый стик водит прицел по воде для выбора цели и наводки в веере, D-pad вверх переключает оружие, а вниз открывает промысел, Start ставит на паузу, Back открывает карту; в меню и на верфи D-pad и левый стик переводят выбор, A подтверждает, B или Start возвращает назад, Back работает как Tab, а правый стик вращает камеру вокруг лодки на верфи. Верно?\n\nТема: [Управление](../interface/controls.md)\n\n### Q74\nНастройки: громкость музыки и эффектов, полный экран, VSync, масштаб разрешения, масштабирование (MetalFX Temporal / Spatial на Mac, FSR 2 / FSR 1), тряска камеры и язык. Верно? Нужны ли ещё переназначение клавиш и геймпада, предел частоты кадров, масштаб HUD?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q75\nЯзыки: английский и русский, старт на языке системы, выбор на странице Settings. Верно? Какие ещё? Русский мой: верны ли его термины (детали лодки, охотники, добыча)?\n\nТема: [Язык](../interface/language.md)\n\n### Q118\nВставка запускается ареной: первый вход лодки игрока в круг, названный в `Arena.Scene`, играет её один раз за миссию. Кнопки, миссионный триггер (цель выполнена, волна пришла) и повтор не сделаны. Верно? Что ещё должно запускать вставку?\n\nТема: [Камера и картинка](../gameplay/camera.md)\n\n### Q119\nПока играет вставка, руль держит последнюю команду игрока (ход, поворот, нитро), огонь и расходники сброшены, а бой, охотники и сеть идут как шли: лодку могут топить. Верно? Нужны ли остановка боя в одиночной игре, защита лодки на время вставки или своя вставка у каждого игрока в сети?\n\nТема: [Камера и картинка](../gameplay/camera.md)\n\n### Q147\nВладелец решил, что у врагов случайные лица. Лицо показано только у захваченной цели, слева от её таблички, 40 пикселей; оно одно из восьми и держится за лодкой весь бой; после попадания оно сердится, на последнем ударе удивлено. Там ли ему место, и нужно ли лицо каждому врагу на экране или на рации?\n\nТема: [HUD](../interface/hud.md)\n\n### Q153\nПанель быстрого доступа — четыре постоянные ячейки внизу, по виду расходника на клавишу, с ящиками его рецепта и тем, сколько раз трюм может за него заплатить. На геймпаде это D-pad влево и вправо, X и Y. Так ли, или ячейки назначает сам игрок?\n\nТема: [HUD](../interface/hud.md)\n\n### Q159\nОфициальная палитра (`game/ui/Hue.cs`): смыслы (оранжевый игрока, красный охотников, золото цели, янтарь предупреждения и монет, синий брони, аква приборов в трёх тонах, зелёный «лучше», серый «выключено»), материалы (прозрачное, аква, оранжевое, матовое стекло, стекло выноски, оттенок лагуны, пластик, хром, экран, тёмная табличка, белый, чернила, бумага, скотч, карандаш, штамп) и ноты мира (небо, бирюза, глубина, песок, листва). Так ли названы и подобраны цвета? Что убрать или добавить?\n\nТема: [Палитра](../art/palette.md)\n\n### Q160\nКнопки причала и места верфи — прозрачные стеклянные плитки: лагуна видна сквозь них ясно, толстая кромка её преломляет, серп света под верхней кромкой, у слов мягкий ореол их формы; в выбранной пойман свет лагуны и она светится вокруг; «На арену» прозрачная сверху с оранжевым светом снизу на треть, выбранная — насыщенно-оранжевая с водой сверху. Движение: плитки приходят по очереди с одним отскоком; выбранная наливается светом, а линза света проезжает к ней по ряду; нажатие сжимает к низу, по контуру бежит рябь, всплывают пузырьки; в покое лёгкое покачивание и полоса света вдоль ряда; на уходе ряд замирает и опускается по очереди. Выноска у плиток стала подписью «// что делает» с точками. Так ли? Достаточно ли прозрачно стекло, не много ли движения?\n\nТема: [Компоненты](../art/components.md)\n\n### Q161\nБазовые компоненты интерфейса: стеклянная плитка, пилюля и строка меню, переключатель и шкала, колпачок клавиши и подсказки, выноска, карточка (детали верфи, ящики и товары торговца), кошелёк, подпись, пиктограммы, линза прибора, ромб рулетки, плитка расходника и слот трюма, уведомление и табличка, список, диалог и радио, панель показателей верфи, циферблат рыбалки, карточка улова, карта, судовой журнал, экран торговца, окно инструмента. Всё в стекле; бумаги нет. Тот ли это набор?\n\nТема: [Компоненты](../art/components.md)\n\n### Q165\nС HUD убраны стрелки вокруг лодки; чтобы задание можно было найти, его место отмечено на карте (M). Так, или нужен другой указатель?\n\nТема: [Арена](../gameplay/missions.md)\n\n### Q166\nМеню, колпачки, выноски и карточки верфи в стекле (2026-11-12). Меню: невыбранные пункты — только белые слова, стекло лишь на выбранном, свет лагуны пятном вокруг слов; затемнение сцены лёгкое и только слева; пилюли меньше прежних. Слова на любом стекле, плитки базы тоже, белые с тёмным ореолом своей формы, а не тёмные на прозрачном. Колпачки клавиш — дымчатое стекло с белыми буквами, а не прозрачное. Выноска прозрачна у кромки и матова глубже. У некупленной детали цена на белом стеклянном ярлычке; установленная светится оранжевым снизу. Так?\n\nТема: [Компоненты](../art/components.md), [Экраны и меню](../interface/screens.md), [Верфь](../base/boatyard.md)\n\n### Q171\nДиалог и радио в стекле (2026-11-13). Реплика — матовое стекло подсказок с тёмными буквами и хвостом к говорящему; имя — мелкая подпись без таблички; ответы — список, как меню, стекло только под выбранным; молчащий портрет сереет, а не синеет; мир за диалогом притемнён и чуть смягчён. Радио в бою — дымчатая панель HUD с белыми буквами, без хвоста, портрет в стеклянной рамке. Так?\n\nТема: [Диалог](../story/dialogue.md), [Компоненты](../art/components.md)\n\n### Q172\nПанель показателей верфи — одно дымчатое стекло с белыми словами: показатели сплошными стеклянными полосками (было 14 сегментов), нагрузка бусинами, лампа — бусина; имя на скотче, номер на наклейке, вторая наклейка с видом корпуса убрана. Заголовок верфи печатный, как у базы (был на скотче); поля экрана 32 (были 28). Так?\n\nТема: [Верфь](../base/boatyard.md)\n\n### Q173\nЧто держит тема (`game/ui/look.tres`): цвета, шрифты, кегли, размер, углы, поля и зазоры каждой детали, насколько она дымчата или притемнена, общие длительности движения и место света. Пропорции внутри рисунка и собственная хореография детали остаются в коде. Так?\n\nТема: [Компоненты](../art/components.md)\n\n### Q174\nЦвета-сигналы мира: у каждого смысла одно значение в палитре. Ракеты охотников и кольцо падающего снаряда — красный интерфейса, ракеты игроков — оранжевый игрока, лампа маяка задания — золото цели; лампы мин, бонов и прожектора — свои, более густые роли; огонь остаётся цветом огня. Импульсная башня светится почти аквой союзников: оставить, или у опасности должен быть другой цвет?\n\nТема: [Палитра](../art/palette.md)\n\n### Q175\nПоследние глянцевые детали HUD стали стеклом: лампа топлива и лампы гнёзд дронов — маленькие линзы, значок уведомления — круглая линза (бледнее прежнего шарика), плитка расходника ловит свет сама, таблички ловят цвет ярче; все слова на стекле — с одним ореолом. Так?\n\nТема: [HUD](../interface/hud.md)\n\n### Q178\nБывшие бумажные вещи в стекле (2026-11-13), как именно. Журнал: «Сохранить сюда» и «Загрузить» стоят рядом с выбранной строкой и едут за ней, «Новая игра» внизу; щелчок по строке жмёт выбранную рядом пилюлю; запись в игре помечена оранжевыми словами; звуки журнала пока бумажные. Карта: стекло HUD без преломления; гавань — оранжевое кольцо игрока; карта проявляется и растёт, а не выезжает; отметки на воде и уведомления под ней гаснут; глубины — сегодняшние. Список целей больше не качается, выполненная строка тускнеет; подписи приборов — голые капители без плашки; карточка улова — ровное дымчатое стекло; у счёта целей регистр как в коде («HULL 100%»). Так?\n\nТема: [Экраны и меню](../interface/screens.md), [Добыча](../gameplay/haul.md), [HUD](../interface/hud.md), [Места промысла](../gameplay/sites.md)\n\n### Q179\nШвартовка в гавани без экрана базы (ваше решение 2026-11-13); остальное я решил сам. По `Space` лодка сама доходит до ближайшего свободного места у причала и стоит носом к морю, целая и с полным баком. Бой при этом не останавливается; если охотники подходят на дистанцию боя, лодка сама отчаливает с предупреждением. `Space` ещё раз — «Отчалить». Первой выбрана «Торговец», если в трюме есть ящики, иначе «Отчалить». При входе на верфь лодка больше не приходит с моря, а переходит на первое место от того, где стояла. Сцена сюжета `briefing` теперь звучит, когда лодка отчаливает. Так? Должен ли мир ждать, пока лодка у причала?\n\nТема: [Гавань](../base/pier.md)\n\n### Q180\nМеню теперь одно, по `Esc`, в море и у причала: «Продолжить», «Сохранить», «Загрузить», «Кооператив», «Настройки», «Инструменты», «Выход». Демо и оба редактора лежат на странице «Инструменты». Пункта «На базу» нет: заход кончается гибелью или загрузкой сохранения. Так? Нужно ли прятать «Инструменты» от игрока ближе к релизу?\n\nТема: [Экраны и меню](../interface/screens.md)\n\n### Q187\nНа верфи пирс, вставший между видом и лодкой, растворяется дизерингом вокруг неё, как земля в виде боя: ближний настил больше не закрывает низ корпуса, от него остаётся лёгкая вуаль. Так, или лодке на верфи нужно своё открытое место у пирса, где её ничто не закрывает?\n\nТема: [Верфь](../base/boatyard.md)\n"}, {"id": "questions-missions", "path": "questions/missions.md", "title": "Вопросы: миссии", "section": "questions", "date": "2026-11-12", "md": "# Вопросы: миссии\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q1\n_Частично: сюжет и цель решены 11-12, открыты сами поручения и боссы ([Журнал решений](../decisions.md))._ Задания и боссы Арены: сейчас в бесконечном заходе по счётчику предлагаются четыре вида заданий (конвой, курьер, маяки, груз), а на десятой минуте в бухте появляется броненосец ([Q129](#q129), [Q131](#q131)). Какими должны быть настоящие задания и боссы вместо заглушек? Насколько далеко должен заходить стартовый ялик с турелью, и должен ли заход давать что-то сверх монет и трофеев — например, звание или лучшее время?\n\nТема: [Арена](../gameplay/missions.md)\n\n### Q17\nСоставы охотников: сейчас на Арене стоят посты охраны у проливов, рифов и бухты, и охотники выходят только оттуда. Какие виды охотников должны стоять вместе на постах?\n\nТема: [Арена](../gameplay/missions.md)\n\n### Q56\nЦены деталей: детали только покупаются (решение владельца), и все лежат в продаже на верфи со старта; цены стоят по три монеты за прежний порог очков добычи (см. [Q128](#q128)). Сколько должна стоить каждая деталь?\n\nТема: [Прогресс и сохранения](../gameplay/progression.md)\n\n### Q72\nЗоны и опасности: размечаются кругами или коридорами в редакторе карт; охотники огибают минные поля, бочки, горящую нефть, боны и опоры моста, но не заградительный огонь и не круги импульсных башен, которые бьют любую сторону; гость в кооперативе видит зоны хоста; береговая батарея обведена на HUD как враг, а горящая нефть подрывает бочки. На Арене стоят течения и водоворот, минное поле, бочки, горящая нефть, боны, заградительный огонь и береговые батареи, а ещё посты охотников, тайники, точки снабжения, круг стоянки броненосца и станция (башни и прожекторы с Арены убраны, см. [Q143](world.md#q143)). Верно ли это и какие зоны должны стоять на Арене?\n\nТема: [Зоны и опасности](../world/areas.md)\n\n### Q76\nПолигон: шесть мишеней-макетов, четыре пришвартованы бортом к старту и две кружат по кольцам, каждая поднимается на своём посту через шесть секунд после погружения; потопленная лодка игрока, и гостя тоже, сразу поднимается на старте; выходов нет, «На базу» возвращает на верфь, а выход на полигон кончает заход на Арене. Верно? Должен ли он засекать круги или считать попадания?\n\nТема: [Полигон](../base/testing-ground.md)\n\n### Q81\nСвоя карта в редакторе с режимом «банда» без охотников: банда из нуля лодок никогда не считается побеждённой (решение без владельца), а точек выхода больше нет, поэтому такой заход кончается только потоплением или выходом в редактор. Должна ли у такой карты быть своя цель (дойти до метки, продержаться время) или редактор не должен позволять пустую банду?\n\nТема: [Арена](../gameplay/missions.md)\n\n### Q128\nДобыча идёт по три монеты за очко (`Progress.Rate`): бесконечный заход приносит больше добычи, чем короткая миссия, а монеты по-прежнему только покупают детали. Верна ли ставка и не слишком ли быстро хватает на верфь?\n\nТема: [Арена](../gameplay/missions.md)\n\n### Q129\nЗадания приходят по счётчику: первое через 90 секунд, дальше раз в 100 с, по одному виду разом, не ближе 250 м к игроку, награда с задания: конвой 30, курьер 40, маяки 50 очков на игрока плюс припасы. Верны ли такт и награды, и должно ли задание, не взятое долго, уходить само?\n\nТема: [Арена](../gameplay/missions.md)\n\n### Q131\nБроненосец выходит на десятой минуте и стоит в бухте, пока его не потопят; потопленный, он даёт ремонт и броню и больше не приходит. Должен ли он приходить снова (раз в какое-то время, после потопления) или уходить, если его не тронули?\n\nТема: [Арена](../gameplay/missions.md)\n\n"}, {"id": "questions-online", "path": "questions/online.md", "title": "Вопросы: онлайн", "section": "questions", "date": "2026-11-13", "md": "# Вопросы: онлайн\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q108\nКооп через Steam: хост выбирает, открыть игру друзьям в Steam или своей сети, а гость — где её искать (по две кнопки), — или открывать и искать сразу и там и там? Лобби видно только друзьям: нужен ли публичный список игр? Пока игра в Steam — тестовый Spacewar (480), и приглашения и «Присоединиться» из списка друзей Steam не работают: они ждут страницы игры в Steamworks и своего App ID. Когда её заводить?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q124\nСколько длится окно, пока затонувшую лодку игрока может поднять товарищ? Пока взято 60 секунд с момента, когда лодка пошла ко дну (`Revive.Window`), дольше, чем лодка тонет (9 секунд). Окно общее для всех лодок, а его остаток виден только в подписи у кольца. Лучше короче, или считать его от чего-то другого, например от миссии?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q125\nКак товарищу держаться у обломков, чтобы поднять лодку? Пока он должен быть в море, ближе 25 м к обломкам и идти медленнее 4 м/с, 5 секунд (`Revive`); кольцо заполняется золотом, а если он отошёл, заполненное тает с той же скоростью. Подойдёт любой товарищ с целой лодкой, даже с пустым баком. Поднятая лодка целая, на месте, с пустым трюмом (добыча при затоплении высыпалась) и с тем топливом, что было. Так ли, или поднятая должна платить (часть корпуса, монеты), а товарищем считаться только тот, у кого есть топливо?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q133\nХост сообщает гостям цели захода и метки заданий раз в секунду, а объявления сразу, как прозвучали. Достаточно ли такта для меток, и не нужно ли гостю видеть задания, которые взял товарищ, отдельно от общих?\n\nТема: [Онлайн-кооп](../online.md)\n\n### Q140\nЛодка товарища у причала — его лодка в мире; после верфи она меняется, когда он из неё выходит, а не по каждой детали. Имена игроков стояли только над лодками на экране базы, а экрана базы больше нет (2026-11-13), так что имён над лодками товарищей сейчас нет нигде. Нужны ли имена над лодками товарищей в море и у причала, своё имя игрока в настройках и обновление по детали?\n\nТема: [Гавань](../base/pier.md)\n\n### Q181\nКооператив начинается из меню `Esc` прямо в море (экрана базы нет, ваше решение 2026-11-13); остальное я решил сам. Хост открывает своё море посреди захода. Гость, присоединяясь, оставляет своё море и добычу в трюме (меню предупреждает), а уйдя или оставшись без хоста, возвращается в своё море с последнего сохранения. Места промысла и обломки, которые были у хоста до того, как он открыл игру, гости не видят. Так?\n\nТема: [Онлайн-кооп](../online.md)\n"}, {"id": "questions-story", "path": "questions/story.md", "title": "Вопросы: сюжет", "section": "questions", "date": "2026-11-12", "md": "# Вопросы: сюжет\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q5\nПодробности сеттинга: его люди, названия мест и что осталось от старого мира? Прежние предложения лежат в [lore-proposals.html](../story/lore-proposals.html).\n\nТема: [Сеттинг и лор](../story/setting.md)\n\n### Q48\nС кем говорит игрок и о чём? Портреты говорящих сделаны для капитана, корабела и мытаря (плюс восемь случайных портретов врагов в бою, см. [Q147](interface.md#q147)): верно? В игре сейчас звучит одна сцена — приветствие корабела на верфи, с репликами-заглушками. Мытарь говорил по радио у точек выхода с пошлиной; его сцены ушли вместе с точками, остались портреты. Нужен ли мытарь, и где ему говорить?\n\nТема: [Сцены сюжета](../story/scenes.md)\n\n### Q69\nПоводы сюжета и редактор: радио говорит, когда начинается заход, при первом потопленном охотнике и при последнем попадании по лодке; за игрока говорит капитан; гость онлайн не получает брифинга (заход выбирает хозяин игры), но слышит радио и разбор; редактор сохраняет собственные сцены игры, так что только из проекта. Повода «подход к флоппе» из решения пока нет. Верно? Какие ещё моменты и флоппы должны рассказывать сцены?\n\nТема: [Сцены сюжета](../story/scenes.md)\n"}, {"id": "questions-tools", "path": "questions/tools.md", "title": "Вопросы: инструменты", "section": "questions", "date": "2026-11-12", "md": "# Вопросы: инструменты\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q35\nРедактор карт: чего не хватает или что мешает? Сейчас в самом редакторе руками ставятся рельеф, зоны и опасности (с постами охраны и видами их охотников), арены, станция, старт, охотники, маяки, места промысла и кадры вставок, а события Арены (пути конвоя, курьера, маяков, груза, броненосца) заданы только в JSON карты. Должен ли редактор позволять расставлять и события?\n\nТема: [Редактор карт](../tools/map-editor.md)\n\n### Q68\nИнструменты после QA (см. [демо](../tools/demos.md)): селектор принимает Esc перед кейсом и имеет «Назад» в списке, который сворачивается; кликнутая строка держит клавиши для W S и Enter. В редакторе «Выбрано» и «Задания» делят боковую сторону две части к трём, каждое окно сворачивается, меню и «Открыть» стоят над ним, «Открыть» переименовывает и убирает в корзину карты игрока, «Играть» возвращается в редактор на несохраняемом прогрессе, «Сохранить как свою» пишет поверх своей копии после первого раза; числа словами и единицами (16:30, узлы, метры, градусы; планктон, танин и ил для воды); охотники пронумерованы, закреплены переключателем, оранжевый оставлен для «Играть»; шторка говорит, что поднимает («Поднимаем Coral cay»). Верно?\n\nТема: [Демо](../tools/demos.md), [Редактор карт](../tools/map-editor.md)\n"}, {"id": "questions-world", "path": "questions/world.md", "title": "Вопросы: мир и облик", "section": "questions", "date": "2026-11-13", "md": "# Вопросы: мир и облик\n\nВопросы к владельцу. Когда владелец отвечает, решение пишется на странице темы, а вопрос удаляется.\n\n### Q6\nПогода: дождь, грозы с громом и туманные полосы, скрывающие лодки, были построены как физические модели и сняты, потому что вышли не такими, как задумано: какой должна быть погода, если вообще нужна?\n\nТема: [Арт-дирекшн](../art/README.md)\n\n### Q7\nВыражения портретов: у каждого говорящего (капитан, корабел, мытарь) сейчас четыре выражения — ровный взгляд, довольный, удивлённый и сердитый, а у восьми портретов врагов три (ровный, удивлённый и сердитый). Какие ещё нужны?\n\nТема: [Люди: флоппы](../art/people.md)\n\n### Q11\nКакой настоящей лодкой должен быть каждый корпус? Сейчас: катерок — малый открытый катер, ялик — панга, плоскодонка — джонбот аэролодки, гонщик — офшорный катер, патрульный катер — патрульный катер, канонерка — вооружённый буксир.\n\nТема: [Лодка](../gameplay/boat.md)\n\n### Q14\nЛивреи и наряды: цвета и номер каждого корпуса и какой корпус несёт тент, арку, пульт или рубку. Верно?\n\nТема: [Облик лодок](../art/boats.md)\n\n### Q61\nМангры (палитра рельефа Delta): кайма куполообразных крон в несколько метров шириной на ходульных корнях над мелководьем, в своём тёмно-зелёном цвете, и лодки проходят под внешним краем крон. Верно?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q77\nТон картинки: яркая мягкая картинка прохода по картинам (экспозиция поднята, контраст AgX смягчён) сделала море серым, так что оно возвращено к тому, что было до прохода. Верно или картинка должна быть ярче как-то иначе?\n\nТема: [Свет и время суток](../art/light.md)\n\n### Q78\nГоры: конус, вытянутый вдоль гребня, седловины между плечами, расходящиеся от вершины отроги, отвесный обрыв у воды и кратер у вулкана; на Арене и в редакторе карт есть формы Peak, Ridge и Volcano. Земля, заслоняющая лодку от камеры, просвечивает кругом вокруг лодки, как в изометрических играх. Верно? Суша сейчас закрывает лодку от охотника, как дым ([Q148](combat.md#q148)), так что сквозь остров он не стреляет, а ракеты рвутся о землю. Это спорит с прежним решением «охотники стреляют независимо от острова» ([Бой](../gameplay/combat.md)): оставить так или вернуть стрельбу сквозь сушу?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q79\nБарьерный риф и кекуры: барьерный риф (Barrier reef) изгибается дугой с полосой лагуны за ним и лежит у края банки на острове базы и на Арене; морские столбы стоят на мелкой полке группой (Sea stacks) или поодиночке (Lone stack), без подмыва у воды, так как карта высот не даёт нависаний. Верно?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q80\nКосы и отмели: в редакторе и на картах есть Sandbar (белый песок чуть выше воды), Hooked spit (загнутая коса с травой на дюнах и пальмами на оконечности, отходящая от острова базы и на Арене) и Sand bars (три подводные отмели подряд, где средняя держит патрульный катер, но пропускает ялик, а внешняя на метр глубже). Прибой пенится над первой к зыби и средней отмелью, но не над дальней, потому что волна уже погашена мелководьем. Верно ли это, или прибой должен бить над каждой грядой?\n\nТема: [Рельеф](../world/ground.md)\n\n### Q89\nОблик всей игры со стенда `Art` (Esc → Демо → Art): Ink, Lagoon, Poster, Logbook, Deep, Tin, куски нескольких (например, карточки потопления от Ink на воде Lagoon) или ни один? Наш выбор — Ink.\n\nТема: [Кандидаты на облик](../art/candidates.md)\n\n### Q90\nОблик меню со стенда `Menus`: Quiet, Glass, Notebook, Atlas, Device, Dashboard или ни один? Наш выбор — Quiet; Glass, если нужен материал; Notebook, если нужна вещь мира.\n\nТема: [Кандидаты на облик](../art/candidates.md)\n\n### Q143\nИмпульсные башни и прожекторы владельцу показались странными, и на Арене вместо них стоят батареи. Убрать ли башни и прожекторы из игры совсем, или переделать их вид и оставить для своих карт?\n\nТема: [Зоны и опасности](../world/areas.md)\n\n### Q149\nПосты охраны: пост выводит охотников заново через «Вернуться через» секунд после гибели последнего, но только когда ни одна лодка игрока не ближе 160 м к его зоне. Пока лодка игрока в зоне поста или когда бьют его охотника, весь пост берёт ближайшую лодку на любом расстоянии. Составы шести постов Арены и время их возврата (75–180 с) поставлены без владельца. Верно ли это и где на Арене стоять каким постам?\n\nТема: [Зоны и опасности](../world/areas.md)\n\n### Q155\nГде стоит станция и сколько их? На Арене она одна, в открытой воде к западу от `Home cay`, носом влево-вверх на экране, плотом к виду; место и курс выбраны без владельца. Радиус, в котором идёт торговля, 70 м от середины корпуса: подойти можно с любого борта, хотя плот стоит по левому.\n\nТема: [Станция](../world/outpost.md)\n\n### Q156\nПрозрачное стекло есть только у станции. Ветровые стёкла и рубки лодок и фонари пирса по-прежнему рисуются непрозрачным глянцем. Перевести ли их на то же прозрачное стекло (`Surfaces.Glass`), чтобы стекло в игре было одно?\n\nТема: [Станция](../world/outpost.md)\n\n### Q158\nКольцо поплавков у пирса и у станции. Владелец выбрал: стеклянные поплавки с тёплыми огоньками, аква и тёплый свет, без столба и без лампы, спокойно издалека и оживает рядом. Остальное я решил сам, по оценкам агента-рецензента на кадрах игры: двенадцать поплавков радиусом около полуметра, пяти размеров и трёх оттенков; сплошное дутое стекло, сквозь которое проходит солнце, с одним бликом; ромбическая сетка, латунное кольцо, маленький янтарный фонарь-банка в макушке шара под крышкой с солнечной батареей, росток на каждом четвёртом; полоса и свет в воде под кольцом, тёплые пятна под горящими фонарями; поплавки расступаются перед лодкой; у причала кольцо неполное, только на открытой воде; у станции оно такое же. Так ли?\n\nТема: [Гавань](../base/pier.md)\n\n### Q182\nМастерская корабела (ваше решение 2026-11-13) стоит на сваях в лагуне, в 34–48 м от пляжа, а не на песке: пляж пологий, и ближе лодкам мелко. С пляжем её связывают длинные узкие мостки, так что «короткий причал» — это палец от помоста, а не путь от берега. Состав я выбрал сам. Так? Или углубить дно у берега и поставить мастерскую на песок?\n\nТема: [Гавань](../base/pier.md)\n"}, {"id": "reports-2026-10-13-map-approaches", "path": "reports/2026-10-13-map-approaches.md", "title": "Map approaches for a naval sandbox", "section": "reports", "date": "2026-11-09", "md": "# Map approaches for a naval sandbox\n\nOct 13, 2026 · @Denis\n\n## Summary\n\nNaval games handle the sea in three ways: sail the real world at full scale, move an icon across a strategic overworld while in-game days pass, or sail directly on a compressed top-down map. For an archipelago sandbox with a faction war and a threat meter, the overworld or the compressed hybrid fits best. The world simulation needs in-game time to move fast, and crossing the map should cost minutes, not half an hour.\n\n## How each approach plays out\n\n&#91;embedded content: how a voyage plays out · 3 approaches, 4 steps each\\]\n\nA and C keep sailing and fighting in one view on a real-time clock. B splits travel and battle into two modes, so the world can move in days while you cross the map.\n\n## Approach A: direct sailing at full scale\n\nYou steer the ship through one continuous world, so map size is felt directly as travel time, and battles happen in the same space you sail through.\n\n- **Assassin's Creed IV: Black Flag.** The game director put a full crossing at about half an hour, and players can warp to any sync point they have already found ([Cinemablend](https://www.cinemablend.com/games/Assassin-Creed-4-15-20-Hours-Long-58111.html)).\n- **Sea of Thieves.** Rare tuned the map by how often crews meet, not by its size, aiming for a ship encounter every 15 to 30 minutes on average ([TweakTown](https://www.tweaktown.com/news/60911/sea-thieves-map-15-30-minute-ship-encounters/index.html)). Its shortcut is diving the ship to the next voyage, which leaves loot behind and can't target an exact spot ([Gfinity](https://www.gfinityesports.com/article/sea-of-thieves-fast-travel)).\n\n**Strengths:** strong immersion, seamanship matters every minute, and crew roles on deck suit co-op.\n\n**Costs:** long trips that need fast travel and dense content, and a world simulation that moves slowly because real minutes are the only clock.\n\n## Approach B: strategic overworld with compressed time\n\nThe ship is an icon on a strategic map, in-game days pass quickly while you travel, and a battle opens a separate tactical scene. Distance is measured in days, so the world can change a lot while you sail.\n\n- **Sid Meier's Pirates! (2004).** You cross a Caribbean sailing map between colonies, missions and pirate havens. Winds mostly blow west, storms move across the map, other ships are visible with their destination and nationality, and battles open as their own scene ([Wikipedia](<https://en.wikipedia.org/wiki/Sid_Meier%27s_Pirates!_(2004_video_game)>)). Capturing a city can switch it to another nation, so the map itself changes hands.\n- **Mount & Blade II: Bannerlord.** The developers describe the overworld as where much of the gameplay lies. Villages, peasants and caravans are simulated parties, mountain chokepoints concentrate fights over trade routes, and the year was shortened to twelve weeks ([TaleWorlds blog](https://www.taleworlds.com/en/Games/Bannerlord/Blog/14)).\n- **Space Rangers 2.** Space travel is turn-based and switches to real time for planetary battles. A reviewer notes the game pauses at each decision and fast-forwards over long trips, while the Dominators' attacks shift across the map ([MobyGames](https://www.mobygames.com/game/19891)).\n\n**Warning about shrinking too far:** in one forum test, the same Pirates! crossing took 29 in-game days on PC and 14 on the Xbox port. The tester found the compressed map cramped, with less ship traffic, less distinct islands and a navigation skill that no longer mattered ([Quarter To Three forum](https://forum.quartertothree.com/t/pirates-xbox/19918)).\n\n**Strengths:** fast trips, a world simulation that visibly moves, and natural room for factions, trade and a threat meter.\n\n**Costs:** sailing on the map is less physical, and two modes (map and battle) mean two sets of systems to build.\n\n## Approach C: direct sailing on a compressed top-down map\n\nYou steer the ship yourself in real time, but from a high camera over a smaller world, and combat happens in the same view without a mode switch.\n\n- **Windward (Tasharen Entertainment, 2015).** A top-down sailing sandbox with online co-op for up to 4 players ([co-op.gg](https://www.co-op.gg/game/windward)). Each campaign generates a new world, danger and rewards grow with distance from the start, and AI captains have to explore the map just like players ([Fandom launch article](https://www.fandom.com/articles/733-windward-sailing-sandbox-adventure-game-launches)). One review praised it as a relaxing co-op game but found movement slow and combat mostly circling, and wished for a lower camera ([LinuxGameCast](https://linuxgamecast.com/2017/05/linuxgamecast-reviews-windward/)).\n\n**Strengths:** one mode to build, steering skill matters both when sailing and in combat, and a high camera shows threats and islands early.\n\n**Costs:** in-game time still runs at real speed, so faction wars move slowly unless the clock is sped up separately. Close combat can feel shallow from far above.\n\n## Comparison\n\nThe overworld is the only approach where in-game time runs faster than real time by design, which is what a faction war and threat meter need.\n\n| Approach | Examples | Crossing the map | Where combat happens | World clock | Fit for faction war and threat meter |\n| --- | --- | --- | --- | --- | --- |\n| A. Full-scale direct sailing | Black Flag, Sea of Thieves | About 30 real minutes in Black Flag, with fast travel | Same world, same view | Real time | Weak: fronts move slowly |\n| B. Strategic overworld | Pirates!, Bannerlord, Space Rangers 2 | Measured in in-game days (29 days in one Pirates! PC test) | Separate tactical scene | Compressed days | Strong: built for it |\n| C. Compressed top-down sailing | Windward | Real time; no published figure found | Same view | Real time | Medium: needs a sped-up clock |\n\n## Recommendation for this game\n\nUse a strategic overworld (B), or top-down sailing (C) with a separately sped-up world clock, and build the map as sea regions linked by straits.\n\n&#91;embedded content: example archipelago: 7 sea regions linked by straits\\]\n\nThe threat can only move along links, so holding a strait is a real goal and fronts stay readable. Region names here are placeholders taken from the faction ideas so far.\n\nStarting targets to tune in a prototype, not measured figures:\n\n| Target | Value |\n| --- | --- |\n| Crossing the whole map | 3-5 real minutes |\n| Sailing to a neighboring island | 20-60 seconds |\n| Something to react to (sail, wreck, storm) | Every 30-60 seconds |\n| Islands in total | 40-60, about 20 of them settlements |\n| Factions | 4-5, each with 3-5 settlements |\n| Sea regions | 5-8, linked by straits |\n| Unchecked threat overruns the map | 15-25 hours of play |\n| First prototype | 12-15 islands, 3 factions, 1 threat core |\n\n## References\n\n- [Assassin's Creed 4 Is 15-20 Hours Long](https://www.cinemablend.com/games/Assassin-Creed-4-15-20-Hours-Long-58111.html), Cinemablend, 2013: Black Flag crossing time and sync-point fast travel.\n- [Sea of Thieves map will have 15 - 30 minute ship encounters](https://www.tweaktown.com/news/60911/sea-thieves-map-15-30-minute-ship-encounters/index.html), TweakTown, 2018: Rare's encounter-rate target.\n- [How to fast travel in Sea of Thieves](https://www.gfinityesports.com/article/sea-of-thieves-fast-travel), Gfinity, 2024: diving to a voyage and its limits.\n- [Sid Meier's Pirates! (2004 video game)](<https://en.wikipedia.org/wiki/Sid_Meier%27s_Pirates!_(2004_video_game)>), Wikipedia: sailing map, wind, storms, separate battles, city capture.\n- [Pirates! Xbox](https://forum.quartertothree.com/t/pirates-xbox/19918), Quarter To Three forum, 2005: PC vs Xbox crossing test and effects of a compressed map.\n- [Bannerlord Developer Blog 12: The Passage Of Time](https://www.taleworlds.com/en/Games/Bannerlord/Blog/14), TaleWorlds: overworld simulation, chokepoints, twelve-week year.\n- [Space Rangers 2: Dominators](https://www.mobygames.com/game/19891), MobyGames: turn-based travel, real-time battles, shifting Dominator attacks.\n- [Windward co-op](https://www.co-op.gg/game/windward), co-op.gg: up to 4 players online.\n- [Windward launches on Steam](https://www.fandom.com/articles/733-windward-sailing-sandbox-adventure-game-launches), Fandom, 2015: procedural world, distance-based difficulty, AI that explores.\n- [LinuxGameCast Reviews: Windward](https://linuxgamecast.com/2017/05/linuxgamecast-reviews-windward/), 2017: player view of pace, combat and camera.\n"}, {"id": "reports-2026-10-28-arcade-naval-reference", "path": "reports/2026-10-28-arcade-naval-reference.md", "title": "Arcade Naval & Isometric Mission Games — Reference Report", "section": "reports", "date": "2026-11-09", "md": "# Arcade Naval & Isometric Mission Games — Reference Report\n\nOct 28, 2026 · @Denis\n\nEight games that are the closest references for a simple isometric arcade naval game: fight ships, run missions, pick a ship type.\n\nThey fall into three groups. **Naval arcade** (Battle Stations, Overboard!, Naval Ops, Windward) covers ship classes, broadside combat and local versus play. **Isometric mission shooters** (Desert Strike, Jungle Strike, Cleared Hot, Megacopter) cover the mission structure on an open map. **Hybrid** (Return Fire) uses a roster of vehicle roles in a two-player capture-the-flag game.\n\n## 1. Battle Stations (EA, 1997)\n\n**The PS1 game you played.** A two-player naval fighting game: pick one of 8 modern warships and duel a friend or the CPU. Developed by Realtime Associates, published by Electronic Arts for PlayStation and Sega Saturn.\n\n&#91;image: Battle Stations: ship select, a ship-to-ship duel, and the War Games map\\]\n\n*Left to right: ship select (Player 1 vs Computer), a 1-on-1 duel, the War Games strategic map.*\n\n**Gameplay.** Every fight is a 1-on-1 duel in a small arena seen from above. You steer your ship, move a targeting reticle onto the enemy and dodge its shots. In War Games mode, fleets move as pieces on a map; when two ships meet, the game cuts to a duel.\n\n**Features**\n\n- 8 ship types: aircraft carrier, battleship, cruiser, destroyer, submarine, patrol boat, mine layer, troop transport.\n- Each ship is rated on 6 stats: top speed, target range, hull strength, main guns, special weapon, defensive weapon.\n- Arcade mode: quick duels; sinking ships earns points to climb 10 ranks, Ensign to Fleet Admiral.\n- Campaign: single-player missions against 5 enemy commanders, each with its own style.\n- War Games (2 players): capture the flag (sink the flag ship, bring its flag home) and harbor assaults (land marines from a troop transport).\n- Fleets: pick a country, a balanced fleet or a custom one; over 30 fleets in total.\n- 76 missions: 50 single-player, 26 multiplayer.\n\n**Reception.** Mixed. Magazines called it a 32-bit update of the Intellivision game Sea Battle.\n\n**What to take for your game:** the ship roster. Clear roles with a stat card and one special weapon per class make choosing a ship a decision, not a skin.\n\n## 2. Overboard! / Shipwreckers! (Psygnosis, 1997)\n\n**A cartoon pirate-ship shooter for PS1 and PC with a 5-player party mode.** Called Shipwreckers! in North America and Overboard! in Europe.\n\n&#91;image: Overboard!: a harbour level and an ice level with a sea monster\\]\n\n*Top-down 3D view: harbour level (left) and an ice world (right). HUD shows lives, treasure count and hull bar.*\n\n**Gameplay.** You steer one pirate ship through maze-like waterways seen from above. Each world hides map bottles you need to unlock the exit, guarded by enemy ships, shore turrets, traps and sea creatures. When the ship takes fire, the crew jump overboard one by one as the hull bar drains.\n\n**Features**\n\n- Broadside cannons: you turn side-on to the target to hit it.\n- Special weapons: rockets, mines, lightning bolts, plus power-ups such as speed boosts and shields.\n- 5 themed worlds with puzzles and secret routes; saves on memory card or by password.\n- Multiplayer for up to 5 players with the PS1 Multitap: 10 arenas, deathmatch and capture the flag.\n\n**Reception.** Mixed. Critics found the single-player steering too simple (no wind), while several said multiplayer was the strong point and an addictive party game.\n\n**What to take for your game:** broadside aiming as the core skill, and small arenas for local versus.\n\n## 3. Desert Strike (1992) & Jungle Strike (1993), EA\n\n**The isometric helicopter mission games you were thinking of.** Desert Strike launched on Sega Genesis, became EA's best-selling game at the time, and spawned Jungle, Urban, Soviet and Nuclear Strike.\n\n&#91;image: Desert Strike and Jungle Strike gameplay\\]\n\n*Desert Strike (left) and Jungle Strike (right): an open isometric map with the helicopter, targets and pickups.*\n\n**Gameplay.** You fly an attack helicopter over a large, open isometric map. Each level holds several missions: destroy installations, rescue hostages, capture enemy officers. You pick the order yourself, so planning the route matters.\n\n**Features**\n\n- Resource triangle: limited armor, fuel that drains over time, and ammo; fuel barrels and ammo crates are scattered on the map.\n- 3 weapons with a trade-off: machine gun (plenty), Hydra rockets (fewer), Hellfire missiles (fewest, strongest).\n- Rescued people delivered to a landing zone restore armor.\n- Jungle Strike adds other vehicles: a hovercraft, a motorbike and an F-117, plus a co-pilot choice before each level.\n- Fail one mission objective and you restart the level.\n\n**Reception.** Strong: several magazines scored Desert Strike above 90%, praising the mix of action and strategy.\n\n**What to take for your game:** the mission-on-an-open-map structure, with fuel and ammo as a route-planning puzzle. Jungle Strike's hovercraft shows how a water vehicle fits the format.\n\n## 4. Cleared Hot (MicroProse, PC)\n\n**A modern Desert Strike homage built on physics.** Published by MicroProse on Steam; the store page lists a Nov 20, 2025 release and an Early Access tag.\n\n&#91;image: Cleared Hot: a helicopter on a mission to destroy radar installations\\]\n\n*An objective tracker (top right), minimap and weapon HUD over a desert base.*\n\n**Gameplay.** You fly a helicopter over a 3D map seen from a high angle, completing objectives like knocking out radar sites. A rope and magnet lets you lift almost anything: rocks to throw, tanks to carry, even incoming heat-seeking missiles to redirect. You also ferry and position a squad of soldiers to take or hold ground.\n\n**Features**\n\n- Fully physics-based combat; ragdolling enemies and emergent tricks.\n- 8 playable helicopters with custom loadouts.\n- 3 biomes (desert, jungle, arctic), day and night missions.\n- Enemies include tanks, jeeps, anti-air turrets, fighter jets and boats.\n- Single-player campaign; Steam Workshop support.\n\n**What to take for your game:** one signature verb (the magnet) that makes missions playful. A ship equivalent could be a towing cable or grappling hook.\n\n## 5. Megacopter: Blades of the Goddess (Pizza Bear Games, 2024)\n\n**The closest modern match to the classic Strike look.** Released on Steam on Jun 21, 2024; a sci-fi, comic-book take on Desert Strike and Choplifter.\n\n&#91;image: Megacopter: attacking an enemy dome base on an isometric beach map\\]\n\n*Isometric map with an alert meter (top left), minimap and objective panel (top right), weapon HUD (bottom).*\n\n**Gameplay.** You pilot a sentient helicopter against alien Reptoid forces across isometric maps. Each mission has a clear type, and enemy pressure ramps up as you push deeper.\n\n**Features**\n\n- 4 mission types: seek and destroy (threat level rises as you go deeper), rescue (Choplifter style), defense (enemy waves), boss hunt.\n- 4 biomes, over a dozen missions.\n- Armory: spend tokens on new guns between missions.\n- Ability pairings (AZ-TECH) chosen per mission loadout.\n- Single-player; original retro soundtrack.\n\n**What to take for your game:** a small set of named mission types, and the escalating threat meter inside a mission.\n\n## 6. Return Fire (Silent Software, 1995)\n\n**A two-player capture-the-flag game where picking the right vehicle is everything.** Released on 3DO in 1995, then PC and PlayStation in 1996.\n\n&#91;image: Return Fire: the vehicle bunker and a helicopter over an island\\]\n\n*Left: the underground bunker where you choose your next vehicle. Right: a helicopter attacking an island bunker.*\n\n**Gameplay.** Each player has a base on an island map, seen from a 3D bird's-eye view. You pick a vehicle from your bunker, push into enemy territory, find their flag and bring it home. Lose a vehicle and you go back to the bunker for another.\n\n**Features**\n\n- 4 vehicles with sharp roles:\n  - Helicopter: strafes, destroys mines and bridges, fragile, refuels only at base.\n  - Tank: 360° turret.\n  - Armored support vehicle: toughest and slowest, lays mines.\n  - Jeep: fastest, dies in one hit, the only vehicle that can carry the flag; inflates its tires to cross deep water.\n- Fuel and ammo per vehicle, refilled at depots and ammo tents.\n- Leave the map edge and a submarine surfaces to fire a homing missile.\n- Split-screen two-player mode, praised as the highlight; a classical soundtrack with a theme per vehicle.\n\n**Note:** there are no boats in Return Fire. The jeep's water crossing is the closest it gets.\n\n**What to take for your game:** a rock-paper-scissors vehicle roster where only one class can win the objective. In a naval version, a fast, fragile boat could be the only one able to carry the flag.\n\n## 7. Naval Ops: Warship Gunner (Micro Cabin / Koei, 2003)\n\n**Mission-based arcade naval combat with deep ship building.** PlayStation 2; released in the US in June 2004. Single-player only, third-person camera rather than isometric.\n\n&#91;image: Naval Ops: Warship Gunner gameplay\\]\n\n*Third-person view behind the player's warship in open-sea combat.*\n\n**Gameplay.** You command one warship in real time through 40 missions across 4 theaters (Mediterranean/Atlantic, Pacific, Indian Ocean, worldwide). Each theater ends with a boss fight against a giant \"supership\". Between missions you spend money on parts and research.\n\n**Features**\n\n- Start in a generic destroyer and grow into cruisers, battleships, aircraft carriers and battlecarriers.\n- Build your own ship from hulls, weapons, armor and equipment, or buy pre-built designs and scrap them for parts.\n- Research in 5 areas: aircraft, weapons, metallurgy, engines, electronics.\n- 4 nations (US, UK, Japan, Germany) change the available ship types and parts.\n- WWII mode with period tech, or Normal mode with sci-fi weapons like rail guns and lasers.\n\n**What to take for your game:** the between-mission upgrade loop and boss ships that end each chapter.\n\n## 8. Windward (Tasharen Entertainment, 2015)\n\n**Top-down arcade sailing and ship combat, built for co-op.** Released on Steam on May 12, 2015.\n\n&#91;image: Windward: top-down ship combat with broadsides and area effects\\]\n\n*Bird's-eye view of a sea battle: ships trade broadsides while skill effects burst around them.*\n\n**Gameplay.** You sail one ship around a procedurally generated world, fighting pirates, trading with towns and taking quests. Combat is real-time and arcade: you steer to bring your guns to bear and use active skills. The further you sail from the start, the harder and more rewarding it gets.\n\n**Features**\n\n- Ship classes with clear roles: fast schooners for exploring, heavy ships of the line for firepower.\n- Solo or online co-op, with cross-platform multiplayer.\n- Towns grow as you supply them and unlock better ships and upgrades.\n- Reputation system: AI factions challenge you, avoid you, or follow and help you.\n- AI ships play by the same rules as the player.\n\n**What to take for your game:** readable top-down ship combat at arcade speed, and distance from the start as a simple difficulty curve.\n\n## At a glance\n\nBattle Stations and Return Fire are the best models for local versus play with ship classes; Desert Strike and Megacopter are the best models for missions.\n\n| Game | Year | View | Players | Core loop | Idea to borrow |\n| --- | --- | --- | --- | --- | --- |\n| Battle Stations | 1997 | Top-down duel arena | 1–2 local | Pick 1 of 8 warships, duel | Ship classes with stat cards and a special weapon each |\n| Overboard! | 1997 | Top-down 3D | 1–5 local | Sail mazes, sink ships, find exits | Broadside aiming; small versus arenas |\n| Desert / Jungle Strike | 1992–93 | Isometric | 1 | Open-map missions, manage fuel and ammo | Mission lists on one open map |\n| Return Fire | 1995 | Bird's-eye 3D | 1–2 split-screen | Capture the flag with 4 vehicle roles | Only one fragile class can carry the flag |\n| Naval Ops: Warship Gunner | 2003 | Third-person | 1 | 40 missions, build and upgrade your ship | Upgrade loop; chapter boss ships |\n| Windward | 2015 | Top-down | 1 + online co-op | Sail, fight, trade, quest | Readable arcade broadsides |\n| Megacopter | 2024 | Isometric | 1 | 4 named mission types | In-mission threat meter |\n| Cleared Hot | 2025 | High-angle 3D | 1 | Physics missions with rope and magnet | One signature verb, like a towing cable |\n\n## Sources\n\nScreenshots: Wikipedia, PSX Data Center and Steam store pages, linked below.\n\n- Battle Stations: [Wikipedia](<https://en.wikipedia.org/wiki/Battle_Stations_(1997_video_game)>), [StrategyWiki](https://strategywiki.org/wiki/Battle_Stations), [MobyGames](https://www.mobygames.com/game/47361/battle-stations/), [PSX Data Center](https://psxdatacenter.com/games/U/B/SLUS-00456.html)\n- Overboard! / Shipwreckers!: [Wikipedia](<https://en.wikipedia.org/wiki/Overboard!_(1997_video_game)>), [PSX Data Center](https://psxdatacenter.com/games/U/S/SLUS-00558.html), [PPE.pl](https://www.ppe.pl/gry/Overboard/6480), [The Video Game Critic](https://videogamecritic.com/ps1ss.htm)\n- Desert Strike: [Wikipedia](https://en.wikipedia.org/wiki/Desert_Strike)\n- Jungle Strike: [Wikipedia](https://en.wikipedia.org/wiki/Jungle_Strike)\n- Cleared Hot: [Steam](https://store.steampowered.com/app/1710820/)\n- Megacopter: Blades of the Goddess: [Steam](https://store.steampowered.com/app/1228360/)\n- Return Fire: [Wikipedia](https://en.wikipedia.org/wiki/Return_Fire), [PSX Data Center](https://psxdatacenter.com/games/U/R/SLUS-00184.html)\n- Naval Ops: Warship Gunner: [Wikipedia](https://en.wikipedia.org/wiki/Naval_Ops:_Warship_Gunner)\n- Windward: [Steam](https://store.steampowered.com/app/326410/)\n"}, {"id": "reports-README", "path": "reports/README.md", "title": "Отчёты", "section": "reports", "date": "2026-11-13", "md": "# Отчёты\n\nОтчёты и исследования, которые раньше жили артефактами Claude. Пока хранятся здесь как есть, на языке оригинала. Это снимки на свою дату: решения и то, как устроена игра, — на страницах тем.\n\n## Выбор облика\n- 2026-11-07 [Облик всей игры](2026-11-07-art-directions/index.html) — шесть обликов на стенде `Art`. Наш выбор Ink; владелец ещё не выбрал.\n- 2026-11-06 [Облик меню](2026-11-06-menu-looks/index.html) — шесть обликов на стенде `Menus`. Наш выбор Quiet; владелец ещё не выбрал.\n- 2026-11-06 [Картины меню](2026-11-06-menu-paintings/index.html) — пауза и настройки, нарисованные FLUX. Владелец отверг; с 2026-11-07 картинки нейросетью не рисуем.\n\n## Проверки и разборы\n- 2026-11-13 [Список для игры](2026-11-13-play-checklist/index.html) — что построено с конца октября и ждёт оценки владельца, в порядке одной поездки: где это в игре и на что смотреть. Живёт артефактом https://claude.ai/artifact/WDVtDp2GJuSBonAw4hSy8u: оценки («Остаётся», «Чинить», «Вырезать») и заметки хранит его база, коллекция `verdicts`, по документу на вещь. Правишь список — опубликуй артефакт заново из этого файла.\n- 2026-11-08 [Greenlight](2026-11-08-greenlight-review/index.html) — пять издателей оценивают прототип, 4.6 из 10: «вернитесь с вертикальным срезом».\n- 2026-11-08 [Что убрать из игры](2026-11-08-cleanup-audit/index.html) — аудит лишнего. Владелец взял только пункты по коду (4a7b9a56).\n- 2026-11-04 [QA интерфейса](2026-11-04-interface-qa/index.html) — 102 замечания, все исправлены.\n- 2026-11-03 [Пресса](2026-11-03-press-review/index.html) — десять критиков, 63 из 100.\n\n## Другие игры\n- 2026-11-07 [Escape from Duckov](2026-11-07-escape-from-duckov.pdf) и [Dave the Diver](2026-11-07-dave-the-diver.pdf) — разборы игр (PDF).\n- 2026-10-28 [Аркадные морские игры](2026-10-28-arcade-naval-reference.md) — восемь игр-ориентиров для аркадного поворота.\n\n## Времён симулятора\nДо аркадного поворота 2026-10-26; игра с тех пор другая (тег `simulator-game`).\n- 2026-10-13 [Подходы к карте](2026-10-13-map-approaches.md) — как строить карту морской песочницы.\n- 2026-10-11 [Судовой журнал идей](2026-10-11-captains-ledger/index.html) — 518 идей по системам.\n- 2026-10-11 [Becoming Windward](2026-10-11-becoming-windward/index.html) — Windward, WaveWorks и выбор движка.\n- 2026-10-11 [Фэнтезийный архипелаг](2026-10-11-fantasy-archipelago/index.html) — исследование кооп-песочницы.\n- 2026-10-09 [Вода](2026-10-09-water-field-guide/index.html) — справочник по воде.\n\nПредложения по сеттингу лежат на своём месте: [story/lore-proposals.html](../story/lore-proposals.html).\n"}, {"id": "roadmap", "path": "roadmap.md", "title": "Дорожная карта", "section": "", "date": "2026-11-13", "md": "# Дорожная карта\n\nЧто сделать до полного релиза в Steam и в каком порядке. Порядок этапов решил владелец; что внутри каждого этапа и его срок — решение без владельца ([Q95](questions/gaps.md#q95)).\n\n## Решения владельца\n- 2026-11-13 владелец спросил, что нужно игре до полного релиза в Steam, если целиться в 90 на Metacritic, и попросил записать это дорожной картой.\n- 2026-11-13 порядок этапов утверждён: что это за игра; срез и рядом с ним чужие машины и страница Steam; демо; ранний доступ; релиз 1.0.\n\n## Планка\n90 — мерка для каждой части игры, а не прогноз: столько получают единицы независимых игр в год. У них общее:\n- цикл хорош и в первую минуту, и на двадцатом часу;\n- облик узнаётся по одному кадру;\n- каждые полчаса игрок встречает новое;\n- ничто не мешает: обучение, скорость, управление, доступность;\n- игру долго правили на живых игроках до релиза.\n\nОткуда идём: [Greenlight](reports/2026-11-08-greenlight-review/index.html) поставил прототипу 4,6 из 10 и просил вертикальный срез, [Пресса](reports/2026-11-03-press-review/index.html) — 63 из 100. С тех пор решена цель игры (поручения и финальный босс, [11-12](decisions.md)), построен кооп через Steam ([Онлайн-кооп](online.md)), интерфейс сведён в одну тему ([Компоненты](art/components.md)). Остальное из тех отчётов стоит ниже.\n\n## Порядок\nЭтап начинается, когда у предыдущего выполнено «Готово, когда». Порядок важнее сроков; сроки грубые.\n\n### 1. Что это за игра — около двух недель\n- Владелец играет всё, что построено с конца октября и не сыграно ([Журнал решений](decisions.md)), и говорит, что остаётся. Что играть, где это в игре и куда ставить оценку: [Список для игры](https://claude.ai/artifact/WDVtDp2GJuSBonAw4hSy8u), артефакт владельца.\n- Опоры игры и её игрок: [Q92](questions/gaps.md#q92), [Q93](questions/gaps.md#q93). Наше предложение опор: лодкой весело править, и руль — это прицел; каждая сборка дерётся по-своему; добычу надо довезти; мир флопп тёплый и смешной; с друзьями лучше.\n- Имя и кот: [Q185](questions/gaps.md#q185).\n- Один облик: выбрать со стендов или оставить нынешний, остальные убрать ([Кандидаты на облик](art/candidates.md)).\n- Заморозка: новых систем нет, пока не готов срез.\n\nГотово, когда: [Об игре](vision.md) держит крючок в одну фразу, опоры и игрока, и есть список того, что входит в 1.0 и что вырезано.\n\n### 2. Срез — один-два месяца\nТридцать–сорок пять минут игры в качестве релиза: обучение, первый район, первый босс, первая покупка.\n- **Обучение по рации** — первое поручение (решено [11-12](decisions.md)): руль, рывок, захват цели, швартовка, продажа. Кончается победой.\n- **Глубина боя.** Турель целится сама, ракеты идут в захват, мышь не целится ([Бой](gameplay/combat.md)): мастерство — это руль, рывок, парирование и таран. Каждый вид охотника просит своего ответа; после чистого уклонения есть окно для удара; парирование что-то возвращает. Стартовая лодка с одной турелью должна быть интересной: с неё начинает каждый.\n- **Проверка «мышью не целятся»** на игроках с клавиатурой.\n- **Бой читается** на 1080p: лодка игрока отличима от охотников, ракеты и попадания видны. Greenlight 11-08 отметил это всеми пятью местами; проверить заново.\n- **Настоящий босс** вместо заглушки броненосца ([Q1](questions/missions.md#q1)).\n- **Первая покупка**: деталь стоит одного-двух выходов в море ([Q56](questions/missions.md#q56), [Q101](questions/gaps.md#q101)). Сейчас у новой игры 10 000 монет, а самый дорогой корпус стоит 1050 ([Баланс экономики](balance/economy.md)).\n- **Флоппы в мире**: модели на пирсе и на станции; сейчас они только на портретах ([Люди: флоппы](art/people.md)).\n- **Сборка игрока** без «Демо» и стендов: сейчас экспорт берёт весь проект (`game/export_presets.cfg`).\n\nГотово, когда: срез сыграли 5–20 человек со стороны ([Q105](questions/gaps.md#q105)), и большинство дошло до конца и хочет ещё.\n\n### 3. Чужие машины и страница Steam — рядом с этапом 2\n- Сборка для Windows запущена и сыграна: её ни разу не запускали ([Сборки и посты](tools/release.md)).\n- Названо самое слабое железо ([Q97](questions/gaps.md#q97)); есть низкий уровень качества; игра идёт на Steam Deck. Сейчас кадр на Mac владельца около 16 мс, а первые открытия подвисают ([Известные недочёты](known-issues.md)).\n- Бой одинаков на 30 и на 144 кадрах в секунду: лодки и снаряды шагают по времени кадра (`Boat._Process`, `Projectile._Process`). Если расходится — фиксированный такт.\n- Портреты, логотип и ключевой арт от художника ([Q102](questions/gaps.md#q102), [Q103](questions/gaps.md#q103)) — до любой публичной страницы: Steam спрашивает о карти
