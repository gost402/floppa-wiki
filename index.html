<script id="data" type="application/json">{"pages": [{"id": "README", "path": "README.md", "title": "Floppa Tropical Adventures — вики", "section": "", "date": "2026-11-16", "md": "# Floppa Tropical Adventures — вики\n\nВся документация игры: решения владельца, как устроена каждая система, открытые вопросы и инструменты. Начать стоит с [Об игре](vision.md).\n\nЭту же вики можно читать как сайт с поиском и картинками: [вики игры](https://gost402.github.io/floppa-wiki/). Его собирает `tools/wiki.py` из этих страниц, а выкладывает `tools/wiki-pages.sh`.\n\n## Разделы\n- **[Об игре](vision.md)** — игра коротко. **[Дорожная карта](roadmap.md)** — что сделать до релиза в Steam. **[Журнал решений](decisions.md)** — что решили и что отвергли, по датам. **[Глоссарий](glossary.md)** — термины игры по-английски и по-русски.\n- **Геймплей:** [Открытый мир](gameplay/missions.md), [Камера и картинка](gameplay/camera.md), [Лодка](gameplay/boat.md), [Бой](gameplay/combat.md), [Сборки и стили игры](gameplay/builds.md), [Охотники и ИИ](gameplay/hunters.md), [Соперники](gameplay/rivals.md), [Розыск и патруль](gameplay/wanted.md), [Припасы](gameplay/pickups.md), [Добыча](gameplay/haul.md), [Места промысла](gameplay/sites.md), [Забавы](gameplay/toys.md), [Прогресс и сохранения](gameplay/progression.md).\n- **Баланс:** [Оружие](balance/weapons.md), [Лодки](balance/boats.md), [Экономика](balance/economy.md).\n- **Гавань:** [Мастерская корабела](base/pier.md), [Верфь](base/boatyard.md).\n- **Мир:** [Море](world/sea.md), [Жизнь моря](world/life.md), [Локации](world/locations.md), [Рельеф](world/ground.md), [Зоны и опасности](world/areas.md), [Станция](world/outpost.md), [Форт пиратов](world/fort.md), [Погода](world/weather.md).\n- **[Онлайн-кооп](online.md).**\n- **Интерфейс:** [HUD](interface/hud.md), [Экраны и меню](interface/screens.md), [Управление](interface/controls.md), [Язык](interface/language.md).\n- **[Арт-дирекшн](art/README.md):** [Облик мира](art/world-look.md), [Облик лодок](art/boats.md), [Люди: флоппы](art/people.md), [Палитра](art/palette.md), [Компоненты интерфейса](art/components.md), [Стиль интерфейса](art/interface.md), [Свет и время суток](art/light.md), [Материалы](art/materials.md), [Кандидаты на облик](art/candidates.md).\n- **Звук:** [Звук](audio/sound.md), [Музыка](audio/music.md).\n- **Сюжет:** [Сеттинг и лор](story/setting.md), [Сцены сюжета](story/scenes.md), [Диалоги и голос](story/dialogue.md).\n- **[Инструменты](tools/README.md):** [Код](tools/code.md), [Демо](tools/demos.md), [Редактор карт](tools/map-editor.md), [Редактор сюжета](tools/story-editor.md), [Ассеты](tools/assets.md), [Сборки и посты](tools/release.md).\n- **[Открытые вопросы](questions/README.md)** — всё, что ждёт ответа владельца, и [Чего нам не хватает](questions/gaps.md).\n- **[Отчёты](reports/README.md)** — отчёты и исследования, что были артефактами Claude: выбор облика, разборы, другие игры.\n- **[Известные недочёты](known-issues.md)** — что игрок видит или чувствует неправильным и что пока не исправлено.\n\n## Как вести вики\n- Всё — прототип, и ничто не высечено в камне. Решение — направление, в котором строить сейчас; любое может измениться, когда игра покажет лучшее.\n- То, что в игре уже есть, скорее всего имеет смысл: считать это выбранным или временной заменой, прежде чем называть пробелом.\n- Строить по решениям, но говорить, когда игра спорит с решением. Числа в игре — стартовые значения для настройки.\n- Где решения нет, построить самое простое, что оставляет варианты открытыми, описать это на странице темы как «решение без владельца» со ссылкой на вопрос и добавить вопрос.\n- Когда владелец отвечает, записать решение в «Решения владельца» на странице темы и удалить вопрос; историю хранит git. Крупное решение — строка в [Журнале решений](decisions.md).\n- Любой лор, фракцию или механику сверх решённого помечать как предложение ([Сеттинг и лор](story/setting.md)).\n\n## Как устроена страница\n- «Решения владельца» — только то, что решил владелец.\n- «Как устроено» — что игра делает сегодня, с файлами кода. Решения без владельца помечены там же со ссылкой на вопрос.\n- «Открытые вопросы» — ссылки на вопросы темы. Вопрос живёт под заголовком своего номера (`### Q17`), так что ссылка `questions/missions.md#q17` ведёт прямо к нему.\n- Коротко и простыми фразами: что делает система, приём, одна строка «почему», какие файлы. Каждый факт — в одном месте, на другие ссылаемся. Числа настройки живут в коде; исключение — страницы [баланса](balance/weapons.md): это снимок значений, у каждой таблицы назван источник, и число на них правится в том же коммите, что и в коде.\n- Вики пишется по-русски; идентификаторы кода, пути, клавиши и имена демо — как в коде. Правила проекта для агентов — в [CLAUDE.md](../CLAUDE.md), по-английски.\n- Лодка — вещь: в русском у неё род своего существительного (лодка — она, катер — он), без олицетворения.\n"}, {"id": "art-README", "path": "art/README.md", "title": "Арт-дирекшн", "section": "art", "date": "2026-11-16", "md": "# Арт-дирекшн\n\nКак игра выглядит и как мы приходим к её облику. Каждая тема облика — на своей странице.\n\n## Направление\nМир — солнечный тропический архипелаг: бирюзовая лагуна над белым песком, сочная зелень и пальмы, мечтательная вода пляжных уровней начала 2000-х, мягкий яркий свет и тени облаков. Интерфейс — стекло в духе Frutiger Aero поверх этого мира: прозрачное, с водой и светом за ним, с бликом и кромкой, сдержанное и спокойное, с широкими полями. Материал там, где он важен, остальное тихо.\n\n2026-11-11 владелец решил: интерфейс берёт стиль Frutiger Aero, прозрачное стекло и красивое движение уровня лучших инди, начиная с кнопок базы; у игры есть официальная [палитра](palette.md) и [базовые компоненты](components.md). 2026-11-12, увидев кадры плиток, он сказал нести стекло дальше: на меню, карточки верфи и HUD.\n\n## Страницы\n- [Палитра](palette.md): цвета игры по ролям.\n- [Компоненты интерфейса](components.md): базовые детали, их состояния и движение.\n- [Облик мира](world-look.md): море, острова, песок, зелень, кильватер.\n- [Облик лодок](boats.md): корпуса, ливреи, оснастка, банда охотников.\n- [Люди: флоппы](people.md): все жители мира — каракалы-флоппы, и их портреты.\n- [Стиль интерфейса](interface.md): вещи мира, шрифты, материалы, выноски.\n- [Свет и время суток](light.md): небо, солнце, ночь, рассвет.\n- [Материалы](materials.md): дерево и металл.\n- [Кандидаты на облик](candidates.md): облики меню, построенные на выбор. Владелец ещё не выбрал.\n\n## Правила\n- Один облик везде: затенение, цвет и свет одни для всей игры ([CLAUDE.md](../../CLAUDE.md), принцип 3).\n- Сначала спросить, какой облик владелец себе представляет. Перед тем как моделировать или перекрашивать что-то видимое, задать короткий раунд вопросов по-русски: форма, материал, цвет, главные детали. Облик по догадке уже промахивался: первая база, погода.\n- Никаких картинок, сгенерированных ИИ (владелец, 2026-11-07). Облик показывают кадры самой игры из [демо](../tools/demos.md) или ссылки на настоящие игры. Портреты, уже нарисованные локальной моделью, остаются, пока владелец не скажет иначе ([Люди: флоппы](people.md)).\n- Владелец судит облик, играя, и по кадрам игры, а не по описаниям.\n- Ни одна другая игра не называется в интерфейсе, в коде и в вики.\n- Откуда берутся модели, звук и шрифты: [Ассеты](../tools/assets.md).\n\n## Что владелец отверг\nЧтобы не повторять.\n- **Карточки «как у приложения»** (2026-10-26): первый HUD и верфь — скруглённые тёмные стеклянные карточки, шрифт по умолчанию — владелец назвал безликими и «сгенерированными ИИ». Никаких карточек и скруглённых стеклянных панелей.\n- **HUD из тонких светящихся линий по образцу военного авиасимулятора** (2026-10-26 — 2026-10-29): образец снят, интерфейс стал вещами мира.\n- **Погода** (2026-10-27): туман, дождь, шторм и гром, построенные как физические модели, сняты целиком: «не так, как я представлял». 2026-11-16 владелец вернул шторм, каким его видит сам ([Погода](../world/weather.md)).\n- **Пена по неподвижному V от носа** (2026-10-28): пена должна быть симулированной и принадлежать воде. Брызги потом урезаны как «чрезмерные».\n- **Усиленные стилизованные кильватерные волны** (2026-10-30): «выглядят плохо», откачены. Перед новой попыткой спросить, что владелец представляет.\n- **Первая база** (2026-10-31): жёлтый дом с красной жестяной крышей. Владелец представлял открытый деревянный эллинг; 2026-11-10 эллинг сменил открытый пирс, а 2026-11-13 пирс с гребёнкой мест под экран базы — мастерская корабела, место открытого мира ([Гавань](../base/pier.md)).\n- **Персонажи с вещами в лапах** (2026-11-06): никто ничего не держит.\n- **Неоновый свет причала** (2026-11-12): кольцо и столб неонового света, как маркеры миссий Vice City, — «слишком ярко, слишком пёстро, неестественно». Место отмечает вещь мира со сдержанным светом: стеклянные поплавки с тёплыми огоньками ([Пирс](../base/pier.md)).\n- **Меню с картинок** (2026-11-06 — 2026-11-07): стопки толстых глянцевых кнопок во всю ширину по центру, жирный шрифт с обводкой и логотип с фаской — «дешёвая мобильная игра». Яркие меню пляжного уровня, каждая строка в плашке, блики — «дёшево, громко, без вкуса». Мраморная табличка и алюминиевая панель с тонкой антиквой — «ни то ни другое». Небольшой список простых слов слева, широкие поля и материал только на выбранном пункте читались как консольная игра.\n- **Шесть целых обликов игры со стенда `Art`** (2026-11-14): Ink, Lagoon, Poster, Logbook, Deep и Tin сняты, ни один не взят ([Кандидаты на облик](candidates.md)).\n- **Слишком близкая камера и бледное открытое море** (2026-11-07, после игры): зум и тон картинки вернули ([Q77](../questions/world.md#q77)).\n\n## Что владельцу понравилось\n- Frutiger Aero и Utopian Scholastic (2026-11-02): «потрясающе» — теперь это образцы интерфейса ([Стиль интерфейса](interface.md)). 2026-11-11 — постер Frutiger Aero (стеклянный шар, прозрачная волна с пузырьками, небо, листья, полосы света, мелкие подписи «// discover»): по нему сделаны кнопки базы.\n- Мир на картинках меню (2026-11-06): песок, зелень, пальмы, каустика, облачные тени ([Облик мира](world-look.md)).\n- Материалы: стекло в шлифованном алюминии и белый мрамор с хромом (2026-11-06, этюды).\n- Мечтательная ностальгическая вода пляжных уровней начала 2000-х — как вдохновение, а не как бирюзовый оттенок на всём (2026-11-06).\n\n## Открытые вопросы\n- [Q166](../questions/interface.md#q166): меню и верфь в стекле. HUD остаётся стеклом без преломления, а диалог, циферблат рыбалки и показатели верфи переходят в стекло ([решено 11-12](../decisions.md)).\n- [Q159](../questions/interface.md#q159), [Q160](../questions/interface.md#q160), [Q161](../questions/interface.md#q161): палитра, стеклянные плитки и движение, базовые компоненты.\n- Какой облик меню взять со стенда: [Кандидаты на облик](candidates.md).\n"}, {"id": "art-boats", "path": "art/boats.md", "title": "Облик лодок", "section": "art", "date": "2026-11-16", "md": "# Облик лодок\n\n![Все корпуса в ряд](../img/fleet.jpg)\n\nКак выглядят лодки игрока, охотников и соперников. Как лодка устроена и ходит: [Лодка](../gameplay/boat.md).\n\n## Решения владельца\n- Лодки выглядят как настоящие моторные: седловатость, наклонённый и развалистый нос, планширь, кокпит, настоящие моторы, рубки и оснастка, у каждой поверхности своя краска, лак или металл.\n- Ливреи — гоночная графика: смелые полосы от носа до кормы, крупный номер на носу, палуба контрастного цвета. Лодки освещены как море, но ярче: насыщенная краска, чёткий лак и хром, тёмный привальный брус обводит корпус.\n- Корпуса побольше несут рубку или пульт под жёсткой крышей; они нарисованы, но это не деталь. На палубах оснастка (леера, утки, бортовые огни, антенны, бухты троса, канистры) и приметы сеттинга: солнечные панели на крышах, парусиновые тенты, ветряки, зелень в кадках.\n- Пропорции слегка преувеличены, чтобы лодка читалась с высоты боя: борта выше, моторы и ветровые стёкла крупнее, нос острее.\n- Охотники — банда со своим обликом: малиновый и чёрный, акульи зубы на носу, рваные полосы, потёртая краска.\n\n## Как устроено\n- **Ливреи** (`Livery`, `LiveryModel`, `HullMesh`): у каждого корпуса игрока свои цвета и номер ([Q14](../questions/world.md#q14)); каждый охотник носит малиновую ливрею своей банды. Графика лежит чуть над корпусом, как игры кладут декали; цифры номера — скруглённые штрихи, потому что пересекающиеся контуры вариативного Nunito не триангулируются. Почему облик несут полосы и палуба: с высоты боя лодка занимает около 70 px.\n- **Соперники** (`Livery.Rival`): у каждой команды свои цвета бортов, палубы и полос поверх гоночной графики корпуса: морской волк — синий, кремовый и латунь, гонщик — лайм, белый и маджента, громила — оранжевый, чёрный и белый, контрабандист — оливковый, графит и бирюза, мастеровой — кремовый, бирюза и медь, сорока — фиолетовый и золото, наёмник — графит, чёрный и бледно-голубой, дуэлянт — королевский синий, белый и золото ([Соперники](../gameplay/rivals.md)).\n- **Пираты** (`Livery.Pirates`): дёготно-чёрные лодки с мачтой и чёрным парусом с черепом ([Форт пиратов](../world/fort.md)).\n- **Деревянные палубы**: у ялика, канонерки и рабочих лодок — доски выгоревшего тика, у пиратов — смолёные доски ([Материалы](materials.md)).\n- **Наряд** (`OutfitModel`): тенты, рубки, крыши, солнечные панели, леера и огни рисуются там, где не стоит деталь, и ничего не весят. Какой корпус что несёт: [Q14](../questions/world.md#q14).\n\n## Как к этому пришли\n- 2026-10-28: владелец попросил модели лучше и выбрал настоящие моторные лодки — не пухлые стилизованные и не рейдеров из хлама. Прежние корпуса были неверны во всём: форма, голые палубы, детали-коробки, плоское затенение.\n- 2026-11-02: на вопрос, что значит «стильнее», владелец выбрал гоночную графику, реалистичный, но более яркий свет, все детали с приметами сеттинга и банду охотников со своим обликом.\n\n## Открытые вопросы\n- [Q11](../questions/world.md#q11): какой настоящей лодкой должен быть каждый корпус.\n- [Q14](../questions/world.md#q14): ливреи и наряды.\n"}, {"id": "art-candidates", "path": "art/candidates.md", "title": "Кандидаты на облик", "section": "art", "date": "2026-11-14", "md": "# Кандидаты на облик\n\nОблики, построенные на выбор владельцу. Каждый живёт в своём демо-стенде; в игре их нет, пока владелец не выберет.\n\nКак смотреть: `Esc` → «Инструменты» → «Демо» → стенд → облик. `Current` — игра как есть. Оценки ниже — наши, не владельца.\n\n## Облик всей игры\n- 2026-11-07 владелец попросил заново придумать облик, и на стенде `Art` стояли шесть целых обликов: Ink, Lagoon, Poster, Logbook, Deep и Tin. 2026-11-14 владелец снял их, и стенд удалён; облик игры — нынешний. [Отчёт с кадрами](../reports/2026-11-07-art-directions/index.html).\n\n## Облик меню: стенд `Menus`\n- 2026-11-06 владельцу не понравились меню и кнопки. Шесть обликов меню в `game/demos/Menus/Looks/`, каждый показан на базе и на море.\n- **Quiet** 8.4 — консольный список, по нему скользит одна гелевая плашка.\n- **Glass** 7.9 — матовое стекло.\n- **Notebook** 7.8 — карточка, приклеенная и написанная от руки.\n- **Atlas** 7.0 — страница атласа в духе Utopian Scholastic.\n- **Device** 6.8 — починенный аква-прибор в руке.\n- **Dashboard** 6.5 — пузыри на ватерлинии.\n- Наш выбор: Quiet; Glass, если нужен материал; Notebook, если нужна вещь мира. [Отчёт](../reports/2026-11-06-menu-looks/index.html).\n- `Current` на стенде — прежние глянцевые пилюли; меню игры с 2026-11-12 — стекло ([Экраны и меню](../interface/screens.md)).\n- Если выбран: перенести в `game/ui` (`Menu`, `Pill`), поправить [Экраны и меню](../interface/screens.md), убрать остальные. Выбранный облик должен рисовать шкалы настроек.\n\n## Проверка интерфейса\n- 2026-11-03 отчёт QA по интерфейсу: 102 замечания, все исправлены 2026-11-04. [Отчёт](../reports/2026-11-04-interface-qa/index.html).\n\n## Открытые вопросы\n- [Q90](../questions/world.md#q90): облик меню со стенда `Menus`.\n"}, {"id": "art-components", "path": "art/components.md", "title": "Компоненты интерфейса", "section": "art", "date": "2026-11-16", "md": "# Компоненты интерфейса\n\n![Компоненты на стенде Components](../img/components.jpg)\n\n![Меню, клавиши, карточки и выноски на стенде Components](../img/components-glass.jpg)\n\n![Окно инструмента и его элементы на стенде Components](../img/tool-window.jpg)\n\nБазовые детали, из которых собран интерфейс, каждая в своих состояниях. Все видны разом на стенде `Components` ([Демо](../tools/demos.md)). Цвета — из [палитры](palette.md).\n\n## Решения владельца\n- 2026-11-11: интерфейс — стекло в духе Frutiger Aero: полупрозрачное, с настоящим светом и водой за ним, с красивой «инди» анимацией; у игры есть базовые компоненты ([Арт-дирекшн](README.md)). Первыми так сделаны кнопки базы.\n- 2026-11-12: стекло идёт дальше: на меню, карточки деталей верфи и HUD.\n- 2026-11-12: облик не переносят по частям: у игры одна тема Godot со всем обликом, чтобы менять его быстро.\n- 2026-11-12: стекло было слишком прозрачным; оно стало чуть менее прозрачным: оттенок прозрачного стекла закрывает 26–32% сцены, приборы HUD дымчатее на шаг. Владелец посмотрел: пока достаточно.\n- 2026-11-12: тема одна на всё: каждая деталь интерфейса берёт облик из неё, диалог тоже; прежние решения о виде отдельной детали исключением не служат. Диалог (ответы списком, как меню, имя мелкой подписью), циферблат рыбалки и экран показателей верфи — стекло.\n- 2026-11-13: вся бумага интерфейса становится стеклом: бумажных вещей, скотча и рукописного шрифта в нём не остаётся. Карта — прозрачное стекло, на котором берег, глубины и отметки нарисованы светом; судовой журнал — окно матового стекла со строками; продажа — экран торговца ([Добыча](../gameplay/haul.md)).\n\n## Как устроено\nРешения без владельца: что считается базовым компонентом ([Q161](../questions/interface.md#q161)); рецепт стеклянных плиток и движения ([Q160](../questions/interface.md#q160)); меню, колпачки, выноски и карточки верфи в стекле ([Q166](../questions/interface.md#q166)); диалог и радио в стекле ([Q171](../questions/interface.md#q171)); панель показателей верфи ([Q172](../questions/interface.md#q172)); окна инструментов в стекле выносок ([Q58](../questions/interface.md#q58)); что держит тема ([Q173](../questions/interface.md#q173)); последние глянцевые детали HUD ([Q175](../questions/interface.md#q175)); экран торговца ([Q176](../questions/haul.md#q176)); журнал, карта и мелкие бывшие бумажные вещи в стекле ([Q178](../questions/interface.md#q178)); HUD в стекле ([решено 11-12](../decisions.md)).\n\n### Тема\nВесь облик интерфейса лежит в одном файле — теме Godot `game/ui/look.tres`; код читает её через `ui/Look.cs`. Правка файла меняет игру без сборки: она читает его при старте.\n- **Палитра** (тип `Hue`): цвет на каждую роль. Имена ролей и их смысл — в `ui/Hue.cs`, значения — в теме ([Палитра](palette.md)).\n- **Шрифты** (тип `Faces`): по одному на начертание: обычный, средний, жирный, капители (одни: `caps`), антиква и другие; рукописного нет. Основной шрифт — файл `nunito` в начале темы.\n- **Роды стекла** — стилбоксы двух своих классов с настоящими числами: `clear` (плитки, пилюли, карточки, кошелёк) и `frosted` (выноски, реплика диалога, окна инструментов и их листы) — стекло, которое читает экран (`GlassKind`); `hud` — стекло HUD (`LensKind`). В стилбоксе всё, что решает вид материала: сколько сцены закрывает оттенок, смягчение, изгиб и глубина кромки, дым, тень, блики, пойманный свет. Деталь называет свой род, а чисел не держит.\n- **Детали** (типы `Tile`, `Menu`, `Pill`, `Card`, `Purse`, `Balloon`, `KeyCap`, `Dial`, `Kit`, `Slot`, `Wheel`, `Plate`, `Notice`, `Speech`, `Radio`, `Stats`, `LineDial`, `Dash`, `Markers`, `ToolWindow` и другие): размеры, скругления, зазоры и кегли в целых пикселях, род стекла, и доли вроде дыма панели — в сотых (`Kit/constants/smoke = 70`).\n- **Общее для нескольких деталей**: `Screen` — поля и виньетка всякого полноэкранного экрана (верфь, вид сбоку); `Note` — панель-список HUD в углу экрана (`ListPane`): цели в бою и дело вида сбоку; `Motion` — общие длительности движения, в миллисекундах; `Light` — место единственного света над экраном, который ловит всякое стекло.\n- **Окна инструментов** целиком из той же темы: собственные элементы Godot (кнопка, поле, выбор, число, ползунок, переключатель, список, вкладки) получают облик по своим типам и вариациям темы (`Window.Theme`), без правок на каждом элементе; их размеры и кегли — в типе `ToolWindow` и типах Godot.\n- Чего в теме нет: пружин и собственной хореографии детали (они в `ui/Motion.cs` и в самой детали), пропорций внутри рисунка (штрихи пиктограмм, дуги циферблатов, ширина кромки) и долей внутри шейдеров. В теме то, что меняют при смене облика: цвета, шрифты, кегли, размер, углы, поля и зазоры детали, её тень, насколько она дымчата или притемнена.\n- Четыре главные ручки: прозрачность стекла — `CoverTop` и `CoverFoot` рода `clear`; дым HUD — `SmokeKeepsTop` и `SmokeKeepsFoot` рода `hud` и `smoke` у каждой детали; акценты — `Hue/colors/player`, `hostile`, `aim`, `aqua`; основной шрифт — файл `nunito`.\n- Другой материал вместо стекла всё ещё потребует нового рисования, но в двух компонентах стекла (`Glass`, `Lens`), а не в каждой детали.\n\n### Стекло\nСтекло двух родов:\n- **Читает экран** (`Glass`, `ui/glass.gdshader`; выноски, реплика диалога, окна инструментов и их листы — `ui/frosted.gdshader`; общее — `ui/glass.gdshaderinc`): сцена за стеклом чуть смягчена и преломлена по толстой кромке. Так сделаны плитки, пилюли, карточки и выноски: там преломление и есть облик. Цена — разрыв рисования слоя (всё нарисованное под первым стеклом проходит по экрану отдельно, около 0,4 мс при 3024×1964) и копия экрана, сколько бы стёкол в слое ни было. У причала, торговца и меню копируется только прямоугольник, который стекло читает (`ui/Behind.cs`, `BackBufferCopy`); верфь копирует весь экран, её стекло лежит почти по всему. Стекло читает экран только внутри своей формы; поля четырёхугольника рисуют лишь тень, кромку и свечение. Поэтому на каждом экране такой слой один, а ушедшие плитка и кошелёк ничего не рисуют; слой ленты причала прячется, пока её накрывают верфь, торговец или меню.\n- **Смешивается со сценой** (`Lens`, `ui/lens.gdshader`; форма и свет — `ui/glass_shape.gdshaderinc`): сцена видна сквозь стекло как есть, без преломления; толщину кромки дают тень внутри неё, серп света и ответный блик. Так сделан HUD в бою: он стоит около 0,1 мс кадра. С чтением экрана он стоил 1,0 мс, и вся цена была в копии экрана. Все стёкла одной части HUD рисует один материал: форму и состояние каждого несёт его четырёхугольник.\n\nПлитки, карточки, пилюли, кошелёк, выноски и экран торговца рисуются заново, только когда меняется нарисованное (`ui/Redrawn.cs`): стекло, картинка и слова лежат на своих холстах, а пружины и дыхание двигают их, не перерисовывая. Так интерфейс в покое не стоит главному потоку почти ничего.\n\nСлова на стекле белые, с тёмным ореолом своей формы и тонкой тёмной тенью (`Pill.Engrave`): так они читаются и над песком, и над пирсом, и над глубокой водой. Тёмные слова остались только на матовой выноске. Так пишется всё на стекле: и HUD, и буквы колпачков клавиш; слова прямо над водой — со своей тёмной каймой (`Style.Write`).\n\nВ стекле:\n- **Стеклянная плитка** (`Ribbon`, `Glass`): кнопки причала и места верфи. Сквозь неё ясно видна лагуна, чуть смягчённая, под едва заметным аква-оттенком; толстая кромка преломляет то, что под ней, как край волны на образце, с лёгким цветным разводом; внутри нижнего края тень для глубины; серп света в двух пикселях под верхней кромкой, толще и ярче посередине и сходящий на нет к углам, от одного света над экраном, поэтому на каждой плитке блик лежит чуть иначе, и слабый ответный блик на нижней правой кромке; мягкая тень на воде. Состояния: покой; под указателем (чуть светлее и выше); выбрана (в стекле пойман свет лагуны, светлый сверху, где видна вода, и глубже в полосе за словами, мягкое свечение вокруг, приподнята, у краёв медленно всплывают и гаснут пузырьки); нажата (сжата к низу, пружинит назад чуть больше своей формы, пиктограмма приседает и садится на кадр позже, по контуру бежит рябь света, из точки нажатия наружу всплывают пузырьки); путь вперёд (прозрачная сверху, оранжевый свет поднимается снизу примерно на треть, кромка тёплая, шевроны каждые несколько секунд подаются вперёд); путь вперёд выбран (насыщенный оранжевый свет, сверху видна вода, мягкое свечение вокруг, без пузырьков).\n- **Строка меню и пилюля** (`Menu`, `Pill`): невыбранный пункт меню — только слова. Стекло видно под линзой света и на выбранном пункте: прозрачная пилюля, сцена преломлена по кромке. Выбранная пилюля светом не наливается: свет сидит в самом стекле — тонкая светлая кромка, ярче со стороны света, свет у кромки изнутри и мягкий блик на верхней половине; когда пункт становится выбранным, по стеклу один раз пробегает узкий косой блик. Свечения вокруг пилюли нет; на сцене под столбцом — лишь слабый отсвет линзы. Сколько чего, лежит в теме, тип `Pill` (`fill` 0 — свет не наливается). Так же выбраны строка журнала (её тёмные слова остаются тёмными) и ответ диалога. Пилюля, которую жмут клавишей («Готово» верфи, «Продать всё» торговца), — прозрачное стекло всегда: под указателем у неё та же кромка и блик, путь вперёд светится оранжевым снизу, неактивная бледнеет. Плитки и карточки верфи, выбранные, по-прежнему наливаются светом лагуны (решение без владельца, [Q277](../questions/interface.md#q277)).\n- **Переключатель, шкала и стрелки** (`Gloss.Switch`, `Gloss.Gauge`, `Gloss.Nudger`, `Gloss.Bead`): маленькие прозрачные стёклышки с тонкой кромкой и бликом. Ручка переключателя — белое стекло на пружине; включённый светится зелёным.\n- **Колпачок клавиши и подсказки** (`Gloss.Key`, `Gloss.Cap`, `Gloss.Hints`, `Buttons`): дымчатое стекло с белыми буквами, как у кошелька; кнопки A, B, X и Y геймпада — стеклянные бусины цветов палитры: зелёная, красная, синяя и золотая.\n- **Выноска** (`Balloon`, `Gloss.Balloon`): стекло, прозрачное у кромки и матовое глубже, под бледной аквой; матовость идёт по её собственному контуру. Слова тёмные. С предупреждением — золотая кромка и знак. Бумажной бирки больше нет: имена товарищей у пирса — та же стеклянная выноска.\n- **Карточка** (`ui/Card.cs`): общая стеклянная карточка: детали верфи (`Choices.Choice`), ящики и товары экрана торговца. Под фокусом наливается светом лагуны и светится вокруг; установленная деталь — тонкое оранжевое кольцо и оранжевый свет снизу; некупленная — матовая под замком; товар, которого не надо, стоит бледным (`Card/faded`). Цена — на ярлыке белого стекла с монетой (`Purse.Tag`), зелёная или красная ([Верфь](../base/boatyard.md)).\n- **Кошелёк** (`Purse`): пилюля из дымчатого стекла (глубокая на светлом небе), белое число, яркий золотой жетон с бликом.\n- **Подпись** (`Quayside`): над лентой причала — квадратные точки по числу плиток, выбранная залита, и «// что делает плитка» мелкими капителями.\n- **Пиктограммы** (`Icons`): простые линейные рисунки в коде: ключ, двое, книга, три полосы, шевроны.\n- **Линза прибора** (`Dash`, `Lens`): корпус, нитро, топливо и дым — круглые дымчатые линзы, море видно сквозь них, к середине, за цифрами, дым гуще; показания рисуются поверх. Нитро в работе наливает линзу оранжевым, дым — аквой; лампа топлива — своя маленькая линза, золотая, пока топлива мало, красная, когда бак сух, и дымчатая, пока не горит; удар пускает по линзе корпуса кольцо света. Подписи под приборами — мелкие белые капители с тёмным ореолом (`Gloss.Caption`), без плашки; трещина топливного стекла осталась ([HUD](../interface/hud.md)).\n- **Шкала радио** (`Tuner`, `Lens`, тип `Tuner`): маленькая дымчатая пилюля слева от приборов, как уведомление: круглая линза с мачтой и волнами, подпись капителями, точки станций и название белыми словами ([HUD](../interface/hud.md)).\n- **Ромб рулетки** (`Roulette`): дымчатое стекло, выбранный ловит свет лагуны, по нему проходит блик (`Gloss.Glint`); лампы гнёзд дронов — маленькие линзы своего смысла; указатель — плоский оранжевый треугольник.\n- **Плитка расходника и слот трюма** (`KitBar`, `HoldRow`): маленькие стёкла. Плитка ловит свет, ближайший к цвету её расходника, гуще у дна: ярко, пока его можно взять, слабо, пока нет; пустой слот едва виден.\n- **Уведомление и табличка** (`Toasts`, `Markers`): дымчатые стеклянные пилюли с белыми словами. Табличка ловит цвет своего смысла: красный охотника, золото цели, акву союзника; предупреждение — красный. Значок уведомления — круглая линза в свете своего вида. Предложение работы под лодкой лежит на такой же пилюле. Метки и таблички редактора карт на море — то же стекло.\n- **Строка диктора** (`Banner`, тип `Banner`): крупные белые слова антиквой прямо над морем, с тёмным ореолом своей формы; под ними линия света и подпись на маленькой табличке стекла HUD (`Lens`), которая ловит свет смысла, как табличка лодки; по ней проходит блик (`Gloss.Glint`). На верстаке `Components` — кадр `banner` ([HUD](../interface/hud.md), [Q209](../questions/interface.md#q209)).\n- **Диалог** (`talk/Dialogue.cs`, тип `Speech`): выноска реплики — матовое стекло подсказок (`Gloss.Balloon`), крупнее, хвост к говорящему, буквы тёмные; имя — мелкая подпись прописными над выноской, белая с ореолом; ответы — список, как меню (`Pill.Row`), выбранный на стеклянной пилюле с кромкой и бликом, у каждого бледная цифра; Enter — клавиша дымчатого стекла (`Gloss.Key`). Стекло видит притемнённый мир и портреты: под ним экран копируется только в его прямоугольнике (`BackBufferCopy`) ([Диалог](../story/dialogue.md)).\n- **Радио** (`talk/Radio.cs`, тип `Radio`): стекло HUD (`Lens`): реплика белыми буквами с ореолом на дымчатой панели, портрет в стеклянной рамке, имя — та же мелкая подпись.\n- **Экран показателей верфи** (`StatsPanel`, `Glass`, тип `Stats`): высокая панель стекла карточек, затемнённая под белые слова с тёмным ореолом. Показатели — полоски стекла, залитые аква; изменение от подсвеченной детали зелёное или красное. Нагрузка и лампа — стеклянные бусины (`Gloss.Bead`). Имя — мелкими белыми капителями над панелью, номер — на круглой стеклянной бусине цвета полосы корпуса. Значки деталей (`Badge`) — тоже бусины ([Верфь](../base/boatyard.md)).\n- **Циферблат рыбалки** (`LineDial`, `Lens`, тип `LineDial`): круглая дымчатая линза, как приборы лодки, стрелка та же; лампа — маленькая линза, ловящая красный, пока рыба рвётся.\n- **Окно инструмента** (`Window`, `Pane`, `ui/frosted.gdshader`, тип `ToolWindow`): то же матовое стекло, что у выносок, со своим радиусом углов. Заголовок — тёмные слова на стекле над гравированной линией, закрыть — стеклянная бусина с крестиком. Кнопки — прозрачные стеклянные пилюли, которые под указателем наливаются светом лагуны, путь вперёд — оранжевым; поля, выборы и числа — вдавленное стекло с тёмными словами; переключатель — `Gloss.Switch`, ползунок — стеклянная ручка на дорожке, залитой светом. Внутри окна ничего не читает экран. На верстаке `Components` — кадр `tools`.\n- **Экран торговца** (`ui/Counter.cs`, тип `Trade`): портрет и реплика торговца — портрет и матовая выноска диалога (`Speech`); карточки трюма и товаров — `Card`; «Продать всё» и «Готово» — пилюли с клавишами; кошелёк — `Purse`; всё стекло в одном слое холста ([Добыча](../gameplay/haul.md)).\n- **Судовой журнал** (`ui/Logbook.cs`, `ui/SaveRow.cs`, тип `Logbook`): панель того же матового стекла, что и окна; каждый слот — строка со снимком лодки со скруглёнными углами и тёмными словами, выбранная строка — строка меню (`Pill.Row`), с кромкой и бликом и тёмными словами, к ней скользит линза; «Сохранить сюда», «Загрузить» и «Новая игра» — обычные пилюли `Pill`, предупреждения — стеклянная выноска ([Экраны и меню](../interface/screens.md)).\n- **Значок шторма** (`Gloss.Storm`): глянцевая туча из тёмно-синего стекла, от светлого верха к глубокому низу, с бликом на каждом клубе и золотой молнией под ней; вспышка подсвечивает молнию и тучу изнутри. На карте и на стенде `Components`.\n- **Стрелка лодки** (`Gloss.Pointer`): глянцевая стрелка цвета смысла по курсу лодки — гель от светлого верха к глубокому низу, белая кромка с тёмной обводкой, блик на верхней половине, мягкий ореол того же цвета вокруг. Своя лодка — оранжевый игрока, товарищ — аква. Размер на карте — `Map/boat` в теме. На карте и на стенде `Components`.\n- **Карта** (`MapView`, `MapPlot`, тип `Map`): большое стекло HUD (`Lens`): сквозь него видно море, а суша, берег, изобаты, мели, сетка и роза ветров нарисованы на нём светом из `Aqua` и `White`; гавань — оранжевое кольцо, задания — золотые, штормы — светлое облако со светящимся краем, значок и стрелка хода, лодки игроков — стрелки лодок, слова — белые с ореолом. Пока она открыта, отметки и уведомления под ней гаснут, а мир за ней в мягком фокусе ([Добыча](../gameplay/haul.md)).\n- **Список** (`ListPane`, тип `Note`): дымчатая панель HUD слева вверху, заголовок капителями, строки белыми словами с ореолом, счёт справа. У строки, которую можно выполнить, — круглая линза; выполненная наливается зелёным, в ней проступает галочка, строка тускнеет. Цели в бою (`Objectives`, падает сверху и уходит вверх) и вид сбоку.\n- **Карточка улова** (`HaulCard`, тип `HaulCard`): дымчатое стекло HUD, ровная; образец в скруглённом окне с водой, название и факты белыми словами, подписи капителями.\n\nНе стекло: только монета кошелька (`Gloss.Bubble`), глянцевый кружок самой вещи. Старые глянцевые и бумажные приёмы живут лишь на стенде кандидатов `Menus` (`demos/Menus/Looks/Old.cs`); игра их не несёт.\n\n## Движение\nПримитивы в `ui/Motion.cs`: именованные длительности, значения которых лежат в теме (тип `Motion`): (`Quick` — нажатие, `Brisk` — свет и затухание, `Settle` — возврат на место, `Arrive` — приход и уход вещей экрана), шаг между вещами, приходящими по очереди (`Stagger`), появление вещи (`Pop`), раскрытие и складывание листа (`SheetOpen`, `SheetClose`), медленное дыхание (`Breath`) и пружины `Spring` трёх настроек: `Snappy` (выбор скользит, чуть проскакивая), `Bouncy` (вещь прилетает, проскакивает и садится), `Soft` (без перелёта). Пружины шагают мелкими равными долями, поэтому одинаковы при любой частоте кадров.\n\nПравила:\n- Всё приходит с замедлением и чуть проскакивает; вещи появляются по очереди. Страница меню приходит целиком не дольше полсекунды; надпись строки и её переключатель приходят вместе.\n- Выбор скользит: свет выбранной плитки или пилюли приходит быстро, с замедлением к концу, прежней гаснет чуть медленнее (`Motion.Toward`), а между ними по ряду и узким свечением по воде в промежутках проезжает линза света, появляясь вместе со своей плиткой; плитки по пути не загораются. Клавиши, стик и указатель двигают её одинаково. Подпись едет за линзой и меняет слова, когда свет над плиткой. В меню линза скользит по столбцу, и стекло пункта видно, только пока она над ним; по ряду карточек верфи она идёт к карточке под фокусом.\n- Нажатие сжимает плитку к низу и отпускает с пружиной чуть дальше формы; слова отстают на кадр; по контуру бежит рябь света, всплывают пузырьки. У пилюли и карточки вспышка и рябь сильнее, пузырьков два, крупных.\n- Приход: плитки поднимаются по очереди, один раз проскакивают и садятся, слегка вырастая. Уход: ряд замирает на миг, плитки опускаются по очереди, выбранная приподнимается и тает, кошелёк уезжает вверх, слова и подсказки уходят вниз вместе с рядом.\n- Меню уходит, а не пропадает: закрываясь, оно сразу перестаёт слушать клавиши и указатель (`Menu.Close`, `Menu.Shown`), а пункты уходят влево и тают снизу вверх, вместе с заголовком, затемнением и подсказками. Другая страница меню приходит каскадом, пока прежняя быстро уходит влево и тает (`Pill.Leave`); страница, показанная заново на месте (изменили настройку), меняется сразу. Времена — в теме, тип `Menu` (решение без владельца, [Q278](../questions/interface.md#q278)).\n- В покое экран живёт: плитки чуть покачиваются, шевроны «Отчалить» подаются вперёд, одна полоса света иногда проходит вдоль всей ленты.\n- Монеты набегают, жетон переворачивается, число подпрыгивает.\n- HUD в бою спокоен: из нового движения там только кольцо света по линзе корпуса при ударе и строка диктора, которая приходит чуть крупнее и садится, а её линия света разбегается от середины.\n- Между игроком и тем, что он нажал, не больше полсекунды; действие не ждёт анимации.\n- Движение только рисуется: области нажатия стоят на месте под указателем.\n\n## Открытые вопросы\n- [Q58](../questions/interface.md#q58): окна инструментов.\n- [Q160](../questions/interface.md#q160): стеклянные плитки и движение.\n- [Q161](../questions/interface.md#q161): базовые компоненты.\n- [Q166](../questions/interface.md#q166): меню, колпачки, выноски и карточки верфи в стекле.\n- [Q171](../questions/interface.md#q171): диалог и радио в стекле.\n- [Q172](../questions/interface.md#q172): панель показателей верфи.\n- [Q173](../questions/interface.md#q173): что держит тема.\n- [Q174](../questions/interface.md#q174): цвета-сигналы мира; импульсная башня в цвете, близком к акве.\n- [Q175](../questions/interface.md#q175): последние глянцевые детали HUD стали стеклом.\n- [Q176](../questions/haul.md#q176), [Q177](../questions/haul.md#q177): экран торговца и цены «Марии».\n- [Q178](../questions/interface.md#q178): журнал, карта, список, подписи и карточка улова в стекле.\n- [Q206](../questions/interface.md#q206), [Q209](../questions/interface.md#q209): шкала радио и строка диктора.\n- [Q277](../questions/interface.md#q277): тихий выбор только у пилюль; плитки и карточки верфи наливаются светом.\n- [Q278](../questions/interface.md#q278): уход меню, смена страницы, «Выход» отдельно, заголовок над столбцом.\n- [Q290](../questions/interface.md#q290): лодки игроков на карте стрелками.\n"}, {"id": "art-interface", "path": "art/interface.md", "title": "Стиль интерфейса", "section": "art", "date": "2026-11-16", "md": "# Стиль интерфейса\n\nИз чего сделан интерфейс и как он выглядит. Что где на экране: [HUD](../interface/hud.md), [Экраны и меню](../interface/screens.md).\n\n## Решения владельца\n- Интерфейс был задуман из вещей мира: старая печатная карта, найденные и починенные приборы (2026-11-02). С 2026-11-13 бумаги в нём нет: всё — стекло ([Компоненты](components.md)).\n- Образцы интерфейса — Frutiger Aero и Utopian Scholastic: оптимистичный глянец 2000-х, аква, небо и природа вместе с техникой и классическая антиква обучающих программ той эпохи.\n- 2026-11-11: интерфейс — прозрачное стекло Frutiger Aero с красивым движением, начиная с кнопок базы; официальная палитра и базовые компоненты ([Палитра](palette.md), [Компоненты](components.md)).\n- 2026-11-12: стекло перенесено на меню, карточки деталей верфи и HUD.\n- 2026-11-13: вся бумага в интерфейсе становится стеклом; квиток, его штамп и скотч ушли совсем ([Добыча](../gameplay/haul.md)).\n- 2026-11-12: у игры одна тема Godot со всем обликом, чтобы он менялся быстро и его не приходилось переносить по частям; стекло чуть менее прозрачно.\n- Выноска везде одна, стеклянная (2026-11-13; бумажной бирки больше нет). Предупреждение несёт свою метку, маленький знак предупреждения, и золотую кромку.\n- В интерфейсе простые слова (влево, вправо, старт, цель), и ни одна другая игра не называется ни в интерфейсе, ни в коде, ни в вики.\n- Шрифт интерфейса — Nunito: владельцу он нравится (2026-11-16, после того как он посмотрел семь других открытых шрифтов).\n\n## Как устроено\n- **Тема.** Весь облик — палитра, шрифты, роды стекла, размеры деталей — лежит в одной теме Godot, `game/ui/look.tres` ([Компоненты](components.md)).\n- **Цвета** — из палитры (`Hue`, [Палитра](palette.md)). **Стекло** — плитки, меню, карточки верфи, выноски и колпачки клавиш (`Glass`, читает экран и преломляет сцену) и HUD в бою (`Lens`, только смешивается со сценой); что в стекле, а что ещё в старом глянце: [Компоненты](components.md).\n- **Облик** (`Style`, `Gloss`): вещи мира в духе Frutiger Aero и Utopian Scholastic. Слова набраны Nunito поверх мягкой тёмной кромки, чтобы читались на бликах и пене. Начертаний три — обычное (500), среднее (650) и жирное (800), плюс капитель с разрядкой того же жирного веса; заголовки — EB Garamond 500. Размеры — одна шкала: 11, 13, 14, 16, 18, 20, 24, 28, 36, 48 и 76 пикселей; переключатели и списки в окнах-инструментах пишут как кнопки, а слова, которые окно рисует само, — как его подписи. Чего нет в теме, `Look` не подменяет начертанием и размером по умолчанию, а сразу падает; приборы — глянцевая аква под стеклом; EB Garamond — для печати старого мира и заголовков (`assets/fonts/`). Тени мягкие (`Gloss.Shadow`). Клавиши показаны на колпачках из дымчатого стекла (`Gloss.Key`, `Gloss.Hints`; кнопки геймпада на своём месте, см. [Управление](../interface/controls.md)), клавиши экрана — вдоль его низа слева (`Gloss.Foot`). Цвет детали (`Hue.Of`) не берёт ни враждебный красный, ни оранжевый игрока.\n- **Выноски** (`Balloon`, `Gloss.Balloon`): стеклянная плашка с хвостиком к тому, о чём она говорит (в диалоге — прежняя глянцевая аква-плашка); предупреждение обведено золотом под маленьким золотым знаком (`Gloss.Caution`).\n\n## Как к этому пришли\n- 2026-10-26: тёмные стеклянные карточки отвергнуты; HUD стал тонкими светящимися линиями; 2026-10-29 этот образец снят ([Арт-дирекшн](README.md)).\n- 2026-11-02: владелец выбрал интерфейс как вещи мира: старая карта на базе, на море — кластер глянцевых аква-приборов. Шрифты он оставил на наш выбор: Nunito, Caveat, а для печати старого мира сначала Saira. В тот же день Frutiger Aero и Utopian Scholastic стали образцами, и EB Garamond заменил Saira.\n- 2026-11-03: тем же стилем переделаны сеть, карта на море, рулетка и окна инструментов.\n- 2026-11-08: сеть заменена трюмом; его экран — глянцевый аква-прибор с сеткой клеток ([Добыча](../gameplay/haul.md)).\n- 2026-11-11: экрана трюма и сетки больше нет; добыча — ряд слотов на HUD над панелью расходников ([Добыча](../gameplay/haul.md)).\n- 2026-11-06 — 2026-11-07: владельцу не нравятся меню и кнопки; построены варианты на выбор ([Кандидаты на облик](candidates.md)).\n- 2026-11-11: кнопки базы и места верфи стали прозрачными стеклянными плитками с движением; палитра собрана в одном месте.\n- 2026-11-12: весь облик собран в одной теме Godot, чтобы менять его одной правкой; стекло стало чуть менее прозрачным.\n- 2026-11-12: в стекле меню, колпачки клавиш, выноски, карточки верфи и HUD. Проверка облика в два круга; HUD отказался от преломления ради времени кадра.\n\n## Открытые вопросы\n- [Q159](../questions/interface.md#q159), [Q160](../questions/interface.md#q160), [Q161](../questions/interface.md#q161): палитра, стекло и движение, компоненты.\n- [Q166](../questions/interface.md#q166): меню и верфь в стекле. HUD остаётся стеклом без преломления, а диалог, циферблат рыбалки и показатели верфи переходят в стекло ([решено 11-12](../decisions.md)).\n- [Q55](../questions/interface.md#q55): полировка интерфейса.\n- Облик меню: [Кандидаты на облик](candidates.md).\n"}, {"id": "art-light", "path": "art/light.md", "title": "Свет и время суток", "section": "art", "date": "2026-11-16", "md": "# Свет и время суток\n\nОдно небо и одно солнце на всю сцену; час суток держится весь заход.\n\n## Решения владельца\n- Каждый час суток выглядит правильно. Ночь для скрытности появится позже.\n- Время суток идёт: сутки за 12 минут игры (2026-11-16). Сменено: час держался на месте весь заход.\n- Ночь лунная и синяя: прохладный лунный свет с серебряной дорожкой бликов на воде, заметно темнее дня, но всё читается.\n- Рассвет и закат тёплые и проходят через сумерки в синюю ночь.\n- Все модели, и из Blender, и построенные в коде, несут запечённое затенение неба: свет неба гаснет в углах, под палубами, в комнатах и между листьями. Оно гасит только свет неба, а тени солнца и луны остаются живыми, поэтому верно в любой час, и когда солнце и луна будут двигаться (2026-11-16).\n\n## Как устроено (`sky/`)\n- **Ход суток** (`World._Process`, `Daylight.HourAfter`): час идёт по часам боя, у гостя по часам хоста, от часа локации. Сутки — 12 минут, но часы ночи идут втрое с половиной быстрее часов дня: светлая часть суток длится около восьми с половиной минут, ночь — около двух с половиной, каждые сумерки — около получаса минуты. Мир начинается в 13:00, так что первые минуты — день, а закат приходит минуты через три с половиной. Темп ночи и час начала — решение без владельца, [Q287](../questions/world.md#q287). Солнце поднимается и садится на одном азимуте, как и прежде, свет, экспозиция и каустика идут за ним каждый кадр, а карта неба перерисовывается, когда час ушёл на несколько минут. В редакторе карт час стоит на часе локации. После загрузки сутки начинаются снова с часа локации: решение без владельца, [Q276](../questions/world.md#q276).\n\nОдно небо на всю сцену и на отражение в море: модель Godot PhysicalSkyMaterial, посчитанная по каждому направлению (`sky/sky.gdshaderinc`), её параметры заданы для удерживаемого часа. Почему не симулированная атмосфера: игрок видит небо в основном в море, с большой высоты, в один час. `Daylight` (`sky/Daylight.cs`) держит солнце на час карты (`Hour` в её JSON; у мира 13:00) и мерит экспозицию по серой карточке, под собственным контрастом AgX: подъём мягкой кривой смыл море в серое ([Q77](../questions/world.md#q77)). Тени облаков плывут по всему, что солнце освещает, по ветру (`sunlight_clouded`): их бросают кучевые облака, те же, что рисуются в кадре ([Погода](../world/weather.md)), по лучу к солнцу. На воде тень гасит и часть света неба, отражённого и рассеянного, поэтому в облачную погоду пятна на море хорошо видны. Вид настроен на дневное солнце коралловой отмели (`HeldHour`); в другие часы солнце держит это направление, и меняется только его высота. Низкое солнце согревает воздух и море, но вода под ним держит свой синий и не становится хаки: закат читается в отражённом небе, бликах и пене (`sea_weathered`, `waters/sea.gdshader`). Демо `Lights/Dawn` и `Lights/Dusk`. Ночью полная луна освещает сцену как прохладное солнце на месте удерживаемого, а кадр сидит на два стопа ниже дня, как кино снимает день под ночь; сумерки переходят от солнца к луне. Ночное небо темнее и синее дневного под тем же светом (`NightSky`), а экспозиция меряется как под дневным небом, поэтому тени и отражённое в море небо темнеют. Блики луны впятеро сильнее её доли света (`NightGlitter`, через `LightSpecular` луны): ночью глаз видит блеск на воде, которую саму почти не видит, поэтому серебряная россыпь в стороне луны и блеск на бортах выходят из темноты. Почему не темнее: уже на двух с половиной стопах тёмные корпуса охотников теряются на ночной воде. Своих огней у лодок ночью нет ([Q261](../questions/world.md#q261)). Звёзд нет, тумана нет. Твёрдые поверхности, и лодки тоже, освещает `sky/sunlight.gdshaderinc` (`common/Surfaces.cs`, `common/surface.gdshader`), под водой — `waters/underwater.gdshaderinc`. Стекло станции — тот же шейдер, видимый насквозь (`common/glass.gdshader`, [Станция](../world/outpost.md)). Дутое стекло поплавков — он же, сплошной, но пропускающий солнце (`common/blown.gdshader`, [Гавань](../base/pier.md)). Godot не переимпортирует `.glsl`, когда меняется включаемый им `.glslinc`: после правки include тронь файлы `.glsl`.\n\n**Затенение неба.** Каждая модель знает, сколько неба видит каждый угол каждой её грани: лучи над гранью на пару метров, близкое попадание гасит больше дальнего. Лучи выходят не из самого угла, а с трети пути к середине грани, чтобы перила и доски считались вдоль себя, а не в стыках. Игра рисует обе стороны грани, и обшивка, повёрнутая внутрь, выглядит так же верно, поэтому затенённая сторона пробует и обратную и берёт ту, что открыта; у сплошного тела обратная сторона упирается в его же нутро. В общей вершине гладкой поверхности одно значение. Число лежит в первой UV вершины, и шейдер поверхностей (`common/surface_shading.gdshaderinc`) гасит им только свет неба. Модели из Blender запекают его при записи (`occlude` и `export` в `tools/dock.py`, их зовёт каждый скрипт модели), сетки, которые игра строит сама, — при сборке (`Shapes.Commit`, `common/Occlusion.cs`, по тому же правилу); лодка запекается один раз на проект. Земля запекает его при загрузке локации по той же сетке высот, что читает море (`islands/GroundOcclusion.cs`, `ground.gdshader`): те же лучи, но дальше, потому что сетка грубее метра, и только на суше и мелководье; так темнеют овраги, подножия скал и столбов. Корни мангров темнеют под кронами по тому, сколько неба закрывает крона над ними (`Mangroves.Overhead`); кроны затеняют себя сами, как лес. Стёкла станции не затеняют и не затеняются. Почему запечённое, а не экранное: экранное затенение (SSAO) на виде боя почти не видно, свет, отражённый в экране (SSIL), стоит миллисекунды, а запечённое в кадре ничего не стоит.\n\nТени солнца подгоняются под вид, который рисует кадр (`Daylight.Fit`, перед каждой отрисовкой, когда все виды уже встали). Карты теней тянутся до места, где вид в последний раз видит дно моря, а не на постоянную дальность. Вид издалека сверху (бой, причал и верфь, редактор карт, кадры вставок) видит море почти на одной дальности и берёт одну карту во весь атлас. Вид, который видит и лодку рядом, и горизонт (вид сбоку), берёт две карты, ближнюю и дальнюю, и тени не дальше предела. Почему: постоянная дальность клала весь бой в дальнюю карту, растянутую до предела, и края теней шли ступенями. Карты держат небольшой запас, чтобы тряска и покачивание вида не меняли их размер: карта, меняющая размер каждый кадр, ползёт по краям теней.\n"}, {"id": "art-materials", "path": "art/materials.md", "title": "Материалы", "section": "art", "date": "2026-11-16", "md": "# Материалы\n\n![Палуба ялика из выгоревшего тика у пирса](../img/materials.jpg)\n\nИз чего сделаны твёрдые поверхности сверх краски: дерево и металл. Свет на них — [Свет и время суток](light.md).\n\n## Решения владельца\n- Дерево похоже на дерево: видны доски и швы, волокна только вблизи, тон немного разный от доски к доске. Дерево — выгоревший тик (2026-11-16).\n- Металл блестит (2026-11-16). Если блеск дорог для кадра, он не нужен: металл видно в основном издалека; его можно включать по условию.\n- Только шейдер, без скачанных текстур (2026-11-16).\n\n## Как устроено\n- **Из чего грань** (`Grain` в `common/Shapes.cs`, отделка `WOOD` в `tools/dock.py`): рядом с затенением неба, вторым числом первой UV, каждая грань несёт, из чего она: ничего, кусок дерева с волокнами вдоль оси X, Y или Z своей модели, или доски вдоль неё. Модели из Blender берут ось по самому длинному ребру грани с отделкой `WOOD`; у форта это его `WOODY`. Лодки помечают деревянные палубы (`Finish.Deck`), банки и пиратский рангоут (`Finish.Teak`).\n- **Дерево** (`common/materials.gdshaderinc`): узкие доски с чёрной конопаткой по кромкам и стыками вразбежку, у каждой доски свой тон, серость и шероховатость, волокна — тонкие полосы шума вдоль доски. Узор лежит в координатах модели, поэтому не плывёт по качающейся лодке. Всё, что мельче пикселя, сходится к своему среднему: с высоты боя видны тон палубы и полосы досок, швы — ближе, волокна — только вблизи.\n- **Палубы** (`Livery.Teak`, `Livery.Planked`): у ялика, канонерки и рабочих лодок — доски выгоревшего тика, у пиратов — смолёные доски, остальные палубы крашеные ([Облик лодок](boats.md)).\n- **Металл**: в карте отражений неба под горизонтом почти чёрное, и сталь отражала его, как тёмный пластик. Теперь металл отражает под горизонтом море по свету неба у горизонта; считают это только пиксели металла (`material_sea`). Полированная сталь, хром и латунь глаже прежнего, чугун остался шершавым. Крашеные детали (стойки ракет, ракеты) — краска, а не металл.\n"}, {"id": "art-palette", "path": "art/palette.md", "title": "Палитра", "section": "art", "date": "2026-11-16", "md": "# Палитра\n\n![Палитра на стенде Components](../img/palette.jpg)\n\nОфициальная палитра игры: каждый цвет интерфейса назван по своей роли. Имена ролей — в `game/ui/Hue.cs`, значения — в теме игры `game/ui/look.tres` (тип `Hue`, [Компоненты](components.md)); здесь — роли. Стенд `Components` рисует хранимые цвета прямо из темы.\n\n## Решения владельца\n- 2026-11-11: у игры есть официальная палитра и базовые компоненты; интерфейс — стекло в духе Frutiger Aero ([Арт-дирекшн](README.md)).\n- Цвета держат по одному смыслу: оранжевый — игрок и захват, красный — охотники, золотой — цель и места, аква — союзники и приборы, синий — броня ([HUD](../interface/hud.md)).\n- 2026-11-13: палитра слишком большая, и не все цвета сочетаются. Не бояться убрать цвет и взять на его место другой. Оставшиеся четыре места — два жёлтых, свои цвета деталей, краски ящиков, стекло синее лагуны — взять все.\n\n## Как устроено\nРешение без владельца: какие цвета остались в палитре и чем заменены убранные ([Q159](../questions/interface.md#q159)).\n\n- **Что хранится.** Тема хранит цвет один раз. Его тона — светлый тон `Aqua` и `Lagoon`, верх и низ геля, свет смысла в стекле HUD, оттенок маленького стекла, тень, чернила предупреждения — считает `Hue.cs` из самого цвета: перекрасил цвет, и тона идут за ним. У маленького стекла тема хранит только то, насколько оно закрывает сцену.\n- **Смыслы.** `Player` — игрок, его лодка, захват, путь вперёд и нитро (шкала, расходник, припас). `Hostile` — охотники, вред и то, что хуже. `Aim` — цель миссии и места, золото. `Caution` — предупреждение и металл монет, то же золото: жёлтый в игре один. `Armour` — броня. `Aqua` — союзники и приборы, три тона: светлый для слов на тёмном стекле, основной для подсветки, глубокий для заголовка на светлом стекле (`Heading`). `Better` — то, что лучше, включено или цело: целый корпус, ремонт (расходник, припас), цена по карману; зелёный в игре один. `Muted` — выключенное.\n- **Сигналы мира.** Лампа в мире говорит цветом своего смысла: лампа мины и пойманный лучом прожектор — `Hostile`. Ракеты охотников и предупреждающее кольцо — `Hostile`, огонь ракет игрока и нитро — `Player`, лампа маяка — `Aim`. Свой цвет только у одного: `Fuel` — топливо, припас и бочка, фиолетовый. `Pulse`, холодный свет башни-импульса, — тот же цвет, что `Aqua` ([Q174](../questions/interface.md#q174)).\n- **Стекло и гель.** `Ahead` — оранжевый гель пути вперёд, тона `Player`. `Lagoon` — лёгкий оттенок стеклянных плиток над лагуной. `Caught` — свет лагуны, пойманный в выбранной плитке: сверху `Lagoon`, снизу свой, глубже; под белыми словами — глубокий тон `Lagoon`. Эти три цвета стоят между аквой приборов и водой лагуны, чтобы выбранное стекло садилось и на лагуну, и на глубокую воду. `CaughtWarm` — оранжевый свет игрока в ней же, тона `Player`. `CaughtHostile`, `CaughtAim`, `CaughtArmour` и `CaughtBetter` — свет смысла, пойманный в стекле HUD, тона своих смыслов. `Smoked` — тёмная глянцевая табличка, книзу `Night`; `Screen` — экран с подсветкой, та же табличка глубже. Маленькие стёкла считаются из этих цветов: `Bead` (дорожка переключателя, бусина шкалы, стрелка) и `Knob` (ручка) — из `White` и светлого тона `Lagoon`, `Smoke` (колпачок клавиши) — из `Screen` и `Night`, `Frosted` (выноска, некупленная деталь) — из светлого тона `Aqua`.\n- **Чернила.** `White` — блик, слова на цветном стекле, свет хрома; `Ink` — слова на светлом стекле и тень под словами на цветном; `Accent` — крупные слова реплики на светлой выноске, оранжевый игрока глубже; `Faint` — тихие слова; `Night` — ночная вода (ободок, шторка); `Shade` — мягкие тени и тёмная кромка слов, `Night` глубже; `Black` — чёрный склейки (полосы, затемнение между экранами); `Veil` — пелена над тем, что ещё не готово, из `Faint`; `WarningInk` — слова предупреждения на светлом стекле и цена, на которую не хватает монет, `Hostile` глубже.\n- **Место швартовки** ([Гавань](../base/pier.md)): стекло поплавков — `Turquoise`, `Aqua` и `Better`, огонь фонарей — `Aim` (золотой — цвет мест), латунь — `Caution`, линь — `Sand`. `Turquoise` и `Sand` — ноты мира; их же берут вещи без своего смысла.\n- **Цвета деталей** (`Hue.Of`) взяты из палитры, своих нет: корпус — `Aqua`, мотор — `Turquoise`, ракеты — `Sand`, торпеды — `Fuel`, броня — `Armour`, снасти — `Better`. Кнопки геймпада A, B, X и Y — гели `Better`, `Hostile`, `Armour` и `Aim`.\n- **Ящики трюма** (`haul/Items.cs`) красятся цветами палитры: металл — `Muted`, механизмы — `Turquoise`, электрика — `Aqua`, бочка топлива — `Fuel`, взрывчатка — `Hostile`, ткань — `Sand`, ценности — `Aim`. Провизия и находки с затонувших судов — дерево, краска своя. Заряд из взрывчатки — `Hostile`.\n- **Карта** рисует светом из `Aqua` и `White`, своих цветов у неё нет ([Добыча](../gameplay/haul.md)).\n- **Инструменты.** `Filming` — камера редактора карт: кадры вставок и круги арены, сиреневый, в стороне от фиолетового `Fuel` ([Редактор карт](../tools/map-editor.md)).\n- Оттенки там, где вещь рисуется, берутся из тонов роли или из `Lightened` и `Darkened` её цвета, а не из нового числа.\n- 2026-11-13 палитру проверил QA ([отчёт](../reports/2026-11-13-palette-audit.md)). Из 82 хранимых цветов осталось 21 (с течениями 2026-11-14 ушёл и `Boost`; 2026-11-16 в тему перенесён `Filming` редактора карт, теперь их 21): тона считаются из своего цвета, двойники слиты, близкие цвета убраны, и их места взял оставшийся.\n\nСм. также: [Компоненты](components.md), [Стиль интерфейса](interface.md).\n\n## Открытые вопросы\n- [Q159](../questions/interface.md#q159): палитра.\n"}, {"id": "art-people", "path": "art/people.md", "title": "Люди: флоппы", "section": "art", "date": "2026-11-15", "md": "# Люди: флоппы\n\n![Капитан](../img/captain.jpg)\n\nКто живёт в мире и как выглядит. Как они говорят: [Диалоги и голос](../story/dialogue.md).\n\n## Решения владельца\n- Все в мире — флоппы: каракалы, круглые и тяжёлые, с высокими ушами в чёрных кисточках, тёмными полосами от глаз к носу и светлыми подбородком и грудью. Людей нет.\n- Флоппы сидят, как сидят кошки, передние лапы рядом перед собой; никто ничего не держит (владелец, 2026-11-06). На них немного одежды мира: старого — найденной, выцветшей и залатанной, — с льном и плетёными вещами нового.\n- Каждый — свой вкус флоппы: окрас шерсти, сложение и возраст, одежда и снаряжение на нём (шляпа, очки, фартук, бухта троса, свисток). Сверху их узнают по этому.\n- Они живут в гавани, на верфи и в море: на берегах и причалах. На лодках команд не видно.\n- Они окрашены и освещены как лодки: насыщенные цвета, тот же свет.\n- Флоппы на берегах и причалах — жизнь вокруг боя, с ними не играют.\n- Их моделируют в Blender из кода, как пирс.\n\n## Как устроено\n- В мире сидят пока только флоппы-пираты у форта пиратов (`people/Floppa.cs`, модель `tools/floppas.py`, [Форт пиратов](../world/fort.md)); остальные видны только портретами в диалогах.\n\n## Портреты\n- Большие портреты для диалогов — заглушки до рисунков художника ближе к релизу. Их нарисовала локальная модель изображений по фото настоящего флоппы. С 2026-11-07 владелец запретил картинки от ИИ: новые портреты так не делаются, а уже нарисованные остаются, пока владелец не скажет иначе. Скрипты, которыми их рисовали, убраны из `tools/` 2026-11-08 и остались в истории git.\n- Портреты есть у ролей без имён: капитан, корабел, мытарь. У каждого портрета четыре лица: ровный взгляд, доволен, удивлён, сердит. У восьми капитанов-соперников свои портреты с теми же четырьмя лицами (`rival-*`, [Соперники](../gameplay/rivals.md)); охотникам на HUD достаётся случайное лицо из этих восьми ([HUD](../interface/hud.md)) ([Q7](../questions/world.md#q7)).\n- Файлы: [Ассеты](../tools/assets.md).\n\n## Открытые вопросы\n- [Q7](../questions/world.md#q7): какие ещё лица нужны портретам.\n- Кто нарисует портреты к релизу: [Чего нам не хватает](../questions/gaps.md).\n"}, {"id": "art-world-look", "path": "art/world-look.md", "title": "Облик мира", "section": "art", "date": "2026-11-16", "md": "# Облик мира\n\nКаким выглядит мир: острова, мелководье, открытое море и след лодки. Как море устроено, на странице [Море](../world/sea.md); свет и часы — [Свет и время суток](light.md).\n\n## Решения владельца\n- Мир выглядит так, как его показывают картинки меню: кремовый песок, сочная яркая зелень и пышные пальмы на острове базы, спокойное прозрачное море у островов с мягкой широкой каустикой на песчаном дне — видной, но не рябящей, и слабые тени облаков, плывущие над водой и сушей. Остров базы сохраняет своё низкое послеполуденное солнце.\n- В открытом море вода глубокая, насыщенно-синяя, с видными волнами и бликами солнца, без зерна.\n- След лодки: короткий белый бурун сразу за кормой, дальше след распадается на тонкое кружево и светлую бирюзу от пузырьков и быстро тает; никаких клякс. Пена принадлежит воде.\n- 2026-11-14: воду переделать целиком. Облик — как в Sea of Thieves: крупные плавные валы, бирюзовый свет в гребнях, белая пена узором, насыщенные цвета. В нынешней воде не нравятся рябь и зерно, плоский цвет, пена и след. Волны умеренные: хорошо видны и качают лодку, управлению не мешают. [План](../reports/2026-11-14-water-overhaul.md).\n- 2026-11-15, после плейтеста: в сравнении игрокам больше нравилось прежнее море. Новое слишком гладкое, у него не чувствуется текстура и нет бликов, а они давали морю жизнь. Образцы воды — Port Royale 4 (особенно солнце на воде), Anno 1800 и Anno 117. King of Seas слишком блёклая, Bad North — стилизация, не наша вода. Планка — лучшие инди или начальный AAA. Облик воды владелец доверил Claude и проверке облика: что улучшает вид, делается без вопроса. Эта запись меняет «без зерна» и «не нравятся рябь и зерно» выше: рябь и блики морю нужны.\n\n## Как к этому пришли\n- **Морской проход** (2026-10-29): экспозиция под удерживаемый час, прибой как боры, кусты морской травы.\n- **Картинки меню** (2026-11-06): владельцу понравился мир на картинках меню, и облик подогнали под них: песок, зелень, пальмы, каустика, мягкая светлая картинка, облачные тени. Угол и дальность камеры выбрал QA-агент за несколько проходов ([Камера и картинка](../gameplay/camera.md)).\n- **После игры** (2026-11-07): вид оказался слишком близким, а открытое море бледным. Зум и тон вернули, спокойная поверхность осталась только над банками, каустика стала мягче, пена — кружевом ([Q77](../questions/world.md#q77)).\n- **Вода заново, шаги 1 и 2** (2026-11-14): открытое море получило цвет по форме волны: гребень светится, резко спереди и тая по спине, перед ним тёмная вода, а цвет гребня держится отдельно от бирюзы мелководья; рябь перестала наклонять поверхность, блик солнца берёт цвет воды, камера стала положе, а волны локаций заданы высотой и длиной ([Q250](../questions/world.md#q250), [Q251](../questions/world.md#q251), [Q252](../questions/world.md#q252)). Проверка облика на экране владельца завернула два варианта: бирюзовые пятна на гребнях читались как мели, а плоские синие ленты — как рисунок.\n- **Вода заново, шаг 3** (2026-11-15): вся пена рисуется узором: свежая — белая с дырами, старая — кружево из нитей, под ней вода светлеет к бирюзе. На самых крутых гребнях открытого моря появились барашки: короткие кружевные полосы, которые тают за пару секунд; они реже и бледнее следа лодки и попаданий, чтобы бой читался. Прибой кладёт пену только там, где волны ломаются всерьёз, и вода у причалов чистая ([Q253](../questions/world.md#q253)).\n- **Вода заново, шаг 4** (2026-11-15): след лодки — белый бурун за кормой длиной около корпуса, который распадается на струи вдоль хода, потом на кружево над светлой бирюзой; на малом ходу остаётся одно кружево. У бортов на ходу идёт тонкая линия пены, а у лодки на волне пену бьёт о борт. Попадание оставляет на воде пятна пены и бирюзы на несколько секунд. У скал, останцев и берегов море белеет тонкой кромкой ([Q254](../questions/world.md#q254)).\n- **Поправка после плейтеста** (2026-11-15): лицо воды снова читает волны так же мелко, как прежнее море, поэтому вернулись его текстура и мягкая серебряная дорожка к солнцу; над дорожкой лежат мелкие искры, ночью то же под луной. Форму длинных волн по-прежнему рисует цвет. Свежая пена держится белой чуть дольше, бурун за кормой чуть длиннее и расходится веером. Позже в тот же день, по замечаниям владельца: бурун снова остаётся за кормой и рвётся в полёте, посадка оставляет белое пятно, след над банкой больше не темнит воду, а пена у берега выходит на песок накатом без линии у уреза ([Q254](../questions/world.md#q254)). Первый вариант поправки перестарался: искр было в несколько раз больше, чем у прежнего моря, и белых, как пена; проверка облика это завернула ([Q255](../questions/world.md#q255), [Q254](../questions/world.md#q254), [как это вышло](../reports/2026-11-14-water-overhaul.md)).\n- **Вода заново, шаг 6** (2026-11-16): с той стороны, откуда идут волны, у края рифа лежит белая полоса прибоя, а подножие скал стоит в белом кольце, как у Anno 117 ([Q265](../questions/world.md#q265)).\n- Картинки меню были нарисованы моделью; с 2026-11-07 облик показывают только кадры игры ([Арт-дирекшн](README.md)).\n\n## Открытые вопросы\n- [Q77](../questions/world.md#q77): тон картинки.\n- [Q212](../questions/world.md#q212): кольца на воде от взрывов.\n- [Q250](../questions/world.md#q250): цвет открытого моря. [Q252](../questions/world.md#q252): волны локаций.\n- [Q265](../questions/world.md#q265): прибой у рифов и скал.\n"}, {"id": "audio-music", "path": "audio/music.md", "title": "Музыка", "section": "audio", "date": "2026-11-16", "md": "# Музыка\n\nМузыка складывается прямо во время игры и растёт вместе с боем; играет её радио лодки, станции которого игрок листает. Остальной звук: [Звук](sound.md).\n\n## Решения владельца\n- 2026-11-13: игра должна ощущаться как старые GTA с видом сверху. Музыка — радио лодки, как радио в машине: несколько станций, которые игрок листает, и «выключено». Убийства и задания объявляют крупные строки диктора ([HUD](../interface/hud.md)).\n- Музыка делается на ходу, как её делает Sonic Pi: она нарастает вместе с боем, а события играют собственные мелодии, все в одной гармонии.\n- Её звук — глянцевый джаз-фьюжн 2000-х, под стать интерфейсу, на записанных инструментах: аккорды FM-электропиано, мелодия маримбы, электробас, ведущая партия чистой электрогитары, живые барабаны с конгами и бонго и трубы для фанфар при победе. Кроме станции «Шанти».\n- Музыка верна; у каждой локации своя тональность, лад и темп.\n- 2026-11-16: радио поёт шанти. Это пятая станция, «Шанти», рядом с джазовыми; джаз остаётся. Поёт команда котов: запевала мяукает мелодию по слогам настоящих слов, как коты говорят в диалогах, команда отвечает хором. Песни — старинные народные шанти XIX века, общее достояние. Инструменты — записи CC0.\n\n## Как устроено (`audio/music/`)\n\n`Music` сочиняет на ходу, как музыка с живым кодом: готовых записанных треков нет. Пьеса (`Score`, `music/Harmony.cs`) — это тональность, лад, темп и зерно; у базы своя (`Score.Home`), и у каждой локации своя, она хранится в её карте (`Setting.Score`). `Composer` выращивает из зерна последовательность аккордов и играет по ней на часах качающихся шестнадцатых, слоями, которые вступают с интенсивностью боя, как адаптивные партитуры слоят стемы. Интенсивность растёт сразу и падает только после затишья (`Music.Feel`), от близких охотников, корпуса, нитро и недавних ударов. Мотивы отвечают на события боя на ближайшем делении такта (`Motif`). Решённое задание кончается фанфарами или плачем, гибель — плачем (`Music.End`); у пирса играет пьеса базы (`Music.Base`), а когда игра открывает мир другой локации, музыка тянется в неё (`Music.Now`, `Music.Resume`). Каждая нота — ступень звучащего аккорда, поэтому всё движется в одной гармонии. Инструменты сэмплированы, как их играют трекеры и саундфонты (`Voices`): записи CC0 (`assets/sounds/music/`, импортированы без сжатия), каждая нота играется от ближайшего дубля, с передискретизацией. Они играют в комнату и эхо (`Space`) под лимитером, рендерятся чуть вперёд в генератор потока. Пауза, верфь и экран торговца приглушают музыку.\n\n### Радио лодки\n- **Станция** (`Station`, `music/Station.cs`) — свой состав и своя манера, которыми `Composer` играет пьесу локации. Состав (`Lineup`, `Timbre`): какие записанные инструменты ведут аккорды, мелодию, бас, удары аккордов, перебор и соло. Манера (`Feel`): свинг, рисунок баса, аккордов и барабанов, густота мелодии. Пьесу станция читает по-своему (`Station.Reads`): в своём ладу, со сдвигом тональности, быстрее или медленнее, из другого зерна. Слои боя, мотивы, фанфары и плач у всех станций общие, так что музыка на каждой растёт с боем как раньше.\n- Станций пять, и ещё «выключено». «Шанти» — решение владельца; четыре джазовые станции и их названия — решение без владельца, названия временные, по тому, что на станции слышно ([Q204](../questions/audio.md#q204)).\n\n| Станция | Что на ней слышно |\n| --- | --- |\n| «Маримба» (`Station.Own`) | Пьеса локации как она написана: то, что играло до радио. Стоит по умолчанию. |\n| «Вибрафон» (`Station.Slow`) | Медленно и светло: мажор, вибрафон над электропиано, долгие ноты баса, ленивая установка с малым барабаном на третью долю. |\n| «Труба» (`Station.Brass`) | Быстрее, миксолидийский лад: мелодия трубы, трубы аккордами на слабые доли, шагающий бас, установка без конг и бонго. |\n| «Гитара» (`Station.Guitars`) | Быстро, гармонический минор: мелодия электрогитары, гитара аккордами по восьмым, бас восьмыми, том-томы; в разгар боя ведёт труба. |\n| «Шанти» (`Station.Shanties`) | Старинные шанти, которые поёт команда котов; см. ниже. Решение владельца. |\n\n- **Шанти** (`music/Song.cs`, `music/Shanties.cs`, `music/Choir.cs`). Станция с песнями (`Station.Songs`) не выращивает мелодию, а поёт песни одну за другой, по кругу; порядок задаёт зерно пьесы локации (`Songbook.Order`). Песня — мелодия один раз (строки запевалы и ответы команды), аккорды каждого такта и слова запевалы на каждый куплет; ответы команды в каждом куплете одни и те же. Мелодия записана, как в нотации ABC, с транскрипций (folkinfo.org, сборник Стэна Хьюджилла, Digital Tradition), в 2/4 и 4/4; проверяется при загрузке: такты полные, у каждой ноты свой слог. Перед песней — такт вступления, в его конце затакт.\n  - Песня звучит в тональности локации: тоника сдвигается к ней ближайшим путём, не больше чем на тритон. Лад и темп — свои у каждой песни.\n  - Поют коты (`Choir`): каждая нота — зерно мяуканья из голоса диалогов (`talk/Voice.cs`) по первой букве слога, на высоте ноты; пока нота тянется, середина зерна повторяется с перекрёстным затуханием, вибрато нарастает, слог на двух нотах скользит. Запевала поёт всё; на ответах вступает команда: голоса чуть позже, чуть мимо ноты и по разные стороны, один на октаву ниже, один на октаву выше.\n  - С боем растёт ансамбль, слоями, как у других станций: спокойно — запевала, один голос команды и аккорды аккордеона (простые трезвучия, `Feel.Plain`); на ходу — туба на сильных долях, банджо на второй и четвёртой, топот на первой и третьей, хлопки на второй и четвёртой; когда охотники близко — бубен по слабым восьмым, рамочный барабан восьмыми, перебор банджо, аккордеон дублирует мелодию, команда вчетвером; в разгар — скрипка октавой выше мелодии, топот на каждую долю, большой барабан, вся команда. Мотивы, фанфары и плач — общие со всеми станциями.\n  - Песни: Drunken Sailor, Wellerman, Haul Away Joe, Santiana, South Australia, John Kanaka, по два-три куплета. Песни, раскладка по слоям и голос котов — решения без владельца: [Q293](../questions/audio.md#q293), [Q294](../questions/audio.md#q294).\n\n- **Смена станции** слышна сразу: короткий шум эфира (`Static`, `music/Static.cs`: шипение, свист и треск, синтезированные в коде), из-под которого новая станция вступает с начала пьесы, с той же интенсивностью боя.\n- **«Выключено»** глушит всё, что играет композитор: и мотивы, и фанфары с плачем. Они тоже музыка, а у событий боя остаются свои звуки интерфейса ([Звук](sound.md)). Часы музыки при этом идут. Решение без владельца: [Q205](../questions/audio.md#q205).\n- **Листают** станции клавишей `R` в море или строкой «Радио» в настройках ([Управление](../interface/controls.md)); станцию называет шкала радио у приборов ([HUD](../interface/hud.md)).\n- **Выбор** — настройка игрока (`ui/Settings.cs`, `Music.Tuned`), не сохранение. По сети он не передаётся: в кооперативе каждый слышит свою станцию. У пирса радио остаётся на той же станции и играет на ней пьесу базы.\n- Послушать и проверить: демо `Music`, кейс `Stations`; шанти — кейс `Shanties`, где на экране видно имя песни ([Демо](../tools/demos.md)).\n\n## Открытые вопросы\n- [Q204](../questions/audio.md#q204): станции радио и их названия.\n- [Q205](../questions/audio.md#q205): что глушит «выключено», радио у пирса, шум эфира.\n- [Q293](../questions/audio.md#q293): песни станции «Шанти» и их раскладка по слоям боя.\n- [Q294](../questions/audio.md#q294): как поют коты.\n"}, {"id": "audio-sound", "path": "audio/sound.md", "title": "Звук", "section": "audio", "date": "2026-11-16", "md": "# Звук\n\nКак в игре звучат бой, лодки и интерфейс. Музыка описана отдельно: [Музыка](music.md).\n\n## Решения владельца\n- Звук по умолчанию включён. Кадры демо немые.\n- 2026-11-13: звуки нужно улучшить радикально; сначала исследовать, как это делают на GitHub, потом применить лучшее из исследования целиком, ничего не оставляя на потом. Новые записи — только CC0 с Freesound.\n\n## Как устроено (`audio/`)\n\n`Sounds` расставляет в мире многослойные реплики CC0, слышимые из «уха» вида (`assets/sounds`, источники в его `Licenses.txt`). `ShotSounds` взвешивает реплики по силе взрыва; `Motor` зацикливает мотор лодки. Море и ветер звучат петлёй под всем. Что бы ни делала любая лодка, слышно там, где она это делает, и охотничью тоже: припасы (`World`), знак охотника перед залпом (`Boat.Told`) и дым (`Hiss`).\n\n- **Уровни** (`tools/sounds.py`): каждый дубль приведён к громкости своего вида по ITU-R BS.1770: звук мира, звук интерфейса и петля. Громкость в таблицах `Sounds`, `Chimes`, `Motor` и `Hiss` — децибелы относительно неё, так что число значит одно и то же для любого дубля. Почему: дубли были выровнены по пику и при одной цифре в таблице расходились по громкости до 24 дБ. Сколько звучит каждая реплика в сумме, осталось как было; слои внутри реплики встали так, как написано в таблице.\n- **Реплики** (`Sounds`): каждый звук — дочерний узел, названный репликой, дублем и номером. Слой не играет один дубль дважды подряд. Та же реплика, пришедшая сразу и рядом, вливается в уже звучащую и делает её тяжелее, а не звучит второй раз. Звук слоя, начатый в толпе других, играет тише: залп катится чуть громче одного разрыва, а не складывается в стену. Голоса слоя достаются тем, кто слышен у уха громче, поэтому далёкий огонь не заглушает ближний; отнятый голос затухает, а не обрывается. Тяжёлый взрыв звучит ниже и громче, но не громче предела.\n- **Громкость не трогает тембр**: громкость слоя и петли живёт внутри голоса (`AudioStreamPolyphonic`), а собственная громкость игрока стоит на месте. Почему: движок считает громкость игрока расстоянием и срезает верха тихому звуку (godotengine/godot#109423, проверено по исходникам 4.7).\n- **Мотор** (`Motor`): один игрок на лодку, петли — его голоса, каждая со своей громкостью и высотой. Четыре петли: малые и большие обороты, под газом и без газа (сброшенный газ — те же записи без верхов и с колыханием, `tools/sounds.py`). Они перетекают с равной мощностью по двум осям: по оборотам и по нагрузке, то есть по тому, сколько просит руль. В воздухе винт выходит из воды и обороты взлетают; на посадке мотор проседает тем глубже, чем жёстче удар (`Boat.CameDown`). Газ, сброшенный на ходу, даёт несколько бульков мотора. Рывок нитро вспыхивает свистом воздуха и восходящим шумом, а под ним растёт вой турбины (запись взлетающего самолёта, 437909), пока рывок длится, и гаснет после. Неслышная петля останавливается. Лодка, идущая мимо, слышна выше, пока сближается, и ниже, когда уходит: высоту гнёт относительная скорость лодки и уха (`Ear`), так что лодка рядом на том же ходу звучит ровно.\n- **Корпус** (`Keel`): вода у борта — второй игрок лодки. Бурун на ходу ярче с каждой прибавкой скорости: поверх него поднимается шипение брызг. На стоянке вода плещет о борт. Живой корпус, выскочивший на мель, скребёт по грунту тем громче, чем глубже он в нём лежит и чем быстрее идёт (`Boat.Grounding`, его читает `Contact.Ground`): доска по дереву и гравий (481937, 223270).\n- **Взрывы по весу** (`ShotSounds`, `Shots.Of`): звук выбирает вес так же, как картинка, так что они начинаются вместе. Снаряд турели — сухой треск и щепки на шине оружия: он не приседает музыку. Ракета — разрыв, по корпусу, по суше или в воду. Заряд (торпеда, мина, снаряд, бочка) — разрыв ниже и тяжелее, с глухим ударом под ним, а на воде ещё и столб воды, который через секунду-две падает обратно. Гибель лодки звучит от `Boat.GaveWay`: треск ломающегося корпуса, удар и падающая вода; уход под воду — от `Boat.WentUnder`: смыкающееся море и пузыри. Так их слышит и гость в кооперативе. Посадка после настоящего прыжка шлёпает корпусом по воде по скорости падения, а самая жёсткая — с ударом; лодка, скользящая с гребня на гребень, не шлёпает.\n- **Взрывы по расстоянию** (`Carry`): каждый слой звука слышен на своё расстояние. Треск, щепки и брызги — только рядом; тело разрыва — на дальности боя и дальше; низкий раскат (запись базуки без верхов, с хвостом) одинаково громок вблизи и до 600 м, так что за краем вида от боя слышен уже только он, над шумом моря. Звук за краем вида приходит с опозданием по своему расстоянию, но не позже чем через 0,45 с: в кадре звук и картинка всегда вместе.\n- **Шины** (`default_bus_layout.tres`, `Mix`): Music и Effects под Master; под Effects — World с шинами взрывов, оружия, лодок и моря (Blasts, Weapons, Boats, Sea) и отдельно интерфейс и голоса (Interface, Voice). Ползунок «Эффекты» правит Effects, то есть всё это разом. Музыка, море и лодки приседают под взрывами (компрессор, которым управляет шина Blasts); музыка приседает не глубже, чем слышны эффекты, а при выключенных эффектах не приседает вовсе (`Mix.Balance`). У взрывов короткий тихий хвост. Ограничитель на Master поднимает весь микс и держит пик; свой ограничитель на шине моря срезает треск ливня и грома, чтобы шторм звучал громко, не упираясь в пик Master.\n- **Приглушение** (`Mix`): под экраном поверх боя (меню, торговец, верфь) и пока лодка игрока потоплена, мир слышен через фильтр низких частот; интерфейс и голоса остаются чистыми. В одиночной игре под меню бой стоит, и слышно только море; онлайн бой идёт дальше и звучит приглушённо.\n- **Моменты без звука получили свой**, каждый от того же события, что и картинка, так что гость слышит их, как хост. Парирование (`Gunnery.Parried`) — звон металла, сухой треск, маленький разрыв, без воды и земли. Сбитая бронеплита (`Boat.Shed`) — низкий звон железа и всплеск рядом. Починка (`Boat.Mended`) — три удара молотка, как только лодке залатали целое попадание: набор, припас ремонта, плотники, а помпа — ударом за каждое попадание, которое она откачала. Дрон спущен с люльки и взят на борт (`Wing.Launched`, `Aboard`) — лязг и всплеск. Прожектор, поймавший лодку (`Searchlights.Caught`), — лязг шторки и гул дуги. Подожжённое пятно (`Slicks.Lit`) — вспышка огня, а пока оно горит, над огнём держится гул пламени. Башня (`Towers.Charging`, `Pulsed`) — нарастающий гул катушки Теслы и треск импульса. Звуки опасностей заводит `HazardSounds`.\n- **Попадания и знак охотника** (`Chimes`, `Markers`): тик попадания поднимается на полтона с каждым следующим попаданием в серии, до квинты, и сбрасывается после паузы в полторы секунды. Охотник, по которому игрок попал в последние три секунды и который пошёл ко дну, — это победа игрока: звенит стекло на квинту выше захвата. Перед залпом охотника, за 0,35 с, щёлкают его стойки и воздух втягивается навстречу пуску (пуск ракеты, сыгранный задом наперёд): это знак, что сейчас будет залп.\n- **Вибрация геймпада** (`players/Rumble.cs`, `Pad.Device`): удар по своему корпусу — по весу удара, гибель своей лодки — сильнее всего, жёсткая посадка — по скорости падения, тяжёлый взрыв ближе 40 м — тем сильнее, чем ближе. Силу задаёт шкала «Вибрация геймпада» в настройках, рядом с
