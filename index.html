загружает последнее сохранение; чтобы капитан помнил свою победу, эту запись придётся хранить отдельно от сохранения мира.\n5. **Улучшения: сделать покупку событием.** Сегодня у новой игры 10 000 монет при самом дорогом корпусе в 1050. Образцы: Black Flag (добыча крупнее требует корабля сильнее и оплачивает следующий шаг), Dredge (улучшение спорит с грузом за одно место), Armored Core VI (продажа по цене покупки, чтобы пробовать сборки). Чего избегать — Skull and Bones: улучшение из трёх рейсов.\n6. **Классы: готовые сборки поверх свободных деталей.** Пять стилей уже есть. Не хватает трёх вещей: стартового набора на каждый стиль, чтобы новичок вышел в море на рабочей лодке; одного правила или умения, которое делает стиль своим за рулём; и врагов, каждый вид которых просит своего ответа, — тогда четверым выгодно прийти на разных лодках.\n7. **Кооп: договориться о деньгах, добыче и сюжете до того, как их станет много.** Продажа, которая платит всем; потеря только непроданного; мир и линия поручений у хоста, лодка и детали у игрока; сцена, которая никого не держит за дверью. Часть этого уже так ([Онлайн-кооп](../online.md)).\n\nЧего отчёт не советует: процедурный мир вместо написанного; больше одной-двух шкал времени разом; настоящие склады и производство; генератор врагов вместо написанных; класс, который запирает игрока; улучшение, собранное из трёх рейсов.\n\n## Чего не проверили\n- В игры не играли. Всё о том, как игра ощущается, — со слов рецензентов и игроков.\n- Видео не смотрели: доклады с конференций знаем по пересказам в прессе, отметок времени нет.\n- Оценки Steam — по отзывам на английском; общих чисел по всем языкам страница магазина без входа не показывает.\n- Блог автора Starsector не открывается автоматически: его посты знаем по выдержкам из поиска.\n- Часть сведений о Shadow of Mordor (экран армии), Warframe (история правок) и Избранных XCOM 2 (жалобы на болтливость) — из выдержек поиска, а не с открытых страниц; в текст они не вошли или помечены.\n- Патент пересказан по его странице и трём статьям. Это не заключение юриста; платит ли Warner пошлины и писала ли кому-то частным порядком, мы не знаем.\n- Far Cry 2, Red Dead Redemption 2, No Man's Sky, Pillars of Eternity II и Sunless Skies не разобраны.\n- Столбцы таблицы кандидатов — наше прочтение, а не измерение.\n"}, {"id": "reports-README", "path": "reports/README.md", "title": "Отчёты", "section": "reports", "date": "2026-11-15", "md": "# Отчёты\n\nОтчёты и исследования, которые раньше жили артефактами Claude. Пока хранятся здесь как есть, на языке оригинала. Это снимки на свою дату: решения и то, как устроена игра, — на страницах тем.\n\n## Выбор облика\n- 2026-11-07 [Облик всей игры](2026-11-07-art-directions/index.html) — шесть обликов на стенде `Art`. Владелец снял их 2026-11-14, стенд удалён.\n- 2026-11-06 [Облик меню](2026-11-06-menu-looks/index.html) — шесть обликов на стенде `Menus`. Наш выбор Quiet; владелец ещё не выбрал.\n- 2026-11-06 [Картины меню](2026-11-06-menu-paintings/index.html) — пауза и настройки, нарисованные FLUX. Владелец отверг; с 2026-11-07 картинки нейросетью не рисуем.\n\n## Проверки и разборы\n- 2026-11-14 [Вода заново](2026-11-14-water-overhaul.md) — как делают воду Sea of Thieves, другие игры и открытые проекты на GitHub, и план переделки по шагам.\n- 2026-11-14 [Замер кадра](2026-11-14-performance.md) — кадр по местам во весь экран, цена каждой части на GPU и в главном потоке, что исправить по выгоде.\n- 2026-11-13 [Палитра](2026-11-13-palette-audit.md) — QA проверил палитру: 82 хранимых цвета, из них около 36 независимых. Осталось 21.\n- 2026-11-13 [Список для игры](2026-11-13-play-checklist/index.html) — что построено с конца октября и ждёт оценки владельца, в порядке одной поездки: где это в игре и на что смотреть. Живёт артефактом https://claude.ai/artifact/WDVtDp2GJuSBonAw4hSy8u: оценки («Остаётся», «Чинить», «Вырезать») и заметки хранит его база, коллекция `verdicts`, по документу на вещь. Правишь список — опубликуй артефакт заново из этого файла.\n- 2026-11-08 [Greenlight](2026-11-08-greenlight-review/index.html) — пять издателей оценивают прототип, 4.6 из 10: «вернитесь с вертикальным срезом».\n- 2026-11-08 [Что убрать из игры](2026-11-08-cleanup-audit/index.html) — аудит лишнего. Владелец взял только пункты по коду (4a7b9a56).\n- 2026-11-04 [QA интерфейса](2026-11-04-interface-qa/index.html) — 102 замечания, все исправлены.\n- 2026-11-03 [Пресса](2026-11-03-press-review/index.html) — десять критиков, 63 из 100.\n\n## Другие игры\n- 2026-11-15 [Семь желаний](2026-11-15-dream-games.md) — как вышедшие игры делают то, о чём мечтает владелец: сюжет, живой мир с экономикой, заклятых врагов, улучшения, классы и кооп. Пятьдесят игр, от Windward, SPAZ и GTA до Hades и Deep Rock Galactic, кадры магазинов на странице; что общего у лучших, где желания спорят и самая малая форма каждого для нашей игры.\n- 2026-11-14 [Море с нашей камеры](2026-11-14-sea-camera-games.md) — тридцать девять игр с морем сверху, тринадцать разобраны по кадрам, кадры магазинов на странице: мель, пена, след, солнце, берег, ночь; на что смотреть перед шагами 3–6 плана воды.\n- 2026-11-07 [Escape from Duckov](2026-11-07-escape-from-duckov.pdf) и [Dave the Diver](2026-11-07-dave-the-diver.pdf) — разборы игр (PDF).\n- 2026-10-28 [Аркадные морские игры](2026-10-28-arcade-naval-reference.md) — восемь игр-ориентиров для аркадного поворота.\n\n## Времён симулятора\nДо аркадного поворота 2026-10-26; игра с тех пор другая (тег `simulator-game`).\n- 2026-10-13 [Подходы к карте](2026-10-13-map-approaches.md) — как строить карту морской песочницы.\n- 2026-10-11 [Судовой журнал идей](2026-10-11-captains-ledger/index.html) — 518 идей по системам.\n- 2026-10-11 [Becoming Windward](2026-10-11-becoming-windward/index.html) — Windward, WaveWorks и выбор движка.\n- 2026-10-11 [Фэнтезийный архипелаг](2026-10-11-fantasy-archipelago/index.html) — исследование кооп-песочницы.\n- 2026-10-09 [Вода](2026-10-09-water-field-guide/index.html) — справочник по воде.\n\nПредложения по сеттингу лежат на своём месте: [story/lore-proposals.html](../story/lore-proposals.html).\n"}, {"id": "roadmap", "path": "roadmap.md", "title": "Дорожная карта", "section": "", "date": "2026-11-16", "md": "# Дорожная карта\n\nЧто сделать до полного релиза в Steam и в каком порядке. Порядок этапов решил владелец; что внутри каждого этапа и его срок — решение без владельца ([Q95](questions/gaps.md#q95)).\n\n## Решения владельца\n- 2026-11-13 владелец спросил, что нужно игре до полного релиза в Steam, если целиться в 90 на Metacritic, и попросил записать это дорожной картой.\n- 2026-11-13 порядок этапов утверждён: что это за игра; срез и рядом с ним чужие машины и страница Steam; демо; ранний доступ; релиз 1.0.\n- 2026-11-16 сначала альфа: довести до ума то, что в игре уже есть.\n- 2026-11-16 в альфе новых систем не начинаем: новая система, о которой попросит владелец, встаёт после альфы или вместо чего-то из её списка. Сменено: заморозки нет (11-13).\n\n## Планка\n90 — мерка для каждой части игры, а не прогноз: столько получают единицы независимых игр в год. У них общее:\n- цикл хорош и в первую минуту, и на двадцатом часу;\n- облик узнаётся по одному кадру;\n- каждые полчаса игрок встречает новое;\n- ничто не мешает: обучение, скорость, управление, доступность;\n- игру долго правили на живых игроках до релиза.\n\nОткуда идём: [Greenlight](reports/2026-11-08-greenlight-review/index.html) поставил прототипу 4,6 из 10 и просил вертикальный срез, [Пресса](reports/2026-11-03-press-review/index.html) — 63 из 100. С тех пор решена цель игры (поручения и финальный босс, [11-12](decisions.md)), построен кооп через Steam ([Онлайн-кооп](online.md)), интерфейс сведён в одну тему ([Компоненты](art/components.md)). С 11-13 по 11-16 в игру пришли жизнь моря, розыск и патруль, забавы, форт пиратов, соперники, открытый мир с сохранением и главным меню, сутки и погода со штормами, а вода переделана. Почти ничего из этого владелец ещё не играл, отсюда альфа.\n\n## Порядок\nЭтап начинается, когда у предыдущего выполнено «Готово, когда». Порядок важнее сроков; сроки грубые. Альфа вобрала прежний первый этап «Что это за игра»: что это за игра, решается, пока владелец играет то, что есть.\n\n### 1. Альфа: довести то, что есть — около трёх недель\nАльфа — игра, где всё построенное работает, читается и держится вместе. Задания, броненосец, портреты и краска патруля пока заглушки, но не ломаются. Её можно дать друзьям, не извиняясь за поломки.\n\nНовых систем в альфе не начинаем (решено 11-16, выше).\n\n**Владелец играет и решает**\n- Почти всё с конца октября построено без игры владельца: в [Списке для игры](https://claude.ai/artifact/WDVtDp2GJuSBonAw4hSy8u) нет ни одной оценки, открытых вопросов почти двести. Владелец играет одну часть за раз и про каждую говорит: оставить, поправить или убрать. Правки идут между сессиями, поправленное он играет снова.\n- Части по порядку: лодка и бой; гавань, торговец, верфь и первая покупка; жизнь моря, розыск, забавы, форт и соперники; задания и броненосец; погода, сутки и море; звук и музыка; меню, HUD, карта и настройки; кооператив с другом.\n- Вопросы разобраны. Открытые вопросы делим на два рода: о том, как игра играется или выглядит, — на них владелец отвечает по ходу игры; и мелкие, где наше решение остаётся, если владелец не против. Устаревшие удаляем.\n- Убранное уходит целиком: код, демо, слова и страницы вики.\n- Стенд `Menus` со старыми кандидатами меню убран, или из него взят облик: меню игры владелец правил сам 11-16 ([Кандидаты на облик](art/candidates.md)).\n- После игры [Об игре](vision.md) называет крючок одной фразой, опоры и игрока ([Q92](questions/gaps.md#q92), [Q93](questions/gaps.md#q93)): какие из [семи желаний](reports/2026-11-15-dream-games.md) стали опорами. Наше предложение опор: лодкой весело править, и руль — это прицел; каждая сборка дерётся по-своему; добычу надо довезти; мир флопп тёплый и смешной; с друзьями лучше.\n\n**Держится вместе**\n- Час игры без вылета и без ошибок в журнале игры (`app_userdata/Pirates/logs`).\n- Сохранения не теряют прогресс: «Продолжить», «Загрузить», автосохранение и загрузка после гибели; сохранение прошлой версии открывается.\n- Кадр без рывков: затенение неба новой лодки и земли, первое открытие карты и первые секунды верфи уходят за шторку загрузки или из главного потока ([Известные недочёты](known-issues.md)).\n- Кадр замерен заново после работы 11-16 (штормы, объёмные облака, ночь, долгий бой) и держит 90–100 к/с во весь экран на Mac владельца.\n- Бой читается на 1080p днём, ночью и в шторм: лодка игрока отличима от охотников, ракеты и попадания видны. Greenlight 11-08 отметил это всеми пятью местами.\n- Исправлен каждый [недочёт](known-issues.md), который новый игрок встретит в первый час: например, ракеты сквозь сарай мастерской, лента причала поверх сарая, ящики, различимые только цветом. Остальные владелец принимает на время до среза.\n\n**Одна игра, а не стопка прототипов**\n- Весь текст есть по-русски и по-английски, `tools/locale.py --check` чист, термины — по [Глоссарию](glossary.md).\n- Новый звук и эффекты владелец услышал и увидел (демо `Sounds` и `Effects`, затем бой), и их уровни сведены на его слух ([Звук](audio/sound.md)).\n- Управление можно узнать в самой игре: сейчас клавиши описаны только в вики ([Управление](interface/controls.md)).\n\n**Цикл от начала до цели**\n- Новая игра, первый бой, продажа, первая покупка, задание и броненосец проходятся подряд без тупика, пусть и на заглушках.\n- Первая деталь стоит одного-двух выходов в море ([Q56](questions/missions.md#q56), [Q101](questions/gaps.md#q101)). Сейчас новая игра даёт 10 000 монет, а самый дорогой корпус стоит 1050 ([Баланс экономики](balance/economy.md)).\n\n**Кооператив держится**\n- Всё из «Пока не онлайн» ([Онлайн-кооп](online.md)) либо онлайн, либо в кооперативе не появляется. Гостю есть что подобрать, продать и купить; гость видит буи дающих задания и слышит их реплики; над лодками товарищей их имена.\n- В кооп через Steam сыграли с другом по интернету, а не только в демо `Coop`.\n\n**Сборки**\n- Сборка игрока без демо и стендов: сейчас экспорт берёт весь проект (`game/export_presets.cfg`). Оставить ли редакторы карт и сюжета в меню игрока, решает владелец.\n- Сборку для Windows запустили и сыграли хотя бы раз ([Q97](questions/gaps.md#q97)).\n- Альфа выходит версией 0.1 (решение без владельца, [Q95](questions/gaps.md#q95)).\n\nГотово, когда: владелец сыграл каждую часть игры и про каждую сказал «оставить», «поправить» или «убрать», а поправленное сыграл снова; час игры у владельца и у двух-трёх друзей, один раз в кооперативе по интернету, прошёл без вылета, потерянного сохранения и тупика; сборки для Mac и Windows без демо вышли версией 0.1.\n\n### 2. Срез — один-два месяца\nТридцать–сорок пять минут игры в качестве релиза: обучение, первый район с его поручениями, первый босс.\n- **Обучение по рации** — первое поручение (решено [11-12](decisions.md)): руль, рывок, захват цели, швартовка, продажа. Кончается победой.\n- **Глубина боя.** Турель целится сама, ракеты идут в захват, мышь не целится ([Бой](gameplay/combat.md)): мастерство — это руль, рывок, парирование и таран. Каждый вид охотника просит своего ответа; после чистого уклонения есть окно для удара; парирование что-то возвращает. Стартовая лодка с одной турелью должна быть интересной: с неё начинает каждый.\n- **Проверка «мышью не целятся»** на игроках с клавиатурой.\n- **Настоящие поручения и босс** вместо заглушек заданий и броненосца ([Q1](questions/missions.md#q1)).\n- **Флоппы в мире**: модели на пирсе и на станции; сейчас они только на портретах ([Люди: флоппы](art/people.md)).\n\nГотово, когда: срез сыграли 5–20 человек со стороны ([Q105](questions/gaps.md#q105)), и большинство дошло до конца и хочет ещё.\n\n### 3. Чужие машины и страница Steam — рядом с этапом 2\n- Названо самое слабое железо ([Q97](questions/gaps.md#q97)); есть низкий уровень качества; игра идёт на Steam Deck.\n- Бой одинаков на 30 и на 144 кадрах в секунду: лодки и снаряды шагают по времени кадра (`Boat._Process`, `Projectile._Process`). Если расходится — фиксированный такт.\n- Имя и кот решены ([Q185](questions/gaps.md#q185)) до любой публичной страницы.\n- Портреты, логотип и ключевой арт от художника ([Q102](questions/gaps.md#q102), [Q103](questions/gaps.md#q103)) — тоже до неё: Steam спрашивает о картинках от ИИ.\n- Свой App ID вместо тестового ([Q108](questions/online.md#q108)), страница Steam ([Q96](questions/gaps.md#q96)), закрытый тест через Steam.\n\nГотово, когда: срез идёт на 60 к/с на названном слабом PC и на Steam Deck, и страница Steam открыта.\n\n### 4. Демо — два-три месяца\n- Срез выходит публичным демо и собирает желающих на странице Steam.\n- Смотрим, где игру бросают и где тонут, и правим срез, пока его не доигрывают.\n- В кооп по интернету сыграли чужие люди.\n\nГотово, когда: демо доигрывают до босса, и отзывы на него в основном хорошие.\n\n### 5. Ранний доступ — шесть-двенадцать месяцев\n- **Линия поручений** до финального босса (решено [11-12](decisions.md)): четыре-пять районов моря со своим светом, опасностями и охотниками (так умеют [Локации](world/locations.md)), 25–40 поручений, пять-шесть боссов, каждый учит своей [сборке](gameplay/builds.md), финал. Итог — 10–15 часов.\n- **Новое каждые полчаса**: деталь, охотник, опасность или место.\n- **Экономика целиком** ([Q101](questions/gaps.md#q101)): детали приходят с поручениями, и на десятом часу ещё есть чего хотеть.\n- **Реплики**: маленький состав флопп (корабел, мытарь, торговец) с живыми голосами и шутками ([Q48](questions/story.md#q48), [Q104](questions/gaps.md#q104)). Лор по-прежнему выбирает владелец ([Сеттинг и лор](story/setting.md)).\n- **Довести или вырезать** каждую побочную систему, что пережила альфу: [места промысла](gameplay/sites.md), расходники, дроны, редакторы карт и сюжета.\n\nГотово, когда: игру проходят до финала, и отзывы в Steam «очень положительные» или лучше.\n\n### 6. Релиз 1.0\n- Доступность ([Q100](questions/gaps.md#q100)): свои и чужие ракеты различимы не только цветом, крупный текст. Переназначение клавиш и геймпада ([Q74](questions/interface.md#q74)).\n- Языки сверх английского и русского ([Q75](questions/interface.md#q75)).\n- Облачные сохранения и достижения ([Q96](questions/gaps.md#q96)).\n- Звук: сведение, временные звуки заменены ([Q23](questions/audio.md#q23)), одна тема, которую напевают.\n- [Известные недочёты](known-issues.md) пусты.\n- Пресса: Metacritic ставит оценку только после нескольких рецензий критиков, так что нужны издатель или PR, ключи заранее и трейлер.\n\n## Открытые вопросы\n- [Q95](questions/gaps.md#q95): что внутри этапов, их сроки и какая версия станет 0.1.\n- [Q185](questions/gaps.md#q185): имя и кот.\n- [Q92](questions/gaps.md#q92), [Q93](questions/gaps.md#q93), [Q96](questions/gaps.md#q96), [Q97](questions/gaps.md#q97), [Q105](questions/gaps.md#q105).\n"}, {"id": "story-dialogue", "path": "story/dialogue.md", "title": "Диалоги и голос", "section": "story", "date": "2026-11-13", "md": "# Диалоги и голос\n\n![Корабел](../img/shipwright.jpg)\n\n![Диалог: реплика в матовом стекле, ответы списком](../img/dialogue.jpg)\n\nКак показан разговор: портреты, выноска, буквы по одной и кошачий лепет вместо слов. Сами сцены описаны в [Сценах сюжета](scenes.md).\n\n## Решения владельца\n- Разговор с кем-то — диалог, как в визуальной новелле: большой нарисованный портрет каждого говорящего рядом с репликами, лицо меняется по реакции.\n- Портреты стоят у нижнего края экрана, говорящий подсвечен; его реплика в выноске между ними.\n- Выноска — из стекла, как всё стекло интерфейса; ответы стоят списком, как меню; имя говорящего — мелкая подпись (решение 2026-11-12, [решения](../decisions.md)).\n- Говорящие лепечут, а не произносят слова: каждая буква — короткий кошачий звук, высота зависит от говорящего, одни и те же буквы звучат всегда одинаково. Злые слова рычат.\n- Реплики движутся: буквы выскакивают, когда их произносят; слова волнуются, трясутся, стоят крупно цветом с блеском или переливаются радугой; некоторые говорятся медленно, паузы держат слова, а лицо посреди реплики меняется с прыжком.\n- Корабел здоровается с игроком на верфи.\n- Пока идёт диалог, экран за ним не отвлекает: мир и приборы уходят на задний план.\n\n## Как устроено (`talk/`)\n\n`Dialogue` показывает разговор, как визуальная новелла: портрет каждого говорящего (`assets/portraits/<speaker>-<face>.png`) у нижнего края экрана, капитан справа, собеседник слева, при необходимости каждый отражён, чтобы смотреть на другого; говорящий подсвечен. Его реплика — в стеклянной выноске между ними (`Gloss.Balloon`, матовое стекло `frosted`, как у подсказок меню, только крупнее): у края прозрачная, сцена гнётся вдоль кромки, глубже — матовая под бледной бирюзой, буквы тёмные. Хвост выноски указывает на говорящего. Имя — мелкая подпись прописными над верхним краем выноски, с его стороны: белая, с тёмным ореолом. Говорящие — `Speaker`: капитан, корабел и мытарь, у каждого четыре лица. Реплика пишется с метками, которые читает `Speech`: [wave], [shake], [big], [rainbow] и [slow] вокруг слов, [face=pleased] и [pause] там, где они стоят; точки и запятые держат слова. Каждая буква рисуется отдельно и выскакивает, когда её произносят; крупные слова — оранжевые. Enter, Space или щелчок показывают реплику целиком, а затем просят следующую; на выноске тогда покачивается клавиша Enter (на геймпаде — его кнопка). Ответы стоят над правым краем выноски списком, как меню (`Pill.Row`): белые слова с бледной цифрой перед каждым, выбранный — на стеклянной пилюле, налитой светом, свет скользит от строки к строке. Ответы выезжают по одному, их выбирают W S и Enter, цифрой или щелчком; Esc просит пропустить. Пока диалог идёт, он берёт клавиши и указатель, а мир и приборы за ним размыты и притемнены тем же матовым стеклом, что у окон интерфейса и выносок (`ui/frosted.gdshader`). Стекло выноски и ответов видит уже притемнённый мир и портреты: под ними экран копируется ещё раз, только в их прямоугольнике (`BackBufferCopy`). Портрет покачивается, пока говорит, подпрыгивает, когда меняется его лицо, и дёргается на трясущихся словах. Размеры, притемнение и цвета — в теме `ui/look.tres`, тип `Speech`.\n\n`Voice` лепечет по буквам: у каждой буквы своё зерно кошачьего мяуканья, вырезанное при загрузке из одной полосы (`assets/sounds/voice/mews.wav`), по высоте подстроенное под говорящего (`Speaker.Pitch`) и на пентатонической ступени, которую эта буква хранит, поэтому одни и те же слова звучат всегда одинаково. Зёрна разнесены так, чтобы быстрые буквы не сливались. Последнее слово вопроса поднимается, крупные слова громче и ниже, а трясущиеся рычат зовами каракала (`growls.wav`).\n"}, {"id": "story-scenes", "path": "story/scenes.md", "title": "Сцены сюжета", "section": "story", "date": "2026-11-15", "md": "# Сцены сюжета\n\n![Мытарь](../img/tollkeeper.jpg)\n\nКак игра рассказывает сюжет: сцены, их поводы, условия, радио. Сцены пишут в [редакторе сюжета](../tools/story-editor.md); как звучат и выглядят сами диалоги, описано в [Диалогах и голосе](dialogue.md).\n\n## Решения владельца\n- Сюжет рассказывают сценами, которые пишут во встроенном редакторе сюжета.\n- Сцена — это граф эпизодов на холсте. Каждый эпизод — сценарий: кто говорит, с каким лицом, и реплика с метками.\n- Сцены ветвятся по ответам игрока, проверяют условия по флагам и по игре, ставят флаги и действуют в игре, например дают монеты или деталь.\n- Повод рассказывает одну сцену: из тех, чьи условия выполнены, ту, у которой наивысший приоритет. Сцену можно рассказать только один раз.\n- Сцены запускаются в местах на базе, до и после захода, по радио в бою и при подходе к флоппе. Базы как экрана с 2026-11-13 нет: её места — причал гавани и верфь.\n\n## Как устроено (`story/`)\n\n`Teller` рассказывает сцены на собственном слое холста. Сцена (`Scene`) — JSON-файл в `res://story` (`Scenes`); его читают заново при каждом поводе, поэтому правки редактора рассказываются сразу. Повод (`Triggers`) вызывает `Teller.Tell`, а тот выбирает сцену (`Teller.Pick`): из тех, что этот повод запускает, чьё условие выполнено и которые, если они разовые, ещё не рассказаны, — с наивысшим приоритетом, а затем реже всех рассказанную. Нет сцены — ничего не происходит.\n\nПо одной реплике на каждое задание говорят по рации его дающие (`story/job-*.json`, повод `radio-job`): тоже заглушки. Кроме них в игре одна сцена — приветствие корабела на верфи (`story/yard-greeting.json`), с репликами-заглушками ([Q48](../questions/story.md#q48)).\n\nВ каждом эпизоде лежит сценарий (`Screenplay`), по шагу в строке:\n\n```\nShipwright: [face=pleased]Will you take it out?\n* Not yet -> later\n* Right now! -> now if coins > 10\n-> keen if eager\nset visits = visits + 1\ndo give coins 50\nstop\n```\n\nРеплика ждёт Enter. Ответы сразу после реплики предлагаются, пока их условие выполнено, и ведут в свой эпизод или дальше, мимо ответов. Эпизод, который кончился без перехода, завершает сцену. Esc пропускает ещё не сказанное до ближайших ответов или до конца. Условия и значения — `Expression` Godot над `Facts`: флаги, которые ставят сцены (0, пока не поставлены; булево, число или текст), `coins` и `Seen(\"Scene name\")`; всё это хранит сохранение (`Progress`). `do` запускает `Teller.Order`: `give coins N`, `give part Name`, `wait seconds`. `Screenplay.Faults` перечисляет строки, которые сцена не может рассказать. Сцена, которая идёт по эпизодам, где нечего ждать, обрывается. Почему сценарий в каждом эпизоде: реплики печатают быстрее, чем соединяют блоки, а граф показывает только ветки.\n\n**Поводы** (их запускает `Game`, каждый рядом с тем, за чем следует):\n\n| Повод | Когда | О чём |\n| --- | --- | --- |\n| `yard` | открывается верфь | |\n| `briefing` | лодка отчалила от причала гавани (решение без владельца, [Q179](../questions/interface.md#q179)). | `mission` |\n| `home` | лодка пришвартовалась у причала гавани. | `mission` |\n| `debrief` | лодка продала добычу корабелу и закрыла его экран. | `mission`, `won` |\n| `radio-start`, `radio-first-sunk`, `radio-last-strike` | начинается заход; идёт ко дну первый охотник; у лодки игрока остаётся последнее попадание | `mission` |\n| `radio-job` | лодка взяла задание у буя дающего ([Открытый мир](../gameplay/missions.md)). | `mission`, `job` (вид задания), `giver` (кто дал) |\n| `radio-rival-near`, `radio-rival-sunk`, `radio-rival-home` | лодка соперника впервые за выход подходит на 300 м к лодке игрока; тонет; уходит с моря с добычей | `who` (название команды), `mission`, `met`, `last` (последняя встреча: `won`, `lost`, `even`), `beaten` (у `radio-rival-sunk`) |\n| `radio-rival-first-blood`, `radio-rival-snatch`, `radio-rival-breaking-off`, `radio-rival-saved-you` | остальные моменты соперников ([Соперники](../gameplay/rivals.md)) | `who`, `mission` |\n\n`Tell(trigger, about)` приносит факты, которые видят только условия этого рассказа: `mission` (название) и `won`. После швартовки у пирса `won` всегда истинно. Гость в онлайне не видит брифинга, потому что заход выбирает хозяин игры, но слышит радио и разбор.\n\n**Счёт**: `Facts.Finish` записывает задание выигранным или проигранным по названию, условия видят `wins` и `losses`, `Won(\"Mission\")` и `Lost(\"Mission\")`. Пишет его конец прогона карты из редактора; швартовка у пирса и гибель в одиночной игре счёт не трогают.\n\n**Мытарь** (`Speaker.Tollkeeper`, портреты `tollkeeper-*`) смотрит вправо, говорит неспешно и низко. Своих сцен у него нет: они звучали у точек выхода с пошлиной и ушли вместе с ними ([Q48](../questions/story.md#q48)).\n\n**Радио** (`talk/Radio.cs`): сцена, чей повод начинается с `radio-`, звучит в левом верхнем углу экрана, под заметкой о задачах, а не в диалоге. Радио — часть приборов и из их стекла (`Lens`, тип `Radio` в теме): маленький портрет (голова с портрета говорящего; его инициал, если портрета нет) в стеклянной рамке, имя мелкой подписью и реплика белыми буквами на панели дымчатого стекла. Реплика говорится по буквам голосом говорящего, держат её мгновение и идут дальше; сцена кончается сама. Радио не берёт ни клавиш, ни указателя, поэтому бой идёт дальше и ничто не встаёт на паузу. Ответы по радио не выбрать, поэтому `Screenplay.Faults` их помечает. Радио — только вид локального игрока. Одна сцена радио за раз: повод радио, пока идёт другая или диалог, отбрасывается. Повод диалога радио не блокирует: диалог обрывает радио на полуслове, и тот рассказ не засчитывается. `Dialogue` и `Radio` делят `Lettering`: раскладку и отрисовку букв (тёмных на матовой выноске, белых с ореолом на дымчатом стекле), подпись с именем и общие времена появления и ухода. Моменты боя читаются с лодок как они стоят (`Game.Calls`), поэтому их слышит и гость.\n\n## Открытые вопросы\n- [Q48](../questions/story.md#q48): с кем говорит игрок и о чём.\n- [Q69](../questions/story.md#q69): поводы сюжета и редактор.\n"}, {"id": "story-setting", "path": "story/setting.md", "title": "Сеттинг и лор", "section": "story", "date": "2026-11-13", "md": "# Сеттинг и лор\n\nМир, в котором идёт игра, и правила, по которым в неё попадает лор.\n\n## Решения владельца\n- Сеттинг: оптимистичный мир соларпанка спустя долгое время после падения. Современный мир, из которого он вырос, — далёкое прошлое, и о нём мало что помнят (владелец, 2026-11-02).\n- Все жители — флоппы ([Люди: флоппы](../art/people.md)).\n\n## Где сеттинг виден в игре\n- Приборы старого мира, найденные и починенные ([HUD](../interface/hud.md), [Стиль интерфейса](../art/interface.md)).\n- Солнечные панели, тенты, ветряки и зелень в кадках на лодках ([Облик лодок](../art/boats.md)).\n- Одежда старого мира, выцветшая и залатанная, с льном и плетёным нового ([Люди: флоппы](../art/people.md)).\n\n## Правила лора\n- Лор попадает в игру и в вики только тогда, когда владелец назовёт кусок. Понравившееся предложение — не приказ его строить.\n- Любой лор, фракцию или механику сверх решённого помечать как предложение.\n- Мир описывают простыми идеями: места и люди — по тому, что они есть («закрытый остров», «наставник на верфи»), а не придуманными именами. Без глоссариев, придуманных эпох и календарей, списков титулов и именованного состава: придуманные слова владелец читает как сгенерированный мусор (2026-10-27).\n- Персонажи — роли без имён: капитан, корабел, мытарь.\n\n## Предложения\n- [Предложения по сеттингу](lore-proposals.html) (на английском): пять миров соларпанка после падения и смесь двух из них — затопленного города и закрытого острова. Каждая вкладка — питч, идеи мира, карта, как это играется, таблица идей, сюжет и повороты, мудборд. Ничего из этого нет в игре; владелец выберет куски сам.\n- Владелец читает их с телефона как артефакт: https://claude.ai/artifact/7xXEeNLqmCzpaGSYH9rbZt. Правишь страницу — опубликуй артефакт заново.\n\n## Открытые вопросы\n- [Q5](../questions/story.md#q5): подробности сеттинга — его люди, названия мест, что осталось от старого мира.\n"}, {"id": "tools-README", "path": "tools/README.md", "title": "Инструменты", "section": "tools", "date": "2026-11-15", "md": "# Инструменты\n\nЧем собирают, проверяют и выпускают игру, и чем в ней самой делают карты и сюжет.\n\n## Страницы\n- [Код](code.md): как устроен проект `game/`.\n- [Демо](demos.md): отдельные сцены для каждой части игры и их проверки.\n- [Редактор карт](map-editor.md): карты и их задания над живым миром.\n- [Редактор сюжета](story-editor.md): сцены и сценарии.\n- [Ассеты](assets.md): откуда берутся модели, звук, шрифты и портреты.\n- [Сборки и посты](release.md): экспорт сборок и посты в канал.\n\n## Команды\n\n| Команда | Что делает |\n| --- | --- |\n| `make` | Собирает игру и запускает её в окне (`make build` только компилирует, `make wiki` показывает вики на `127.0.0.1:8000`). |\n| `tools/demo.sh <out dir> [Demo ... \\| --since <rev>]` | Запускает демо скрытно с их проверками ([Демо](demos.md)). |\n| `tools/catalogue.sh <out dir>` | Рисует каждую лодку верфи на одной странице ([Ассеты](assets.md)). |\n| `tools/locale.py [--check]` | Собирает слова игры в каталоги перевода `game/locale/` ([Язык](../interface/language.md)). |\n| `tools/build.sh` | Экспортирует `main` для macOS и Windows ([Сборки и посты](release.md)). |\n| `tools/post.sh` | Публикует пост в канал игры, только с одобрения владельца ([Сборки и посты](release.md)). |\n| `tools/wiki.py <out dir>`, `tools/wiki-pages.sh` | Собирает вики сайтом; второй выкладывает публичную копию на GitHub Pages ([Главная](../README.md)). Картинку с чужого сайта артефакт вики не грузит: страница берёт вместо неё копию `img/ext/<сайт>/<путь>`, выложенную в артефакт рядом с ней; в репозитории копий нет. |\n| `tools/steamworks.sh <tag>` | Собирает Steamworks.NET под каждую ОС и пакует с библиотеками Valve в локальный пакет игры ([Онлайн-кооп](../online.md)). |\n\n## Правила разработки\nПринципы разработки, проверки перед тем, как назвать работу готовой, и правила коммитов лежат в [`CLAUDE.md`](../../CLAUDE.md).\n\n## Старая версия\nЗаброшенная песочница-архипелаг хранится под git-тегом `simulator-game`.\n"}, {"id": "tools-assets", "path": "tools/assets.md", "title": "Ассеты", "section": "tools", "date": "2026-11-16", "md": "# Ассеты\n\nОткуда в игре берутся модели, звук, шрифты и портреты.\n\n## Как устроено\n\n- **Модели.** Пирс, станция, форт, флоппы, мина и детали лодок — турель, люлька и минный жёлоб — моделируются в Blender из скриптов в `tools/`: `blender -b -P tools/dock.py` пишет `game/base/dock.glb`, `tools/outpost.py` — `game/areas/outpost.glb`, `tools/fort.py` — `game/areas/fort.glb`, `tools/floppas.py` — `game/people/floppas.glb`, `tools/minerail.py` — жёлоб в `game/ships/parts/` и мину в `game/combat/`, `tools/turret.py` и `tools/cradle.py` — в `game/ships/parts/`. Цвет и отделка каждой грани лежат на её вершинах, затенение неба и то, из чего грань, — в первой UV, запечённые при записи ([Свет](../art/light.md), [Материалы](../art/materials.md)); после правки их правил перезапусти все скрипты. Лодки строятся в коде по линиям корпуса (`game/ships/`). `tools/catalogue.sh <out>` рисует каждую лодку, которую строит верфь, в `<out>/index.html` с фильтром по деталям.\n- **Звук.** Нарезан из записей CC0 на Freesound (`game/assets/sounds/`, источники в его `Licenses.txt`); перед скачиванием владелец одобряет список (идентификаторы, авторы, размеры).\n- **Музыка.** Играет на инструментах, сэмплированных из библиотек CC0 (`game/assets/sounds/music/`).\n- **Шрифты.** Гарнитуры интерфейса Nunito, Caveat и EB Garamond имеют открытую лицензию OFL (`game/assets/fonts/`, лицензии рядом).\n- **Портреты диалогов** (`game/assets/portraits/<speaker>-<face>.png`) — заглушки до рисунков художника; откуда они и что с ними дальше: [Люди: флоппы](../art/people.md).\n"}, {"id": "tools-code", "path": "tools/code.md", "title": "Код", "section": "tools", "date": "2026-11-16", "md": "# Код\n\nКак устроен проект `game/`: старт, корень композиции и общие части.\n\n## Как устроено\n\n`game/` — игра на Godot 4.7 (.NET). Вики говорит, что игра делает сегодня, с решениями без владельца там, где дизайн молчит (каждое называет свой вопрос). Числа настройки живут в коде. `Pirates.sln` содержит проект, `Directory.Build.props` задаёт параметры сборки.\n\nИгра открывается главным меню над морем открытого мира (`Missions.World`, карта `maps/world.json`) и продолжается с последнего сохранения (`Progress.Latest`, `Whereabouts`); пассат дует с направления, выбираемого заново при каждом старте. Гавань (`base/`) — мастерская корабела на сваях в лагуне острова: к ней доплывают и швартуются, не покидая мира, там продаётся добыча из трюма (`haul/`) и открывается верфь ([Открытый мир](../gameplay/missions.md), [Гавань](../base/pier.md)). `ui/Curtain.cs` скрывает мир, пока не скомпилирован код игры без демо (`common/Precompiling.cs`, в пуле потоков, ведь первый запуск метода, оставленный JIT, задерживает свой кадр) и пока шейдерные пайплайны не перестанут компилироваться, в окне с названием игры, и пишет, что поднимается. Приложение называется Floppa Tropical Adventures (`project.godot`); его пользовательские данные остаются в `app_userdata/Pirates` (`custom_user_dir_name`), где лежали сохранения, настройки и логи.\n\n`Game.cs` — корень композиции, разложенный по частям: выход в море (`Game.SettingOut.cs`), швартовка в гавани, торговцы и конец захода (`Game.Home.cs`), круги арены и их вставки (`Game.Cuts.cs`), кооператив (`Game.Online.cs`). `World.cs` строит общий мир (небо, море, землю, бой, припасы, эффекты, звук) из локации (`scenery/`), которую собирают и `Game`, и `Stage` демо. Новая локация — новая сцена: небо, вода и земля мира — глобальные для рендерера, поэтому стоит один мир за раз. `common/` хранит то, что общее для всех систем; каждая другая папка — одна система. Единицы — метры.\n\n## Открытые вопросы\n- [Q106](../questions/gaps.md#q106): оставить ли имя Pirates в коде.\n"}, {"id": "tools-demos", "path": "tools/demos.md", "title": "Демо", "section": "tools", "date": "2026-11-16", "md": "# Демо\n\nМаленькие сцены, каждая из которых показывает одну часть игры отдельно, чтобы увидеть и проверить её вне остального.\n\n## Как устроено\n\n`game/demos/` хранит маленькие сцены, каждая ставит одну часть игры отдельно, чтобы увидеть и проверить её вне остального (правило есть в [`CLAUDE.md`](../../CLAUDE.md)). Демо — это папка: его скрипт и по сцене на каждый кейс с заданными в инспекторе значениями скрипта, как хочет этот кейс. Они входят в каждую сборку.\n\nЗапустить демо можно из меню игры (Esc), «Инструменты» → «Демо» (селектор, `demos/Demos.tscn`), из редактора Godot по F6 на его сцене или скрытно через `tools/demo.sh`: четыре кейса сразу на машине, какая бы сессия их ни запускала; свободное место берёт ждущий кейс того прогона, что занимал места меньше всех, так что прогон коротких кейсов не ждёт за прогоном долгих (у каждого из четырёх мест свои порты кооператива, так что кейсы `Coop` идут рядом), самые долгие первыми, чтобы места кончали вместе, и каждый проваливается, проработав втрое дольше своего времени, самого короткого из трёх последних удачных прогонов (не меньше двух минут; десять минут, `DEMO_LIMIT`, если удачного не было), в 640x360 (`--full` для размера игры; `--film` снимает каждый кейс фильмом со звуком, `<out>/<Demo>-<Case>.avi`), фиксированными шагами по 1/20 секунды, чтобы прогон играл одинаково при любой нагрузке: так кейс идёт вдвое быстрее, чем по 1/60, а проверки держатся, потому что лодки и ракеты игра шагает своими короткими шагами. По 1/60, как сама игра, идут фильм и кейсы `Coop`: хост должен слышать гостя, вторую игру в реальном времени, так же часто, как хост игрока; `--steps <n>` задаёт шаг всем кейсам, например 60, чтобы смотреть движение покадрово. Без имён идут `Opening` и все демо. `--since <rev>` запускает демо, которые показывают файлы, изменившиеся с `<rev>`, и незакоммиченные тоже, но только столько кейсов, сколько кончится за 120 секунд (`DEMO_BUDGET`, в облаке вдвадцатеро больше), поделённых между прогонами, идущими на машине: сначала демо изменённых файлов, потом те, что показывают общий файл, и в каждой группе первым кейс, дольше всех не проходивший (проваленный не проходил, так что идёт снова первым). Оставленные он называет, их берут следующие прогоны, а по имени они идут сразу. С 22:00 до 9:00 владелец спит рядом с машиной, и прогон идёт тихо: по одному кейсу на всей машине, со скоростью самой игры и в фоновом режиме macOS, на экономных ядрах (`DEMO_QUIET=1` или `0` решает это в любой час). Облик судят на кадрах размера экрана владельца, `--size 3024x1964`: обычный кадр рисует мир в 640×360, и всё, что задано в пикселях, выходит на нём мягче. Медленные (`Opening`, `Coop` и верстак `Menus`) идут тогда только за своими файлами или по имени. Прогон печатает только проваленное: проверки, ошибки и предупреждения; кадры и логи лежат в папке вывода. Время удачных прогонов он хранит в `~/Library/Caches/Pirates/demo-times`, где его не стирает перезагрузка. Сборку старше её C#-файлов он не запускает и просит сначала собрать игру. Окно «Кейс» селектора хранит значения инспектора показанного кейса в их единицах; изменение одного открывает кейс заново с ним. Esc и «Назад» в списке покидают селектор раньше, чем кейс успеет взять клавишу, а список складывается в полоску. Щёлкнутая строка держит клавиши: W S или стрелки шагают по списку, Enter открывает строку, щелчок по сцене возвращает клавиши кейсу.\n\n`Opening` (`demos/Opening.tscn`, вне селектора) проверяет старт игры, сыгранный указателем и клавишами: главное меню над водой в виде боя, бой под ним стоит, «Продолжить» и «Загрузить», когда есть сохранение, «Новая игра», «Настройки», «Выход», и лодка там, где её оставило последнее сохранение (кадр `title`); Enter на первом пункте отдаёт вид боя, HUD и руль, а пришвартованная лодка сперва отчаливает; отладочная карточка закрыта; `R` листает радио по кругу (кадр `radio`); карта открыта и закрыта Esc; меню, его настройки, строки судового журнала и страница «Инструменты» и Esc, возвращающий в бой; швартовка на `Space` у пирса с добычей в трюме, лента пирса, экран корабела с плитки «Торговец», где `Enter` продаёт ящик, а `Esc` ведёт назад к ленте, верфь, меню над лентой, «Отчалить» в то же живое море и гибель в море: кадр `died` — полосы с «Погиб», затем загрузка последнего сохранения: лодка у причала, где игра сохранилась. `Selecting` (`demos/Selecting.tscn`, тоже вне селектора) проверяет селектор над кейсом `Pause/Menu`: Esc и «Назад» покидают его, клавиши шагают и открывают строки, список складывается. `Catalogue` (`demos/Catalogue.tscn`, тоже вне селектора) рисует каждую лодку, которую строит верфь, по кадру на лодку: `tools/catalogue.sh <out>` запускает его примерно за минуту и раскладывает кадры в `<out>/index.html`, с фильтром по деталям. `Gallery` (`demos/Gallery.tscn`, тоже вне селектора) — тот же `Catalogue` с `Gallery = true`: по кадру на корпус, мотор, палубную деталь и охотника для их страниц в [сайте вики](../README.md); `tools/demo.sh <out> Gallery`, кадры кладутся в `wiki/img/parts/` без приставки `Gallery-`.\n\n| Демо | Что показывает |\n| --- | --- |\n| `Broadside` | Лодка, стреляющая ракетами (`Rockets`) или торпедами (`Torpedoes`, `TorpedoesShoreward` — к берегу) в другую: попадания, потопление, высыпавшиеся предметы, сбитые плиты, плотники. Parry: ракеты двух сторон сбивают друг друга в воздухе. Awash: курьер на последнем попадании, осевший в воду, тонет от залпа с траверза, и ни одна ракета не проходит над ним. Aim: гонщик под HUD наводит точку на охотника впереди траверза правого борта, потом на другого позади траверза левого, потом на открытую воду, и стреляет только тот борт, чей веер держит точку; ракеты, пущенные в открытую воду, гаснут на краю досягаемости, не дальше. Hunter: стреляет охотник, и его ракета летит заметно дольше ракеты игрока. Lock: ракеты по захваченной цели под HUD, клавиша борта тускнеет, пока он перезаряжается, и загорается снова. Chaser: гонщик с носовыми стойками, преследующий лодку, идущую прямо от него, каждый залп уходит впереди её носа. Mines: гонщик с минным жёлобом сбрасывает по мине с борта, за ним по пятам таранщик, и правила жёлоба по одному (никогда для своей стороны, взвод, седьмая мина, выстрел и его цепь). |\n| `Bystanders` | Рабочие лодки ([Жизнь моря](../world/life.md)). Round: рыбак ходит между гаванью по одну сторону острова и косяком по другую, вокруг суши, тралит там, наполняя трюм, и останавливается выбрать сети. Shots: гонщик между двумя маршрутами бьёт бортом по парому, тот убегает и потом идёт в гавань, и другим бортом по рыбаку, тот тонет и высыпает трюм. Meeting: рейс парома только считается, пока лодки игроков далеко, получает лодку, когда одна рядом, и теряет её, когда та ушла; вернувшаяся лодка игрока застаёт паром дальше по пути. Timetable: паром на переходах длиннее, чем успевает спокойным ходом, прибавляет ход и выходит из каждой гавани точно по расписанию. Fishing: облётная камера вблизи рыбака на косяке: сеть тянется за кормой на поплавках (кадр `trawling`), поднимается полной (кадр `hauled`), переносится на палубу (кадр `inboard`), пустеет и уходит обратно, а рыба выпрыгивает на косяке. |\n| `Components` | Верстак системы интерфейса над видом боя на лодку у пирса, кейс `Sheet`: кадр `palette` — вся [палитра](../art/palette.md) именованными образцами на матовом окне; кадр `components` — стеклянные плитки над пирсом и над мелководьем и стёкла HUD (линза, уведомление, плитка расходника, слот трюма); кадр `glass` — пилюли меню и клавишные пилюли, карточки деталей, колпачки клавиш и кнопки геймпада над мелководьем и над песком, выноски. Кадр `tools` — окно инструмента с одним элементом каждого вида над лагуной (`Tooling.cs`): кнопки в покое, под указателем, путь вперёд и недоступная, поля, выбор с открытым листом, число, ползунок, переключатели, вкладки, строки и список. Кадр `banner` — строка диктора трижды: с подписью в цвете игрока, без подписи и предупреждение. Всё — [базовые компоненты](../art/components.md) в своих состояниях. |\n| `Coop` | Две игры на одной машине, каждая начинает в своём море: одна открывает игру со страницы «Кооператив» меню, другая находит её в сети из своего меню и входит в море хоста: обе лодки в ходу на обоих морях, меню гостя не останавливает бой, гость швартуется у пирса хоста, и хост видит его лодку у места, гость переоснащает лодку на верфи, и хост видит лодку с новым корпусом, гость выходит из игры в своё море; опасности хоста (мины, башня, батарея, пятно) у гостя (Coop/Hazards); дроны хоста и тот, что взят на борт, выброшенный, о спуске и подъёме которых море гостя сообщает (Coop/Drones); турели обеих лодок, летящие на море гостя, когда хост стреляет (Coop/Turret); свечение стоек охотника хоста перед залпом у гостя (Coop/Tell); потопленную лодку гостя поднимает хост, державшийся рядом с обломками (Coop/Revive); меню гостя сбрасывает газ, а бой идёт дальше, заголовка «Пауза» нет, а лодка хоста в его команде на плаву (Coop/Paused); гость платит ящиками своего трюма за ремкомплект и бронеплиту, хост чинит и бронирует его лодку, и гость видит надпись о каждом, как и о заплате своих плотников за катерок, потопленный его ракетами, и о ремонте, который его лодка взяла с воды; хост говорит по-русски, а цель и объявление его задания гость читает по-английски (Coop/Kits); гость сам находит спрятанную посылку карты хоста, наезжает на жетон буйства, который хост убирает с обоих морей, видит счёт и часы, как у хоста, узнаёт о полёте своей лодки, которую хост подбросил над водой, топит ракетами катерок, хост объявляет буйство удавшимся, и ящики всплывают на море гостя, а у хоста нет (Coop/Toys); моменты боя, которые ставит хост (парирование, удар и починка корпуса, потопление и уход под воду, сбитая плита, дым), море гостя сообщает как море хоста (Coop/Fight). |\n| `Crowd` | Двенадцать охотников на постоянных приказах: много лодок сразу, внеэкранные дешевле. |\n| `Dialogue` | Lines: сцена сюжета, рассказанная капитаном и корабелом: реплика с каждой меткой, сказанная по буквам, пролистываемая Enter, ответ, выбранный номером, даёт монеты, ставит флаг и прыгает по нему, Esc прокручивает до ответов и до конца, а повод выбирает свою сцену. Radio: ялик в ходу под HUD, пока сцена повода радио говорится в углу, клавиши доходят до боя, второй повод радио отброшен, диалог её выключает. |\n| `Drones` | Носитель спускает на воду двух дронов рядом с собой: они охраняют его, их посылают на охотника, и они его бьют, а один отозван и взят на борт. Carrier: люлька патрульного катера под управлением игрока под HUD: «Дроны» выбраны на рулетке, Q и E посылают дронов на захват цели, Q снова отзывает одного, а потерянный дрон отстраивается в своём гнезде. Standoff: лодка другой стороны держится в стороне от носителя на ходу, дальше поводка дронов; оба дрона, посланные на неё, бьют её с края своей досягаемости и не уходят за поводок. Где она лежит (`Ahead`, `Aside`) и газ обоих (`Throttle`) — в окне «Кейс». |\n| `Editor` | Редактор карт, сыгранный указателем и клавишами: форма рельефа перетащена, мир поднят заново, отмена, охотник удалён, карта переименована, добавлено минное поле, точка добавлена и перетащена, а её радиус задан, меню и окно «Открыть». |\n| `Effects` | Стенд того, как выглядит бой, в час из окна «Кейс» (`Hour`: день, рассвет, ночь). Reel: каждый момент огня по очереди вокруг лодки, которую держит вид боя: залп с борта, попадание ракеты, снаряды турели, торпеда, всплеск, ракета, погасшая на пределе, парирование, мина, сбитая плита, таран, взятый припас и потопление; после пика каждого момента сохраняется полоса из шести кадров (через 0,03, 0,1, 0,25, 0,6, 1,2 и 2,2 с), `Effects-Reel-NN-<момент>-<кадр>.jpg`. Close: тот же ряд, вид стоит вплотную к каждому моменту. Shore: ракеты и заряд рвутся на пляже и на его мелководье. Salvo: самый тяжёлый огонь сразу: две линии лодок в перекрёстном огне, мины между ними, тонущие ялики; демо само мерит время своих кадров и пишет строку `Salvo:` в лог (`HoldFire` в окне «Кейс» — те же лодки без огня, чтобы видеть, сколько стоит сам огонь). Wrecks: четыре лодки в ряд, побитые до каждой ступени урона, дымят и горят, не чинясь; самая побитая тонет, как охотник, потом лодка игрока — своим, более долгим путём. |\n| `Fleet` | UnderWay: один проект бортом к виду и в ходу; Spinning: разворот на месте одним рулём; Lineup: все корпуса в три ряда — игрока, банды и пиратов. |\n| `Fuel` | Dry: два гонщика бок о бок на полном газу с нитро, у одного бак пуст: он идёт, но меньше чем вполовину хода другого, и нитро закрыто. |\n| `Gamepad` | Только события геймпада. Sea: ялик под HUD, которым рулят, жгут нитро, стреляют, ставят дым и тратят заряд кнопкой Y. Sailing: сама игра: A на первом пункте главного меню, лодка в море, меню на Start и его страница «Инструменты», швартовка у пирса крестовиной вниз, плитки ленты, меню над лентой, верфь и «Отчалить». Подсказки показывают кнопки геймпада. |\n| `Arena` | Круг арены: Cut — первый вход играет вставку под полосами, вид стоит над кругом, пока лодка внутри, и возвращается к лодке за её пределами; Skipped — Space пропускает её; Placed — редактор, управляемый указателем: ставит круг арены, вставку и два кадра, привязывает, играет просмотр, сохраняет карту и читает её обратно. |\n| `Fort` | Форт пиратов на своей скале в свете мира ([Форт пиратов](../world/fort.md)). Approach: гонщик идёт мимо форта близко — орудия молчат, пока он дальше их досягаемости, потом бьют, а лодки пиратов выходят за ним; его кадры — вид боя и шесть ближних видов форта (ворота, тыл, бок, сверху, причал, двор). Passing: паром идёт мимо, лодка игрока далеко — орудия и пираты бьют паром, а лодку игрока не трогают. Band: охотник банды с соседнего поста и пираты бьют друг друга. Silenced: канонерка у бастиона разносит его орудие, и оно больше не стреляет. |\n| `Harbour` | Кольцо поплавков у пирса: Arriving — лодка с моря входит в кольцо и сбавляет ход, поплавки расступаются, фонари разгораются; кадры вида боя по секунде (час — `Hour` в окне «Кейс», ночь там же). Docking — сама игра: лодка в кольце без охотников рядом — фонари горят, охотник рядом — фонари гаснут и `Space` не швартует; без охотника `Space` швартует: лодка, пришедшая с моря носом к пирсу, встаёт у места (кадры `gliding 0`–`3`), лента поднята, HUD убран (кадр `moored`), плитка «Торговец» с пустым трюмом открывает экран корабела, `Tab` открывает верфь (кадры `coming over 0`–`3` — вид боя приближается к лодке), `Esc` возвращает к ленте, `Space` отчаливает, и руль снова ведёт лодку; охотник, подошедший к пришвартованной лодке, снимает её с места. Selling — то же с двумя ящиками в трюме: горит «Торговец», `Enter` открывает экран корабела, `Enter` продаёт выбранный ящик по полной цене, `Space` — второй, `Esc` ведёт к ленте, монеты в сохранении. |\n| `Hazards` | Опасности карты в открытом море: минное поле, взрывающееся цепочкой, мина, расстрелянная рядом с охотником, таранщик, огибающий мины; снаряды, падающие в своё кольцо (бомбы — тот же вид в окне «Кейс», `Kind`), кольцо башни-импульса и его бреши, батарея, ведущая огонь и разбитая в куски, прожектор, замечающий ялик, горящая нефть и бочки, которые толкают и взрывают. |\n| `Haul` | Slots: ялик с четырьмя тюками ткани на борту собирает ящики потопленного гонщика: первый ложится в свободное место, каждый следующий встаёт на место тюка, а тюк падает за корму и остаётся; тюк дальше по курсу, не дороже самого дешёвого на борту, остаётся на плаву. Ряд трюма на HUD. Второй ялик с трюмом бочек топлива отстаёт, оставляет тюк на плаву, а в конце тонет и высыпает все бочки. Cache: тайник карты на плаву, его ящики собираются. |\n| `Hunters` | Охотники одной роли за кружащей лодкой (`Rammer`, `Swarm`): планирование, рулёж, стрельба, таран; InItsWay: побитый охотник подбирает ремонт на своём пути. Post: сторожевой пост из двух канонерок держится, пока гонщик не войдёт в зону их зрения, гонится за ним, пока видит, а когда гонщик, жгущий нитро, уходит из вида, забывает о нём и возвращается к постам. Chased: два таранщика за гонщиком бьют его с борта или с кормовой четверти. Narrows: путь таранщика к стоящей добыче лежит между двумя кекурами, стоящими теснее его ширины (`Gap` в окне «Кейс»): он нигде не застревает дольше нескольких секунд и выходит за кекуры к добыче; кадр `astern` — задний ход из щели. |\n| `Instruments` | HUD целиком над одним морем на кейс: Deep — глубокая вода, Shallows — яркое мелководье и пляж, Night — ночь. Лодка под HUD с низким топливом получает удар, жжёт нитро и ставит дым и остаётся почти без топлива; на кадрах приборы, рулетка, панель расходников, ряд трюма, уведомление, таблички цели и охотника и предложение работы; на кадре `rest` — строка диктора о потопленной лодке, на кадре `nitro` — шкала радио у приборов. Кадр `map` — карта кораллового острова, открытая над этим морем, с кольцом на месте цели. |\n| `InterfaceSounds` | Каждая реплика интерфейса, сыгранная по очереди или та, по которой щёлкнули, чтобы её послушать. |\n| `Kits` | Расходники, оплаченные ящиками прямо из трюма: целому ялику ремкомплект не дают, ящики остаются; получив удар, он чинится (металл + ткань) и ставит бронеплиту (два металла); с почти пустым нитро баллон не дают, пока на борт не придёт ящик механизмов к бочке топлива, потом он пьёт его; заряд (взрывчатка + электрика) бьёт охотника рядом, щадя ялик, а второй, без ящиков, не дают. Панель расходников и ряд трюма в левом нижнем углу. |\n| `Landforms` | Одна из форм рельефа редактора по своему пресету в открытом море локации, лодка идёт на неё, пока берег не удержит лодку: Peak спереди, кромка перед лодкой, виденная насквозь; Reef — барьерный риф с моря, его отмель держит лодку; Sea stacks спереди; Spit спереди, кончик косы с пальмами; Bars, три отмели удерживают броненосец; Beside — броненосец без хода поставлен вплотную к отвесному кекуру: в его корпусе нет камня, и берег его не выталкивает. Вулкан, сандбар и одинокий столб выбираются в окне «Кейс» (`Form`). |\n| `Lights` | Единственный свет сцены на лодке и шарах в море: `Noon` — в полдень, `Dawn` и `Dusk` — на рассвете и на закате. Час (`Hour`), конструкция (`Design`) и кружение камеры (`Circling`) — в окне «Кейс»: рассвет, закат, сумерки, ночь и патрульный катер тоже там. |\n| `Menus` | Один облик меню и кнопок на кейс, над лодкой у пирса (или над боем, `AtSea`): меню, сыгранное клавишами, геймпадом и указателем, переключатель и шкала его страницы «Настройки» (шкалу шагает только собственное меню игры), предупреждение «Выход», уведомление и его отдельные кнопки; на каждом кадр сохраняется. `Current` — собственный облик игры; `Quiet`, `Glass`, `Notebook`, `Atlas`, `Device` и `Dashboard` — предложенные облики, каждый в `Looks/<Look>/`. `Motion` — движение меню полосой кадров `Menus-Motion-NNN-<этап>.jpg`: приход, линза света по клавишам и за указателем, нажатие клавишей и указателем, переключатель. |\n| `Music` | Одна музыка. Rising: нарастает от спокойствия до пика боя с каждым мотивом, затем её фанфары или плач; станция радио (`Dial`) и пьеса (`Piece`) — в окне «Кейс». Stations: посреди боя шкала радио проходит все станции и «выключено»: каждая станция берёт пьесу с начала и играет дальше, без радио часы музыки идут, станции различаются ладом, темпом и инструментом мелодии, и каждая звучит: её играет собственный композитор демо, так как скрытый прогон немой. Shanties: то же, что Rising, на станции «Шанти», на экране имя песни; каждая песня полная, с куплетами и ответами команды, и звучит от начала до последнего такта, спокойно и в разгар. |\n| `Objectives` | Одно событие мира на кейс (`Escort`, `Beacons`, `Courier`, `Cargo`, `Ironclad`) с того места, где оно начинается, под HUD: его лодки выходят в море, лодка игрока доходит до первой отметки, а потопленная проигрывает задание. |\n| `Outpost` | Станция в открытом море в свете мира: Alongside — гонщик у её плота даёт залп в корпус, и ракеты рвутся о него, ялик, идущий в другой борт, упирается в корпус, а станция качается на зыби там, где стоит; его кадры — вид боя и шесть ближних видов (борт, нос, корма, крыши, плот, сверху). Trade — сама игра в мире (как `Opening`): у станции с пустым трюмом, целым корпусом и полным баком Space ничего не открывает; с тремя ящиками открывает экран мытаря, Enter продаёт выбранный ящик по цене станции, остальные остаются, Space продаёт их, монеты попадают в сохранение, Esc возвращает руль. Buying — побитая лодка с полупустым баком и десятью монетами: ремонт, на который монет мало, вздрагивает и не покупается; после продажи сундука ремонт чинит корпус, топливо заполняет бак, каждое за свою цену, и обе карточки бледнеют с «полно». |\n| `Pause` | Меню игры над лодкой в море, мир за ним в мягком фокусе, а справа вверху — где ты, с выдуманного места у острова с вулканом; имена мест на карте мира. `Menu` — страница «Инструменты» открывается вместо пунктов меню, Esc возвращает к ним, Esc на них берёт «Продолжить», и мир снова резкий, «Выход» с первого нажатия только предупреждает. `Crew` — меню как онлайн, по-русски: без заголовка, с командой из двух лодок, одна на плаву, другая на дне. `Saves` — судовой журнал поверх моря: S проходит по строкам, «Загрузить» есть только у строк с сохранением; кадр `row` — выбрана строка в игре, `overwrite` — «Сохранить сюда» поверх сохранения только предупреждает; «Новая игра» с первого нажатия только предупреждает. `Settings` — страница «Настройки» меню по-русски (кадр `settings`): каждая настройка на экране, даже самые длинные слова. |\n| `Pickups` | ThreeInItsPath: лодка, проезжающая по припасам нитро, ремонта, брони и топлива; TurningUp: припасы, появляющиеся вокруг неё. Supplies: припас точки снабжения взят и снова на месте. Airdrop: ящик спускается на парашюте, и взять его можно, только когда он сел на воду. |\n| `Quay` | Лодка у пирса под лентой: вид боя, придвинутый к месту у пирса, и лента «Торговец», «Верфь», «Отчалить» внизу экрана. `Moored` — лодка лежит у своего места, плитки на экране (час — `Hour` в окне «Кейс», ночь там же); `RacerRammingIt` — лодка, пущенная на настил у первого места, не въезжает на него (кадр `at the deck`). `Motion` — движение ленты полосами кадров: приход плиток, покой, свет, скользящий по клавишам и за указателем, нажатие клавишей и указателем, уход; кадры `Quay-Motion-NNN-<этап>.jpg` по порядку в папке вывода, каждые два кадра (в покое реже, пока по ряду не пойдёт полоса света), и кадр ряда в окне 1280×720. |\n| `Ramming` | Лодка таранит другую в борт: удар, невредимый таран, чинящая помпа. Charging: удар носом на нитро без тарана: бьющий получает меньше, а бьёт сильнее. |\n| `Rivals` | Соперники ([Соперники](../gameplay/rivals.md)). Looting — две команды по бокам от обломка курьера, который высыпает ящики, с суши подходит ялик банды, выход с моря в паре сотен метров, лодка игрока в стороне, и её HUD называет команды и показывает лица капитанов: команды гонятся за ящиками, дерутся с бандой, и одна уходит через выход с добычей, а её запись богатеет; команда, что привезла больше, ходит на лодке дороже (кадры gathered, left). Calls — команда, чей капитан в прошлый раз потопил лодку игрока, подходит к ней и злорадствует по радио; после удара лодки игрока кричит, потопленная говорит прощальные слова, а её запись «потоплен» переживает загрузку сохранения (кадр radio). |\n| `Run` | Бесконечный заход под HUD. Offers: буи дающих горят там, где их поставила карта, и обведены на карте (кадр `map`); задания нет, пока лодка не легла у буя и не взяла его (кадр `buoy`); пока оно идёт, буи темны. Done: задание взято у буя, маяки пройдены один за другим, оно выплачено добычей и припасами. Failed: транспорт эскорта потоплен, задание снято вместе с маяком. Ironclad: броненосец у стоянки с самого начала, без строки в целях и без объявлений; потопленный, он разбрасывает припасы, но «Задание выполнено» нет, и сколько бы ни шло время дальше, он не возвращается. |\n| `Sounds` | Звук мира вокруг лодки в открытом море ([Звук](../audio/sound.md)). Скрытый прогон немой и проверяет логику; снятый фильмом (`tools/demo.sh --film`) звучит и печатает показания шин. Cues: каждая реплика мира по очереди, рядом, на дальности боя и далеко за краем вида: там она звучит позже, но не позже предела, и только дальними слоями; строка, по которой щёлкнули, играет свою. Salvo: худший случай — залпы трёх лодок, попадания, потопления, цепь мин и торпеда рядом; ни один слой не звучит большим числом голосов, чем у него есть, реплики, пришедшие разом в одно место, сливаются, отнятый голос затухает. Motor: обороты лодки от холостых до полных, сброс, рывок, бросок вверх и посадка со шлепком, задний ход, пока другая проходит мимо полным ходом: у мотора один игрок, чья собственная громкость стоит на месте, проходящая лодка слышна выше и ниже. Shoal: гонщик полным ходом выходит на банку острова, его корпус ложится в грунт и скребёт по нему. Island: гонщик идёт от пирса вдоль берега острова: слышны прибой рядом, чайки над пляжем, пальмы и мастерская за работой. В Motor геймпад вибрирует от жёсткой посадки и от мины, взорвавшейся рядом. Mix: шины как разложены, приседание под взрывом мины, приглушение под экраном и при потопленной лодке, приседание музыки по громкости эффектов. |\n| `Sea` | Море с островом на его банке: волны, пена, блики, прибой, укрытие; `Shallows` выключен — открытое море. Night — открытое море лунной ночью, с серебряной россыпью бликов в стороне луны; час (`Hour`) — в окне «Кейс». `Atoll` и `Stacks` — атолл и скалы бухты с карты мира, с той стороны, откуда идут волны: прибой у края рифа и белое у подножия скал (`Landform` в окне «Кейс» — любая форма рельефа карты мира по имени). |\n| `Settings` | Локация (`Place`: World или Coral cay) с точки зрения боя: её вода, час, земля и досягаемость канонерки в ней. |\n| `Sites` | Косяк и обломки с точки зрения боя и в виде сбоку: рыбалка и подъём, карточка рыбы. Chosen: закреплённые обломки с ящиками карты, поднятое ложится в трюм. Sunk: затонувший охотник становится обломком. Full: в трюме без мест добыча остаётся. Косяк или обломки выбирает `Site` в окне «Кейс». |\n| `Smoke` | Дымовая завеса поставлена, дрейфует и редеет, и ослеплённый ею охотник, под HUD; тепловизор. |\n| `Storm` | Шторм, который не уходит, вокруг лодки на ходу ([Погода](../world/weather.md)): высокие волны с барашками, сумрак, дымка, низкие тучи, ливень и молнии. `Heart` — лодка в сердце шторма, `Edge` — на его краю, внизу вида спокойная вода, `Bolt` — кадр сразу после удара молнии рядом с лодкой, `Gentle` — то же с настройкой «Меньше вспышек», `Map` — карта в миг, когда плывущий шторм идёт через середину мира, а лодка стоит под ливнем стоящего; мир за стеклом карты в мягком фокусе, а через миг на карте появляются лодки: своя оранжевая стрелка и стрелка товарища цвета аква, `Afar` — шторм издалека, на широком виде, `Within` — изнутри, на широком виде. |\n| `StoryEditor` | Редактор сюжета, сыгранный указателем и клавишами на приветствии верфи, никогда не сохраняется: отрывок добавлен двойным щелчком, набрана реплика, протянут провод, показана и исправлена ошибка, сцена рассказана как отредактирована. |\n| `Toys` | Забавы. Rampage — сама игра на своей карте в открытом море: гонщик идёт на жетон буйства (кадр `token`) и наезжает на него, в списке целей встают счёт и часы (кадр `began`), он никого не топит, время выходит, и ему ничего не платят; жетон возвращается через минуту, гонщик берёт его снова и ракетами топит три катерка у борта (кадр `volley`), буйство удалось, вокруг всплывают ящики. Jump — сама игра в открытом море с ветром и зыбью мира: лодка идёт полным ходом на нитро; полёт от секунды объявлен (кадр `flight`), подскоки короче — нет, долгий полёт доливает нитро, самый долгий записан рекордом; корпус — `Design` в окне «Кейс». Packages — сама игра: гонщик идёт на три спрятанные посылки в ряд (кадр `package`), находит две (кадр `found`), сохранение знает их по карте и номеру; посылки моря разложены заново, как при загрузке игры, и всплывает только третья; она найдена, и вокруг всплывают ящики; сохранение, записанное в пустой слот и прочитанное обратно, хранит найденные посылки и рекорд полёта. World — море мира: каждый жетон буйства лежит у поста охраны, каждая из десяти посылок — в стороне от старта и от других, все на воде, глубокой для самого глубокого корпуса верфи и соединённой со стартом, в стороне от опасностей; по кадру на жетон и на посылку. |\n| `Turrets` | Гонщик с двумя турелями, кружащий вокруг трёх стоящих патрульных катеров, снабженец его стороны, ложащийся в дрейф среди них, и недосягаемый ялик: турели сами поворачиваются, упреждают и стреляют только по катерам в досягаемости. Smoke: завеса патрульного катера слепит турель. |\n| `Wanted` | Розыск и патруль под звёздами HUD ([Розыск и патруль](../gameplay/wanted.md)). Raised: гонщик топит рыбацкую лодку и попадает в розыск; с поста приходит одна лодка патруля, видит его и стреляет (кадр `stars`). Hunted: он топит две, приходит весь ближний пост, дальний остаётся. Lost: в розыске он уходит из вида, уровень падает до нуля, патруль возвращается к посту. Prey: турель ялика не трогает паром рядом, пока ялик его не таранит, а потом бьёт по нему. |\n| `Weather` | Периоды погоды и ход суток ([Погода](../world/weather.md)): лодка на ходу в миг, когда период стоит целиком и светло. `Cloudy`, `Rain`, `Fog`, `CloudyAfar` и `FogAfar` — облачно и туман издалека; `Day` — часы идут с вечера. |\n| `Yard` | Верфь, сыгранная указателем и клавишами: места, детали, показатели, покупка, проект, который тонет, корпус, опробованный и взятый обратно; деталь, предлагаемая только на станциях, куда она подходит. Cradle: патрульный катер с люлькой, которую предлагают только позади миделя, по одной на лодку. |\n\n## Как написать демо\n\nКейс заслуживает сцены, если держит прогон на проверках, которых нет у остальных, или показывает то, чего не показывают остальные; другой ветер, зерно, проект или вид — дело окна «Кейс». Новый кейс — это сцена: скопируй одну в папке демо и поменяй значения её инспектора. Новое демо — папка со скриптом, наследующим от `Stage`, переопределяющим `Set`, чтобы поставить его вещи на воду (`Launch` выводит лодку в море), и `Checks` для того, чему прогон должен соответствовать в конце; `Seconds` — сколько прогон даёт ему играть. Сцена без моря наследует от `Demo` и строит в `Build`.\n\n## Открытые вопросы\n- [Q68](../questions/tools.md#q68): селектор и окна редактора после QA.\n"}, {"id": "tools-map-editor", "path": "tools/map-editor.md", "title": "Редактор карт", "section": "tools", "date": "2026-11-15", "md": "# Редактор карт\n\n![Редактор карт: окна в матовом стекле](../img/map-editor.jpg)\n\nРедактор в игре, в котором правят карты и их задания над живым миром.\n\n## Решения владельца\n- Редактор карт в игре, открывается из меню (с 2026-11-13 — `Esc`, «Инструменты»): локация карты (острова, рифы, отмели, вода, час, ветер, ветровые волны, зыбь) и её задания (старт, охотники и их команды, маяки, косяки и обломки), правятся над живым миром, виденным сверху. Карты — файлы: собственные карты игрока и собственные карты игры, которые открываются в нём, чтобы их чинить.\n- Редактор расставляет круги арены и кадры вставок ([Камера и картинка](../gameplay/camera.md)).\n\n## Как устроено (`editor/`)\n\nОткрывается из меню `Esc`, «Инструменты», пункт «Редактор карт» (`editor/Editor.tscn`), и правит карту над её живым миром: последнюю открытую карту, её задание и вид (`user://editor.cfg`), иначе первую карту игры без заданий, Coral cay. Карт у игры две: мир (`maps/world.json`, одно задание, игра `run`) и Coral cay (`maps/coral-cay.json`, без заданий). Файл, в котором нет карты, никогда не открывается (`Maps.TryRead`). Вид двигается клавишами, перетаскиванием правой или средней кнопкой, колесом и прокруткой трекпада (`EditorCamera`). Формы рельефа перетаскивают, растягивают и поворачивают; числа выбранной и числа локации — ползунки со словами и единицами, которые оставляют колесо прокручивать их окно (`Inspector`, `scenery/Fields.cs`). Почему ползунки через рефлексию: в записях карты по десятку чисел, и одна панель обслуживает их все. Земля добавляется из готовых пресетов игры, с сохранением имени пресета (`Presets.Forms`, `IForm.Name`); «Удиви меня» рисует карту случайно. Мир поднимается заново, когда локация постоит неподвижно мгновение, а её название не учитывается. Старт задания, закреплённые охотники, маяки и места промысла — метки, которые перетаскивают по морю, охотники пронумерованы как в своих строках; его игра, числа и музыка — в окне «Задания». События мира (`Events`: пути конвоя, курьера, маяков, груза, броненосца) редактор не показывает: они правятся только в JSON карты ([Q35](../questions/tools.md#q35)). Его зоны (`Areas`), среди них посты охраны с видами их охотников, добавляются из «Зон и опасностей» этого окна в середине вида и рисуются на море, угрозы красным, тайник золотым, припасы цветом своего предмета; точки выбранной перетаскивают, добавляют и убирают, а её числа, охотников, предметы или припасы задают в «Выбрано» (`Editor.Areas.cs`). Круг арены добавляется там же и рисуется сиреневым, как остальные зоны; в «Выбрано» у него список вставок, из которого его привязывают к вставке. Станция ([Станция](../world/outpost.md)) рисуется голубым: круг — вода, где идёт торговля, черта — её корпус по курсу, который задаёт ползунок. Буйство ([Забавы](../gameplay/toys.md)) — красный круг в точке жетона; в «Выбрано» у него ползунки «Потопить лодок» и «За время». Спрятанная посылка — золотой круг в своей точке; номер на её табличке — её номер в сохранении, так что удаление посылки сдвигает номера следующих.\n\nВставки задания (`Editor.Scenes.cs`) — в окне «Задания», под зонами: у каждой строка с названием и кнопками «+ Shot» (кадр ставится в середине вида), «Preview» и «Delete». Кадр рисуется на море сиреневой меткой с подписью «название · номер»; его перетаскивают, а у движущегося («Drifts» в «Выбрано») вторая метка, куда он сползает, тоже перетаскивается. В «Выбрано» у кадра ползунки секунд, высоты кадра, наклона и поворота. Предпросмотр играет вставку над живым миром под полосами, окна уходят, Space, Enter, Esc или щелчок кончают его (`ShotCamera`, `Letterbox`). Переименование вставки переименовывает её и у кругов арены, а удаление её или её последнего кадра снимает привязку. Почему так: кадры и круги арены — те же метки на море, что остальное, и правятся тем же перетаскиванием.\n\nCtrl+Z отменяет; серия изменений одной вещи — как одно, вместе с тем, что было выбрано; не отменяются сохранение, переименование и корзина. Строка состояния сообщает о каждом изменении и отмене и о том, отличается ли карта от последней открытой или сохранённой; заголовок говорит, где она хранится. Его окна (`Editor.Panels.cs`) и строка состояния — окна инструментов ([Экраны и меню](../interface/screens.md)); метки и таблички на море — стекло HUD, как у охотников в бою (`Lens`, тип `Plate` в `ui/look.tres`), подсвеченное ближайшим к цвету метки светом; «Выбрано» и «Задания» делят боковую сторону в фиксированных частях, чтобы ни одно не оттесняло другое, и каждое окно складывается. Меню и окно «Открыть» берут клавиши и указатель, пока стоят (затемнение поверх окон, `EditorCamera.Still`). «Открыть» — окно карт игры и игрока, которые оно переименовывает и кладёт в корзину (`Maps.Rename`, `Maps.Delete`); нажатие, которое потеряло бы изменения или удалило, просит второго нажатия.\n\nКарты — JSON (`scenery/Maps.cs`): собственные карты игры лежат в `maps/`, карты игрока в `user://maps`. Почему JSON: карта — несколько записей, читаемых и чинимых вручную. Карта чинится при загрузке (`Mending`): то, что уронило бы игру, повесило бы её или сломало бы море (пропавший список, неизвестный вид, число за пределами диапазона своего ползунка, охотник, которого нет в этой сборке), исправляется или выбрасывается с предупреждением, а карта, которую нельзя прочесть, говорит почему. Собственные локации игры узнают по имени их файла, поэтому переименование одной не ломает игру. «Сохранить» пишет карту туда, где её открыли, собственную карту игры только когда игра запущена из своего проекта; «Сохранить как свою» пишет среди карт игрока, а затем поверх этой копии. Неудачное сохранение говорит почему словами (`Maps.Write`). «Играть» сохраняет и выводит выбранное задание на копии последнего прогресса, которая никогда не сохраняется (`Progress.Copy`), и возвращается в редактор, когда заход кончается или нажато «В редактор» в меню паузы (`back` у `Game.TakeUp`).\n\nПост патруля — тот же пост с галочкой `Patrol` (кнопка «+ Пост патруля»): его лодки выходят только за лодкой в розыске ([Розыск и патруль](../gameplay/wanted.md)). Пост пиратов — с галочкой `Pirates` (кнопка «+ Пост пиратов»), а «+ Форт» ставит форт пиратов, черта от него показывает, куда смотрят ворота ([Форт пиратов](../world/fort.md)). Дающих задания (`Mission.Givers`) и постановки заданий (`Mission.Events`) редактор не правит: их пишут в файле карты.\n\n## Открытые вопросы\n- [Q35](../questions/tools.md#q35): чего не хватает редактору карт.\n- [Q68](../questions/tools.md#q68): окна редактора и селектора после QA.\n"}, {"id": "tools-release", "path": "tools/release.md", "title": "Сборки и посты", "section": "tools", "date": "2026-11-13", "md": "# Сборки и посты\n\nКак экспортируют сборки игры и публикуют новости в канал.\n\n## Как устроено\n\n- **Сборки.** `tools/build.sh` экспортирует закоммиченный `main` из временного worktree для macOS (universal) и Windows (x86_64) в zip-архивы `builds/Pirates-<version>-<platform>.zip`, по `config/version` в `game/project.godot`, и ставит коммиту тег `v<version>`. Версии вида 0.0.N, последнее число растёт с каждым постом; когда версия станет 0.1, говорит владелец. Сборки уходят на Google Drive через rclone на Mac владельца, и посты ссылаются на них (файлы Telegram бросили: у бота потолок загрузки). Сборку для Windows никогда не запускали. Веб-экспорт сделать нельзя: Godot 4.7 не экспортирует C# в веб, а в WebGL 2 нет вычислительных шейдеров для моря. Экспорт Godot завершается с кодом 0, даже когда терпит неудачу.\n- **Посты.** `tools/post.sh` публикует в Telegram-канал игры короткий русский текст, скриншоты, клипы и ссылки на сборки (он же выкладывает их на Drive) через навык `.claude/skills/telegram-post`. Публикация публична, поэтому владелец заранее одобряет текст и медиа каждого поста. Пост о возможностях — трейлер над списком: строка на возможность, эмодзи и название из двух-трёх слов.\n- **Облачная сессия.** `tools/cloud/setup.sh` готовит машину облачной сессии (.NET SDK, Godot, Xvfb с программным Vulkan от Mesa для прогонов демо; Blender как `blender` при `BLENDER=1`); хук начала сессии `.claude/hooks/session-start.sh` запускает его, когда чего-то не хватает.\n\n## Открытые вопросы\n- [Q95](../questions/gaps.md#q95): что войдёт в 0.1 и в первый публичный релиз; предложение — [Дорожная карта](../roadmap.md).\n- [Q97](../questions/gaps.md#q97): самый слабый компьютер и проверка сборки для Windows.\n"}, {"id": "tools-story-editor", "path": "tools/story-editor.md", "title": "Редактор сюжета", "section": "tools", "date": "2026-11-13", "md": "# Редактор сюжета\n\nРедактор в игре, в котором пишут сцены сюжета. Как сцены устроены и когда запускаются: [Сцены сюжета](../story/scenes.md).\n\n## Решения владельца\n- Сюжет рассказывают сценами, которые пишут во встроенном редакторе сюжета.\n- Сцена — это граф эпизодов на холсте. Каждый эпизод — сценарий: кто говорит, с каким лицом, и реплика с метками.\n\n## Как устроено (`storyeditor/`)\n\nРедактор сюжета (в меню `Esc`, «Инструменты», после редактора карт) пишет сцены в окнах инструментов редактора карт (`Tools`). Его окно «Сцены» перечисляет файлы в `res://story`: набранное там имя переименовывает сцену и её файл, если оно не занято другой сценой; «Открыть» и «Удалить» (в корзину) просят второго нажатия, если потеряли бы изменения. Холст (`Canvas`, `GraphEdit`) показывает каждый эпизод узлом с первыми строками, первый помечен как начало; провода читаются с переходов и ответов (`Screenplay.Parse`) и никогда не хранятся, а провод, протянутый между двумя эпизодами, пишет `-> target` в конец сценария первого. Двойной щелчок по холсту или «+ Эпизод» добавляет эпизод; перетаскивание сохраняется как его X и Y; переименование переписывает переходы и ответы, которые его называют. Узлы — бледное стекло с полосой заголовка в цвете проводов, первый — зелёный, выбранный — оранжевый; их и холст рисует тема окон. Сценарий выбранного эпизода — `CodeEdit` (`ScriptEdit`), раскрашенный `Colours`: цвета строк по их роли, цвет проводов и тень строки с ошибкой — группа `Screenplay` в `ui/look.tres`. Над ним палитра печатает говорящих, лица, метки и шаги; отмена в нём — собственная для редактора. Под ним перечислены ошибки (`Screenplay.Faults`), берущие клавиши к своей строке, а строки с ошибками помечаются по мере набора сценария. Окно «Сцена» хранит имя, повод, условие, приоритет и признак «Только один раз». Сохранить (Ctrl+S) пишет файл; Играть (F5) рассказывает сцену как она есть, сохранённую или нет, с `Teller` на копии последнего прогресса, которая никогда не сохраняется, и редактор снова берёт клавиши, когда она кончится.\n"}, {"id": "vision", "path": "vision.md", "title": "Об игре", "section": "", "date": "2026-11-16", "md": "# Об игре\n\n![Охотники идут на лодку игрока у острова](img/world.jpg)\n\nFloppa Tropical Adventures коротко: что это за игра и в каком она состоянии.\n\n## Решения владельца\n- Игра называется Floppa Tropical Adventures. Код и репозиторий по-прежнему называют её Pirates; игроку это слово не показывается.\n- Аркадная морская игра: одна лодка, которой управляешь с весёлым ощущением моторной лодки, а не физикой, бой с вражескими лодками на красивом море, статичный изометрический вид 2.5D.\n- Веселье важнее реализма: где реалистичная модель делает игру медленной или раздражающей, делаем то, что делают выпущенные игры. Реализм оставляем только там, где он делает игру лучше.\n- PC.\n- Кооператив по сети до четырёх игроков, каждый в своей лодке ([Онлайн-кооп](online.md)).\n- Сеттинг — оптимистичный соларпанк спустя долгое время после падения ([Сеттинг и лор](story/setting.md)).\n- 60 кадров в секунду достаточно; качество картинки важнее (2026-10-26).\n\n## Как играется\n- Игра открывается главным меню над морем и продолжается с последнего сохранения, в [открытом мире](gameplay/missions.md): одна большая карта ([локация](world/locations.md)) и бесконечный заход. Лодка дерётся с [охотниками](gameplay/hunters.md), которые выходят с [постов](world/areas.md) карты, берёт задания и собирает [добычу](gameplay/haul.md) в трюм.\n- Добычу продают за монеты в [гавани](base/pier.md), мастерской корабела на острове, или у плавучей [станции](world/outpost.md). К причалу доплывают сами и швартуются на `Space`: лодка остаётся в мире, а над морем встаёт лента «Торговать», «Верфь», «Отчалить». На [верфи](base/boatyard.md) на монеты покупают детали лодки.\n- Море живёт своей жизнью, как город в играх с открытым миром (2026-11-13): по нему ходят [рабочие лодки](world/life.md), которые ни с кем не воюют. Кто их трогает, попадает в [розыск](gameplay/wanted.md), и за ним приходит патруль. В углу карты стоит [форт пиратов](world/fort.md): он и его чёрные лодки нападают на любую лодку, что подойдёт близко. Задания берут у буёв флопп, по одному.\n- Утонув, лодка теряет трюм, а игра загружается с последнего сохранения ([Прогресс и сохранения](gameplay/progression.md)).\n\n## Состояние\n- Всё — прототип, и ничто не высечено в камне ([Главная](README.md)).\n- Задания и броненосец — заглушки, а не настоящие. Честность и доступность настраиваются ближе к релизу. Будут новые функции.\n- Владелец судит игру, играя; многое из сделанного в ноябре 2026 он ещё не играл ([Журнал решений](decisions.md)).\n- Версии 0.0.N выходят с постами в канале игры ([Сборки и посты](tools/release.md)).\n- Игра идёт к полному релизу в Steam; ближайший этап — альфа, доводка того, что уже есть. Что делаем до релиза и в каком порядке: [Дорожная карта](roadmap.md).\n- Как мы делаем игру — принципы и правила проекта: [CLAUDE.md](../CLAUDE.md).\n"}, {"id": "world-areas", "path": "world/areas.md", "title": "Зоны и опасности", "section": "world", "date": "2026-11-16", "md": "# Зоны и опасности\n\n![Горящее нефтяное пятно](../img/slick.jpg)\n\nЗоны — места на карте: посты охраны, минные поля и прочие опасности. В мире (`maps/world.json`) их около пятидесяти.\n\n## Решения владельца\n- Директора нет (2026-11-11): охотники выходят только с постов охраны, поставленных на карте. Охотников поста выбирают в редакторе по одному: проект, роль, команда.\n- Течений и бонов нет (2026-11-14): владелец убрал оба вида из игры.\n\n## Как устроено\nКарта отмечает зоны (`Area.cs`, хранятся в её файле по видам; зона вида, которого в игре больше нет, при чтении карты отбрасывается, `Maps`, `Mending`): круг вокруг одной точки или коридор вдоль цепочки точек шириной в свой радиус в каждую сторону (`Shape`). Почему одна форма: редактор рисует, двигает и размеряет любой вид одинаково, а коридор угроз получается даром. Зоны ставятся в начале захода и убираются вместе с ним. Оп
