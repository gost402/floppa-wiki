(world/hulk.md), [Форт пиратов](world/fort.md), [Броненосец](world/ironclad.md).\n- **[Онлайн-кооп](online.md).**\n- **Интерфейс:** [HUD](interface/hud.md), [Карта](interface/map.md), [Экраны и меню](interface/screens.md), [Судовой журнал](interface/logbook.md), [Настройки](interface/settings.md), [Управление](interface/controls.md), [Язык](interface/language.md).\n- **[Арт-дирекшн](art/README.md):** [Облик мира](art/world-look.md), [Облик лодок](art/boats.md), [Люди: флоппы](art/people.md), [Палитра](art/palette.md), [Компоненты интерфейса](art/components.md), [Стиль интерфейса](art/interface.md), [Свет и время суток](art/light.md), [Материалы](art/materials.md).\n- **Звук:** [Звук](audio/sound.md), [Музыка](audio/music.md), [Шанти](audio/shanties.md).\n- **Сюжет:** [Сеттинг и лор](story/setting.md), [Сцены сюжета](story/scenes.md), [Диалоги и голос](story/dialogue.md).\n- **[Инструменты в игре](tools/README.md):** [Редактор карт](tools/map-editor.md), [Редактор сюжета](tools/story-editor.md), [Меню читов](tools/cheats.md).\n- **[Отчёты](reports/README.md)** — отчёты и исследования, что были артефактами Claude: выбор облика, разборы, другие игры.\n- **[Известные недочёты](known-issues.md)** — что игрок видит или чувствует неправильным и что пока не исправлено.\n- **[Задачи](todo.md)** — что владелец решил, но в игре ещё не сделано.\n\n## Как вести вики\n- Всё — прототип, и ничто не высечено в камне. Решение — направление, в котором строить сейчас; любое может измениться, когда игра покажет лучшее.\n- Статья — об одной вещи игры (ракеты, нитро, швартовка): пара фраз о том, что это, и «Решения владельца» — список того, что действует сейчас, словами владельца, с датой.\n- Каждый факт живёт в одной статье — о своём предмете; другие статьи ссылаются на неё, а не повторяют его. Для новой вещи заводят новую статью (2026-11-20).\n- Новое решение встаёт на место того, что оно меняет, нынешним фактом с датой последней перемены. «Сменено», «убрали», «отвергли» не дописывают: снятое уходит со страницы, историю хранит git (2026-11-20).\n- Решение говорит, что в игре есть, а не чего нет: «целятся рулём», а не «мышью не целятся». Отрицание — только когда правило иначе не сказать, и коротко (2026-11-20).\n- Как игра устроена, вики не пересказывает: это видно в игре, а код ведёт Claude. Там, где владелец молчит, Claude решает сам и в вики это не пишет; что не понравится в игре, владелец поменяет (2026-11-17).\n- Последние решения на главной странице сайта собираются сами из дат в статьях.\n- Коротко, простыми фразами, по-русски; лодка — вещь: род своего существительного (лодка — она, катер — он), без олицетворения.\n"}, {"id": "art-README", "path": "art/README.md", "title": "Арт-дирекшн", "section": "art", "date": "2026-11-20", "md": "# Арт-дирекшн\n\nКак игра выглядит. Каждая тема облика — на своей странице.\n\n## Направление\nМир — солнечный тропический архипелаг ([Облик мира](world-look.md), [Море](../world/sea.md)); поверх него — стеклянный интерфейс ([Стиль интерфейса](interface.md)). Материал там, где он важен, остальное тихо.\n\n## Страницы\n- [Палитра](palette.md): цвета игры по ролям.\n- [Компоненты интерфейса](components.md): базовые детали, их состояния и движение.\n- [Стиль интерфейса](interface.md): образцы, стекло, шрифт, выноски.\n- [Облик мира](world-look.md): острова, песок, зелень.\n- [Облик лодок](boats.md): корпуса, ливреи, оснастка, банда охотников.\n- [Люди: флоппы](people.md): все жители мира — каракалы-флоппы, и их портреты.\n- [Свет и время суток](light.md): небо, солнце, ночь, рассвет.\n- [Материалы](materials.md): дерево, металл, стекло.\n\n## Решения владельца\n- Один облик везде: затенение, цвет и свет одни для всей игры ([CLAUDE.md](../../CLAUDE.md), принцип 3).\n- Вещи мира принадлежат миру: появляются, движутся и исчезают как его часть, а не рисуются поверх него по формуле (2026-11-20).\n- Прежде чем моделировать или перекрашивать что-то видимое, Claude спрашивает, каким владелец это себе представляет: короткий раунд вопросов по-русски о форме, материале, цвете и главных деталях.\n- Облик показывают кадры самой игры из демо или ссылки на настоящие игры (владелец, 2026-11-07).\n- Владелец судит облик, играя, и по кадрам игры.\n- Места в мире отмечают вещи мира со сдержанным тёплым светом, как стеклянные поплавки у причала (2026-11-12, [Швартовка](../base/mooring.md)).\n"}, {"id": "art-boats", "path": "art/boats.md", "title": "Облик лодок", "section": "art", "date": "2026-11-20", "md": "# Облик лодок\n\n![Все корпуса в ряд](../img/fleet.jpg)\n\nКак выглядят лодки игрока, охотников и соперников. Как лодка устроена и ходит: [Лодка](../gameplay/boat.md).\n\n## Решения владельца\n- Лодки выглядят как настоящие моторные (2026-10-28): седловатость, наклонённый и развалистый нос, планширь, кокпит, настоящие моторы, рубки и оснастка, у каждой поверхности своя краска, лак или металл.\n- Ливреи — гоночная графика (2026-11-02): смелые полосы от носа до кормы, крупный номер на носу, палуба контрастного цвета. Лодки освещены как море, но ярче: насыщенная краска, чёткий лак и хром, тёмный привальный брус обводит корпус.\n- Корпуса побольше несут рубку или пульт под жёсткой крышей; они нарисованы, но это не деталь. На палубах оснастка (леера, утки, бортовые огни, антенны, бухты троса, канистры) и приметы сеттинга: солнечные панели на крышах, парусиновые тенты, ветряки, зелень в кадках (2026-11-02).\n- Пропорции слегка преувеличены, чтобы лодка читалась с высоты боя: борта выше, моторы и ветровые стёкла крупнее, нос острее.\n- Охотники — банда со своим обликом: малиновый и чёрный, акульи зубы на носу, рваные полосы, потёртая краска (2026-11-02).\n"}, {"id": "art-components", "path": "art/components.md", "title": "Компоненты интерфейса", "section": "art", "date": "2026-11-20", "md": "# Компоненты интерфейса\n\n![Компоненты на стенде Components](../img/components.jpg)\n\n![Меню, клавиши, карточки и выноски на стенде Components](../img/components-glass.jpg)\n\n![Окно инструмента и его элементы на стенде Components](../img/tool-window.jpg)\n\nБазовые детали, из которых собран интерфейс, каждая в своих состояниях. Все видны разом на стенде `Components`. Как они выглядят: [Стиль интерфейса](interface.md); цвета — [Палитра](palette.md).\n\n## Решения владельца\n- У игры есть базовые компоненты (2026-11-11).\n- Весь облик интерфейса — в одной теме Godot, чтобы менять его быстро; каждая деталь, диалог тоже, берёт облик из неё (2026-11-12).\n- Выбранный пункт у всех пилюль тихий: тонкая кромка света и блик в стекле (2026-11-16).\n- Интерфейс красивый и быстрый: каждая деталь появляется, быстро въезжая из-за ближайшего к ней края экрана, и уходит за тот же край — например, когда начинается диалог (2026-11-17).\n"}, {"id": "art-interface", "path": "art/interface.md", "title": "Стиль интерфейса", "section": "art", "date": "2026-11-20", "md": "# Стиль интерфейса\n\nИз чего сделан интерфейс и как он выглядит. Его детали — [Компоненты интерфейса](components.md), цвета — [Палитра](palette.md); что где на экране — [HUD](../interface/hud.md), [Экраны и меню](../interface/screens.md).\n\n## Решения владельца\n- Образцы интерфейса — Frutiger Aero и Utopian Scholastic: оптимистичный глянец 2000-х, аква, небо и природа вместе с техникой и классическая антиква обучающих программ той эпохи (2026-11-02). По постеру Frutiger Aero (стеклянный шар, прозрачная волна с пузырьками, небо, листья, полосы света, мелкие подписи «// discover») сделаны кнопки причала (2026-11-11).\n- Интерфейс — прозрачное стекло Frutiger Aero с красивым движением уровня лучших инди (2026-11-11). Стекло — весь интерфейс: меню, HUD, карта, журнал, выноски и окна (2026-11-13). Оно прозрачное, с водой и светом за ним, с бликом и кромкой, сдержанное и спокойное, с широкими полями.\n- Оттенок прозрачного стекла закрывает 26–32% сцены, приборы HUD дымчатее на шаг (2026-11-12).\n- Выноска везде одна, стеклянная (2026-11-13). Предупреждение несёт свою метку, маленький знак предупреждения, и золотую кромку.\n- В интерфейсе простые слова: влево, вправо, старт, цель. Другие игры не называются ни в интерфейсе, ни в коде.\n- Шрифт интерфейса — Nunito: владельцу он нравится (2026-11-16).\n"}, {"id": "art-light", "path": "art/light.md", "title": "Свет и время суток", "section": "art", "date": "2026-11-20", "md": "# Свет и время суток\n\nОдно небо, одно солнце и одна луна на всю сцену; час суток идёт.\n\n## Решения владельца\n- Каждый час суток выглядит правильно. Ночь для скрытности появится позже.\n- Время суток идёт: сутки за 12 минут игры (2026-11-16). Ночь проходит быстрее дня: около восьми с половиной минут светло, две с половиной ночь, сумерки по полминуты; мир начинается в 13:00 (2026-11-17).\n- Солнце ходит по дуге перед камерой: восходит слева от её взгляда, в полдень стоит впереди, садится справа. Тени за день поворачиваются, дорожка света остаётся в верхней половине кадра (2026-11-20).\n- Ночь лунная и синяя: прохладный лунный свет, заметно темнее дня, но всё читается (2026-10-31).\n- Рассвет и закат тёплые и проходят через сумерки в синюю ночь (2026-11-01).\n- Все модели, и из Blender, и построенные в коде, несут запечённое затенение неба: свет неба гаснет в углах, под палубами, в комнатах и между листьями. Оно гасит только свет неба, а тени солнца и луны остаются живыми, поэтому верно в любой час (2026-11-16).\n"}, {"id": "art-materials", "path": "art/materials.md", "title": "Материалы", "section": "art", "date": "2026-11-20", "md": "# Материалы\n\n![Палуба ялика из выгоревшего тика у причала](../img/materials.jpg)\n\nИз чего сделаны твёрдые поверхности сверх краски: дерево, металл и стекло. Свет на них — [Свет и время суток](light.md).\n\n## Решения владельца\n- Дерево похоже на дерево: видны доски и швы, волокна только вблизи, тон немного разный от доски к доске. Дерево — выгоревший тик (2026-11-16).\n- Металл блестит (2026-11-16). Где блеск дорог для кадра, им можно поступиться: металл видно в основном издалека.\n- Дерево и металл рисует шейдер (2026-11-16).\n- Стекло в игре одно: ветровые стёкла и рубки лодок и фонари причала — то же прозрачное стекло, что у [станции](../world/outpost.md) (2026-11-17).\n"}, {"id": "art-palette", "path": "art/palette.md", "title": "Палитра", "section": "art", "date": "2026-11-20", "md": "# Палитра\n\n![Палитра на стенде Components](../img/palette.jpg)\n\nОфициальная палитра игры: каждый цвет интерфейса назван по своей роли. Имена ролей — в `game/ui/Hue.cs`, значения — в теме игры `game/ui/look.tres` (тип `Hue`, [Компоненты](components.md)); здесь — роли. Стенд `Components` рисует хранимые цвета прямо из темы.\n\n## Решения владельца\n- У игры официальная палитра, цвета названы по ролям (2026-11-11).\n- Цвета держат по одному смыслу: оранжевый — игрок и захват, красный — охотники, золотой — цель и места, аква — союзники и приборы, синий — броня.\n- Палитра маленькая, и её цвета сочетаются: цвет, который не сочетается, заменяют другим (2026-11-13). В ней два жёлтых, свои цвета деталей, краски ящиков и стекло цвета лагуны.\n"}, {"id": "art-people", "path": "art/people.md", "title": "Люди: флоппы", "section": "art", "date": "2026-11-20", "md": "# Люди: флоппы\n\n![Капитан](../img/captain.jpg)\n\nКто живёт в мире и как выглядит. Как они говорят: [Диалоги и голос](../story/dialogue.md).\n\n## Решения владельца\n- Все в мире — флоппы: каракалы, круглые и тяжёлые, с высокими ушами в чёрных кисточках, тёмными полосами от глаз к носу и светлыми подбородком и грудью (2026-11-03).\n- Флоппы сидят, как сидят кошки, передние лапы рядом перед собой (2026-11-06). На них немного одежды: найденная, выцветшая и залатанная одежда старого мира вместе со льном и плетёными вещами нового.\n- Каждый — свой вкус флоппы: окрас шерсти, сложение и возраст, одежда и снаряжение на нём (шляпа, очки, фартук, бухта троса, свисток). Сверху их узнают по этому.\n- Флоппы сидят на берегах и причалах — это жизнь вокруг боя.\n- Они окрашены и освещены как лодки: насыщенные цвета, тот же свет.\n- Их моделируют в Blender из кода, как мастерскую корабела.\n- Большие портреты для диалогов — заглушки до рисунков художника ближе к релизу; их набор решат тогда же (2026-11-17).\n- Портрет есть у каждой роли ([Сеттинг и лор](../story/setting.md)) и у каждого из восьми капитанов-соперников ([Соперники](../gameplay/rivals.md)); у каждого портрета четыре лица: ровный взгляд, доволен, удивлён, сердит.\n"}, {"id": "art-world-look", "path": "art/world-look.md", "title": "Облик мира", "section": "art", "date": "2026-11-20", "md": "# Облик мира\n\nКаким выглядит мир: острова, песок, зелень. Вода — на странице [Море](../world/sea.md), облака и их тени — [Погода](../world/weather.md), свет и часы — [Свет и время суток](light.md).\n\n## Решения владельца\n- Мир выглядит так, как его показывают картинки меню: кремовый песок, сочная яркая зелень и пышные пальмы (2026-11-06).\n"}, {"id": "audio-music", "path": "audio/music.md", "title": "Музыка", "section": "audio", "date": "2026-11-20", "md": "# Музыка\n\nМузыка складывается прямо во время игры и растёт вместе с боем; играет её радио лодки, станции которого игрок листает. Песни команд — [Шанти](shanties.md); остальной звук — [Звук](sound.md).\n\n## Решения владельца\n- Музыка — радио лодки, как радио в машине в старых GTA (2026-11-13): четыре станции, которые игрок листает, и «выключено». «Выключено» глушит всю музыку, и мотивы, и фанфары (2026-11-17).\n- Музыка делается на ходу, как её делает Sonic Pi: она нарастает вместе с боем, а события играют собственные мелодии, все в одной гармонии.\n- Её звук — глянцевый джаз-фьюжн 2000-х, под стать интерфейсу, на семплах записанных инструментов CC0 (2026-11-03): аккорды FM-электропиано, мелодия маримбы, электробас, ведущая партия чистой электрогитары, живые барабаны с конгами и бонго и трубы для фанфар при победе.\n- Музыка гармонически верна; у каждой локации своя тональность, лад и темп.\n"}, {"id": "audio-shanties", "path": "audio/shanties.md", "title": "Шанти", "section": "audio", "date": "2026-11-20", "md": "# Шанти\n\nПесни, которые поют команды [рабочих лодок](../world/life.md).\n\n## Решения владельца\n- Шанти поют команды рабочих лодок (2026-11-16): запевала мяукает мелодию по слогам настоящих слов, как коты говорят в диалогах, а на ответах поёт целый хор котов (2026-11-17).\n- Песни — старинные народные шанти XIX века, общее достояние. Инструменты — записи CC0.\n- Шанти поют рыбаки и сухогрузы; их слышно до 150 м, и радио уступает поющей команде (2026-11-17).\n"}, {"id": "audio-sound", "path": "audio/sound.md", "title": "Звук", "section": "audio", "date": "2026-11-20", "md": "# Звук\n\nКак в игре звучат бой, лодки и интерфейс. Музыка — [Музыка](music.md), песни команд — [Шанти](shanties.md).\n\n## Решения владельца\n- Звук — слои записей CC0 с Freesound; список загрузок одобряет владелец (2026-10-28).\n- Звук делают по исследованию того, как его делают на GitHub, и лучшее из исследования берут целиком (2026-11-13).\n- Звук по умолчанию включён. Кадры демо немые.\n- Фон открытого моря тихий: волны на 6 дБ тише, ветер на 3 (2026-11-16).\n- Уровни звуков владелец сводит на слух, играя (2026-11-17).\n"}, {"id": "base-boatyard", "path": "base/boatyard.md", "title": "Верфь", "section": "base", "date": "2026-11-20", "md": "# Верфь\n\n![Верфь: карточки деталей и панель показателей](../img/boatyard.jpg)\n\nВерфь — экран у причала [гавани](pier.md), где лодка собирается из деталей. Открывается только у причала, с ленты пришвартованной лодки.\n\n## Решения владельца\n- Лодку собирают из деталей на верфи; у верфи красивый экран показателей (2026-10-26). Детали только покупают, за монеты (2026-11-09).\n- Верфь у причала гавани: лодка настраивается там, где стоит, на живой воде.\n- Верфь показывает обычный изометрический вид, тот же, что в бою (2026-11-13). Лодка сама подъезжает в кадр, а выбор детали вид не двигает.\n- Верфь — нижняя лента, как гараж NFS (2026-11-10): категории плитками вдоль низа, над ними ряд карточек деталей с ценой и весом, показатели справа, кошелёк; мышь, клавиши и геймпад. Детали выбирают на карточках.\n- Верфь показывает монеты на руках в углу, на глянцевой табличке-кошельке рядом с жетоном-монетой: монеты везде выглядят одинаково. Счёт убывает по мере покупки детали, а каждая цена показывает, хватает ли монет. Деталь под фокусом светится аква под аквамариновым кольцом; оранжевым отмечена только установленная деталь.\n- Деталь, на которую наведён фокус, стоит на лодке призраком: прозрачным и светящимся аква, корпус показан призраком целиком, и лодка сидит в воде так, как села бы с ней. Если снова навести на установленную деталь или выйти, лодка возвращается к установленному. Установленная деталь встаёт с небольшой осадкой и бликом.\n- Выход с верфи: «Готово», Esc и Tab оставляют лодку как построена. Если лодка утонула бы, верфь сперва предупреждает, а при выходе возвращает последний проект этого визита, который держался на плаву.\n"}, {"id": "base-mooring", "path": "base/mooring.md", "title": "Швартовка", "section": "base", "date": "2026-11-20", "md": "# Швартовка\n\n![Лодка у причала: вид боя придвинут, над морем лента](../img/pier-moored.jpg)\n\nКак лодка встаёт у причала [гавани](pier.md) и что открывается у пришвартованной лодки.\n\n## Решения владельца\n- В гавань приплывают сами и швартуются на `Space` (или D-pad Вниз на геймпаде) внутри кольца поплавков, когда рядом нет охотников; на любой скорости: лодка резко останавливается у места (2026-11-17).\n- Место швартовки отмечено кольцом стеклянных поплавков, как старые рыбацкие: в каждом маленький тёплый огонёк, они качаются на волне, под ними мягкий бирюзовый свет в воде; цвета — аква и тёплые огоньки. Издалека кольцо спокойно; когда лодка подошла и можно причалить, свет мягко разгорается и дышит (2026-11-12). Так же отмечена станция.\n- Пришвартованная лодка остаётся в мире у причала, вид боя лишь плавно приближается к ней. Над морем короткая лента: «Торговец», «Верфь», «Отчалить» (2026-11-13).\n- На ленте причала кнопки, как в NFS или World of Warships (2026-11-10).\n"}, {"id": "base-pier", "path": "base/pier.md", "title": "Гавань: мастерская корабела", "section": "base", "date": "2026-11-20", "md": "# Гавань: мастерская корабела\n\n![Мастерская корабела в лагуне, лодка у причала](../img/pier.jpg)\n\nГавань — мастерская корабела на сваях в лагуне Домашнего островка на карте [мира](../gameplay/missions.md). Здесь [швартуются](mooring.md), [торгуют](../gameplay/trade.md) и заходят на [верфь](boatyard.md).\n\n## Решения владельца\n- Гавань на острове — одно из мест открытого мира, к которому доплывают сами; её облик строится под вид боя (2026-11-13).\n- Это мастерская корабела на сваях в лагуне, с длинными мостками к пляжу (2026-11-17): один короткий причал и мастерская — сарай, слип с лодкой на тележке, лебёдка, топливная колонка. Сразу видно, что здесь чинят, строят и покупают добычу (2026-11-13).\n- Дух — старое дерево, канат и латунь, плюс немного соларпанка в родстве со [станцией «Мария»](../world/outpost.md): грядки и зелень на крышах, солнечные панели, маленький ветряк, стеклянные поплавки (2026-11-13).\n- Ориентир — высокая сигнальная мачта у причала: вымпел по ветру днём, тёплый фонарь ночью (2026-11-13).\n- Модель сделана в Blender.\n"}, {"id": "gameplay-aiming", "path": "gameplay/aiming.md", "title": "Прицел и захват", "section": "gameplay", "date": "2026-11-20", "md": "# Прицел и захват\n\nКак лодка выбирает цель и наводит на неё оружие. Клавиши — в [Управлении](../interface/controls.md).\n\n## Решения владельца\n- Захвачен один враг за раз; когда захваченный враг тонет, захват переходит сам.\n- Целятся рулём (2026-11-17): ракеты и торпеды игрока идут в захваченную цель, когда она в узком веере своего борта, а иначе в ближайшего видимого охотника в нём. У каждого борта и у носовых стоек свой веер на воде, и чтобы навести его на цель, лодку поворачивают.\n- Q и E стреляют каждая своим бортом, Q — левым, E — правым; щелчок — бортом, который достаёт цель; на геймпаде точку прицела даёт правый стик.\n- Борт, чьи ракеты, выпущенные сейчас, попали бы в цель, зажигает свою клавишу, Q или E, у борта лодки и у цели: ярко, когда борт заряжен, и тускло, пока он перезаряжается. Клавиша торпеды загорается, только когда торпеда попала бы в середину корпуса.\n- C переключает оружие, которым стреляют Q и E, по видам пусковых установок на борту; HUD показывает выбор маленькой рулеткой ромбовидных значков в стекле приборов.\n- Линии огня заряженных стоек ложатся на воду, когда на борту стоит управление огнём — снаряжение с верфи.\n"}, {"id": "gameplay-armour", "path": "gameplay/armour.md", "title": "Броня", "section": "gameplay", "date": "2026-11-20", "md": "# Броня\n\nБроня лодки — пояс стальных плит по ватерлинии.\n\n## Решения владельца\n- У брони своё место на верфи, как у двигателя, отдельно от мест для пусковых установок: пояс клёпаных стальных плит, изогнутых по корпусу вдоль обоих бортов по ватерлинии; платится весом и монетами (2026-11-06).\n- Попадания сначала принимает броня, потом корпус.\n- Плита, принявшая свои попадания, падает в море, и лодка становится легче и быстрее.\n"}, {"id": "gameplay-boat", "path": "gameplay/boat.md", "title": "Лодка", "section": "gameplay", "date": "2026-11-20", "md": "# Лодка\n\n![Лодка игрока вблизи](../img/boat.jpg)\n\nЕдинственная лодка игрока: как она управляется и плавает. Её снаряжение — на своих страницах: [Нитро](nitro.md), [Топливо](fuel.md), [Броня](armour.md), [Таран](ram.md), [Дым](smoke.md), [Починка](repair.md); детали покупают на [верфи](../base/boatyard.md).\n\n## Решения владельца\n- Весёлое ощущение управления катером вместо физики.\n- Лодка управляется как твёрдое тело, толкаемое в точках корпуса, по образцу 2D-машины Пэта Керра (patkerr.co.uk/2d-vehicles).\n- Лодка кренится в повороте слабо (2026-11-10).\n- Перевёрнутая лодка выпрямляется, против физики, если нужно, как аркады переворачивают машину обратно на колёса.\n- Лодка едет по волнам — своим и чужим следам. Прыгать на них весело, но это не опора игры (2026-10-31).\n- Стоящая лодка разворачивается на месте одним рулём, без газа.\n- Несколько типов лодок: простые катера, от самых примитивных. В каждый должно быть круто запрыгнуть и управлять им.\n- Вес важен: у каждой детали есть масса, и лодка держится на воде, дифферентуется, встаёт и управляется по ним. Вес стоит скорости, как на настоящем глиссирующем катере (2026-10-29).\n- У скорости лодки нет потолка: она растёт с мощностью, и чем безумнее, тем лучше (2026-11-06).\n- Каждая деталь — лучший выбор для какой-то лодки (2026-10-29).\n- Нарисованный корпус — это физический корпус (2026-10-26). Корпус — готовая деталь с верфи, у лодки он один.\n- Лодка несёт снаряжение по размеру корпуса: малый корпус одну деталь, больший больше (2026-11-09).\n- Лодка садится на мель без вреда.\n"}, {"id": "gameplay-builds", "path": "gameplay/builds.md", "title": "Сборки и стили игры", "section": "gameplay", "date": "2026-11-20", "md": "# Сборки и стили игры\n\nСборки — это разные способы играть, которые игрок собирает из деталей на верфи. Оружие и снаряжение каждой — на своих страницах ([Бой](combat.md)).\n\n## Решения владельца\n- Сборки играются по-настоящему по-разному, и у каждой свой главный глагол (2026-11-07):\n  - Бортовой залп: борт выводят на цель на параллельном курсе ([Ракеты](rockets.md)).\n  - Преследователь: нос направляют на врага и целят поворотом, стреляют носовые стойки ([Ракеты](rockets.md)).\n  - Турельщик: игрок только ведёт, пока стреляют его турели ([Турель](turret.md)).\n  - Носитель дронов: посылает и отзывает крыло дронов ([Дроны](drones.md)).\n  - Минёр: его преследуют, и он ведёт преследователей над своими минами ([Мины](mines.md)).\n- Каждая сборка — активный способ драться (2026-11-07).\n- Все лодки надводные: подлодку под синим морем не видно с камеры (2026-11-07). Нырок на две-три секунды, как снаряжение, может появиться позже.\n"}, {"id": "gameplay-camera", "path": "gameplay/camera.md", "title": "Камера и картинка", "section": "gameplay", "date": "2026-11-20", "md": "# Камера и картинка\n\nВид на бой: фиксированная изометрия, зум и то, как быстро рисуется картинка. Настройки картинки — в [Настройках](../interface/settings.md).\n\n## Решения владельца\n- Статичный изометрический вид 2.5D: фиксированные азимут и наклон.\n- Игрок приближает и отдаляет, только зум: камера остаётся на месте. Бой начинается отдалённым, примерно в пятнадцать корпусов лодки поперёк кадра (2026-11-07).\n- Вид следует за лодкой. Над кругом арены — кругом, который размечает карта (2026-11-15), — он стоит неподвижно, а вход в круг играет короткую вставку по кадрам, заданным в редакторе карт (2026-11-09).\n- Бой идёт во время вставки, но лодку игрока, пока он смотрит вставку, охотники не видят, как за дымом (2026-11-17).\n- Игра идёт на 90–100 кадров в секунду во весь экран (2026-11-14).\n"}, {"id": "gameplay-combat", "path": "gameplay/combat.md", "title": "Бой", "section": "gameplay", "date": "2026-11-20", "md": "# Бой\n\n![Ракеты бьют в охотника](../img/combat.jpg)\n\nБой на море. У каждого оружия своя статья: [Турель](turret.md), [Ракеты](rockets.md), [Торпеды](torpedoes.md), [Мины](mines.md), [Дроны](drones.md). Как наводят — [Прицел и захват](aiming.md); приёмы — [Таран](ram.md), [Дым](smoke.md), [Нитро](nitro.md); стили игры из них — [Сборки и стили игры](builds.md).\n\n## Решения владельца\n- Основное оружие — турель, она стоит на стартовой лодке; ракеты — дополнение (2026-11-09).\n- Каждое оружие стоит на своей детали с верфи: ракетные стойки, торпедные трубы, минный жёлоб, турели.\n- Попадание есть попадание: где снаряд ударил в корпус, не меняет того, что он делает.\n- Лодки игроков втрое крепче таких же корпусов у охотников: ракета снимает с ялика игрока двенадцатую долю корпуса, и ни один залп не топит целую лодку игрока (2026-11-17).\n- У ракет и снарядов предельная дальность: на краю досягаемости заряд гаснет в воздухе без урона (2026-11-11).\n- Остров закрывает лодку от охотника, как дым: сквозь сушу не стреляют, ракеты рвутся о землю (2026-11-17).\n- Эффекты боя делают по исследованию того, как их делают на GitHub и в других играх, и лучшее из него берут целиком (2026-11-13). Взрывы — оранжевый огонь и тёмный дым; эффекты рисуются без текстур (2026-11-17).\n"}, {"id": "gameplay-drones", "path": "gameplay/drones.md", "title": "Дроны", "section": "gameplay", "date": "2026-11-20", "md": "# Дроны\n\nДронов несёт лодка с люлькой для них; так играет носитель дронов ([Сборки и стили игры](builds.md)).\n\n## Решения владельца\n- Дроны — маленькие безэкипажные морские дроны: бегут по воде, кружат с дальней стороны цели и стреляют ракетами.\n- Q и E посылают и отзывают их; люлька несёт два дрона.\n- Дрон не стреляет, пока его носитель лежит на линии огня.\n"}, {"id": "gameplay-fuel", "path": "gameplay/fuel.md", "title": "Топливо", "section": "gameplay", "date": "2026-11-20", "md": "# Топливо\n\nТопливо в баке лодки. Его пополняют [припас](pickups.md) и [торговля](trade.md) на «Марии».\n\n## Решения владельца\n- Лодка несёт только свой бак: у каждого корпуса свой, у каждого двигателя свой расход (2026-11-06).\n- Топливо сгорает по пройденному пути: лодка, стоящая на месте или идущая накатом, не жжёт ничего (2026-11-06).\n- Топливо жгут лодки игроков.\n- С пустым баком лодка игрока ползёт домой на четверти газа, с добычей и без нитро (2026-11-17).\n"}, {"id": "gameplay-haul", "path": "gameplay/haul.md", "title": "Добыча", "section": "gameplay", "date": "2026-11-20", "md": "# Добыча\n\n![Ряд трюма над панелью расходников](../img/hold.jpg)\n\nДобыча — ящики, которые лодка собирает в море и везёт на продажу. Как её продают: [Торговля](trade.md); что из неё собирают: [Расходники](kits.md).\n\n## Решения владельца\n- Кооперативная добыча: лодки выходят в море за добычей и довозят её до места продажи, пока охотники их не потопили.\n- Добыча — несколько понятных видов ящиков в ряду слотов прямо на HUD (2026-11-11). Полный трюм сам меняет дешёвое на дорогое.\n- Потопленный охотник рассыпает свою добычу ящиками на воде (2026-11-19), и лодка собирает её, проезжая по ней. Ящики плавают, пока их не соберут.\n- Вес добычи замедляет лодку, а полный трюм не наказывает (2026-11-09).\n- Лодка, ушедшая под воду, высыпает весь трюм на воду, чтобы другие его собрали (2026-11-11).\n"}, {"id": "gameplay-hunters", "path": "gameplay/hunters.md", "title": "Охотники и ИИ", "section": "gameplay", "date": "2026-11-20", "md": "# Охотники и ИИ\n\n![Охотники заходят на лодку игрока](../img/hunters.jpg)\n\nОхотники — враги игрока в море. Здесь их виды и единый ИИ, управляющий каждой лодкой, кроме лодки игрока. Откуда они выходят: [Посты охраны](../world/posts.md); их босс — [Броненосец](../world/ironclad.md).\n\n## Решения владельца\n- Охотники нескольких видов идут разом: таранщики, которые бросаются в атаку, рои маленьких, слабых и очень быстрых лодок и лодки, которые выходят игроку на траверз и стреляют (2026-10-30). Гонщик, преследователь и таранщик идут 22–23 м/с (2026-11-12).\n- Рои идут на катерках: малом корпусе на два попадания, открытой спортивной лодке в 4–5 м с большим подвесным мотором.\n- Дымовой рой — юркие ялики с дымогенератором: ставит много дыма и видит сквозь него.\n- У охотника есть зрение (2026-11-11): он гонится за лодкой игрока, пока видит её; потеряв её из вида, ещё недолго ищет там, где видел в последний раз, и забывает о ней.\n- Охотник дерётся до конца.\n- Все экипажи охотников одной выучки (2026-11-17).\n- Охотник стреляет, только когда попадёт, из той пусковой установки, что достанет цель, и сквозь свои лодки не стреляет (2026-11-17). За миг до выстрела его стойка на этом борту светится красным, и короткий звук выдаёт выстрел.\n- Охотник, затонувший на мелководье, лежит на дне до конца захода.\n- Каждой лодкой, кроме лодки игрока, управляет один ИИ, планировщик действий по целям, так что торговцы и караваны с охраной смогут присоединиться позже.\n- Много лодок разом остаются дешёвыми для кадра.\n"}, {"id": "gameplay-jobs", "path": "gameplay/jobs.md", "title": "Задания", "section": "gameplay", "date": "2026-11-20", "md": "# Задания\n\nЗадания, которые игрок берёт в [открытом мире](missions.md). Пока они заглушки.\n\n## Решения владельца\n- Цель игры — сюжетная линия поручений флопп в гавани и на станции: по одному разом, выполненное открывает следующее, новые детали и места, в конце финальный босс; первое поручение — обучение по рации (2026-11-12).\n- Задания берут у флопп, как в старых GTA (2026-11-13): несколько флопп дают их по рации у своих буёв на карте, задание идёт в живом море, а проваленное просто кончается.\n- Задания — конвой, курьер, маяки и груз (2026-11-09).\n- Задание отмечено на карте (2026-11-17).\n"}, {"id": "gameplay-kits", "path": "gameplay/kits.md", "title": "Расходники", "section": "gameplay", "date": "2026-11-20", "md": "# Расходники\n\nРазовые расходники, которые собирают из ящиков трюма ([Добыча](haul.md)).\n\n## Решения владельца\n- Из ящиков трюма собирают ремкомплект, бронеплиту, баллон нитро и заряд (2026-11-11).\n- Их тратят в море клавишами 1–4, по панели быстрого доступа в левом нижнем углу HUD (2026-11-11).\n"}, {"id": "gameplay-mines", "path": "gameplay/mines.md", "title": "Мины", "section": "gameplay", "date": "2026-11-20", "md": "# Мины\n\nМины ставит лодка с минным жёлобом; так играет минёр ([Сборки и стили игры](builds.md)).\n\n## Решения владельца\n- Мины — чёрные шары со светом цвета своей стороны сверху.\n- Минный жёлоб сбрасывает их за корму; мина взводится через мгновение и взрывается под корпусом чужой стороны (2026-11-17).\n"}, {"id": "gameplay-missions", "path": "gameplay/missions.md", "title": "Открытый мир", "section": "gameplay", "date": "2026-11-20", "md": "# Открытый мир\n\nОткрытый мир — единственный уровень игры: одна большая карта, на которой и бой, и [задания](jobs.md), и [гавань](../base/pier.md).\n\n## Решения владельца\n- Игра — один открытый мир, «мир»: одна большая карта, игра в ней идёт без конца (2026-11-15).\n- Открытый мир — свободная игра без часов (2026-11-14): цели — задания, которые берёт игрок.\n- После «Продолжить» или «Новой игры» игра сразу идёт в виде боя: руль у игрока, HUD на месте, охотники живы (2026-11-11).\n- Старт — своё место в стороне от середины карты: лодка идёт вдоль берега, суша по левому борту.\n- Когда все лодки игроков потоплены, чёрные полосы закрываются с надписью «Погиб», и игра загружает последнее сохранение (2026-11-10).\n"}, {"id": "gameplay-nitro", "path": "gameplay/nitro.md", "title": "Нитро", "section": "gameplay", "date": "2026-11-20", "md": "# Нитро\n\nНитро: рывок и дожиг. Удар носом на нитро — в статье [Таран](ram.md).\n\n## Решения владельца\n- Нитро — рывок (2026-11-10): нажатие на Shift бросает лодку вперёд с петухом брызг, и рывком уходят от ракет. Он крутой и весёлый, а не правдоподобный. Заряд восстанавливается со временем. Охотники тоже делают рывки.\n- В рывке неуязвимы лодки игроков (2026-11-12).\n- Если после рывка держать Shift, лодка идёт на дожиге (2026-11-17): быстрее своего обычного хода, пока клавиша зажата, и жжёт шкалу, как нитро в гонках; отпущенная клавиша или пустая шкала его кончают. Дожиг читается: петух брызг или пламя и звук мотора, пока горит, шкала заметно пустеет.\n"}, {"id": "gameplay-pickups", "path": "gameplay/pickups.md", "title": "Припасы", "section": "gameplay", "date": "2026-11-20", "md": "# Припасы\n\nПрипасы — нитро, ремонт, броня и топливо, которые всплывают в море и спускаются с неба.\n\n## Решения владельца\n- Припасы нитро, ремонта и брони появляются в море случайно, как аркадные припасы: наезд на один пополняет нитро, чинит корпус или прибавляет брони. Припасы брони синие. Любая лодка, и охотник тоже, берёт каждый, на который наехала, нужен он ей или нет.\n- Ремонт чинит треть того, что выдерживает корпус; броня пополняется до трети того, что выдерживает корпус. Встречается и топливо: оно пополняет бак.\n- Припас на воде — плавучий ящик со знаком припаса и мягким тёплым огоньком, как поплавки у причала: всплывает из-под воды, качается на волне, сносится ветром и тонет, если его не взяли (2026-11-20).\n- Припасы спускаются и с неба: грузовой дрон подлетает, зависает и отпускает ящик на парашюте (2026-11-20).\n"}, {"id": "gameplay-progression", "path": "gameplay/progression.md", "title": "Прогресс и сохранения", "section": "gameplay", "date": "2026-11-20", "md": "# Прогресс и сохранения\n\nЧто игра помнит и как она сохраняется. Деталями лодки распоряжается [верфь](../base/boatyard.md), монетами — [торговля](trade.md).\n\n## Решения владельца\n- Новая игра начинается со 150 монет (2026-11-17).\n- Сохранение хранит состояние мира, и игра продолжается с последнего сохранения (2026-11-14).\n- Час суток и погода сохраняются вместе с миром: загруженная игра продолжается с того же часа и той же погоды (2026-11-17).\n- В море игра сохраняется сама раз в минуту, когда рядом нет охотников (2026-11-16).\n"}, {"id": "gameplay-ram", "path": "gameplay/ram.md", "title": "Таран", "section": "gameplay", "date": "2026-11-20", "md": "# Таран\n\nУдар корпусом: таран как снаряжение и удар носом на нитро.\n\n## Решения владельца\n- Таран вредит обеим лодкам, но лодка с тараном не страдает от собственного тарана. Таран защищает только нос своей лодки: удар в нос приходится на таран, удар в борт или корму вредит лодке как любой.\n- Удар снимает с целой лодки не больше половины корпуса (2026-11-12).\n- Удар носом на нитро — приём любой лодки: она получает меньше, а бьёт сильнее; таран делает его ещё сильнее (2026-11-09).\n"}, {"id": "gameplay-repair", "path": "gameplay/repair.md", "title": "Починка", "section": "gameplay", "date": "2026-11-20", "md": "# Починка\n\nЧем лодка чинится в море. Починку дают и [припасы](pickups.md), и [торговля](trade.md) на «Марии».\n\n## Решения владельца\n- Помпа чинит корпус в море.\n- Плотники латают за каждую лодку, которую потопила их лодка, четверть того, что та выдерживала; их несёт охотник-гонщик.\n"}, {"id": "gameplay-rivals", "path": "gameplay/rivals.md", "title": "Соперники", "section": "gameplay", "date": "2026-11-20", "md": "# Соперники\n\nСоперники — другие команды в море, которые собирают добычу и дерутся со всеми. Это и есть система заклятых врагов игры: команда помнит, чем кончилась прошлая встреча с игроками, и говорит об этом по радио.\n\n## Решения владельца\n- Соперники — система заклятых врагов («nemesis»), о которой мечтает владелец (2026-11-15, [отчёт](../reports/2026-11-15-dream-games.md)).\n- Соперники, как в шутере с добычей: кроме охотников, по морю ходят другие команды. Они грабят и бьют всех — игроков, охотников и друг друга — и со временем растут, как и игроки.\n- Восемь капитанов-соперников, каждый — архетип флоппы с командой, лодкой в своих цветах, портретом и голосом: старый морской волк, молодой гонщик, громила, контрабандист, мастеровой, сорока, наёмник и дуэлянт. У каждого свой тон: одни честные, спортивные соперники, другие злые и опасные. Они говорят по радио.\n- В море разом две команды соперников.\n- Соперник отмечен красным кольцом на воде (2026-11-17).\n"}, {"id": "gameplay-rockets", "path": "gameplay/rockets.md", "title": "Ракеты", "section": "gameplay", "date": "2026-11-20", "md": "# Ракеты\n\n![Ракеты бьют в охотника](../img/combat.jpg)\n\nРакеты и их стойки. Какое место они занимают среди оружия: [Бой](combat.md); как их наводят: [Прицел и захват](aiming.md).\n\n## Решения владельца\n- Ракеты выпускаются с открытых рельсовых стоек рябью залпов (2026-10-28). Они летят прямо и быстро и скользят над волнами на постоянной высоте, так что крен или волна никогда не портят выстрел.\n- Ракеты залпа идут с небольшим разбросом (2026-11-17).\n- Ракетные стойки растут в уровнях: первая стреляет двумя ракетами на борт, и ракеты залпа уходят одна за другой с небольшой задержкой (2026-11-10).\n- Стойки стоят над бортами и на носу: две короткие носовые рейки у форштевня стреляют вперёд, и их наводят поворотом на врага.\n- Ракеты охотников горят красным, а игрока — оранжевым, так что перекрёстный огонь читается с первого взгляда.\n- Ракеты охотников летят медленнее ракет игрока, около 55 м/с на ходу, так что от них можно увернуться (2026-11-12).\n- Ракету парируют ракетой (2026-11-10): ракеты двух сторон, встретившись в воздухе, взрывают друг друга.\n"}, {"id": "gameplay-sites", "path": "gameplay/sites.md", "title": "Места промысла", "section": "gameplay", "date": "2026-11-20", "md": "# Места промысла\n\nМеста в море, где работают во время захода: косяки, где ловят рыбу. Косяк открывает вид сбоку.\n\n## Решения владельца\n- Место промысла — косяк для рыбалки (2026-11-19). Он открывает вид сбоку, трёхмерный разрез через воду с лодкой игрока над ним, в том же свете, что и мир, и рыбалка идёт в нём. Рыба считается добычей.\n- В виде сбоку натяжение лески видно на самой леске и на стеклянном циферблате у удилища, а пойманная рыба показывается крупно на карточке: её название, длина, вес и добыча.\n- Пойманное идёт в трюм, как добыча; бой тем временем идёт дальше.\n"}, {"id": "gameplay-smoke", "path": "gameplay/smoke.md", "title": "Дым", "section": "gameplay", "date": "2026-11-20", "md": "# Дым\n\nДымовая завеса, которую ставит лодка с дымогенератором.\n\n## Решения владельца\n- Дым прячет лодки от захвата цели и от HUD; тепловизор на лодке показывает корпуса сквозь дым силуэтами (2026-11-03).\n- Дым сбивает охотнику прицел.\n- Свои лодки охотники видят сквозь дым (2026-11-17).\n- Дымовая завеса медленно дрейфует с ветром, оставаясь около того места, где поставлена. Её перезарядка — шкала в кластере приборов.\n"}, {"id": "gameplay-torpedoes", "path": "gameplay/torpedoes.md", "title": "Торпеды", "section": "gameplay", "date": "2026-11-20", "md": "# Торпеды\n\nТорпеды — второе бортовое оружие лодки. Как их наводят: [Прицел и захват](aiming.md).\n\n## Решения владельца\n- Торпеды медленные, идут под волнами и топят лодку за одно-два попадания.\n- Их трубы лежат в корпусе под водой: торпеда выходит под поверхностью (2026-11-06).\n"}, {"id": "gameplay-toys", "path": "gameplay/toys.md", "title": "Забавы", "section": "gameplay", "date": "2026-11-20", "md": "# Забавы\n\nМелкие забавы на манер игр про открытый город: прыжки с волн на счёт и спрятанные посылки.\n\n## Решения владельца\n- Мелкие забавы, как в старых GTA (2026-11-13): прыжки с волн на счёт и спрятанные посылки (2026-11-19).\n"}, {"id": "gameplay-trade", "path": "gameplay/trade.md", "title": "Торговля", "section": "gameplay", "date": "2026-11-20", "md": "# Торговля\n\n![Экран торговца на «Марии»: трюм, товары и реплика мытаря](../img/trader.jpg)\n\n![Корабел принимает добычу у причала](../img/trader-harbour.jpg)\n\nГде и как добычу продают за монеты: в [гавани](../base/pier.md) и на станции [«Мария»](../world/outpost.md).\n\n## Решения владельца\n- Добыча продаётся за монеты в гавани у причала и на станции «Мария» в море.\n- Торгуют внутри кольца поплавков, у причала и у станции (2026-11-17, [Швартовка](../base/mooring.md)).\n- Продажа — экран торговца, как в играх о рыбалке и торговле с лодки (2026-11-13): слева торговец с короткой репликой, справа трюм ящиками с ценами. Ящик продают, выбрав его; есть «Продать всё», монеты набегают в кошельке; непроданное остаётся на борту для расходников. В гавани торгует корабел, на «Марии» — мытарь, у каждого короткая реплика в стеклянной выноске, как в диалоге.\n- Непроданные ящики можно продать позже, не выходя снова в море: плиткой «Торговец» на ленте причала (2026-11-13).\n- «Мария» покупает ящики дешевле гавани и продаёт за монеты ремонт и топливо (2026-11-12).\n"}, {"id": "gameplay-turret", "path": "gameplay/turret.md", "title": "Турель", "section": "gameplay", "date": "2026-11-20", "md": "# Турель\n\nТурель — пушка, которая стреляет сама. Какое место она занимает среди оружия: [Бой](combat.md).\n\n## Решения владельца\n- Турели круглые и двуствольные; они поворачиваются и стреляют сами, а игрок только ведёт лодку.\n- Турель бьёт по ближайшему врагу, которого видит в своём радиусе (2026-11-17).\n- У турели свой снаряд, заметно медленнее ракеты: светящийся трассер без дыма (2026-11-10).\n"}, {"id": "gameplay-wanted", "path": "gameplay/wanted.md", "title": "Розыск и патруль", "section": "gameplay", "date": "2026-11-20", "md": "# Розыск и патруль\n\nУровень розыска лодки игрока и патруль, который за ней приходит, как в играх с открытым миром про город: игрок начинает неприятности, ответ растёт с тем, что он натворил, и от погони можно уйти. Патруль выходит с [постов охраны](../world/posts.md).\n\n## Решения владельца\n- Уровень розыска, как в старых GTA (2026-11-13): неприятности с рабочими лодками поднимают его, каждая отметка шлёт больше лодок патруля и сильнее, вне вида он падает, перекраска снимает его.\n- Розыск — второй источник сложности рядом с миром (2026-11-13).\n- За жёсткий удар о рабочую лодку отвечает игрок, кто бы в кого ни въехал (2026-11-17).\n- Патруль пока просто полиция (2026-11-13). У его лодок мигалка и сирена; остальной облик патруля пока временный (2026-11-17).\n"}, {"id": "interface-controls", "path": "interface/controls.md", "title": "Управление", "section": "interface", "date": "2026-11-20", "md": "# Управление\n\nВ игру играют клавиатурой и мышью или геймпадом. Клавиши переназначают в [Настройках](settings.md).\n\n## Решения владельца\n- Игра идёт и с геймпада, и с клавиш и курсора: в море, в меню, у причала, на верфи и в виде сбоку, везде, кроме редактора карт (2026-11-04). Пока геймпад использовался последним, подсказки клавиш показывают кнопки геймпада.\n- Клавиши перечислены на отладочной карточке, которую открывает F3 (2026-11-10).\n\n## Клавиши в море\n\n| Клавиша | Что делает |\n| --- | --- |\n| `W` `A` `S` `D` или стрелки | руль и газ |\n| `Shift` | нитро (рывок) |\n| `Q` / `E` | огонь левым / правым бортом |\n| Левая кнопка мыши | огонь бортом, который достаёт захваченную цель |\n| `F` | дым |\n| `C` | следующее оружие |\n| `1`–`4` | расходник: ремкомплект, бронеплита, баллон нитро или заряд, каждый оплачивается ящиками из трюма ([Расходники](../gameplay/kits.md)) |\n| `5` | диковина старьёвщика ([Корабль на мели](../world/hulk.md)) |\n| `Space` | то, что предложено под лодкой: швартовка в гавани, торговля у станции и у старьёвщика, задание у буя, работа на месте промысла |\n| Колесо мыши | ближе / дальше |\n| `M` | карта |\n| `R` | радио: следующая станция, после последней — выключено ([Музыка](../audio/music.md)) |\n| `Esc` | закрыть карту, иначе пауза |\n| `F3` | отладочная карточка |\n\nВставку пропускают `Esc`, `Space`, `Enter` или щелчок.\n\n## Клавиши вне моря\n- **У причала**: `A` `D` или стрелки — по плиткам, `Enter` или щелчок — открыть, `Tab` — верфь, `Space` — отчалить, `Esc` — меню.\n- **Верфь**: `A` `D` — место, `W` `S` — деталь, `Enter` — поставить, `Esc` или `Tab` — готово.\n- **Вид сбоку**: `A` `D` — лодка вдоль места, `W` `S` — леска на рыбалке, `Esc` или `Tab` — уйти.\n- **Диалог**: `Enter` или `Space` — дальше, `W` `S` — ответ, `1`–`9` — ответ по номеру, `Esc` — пропустить, пока ответов нет.\n- **Экран торговца**: `W` `A` `S` `D` или стрелки — по карточкам и между рядами, `Enter` или щелчок — продать ящик или купить товар, `Space` — «Продать всё», `Esc` — «Готово».\n"}, {"id": "interface-hud", "path": "interface/hud.md", "title": "HUD", "section": "interface", "date": "2026-11-20", "md": "# HUD\n\n![HUD над глубокой водой](../img/hud.jpg)\n\nHUD — то, что видно на экране в море: цели, кольца на воде, приборы лодки, [расходники](../gameplay/kits.md) и [трюм](../gameplay/haul.md), уведомления. Как наводят оружие: [Прицел и захват](../gameplay/aiming.md).\n\n## Решения владельца\n- HUD показывает только то, на чём держится игра, и только то, что на экране (2026-11-11): кольца охотников и их попадания, табличку захваченной цели, приборы лодки, рулетку оружия, расходники и трюм, цели заданий, уведомления и строки диктора. Из повреждений он показывает попадания в корпус.\n- Стекло HUD смешивается с картинкой под ним, без преломления (2026-11-12).\n- В море охотник отмечен кольцом на воде вокруг него, его попадания остаются дугой кольца: у малой лодки дуга на каждое попадание, у большого корпуса одна дуга, которая пустеет с каждым попаданием и размечена через каждые пять. Названа только цель, на табличке. Новости приходят уведомлениями, выезжающими сверху; цели написаны в углу, на стекле (2026-11-13).\n- Приборы лодки собраны в кластер в углу экрана.\n- Убийства и задания объявляют крупные строки диктора посреди экрана, как в старых GTA (2026-11-13).\n"}, {"id": "interface-language", "path": "interface/language.md", "title": "Язык", "section": "interface", "date": "2026-11-20", "md": "# Язык\n\nСлова игры переведены на язык игрока.\n\n## Решения владельца\n- Игра говорит на английском и русском, на языке игрока (2026-11-17).\n"}, {"id": "interface-logbook", "path": "interface/logbook.md", "title": "Судовой журнал", "section": "interface", "date": "2026-11-20", "md": "# Судовой журнал\n\n![Судовой журнал: окно матового стекла со строками](../img/logbook.jpg)\n\nСудовой журнал — сохранения игры, в меню `Esc`.\n\n## Решения владельца\n- Журнал — окно матового стекла со строками: каждое сохранение — строка с маленьким снимком, выбранная строка — в стекле со светом, как в меню (2026-11-13).\n- Журнал открывается шелестом карточки, а запись звенит стеклом, как захват, на терцию выше (2026-11-17).\n"}, {"id": "interface-map", "path": "interface/map.md", "title": "Карта", "section": "interface", "date": "2026-11-20", "md": "# Карта\n\n![Карта: стекло с линиями света](../img/map.jpg)\n\nКарта мира в море.\n\n## Решения владельца\n- Карта (2026-11-13): «Прозрачная, линии светом». Это стекло, сквозь которое видно море; берег, глубины и метки нарисованы на нём линиями света, как на навигационном приборе.\n- Лодки игроков на карте — глянцевые стрелки по курсу: своя оранжевая, товарищей аква (2026-11-17).\n- Штормы видны на карте (2026-11-16): глянцевые значки в духе Frutiger Aero, облако над областью шторма и стрелка, куда он плывёт; значок чуть живой: в нём вспыхивает молния, туча покачивается, плывущий шторм едет по карте.\n- За картой мир в мягком фокусе, как за меню паузы; приборы, трюм и расходники остаются резкими (2026-11-17).\n"}, {"id": "interface-screens", "path": "interface/screens.md", "title": "Экраны и меню", "section": "interface", "date": "2026-11-20", "md": "# Экраны и меню\n\n![Меню Esc над морем: пауза, где ты и который час](../img/menu.jpg)\n\nМеню поверх моря: главное меню и меню `Esc`, оно же пауза. У них свои страницы: [Настройки](settings.md), [Судовой журнал](logbook.md), [Карта](map.md); у причала — [Швартовка](../base/mooring.md), [Торговля](../gameplay/trade.md), [Верфь](../base/boatyard.md).\n\n## Решения владельца\n- Главное меню при запуске: «Продолжить», «Новая игра», «Загрузить», «Настройки» и отдельно «Выход» (2026-11-17). За ним — вид боя на воду там, где игра сохранилась; меню — посередине экрана, заголовок — название игры над столбцом (2026-11-16).\n- Сама игра — запуск, загрузка, новая игра, возврат после гибели — проявляется из темноты (2026-11-16).\n- Меню `Esc` одно — пауза в бою (2026-11-13): «Продолжить», «Сохранить» и «Загрузить» (судовой журнал), «Кооператив», «Настройки», «Инструменты» и «Выход». В одиночной игре бой под ним стоит; как онлайн — в [Онлайн-кооп](../online.md).\n- За меню паузы мир размыт, как будто у камеры ушёл фокус, чуть притемнён, а вид немного приближается, пока меню открыто; меню показывает, где ты и который час (2026-11-17).\n"}, {"id": "interface-settings", "path": "interface/settings.md", "title": "Настройки", "section": "interface", "date": "2026-11-20", "md": "# Настройки\n\nСтраница настроек в меню `Esc` и в главном меню.\n\n## Решения владельца\n- На странице настроек то, что игроку нужно задать (2026-11-07).\n- Масштабирование (апскейлер) — одна из настроек; по умолчанию стоят лучший из апскейлеров и разрешение 80 % (2026-11-14).\n- Музыку и эффекты убавляют каждую своей шкалой; у шкал есть стрелки влево и вправо.\n- Доступность: размер текста, ракеты для дальтоников, переназначение клавиш (2026-11-17).\n- «Меньше вспышек» смягчает только молнию и по умолчанию выключено (2026-11-17).\n"}, {"id": "known-issues", "path": "known-issues.md", "title": "Известные недочёты", "section": "", "date": "2026-11-20", "md": "# Известные недочёты\n\nЧто игрок может увидеть или почувствовать неправильным и что ещё не исправлено. У каждого сказано, что его исправит.\n\n- **Первые две секунды после открытия верфи кадр дольше остального** (около 15 мс, пока камера подходит к лодке); почему, не искали. В остальном кадр во весь экран держит цель 90–100 к/с: море около 10,7 мс, причал и верфь 10–10,7 мс ([замер 11-14](reports/2026-11-14-performance.md)). Исправит то, что найдёт замер этих секунд.\n- **Однажды в долгом бою кадр вырос с 14 до 17 мс** за полторы минуты у поста охотников; во втором таком бою, 85 с, он держался ровно. Вызовы отрисовки и главный поток не росли, значит копилась работа GPU ([замер 11-14](reports/2026-11-14-performance.md)). Исправит то, что найдёт повтор.\n- **У свай причала и у стен форта нет пены**: кромка пены идёт только вдоль рельефа, а сваи и стены — модели. Исправит пена у моделей, стоящих в воде, если её не хватит в игре.\n- **У борта лодки, стоящей у причала в штиль, видны белые полосы брызг** (демо `Quay/Moored`; у причала гавани в игре не замечены): корпус, который чуть покачивается, бросает брызги, как на ходу (`ships/BowSheets.cs`). Исправит порог скорости погружения, ниже которого брызг нет.\n- **На самом широком зуме у краёв кадра нет барашков и следов**: пена живёт в карте 512 м вокруг вида. Исправит карта, которая растёт с видом, если это окажется заметно в игре.\n- **Ракета может пройти над бочкой, миной или нефтью, не задев их**: она скользит над водой и на спуске с волны идёт выше, а нефть поджигает, только упав в неё на склоне волны. Надёжно нефть зажигает взрыв бочки в ней. Исправит попадание ракеты по плавучим целям, считаемое без высоты.\n- **Лодка нового проекта, появившись впервые, задерживает кадр примерно на 30 мс сверх прежнего**: игра один раз на проект запекает её затенение неба ([Свет](art/light.md)), на всех ядрах. Замер вне игры, на загруженной другими сессиями машине: лодки из 8–10 тысяч треугольников по 28–31 мс. Исправит запекание вне главного потока или заранее, за шторкой загрузки.\n- **Загрузка локации с островами длится дольше**: игра запекает затенение неба земли по сетке высот, на всех ядрах. Замер на загруженной другими сессиями машине: 50–310 мс на сетке 1024², 70–105 мс на сетке мира 2048². Исправит запекание вне главного потока, если загрузка станет заметной.\n- **Первое открытие карты занимает один-два кадра**: она один раз рисует дно. Исправит рисование дна за шторкой загрузки.\n- **После сна Mac с открытой игрой она идёт кадром раз в одну-две секунды, пока её не закроют.** По журналу владельца за 11-12: крышку закрыли через две минуты после запуска, и драйвер Metal 277 раз не дождался GPU (`timeout waiting for fence`), из них почти три минуты уже после открытия крышки. То же записали четыре скрытых кейса демо, пережившие тот же сон. Это открытая ошибка Godot ([godotengine/godot#119436](https://github.com/godotengine/godot/issues/119436)): драйвер ждёт кадр не дольше секунды и идёт дальше. Дело в сне системы, а не в выключенном экране: 557 скрытых прогонов демо, шедших при выключенном экране без сна, этой ошибки не записали. Нарочно не воспроизводили: сон обрывает все сессии агентов. Исправит новая версия движка.\n- **Редактор карт замирает на десятки секунд на форме рельефа почти предельного размера**, на верхе ползунка «Радиус» или на 1500 м у ручки края: сетка земли растёт вместе с площадью суши и поднимается в главном потоке. Исправит ограничение размера или подъём земли вне главного потока.\n- **Охотник на полном ходу всё ещё влетает в воронку между двумя морскими столбами, стоящими теснее его ширины**: щупы видят тупик лишь за несколько секунд хода, а на такой скорости корпус не успевает отвернуть. Он упирается, через несколько секунд отходит задним ходом и обходит столбы. Лодку игрока оттуда выводит сам игрок. Исправит взгляд охотника дальше вперёд или сброс хода перед закрытым курсом.\n- **Ракеты пролетают сквозь сарай, мачту и корпус на слипе мастерской**: в гавани твёрды только настилы и слип ([Гавань](base/pier.md)). Исправят преграды по надстройкам модели.\n- **У причала лента лежит поверх сарая и слипа, а лодку у первого места частично закрывают ванты и флажки мачты.** Исправит сдвиг вида у причала или перенос мачты.\n- **Слишком тяжёлая лодка на верфи тонет у причала, и на её месте видна яма в пене**: вид верфи стоит неподвижно и за корпусом под воду не идёт. Исправит лодка верфи, которую держат на плаву.\n- **На верфи лента мест самой большой лодки заходит под кошелёк и «Готово»**: у канонерки с тремя местами снаряжения одиннадцать плиток, и ряд шире места слева от показателей. Исправит лента, которая сжимает плитки, когда их много.\n- **Гости не видят мель и затонувшее судно хоста, если он начал кооператив посреди захода**: места промысла хоста появились до гостей. Исправит рассказ о них пришедшему гостю.\n- **Две лодки роя могут на мгновение коснуться бортами, когда трогаются с места**: медленные корпуса расходятся позже. Видно в демо Hunters/Swarm. Исправит расхождение, которое смотрит дальше вперёд на малом ходу.\n- **Лодка, зашедшая за станцию, скрыта её надстройкой**, как за горой: силуэта сквозь неё нет. Исправит силуэт лодки игрока за высокими вещами.\n- **Охотник видит лодку сквозь станцию**: её корпус закрывает путь ракетам и лодкам, но не взгляду, который проверяет только сушу (`Lookout.Sees`). Исправит станция как преграда взгляду.\n- **Ящики на воде с высоты боя различаются почти только цветом**: силуэты бочки, тюка и сундука на таком расстоянии сливаются. Исправят более крупные или более разные силуэты.\n- **Часть интерфейса после перевода на стекло видели только на кадрах демо**: диалог, радио, циферблат рыбалки и окна инструментов; подсказки и деревья в окнах инструментов не попали ни в один кадр. Старт, бой, карту, меню, журнал, настройки, экран торговца, ленту причала, верфь, отладочную карточку и гибель видели на кадрах самой игры (демо `Opening`, полный размер, 2026-11-13); играть в них владельцу ещё предстоит.\n- **Гостю в кооперативе негде взять ящики**: добыча на воде не онлайн. Ящики потопленных охотников плавают только на море хоста; лодка гостя собирает их там в трюм, которого гость не видит, а трюм на его машине пуст: нечего продать и нечем заплатить за расходник. Исправит добыча на воде онлайн ([Онлайн](online.md)).\n- **Каждый слой стекла, читающего экран, стоит около 0,4–0,7 мс кадра** при 3024×1964: всё нарисованное под первым стеклом проходит по экрану отдельно, и экран копируется. У причала, торговца и меню копируется только прямоугольник под стеклом; верфь копирует весь экран ([Компоненты](art/components.md)). HUD в бою экран не читает. Исправило бы стекло без чтения экрана там, где преломление не видно.\n- **Окно инструмента поверх ленты причала или верфи добавляет вторую копию экрана** (уже без цепочки мипов): отладочная карточка (F3), редактор, селектор демо. Диалог копирует экран только в прямоугольнике своей выноски и ответов; эта цена не замерена.\n- **Новый звук никто не слушал, а новые эффекты видели только на кадрах**: уровни, приседание музыки, звуки моментов, живой остров и громкость интерфейса выставлены по приборам на фильмах скрытых прогонов ([Звук](audio/sound.md)); вибрация проверена по значениям движка, без геймпада в руках; движение взрывов, колец и потопления оценено по полосам кадров, не в игре; Windows не пробовали. Исправит игра владельцем: демо `Sounds` и `Effects`, затем бой. Пение команд рабочих лодок тоже никто не слушал: громкость и голоса котов выставлены по приборам на отрисовке вне игры. Сирену патруля тоже никто не слушал: её громкость выставлена на глаз, без замера.\n- **Гость в кооперативе не слышит реплику дающего задание и не видит его буй на воде**: буй и рация только у хоста, гостю видны золотая рябь и кольцо на карте ([Онлайн-кооп](online.md)). Исправят буи и реплика, рассказанные гостям.\n- **Строка «Потоплен» выходит в цвете игрока и за лодку, которую потопил не он**: рабочую лодку на мине или лодку, потопленную охотником ([HUD](interface/hud.md)). Исправит строка, которая знает, кто потопил.\n- **Лодку, подброшенную взрывом, игра считает прыжком** и может долить за него нитро ([Забавы](gameplay/toys.md)). Исправит прыжок, который не считается сразу после взрыва.\n- **Награда за последнюю посылку может не влезть в маленький трюм**: выходит «Трюм полон», и лишние ящики остаются на воде. Исправит награда по размеру трюма или монетами.\n- **Рабочие лодки и патруль одеты во временную краску**. Исправит облик, который опишет владелец.\n- **На карте (M) нет посылок и постов патруля**: их находят глазами. Исправит решение, что из этого должно быть на карте.\n- **Гость в кооперативе не видит баннер «Потоплен», не слышит его музыку и не узнаёт, что соперник ушёл с добычей**: эти моменты висят на событиях миссии, которые есть только у хоста (`Game.SettingOut`). Исправят моменты на событиях, которые есть у каждой машины (`Boat.GaveWay`), и уход соперника, рассказанный гостям.\n- **Гость не видит цель задания и его союзников**: курьер, броненосец и сухогруз конвоя отмечены только у хоста (`Game.Marked`), так что у гостя нет ни метки цели, ни её силуэта. Исправят метки цели и союзника, переданные гостям с лодкой (`Say.Launched`).\n- **Когда тонет вся команда, гость не видит «Погиб»**: конец показывает и сохранение грузит только хост, а гостя просто снова сажают в мир хоста. Исправит слово хоста о гибели команды перед загрузкой.\n- **Шторм никто не смотрел и не слушал в игре**: молния, звук шторма, ливень, облака и волны шторма выставлены по кадрам и приборам скрытых прогонов ([Шторм](world/storm.md)). Исправит игра владельцем: демо `Storm` и `Weather`.\n- **Первый удар молнии рядом с видом может задержать кадр**: в этот кадр в сцену впервые добавляются разряд со своим шейдером и лампа ([Шторм](world/storm.md)). В ночных скрытых прогонах демо `Storm`, в фоновом режиме и под нагрузкой других прогонов, этот кадр длился 4–9 с, в том числе на коде до правок шторма 2026-11-17; в других прогонах той же ночи худший кадр был не больше 0,25 с. В самой игре не мерили. Исправит прогрев шейдера разряда и лампы при загрузке.\n- **Над островом и над лодками ливень падает до уровня моря**: капли рисуются поверх готового кадра и не знают, где земля и палубы, поэтому летят сквозь склоны и корпуса и не оставляют на них брызг; брызги и круги есть только на воде ([Погода](world/weather.md)). Исправит высота земли и лодок, которую прочтёт рисунок дождя, и брызги на них.\n- **В шторм капля долетает до уровня спокойного моря, а её брызги и круг лежат на волне**: на высокой волне капля кончается на метр-другой выше или ниже своего круга ([Погода](world/weather.md)). Исправит высота волны, которую прочтёт рисунок дождя.\n- **Снимки лодок в журнале и картинки улова, нарисованные в дождь, темнее**: их маленькие миры берут облака и бурю главного мира (`sky/sunlight.gdshaderinc`), а рисуются один раз. Исправит снимок, который облака не берёт.\n- **Мангры и пальмы не тают перед лодкой, как земля**: растворение перед лодкой есть только у земли (`ground.gdshader`), и лодку в кромке мангров закрывают кроны. Исправит то же растворение у мангров и пальм.\n- **В облачную погоду волны выше, а барашков не больше**: проход барашков (`waters/wakes_press.glsl`) не знает о ветре облачной погоды, который поднимает волны. Исправит ветер, переданный этому проходу.\n- **Шипение дымовой завесы глухо, когда нарастает и стихает**: его громкость меняется громкостью проигрывателя, которую движок принимает за расстояние (`audio/Hiss.cs`; [Звук](audio/sound.md)). Исправит громкость внутри голоса, как у мотора и киля.\n- **На самом крупном тексте кошелёк верфи заходит на плитку последнего места**, а панель показателей стоит вплотную к «Готово»: верфь раскладывает плитки по ширине экрана, а интерфейс при самом крупном тексте шире на четверть ([Экраны и меню](interface/screens.md)). Исправит раскладка ленты мест по ширине, что осталась на экране.\n"}, {"id": "online", "path": "online.md", "title": "Онлайн-кооп", "section": "", "date": "2026-11-20", "md": "# Онлайн-кооп\n\n![Мастерская корабела, у причала которой встречаются лодки товарищей](img/pier.jpg)\n\nКооператив по сети: до четырёх игроков, каждый в своей лодке. Хост ведёт бой, гости присоединяются к нему.\n\n## Решения владельца\n- Кооператив, онлайн: до четырёх игроков, каждый в своей лодке, встречаются в лобби Steam или локальной сети (2026-11-04). Мир хоста хранит прогресс и добычу каждого игрока, у каждого свои. Игрок присоединяется к игре, которая уже идёт, а выбывший возвращается в неё.\n- Игра пишется онлайн с самого начала: правило — в [CLAUDE.md](../CLAUDE.md), принцип 6.\n- Затонувшую лодку игрока товарищ поднимает в течение 15 секунд, несколько секунд держась рядом с её обломками (2026-11-17). Когда этот срок вышел, лодку возвращает припас, подобранный позже в заходе.\n- Команда игроков играет задания, открытые в мире хоста.\n- Онлайн меню паузы открывается поверх боя, который идёт дальше: лодка игрока сбрасывает газ и дрейфует (2026-11-09).\n- Над лодками товарищей видны их имена, и у причала товарищи видят лодку прямо в мире (2026-11-17).\n"}, {"id": "reports-2026-10-13-map-approaches", "path": "reports/2026-10-13-map-approaches.md", "title": "Map approaches for a naval sandbox", "section": "reports", "date": "2026-11-09", "md": "# Map approaches for a naval sandbox\n\nOct 13, 2026 · @Denis\n\n## Summary\n\nNaval games handle the sea in three ways: sail the real world at full scale, move an icon across a strategic overworld while in-game days pass, or sail directly on a compressed top-down map. For an archipelago sandbox with a faction war and a threat meter, the overworld or the compressed hybrid fits best. The world simulation needs in-game time to move fast, and crossing the map should cost minutes, not half an hour.\n\n## How each approach plays out\n\n&#91;embedded content: how a voyage plays out · 3 approaches, 4 steps each\\]\n\nA and C keep sailing and fighting in one view on a real-time clock. B splits travel and battle into two modes, so the world can move in days while you cross the map.\n\n## Approach A: direct sailing at full scale\n\nYou steer the ship through one continuous world, so map size is felt directly as travel time, and battles happen in the same space you sail through.\n\n- **Assassin's Creed IV: Black Flag.** The game director put a full crossing at about half an hour, and players can warp to any sync point they have already found ([Cinemablend](https://www.cinemablend.com/games/Assassin-Creed-4-15-20-Hours-Long-58111.html)).\n- **Sea of Thieves.** Rare tuned the map by how often crews meet, not by its size, aiming for a ship encounter every 15 to 30 minutes on average ([TweakTown](https://www.tweaktown.com/news/60911/sea-thieves-map-15-30-minute-ship-encounters/index.html)). Its shortcut is diving the ship to the next voyage, which leaves loot behind and can't target an exact spot ([Gfinity](https://www.gfinityesports.com/article/sea-of-thieves-fast-travel)).\n\n**Strengths:** strong immersion, seamanship matters every minute, and crew roles on deck suit co-op.\n\n**Costs:** long trips that need fast travel and dense content, and a world simulation that moves slowly because real minutes are the only clock.\n\n## Approach B: strategic overworld with compressed time\n\nThe ship is an icon on a strategic map, in-game days pass quickly while you travel, and a battle opens a separate tactical scene. Distance is measured in days, so the world can change a lot while you sail.\n\n- **Sid Meier's Pirates! (2004).** You cross a Caribbean sailing map between colonies, missions and pirate havens. Winds mostly blow west, storms move across the map, other ships are visible with their destination and nationality, and battles open as their own scene ([Wikipedia](<https://en.wikipedia.org/wiki/Sid_Meier%27s_Pirates!_(2004_video_game)>)). Capturing a city can switch it to another nation, so the map itself changes hands.\n- **Mount & Blade II: Bannerlord.** The developers describe the overworld as where much of the gameplay lies. Villages, peasants and caravans are simulated parties, mountain chokepoints concentrate fights over trade routes, and the year was shortened to twelve weeks ([TaleWorlds blog](https://www.taleworlds.com/en/Games/Bannerlord/Blog/14)).\n- **Space Rangers 2.** Space travel is turn-based and switches to real time for planetary battles. A reviewer notes the game pauses at each decision and fast-forwards over long trips, while the Dominators' attacks shift across the map ([MobyGames](https://www.mobygames.com/game/19891)).\n\n**Warning about shrinking too far:** in one forum test, the same Pirates! crossing took 29 in-game days on PC and 14 on the Xbox port. The tester found the compressed map cramped, with less ship traffic, less distinct islands and a navigation skill that no longer mattered ([Quarter To Three forum](https://forum.quartertothree.com/t/pirates-xbox/19918)).\n\n**Strengths:** fast trips, a world simulation that visibly moves, and natural room for factions, trade and a threat meter.\n\n**Costs:** sailing on the map is less physical, and two modes (map and battle) mean two sets of systems to build.\n\n## Approach C: direct sailing on a compressed top-down map\n\nYou steer the ship yourself in real time, but from a high camera over a smaller world, and combat happens in the same view without a mode switch.\n\n- **Windward (Tasharen Entertainment, 2015).** A top-down sailing sandbox with online co-op for up to 4 players ([co-op.gg](https://www.co-op.gg/game/windward)). Each campaign generates a new world, danger and rewards grow with distance from the start, and AI captains have to explore the map just like players ([Fandom launch article](https://www.fandom.com/articles/733-windward-sailing-sandbox-adventure-game-launches)). One review praised it as a relaxing co-op game but found movement slow and combat mostly circling, and wished for a lower camera ([LinuxGameCast](https://linuxgamecast.com/2017/05/linuxgamecast-reviews-windward/)).\n\n**Strengths:** one mode to build, steering skill matters both when sailing and in combat, and a high camera shows threats and islands early.\n\n**Costs:** in-game time still runs at real speed, so faction wars move slowly unless the clock is sped up separately. Close combat can feel shallow from far above.\n\n## Comparison\n\nThe overworld is the only approach where in-game time runs faster than real time by design, which is what a faction war and threat meter need.\n\n| Approach | Examples | Crossing the map | Where combat happens | World clock | Fit for faction war and threat meter |\n| --- | --- | --- | --- | --- | --- |\n| A. Full-scale direct sailing | Black Flag, Sea of Thieves | About 30 real minutes in Black Flag, with fast travel | Same world, same view | Real time | Weak: fronts move slowly |\n| B. Strategic overworld | Pirates!, Bannerlord, Space Rangers 2 | Measured in in-game days (29 days in one Pirates! PC test) | Separate tactical scene | Compressed days | Strong: built for it |\n| C. Compressed top-down sailing | Windward | Real time; no published figure found | Same view | Real time | Medium: needs a sped-up clock |\n\n## Recommendation for this game\n\nUse a strategic overworld (B), or top-down sailing (C) with a separately sped-up world clock, and build the map as sea regions linked by straits.\n\n&#91;embedded content: example archipelago: 7 sea regions linked by straits\\]\n\nThe threat can only move along links, so holding a strait is a real goal and fronts stay readable. Region names here are placeholders taken from the faction ideas so far.\n\nStarting targets to tune in a prototype, not measured figures:\n\n| Target | Value |\n| --- | --- |\n| Crossing the whole map | 3-5 real minutes |\n| Sailing to a neighboring island | 20-60 seconds |\n| Something to react to (sail, wreck, storm) | Every 30-60 seconds |\n| Islands in total | 40-60, about 20 of them settlements |\n| Factions | 4-5, each with 3-5 settlements |\n| Sea regions | 5-8, linked by straits |\n| Unchecked threat overruns the map | 15-25 hours of play |\n| First prototype | 12-15 islands, 3 factions, 1 threat core |\n\n## References\n\n- [Assassin's Creed 4 Is 15-20 Hours Long](https://www.cinemablend.com/games/Assassin-Creed-4-15-20-Hours-Long-58111.html), Cinemablend, 2013: Black Flag crossing time and sync-point fast travel.\n- [Sea of Thieves map will have 15 - 30 minute ship encounters](https://www.tweaktown.com/news/60911/sea-thieves-map-15-30-minute-ship-encounters/index.html), TweakTown, 2018: Rare's encounter-rate target.\n- [How to fast travel in Sea of Thieves](https://www.gfinityesports.com/article/sea-of-thieves-fast-travel), Gfinity, 2024: diving to a voyage and its limits.\n- [Sid Meier's Pirates! (2004 video game)](<https://en.wikipedia.org/wiki/Sid_Meier%27s_Pirates!_(2004_video_game)>), Wikipedia: sailing map, wind, storms, separate battles, city capture.\n- [Pirates! Xbox](https://forum.quartertothree.com/t/pirates-xbox/19918), Quarter To Three forum, 2005: PC vs Xbox crossing test and effects of a compressed map.\n- [Bannerlord Developer Blog 12: The Passage Of Time](https://www.taleworlds.com/en/Games/Bannerlord/Blog/14), TaleWorlds: overworld simulation, chokepoints, twelve-week year.\n- [Space Rangers 2: Dominators](https://www.mobygames.com/game/19891), MobyGames: turn-based travel, real-time battles, shifting Dominator attacks.\n- [Windward co-op](https://www.co-op.gg/game/windward), co-op.gg: up to 4 players online.\n- [Windward launches on Steam](https://www.fandom.com/articles/733-windward-sailing-sandbox-adventure-game-launches), Fandom, 2015: procedural world, distance-based difficulty, AI that explores.\n- [LinuxGameCast Reviews: Windward](https://linuxgamecast.com/2017/05/linuxgamecast-reviews-windward/), 2017: player view of pace, combat and camera.\n"}, {"id": "reports-2026-10-28-arcade-naval-reference", "path": "reports/2026-10-28-arcade-naval-reference.md", "title": "Arcade Naval & Isometric Mission Games — Reference Report", "section": "reports", "date": "2026-11-09", "md": "# Arcade Naval & Isometric Mission Games — Reference Report\n\nOct 28, 2026 · @Denis\n\nEight games that are the closest references for a simple isometric arcade naval game: fight ships, run missions, pick a ship type.\n\nThey fall into three groups. **Naval arcade** (Battle Stations, Overboard!, Naval Ops, Windward) covers ship classes, broadside combat and local versus play. **Isometric mission shooters** (Desert Strike, Jungle Strike, Cleared Hot, Megacopter) cover the mission structure on an open map. **Hybrid** (Return Fire) uses a roster of vehicle roles in a two-player capture-the-flag game.\n\n## 1. Battle Stations (EA, 1997)\n\n**The PS1 game you played.** A two-player naval fighting game: pick one of 8 modern warships and duel a friend or the CPU. Developed by Realtime Associates, published by Electronic Arts for PlayStation and Sega Saturn.\n\n&#91;image: Battle Stations: ship select, a ship-to-ship duel, and the War Games map\\]\n\n*Left to right: ship select (Player 1 vs Computer), a 1-on-1 duel, the War Games strategic map.*\n\n**Gameplay.** Every fight is a 1-on-1 duel in a small arena seen from above. You steer your ship, move a targeting reticle onto the enemy and dodge its shots. In War Games mode, fleets move as pieces on a map; when two ships meet, the game cuts to a duel.\n\n**Features**\n\n- 8 ship types: aircraft carrier, battleship, cruiser, destroyer, submarine, patrol boat, mine layer, troop transport.\n- Each ship is rated on 6 stats: top speed, target range, hull strength, main guns, special weapon, defensive weapon.\n- Arcade mode: quick duels; sinking ships earns points to climb 10 ranks, Ensign to Fleet Admiral.\n- Campaign: single-player missions against 5 enemy commanders, each with its own style.\n- War Games (2 players): capture the flag (sink the flag ship, bring its flag home) and harbor assaults (land marines from a troop transport).\n- Fleets: pick a country, a balanced fleet or a custom one; over 30 fleets in total.\n- 76 missions: 50 single-player, 26 multiplayer.\n\n**Reception.** Mixed. Magazines called it a 32-bit update of the Intellivision game Sea Battle.\n\n**What to take for your game:** the ship roster. Clear roles with a stat card and one special weapon per class make choosing a ship a decision, not a skin.\n\n## 2. Overboard! / Shipwreckers! (Psygnosis, 1997)\n\n**A cartoon pirate-ship shooter for PS1 and PC with a 5-player party mode.** Called Shipwreckers! in North America and Overboard! in Europe.\n\n&#91;image: Overboard!: a harbour level and an ice level with a sea monster\\]\n\n*Top-down 3D view: harbour level (left) and an ice world (right). HUD shows lives, treasure count and hull bar.*\n\n**Gameplay.** You steer one pirate ship through maze-like waterways seen from above. Each world hides map bottles you need to unlock the exit, guarded by enemy ships, shore turrets, traps and sea creatures. When the ship takes fire, the crew jump overboard one by one as the hull bar drains.\n\n**Features**\n\n- Broadside cannons: you turn side-on to the target to hit it.\n- Special weapons: rockets, mines, lightning bolts, plus power-ups such as speed boosts and shields.\n- 5 themed worlds with puzzles and secret routes; saves on memory card or by password.\n- Multiplayer for up to 5 players with the PS1 Multitap: 10 arenas, deathmatch and capture the flag.\n\n**Reception.** Mixed. Critics found the single-player steering too simple (no wind), while several said multiplayer was the strong point and an addictive party game.\n\n**What to take for your game:** broadside aiming as the core skill, and small arenas for local versus.\n\n## 3. Desert Strike (1992) & Jungle Strike (1993), EA\n\n**The isometric helicopter mission games you were thinking of.** Desert Strike launched on Sega Genesis, became EA's best-selling game at the time, and spawned Jungle, Urban, Soviet and Nuclear Strike.\n\n&#91;image: Desert Strike and Jungle Strike gameplay\\]\n\n*Desert Strike (left) and Jungle Strike (right): an open isometric map with the helicopter, targets and pickups.*\n\n**Gameplay.** You fly an attack helicopter over a large, open isometric map. Each level holds several missions: destroy installations, rescue hostages, capture enemy officers. You pick the order yourself, so planning the route matters.\n\n**Features**\n\n- Resource triangle: limited armor, fuel that drains over time, and ammo; fuel barrels and ammo crates are scattered on the map.\n- 3 weapons with a trade-off: machine gun (plenty), Hydra rockets (fewer), Hellfire missiles (fewest, strongest).\n- Rescued people delivered to a landing zone restore armor.\n- Jungle Strike adds other vehicles: a hovercraft, a motorbike and an F-117, plus a co-pilot choice before each level.\n- Fail one mission objective and you restart the level.\n\n**Reception.** Strong: several magazines scored Desert Strike above 90%, praising the mix of action and strategy.\n\n**What to take for your game:** the mission-on-an-open-map structure, with fuel and ammo as a route-planning puzzle. Jungle Strike's hovercraft shows how a water vehicle fits the format.\n\n## 4. Cleared Hot (MicroProse, PC)\n\n**A modern Desert Strike homage built on physics.** Published by MicroProse on Steam; the store page lists a Nov 20, 2025 release and an Early Access tag.\n\n&#91;image: Cleared Hot: a helicopter on a mission to destroy radar installations\\]\n\n*An objective tracker (top right), minimap and weapon HUD over a desert base.*\n\n**Gameplay.** You fly a helicopter over a 3D map seen from a high angle, completing objectives like knocking out radar sites. A rope and magnet lets you lift almost anything: rocks to throw, tanks to carry, even incoming heat-seeking missiles to redirect. You also ferry and position a squad of soldiers to take or hold ground.\n\n**Features**\n\n- Fully physics-based combat; ragdolling enemies and emergent tricks.\n- 8 playable helicopters with custom loadouts.\n- 3 biomes (desert, jungle, arctic), day and night missions.\n- Enemies include tanks, jeeps, anti-air turrets, fighter jets and boats.\n- Single-player campaign; Steam Workshop support.\n\n**What to take for your game:** one signature verb (the magnet) that makes missions playful. A ship equivalent could be a towing cable or grappling hook.\n\n## 5. Megacopter: Blades of the Goddess (Pizza Bear Games, 2024)\n\n**The closest modern match to the classic Strike look.** Released on Steam on Jun 21, 2024; a sci-fi, comic-book take on Desert Strike and Choplifter.\n\n&#91;image: Megacopter: attacking an enemy dome base on an isometric beach map\\]\n\n*Isometric map with an alert meter (top left), minimap and objective panel (top right), weapon HUD (bottom).*\n\n**Gameplay.** You pilot a sentient helicopter against alien Reptoid forces across isometric maps. Each mission has a clear type, and enemy pressure ramps up as you push deeper.\n\n**Features**\n\n- 4 mission types: seek and destroy (threat level rises as you go deeper), rescue (Choplifter style), defense (enemy waves), boss hunt.\n- 4 biomes, over a dozen missions.\n- Armory: spend tokens on new guns between missions.\n- Ability pairings (AZ-TECH) chosen per mission loadout.\n- Single-player; original retro soundtrack.\n\n**What to take for your game:** a small set of named mission types, and the escalating threat meter inside a mission.\n\n## 6. Return Fire (Silent Software, 1995)\n\n**A two-player capture-the-flag game where picking the right vehicle is everything.** Released on 3DO in 1995, then PC and PlayStation in 1996.\n\n&#91;image: Return Fire: the vehicle bunker and a helicopter over an island\\]\n\n*Left: the undergr
