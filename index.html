ound bunker where you choose your next vehicle. Right: a helicopter attacking an island bunker.*\n\n**Gameplay.** Each player has a base on an island map, seen from a 3D bird's-eye view. You pick a vehicle from your bunker, push into enemy territory, find their flag and bring it home. Lose a vehicle and you go back to the bunker for another.\n\n**Features**\n\n- 4 vehicles with sharp roles:\n  - Helicopter: strafes, destroys mines and bridges, fragile, refuels only at base.\n  - Tank: 360° turret.\n  - Armored support vehicle: toughest and slowest, lays mines.\n  - Jeep: fastest, dies in one hit, the only vehicle that can carry the flag; inflates its tires to cross deep water.\n- Fuel and ammo per vehicle, refilled at depots and ammo tents.\n- Leave the map edge and a submarine surfaces to fire a homing missile.\n- Split-screen two-player mode, praised as the highlight; a classical soundtrack with a theme per vehicle.\n\n**Note:** there are no boats in Return Fire. The jeep's water crossing is the closest it gets.\n\n**What to take for your game:** a rock-paper-scissors vehicle roster where only one class can win the objective. In a naval version, a fast, fragile boat could be the only one able to carry the flag.\n\n## 7. Naval Ops: Warship Gunner (Micro Cabin / Koei, 2003)\n\n**Mission-based arcade naval combat with deep ship building.** PlayStation 2; released in the US in June 2004. Single-player only, third-person camera rather than isometric.\n\n&#91;image: Naval Ops: Warship Gunner gameplay\\]\n\n*Third-person view behind the player's warship in open-sea combat.*\n\n**Gameplay.** You command one warship in real time through 40 missions across 4 theaters (Mediterranean/Atlantic, Pacific, Indian Ocean, worldwide). Each theater ends with a boss fight against a giant \"supership\". Between missions you spend money on parts and research.\n\n**Features**\n\n- Start in a generic destroyer and grow into cruisers, battleships, aircraft carriers and battlecarriers.\n- Build your own ship from hulls, weapons, armor and equipment, or buy pre-built designs and scrap them for parts.\n- Research in 5 areas: aircraft, weapons, metallurgy, engines, electronics.\n- 4 nations (US, UK, Japan, Germany) change the available ship types and parts.\n- WWII mode with period tech, or Normal mode with sci-fi weapons like rail guns and lasers.\n\n**What to take for your game:** the between-mission upgrade loop and boss ships that end each chapter.\n\n## 8. Windward (Tasharen Entertainment, 2015)\n\n**Top-down arcade sailing and ship combat, built for co-op.** Released on Steam on May 12, 2015.\n\n&#91;image: Windward: top-down ship combat with broadsides and area effects\\]\n\n*Bird's-eye view of a sea battle: ships trade broadsides while skill effects burst around them.*\n\n**Gameplay.** You sail one ship around a procedurally generated world, fighting pirates, trading with towns and taking quests. Combat is real-time and arcade: you steer to bring your guns to bear and use active skills. The further you sail from the start, the harder and more rewarding it gets.\n\n**Features**\n\n- Ship classes with clear roles: fast schooners for exploring, heavy ships of the line for firepower.\n- Solo or online co-op, with cross-platform multiplayer.\n- Towns grow as you supply them and unlock better ships and upgrades.\n- Reputation system: AI factions challenge you, avoid you, or follow and help you.\n- AI ships play by the same rules as the player.\n\n**What to take for your game:** readable top-down ship combat at arcade speed, and distance from the start as a simple difficulty curve.\n\n## At a glance\n\nBattle Stations and Return Fire are the best models for local versus play with ship classes; Desert Strike and Megacopter are the best models for missions.\n\n| Game | Year | View | Players | Core loop | Idea to borrow |\n| --- | --- | --- | --- | --- | --- |\n| Battle Stations | 1997 | Top-down duel arena | 1–2 local | Pick 1 of 8 warships, duel | Ship classes with stat cards and a special weapon each |\n| Overboard! | 1997 | Top-down 3D | 1–5 local | Sail mazes, sink ships, find exits | Broadside aiming; small versus arenas |\n| Desert / Jungle Strike | 1992–93 | Isometric | 1 | Open-map missions, manage fuel and ammo | Mission lists on one open map |\n| Return Fire | 1995 | Bird's-eye 3D | 1–2 split-screen | Capture the flag with 4 vehicle roles | Only one fragile class can carry the flag |\n| Naval Ops: Warship Gunner | 2003 | Third-person | 1 | 40 missions, build and upgrade your ship | Upgrade loop; chapter boss ships |\n| Windward | 2015 | Top-down | 1 + online co-op | Sail, fight, trade, quest | Readable arcade broadsides |\n| Megacopter | 2024 | Isometric | 1 | 4 named mission types | In-mission threat meter |\n| Cleared Hot | 2025 | High-angle 3D | 1 | Physics missions with rope and magnet | One signature verb, like a towing cable |\n\n## Sources\n\nScreenshots: Wikipedia, PSX Data Center and Steam store pages, linked below.\n\n- Battle Stations: [Wikipedia](<https://en.wikipedia.org/wiki/Battle_Stations_(1997_video_game)>), [StrategyWiki](https://strategywiki.org/wiki/Battle_Stations), [MobyGames](https://www.mobygames.com/game/47361/battle-stations/), [PSX Data Center](https://psxdatacenter.com/games/U/B/SLUS-00456.html)\n- Overboard! / Shipwreckers!: [Wikipedia](<https://en.wikipedia.org/wiki/Overboard!_(1997_video_game)>), [PSX Data Center](https://psxdatacenter.com/games/U/S/SLUS-00558.html), [PPE.pl](https://www.ppe.pl/gry/Overboard/6480), [The Video Game Critic](https://videogamecritic.com/ps1ss.htm)\n- Desert Strike: [Wikipedia](https://en.wikipedia.org/wiki/Desert_Strike)\n- Jungle Strike: [Wikipedia](https://en.wikipedia.org/wiki/Jungle_Strike)\n- Cleared Hot: [Steam](https://store.steampowered.com/app/1710820/)\n- Megacopter: Blades of the Goddess: [Steam](https://store.steampowered.com/app/1228360/)\n- Return Fire: [Wikipedia](https://en.wikipedia.org/wiki/Return_Fire), [PSX Data Center](https://psxdatacenter.com/games/U/R/SLUS-00184.html)\n- Naval Ops: Warship Gunner: [Wikipedia](https://en.wikipedia.org/wiki/Naval_Ops:_Warship_Gunner)\n- Windward: [Steam](https://store.steampowered.com/app/326410/)\n"}, {"id": "reports-2026-11-13-palette-audit", "path": "reports/2026-11-13-palette-audit.md", "title": "Проверка палитры", "section": "reports", "date": "2026-11-20", "md": "# Проверка палитры\n\n13 ноября 2026. Владелец: «палитра кажется слишком большой, и не все цвета сочетаются». Палитру проверил QA-агент: перевёл все цвета в OKLab, нашёл каждое место, где роль читается, и посмотрел на экраны игры в 162 кадрах демо. Расстояние между цветами ниже — в OKLab: меньше 0,02 не различить, до 0,05 видно только на больших пятнах рядом.\n\n## Вывод\n- **Слишком большая — да.** Тема хранила 82 значения под 58 ролями. Независимых цветов из них около 36: 22 значения были арифметикой другого цвета (светлее, темнее, с другой прозрачностью), ещё 17 стояли ближе 0,04 к другому цвету, 22 роли читались в одном месте.\n- **Не сочетаются — слегка.** Явных конфликтов на кадрах нет. Мешают почти одинаковые цвета: три оранжевых, четыре зелёных, два жёлтых, и сигналы мира вдвое насыщеннее стекла.\n\n![Двойники и похожие смыслы](../img/palette-audit-pairs.jpg)\n\nСлева — один смысл, записанный дважды. Справа — разные смыслы, которые выглядят похоже.\n\n## Что сделано\nИз 82 хранимых цветов осталось 21 ([Палитра](../art/palette.md)). Тема хранит цвет один раз, а его тона считает `game/ui/Hue.cs`.\n\nБез перемен на экране:\n- Считаются из своего цвета: светлые тона `Aqua` и `Lagoon`, гель `Ahead`, свет смыслов в стекле HUD, `Shade`, `WarningInk`, низ `Smoked`, оттенки маленьких стёкол (`Bead`, `Knob`, `Smoke`, `Frosted`, `Veil`).\n- Слиты с двойником: нитро — с оранжевым игрока, свет выбранной плитки — с `Lagoon` и `Player`, хром — с `White`, экран — с `Smoked`, тень под словами — с `Ink`, белая кромка знака — с `White`. Свет башни-импульса читает `Aqua`.\n\nС переменой на экране, после слов владельца «не бояться убрать цвет и взять другой»:\n- **Зелёный один.** `better` взял значение `leaf`; `leaf`, `repair` и `lamp_better` убраны. Сдвинулись числа верфи, переключатель, лампа «годна к морю», припас ремонта.\n- **Лампы мира** горят цветом своего смысла: `lamp_hostile`, `lamp_better`, `lamp_caution` убраны. Янтарная лампа бона больше не похожа на оранжевый игрока.\n- **`accent`** убран: крупные слова реплики — оранжевый игрока глубже.\n- **Детали верфи:** корпус — `Aqua`, броня — синий брони вместо серого «выключено».\n- **Кнопки геймпада** A, B, X, Y — гели `Better`, `Hostile`, `Armour`, `Aim` вместо восьми своих цветов.\n- `aqua_deep` взял значение `heading` (курсор и рамка выделения в окнах инструментов стали темнее); `deep` убран (суша на карте редактора — `Smoked`).\n\n## Четыре оставшихся места\nВладелец сказал взять все четыре; что выбрано, записано в Q159.\n\n1. **Два жёлтых** стали одним: `caution` убран, предупреждения и монеты взяли золото цели.\n2. **Свои цвета деталей** убраны: мотор — `Turquoise`, ракеты — `Sand`, торпеды — `Fuel`.\n3. **Ящики трюма** красятся цветами палитры: бочка топлива фиолетовая, как припас топлива, взрывчатка — красный, электрика — аква, механизмы — бирюза, ценности — золото, ткань — песок, металл — серый «выключено». Провизия и находки с затонувших судов остались деревом.\n4. **Стекло с пойманным светом** повёрнуто к лагуне наполовину: `lagoon`, `lagoon_deep` и `caught` стоят между аквой приборов и водой лагуны.\n\n![Предложение QA](../img/palette-audit-proposal.jpg)\n\nПредложение QA: 36 хранимых цветов. Сделано больше: маленькие стёкла и кнопки геймпада тоже считаются из оставшихся цветов.\n\n## Чего проверка не видела\n- Состояния без кадра: шкала корпуса на половине, янтарная лампа бона, бусина детали брони.\n- Рассвет и закат, экраны коопа, сборка под Windows, цветовая слепота.\n"}, {"id": "reports-2026-11-14-performance", "path": "reports/2026-11-14-performance.md", "title": "Замер кадра, 2026-11-14", "section": "reports", "date": "2026-11-20", "md": "# Замер кадра, 2026-11-14\n\nСнимок на дату. Что игрок чувствует сейчас, записано в [Известных недочётах](../known-issues.md).\n\n## Как мерили\n\nИгра шла скрыто во весь экран Mac владельца (3024×1964, M4 Pro), с апскейлером MetalFX Temporal на половине разрешения, как сборка из редактора, без звука и одна на машине. Скрипт проходит одну поездку: старт в море, путь к постам охотников, бой рядом с ними, швартовка у мастерской, торговец, верфь с перебором деталей, меню, отход, плавание, карта, меню. Сид мира один во всех прогонах.\n\nИнструменты: запись каждого кадра по местам; части сцены и интерфейса, выключаемые по одной, чтобы увидеть их цену; трассы Metal System Trace (время GPU по проходам) и Time Profiler (главный поток). Скрипты лежат вне репозитория, в `~/Library/Caches/Pirates/perf/` (`run3.sh`, `zzperf/Drive.cs`).\n\n## Кадр по местам\n\nМедиана (p50) и 90-й процентиль (p90), мс. Бюджет ровных 60 к/с — 16,7 мс.\n\n| Место | p50 | p90 | Дольше 16,7 мс |\n|---|---|---|---|\n| Открытое море, переход | 14,4 | 15,4 | 1 % |\n| Бой у поста, первые 60 с | 14,0–14,4 | 14,9–15,6 | 1–7 % |\n| Бой у поста, 70–90 с | 15,7–17,2 | 17,1–19,1 | 16–65 % |\n| Причал, лента | 14,6 | 15,8 | 5 % |\n| Экран торговца | 13,5 | 15,0 | 3 % |\n| Верфь | 15,1 | 16,3 | 6 % |\n| Верфь, перебор деталей | 15,3 | 17,3 | 15 % |\n| Первые 2 с верфи | 18,9 | 20,5 | 89 % |\n| Карта | 15,0 | 16,2 | 5 % |\n| Меню | 13,3 | 13,9 | 0,5 % |\n\n11-07 море и верфь шли около 16,2 мс; море и причал стали быстрее на 1,5–2 мс.\n\n## Куда уходит время GPU\n\nПочти везде кадр держит GPU: по трассе он занят 12,6 мс кадра в море, 14,9 у причала и 16,1 на верфи.\n\n| Что выключено | Море | Причал | Верфь |\n|---|---|---|---|\n| Вода моря (проход моря) | 5,0–5,5 | 3,1–3,3 | 3,5 |\n| Симуляция моря (волны, следы, пена) | 2,0 | 2,0 | 2,5 |\n| Temporal → MetalFX Spatial без TAA | 3,6–3,9 | 3,1 | 3,7 |\n| Солнце (свет и тени) | 1,2–1,3 | 1,2–1,4 | 1,4 |\n| Только тени солнца | 0,55 | 0,6–0,8 | 0,9 |\n| SSAO | 0,5 | 0,3–0,4 | 0,5 |\n| Три эффекта компоновщика моря (пирамиды, движение) | 0,6–0,9 | 0,9–1,2 | 1,8 |\n| Дно | 0,7–0,8 | 0,1 | 0,2 |\n| Остров | 0,5–0,6 | 0,3–0,6 | 0,4 |\n| Интерфейс целиком | 0,0 | 1,8–2,3 | 3,6–4,2 |\n| Сглаживание интерфейса (2D MSAA ×2) | 0,2–0,4 | 0,6–0,8 | 1,1–1,7 |\n\nЛодки, эффекты боя, рабочие лодки и патруль стоят GPU не больше 0,2 мс каждые, на уровне шума замера. Обновление всех лодок у причала (`Boat._Process`), рабочих и патруля тоже, занимает около 0,6 мс главного потока.\n\n## Найдено\n\n1. **Лента причала рисуется под верфью и под меню.** `Quayside` прячет свой слой, только когда закрыт. Когда ленту накрывает верфь или меню, плитки уходят, а слой со стеклом остаётся и читает экран. На верфи это вторая копия экрана: 0,6–1,5 мс GPU.\n2. **Плитки ленты и карточки верфи перерисовывают значки и слова каждый кадр** (`Ribbon.Face`, `Card`: `QueueRedraw` без условия). В главном потоке это около 2 мс кадра у причала и около 5 мс на верфи (`Ribbon.Face.Write`, `Choices.Choice.Write`, `Badge`, `Purse.Tag`, `Gloss.Bead`). Свет стекла движется в шейдере, пружины меняют только матрицу. Матрицу можно задавать слою без перерисовки, а рисовать заново, лишь когда меняется написанное; так 11-07 сделали HUD.\n3. **Три системы читают волны по точкам каждый кадр, вдали и вне экрана тоже.** Нефтяное пятно (`Spill`): волна в каждой клетке, `SetPixel` и `ImageTexture.Update`, около 0,7 мс. Звуки берега (`Shores`): прибой на каждой точке берега каждой формы суши, у каждого читаются волна и земля, затем `GroupBy` и `OrderBy` в `Sounds.Holding`, около 0,75 мс. Кольца залпов (`Barrages` → `Warnings.Show`): высота моря на каждом углу и сетка заново каждый кадр, около 0,4 мс; залпы будит и рабочая лодка. Вместе около 1,8 мс главного потока в море.\n4. **Мусора снова много: 8–9 МБ/с в море** (11-07 было около 2), сборка gen1 примерно раз в 2 с. Больше всех дают `Sounds.Holding`, лямбды `Obstacles.Near`, `Parallel.For` волн на каждом тике, строки, превращаемые в `StringName` при каждом вызове параметров шейдера, и массивы `Vector2[]` в рисовании интерфейса.\n5. **В долгом бою кадр растёт**: у поста охотников с 14,1 до 17,2 мс за 80 с. Вызовы отрисовки, число узлов и работа главного потока при этом почти не меняются, значит растёт работа GPU. Вероятнее всего, копятся прозрачные эффекты (дым, огонь, пятна). Причину не нашли.\n6. **Подвисания:** первые 2 с верфи кадр около 19 мс; первое открытие торговца и карты — по одному кадру около 55 мс. Один раз за шесть прогонов в море главный поток на 0,7 с замедлился до 70–135 мс на кадр без мусора и без новых узлов; причину не нашли.\n7. **Главный поток занят** около половины кадра в море, 75 % у причала и 63 % на верфи. Векторная математика Godot в сборке из редактора не встраивается (около 10 % главного потока); в экспорте этого нет.\n\n## Что сделать по выгоде\n\n1. Прятать слой ленты причала, пока её накрывает верфь или меню (п. 1): до 1,5 мс GPU на верфи.\n2. Перерисовывать плитки и карточки, только когда меняется написанное (п. 2): 2–5 мс главного потока у причала и на верфи.\n3. Читать волны только у слышимых звуков и видимых пятен и колец (п. 3): около 1,8 мс главного потока.\n4. Убрать мусор в местах из п. 4.\n5. Найти, что копится в долгом бою (п. 5).\n6. Выбор владельца, меняющий облик: MetalFX Spatial по умолчанию (3–4 мс) и выключенное сглаживание интерфейса (0,2–1,7 мс).\n\n## После исправлений (вечер 11-14)\n\nВладелец: «Сделай исправления, лучший апскейлер по умолчанию, цель 90–100 к/с». Сделано и на main (`daae02c4`):\n\n- Лента причала прячется под верфью, торговцем и меню; плитки, карточки, пилюли, кошелёк и экран торговца перерисовываются только при перемене (кадры совпали с прежними до пикселя); стекло причала, торговца и меню копирует только свой прямоугольник.\n- Пятна, звуки берега, кольца обстрелов и причал не читают море вне вида и слуха; волны читаются в простых float, бит в бит как раньше; мусор с 7,8 до 3,7 МБ/с, сборок gen1 в бою с 22 до 3.\n- Сглаживание интерфейса (2D MSAA) выключено: кадры те же, экономия 0,8–1,5 мс у причала и на верфи.\n- Апскейлер: из всех в Настройках MetalFX Temporal даёт лучшую картинку за свою цену и остаётся по умолчанию; мир рисуется на две ступени ниже точек экрана (80 %, Q249).\n\n| Место | main до работы | с исправлениями при 90 %, со сглаживанием | итог: 80 %, без сглаживания |\n|---|---|---|---|\n| Бой и открытое море | 14,2 мс, 70 к/с | 12,4 мс | 10,6–10,8 мс, около 93 к/с |\n| Причал | 14,7 мс | 12,5 мс | 10,0–10,3 мс, 97–100 к/с |\n| Верфь | 14,2 мс | 12,5 мс | 9,9–10,7 мс, 93–100 к/с |\n| Торговец, меню | 13,0 мс | 10,8–10,9 мс | ниже |\n\nГлавный поток в бою: 4,2 → 2,7 мс на кадр по медиане и 8,1 → 3,2 мс у самых медленных. Море в итоговом виде замерено позже, на питании от сети: на батарее Mac включает режим экономии и GPU замедляется вдвое. Найдено, но не проверено: `talk/Dialogue.cs` задаёт прямоугольник копии экрана в единицах холста, а Godot читает его в пикселях.\n\n## Цена частей шейдера моря\n\nКаждая часть выключена по очереди во временной копии `sea.gdshader` (в игру не попала), кадр во весь экран при итоговых настройках, на питании от сети, два прохода. Море — 1,6–2,5 мс кадра в открытом море и 1,7 мс у причала; почти всё — работа на пиксель.\n\n| Часть | Открытое море | Причал |\n|---|---|---|\n| Всё на пиксель вместе | 1,8–1,9 мс | 1,5–1,6 мс |\n| Преломление: луч до дна | 0,9 | 0,1–0,4 |\n| Мелкие волны | 0,4–0,7 | 0,3 |\n| Пена | 0,4–0,6 | 0,2–0,3 |\n| Солнце на воде | 0,2–0,4 | 0,1–0,2 |\n| Отражение сцены | 0,3 | 0,4–0,7 |\n| Блики | 0,1–0,35 | 0 |\n| Следы, грани, свет из-под воды, тени облаков, берег | по 0,1–0,25 | по 0–0,35 |\n| Волны в вершинах | 0 | 0 |\n\nЧасти перекрываются, так что их сумма больше общего. Что можно удешевить, не меняя картинки: луч преломления шагает до предела видимости (`water_reach`) и на каждом шаге читает глубину даже там, где дно глубже этого предела; пена читает свой узор и там, где пены нет.\n\n"}, {"id": "reports-2026-11-14-sea-camera-games", "path": "reports/2026-11-14-sea-camera-games.md", "title": "Море с нашей камеры: игры-ориентиры", "section": "reports", "date": "2026-11-15", "md": "# Море с нашей камеры: игры-ориентиры\n\n2026-11-14. Какие вышедшие игры показывают море с камеры, похожей на нашу, и из чего у них сделана картинка. Отчёт дополняет [план воды](2026-11-14-water-overhaul.md) и не повторяет его: там — как воду строят, здесь — как она выглядит сверху и на что смотреть перед шагами 3–6. Игровой процесс морских аркад разобран в [отчёте от 28 октября](2026-10-28-arcade-naval-reference.md).\n\nНаша камера: фиксированная изометрия, наклон 35°, издалека, без горизонта; в кадре около 180 м воды, лодка 6–12 м ([Камера и картинка](../gameplay/camera.md)).\n\nКак смотрели. Кадры со страниц магазинов и видео игрового процесса, открытые в браузере 2026-11-14; ссылки ведут на те самые кадры и секунды. В игры не играли. Всё, что сказано о картинке, — наше прочтение кадров; где разработчик сам объяснил приём, это отмечено и дана ссылка. Кадры магазинов показаны прямо на странице: они грузятся с серверов Steam, копий в репозитории нет, а артефакт вики показывает копии, выложенные вместе с ним; щелчок открывает кадр целиком. Моменты из видео остались ссылками.\n\n## Коротко\n- **Игр с хорошим морем сверху мало, и почти все рисуют его плоским.** Волны в геометрии с этой камеры не показывает почти никто. Освещённого гребня, как в Sea of Thieves, сверху нет ни у кого из просмотренных. Наши шаги 1 и 2 (цвет по форме волны) — без образца; дальше образцы есть.\n- **Лучшие делают четыре вещи.** Мель светлой бирюзой отделена от глубины и шире, чем кажется нужным. Белое на воде — только там, где её что-то касается. Корпус посажен в воду каймой пены и тенью. След — отдельная форма, которая стареет.\n- **Главная ошибка — мелкий белый крап по всей воде** (Lost Ark, Windward в бою). Это то самое зерно, которое владелец уже назвал у нас.\n- **Пять игр, которые стоит открыть:** Len's Island (след и накат), King of Seas (всё море целиком, тот же жанр), Anno 1800 (посадка корпуса и солнечная дорожка), Port Royale 4 (цвет мели и ночь), Bad North (белое только как событие). Ссылки — в разборах ниже.\n\n## Кандидаты\n\nТридцать девять игр, у которых мы видели хотя бы кадры магазина. «Не наша» в колонке камеры значит, что игра взята ради моря, а не ради вида. Первые тринадцать разобраны подробно (обе Windward — в одном разборе), следующие четыре — коротко.\n\n| Игра | Год | Студия | Движок | Камера | Море одной строкой |\n|---|---|---|---|---|---|\n| [King of Seas](https://store.steampowered.com/app/1209410/King_of_Seas/) | 2021 | 3DClouds | Unreal Engine 4 | сверху-сбоку, следует за кораблём | приглушённая синева, бирюзовая полоса у каждого острова, след хлопьями |\n| [Cat Quest III](https://store.steampowered.com/app/2305840/Cat_Quest_III/) | 2024 | The Gentlebros | Unity | низкая три четверти, виден горизонт | плоская бирюза: сеть каустики, отражения облаков, рисованные кольца следа |\n| [Len's Island](https://store.steampowered.com/app/1335830/Lens_Island/) | 2025, ранний доступ с 2021 | Flow Studio | Unity | изометрия, следует за героем | кобальт и изумрудные мели; след в два слоя, кружевной накат |\n| [Bad North](https://store.steampowered.com/app/688420/Bad_North_Jotunn_Edition/) | 2018 | Plausible Concept | Unity | высокая, вращается вокруг острова | пустой серо-бирюзовый градиент; белые только следы и линии у берега |\n| [Sea of Stars](https://store.steampowered.com/app/1244090/Sea_of_Stars/) | 2023 | Sabotage Studio | Unity | сверху, пиксель-арт | тёмная синева в чёрточках, подводный рельеф силуэтом, след буквой V |\n| [Abandon Ship](https://store.steampowered.com/app/551860/Abandon_Ship/) | 2019 | Fireblade Software | Unity | строго сверху, очень высоко (карта) | масляная живопись: изумрудные ореолы мелей, белые мазки у островов |\n| [Windward](https://store.steampowered.com/app/326410/Windward/) | 2015 | Tash ная изометрия | волны наката слоями, у каждой пенная кайма |\n| [Don't Starve: Shipwrecked](https://store.steampowered.com/app/393010/Dont_Starve_Shipwrecked/) | ранний доступ 2015 | Klei Entertainment, Capybara Games | неизвестен | сверху-сбоку, 2D | ровная заливка; волны — белые рисованные значки |\n| [Tunic](https://store.steampowered.com/app/553420/TUNIC/) | 2022 | Andrew Shouldice и команда | Unity | изометрия | ровный синий и две светящиеся линии вдоль берега |\n| [A Short Hike](https://store.steampowered.com/app/1055540/A_Short_Hike/) | 2019 | adamgryu | Unity | высокая три четверти | тёмно-синяя вода, светлые рисованные линии волн и следа |\n| [Townscaper](https://store.steampowered.com/app/1291340/Townscaper/) | 2021 | Oskar Stålberg | Unity | высокая, вращается | ровная бирюза в дымке, мягкие отражения домов |\n| [Flotsam](https://store.steampowered.com/app/821250/) | 2025, ранний доступ с 2019 | Pajama Llama Games | Unity | свободная, над плавучим городом | ярко-синяя мультяшная вода в белых рисованных штрихах |\n| [Islanders: New Shores](https://store.steampowered.com/app/2368930/) | 2025 | The Station | неизвестен | высокая, вращается | ровная вода; ночью берег обведён светящимися линиями |\n| [Age of Empires IV](https://store.steampowered.com/app/1466860/Age_of_Empires_IV_Anniversary_Edition/) | 2021 | Relic Entertainment | Essence Engine | стратегическая | серо-голубая рябь, бледные отражения облаков, малый бурун у кораблей |\n| [Anno 117: Pax Romana](https://store.steampowered.com/app/3274580/) | 2025 | Ubisoft Mainz | свой | стратегическая, вращается | серо-синяя рябь, белый прибой вокруг острова, бирюза у скал |\n| [Tropico 6](https://store.steampowered.com/app/492720/Tropico_6/) | 2019 | Limbic Entertainment | Unreal Engine 4 | стратегическая | светлое бирюзовое кольцо мелей вокруг каждого острова, глубже серо-зелёная вода |\n| [Republic of Pirates](https://store.steampowered.com/app/2103470/Republic_of_Pirates/) | 2024 | Crazy Goat Games | Unity | стратегическая | яркая бирюза мелей, морские бои с высоты |\n| [Sid Meier's Pirates!](https://store.steampowered.com/app/3920/Sid_Meiers_Pirates/) | 2004 | Firaxis Games | Gamebryo | высокая три четверти | ровная сине-зелёная вода с редкими штрихами |\n| [Sunless Sea](https://store.steampowered.com/app/304650/SUNLESS_SEA/) | 2015 | Failbetter Games | Unity | строго сверху, 2D | почти чёрное море; видно только то, что освещено лампой корабля |\n| [Sea of Survivors](https://store.steampowered.com/app/2347940/Sea_of_Survivors/) | ранний доступ с 2023 | Nah Yeah Games | неизвестен | изометрия, пиксель-арт | тёмно-синяя вода с тихим узором под сотнями снарядов |\n| [Nautical Survival](https://store.steampowered.com/app/2860990/) | 2026 | Idan Rooze | Unity | строго сверху | тёмно-бирюзовое поле в рядах мелких значков-волн; светлое — только враги и добыча |\n| [Spilled!](https://store.steampowered.com/app/2240080/) | 2025 | Lente | Unity | изометрия, пиксель-арт | синяя вода в светлых штрихах, тёмные пятна нефти, кораллы под водой |\n| [Renegade Ops](https://store.steampowered.com/app/99300/Renegade_Ops/) | 2011 | Avalanche Studios | Avalanche Engine | сверху-сбоку | берег джунглей: бирюзовая мель и белые линии прибоя |\n| [Swordship](https://store.steampowered.com/app/1804270/Swordship/) | 2022 | Digital Kingdom | Unity | высокая за кормой | бирюзовое поле в длинных светлых штрихах скорости |\n| [Sky Force Reloaded](https://store.steampowered.com/app/667600/Sky_Force_Reloaded/) | 2016 | Infinite Dreams | Unity | строго сверху | синее море под самолётом, фон для пуль |\n| [The Touryst](https://store.steampowered.com/app/1796410/The_Touryst/) | 2019 | Shin'en Multimedia | свой | высокая три четверти | воксельные острова, синяя вода, белая кромка у пляжа |\n| [Havendock](https://store.steampowered.com/app/2020710/Havendock/) | 2025 | YYZ Studio | Unity | свободная | простая синяя рябь вокруг настилов |\n| [Civilization VII](https://store.steampowered.com/app/1295660/Sid_Meiers_Civilization_VII/) | 2025 | Firaxis Games | неизвестен | стратегическая | моря на кадрах магазина почти нет |\n| [Dredge](https://store.steampowered.com/app/1562430/DREDGE/) | 2023 | Black Salt Games | Unity | за кормой, не наша | гранёная вода ступенями тона, редкие белые ромбы пены |\n| [Sail Forth](https://store.steampowered.com/app/1031460/Sail_Forth/) | 2022 | Festive Vector | Unity | за кормой, не наша | плоские яркие заливки, цвет моря меняется по регионам |\n\nДо этих не дошли, кадров не видели: The Legend of Zelda: Link's Awakening (2019) и Echoes of Wisdom, Dragon Quest III HD-2D Remake, Octopath Traveler II, Boom Beach, Age of Mythology: Retold, Baldur's Gate 3, Pillars of Eternity II: Deadfire, Hades II и Pirates of Black Cove (2011), чью прозрачную воду над рифами хвалили рецензии. Diablo IV разобран в [плане воды](2026-11-14-water-overhaul.md).\n\n## Разборы\n\n### King of Seas\n3DClouds, 2021. Пиратская аркада с одним кораблём: тот же жанр и почти та же камера.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_7da957df9f6fdfbc0b154ffe392b9473dd3776f4.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_7da957df9f6fdfbc0b154ffe392b9473dd3776f4.600x338.jpg\" alt=\"вид сверху: острова, мели, следы\">вид сверху: острова, мели, следы<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_8cff698ccc48fdec45cdc411a16617912cbf881b.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_8cff698ccc48fdec45cdc411a16617912cbf881b.600x338.jpg\" alt=\"вблизи у опор моста\">вблизи у опор моста<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a71a2d50aa80f013120250a63db016a7859e5e2e.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_a71a2d50aa80f013120250a63db016a7859e5e2e.600x338.jpg\" alt=\"ночной бой\">ночной бой<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_2338d57f593059e394635b92023892146761c146.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_2338d57f593059e394635b92023892146761c146.600x338.jpg\" alt=\"ночной шторм\">ночной шторм<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_ea82d4ae0c08fa45765d19da4e119b419239b228.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1209410/ss_ea82d4ae0c08fa45765d19da4e119b419239b228.600x338.jpg\" alt=\"сумерки\">сумерки<\/a>\n<\/div>\n\nВидео: [штиль, 23:20](https://www.youtube.com/watch?v=Vpm2RsP-E9M&t=1400s) и [свежий ветер, 27:30](https://www.youtube.com/watch?v=Vpm2RsP-E9M&t=1650s).\n\n- **Волна.** Геометрии не видно. На глубокой воде тёмная сеть ячеек и редкие белые мазки по ветру, каждый длиной с корпус. В свежий ветер мазков много, но они мягкие и полупрозрачные.\n- **Цвет и мель.** Глубина — приглушённая сине-бирюзовая. Вокруг каждого острова светлая бирюзовая полоса в два-три корпуса шириной, переход мягкий. Мель видна с любого зума.\n- **Пена.** Тонкая резкая белая линия у самого песка, у камней и опор. В мелкой полосе — редкие белые дуги вдоль берега.\n- **След и корпус.** След — цепочка мелких резких белых хлопьев, три-четыре корпуса, к концу тает. У борта белая линия по ватерлинии. Под кораблём длинная тёмно-синяя тень на воде. Буруна у носа нет.\n- **Солнце и ночь.** Бликов и дорожки нет. Ночью море тёмно-синее, след и кромка берега остаются светлыми, огонь и окна красят воду вокруг корабля.\n- **Берег.** Светлая полоса и белая кромка. Наката на песок на кадрах не видно.\n- **Читаемость.** Вода малоконтрастна. Корабль читается по тени и белой линии у борта.\n- **Взять:** ширину и мягкость бирюзовой полосы; барашки мягкими мазками по ветру вместо шума; тень корпуса на воде; ночь, в которой белое остаётся белым.\n- **Не переносится:** вода без волн; парусники идут медленно, и след короткий.\n\nРазработчики о воде не рассказывали: искали дважды.\n\n### Cat Quest III\nThe Gentlebros, 2024. Камера ниже нашей, виден горизонт, но море нарисовано плоским, как на карте.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_461f0794e63768bb991735c69b6ba7c10d741b5b.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_461f0794e63768bb991735c69b6ba7c10d741b5b.600x338.jpg\" alt=\"корабли в море\">корабли в море<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_5854d4cab322d403c2e6017d280e5bd1d9526f31.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_5854d4cab322d403c2e6017d280e5bd1d9526f31.600x338.jpg\" alt=\"остров и причал\">остров и причал<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_d3ee13457298398719023fcbc8276cc0c0d17d72.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_d3ee13457298398719023fcbc8276cc0c0d17d72.600x338.jpg\" alt=\"остров с пляжем\">остров с пляжем<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_c7a9554db2af32872f381dbfbf294b6f0e7082d0.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_c7a9554db2af32872f381dbfbf294b6f0e7082d0.600x338.jpg\" alt=\"корабль у берега\">корабль у берега<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_b0fa2769d024f88bb5036ede0d911b3a3e2c2c6b.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2305840/ss_b0fa2769d024f88bb5036ede0d911b3a3e2c2c6b.600x338.jpg\" alt=\"ночной остров\">ночной остров<\/a>\n<\/div>\n\n- **Волна.** Вода плоская. Форму дают три нарисованных слоя: сеть светлых линий каустики, редкие белые чёрточки и крупные мягкие пятна отражённых облаков.\n- **Цвет и мель.** Яркая бирюза, к краям кадра темнее и синее. Мели — светлые пятна под водой, рифы — розовые и оранжевые кораллы.\n- **Пена.** Только рисованная: белый воротник вокруг корпуса и белая кромка у берега с тёмной линией мокрого песка.\n- **След и корпус.** Цепочка белых колец за кормой, три-четыре корпуса. Под кораблём тёмно-синяя тень.\n- **Солнце.** Редкие мелкие искры-звёздочки.\n- **Берег.** Двойная линия: белая пена и тёмный край.\n- **Читаемость.** Отличная. На воде много всего, но резкое и белое — только у корабля и берега.\n- **Взять:** крупный медленный рисунок от облаков; белый воротник у корпуса; след из отдельных форм; кораллы под водой на мели.\n- **Не переносится:** плоская вода и мультяшный масштаб, где корабль размером с остров.\n\nРазработчики о воде не рассказывали.\n\n### Len's Island\nFlow Studio, 1.0 в 2025. Выживание на островах, лодки — плоты под парусом. Лучший след и лучший накат из просмотренных.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/58a05ec8ebb31d896573d0dfaa924ed7f9b213ac/ss_58a05ec8ebb31d896573d0dfaa924ed7f9b213ac.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/58a05ec8ebb31d896573d0dfaa924ed7f9b213ac/ss_58a05ec8ebb31d896573d0dfaa924ed7f9b213ac.600x338.jpg\" alt=\"три плота и их следы\">три плота и их следы<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/e9fb3aab2c7ab7a4ba0f0cd1be6d24132e7d4060/ss_e9fb3aab2c7ab7a4ba0f0cd1be6d24132e7d4060.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/e9fb3aab2c7ab7a4ba0f0cd1be6d24132e7d4060/ss_e9fb3aab2c7ab7a4ba0f0cd1be6d24132e7d4060.600x338.jpg\" alt=\"накат на пляж\">накат на пляж<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/ss_f2706ec8d9a219b62cdb43f452d51f52528c88b8.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/ss_f2706ec8d9a219b62cdb43f452d51f52528c88b8.600x338.jpg\" alt=\"причал над мелью\">причал над мелью<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/ss_8bf296ff274e21e1278a6f6f33701fbc1dbfdcb1.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1335830/ss_8bf296ff274e21e1278a6f6f33701fbc1dbfdcb1.600x338.jpg\" alt=\"льды\">льды<\/a>\n<\/div>\n\n- **Волна.** Короткие тёмные штрихи-чешуйки по ветру. Крупных волн нет.\n- **Цвет и мель.** Глубина — насыщенный кобальт. Вокруг каждой скалы изумрудная полоса. Зелёное — мелко, синее — глубоко: читается сразу.\n- **Пена.** У скал тонкая светлая линия. У пляжа широкое кружево.\n- **След и корпус.** След в два слоя. Нижний — широкая мягкая бирюзовая полоса, вода с пузырьками. Верхний — тонкие белые кружевные нити. След тянется на восемь корпусов и дольше, расширяется, следы пересекаются. От носа расходятся тёмные дуги волн.\n- **Солнце.** Бликов нет.\n- **Берег.** Накат: сплошная белая кромка впереди, за ней пена распадается на ячейки и точки. Вода над песком прозрачная и зелёная.\n- **Читаемость.** Вода насыщенная, но ровная. Белое только там, где воды что-то касается.\n- **Взять:** след в два слоя — ровно «кружево и светлая бирюза» из шагов 3 и 4 плана; дуги от носа; рисунок наката.\n- **Не переносится:** вода без волн. Наша лодка быстрее, след нужен длиннее и уже.\n\nРазработчики о воде не рассказывали.\n\n### Bad North\nPlausible Concept, 2018. Оборона маленьких островов. Самая строгая вода из всех.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/688420/ss_87ffd543439fb835b2ffac3ccec014fdd0c3e260.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/688420/ss_87ffd543439fb835b2ffac3ccec014fdd0c3e260.600x338.jpg\" alt=\"ладьи и их следы\">ладьи и их следы<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/688420/ss_3688deb4c6d5fb479068b924f086412ff2947f68.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/688420/ss_3688deb4c6d5fb479068b924f086412ff2947f68.600x338.jpg\" alt=\"берег вблизи\">берег вблизи<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/688420/ss_8c3675db0a388f3717e530c93d0db27f526a5c0a.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/688420/ss_8c3675db0a388f3717e530c93d0db27f526a5c0a.600x338.jpg\" alt=\"остров и лодки\">остров и лодки<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/688420/ss_434a3f02cc4fb77b80330d006e30e1402d296f3d.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/688420/ss_434a3f02cc4fb77b80330d006e30e1402d296f3d.600x338.jpg\" alt=\"линии у берега\">линии у берега<\/a>\n<\/div>\n\n- **Волна.** Никакой. Море — ровный серо-бирюзовый градиент, уходящий в туман.\n- **Цвет и мель.** Один цвет, у берега чуть светлее.\n- **Пена.** Две-три тонкие светлые линии повторяют контур острова и идут к берегу. У лодок тонкая белая обводка.\n- **След и корпус.** Прямые белые полосы, как сухой кистью: плотные у кормы, дальше рвутся в крап и пунктир. Шесть-восемь корпусов.\n- **Солнце.** Нет. Под скалами мягкие тёмные отражения острова.\n- **Читаемость.** Образцовая: на воде нет ничего, кроме событий.\n- **Взять:** правило «белое — только событие»; след-полосу, которая к хвосту рвётся по шуму; линии, идущие к берегу.\n- **Не переносится:** пустая вода. Владелец заказал волны.\n\nЧто сказал автор. Oskar Stålberg в июне 2023 писал, что волны у берега в Bad North и Townscaper — простая «юбка» из сетки, вытянутая от береговой линии, и что она слишком одинакова для открытого и укрытого берега ([пост](https://x.com/OskSta/status/1666429884208381953), текст известен по выдержкам из поиска).\n\n### Sea of Stars\nSabotage Studio, 2023. Пиксельная ролевая игра; по карте мира ходит корабль.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1244090/ss_3444baf45a5dc2b27d0c7d385dbcad7e4b121791.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1244090/ss_3444baf45a5dc2b27d0c7d385dbcad7e4b121791.600x338.jpg\" alt=\"корабль на карте\">корабль на карте<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1244090/ss_2f011be3599c238ff5d240bdb2bb2879e27271f1.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1244090/ss_2f011be3599c238ff5d240bdb2bb2879e27271f1.600x338.jpg\" alt=\"глубокая вода с подводными скалами\">глубокая вода с подводными скалами<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1244090/ss_ac7d1a4a9fb207bc59637aeb24698758e4e847ad.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1244090/ss_ac7d1a4a9fb207bc59637aeb24698758e4e847ad.600x338.jpg\" alt=\"мелкий риф\">мелкий риф<\/a>\n<\/div>\n\n- **Волна.** Мелкие горизонтальные чёрточки на тёмной синеве, контраст низкий.\n- **Цвет и мель.** Подводный рельеф виден тёмно-зелёными силуэтами. У островков светлые бирюзовые ореолы.\n- **Пена.** Тонкая светлая линия вдоль скал и дуги ряби у камней.\n- **След и корпус.** Две тонкие чёткие расходящиеся линии буквой V, между ними дужки у кормы. У носа завиток.\n- **Солнце.** Редкие искры-точки. Над морем плывёт слой облаков.\n- **Читаемость.** Тёмная спокойная вода, светлый корабль.\n- **Взять:** след из двух тонких линий, который читается с любого зума; подводный рельеф силуэтом; облака над морем.\n- **Не переносится:** пиксельная техника.\n\nРазработчики рассказывали только о свете, не о воде.\n\n### Abandon Ship\nFireblade Software, 2019. Карта исследования снята строго сверху и очень высоко: корабль — точка.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/551860/ss_cd0b03fe17e0d89336325739cadcd47d3f7a786b.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/551860/ss_cd0b03fe17e0d89336325739cadcd47d3f7a786b.600x338.jpg\" alt=\"тропический архипелаг\">тропический архипелаг<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/551860/ss_e6d19227858c8866d4e718491527931822d73c9d.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/551860/ss_e6d19227858c8866d4e718491527931822d73c9d.600x338.jpg\" alt=\"то же море в сумерках\">то же море в сумерках<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/551860/ss_ae13a22dbc16c903730238cc314c4e29bbb5baad.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/551860/ss_ae13a22dbc16c903730238cc314c4e29bbb5baad.600x338.jpg\" alt=\"льды ночью\">льды ночью<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/551860/ss_8e1cbcb42874fa5b57c632608d178d99cd304658.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/551860/ss_8e1cbcb42874fa5b57c632608d178d99cd304658.600x338.jpg\" alt=\"вулканическое море\">вулканическое море<\/a>\n<\/div>\n\n- **Волна.** Длинные мазки кисти вдоль зыби. Вся вода как масляная живопись.\n- **Цвет и мель.** Изумрудно-бирюзовый ореол вокруг каждого острова, шире самого острова. Между ними тёмно-синие котловины. Затонувшие мели — светлые круги. Палитра региона меняет море целиком: в сумерках оно лиловое с розовыми ореолами.\n- **Пена.** Белые мазки там, где зыбь бьёт в остров; с наветренной стороны гуще.\n- **След.** Тонкая белая черта.\n- **Читаемость.** Не образец: корабль теряется.\n- **Взять:** ореол мели шире суши; пену гуще с наветренной стороны острова; палитру моря по локации.\n- **Не переносится:** высота камеры и живописная фактура, которая спорит с мелкими целями.\n\nЧто сказали авторы: облик взят с морских картин маслом; о том, как сделана вода, ничего.\n\n### Windward и Windward Horizon\nTasharen Entertainment, 2015 и 2025. Тот же жанр и та же камера. Хорошие отмели и пример того, чего не делать с бликами.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/326410/ss_4d325f53343f16bf9ea5689dddfba55aa8898ced.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/326410/ss_4d325f53343f16bf9ea5689dddfba55aa8898ced.600x338.jpg\" alt=\"Windward: отмели\">Windward: отмели<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/326410/ss_aec4a17f4b449f32a82ff8913def9c3ab4dfa56c.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/326410/ss_aec4a17f4b449f32a82ff8913def9c3ab4dfa56c.600x338.jpg\" alt=\"Windward: бой, искры по всему кадру\">Windward: бой, искры по всему кадру<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/326410/ss_39ab395d82491f2f8fe269a93d65c74840fbdea8.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/326410/ss_39ab395d82491f2f8fe269a93d65c74840fbdea8.600x338.jpg\" alt=\"Windward: мели у снежного берега\">Windward: мели у снежного берега<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/326410/ss_58306bcba9ebc05e20f819ee4115161aa2460808.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/326410/ss_58306bcba9ebc05e20f819ee4115161aa2460808.600x338.jpg\" alt=\"Windward: ночной бой, длинные следы\">Windward: ночной бой, длинные следы<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2665460/ss_e0632950c8135f2d180ee2c8796b38b5815436df.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2665460/ss_e0632950c8135f2d180ee2c8796b38b5815436df.600x338.jpg\" alt=\"Windward Horizon: бой\">Windward Horizon: бой<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2665460/ss_da8c0e2b21e020463016deae34fa9afc977687fc.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2665460/ss_da8c0e2b21e020463016deae34fa9afc977687fc.600x338.jpg\" alt=\"Windward Horizon: остров\">Windward Horizon: остров<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2665460/ss_8e0efc56e5ef46b908b9419f515130e1a55ad799.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2665460/ss_8e0efc56e5ef46b908b9419f515130e1a55ad799.600x338.jpg\" alt=\"Windward Horizon: лагуна\">Windward Horizon: лагуна<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2665460/ss_b042b40d2798d018dd728f5bf795d8d6151aed99.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2665460/ss_b042b40d2798d018dd728f5bf795d8d6151aed99.600x338.jpg\" alt=\"Windward Horizon: зыбь с низкой камеры\">Windward Horizon: зыбь с низкой камеры<\/a>\n<\/div>\n\n- **Волна.** Зыбь в геометрии и мелкая рябь.\n- **Цвет и мель.** В Windward песчаные отмели просвечивают кремовым и бирюзовым, широкие и понятные. Horizon темнее и реалистичнее.\n- **Пена.** В Horizon короткие белые штрихи барашков по ветру. У берега пена слабая.\n- **След.** Длинные тонкие бледные полосы, десять корпусов и больше.\n- **Солнце.** В бою Windward искры лежат по всему кадру: это зерно, и оно спорит со следами и трассами ядер. В Horizon дорожка собрана в пятно у края кадра.\n- **Читаемость.** Тёмные корабли на тёмной воде. Игра спасается цветными кольцами под кораблями.\n- **Взять:** отмели Windward; длинные тонкие следы; дорожку пятном.\n- **Не брать:** искры по всему кадру и тёмную воду под тёмными корпусами.\n\nЧто сказал автор. Вода Windward выложена отдельным пакетом: два цвета, мелкий и глубокий, смешаны по глубине; текстура пены лежит в альфа-канале карты нормалей и ставится по глубине; волны — сдвигаемые карты нормалей ([ветка на форуме Unity](https://discussions.unity.com/t/tasharen-water-water-from-windward/482988)).\n\n### Anno 1800\nUbisoft Mainz, 2019. Градостроительная стратегия с флотом. Лучшая посадка корпуса в воду.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/916440/957eb75b4ed13d3d313e0cda02b2486c99207f3b/ss_957eb75b4ed13d3d313e0cda02b2486c99207f3b.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/916440/957eb75b4ed13d3d313e0cda02b2486c99207f3b/ss_957eb75b4ed13d3d313e0cda02b2486c99207f3b.600x338.jpg\" alt=\"гавань и броненосцы\">гавань и броненосцы<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/916440/d3782dde92ecfa18d73432b6735c5d93dba4acf3/ss_d3782dde92ecfa18d73432b6735c5d93dba4acf3.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/916440/d3782dde92ecfa18d73432b6735c5d93dba4acf3/ss_d3782dde92ecfa18d73432b6735c5d93dba4acf3.600x338.jpg\" alt=\"гавань Нового Света\">гавань Нового Света<\/a>\n<\/div>\n\nВидео: [флот с высоты, 5:08](https://www.youtube.com/watch?v=zZegAxKrgHc&t=308s) (запись альфа-версии).\n\n- **Волна.** С высоты — мелкая рябь тёмных и светлых чешуек и крупные мягкие пятна тона.\n- **Цвет и мель.** В Старом Свете вода стально-синяя. В Новом — бирюза, сквозь которую видно дно: песок, камни, тёмные пятна водорослей.\n- **Пена.** У каждого корпуса белый бурун у носа и белая кайма вдоль бортов. У скал кайма.\n- **След и корпус.** От носа расходится белое V, за кормой вспененная полоса в два-три корпуса, внутри светлее. В воде лежат мягкие отражения парусов и корпусов.\n- **Солнце.** Дорожка — пятно белых искр в одном углу кадра. На остальной воде искр нет.\n- **Читаемость.** Корабли крупные, вода спокойная, белое только у корпусов.\n- **Взять:** бурун у носа, кайму и отражение или тень вместе: корабль сидит в воде, а не лежит на ней; дорожку пятном в углу.\n- **Не переносится:** низкая камера рекламных кадров и размер кораблей.\n\nРазработчики о воде не рассказывали. Сторонний [разбор кадра](https://blog.thomaspoulet.fr/posts/anno-1800-frame-analysis/) (Thomas Poulet, 2025) находит океан на БПФ и отдельную местную симуляцию у берегов.\n\n### Lost Ark\nSmilegate RPG, 2019. Камера в море — точно наша: фиксированная изометрия, корабль в центре, вода во весь кадр. Пример дорогой воды, которая сверху читается плохо.\n\nВидео: [открытое море, 1:01](https://www.youtube.com/watch?v=KNCe1oN6CFU&t=61s) и [у берега, 15:57](https://www.youtube.com/watch?v=KNCe1oN6CFU&t=957s).\n\n- **Волна.** Реалистичная вода. Крупные тёмные и светлые пятна дают масштаб.\n- **Цвет и мель.** Бледная серо-голубая. У берега зелёная мель с видимым дном и водорослями.\n- **Пена.** Мелкий белый крап по всей поверхности.\n- **След.** Короткая мягкая белая полоса.\n- **Читаемость.** Вода светлая и шумная. Корабль читается цветом парусов и подписью, а не силуэтом.\n- **Взять:** крупные пятна тона и зелёную мель.\n- **Не брать:** крап по всей воде. Это зерно, которое у нас убрано шагом 1.\n\nРазработчики о воде не рассказывали.\n\n### Command & Conquer: Red Alert 3\nEA Los Angeles, 2008. Стратегия, где половина боя идёт на воде; водой игру и продавали.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006507.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006507.600x338.jpg\" alt=\"бой у берега\">бой у берега<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006514.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006514.600x338.jpg\" alt=\"ночной бой\">ночной бой<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006501.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006501.600x338.jpg\" alt=\"бой у платформ\">бой у платформ<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006504.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/17480/0000006504.600x338.jpg\" alt=\"база ночью\">база ночью<\/a>\n<\/div>\n\n- **Волна.** Почти нет: рябь и блеск.\n- **Цвет и мель.** Прозрачная бирюза, под ней нарисованное дно: песок, камни, тёмные пятна. Дно делает половину картинки.\n- **Пена.** Каждый корабль и каждая платформа стоят в кольце белого кружева. У берега несколько тонких параллельных линий.\n- **Ночь.** Насыщенный ультрамарин с белыми бликами; корабли светятся своими огнями.\n- **Читаемость.** Вода пёстрая. Спасают корабли: крупные блоки чистого белого, жёлтого и красного.\n- **Взять:** кольцо пены у всего, что стоит в воде (сваи, станция, пирс); дно под прозрачной мелью; ночь синюю, а не чёрную.\n- **Не брать:** общую пестроту. Наши лодки меньше и её не выдержат.\n\nРазработчики о воде не рассказывали, есть только пресса.\n\n### Port Royale 4\nGaming Minds Studios, 2020. Торговая стратегия на Карибах. Карта снята с высоты спутника, но ход цвета — лучший из всех.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_76136c89743d27c01850dbc4d8f3cf4e4815147f.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_76136c89743d27c01850dbc4d8f3cf4e4815147f.600x338.jpg\" alt=\"карта днём\">карта днём<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_dd47fb3f3cf2762dfa0f38e405d1af45224c2b57.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_dd47fb3f3cf2762dfa0f38e405d1af45224c2b57.600x338.jpg\" alt=\"карта ночью\">карта ночью<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_6f2a51539c075abbba137d18df4f79686a7e7ba0.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_6f2a51539c075abbba137d18df4f79686a7e7ba0.600x338.jpg\" alt=\"берег у города\">берег у города<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_92da3335425f328152282a2ada5c92785b4024a3.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_92da3335425f328152282a2ada5c92785b4024a3.600x338.jpg\" alt=\"берег и солнечная дорожка\">берег и солнечная дорожка<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_a10bf0a124cdc76a18d72ce136fa0db4a044b25e.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1024650/ss_a10bf0a124cdc76a18d72ce136fa0db4a044b25e.600x338.jpg\" alt=\"корабли ночью\">корабли ночью<\/a>\n<\/div>\n\n- **Цвет и мель.** Белёсый песок, широкий бирюзовый шельф с тёмно-зелёным крапом рифа, потом свал в индиго. Край свала размыт, но перепад тона большой. Острова стоят на широких светлых шельфах.\n- **Волна.** Вблизи — ровные полосы ряби вдоль берега.\n- **Пена.** Тонкая линия у пляжа.\n- **Ночь.** Глубина почти чёрная. Шельф остаётся тусклым зелёным свечением вокруг островов.\n- **Взять:** ширину шельфа и ход цвета от песка до индиго; ночь, в которой мели видны, а глубина гаснет.\n- **Не переносится:** высота камеры карты.\n\nРазработчики о воде не рассказывали.\n\n### Shadow Gambit: The Cursed Crew\nMimimi Games, 2023. Стелс на карибских островах, пешком. Взята ради солнца на воде.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1545560/ss_82623aed56e92c85b8c0fdb618871162003006c6.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1545560/ss_82623aed56e92c85b8c0fdb618871162003006c6.600x338.jpg\" alt=\"лагуна и островок\">лагуна и островок<\/a>\n<\/div>\n\n- **Цвет и мель.** Ярко-зелёная вода над песком, глубже сине-зелёная. Под водой тёмные пятна водорослей.\n- **Солнце.** Искры собраны в пятна на освещённых участках, не по всему кадру. Каждая искра — яркая белая точка с ореолом.\n- **Пена.** Мягкая кромка у песка.\n- **Прочее.** На воду падают тени пальм.\n- **Взять:** искры пятнами и тени на воде.\n- **Не переносится:** лодок на ходу нет, следа и открытого моря не видно.\n\nРазработчики о воде не рассказывали.\n\n### Ещё четыре, коротко\n- **Animal Crossing: New Horizons.** Накат на песок: впереди белая кромка, за ней прозрачная зелёная вода, после отхода волны остаётся тёмная полоса мокрого песка. Ночью пена остаётся светло-голубой на тёмно-синей воде. Видели два кадра из записи игрока с опущенной камерой: [закат](https://www.youtube.com/watch?v=Q21T5KUPiVY&t=61s) и [ночь](https://www.youtube.com/watch?v=Q21T5KUPiVY&t=18708s).\n- **Terra Nil.** Глубина показана ступенями, у каждой свой тон и тонкий контур, как на карте глубин. Под водой пастельные кораллы. К пляжу идут две-три белые линии с кружевом.\n- **Don't Starve: Shipwrecked.** Волны — счётные белые рисованные значки на ровной заливке; между «значком» и «ничем» нет ничего.\n- **Path of Exile 2.** Волны наката собраны слоями, у каждой волны светлая пенная кайма и прозрачное тело. Это единственная игра списка, где разработчик показал, как это сделано: [доклад, 24:01](https://www.youtube.com/watch?v=TrHHTQqmAaM&t=1441s).\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1593030/ss_586d1a2ef80bcf7e18d1d91afa284eb5245d4bd7.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/1593030/ss_586d1a2ef80bcf7e18d1d91afa284eb5245d4bd7.600x338.jpg\" alt=\"Terra Nil: риф и линии наката\">Terra Nil: риф и линии наката<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_4a608cebce8d77000c6f92860d2bbfe306ab160c.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_4a608cebce8d77000c6f92860d2bbfe306ab160c.600x338.jpg\" alt=\"Don't Starve: Shipwrecked: шторм\">Don't Starve: Shipwrecked: шторм<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_51f9b5164ba8122fe821a835107f4dd9b9ccf50b.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_51f9b5164ba8122fe821a835107f4dd9b9ccf50b.600x338.jpg\" alt=\"Don't Starve: Shipwrecked: волны-значки\">Don't Starve: Shipwrecked: волны-значки<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_08f5d676e87583c64a897829de54a6a7fb3b72f1.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_08f5d676e87583c64a897829de54a6a7fb3b72f1.600x338.jpg\" alt=\"Don't Starve: Shipwrecked: мель\">Don't Starve: Shipwrecked: мель<\/a>\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_bf68d2d933102471be63278902c4d4d4b6cdf5ee.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/393010/ss_bf68d2d933102471be63278902c4d4d4b6cdf5ee.600x338.jpg\" alt=\"Don't Starve: Shipwrecked: зелёная мель\">Don't Starve: Shipwrecked: зелёная мель<\/a>\n<\/div>\n\n## Кадры остальных игр\n\nПо одному-два кадра на каждую игру таблицы, у которой нет разбора. Подписи называют игру и то, что на кадре.\n\n<div class=\"gallery\">\n<a href=\"https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/553420/ss_9c0184ba83022786f74f4a70ebae5c47d2a3c35c.1920x1080.jpg\"><img src=\"https://shared.fastly.steamstatic.com/store_item_a
