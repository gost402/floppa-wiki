\n- **11-12** Станция покупает добычу дешевле гавани и продаёт ремонт и топливо за монеты, деталей не продаёт. → [Станция](world/outpost.md)\n- **11-12** Бой: гонщик, преследователь и таранщик остаются на 22–23 м/с; ракеты врагов быстрее (около 55 м/с на ходу), увернуться было слишком легко; неуязвимость в рывке нитро только у лодок игроков; таран снимает с целой лодки не больше половины корпуса; турель игрока бьёт по захваченной цели, пока та в радиусе, иначе по ближайшей; припасы падают реже, раз в ~40 с. → [Бой](gameplay/combat.md), [Лодка](gameplay/boat.md), [Припасы](gameplay/pickups.md), [Охотники и ИИ](gameplay/hunters.md)\n- **11-12** В стекло переходят диалог (ответы списком, как меню, имя мелкой подписью), циферблат рыбалки и экран показателей верфи; стекло HUD остаётся без преломления. → [Компоненты](art/components.md), [HUD](interface/hud.md)\n- **11-12** Тема одна на всё: каждая деталь интерфейса, диалог тоже, берёт облик из `look.tres`; прежние решения о виде отдельной детали исключением не служат. → [Компоненты](art/components.md)\n- **11-13** Вся бумага интерфейса становится стеклом: бумажных вещей, скотча и рукописного шрифта в нём не остаётся. Карта — прозрачное стекло с линиями света; судовой журнал — окно матового стекла со строками. Заменяет «интерфейс из вещей мира» (11-02). → [Компоненты](art/components.md), [Стиль интерфейса](art/interface.md)\n- **11-13** Продажа — экран торговца, как в играх о рыбалке и торговле с лодки: слева торговец с короткой репликой в стеклянной выноске (в гавани корабел, на «Марии» мытарь), справа трюм ящиками с ценами; ящик продаётся выбором, есть «Продать всё», непроданное остаётся на борту и продаётся позже с плитки «Торговец» на ленте причала. Итог захода не показывается. → [Добыча](gameplay/haul.md), [Станция](world/outpost.md)\n- **11-13** Дорожная карта до полного релиза в Steam, планка — 90 на Metacritic. Порядок этапов: что это за игра; срез и рядом с ним чужие машины и страница Steam; демо; ранний доступ; релиз 1.0. Что внутри этапов и сроки — пока предложение. → [Дорожная карта](roadmap.md)\n- **11-13** Гавань на острове — не хаб, а место открытого мира: мастерская корабела на сваях (сарай, слип, лебёдка, топливная колонка, один короткий причал), дерево и немного соларпанка, сигнальная мачта с вымпелом и фонарём. Экрана базы нет: пришвартованная лодка остаётся в мире, над морем лента «Торговец», «Верфь», «Отчалить», а кооператив, журнал и настройки — в меню `Esc`. Сменено: пирс с четырьмя местами и экран базы с плиткой «На арену» (11-10). → [Гавань](base/pier.md), [Экраны и меню](interface/screens.md), [Онлайн-кооп](online.md)\n- **11-13** Полигона нет: владелец убрал кнопку «Испытать» на верфи и полигон с мишенями-макетами. → [Верфь](base/boatyard.md)\n- **11-13** Палитра слишком большая, и не все цвета сочетаются: не бояться убрать цвет и взять другой. Из 82 хранимых цветов осталось 21. → [Палитра](art/palette.md)\n- **11-13** Вид верфи — обычный изометрический, как в бою. Низкий вид сбоку, который крутил игрок (11-10), владелец увидел и назвал странным. → [Верфь](base/boatyard.md)\n- **11-13** Звук и эффекты боя улучшить радикально: исследовать, как это делают на GitHub и в других играх, и применить лучшее целиком, ничего не оставляя на потом; новые записи — только CC0 с Freesound. Вопросы облика для этой работы сняты, решения без владельца — в вопросах Q210–Q221 и Q225–Q239. → [Звук](audio/sound.md), [Бой](gameplay/combat.md)\n- **11-13** Игра должна ощущаться как старые GTA: море живёт своей жизнью, неприятности начинает игрок, ответ растёт с тем, что он натворил, и от него можно уйти. Одобрено всё: мирные лодки на маршрутах, уровень розыска и патруль с постов карты, несколько дающих задания, мелкие забавы (буйства на время, очки за прыжки, спрятанные посылки), музыка как радио лодки и крупные строки диктора. Мирные лодки — основа для подробной жизни мира с торговцами и караванами. Не берём: угон лодок, всё пешком, криминальную сатиру, неон; вид сам не отъезжает от скорости. Заморозка новых систем снята. Розыск как второй источник сложности — годится. Кто такой патруль — позже, пока просто полиция; облик мирных лодок — позже. → [Жизнь моря](world/life.md), [Розыск и патруль](gameplay/wanted.md), [Открытый мир](gameplay/missions.md)\n- **11-14** Течений и бонов нет: владелец убрал оба вида зон из игры. Сменено: течения-ускорители с бирюзовыми шевронами (11-10, 11-11). → [Зоны и опасности](world/areas.md)\n- **11-14** Мирным лодкам — расписание и живое поведение. → [Жизнь моря](world/life.md)\n- **11-14** Рыбак ловит сетью со стрелы, снасть чуть крупнее жизни; на косяке плещется рыба. → [Жизнь моря](world/life.md)\n- **11-14** Открытый мир — состояние без задания, а не выживание: часов «Продержались» и «Вперёд» нет. Игра сохраняет состояние мира и продолжается с последнего сохранения; при запуске — главное меню «Продолжить», «Новая игра», «Настройки», «Выход». Сменено: игра сразу начинается в море (11-10), сохранение хранит только прогресс. → [Открытый мир](gameplay/missions.md), [Прогресс и сохранения](gameplay/progression.md), [Экраны и меню](interface/screens.md)\n- **11-14** Броненосец — мировой босс, как в WoW: стоит на стоянке с начала, без часов, отсчёта и объявлений. Сменено: броненосец приходит по часам на десятой минуте (11-09). → [Открытый мир](gameplay/missions.md)\n- **11-14** Пиратский остров: старый каменный форт на скале с бастионами, батареями и флагом над башней, чёрные моторные лодки под чёрным косым парусом и флоппы-пираты на причале, крышах, у костра и на башне. Пираты — новая сторона, отдельная от банды: нападают на любую лодку рядом и далеко от форта не гонятся. → [Форт пиратов](world/fort.md)\n- **11-14** Воду переделываем целиком, облик — как в Sea of Thieves: плавные валы, бирюза в гребнях, белая пена узором; волны умеренные; камеру можно сделать положе. → [План воды](reports/2026-11-14-water-overhaul.md)\n- **11-14** Шесть кандидатов на облик всей игры со стенда `Art` сняты, стенд удалён; облик игры — нынешний. → [Кандидаты на облик](art/candidates.md)\n- **11-15** Имени «Арена» у уровня больше нет: это просто мир; круг карты, над которым стоит вид, зовётся кругом арены. Сменено: арена как имя уровня (11-09). → [Открытый мир](gameplay/missions.md), [Камера и картинка](gameplay/camera.md)\n- **11-15** Соперники вернулись: система заклятых врагов, о которой мечтает владелец, — это они. Восемь капитанов с командами, ливреями, портретами и голосами, две команды в море разом; они помнят прошлую встречу с игроками и говорят о ней по радио. Сменено: соперников нет (11-10). → [Соперники](gameplay/rivals.md)\n- **11-16** Радио поёт шанти: пятая станция «Шанти» рядом с джазовыми, поёт команда котов мяуканьем по слогам настоящих слов, песни — старинные народные шанти XIX века. → [Музыка](audio/music.md)\n- **11-16** Облака объёмные, как их строят игры; в облачную погоду тени туч хорошо видны на воде. → [Погода](world/weather.md)\n- **11-16** Время суток идёт: сутки за 12 минут. Сменено: час держится на месте весь заход. → [Свет и время суток](art/light.md)\n- **11-16** Погода меняется: над миром сменяют друг друга периоды — ясно, облачно, лёгкий дождь, туман, — поверх плывут штормы, в непогоду чаще; шторм виден издалека шапкой туч, прозрачной вокруг лодки, край плавный. → [Погода](world/weather.md)\n- **11-16** Погода вернулась штормом, каким его видит владелец: огромные волны, тёмные тучи, ливень, молнии и гром; штормы и стоят на карте, и приходят сами; мешают заметно, но играть можно; образец — Sea of Thieves. Сменено: погоды нет (10-27). → [Погода](world/weather.md)\n- **11-16** Все модели несут запечённое затенение неба: оно гасит только свет неба, тени солнца и луны остаются живыми, и потому верно при любом часе и движущихся солнце и луне. → [Свет и время суток](art/light.md)\n- **11-16** Главное меню — над водой в виде боя, посередине экрана, заголовком — название игры; в нём есть «Загрузить». Пляж с кокосами и вывеской сделан и снят в тот же день. В море игра сохраняется сама раз в минуту, когда рядом нет охотников. → [Экраны и меню](interface/screens.md), [Прогресс и сохранения](gameplay/progression.md)\n- **11-16** Меню поднимаем до уровня больших игр: тихий выбор пункта (кромка и блик), игра поднимается из тёмного, мир за паузой размыт. → [Экраны и меню](interface/screens.md)\n- **11-16** За меню паузы мир размыт, как будто у камеры ушёл фокус, чуть притемнён и приближен; меню показывает, где ты. Сменено: сцена под меню затемнена слегка и только слева, чтобы стекло оставалось стеклом. → [Экраны и меню](interface/screens.md)\n- **11-16** Дерево похоже на дерево: доски и швы видны, волокна вблизи, тон разный от доски к доске, дерево — выгоревший тик; металл блестит; всё в шейдере, без скачанных текстур. → [Материалы](art/materials.md)\n- **11-16** Сначала альфа: довести до ума то, что в игре уже есть, а потом строить срез. В альфе новых систем не начинаем; новая система встаёт после альфы или вместо чего-то из её списка. Сменено: заморозки нет (11-13). Что входит в альфу — пока предложение. → [Дорожная карта](roadmap.md)\n"}, {"id": "gameplay-boat", "path": "gameplay/boat.md", "title": "Лодка", "section": "gameplay", "date": "2026-11-12", "md": "# Лодка\n\n![Лодка игрока вблизи](../img/boat.jpg)\n\nЕдинственная лодка игрока: как она управляется, плавает, горит топливом и что на неё ставят. Числа корпусов, моторов и брони — в [Балансе лодок](../balance/boats.md).\n\n## Решения владельца\n- Лодка кренится в повороте слабо (2026-11-10): крен каждого корпуса (`Feel.Lean`) срезан вдвое.\n- Никакой физики, но весёлое ощущение управления катером.\n- Она управляется как твёрдое тело, толкаемое в точках корпуса, по образцу 2D-машины Пэта Керра (patkerr.co.uk/2d-vehicles), а не чистым сглаживанием.\n- Перевёрнутая лодка выпрямляется, против физики, если нужно, как аркады переворачивают машину обратно на колёса.\n- Она едет по волнам — своим и чужим следам.\n- Несколько типов лодок: простые катера, от самых примитивных. В каждый должно быть круто запрыгнуть и управлять им.\n- Вес важен: у каждой детали есть масса, и лодка держится на воде, дифферентуется, встаёт и управляется по ним. Вес стоит скорости, как на настоящем глиссирующем катере.\n- Ничто не ограничивает скорость лодки: чем безумнее, тем лучше.\n- Крюка нет: владелец убрал крюк, лебёдку и буксир 2026-11-09.\n- Стоящая лодка разворачивается на месте одним рулём, без газа.\n- Каждая деталь — лучший выбор для какой-то лодки: деталь, во всём хуже другой, убирается.\n- Никаких свободных корпусов и многокорпусных лодок; крайние проекты не требуют особой обработки.\n- Нитро — рывок (2026-11-10): нажатие на Shift бросает лодку вперёд, и рывком уходят от ракет. Он должен быть крутым и весёлым, а не правдоподобным. Заряд восстанавливается со временем. Охотники тоже его жгут.\n- Топливо ограничено: лодка несёт только свой бак. Оно сгорает по пройденному пути, а не по времени: лодка, стоящая на месте или идущая накатом, не жжёт ничего.\n- Снаряжение добавляет приём: таран ([Бой](combat.md)), дым, сбивающий охотнику прицел, помпа, чинящая корпус в море, плотники, которые латают его за каждую лодку, которую она топит ([Бой](combat.md)).\n- Прицел, установленный на лодку, показывает корпуса сквозь дым силуэтами. Без него дым скрывает охотников от захвата цели игрока и от HUD.\n- Посадка на мель не вредит.\n- У брони в верфи есть собственное место, как у мотора, и она не занимает станцию: пояс клёпаных стальных плит, изогнутых по корпусу вдоль обоих бортов по ватерлинии; платится весом и монетами. Плита, принявшая свои попадания, падает в море, и лодка становится легче и быстрее.\n- Лодка несёт снаряжение по размеру корпуса: малый корпус одну деталь, больший больше.\n- Охотник, затонувший на мелководье, лежит на дне до конца захода: обломки для захвата ([Места промысла](sites.md)).\n- У каждого корпуса свой бак, у каждого мотора свой расход; охотники топлива не жгут. Топливо встречается и припасом ([Припасы](pickups.md)). Пустой бак не кончает заход (2026-11-09): лодка игрока ползёт домой малым ходом, с добычей и без нитро.\n\n## Как устроено\n- **Проекты** (`Parts`, `Design`, `Designs`, `Build`): корпус, мотор, деталь или ничего на каждой палубной станции, снаряжение или ничего и броня или ничего, у каждого масса и цена в монетах. `Build.Of` ставит каждую деталь на корпус так, чтобы лодка плавала, как нарисована; проект, который затонул бы, отвергается (`Build.Fault`).\n- **Направление** (`Launcher.Facing`, `DeckPart.Fits`): пусковая установка смотрит в какую-то сторону: поперёк (стойки, трубы) или вперёд (носовые стойки). Деталь предлагается только на тех станциях, куда она подходит. Носовые стойки стреляют вперёд с обеих сторон форштевня, их потоки пересекаются впереди: Q — левая, E — правая. Рулетка показывает их как отдельный вид. `Boat.Covers` говорит, достаёт ли какая-нибудь установка до точки.\n- **Модели** (`Part.Model`, `PartModel`, `Figure.Piece`): деталь может быть нарисована по модели, сделанной в Blender по скрипту в `tools/`; `Layout` ставит её туда, куда идёт её станция или снаряжение, на основание твёрдого тела, по которому бьют снаряды, а ливрея её отделывает.\n- **Снаряжение** (`GearPart`, `Design.Gears`, `HullPart.GearPlaces`, `Layout.Gear`): его вид размещает, взвешивает и рисует его: управление огнём, таран, помпа, дымогенератор, плотницкий лес. У корпуса столько мест снаряжения, сколько в `GearPlaces`: от одного у малых до трёх у канонерки и броненосца, охотники и макет без своих мест. Деталь каждого вида на лодке одна; места не обязаны быть заняты. Каждая деталь занимает ближайшее место, свободное от мотора, деталей станций и деталей снаряжения, поставленных раньше, как это делает оснастка. Всё, что читает снаряжение лодки (дым, помпа, таран, плотники, управление огнём, цена и вес), читает все её детали (`Design.Has`). Старый проект и старая карта с одной деталью читаются как проект с ней на первом месте (`Progress.Saved.Gear`, `Design.Names`). Числа мест временные, решение без владельца ([Q8](../questions/boat.md#q8)).\n- **Броня** (`ArmourPart`, `Belt`): пояс клёпаных стальных плит, изогнутых вдоль обоих бортов по ватерлинии, со своим местом в верфи. Он добавляет долю к числу попаданий корпуса, каждая плита — равную долю их и стали пояса ([Q30](../questions/boat.md#q30)). Патрульный катер носит лёгкий пояс, канонерка и броненосец — тяжёлый.\n- **Тепловизор** (`DeckKind.Sight`, `Boat.Thermal`): палубная деталь, занимающая станцию, которую заняла бы пусковая установка. Лодка с ним видит сквозь дым (`Screens.Sees`), а лодка игрока с ним рисует каждый корпус, который скрывает дым, как глянцевый силуэт (`ui/Silhouettes.cs`, `silhouette.gdshader` на `glow_glass.gdshaderinc`). Зачем станция, а не снаряжение: места снаряжения считаны, а лодка с дымом ещё и несёт дым.\n- **Корпуса** (`HullForm`, `ShipClass`, `Stability`, `BoatModel`): одно параметрическое тело даёт объём, центры и метацентр, и корпус рисуется по нему как настоящий катер ([Q11](../questions/world.md#q11)).\n- **Под водой** (`BoatModel.Lie`, `common/surface_shading.gdshaderinc`): корпус затеняется под водой по высоте моря у миделя, как это читает его мореходность, так что лодка во впадине не рисуется мокрой.\n- **Управление** (`Manoeuvring`, `Handling`, `Afloat`): твёрдое тело, толкаемое в точках корпуса. Корпус цепляется против бокового хода, так что скользит на поворотах. С закрытым газом руль крутит лодку на месте вокруг центра тяжести, с той долей поворота, что у мотора на месте (`TurnAtRest`); привод перехватывает поворот, когда лодка набирает ход. Максимальная скорость растёт как корень из мощности, делённой на вес, так что каждая тонна стоит скорости, как в вышедших играх с весом сборки. Ничто её не ограничивает ([Q20](../questions/boat.md#q20)).\n- **Нитро и брызги** (`Nitro`, `RoosterTail`, `Spray`, `BowSheets`): нажатие тратит половину шкалы на рывок: лодка разом получает скорость вперёд (`Nitro.Kick`), и полсекунды мотор тянет с умноженной мощностью; удержанная клавиша второй раз не рвёт. Пока рывок горит (`Nitro.Lit`), ракеты и снаряды проходят сквозь лодку (`Projectile.Meets`), у охотников тоже: решение без владельца, [Q146](../questions/boat.md#q146). Привод в рывке бросает петушиный хвост ([Q9](../questions/boat.md#q9)). Зачем брызги: это то, что лодка на полной мощности бросает, как в аркадных гонках на катерах. Брошенная вода летит комьями и всплесками и пенит море там, где падает. `BowSheets` бьют струями из каждого сечения корпуса в зависимости от того, как быстро его днище погружается.\n- **Мореходность** (`Seakeeping`, `WakeUnder`): теория полос: вертикальная, килевая и бортовая качка от давления воды на сечения, срезанные вдоль корпуса, со слемингом и глиссирующим подъёмом. Вода — это волны плюс следы каждого корпуса, так что корпус едет на своей носовой волне и перепрыгивает следы. Перевёрнутая лодка выпрямляется, если крен превышает метацентрическую высоту при нём, как аркады переворачивают машину обратно; вне воды её дифферент выравнивается, как в аркадных гонках, так что прыжок никогда не кончается на спине. Демпфирование берётся неявно, чтобы оно не могло сбросить корпус с моря. Зачем фиксированный такт и сдвиг корпусов: чтение моря — большая часть цены корпуса; всё остальное, что плавает на этой воде, берёт свои отсчёты, переносимые между тактами (см. [Охотники и ИИ](hunters.md)).\n- **Видимые и невидимые** (`Boat.Seen`, `camera/Sight.cs`): невидимая лодка не бросает брызг, но всё равно едет на каждом такте, так как корпус, читаемый реже, подпрыгивал бы при появлении в кадре. Зачем: брызги — самая большая статья расходов лодки, а игры отсекают то, что вне экрана.\n- **Осадка и контакт** (`ShipClass.Settling`, `Afloat`, `Contact`): корпус, не выдержавший, тонет и переворачивается, а на мелководье лежит на грунте до конца захода. Корпуса встречаются тестом разделяющих осей по своим ватерлиниям (`Touch`). `Contact.Ground` делает грунт таким же твёрдым, как другой корпус; посадка на мель не вредит.\n- **Топливо** (`ships/Fuel.cs`, `Design.Range`): у каждого корпуса свой бак в литрах (`HullPart.Tank`), у каждого мотора свой расход в литрах на километр (`EnginePart.Burn`); дальность полного бака — их отношение. Бак опустошается по тому, как мотор ведёт лодку, так что лодка, идущая накатом или стоящая, не жжёт ничего; насухо лодка игрока идёт на доле газа, а нитро закрыто (`Player.Limp`); доля — решение без владельца, [Q137](../questions/boat.md#q137). Охотники не жгут ничего. Когда топливо уходит в запас (`Fuel.Reserve`), HUD предупреждает: «Мало топлива», «Идите в гавань». Числа бака и расхода — временные, решение без владельца ([Q8](../questions/boat.md#q8)); стартовый ялик с подвесным мотором идёт 6 км, как шёл при едином баке. Верфь показывает дальность строкой «Запас хода» на экране статистики, бак и расход — в строке детали.\n\nОблик лодок (ливреи и оснастка) описан в [Облик лодок](../art/boats.md).\n"}, {"id": "gameplay-builds", "path": "gameplay/builds.md", "title": "Сборки и стили игры", "section": "gameplay", "date": "2026-11-13", "md": "# Сборки и стили игры\n\nСборки — это разные способы играть, которые игрок собирает из деталей в верфи.\n\n## Решения владельца\n- Сборки играются по-настоящему по-разному, каждая из деталей, купленных в верфи:\n  - Бортовой залп: борт, выведенный на цель на параллельном курсе.\n  - Преследователь: две короткие ракетные рейки у форштевня, стреляющие вперёд, наводимые поворотом на врага.\n  - Турельщик: круглые двуствольные турели, которые поворачиваются и стреляют сами по ближайшему врагу, пока игрок только ведёт.\n  - Носитель дронов: маленькие безэкипажные морские дроны, бегущие по воде, кружащие вокруг врага и стреляющие ракетами; Q и E посылают и отзывают их. Дрон не стреляет, пока его носитель лежит на линии огня.\n  - Минёр: чёрные шаровые мины со светом цвета стороны сверху, сбрасываемые за корму, взводящиеся через мгновение и взрывающиеся под любым другим корпусом.\n- Ни одна сборка не является простым медленным танком: одно только принятие ударов — не способ играть.\n- Никакой подлодки, ни как корпуса, ни как способа играть: под синим морем её не видно с камеры, а над банкой в 5 м она не может нырнуть. Нырок на две-три секунды, как снаряжение, может появиться позже.\n\n## Как устроено\nДроны — маленькие лодки на собственном корпусе (`Drone`), стороны своего носителя, под капитаном с ролью `Wingman`. Люлька держит двух, по одному на борт. Когда дроны есть в рулетке, Q посылает левого на цель захвата, а E правого; повторное нажатие отзывает его. Потерянный дрон отстраивается на борту, а принятый на борт чинится. Крыло (`Wing`) хранит упоры, выводит дрон в море у кормовой четверти носителя, шагает капитанами на хосте, стреляет их залпами и принимает их на борт.\n\n- **Люлька**: каждый упор готов, вышел, чинится или отстраивается, как говорит `Wing.State`; лампы рулетки показывают это, а `Cradles` рисует неподвижный дрон в каждом упоре, где он есть. Твёрдое тело люльки — место обоих дронов; она предлагается только там, где они целиком лежат в кокпите, вдали от мотора и других деталей (`Layout.Fits`, который делят верфь и каталог). `Wing.Toggle` — нажатие клавиши: готовый дрон посылается на цель захвата или на ближайшего врага впереди траверза, иначе он охраняет; вышедший отзывается. Гость видит, сколько дронов вышло, но не из какого упора.\n- Вышедший без цели дрон кружит вокруг носителя вдали от его корпуса и берёт ближайшего враждебного, подошедшего близко.\n- Посланный на цель (`Wing.Send`), он влетает и стреляет по траверзу, как лодка роя, проходит дальше и заходит снова. Пока стойки заряжаются, он держит своё место: оно лежит по дальнюю от носителя сторону цели и качается по этой половине (`Wingman.Slot`), так что носитель не стоит на его линии (решение без владельца, [Q138](../questions/combat.md#q138)).\n- Цель, которая держится дальше, чем дрон может уйти от носителя, он не бросает: выходит к краю своей досягаемости и идёт поперёк линии на цель заряженным бортом к ней, пока не выстрелит. Со своего места он тоже стреляет, когда борт смотрит на цель (решение без владельца, [Q188](../questions/combat.md#q188)).\n- **Ход с носителем** (`Wingman.Handle`): всё, что дрон делает, он делает поверх хода носителя. Его ход от носителя наружу тает, не доходя до поводка, и считается от места, где дрон окажется, пока развернётся; так поводок не рвётся. Против хода носителя дрон не идёт: он сбрасывает ход и даёт носителю уйти вперёд, а возвращается, набирая ход, без разворота. Когда нужный курс далеко от носа, он закрывает газ и крутится на месте рулём, потом даёт ход; лишний ход гасит задним. Зачем: дрон поворачивает тягой, на малом газу он шёл широкой дугой, и носитель уходил.\n- Отозванный (`Wing.Recall`) или при последнем попадании он идёт к кормовой четверти носителя. Близко к любому борту, на любом ходу, крыло берёт его в руки: он подводится вплотную к своему упору по кривой в системе носителя, кинематически и вне контакта (`Drone.Passes`), затем поднимается на борт, как шлюпбалкой (`Cradles`). Зачем: игры стыкуют истребители так; дрон, поворачиваемый тягой, не наведётся на причал.\n- Потопленный носитель затапливает свои дроны. Дрон не берёт припасов.\n- Это лодки, поэтому гость отражает их, как любую лодку; они никогда не считаются лодками игроков.\n\n`Senses.Assign` отдаёт капитану цель снаружи, так что цель дрона выбирает крыло, а не его собственные чувства. Дрон не держит расстояния от носителя (`Senses.Escort`).\n\n## Как выбирали сборки\n- В ноябре 2026 владелец попросил не менее пяти по-настоящему разных способов играть, собираемых в верфи, и никакого медленного танка. Затравкой были автоматические турели, дроны, огонь с носа и носитель дронов; владелец спросил о подлодке и минёре.\n- Исследование вышедших игр дало каждому способу свой основной глагол: бортовой залп выводит борт на цель на параллельном курсе; преследователь направляет нос и целит поворотом; турельщик только ведёт, пока стреляют его турели; носитель дронов посылает и отзывает крыло; минёра преследуют, и он ведёт преследователей над своими минами. Шестой, загонщик, держался на крюке и ушёл вместе с крюком 2026-11-09.\n\nОружие описано в [Бой](combat.md).\n"}, {"id": "gameplay-camera", "path": "gameplay/camera.md", "title": "Камера и картинка", "section": "gameplay", "date": "2026-11-15", "md": "# Камера и картинка\n\nВид на бой: фиксированная изометрия, зум и разрешение, в котором рисуется мир.\n\n## Решения владельца\n- Статичный 2.5D изометрический вид: фиксированный азимут и наклон, чуть круче изометрического, как мир показан на картинах меню.\n- Игрок приближает и отдаляет, только зум: камера остаётся на месте. Бой начинается отдалённым, примерно в пятнадцать корпусов лодки поперёк кадра.\n- Вид следует за лодкой. В кругах арены, которые размечает карта, он вместо этого стоит неподвижно над кругом, а при входе играется короткая вставка по кадрам, заданным в редакторе карт.\n- Круг карты, над которым стоит вид, зовётся кругом арены (2026-11-15): Ареной перестал зваться только уровень.\n- 2026-11-14: игра идёт на 90–100 кадров в секунду во весь экран; по умолчанию стоит лучший из апскейлеров, что есть в Настройках.\n- 2026-11-14: наклон камеры можно сделать положе, чтобы склоны волн и свет в гребнях читались лучше. Этим снято «чуть круче изометрического» ([план воды](../reports/2026-11-14-water-overhaul.md)).\n\n## Как устроено\n- **Вид** (`camera/IsometricCamera.cs`): изометрический наклон (решение без владельца, [Q251](../questions/world.md#q251)), издалека, через узкое поле зрения, глядя немного левее солнца, чтобы блики лежали вдали от HUD. Земля, вставшая между камерой и лодкой, за которой она следует, растворяется дизерингом вокруг лодки (`camera/seethrough.gdshaderinc`), как изометрические игры вырезают то, что закрывает игрока; тени сохраняют свою форму. Над местом, которое вид держит для верфи, он вместо земли растворяет то, что пирс поднимает над настилом перед лодкой (`common/surface_cut.gdshader`, `camera/Cutaway.cs`): режется либо земля, выше двух метров, либо построенное, никогда оба; у пришвартованной лодки пирс стоит целым.\n- **Круг арены** (`areas/Area.cs` `Arena`, `areas/Arenas.cs`): круг карты. Пока лодка игрока в нём (с запасом 8 м на выход, чтобы лодка на кромке не дёргала вид), вид перестаёт следовать за лодкой и стоит над серединой круга; зум игрока работает и в круге арены, но не ближе, чем нужно, чтобы круг поместился в кадр с запасом (`IsometricCamera.Hold`); круг шире примерно 170 м не помещается и в самом широком поле. Выйдя, вид возвращается к лодке тем же плавным шагом, каким следует. Меняется только вид игрока: в бою, в сети и на море ничего, и круг ничего не рисует. Почему так: вид, привязанный к лодке, не показывает место боя целиком, а в круге арены важно видеть всё.\n- **У причала**: пока лодка пришвартована в гавани, вид так же стоит над её местом, но приближается, чтобы в кадре были лодка и причал, и не слушает зум игрока (`IsometricCamera.Hold` с `near`); отчалив, он плавно возвращается к виду боя ([Гавань](../base/pier.md)).\n- **Вставки** (`camera/Shot.cs`, `camera/ShotCamera.cs`, `Game.Cut`): карта несёт вставки (`Mission.Cutscenes`), каждая из нескольких кадров; в мире одна, у поста броненосца. Кадр — точка, на которую смотрит камера, сколько секунд она на ней, куда сползает, если движется (`To`), высота кадра в метрах воды, наклон и поворот относительно вида боя; между кадрами жёсткая склейка, как в игровых вставках на движке. Вставка играется под чёрными полосами (`ui/Letterbox.cs`), без слов; Space, Enter, Esc или щелчок её пропускают; HUD уходит на её время. Бой идёт дальше: вставка двигает только камеру игрока и в сети никого не останавливает. Руль держит последнюю команду (ход, поворот и нитро; огонь и трюм не держатся), пока игрок не взял руль обратно.\n- **Когда играется вставка**: круг арены называет её (`Arena.Scene`), и она играется на машине игрока, когда его лодка впервые входит в этот круг (решение без владельца, [Q118](../questions/interface.md#q118)). Руль и бой во время неё — тоже решение без владельца ([Q119](../questions/interface.md#q119)).\n- **Разрешение**: на экране Retina мир рисуется в точках и растягивается поверх кадров (`Settings.Fit`), либо в доле от этого, которую задаёт игрок, апскейлером MetalFX Temporal на macOS и FSR 2 в остальных случаях, либо пространственным апскейлером по выбору игрока (MetalFX Spatial, FSR 1) под TAA. Зачем: полное разрешение не держит частоту кадров, а временной апскейлер выравнивает детали тоньше пикселя, такие как блики; пространственный дешевле. По умолчанию — Temporal, а мир рисуется на две ступени ниже точек экрана (80 %): Temporal лучший по картинке за свою цену, а две ступени ниже стоят чуть более мягких бликов на воде и экономят около 2,8 мс кадра (решение без владельца, [Q249](../questions/gaps.md#q249); [замер](../reports/2026-11-14-performance.md)).\n- **На верфи**: тот же вид боя стоит над лодкой верфи, ближе, чем у причала, и держит её в свободной части экрана, которую оставляет экран верфи (`IsometricCamera.Hold` с долей кадра). Своего вида у верфи нет. Подробнее в [верфи](../base/boatyard.md).\n"}, {"id": "gameplay-combat", "path": "gameplay/combat.md", "title": "Бой", "section": "gameplay", "date": "2026-11-14", "md": "# Бой\n\n![Ракеты бьют в охотника](../img/combat.jpg)\n\nОружие лодки, захват цели, попадания, дым и таран.\n\n## Решения владельца\n- Мышью не целятся (2026-11-10): ракеты и торпеды идут в захваченную цель внутри веера своего борта, а если её в веере нет, в ближайшего видимого охотника в нём (2026-11-11). У каждого борта и у носовых стоек свой широкий веер на воде, и чтобы навести веер на цель, лодку поворачивают. Q и E стреляют каждая своим бортом, щелчок — бортом, который достаёт цель. Откуда стреляет оружие, приходит с деталью, купленной в верфи: стойки над каждым бортом (Q — левый, E — правый), носовые стойки, стреляющие вперёд, мины, сбрасываемые за корму, и турели, целящиеся сами.\n- Основное оружие — турель: она стоит на стартовой лодке и стреляет сама. Ракеты — дополнение, их стойки покупают в верфи.\n- Ракеты выпускаются с рельсовых стоек рябью залпов. Они летят прямо и быстро в захваченную цель; сама выбирает цель только турель. Ракеты скользят над волнами на постоянной высоте, так что крен или волна никогда не портят выстрел.\n- Ракетные стойки растут в уровнях: первая стреляет двумя ракетами на борт, и ракеты залпа уходят одна за другой с небольшой задержкой (2026-11-10).\n- У турели свой снаряд, заметно медленнее ракеты, и выглядит он иначе: светящийся трассер без дыма (2026-11-10).\n- Захвачен один враг за раз. Клавиши смены захвата нет; когда захваченный враг тонет, захват переходит сам. Борт, чьи ракеты, выпущенные сейчас, попали бы в цель, зажигает свою клавишу, Q или E, у борта лодки и у цели: ярко, когда борт заряжен, и тускло, пока он перезаряжается. Клавиша торпеды ждёт попадания в районе середины корпуса.\n- Торпеды — второе бортовое оружие: медленные, идущие под волнами, топящие лодку за одно-два попадания. Их трубы лежат в корпусе под водой: на палубе ничего не видно, а торпеда выходит под поверхностью.\n- C переключает оружие, которым стреляют Q и E, по видам пусковых установок на борту; дым держит свою клавишу, F. HUD показывает выбор маленькой рулеткой ромбовидных значков в глянцевом аква-стекле приборов.\n- Ракету парируют ракетой (2026-11-10): ракеты двух сторон, встретившись в воздухе, взрывают друг друга.\n- У ракет и снарядов есть предельная дальность (2026-11-11): дальше неё ничего не летит.\n- Попадание есть попадание: где ракета ударила в корпус, не меняет того, что она делает.\n- Таран вредит обеим лодкам, но лодка с тараном не страдает от собственного тарана. Таран защищает только нос своей лодки: удар в нос приходится на таран, удар в борт или корму вредит лодке как любой. Ни один удар не топит целую лодку разом.\n- Удар носом на нитро — приём любой лодки: она получает меньше, а бьёт сильнее. Таран делает его ещё сильнее.\n- Ракеты охотников горят красным, а игрока — оранжевым, так что перекрёстный огонь читается с первого взгляда. Они летят медленнее ракет игрока, так что от них можно увернуться.\n- Охотники стреляют независимо от того, стоит ли на пути остров.\n- Плотники латают за каждую лодку, которую потопила их лодка, четверть того, что та выдерживала; их несёт охотник-гонщик.\n- Дымовая завеса медленно дрейфует с ветром, оставаясь около того места, где поставлена. Её перезарядка — шкала в кластере приборов.\n- 2026-11-13: эффекты боя нужно улучшить радикально; сначала исследовать, как это делают на GitHub и в других играх, потом применить лучшее из исследования целиком, ничего не оставляя на потом.\n\nКакие стили игры строятся из этого оружия, описано в [Сборки и стили игры](builds.md); числа оружия — в [Балансе оружия](../balance/weapons.md).\n\n## Как устроено\nКаждая лодка стреляет из пусковых установок (`ships/Racks.cs`): ракеты из рельсовых стоек, торпеды из труб в корпусе под водой, мины из жёлобов за кормой; ракеты и торпеды игрока в пределах веера борта берут упреждение по захваченной цели, а установка, чей веер её не держит, по ближайшему видимому охотнику в своём веере (`Boat.Aimed`); турель целится сама. Q или E стреляет заряженными установками выбранного вида на борту, щелчок — бортом, который достаёт захваченную цель; C поворачивает рулетку к следующему виду. Охотник стреляет тем видом, который попал бы, сначала ракетами (`Captain.Aim`). `Gunnery` летит и ведёт выстрелы, наносит их удары и сообщает, что они делают, через свои события (`Shots.cs`); эффекты, звук, вид и HUD слушают. Охотники перезаряжаются медленнее игрока, по своей команде. Суша, стоящая между охотником и лодкой, прячет её от него, как дым (`Lookout.Sees`), так что сквозь остров он не стреляет; это спорит с решением «охотники стреляют независимо от острова» ([Q78](../questions/world.md#q78)).\n\n- **Полёт** (`Rockets`, `Projectile`, `Shot`): ракета скользит над водой на фиксированной высоте, так что волны и крен лодки никогда не портят выстрел. Зачем: прямой выстрел поверх планширя прошёл бы над низким корпусом. Долгий кадр она пролетает шагами не длиннее 1/50 секунды, так что путь над зыбью и всплеск о гребень одинаковы при любой частоте кадров. Ракета любой стороны, кроме игроков, летит медленнее (`Rockets.Motor`); насколько — решение без владельца, [решено 11-12](../decisions.md).\n- **Предел** (`Projectile`, `Rockets.Reach`, `Gunnery.Fizzled`): пролетев по своей линии досягаемость (у ракеты `Boat.Reach`, край веера на воде; у снаряда турели `Turrets.Reach`), заряд гаснет в воздухе маленькой вспышкой с искрами и тихим хлопком и исчезает, никого не задев. Так у гостя то же: его копии зарядов летят по тому же коду. Вспышка без урона — решение без владельца, [Q157](../questions/combat.md#q157). Торпеда, пройдя `Torpedoes.Run`, теряет ход и тонет, никого не задев.\n- **Парирование** (`Projectile.Meets`, `Rockets.Parry`, `Gunnery.Parried`): ракета или снаряд, подошедшие вплотную к летящему заряду другой стороны, взрываются вместе с ним. Снаряд турели парирует наравне с ракетой: решение без владельца, [Q145](../questions/combat.md#q145).\n- **Турели** (`Turrets`, `Rockets.Lead`): турель сама целится и стреляет по ближайшей враждебной лодке, которую видит в зоне досягаемости, беря упреждение, как батарея. Дым её ослепляет (`Screens.Sees`). Хост целит каждую турель; её снаряды доходят до каждого гостя, в том числе до её владельца, а гость поворачивает головки для вида. Она стоит на диаметральной плоскости, рисуется по модели (`tools/turret.py`) и не входит в рулетку: руль только ведёт.\n- **Минные жёлоба** (`Floaters`, `Floater`, `tools/minerail.py`): жёлоб вдоль планширя каждой кормовой четверти, наклонённый наружу, скатывает мину за корму через свою заслонку: Q — из левого, E — из правого. В каждом жёлобе нарисованы две мины; обе исчезают при сбросе и возвращаются по перезарядке. Один жёлоб на лодку, и он лежит в стороне от головы подвесного мотора и пилонов вентилятора (`Layout.Fits`), а твёрдое тело держит мины и их рожки. Мина успокаивается за мгновения, взводится через короткое время (загорается её огонёк) и взрывается, когда её касается корпус другой стороны, когда в неё стреляют или от другого взрыва, давая цепь, как мины карты (`Mines.Fuse`). Для своей стороны она не взрывается никогда. Лодка держит на плаву несколько мин, следующая топит самую старую невзорвавшуюся, и каждая со временем тонет сама. Щупальца охотников обходят их, как мины карты (`Obstacles`), а охотник берёт минный жёлоб, чтобы доставать на некоторое расстояние за кормой (`Captain.Reach`); `Boat.Covers` его не учитывает, так что таранщики всё равно гонятся за минёром. Мина — это снаряд: она доходит до гостей в `Fired`, как ракеты, а поплавок гостя только плавает и исчезает, когда до него доходит `Say.Blast` хоста ([Q88](../questions/combat.md#q88)).\n- **Торпеды** (`Torpedoes`, `Torpedo`, `ships/RoundModel.cs`): выйдя из трубы под водой, с побелевшим от кипения портом, торпеда идёт прямо на заданной глубине, пока ход не израсходован; где вода мелеет, она взрывается о грунт. Рядом с ракетой она медленная, и от неё можно уклониться. Её пузыри ложатся пенным следом (`Effects.Run`, `Wakes.Splash`). Зачем след: с высоты боя торпеда слишком тонка, чтобы её увидеть. Торпеды — самый тяжёлый удар и самая дальняя дальность, ракеты — лёгкие, верные и быстрые.\n- **Уровни ракет** (`Parts.Rockets`): стойки бывают четырёх уровней, каждая тяжелее, медленнее перезаряжается и дороже. Стартовая лодка несёт только турель (`Designs.Starter`), а стойки игрок покупает в верфи, как любую деталь. Зачем детали: более тяжёлая стойка стоит скорости, так что низший уровень остаётся выбором для лёгкой лодки.\n- **Таран** (`Ramming`, `Contact.Part`): корпуса двух сторон, сильно сталкиваясь, получают один импульс, так что большой корпус отмахивается от удара, топящего ялик. Лодки одной стороны толкаются без вреда. Удар по передней части тарана не вредит тарану; в других местах вредит, как любому. Лодка, бьющая носовой четвертью с горящим нитро, получает меньше и бьёт сильнее (`Ramming.Charging`); числа — решение без владельца, [Q136](../questions/combat.md#q136). Целая лодка сохраняет последнее попадание: удар не отнимает у неё больше, чем всё, кроме одного (`Ramming.Take`), решение без владельца, [решено 11-12](../decisions.md). `Ramming.Rammed` бросает брызги, щепки и искры, играет сигнал, трясёт вид и отмечает охотника, как попадание ракеты. Зачем по импульсу: вес и ход решают удар, как вес важен здесь везде.\n- **Помпа** (`Pump`, `Boat.Mend`): корпус с помпой, не получавший ударов некоторое время, время от времени чинит попадание, а вода бьёт через оба борта брызгами. Зачем оба борта: одна струя спряталась бы за корпусом.\n- **Плотники** (`Carpenters`): за каждую лодку, которую их лодка топит снарядом или тараном, плотники латают в её корпус часть попаданий, которые та выдерживала. Зачем при потоплении: это окупает напор в бою.\n- **Дым** (`ships/Smoke.cs`, `Screens`): F ставит завесу за кормой из канистр дымогенератора, затем он перезаряжается. Завеса — это клубы дыма боя (`Medium.Smoke`), которые жмутся к воде, вздымаются, дрейфуют и редеют. Она прячет лодки от любой лодки без тепловизора, и охотников, и захват цели игрока вместе с HUD (`Screens.Sees`): это оптическая толщина вдоль линии взгляда сквозь клубы в том виде, как они нарисованы (`Swarm.Through`), так что ослепляет то, что видно. Захват, оставленный на скрытом охотнике, держится, но не показывается. Завеса дрейфует на доле ветра, поскольку игры держат дым примерно там, где его поставили ([Q22](../questions/combat.md#q22)).\n- **Попадания** (`Boat.Touches`, `Boat.TouchesUnder`, `Boat.Strike`): ракета взрывается, когда её взрыв достаёт до того, что стоит выше ватерлинии; борта побитой лодки, осевшей от набранной воды, считаются такими же высокими, какими стояли у целой (`Afloat.Settled`), иначе ракета, идущая на своей высоте над морем, проходила бы над палубой лодки на последнем попадании; торпеда — когда достаёт до корпуса под ней, и подбрасывает корпус, не оставляя копоти. Лодка тонет, когда получает столько попаданий, сколько выдерживают её корпус и броня. Броня из припасов принимает удар первой (`Boat.Armour`), затем ближайшая на её борту плита пояса; плита, принявшая всё, что выдерживала, падает в море (`Boat.Shed`), и лодка перестраивается на плиту легче (`Build.Shed`), а её попадания по-прежнему считаются против того, что она выдерживала при постройке; ничто её не чинит ([Q30](../questions/boat.md#q30)). Снаряды проходят сквозь лодки своей стороны.\n- **Наводка** (`Controls.Sight`, `Command.Sight`, `Boat.Aimed`, `Boat.Fans`): мышь не целится — только правый стик геймпада даёт точку прицела на воде на дальности огня от лодки. Установка поворачивает выстрел к цели в пределах своего веера (`Boat.Fan`), дальше не поворачивает. Захват (`Player.Lock`) берёт врага на линии правого стика; иначе держится, пока его охотник на плаву, а потом переходит на цель задания, если её видно, или на ближайшего видимого охотника, на любом расстоянии. Внутри веера выстрел берёт упреждение по захваченной цели (`Burn.Lead`). Щелчок стреляет каждым бортом, чей веер держит цель, а вне вееров — бортом со стороны цели (`Order.Fire`, `Boat.Sights`). Капитаны охотников наводят так же: их выстрел берёт упреждение по добыче в пределах веера (`Captain`), иначе медленная ракета не догоняет идущую лодку. HUD рисует веера у лодки игрока ([HUD](../interface/hud.md)). Ширина веера, выбор захвата и упреждение — решение без владельца, [Q134](../questions/combat.md#q134).\n- **Прицел** (`Boat.Strikes`): попал бы борт, выстрелив сейчас, в лодку, держащую свой ход; по умолчанию считаются только заряженные установки, так что охотник стреляет по тому, что долетело бы, а клавиша HUD ещё и тускнеет на борту, который перезаряжается (`loaded: false`). Торпедный прицел должен держаться и будь лодка чуть быстрее или медленнее.\n- **Взрывы** (`Blasts`, `Strikable.cs`): мина, бочка или снаряд, взрываясь, бьют каждый корпус в зоне досягаемости, меньше с расстоянием, и подбрасывают его вверх и в стороны; это показано, слышно и ощущается как взрыв ракеты. Снаряды взрываются о вещи карты как о корпуса (`IStrikable`, `Gunnery.Add`).\n- **Вид** (`Glow`, `Medium`, `Effects`, `Rings`, `ShotFeel`): одна модель огня, лампы которой освещают корпуса, дым и волны, и одна для дыма, тумана, пыли и брызг; `Effects` сочетает их для каждого события. Ракета горит цветом своей стороны (`Rockets.Tracer`), как трассеры красят по сторонам.\n- **Взрыв по слоям** (`Heft`, `Shots.Of`, `Effects.Blaze`): у взрыва четыре веса — снаряд турели, ракета, заряд (торпеда, мина, снаряд батареи, бочка) и гибель лодки. Каждый вес добавляет слой, а не растягивает один и тот же взрыв. Слои: белое сердце на десятую секунды (`Flashes`); огненный шар, который держит насыщенный оранжевый, остывает в красный и скатывается в тёмный дым (`fire.gdshader`, `Medium.Fire`: один клуб сначала светит, потом закрывает то, что за ним, смешение с предумноженной альфой); несколько длинных искр; копоть (`Medium.Soot`); над водой — пятно тёплого света и тонкое кольцо, разбегающееся по воде (`Rings`, `ring.gdshader`); у заряда и гибели ещё вспышка под водой, столб воды и кольцо пены ([Море](../world/sea.md)). Почему так: с высоты боя взрыв по настоящему размеру заряда — точка, а всё яркое сливалось в одно белое. Размер и время огня — решение без владельца, [Q210](../questions/combat.md#q210); тёмный дым и сколько он висит — [Q211](../questions/combat.md#q211). Гибель лодки показывается по `Boat.GaveWay`, поэтому гость в кооперативе видит её как хост. Свечения (bloom), текстур и флипбуков у эффектов нет: решение без владельца, [Q213](../questions/combat.md#q213). Стенд — демо `Effects` ([Демо](../tools/demos.md)).\n- **Ответ корпуса** (`Effects.Hull.cs`, `Boat.Flash`, `BoatModel.Flash`): в миг удара вся лодка вспыхивает белым на десятую долю секунды, тем ярче, чем тяжелее удар (`Boat.Beaten`); починка от половины удара и больше — заплата, ремкомплект, припас — заливает её зелёным светом `Better` (`Boat.Mended`); струйка помпы не светится. Это одно значение на лодку в шейдере твёрдых поверхностей, лишней отрисовки нет. Гость видит вспышку по корпусу, который сообщает хост. Своя лодка игрока вспыхивает так же: решение без владельца, [Q214](../questions/combat.md#q214).\n- **Тряска** (`ShotFeel`, `IsometricCamera.Jolt`): снаряд турели вид не трясёт — его попадание видно по вспышке корпуса; силу тряски задаёт шкала в настройках ([Экраны и меню](../interface/screens.md)). Решение без владельца, [Q215](../questions/combat.md#q215).\n- **Стадии повреждений** (`Effects.Hull.cs`, `Stages`): побитая лодка показывает, насколько она побита, из одного места на палубе, пока оно над водой: на четверти — столб светлого дыма, на половине — чёрный дым и искры, на трёх четвертях — огонь. Каждая стадия уходит, когда лодку чинят. Пороги — решение без владельца, [Q216](../questions/combat.md#q216).\n- **Гибель** (`Effects.Sinking.cs`): после взрыва, в котором корпус не выдержал (`Boat.GaveWay`), по нему идут взрывы поменьше, всё реже: огонь, пока эта часть над водой, пузыри, когда она под водой; у ватерлинии кипит пена; где лодка ушла под воду (`Boat.WentUnder`), вода вскипает и расходится последнее кольцо пены. Своя лодка игрока на этой машине тонет дольше: восемь взрывов за четыре с половиной секунды и долгое кипение (`Effects.Own`). Девять секунд, за которые корпус уходит на дно, остались. Решение без владельца, [Q217](../questions/combat.md#q217). Сбитая плита брони падает плашмя и сразу тонет.\n- **Малые моменты** (`Effects.Moments.cs`), каждый от того события, по которому играет и его звук, так что гость видит их, как хост: парирование (`Gunnery.Parried`) — белое сердце, два кольца цвета каждой стороны, бегущие по воде, и пламя каждой ракеты, вылетающее дальше длинными искрами своего цвета; лодка в рывке (`Nitro.Lit`) светится цветом своей стороны, пульсируя, а ракета, прошедшая сквозь неё (`Gunnery.Dodged`), вспыхивает на корпусе и вылетает искрами с другой стороны; дрон, спущенный на воду или поднятый на борт (`Wing.Launched`, `Wing.Aboard`), — всплеск и кольцо цвета своей стороны, наружу или внутрь; лодка, севшая после прыжка (`Boat.CameDown`), — низкий веер брызг вокруг ватерлинии и немного пены, по тому, как быстро она падала, ничего — при мягкой посадке. Свечение рывка, кольца и веер посадки — решение без владельца, [Q219](../questions/combat.md#q219).\n- **Бюджет эффектов** (`Budget`, `Swarm.Thins`, `Swarm.Seen`): когда эффекты наслаиваются, первыми редеют дым, брызги и щепки: чем больше полупрозрачных клубов (дым, копоть, туман, пыль, брызги, дым ракет) живо против бюджета, тем реже рождается новый, а сверх бюджета — ни один. Сердце взрыва, его огонь, искры, кольца и всё, что предупреждает, не редеют никогда. Вне вида ничего не рождается: клубы дальше нескольких метров за краем кадра, огонь и искры — дальше пятнадцати. Так делают игры с огромными боями (насыщение частиц в движке Recoil); залп видом почти не меняется, а работы у кадра меньше. Размер бюджета — решение без владельца, [Q221](../questions/combat.md#q221). Стенд `Effects/Salvo` пишет в лог, сколько каждый пул не родил (`Thinned:`).\n- **Следы боя** (`Flashes`, `Trails`, `Burn`, `Debris`, `Scorch`): вспышка — белое сердце взрыва, которое растёт, угасая, и светит вокруг. У ракеты в полёте самое яркое — голова, вокруг неё тусклый ореол цвета стороны (`Projectile`); за ней тянется светящаяся лента (`trail.gdshader`) длиной в четверть секунды полёта, сужаясь, а дым редкий, тонкий и исчезает меньше чем за секунду: ракету читают по голове и ленте раньше, чем по дыму. Решение без владельца, [Q218](../questions/combat.md#q218). `Burn` — её скорость от пуска до полного хода. Удар выбивает из корпуса щепки: они плавают, пока не намокнут и не утонут, так что бой оставляет обломки на воде. На корпусе и земле остаётся подпалина с остывающими углями. Вспышка и лента держат по запасному экземпляру с начала, чтобы их шейдеры собирались за шторкой загрузки.\n"}, {"id": "gameplay-haul", "path": "gameplay/haul.md", "title": "Добыча", "section": "gameplay", "date": "2026-11-16", "md": "# Добыча\n\n![Ряд трюма над панелью расходников](../img/hold.jpg)\n\n![Экран торговца на «Марии»: трюм, товары и реплика мытаря](../img/trader.jpg)\n\n![Карта: стекло с линиями света](../img/map.jpg)\n\nДобыча — ящики, которые лодка собирает в море и продаёт за монеты. Здесь ящики, трюм, расходники, карта в море и продажа. Цены ящиков, места трюма и рецепты — в [Балансе экономики](../balance/economy.md).\n\n## Решения владельца\n- Кооперативная добыча: лодки выходят в море за добычей и довозят её до места продажи, пока охотники их не потопили.\n- Добыча продаётся за монеты сразу: в гавани у пирса (2026-11-09, 2026-11-10) и у плавучей станции в море (2026-11-11, [Станция](../world/outpost.md)). Буёв выхода нет (2026-11-10).\n- Продажа — экран торговца, как в играх о рыбалке и торговле с лодки (2026-11-13): слева торговец с короткой репликой, справа трюм ящиками с ценами. Ящик продаётся выбором, есть «Продать всё», монеты набегают в кошельке; непроданное остаётся на борту для расходников. В гавани торгует корабел, на «Марии» — мытарь, у каждого короткая реплика в стеклянной выноске, как в диалоге. Квитка и итога захода нет: хватает кошелька.\n- Непроданные ящики можно продать позже, не выходя снова в море: плиткой «Торговец» на ленте причала (2026-11-13, [Гавань](../base/pier.md)).\n- Потопленный охотник роняет свою добычу на воду, и лодка собирает её, проезжая по ней. Она плавает, пока её не соберут.\n- Ящики вместо сетки (2026-11-11): «Ящики вместо сетки. Экран трюма и сетка уходят. Добыча — несколько понятных видов ящиков в ряду слотов прямо на HUD. Расходники собираются клавишами 1–4. Полный трюм сам меняет дешёвое на дорогое. Всё теряется, если утонуть.»\n- Вес добычи замедляет лодку, но не наказывает за полный трюм.\n- Лодка, ушедшая под воду, высыпает трюм на воду, чтобы другие его собрали. Защищённого контейнера нет: теряется всё.\n- Карта (2026-11-13): «Прозрачная, линии светом». Это стекло, сквозь которое видно море; берег, глубины и метки нарисованы на нём линиями света, как на навигационном приборе. Бумаги в интерфейсе больше нет.\n- Расходники (2026-11-11) тратят в море клавишами 1–4, по панели быстрого доступа на HUD.\n\n## Как устроено\n- **Ящики** (`haul/Items.cs`): восемь видов, по одному на ресурс (`Resource`): металл, механизмы, электрика, топливо, взрывчатка, ткань, ценности, провизия. У вида одна цена, один вес, свой цвет и силуэт, видный с высоты боя: топливо — красная бочка, ткань — тюк, ценности — золотой сундук, остальные — ящики своего цвета с трафаретным знаком (гайка, шестерня, молния, взрыв; у провизии — перекрещённые планки). Каждый проект охотника несёт свои виды (`Items.Carried`); его обломок роняет их, пока их добыча не сойдётся к добыче проекта. Виды, цены и места трюма — решение без владельца, [Q162](../questions/haul.md#q162).\n- **На плаву** (`Flotsam`, `Pile`): ящики качаются на волнах, пока их не соберут. Лодка игрока подтягивает те, что в досягаемости, каждый к ближайшей лодке, чей трюм его возьмёт (`Flotsam.Room`, `Hold.Takes`); подойдя к борту, ящик перелетает дугой на палубу и только там ложится в трюм (`Flotsam.Hop`, [Q220](../questions/combat.md#q220)), а если места к тому мигу не осталось, падает в воду у борта. Вытесненный из трюма ящик остаётся другим, пока его лодка не отойдёт (`Flotsam.Throw`). Ящики задания «груз» и тайников карты ([Зоны и опасности](../world/areas.md)) плавают так же.\n- **Трюм** (`Hold`): ряд мест, у каждого корпуса своё число (`HullPart.Hold`), в месте одна вещь. Ящик ложится в первое свободное место. В полном трюме ящик дороже самого дешёвого на борту встаёт на его место, а дешёвый падает за корму (`Hold.Pushed`); обмена в убыток нет. Ящик, которому нет места, остаётся на плаву, и HUD один раз объявляет «Трюм полон». Руками ничего не выбросить, поэтому лодки не передают друг другу ящики (решение без владельца, [Q164](../questions/haul.md#q164)). Вес трюма замедляет только разгон лодки, полный ход остаётся (`Boat.Laden`; решение без владельца, [Q43](../questions/haul.md#q43)). Лодка, уходящая под воду, высыпает все места.\n- **Ряд трюма на HUD** (`HoldRow`, `CrateArt`): над панелью расходников, внизу слева. Каждое место — маленькое стекло: пустое едва видно, в занятом картинка ящика; в конце ряда монета и сколько монет стоит трюм. Новый ящик выскакивает в своё место, вытесненный или потраченный улетает ([HUD](../interface/hud.md)).\n- **Расходники** (`Kits`, `KitBar`; решение без владельца, [Q151](../questions/haul.md#q151), [Q163](../questions/haul.md#q163)): четыре вида, в трюме их нет. Клавиша 1–4 сразу тратит ящики рецепта, самые дешёвые каждого ресурса, и делает дело (`Order.Patch` … `Order.Charge`, `Hold.Spend`). Ремкомплект латает корпус, бронеплита ставит броню, баллон нитро заправляет нитро — как одноимённые припасы (`Pickups.Give`); заряд рвётся вокруг лодки и бьёт всех чужих рядом. Если ящиков нет или лодке это не нужно (корпус цел, броня полна, нитро полон), плитка вздрагивает, и ничего не тратится. На плитке два значка ящиков рецепта и сколько раз трюм может за неё заплатить.\n- **Добыча из вида сбоку** (`SideView.Landed`): пойманная рыба и поднятая с обломка вещь ложатся в трюм, как любой ящик ([Места промысла](sites.md)).\n- **Экран торговца** (`ui/Counter.cs`, `Game.Trade`, `Game.Sell`, `haul/Terms.cs`): сцена за ним чуть притемнена. Слева внизу стоит портрет торговца, и его реплика пишется буквами в стеклянной выноске его голосом, как в [диалоге](../story/dialogue.md): приветствие, затем короткий ответ на продажу, на проданный трюм, на «Продать всё» без ящиков и на нехватку монет. Справа «Ваш трюм» — стеклянные карточки ящиков в порядке мест трюма: картинка, название и цена этого торговца на ярлыке с монетой. Выбранная карточка наполняется светом лагуны, как карточка верфи ([Компоненты](../art/components.md)). `Enter` или щелчок продаёт ящик: он летит к торговцу, остальные сдвигаются, кошелёк вверху справа набегает. «Продать всё» продаёт оставшиеся по одному, быстро. «Готово» закрывает экран, и игра сохраняется. Клавиши — [Управление](../interface/controls.md). Всё стекло экрана лежит в одном слое, HUD спрятан.\n- **В гавани** (`Game.Moor`): по `Space` у причала лодка швартуется, корпус чинится и бак заправляется; плитка «Торговец» на ленте открывает экран корабела, а «Готово» возвращает к ленте ([Гавань](../base/pier.md)). Корабел платит полную цену ящика и ничего не продаёт: ремонт и заправка в гавани бесплатны.\n- **У станции** (`Game.Trade`): экран мытаря; «Мария» платит меньше и продаёт ремонт и топливо ([Станция](../world/outpost.md)).\n- **Пока экран открыт**, в одиночной игре море ждёт, в коопе идёт дальше, а лодка стоит без хода. Каждый игрок продаёт свой трюм на своей машине: трюм и монеты лежат у него, как раньше. Ремонт, купленный гостем, уходит хосту приказом, как расходник, и хост чинит корпус ([Кооператив](../online.md)). Потопленную лодку экран отпускает.\n- Непроданный ящик остаётся в трюме: плитка «Торговец» на ленте причала открывает тот же экран снова ([Гавань](../base/pier.md)). Клавиши экрана и реплики торговцев — решение без владельца, [Q176](../questions/haul.md#q176).\n- **Карта** (`MapView`, клавиша M): большое стекло HUD (`Lens`) посреди экрана. Оно смешивается со сценой и не читает экран, поэтому стоит поверх боя дёшево. Дым стекла — ровно такой, чтобы линии читались над светлой лагуной. Рельеф мира запекается один раз, и шейдер `map_plot.gdshader` рисует его светом (`MapPlot.Plotted`): суша — мягкая заливка под яркой белой линией берега, мели — слабая светлая заливка, изобаты 2, 5, 10 и 20 м — тонкие линии аква, чем глубже, тем бледнее, и сетка через 400 м. Поверх — несколько глубин цифрами и тонкая роза ветров. Гавань обведена оранжевым кольцом игрока с белым домиком, места заданий — золотыми кольцами цели. Штормы — облаком над своей областью с глянцевым значком и стрелкой хода ([Погода](../world/weather.md)). Поверх всего — лодки игроков: глянцевые стрелки по курсу (`Gloss.Pointer`, `MapView.Crews`), своя — в оранжевом игрока, товарищей — в акве союзников, каждая в мягком ореоле своего цвета, так что читается и над облаком шторма; лодка за краем карты держится у края, затонувшая с карты уходит. Так видно, идёт ли шторм на тебя (решение без владельца, [Q290](../questions/interface.md#q290)). Название и подписи — белые слова с тёмным ореолом (`Pill.Engrave`), название — капителями вверху стекла. Метки на воде гаснут под стеклом, пока карта открыта, а мир за ней уходит в мягкий фокус, как за меню паузы ([Экраны и меню](../interface/screens.md)): море, дождь и взрывы за стеклом не отвлекают, а приборы, трюм и расходники остаются резкими. Карта проявляется, чуть вырастая, и закрывается, тая. Цвета — `Aqua` и `White` палитры, размеры, дым и яркость линий — в теме, тип `Map` ([Компоненты](../art/components.md)). Видно в демо `Instruments` (кадр `map` над глубиной, у отмели и ночью), `Run/Offers` и `Storm/Map` (лодки и мягкий фокус под ливнем).\n- **Без продажи** трюм пропадает: при гибели (игра загружает последнее сохранение) и когда игрок уходит в море хоста или из него, о чём меню предупреждает.\n"}, {"id": "gameplay-hunters", "path": "gameplay/hunters.md", "title": "Охотники и ИИ", "section": "gameplay", "date": "2026-11-15", "md": "# Охотники и ИИ\n\n![Охотники заходят на лодку игрока](../img/hunters.jpg)\n\nОхотники — враги игрока в море. Здесь их виды и единый ИИ, управляющий каждой лодкой, кроме лодки игрока. Числа их лодок — в [Балансе лодок](../balance/boats.md), их огня — в [Балансе оружия](../balance/weapons.md).\n\n## Решения владельца\n- Охотники нескольких видов идут разом: таранщики, которые бросаются в атаку, рои маленьких, слабых и очень быстрых лодок и лодки, которые кладут игрока на траверз и стреляют. Дымовой рой маленьких юрких лодок ставит много дыма и видит сквозь него.\n- Директора нет (2026-11-11): охотники стоят на постах карты, и какие на каком — выбирают в редакторе ([Зоны и опасности](../world/areas.md)).\n- У охотника есть зрение: он гонится за лодкой игрока, только пока видит её, а когда она ушла из вида, забывает о ней.\n- Охотник дерётся до конца: ни один не выходит из боя и не идёт чиниться.\n- Охотники различаются мастерством, от зелёных команд до асов: как быстро отвечают, как аккуратно стреляют, как медленно перезаряжаются.\n- Броненосец, босс, имеет собственный корпус, больше любого, который может построить игрок, и дерётся этапами по мере того, как его броня сбивается.\n- Каждой лодкой, кроме лодки игрока, управляет один ИИ, планировщик действий по целям (GOAP), так что торговцы и караваны с охраной смогут присоединиться позже.\n- Много лодок разом остаются дешёвыми: ни одна не читает море каждый кадр.\n- Охотник стреляет, когда его выстрел попадёт, любым видом пусковой установки, который попал бы. За миг до выстрела его стойка на этом борту светится красным, и короткий звук выдаёт выстрел.\n- Рои идут на катерках: малом корпусе на два попадания, открытой спортивной лодке в 4–5 м с большим подвесным мотором.\n\n## Как устроено\nУ каждой лодки, кроме лодки игрока, есть `Captain`, планировщик действий по целям. Зачем GOAP: новый вид лодки приходит как данные, роль из целей и действий, без изменения планировщика.\n\n- **Факты** (`Facts.cs`): именованные булевы значения, упакованные в битовую маску. Факт с чувством читается на такте мысли; факт без него только порождается действиями и желается целями.\n- **Роли** (`Role.cs`): роль — это её цели и действия. Цель хочет фактов и говорит, насколько она важна сейчас. Действие стоит, требует фактов, приносит факты и, однажды начавшись, рулит лодкой каждый кадр и говорит, продолжается ли оно, закончено или провалено.\n- **Планировщик** (`Planner`): A* по фактам от того, что знает капитан, к тому, чего хочет его цель.\n- **Капитаны** (`Captain`): думает несколько раз в секунду, вразнобой между капитанами, преследует самую подходящую цель, для которой может составить план, и планирует заново, когда цель меняется, действие проваливается или потребности следующего действия перестают выполняться. Капитан стреляет установкой любого вида, ракетами первыми, когда его добыча лежит в её секторе, `Boat.Strikes` говорит, что попадёт, и ни одна лодка его стороны ближе добычи не лежит на линии (`Captain.Fouls`). Снаряды и так проходят сквозь свои лодки: это о том, как читается бой (решение без владельца, [Q139](../questions/combat.md#q139)). Выстрелу предшествует знак (`Captain.Fire`): `Boat.Telling` зажигает красным стойки того борта и вида (`Racks.Tell`, шар света `Glow.Halo`, как у мины) и играет короткий щелчок (`Cue.Tell`), и через мгновение капитан стреляет, если выстрел всё ещё попал бы. Хост шлёт знак в `Lie`, так что он виден на каждой машине. Знак дают только по лодке игроков: его читает игрок, а по чужой лодке капитан стреляет сразу (решение без владельца, [Q110](../questions/combat.md#q110)). Дроны стреляют без знака: они слишком быстры. Длина знака — решение без владельца, [Q110](../questions/combat.md#q110). Руль встречает размах носа.\n- **Команды** (`Crew`): зелёная, бывалая, ветеранская или ас ([Q29](../questions/combat.md#q29)). Более зелёная команда думает реже, стреляет по промахам и медленнее перезаряжается. Команду охотника поста выбирают в редакторе карт (`Post.Hunters`), охотников заданий — их код (`missions/`).\n- **Чувства** (`Senses`, `Lookout`, `Feelers`): наблюдатель — это то, что видит каждый капитан: лодки, грунт, дым, припасы на плаву, удары между корпусами и время боя (`World.Clock`). Добыча капитана — ближайший враг на плаву (кто кому враг, говорит `Sides.Fights`, [Жизнь моря](../world/life.md)), удерживаемая, пока другая не окажется намного ближе; он видит её в пределах своего зрения (`Captain.Sight`), если между ними нет суши, а дыма нет или у него тепловизор (`Lookout.Sees`), и помнит, где видел её в последний раз. Потеряв её из вида, он ищет её там ещё `Memory` секунд, затем забывает. Стража постов видит на `Senses.Seeing` (две дальности ракет); охотники заданий — своё зрение; налёты заданий и банд других карт видят на любом расстоянии, их скрывают только суша и дым (решение без владельца, [Q148](../questions/combat.md#q148)). Действия рулят и целятся только по увиденной добыче (`Captain.Quarry`), так что ослеплённый капитан держит огонь. Щупы прощупывают грунт по кругу, по обе стороны каждого курса на ширину корпуса с запасом, так что щель уже корпуса для них закрыта. Руль берёт свободный курс, ближайший к желаемому, и держит выбранную сторону, пока желаемый курс закрыт: обходя скалу, охотник не мечется между двумя сторонами. Новое чувство читается в `Senses` и показывается планам как факт.\n- **Рулёжка** (`Steering`): поведения, общие для действий: преследование с упреждением, укладка лодки на траверз на дистанции, прибытие в точку, бегство, обход по широкой дуге, следование по треку. Зачем трек: корпус скользит на повороте, так что рулёжка только по курсу идёт широко. Руль (`Captain.Steer`) отворачивает каждый курс от лодок близко впереди или на траверзе, но никогда от добычи, так что охотники держатся друг от друга подальше, а таранщик всё равно таранит. Капитан, который просит ход и несколько секунд не сдвигается с места (упёрся в скалу, в берег или в чужой корпус), ненадолго отходит задним ходом с переложенным рулём и заходит снова (`Captain.Unstick`): так выходят из затора ИИ в играх (решение без владельца, [Q186](../questions/combat.md#q186)).\n- **Стаи** (`Pack`): капитаны, делящие румбы вокруг лодки, расставленные равномерно.\n\nКапитан с домом (`Captain.Home`) крейсирует вокруг него и поворачивает назад, отойдя дальше `Strays`, так что забывший добычу страж возвращается к посту. Роли охотников (`ai/roles/`) все хотят потопить свою добычу (`Hunting`), крейсируют, пока её нет, и ищут там, где видели её в последний раз, когда она скрыта:\n\n- **Broadsider**: кладёт добычу на траверз на дистанции, готовым бортом к ней, и стреляет, когда борт попал бы; минёр (`Designs.Minelayer`) — тяжёлый патрульный с минным жёлобом: кладёт мины за кормой, когда добыча идёт следом (`Captain.Reach`).\n- **Rammer**: гонщик с тараном; преследователь (`Designs.Chaser`) идёт этой ролью на двух подвесных и с носовой стойкой и тараном. Он заходит туда, где не достаёт ни одна установка его добычи, бросается на нитро по упреждению, а после удара или промаха расходится и заходит снова.\n- **Swarm**: катерки на подвесном моторе; бегуны с турелью (`Designs.TurretRunner`) идут ею парами на воздушном винте. Они занимают места, по которым стая расставляется вокруг добычи, бросаются на нитро, стреляют проходя по траверзу и разворачиваются перезаряжаться. Зачем броски: пересекая траверз так быстро, они трудны для бортового залпа. Дымовой рой ставит завесы, бросаясь в атаку (`Designs.SmokeBoat`; [Q38](../questions/combat.md#q38)).\n- **Voyager** — рулевой рабочей лодки ([Жизнь моря](../world/life.md)): идёт своим маршрутом, а испуганный убегает.\n- **Trader** идёт по маршруту отметка за отметкой, замедляясь, пока отстаёт его эскорт; **Runner** бежит к цели полным газом.\n\nОхотник дерётся до конца: ни один не выходит из боя и не идёт чиниться, хотя берёт любой припас, на который наехал. Охотники жгут нитро ([Q9](../questions/boat.md#q9)); таранщики и рои идут за плавающим нитро, когда их собственное израсходовано (`Fetching`), замедляясь, чем дальше от их трека лежит припас. Зачем: скользящий корпус кружит около припаса рядом по траверзу, а не достаёт его. Цель, причина которой меняется по ходу плана, остаётся актуальной, пока её план не кончится (`Captain.Pursuing`).\n\nРоль `Looter` описана в [Соперниках](rivals.md). Дроны, которыми командует `Wingman`, — в [Сборки и стили игры](builds.md).\n"}, {"id": "gameplay-missions", "path": "gameplay/missions.md", "title": "Открытый мир", "section": "gameplay", "date": "2026-11-16", "md": "# Открытый мир\n\nОткрытый мир — единственный уровень игры: одна большая карта и бесконечный заход. Охотники стоят на постах, задания старых миссий случаются внутри, а гавань у пирса — на острове той же карты. Здесь заход, задания, броненосец и то, как заход начинается и кончается.\n\n## Решения владельца\n- Открытый мир: игра идёт в море. При запуске — главное меню поверх моря там, где игра сохранилась: «Продолжить», «Новая игра», «Настройки», «Выход»; игра продолжается с последнего сохранения (2026-11-14, [Прогресс и сохранения](progression.md); до того она сразу начиналась в море).\n- Открытый мир — состояние без задания, а не выживание (2026-11-14): часов «Продержались» в целях и «Вперёд» в начале захода нет.\n- Броненосец живёт в открытом мире, как мировой босс в WoW (2026-11-14): стоит на своей стоянке с начала, без часов, отсчёта и объявлений.\n- Имени «Арена» у уровня нет: это просто мир (2026-11-15).\n- Мир — одна большая карта и бесконечный заход, а события из каждого вида прежних миссий (конвой, курьер, маяки, груз, броненосец) случаются внутри.\n- Задания берут у флопп, как в старых GTA (2026-11-13): несколько флопп дают их по рации в местах на карте, задание идёт в живом море, а проваленное просто кончается, без перезагрузки.\n- Гавань — мастерская корабела на острове, к которой доплывают сами; экрана базы нет, это место открытого мира ([Гавань](../base/pier.md), 2026-11-13). Буёв выхода нет (2026-11-10).\n- Когда все лодки игроков потоплены, чёрные полосы закрываются с надписью «Погиб», и игра загружает последнее сохранение в открытый мир (2026-11-10).\n- Вступительной сцены нет (2026-11-11): заход сразу начинается в виде боя, руль сразу у игрока, HUD на месте, охотники живы.\n- Директора нет (2026-11-11): охотники стоят на постах карты ([Зоны и опасности](../world/areas.md)).\n- Старт — своё место в стороне от середины карты: лодка идёт вдоль берега, суша по левому борту.\n\n## Как устроено\n- **Мир** (`progress/Missions.cs`, `maps/world.json`, `Missions.World`): карта и её единственная «миссия» в одном файле. `Play` равен `\"run\"`, а `Setting.Base` равен `true`, так что `World` ставит пирс (`Dock`) у первого острова карты, `Home cay`. Карта описана в [Редакторе карт](../tools/map-editor.md).\n- **Старт** (`Game._Ready`, `Game.Embark` в `Game.SettingOut.cs`): игра загружает последнее сохранение и ставит лодку туда, где оно её оставило (`Game.Resumed`, [Прогресс и сохранения](progression.md)): у причала — пришвартованной, в море — в покое на том же месте. Без сохранения, в новой игре и в сохранении без места лодка выходит на старт — по курсу `Mission.Bearing` от морской стороны пирса, в `Mission.Offing` от середины мира, на глубокой воде, полным ходом, сушей по левому борту, на полном баке. Игра сохраняется. При запуске над морем, которое ждёт под ним, встаёт главное меню (`Game.Welcome`, [Экраны и меню](../interface/screens.md)); после него вид боя и руль игрока (`Game.Start`): HUD въезжает сам, рация играет сцену `radio-start`, а у причала — сцену швартовки. Без главного меню начинают загрузка из журнала, новая игра, перезагрузка после гибели, гость в коопе (`Game.Board`) и проба карты из редактора; гость и проба — всегда со старта.\n- **Заход** (`missions/Run.cs`, `Operation`): сам не выигрывается и не проигрывается; идёт, пока лодки плавают. Лодки в море выводит `Sortie`. Цели на HUD — только цели открытого задания; без задания список пуст. Часов у захода нет.\n- **Гавань и снова в море**: швартовка у причала (`Game.Moor`) и отход от него (`Game.CastOff`) идут в том же живом мире, лодка его не покидает ([Гавань](../base/pier.md)). Сцена меняется за шторкой загрузки (`Game.Sail`, `Game.TakeUp`) только при загрузке сохранения, в новой игре, после гибели и когда гость уходит в море хоста или возвращается в своё.\n- **Заход не бросают**: пункта «На базу» в меню нет, заход кончается только гибелью или загрузкой сохранения; «Выход» сохраняет игру, и она продолжится с того же места.\n- **Гибель** (`Game.Returned`, `Hud.Died`): когда все лодки игроков ушли под воду, полосы закрываются с «Погиб», и через `Homeward` секунд игра загружает последнее сохранение — обычно у причала, где игра сохранилась. Заход сам гибель не судит (`Run.Lost`); миссия своей карты гибелью проигрывается («Ваша лодка потоплена»).\n- **События** (`Mission.Events`, `Event`): список в файле карты, у каждого `Play` и точки на карте (`Marks`): конвой — маршрут, курьер — откуда и куда, маяки — по порядку, груз — центры россыпей, броненосец — стоянка и точка, куда он смотрит. У каждого вида по две постановки на разных сторонах карты, у броненосца одна. Зачем точки в карте: карту делают и правят в редакторе, события едут с ней. Каждое задание выводит своих охотников (`Sortie.Muster`), сверх тех, что выходят с постов. Виды:\n  - **Конвой** (`Escort`): судно снабжения идёт по маршруту, налётчики идут на него; проиграно, если оно тонет.\n  - **Маяки** (`Beacons`, `Beacon`): по очереди пройти буи мимо охраны; ждут сколько угодно.\n  - **Курьер** (`Courier`): потопить безоружного курьера, уходящего в открытое море; проиграно, если он ушёл.\n  - **Груз** (`Cargo`): ящики потерянного судна снабжения на воде вокруг точек (`Sortie.Spill`); кончается, когда на воде не осталось ничего, кто бы его ни взял.\n  - **Броненосец** (`Ironclad`): босс на собственном корпусе (`Parts.IroncladHull`); держит свой пост, пока в броне, ложится бортом, с первой сбитой плитой зовёт двух гонщиков, а без брони идёт на таран.\n- **Кто даёт задания** (`Run.Take`, `Mission.Givers`, `Giver`): у каждого дающего на карте свой буй, как телефон с заданиями в играх про открытый город. В мире их два: буй корабела у причала гавани (конвой, груз) и буй мытаря у «Марии» (курьер, маяки). Буи горят, пока не идёт ни одно задание; лодка, лёгшая в дрейф у буя, видит на HUD «Работа» и берёт задание на `Space`, если рядом нет охотников. Дающий говорит задание по рации (повод `radio-job`, [Сцены сюжета](../story/scenes.md)), и оно ставится на той постановке своего вида, что начинается ближе к лодке. Задание одно разом: пока оно идёт, буи темны, а после него загораются через двадцать секунд. Каждый дающий даёт свои виды по очереди. Место, где задание начинается, и буи обведены маленьким золотым кольцом на карте (M, `MapView`); на HUD они видны только на экране, золотой рябью — решение без владельца ([Q165](../questions/interface.md#q165)). По счётчику задания больше не приходят. Кто что даёт, перерыв и награды — решение без владельца ([Q129](../questions/missions.md#q129)); дающих и постановки пишут в файле карты, редактор их не правит.\n- **Итоги задания**: выигранное объявляется крупной строкой («Задание выполнено» и его имя, [HUD](../interface/hud.md)), платит и убирается со списка вместе с маркерами; проигранное объявляет свою причину. Конвой, курьер и маяки платят ящиками на воде и припасами у каждой лодки игроков (`Run.Reward`); цифры в [Балансе экономики](../balance/economy.md).\n- **Броненосец** (`Run.Open`): с начала захода стоит на своей стоянке в бухте с двумя катерками охраны; он и они видят на 220 м и держат пост, пока лодка не подойдёт. В целях HUD его нет и о нём не объявляют: он часть моря, а не задание. Идти к нему — выбор игрока. Потопленный, он даёт ремонт и броню каждой лодке, но «Задание выполнено» не объявляется. Потопленный, он не возвращается, пока мир не поднимут заново: после загрузки, «Продолжить» или гибели он снова на стоянке — решение без владельца ([Q131](../questions/missions.md#q131)).\n- **Круги арены и вставки** (`areas/Arenas.cs`, `camera/ShotCamera.cs`, `Game.Stage`, `Game.Cut` в `Game.Cuts.cs`): карта может отметить круг, и вид игрока стоит над ним, пока лодка внутри; вставка, названная кругом, играется при первом входе ([Камера и картинка](camera.md)). В мире один такой круг — стоянка броненосца. Он зовётся кругом арены; у уровня имени нет ([Камера и картинка](camera.md)).\n\nКто и когда нападает: [Зоны и опасности](../world/areas.md), [Охотники и ИИ](hunters.md). Трюм и продажа: [Добыча](haul.md).\n\n## Открытые вопросы\n- [Q1](../questions/missions.md#q1): настоящие задания и боссы.\n- [Q17](../questions/missions.md#q17): какие охотники стоят вместе на постах.\n- [Q81](../questions/missions.md#q81): своя карта без охотников.\n- [Q128](../questions/missions.md#q128), [Q129](../questions/missions.md#q129), [Q131](../questions/missions.md#q131), [Q241](../questions/missions.md#q241).\n"}, {"id": "gameplay-pickups", "path": "gameplay/pickups.md", "title": "Припасы", "section": "gameplay", "date": "2026-11-15", "md": "# Припасы\n\nПрипасы — нитро, ремонт, броня и топливо, которые всплывают в море и спускаются с неба.\n\n## Решения владельца\n- Припасы нитро, ремонта и брони появляются в море случайно, как аркадные припасы: наезд на один пополняет нитро, чинит корпус или прибавляет брони. Припасы брони синие. Любая лодка, и охотник тоже, берёт каждый, на который наехала, нужен он ей или нет.\n- Ремонт чинит треть того, что выдерживает корпус; броня пополняет запас попаданий брони, которые принимаются раньше попаданий корпуса, до трети того, что выдерживает корпус. Встречается и топливо: оно пополняет бак.\n- 2026-11-10: нужно больше припасов, например ремонт, спускающийся с неба на парашютах.\n\n## Как устроено\nЛюбая лодка, и охотник тоже, берёт каждый припас, на который наехала (`pickups/Pickups.cs`): нитро пополняет шкалу (`Nitro.Fill`), ремонт чинит попадания (`Boat.Mend`), броня пополняет запас попаданий брони, принимаемых раньше плит и корпуса (`Boat.Reinforce`), топливо доливает половину бака (`Fuel.Add`, `Pickups.Refuelling`; охотник, который топлива не жжёт, берёт его так же, без толку). Половина бака — число без владельца ([Q112](../questions/boat.md#q112)). Нитро ещё и восстанавливается со временем ([Лодка](boat.md)). Не взятый припас через полминуты мигает и гаснет; припас точки снабжения лежит, пока его не взяли.\n\n- **Откуда берутся** (`Strewing`): время от времени припас всплывает из моря вокруг случайной лодки игрока, вид с равными шансами, в кадре или рядом, в воде, до которой она доберётся, не больше трёх на плаву. Реже с неба падает сброс в 40–80 м от случайной лодки игрока (пока на воде и в воздухе меньше шести), и его вид выбирается по нужде лодки (`Pickups.Lacking`): ремонт, если корпус меньше двух третей, иначе топливо, нитро или броня, тем вероятнее, чем меньше их осталось. Ритм и подбор — решение без владельца ([решено 11-12](../decisions.md)). Кроме того, припасы лежат в точках снабжения карты (`Depots`, [Зоны и опасности](../world/areas.md)), и их раздают выполненные задания ([Открытый мир](missions.md)). Расходники из трюма действуют как те же припасы ([Добыча](haul.md)).\n- **Вид** (`PickupModel`, `Glow.Halo`): эмблема, лежащая плашмя в своём цвете, так что читается с высоты: двойной шеврон для нитро, гаечный ключ для ремонта (никогда не красный крест, защищённая эмблема), светло-голубой щит в белом ободе для брони, поскольку тёмно-синий теряется на синем море, фиолетовая капля для топлива: цвет, которого нет ни у нитро, ремонта и брони, ни у HUD (оранжевый игрок, красные охотники, золотые цели, аква союзники, синяя броня). Взятое топливо звучит как нитро: своего звука у него нет. Взятый припас летит дугой на палубу взявшей лодки, вращаясь и уменьшаясь, и там вспыхивает искрами своего цвета (`Pickups.Show`, `Effects.Pick`), а HUD пишет, что он дал. Решение без владельца, [Q220](../questions/combat.md#q220).\n- **Сброс с неба** (`Pickups.Airdrop`, `PickupModel.CrateOf`, `PickupModel.CanopyOf`, `PickupModel.RingOf`): ящик под круглым куполом из ярких долей цвета припаса и белых медленно спускается, качаясь, над кольцом на воде, которое сужается к месту посадки. Пока он в воздухе (`Pickups.Descending`), взять его нельзя, и охотники его не видят. На воде он плюхает всплеском (`Pickups.Landed`), купол складывается и тает, а ящик становится обычным припасом. Зачем: аркадные сбросы читаются издали и дают игроку цель. Гостям хост сообщает каждый припас, кто его взял и сколько он дал (`Pickups.Supplied`, `Say.Supplied`, `Say.Took`); гость сам припасов не берёт (`Pickups.Told`), а надпись пишет по числу хоста (`Pickups.Take`). Свой бак гость доливает у себя.\n- **Езда** (`waters/Riding.cs`): небольшой поплавок (припас, ящик на плаву) читает высоту и уклон моря в трёх точках раз в такт и сглаживает между чтениями. Зачем: поплавки остаются дешёвыми.\n"}, {"id": "gameplay-progression", "path": "gameplay/progression.md", "title": "Прогресс и сохранения", "section": "gameplay", "date": "2026-11-16", "md": "# Прогресс и сохранения\n\nЧто игра помнит между заходами: монеты, купленные детали, лодку и где стоит заход, и как она сохраняется.\n\n## Решения владельца\n- Кампании и уровней нет: в игре один [открытый мир](missions.md), в котором игра и начинается.\n- Игрок строит лодку из деталей, покупаемых за монеты в верфи. Деталей не крафтят: каждая только покупается (2026-11-09). Расходники оплачивают ящиками из трюма (2026-11-11, [Добыча](haul.md)).\n- Добыча превращается в монеты сразу, когда её продают: в гавани у пирса или у плавучей станции в море ([Добыча](haul.md)).\n- Игра сохраняется сама по ходу.\n- Сохранение хранит и состояние мира, и игра продолжается с последнего сохранения (2026-11-14; до того оно хранило только прогресс). Гибель загружает последнее сохранение ([Открытый мир](missions.md)).\n- В море игра сохраняется сама раз в минуту, когда рядом нет охотников (2026-11-16).\n- Новая игра начинается с 10 000 монет.\n\n## Как устроено\n`Progress` (`progress/Progress.cs`) хранит монеты, купленные детали, проект лодки, с которым выходили в последний раз, с его окраской после перекраски ([Розыск и патруль](wanted.md)), факты сюжета (`Facts`), самый долгий полёт лодки (`Flight`) и найденные спрятанные посылки по имени карты и номеру (`Found`, `Find`; [Забавы](toys.md)). Каждая деталь продаётся на верфи, детали стартовой лодки принадлежат с самого начала ([Q56](../questions/missions.md#q56)). Монеты приходят от проданной добычи (`Progress.Earn`) и из сцен сюжета, уходят на детали (`Progress.Buy`); цифры в [Балансе экономики](../balance/econom
