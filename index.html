ходники](../gameplay/kits.md) | `1`–`4` | Разовые зелья/заряды за ящики из трюма | Расходуют добычу; игрок часто жадничает и бережёт их «на потом» вместо активной игры |\n| [Диковины старьёвщика](../world/hulk.md) | `5` | Весёлые активки: Фейерверк (ослепление), Магнит (лут), Шарики (прыгучесть) | Одноразовые шутки — но механически это уже прототипы *Blinding Light*, *Vacuum* и *Leap* |\n| [Парирование ракетой](../gameplay/rockets.md) | `Q` / `E` | Реактивная защита (*Spiked Carapace* / *Parry*) | В [дорожной карте](../roadmap.md) уже записано: чистое уклонение и парирование должны давать окно ответа |\n\n**Ключевое наблюдение по коду (`game/players/Command.cs`):** сетевая модель уже передаёт команды игрока как битовые флаги `Order` поверх `Throttle`, `Rudder`, `Boost` и `Sight`. То есть для **онлайн-коопа** добавление 3–4 активных умений (`Skill1`, `Skill2`, `Skill3`, `Ultimate`) архитектурно стоит буквально 4 новых флага в `Order` — хост считает перезарядки и эффекты детерминированно, без остановки мира.\n\n## Разбор всех 127 героев Dota 2: таксономия механик\n\nПочему именно Dota 2 — лучший справочник по боевым умениям для изометрической игры? Потому что за 20+ лет эволюции IceFrog и Valve довели до предела **разнообразие глаголов при жёстком бюджете в 4 кнопки**. Почти каждый герой Dota 2 — это не «+15% урона», а уникальное правило взаимодействия с пространством, временем, движением или союзниками.\n\nПосле разбора всех **127 героев** (патч 7.40, включая Ringmaster, Kez и Largo; распределение по атрибутам в таблице ниже — 33 Силы, 31 Ловкости, 31 Интеллекта и 32 Универсальных) они распадаются на **4 уровня переносимости** в нашу аркаду:\n\n| Оценка | Кол-во | Доля | Суть | Примеры героев |\n|---|---:|---:|---|---|\n| <span class=\"sk-badge sk-s\">● Идеально (S)<\/span> | **71** | 56 % | Механика строится на движении, курсе, шлейфе, гарпуне, волне, щите, буе или ауре — ложится на катер почти 1-в-1 | Kunkka, Pudge, Batrider, Tidehunter, Gyrocopter, Weaver, Bristleback, Io, Pangolier, Clockwerk, Abaddon, Snapfire, Mars, Disruptor, Magnus, Largo |\n| <span class=\"sk-badge sk-a\">◐ С адаптацией (A)<\/span> | **32** | 25 % | Механика классная, но прицел кликом нужно заменить на руль, веер борта или авто-захват цели | Axe, Kez, Lion, Skywrath Mage, Dragon Knight, Medusa, Tinker, Shadow Shaman, Undying, Wraith King, Night Stalker |\n| <span class=\"sk-badge sk-b\">○ Частично (B)<\/span> | **12** | 9,5 % | Ядро героя привязано к крипам, фарму, сжиганию маны или пассивному клику; берём только 1 приём | Anti-Mage, Alchemist, Bloodseeker, Doom, Huskar, Lifestealer, Nature's Prophet, Necrophos, Outworld Destroyer, Silencer, Ursa, Bane |\n| <span class=\"sk-badge sk-c\">✕ Не ложится (C)<\/span> | **12** | 9,5 % | RTS-микроконтроль отряда, иллюзии, «пианино» из 10 кнопок, кража чужих спеллов — убивает аркадный темп и геймпад | Meepo, Chen, Enchantress, Lone Druid, Naga Siren, Arc Warden, Visage, Broodmother, Phantom Lancer, Invoker, Rubick, Morphling |\n\nНиже — **12 семейств механик Dota 2**, в которые укладывается весь ростер, со значками ключевых умений и тем, как именно они работают на воде в нашей игре.\n\n### 1. Крюки, рывки и перепозиционирование\nСамое «катерное» семейство: всё, что рвёт дистанцию, притягивает врага под бортовой залп или проносится сквозь строй охотников.\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/pudge_meat_hook.png\" alt=\"Meat Hook\"><div><b>Pudge — Meat Hook<\/b><small>Гарпун по носу: вытягивает врага (или тонущего товарища!) прямо под борт.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/rattletrap_hookshot.png\" alt=\"Hookshot\"><div><b>Clockwerk — Hookshot<\/b><small>Гарпун-лебёдка: тянет <em>нашу<\/em> лодку к врагу или острову с таранным ударом.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/pangolier_gyroshell.png\" alt=\"Rolling Thunder\"><div><b>Pangolier — Rolling Thunder<\/b><small>Неуправляемый дрифт-таран с отскоком от островов и расшвыриванием роев.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/shredder_timber_chain.png\" alt=\"Timber Chain\"><div><b>Timbersaw — Timber Chain<\/b><small>Трос за скалу или причал: резкий рывок сквозь воду мимо ракетного залпа.<\/small><\/div><\/div>\n<\/div>\n\n- **Кто в семействе:** Pudge, Clockwerk, Magnus, Spirit Breaker, Pangolier, Primal Beast, Timbersaw, Tusk, Storm Spirit, Ember Spirit, Void Spirit, Earth Spirit, Puck, Anti-Mage, Queen of Pain, Faceless Void, Sand King, Slark, Marci, Vengeful Spirit, Kez.\n- **Как работает у нас:** идеальная пара для сборок **Преследователь** и **Бортовой залп**. Вместо клика по точке гарпун летит строго по носу лодки (целимся рулём!), а «обмен местами» (*Nether Swap*) или рывок (*Charge of Darkness*) использует уже захваченную цель.\n\n### 2. След за кормой, нефть и зоны на воде\nУ лодки всегда есть **кильватерный след** — в отличие от пехотинца, катер естественным образом рисует линии и круги на воде.\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/batrider_firefly.png\" alt=\"Firefly\"><div><b>Batrider — Firefly<\/b><small>Горящая нефть за кормой: преследователи либо сходят с курса, либо горят.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/jakiro_macropyre.png\" alt=\"Macropyre\"><div><b>Jakiro — Macropyre<\/b><small>Длинная огненная полоса по курсу, разрезающая строй охотников пополам.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/dark_seer_vacuum.png\" alt=\"Vacuum\"><div><b>Dark Seer — Vacuum<\/b><small>Водоворот стягивает рой катерков в одну точку под торпеду или залп.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/disruptor_glimpse.png\" alt=\"Glimpse\"><div><b>Disruptor — Kinetic Field / Glimpse<\/b><small>Буй-ловушка запирает врага в кольце или откатывает беглеца на 4 с назад.<\/small><\/div><\/div>\n<\/div>\n\n- **Кто в семействе:** Batrider, Jakiro, Venomancer, Viper, Sand King, Underlord, Leshrac, Dark Seer, Disruptor, Slardar, Razor, Dawnbreaker, Brewmaster, Earthshaker (стена-барьер *Fissure* → цепь плавучих бонов!).\n- **Как работает у нас:** в игре уже есть система нефтяных пятен (`game/areas/Slicks.cs`, `Spill.cs`) и дыма (`Smoke.cs`). Горящий след за кормой превращает сборку **Минёра** из пассивного убегания в активное рисование ловушек на воде.\n\n### 3. Волны, залпы и «корабельные» скиллшоты\nГерои, чьи умения буквально просятся на морской бой: **Kunkka** (адмирал!), **Tidehunter**, **Gyrocopter**, **Snapfire**.\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/kunkka_ghostship.png\" alt=\"Ghostship\"><div><b>Kunkka — Ghostship<\/b><small>Призрачный катер-таран по прямой: оглушает врагов и даёт союзникам «ром» (отсрочку урона).<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/tidehunter_ravage.png\" alt=\"Ravage\"><div><b>Tidehunter — Ravage<\/b><small>Расходящееся кольцо глубинных взрывов от корпуса, подбрасывающее всех вокруг.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/gyrocopter_flak_cannon.png\" alt=\"Flak Cannon\"><div><b>Gyrocopter — Flak Cannon<\/b><small>Форсаж турели: следующие 5 выстрелов бьют сразу по всем врагам в радиусе.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/gyrocopter_call_down.png\" alt=\"Call Down\"><div><b>Gyrocopter — Call Down<\/b><small>Две отложенные ракеты на захваченную цель: первая замедляет, вторая добивает.<\/small><\/div><\/div>\n<\/div>\n\n- **Кто в семействе:** Kunkka, Tidehunter, Gyrocopter, Snapfire, Mirana, Windranger, Hoodwink, Mars, Sniper, Lina, Lion, Death Prophet, Dragon Knight, Keeper of the Light, Shadow Fiend, Phoenix, Muerta, Zeus, Skywrath Mage, Ancient Apparition.\n- **Как работает у нас:** отложенные круги на воде (*Torrent*, *Call Down*, *Mortimer Kisses*) невероятно хорошо читаются с нашей 35° изометрической камеры — они дают врагам и игроку честные 1,2–1,5 секунды на рывок и учат «предсказывать курс», а не просто кликать.\n\n### 4. Щиты, парирование, таунт и выживание\nВ аркадной морской игре танк не должен просто иметь «×3 HP» — он должен **включать окно защиты в момент залпа** и перетягивать огонь с напарников.\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/abaddon_aphotic_shield.png\" alt=\"Aphotic Shield\"><div><b>Abaddon — Aphotic Shield<\/b><small>Энергощит на себя или союзника: снимает горение/замедление и взрывается при пробитии.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/bristleback_quill_spray.png\" alt=\"Quill Spray\"><div><b>Bristleback — Bristleback / Quills<\/b><small>Броня кормы: чем больше бьют сзади, тем сильнее авто-ответ шрапнелью вокруг лодки.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/nyx_assassin_spiked_carapace.png\" alt=\"Spiked Carapace\"><div><b>Nyx — Spiked Carapace<\/b><small>Окно парирования 1,5 с: первый попавший залп отражается назад и оглушает стрелка.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/axe_berserkers_call.png\" alt=\"Berserker's Call\"><div><b>Axe — Berserker's Call<\/b><small>Боевой гудок: броня на 3 с, все охотники рядом разворачиваются и бьют только тебя.<\/small><\/div><\/div>\n<\/div>\n\n- **Кто в семействе:** Abaddon, Axe, Bristleback, Centaur Warrunner, Omniknight, Oracle, Dazzle, Mars, Medusa, Tidehunter, Nyx Assassin, Templar Assassin, Huskar, Wraith King, Sven, Ursa, Alchemist, Lifestealer, Undying, Kez (парирование *Shodo Sai*).\n- **Как работает у нас:** идеально закрывает задачу «сделать парирование и уклонение осмысленными» из [дорожной карты](../roadmap.md). А щит Абаддона, который *лопается уроном вокруг*, поощряет влетать в гущу врагов, а не прятаться.\n\n### 5. Привязи, цепи и командные связки\nГлавное оружие для **коопа на 2–4 лодки** — механики, рисующие видимую физическую связь между двумя лодками на воде.\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/wisp_tether.png\" alt=\"Tether\"><div><b>Io — Tether<\/b><small>Буксирный трос к товарищу: передаёт скорость, починку и замедляет врагов, пересекших трос.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/grimstroke_soul_chain.png\" alt=\"Soulbind\"><div><b>Grimstroke — Soulbind<\/b><small>Цепной выстрел связывает двух охотников: не могут разойтись, а урон по одному бьёт обоих.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/puck_dream_coil.png\" alt=\"Dream Coil\"><div><b>Puck — Dream Coil<\/b><small>Якорный буй пристёгивает группу врагов тросами: попытка уйти рвёт трос и глушит мотор.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/enigma_black_hole.png\" alt=\"Black Hole\"><div><b>Enigma — Black Hole<\/b><small>Поддерживаемый водоворот: пока катер держит луч, врагов крутит к центру под залп команды.<\/small><\/div><\/div>\n<\/div>\n\n- **Кто в семействе:** Io, Grimstroke, Razor (*Static Link* — выкачивает мощь мотора/урона по тросу!), Puck, Windranger (*Shackleshot* — пригвоздить лодку к острову или второй лодке!), Slark (*Pounce* — привязь), Enigma, Magnus, Lich (*Chain Frost* — прыгающий заряд между лодками), Witch Doctor, Shadow Shaman, Warlock (*Fatal Bonds* — общий урон на пачку), Largo.\n\n### 6. Скрытность, обман и «краткий нырок»\nВ [сборках](../gameplay/builds.md) владелец уже прямо допускал **«нырок на две-три секунды, как снаряжение»** (при том что постоянной подлодки не будет). Dota 2 даёт 5 разных способов сделать неуязвимость и уход от прицела весёлыми, а не «кнопкой скуки»:\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/puck_phase_shift.png\" alt=\"Phase Shift\"><div><b>Puck — Phase Shift<\/b><small>Краткий нырок под волну на 1,5–2 с: ракеты проходят над силуэтом, ход падает.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/bounty_hunter_track.png\" alt=\"Track\"><div><b>Bounty Hunter — Track<\/b><small>Сигнальная метка на врага: виден сквозь дым, даёт команде скорость и +добычу за потопление.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/keeper_of_the_light_blinding_light.png\" alt=\"Blinding Light\"><div><b>KotL — Blinding Light<\/b><small>Вспышка-фейерверк (уже есть у старьёвщика!): отталкивает врагов и сбивает прицел.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/ringmaster_wheel.png\" alt=\"Wheel of Wonder\"><div><b>Ringmaster — Escape Act / Wheel<\/b><small>Приманка-карусель (таунт смотрящих на неё) и защитный «ящик-буй» для спасения союзника.<\/small><\/div><\/div>\n<\/div>\n\n- **Кто в семействе:** Riki, Bounty Hunter, Clinkz, Nyx Assassin, Weaver, Slark, Dark Willow (*Shadow Realm*), Templar Assassin (*Meld*), Monkey King (*Mischief* — маскировка под ящик/буй!), Mirana (*Moonlight Shadow* — общий дым/маскировка команды), Sand King, Kez (*Raven's Veil*).\n\n### 7. Ловушки, буи, турели и тотемы\nСтационарные объекты на воде идеально читаются с изометрической камеры и не требуют микроконтроля: поставил буй — и кружишь вокруг него.\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/juggernaut_healing_ward.png\" alt=\"Healing Ward\"><div><b>Juggernaut — Healing Ward<\/b><small>Ремонтный буй: лечит всех союзников в круге, но враги могут его расстрелять.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/techies_land_mines.png\" alt=\"Proximity Mines\"><div><b>Techies — Mines / Tazer<\/b><small>Эволюция наших мин: мины-растяжки, толкающий заряд-отпугиватель, детонация по кнопке.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/zuus_arc_lightning.png\" alt=\"Arc Lightning\"><div><b>Pugna / Zeus — Ward & Chain<\/b><small>Грозовой буй бьёт разрядом в каждого охотника, который стреляет рядом.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/juggernaut_blade_fury.png\" alt=\"Blade Fury\"><div><b>Witch Doctor / Venomancer — Wards<\/b><small>Автономный буй-пулемёт или круговой вихрь обстрела при сближении.<\/small><\/div><\/div>\n<\/div>\n\n- **Кто в семействе:** Techies, Venomancer, Shadow Shaman, Witch Doctor, Pugna, Phoenix (*Supernova* — маяк, который надо успеть разбить до взрыва!), Juggernaut, Undying (*Tombstone* — буй, выпускающий дроны-камикадзе), Clockwerk (*Power Cogs*), Elder Titan, Ringmaster, Earth Spirit.\n\n### 8. Ауры, бафы, починка и кооп-поддержка\nТо, чего сейчас нет в игре вообще и что превращает 4 одинаковые лодки в **команду**.\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/centaur_stampede.png\" alt=\"Stampede\"><div><b>Centaur — Stampede<\/b><small>Общий форсаж отряда на 4 с: все союзные лодки ускоряются и таранят врагов на ходу.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/dazzle_shallow_grave.png\" alt=\"Shallow Grave\"><div><b>Dazzle — Shallow Grave<\/b><small>Аварийный клапан на союзника: 4 секунды лодка не может утонуть ниже 1 прочности.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/dark_seer_surge.png\" alt=\"Surge\"><div><b>Dark Seer — Surge<\/b><small>Попутная волна: снимает замедление с напарника и разгоняет его до предела.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/kunkka_x_marks_the_spot.png\" alt=\"X Marks the Spot\"><div><b>Kunkka / Largo — X-Mark & Songs<\/b><small>Отзыв союзника в безопасную точку или шанти-аура (скорость / урон / ремонт на выбор).<\/small><\/div><\/div>\n<\/div>\n\n- **Кто в семействе:** Crystal Maiden (аура ускорения перезарядки!), Io, Omniknight, Dazzle, Abaddon, Oracle, Treant Protector (ремонт по воде/у островов), Warlock, Winter Wyvern, Witch Doctor, Keeper of the Light (сброс чужой перезарядки!), Ogre Magi (*Bloodlust* + *Multicast* — шанс двойного залпа!), Largo (переключаемые песни-шанти!), Vengeful Spirit, Luna, Drow Ranger, Sven, Lycan, Beastmaster, Troll Warlord.\n- **Особенно круто для лора Floppa:** у нас в вики уже есть [Шанти](../audio/shanties.md)! Умение в духе нового героя **Largo** (*Amphibian Rhapsody*) — капитан включает одну из 3 морских песен/аур (ход / залп / ремонт) — ложится на атмосферу флопп на 10 из 10.\n\n### 9. Накопление стаков, казнь и риск-награда\nМеханики, которые вознаграждают смелый стиль игры — «чем дольше держишься в бою или чем ниже прочность, тем опаснее лодка».\n\n- **Кто в семействе:** Huskar (чем меньше HP — тем быстрее скорострельность!), Necrophos (добивание подранка восстанавливает прочность), Axe (*Culling Blade* — таран-казнь слабой лодки мгновенно сбрасывает перезарядку!), Bloodseeker (ускорение рядом с подбитыми врагами), Ursa (каждое попадание подряд усиливает следующее), Shadow Fiend (трофейные стаки за потопленных до первой смерти), Slark, Bristleback, Batrider (*Sticky Napalm* — нефтяные стаки усиливают любой огонь), Monkey King (*Jingu Mastery* — каждый 4-й выстрел мощный и лечит), Viper, Outworld Destroyer, Silencer, Legion Commander, Lion, Kez (*Kazurai Katana* — стаки кровотечения и подрыв), Phantom Assassin.\n- **Как работает у нас:** это лучшие кандидаты на **Врождённую пассивку корпуса (Innate)** — никаких лишних кнопок, но сразу меняется манера вождения.\n\n### 10. Смена стоек, переключение режимов и трансформация\nКогда одна кнопка меняет правила игры для всей лодки.\n\n- **Кто в семействе:** Troll Warlord (ближний/дальний режим), Kez (переключение 2 наборов стоек), Largo (режим барда-ауры), Dragon Knight (усиленная форма на 20 с), Terrorblade, Undying, Alchemist (*Chemical Rage* — перегрев мотора: дикая скорость и ремонт), Brewmaster, Phoenix, Night Stalker (сильнее ночью — а у нас есть [смена суток](../art/light.md)!), Lycan.\n- **Как работает у нас:** режим «Форсаж котла» (Alchemist/Sven: +скорость, +скорострельность, но дымишь и виден издалека) или «Осадный якорь» (остановился — турели бьют вдвое дальше и чаще, как *Siege Mode* / *Sniper Take Aim*).\n\n### 11. Время, откат и перезагрузка\nСамые запоминающиеся умения Dota 2 — те, что играют с недавним прошлым позиции или перезарядками.\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/weaver_time_lapse.png\" alt=\"Time Lapse\"><div><b>Weaver — Time Lapse<\/b><small>Отмотка курса на 4 с назад: возвращает лодку в прежнюю точку и восстанавливает прочность.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/disruptor_glimpse.png\" alt=\"Glimpse\"><div><b>Disruptor — Glimpse<\/b><small>Возвращает захваченного врага туда, где он был 3,5 с назад (прямо обратно на мины!).<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/kunkka_x_marks_the_spot.png\" alt=\"X Marks the Spot\"><div><b>Kunkka — X Marks the Spot<\/b><small>Ставит буй-якорь: ворвался, дал залп, нажал снова — мгновенно вернулся назад.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/mars_gods_rebuke.png\" alt=\"Mars / Tinker\"><div><b>Tinker — Rearm / Mars Rebuke<\/b><small>Мгновенный сброс перезарядки бортов ценой остановки мотора на 1,5 с (риск ради двойного залпа).<\/small><\/div><\/div>\n<\/div>\n\n- **Кто в семействе:** Weaver, Faceless Void (*Time Walk* / *Chronosphere*), Tinker, Disruptor, Kunkka, Oracle, Spectre, Nature's Prophet, Underlord (*Fiend's Gate* — парный портал/буй для команды).\n- **Почему это золото для нас:** *Time Lapse* и *X Marks the Spot* требуют ровно **одной кнопки**, не требуют прицела вообще, выглядят ошеломляюще на воде (пунктирная дуга следа назад!) и отлично работают на геймпаде.\n\n### 12. Микроконтроль и что мы сознательно НЕ берём\nДвенадцать героев Dota 2 опираются на RTS-механики Warcraft III, которые разрушают аркадное управление одной моторной лодкой:\n- **Отряд с ручным управлением (Meepo, Chen, Enchantress, Lone Druid, Naga Siren, Arc Warden, Visage, Broodmother, Phantom Lancer):** в нашей игре [дроны](../gameplay/drones.md) уже правильно решены двумя командами («послать / отозвать»). Делать ручной выбор рамкой или переключение `Tab` между лодками нельзя — это противоречит «одна лодка на игрока» ([Об игре](../vision.md)) и геймпаду.\n- **«Пианино» из 10 спеллов (Invoker) и кража чужих спеллов (Rubick):** слишком высокий порог входа и лишний интерфейс поверх боя.\n- **Что всё-таки можно «спасти» отсюда по кусочкам:** купол уклонения *Magnetic Field* (Arc Warden) как защитный буй; иллюзия-обманка (Naga/PL) как надувная лодка-приманка, уводящая ракеты; *Tornado* и *EMP* (Invoker) как отдельные самостоятельные умения.\n\n---\n\n## Полный каталог всех 127 героев Dota 2\n\nНиже разобран **каждый** из 127 героев Dota 2 по алфавиту (патч 7.40). Обозначения: **СИЛ / ЛОВ / ИНТ / УНИ** — основной атрибут; **`●`** — ложится идеально, **`◐`** — с адаптацией прицела под руль/захват, **`○`** — берём одну идею, **`✕`** — не переносится как архетип.\n\n| # | Портрет | Герой | Атр. | Ключевая механика в Dota 2 | Перенос | Идея умения / пассивки для Floppa |\n|---:|---|---|---:|---|---|---|\n| 1 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/abaddon.png\" alt=\"Abaddon\"> | **Abaddon** | УНИ | Взрывающийся щит-очищение (*Aphotic Shield*), авто-выживание при низком HP (*Borrowed Time*) | <span class=\"sk-badge sk-s\">●<\/span> | **Аварийный барьер:** щит на себя или союзника, снимает огонь/замедление и взрывается волной при пробитии |\n| 2 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/alchemist.png\" alt=\"Alchemist\"> | **Alchemist** | СИЛ | Разгон золота, заряжаемая бомба с риском взорваться в руках, кислотная лужа, берсерк-реген | <span class=\"sk-badge sk-b\">○<\/span> | **Перегрев котла / Бочка-таймер:** держишь кнопку — заряд мощнее, передержал — бахнул под собой |\n| 3 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/ancient_apparition.png\" alt=\"Ancient Apparition\"> | **Ancient Apparition** | ИНТ | Глобальная ракета, запрещающая лечение; зона-заморозка, если не выплыть за 4 с | <span class=\"sk-badge sk-a\">◐<\/span> | **Крио-торпеда / Дальний сигнальный выстрел:** чем дальше летит снаряд, тем шире зона взрыва |\n| 4 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/antimage.png\" alt=\"Anti-Mage\"> | **Anti-Mage** | ЛОВ | Короткий телепорт (*Blink*), отражение направленного заклинания (*Counterspell*), сжигание маны | <span class=\"sk-badge sk-b\">○<\/span> | **Отражающий щит:** короткое окно 1 с — отражает ракету прямо назад в стрелка |\n| 5 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/arc_warden.png\" alt=\"Arc Warden\"> | **Arc Warden** | УНИ | Полная копия героя с отдельными кд; поле уклонения (*Magnetic Field*); призрачные мины | <span class=\"sk-badge sk-c\">✕<\/span> | Двойника не берём; спасаем **Полевой буй** (круг на воде, в котором союзники получают ускорение стрельбы и уклонение) |\n| 6 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/axe.png\" alt=\"Axe\"> | **Axe** | СИЛ | Таунт вокруг себя (*Berserker's Call*), авто-контратака при получении ударов, казнь со сбросом кд | <span class=\"sk-badge sk-a\">◐<\/span> | **Боевой гудок (Таунт)** + **Таран-казнь:** потопление подранка тараном мгновенно откатывает нитро |\n| 7 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/bane.png\" alt=\"Bane\"> | **Bane** | УНИ | Усыпление (*Nightmare*, передаётся при атаке), om/apps/dota2/images/dota_react/heroes/brewmaster.png\" alt=\"Brewmaster\"> | **Brewmaster** | УНИ | Переключение 4 стихийных стоек, бочка с горючим + поджог, расщепление на 3 духа | <span class=\"sk-badge sk-a\">◐<\/span> | Расщепление не берём; берём **комбо «Нефть + Искра»** (облил бочкой — любой выстрел поджигает) и стойки корпуса |\n| 13 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/bristleback.png\" alt=\"Bristleback\"> | **Bristleback** | СИЛ | Снижение урона с кормы и авто-выброс шипов (*Quill Spray*), стакающееся замедление | <span class=\"sk-badge sk-s\">●<\/span> | **Бронированная корма (пассивка):** урон сзади режется и автоматически выстреливает круговой шрапнелью — мечта минёра |\n| 14 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/broodmother.png\" alt=\"Broodmother\"> | **Broodmother** | УНИ | Сеть зон с ускорением и проходимостью сквозь препятствия, рой паучков | <span class=\"sk-badge sk-c\">✕<\/span> | Рой паучков избыточен; берём идею **Буев-маяков скорости** — в своей зоне катер идёт быстрее и острее рулит |\n| 15 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/centaur.png\" alt=\"Centaur Warrunner\"> | **Centaur Warrunner** | СИЛ | Отдача шипами в атакующих, таран-самоурон, командный рывок *Stampede*, тележка-спасение союзника | <span class=\"sk-badge sk-s\">●<\/span> | **Общий форсаж (Stampede):** вся команда ускоряется на 4 с и сбивает врагов тараном; **Буксир-эвакуация** подбитого товарища |\n| 16 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/chaos_knight.png\" alt=\"Chaos Knight\"> | **Chaos Knight** | СИЛ | Притягивающий разлом (*Reality Rift*), случайная сила стана, армия иллюзий | <span class=\"sk-badge sk-a\">◐<\/span> | **Сближение-рывок:** притягивает цель и себя в точку посередине прямо на емая аура ремонта** (расходует шкалу энергии, пока чинит союзников рядом) |\n| 126 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/skeleton_king.png\" alt=\"Wraith King\"> | **Wraith King** | СИЛ | Стан-заряд, вампиризм, гарантированный крит по таймеру, **вторая жизнь на месте** (*Reincarnation* с замедлением вокруг) | <span class=\"sk-badge sk-a\">◐<\/span> | **Авто-подъём (Reincarnation):** раз в 3 мин потопленная лодка сама всплывает со взрывом и замедлением врагов — находка для соло! |\n| 127 | <img class=\"hero-thumb\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/zuus.png\" alt=\"Zeus\"> | **Zeus** | ИНТ | Цепная молния (*Arc Lightning*), удар с подсветкой невидимых, прыжок назад с замедлением (*Heavenly Jump*), глобальный удар | <span class=\"sk-badge sk-s\">●<\/span> | **Цепная искра** (перескакивает по рою катерков) + **Грозовая вспышка**, снимающая дым с охотников |\n\n---\n\n## Уроки Classic WoW: чему научиться у 9 классов и системы талантов\n\nDota 2 идеально отвечает на вопрос **«что должна делать отдельная кнопка в бою?»**, но в Dota 2 матч длится 40 минут и каждый раз начинается с нуля. **Floppa Tropical Adventures** — это открытое море с [сохранениями](../gameplay/progression.md), [верфью](../base/boatyard.md), поручениями и коопом, где игрок привязывается к своей лодке на часы. Именно в этом слое сильнее всего **World of Warcraft Classic** (2004).\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://wow.zamimg.com/images/wow/icons/large/ability_warrior_charge.jpg\" alt=\"Charge\"><div><b>Warrior — Charge / Shield Wall<\/b><small>Ярость копится от драки и тарана; «Стена щитов» спасает от залпа босса.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://wow.zamimg.com/images/wow/icons/large/spell_arcane_blink.jpg\" alt=\"Blink\"><div><b>Mage — Blink / Frost Nova<\/b><small>Мгновенный уход от контроля + заморозка вокруг себя для разрыва дистанции.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://wow.zamimg.com/images/wow/icons/large/spell_holy_powerwordshield.jpg\" alt=\"Power Word: Shield\"><div><b>Priest — Power Word: Shield<\/b><small>Превентивный щит на союзника до удара + понятная роль поддержки.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://wow.zamimg.com/images/wow/icons/large/spell_holy_divineintervention.jpg\" alt=\"Divine Shield\"><div><b>Paladin — Divine Shield<\/b><small>Полная неуязвимость на несколько секунд ценой длинной перезарядки.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://wow.zamimg.com/images/wow/icons/large/ability_vanish.jpg\" alt=\"Vanish\"><div><b>Rogue — Vanish / Sprint<\/b><small>Мгновенный сброс боя в дым + энергия с быстрой регенерацией и комбо-очками.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://wow.zamimg.com/images/wow/icons/large/spell_nature_windfury.jpg\" alt=\"Windfury\"><div><b>Shaman — Windfury / Totems<\/b><small>Аура-тотем на воду + случайный «прок» двойного залпа — радость с первого кадра.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://wow.zamimg.com/images/wow/icons/large/ability_whirlwind.jpg\" alt=\"Whirlwind\"><div><b>Warrior — Whirlwind<\/b><small>Круговой удар на коротком кд, зачищающий мелкий рой вокруг корпуса.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://wow.zamimg.com/images/wow/icons/large/spell_frost_frostnova.jpg\" alt=\"Frost Nova\"><div><b>Mage — Frost Nova / Polymorph<\/b><small>Мгновенный рут вокруг себя и выключение опасного охотника на время зачистки роя.<\/small><\/div><\/div>\n<\/div>\n\n### Четыре принципа Classic WoW, которые работают на море\n\n1. **Разные типы ресурсов меняют ощущение от игры ещё до нажатия кнопок.**\n   В Classic WoW Воин, Разбойник и Маг ощущаются по-разному даже при одинаковом уроне в секунду:\n   - **Ярость (Warrior):** пуста вне боя, растёт от попаданий, тарана и полученного урона → заставляет *лезть в драку и не отпускать газ*.\n   - **Энергия + комбо-очки (Rogue):** быстро восстанавливается сама, тратится короткими сериями, а на 3–5 зарядах даёт мощный финишер → идеальна для *юркого катера-преследователя*.\n   - **Мана / Конденсатор (Mage / Priest / Shaman):** большой запас на мощные командные и защитные приёмы, который восстанавливается в затишье или расходником → создаёт *тактическое решение «потратить сейчас или сберечь на броненосец»*.\n   - **Для нашей игры:** плодить три разные полоски всем не нужно (HUD должен оставаться чистым — [HUD](../interface/hud.md)). Но **чистые перезарядки + заряды (как у нитро) + одна пассивная механика ресурса от корпуса** (например, *Накал* у таранного корпуса или *3 попадания → суперзалп* у преследователя) дают 80 % ощущений WoW при 10 % сложности интерфейса.\n\n2. **Ветка талантов запоминается переломными узлами, а не «+1 % к урону».**\n   В Classic WoW игроки до сих пор помнят 31-очковые ветки (Arms / Fury / Protection, Frost / Fire / Arcane) не из-за скучных `+1% к криту`, а из-за **опорных узлов каждые 5–10 очков**, которые *открывают новое активное умение* или *ломают правило старого* (*Mortal Strike*, *Sweeping Strikes*, *Ice Barrier*, *Cold Snap*, *Preparation*, *Shadowform*, *Stormstrike*).\n   В современном Dota 2 ту же роль играют **Аспекты (Facets)** и **Aghanim's Shard**. Для Floppa оптимальна **компактная сетка из 9–12 узлов (или выбор 1 из 2 модификаторов на каждое умение)**: например, Дым превращается либо в *Ремонтный туман* (лечит своих внутри), либо в *Едкий смог* (замедляет и жжёт охотников).\n\n3. **Реактивные проки («кнопка загорелась прямо сейчас!»).**\n   Одни из самых приятных моментов в Classic WoW — **Overpower** (загорается на 5 с, когда враг увернулся), **Clearcasting** (следующий спелл бесплатный) и **Windfury** (взрывная серия доп. ударов). В нашей [дорожной карте](../roadmap.md) уже записано: *«после чистого уклонения есть окно для удара; парирование что-то возвращает»*. Прок-система идеально реализует это решение: увернулся рывком от красной ракеты впритирку или парировал ракету ракетой — на 3 секунды загорается усиленный контр-залп или сбрасывается откат умения!\n\n4. **«Мягкая триада» в коопе без обязаловки в соло.**\n   Жёсткая святая троица WoW (без хилера и танка подземелье непроходимо) сломала бы соло-игру. Но **мягкие роли** из Classic WoW (таунт, щиты, диспел/очищение, бафы группы, тотемы на земле, контроль опасного моба) делают кооп-выход на форт или броненосец вчетвером в разы богаче, чем «четыре одинаковых катера с лучшими ракетами».\n\n### Что НЕ брать из Classic WoW\n\n| Ловушка Classic WoW | Почему она вредна для Floppa Tropical Adventures |\n|---|---|\n| Панели на 25–40 кнопок | У нас [геймпад](../interface/controls.md) и постоянное руление моторной лодкой. Потолок — **3–4 активных умения** (плюс `Shift` нитро и `Q/E` огонь). |\n| Глобальная перезарядка 1,5 с (GCD) | Замораживает аркадный ритм. Рывок, дым и щит должны срабатывать **мгновенно**, без паузы между нажатиями. |\n| Долгие касты стоя на месте (2–3 с) | Лодка всегда в движении и дрейфует по волнам. Любая «зарядка» должна идти **на ходу** (удержание кнопки, пока рулишь). |\n| Таб-таргет и проверка характеристик | У нас веселье в уклонении и траекториях; умения не должны превращать бой в обмен неизбежными цифрами. |\n| Скучные таланты «+1 % к броне × 5» | Каждый узел должен менять *поведение* на воде, а не прятаться в таблице. |\n\n---\n\n## Уроки Larian: Divinity: Original Sin 2 и Baldur's Gate 3\n\nОбе игры Larian Studios пошаговые, но для **морской аркады со свободной верфью** в них спрятаны два механизма, которых почти нет ни в Dota 2, ни в Classic WoW: **интерактивные поверхности на воде** (DOS2) и **физическое взаимодействие с окружением + реакции/концентрация** (BG3).\n\n<div class=\"gallery\">\n<a href=\"https://store.steampowered.com/app/435150/\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/435150/header.jpg\" alt=\"Divinity: Original Sin 2\">Divinity: Original Sin 2 — бесклассовые слоты памяти и цепные реакции стихий<\/a>\n<a href=\"https://store.steampowered.com/app/1086940/\"><img src=\"https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1086940/header.jpg\" alt=\"Baldur's Gate 3\">Baldur's Gate 3 — реакции, концентрация, толкание в окружение и скиллы от снаряжения<\/a>\n<\/div>\n\n### Divinity: Original Sin 2 — бесклассовые слоты и химия моря\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://divinityoriginalsin2.wiki.fextralife.com/file/Divinity-Original-Sin-2/teleportation.png\" alt=\"Teleportation\"><div><b>Teleportation<\/b><small>Швырнуть врага на скалу, в нефтяное пятно или прямо на голову другому охотнику.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://divinityoriginalsin2.wiki.fextralife.com/file/Divinity-Original-Sin-2/nether_swap.png\" alt=\"Nether Swap\"><div><b>Nether Swap<\/b><small>Поменять местами охотника и плавающую мину (или тонущего товарища) — пик тактики.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://divinityoriginalsin2.wiki.fextralife.com/file/Divinity-Original-Sin-2/bull_horns.png\" alt=\"Bull Horns\"><div><b>Bull Horns (Bull Rush)<\/b><small>Временная стойка: даёт повторяемый таран-пролёт сквозь строй каждые несколько секунд.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://divinityoriginalsin2.wiki.fextralife.com/file/Divinity-Original-Sin-2/tactical_retreat.png\" alt=\"Tactical Retreat\"><div><b>Tactical Retreat<\/b><small>Мгновенный отскок из опасности + краткое ускорение (Haste) для контратаки.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://divinityoriginalsin2.wiki.fextralife.com/file/Divinity-Original-Sin-2/phoenix_dive.png\" alt=\"Phoenix Dive\"><div><b>Phoenix Dive<\/b><small>Рывок в гущу врагов с огненным кольцом на финише, которое тут же поджигает нефть.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://divinityoriginalsin2.wiki.fextralife.com/file/Divinity-Original-Sin-2/chameleon_cloak.png\" alt=\"Chameleon Cloak\"><div><b>Chameleon Cloak<\/b><small>Невидимость до первого выстрела — идеально для захода в борт или выхода из фокуса.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://divinityoriginalsin2.wiki.fextralife.com/file/Divinity-Original-Sin-2/uncanny_evasion.png\" alt=\"Uncanny Evasion\"><div><b>Uncanny Evasion<\/b><small>Краткое окно 90 % уклонения — в аркаде работает как магнитный отклонитель ракет.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://divinityoriginalsin2.wiki.fextralife.com/file/Divinity-Original-Sin-2/living_on_the_edge.png\" alt=\"Living on the Edge\"><div><b>Living on the Edge<\/b><small>Неуязвимость к гибели на пару секунд — аналог Shallow Grave для спасения товарища.<\/small><\/div><\/div>\n<\/div>\n\n1. **Бесклассовая система «слотов памяти» (Memory) — 1-в-1 наша верфь.**\n   В DOS2 нет жёстких классов: есть 10 школ умений, и любой герой может смешать *Аэротеургию* (телепорт/молнии) с *Пирокинетикой* (огонь) и *Военным делом* (таран), упираясь только в число **ячеек памяти**. У нас ровно так же работают **места под снаряжение (`GearPlaces`) на корпусе** ([Лодка](../gameplay/boat.md)) — игрок свободно комбинирует «дым + гарпун + ремонтный буй» на одном корпусе без классовой тюрьмы.\n2. **Поверхности и цепные реакции прямо на воде.**\n   Вся наша игра происходит на воде, и в коде уже есть **нефтяные пятна** (`game/areas/Slicks.cs`, `Spill.cs`), **дым** (`Smoke.cs`), **пожар** (`Burn.cs`) и **грозы** (`game/storms/Lightning.cs`)! DOS2 учит главному фокусу: когда 4 простые среды реагируют друг с другом по понятным правилам, **умения умножаются без роста числа кнопок**:\n\n<figure class=\"sk-svg\">\n<svg viewBox=\"0 0 900 235\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Матрица морских реакций поверхностей в духе Divinity: Original Sin 2 и Baldur's Gate 3\">\n  <rect x=\"8\" y=\"8\" width=\"884\" height=\"219\" rx=\"12\" fill=\"#0d313b\" stroke=\"#2c7a88\" stroke-width=\"1.4\"/>\n  <text x=\"450\" y=\"34\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"14\" fill=\"#e7f6f6\">ХИМИЯ МОРЯ (УРОК DOS2 &amp; BG3): КАК 4 СРЕДЫ УМНОЖАЮТ УМЕНИЯ БЕЗ ЛИШНИХ КНОПОК<\/text>\n\n  <!-- Reaction 1 -->\n  <rect x=\"22\" y=\"52\" width=\"202\" height=\"158\" rx=\"9\" fill=\"#134552\" stroke=\"#ef8b2c\" stroke-width=\"1.7\"/>\n  <text x=\"123\" y=\"75\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"13\" fill=\"#ffd29d\">НЕФТЬ + ОГОНЬ<\/text>\n  <text x=\"123\" y=\"96\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">Нефтяной шлейф (Slicks)<\/text>\n  <text x=\"123\" y=\"111\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">+ любая ракета / взрыв<\/text>\n  <line x1=\"42\" y1=\"124\" x2=\"204\" y2=\"124\" stroke=\"#ef8b2c\" stroke-opacity=\"0.5\"/>\n  <text x=\"123\" y=\"144\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#f5a04f\">→ ОГНЕННОЕ МОРЕ<\/text>\n  <text x=\"123\" y=\"164\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#c7e5ea\">Мгновенная детонация всей<\/text>\n  <text x=\"123\" y=\"179\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#c7e5ea\">полосы + горение корпусов<\/text>\n  <text x=\"123\" y=\"198\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" fill=\"#ffd29d\">Минёр + Залп (кооп)<\/text>\n\n  <!-- Reaction 2 -->\n  <rect x=\"240\" y=\"52\" width=\"202\" height=\"158\" rx=\"9\" fill=\"#134552\" stroke=\"#63d1db\" stroke-width=\"1.7\"/>\n  <text x=\"341\" y=\"75\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"13\" fill=\"#63d1db\">МОРЕ / ДОЖДЬ + ИСКРА<\/text>\n  <text x=\"341\" y=\"96\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">Шторм / волна от рывка<\/text>\n  <text x=\"341\" y=\"111\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">+ Цепная искра / Тесла<\/text>\n  <line x1=\"260\" y1=\"124\" x2=\"422\" y2=\"124\" stroke=\"#63d1db\" stroke-opacity=\"0.5\"/>\n  <text x=\"341\" y=\"144\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#7be8f2\">→ ЭЛЕКТРО-ПЯТНО<\/text>\n  <text x=\"341\" y=\"164\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#c7e5ea\">Дуга бьёт дальше в дождь,<\/text>\n  <text x=\"341\" y=\"179\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#c7e5ea\">глушит моторы роя на 1 с<\/text>\n  <text x=\"341\" y=\"198\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" fill=\"#63d1db\">Погода (Storm) + Контроль<\/text>\n\n  <!-- Reaction 3 -->\n  <rect x=\"458\" y=\"52\" width=\"202\" height=\"158\" rx=\"9\" fill=\"#134552\" stroke=\"#a8d5dc\" stroke-width=\"1.7\"/>\n  <text x=\"559\" y=\"75\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"13\" fill=\"#e7f6f6\">ПОЖАР + ВОЛНА<\/text>\n  <text x=\"559\" y=\"96\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">Горящая нефть / взрыв<\/text>\n  <text x=\"559\" y=\"111\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">+ Встречная волна / Вал<\/text>\n  <line x1=\"478\" y1=\"124\" x2=\"640\" y2=\"124\" stroke=\"#a8d5dc\" stroke-opacity=\"0.5\"/>\n  <text x=\"559\" y=\"144\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#d9f2f5\">→ ОБЛАКО ПАРА (ДЫМ)<\/text>\n  <text x=\"559\" y=\"164\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#c7e5ea\">Тушит огонь и мгновенно<\/text>\n  <text x=\"559\" y=\"179\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#c7e5ea\">прячет лодки от захвата!<\/text>\n  <text x=\"559\" y=\"198\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" fill=\"#a8d5dc\">Smoke.cs уже умеет это<\/text>\n\n  <!-- Reaction 4 -->\n  <rect x=\"676\" y=\"52\" width=\"202\" height=\"158\" rx=\"9\" fill=\"#134552\" stroke=\"#c39bff\" stroke-width=\"1.7\"/>\n  <text x=\"777\" y=\"75\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"13\" fill=\"#d8beff\">ДЫМ / ПАР + ИСКРА<\/text>\n  <text x=\"777\" y=\"96\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">Дымовая завеса врага<\/text>\n  <text x=\"777\" y=\"111\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#e7f6f6\">+ Электро-заряд / Буй<\/text>\n  <line x1=\"696\" y1=\"124\" x2=\"858\" y2=\"124\" stroke=\"#c39bff\" stroke-opacity=\"0.5\"/>\n  <text x=\"777\" y=\"144\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#d8beff\">→ ГРОЗОВОЕ ОБЛАКО<\/text>\n  <text x=\"777\" y=\"164\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#c7e5ea\">Бьёт дымовой рой внутри<\/text>\n  <text x=\"777\" y=\"179\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#c7e5ea\">его же собственной завесы<\/text>\n  <text x=\"777\" y=\"198\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" fill=\"#d8beff\">Контра против Дым-роя<\/text>\n<\/svg>\n<figcaption>Рис. 1. Четыре цепные реакции на воде в духе Divinity: Original Sin 2 и Baldur's Gate 3, опирающиеся на уже существующие Slicks.cs, Burn.cs, Smoke.cs и Storm.<\/figcaption>\n<\/figure>\n\n3. **Гибридные умения (Skill Crafting).**\n   В DOS2 скрещивание двух книг навыков (например, *Военное дело + Пирокинетика* → *Sparking Swings*; *Геомантия + Пирокинетика* → *Explosive Trap*) рождает неожиданные билды. У нас тот же эффект достигается дёшево: если на лодке стоят два совместимых модуля (например, **Мины + Магнит** → *Самоподтягивающиеся мины*; **Дым + Ремонтный буй** → *Целебный туман*), открывается синергия.\n4. **Что НЕ брать из DOS2:** **раздельные полоски Физической и Магической брони**. Это самая спорная механика DOS2 — она заставляет кооп-команду собираться «либо все в физику, либо все в магию», чтобы не бить разные полоски. В Floppa должна остаться **одна единая броня/прочность** ([Броня](../gameplay/armour.md)), чтобы любая сборка помогала любому товарищу.\n\n### Baldur's Gate 3 — реакции, концентрация, толкание и ритм выхода в море\n\n<div class=\"sk-strip\">\n  <div class=\"sk-chip\"><img src=\"https://bg3.wiki/w/images/8/83/Counterspell.webp\" alt=\"Counterspell\"><div><b>Counterspell (Реакция)<\/b><small>Прерывание чужого залпа или ульты в момент замаха — в аркаде это окно парирования.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://bg3.wiki/w/images/d/da/Thunderwave.webp\" alt=\"Thunderwave\"><div><b>Thunderwave (Толкание)<\/b><small>Мощная волна отбрасывает врагов на скалы, мели или прямо на твои плавучие мины.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://bg3.wiki/w/images/6/6f/Shield_Shove.webp\" alt=\"Shield Shove\"><div><b>Shove / Shield Bash<\/b><small>Физический толчок-срыв: сбить охотника с курса тарана или впечатать в стену форта.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://bg3.wiki/w/images/1/18/Misty_Step.webp\" alt=\"Misty Step\"><div><b>Misty Step (Умение с предмета)<\/b><small>Самый любимый скилл BG3: часто приходит от сапог/амулета, а не от класса!<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://bg3.wiki/w/images/e/ed/Spirit_Guardians.webp\" alt=\"Spirit Guardians\"><div><b>Spirit Guardians (Концентрация)<\/b><small>Сияющая аура урона вокруг себя: работает долго, пока враг не собьёт концентрацию.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://bg3.wiki/w/images/d/d0/Hellish_Rebuke.webp\" alt=\"Hellish Rebuke\"><div><b>Hellish Rebuke (Реакция)<\/b><small>Мгновенный огненный ответ по тому, кто только что попал в тебя — мечта танка.<\/small><\/div><\/div>\n  <div class=\"sk-chip\"><img src=\"https://bg3.wiki/w/images/0/05/Activate_Call_Lightning.webp\" alt=\"Call Lightning\"><div><b>Call Lightning (Повтор на концентрации)<\/b><small>Включил шторм один раз и 3 раза подряд бьёшь молнией, пока держишь концентрацию.<\/small><\/div><\/div>\n<\/div>\n\n1. **Реакции (Reactions) — идеальный мост к нашему парированию и уклонению.**\n   В BG3 самые захватывающие моменты боя — когда игра спрашивает: *«Враг кастует Огненный шар — сбить Counterspell? В тебя попали — ответить Hellish Rebuke?»*. В аркаде без пауз это превращается в **мгновенные реактивные окна**: увернулся рывком от ракеты или отразил её — на 2,5 с загорается бесплатный *Ответный залп* или *Электро-волна* (сочетается с проками Classic WoW).\n2. **Толкание и убийство окружением (Shove / Throw / Thunderwave).**\n   BG3 доказала, что **оттолкнуть врага в пропасть или бочку с порохом веселее, чем просто снять 30 % HP**. У нас на море есть острова, скалы, мели, минные поля, нефть и стены форта: если *Встречная волна*, *Гарпун* и *Таран* умеют **впечатывать охотника в остров с доп. уроном и оглушением** или **выталкивать его на свои же мины**, рельеф карты ([Рельеф](../world/ground.md)) становится оружием!\n3. **Концентрация (Concentration) — честная цена за сильные ауры и ульты.**\n   В BG3 нельзя включить *Haste*, *Spirit Guardians* и *Wall of Fire* разом — на персонаже висит **ровно одна Концентрация**, и сильный удар может её сбить. Для Floppa это идеальный балансир для мощных длительных умений (*Шанти-горн*, *Тесла-катушка*, *Грозовая туча*, *Водоворот*): пока ты маневрируешь чисто — эффект держится 10–12 с; пропустил торпеду или таран — концентрация сорвана! Это работает и против врагов-боссов.\n4. **Умения от снаряжения + ритм «выход в море → причал» (Short / Long Rest).**\n   Половина культовых сборок BG3 держится не на классе, а на **вещах с активным скиллом** (сапоги с *Misty Step*, посох с *Chain Lightning*, стрелы со спецэффектами) — это напрямую подтверждает нашу ставку на **модули верфи (`GearPlaces`) и диковины старьёвщика (`Curios.cs`)**. А разделение BG3 на «бесконечные заговоры / короткий привал / длинный привал» подсказывает красивый ритм вылазок:\n   - *Базовое оружие (Q/E, турель)* — без ограничений (как Cantrips);\n   - *Тактические модули* — перезарядка 10–25 с (как Short Rest / бой);\n   - *Особые заряды / диковины / мощнейшие ульты* — запас зарядов на вылазку, который восполняется при швартовке в [гавани](../base/pier.md), на [станции](../world/outpost.md) или [припасами в море](../gameplay/pickups.md) (как Long Rest).\n\n### Что НЕ брать из DOS2 и BG3\n\n| Ловушка Larian (DOS2 / BG3) | Почему она вредна для Floppa Tropical Adventures |\n|---|---|\n| Пошаговая пауза и очки действий (AP) | У нас [онлайн-кооп без паузы мира](../online.md) и динамика моторной лодки. Всё должно работать в реальном времени. |\n| Раздельная Физ. и Маг. броня (DOS2) | Разрывает кооп-команду на несовместимые типы урона. Оставляем единую броню/корпус. |\n| «Огонь везде на всём экране» (проклятый некроогонь DOS2) | В DOS2 к концу боя весь экран горит и нечитаем. На нашем море пятна нефти/пара должны быть **компактными, короткими (5–8 с) и высококонтрастными**. |\n| Промахи по броску d20 и 60 слотов заклинаний (BG3) | Если игрок честно навёл гарпун или волну рулём — он **должен попасть**, никаких промахов по кубику и никаких 4 рядов панелей. |\n\n---\n\n## Архитектура системы умений для Floppa Tropical Adventures\n\nКак объединить боевую чёткость Dota 2, прогрессию Classic WoW, химию моря DOS2, реакции " font-weight=\"900\" font-size=\"17\" fill=\"currentColor\">FLOPPA HYBRID<\/text>\n  <text x=\"450\" y=\"72\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11.5\" fill=\"currentColor\" opacity=\"0.78\">Свободная верфь + глубина боя<\/text>\n\n  <rect x=\"326\" y=\"88\" width=\"248\" height=\"46\" rx=\"7\" fill=\"rgba(255,255,255,0.08)\" stroke=\"#ef8b2c\" stroke-width=\"1.2\"/>\n  <text x=\"338\" y=\"107\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">1. Пассивка корпуса (Innate)<\/text>\n  <text x=\"338\" y=\"124\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.8\" fill=\"currentColor\" opacity=\"0.85\">Своё правило хода + прок-окна (WoW/BG3)<\/text>\n\n  <rect x=\"326\" y=\"142\" width=\"248\" height=\"52\" rx=\"7\" fill=\"rgba(255,255,255,0.08)\" stroke=\"#ef8b2c\" stroke-width=\"1.2\"/>\n  <text x=\"338\" y=\"161\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">2. 2–3 Модуля + 1 Ульта (GearPlaces)<\/text>\n  <text x=\"338\" y=\"177\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.8\" fill=\"currentColor\" opacity=\"0.85\">Как слоты памяти DOS2 и вещи BG3:<\/text>\n  <text x=\"338\" y=\"189\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.8\" fill=\"currentColor\" opacity=\"0.85\">с весом, кд (без GCD) и модификаторами A/B<\/text>\n\n  <rect x=\"326\" y=\"202\" width=\"248\" height=\"52\" rx=\"7\" fill=\"rgba(255,255,255,0.08)\" stroke=\"#ef8b2c\" stroke-width=\"1.2\"/>\n  <text x=\"338\" y=\"221\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">3. Химия моря + Толкание + Конц.<\/text>\n  <text x=\"338\" y=\"237\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.8\" fill=\"currentColor\" opacity=\"0.85\">Нефть/пар/ток на воде, удары о скалы,<\/text>\n  <text x=\"338\" y=\"249\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.8\" fill=\"currentColor\" opacity=\"0.85\">сильные ауры сбиваются тяжёлым ударом<\/text>\n\n  <rect x=\"326\" y=\"262\" width=\"248\" height=\"44\" rx=\"7\" fill=\"rgba(8,124,135,0.16)\" stroke=\"#087c87\" stroke-width=\"1.2\"/>\n  <text x=\"338\" y=\"281\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">4. Прицел рулём + Геймпад + Онлайн<\/text>\n  <text x=\"338\" y=\"297\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.8\" fill=\"currentColor\" opacity=\"0.85\">4 бита в Command.Order, всё на хосте<\/text>\n\n  <rect x=\"326\" y=\"314\" width=\"248\" height=\"36\" rx=\"7\" fill=\"rgba(99,226,158,0.14)\" stroke=\"#2aa198\" stroke-width=\"1.2\"/>\n  <text x=\"450\" y=\"336\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11.5\" fill=\"currentColor\">Мягкие роли в коопе · 100 % играбельно соло<\/text>\n\n  <!-- Top-Right: Classic WoW -->\n  <rect x=\"620\" y=\"12\" width=\"268\" height=\"174\" rx=\"10\" fill=\"rgba(106,90,168,0.10)\" stroke=\"#6a5aa8\" stroke-width=\"1.6\"/>\n  <text x=\"754\" y=\"36\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"15\" fill=\"currentColor\">CLASSIC WOW<\/text>\n  <text x=\"634\" y=\"59\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">• Переломные узлы талантов<\/text>\n  <text x=\"634\" y=\"79\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">• Реактивные проки (Overpower)<\/text>\n  <text x=\"634\" y=\"99\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">• Разный ритм ресурсов (Накал/Заряд)<\/text>\n  <text x=\"634\" y=\"119\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">• Мягкая кооп-триада и тотемы<\/text>\n  <rect x=\"632\" y=\"134\" width=\"244\" height=\"40\" rx=\"6\" fill=\"rgba(180,60,60,0.12)\" stroke=\"#c95252\" stroke-opacity=\"0.45\"/>\n  <text x=\"642\" y=\"151\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#c95252\">Режем:<\/text>\n  <text x=\"688\" y=\"151\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"currentColor\" opacity=\"0.85\">30 кнопок, GCD 1,5 с,<\/text>\n  <text x=\"642\" y=\"166\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"currentColor\" opacity=\"0.85\">долгий каст стоя и +1 % статов<\/text>\n\n  <!-- Bottom-Right: BG3 -->\n  <rect x=\"620\" y=\"202\" width=\"268\" height=\"174\" rx=\"10\" fill=\"rgba(210,120,60,0.10)\" stroke=\"#d2783c\" stroke-width=\"1.6\"/>\n  <text x=\"754\" y=\"226\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"15\" fill=\"currentColor\">BALDUR'S GATE 3<\/text>\n  <text x=\"634\" y=\"249\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">• Реакции (Counterspell / Rebuke)<\/text>\n  <text x=\"634\" y=\"269\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">• Толкание в скалы и мины (Shove)<\/text>\n  <text x=\"634\" y=\"289\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">• Концентрация на сильных аурах<\/text>\n  <text x=\"634\" y=\"309\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"currentColor\">• Скиллы от вещей + ритм вылазки<\/text>\n  <rect x=\"632\" y=\"324\" width=\"244\" height=\"40\" rx=\"6\" fill=\"rgba(180,60,60,0.12)\" stroke=\"#c95252\" stroke-opacity=\"0.45\"/>\n  <text x=\"642\" y=\"341\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#c95252\">Режем:<\/text>\n  <text x=\"688\" y=\"341\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"currentColor\" opacity=\"0.85\">пошаг, промахи по d20,<\/text>\n  <text x=\"642\" y=\"356\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"currentColor\" opacity=\"0.85\">60 кнопок и учёт ячеек магии<\/text>\n\n  <!-- Connecting arrows -->\n  <line x1=\"280\" y1=\"110\" x2=\"308\" y2=\"132\" stroke=\"#087c87\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/>\n  <line x1=\"280\" y1=\"282\" x2=\"308\" y2=\"258\" stroke=\"#087c87\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/>\n  <line x1=\"620\" y1=\"110\" x2=\"592\" y2=\"132\" stroke=\"#087c87\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/>\n  <line x1=\"620\" y1=\"282\" x2=\"592\" y2=\"258\" stroke=\"#087c87\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/>\n<\/svg>\n<figcaption>Рис. 2. Как четыре системы — Dota 2, Classic WoW, Divinity: Original Sin 2 и Baldur's Gate 3 — складываются в гибрид для Floppa Tropical Adventures.<\/figcaption>\n<\/figure>\n\n### Откуда берутся умения: три варианта на выбор владельца\n\nВладелец решил, что игрок **собирает лодку из деталей на верфи**, а не выбирает запертый класс ([Сборки](../gameplay/builds.md), [Верфь](../base/boatyard.md)). Значит, умения должны дружить с верфью:\n\n| Вариант | Как устроено | Плюсы | Минусы |\n|---|---|---|---|\n| **А. Модули верфи (Рекомендуем)** | У каждого корпуса уже есть `GearPlaces` (1–3 места на малых/средних корпусах + 1 место «Коронный модуль» на старших). Дым, Гарпун, Ремонтный буй, Нефтяной шлейф — это физические детали на палубе с весом и ценой. | 100 % ложится в существующую верфь; деталь видно прямо на корпусе лодки (силуэт врага сразу читается!); вес честно торгуется со скоростью. | Чтобы сменить стиль, нужно зайти в гавань; на стартовом маленьком ялике влезет только 1–2 умения. |\n| **Б. Ветка капитана (как WoW)** | Верфь отвечает за железо (корпус/мотор/оружие), а у капитана-флоппы есть 3 ветки навыков (**Штурм / Тактика / Поддержка**), в которые он вкладывает очки за выполненные поручения. | Даёт долгосрочный RPG-прогресс и выбор «кем я хочу быть» даже на одной и той же лодке; не утяжеляет корпус. | Появляется новый большой экран интерфейса (таланты); по виду лодки в море не сразу понятно, какие умения на ней стоят. |\n| **В. Гибрид «Модуль + 2 модификатора»** | Базовое умение даёт **деталь верфи** (как в А), но при покупке улучшения или за выполнение поручений игрок выбирает **1 из 2 переломных вариантов** (как Facets / Shard в Dota 2 или ключевой талант WoW). | Сохраняет физичность верфи и добавляет глубину билдостроения (например, *Дым* → **Целебный туман** или **Слепящий смог**; *Гарпун* → **Тянет врага** или **Тянет тебя к врагу**). | Чуть сложнее интерфейс карточки на верфи (нужен переключатель A/B). |\n\n**Рекомендация:** начать с **Варианта А** (прототип поверх `GearPlaces` и существующей верфи), а на этапе Раннего доступа расширить до **Варианта В** (по 2 переломных модификатора на каждый модуль + 1 врождённая пассивка у каждого типа корпуса).\n\n### Как целятся умения без слома «целятся рулём»\n\nГлавное ограничение нашей игры: **игрок не водит курсором по воде, чтобы кликать по точкам** — он правит рулём и играет в том числе с геймпада ([Прицел и захват](../gameplay/aiming.md)). Все 127 героев Dota 2 и 9 классов WoW сводятся к **шести простым геометриям на воде**, ни одна из которых не требует мыши:\n\n<figure class=\"sk-svg\">\n<svg viewBox=\"0 0 900 370\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Шесть геометрий прицеливания умений на воде\">\n  <!-- Panel 1: Self / Aura -->\n  <g transform=\"translate(15,15)\">\n    <rect width=\"280\" height=\"162\" rx=\"9\" fill=\"#0d3b46\" stroke=\"#2c7a88\" stroke-width=\"1.3\"/>\n    <circle cx=\"140\" cy=\"86\" r=\"54\" fill=\"rgba(60,195,206,0.16)\" stroke=\"#3cc3ce\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n    <circle cx=\"140\" cy=\"86\" r=\"28\" fill=\"rgba(60,195,206,0.18)\" stroke=\"#3cc3ce\" stroke-width=\"1.2\"/>\n    <path d=\"M140 62 L152 96 L140 105 L128 96 Z\" fill=\"#f5a04f\" stroke=\"#fff\" stroke-width=\"1.4\"/>\n    <text x=\"140\" y=\"23\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#e7f6f6\">1. Вокруг корпуса (Аура / Волна)<\/text>\n    <text x=\"140\" y=\"151\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#a8d5dc\">Щит, Таунт, Ravage, Шрапнель, Буй<\/text>\n  <\/g>\n  <!-- Panel 2: Bow / Stern Vector -->\n  <g transform=\"translate(310,15)\">\n    <rect width=\"280\" height=\"162\" rx=\"9\" fill=\"#0d3b46\" stroke=\"#2c7a88\" stroke-width=\"1.3\"/>\n    <!-- Oil trail behind -->\n    <path d=\"M74 110 Q50 120 32 104\" fill=\"none\" stroke=\"#ef8b2c\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\"0.55\"/>\n    <!-- Harpoon ahead -->\n    <line x1=\"158\" y1=\"86\" x2=\"252\" y2=\"86\" stroke=\"#63d1db\" stroke-width=\"3\" stroke-dasharray=\"7 4\"/>\n    <polygon points=\"256,86 244,79 244,93\" fill=\"#63d1db\"/>\n    <!-- Boat pointing right -->\n    <path d=\"M164 86 L126 73 L116 86 L126 99 Z\" fill=\"#f5a04f\" stroke=\"#fff\" stroke-width=\"1.4\"/>\n    <text x=\"58\" y=\"90\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10\" fill=\"#ffd29d\">Шлейф<\/text>\n    <text x=\"208\" y=\"75\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10\" fill=\"#b4f0f5\">Гарпун / Волна<\/text>\n    <text x=\"140\" y=\"23\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#e7f6f6\">2. По носу или за кормой<\/text>\n    <text x=\"140\" y=\"151\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#a8d5dc\">Целится рулём: Гарпун, Нефть, Ghostship<\/text>\n  <\/g>\n  <!-- Panel 3: Broadside Arc -->\n  <g transform=\"translate(605,15)\">\n    <rect width=\"280\" height=\"162\" rx=\"9\" fill=\"#0d3b46\" stroke=\"#2c7a88\" stroke-width=\"1.3\"/>\n    <path d=\"M140 86 L192 40 A72 72 0 0 1 192 132 Z\" fill=\"rgba(239,139,44,0.28)\" stroke=\"#f5a04f\" stroke-width=\"1.8\"/>\n    <path d=\"M140 86 L88 40 A72 72 0 0 0 88 132 Z\" fill=\"rgba(239,139,44,0.14)\" stroke=\"#f5a04f\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n    <path d=\"M140 60 L152 94 L140 105 L128 94 Z\" fill=\"#f5a04f\" stroke=\"#fff\" stroke-width=\"1.4\"/>\n    <text x=\"140\" y=\"23\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#e7f6f6\">3. Веер борта (Как ракеты)<\/text>\n    <text x=\"140\" y=\"151\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#a8d5dc\">Волна отброса, Бортовой щит, Flak<\/text>\n  <\/g>\n  <!-- Panel 4: Auto-Lock Target -->\n  <g transform=\"translate(15,193)\">\n    <rect width=\"280\" height=\"162\" rx=\"9\" fill=\"#0d3b46\" stroke=\"#2c7a88\" stroke-width=\"1.3\"/>\n    <!-- Player -->\n    <path d=\"M74 102 L56 80 L44 88 L52 108 Z\" fill=\"#f5a04f\" stroke=\"#fff\" stroke-width=\"1.4\"/>\n    <!-- Locked Enemy -->\n    <circle cx=\"210\" cy=\"78\" r=\"24\" fill=\"rgba(225,75,75,0.22)\" stroke=\"#ff6b6b\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/>\n    <path d=\"M220 72 L202 88 L196 80 L212 66 Z\" fill=\"#ff6b6b\" stroke=\"#fff\" stroke-width=\"1.2\"/>\n    <!-- Arc projectile -->\n    <path d=\"M70 92 Q140 42 198 76\" fill=\"none\" stroke=\"#ffd166\" stroke-width=\"2.4\" stroke-dasharray=\"5 4\"/>\n    <text x=\"140\" y=\"23\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#e7f6f6\">4. По захваченной цели (Auto-Lock)<\/text>\n    <text x=\"140\" y=\"151\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#a8d5dc\">Метка Track, Glimpse, Цепь, Арт-удар<\/text>\n  <\/g>\n  <!-- Panel 5: Smart Ally Lock -->\n  <g transform=\"translate(310,193)\">\n    <rect width=\"280\" height=\"162\" rx=\"9\" fill=\"#0d3b46\" stroke=\"#2c7a88\" stroke-width=\"1.3\"/>\n    <!-- Player -->\n    <path d=\"M88 94 L62 84 L54 96 L64 106 Z\" fill=\"#f5a04f\" stroke=\"#fff\" stroke-width=\"1.4\"/>\n    <!-- Ally -->\n    <circle cx=\"206\" cy=\"84\" r=\"22\" fill=\"rgba(99,226,158,0.18)\" stroke=\"#63e29e\" stroke-width=\"2\"/>\n    <path d=\"M216 84 L196 75 L190 84 L196 93 Z\" fill=\"#63e29e\" stroke=\"#fff\" stroke-width=\"1.3\"/>\n    <!-- Tether -->\n    <path d=\"M88 94 Q146 72 190 84\" fill=\"none\" stroke=\"#63e29e\" stroke-width=\"3\"/>\n    <text x=\"142\" y=\"72\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10\" fill=\"#a8f5cb\">Трос / Щит (авто на раненого)<\/text>\n    <text x=\"140\" y=\"23\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#e7f6f6\">5. Умный выбор союзника (Кооп)<\/text>\n    <text x=\"140\" y=\"151\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#a8d5dc\">Трос Io, Клапан Dazzle, Щит на себя в соло<\/text>\n  <\/g>\n  <!-- Panel 6: Hold-to-Charge -->\n  <g transform=\"translate(605,193)\">\n    <rect width=\"280\" height=\"162\" rx=\"9\" fill=\"#0d3b46\" stroke=\"#2c7a88\" stroke-width=\"1.3\"/>\n    <!-- Wide cone fading to narrow long beam -->\n    <path d=\"M90 88 L206 50 L206 126 Z\" fill=\"rgba(99,209,219,0.12)\" stroke=\"#63d1db\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n    <path d=\"M90 88 L252 74 L252 102 Z\" fill=\"rgba(245,160,79,0.32)\" stroke=\"#f5a04f\" stroke-width=\"1.8\"/>\n    <path d=\"M96 88 L64 76 L56 88 L64 100 Z\" fill=\"#f5a04f\" stroke=\"#fff\" stroke-width=\"1.4\"/>\n    <text x=\"140\" y=\"23\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#e7f6f6\">6. Зарядка удержанием на ходу<\/text>\n    <text x=\"140\" y=\"151\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11\" fill=\"#a8d5dc\">Держишь — луч длиннее/сильнее (Кнут/Таран)<\/text>\n  <\/g>\n<\/svg>\n<figcaption>Рис. 3. Шесть способов наведения умений, полностью совместимых с «целятся рулём» и геймпадом (без кликов по воде).<\/figcaption>\n<\/figure>\n\n**Правило для соло-игры:** любое кооп-умение со смарт-выбором союзника (схема 5) при отсутствии напарника в радиусе **автоматически работает на свою лодку** (или на ближайшего дрона/буй). Игрок никогда не получает «мёртвую кнопку» в одиночном плавании.\n\n### Управление и HUD: как уместить всё без визуального шума\n\nСейчас в игре клавиши распределены так ([Управление](../interface/controls.md)): `W A S D` руль, `Shift` нитро, `Q / E` и ЛКМ огонь, `C` смена оружия, `F` дым, `1–4` расходники, `5` диковина, `R` радио, `Space` действие, `M` карта.\n\nЕсли мы вводим **3 активных слота умений + 1 Коронный приём (Ульта)**, главная ошибка — приклеить сбоку вторую панель кнопок. Вместо этого:\n- **Дым (`F`) перестаёт быть особенной клавишей и становится просто одним из умений** (модуль «Дымогенератор», который можно поставить в слот умения 1 — а можно заменить на Щит или Нырок!).\n- **Расходники `1–4` и умения:**\n  - *Клавиатура:* **`F` (Умение 1 — защита/дым)**, **`R` или ПКМ (Умение 2 — тактика/гарпун/нефть; радио уходит на `T`)**, **`X` или `V` (Ульта / Коронный приём)** — либо альтернативно перенести умения на **`1`, `2`, `3`, `4`** (золотой стандарт WoW/MOBA!), а расходники свести в одну умную кнопку **`G`** (ремкомплект) + **`5`** (диковина), так как в бою редко жмут 4 разных расходника разом.\n  - *Геймпад:* левый стик руль, `LT` нитро, `LB`/`RB` или `RT` огонь, **`X` / `Y` / `B` — три умения**, **`A` — действие у причала/буя**, **`LB + RB` (или `Y` с удержанием) — Ульта**, крестовина `D-Pad` — расходники и смена оружия.\n- **Проки (как в Classic WoW):** когда игрок чисто уворачивается рывком от ракеты или парирует ракету, нужная ячейка на HUD вспыхивает оранжевой рамкой (цвет акцента `--sun` из `Hue.cs`) и звучит короткий звонкий сигнал.\n\n<figure class=\"sk-svg\">\n<svg viewBox=\"0 0 900 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Макет нижней панели HUD и раскладки геймпада для умений\">\n  <!-- Sea backdrop -->\n  <rect x=\"10\" y=\"10\" width=\"880\" height=\"210\" rx=\"12\" fill=\"#0b313b\" stroke=\"#2c7a88\" stroke-width=\"1.4\"/>\n  <text x=\"30\" y=\"36\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#a8d5dc\">МАКЕТ НИЖНЕЙ ЧАСТИ HUD (В СТИЛЕ СТЕКЛА LOOK.TRES)<\/text>\n\n  <!-- Left: Kits / Hold -->\n  <rect x=\"26\" y=\"128\" width=\"166\" height=\"72\" rx=\"10\" fill=\"rgba(255,255,255,0.08)\" stroke=\"#3cc3ce\" stroke-opacity=\"0.45\"/>\n  <text x=\"109\" y=\"146\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#a8d5dc\">РАСХОДНИКИ / ДИКОВИНА<\/text>\n  <rect x=\"38\" y=\"156\" width=\"32\" height=\"32\" rx=\"6\" fill=\"#143f4a\" stroke=\"#63d1db\" stroke-opacity=\"0.6\"/>\n  <text x=\"54\" y=\"177\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"12\" fill=\"#e7f6f6\">1<\/text>\n  <rect x=\"76\" y=\"156\" width=\"32\" height=\"32\" rx=\"6\" fill=\"#143f4a\" stroke=\"#63d1db\" stroke-opacity=\"0.6\"/>\n  <text x=\"92\" y=\"177\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"12\" fill=\"#e7f6f6\">2<\/text>\n  <rect x=\"114\" y=\"156\" width=\"32\" height=\"32\" rx=\"6\" fill=\"#143f4a\" stroke=\"#63d1db\" stroke-opacity=\"0.6\"/>\n  <text x=\"130\" y=\"177\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"12\" fill=\"#e7f6f6\">3<\/text>\n  <rect x=\"152\" y=\"156\" width=\"32\" height=\"32\" rx=\"6\" fill=\"#2a3548\" stroke=\"#f5a04f\" stroke-opacity=\"0.7\"/>\n  <text x=\"168\" y=\"177\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"12\" fill=\"#ffd29d\">5<\/text>\n\n  <!-- Center: Active Skills Bar -->\n  <rect x=\"218\" y=\"72\" width=\"440\" height=\"128\" rx=\"12\" fill=\"rgba(12,35,42,0.82)\" stroke=\"#3cc3ce\" stroke-width=\"1.6\"/>\n  <text x=\"438\" y=\"92\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11.5\" fill=\"#63d1db\">ПАНЕЛЬ УМЕНИЙ ЛОДКИ (1 ПАССИВКА + 3 АКТИВНЫХ + 1 УЛЬТА)<\/text>\n\n  <!-- Innate Passive -->\n  <rect x=\"234\" y=\"108\" 00\" font-size=\"9.5\" fill=\"#f5a04f\">ПРОК ×2!<\/text>\n  <rect x=\"384\" y=\"150\" width=\"24\" height=\"13\" rx=\"3\" fill=\"#2b1600\"/><text x=\"396\" y=\"160\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"9\" fill=\"#ffd29d\">ПКМ<\/text>\n  <rect x=\"418\" y=\"150\" width=\"22\" height=\"13\" rx=\"3\" fill=\"#2b1600\"/><text x=\"429\" y=\"160\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"9.5\" fill=\"#ffd29d\">Y<\/text>\n  <text x=\"412\" y=\"182\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10\" fill=\"#f5a04f\">Тактика<\/text>\n\n  <!-- Skill 3: On cooldown -->\n  <rect x=\"456\" y=\"106\" width=\"64\" height=\"60\" rx=\"8\" fill=\"#10252b\" stroke=\"#45656d\" stroke-width=\"1.5\"/>\n  <text x=\"488\" y=\"131\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"17\" fill=\"#89adb5\">6.4<\/text>\n  <text x=\"488\" y=\"145\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"9.5\" fill=\"#89adb5\">Нефть<\/text>\n  <rect x=\"460\" y=\"150\" width=\"22\" height=\"13\" rx=\"3\" fill=\"#081a1f\"/><text x=\"471\" y=\"160\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"9.5\" fill=\"#89adb5\">R<\/text>\n  <rect x=\"494\" y=\"150\" width=\"22\" height=\"13\" rx=\"3\" fill=\"#081a1f\"/><text x=\"505\" y=\"160\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"9.5\" fill=\"#89adb5\">B<\/text>\n  <text x=\"488\" y=\"182\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10\" fill=\"#a8d5dc\">Откат<\/text>\n\n  <!-- Ultimate -->\n  <rect x=\"540\" y=\"101\" width=\"102\" height=\"66\" rx=\"10\" fill=\"#1d3648\" stroke=\"#ef8b2c\" stroke-width=\"2.2\"/>\n  <text x=\"591\" y=\"124\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"12\" fill=\"#ffd29d\">ГЛУБИННЫЙ<\/text>\n  <text x=\"591\" y=\"139\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"900\" font-size=\"12\" fill=\"#ffd29d\">ВАЛ (УЛЬТА)<\/text>\n  <rect x=\"548\" y=\"149\" width=\"26\" height=\"13\" rx=\"3\" fill=\"#0b1f29\"/><text x=\"561\" y=\"159\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"9.5\" fill=\"#ffd29d\">G/X<\/text>\n  <rect x=\"582\" y=\"149\" width=\"52\" height=\"13\" rx=\"3\" fill=\"#0b1f29\"/><text x=\"608\" y=\"159\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"9\" fill=\"#ffd29d\">LB+RB<\/text>\n  <text x=\"591\" y=\"182\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10\" fill=\"#ffd29d\">Коронный (45 с)<\/text>\n\n  <!-- Right: Existing Instrument Cluster -->\n  <rect x=\"684\" y=\"96\" width=\"190\" height=\"104\" rx=\"10\" fill=\"rgba(255,255,255,0.08)\" stroke=\"#3cc3ce\" stroke-opacity=\"0.45\"/>\n  <text x=\"779\" y=\"116\" text-anchor=\"middle\" font-family=\"Nunito, sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#a8d5dc\">КЛАСТЕР ПРИБОРОВ<\/text>\n  <text x=\"779\" y=\"138\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11.5\" fill=\"#e7f6f6\">Корпус · Броня · Нитро (Shift)<\/text>\n  <text x=\"779\" y=\"158\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"11.5\" fill=\"#e7f6f6\">Оружие Q / E · Смена C<\/text>\n  <text x=\"779\" y=\"182\" text-anchor=\"middle\" font-family=\"Noto Sans, sans-serif\" font-size=\"10.5\" fill=\"#63d1db\">Без лишних полосок маны!<\/text>\n<\/svg>\n<figcaption>Рис. 4. Предлагаемое размещение панели умений в HUD: пассивка корпуса, 3 тактических слота (с подсветкой прока) и 1 ульта, с двойными подсказками для клавиатуры и геймпада.<\/figcaption>\n<\/figure>\n\n---\n\n## Каталог 28 умений: как разные скиллы будут работать в бою\n\nНиже — **28 готовых к прототипированию умений** по семи категориям, каждое отобрано после анализа всех 127 героев Dota 2, 9 классов Classic WoW, Divinity: Original Sin 2 и Baldur's Gate 3. Все эффекты проектируются под правило [Боя](../gameplay/combat.md): **никаких «облаков из текстур»** — только чёткие геометрические формы, кольца на воде, тросы, лучи и вспышки, читаемые днём, ночью и в шторм на 1080p.\n\n### 1. Атака и залп (для Преследователя, Турельщика и Бортового залпа)\n\n| Умение | Ориентир | Прицел / КД | Как работает на воде и как читается | Модификаторы A / B (Facet-уровень) |\n|---|---|---|---|---|\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/gyrocopter_flak_cannon.png\" alt=\"Flak\"> **Веерный форсаж** | Gyrocopter *Flak Cannon* | Вокруг / 16 с | Следующие 5 выстрелов турели бьют одновременно по **всем** охотникам в радиусе. Стволы светятся оранжевым, вылетают веерные трассеры. | **A:** +2 залпа, но греет мотор · **B:** сбивает встречные ракеты в радиусе |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/zuus_arc_lightning.png\" alt=\"Arc\"> **Цепная искра** | Zeus *Arc Lightning* / Shaman *Chain Lightning* | Захват цели / 8 с | Электрическая дуга бьёт в захваченного врага и прыгает ещё по 4 ближайшим катеркам. Выжигает рои, но слаба против одиночного босса. | **A:** на 1 с глушит мотор первой цели · **B:** отскакивает до 7 целей с меньшим уроном |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/kunkka_ghostship.png\" alt=\"Ghostship\"> **Залп «Призрак»** | Kunkka *Ghostship* | По носу / 28 с | По курсу носа летит призрачный силуэт торпедного вала: через 2,2 с бьёт в конечную точку широким взрывом и подбрасывает врагов. | **A:** союзники на линии получают +скорость и −30 % урона на 5 с · **B:** два узких вала подряд |\n| <img class=\"sk-ico\" src=\"https://wow.zamimg.com/images/wow/icons/large/spell_nature_windfury.jpg\" alt=\"Windfury\"> **Двойной разряд** | Shaman *Windfury* / Ogre *Multicast* | Пассивка / Прок | После чистого уклонения на нитро или парирования ракеты загорается на 3 с: следующий залп `Q/E` выпускает **двойную пачку ракет** бесплатно. | **A:** срабатывает также от тарана · **B:** удваивает радиус взрыва вместо числа ракет |\n\n### 2. Контроль и перехват (завязка боя и срыв манёвров)\n\n| Умение | Ориентир | Прицел / КД | Как работает на воде и как читается | Модификаторы A / B |\n|---|---|---|---|---|\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/pudge_meat_hook.png\" alt=\"Hook\"> **Гарпун-лебёдка** | Pudge *Meat Hook* + Clockwerk *Hookshot* | По носу / 14 с | Быстрый трос по линии носа. Попал в охотника — притягивает его прямо под твой борт; попал в тонущего товарища — вытягивает из огня! | **A:** тянет *тебя* к цели или острову (Clockwerk) · **B:** длиннее на 35 %, но не тащит союзников |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/grimstroke_soul_chain.png\" alt=\"Soulbind\"> **Якорная цепь** | Grimstroke *Soulbind* + Puck *Dream Coil* | Захват цели / 18 с | Пристёгивает захваченного охотника тросом к соседней лодке (или к ближайшему острову) на 4 с: не могут разойтись, 35 % урона по одному бьёт второго. | **A:** разрыв цепи глушит моторы на 1,5 с · **B:** притягивает обе лодки в столкновение |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/batrider_firefly.png\" alt=\"Firefly\"> **Нефтяной шлейф** | Batrider *Firefly* + Mage *Frost Nova* | За кормой / 15 с | 4 секунды за кормой тянется чёрная полоса нефти (уже есть `Slicks.cs`!): охотники вязнут в ней, а любая ракета поджигает всю полосу целиком. | **A:** густая нефть (сильнее тормозит, не горит) · **B:** горит сразу сама, как огненный след |\n| <img class=\"sk-ico\" src=\"https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/dark_seer_vacuum.png\" al
