асности, станция и буйства ложатся на каждой машине из общего зерна (`Laying`): решают опасности хоста, у гостя они только показаны. Посты, тайники и точки припасов (`Places`) живут только на хосте, а спрятанные посылки у каждого игрока свои ([Онлайн-кооп](../online.md)).\n\nВ мире стоят шесть постов, пять батарей, форт пиратов с их постом, восемь точек припасов, тайники, обстрелы, нефть, бочки, минное поле, круг арены у поста броненосца, станция, четыре буйства, десять спрятанных посылок и шторм, который не уходит. Импульсных башен и прожекторов в нём нет: владельцу они показались странными, башня «толкала» лодку, и их место заняли батареи (решение без владельца, [Q143](../questions/world.md#q143)). Сами виды остались для других карт.\n\n- **Посты охраны** (`Posts`, `Places`): охотники вдоль поста лицом в его сторону или вокруг середины круга лицом наружу ходят у поста и охотятся на ту лодку, которую видят ([Охотники и ИИ](../gameplay/hunters.md)). Пока внутри зоны поста лодка, которую его сторона считает врагом (у банды — лодка игрока или пиратов), или когда бьют одного из его охотников, весь пост берёт ближайшую лодку на любом расстоянии (`Captain.Rouse`). «Вернуться через» (`Post.Every`): столько секунд после гибели последнего охотника пост выводит их заново, но только когда ни одна лодка игрока не видит зону (ближе дальности зрения стражи); 0 — не возвращаются. Почему вне вида: охотники не появляются из воздуха на глазах (решение без владельца, [Q149](../questions/world.md#q149)).\n- **Посты патруля** (`Post.Patrol`, `law/Patrols.cs`): пост, чьи лодки — патруль. Они стоят у поста и никого не трогают, пока лодка игрока не в розыске ([Розыск и патруль](../gameplay/wanted.md)); возвращаются они, как охотники поста.\n- **Минные поля** (`Mines`, `MineModel`): старые рогатые мины на плаву, качающиеся, с красной мигающей лампой, не менее метра глубины. Корпус, коснувшийся мины, или попавший в неё снаряд подрывает её; её взрыв после короткого запала подрывает те, что в досягаемости, так что поле взлетает цепью.\n- **Обстрелы** (`Barrages`, `Warnings`, `Descents`, `FallModel`): пока лодка в нём или рядом, каждые несколько секунд падение, чаще всего на лодку в нём: на воде заполняется красное кольцо, затем снаряд с дымным хвостом или горящая вулканическая бомба, парящая там, где упала, падает в него и разрывается. Почему кольцо: быстрая лодка его читает и уходит. Кольцо читает высоту моря раз в тик и плавно идёт между чтениями, как поплавки; вне вида оно не читается и не рисуется.\n- **Импульсные башни** (`Towers`, `TowerModel`, `PulseRings`, `pulse.gdshader`): старая стальная решётчатая мачта на скале, стеклянный шар которой набухает перед каждым импульсом. Сине-белая стена брызг расширяется до радиуса, медленнее лодки на ходу, с одним или двумя просветами, ставящимися заново при каждом импульсе (`Gap`); корпус, который она пересекает вне просвета, получает удар и отбрасывается наружу.\n- **Посты пиратов** (`Post.Pirates`): пост, чьи лодки — пираты форта ([Форт пиратов](fort.md)); они нападают на любую лодку.\n- **Форт пиратов** (`Fort`, `Forts`): каменный форт на скале с орудием на каждом бастионе; у него своя страница, [Форт пиратов](fort.md).\n- **Батареи** (`Batteries`, `BatteryModel`): ракетная установка охотников на сваях, её пусковая поворачивается к ближайшей лодке, которую считает врагом банда (лодка игрока или пиратов), в досягаемости и бьёт красными залпами с упреждением, с установки, а не с лодки (`Gunnery.Launch`). Снаряды и взрывы разносят её на куски: пусковая падает, и она горит. HUD обводит кольцом стоящую так же, как охотника (`combat/Mark.cs`).\n- **Прожекторы** (`Searchlights`, `SearchlightModel`, `beam.gdshader`): стальная башня, чей луч шарит по кругу. Лодку игрока, на которую он падает, вне дыма, замечают: луч держится на ней красным, HUD предупреждает, поднимаются все посты. Лодку замечают снова лишь после передышки.\n- **Зоны шторма** (`Storm`, `storms/Weather.cs`): шторм, который стоит здесь всегда, с высокими волнами, ливнем и молниями; у него своя страница, [Погода](weather.md).\n- **Нефтяные пятна** (`Slicks`, `Spill`, `oil.gdshader`): тёмная плёнка на море с бочками на плаву в ней. Снаряд, упавший в неё, взрыв бочки или взрыв поджигает её; огонь идёт оттуда, каждая часть горит какое-то время и гаснет, бьёт корпуса, лежащие в ней, и подрывает бочки в ней. Её нефть и огонь — сетка, которую шейдер читает как текстуру. Пятно вне вида не читает море и не пишет текстуру; огонь в нём горит и бьёт как прежде.\n- **Бочки с топливом** (`Drums`, `DrumModel`): красные бочки на плаву. Снаряд, взрыв или корпус и бочка, сошедшиеся резко (таранщик, пролетающий насквозь), взрывают её цепью, как мины; медленный нос толкает её, и она дрейфует, замедляясь.\n- **Основания** (`Footings`): скала башни, сваи батареи, опоры прожектора и корпус станции — стены для корпусов (`ships/Contact.cs`).\n- **Препятствия** (`Obstacles`, `ai/Feelers.cs`): охотники обходят мины (карты и сброшенные лодкой), бочки, горящую нефть и основания.\n- **Тайники** (`Caches`): ящики, названные картой, на плаву вокруг неё и больше нигде не находимые, собираются в трюм.\n- **Точки припасов** (`Depots`): припас своего вида лежит в ней, пока его не возьмут, а через некоторое время появляется другой.\n- **Круги арены** (`Arena`, `Arenas`): круг, внутри которого вид игрока стоит над серединой вместо того, чтобы следовать за лодкой ([Камера и картинка](../gameplay/camera.md)), и откуда первый вход лодки игрока запускает вставку, названную в `Scene`. Это только вид: ни хост, ни бой, ни сеть кругов арены не читают, и на море круг ничего не рисует; редактор рисует его, как остальные зоны.\n- **Станция** (`Outpost`, `Outposts`): плавучая торговая станция, единственная мирная зона; у неё своя страница, [Станция](outpost.md).\n- **Буйства** (`Rampage`, `toys/Rampages.cs`): жетон на воде в точке зоны; радиус — как близко к нему должен пройти борт лодки. Описаны в [Забавах](../gameplay/toys.md).\n- **Спрятанные посылки** (`Package`, `toys/Packages.cs`): посылка на воде в точке зоны, радиус — как у буйства. Номер посылки — её место среди посылок карты. Там же.\n- **Затонувшие тайники** (`activities/Site.cs`, `Wreck`): обломки, отмеченные на карте, хранят названные предметы, которые кран-захват поднимает вместо добычи.\n"}, {"id": "world-fort", "path": "world/fort.md", "title": "Форт пиратов", "section": "world", "date": "2026-11-15", "md": "# Форт пиратов\n\n![Форт пиратов на своей скале, чёрные лодки у ворот](../img/fort.jpg)\n\nПиратский остров: старый каменный форт на скале, чёрные лодки под чёрными парусами и флоппы-пираты вокруг. Форт и его лодки нападают на любую лодку, которая подходит близко.\n\n## Решения владельца\n- 2026-11-14 владелец попросил пиратский остров с чёрными кораблями и пиратами вокруг, который нападает на любого, кто подплывает близко.\n- Пираты — новая сторона, отдельная от банды охотников: форт и его лодки нападают на любую лодку рядом — игроков, рабочие лодки, патруль и банду. Ушедшую далеко от форта не преследуют (2026-11-14).\n- Их корабли — моторные лодки старого мира, переделанные пиратами: мачта и чёрный косой парус над палубой, флаг на топе (2026-11-14).\n- Остров — старый каменный форт на скале: стены, бастионы, батареи, флаг над башней; лодки стоят в бухте под ним (2026-11-14).\n- Пираты — флоппы и сидят на причале, на крышах, у костра и на башне: повязка на глаз, бандана или треуголка, серьга, рваный жилет; чуть крупнее жизни, чтобы читались сверху (2026-11-14).\n\n## Как устроено\n- **Сторона** (`ships/Sides.cs`, `Sides.Pirates`): пираты считают врагом любую лодку не своей стороны, а их врагами считают все, кто вообще воюет: игроки, банда и патруль. Рабочие лодки ни с кем не воюют, но от пиратской лодки, идущей на них, отворачивают, как от лодки игрока (`Voyager`). Что банда и патруль отвечают пиратам — решение без владельца ([Q245](../questions/world.md#q245)).\n- **Форт** (`areas/Forts.cs`, зона `Fort` в файле карты; модель `tools/fort.py` пишет `areas/fort.glb`): стоит на своей скале воротами по курсу зоны, пол двора в трёх метрах над водой. Стены, двор, башня и причал — земля для лодок и снарядов (`World.Ground`), как настилы гавани; бастионы твёрды только для корпусов (`Footings`). Флаг с черепом полощется по пассату, во дворе горит костёр, ночью горят фонари. Модель: звёздный форт из светлого кораллового известняка с заплатами из кирпича и бетона, четыре острых бастиона, донжон с корабельной мачтой, вороньим гнездом и флагом, надвратная башня с чёрными знамёнами с черепом, лестница к причалу на сваях с чёрным яликом; во дворе костёр с вертелом, колодец, пальма, добыча под рваным навесом, навес с двумя солнечными панелями и ветряк на донжоне. Скала — голый камень (`MountainForm`, вершина 2,6 м) под стенами; бастионы выходят над водой, чтобы ракеты их орудий шли чисто. Модель, её состав и скала — решение без владельца ([Q246](../questions/world.md#q246)).\n- **Орудия** (`Batteries.Mount`): на каждом бастионе ракетная установка, как у батареи банды, но пиратская: бьёт по любой лодке ближе дальности ракет и радиуса зоны форта. Снаряды, попавшие в бастион, бьют его орудие; разбитое горит, больше не стреляет и не возвращается. Почему бастионы низкие: ракеты идут над самой водой, и орудие на высокой скале было бы неуязвимым. Решение без владельца ([Q246](../questions/world.md#q246)).\n- **Лодки** (пост с `Pirates`, `areas/Posts.cs`): пост пиратов — тот же пост охраны, только его лодки на стороне пиратов, и весь пост поднимается, когда в его круг заходит любая лодка, которую пираты считают врагом. Ходят теми же ролями, что охотники ([Охотники и ИИ](../gameplay/hunters.md)), и так же высыпают добычу. В мире у ворот форта стоят канонерка, преследователь и два катерка и возвращаются через 150 с после гибели последнего. Решение без владельца ([Q247](../questions/world.md#q247)).\n- **Облик лодок** (`Livery.Pirates`, `Graphic.Pirate` в `LiveryModel`, `OutfitModel.Rig`): дёготно-чёрный борт над тёмно-красным днищем, просмолённая палуба, рваная полоса цвета кости вдоль борта, заплаты дёгтя, череп с костями на скуле. Мачта стоит перед кокпитом, на ней чёрный гафельный парус в заплатах с черепом и костями цвета кости, на топе чёрный флаг с черепом. Парус и флаг вытянуты назад, как от встречного ветра на ходу. Решение без владельца ([Q247](../questions/world.md#q247)).\n- **Флоппы** (`people/Floppa.cs`; модель `tools/floppas.py` пишет `people/floppas.glb`): шесть флопп-пиратов сидят на местах, которые отмечает модель форта (`Seat…`), время от времени поворачивают голову, хвост покачивается. Это первые флоппы в мире ([Люди: флоппы](../art/people.md)). Кто какой — решение без владельца ([Q248](../questions/world.md#q248)).\n- **В мире** (`maps/world.json`): «Скала форта» в пустом северо-восточном углу карты, примерно в 700 м от гавани, воротами к гавани; в водах форта лежит одна из спрятанных посылок. Решение без владельца ([Q247](../questions/world.md#q247)).\n- **Редактор карт**: «+ Форт» ставит форт с курсом его ворот, «+ Пост пиратов» — пост с галочкой `Pirates` ([Редактор карт](../tools/map-editor.md)).\n- **В коопе** форт, его флоппы и орудия встают на каждой машине из файла карты; орудия решает хост, а гости их только показывают ([Онлайн-кооп](../online.md)). Лодки пиратов — лодки хоста.\n\nДемо: `Fort` ([Демо](../tools/demos.md)); лодки пиратов в ряд — `Fleet/Lineup`.\n\n## Открытые вопросы\n- [Q245](../questions/world.md#q245): кто отвечает пиратам.\n- [Q246](../questions/world.md#q246): форт и его орудия.\n- [Q247](../questions/world.md#q247): лодки пиратов, их облик и место форта в мире.\n- [Q248](../questions/world.md#q248): флоппы-пираты.\n"}, {"id": "world-ground", "path": "world/ground.md", "title": "Рельеф", "section": "world", "date": "2026-11-16", "md": "# Рельеф\n\n![Остров на отмели и коса](../img/shallows.jpg)\n\nРельеф — земля локации, склеенная из форм рельефа в одно поле высот.\n\n## Решения владельца\n- Карты содержат больше видов земли, каждый ставится в редакторе карт и разнообразится зерном и несколькими числами: горы и вулканы, барьерные рифы, кекуры, косы и песчаные отмели.\n- Горы — голый камень примерно до 120 м: серый камень и отвесные скалы, зелень только у подножия. Земля, закрывающая лодку, становится прозрачной вокруг неё.\n- Барьерный риф — полоса коралла прямо под водой, вдоль берега или дугой в море: зыбь белым разбивается вдоль неё, за ней лежит спокойная бирюзовая лагуна, и в ней прорезаны проходы.\n- Кекуры — карстовые башни высотой от 10 до 40 м: серые столбы с отвесными стенами, подточенные у воды, увенчанные джунглями, как в заливах Пханг Нга или Халонг.\n- Косы и песчаные отмели: белые отмели чуть над водой среди светящегося бирюзового мелководья; длинные косы, загибающиеся от берега, с травой на дюнах и пальмами на конце; и валы чуть под водой, через которые прибой разбивается рядами, слишком мелкие для тяжёлой лодки.\n\n## Как устроено\nФормы рельефа локации сводятся в одно поле высот (`Ground`): каждая точка так высока, как самая высокая форма там, скруглена там, где две встречаются, и покрыта так, как покрывает та форма. Оно обслуживает меш земли, море над ней, кили, рули и ракеты (`World.Ground`, где палубы пирса стоят как земля).\n\n- **Острова** (`Island`, `IslandForm`): берег, пляж, холмы и песчаная банка мористее, уходящая к открытому дну. Берег меняется от песчаных бухт до скальных обрывов. Овраги режут холмы шумом эродированного рельефа, закэшированным на сетке (`common/Raster.cs`). Почему не эрозия: с большой высоты острову нужны лишь долины, которые читаются. Почему банка кея лежит на 5 м: глубже, чем ломаются волны открытого моря, поэтому они пересекают её целиком и разбиваются на пляже.\n- **Горы** (`Mountain`): голый камень от открытого дна, зелёный только у подножия: конус, вытянутый вдоль хребта, опущенный в седловинах между плечами широким шумом, с отрогами, расходящимися от вершины хребтовым шумом, обвитым вокруг и вытянутым вниз по склону, поднимающийся отвесным обрывом от ватерлинии, с дном, уходящим под обрыв и сходящим на нет у пляжа. Кратер выдалбливает вершину вулкана. Почему не террасные полосы обрыва и не эрозия: с большой высоты и то и другое читается как ямы и ступени, а не как камень. «Пик», «Хребет» и «Вулкан» в редакторе, обведённые на протяжении хребта; в мире стоят хребет (`Ridge`) на западном острове пролива, вулкан (`Volcano`) и низкая голая скала под фортом пиратов (`Fort rock`, [Форт пиратов](fort.md)): вершину горы можно опустить до 2 м.\n- **Рифы и отмели** (`Atoll`, `Reef`, `Flats`): кольцо рифа атолла вокруг лагуны с проходами и пятнами рифов; барьерный риф — дуга такого, изогнутая от почти прямой до полукольца, с лагуной полосой позади, сужающейся к концам, за которыми оба уходят к открытому дну; отмели дельты — мелкое дно с протоками там, где шум пересекает нуль, как рисуют реки в играх. «Барьерный риф» в редакторе; он есть в мире и на карте Coral cay; в мире есть ещё атолл и отмели дельты (`The flats`).\n- **Кекуры** (`Stacks`): карстовые башни на мелком шельфе, держащиеся порознь, самая высокая первой: бугристые столбы с отвесными стенами, куполообразные верхушки под джунглями. Почему нет подмыва: земля — поле высот, оно не может нависать. «Кекуры» и «Одинокий кекур» в редакторе.\n- **Косы и отмели** (`Spit`): вал песка вдоль линии, загибающийся всё круче к концу, купол поперёк него от гребня к песчаному подножию, достаточно широкий, чтобы гребень стоял на уклоне, на котором лежит песок, и сужающийся к концам, с дюнами вдоль гребня, достаточно высокими для травы, с бирюзовым мелководьем вокруг; валы рядом рядами разной длины, каждый дальше от первого на шаг глубже, так как укрытие успокаивает волну до самой мелкой глубины, которую она прошла, и зыбь разбилась бы лишь на первом валу. Пальмы растут вдоль гребня высокого конца (`Palms`). «Песчаная отмель», «Коса с загибом» и «Подводные валы» в редакторе, размеры по их ширине; в мире у острова базы есть коса с загибом, а дальше — подводные валы.\n- **Покров и меш** (`Cover`, `Vegetation`, `Crowns`, `Palms`, `GroundMesh`, `Seabed`, `ground.gdshader`, `Palette`): зонирование как у карибского острова, от песка до леса, в цветах локации. Один меш на всю землю: ограниченное квадродерево, мелкое над сушей и у ватерлинии и крупнее под водой, веером к более мелкому соседу, чтобы не открывалась щель. Почему один: формы рельефа пересекаются, и два меша там боролись бы. Луга морской травы получаются из шума, запечённого в текстуру, которую шейдер читает по пикселям (`Meadows`). У каждой пальмы под кроной висят три–шесть кокосов, один мультимеш на рощу (`Grove`). Каждый бор, дошедший до ватерлинии, посылает плёнку вверх по пляжу позади пенного фронта.\n- **Мангровая кайма** (`Mangroves`, `mangroves.gdshader`): там, где локация растит мангры, берег каждого острова несёт кайму, построенную отдельно от меша земли, так что земля и море под ней не меняются: купол на ячейку решётки у ватерлинии, смыкающиеся в один полог, с корнями-подпорками, уходящими в воду, в листве леса (`ground_foliage`). Почему купола: кроны — лопасти края, без выреза, который надо согласовывать. Лодки проходят сквозь неё без помех.\n\nСм. также: [Локации](locations.md), [Редактор карт](../tools/map-editor.md).\n"}, {"id": "world-life", "path": "world/life.md", "title": "Жизнь моря", "section": "world", "date": "2026-11-15", "md": "# Жизнь моря\n\nРабочие лодки, которые живут на море и ни с кем не воюют: рыбаки, паромы, сухогрузы. Море живёт своей жизнью, а неприятности начинает игрок.\n\n## Решения владельца\n- 2026-11-14 владелец попросил дать мирным лодкам расписание и живое поведение.\n- Рыбак ловит сетью со стрелы, снасть чуть крупнее жизни; на косяке плещется рыба (2026-11-14).\n- 2026-11-13 владелец попросил сделать игру похожей на старые GTA и одобрил мирные лодки на маршрутах между гаванью, станцией и краем карты: они сторонятся, убегают, их можно таранить и топить ради ящиков.\n- Это основа для более подробной жизни мира: торговцев, караванов и прочего (2026-11-13).\n- Каждой лодкой, кроме лодки игрока, управляет один ИИ, так что торговцы и караваны с охраной смогут присоединиться позже ([Охотники и ИИ](../gameplay/hunters.md)).\n\n## Как устроено (`life/`)\n- **Стороны** (`ships/Sides.cs`): игроки, банда охотников, рабочие лодки, патруль, пираты форта ([Форт пиратов](fort.md)) и команды соперников, каждая на своей ([Соперники](../gameplay/rivals.md)). Кто кого считает врагом, говорит одно правило, `Sides.Fights`: рабочую лодку не трогает никто, кроме пиратов и игрока, который сам её ударил; патруль и лодка игрока враги, только пока лодка в розыске ([Розыск и патруль](../gameplay/wanted.md)); банда и патруль друг друга не трогают; пираты бьют всех, и все, кто воюет, бьют их. По нему выбирают цель турели, охотники, дроны и HUD. Снаряд по-прежнему бьёт любой корпус чужой стороны, а корпуса разных сторон таранят друг друга. Зачем одно правило: новая сторона приходит как строка в нём.\n- **Карта вод** (`Chart`): сетка по миру, где рабочая лодка может идти: глубже трёх метров, не ближе клетки к берегу и вне опасностей карты (мины, обстрелы, нефть, бочки, башни); вода, которую ничто не соединяет с открытым морем (лагуна с узкими проходами), закрыта. Путь между двумя точками ищет A* по клеткам, затем лишние углы срезаются. Зачем сетка: так игры водят машины и лодки по миру, а щупы капитана (`ai/Feelers.cs`) обходят только то, что рядом.\n- **Гавани** (`Haven`, `Traffic.Havens`): места, между которыми ходят лодки. Их даёт сама карта: вода у причала гавани, у носа каждой станции, косяки рыбы (`Mission.Sites`), посты патруля, куда только бегут испуганные лодки, и восемь выходов у края карты, откуда лодки приходят из остального мира и куда уходят. Что гавани не рисуют в редакторе, а выводят из карты — решение без владельца ([Q190](../questions/world.md#q190)).\n- **Занятия** (`Calling`): вид рабочей лодки — её проект, чего стоит полный трюм, каким ходом она идёт и её круг заходов. Рыбак работает смену: уходит из гавани в своё время, по очереди тралит два косяка, останавливаясь выбрать сети, и возвращается сдать улов и отдохнуть; трюм наполняется на косяке и пустеет в гавани, так что рыбак, идущий домой, везёт больше. Паром ходит между гаванью и станцией; сухогруз приходит с края карты, заходит в гавань или на станцию и уходит другим краем. Новый вид (торговец, караван) — новая запись.\n- **Расписание** (`Call.Every`, `Offset`, `Staggered`; часы `Traffic.Now`): лодка уходит после короткой стоянки, в ближайшее время отправления по своему расписанию. Паром выходит из гавани каждые две с половиной минуты, со станции — через полпериода; рыбак выходит в море раз в четыре минуты, каждый в своё время; сухогруз уходит в своё время в пределах минуты. Если с прибавленным ходом лодка успевает к более раннему отправлению, чем спокойным, она прибавляет ход. Часы — время захода, а не час неба: час на карте стоит. Зачем: игрок может выучить, когда выходит паром и когда рыбаки идут домой с уловом. Числа и часы — решение без владельца ([Q240](../questions/world.md#q240)).\n- **Рейсы** (`Voyage`, `Traffic`): рейс идёт всегда, как точка на своём маршруте. Лодку он получает, только когда лодка игрока ближе 450 м, и теряет её дальше 600 м от всех игроков; побитый корпус рейс помнит. Зачем: так игры с открытым миром держат движение, и море населено везде ценой нескольких лодок рядом. В мире шесть рейсов: три рыбака, паром и два сухогруза (`Traffic.Census`, решение без владельца, [Q190](../questions/world.md#q190)).\n- **Рулевой** (`ai/roles/Voyager.cs`): роль общего ИИ. Идёт по отметкам маршрута своим ходом, к месту стоянки подходит, сбавляя ход, и ложится в дрейф; на косяке кружит и останавливается выбрать сети. От лодки игрока или пиратов, которая быстро идёт на неё ближе 60 м, отворачивает; минуту после испуга — уже со 120 м. Испуганная (попадание, таран, снаряд рядом, взрыв рядом) четырнадцать секунд бежит полным ходом, на нитро, если обидчик близко: к гавани или посту патруля, если они лежат в стороне от обидчика, и ложится там в дрейф, иначе прямо прочь. Потом лодка, которую задели, идёт домой в гавань (сухогруз — прочь с карты), а остальные ищут путь заново и идут дальше. Решение без владельца ([Q240](../questions/world.md#q240)).\n- **Потопленная лодка** высыпает трюм ящиками по тому, насколько он полон, но не меньше четверти полного (`Items.Carried`, [Добыча](../gameplay/haul.md)), и HUD говорит «Потоплен». Через полторы минуты с края карты приходит новая лодка того же занятия, но не там, где её увидел бы игрок.\n- **Сеть рыбака** (`ships/Trawl.cs`, `Design.Nets`, `Boat.Fishing`): на правом борту у кормы стойка со стрелой и лебёдкой. На ходу стрела лежит вдоль лодки, сеть кучей на палубе. На косяке стрела выходит за борт, и за кормой тянется линия оранжевых поплавков с буйком и флажком на конце: каждый поплавок следует за предыдущим, как буксируемый трос. Выбирая сеть (восемь секунд, `Trawl.Hauling`), лодка ложится в дрейф: поплавки сбегаются к стреле, стрела поднимает из воды полную сеть с бьющейся рыбой, с неё течёт вода, стрела переносит её на палубу, сеть пустеет и уходит обратно в воду. Рыба — те же виды, что ловит игрок на косяке. Испуганная лодка сеть убирает. Почему сеть со стрелы: команд на лодках не видно и флоппы ничего не держат ([Люди: флоппы](../art/people.md)), так что ловит снасть самой лодки. Как именно сеть ходит, её размеры и цвета — решение без владельца ([Q244](../questions/world.md#q244)).\n- **Облик** (`Designs.FishingBoat`, `Ferry`, `Freighter`; `Livery.Working`): корпуса верфи без оружия, в рабочей краске: одна полоса вдоль борта, без гоночных полос и номера. Это временный облик из того, что уже есть ([Q189](../questions/world.md#q189)).\n- **В коопе** рейсы ведёт хост; гость видит рабочие лодки, как всякую лодку хоста ([Онлайн-кооп](../online.md)).\n\nДемо: `Bystanders` ([Демо](../tools/demos.md)).\n\n## Открытые вопросы\n- [Q189](../questions/world.md#q189): облик рабочих лодок и патруля.\n- [Q190](../questions/world.md#q190): сколько лодок на море, какие занятия и откуда берутся гавани.\n- [Q240](../questions/world.md#q240): расписание мирных лодок и их поведение.\n- [Q244](../questions/world.md#q244): как выглядит рыбалка сетью.\n"}, {"id": "world-locations", "path": "world/locations.md", "title": "Локации", "section": "world", "date": "2026-11-16", "md": "# Локации\n\nЛокация — набор значений для общих моделей мира: она выглядит и играется так, как велит её природа.\n\n## Решения владельца\n- Открытый мир сражается в своей локации, со своей водой, часом, ветром и волнами: открытые банки под сильными пассатами, а гавань, мастерская корабела (`Dock`), стоит у острова `Home cay`.\n\n## Как устроено\nЛокация (`scenery/Setting.cs`) — один набор значений для общих моделей: час, на котором держится небо, сила и направление пассатов, ветровые волны и зыбь (`Knots`, `WindToward`, `WindSea`, `Swell`), что содержит вода, палитра земли и что на ней растёт, формы рельефа, стоит ли база и музыка; всё это хранится вместе с миссией карты в её файле (`maps/*.json`, `scenery/Maps.cs`). `World` поднимается из неё за шторкой загрузки, из зерна мира, общего для всех игроков в коопе; направление пассатов (`Trades`) каждый раз выбирается заново. На картах с `Setting.Base` `World` ставит пирс (`Dock`) у первого острова карты.\n\nВ игре одна локация, мир (`maps/world.json`). Вторая, коралловый островок (`maps/coral-cay.json`), без миссий: на ней стоят демо. Лодки встают на ближайшей воде, которую `World.Deep` находит достаточно глубокой для их килей по всему кругу корпуса, каким бы курсом он ни встал, так что рядом с отвесной скалой ни одна не стартует с камнем внутри; старт мира — в [Открытом мире](../gameplay/missions.md).\n\nСм. также: [Рельеф](ground.md), [Море](sea.md), [Редактор карт](../tools/map-editor.md).\n"}, {"id": "world-outpost", "path": "world/outpost.md", "title": "Станция", "section": "world", "date": "2026-11-15", "md": "# Станция\n\n![Станция в открытом море, лодка у её плота](../img/outpost.jpg)\n\nПлавучая торговая ботаническая станция «Мария»: большой старый корпус, поставленный на якорь навсегда, с садом и рынком на нём. К ней подходят продать добычу, не возвращаясь в гавань у пирса.\n\n## Решения владельца\n- В игре есть плавучая торговая ботаническая станция, большой корабль-станция по картинке владельца (2026-11-11): синий деревянный корпус-бочонок, надстройка в несколько ярусов с открытыми галереями, стеклянный свод оранжереи, сад на каждой палубе и крыше, мачта с гирляндами. Смоделирована в Blender.\n- Станцию зовут «Мария», по-английски Mariia (2026-11-12).\n- Имя написано на носу по обоим бортам, латиницей (MARIIA), золотыми прописными с засечками, на тёмно-синей панели фальшборта под планширем, где его видно из вида боя; кустов над ним нет (2026-11-12).\n- Облик проверяет QA-агент, пока станция не выглядит как в лучших инди-играх.\n- Стёкла станции настоящие, прозрачные: сад виден сквозь них (2026-11-11). Это новый материал для игры.\n- «Мария» покупает ящики дешевле гавани и продаёт за монеты ремонт и топливо; деталей не продаёт (2026-11-12). Торгует на ней мытарь, на экране торговца ([Добыча](../gameplay/haul.md), 2026-11-13).\n\n## Как устроено\n- **Модель** (`tools/outpost.py`, `blender -b -P tools/outpost.py` пишет `game/areas/outpost.glb`): строится из кода, цвет и отделка каждой грани лежат в вершинах, как у пирса ([Ассеты](../tools/assets.md)). Корпус-бочонок 46 м с золотыми поясами, борта выпуклые и завалены внутрь. На баке рынок под навесами вокруг грядки с большим деревом. Посередине дом в четыре яруса: открытая галерея с прилавками, над ней остеклённый ярус с балконом, выше остеклённый зал оранжереи под стеклянным сводом. Посередине свод раскрыт, и сквозь проём в латунной раме растут пальмы. На корме башня в два этажа с садом на крыше и гигантскими листьями. Мачта с фонарями и флажками. По левому борту плавучий плот с лавкой под самым большим навесом и высоким шестом с золотой монетой и листом на ней; с плота лестница на палубу. У деревьев раздвоенный ствол и широкие гранёные кроны трёх складов, растения грядок десяти видов и стоят неровно. Окна прорезаны в стенах насквозь, и за стёклами зала, яруса и башни стоят настоящие грядки и банановые пальмы. Два проёма зала по левому борту открыты, и листья растут из них наружу.\n- **Имя** (`name()` в `tools/outpost.py`): буквы шрифта EB Garamond из игры, выпуклые и золочёные, лежат по обшивке вдоль её поясов на тёмно-синей панели фальшборта в золотой рамке, между верхним золотым поясом и планширем. По левому борту имя читается от носа к корме, по правому — к носу. Панель стоит под планширем, а не ниже, между золотыми поясами: там имя из вида боя закрывают плот, шест с монетой и флаг. Кустов на планшире над именем нет.\n- **Стекло** (`common/glass.gdshader`, `Surfaces.Glass`): все стёкла станции лежат в сетке `Glass`. Её рисует вариант шейдера поверхностей: тот же свет, но стекло видно насквозь, яснее при взгляде прямо и зеркальнее при скользящем, а блик остаётся целым. Стекло не пишет глубину, рисуется после моря и не бросает тени: солнце освещает сад внутри сквозь него. Стёкла лодок и фонари пирса остались непрозрачными ([Q156](../questions/world.md#q156)).\n- **Что в модели кроме сеток**: круги `Foot…`, где станция твёрдая, точки `Lap…` по её ватерлинии и `Berth`, середина плота. Тени бросает всё, кроме стёкол: мачта, флажки, деревья и рёбра оранжереи ложатся на море тонкими ровными линиями, потому что тени солнца подогнаны под вид ([Свет и время суток](../art/light.md)).\n- **Зона карты** (`Outpost` в `areas/Area.cs`, `Outposts`): точка, радиус и курс носа. `Laying` ставит станцию на каждой машине одинаково, на ближайшей к точке воде глубже её киля на всю длину корпуса. Корпуса упираются в неё, как в основания башен (`Footings`), охотники её обходят, а снаряд рвётся о неё без вреда. Она слегка качается на зыби, у её ватерлинии зыбь оставляет тонкую пену, а вымпел повёрнут по ветру и полощется.\n- **Торговля** (`Game.Offered`, `Game.Trade`, `ui/Counter.cs`): лодка, сбавившая ход в радиусе станции, когда рядом нет охотников, получает подсказку `Space` «Торговать на „Марии“». По `Space` открывается экран мытаря ([Добыча](../gameplay/haul.md)). «Мария» платит за ящик долю цены гавани, целыми монетами, не меньше одной, и продаёт «Ремонт» и «Топливо»: ремонт — за удары, которых не хватает корпусу, топливо — за литры, которых не хватает баку. Когда не хватает ничего, карточка бледнеет с надписью «полно». Если монет мало, карточка вздрагивает, а цена на ней красная, как у детали на верфи. Купленное действует сразу. С пустым трюмом, целым корпусом и полным баком экран не открывается, а HUD говорит «Торговать нечем». Доля и цены — [Баланс экономики](../balance/economy.md), решение без владельца, [Q177](../questions/haul.md#q177).\n- **Место швартовки**: у внешнего края плота на воде то же кольцо стеклянных поплавков с фонарями, что у пирса (`Mooring`, [Гавань](../base/pier.md)): спокойное вдали, фонари ярче у плота, гаснут, когда рядом охотники. Кольцо у станции — решение без владельца ([Q158](../questions/world.md#q158)).\n- **В мире** (`maps/world.json`): одна станция в открытой воде примерно в 400 м от середины `Home cay`, левым бортом и плотом к виду (решение без владельца, [Q155](../questions/world.md#q155)).\n- **В редакторе карт**: «+ Станция» в «Зонах и опасностях»; круг — вода, где идёт торговля, черта — корпус по курсу, курс задаётся ползунком ([Редактор карт](../tools/map-editor.md)).\n- **Демо** `Outpost` ([Демо](../tools/demos.md)).\n\n## Открытые вопросы\n- [Q155](../questions/world.md#q155): где стоит станция и сколько их.\n- [Q156](../questions/world.md#q156): прозрачное стекло на лодках и пирсе.\n"}, {"id": "world-sea", "path": "world/sea.md", "title": "Море", "section": "world", "date": "2026-11-16", "md": "# Море\n\n![След лодки на открытом море](../img/sea.jpg)\n\nМоре — вода игры: волны, укрытие и прибой, кильватерные следы, пена, отражение и цвет.\n\n## Решения владельца\n- Красивый океан.\n- Остров с большой площадью мелководья рядом, чтобы море выглядело красиво.\n- 2026-11-14: воду переделать целиком, облик — как в Sea of Thieves ([Облик мира](../art/world-look.md)). Что и в каком порядке — в [плане](../reports/2026-11-14-water-overhaul.md); его первые четыре шага — цвет, волны, пена и след — сделаны.\n- 2026-11-15: после плейтеста морю вернуть рябь и блики; образцы и планка — в [Облике мира](../art/world-look.md).\n\n## Как устроено\n`sea.gdshader` собирает всё это под единой световой моделью сцены (`sky/sunlight.gdshaderinc`). Облик моря по решениям владельца — в [Облик мира](../art/world-look.md).\n\n- **Волны** (`Waves`, `WaveSpectrum`, `WaveSimulation`, `waves_*.glsl`): океан на БПФ на GPU, ветровое волнение и зыбь локации в трёх каскадах, уложенных со случайными смещениями, так что узор не повторяется (`Tiling`). Длинные волны считает CPU: `SeaSurface.HeightAt` и `HeadAt` читают их с учётом укрытия, шторма ([Погода](weather.md)) и глубины. Клипмапы (`clipmap.gdshaderinc`) центрируются на фокусе вида, их ячейки так же грубы, как пиксели вида в фокусе позволяют, а далёкая от вида вода не читает волн. Почему: каждая вершина читает волны, около миллисекунды на кадр при полном размере. `SeaMotion` пишет движение моря для апскейлера. Ветровые волны локации заданы высотой и длиной главной волны (`WindSea`; где их нет, берутся те, что поднял бы её ветер), зыбь задана отдельно (`Swell`), и ветер на карте дует в одну заданную сторону (`WindToward`), так что укрытые и открытые места в каждой игре одни и те же. Частицы воды ходят вдоль волны чуть дальше, чем в настоящем море (`Waves.Sharpness`), и гребни острее. Почему заданы, а не выведены из ветра: у развитого моря высота и длина связаны, а игре нужны умеренные по высоте, но заметные волны. Решение без владельца, [Q252](../questions/world.md#q252).\n- **Укрытие и прибой** (`Shelter`, `SeaGround`, `surf.gdshaderinc`, `bores.gdshaderinc`): при загрузке земля сэмплируется на сетку, которую читают шейдер и корпуса, и это стоит одинаково, сколько бы форм рельефа ни присоединилось. Каждая ячейка другой сетки смотрит против ветра через разброс волн; земля останавливает волны, мелководье срезает их, как обрушение, а размытие загибает их в подветренную сторону. То, что убрала глубина, уходит бором, который катится вдоль изобат и кладёт пену. Пену бор кладёт только там, где с открытого моря приходят заметные волны и где глубина снимает с них заметную долю высоты: рябь лагуны и дальний край прибоя ломаются без пены, и у причалов вода чистая. Почему рваные фронты: с высоты боя гладкий бор читается как жёсткая полоса.\n- **Прибой у рифов и скал** (`surf.gdshaderinc`): там, где вода обрывается от совсем мелкой к глубже той, на которой волна ломается, как у края рифа, волны ломаются всё время, и пена лежит всегда: следующая волна серии ломается раньше, чем сходит пена прошлой. Белее всего она у обрыва и редеет на 16 м внутрь. Обрыв шейдер ищет, глядя от точки в сторону моря, поэтому полоса лежит только с той стороны, откуда идут волны. Банка или пляж, полого уходящие в глубину, остаются с пеной боров, как прежде, и вода у причала чистая. У подножия скалы или обрыва вода глубокая, и волны бьют в камень, не сломавшись: подножие стоит в белом кольце в несколько метров, гуще с той стороны, откуда идут волны, а каждая волна добавляет всплеск, который расходится от камня и стекает. У пляжа, где волны ломаются раньше берега, кольца нет: там накат. Почему пена держится, а не приходит с каждым бором: период зыби 10 с, и с высоты боя прибой, который белеет секунду из десяти, не виден. Решение без владельца, [Q265](../questions/world.md#q265).\n- **Берег и накат** (`swash.gdshaderinc`, `surf.gdshaderinc`, `islands/ground.gdshaderinc`): каждый бор у берега взбегает на пляж тонким слоем воды и скатывается назад. Пена наката одна по обе стороны уреза: она отсчитывается от того, когда фронт бора прошёл это место, под водой и на песке одинаково, и рисуется тем же узором, что пена моря. Поэтому белое выходит из моря на песок и стекает обратно, без шва у уреза. Между борами вода лижет берег кружевом пятнами, так что подножие скалы и край рифа не стоят голыми. На песке под слоем воды песок мокрый, блестит и чуть отдаёт бирюзой; когда вода уходит, оставленная пена быстро лопается, а песок сохнет. Вода у берега проявляется на последних 20 см глубины, и песок под ней такой же мокрый, как над урезом, поэтому море переходит в пляж без линии. Расстояние до уреза запечено в сетке земли (`SeaGround.Shore`), поэтому у подножия скалы и у пляжа кромка одна. Решение без владельца, [Q254](../questions/world.md#q254).\n- **Следы** (`Wakes`, `wakes_*.glsl`, `wakes.gdshaderinc`): карта вокруг вида, которую каждый корпус давит по своим обводам и смещает там, где прошло его тело (`WakeSource`), поэтому она плотная и тянет кельвиновский след. Пену следа корпус кладёт по своим обводам (`wakes_press.glsl`). Бурун корпус кладёт в полосе у самого транца, почти во всю ширину корпуса, и оставляет позади: след растёт от кормы по мере хода, ложится по ходу в повороте и рвётся, пока лодка в воздухе. Длину белого задаёт то, сколько пена держится, а не полоса. Бурун лежит полосами вдоль хода, так что след распадается на струи по пути лодки. У узкой лодки бурун не у́же, чем может удержать ячейка карты следов. Вдоль бортов идёт тонкая линия там, где борт раздвигает воду, а у корпуса на волне — там, где гребень бьёт в борт. Чем быстрее и шире лодка, тем гуще бурун: трогаясь, она оставляет немного кружева, которое густеет с ходом. Длинный корпус кладёт бурун гуще, и за ним белое тянется дальше, как за большим кораблём. Ломающаяся волна следа кладёт пену: посадка после прыжка, взрыв и попадание оставляют белое пятно. Вода, падающая назад из брызг корпуса, только белеет там, где упала. Пена и пузырьки под ней дрейфуют вместе с течением поверхности, так что след остаётся там, где создан. Решение без владельца, [Q254](../questions/world.md#q254). В ту же карту пишут пену гребни самого моря, барашки (см. «Пена»). `Wakes.Splash` открывает воронку там, где что-то бьёт по воде, и оставляет вокруг неё пятна пены и пузырьков: попадание видно на воде ещё несколько секунд. `Wakes.Ring` кладёт пену кольцом там, где по воде прошла ударная волна взрыва (`combat/Rings.cs`): меньше одного слоя пузырьков, пятнами, так что она с первого мгновения лежит кружевом и тает, как след; волны кольцо не поднимает. Решение без владельца, [Q212](../questions/world.md#q212). Проходы идут после движения корпусов (`common/AfterMoves.cs`).\n- **Пена** (`Foam`, `FoamLace`, `foam.*`, `wakes_press.glsl`): одна модель и один облик для барашков, прибоя, следов и всплесков, в слоях пузырьков. Свежая пена быстро стекает до одного слоя, и этот слой тает. Рисуется она через два узора, запечённых кодом (`FoamLace`): свежая — белая пена с дырами, оставшийся слой — кружево из нитей с узлами. Узор задаёт порядок, в котором вода белеет, поэтому и густая пена остаётся узором, а не заливкой. Край пены мягкий: тонкая пена полупрозрачна и сереет от синевы воды, густая белая. Нити кружева вытянуты по ходу волн. Узоры держат свой размер на экране: на широком виде они лежат крупнее, на близком мельче. Текстура узора хранит для каждого пикселя среднее и самое раннее место в порядке побеления, поэтому издали пена сереет, а не рябит. Под пеной пузырьки сдвигают цвет воды к светлой бирюзе. Свет со дна они не прячут: над банкой след только светлеет и не оставляет тёмной полосы. Барашки пишутся в карту следов (`wakes_press.glsl`): гребень белеет там, где длинные волны теснят воду сильнее обычного в заданное число раз, и дальше ломается вдоль себя, пока теснит; пены барашек кладёт меньше, чем корпус или попадание, а над банками и в укрытии острова барашков нет. Почему порог считается от самого моря карты, а не от настоящей крутизны: волна такой высоты в жизни не ломается, а доля моря под барашками должна быть одна на всех картах. Решение без владельца, [Q253](../questions/world.md#q253).\n- **Сухие кокпиты** (`Cockpit`, `cockpits.gdshaderinc`): море не рисуется в открытом кокпите корпуса. Почему: поле высот стоит внутри корпуса лишь настолько низко, насколько его продавленная впадина.\n- **Отражение** (`facets.gdshaderinc`): море отражает небо. Отражений сцены нет: экранные отражения сняты 2026-11-16, потому что с высоты боя корпуса, сваи и станция в воде не отражались видимо ни у причала, ни у станции, а луч отражения трассировался на каждый пиксель моря; видно их было только в низких видах демо сбоку. Решение без владельца, [Q262](../questions/world.md#q262). `facets.gdshaderinc` усредняет наклоны, которые пиксель не разрешает, в том числе волны короче нескольких пикселей, так что они читаются как блеск, а не зерно; `glints.gdshaderinc` мерцает солнечной россыпью (`UltraWater-LICENSE.txt`): широкий блик солнца берёт цвет воды и лежит на ней светлой дорожкой, а белые искры горят только в середине дорожки.\n- **Цвет открытого моря** (`body.gdshaderinc`): каждый гребень светится. Свет резко начинается на склоне, куда волна бежит, и тает по её спине на несколько метров, а перед гребнем лежит самая тёмная вода. Где волна на своём пути, шейдер знает по двум величинам, которые волны пишут рядом (`waves_assemble.glsl`): как тесно сходятся частицы воды и куда наклонена поверхность; считаются в них только длинные волны, чтобы короткие не рябили цветом. Цвет гребня синее и глубже лагуны, так что самая светлая и зелёная вода остаётся мелководьем. Низкие волны под укрытием острова светятся тонкой слабой линией, а над банками, где видно дно, гребни не красятся вовсе. Наклоны длинных волн для цвета усредняются по доле высоты кадра, а не по пикселям, поэтому вода одинакова, в каком бы размере ни рисовался мир. Почему: сверху вода почти не отражает, и форму волны показывает только её цвет. Решение без владельца, [Q250](../questions/world.md#q250).\n- **Рябь и блики** (`waves.gdshaderinc`, `sea.gdshader`, `glints.gdshaderinc`): лицо воды читает наклоны волн дважды. Мелко, по нескольким пикселям, как прежнее море, — для самой поверхности: рябь, которую экран может показать, даёт морю текстуру, а волны короче неё становятся шероховатостью, и от неё солнце ложится мягкой дорожкой с россыпью (`glints`). Крупно — для цвета длинных волн (выше). Над дорожкой лежат искры: грани самой короткой ряби отражают солнце так, будто стоят круче, и светят слабее пены. Почему круче: вид смотрит далеко в сторону от солнца, и настоящая рябь почти не поворачивает его свет к глазу. Почему только самая короткая рябь: её текстура мельче пикселя, и резкий блик не показывает сетку текселей. Искры густы в сторону солнца, а вдали от него их нет; ночью то же делает луна. Над банками рябь спокойнее, и искр там меньше. Решение без владельца, [Q255](../questions/world.md#q255).\n- **Порывы** (`sea.gdshader`): пятна ветра в несколько десятков метров мчатся по ветру и меняют форму на ходу; под ними рябь гуще, между ними глаже, так что искры и блеск ходят по морю пятнами. Почему: на ровной ряби море стоит, а с порывами видно, что дует ветер. В шторме порывы сильнее ([Погода](weather.md)). Решение без владельца, [Q273](../questions/world.md#q273).\n- **Цвет и каустика** (`optics.gdshaderinc`, `refraction.gdshaderinc`, `WaterBody`, `Caustics`): цвет воды из того, что она содержит, дно видно через преломление, каустика ложится на то, что под водой. Только во внешнем виде: тонкая каустическая сеть коротких волн показывается наполовину поверх широкой сети длинных, а лицо воды над отмелями спокойнее, чем стоят волны, и возвращается к ним мористее ([Облик мира](../art/world-look.md)). Над водой глубже 15 м дно считается ровным: конец преломлённого луча находится сразу, и глубина экрана там говорит, во что он упёрся; над мелью луч, как и прежде, идёт шагами до дна и по экрану. Почему: это самая дорогая часть шейдера моря.\n"}, {"id": "world-weather", "path": "world/weather.md", "title": "Погода", "section": "world", "date": "2026-11-16", "md": "# Погода\n\n![Шторм: тёмное море, барашки, ливень](../img/storm.jpg)\n\nНад всем миром сменяют друг друга периоды погоды: ясно, облачно, лёгкий дождь, туман. Поверх них по миру плывут штормы — высокие волны с барашками, тучи, ливень, молнии и гром, — в непогоду чаще; один шторм стоит на карте всегда.\n\n## Решения владельца\n- Шторм с огромными волнами, тёмными тучами и громом, а море при этом живое (2026-11-16).\n- Шторм есть и на карте, и как смена погоды: штормы приходят и уходят сами (2026-11-16).\n- В шторме ливень, молнии со вспышками, сумрак и дымка (2026-11-16).\n- Шторм заметно мешает, но играть в нём можно (2026-11-16).\n- Образец — штормы Sea of Thieves (2026-11-16).\n- Звук шторма — записи CC0 с Freesound: близкие раскаты, далёкий гром, сильный ливень (2026-11-16).\n- Штормы видны на карте (2026-11-16): глянцевые значки в духе Frutiger Aero, облако над областью шторма и стрелка, куда он плывёт; значок чуть живой: в нём вспыхивает молния, туча покачивается, плывущий шторм едет по карте.\n- Погода меняется со временем: над всем миром сменяют друг друга периоды — ясно, облачно, лёгкий дождь, туман, — а поверх них по карте плывут штормы, в непогоду чаще (2026-11-16).\n- Облака объёмные и красивые, как их строят игры, а не плоская шапка (2026-11-16).\n- В облачную погоду тени туч хорошо видны на воде: тёмные пятна бегут по морю (2026-11-16).\n- Шторм видно издалека: над ним шапка туч, которая становится прозрачной вокруг лодки игрока, когда та внутри; край шторма широкий и плавный — море темнеет, волны растут, дождь густеет постепенно, ступенями (2026-11-16).\n- Время суток идёт: сутки за 12 минут ([Свет и время суток](../art/light.md), 2026-11-16).\n- Прежняя погода (туман, дождь, шторм и гром как физические модели) снята 2026-10-27: «не так, как я представлял» ([Арт-дирекшн](../art/README.md)).\n\n## Как устроено\n- **Сила шторма** (`storms/Weather.cs`): в каждой точке мира от 0 до 1. Она лежит сеткой над миром, и эту сетку читают и процессор, и шейдеры (`storms/weather.gdshaderinc`). Поэтому волны, на которых качаются лодки, те же, что нарисованы. Всё выводится из зерна мира и часов боя, а у гостя часы хоста, так что у всех игроков одни и те же штормы и молнии ([Онлайн-кооп](../online.md)).\n- **Периоды погоды** (`Weather.SpellAt`): над всем миром по четыре минуты, один за другим, из зерна мира: ясно, облачно, лёгкий дождь или туман; соседние перетекают друг в друга за полминуты с лишним. Бой начинается с ясного. Облачно: облаков больше, их тени темнее и бегут быстрее, по воде ходят заметные тёмные пятна, ветер чуть поднимает волны и громче шумит. Лёгкий дождь: редкие штрихи дождя и его тихий шум, небо наполовину затянуто, вода сереет. Туман: банки тумана лежат на воде ниже палуб и плывут по ветру, струясь прядями (`storms/Mist.cs`, `mist.gdshader`); прямо вокруг вида банка расходится рваной прогалиной, так что своя лодка видна, а дальше банки скрывают море и чужие лодки. Общая дымка над видом слабая. Облик тумана — решение без владельца, [Q288](../questions/world.md#q288). Длины и доли — решение без владельца, [Q275](../questions/world.md#q275).\n- **Плывущие штормы:** первый выходит через одну–три минуты после начала боя, дальше примерно каждые три минуты выходит или пропускает очередь: в дождь почти всегда, в облачно чаще, в ясно и в туман редко. Шторм выходит с наветренного края мира, в своём месте поперёк ветра, и идёт с пассатом, пока не пересечёт мир. Он собирается в первой трети пути и распадается в последней. К краю шторм слабеет на большей части радиуса, и край неровный и медленно колышется. Шторм наступает ступенями: сначала тучи и гаснущий блеск, потом растут волны и сереет вода, глубже начинается дождь, в самом сердце бьют молнии. Сетка лежит над сушей мира с запасом почти в километр; к её краю шторм гаснет плавно, а дальше моря без шторма. В редакторе карт мир стоит тихим: плывущих штормов там нет. Частота и размер — решение без владельца, [Q269](../questions/world.md#q269).\n- **Зона шторма** (`Storm` в `areas/Area.cs`, в редакторе «+ Шторм»): шторм, который никогда не уходит, вокруг точки или вдоль коридора ([Зоны и опасности](areas.md)). В мире одна такая зона, в открытом море за Отмелями, где больше ничего нет. Решение без владельца, [Q270](../questions/world.md#q270).\n- **Волны:** шторм поднимает все три каскада волн, длинные больше всего ([Море](sea.md)). Гребни под тучей сереют вместе с водой и не светятся бирюзой: солнце сквозь них не светит. Чем круче волны, тем больше гребней ломается в барашки: это те же барашки, что пишутся в карту следов. Над банкой волны, как всегда, ломаются о дно, и прибой у берега выше.\n- **Порывы:** пятна ветра мчатся по морю и то взъерошивают рябь, то разглаживают её, так что искры и блеск воды ходят пятнами; в шторме порывы сильнее ([Море](sea.md)).\n- **Свет:** тучи шторма закрывают солнце (`sky/sunlight.gdshaderinc`), поэтому гаснут блеск и искры солнца на воде и пропадают тени. Небо и его отражение в море становятся серой пеленой, ярче над головой, чем у горизонта (`sky/sky.gdshaderinc`), а вода сереет к сланцевому и темнеет, так что шторм виден тёмным и снаружи. Экспозиция возвращает только часть потерянного света (`sky/Daylight.cs`), поэтому в шторме темно; шторм для неё меряется по всему морю в кадре, а не в точке вида, чтобы солнечное море рядом со штормом не выгорало (`Squall.Framed`, решение без владельца, [Q283](../questions/world.md#q283)). Дымка — туман по силе шторма над видом.\n- **Облака** (`storms/Clouds.cs`, `clouds.gdshader`, `sky/clouds.gdshaderinc`, `sky/CloudNoise.cs`): объёмные облака в слое от 60 до 180 м над морем; шейдер идёт по каждому лучу от глаза сквозь слой, как облака Horizon Zero Dawn (Schneider, SIGGRAPH 2015). Форму даёт трёхмерный шум Перлина–Ворли, который игра строит в коде при первом показе: круглые клубы, края съедены мелким шумом в пряди. Где облака висят, говорит покров: над всем миром кучевые облака, тем больше, чем облачнее период, а над штормом — его туча, высокая в сердце, ниже к краю и плотнее кучевых, сплошная под клубами. Туча шторма читается у моря за ней, как его видит глаз, поэтому стоит над своей водой. Свет: солнце сквозь облако в его сторону, так что клубы затеняют друг друга, ярче против солнца, небо сверху и темнее к основанию, молния изнутри. Туча шторма свинцово-серая: солнца и неба на ней меньше. Над серединой вида облака тают: туча шторма с половины высоты кадра, кучевые — только у самого края, поэтому на обычном приближении кучевых не видно, а на дальнем они стоят по краям. Пока лодка в шторме, его туча прозрачна вся: изнутри видно бурное море, ливень и молнии. Дождя под тучей не видно. Кучевые в кадре — решение без владельца, [Q282](../questions/world.md#q282).\n\n![Облачно издалека: кучевые облака у краёв кадра и их тени на воде](../img/clouds.jpg)\n\n![Шторм издалека: свинцовая туча клубами над своей водой](../img/storm-afar.jpg)\n\n- **Ливень** (`storms/Rain.cs`, `rain.gdshader`): штрихи капель падают наискось по ветру в три слоя, ближние быстрее и длиннее. Они рисуются поверх готового кадра, под HUD, и движутся вместе с морем, когда вид едет; каждый пиксель берёт силу шторма над той точкой моря, которую показывает, так что ливень кончается у края шторма. Почему поверх кадра: апскейлер принимает то, чьего движения не видит, за стоящее на месте и оставляет за падающей каплей цепочку точек. Дальше, чем лодка видит сквозь дождь (`Screens.Rain`, `Weather.Murk`), море подёрнуто серой дымкой: лодку там не видно и не взять на прицел, и это видно глазу (решение без владельца, [Q289](../questions/world.md#q289)). По воде, где идёт дождь, расходятся круги от капель и вспыхивают брызги (`waters/ripples.gdshaderinc`), крупнее, чем в жизни, чтобы вид их видел.\n- **Молнии** (`storms/Lightning.cs`, `bolt.gdshader`): в сердце шторма бьют молнии, в среднем раз в несколько секунд на шторм. Рядом с видом молния — разряд из тучи в море: тонкая сине-белая нить ярче белого в синем свечении, ломаная на всех масштабах (путь много раз делится пополам со сдвигом середины, на мелких шагах сильнее), с ветвями, которые гаснут к концам. Разряд бьёт двумя–четырьмя ударами: каждый держится несколько кадров и гаснет, между ними канал тлеет; ветви горят только при первом ударе, как у настоящей молнии. Вспышка светит всё вокруг белым: светлеют тучи, небо и его отражение в море, рассеянный свет сцены (`Daylight`) и лампа над местом удара; море от неё сереет, а не синеет. Где разряд входит в воду — яркая точка и рваное кольцо пены. Вдали молния только вспыхивает в тучах над видом. Облик разряда и сила вспышки — решение без владельца, [Q284](../questions/world.md#q284).\n- **Меньше вспышек** (выключатель в настройках, `Lightning.Gentle`, [Экраны и меню](../interface/screens.md)): разряд виден, но горит ровно, без мерцания, а свет вспышки поднимается и спадает плавно и вчетверо слабее, так что экран не мигает. По умолчанию выключено. Решение без владельца, [Q285](../questions/world.md#q285).\n- **Звук** (`audio/StormSounds.cs`, записи в `assets/sounds/thunder/` и `rain/`): две петли ливня разной длины звучат вместе, так что повтор не слышен; в сердце шторма ревёт низкий ветер; гром приходит позже вспышки, на столько, сколько звук идёт до вида, и с той стороны, где ударило. Рядом слышен целый раскат, с треском, дальше — только далёкий гул, тем тише и тем реже, чем дальше: далёкий шторм погромыхивает изредка, а не с каждым ударом ([Звук](../audio/sound.md), [Q286](../questions/world.md#q286)).\n![Карта: стоящий шторм и плывущие, их облако, значки и стрелки хода; своя лодка — оранжевая стрелка, товарищ — аква](../img/storm-map.jpg)\n\n- **Карта** (`ui/MapView.cs`, `ui/map_storms.gdshader`, `Gloss.Storm`): область каждого шторма — светлое облако с мягко светящимся краем, прочитанное из той же сетки, что и море, так что край на карте — край на воде. В середине шторма глянцевый значок: туча из тёмно-синего стекла с бликами и золотая молния под ней, которая то и дело вспыхивает; значок чуть покачивается. У плывущего шторма — белая глянцевая стрелка, куда он идёт; шторм, ушедший за край карты, держится у края. Своя лодка на карте — оранжевая стрелка по курсу ([Добыча](../gameplay/haul.md)), так что видно, идёт ли шторм на неё. Демо `Storm/Map`.\n- **Игра:** ливень прячет лодку, как дым ([Бой](../gameplay/combat.md)): в полном шторме одна лодка видит другую лишь вблизи (`combat/Screens.cs`). Это касается охотников, прожекторов, автоматических турелей, наведения игрока и меток охотников в HUD. Волны шторма подбрасывают лодки, но не тормозят и не сносят их ([Q274](../questions/world.md#q274)). Молния по лодкам не бьёт: решение без владельца, [Q272](../questions/world.md#q272).\n![Молния бьёт рядом с лодкой, всё вокруг освещено вспышкой](../img/lightning.jpg)\n\n- **Демо** `Weather`: `Cloudy`, `Rain`, `Fog` — лодка в миг, когда этот период погоды стоит целиком и светло, `CloudyAfar` и `FogAfar` — облачно и туман издалека, `Day` — часы идут с вечера. `Storm/Afar` — шторм издалека, `Storm/Within` — изнутри на широком виде.\n- **Демо** `Storm`: `Heart` — лодка в сердце шторма, `Edge` — на его краю, `Bolt` — кадр сразу после удара молнии рядом с лодкой, `Gentle` — то же с «Меньше вспышек», и проверка, что свет вспышки не скачет.\n\n## Открытые вопросы\n- [Q269](../questions/world.md#q269): как часто приходят штормы и какие они.\n- [Q270](../questions/world.md#q270): где на карте стоит шторм и нужна ли в нём награда.\n- [Q272](../questions/world.md#q272): бьёт ли молния по лодкам.\n- [Q274](../questions/world.md#q274): тормозят ли волны шторма лодку.\n- [Q275](../questions/world.md#q275): какие периоды погоды, как часто и как долго.\n- [Q276](../questions/world.md#q276): с какого часа и какой погоды начинается игра после загрузки.\n- [Q288](../questions/world.md#q288): облик тумана.\n- [Q289](../questions/world.md#q289): дымка дальше, чем видит лодка в дождь.\n- [Q282](../questions/world.md#q282): кучевые облака в кадре.\n- [Q283](../questions/world.md#q283): экспозиция по всему кадру в шторме.\n- [Q284](../questions/world.md#q284): облик молнии и сила вспышки.\n- [Q285](../questions/world.md#q285): настройка «Меньше вспышек».\n- [Q286](../questions/world.md#q286): громкость шторма и далёкий гром.\n"}, {"id": "hulls-runabout", "path": "hulls/runabout.md", "title": "Катерок", "section": "hulls", "date": "", "md": "# Катерок\n\n![Катерок](../img/parts/Hull-Runabout.jpg)\n\nМеньше и легче всех: быстрее всех разгоняется и поворачивает, но держит мало ударов.\n\nсамый лёгкий и резкий, но держит два удара. Под сильным мотором самый быстрый.\n\nЗначения — из таблицы «1. Корпуса» на странице [Баланс лодок](../balance/boats.md#1-корпуса).\n\n## Упоминания\n- [Баланс экономики](../balance/economy.md)\n- [Баланс оружия](../balance/weapons.md)\n- [Глоссарий](../glossary.md)\n- [Вопросы: лодка](../questions/boat.md)\n- [Вопросы: добыча](../questions/haul.md)\n- [Вопросы: мир и облик](../questions/world.md)\n- [Демо](../tools/demos.md)\n", "info": [["Длина, м", "4,8"], ["Ширина, м", "2"], ["Масса, т", "0,9"], ["Удары", "2"], ["Станции", "1"], ["Трюм, мест", "4"], ["Бак, л", "27"], ["Мест снаряжения", "1"], ["Цена", "120"], ["Сцепление", "2"], ["Круг, длин", "1,5"], ["Ответ поворота, с", "0,15"], ["Ход", "2,9"]], "src": "wiki/balance/boats.md"}, {"id": "hulls-skiff", "path": "hulls/skiff.md", "title": "Ялик", "section": "hulls", "date": "", "md": "# Ялик\n\n![Ялик](../img/parts/Hull-Skiff.jpg)\n\nМаленькая открытая лодка: лёгкая, вёрткая, потопить нетрудно.\n\nстартовый, бесплатный, открытый; четыре удара, две станции.\n\nЗначения — из таблицы «1. Корпуса» на странице [Баланс лодок](../balance/boats.md#1-корпуса).\n\n## Упоминания\n- [Баланс экономики](../balance/economy.md)\n- [Баланс оружия](../balance/weapons.md)\n- [Лодка](../gameplay/boat.md)\n- [Бой](../gameplay/combat.md)\n- [Соперники](../gameplay/rivals.md)\n- [Глоссарий](../glossary.md)\n- [Вопросы: добыча](../questions/haul.md)\n- [Вопросы: миссии](../questions/missions.md)\n- [Вопросы: мир и облик](../questions/world.md)\n- [Демо](../tools/demos.md)\n", "info": [["Длина, м", "6" <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const byId = new Map(D.pages.map(p => [p.id, p]));
const byPath = new Map(D.pages.map(p => [p.path, p]));
const label = dir => (D.sections.find(s => s.dir === dir) || {}).label || dir;
const catId = dir => dir || 'main';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const day = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${MONTHS[m - 1]} ${y}`; };
const plural = (n, f) => `${n} ${f[n % 10 === 1 && n % 100 !== 11 ? 0 : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2]}`;
const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
const plain = md => md.replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[#*`>|_]+/g, ' ').replace(/\s+/g, ' ').trim();

// A file in the repo, on GitHub; the public site has no repo to link to, so the link goes.
const gh = path => D.repo ? { ext: D.repo + path } : {};

// Resolves a link in a page's Markdown against the page: a wiki page, a wiki file, or an outside URL.
function resolve(from, href) {
  if (/^[a-z]+:/i.test(href)) return { ext: href };
  const u = new URL(href, 'https://w.invalid/wiki/' + from);
  const path = decodeURIComponent(u.pathname), anchor = decodeURIComponent(u.hash.slice(1));
  if (!path.startsWith('/wiki/')) return gh(path.slice(1) + u.hash);
  const rel = path.slice(6);
  if (rel.endsWith('.md')) return byPath.has(rel) ? { page: byPath.get(rel), anchor } : gh('wiki/' + rel);
  // ponytail: only wiki/img ships with the page; reports and PDFs open on GitHub
  return rel.startsWith('img/') ? { file: rel } : gh('wiki/' + rel);
}
const href = (p, anchor) => '#' + (p.path === 'README.md' && !anchor ? '' : p.id) + (anchor && /^[\w-]+$/.test(anchor) ? '--' + anchor : '');

for (const p of D.pages) {
  let body = p.md.replace(/^# .*\n/, '');
  const im = body.split(/\n## /)[0].match(/^!\[([^\]]*)\]\(([^)\s]+)\)[ \t]*$/m);
  if (im) { p.img = resolve(p.path, im[2]).file; p.cap = im[1]; body = body.replace(im[0], ''); }
  p.body = body;
  p.lead = plain((body.trim().split(/\n\s*\n/).find(b => !/^\s*[#|<-]/.test(b)) || ''));
  p.text = plain(body);
}
const sectionPages = dir => D.pages.filter(p => p.section === dir).sort((a, b) => (a.path.endsWith('README.md') ? -1 : 0) - (b.path.endsWith('README.md') ? -1 : 0) || a.title.localeCompare(b.title, 'ru'));
const sectionImage = dir => (sectionPages(dir).find(p => p.img) || {}).img;

// ---- page parts
function head(crumbs, title, meta, action) {
  $('crumbs').innerHTML = crumbs; $('title').textContent = title; $('meta').innerHTML = meta || ''; $('action').innerHTML = action || '';
  document.title = title === 'Floppa Tropical Adventures Wiki' ? title : `${title} | Floppa Tropical Wiki`;
}

// Only Markdown goes through here: the page's own links and images are resolved against its file.
function render(md, from) {
  const d = document.createElement('div');
  d.innerHTML = marked.parse(md); fixup(d, from);
  return d.innerHTML;
}

// A Markdown value of an infobox row, inline.
function inline(md, from) {
  const s = document.createElement('span');
  s.innerHTML = marked.parseInline(md); fixup(s, from);
  return s.innerHTML;
}

function fixup(root, from) {
  const seen = {};
  root.querySelectorAll('h2, h3, h4').forEach(h => {
    let s = slug(h.textContent); seen[s] = (seen[s] || 0) + 1; if (seen[s] > 1) s += '-' + (seen[s] - 1);
    h.id = 'h-' + s; h.dataset.anchor = s;
  });
  root.querySelectorAll('a[href]').forEach(a => {
    const r = resolve(from, a.getAttribute('href'));
    if (r.page) { a.href = href(r.page, r.anchor); if (r.anchor) a.dataset.anchor = r.anchor; a.dataset.page = r.page.id; }
    else if (r.file) { a.href = r.file; a.target = '_blank'; a.className = 'file'; }
    else if (r.ext) { a.href = r.ext; a.target = '_blank'; a.rel = 'noopener'; a.className = 'ext'; }
    else a.replaceWith(...a.childNodes);
  });
  root.querySelectorAll('img').forEach(i => { const r = resolve(from, i.getAttribute('src')); if (r.file) i.src = r.file; i.loading = 'lazy'; });
  root.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-scroll'; t.before(w); w.append(t); });
}

// The Artifact loads no picture from another site: a copy published beside the page stands in, and with none the caption stays alone.
document.addEventListener('error', e => {
  const i = e.target, src = i.tagName === 'IMG' && i.getAttribute('src');
  if (/^https?:\/\//.test(src)) i.src = 'img/ext/' + src.replace(/^https?:\/\//, '').split('?')[0];
  else if (src && src.startsWith('img/ext/')) i.remove();
}, true);

function toc(root) {
  const hs = [...root.querySelectorAll('h2, h3')];
  const first = root.querySelector('h2');
  if (hs.length < 3 || !first) return;
  let a = 0, b = 0;
  const items = hs.map(h => {
    const n = h.tagName === 'H2' ? (b = 0, ++a) : `${a}.${++b}`;
    return `<li class="${h.tagName === 'H2' ? 'l2' : 'l3'}"><a data-to="${h.id}"><span class="n">${n}</span>${esc(h.textContent)}</a></li>`;
  }).join('');
  const box = document.createElement('nav');
  box.className = 'toc' + (hs.length > 30 ? ' closed' : '');
  box.innerHTML = `<div class="toc-head">Содержание <button type="button">${hs.length > 30 ? 'показать' : 'скрыть'}</button></div><ol>${items}</ol>`;
  box.querySelector('button').onclick = e => { const c = box.classList.toggle('closed'); e.target.textContent = c ? 'показать' : 'скрыть'; };
  first.before(box);
}

function infobox(p) {
  const rows = [...(p.info || []).map(([k, v]) => [esc(k), inline(v, p.path)]), ['Раздел', `<a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>`]];
  if (p.date) rows.push(['Правка', day(p.date)]);
  const dec = (p.md.split(/^## Решения владельца\s*$/m)[1] || '').split(/^## /m)[0].match(/^- /gm);
  if (dec) rows.push(['Решений владельца', dec.length]);
  const qs = (p.md.match(/^### Q\d+/gm) || []).length;
  if (qs) rows.push(['Вопросов', qs]);
  const open = new Set(p.md.match(/questions\/[\w-]+\.md#q\d+/g) || []).size;
  if (open && !qs) rows.push(['Открытых вопросов', open]);
  const code = [...new Set((p.md.match(/`[\w./-]+\.(?:cs|gdshader|gdshaderinc|glsl|glslinc|py|sh|json|tscn|glb)`/g) || []).map(c => c.slice(1, -1)))];
  if (code.length) rows.push(['Код', code.slice(0, 6).map(c => `<code>${esc(c.split('/').pop())}</code>`).join('') + (code.length > 6 ? ` и ещё ${code.length - 6}` : '')]);
  return `<aside class="infobox"><div class="ib-title">${esc(p.title)}</div>` +
    (p.img ? `<figure><img src="${esc(p.img)}" alt="${esc(p.cap)}"><figcaption>${esc(p.cap)}</figcaption></figure>` : '') +
    `<div class="ib-group">${p.info ? 'Характеристики' : 'Сведения'}</div><table>${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table></aside>`;
}

function rail(p) {
  const recent = [...D.pages].filter(x => x.date).sort((a, b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title, 'ru')).slice(0, 8);
  const li = x => `<li${p && x.id === p.id ? ' class="here"' : ''}><span class="thumb" style="${x.img ? `background-image:url('${x.img}')` : ''}"></span><span><a href="${href(x)}">${esc(x.title)}</a><small>${esc(label(x.section))} · ${day(x.date)}</small></span></li>`;
  let html = `<section><h3>Свежие правки</h3><ul>${recent.map(li).join('')}</ul></section>`;
  if (p) {
    const same = sectionPages(p.section);
    html += `<section><h3>${esc(label(p.section))}</h3><ul>${same.map(x => `<li${x.id === p.id ? ' class="here"' : ''}><a href="${href(x)}">${esc(x.title)}</a></li>`).join('')}</ul></section>`;
  } else {
    const qs = sectionPages('questions').filter(x => !x.path.endsWith('README.md'));
    html += `<section><h3>Открытые вопросы</h3><ul>${qs.map(x => `<li><a href="${href(x)}">${esc(x.title)}</a><small style="margin-left:auto">${(x.md.match(/^### Q\d+/gm) || []).length}</small></li>`).join('')}</ul></section>`;
  }
  $('rail').innerHTML = html;
}

// ---- views
function article(p, anchor) {
  head(`в: <a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>`, p.title,
    p.date ? `Последняя правка: ${day(p.date)}` : '',
    D.repo ? `<a class="btn" href="${D.repo}${encodeURI(p.src || 'wiki/' + p.path)}" target="_blank" rel="noopener">Исходник ↗</a>` : '');
  const c = $('content');
  c.innerHTML = (p.path === 'README.md' ? '' : infobox(p)) + render(p.body, p.path);
  toc(c);
  $('cats').hidden = false;
  $('cats').innerHTML = `Категории: <a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>` +
    (/^## Решения владельца/m.test(p.md) ? '<a href="#cat-main">Решения владельца</a>' : '') +
    (p.img ? '<a href="#">Страницы с изображениями</a>' : '');
  rail(p);
  jump(anchor);
}

function category(dir) {
  const pages = sectionPages(dir);
  head('Категория', `Категория: ${label(dir)}`, `В категории ${plural(pages.length, ['страница', 'страницы', 'страниц'])}.`);
  $('content').innerHTML = `<div class="cards">${pages.map(p => `<a class="card" href="${href(p)}"><span class="thumb" style="${p.img ? `background-image:url('${p.img}')` : ''}">${p.img ? '' : esc(p.title[0])}</span><span><b>${esc(p.title)}</b><small>${esc(p.lead)}</small></span></a>`).join('')}</div>`;
  $('cats').hidden = true; rail(null); jump();
}

function home() {
  const readme = byPath.get('README.md');
  const latest = D.pages.reduce((a, b) => (b.date > a ? b.date : a), '');
  head('', 'Floppa Tropical Adventures Wiki', `${plural(D.pages.length, ['страница', 'страницы', 'страниц'])} · последняя правка ${day(latest)}`);
  const intro = readme.body.trim().split(/\n\s*\n/)[0];
  const decisions = byPath.get('decisions.md');
  const news = decisions.md.split('\n').filter(l => /^- \*\*\d\d-\d\d\*\*/.test(l)).slice(-8).reverse()
    .map(l => l.replace(/^- \*\*(\d\d)-(\d\d)\*\*\s*/, (_, m, d) => `- <b class="d">${+d} ${MONTHS[m - 1].slice(0, 3)}</b> `)).join('\n');
  const tiles = D.sections.map(s => {
    const n = sectionPages(s.dir).length, img = sectionImage(s.dir);
    return n ? `<a class="tile" href="#cat-${catId(s.dir)}"${img ? ` style="background-image:url('${img}')"` : ''}><span>${esc(s.label)}<small>${plural(n, ['страница', 'страницы', 'страниц'])}</small></span></a>` : '';
  }).join('');
  const gallery = D.pages.filter(p => p.img && !p.info).filter((p, i, a) => a.findIndex(q => q.img === p.img) === i)
    .map(p => `<a href="${href(p)}"><img src="${esc(p.img)}" alt="" loading="lazy">${esc(p.cap)}</a>`).join('');
  const c = $('content');
  c.innerHTML = `<div class="welcome">${render(intro, 'README.md')}
      <a class="btn" href="#vision">Об игре</a><a class="btn" href="#decisions">Решения</a><a class="btn" href="#known-issues">Известные недочёты</a><a class="btn" href="#glossary">Глоссарий</a></div>
    <h2>Разделы</h2><div class="tiles">${tiles}</div>
    <h2>Последние решения</h2><div class="news-wrap">${render(news, 'decisions.md')}</div>
    <h2>Галерея</h2><div class="gallery">${gallery}</div>`;
  c.querySelector('.news-wrap ul')?.classList.add('news');
  $('cats').hidden = true; rail(null); jump();
}

function jump(anchor) {
  const el = anchor && document.getElementById('h-' + anchor);
  if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
}

let pending = '';
function route() {
  document.querySelectorAll('#nav details[open]').forEach(d => d.open = false);
  const [id, anchor] = decodeURIComponent(location.hash.slice(1)).split('--');
  const a = anchor || pending; pending = '';
  if (!id) return home();
  if (id.startsWith('cat-')) return category(id === 'cat-main' ? '' : id.slice(4));
  const p = byId.get(id);
  if (p) return article(p, a);
  head('', 'Страница не найдена', `Нет страницы «${esc(id)}». <a href="#">На заглавную</a>`); $('content').innerHTML = ''; $('cats').hidden = true; rail(null);
}

// ---- nav and search
const GROUPS = [['Об игре', ['']], ['Геймплей', ['gameplay', 'balance']], ['Лодки', ['hulls', 'engines', 'weapons', 'hunters']], ['Мир и база', ['world', 'base']], ['Интерфейс', ['interface']],
  ['Арт и звук', ['art', 'audio']], ['Сюжет', ['story']], ['Разработка', ['tools', 'questions', 'reports']]];
$('nav').insertAdjacentHTML('afterbegin', GROUPS.map(([name, dirs]) => `<details><summary>${name}</summary><div class="menu">${dirs.map(d =>
  (dirs.length > 1 ? `<b>${esc(label(d))}</b>` : '') + sectionPages(d).map(p => `<a href="${href(p)}">${esc(p.title)}</a>`).join('')).join('')}</div></details>`).join(''));
document.querySelectorAll('#nav details').forEach(d => d.addEventListener('toggle', () => {
  if (d.open) document.querySelectorAll('#nav details[open]').forEach(o => o !== d && (o.open = false));
}));
document.addEventListener('click', e => {
  if (!e.target.closest('#nav details')) document.querySelectorAll('#nav details[open]').forEach(d => d.open = false);
  if (!e.target.closest('.search')) $('results').hidden = true;
  const to = e.target.closest('[data-to]');
  if (to) { e.preventDefault(); document.getElementById(to.dataset.to)?.scrollIntoView({ behavior: 'smooth' }); return; }
  const a = e.target.closest('a[data-page]');
  if (!a) return;
  const anchor = a.dataset.anchor || '';
  if (a.getAttribute('href') === (location.hash || '#')) { e.preventDefault(); jump(anchor); }
  else if (!/^[\w-]+$/.test(anchor)) pending = anchor;
});

let hits = [], on = 0;
function search() {
  const q = $('q').value.trim().toLowerCase(), box = $('results');
  if (q.length < 2) { box.hidden = true; hits = []; return; }
  hits = D.pages.map(p => {
    const t = p.title.toLowerCase().indexOf(q), b = p.text.toLowerCase().indexOf(q);
    return { p, b, score: t === 0 ? 3 : t > 0 ? 2 : b >= 0 ? 1 : 0 };
  }).filter(h => h.score).sort((a, b) => b.score - a.score).slice(0, 8);
  on = 0;
  const mark = s => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
  box.innerHTML = hits.length ? hits.map((h, i) => `<a href="${href(h.p)}" class="${i ? '' : 'on'}">${mark(h.p.title)}<small>${h.b >= 0 ? '…' + mark(h.p.text.slice(Math.max(0, h.b - 50), h.b + 90)) + '…' : esc(label(h.p.section))}</small></a>`).join('')
    : '<b>Ничего не найдено</b>';
  box.hidden = false;
}
$('q').addEventListener('input', search);
$('q').addEventListener('focus', search);
$('q').addEventListener('keydown', e => {
  const items = $('results').querySelectorAll('a');
  if (e.key === 'Escape') { $('results').hidden = true; $('q').blur(); }
  if (!items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); items[on].classList.remove('on');
    on = (on + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length; items[on].classList.add('on');
  }
  if (e.key === 'Enter') { location.hash = items[on].getAttribute('href'); $('results').hidden = true; $('q').value = ''; $('q').blur(); }
});
$('results').addEventListener('click', e => { if (e.target.closest('a')) { $('results').hidden = true; $('q').value = ''; } });

history.scrollRestoration = 'manual';
addEventListener('hashchange', route);
route();
</script>
