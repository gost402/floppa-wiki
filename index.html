**Нам, самая малая форма.** Всё нужное для подачи уже есть: сцены с условиями и приоритетом, радио в углу, портреты и лепет. Не хватает текста. Три-четыре флоппы в гавани и на станции, у каждой короткая линия поручений со своим концом. Один голос по радио, который отвечает на то, что компания только что сделала. Разговор в гавани знает, как прошёл последний выход, и после гибели находит новое. Правило длины, как у Dredge: не больше четырёх-пяти окон, и каждая реплика либо говорит, что делать, либо двигает историю, либо смешит. Одна очередь речи для радио. Лор, имена и характеры выбирает владелец ([Сеттинг и лор](../story/setting.md)).\n\n### Живой мир с экономикой\n1. **Мир читают по движению на воде.** Агенты симуляции — то, что игрок видит, догоняет, охраняет и грабит, и они того же рода, что он сам: рейнджеры в Space Rangers, караваны и лорды в Warband, конвои в Starsector, сталкеры в S.T.A.L.K.E.R. У Freelancer и Endless Sky движение — это всё, что есть, и мир всё равно читается обжитым.\n2. **Торговая экономика внутри крошечная.** У Warband товара в мире нет вовсе, только цена, которая тянется к средней. У Endless Sky тридцать строк. Starsector после пяти переписываний считает товар единицами от одной до десяти. Игры с настоящими складами и производством — Bannerlord, Port Royale 4, X4 — как раз те, на чью экономику жалуются.\n3. **Прибыль даёт нарушение, а не маршрут.** В покое торговля почти не платит; окно открывают нехватка, потопленный конвой, блокада (Starsector). У игр с постоянными маршрутами одна жалоба: выучил — и мир повторяется (Freelancer).\n4. **Всякая беда сложена в одно-два числа на место.** Доступность и стабильность у Starsector, достаток у Warband, процент освобождения у Helldivers 2. «Эта гавань на трёх из десяти и падает» можно держать в голове за рулём; ведомость товаров — нельзя.\n5. **Состояние мира — маленькая колода названных условий со сроком.** Блокада, плотные патрули, торговая ссора (Star Traders); сбой поставок, пираты рядом (Starsector); общий приказ (Helldivers 2). Названное условие само себя объясняет.\n6. **Новость — мост из-за кадра, и хорошая новость несёт цену.** S.T.A.L.K.E.R. превращает события вне кадра в строки новостей; у Space Rangers новость об урожае — подсказка цены; у Starsector сообщение о сбое несёт новые цены.\n7. **Именные ровни и таблица, где игрок среди них.** Рейнджеры, сталкеры, лорды, контакты. Горстка имён делает больше тысячи безымянных агентов.\n8. **Вблизи — настоящее поведение, вдали — бросок кости, а агенты одни и те же.** S.T.A.L.K.E.R.; у нас так уже ходят рейсы рабочих лодок ([Жизнь моря](../world/life.md)).\n9. **Кто начинал с глубокой симуляции, резал её в сторону простоты, и по одним причинам.** Плоды симуляции нежеланны, скрыты от игрока и дороги (Starsector); нужды персонажей вырезаны (S.T.A.L.K.E.R.); экологию Ultima Online убрали, и никто не заметил ([Raph Koster](https://www.raphkoster.com/2006/06/05/uos-resource-system-part-3/)); динамическую экономику Freelancer вырезали до выхода.\n10. **Мир, что движется без игрока, ощущается потерей, и здесь же он скисает.** Работает, когда потеря крупная, медленная и показана: системы на карте Space Rangers, приказ со сроком в Helldivers 2. Не работает, когда мелких таймеров много и отсчёта нет: Drox.\n11. **Рассказчик может заменить симуляцию.** RimWorld выбирает следующую беду по богатству и потерям игрока; Endless Sky перекрашивает карту написанными событиями. Это дешевле, читается по построению, и темп остаётся у автора.\n\nTynan Sylvester, автор RimWorld, называет это [«мечтой о симуляции»](https://tynansylvester.com/2013/06/the-simulation-dream/): построй богатый мир, и истории возникнут сами. Мечта не сбывается, потому что игрок переживает не модель в коде, а картину, которую сам сложил из увиденного. Всё, что в картину не попало, ничего не стоит; всё, что игрок увидел, хотя этого не симулировали, достаётся даром. Его совет — симулировать только то, что игрок заметит и к чему неравнодушен. Правило Сида Мейера в пересказе Soren Johnson: «The player should have the fun, not the designer or the computer» ([статья](https://www.designer-notes.com/game-developer-column-5-sids-rules/)).\n\n**Нам, самая малая форма.** Товара в мире нет. У гавани и станции — базовая цена ящика каждого вида и одно число, которое гуляет и тянется обратно. Рабочая лодка, дошедшая до причала, чуть сдвигает цены: рыбак привёз улов — провизия подешевела; потопленная не сдвигает ничего. У каждого места одно число достатка, оно видно на карте и решает, что место продаёт и сколько платит. Три-шесть названных условий со сроком — блокада поста, тонкие патрули, нехватка после потоплений, хороший улов, — и у каждого строка по радио с ценой. Постоянная разница цен между двумя местами мала; окна открывают условия. Всё это — несколько чисел у хоста, одинаковых для четверых игроков. Чего не брать: складов и замкнутых циклов, правил, работу которых игрок не видит, заданий, сгорающих без отсчёта, и всего, что просит остановиться и управлять.\n\nЧем это отличается от снятого симулятора: там симуляция шла отдельно от игры, и игрок не видел её плодов и не мог на них влиять за рулём. Здесь каждое число существует только потому, что его двигает лодка на экране или показывает цена на экране. Это наше прочтение; ни один источник не говорит о нашей игре.\n\n### Заклятые враги\n1. **Память об одном событии.** Кто победил в прошлый раз и чем кончилось. Больше не нужно (Mordor, XCOM 2).\n2. **Имя и лицо привязаны к чему-то видимому.** Огненный орк с горящим мечом; флаг пирата в Pirates!; эмблема и машина пилота в Armored Core VI.\n3. **Лестница или доска, лучше с игроком на ней.** Десятка пиратов, чёрный список гонщиков, колода из 52 целей, доска синдиката.\n4. **Причина встретиться снова: враг держит твоё.** Долю добычи (Warframe), твою машину (Need for Speed), твоего бойца (XCOM 2).\n5. **Следствие поражения игрока.** Победитель получает повышение и говорит об этом (Mordor).\n6. **Конец в его логове, с его вещью в награду.** Цитадель Избранного, оружие лича, машина соперника.\n7. **Одна постоянная слабость и редкие возвращения.**\n\nГде это не работает:\n- Кто не проигрывает, тот ничего не видит (признание самой Monolith).\n- Именной охотник без памяти — помеха, а не враг (Assassin's Creed Odyssey).\n- Враг, который приходит поверх другого дела игрока (там же).\n- Враг становится воротами к добыче, и его добивают как рутину (Warframe, Path of Exile).\n- Слишком много и слишком сложно: семнадцать членов синдиката, двести капитанов SPAZ 2 — когда их двести, своего нет.\n- Слишком много слов и появлений (жалобы на Избранных).\n- Цена — в подаче: шестьдесят характеров и реплики к ним.\n\nВ коопе: у Warframe враг личный, но бьёт его весь отряд; личи приходят по очереди, подсказки общие, трофей — хозяину. В технике, где лиц не видно, врага делают личным табличка с именем и местом в списке, флаг или окраска, дом на карте, голос в эфире с репликами о прошлом, твоя вещь у него на виду и его машина как приз.\n\n**Нам, самая малая форма.** Не генератор, а трое-пятеро написанных капитанов — как трое Избранных или десятка Pirates!. У каждого лодка в своих цветах, дом на карте (пост или форт) и место в списке, где стоят и игроки. Капитан, потопивший игрока, поднимается в списке и говорит об этом по радио; трюм игрока, потерянный при гибели, уходит к нему. Розыск зовёт капитана из списка, а не безымянный патруль. Конец — бой у его дома, приз — деталь с его лодки. В коопе список общий для компании. Эта форма ближе к Pirates! (1987 и 2004), чем к Mordor, и не похожа на снятых соперников: те собирали добычу рядом с игроком, а эти приходят за ним.\n\n### Улучшения\n1. **Улучшение добавляет приём, а не процент.** Ноги в Armored Core VI меняют способ движения; предмет в Risk of Rain 2 добавляет поведение — цепь, поджог, лишний рывок; модификация Starsector меняет правила корабля. Таланты Windward по несколько процентов рецензенты не запомнили.\n2. **Улучшение видно.** В Naval Ops каждая деталь стоит на корпусе там, где её поставили; в SPAZ 2 ход корабля читают по силуэту. У нас так уже устроена лодка.\n3. **Ошибка ничего не стоит.** Armored Core VI продаёт детали по цене покупки; Everspace 2 выкупает корабль без потери; Windward сбрасывает таланты в порту за малую плату. Так игроки пробуют сборки.\n4. **Бюджеты вместо уровней.** Очки на корпус у Starsector, энергия и грузоподъёмность у Crossout, ёмкость у Warframe. У нас это вес, который стоит скорости.\n5. **Улучшение спорит с добычей за место.** В Dredge мотор и снасть лежат в тех же клетках трюма, что и улов. Первую версию — простой список покупок — авторы сами нашли скучной и переделали.\n6. **Добыча крупнее требует техники сильнее и оплачивает следующий шаг.** Black Flag: лестница целей, наверху — легендарные корабли.\n7. **Ветки против вида врага, а не одна лестница.** Monster Hunter: у оружия ветка на каждого зверя, и каждая лучше против чего-то.\n8. **Деталь открывает победа над тем, кто её носит.** Reassembly; Windward открывает тип корабля после нескольких потоплений такого же; Pirates! отдаёт корабль побеждённого.\n9. **Удобства верфи — не мелочь.** Авторам SPAZ 2 пришлось за пять недель после выхода добавить сравнение при наведении, замену на месте, «поставь лучшее» и готовые сборки.\n\nЧего избегать: лестницы «деньги за вещи», где растёт снаряжение, а не умение (Rebel Galaxy); улучшения из трёх рейсов (Skull and Bones); врагов, которые растут вместе с игроком и съедают рост (King of Seas).\n\n**Нам.** Деталей, меняющих приём, у лодки уже много: турель, рейки, дроны, мины, рывок. Не хватает цены, при которой покупка — событие, и лестницы целей, которая её оправдывает: посты дальше от гавани крепче (так решено 11-12), и новая деталь — то, что позволяет туда пойти. Продажа детали по цене покупки стоит одной строки и разрешает пробовать сборки.\n\n### Классы\n1. **Форм три: готовый класс, набор снаряжения и сборка из деталей.** Готовый класс — Deep Rock Galactic, Renegade Ops, World of Warships. Набор — Helldivers, оружие в Monster Hunter. Сборка — Starsector, Armored Core VI, Crossout, SPAZ 2 и наша верфь.\n2. **Класс — это один приём и одна встроенная слабость.** Щит, из-под которого нельзя стрелять; орудие, с которым нельзя ехать (Renegade Ops); правило, которое перестаёт платить, когда ходишь иначе (Everspace 2). В Monster Hunter у каждого оружия намеренный пробел, и его не латают.\n3. **Разница должна быть в руках, а не в числах.** Время ответа руля (World of Warships), сектора установок (Rebel Galaxy, Starsector), деталь движения (Crossout, Armored Core VI).\n4. **Одна рамка на все классы.** В Risk of Rain 2 у каждого четыре места с одним смыслом; новый класс понятен за минуту.\n5. **Готовые сборки поверх свободных деталей.** Стартовые корабли FTL, сохранённые сборки Starsector и Armored Core VI, полные и дешёвые стартовые корабли Cosmoteer.\n6. **Класс как карьера со своей историей.** Шесть героев Uncharted Waters: New Horizons; четыре фракции Windward с бонусом за свой способ играть.\n\nЧто делает классы нужными друг другу в коопе:\n- враги, каждый вид которых просит своего ответа (Vermintide 2);\n- враг, который держит одного игрока, пока его не освободит другой (там же);\n- умение со слабостью, которую закрывает напарник (Renegade Ops);\n- умения-ауры: тяжёлый корабль делает товарищей крепче, быстрый срывает броню для всех, корабль поддержки чинит (Windward);\n- задание, где каждому из четверых есть своё дело (ограбления GTA Online);\n- общий запас неудач на группу (Monster Hunter).\n\n**Нам.** Владелец выбрал сборку из деталей, и пять стилей уже есть. Малая форма: готовая стартовая лодка на каждый стиль; одно правило, которое платит за способ ходить (минёру — за погоню за ним, преследователю — за курс носом на цель); и посты, чей состав просит разных ответов. Без третьего пункта четверым выгоднее прийти на четырёх лучших лодках.\n\n### Кооп\n1. **Кто хранит прогресс.** Valheim: персонаж с вещами ходит между мирами, мир хранит сделанное с миром. Barotrauma и Cosmoteer: всё в сохранении хоста. У нас мир хоста хранит прогресс и добычу каждого игрока отдельно ([Онлайн-кооп](../online.md)).\n2. **Добыча без гонки.** Общая продажа, которая платит всем (Sea of Thieves); своя полная награда каждому (Monster Hunter); копия предмета для каждого, пока не возьмёт (Warframe). В Risk of Rain 2 предмет достаётся первому, кто коснулся, и это единственная гонка в списке.\n3. **С числом игроков врагов больше, а не они толще.** Risk of Rain 2. Valheim даёт врагу прибавку здоровья и урона за каждого игрока рядом. Monster Hunter: World вышла без шага для двоих и без отката, когда кто-то ушёл; оба пришлось добавлять.\n4. **Падение — не ожидание.** Borderlands: упавший ещё стреляет и встаёт, убив врага. Sea of Thieves: пятнадцать секунд дойти, четыре поднять. Cosmoteer в первые дни заставляла потопленного загружать сохранение, и автор назвал это главной бедой коопа. У нас товарищ поднимает потопленного у обломков.\n5. **Никакой привязи.** Renegade Ops раскладывает цели по карте, чтобы группа разошлась и сошлась. Самая частая жалоба на кооп Cosmoteer — нельзя уйти в другую систему без напарников.\n6. **Каждому из четверых есть дело.** Rockstar несколько раз переделывала ограбления с нуля, потому что версии, весёлые для двоих, оставляли двоих других без дела.\n7. **Ветеран и новичок в одной игре.** Sea of Thieves убрала силу; Borderlands 3 показывает каждому врагов его уровня; Vermintide 2 ставит потолок силы на сложность; у Sea of Thieves ранг открывает доступ, а не силу, и ветеран может взять с собой кого угодно.\n8. **В одиночку игра работает.** В Ship of Fools напарника заменяет самострельная пушка; Monster Hunter Wilds сажает на пустые места охотников ИИ.\n\n## Где желания спорят друг с другом\n\nНи одна из пятидесяти игр не сильна во всём сразу, и причина не в бюджете: желания мешают друг другу. Вот пять споров и то, как их решали.\n\n**Сюжет против коопа.** Чья это история и кто видел сцену?\n- Monster Hunter: World свела одиночную и общую кампании в одну и получила самую странную свою беду: чтобы пройти сюжетное задание вместе, каждый сначала должен сам посмотреть его сцену ([IGN](https://www.ign.com/articles/2018/01/25/monster-hunter-world-review)). Правило отсюда: сцена никогда не решает, кто с кем может играть.\n- Borderlands 2 решила иначе: злодей — голос по радио, реплику слышат все и везде, игра не останавливается. Раньше текст задания читал только тот, кто его взял.\n- Sea of Thieves начинает сюжетное дело голосованием команды и кладёт книгу задания каждому в руки.\n- В Divinity: Original Sin 2 и Baldur's Gate 3 отвечает тот, кто начал разговор; остальные смотрят и подсказывают.\n- Нам: мир и линия поручений живут у хоста (так уже устроено сохранение), радио звучит у всех, у причала отвечает тот, кто подошёл, а гость, не видевший прежних сцен, ничего не ждёт и ничего не пропускает.\n\n**Живой мир против аркады.** Мир, который идёт без игрока, требует остановиться и почитать.\n- Space Rangers читается, потому что идёт по ходам. Drox идёт в реальном времени и захлёбывается в сообщениях.\n- Решение у всех, кому удалось: одно-два числа на место, названные условия со сроком, новость с ценой, и никаких дел, для которых надо бросить руль.\n\n**Заклятые враги против коопа.** Чей это враг?\n- Warframe: враг личный, бьётся всем отрядом, приходит по одному за раз; трофей достаётся хозяину.\n- Нам проще: игроков четверо и компания одна, так что список врагов общий, а счёт с каждым — у того, кого он потопил.\n\n**Классы против свободной сборки.** Владелец выбрал детали, а не готовые типы лодок (2026-10-26). Классы и сборка при этом совместимы:\n- FTL: класс — стартовый набор, дальше свобода.\n- Starsector и Armored Core VI: сохранённые сборки и готовые образцы поверх свободных деталей.\n- Everspace 2: одно правило на корпус, которое платит за способ ходить.\n- Renegade Ops показывает нижнюю границу: одного умения на машину мало, чтобы она ощущалась другой.\n\n**Улучшения против коопа ветерана с новичком.**\n- Sea of Thieves убрала силу совсем: прогресс только во внешности.\n- Monster Hunter и Borderlands оставили силу и дали каждому свою награду; Borderlands 3 показывает каждому врагов его уровня.\n- Valheim усиливает врагов за каждого игрока рядом.\n- Нам: посты уже крепнут с числом игроков ([Онлайн-кооп](../online.md)); не решено, что делать, когда к новичку пришёл ветеран на дорогой лодке.\n\n**Всё сразу против маленькой команды.** Windward Horizon и Drox Operative 2 закрывают больше всех столбцов таблицы и остаются малыми играми. King of Seas обещал мир, сюжет, классы и добычу и получил 57 %. Авторы SPAZ, два человека, говорят: делай то, что сможешь закончить, и докажи веселье рано. Правило Сида Мейера: одна хорошая игра лучше двух отличных; вторая система должна быть короткой и служить первой. Для нас первая — лодка и бой.\n\n## К нашей игре\n\nЧто из этого следует, по порядку. Всё здесь — предложение; в игре ничего не изменено. Что входит в этапы, по-прежнему решает владелец ([Дорожная карта](../roadmap.md)).\n\n1. **Сначала лодка и бой.** У игр выше 95 % две-три сильные стороны, и первая всегда — сам цикл. Мир, враги и сюжет у King of Seas не спасли кругов у башен. Глубина боя уже стоит в этапе среза; желания её не отменяют.\n2. **Сюжет — самое дешёвое из желаний и самое близкое.** Система сцен, радио, портреты и голос-лепет уже есть; не хватает текста. Dredge получил номинации за сюжет на портретах, тексте и звуках вместо речи; Chinatown Wars рассказала всю историю сверху, неподвижными картинками. Первый шаг: три-четыре флоппы, у каждой короткая линия поручений со своим концом, и один голос по радио, который отвечает на то, что компания только что сделала. Лор и имена выбирает владелец ([Сеттинг и лор](../story/setting.md)).\n3. **Живой мир — второй шаг, на том, что уже ходит по морю.** Рабочие лодки с расписанием уже есть. Цена, которую двигает дошедшая лодка, число достатка у гавани и станции, три-шесть названных условий со строкой по радио — это несколько чисел у хоста, а не возвращение симулятора. Проверка простая: если игрок за рулём не увидел перемену и не смог ею воспользоваться, её не надо было считать.\n4. **Заклятые враги — только после ответа владельца** ([Q257](../questions/gaps.md#q257)). Если да, то малая форма: трое-пятеро написанных капитанов и список. Она опирается на розыск, посты и форт, которые уже есть. Гибель сейчас загружает последнее сохранение; чтобы капитан помнил свою победу, эту запись придётся хранить отдельно от сохранения мира.\n5. **Улучшения: сделать покупку событием.** Сегодня у новой игры 10 000 монет при самом дорогом корпусе в 1050. Образцы: Black Flag (добыча крупнее требует корабля сильнее и оплачивает следующий шаг), Dredge (улучшение спорит с грузом за одно место), Armored Core VI (продажа по цене покупки, чтобы пробовать сборки). Чего избегать — Skull and Bones: улучшение из трёх рейсов.\n6. **Классы: готовые сборки поверх свободных деталей.** Пять стилей уже есть. Не хватает трёх вещей: стартового набора на каждый стиль, чтобы новичок вышел в море на рабочей лодке; одного правила или умения, которое делает стиль своим за рулём; и врагов, каждый вид которых просит своего ответа, — тогда четверым выгодно прийти на разных лодках.\n7. **Кооп: договориться о деньгах, добыче и сюжете до того, как их станет много.** Продажа, которая платит всем; потеря только непроданного; мир и линия поручений у хоста, лодка и детали у игрока; сцена, которая никого не держит за дверью. Часть этого уже так ([Онлайн-кооп](../online.md)).\n\nЧего отчёт не советует: процедурный мир вместо написанного; больше одной-двух шкал времени разом; настоящие склады и производство; генератор врагов вместо написанных; класс, который запирает игрока; улучшение, собранное из трёх рейсов.\n\n## Чего не проверили\n- В игры не играли. Всё о том, как игра ощущается, — со слов рецензентов и игроков.\n- Видео не смотрели: доклады с конференций знаем по пересказам в прессе, отметок времени нет.\n- Оценки Steam — по отзывам на английском; общих чисел по всем языкам страница магазина без входа не показывает.\n- Блог автора Starsector не открывается автоматически: его посты знаем по выдержкам из поиска.\n- Часть сведений о Shadow of Mordor (экран армии), Warframe (история правок) и Избранных XCOM 2 (жалобы на болтливость) — из выдержек поиска, а не с открытых страниц; в текст они не вошли или помечены.\n- Патент пересказан по его странице и трём статьям. Это не заключение юриста; платит ли Warner пошлины и писала ли кому-то частным порядком, мы не знаем.\n- Far Cry 2, Red Dead Redemption 2, No Man's Sky, Pillars of Eternity II и Sunless Skies не разобраны.\n- Столбцы таблицы кандидатов — наше прочтение, а не измерение.\n"}, {"id": "reports-README", "path": "reports/README.md", "title": "Отчёты", "section": "reports", "date": "2026-11-17", "md": "# Отчёты\n\nОтчёты и исследования, которые раньше жили артефактами Claude. Пока хранятся здесь как есть, на языке оригинала. Это снимки на свою дату: решения и то, как устроена игра, — на страницах тем.\n\n## Выбор облика\n- 2026-11-07 [Облик всей игры](2026-11-07-art-directions/index.html) — шесть обликов на стенде `Art`. Владелец снял их 2026-11-14, стенд удалён.\n- 2026-11-06 [Облик меню](2026-11-06-menu-looks/index.html) — шесть обликов на стенде `Menus`. Наш выбор был Quiet; владелец не взял ни одного, и стенд убран (2026-11-17).\n- 2026-11-06 [Картины меню](2026-11-06-menu-paintings/index.html) — пауза и настройки, нарисованные FLUX. Владелец отверг; с 2026-11-07 картинки нейросетью не рисуем.\n\n## Проверки и разборы\n- 2026-11-14 [Вода заново](2026-11-14-water-overhaul.md) — как делают воду Sea of Thieves, другие игры и открытые проекты на GitHub, и план переделки по шагам.\n- 2026-11-14 [Замер кадра](2026-11-14-performance.md) — кадр по местам во весь экран, цена каждой части на GPU и в главном потоке, что исправить по выгоде.\n- 2026-11-13 [Палитра](2026-11-13-palette-audit.md) — QA проверил палитру: 82 хранимых цвета, из них около 36 независимых. Осталось 21.\n- 2026-11-13 [Список для игры](2026-11-13-play-checklist/index.html) — что построено с конца октября и ждёт оценки владельца, в порядке одной поездки: где это в игре и на что смотреть. Живёт артефактом https://claude.ai/artifact/WDVtDp2GJuSBonAw4hSy8u: оценки («Остаётся», «Чинить», «Вырезать») и заметки хранит его база, коллекция `verdicts`, по документу на вещь. Правишь список — опубликуй артефакт заново из этого файла.\n- 2026-11-08 [Greenlight](2026-11-08-greenlight-review/index.html) — пять издателей оценивают прототип, 4.6 из 10: «вернитесь с вертикальным срезом».\n- 2026-11-08 [Что убрать из игры](2026-11-08-cleanup-audit/index.html) — аудит лишнего. Владелец взял только пункты по коду (4a7b9a56).\n- 2026-11-04 [QA интерфейса](2026-11-04-interface-qa/index.html) — 102 замечания, все исправлены.\n- 2026-11-03 [Пресса](2026-11-03-press-review/index.html) — десять критиков, 63 из 100.\n\n## Другие игры\n- 2026-11-15 [Семь желаний](2026-11-15-dream-games.md) — как вышедшие игры делают то, о чём мечтает владелец: сюжет, живой мир с экономикой, заклятых врагов, улучшения, классы и кооп. Пятьдесят игр, от Windward, SPAZ и GTA до Hades и Deep Rock Galactic, кадры магазинов на странице; что общего у лучших, где желания спорят и самая малая форма каждого для нашей игры.\n- 2026-11-14 [Море с нашей камеры](2026-11-14-sea-camera-games.md) — тридцать девять игр с морем сверху, тринадцать разобраны по кадрам, кадры магазинов на странице: мель, пена, след, солнце, берег, ночь; на что смотреть перед шагами 3–6 плана воды.\n- 2026-11-07 [Escape from Duckov](2026-11-07-escape-from-duckov.pdf) и [Dave the Diver](2026-11-07-dave-the-diver.pdf) — разборы игр (PDF).\n- 2026-10-28 [Аркадные морские игры](2026-10-28-arcade-naval-reference.md) — восемь игр-ориентиров для аркадного поворота.\n\n## Времён симулятора\nДо аркадного поворота 2026-10-26; игра с тех пор другая (тег `simulator-game`).\n- 2026-10-13 [Подходы к карте](2026-10-13-map-approaches.md) — как строить карту морской песочницы.\n- 2026-10-11 [Судовой журнал идей](2026-10-11-captains-ledger/index.html) — 518 идей по системам.\n- 2026-10-11 [Becoming Windward](2026-10-11-becoming-windward/index.html) — Windward, WaveWorks и выбор движка.\n- 2026-10-11 [Фэнтезийный архипелаг](2026-10-11-fantasy-archipelago/index.html) — исследование кооп-песочницы.\n- 2026-10-09 [Вода](2026-10-09-water-field-guide/index.html) — справочник по воде.\n\nПредложения по сеттингу лежат на своём месте: [story/lore-proposals.html](../story/lore-proposals.html).\n"}, {"id": "roadmap", "path": "roadmap.md", "title": "Дорожная карта", "section": "", "date": "2026-11-17", "md": "# Дорожная карта\n\nЧто сделать до полного релиза в Steam и в каком порядке. Порядок этапов решил владелец; что внутри этапов и их сроки — наш план.\n\n## Решения владельца\n- 2026-11-13 владелец спросил, что нужно игре до полного релиза в Steam, если целиться в 90 на Metacritic, и попросил записать это дорожной картой.\n- 2026-11-13 порядок этапов утверждён: что это за игра; срез и рядом с ним чужие машины и страница Steam; демо; ранний доступ; релиз 1.0.\n- 2026-11-16 сначала альфа: довести до ума то, что в игре уже есть.\n- 2026-11-17: железо и проверку сборки для Windows решим позже, к демо.\n- 2026-11-16 в альфе новых систем не начинаем: новая система, о которой попросит владелец, встаёт после альфы или вместо чего-то из её списка. Сменено: заморозки нет (11-13).\n\n## Планка\n90 — мерка для каждой части игры, а не прогноз: столько получают единицы независимых игр в год. У них общее:\n- цикл хорош и в первую минуту, и на двадцатом часу;\n- облик узнаётся по одному кадру;\n- каждые полчаса игрок встречает новое;\n- ничто не мешает: обучение, скорость, управление, доступность;\n- игру долго правили на живых игроках до релиза.\n\nОткуда идём: [Greenlight](reports/2026-11-08-greenlight-review/index.html) поставил прототипу 4,6 из 10 и просил вертикальный срез, [Пресса](reports/2026-11-03-press-review/index.html) — 63 из 100. С тех пор решена цель игры (поручения и финальный босс, [11-12](decisions.md)), построен кооп через Steam ([Онлайн-кооп](online.md)), интерфейс сведён в одну тему ([Компоненты](art/components.md)). С 11-13 по 11-16 в игру пришли жизнь моря, розыск и патруль, забавы, форт пиратов, соперники, открытый мир с сохранением и главным меню, сутки и погода со штормами, а вода переделана. Почти ничего из этого владелец ещё не играл, отсюда альфа.\n\n## Порядок\nЭтап начинается, когда у предыдущего выполнено «Готово, когда». Порядок важнее сроков; сроки грубые. Альфа вобрала прежний первый этап «Что это за игра»: что это за игра, решается, пока владелец играет то, что есть.\n\n### 1. Альфа: довести то, что есть — около трёх недель\nАльфа — игра, где всё построенное работает, читается и держится вместе. Задания, броненосец, портреты и краска патруля пока заглушки, но не ломаются. Её можно дать друзьям, не извиняясь за поломки.\n\nНовых систем в альфе не начинаем (решено 11-16, выше).\n\n**Владелец играет и решает**\n- Почти всё с конца октября построено без игры владельца: в [Списке для игры](https://claude.ai/artifact/WDVtDp2GJuSBonAw4hSy8u) нет ни одной оценки. Владелец играет одну часть за раз и про каждую говорит: оставить, поправить или убрать. Правки идут между сессиями, поправленное он играет снова.\n- Части по порядку: лодка и бой; гавань, торговец, верфь и первая покупка; жизнь моря, розыск, забавы, форт и соперники; задания и броненосец; погода, сутки и море; звук и музыка; меню, HUD, карта и настройки; кооператив с другом.\n- Убранное уходит целиком: код, демо, слова и страницы вики.\n- Стенд `Menus` со старыми кандидатами меню убран 2026-11-17: ни один облик не взят, меню игры владелец правил сам 11-16.\n- После игры [Об игре](vision.md) называет крючок одной фразой, опоры и игрока: какие из [семи желаний](reports/2026-11-15-dream-games.md) стали опорами. Наше предложение опор: лодкой весело править, и руль — это прицел; каждая сборка дерётся по-своему; добычу надо довезти; мир флопп тёплый и смешной; с друзьями лучше.\n\n**Держится вместе**\n- Час игры без вылета и без ошибок в журнале игры (`app_userdata/Pirates/logs`).\n- Сохранения не теряют прогресс: «Продолжить», «Загрузить», автосохранение и загрузка после гибели; сохранение прошлой версии открывается.\n- Кадр без рывков: затенение неба новой лодки и земли, первое открытие карты и первые секунды верфи уходят за шторку загрузки или из главного потока ([Известные недочёты](known-issues.md)).\n- Кадр замерен заново после работы 11-16 (штормы, объёмные облака, ночь, долгий бой) и держит 90–100 к/с во весь экран на Mac владельца.\n- Бой читается на 1080p днём, ночью и в шторм: лодка игрока отличима от охотников, ракеты и попадания видны. Greenlight 11-08 отметил это всеми пятью местами.\n- Исправлен каждый [недочёт](known-issues.md), который новый игрок встретит в первый час: например, ракеты сквозь сарай мастерской, лента причала поверх сарая, ящики, различимые только цветом. Остальные владелец принимает на время до среза.\n\n**Одна игра, а не стопка прототипов**\n- Весь текст есть по-русски и по-английски, `tools/locale.py --check` чист.\n- Новый звук и эффекты владелец услышал и увидел (демо `Sounds` и `Effects`, затем бой), и их уровни сведены на его слух ([Звук](audio/sound.md)).\n- Управление можно узнать в самой игре: сейчас клавиши описаны только в вики ([Управление](interface/controls.md)).\n\n**Цикл от начала до цели**\n- Новая игра, первый бой, продажа, первая покупка, задание и броненосец проходятся подряд без тупика, пусть и на заглушках.\n- Первая деталь стоит одного-двух выходов в море. С 2026-11-17 новая игра даёт 150 монет, а самый дорогой корпус стоит 1050.\n\n**Кооператив держится**\n- Всё из «Пока не онлайн» ([Онлайн-кооп](online.md)) либо онлайн, либо в кооперативе не появляется. Гостю есть что подобрать, продать и купить; гость видит буи дающих задания и слышит их реплики; над лодками товарищей их имена.\n- В кооп через Steam сыграли с другом по интернету.\n\n**Сборки**\n- Сборка игрока без демо и стендов: сейчас экспорт берёт весь проект (`game/export_presets.cfg`). Оставить ли редакторы карт и сюжета в меню игрока, решает владелец.\n- Сборку для Windows запустили и сыграли хотя бы раз.\n- Альфа выходит версией 0.1.\n\nГотово, когда: владелец сыграл каждую часть игры и про каждую сказал «оставить», «поправить» или «убрать», а поправленное сыграл снова; час игры у владельца и у двух-трёх друзей, один раз в кооперативе по интернету, прошёл без вылета, потерянного сохранения и тупика; сборки для Mac и Windows без демо вышли версией 0.1.\n\n### 2. Срез — один-два месяца\nТридцать–сорок пять минут игры в качестве релиза: обучение, первый район с его поручениями, первый босс.\n- **Обучение по рации** — первое поручение (решено [11-12](decisions.md)): руль, рывок, захват цели, швартовка, продажа. Кончается победой.\n- **Глубина боя.** Турель целится сама, ракеты идут в захват, мышь не целится ([Бой](gameplay/combat.md)): мастерство — это руль, рывок, парирование и таран. Каждый вид охотника просит своего ответа; после чистого уклонения есть окно для удара; парирование что-то возвращает. Стартовая лодка с одной турелью должна быть интересной: с неё начинает каждый.\n- **Проверка «мышью не целятся»** на игроках с клавиатурой.\n- **Настоящие поручения и босс** вместо заглушек заданий и броненосца.\n- **Флоппы в мире**: модели на пирсе и на станции; сейчас они только на портретах ([Люди: флоппы](art/people.md)).\n\nГотово, когда: срез сыграли 5–20 человек со стороны, и большинство дошло до конца и хочет ещё.\n\n### 3. Чужие машины и страница Steam — рядом с этапом 2\n- Названо самое слабое железо; есть низкий уровень качества; игра идёт на Steam Deck.\n- Бой одинаков на 30 и на 144 кадрах в секунду: лодки и снаряды шагают по времени кадра (`Boat._Process`, `Projectile._Process`). Если расходится — фиксированный такт.\n- Имя и кот решены до любой публичной страницы. «Флоппа» — мем о настоящем каракале; его хозяева уже лицензируют его для игрушек, а портреты игры нарисованы по его фото ([Greenlight](reports/2026-11-08-greenlight-review/index.html): быстрый поиск, не проверка юриста). Нужна письменная лицензия хозяев, или своё имя и свои каракалы.\n- Портреты, логотип и ключевой арт от художника — тоже до неё: Steam спрашивает о картинках от ИИ.\n- Свой App ID вместо тестового, страница Steam и цена, закрытый тест через Steam.\n\nГотово, когда: срез идёт на 60 к/с на названном слабом PC и на Steam Deck, и страница Steam открыта.\n\n### 4. Демо — два-три месяца\n- Срез выходит публичным демо и собирает желающих на странице Steam.\n- Смотрим, где игру бросают и где тонут, и правим срез, пока его не доигрывают.\n- В кооп по интернету сыграли чужие люди.\n\nГотово, когда: демо доигрывают до босса, и отзывы на него в основном хорошие.\n\n### 5. Ранний доступ — шесть-двенадцать месяцев\n- **Линия поручений** до финального босса (решено [11-12](decisions.md)): четыре-пять районов моря со своим светом, опасностями и охотниками (так умеют [Локации](world/locations.md)), 25–40 поручений, пять-шесть боссов, каждый учит своей [сборке](gameplay/builds.md), финал. Итог — 10–15 часов.\n- **Новое каждые полчаса**: деталь, охотник, опасность или место.\n- **Экономика целиком**: детали приходят с поручениями, и на десятом часу ещё есть чего хотеть.\n- **Реплики**: маленький состав флопп (корабел, мытарь, торговец) с живыми голосами и шутками. Лор по-прежнему выбирает владелец ([Сеттинг и лор](story/setting.md)).\n- **Довести или вырезать** каждую побочную систему, что пережила альфу: [места промысла](gameplay/sites.md), расходники, дроны, редакторы карт и сюжета.\n\nГотово, когда: игру проходят до финала, и отзывы в Steam «очень положительные» или лучше.\n\n### 6. Релиз 1.0\n- Доступность: свои и чужие ракеты различимы не только цветом, крупный текст. Переназначение клавиш и геймпада.\n- Языки сверх английского и русского.\n- Облачные сохранения и достижения.\n- Звук: сведение, временные звуки заменены, одна тема, которую напевают.\n- [Известные недочёты](known-issues.md) пусты.\n- Пресса: Metacritic ставит оценку только после нескольких рецензий критиков, так что нужны издатель или PR, ключи заранее и трейлер.\n"}, {"id": "story-dialogue", "path": "story/dialogue.md", "title": "Диалоги и голос", "section": "story", "date": "2026-11-17", "md": "# Диалоги и голос\n\n![Корабел](../img/shipwright.jpg)\n\n![Диалог: реплика в матовом стекле, ответы списком](../img/dialogue.jpg)\n\nКак показан разговор: портреты, выноска, буквы по одной и кошачий лепет вместо слов. Сами сцены описаны в [Сценах сюжета](scenes.md).\n\n## Решения владельца\n- Разговор с кем-то — диалог, как в визуальной новелле: большой нарисованный портрет каждого говорящего рядом с репликами, лицо меняется по реакции.\n- Портреты стоят у нижнего края экрана, говорящий подсвечен; его реплика в выноске между ними.\n- Выноска — из стекла, как всё стекло интерфейса; ответы стоят списком, как меню; имя говорящего — мелкая подпись (решение 2026-11-12, [решения](../decisions.md)).\n- Говорящие лепечут, а не произносят слова: каждая буква — короткий кошачий звук, высота зависит от говорящего, одни и те же буквы звучат всегда одинаково. Злые слова рычат.\n- Реплики движутся: буквы выскакивают, когда их произносят; слова волнуются, трясутся, стоят крупно цветом с блеском или переливаются радугой; некоторые говорятся медленно, паузы держат слова, а лицо посреди реплики меняется с прыжком.\n- Корабел здоровается с игроком на верфи.\n- Пока идёт диалог, экран за ним не отвлекает: мир и приборы уходят на задний план.\n- 2026-11-17: диалог и радио в стекле — как сейчас.\n"}, {"id": "story-scenes", "path": "story/scenes.md", "title": "Сцены сюжета", "section": "story", "date": "2026-11-17", "md": "# Сцены сюжета\n\n![Мытарь](../img/tollkeeper.jpg)\n\nКак игра рассказывает сюжет: сцены, их поводы, условия, радио. Сцены пишут в [редакторе сюжета](../tools/story-editor.md); как звучат и выглядят сами диалоги, описано в [Диалогах и голосе](dialogue.md).\n\n## Решения владельца\n- Сюжет рассказывают сценами, которые пишут во встроенном редакторе сюжета.\n- Сцена — это граф эпизодов на холсте. Каждый эпизод — сценарий: кто говорит, с каким лицом, и реплика с метками.\n- Сцены ветвятся по ответам игрока, проверяют условия по флагам и по игре, ставят флаги и действуют в игре, например дают монеты или деталь.\n- Повод рассказывает одну сцену: из тех, чьи условия выполнены, ту, у которой наивысший приоритет. Сцену можно рассказать только один раз.\n- Сцены запускаются в местах на базе, до и после захода, по радио в бою и при подходе к флоппе. Базы как экрана с 2026-11-13 нет: её места — причал гавани и верфь.\n- 2026-11-17: как сейчас.\n"}, {"id": "story-setting", "path": "story/setting.md", "title": "Сеттинг и лор", "section": "story", "date": "2026-11-17", "md": "# Сеттинг и лор\n\nМир, в котором идёт игра, и правила, по которым в неё попадает лор.\n\n## Решения владельца\n- Сеттинг: оптимистичный мир соларпанка спустя долгое время после падения. Современный мир, из которого он вырос, — далёкое прошлое, и о нём мало что помнят (владелец, 2026-11-02).\n- Все жители — флоппы ([Люди: флоппы](../art/people.md)).\n\n## Правила лора\n- Лор попадает в игру и в вики только тогда, когда владелец назовёт кусок. Понравившееся предложение — не приказ его строить.\n- Любой лор, фракцию или механику сверх решённого помечать как предложение.\n- Мир описывают простыми идеями: места и люди — по тому, что они есть («закрытый остров», «наставник на верфи»), а не придуманными именами. Без глоссариев, придуманных эпох и календарей, списков титулов и именованного состава: придуманные слова владелец читает как сгенерированный мусор (2026-10-27).\n- Персонажи — роли без имён: капитан, корабел, мытарь.\n\n## Предложения\n- [Предложения по сеттингу](lore-proposals.html) (на английском): пять миров соларпанка после падения и смесь двух из них — затопленного города и закрытого острова. Каждая вкладка — питч, идеи мира, карта, как это играется, таблица идей, сюжет и повороты, мудборд. Ничего из этого нет в игре; владелец выберет куски сам.\n- Владелец читает их с телефона как артефакт: https://claude.ai/artifact/7xXEeNLqmCzpaGSYH9rbZt. Правишь страницу — опубликуй артефакт заново.\n"}, {"id": "todo", "path": "todo.md", "title": "Задачи", "section": "", "date": "2026-11-17", "md": "# Задачи\n\nЧто владелец решил, но в игре ещё не сделано. Задача живёт здесь, пока её не сделают; сделанную удаляют, а решение остаётся на странице темы.\n\n## Мир\n- **Рабочие лодки живее: с ними говорят** — реплики на ходу, когда лодка игрока проходит рядом, разговор с выбором, как с корабелом, и поручения от них (проводить, отбить). Лодок уже меньше (2026-11-17). Разговоры и поручения — новые системы: по [Дорожной карте](roadmap.md) они встают после альфы или вместо чего-то из её списка. Решение: [Жизнь моря](world/life.md), 2026-11-17.\n"}, {"id": "tools-README", "path": "tools/README.md", "title": "Инструменты в игре", "section": "tools", "date": "2026-11-17", "md": "# Инструменты в игре\n\nЧем в самой игре делают карты и сюжет и чем её проверяют в бою. Все открываются из меню `Esc`, страница «Инструменты».\n\n- [Редактор карт](map-editor.md): карты и их задания над живым миром.\n- [Редактор сюжета](story-editor.md): сцены и сценарии.\n- [Меню читов](cheats.md): монеты, припасы и охотники прямо в игре, для проверки.\n"}, {"id": "tools-cheats", "path": "tools/cheats.md", "title": "Меню читов", "section": "tools", "date": "2026-11-17", "md": "# Меню читов\n\nОкно в самой игре, которое даёт монеты, поднимает припасы у лодки и вызывает охотников: чтобы проверять верфь и бой, не зарабатывая монеты и не ища охотников по карте.\n\n## Решения владельца\n- 2026-11-17: меню читов: монеты, припасы, охотники.\n"}, {"id": "tools-map-editor", "path": "tools/map-editor.md", "title": "Редактор карт", "section": "tools", "date": "2026-11-19", "md": "# Редактор карт\n\n![Редактор карт: окна в матовом стекле](../img/map-editor.jpg)\n\nРедактор в игре, в котором правят карты и их задания над живым миром.\n\n## Решения владельца\n- Редактор карт в игре, открывается из меню (с 2026-11-13 — `Esc`, «Инструменты»): локация карты (острова, рифы, отмели, вода, час, ветер, ветровые волны, зыбь) и её задания (старт, охотники и их роли, маяки и косяки), правятся над живым миром, виденным сверху. Карты — файлы: собственные карты игрока и собственные карты игры, которые открываются в нём, чтобы их чинить.\n- Редактор расставляет круги арены и кадры вставок ([Камера и картинка](../gameplay/camera.md)).\n- 2026-11-17: как сейчас.\n"}, {"id": "tools-story-editor", "path": "tools/story-editor.md", "title": "Редактор сюжета", "section": "tools", "date": "2026-11-17", "md": "# Редактор сюжета\n\nРедактор в игре, в котором пишут сцены сюжета. Как сцены устроены и когда запускаются: [Сцены сюжета](../story/scenes.md).\n\n## Решения владельца\n- Сюжет рассказывают сценами, которые пишут во встроенном редакторе сюжета.\n- Сцена — это граф эпизодов на холсте. Каждый эпизод — сценарий: кто говорит, с каким лицом, и реплика с метками.\n"}, {"id": "vision", "path": "vision.md", "title": "Об игре", "section": "", "date": "2026-11-17", "md": "# Об игре\n\n![Охотники идут на лодку игрока у острова](img/world.jpg)\n\nFloppa Tropical Adventures коротко: что это за игра и в каком она состоянии.\n\n## Решения владельца\n- Игра называется Floppa Tropical Adventures. Код и репозиторий по-прежнему называют её Pirates; игроку это слово не показывается.\n- Аркадная морская игра: одна лодка, которой управляешь с весёлым ощущением моторной лодки, а не физикой, бой с вражескими лодками на красивом море, статичный изометрический вид 2.5D.\n- Веселье важнее реализма: где реалистичная модель делает игру медленной или раздражающей, делаем то, что делают выпущенные игры. Реализм оставляем только там, где он делает игру лучше.\n- PC.\n- Кооператив по сети до четырёх игроков, каждый в своей лодке ([Онлайн-кооп](online.md)).\n- Сеттинг — оптимистичный соларпанк спустя долгое время после падения ([Сеттинг и лор](story/setting.md)).\n- 60 кадров в секунду достаточно; качество картинки важнее (2026-10-26).\n- 2026-11-17: игру показывают людям кроме владельца с демо в Steam; до того играет только владелец.\n\n## Как играется\n- Игра открывается главным меню над морем и продолжается с последнего сохранения, в [открытом мире](gameplay/missions.md): одна большая карта ([локация](world/locations.md)) и бесконечный заход. Лодка дерётся с [охотниками](gameplay/hunters.md), которые выходят с [постов](world/areas.md) карты, берёт задания и собирает [добычу](gameplay/haul.md) в трюм.\n- Добычу продают за монеты в [гавани](base/pier.md), мастерской корабела на острове, или у плавучей [станции](world/outpost.md). К причалу доплывают сами и швартуются на `Space`: лодка остаётся в мире, а над морем встаёт лента «Торговать», «Верфь», «Отчалить». На [верфи](base/boatyard.md) на монеты покупают детали лодки.\n- Море живёт своей жизнью, как город в играх с открытым миром (2026-11-13): по нему ходят [рабочие лодки](world/life.md), которые ни с кем не воюют. Кто их трогает, попадает в [розыск](gameplay/wanted.md), и за ним приходит патруль. В углу карты стоит [форт пиратов](world/fort.md): он и его чёрные лодки нападают на любую лодку, что подойдёт близко. Задания берут у буёв флопп, по одному.\n- Утонув, лодка теряет трюм, а игра загружается с последнего сохранения ([Прогресс и сохранения](gameplay/progression.md)).\n\n## Состояние\n- Всё — прототип, и ничто не высечено в камне ([Главная](README.md)).\n- Задания и броненосец — заглушки, а не настоящие. Честность и доступность настраиваются ближе к релизу. Будут новые функции.\n- Владелец судит игру, играя; многое из сделанного в ноябре 2026 он ещё не играл ([Журнал решений](decisions.md)).\n- Версии 0.0.N выходят с постами в канале игры.\n- Игра идёт к полному релизу в Steam; ближайший этап — альфа, доводка того, что уже есть. Что делаем до релиза и в каком порядке: [Дорожная карта](roadmap.md).\n- Как мы делаем игру — принципы и правила проекта: [CLAUDE.md](../CLAUDE.md).\n"}, {"id": "world-areas", "path": "world/areas.md", "title": "Зоны и опасности", "section": "world", "date": "2026-11-17", "md": "# Зоны и опасности\n\n![Горящее нефтяное пятно](../img/slick.jpg)\n\nЗоны — места на карте: посты охраны, минные поля и прочие опасности. В мире (`maps/world.json`) их около пятидесяти.\n\n## Решения владельца\n- Директора нет (2026-11-11): охотники выходят только с постов охраны, поставленных на карте. Охотников поста выбирают в редакторе по одному: проект, роль, команда.\n- Течений и бонов нет (2026-11-14): владелец убрал оба вида из игры.\n- 2026-11-17: импульсные башни и прожекторы убрать из игры совсем, и из редактора карт тоже.\n- 2026-11-17: охотников в мире меньше; механика постов (возврат, пока игрока нет рядом) — как сейчас.\n- 2026-11-17: пока как сейчас.\n"}, {"id": "world-fort", "path": "world/fort.md", "title": "Форт пиратов", "section": "world", "date": "2026-11-17", "md": "# Форт пиратов\n\n![Форт пиратов на своей скале, чёрные лодки у ворот](../img/fort.jpg)\n\nПиратский остров: старый каменный форт на скале, чёрные лодки под чёрными парусами и флоппы-пираты вокруг. Форт и его лодки нападают на любую лодку, которая подходит близко.\n\n## Решения владельца\n- 2026-11-14 владелец попросил пиратский остров с чёрными кораблями и пиратами вокруг, который нападает на любого, кто подплывает близко.\n- Пираты — новая сторона, отдельная от банды охотников: форт и его лодки нападают на любую лодку рядом — игроков, рабочие лодки, патруль и банду. Ушедшую далеко от форта не преследуют (2026-11-14).\n- Их корабли — моторные лодки старого мира, переделанные пиратами: мачта и чёрный косой парус над палубой, флаг на топе (2026-11-14).\n- Остров — старый каменный форт на скале: стены, бастионы, батареи, флаг над башней; лодки стоят в бухте под ним (2026-11-14).\n- Пираты — флоппы и сидят на причале, на крышах, у костра и на башне: повязка на глаз, бандана или треуголка, серьга, рваный жилет; чуть крупнее жизни, чтобы читались сверху (2026-11-14).\n- 2026-11-17: пираты и банда охотников заодно и не трогают друг друга; патруль бьёт пиратов, рабочие лодки от них убегают, за потопленных пиратов розыска нет.\n- 2026-11-17: форт можно взять: когда разбиты все его орудия, форт пал и даёт награду. Облик форта и его орудия — как сейчас.\n- 2026-11-17: награда за взятый форт — сокровище из его двора: монеты (около 300) и россыпь ящиков с добычей на воде у ворот; ящики подбирают и везут к торговцу, как добычу с потопленных лодок.\n- 2026-11-17: пираты возвращаются: примерно через игровые сутки (12 минут) они снова держат форт, и его можно взять снова.\n- 2026-11-17: лодки пиратов, их облик и место форта — как сейчас.\n- 2026-11-17: флоппы-пираты у форта — как сейчас: сидят, поворачивают голову, хвост качается.\n"}, {"id": "world-ground", "path": "world/ground.md", "title": "Рельеф", "section": "world", "date": "2026-11-17", "md": "# Рельеф\n\n![Остров на отмели и коса](../img/shallows.jpg)\n\nРельеф — земля локации, склеенная из форм рельефа в одно поле высот.\n\n## Решения владельца\n- Карты содержат больше видов земли, каждый ставится в редакторе карт и разнообразится зерном и несколькими числами: горы и вулканы, барьерные рифы, кекуры, косы и песчаные отмели.\n- Горы — голый камень примерно до 120 м: серый камень и отвесные скалы, зелень только у подножия. Земля, закрывающая лодку, становится прозрачной вокруг неё.\n- Барьерный риф — полоса коралла прямо под водой, вдоль берега или дугой в море: зыбь белым разбивается вдоль неё, за ней лежит спокойная бирюзовая лагуна, и в ней прорезаны проходы.\n- Кекуры — карстовые башни высотой от 10 до 40 м: серые столбы с отвесными стенами, подточенные у воды, увенчанные джунглями, как в заливах Пханг Нга или Халонг.\n- Косы и песчаные отмели: белые отмели чуть над водой среди светящегося бирюзового мелководья; длинные косы, загибающиеся от берега, с травой на дюнах и пальмами на конце; и валы чуть под водой, через которые прибой разбивается рядами, слишком мелкие для тяжёлой лодки.\n"}, {"id": "world-hulk", "path": "world/hulk.md", "title": "Корабль на мели", "section": "world", "date": "2026-11-17", "md": "# Корабль на мели\n\nВ тихом глазу шторма, который никогда не уходит, за Отмелями, на песчаной банке навсегда сел старый контейнеровоз. На его пирсе на горе хлама сидит старьёвщик и продаёт диковины — странные припасы со смешным действием: фейерверк, магнит и шарики, которые пускают в ход клавишей `5`.\n\n## Решения владельца\n- 2026-11-17: в середине шторма, который не уходит, — остров в тихом глазу бури, без шторма, с пирсом и странным забавным торговцем ([Погода](weather.md)).\n- 2026-11-17: остров — это корабль: огромный ржавый контейнеровоз старого мира, накренившийся на мели; на контейнерах сады и пальмы, на надстройке солнечные панели и ветряк; пирс у борта.\n- 2026-11-17: торговец-флоппа сидит на горе хлама, который принёс шторм: буи, бочки, старая техника.\n- 2026-11-17: к нему плывут сквозь шторм за странными припасами со странными и смешными эффектами.\n"}, {"id": "world-life", "path": "world/life.md", "title": "Жизнь моря", "section": "world", "date": "2026-11-17", "md": "# Жизнь моря\n\nРабочие лодки, которые живут на море и ни с кем не воюют: рыбаки, паромы, сухогрузы. Море живёт своей жизнью, а неприятности начинает игрок.\n\n## Решения владельца\n- 2026-11-14 владелец попросил дать мирным лодкам расписание и живое поведение.\n- Рыбак ловит сетью со стрелы, снасть чуть крупнее жизни; на косяке плещется рыба (2026-11-14).\n- 2026-11-13 владелец попросил сделать игру похожей на старые GTA и одобрил мирные лодки на маршрутах между гаванью, станцией и краем карты: они сторонятся, убегают, их можно таранить и топить ради ящиков.\n- Это основа для более подробной жизни мира: торговцев, караванов и прочего (2026-11-13).\n- Каждой лодкой, кроме лодки игрока, управляет один ИИ, так что торговцы и караваны с охраной смогут присоединиться позже ([Охотники и ИИ](../gameplay/hunters.md)).\n- 2026-11-17: у патруля мигалка и сирена. Остальной облик рабочих лодок и патруля пока временный.\n- 2026-11-17: рабочих лодок в мире меньше, но они живее, и с ними говорят: реплики на ходу, разговор с выбором и поручения от них.\n- 2026-11-17: расписания и поведение рабочих лодок — как сейчас; лодок меньше (см. выше).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n"}, {"id": "world-locations", "path": "world/locations.md", "title": "Локации", "section": "world", "date": "2026-11-17", "md": "# Локации\n\nЛокация — набор значений для общих моделей мира: она выглядит и играется так, как велит её природа.\n\n## Решения владельца\n- Открытый мир сражается в своей локации, со своей водой, часом, ветром и волнами: открытые банки под сильными пассатами, а гавань, мастерская корабела (`Dock`), стоит у острова `Home cay`.\n"}, {"id": "world-outpost", "path": "world/outpost.md", "title": "Станция", "section": "world", "date": "2026-11-17", "md": "# Станция\n\n![Станция в открытом море, лодка у её плота](../img/outpost.jpg)\n\nПлавучая торговая ботаническая станция «Мария»: большой старый корпус, поставленный на якорь навсегда, с садом и рынком на нём. К ней подходят продать добычу, не возвращаясь в гавань у пирса.\n\n## Решения владельца\n- В игре есть плавучая торговая ботаническая станция, большой корабль-станция по картинке владельца (2026-11-11): синий деревянный корпус-бочонок, надстройка в несколько ярусов с открытыми галереями, стеклянный свод оранжереи, сад на каждой палубе и крыше, мачта с гирляндами. Смоделирована в Blender.\n- Станцию зовут «Мария», по-английски Mariia (2026-11-12).\n- Имя написано на носу по обоим бортам, латиницей (MARIIA), золотыми прописными с засечками, на тёмно-синей панели фальшборта под планширем, где его видно из вида боя; кустов над ним нет (2026-11-12).\n- Облик проверяет QA-агент, пока станция не выглядит как в лучших инди-играх.\n- Стёкла станции настоящие, прозрачные: сад виден сквозь них (2026-11-11). Это новый материал для игры.\n- «Мария» покупает ящики дешевле гавани и продаёт за монеты ремонт и топливо; деталей не продаёт (2026-11-12). Торгует на ней мытарь, на экране торговца ([Добыча](../gameplay/haul.md), 2026-11-13).\n- 2026-11-17: стекло в игре одно: ветровые стёкла и рубки лодок и фонари пирса — то же прозрачное стекло, что у станции (`Surfaces.Glass`).\n- 2026-11-17: станция пока одна. Торговать можно только внутри кольца поплавков, и у пирса так же.\n- 2026-11-17: как сейчас (принято владельцем вместе с остальной добычей).\n"}, {"id": "world-sea", "path": "world/sea.md", "title": "Море", "section": "world", "date": "2026-11-17", "md": "# Море\n\n![След лодки на открытом море](../img/sea.jpg)\n\nМоре — вода игры: волны, укрытие и прибой, кильватерные следы, пена, отражение и цвет.\n\n## Решения владельца\n- Красивый океан.\n- Остров с большой площадью мелководья рядом, чтобы море выглядело красиво.\n- 2026-11-14: воду переделать целиком, облик — как в Sea of Thieves ([Облик мира](../art/world-look.md)). Что и в каком порядке — в [плане](../reports/2026-11-14-water-overhaul.md); его первые четыре шага — цвет, волны, пена и след — сделаны.\n- 2026-11-15: после плейтеста морю вернуть рябь и блики; образцы и планка — в [Облике мира](../art/world-look.md).\n- 2026-11-17: кольца на воде от взрывов — как сейчас.\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n"}, {"id": "world-weather", "path": "world/weather.md", "title": "Погода", "section": "world", "date": "2026-11-17", "md": "# Погода\n\n![Шторм: тёмные валы с белыми гребнями под ливнем](../img/storm.jpg)\n\nНад всем миром сменяют друг друга периоды погоды: ясно, облачно, лёгкий дождь, туман. Поверх них по миру плывут штормы — высокие волны с барашками, тучи, ливень, молнии и гром, — в непогоду чаще; один шторм стоит на карте всегда.\n\n## Решения владельца\n- Шторм с огромными волнами, тёмными тучами и громом, а море при этом живое (2026-11-16).\n- Шторм есть и на карте, и как смена погоды: штормы приходят и уходят сами (2026-11-16).\n- В шторме ливень, молнии со вспышками, сумрак и дымка (2026-11-16).\n- Шторм заметно мешает, но играть в нём можно (2026-11-16).\n- Образец — штормы Sea of Thieves (2026-11-16).\n- Звук шторма — записи CC0 с Freesound: близкие раскаты, далёкий гром, сильный ливень (2026-11-16).\n- Штормы видны на карте (2026-11-16): глянцевые значки в духе Frutiger Aero, облако над областью шторма и стрелка, куда он плывёт; значок чуть живой: в нём вспыхивает молния, туча покачивается, плывущий шторм едет по карте.\n- Погода меняется со временем: над всем миром сменяют друг друга периоды — ясно, облачно, лёгкий дождь, туман, — а поверх них по карте плывут штормы, в непогоду чаще (2026-11-16).\n- Облака объёмные и красивые, как их строят игры, а не плоская шапка (2026-11-16).\n- В облачную погоду тени туч хорошо видны на воде: тёмные пятна бегут по морю (2026-11-16).\n- Шторм видно издалека: над ним шапка туч, которая становится прозрачной вокруг лодки игрока, когда та внутри; край шторма широкий и плавный — море темнеет, волны растут, дождь густеет постепенно, ступенями (2026-11-16).\n- Время суток идёт: сутки за 12 минут ([Свет и время суток](../art/light.md), 2026-11-16).\n- Прежняя погода (туман, дождь, шторм и гром как физические модели) снята 2026-10-27: «не так, как я представлял» ([Арт-дирекшн](../art/README.md)).\n- Туман — банки ниже палуб, плывут прядями по ветру и прячут море и чужие лодки, вокруг своей лодки рваная прогалина, общая дымка слабая (2026-11-17).\n- Серая дымка дальше, чем лодка видит в дождь, нужна, но слабее, чем сейчас (2026-11-17, [Задачи](../todo.md)).\n- «Меньше вспышек» остаётся как есть: смягчает только молнию и по умолчанию выключен (2026-11-17).\n- Экспозиция в шторме меряется по всему морю в кадре (2026-11-17).\n- 2026-11-17: молния бьёт по лодкам, оказавшимся рядом, с уроном.\n- 2026-11-17: волны шторма тормозят лодку на встречной волне, а ветер её сносит.\n- 2026-11-17: в середине шторма, который не уходит, — остров в тихом глазу бури, без шторма, с пирсом и странным забавным торговцем ([Корабль на мели](hulk.md)).\n- 2026-11-17: штормов реже, чем сейчас (сейчас шторм примерно каждые три минуты, два-три над миром разом).\n- 2026-11-17: периоды погоды — как сейчас: по четыре минуты, ясно, облачно, лёгкий дождь, туман.\n- 2026-11-17: как сейчас (принято владельцем вместе с остальным морем).\n"}], "sections": [{"dir": "", "label": "Об игре"}, {"dir": "gameplay", "label": "Геймплей"}, {"dir": "base", "label": "База"}, {"dir": "world", "label": "Мир"}, {"dir": "interface", "label": "Интерфейс"}, {"dir": "art", "label": "Арт-дирекшн"}, {"dir": "audio", "label": "Звук"}, {"dir": "story", "label": "Сюжет"}, {"dir": "tools", "label": "Инструменты"}, {"dir": "reports", "label": "Отчёты"}], "repo": ""}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const byId = new Map(D.pages.map(p => [p.id, p]));
const byPath = new Map(D.pages.map(p => [p.path, p]));
const label = dir => (D.sections.find(s => s.dir === dir) || {}).label || dir;
const catId = dir => dir || 'main';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const day = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${MONTHS[m - 1]} ${y}`; };
const plural = (n, f) => `${n} ${f[n % 10 === 1 && n % 100 !== 11 ? 0 : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 1 : 2]}`;
const slug = s => s.toLowerCase().trim().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
const plain = md => md.replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[#*`>|_]+/g, ' ').replace(/\s+/g, ' ').trim();

// A file in the repo, on GitHub; the public site has no repo to link to, so the link goes.
const gh = path => D.repo ? { ext: D.repo + path } : {};

// Resolves a link in a page's Markdown against the page: a wiki page, a wiki file, or an outside URL.
function resolve(from, href) {
  if (/^[a-z]+:/i.test(href)) return { ext: href };
  const u = new URL(href, 'https://w.invalid/wiki/' + from);
  const path = decodeURIComponent(u.pathname), anchor = decodeURIComponent(u.hash.slice(1));
  if (!path.startsWith('/wiki/')) return gh(path.slice(1) + u.hash);
  const rel = path.slice(6);
  if (rel.endsWith('.md')) return byPath.has(rel) ? { page: byPath.get(rel), anchor } : gh('wiki/' + rel);
  // ponytail: only wiki/img ships with the page; reports and PDFs open on GitHub
  return rel.startsWith('img/') ? { file: rel } : gh('wiki/' + rel);
}
const href = (p, anchor) => '#' + (p.path === 'README.md' && !anchor ? '' : p.id) + (anchor && /^[\w-]+$/.test(anchor) ? '--' + anchor : '');

for (const p of D.pages) {
  let body = p.md.replace(/^# .*\n/, '');
  const im = body.split(/\n## /)[0].match(/^!\[([^\]]*)\]\(([^)\s]+)\)[ \t]*$/m);
  if (im) { p.img = resolve(p.path, im[2]).file; p.cap = im[1]; body = body.replace(im[0], ''); }
  p.body = body;
  p.lead = plain((body.trim().split(/\n\s*\n/).find(b => !/^\s*[#|<-]/.test(b)) || ''));
  p.text = plain(body);
}
const sectionPages = dir => D.pages.filter(p => p.section === dir).sort((a, b) => (a.path.endsWith('README.md') ? -1 : 0) - (b.path.endsWith('README.md') ? -1 : 0) || a.title.localeCompare(b.title, 'ru'));
const sectionImage = dir => (sectionPages(dir).find(p => p.img) || {}).img;

// ---- page parts
function head(crumbs, title, meta, action) {
  $('crumbs').innerHTML = crumbs; $('title').textContent = title; $('meta').innerHTML = meta || ''; $('action').innerHTML = action || '';
  document.title = title === 'Floppa Tropical Adventures Wiki' ? title : `${title} | Floppa Tropical Wiki`;
}

// Only Markdown goes through here: the page's own links and images are resolved against its file.
function render(md, from) {
  const d = document.createElement('div');
  d.innerHTML = marked.parse(md); fixup(d, from);
  return d.innerHTML;
}

function fixup(root, from) {
  const seen = {};
  root.querySelectorAll('h2, h3, h4').forEach(h => {
    let s = slug(h.textContent); seen[s] = (seen[s] || 0) + 1; if (seen[s] > 1) s += '-' + (seen[s] - 1);
    h.id = 'h-' + s; h.dataset.anchor = s;
  });
  root.querySelectorAll('a[href]').forEach(a => {
    const r = resolve(from, a.getAttribute('href'));
    if (r.page) { a.href = href(r.page, r.anchor); if (r.anchor) a.dataset.anchor = r.anchor; a.dataset.page = r.page.id; }
    else if (r.file) { a.href = r.file; a.target = '_blank'; a.className = 'file'; }
    else if (r.ext) { a.href = r.ext; a.target = '_blank'; a.rel = 'noopener'; a.className = 'ext'; }
    else a.replaceWith(...a.childNodes);
  });
  root.querySelectorAll('img').forEach(i => { const r = resolve(from, i.getAttribute('src')); if (r.file) i.src = r.file; i.loading = 'lazy'; });
  root.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-scroll'; t.before(w); w.append(t); });
}

// The Artifact loads no picture from another site: a copy published beside the page stands in, and with none the caption stays alone.
document.addEventListener('error', e => {
  const i = e.target, src = i.tagName === 'IMG' && i.getAttribute('src');
  if (/^https?:\/\//.test(src)) i.src = 'img/ext/' + src.replace(/^https?:\/\//, '').split('?')[0];
  else if (src && src.startsWith('img/ext/')) i.remove();
}, true);

function toc(root) {
  const hs = [...root.querySelectorAll('h2, h3')];
  const first = root.querySelector('h2');
  if (hs.length < 3 || !first) return;
  let a = 0, b = 0;
  const items = hs.map(h => {
    const n = h.tagName === 'H2' ? (b = 0, ++a) : `${a}.${++b}`;
    return `<li class="${h.tagName === 'H2' ? 'l2' : 'l3'}"><a data-to="${h.id}"><span class="n">${n}</span>${esc(h.textContent)}</a></li>`;
  }).join('');
  const box = document.createElement('nav');
  box.className = 'toc' + (hs.length > 30 ? ' closed' : '');
  box.innerHTML = `<div class="toc-head">Содержание <button type="button">${hs.length > 30 ? 'показать' : 'скрыть'}</button></div><ol>${items}</ol>`;
  box.querySelector('button').onclick = e => { const c = box.classList.toggle('closed'); e.target.textContent = c ? 'показать' : 'скрыть'; };
  first.before(box);
}

function infobox(p) {
  const rows = [['Раздел', `<a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>`]];
  if (p.date) rows.push(['Правка', day(p.date)]);
  const dec = (p.md.split(/^## Решения владельца\s*$/m)[1] || '').split(/^## /m)[0].match(/^- /gm);
  if (dec) rows.push(['Решений владельца', dec.length]);
  return `<aside class="infobox"><div class="ib-title">${esc(p.title)}</div>` +
    (p.img ? `<figure><img src="${esc(p.img)}" alt="${esc(p.cap)}"><figcaption>${esc(p.cap)}</figcaption></figure>` : '') +
    `<div class="ib-group">Сведения</div><table>${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table></aside>`;
}

function rail(p) {
  const recent = [...D.pages].filter(x => x.date).sort((a, b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title, 'ru')).slice(0, 8);
  const li = x => `<li${p && x.id === p.id ? ' class="here"' : ''}><span class="thumb" style="${x.img ? `background-image:url('${x.img}')` : ''}"></span><span><a href="${href(x)}">${esc(x.title)}</a><small>${esc(label(x.section))} · ${day(x.date)}</small></span></li>`;
  let html = `<section><h3>Свежие правки</h3><ul>${recent.map(li).join('')}</ul></section>`;
  if (p) {
    const same = sectionPages(p.section);
    html += `<section><h3>${esc(label(p.section))}</h3><ul>${same.map(x => `<li${x.id === p.id ? ' class="here"' : ''}><a href="${href(x)}">${esc(x.title)}</a></li>`).join('')}</ul></section>`;
  }
  $('rail').innerHTML = html;
}

// ---- views
function article(p, anchor) {
  head(`в: <a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>`, p.title,
    p.date ? `Последняя правка: ${day(p.date)}` : '',
    D.repo ? `<a class="btn" href="${D.repo}${encodeURI('wiki/' + p.path)}" target="_blank" rel="noopener">Исходник ↗</a>` : '');
  const c = $('content');
  c.innerHTML = (p.path === 'README.md' ? '' : infobox(p)) + render(p.body, p.path);
  toc(c);
  $('cats').hidden = false;
  $('cats').innerHTML = `Категории: <a href="#cat-${catId(p.section)}">${esc(label(p.section))}</a>` +
    (/^## Решения владельца/m.test(p.md) ? '<a href="#cat-main">Решения владельца</a>' : '') +
    (p.img ? '<a href="#">Страницы с изображениями</a>' : '');
  rail(p);
  jump(anchor);
}

function category(dir) {
  const pages = sectionPages(dir);
  head('Категория', `Категория: ${label(dir)}`, `В категории ${plural(pages.length, ['страница', 'страницы', 'страниц'])}.`);
  $('content').innerHTML = `<div class="cards">${pages.map(p => `<a class="card" href="${href(p)}"><span class="thumb" style="${p.img ? `background-image:url('${p.img}')` : ''}">${p.img ? '' : esc(p.title[0])}</span><span><b>${esc(p.title)}</b><small>${esc(p.lead)}</small></span></a>`).join('')}</div>`;
  $('cats').hidden = true; rail(null); jump();
}

function home() {
  const readme = byPath.get('README.md');
  const latest = D.pages.reduce((a, b) => (b.date > a ? b.date : a), '');
  head('', 'Floppa Tropical Adventures Wiki', `${plural(D.pages.length, ['страница', 'страницы', 'страниц'])} · последняя правка ${day(latest)}`);
  const intro = readme.body.trim().split(/\n\s*\n/)[0];
  const decisions = byPath.get('decisions.md');
  const news = decisions.md.split('\n').filter(l => /^- \*\*\d\d-\d\d\*\*/.test(l)).slice(-8).reverse()
    .map(l => l.replace(/^- \*\*(\d\d)-(\d\d)\*\*\s*/, (_, m, d) => `- <b class="d">${+d} ${MONTHS[m - 1].slice(0, 3)}</b> `)).join('\n');
  const tiles = D.sections.map(s => {
    const n = sectionPages(s.dir).length, img = sectionImage(s.dir);
    return n ? `<a class="tile" href="#cat-${catId(s.dir)}"${img ? ` style="background-image:url('${img}')"` : ''}><span>${esc(s.label)}<small>${plural(n, ['страница', 'страницы', 'страниц'])}</small></span></a>` : '';
  }).join('');
  const gallery = D.pages.filter(p => p.img).filter((p, i, a) => a.findIndex(q => q.img === p.img) === i)
    .map(p => `<a href="${href(p)}"><img src="${esc(p.img)}" alt="" loading="lazy">${esc(p.cap)}</a>`).join('');
  const c = $('content');
  c.innerHTML = `<div class="welcome">${render(intro, 'README.md')}
      <a class="btn" href="#vision">Об игре</a><a class="btn" href="#decisions">Решения</a><a class="btn" href="#known-issues">Известные недочёты</a><a class="btn" href="#glossary">Глоссарий</a></div>
    <h2>Разделы</h2><div class="tiles">${tiles}</div>
    <h2>Последние решения</h2><div class="news-wrap">${render(news, 'decisions.md')}</div>
    <h2>Галерея</h2><div class="gallery">${gallery}</div>`;
  c.querySelector('.news-wrap ul')?.classList.add('news');
  $('cats').hidden = true; rail(null); jump();
}

function jump(anchor) {
  const el = anchor && document.getElementById('h-' + anchor);
  if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
}

let pending = '';
function route() {
  document.querySelectorAll('#nav details[open]').forEach(d => d.open = false);
  const [id, anchor] = decodeURIComponent(location.hash.slice(1)).split('--');
  const a = anchor || pending; pending = '';
  if (!id) return home();
  if (id.startsWith('cat-')) return category(id === 'cat-main' ? '' : id.slice(4));
  const p = byId.get(id);
  if (p) return article(p, a);
  head('', 'Страница не найдена', `Нет страницы «${esc(id)}». <a href="#">На заглавную</a>`); $('content').innerHTML = ''; $('cats').hidden = true; rail(null);
}

// ---- nav and search
const GROUPS = [['Об игре', ['']], ['Геймплей', ['gameplay']], ['Мир и база', ['world', 'base']], ['Интерфейс', ['interface']],
  ['Арт и звук', ['art', 'audio']], ['Сюжет', ['story']], ['Разработка', ['tools', 'reports']]];
$('nav').insertAdjacentHTML('afterbegin', GROUPS.map(([name, dirs]) => `<details><summary>${name}</summary><div class="menu">${dirs.map(d =>
  (dirs.length > 1 ? `<b>${esc(label(d))}</b>` : '') + sectionPages(d).map(p => `<a href="${href(p)}">${esc(p.title)}</a>`).join('')).join('')}</div></details>`).join(''));
document.querySelectorAll('#nav details').forEach(d => d.addEventListener('toggle', () => {
  if (d.open) document.querySelectorAll('#nav details[open]').forEach(o => o !== d && (o.open = false));
}));
document.addEventListener('click', e => {
  if (!e.target.closest('#nav details')) document.querySelectorAll('#nav details[open]').forEach(d => d.open = false);
  if (!e.target.closest('.search')) $('results').hidden = true;
  const to = e.target.closest('[data-to]');
  if (to) { e.preventDefault(); document.getElementById(to.dataset.to)?.scrollIntoView({ behavior: 'smooth' }); return; }
  const a = e.target.closest('a[data-page]');
  if (!a) return;
  const anchor = a.dataset.anchor || '';
  if (a.getAttribute('href') === (location.hash || '#')) { e.preventDefault(); jump(anchor); }
  else if (!/^[\w-]+$/.test(anchor)) pending = anchor;
});

let hits = [], on = 0;
function search() {
  const q = $('q').value.trim().toLowerCase(), box = $('results');
  if (q.length < 2) { box.hidden = true; hits = []; return; }
  hits = D.pages.map(p => {
    const t = p.title.toLowerCase().indexOf(q), b = p.text.toLowerCase().indexOf(q);
    return { p, b, score: t === 0 ? 3 : t > 0 ? 2 : b >= 0 ? 1 : 0 };
  }).filter(h => h.score).sort((a, b) => b.score - a.score).slice(0, 8);
  on = 0;
  const mark = s => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
  box.innerHTML = hits.length ? hits.map((h, i) => `<a href="${href(h.p)}" class="${i ? '' : 'on'}">${mark(h.p.title)}<small>${h.b >= 0 ? '…' + mark(h.p.text.slice(Math.max(0, h.b - 50), h.b + 90)) + '…' : esc(label(h.p.section))}</small></a>`).join('')
    : '<b>Ничего не найдено</b>';
  box.hidden = false;
}
$('q').addEventListener('input', search);
$('q').addEventListener('focus', search);
$('q').addEventListener('keydown', e => {
  const items = $('results').querySelectorAll('a');
  if (e.key === 'Escape') { $('results').hidden = true; $('q').blur(); }
  if (!items.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); items[on].classList.remove('on');
    on = (on + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length; items[on].classList.add('on');
  }
  if (e.key === 'Enter') { location.hash = items[on].getAttribute('href'); $('results').hidden = true; $('q').value = ''; $('q').blur(); }
});
$('results').addEventListener('click', e => { if (e.target.closest('a')) { $('results').hidden = true; $('q').value = ''; } });

history.scrollRestoration = 'manual';
addEventListener('hashchange', route);
route();
</script>
