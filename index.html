<script id="data" type="application/json">{"pages": [{"id": "README", "path": "README.md", "title": "Floppa Tropical Adventures — вики", "section": "", "date": "2026-11-11", "md": "# Floppa Tropical Adventures — вики\n\nВся документация игры: решения владельца, как устроена каждая система, открытые вопросы и инструменты. Начать стоит с [Об игре](vision.md).\n\nЭту же вики можно читать как сайт с поиском и картинками: [вики игры](https://gost402.github.io/floppa-wiki/). Его собирает `tools/wiki.py` из этих страниц, а выкладывает `tools/wiki-pages.sh`.\n\n## Разделы\n- **[Об игре](vision.md)** — игра коротко. **[Журнал решений](decisions.md)** — что решили и что отвергли, по датам. **[Глоссарий](glossary.md)** — термины игры по-английски и по-русски.\n- **Геймплей:** [Арена](gameplay/missions.md), [Директор](gameplay/director.md), [Камера и картинка](gameplay/camera.md), [Лодка](gameplay/boat.md), [Бой](gameplay/combat.md), [Сборки и стили игры](gameplay/builds.md), [Охотники и ИИ](gameplay/hunters.md), [Припасы](gameplay/pickups.md), [Добыча](gameplay/haul.md), [Места промысла](gameplay/sites.md), [Прогресс и сохранения](gameplay/progression.md).\n- **Баланс:** [Оружие](balance/weapons.md), [Лодки](balance/boats.md), [Экономика](balance/economy.md).\n- **База:** [Пирс](base/pier.md), [Верфь](base/boatyard.md), [Полигон](base/testing-ground.md).\n- **Мир:** [Море](world/sea.md), [Локации](world/locations.md), [Рельеф](world/ground.md), [Зоны и опасности](world/areas.md).\n- **[Онлайн-кооп](online.md).**\n- **Интерфейс:** [HUD](interface/hud.md), [Экраны и меню](interface/screens.md), [Управление](interface/controls.md), [Язык](interface/language.md).\n- **[Арт-дирекшн](art/README.md):** [Облик мира](art/world-look.md), [Облик лодок](art/boats.md), [Люди: флоппы](art/people.md), [Стиль интерфейса](art/interface.md), [Свет и время суток](art/light.md), [Кандидаты на облик](art/candidates.md).\n- **Звук:** [Звук](audio/sound.md), [Музыка](audio/music.md).\n- **Сюжет:** [Сеттинг и лор](story/setting.md), [Сцены сюжета](story/scenes.md), [Диалоги и голос](story/dialogue.md).\n- **[Инструменты](tools/README.md):** [Код](tools/code.md), [Демо](tools/demos.md), [Редактор карт](tools/map-editor.md), [Редактор сюжета](tools/story-editor.md), [Ассеты](tools/assets.md), [Сборки и посты](tools/release.md).\n- **[Открытые вопросы](questions/README.md)** — всё, что ждёт ответа владельца, и [Чего нам не хватает](questions/gaps.md).\n- **[Отчёты](reports/README.md)** — отчёты и исследования, что были артефактами Claude: выбор облика, разборы, другие игры.\n- **[Известные недочёты](known-issues.md)** — что игрок видит или чувствует неправильным и что пока не исправлено.\n\n## Как вести вики\n- Всё — прототип, и ничто не высечено в камне. Решение — направление, в котором строить сейчас; любое может измениться, когда игра покажет лучшее.\n- То, что в игре уже есть, скорее всего имеет смысл: считать это выбранным или временной заменой, прежде чем называть пробелом.\n- Строить по решениям, но говорить, когда игра спорит с решением. Числа в игре — стартовые значения для настройки.\n- Где решения нет, построить самое простое, что оставляет варианты открытыми, описать это на странице темы как «решение без владельца» со ссылкой на вопрос и добавить вопрос.\n- Когда владелец отвечает, записать решение в «Решения владельца» на странице темы и удалить вопрос; историю хранит git. Крупное решение — строка в [Журнале решений](decisions.md).\n- Любой лор, фракцию или механику сверх решённого помечать как предложение ([Сеттинг и лор](story/setting.md)).\n\n## Как устроена страница\n- «Решения владельца» — только то, что решил владелец.\n- «Как устроено» — что игра делает сегодня, с файлами кода. Решения без владельца помечены там же со ссылкой на вопрос.\n- «Открытые вопросы» — ссылки на вопросы темы. Вопрос живёт под заголовком своего номера (`### Q17`), так что ссылка `questions/missions.md#q17` ведёт прямо к нему.\n- Коротко и простыми фразами: что делает система, приём, одна строка «почему», какие файлы. Каждый факт — в одном месте, на другие ссылаемся. Числа настройки живут в коде; исключение — страницы [баланса](balance/weapons.md): это снимок значений, у каждой таблицы назван источник, и число на них правится в том же коммите, что и в коде.\n- Вики пишется по-русски; идентификаторы кода, пути, клавиши и имена демо — как в коде. Правила проекта для агентов — в [CLAUDE.md](../CLAUDE.md), по-английски.\n- Лодка — вещь: в русском у неё род своего существительного (лодка — она, катер — он), без олицетворения.\n"}, {"id": "art-README", "path": "art/README.md", "title": "Арт-дирекшн", "section": "art", "date": "2026-11-08", "md": "# Арт-дирекшн\n\nКак игра выглядит и как мы приходим к её облику. Каждая тема облика — на своей странице.\n\n## Страницы\n- [Облик мира](world-look.md): море, острова, песок, зелень, кильватер.\n- [Облик лодок](boats.md): корпуса, ливреи, оснастка, банда охотников.\n- [Люди: флоппы](people.md): все жители мира — каракалы-флоппы, и их портреты.\n- [Стиль интерфейса](interface.md): вещи мира, шрифты, материалы, выноски.\n- [Свет и время суток](light.md): небо, солнце, ночь, рассвет.\n- [Кандидаты на облик](candidates.md): целые облики игры, меню и фронт-энд, построенные на выбор. Владелец ещё не выбрал.\n\n## Правила\n- Один облик везде: затенение, цвет и свет одни для всей игры ([CLAUDE.md](../../CLAUDE.md), принцип 3).\n- Сначала спросить, какой облик владелец себе представляет. Перед тем как моделировать или перекрашивать что-то видимое, задать короткий раунд вопросов по-русски: форма, материал, цвет, главные детали. Облик по догадке уже промахивался: первая база, погода.\n- Никаких картинок, сгенерированных ИИ (владелец, 2026-11-07). Облик показывают кадры самой игры из [демо](../tools/demos.md) или ссылки на настоящие игры. Портреты, уже нарисованные локальной моделью, остаются, пока владелец не скажет иначе ([Люди: флоппы](people.md)).\n- Владелец судит облик, играя, и по кадрам игры, а не по описаниям.\n- Ни одна другая игра не называется в интерфейсе, в коде и в вики.\n- Откуда берутся модели, звук и шрифты: [Ассеты](../tools/assets.md).\n\n## Что владелец отверг\nЧтобы не повторять.\n- **Карточки «как у приложения»** (2026-10-26): первый HUD и верфь — скруглённые тёмные стеклянные карточки, шрифт по умолчанию — владелец назвал безликими и «сгенерированными ИИ». Никаких карточек и скруглённых стеклянных панелей.\n- **HUD из тонких светящихся линий по образцу военного авиасимулятора** (2026-10-26 — 2026-10-29): образец снят, интерфейс стал вещами мира.\n- **Погода** (2026-10-27): туман, дождь, шторм и гром, построенные как физические модели, сняты целиком: «не так, как я представлял». Вопрос [Q6](../questions/world.md#q6).\n- **Пена по неподвижному V от носа** (2026-10-28): пена должна быть симулированной и принадлежать воде. Брызги потом урезаны как «чрезмерные».\n- **Усиленные стилизованные кильватерные волны** (2026-10-30): «выглядят плохо», откачены. Перед новой попыткой спросить, что владелец представляет.\n- **Первая база** (2026-10-31): жёлтый дом с красной жестяной крышей. Владелец представлял открытый деревянный эллинг.\n- **Персонажи с вещами в лапах** (2026-11-06): никто ничего не держит.\n- **Меню с картинок** (2026-11-06 — 2026-11-07): стопки толстых глянцевых кнопок во всю ширину по центру, жирный шрифт с обводкой и логотип с фаской — «дешёвая мобильная игра». Яркие меню пляжного уровня, каждая строка в плашке, блики — «дёшево, громко, без вкуса». Мраморная табличка и алюминиевая панель с тонкой антиквой — «ни то ни другое». Небольшой список простых слов слева, широкие поля и материал только на выбранном пункте читались как консольная игра.\n- **Слишком близкая камера и бледное открытое море** (2026-11-07, после игры): зум и тон картинки вернули ([Q77](../questions/world.md#q77)).\n\n## Что владельцу понравилось\n- Frutiger Aero и Utopian Scholastic (2026-11-02): «потрясающе» — теперь это образцы интерфейса ([Стиль интерфейса](interface.md)).\n- Мир на картинках меню (2026-11-06): песок, зелень, пальмы, каустика, облачные тени ([Облик мира](world-look.md)).\n- Материалы: стекло в шлифованном алюминии и белый мрамор с хромом (2026-11-06, этюды).\n- Мечтательная ностальгическая вода пляжных уровней начала 2000-х — как вдохновение, а не как бирюзовый оттенок на всём (2026-11-06).\n\n## Открытые вопросы\n- [Q6](../questions/world.md#q6): погода.\n- Какой облик взять со стендов: [Кандидаты на облик](candidates.md).\n"}, {"id": "art-boats", "path": "art/boats.md", "title": "Облик лодок", "section": "art", "date": "2026-11-11", "md": "# Облик лодок\n\n![Все корпуса в ряд](../img/fleet.jpg)\n\nКак выглядят лодки игрока и охотников. Как лодка устроена и ходит: [Лодка](../gameplay/boat.md).\n\n## Решения владельца\n- Лодки выглядят как настоящие моторные: седловатость, наклонённый и развалистый нос, планширь, кокпит, настоящие моторы, рубки и оснастка, у каждой поверхности своя краска, лак или металл.\n- Ливреи — гоночная графика: смелые полосы от носа до кормы, крупный номер на носу, палуба контрастного цвета. Лодки освещены как море, но ярче: насыщенная краска, чёткий лак и хром, тёмный привальный брус обводит корпус.\n- Корпуса побольше несут рубку или пульт под жёсткой крышей; они нарисованы, но это не деталь. На палубах оснастка (леера, утки, бортовые огни, антенны, бухты троса, канистры) и приметы сеттинга: солнечные панели на крышах, парусиновые тенты, ветряки, зелень в кадках.\n- Пропорции слегка преувеличены, чтобы лодка читалась с высоты боя: борта выше, моторы и ветровые стёкла крупнее, нос острее.\n- Охотники — банда со своим обликом: малиновый и чёрный, акульи зубы на носу, рваные полосы, потёртая краска.\n\n## Как устроено\n- **Ливреи** (`Livery`, `LiveryModel`, `HullMesh`): у каждого корпуса игрока свои цвета и номер ([Q14](../questions/world.md#q14)); каждый охотник носит малиновую ливрею своей банды. Графика лежит чуть над корпусом, как игры кладут декали; цифры номера — скруглённые штрихи, потому что пересекающиеся контуры вариативного Nunito не триангулируются. Почему облик несут полосы и палуба: с высоты боя лодка занимает около 70 px.\n- **Наряд** (`OutfitModel`): тенты, рубки, крыши, солнечные панели, леера и огни рисуются там, где не стоит деталь, и ничего не весят. Какой корпус что несёт: [Q14](../questions/world.md#q14).\n\n## Как к этому пришли\n- 2026-10-28: владелец попросил модели лучше и выбрал настоящие моторные лодки — не пухлые стилизованные и не рейдеров из хлама. Прежние корпуса были неверны во всём: форма, голые палубы, детали-коробки, плоское затенение.\n- 2026-11-02: на вопрос, что значит «стильнее», владелец выбрал гоночную графику, реалистичный, но более яркий свет, все детали с приметами сеттинга и банду охотников со своим обликом.\n\n## Открытые вопросы\n- [Q11](../questions/world.md#q11): какой настоящей лодкой должен быть каждый корпус.\n- [Q14](../questions/world.md#q14): ливреи и наряды.\n"}, {"id": "art-candidates", "path": "art/candidates.md", "title": "Кандидаты на облик", "section": "art", "date": "2026-11-09", "md": "# Кандидаты на облик\n\nОблики, построенные на выбор владельцу. Каждый живёт в своём демо-стенде; в игре их нет, пока владелец не выберет. Владелец ещё не выбрал ни один.\n\nКак смотреть: Esc на базе → Демо → стенд → облик. `Current` — игра как есть. Оценки ниже — наши, не владельца.\n\n## Облик всей игры: стенд `Art`\n- 2026-11-07 владелец попросил заново придумать облик, «не глядя на нынешний дизайн, а думая о геймплее». Шесть целых обликов, каждый с тем, как в нём ощущается игра. Стенд `game/demos/Art/` подменяет шейдеры игры на одном бое и снимает кадры: общий, залп, попадание, враг, потопление, мелководье, крупно.\n- **Ink** 7.8 — комикс в заливке.\n- **Lagoon** 7.3 — светлый ключ, гоночные ливреи; самый дешёвый: перенастраивает нынешние шейдеры.\n- **Poster** 7.2 — приглушённая трафаретная печать.\n- **Logbook** 7.0 — акварель.\n- **Deep** 6.8 — сумерки и свечение.\n- **Tin** 5.5 — игрушки на смоле.\n- Наш выбор: Ink. [Отчёт](../reports/2026-11-07-art-directions/index.html).\n- Если выбран облик или куски нескольких: перенести его шейдеры в шейдеры игры (небо, море, земля, поверхности, бой, HUD), а не держать подмену из демо, и убрать остальные.\n\n## Облик меню: стенд `Menus`\n- 2026-11-06 владельцу не понравились меню и кнопки. Шесть обликов меню в `game/demos/Menus/Looks/`, каждый показан на базе и на море.\n- **Quiet** 8.4 — консольный список, по нему скользит одна гелевая плашка.\n- **Glass** 7.9 — матовое стекло.\n- **Notebook** 7.8 — карточка, приклеенная и написанная от руки.\n- **Atlas** 7.0 — страница атласа в духе Utopian Scholastic.\n- **Device** 6.8 — починенный аква-прибор в руке.\n- **Dashboard** 6.5 — пузыри на ватерлинии.\n- Наш выбор: Quiet; Glass, если нужен материал; Notebook, если нужна вещь мира. [Отчёт](../reports/2026-11-06-menu-looks/index.html).\n- Если выбран: перенести в `game/ui` (`Menu`, `Pill`), поправить решение о глянцевых кнопках-пилюлях на [Экраны и меню](../interface/screens.md), убрать остальные. Выбранный облик должен рисовать шкалы настроек.\n\n## Проверка интерфейса\n- 2026-11-03 отчёт QA по интерфейсу: 102 замечания, все исправлены 2026-11-04. [Отчёт](../reports/2026-11-04-interface-qa/index.html).\n\n## Открытые вопросы\n- Какой облик со стенда `Art`, какой облик меню и какой фронт-энд: [Вопросы: мир и облик](../questions/world.md).\n"}, {"id": "art-interface", "path": "art/interface.md", "title": "Стиль интерфейса", "section": "art", "date": "2026-11-09", "md": "# Стиль интерфейса\n\nИз чего сделан интерфейс и как он выглядит. Что где на экране: [HUD](../interface/hud.md), [Экраны и меню](../interface/screens.md).\n\n## Решения владельца\n- Интерфейс сделан из вещей мира: старая печатная карта, найденные и починенные приборы, бумажные квитки, штампы ([Экраны и меню](../interface/screens.md), [HUD](../interface/hud.md)).\n- Образцы интерфейса — Frutiger Aero и Utopian Scholastic: оптимистичный глянец 2000-х, аква, небо и природа вместе с техникой и классическая антиква обучающих программ той эпохи.\n- Выноски по месту: на карте и в судовом журнале выноска — бумажная бирка, приклеенная и написанная от руки; в меню, на верфи и на базе — глянцевая аква-плашка. Предупреждение везде несёт свою метку, маленький знак предупреждения, и янтарную кромку.\n- В интерфейсе простые слова (влево, вправо, старт, цель), и ни одна другая игра не называется ни в интерфейсе, ни в коде, ни в вики.\n\n## Как устроено\n- **Облик** (`Style`, `Gloss`): вещи мира в духе Frutiger Aero и Utopian Scholastic. Слова набраны Nunito поверх мягкой тёмной кромки, чтобы читались на бликах и пене; приборы и наклейки — глянцевая аква под стеклом, подписанная на малярном скотче шрифтом Caveat; EB Garamond — для печати старого мира и заголовков (`assets/fonts/`). Тени мягкие (`Gloss.Shadow`). Клавиши показаны на глянцевых колпачках (`Gloss.Key`, `Gloss.Hints`; кнопки геймпада на своём месте, см. [Управление](../interface/controls.md)), клавиши экрана — вдоль его низа слева (`Gloss.Foot`). Цвет детали (`Style.Of`) не берёт ни враждебный красный, ни оранжевый игрока.\n- **Выноски** (`Balloon`, `Gloss.Balloon`): по месту — бумажная бирка вкось, приклеенная скотчем, написанная Caveat, со стрелкой маркером к тому, о чём говорит, или глянцевая аква-плашка с хвостиком; предупреждение обведено янтарём под маленьким янтарным знаком (`Gloss.Caution`).\n\n## Как к этому пришли\n- 2026-10-26: тёмные стеклянные карточки отвергнуты; HUD стал тонкими светящимися линиями; 2026-10-29 этот образец снят ([Арт-дирекшн](README.md)).\n- 2026-11-02: владелец выбрал интерфейс как вещи мира: старая карта на базе, на море — кластер глянцевых аква-приборов. Шрифты он оставил на наш выбор: Nunito, Caveat, а для печати старого мира сначала Saira. В тот же день Frutiger Aero и Utopian Scholastic стали образцами, и EB Garamond заменил Saira.\n- 2026-11-03: тем же стилем переделаны сеть, карта на море, рулетка и окна инструментов.\n- 2026-11-08: сеть заменена трюмом; его экран — глянцевый аква-прибор с сеткой клеток ([Добыча](../gameplay/haul.md)).\n- 2026-11-06 — 2026-11-07: владельцу не нравятся меню и кнопки; построены варианты на выбор ([Кандидаты на облик](candidates.md)).\n\n## Открытые вопросы\n- [Q55](../questions/interface.md#q55): полировка интерфейса.\n- Облик меню и фронт-энда: [Кандидаты на облик](candidates.md).\n"}, {"id": "art-light", "path": "art/light.md", "title": "Свет и время суток", "section": "art", "date": "2026-11-08", "md": "# Свет и время суток\n\nОдно небо и одно солнце на всю сцену; час суток держится на протяжении миссии.\n\n## Решения владельца\n- Каждый час суток выглядит правильно. Ночные миссии для скрытности появятся позже.\n- Час держится на месте всю миссию.\n- Ночь лунная и синяя: прохладный лунный свет с серебряной дорожкой бликов на воде, заметно темнее дня, но всё читается.\n- Рассвет и закат тёплые и проходят через сумерки в синюю ночь.\n\n## Как устроено (`sky/`)\n\nОдно небо на всю сцену и на отражение в море: модель Godot PhysicalSkyMaterial, посчитанная по каждому направлению (`sky.gdshaderinc`), её параметры заданы для удерживаемого часа. Почему не симулированная атмосфера: игрок видит небо в основном в море, с большой высоты, в один час. `Daylight` держит солнце на час локации и мерит экспозицию по серой карточке, под собственным контрастом AgX: подъём мягкой кривой смыл море в серое ([Q77](../questions/world.md#q77)). Тени облаков плывут по всему, что солнце освещает, по ветру (`sunlight_clouded`), шумом, который двигает `Daylight`; самих облаков в кадре никогда нет. Вид настроен на дневное солнце коралловой отмели (`HeldHour`); в другие часы солнце держит это направление, и меняется только его высота. Низкое солнце согревает воздух и море. Ночью полная луна освещает сцену как прохладное солнце на месте удерживаемого, а кадр сидит на два стопа ниже дня, как кино снимает день под ночь; сумерки переходят от солнца к луне. Звёзд нет, тумана нет. Твёрдые поверхности, и лодки тоже, освещает `sunlight.gdshaderinc` (`common/Surfaces.cs`, `surface.gdshader`), под водой — `waters/underwater.gdshaderinc`. Godot не переимпортирует `.glsl`, когда меняется включаемый им `.glslinc`: после правки include тронь файлы `.glsl`.\n"}, {"id": "art-people", "path": "art/people.md", "title": "Люди: флоппы", "section": "art", "date": "2026-11-11", "md": "# Люди: флоппы\n\n![Капитан](../img/captain.jpg)\n\nКто живёт в мире и как выглядит. Как они говорят: [Диалоги и голос](../story/dialogue.md).\n\n## Решения владельца\n- Все в мире — флоппы: каракалы, круглые и тяжёлые, с высокими ушами в чёрных кисточках, тёмными полосами от глаз к носу и светлыми подбородком и грудью. Людей нет.\n- Флоппы сидят, как сидят кошки, передние лапы рядом перед собой; никто ничего не держит (владелец, 2026-11-06). На них немного одежды мира: старого — найденной, выцветшей и залатанной, — с льном и плетёными вещами нового.\n- Каждый — свой вкус флоппы: окрас шерсти, сложение и возраст, одежда и снаряжение на нём (шляпа, очки, фартук, бухта троса, свисток). Сверху их узнают по этому.\n- Они живут на базе, на верфи и в миссиях: на берегах и причалах и у точек выхода. На лодках команд не видно.\n- Они окрашены и освещены как лодки: насыщенные цвета, тот же свет.\n- Флоппы на берегах и причалах — жизнь вокруг боя, с ними не играют; у точки выхода сидит тот, кто её держит.\n- Их моделируют в Blender из кода, как пирс.\n\n## Портреты\n- Большие портреты для диалогов — заглушки до рисунков художника ближе к релизу. Их нарисовала локальная модель изображений по фото настоящего флоппы. С 2026-11-07 владелец запретил картинки от ИИ: новые портреты так не делаются, а уже нарисованные остаются, пока владелец не скажет иначе. Скрипты, которыми их рисовали, убраны из `tools/` 2026-11-08 и остались в истории git.\n- Портреты есть у ролей без имён: капитан, корабел, мытарь. У каждого портрета четыре лица: ровный взгляд, доволен, удивлён, сердит. У врагов восемь безымянных лиц (`foe-1`…`foe-8`), у каждого три: ровный взгляд, удивлён, сердит ([HUD](../interface/hud.md)) ([Q7](../questions/world.md#q7)).\n- Файлы: [Ассеты](../tools/assets.md).\n\n## Открытые вопросы\n- [Q7](../questions/world.md#q7): какие ещё лица нужны портретам.\n- Кто нарисует портреты к релизу: [Чего нам не хватает](../questions/gaps.md).\n"}, {"id": "art-world-look", "path": "art/world-look.md", "title": "Облик мира", "section": "art", "date": "2026-11-08", "md": "# Облик мира\n\nКаким выглядит мир: острова, мелководье, открытое море и след лодки. Как море устроено, на странице [Море](../world/sea.md); свет и часы — [Свет и время суток](light.md).\n\n## Решения владельца\n- Мир выглядит так, как его показывают картинки меню: кремовый песок, сочная яркая зелень и пышные пальмы на острове базы, спокойное прозрачное море у островов с мягкой широкой каустикой на песчаном дне — видной, но не рябящей, и слабые тени облаков, плывущие над водой и сушей. Остров базы сохраняет своё низкое послеполуденное солнце.\n- В открытом море вода глубокая, насыщенно-синяя, с видными волнами и бликами солнца, без зерна.\n- След лодки: короткий белый бурун сразу за кормой, дальше след распадается на тонкое кружево и светлую бирюзу от пузырьков и быстро тает; никаких клякс. Пена принадлежит воде.\n\n## Как к этому пришли\n- **Морской проход** (2026-10-29): экспозиция под удерживаемый час, прибой как боры, кусты морской травы.\n- **Картинки меню** (2026-11-06): владельцу понравился мир на картинках меню, и облик подогнали под них: песок, зелень, пальмы, каустика, мягкая светлая картинка, облачные тени. Угол и дальность камеры выбрал QA-агент за несколько проходов ([Камера и картинка](../gameplay/camera.md)).\n- **После игры** (2026-11-07): вид оказался слишком близким, а открытое море бледным. Зум и тон вернули, спокойная поверхность осталась только над банками, каустика стала мягче, пена — кружевом ([Q77](../questions/world.md#q77)).\n- Картинки меню были нарисованы моделью; с 2026-11-07 облик показывают только кадры игры ([Арт-дирекшн](README.md)).\n\n## Открытые вопросы\n- [Q77](../questions/world.md#q77): тон картинки.\n- Целые облики игры на стенде `Art`: [Кандидаты на облик](candidates.md).\n"}, {"id": "audio-music", "path": "audio/music.md", "title": "Музыка", "section": "audio", "date": "2026-11-09", "md": "# Музыка\n\nМузыка складывается прямо во время игры и растёт вместе с боем. Остальной звук: [Звук](sound.md).\n\n## Решения владельца\n- Музыка делается на ходу, как её делает Sonic Pi: она нарастает вместе с боем, а события играют собственные мелодии, все в одной гармонии.\n- Её звук — глянцевый джаз-фьюжн 2000-х, под стать интерфейсу, на записанных инструментах: аккорды FM-электропиано, мелодия маримбы, электробас, ведущая партия чистой электрогитары, живые барабаны с конгами и бонго и трубы для фанфар при победе.\n- Музыка верна; у каждой локации своя тональность, лад и темп.\n\n## Как устроено (`audio/music/`)\n\n`Music` сочиняет на ходу, как музыка с живым кодом: готовых записанных треков нет. Пьеса (`Score`, `music/Harmony.cs`) — это тональность, лад, темп и зерно; у базы своя (`Score.Home`), и у каждой локации своя, она хранится в её карте (`Setting.Score`). `Composer` выращивает из зерна последовательность аккордов и играет по ней на часах качающихся шестнадцатых, слоями, которые вступают с интенсивностью боя, как адаптивные партитуры слоят стемы. Интенсивность растёт сразу и падает только после затишья (`Music.Feel`), от близких охотников, корпуса, нитро и недавних ударов. Мотивы отвечают на события боя на ближайшем делении такта (`Motif`). Миссия кончается фанфарами или плачем, который тянется дальше в мир базы (`Music.Now`, `Music.Resume`). Каждая нота — ступень звучащего аккорда, поэтому всё движется в одной гармонии. Инструменты сэмплированы, как их играют трекеры и саундфонты (`Voices`): записи CC0 (`assets/sounds/music/`, импортированы без сжатия), каждая нота играется от ближайшего дубля, с передискретизацией. Они играют в комнату и эхо (`Space`) под лимитером, рендерятся чуть вперёд в генератор потока. Пауза и верфь приглушают музыку.\n"}, {"id": "audio-sound", "path": "audio/sound.md", "title": "Звук", "section": "audio", "date": "2026-11-09", "md": "# Звук\n\nКак в игре звучат бой, лодки и интерфейс. Музыка описана отдельно: [Музыка](music.md).\n\n## Решения владельца\n- Звук по умолчанию включён. Кадры демо немые.\n\n## Как устроено (`audio/`)\n\n`Sounds` расставляет в мире многослойные реплики CC0, слышимые из «уха» вида (`assets/sounds`, источники в его `Licenses.txt`); голоса идут по громкости у уха, поэтому далёкий огонь никогда не заглушает ближний. `ShotSounds` взвешивает реплики по силе взрыва; `Motor` зацикливает мотор лодки и останавливает петлю, пока она слишком тиха, чтобы её слышать. Море и ветер звучат петлёй под всем. Что бы ни делала любая лодка, слышно там, где она это делает, и охотничью тоже: припасы (`World`), знак охотника перед залпом (`Boat.Told`) и дым (`Hiss`).\n\n`Chimes` играет звуки интерфейса (`assets/sounds/ui`), одинаково слышные везде и заметно тише боя: по одной реплике на каждый момент HUD, верфи, вида сбоку, верстаков и меню. Добыча самого игрока принадлежит интерфейсу, поскольку она только его. Лебёдка захвата — петля в `Salvaging`. Дубли каждой реплики слегка разнесены по высоте (`AudioStreamRandomizer`), полифония ограничивает число голосов, а реплика никогда не играет снова раньше своего промежутка. Она живёт в корне дерева, поэтому любой экран играет её через `Chimes.Play`. Скрытые прогоны демо немые на «пустом» аудиодрайвере Godot. Музыка играет на шине Music, всё остальное на Effects, обе под Master, чьи громкости задают настройки.\n"}, {"id": "balance-boats", "path": "balance/boats.md", "title": "Баланс лодок", "section": "balance", "date": "2026-11-11", "md": "# Баланс лодок\n\n![Все корпуса в ряд](../img/fleet.jpg)\n\nСнимок значений из кода на 2026-11-09. Источник — код; меняешь число в коде — обнови эту страницу в том же коммите. Все числа — стартовые значения для настройки.\n\nЗдесь все числа, от которых зависит, как лодка идёт и сколько стоит. Как лодка устроена и управляется — на странице [Лодка](../gameplay/boat.md); как собирают в верфи — [Верфь](../base/boatyard.md); деньги и сохранения — [Прогресс](../gameplay/progression.md); охотники — [Охотники и ИИ](../gameplay/hunters.md); как лодки выглядят — [Облик лодок](../art/boats.md). Оружие и его числа — в [балансе оружия](weapons.md).\n\nМасса везде в тоннах, цена в монетах, мощность в кВт, скорость в м/с. Название детали — по-русски, как в игре, рядом имя в коде.\n\n## 1. Корпуса\n\nИсточник: `game/ships/Parts.cs`, `Parts.Hulls` и поля `HullPart`, `HullForm`, `Feel`.\n\n| Корпус (`Hull`) | Длина, м | Ширина, м | Масса, т | Удары | Станции | Трюм, клеток | Бак, л (`Tank`) | Мест снаряжения (`GearPlaces`) | Цена | Сцепление (`Grip`) | Круг, длин (`Circle`) | Ответ поворота, с (`TurnAnswer`) | Ход (`Pace`) |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| [Катерок](../hulls/runabout.md) (`RunaboutHull`) | 4,8 | 2 | 0,9 | 2 | 1 | 5×3 = 15 | 27 | 1 | 120 | 2 | 1,5 | 0,15 | 2,9 |\n| [Ялик](../hulls/skiff.md) (`SkiffHull`) | 6 | 2,2 | 1,75 | 4 | 2 | 6×4 = 24 | 30 | 1 | 0 | 2,2 | 1,6 | 0,18 | 2,85 |\n| [Плоскодонка](../hulls/punt.md) (`PuntHull`) | 7 | 3 | 2,8 | 5 | 2 | 8×4 = 32 | 42 | 1 | 90 | 0,5 | 1,2 | 0,12 | 3,05 |\n| [Гонщик](../hulls/racer.md) (`RacerHull`) | 11 | 2,6 | 4 | 6 | 3 | 7×3 = 21 | 66 | 2 | 240 | 1,2 | 2,6 | 0,3 | 3 |\n| [Патрульный катер](../hulls/patrol-boat.md) (`PatrolHull`) | 12 | 3,8 | 14,3 | 10 | 4 | 8×5 = 40 | 120 | 2 | 540 | 1,8 | 2 | 0,25 | 3,55 |\n| [Канонерка](../hulls/gunboat.md) (`GunboatHull`) | 16 | 5,5 | 54,5 | 16 | 5 | 10×6 = 60 | 200 | 3 | 1050 | 2,6 | 1,5 | 0,4 | 3 |\n\nВне верфи: броненосец (`IroncladHull`, 22 × 6,8 м, 95 т, 20 ударов, 6 станций, трюм 12×7 = 84, бак 300 л, 3 места снаряжения, цена 0, сцепление 2,6, круг 1,6, ответ 0,45, ход 3) и макет полигона (`DummyHull`, 7,5 × 2,8 м, 1,4 т, 4 удара, 1 станция, трюм 4×3 = 12, бак 30 л, мест снаряжения нет, цена 0, сцепление 1,6, круг 1,8, ответ 0,2, ход 2,6).\n\nЧто значат поля `Feel`: сцепление — как корпус держит боковой ход, 1/с; круг — диаметр поворота в длинах корпуса; ответ — за сколько секунд поворот отвечает; ход (`Pace`) — лучшая скорость на одном кВт на тонну. Поля `Lean`, `BowLift`, `Squat` (крен, подъём носа, посадка кормы) тут не нужны: на ход и цену они не влияют.\n\nДля чего корпус:\n- **Катерок** — самый лёгкий и резкий, но держит два удара. Под сильным мотором самый быстрый.\n- **Ялик** — стартовый, бесплатный, открытый; четыре удара, две станции.\n- **Плоскодонка** — плоская: скользит, как по льду, крутится на месте (сцепление 0,5), берёт больше всего ударов и трюма среди малых.\n- **Гонщик** — длинный, три станции, широкий поворот (круг 2,6 длины).\n- **Патрульный катер** — середняк: четыре станции, лучший ход (3,55), десять ударов.\n- **Канонерка** — тяжёлый, пять станций, шестнадцать ударов; медленный.\n\n## 2. Моторы\n\nИсточник: `game/ships/Parts.cs`, `Parts.Engines`, `EnginePart`.\n\n| Мотор | Мощность, кВт | Масса, т | Цена | Назад (доля хода, `Astern`) | Поворот на месте (`TurnAtRest`) | Расход, л/км (`Burn`) | Привод (`Drive`) |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| [Подвесной мотор](../engines/outboard.md) (`Outboard`) | 45 | 0,12 | 0 | 0,4 | 0,5 | 5 | `Outboard`, на транце |\n| [Воздушный винт](../engines/air-fan.md) (`AirFan`) | 150 | 0,5 | 90 | 0,5 | 0,9 | 6 | `Fan`, на пилоне над кормой |\n| [Два подвесных](../engines/twin-outboards.md) (`TwinOutboards`) | 300 | 0,6 | 360 | 0,35 | 0,55 | 8 | `TwinOutboard`, два на транце |\n| [Водомёт](../engines/water-jet.md) (`WaterJet`) | 700 | 1,2 | 780 | 0,3 | 0,6 | 10 | `Jet`, низко в корпусе |\n\n«Поворот на месте» — доля полного поворота, которой лодка рулит на стоянке при полном газе (`Manoeuvring`). С закрытым газом лодка крутится на месте одним рулём в меру этой доли.\n\nМощность на тонну мотора и на монету: подвесной 375 кВт/т, винт 300, два подвесных 500, водомёт 583; кВт на монету: винт 1,67, водомёт 0,90, два подвесных 0,83.\n\n## 3. Максимальная скорость\n\nИсточник: `game/ships/Handling.cs`, `Handling.Of`.\n\n```\nмасса = сумма масс всех деталей на борту (корпус, мотор, палубные детали, снаряжение, пояс), т\nTop = max( Pace × √( мощность, кВт / масса, т ), 3 )     м/с\n```\n\nЭто и есть правило √(P/W): корень из мощности на вес (кВт на тонну), умноженный на `Pace` корпуса. Сверху скорость ничем не ограничена ([Q20](../questions/boat.md#q20)). Снизу есть пол: 3 м/с. Среди голых корпусов он срабатывает только у канонерки и броненосца с подвесным мотором (по формуле вышло бы 2,7 и 2,1).\n\nДальше от этой же скорости считаются:\n- **Нитро:** рывок разом прибавляет `Nitro.Kick` = 14 м/с и полсекунды умножает мощность на `Nitro.Power` = 2,5.\n- **Добыча в трюме:** время разгона умножается на `(масса + груз, т) / масса`, а максимальная скорость не меняется (`Boat.Laden`, `Boat.cs`, [Q43](../questions/haul.md#q43)).\n- **Поворот на полном ходу:** `TurnRate = clamp(Top / (Circle × длина), 0,25; 2)` рад/с.\n- **Разгон:** `clamp(0,25 × m × Top² / 2 / P + 0,25 × ∛(m/1000), 0,5; 5)` с, где m в кг и P в Вт. **Накат:** `clamp(m × Top² / (2P), 1,5; 8)` с.\n\n### Голые корпуса\n\nБез палубных деталей, снаряжения и брони. В ячейке: скорость, м/с (масса лодки, т). Звёздочка — сработал пол в 3 м/с.\n\n| Корпус | Подвесной | Воздушный винт | Два подвесных | Водомёт |\n| --- | --- | --- | --- | --- |\n| Катерок | 19,3 (1,02) | 30,0 (1,40) | 41,0 (1,50) | 52,9 (2,10) |\n| Ялик | 14,0 (1,87) | 23,3 (2,25) | 32,2 (2,35) | 43,9 (2,95) |\n| Плоскодонка | 12,0 (2,92) | 20,6 (3,30) | 28,6 (3,40) | 40,3 (4,00) |\n| Гонщик | 9,9 (4,12) | 17,3 (4,50) | 24,2 (4,60) | 34,8 (5,20) |\n| Патрульный катер | 6,3 (14,42) | 11,3 (14,80) | 15,9 (14,90) | 23,9 (15,50) |\n| Канонерка | 3,0\\* (54,62) | 5,0 (55,00) | 7,0 (55,10) | 10,6 (55,70) |\n| Броненосец (вне верфи) | 3,0\\* (95,12) | 3,8 (95,50) | 5,3 (95,60) | 8,1 (96,20) |\n\n### Что стоит вес\n\nПалубные детали весят от 0,08 до 0,8 т (таблица ниже, числа их действия — в [балансе оружия](weapons.md)). Скорость считается по всей сумме.\n\n| Деталь (`Parts.Deck`) | Масса, т | Цена |\n| --- | --- | --- |\n| Ракеты I–IV (`Rockets`) | 0,1 / 0,2 / 0,3 / 0,4 | 40 / 75 / 120 / 210 |\n| Носовая стойка I–II (`ChaseRacks`) | 0,12 / 0,24 | 90 / 170 |\n| Торпеды (`Torpedoes`) | 0,8 | 450 |\n| Турель (`Turret`) | 0,3 | 0 |\n| Минный жёлоб (`MineRail`) | 0,45 | 300 |\n| Люлька (`Cradle`) | 0,7 | 480 |\n| Тепловизор (`ThermalSight`) | 0,08 | 180 |\n\nПримеры сборок (скорость по формуле; цена — сумма цен деталей; станции не названные пусты):\n\n| Сборка | Масса, т | Скорость, м/с | Удары | Цена |\n| --- | --- | --- | --- | --- |\n| Ялик, подвесной, турель (стартовая) | 2,17 | 13,0 | 4 | 0 |\n| Ялик, подвесной, Ракеты I | 1,97 | 13,6 | 4 | 40 |\n| Ялик, водомёт, 2 × Ракеты II | 3,35 | 41,2 | 4 | 930 |\n| Плоскодонка, винт, 2 × Ракеты I | 3,50 | 20,0 | 5 | 260 |\n| Гонщик, два подвесных, 3 × Ракеты IV | 5,80 | 21,6 | 6 | 1230 |\n| То же, тяжёлый пояс | 7,04 | 19,6 | 10 | 2130 |\n| Гонщик, водомёт, 3 × Ракеты IV | 6,40 | 31,4 | 6 | 1650 |\n| То же, тяжёлый пояс | 7,64 | 28,7 | 10 | 2550 |\n| Патрульный катер, водомёт, 4 × Торпеды | 18,70 | 21,7 | 10 | 3120 |\n| Патрульный катер, водомёт, 4 × Ракеты IV, трюмная помпа, тяжёлый пояс | 19,32 | 21,4 | 17 | 3360 |\n| Канонерка, водомёт, 5 × Ракеты IV, трюмная помпа, тяжёлый пояс | 61,79 | 10,1 | 27 | 4080 |\n\nВес на малых лодках стоит заметно: тяжёлый пояс, добавивший гонщику 1,24 т, снимает около десятой доли скорости, а на канонерке 3,84 т того же пояса стоят около трёх процентов.\n\n## 4. Броня\n\nИсточник: `game/ships/Parts.cs`, `Parts.ArmourBelt`, `Parts.HeavyBelt`; `game/ships/Belt.cs`.\n\n| Пояс | Цена | Толщина, м | Доля ударов корпуса |\n| --- | --- | --- | --- |\n| Броневой пояс (`ArmourBelt`) | 270 | 0,01 | 1/3 |\n| Тяжёлый пояс (`HeavyBelt`) | 900 | 0,02 | 2/3 |\n\nДобавка ударов — `ceil(удары корпуса × доля)` (`Belt.Strikes`), масса — `2 × 0,78 × длина × (верх − низ) × толщина × 7,85` (`Belt.Mass`), где пояс идёт от 0,46 длины позади миделя до 0,32 впереди, снизу на 0,6 ватерлинии, сверху на ватерлинию плюс треть высоты борта над ней. Сама деталь массы не имеет (`Mass` = 0), весит только пояс по корпусу. Плиты и мелочи: [Q30](../questions/boat.md#q30).\n\n| Корпус | Плит на борт | Лёгкий: + ударов | Лёгкий: масса, т | Тяжёлый: + ударов | Тяжёлый: масса, т |\n| --- | --- | --- | --- | --- | --- |\n| Катерок | 2 | +1 | 0,235 | +2 | 0,470 |\n| Ялик | 3 | +2 | 0,309 | +3 | 0,617 |\n| Плоскодонка | 4 | +2 | 0,249 | +4 | 0,499 |\n| Гонщик | 6 | +2 | 0,620 | +4 | 1,239 |\n| Патрульный катер | 6 | +4 | 0,985 | +7 | 1,969 |\n| Канонерка | 8 | +6 | 1,920 | +11 | 3,840 |\n| Броненосец | 11 | +7 | 3,044 | +14 | 6,089 |\n\nСкорость, которую пояс отнимает на типичной сборке: корпус, два подвесных или водомёт, Ракеты II на каждой станции.\n\n| Корпус | Мотор | Без пояса | Лёгкий пояс | Тяжёлый пояс |\n| --- | --- | --- | --- | --- |\n| Катерок | водомёт | 50,6 | 48,2 (−5%) | 46,1 (−9%) |\n| Ялик | водомёт | 41,2 | 39,4 (−4%) | 37,9 (−8%) |\n| Плоскодонка | водомёт | 38,5 | 37,4 (−3%) | 36,5 (−5%) |\n| Гонщик | два подвесных | 22,8 | 21,5 (−5%) | 20,5 (−10%) |\n| Гонщик | водомёт | 33,0 | 31,3 (−5%) | 29,9 (−9%) |\n| Патрульный катер | два подвесных | 15,5 | 15,1 (−3%) | 14,6 (−6%) |\n| Патрульный катер | водомёт | 23,3 | 22,6 (−3%) | 22,0 (−6%) |\n| Канонерка | два подвесных | 6,9 | 6,8 (−2%) | 6,7 (−3%) |\n| Канонерка | водомёт | 10,5 | 10,4 (−2%) | 10,2 (−3%) |\n\nЦена за добавленный удар: лёгкий пояс — 270 / 135 / 135 / 135 / 68 / 45 монет на катерке, ялике, плоскодонке, гонщике, патрульном катере, канонерке; тяжёлый — 450 / 300 / 225 / 225 / 129 / 82.\n\nПлита, принявшая свои удары, падает, и лодка становится легче и быстрее.\n\n## 5. Снаряжение\n\nИсточник: `game/ships/Parts.cs`, `Parts.Gear`; `Pump.cs`, `Smoke.cs`; `game/combat/Carpenters.cs`. Число деталей на лодке — по её корпусу (`HullPart.GearPlaces`, таблица 1), по одной каждого вида; места не обязаны быть заняты.\n\n| Снаряжение | Масса, т | Цена | Что делает, числа |\n| --- | --- | --- | --- |\n| Управление огнём (`FireControl`) | 0,15 | 360 | Рисует на воде линию огня каждой заряженной стойки. Чисел нет |\n| Таран (`Ram`) | 0,4 | 180 | Удар передней частью тарана не вредит своей лодке; остальные удары — как обычно |\n| Трюмная помпа (`BilgePump`) | 0,25 | 300 | После 4 с без ударов (`Pump.Waiting`) чинит 0,2 удара в секунду (`Pump.Mending`), то есть удар за 5 с |\n| Дымогенератор (`SmokeGenerator`) | 0,3 | 240 | Дым 5 с (`Smoke.Lasting`), перезарядка 25 с (`Smoke.Recharging`); готов снова через 30 с после включения |\n| Плотники (`Carpenters`) | 0,35 | 210 | За каждую потопленную лодку чинят 0,25 её ударов (`Carpenters.Share`, от того, сколько она выдерживала) |\n\nМеханика каждого — в [Бое](../gameplay/combat.md).\n\n## 6. Топливо и нитро\n\nИсточник: `game/ships/Fuel.cs`, `Design.Range`, `game/players/Player.cs`; `game/ships/Nitro.cs`, `game/pickups/Pickups.cs`.\n\n**Топливо.** У каждого корпуса свой бак в литрах (`Tank`, таблица 1), у каждого мотора свой расход в литрах на километр (`Burn`, таблица 2); числа временные ([Q8](../questions/boat.md#q8)). Дальность полного бака — `Design.Range` = бак / расход × 1000 м. За шаг сгорает `|газ| × скорость × время`, метров, делённых на дальность; так что лодка на накате или стоящая не жжёт ничего. Запас (`Fuel.Reserve`) — 20% бака; ниже него HUD зовёт домой. Пустой бак — мотор встаёт. Охотники топливо не жгут. Время зависит от скорости: на полном газе бак хватает на дальность / `Top` секунд, то есть на стартовом ялике (6 км, 13,0 м/с) около 462 с, на катерке с водомётом (2,7 км, 51,7 м/с) около 52 с.\n\nДальность полного бака, км (бак / расход):\n\n| Корпус | Подвесной | Воздушный винт | Два подвесных | Водомёт |\n| --- | --- | --- | --- | --- |\n| Катерок | 5,4 | 4,5 | 3,4 | 2,7 |\n| Ялик | 6,0 | 5,0 | 3,8 | 3,0 |\n| Плоскодонка | 8,4 | 7,0 | 5,3 | 4,2 |\n| Гонщик | 13,2 | 11,0 | 8,3 | 6,6 |\n| Патрульный катер | 24,0 | 20,0 | 15,0 | 12,0 |\n| Канонерка | 40,0 | 33,3 | 25,0 | 20,0 |\n| Броненосец (вне верфи) | 60,0 | 50,0 | 37,5 | 30,0 |\n\nСтартовый ялик с подвесным идёт 6 км, как шёл при едином баке; больший корпус уходит дальше, более жадный мотор — не так далеко. Припас топлива (`Supply.Fuel`) доливает половину бака (`Pickups.Refuelling` = 0,5). Насухо лодка игрока держит 0,25 газа (`Player.Limp`), нитро закрыто.\n\n**Нитро.**\n\n| Параметр | Значение |\n| --- | --- |\n| Толчок рывка (`Nitro.Kick`) | +14 м/с вперёд разом |\n| Мощность в рывке (`Nitro.Power`) | ×2,5 мощности мотора |\n| Рывок длится | 0,5 с (`Dashing`), ракеты в это время проходят сквозь лодку |\n| Рывок стоит | половину шкалы (`Cost`): полная шкала — два рывка |\n| Заряд восстанавливается | за 6 с (`Refilling`), после 1 с без рывка (`Pause`) |\n| Нитро включает | полный газ вперёд, назад не работает |\n\n## 7. Лодки охотников и прочие\n\nИсточник: `game/ships/Design.cs`, `Designs`; `game/drones/Drone.cs`. «Цена» — сумма цен деталей по таблицам выше; охотник её не платит. «Добыча» — сколько очков добычи сыплет его обломок (`Designs.Hunters`, `Worth`).\n\n### Охотники\n\n| Лодка (`Designs`) | Корпус | Мотор | Станции | Снаряжение | Броня | Масса, т | Удары | Скорость, м/с | Цена | Добыча |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| [Ялик](../hunters/skiff.md) (`Skiff`) | Ялик | Подвесной | Ракеты I, пусто | — | — | 1,97 | 4 | 13,6 | 40 | 10 |\n| [Глиссер](../hunters/skimmer.md) (`Skimmer`) | Плоскодонка | Воздушный винт | Ракеты I, пусто | — | — | 3,40 | 5 | 20,3 | 220 | 15 |\n| [Гонщик](../hunters/racer.md) (`Racer`) | Гонщик | Два подвесных | Ракеты II, пусто, Ракеты II | Плотники | — | 5,35 | 6 | 22,5 | 960 | 25 |\n| [Патрульный катер](../hunters/patrol-boat.md) (`PatrolBoat`) | Патрульный | Два подвесных | Ракеты III, пусто, Торпеды, Ракеты III | Дымогенератор | Броневой пояс | 17,59 | 14 | 14,7 | 2100 | 40 |\n| [Канонерка](../hunters/gunboat.md) (`Gunboat`) | Канонерка | Водомёт | Ракеты IV, три пустых, Ракеты IV | Трюмная помпа | Тяжёлый пояс | 60,59 | 27 | 10,2 | 3450 | 70 |\n| [Таранщик](../hunters/rammer.md) (`Rammer`) | Гонщик | Два подвесных | три пустых | Таран | — | 5,00 | 6 | 23,2 | 780 | 20 |\n| [Катерок](../hunters/runabout.md) (`Runabout`) | Катерок | Подвесной | Ракеты I | — | — | 1,12 | 2 | 18,4 | 160 | 10 |\n| [Курьер](../hunters/courier.md) (`Courier`) | Гонщик | Подвесной | три пустых | — | — | 4,12 | 6 | 9,9 | 240 | 30 |\n| [Броненосец](../hunters/ironclad.md) (`Ironclad`) | Броненосец | Водомёт | Ракеты III, пусто, Ракеты III, Торпеды, пусто, Ракеты III | Таран | Тяжёлый пояс | 104,39 | 34 | 7,8 | 2670 | 120 |\n| [Дымовой катер](../hunters/smoke-boat.md) (`SmokeBoat`) | Ялик | Воздушный винт | Ракеты I, Тепловизор | Дымогенератор | — | 2,73 | 4 | 21,1 | 550 | 15 |\n| [Преследователь](../hunters/chaser.md) (`Chaser`) | Гонщик | Два подвесных | пусто, пусто, Носовая стойка I | Плотники | — | 5,07 | 6 | 23,1 | 900 | 30 |\n| [Бегун с турелью](../hunters/turret-runner.md) (`TurretRunner`) | Плоскодонка | Воздушный винт | Турель, пусто | — | — | 3,60 | 5 | 19,7 | 180 | 30 |\n| [Минёр](../hunters/minelayer.md) (`Minelayer`) | Патрульный | Два подвесных | Ракеты III, Минный жёлоб, пусто, Ракеты III | Дымогенератор | Броневой пояс | 17,24 | 14 | 14,8 | 1950 | 45 |\n\n### Другие\n\n| Лодка | Из чего | Масса, т | Удары | Скорость, м/с | Цена |\n| --- | --- | --- | --- | --- | --- |\n| Судно снабжения (`SupplyBoat`), союзник в эскорте | Патрульный катер, два подвесных, без оружия | 14,90 | 10 | 15,9 | 900 |\n| Макет полигона (`Dummy`) | Макет, подвесной, без оружия | 1,52 | 4 | 14,1 | 0 |\n| Дрон (`Drone.Design`), его выпускает люлька | корпус 3 м и 0,25 т, 2 удара, мотор 220 кВт и 0,03 т, Ракеты I | 0,38 | 2 | около 70 | — |\n\nДрон считается по той же формуле: `2,9 × √(220 / 0,38)`.\n\n## 8. Хозяйство верфи\n\nИсточник: `game/progress/Progress.cs`, `game/ships/Design.cs`.\n\n- **Старт:** 10 000 монет (`Progress.StartingCoins`). Стартовая лодка — `Designs.Starter`: ялик, подвесной мотор, турель на второй станции, первая свободна под ракеты; цена 0, так что у игрока уже есть эти три детали.\n- **Покупка:** каждая деталь продаётся за свою цену (`Progress.Buy`); деталь, которую уже имеешь, не покупается.\n- **Самая дешёвая полная сборка**, все станции заняты, без снаряжения и брони: ялик, подвесной мотор, Ракеты I и турель — 40 монет. С самым дешёвым снаряжением (таран, 180) и лёгким поясом (270) — 490. Дешевле стартовой по ценам нет, потому что она бесплатна.\n- **Самая дорогая:** канонерка 1050 + водомёт 780 + люлька 480 + четыре Торпеды 4 × 450 + управление огнём 360 + тяжёлый пояс 900 = 5370 монет, масса 63,59 т, скорость 10,0 м/с, 27 ударов. Это сумма цен, без проверки, поместятся ли детали (`Layout.Crowded`) и всплывёт ли лодка.\n- **Дорогие готовые сборки игры:** канонерка охотника — 3450, патрульный катер охотника — 2100.\n\n## 9. Заметки\n\n- **Курьер (гонщик с подвесным) идёт 9,9 м/с.** Это медленнее стартового ялика (13,0), хотя в коде он помечен как «построен бежать» (комментарий к `Designs.Courier`).\n- **Водомёт — лучший мотор по скорости на каждом корпусе, а «два подвесных» хуже водомёта и по цене за кВт (1,20 против 1,11), и по массе за кВт.** Они выигрывают только ценой в целом: 360 против 780. Правило проекта «деталь хуже другой во всём — убирается» ([Лодка](../gameplay/boat.md)) тут держится на цене.\n- **Воздушный винт — самый дешёвый кВт (0,60 монеты) и лучший поворот на месте (0,9)**; по скорости он между подвесным и двумя подвесными.\n- **Канонерке и броненосцу нужен водомёт**: с двумя подвесными они идут 7,0 и 5,3 м/с, с подвесным упираются в пол 3 м/с. С двумя подвесными они идут медленнее голого ялика на подвесном (14,0).\n- **У плоскодонки ход (3,05) выше, чем у ялика (2,85), но скорость ниже на каждом моторе** (12,0 против 14,0 с подвесным), потому что она на 1,05 т тяжелее. Зато она берёт 5 ударов и 32 клетки трюма против 4 и 24 за 90 монет.\n- **Гонщик (6 ударов, 21 клетка трюма) уступает плоскодонке (5 ударов, 32 клетки)** по трюму и ударам при цене 240 против 90; его преимущество — три станции и длина.\n- **Катерок на водомёте 52,9 м/с без деталей и около 50 с ракетой**; дрон — около 70 м/с. [Q20](../questions/boat.md#q20) спрашивает, не слишком ли это.\n- **Броня на малых корпусах дорога:** лёгкий пояс на катерке даёт 1 удар за 270, больше цены самого катерка (120). На канонерке тяжёлый пояс даёт 11 ударов за 900 и весит 3,84 т, то есть 7% её массы.\n- **Турель бесплатна и весит 0,3 т, Ракеты I стоят 40 и весят 0,1 т**; вес палубных деталей заметен лишь на корпусах легче 5 т, на патрульном катере и канонерке он тонет в массе корпуса.\n- **Патрульный катер охотника** идёт 14,7 м/с и держит 14 ударов: пояс весит 0,985 т и даёт 4 удара.\n- **Катерок на водомёте уходит всего на 2,7 км (около 52 с на полном газе)**, канонерка с водомётом — на 20 км; малому корпусу дальность заменяет только то, что он быстр.\n"}, {"id": "balance-economy", "path": "balance/economy.md", "title": "Баланс экономики", "section": "balance", "date": "2026-11-10", "md": "# Баланс экономики\n\nСнимок значений из кода на 2026-11-09. Источник — код; меняешь число в коде — обнови эту страницу в том же коммите. Все числа — стартовые значения для настройки.\n\nОткуда берутся монеты и на что уходят. Как устроены трюм и точки выхода: [Добыча](../gameplay/haul.md); цены деталей: [Баланс лодок](boats.md), [Баланс оружия](weapons.md).\n\n## Поток монет\n- Новая игра начинается с 10 000 монет, на Ялике (`Progress.StartingCoins`, `Designs.Starter`).\n- Монеты приходят из двух мест: привезённая добыча (продаётся на квитке по возвращении домой) и сцены сюжета (`give coins N`, `story/Teller.cs`).\n- Монеты уходят только на детали верфи ([Q56](../questions/missions.md#q56)).\n- Добыча — ценность предмета в очках; каждое очко — три монеты (`Progress.Rate`, [Q128](../questions/missions.md#q128)), по возвращении домой (`Game.Homecoming`, `Progress.Earn`). Потопленная лодка добычи не привозит.\n\n## Предметы\nИсточник: `game/haul/Items.cs`, `Items.All`. Предметы — заглушки ([Q42](../questions/haul.md#q42)); ресурс ни на что не тратится: детали только покупаются ([Прогресс](../gameplay/progression.md)). Вес трюма замедляет разгон лодки ([Добыча](../gameplay/haul.md)), так что ценятся лёгкие и маленькие.\n\n| Предмет | Ресурс | кг | Добыча | Клетки | Добыча на клетку |\n| --- | --- | --- | --- | --- | --- |\n| Медный лом (`ScrapCopper`) | металл | 14 | 6 | 2×1 | 3 |\n| Латунная арматура (`BrassFittings`) | металл | 6 | 4 | 1×1 | 4 |\n| Стальной лист (`SteelPlate`) | металл | 38 | 5 | 3×2 | 0,8 |\n| Свинцовый балласт (`LeadBallast`) | металл | 45 | 3 | 2×1 | 1,5 |\n| Алюминиевый лист (`AluminiumSheet`) | металл | 9 | 4 | 3×2 | 0,7 |\n| Подвесной мотор (`OutboardMotor`) | механизмы | 48 | 18 | 2×3 | 3 |\n| Гребной винт (`Propeller`) | механизмы | 9 | 6 | 2×2 | 1,5 |\n| Редуктор (`Gearbox`) | механизмы | 30 | 10 | 2×2 | 2,5 |\n| Топливный насос (`FuelPump`) | механизмы | 5 | 5 | 1×1 | 5 |\n| Автомобильный аккумулятор (`CarBattery`) | электрика | 18 | 5 | 2×1 | 2,5 |\n| Солнечная панель (`SolarPanel`) | электрика | 14 | 9 | 3×2 | 1,5 |\n| Радиоприёмник (`RadioSet`) | электрика | 7 | 8 | 2×1 | 4 |\n| Платы (`CircuitBoards`) | электрика | 4 | 7 | 1×1 | 7 |\n| Канистра (`FuelCan`) | топливо | 22 | 4 | 1×2 | 2 |\n| Бочка масла (`OilDrum`) | топливо | 90 | 6 | 2×3 | 1 |\n| Ракетные двигатели (`RocketMotors`) | взрывчатка | 10 | 7 | 3×1 | 2,3 |\n| Боеголовки (`Warheads`) | взрывчатка | 16 | 10 | 2×1 | 5 |\n| Сигнальные ракеты (`SignalFlares`) | взрывчатка | 3 | 3 | 1×1 | 3 |\n| Бухта каната (`RopeCoil`) | ткань | 8 | 2 | 2×1 | 1 |\n| Парусина (`Sailcloth`) | ткань | 6 | 2 | 2×1 | 1 |\n| Брезент (`Tarpaulin`) | ткань | 7 | 2 | 2×1 | 1 |\n| Сейф (`Strongbox`) | ценности | 20 | 25 | 2×2 | 6,2 |\n| Жемчуг (`Pearls`) | ценности | 0,5 | 15 | 1×1 | 15 |\n| Хронометр (`Chronometer`) | ценности | 4 | 12 | 1×1 | 12 |\n| Подзорная труба (`Spyglass`) | ценности | 1,5 | 6 | 1×2 | 3 |\n| Бочонок рома (`RumCask`) | провизия | 40 | 6 | 2×2 | 1,5 |\n| Аптечка (`MedicalKit`) | провизия | 3 | 5 | 1×1 | 5 |\n| Консервы (`TinnedFood`) | провизия | 15 | 3 | 2×1 | 1,5 |\n| Ваза (`Vase`) | ценности | 6 | 14 | 1×2 | 7 |\n| Судовой колокол (`ShipsBell`) | металл | 25 | 16 | 2×2 | 4 |\n| Фарфоровые тарелки (`Porcelain`) | ценности | 5 | 11 | 1×1 | 11 |\n| Бронзовая статуэтка (`Statuette`) | ценности | 12 | 18 | 1×2 | 9 |\n| Масляный фонарь (`Lantern`) | провизия | 3 | 6 | 1×1 | 6 |\n\n- Лучшие на клетку — ценности: жемчуг (15), хронометр (12), фарфоровые тарелки (11).\n- Хуже всего — ткань, бочка масла, стальной и алюминиевый листы: 1 и меньше на клетку. Бочка масла ещё и самая тяжёлая (90 кг).\n\n## Что несут охотники\nИсточник: `game/ships/Design.cs`, `Designs.Hunters` (добыча проекта); `game/haul/Items.cs`, `Items.Carried`. Обломок высыпает случайные предметы из списка своего проекта, пока их добыча не дойдёт до добычи проекта, но не больше 8 (`Items.Most`). Та же добыча — цена проекта в угрозе директора ([Директор](../gameplay/director.md)).\n\n| Охотник | Добыча | Что несёт |\n| --- | --- | --- |\n| Ялик (`Skiff`) | 10 | канистра, бухта каната, консервы, латунная арматура, сигнальные ракеты, гребной винт, масляный фонарь |\n| Катерок (`Runabout`) | 10 | канистра, жемчуг, бухта каната, сигнальные ракеты, консервы, алюминиевый лист, фарфоровые тарелки |\n| Глиссер (`Skimmer`) | 15 | канистра, гребной винт, медный лом, бухта каната, парусина, брезент, масляный фонарь |\n| Преследователь (`Chaser`) | 30 | подвесной мотор, ракетные двигатели, канистра, хронометр, подзорная труба, жемчуг |\n| Бегун с турелью (`TurretRunner`) | 30 | канистра, гребной винт, автомобильный аккумулятор, стальной лист, масляный фонарь, бухта каната |\n| Минёр (`Minelayer`) | 45 | боеголовки, радиоприёмник, бочка масла, стальной лист, автомобильный аккумулятор, сейф, судовой колокол |\n| Дымовой катер (`SmokeBoat`) | 15 | канистра, бочка масла, платы, сигнальные ракеты, брезент, топливный насос |\n| Таранщик (`Rammer`) | 20 | стальной лист, подвесной мотор, свинцовый балласт, редуктор, топливный насос, канистра |\n| Гонщик (`Racer`) | 25 | подвесной мотор, канистра, ракетные двигатели, хронометр, подзорная труба, жемчуг, ваза |\n| Курьер (`Courier`) | 30 | сейф, жемчуг, хронометр, платы, радиоприёмник, солнечная панель, ваза, бронзовая статуэтка, фарфоровые тарелки |\n| Патрульный катер (`PatrolBoat`) | 40 | радиоприёмник, боеголовки, ракетные двигатели, стальной лист, автомобильный аккумулятор, аптечка, сейф, судовой колокол |\n| Канонерка (`Gunboat`) | 70 | стальной лист, свинцовый балласт, боеголовки, редуктор, бочка масла, бочонок рома, сейф, судовой колокол |\n| Броненосец (`Ironclad`) | 120 | сейф, боеголовки, стальной лист, редуктор, солнечная панель, бочка масла, бочонок рома, бронзовая статуэтка |\n\nГруз судна снабжения (`SupplyBoat`) в задании «груз» — бочонок рома, консервы, аптечка, канистра, парусина, брезент, топливный насос, солнечная панель.\n\nПредмет может перескочить добычу проекта: обломок с дорогим последним предметом даёт больше. Довезённая добыча — монета за очко.\n\n## Места промысла\nИсточник: `game/activities/Shoal.cs`, `Catch`; `game/activities/Wreck.cs`, `Salvage`. Поднятое в виде сбоку ложится в трюм и продаётся дома, как любая добыча ([Места промысла](../gameplay/sites.md), [Q31](../questions/haul.md#q31)). В трюме у каждого вида два размера по половинам диапазона (`Catch.Sizes`, `Items`); клетки: рыба по 0,4 м длины (1–4), у групера и луциана в два ряда; ящик и бочка 2×2, сундук 2×1.\n\n| Рыба | Длина, м | Монеты |\n| --- | --- | --- |\n| Скумбрия (`Mackerel`) | 0,3–0,5 | 2 |\n| Луциан (`Snapper`) | 0,45–0,85 | 4 |\n| Барракуда (`Barracuda`) | 0,8–1,4 | 6 |\n| Групер (`Grouper`) | 0,65–1,2 | 9 |\n\nВ косяке скумбрии втрое чаще групера: из семи 3 скумбрии, 2 луциана, барракуда, групер (`Shoal.Kinds`).\n\n| На обломках | Вес, кг | Монеты |\n| --- | --- | --- |\n| Ящик (`Crate`) | 12–35; в трюме 18 или 29 | 5 |\n| Бочка (`Barrel`) | 40–110; в трюме 58 или 92 | 4 |\n| Сундук (`Chest`) | 20–60; в трюме 30 или 50 | 14 |\n\nИз шести вещей на обломках 3 ящика, 2 бочки, сундук (`Salvage.Kinds`). Обломки, которым в [редакторе карт](../tools/map-editor.md) дан список предметов, держат эти предметы и платят за них их добычу.\n\n## Точки выхода\nИсточник: `game/haul/Ways.cs`, `Ways.ByName`. Пошлину трюм платит предметами, начиная с самых дешёвых, пока их добыча не покроет её. Лёгкий проход пускает лодки легче 3 т. Прилив открыт треть своего круга.\n\n| Локация | Пошлина | Лёгкий проход | Прилив | Только после цели |\n| --- | --- | --- | --- | --- |\n| Коралловый островок | Гаванский буй, 15 | Проход в рифе | Приливная струя, 40 с из 120 | Сигнальная башня |\n| Арена | Бакен пролива, 20 | Юго-западный проход атолла (3 т) | Устье протоки, 40 с из 120 | Причал бухты |\n\nВ каждой локации есть и выход без условий; на Арене их два, южное и северо-восточное открытое море. Пошлина в 15–25 очков — это один-два охотника средней руки.\n\n## Что выглядит не в ладу\n- Предметы ткани стоят 1 на клетку: их почти всегда лучше выбросить за борт, чем везти.\n- Рыба и вещи с обломков идут в трюм и платят дома, как любая добыча, но едят те же клетки и вес, что и охотничьи предметы ([Q31](../questions/haul.md#q31)).\n- Монеты не на что тратить, когда верфь куплена ([Чего нам не хватает](../questions/gaps.md)).\n"}, {"id": "balance-weapons", "path": "balance/weapons.md", "title": "Баланс оружия", "section": "balance", "date": "2026-11-10", "md": "# Баланс оружия\n\nСнимок значений из кода на 2026-11-10. Источник — код; меняешь число в коде — обнови эту страницу в том же коммите. Все числа — стартовые значения для настройки.\n\nЗдесь числа всего, чем лодка причиняет вред, и как они соотносятся. Как устроены выстрел, таран и опасности, написано на страницах тем: [Бой](../gameplay/combat.md), [Сборки и стили игры](../gameplay/builds.md), [Припасы](../gameplay/pickups.md), [Зоны и опасности](../world/areas.md), [Охотники и ИИ](../gameplay/hunters.md), [Верфь](../base/boatyard.md). Попадания корпусов — в [Балансе лодок](boats.md). Термины — в [глоссарии](../glossary.md).\n\nВред мерится **попаданиями** (`strikes`): корпус стоит столько попаданий, сколько записано в его `Strikes`, и тонет, когда они выбраны.\n\n## 1. Пусковые установки\n\nИсточник: `game/ships/Parts.cs`, `Parts.Rockets`, `Parts.ChaseRacks`, `Parts.Torpedoes`, `Parts.Turret`, `Parts.MineRail`, `Parts.Cradle`; поля `Launcher` (`Reload`, `Damage`, `Rails`, `Blast`). Скорости и досягаемости: `Rockets.Motor`, `Boat.Reach`, `Torpedoes.Motor`, `Torpedoes.Run`, `Turrets.Reach`, `Floaters`. Массу даёт деталь, цену — верфь.\n\nФормулы: попаданий за залп на борт = `Rails` × `Damage`; попаданий в секунду на борт = залп ÷ `Reload`. Каждый борт перезаряжается сам, обе стойки пары заряжены в начале боя.\n\n| Установка (код) | Попаданий за снаряд | Снарядов на борт за залп | Перезарядка, с | Попаданий за залп на борт | Попаданий в с на борт | «Взрыв», м | Масса, т | Цена, монет |\n|---|---|---|---|---|---|---|---|---|\n| [Ракеты I](../weapons/rockets-i.md) (`Rockets[0]`) | 1 | 2 | 2,0 | 2 | 1,00 | 0,25 | 0,1 | 40 |\n| [Ракеты II](../weapons/rockets-ii.md) (`Rockets[1]`) | 1 | 3 | 2,5 | 3 | 1,20 | 0,25 | 0,2 | 75 |\n| [Ракеты III](../weapons/rockets-iii.md) (`Rockets[2]`) | 1 | 4 | 3,0 | 4 | 1,33 | 0,25 | 0,3 | 120 |\n| [Ракеты IV](../weapons/rockets-iv.md) (`Rockets[3]`) | 1 | 5 | 3,5 | 5 | 1,43 | 0,25 | 0,4 | 210 |\n| [Носовая стойка I](../weapons/chase-rack-i.md) (`ChaseRacks[0]`) | 1 | 2 | 2,0 | 2 | 1,00 | 0,25 | 0,12 | 90 |\n| [Носовая стойка II](../weapons/chase-rack-ii.md) (`ChaseRacks[1]`) | 1 | 3 | 2,5 | 3 | 1,20 | 0,25 | 0,24 | 170 |\n| [Торпеды](../weapons/torpedoes.md) (`Torpedoes`) | 12 | 1 | 10,0 | 12 | 1,20 | 1 | 0,8 | 450 |\n| [Турель](../weapons/turret.md) (`Turret`) | 1 | 1 | 0,8 | 1 | 1,25 (одна на лодку) | 0,2 | 0,3 | 0 |\n| [Минный жёлоб](../weapons/mine-rail.md) (`MineRail`) | 5 | 1 | 2,5 | 5 | 2,00 | 6 | 0,45 | 300 |\n| [Люлька](../weapons/cradle.md) (`Cradle`), дрон | 1 | 2 | 2,0 | 2 | 1,00 за дрон | — | 0,7 | 480 |\n\nПримечания к таблице.\n- «Взрыв» — поле `Blast`. У ракет, торпед и турели это запас касания: снаряд бьёт, если проходит в этом зазоре от корпуса, а попадание одно и полное (`Gunnery.Strike`). Настоящий взрыв по площади только у мины: удар `Damage` у корпуса, к радиусу 6 м спадает до нуля (`Blasts.Burst`), и он задевает всех, кроме своей стороны.\n- Носовая стойка I и II стреляют теми же числами, что Ракеты I и II (`Rockets[level - 1].Launcher with { Facing = Bow }`), и стоят дороже.\n- Турель одна на лодку по оси, а не пара. Она стреляет сама, по стволу за раз, и в Q и E не входит (`Weapon.Turrets`). Она стоит на стартовой лодке (`Designs.Starter`), поэтому бесплатна.\n- Люлька держит два дрона (`Parts.CradleDrones`), по одному на борт; каждый несёт одну ракетную стойку Ракеты I (`Drone.Design`) и два попадания корпуса. Потерянный дрон строится заново за 20 с (`Parts.CradleRebuild`).\n- Масса и цена детали — на одну деталь: пару бортов она даёт сама.\n\nПолёт снаряда.\n\n| Установка | Скорость снаряда, м/с | Досягаемость, м | Разброс (σ), рад | Масса снаряда, т |\n|---|---|---|---|---|\n| Ракеты I–IV, носовые стойки | у игроков 25 при пуске, 100 у цели (`Rockets.Motor`, разгон за 0,15 с); у других сторон 20 и 40, разгон за 0,3 с | 80 (`Boat.Reach`); ≈0,91 с полёта, у других сторон ≈2,15 с | 0,012 (`Rockets.Spread`) | 0,022 |\n| Торпеды | 6 при пуске, 14 после разгона (`Torpedoes.Motor`, 0,8 с) | 100 (`Torpedoes.Run`); ≈7,6 с хода | 0,008 (`Torpedoes.Spread`) | 0,35 |\n| Турель | снаряд, 40 у всех сторон (`Rockets.Shell`) | 45 (`Turrets.Reach`); ≈1,1 с полёта | 0,012 | 0,010 |\n| Мина | бросок 4 м/с за корму, замирает за ~2 с (`Floaters.Toss`, `Slowing`) | ложится в паре метров за кормой | — | 0,17 |\n| Дрон | сам лодка, ракета как у Ракет I | ракета 80; дрон уходит от носителя не дальше 60 м (`Wingman.Leash`) | — | — |\n\nРакету и торпеду игрока наводка поворачивает не дальше 0,6 рад в каждую сторону от линии установки (`Boat.Fan`). Снаряд несёт ещё и ход лодки. Взрыв торпеды заодно подбрасывает корпус (`Torpedoes.Heave`, импульс 12 т·м/с).\n\nГде можно стоять (`DeckPart.Fits`, `Build.Fault`).\n- Ракеты I–IV, торпеды, турель: на любой станции корпуса.\n- Носовые стойки: только на станциях впереди 5% длины от миделя (`DeckPart.Front`). На Катерке (единственная станция чуть позади миделя) их не поставить.\n- Минный жёлоб и люлька: только на станции на миделе или позади, и не больше одного жёлоба и одной люльки на лодку.\n- Станций: Катерок 1, Ялик 2, Плоскодонка 2, Гонщик 3, Патрульный катер 4, Канонерка 5 (`Hull.Stations`). Тепловизор тоже занимает станцию.\n\nСборки и их задачи — на странице [Сборки и стили игры](../gameplay/builds.md), покупка деталей — в [Верфи](../base/boatyard.md).\n\n## 2. Сколько тонуть\n\nИсточник: `HullPart.Strikes` (`Parts.RunaboutHull` и остальные), `Belt.Strikes`, `ArmourPart.Share` (`Parts.ArmourBelt` 1/3, `Parts.HeavyBelt` 2/3).\n\nФормула: корпусу с `S` попаданиями нужно `n = ⌈S ÷ попаданий за залп⌉` залпов; пушка заряжена в начале боя, поэтому время = `(n − 1) × перезарядка`. Это стрельба одним бортом без промахов, без ряби залпа (до 0,27 с на залп), без времени полёта. Пояс добавляет `⌈S × Share⌉` попаданий (`Belt.Strikes`). Ноль значит, что хватает первого залпа.\n\nПопадания корпусов, без пояса, с поясом (+1/3), с тяжёлым поясом (+2/3):\n\n| Корпус | Катерок | Ялик | Плоскодонка | Гонщик | Патрульный катер | Канонерка |\n|---|---|---|---|---|---|---|\n| Без пояса | 2 | 4 | 5 | 6 | 10 | 16 |\n| Броневой пояс | 3 | 6 | 7 | 8 | 14 | 22 |\n| Тяжёлый пояс | 4 | 7 | 9 | 10 | 17 | 27 |\n\nСекунд до гибели, **без пояса**:\n\n| Установка | Катерок (2) | Ялик (4) | Плоскодонка (5) | Гонщик (6) | Патрульный (10) | Канонерка (16) |\n|---|---|---|---|---|---|---|\n| Ракеты I / Нос. I / дрон | 0 | 2 | 4 | 4 | 8 | 14 |\n| Ракеты II / Нос. II | 0 | 2,5 | 2,5 | 2,5 | 7,5 | 12,5 |\n| Ракеты III | 0 | 0 | 3 | 3 | 6 | 9 |\n| Ракеты IV | 0 | 0 | 0 | 3,5 | 3,5 | 10,5 |\n| Торпеды | 0 | 0 | 0 | 0 | 0 | 10 |\n| Турель | 0,8 | 2,4 | 3,2 | 4 | 7,2 | 12 |\n| Мина (в цель) | 0 | 0 | 0 | 2,5 | 2,5 | 7,5 |\n\nС **броневым поясом**:\n\n| Установка | Катерок (3) | Ялик (6) | Плоскодонка (7) | Гонщик (8) | Патрульный (14) | Канонерка (22) |\n|---|---|---|---|---|---|---|\n| Ракеты I / Нос. I / дрон | 2 | 4 | 6 | 6 | 12 | 20 |\n| Ракеты II / Нос. II | 0 | 2,5 | 5 | 5 | 10 | 17,5 |\n| Ракеты III | 0 | 3 | 3 | 3 | 9 | 15 |\n| Ракеты IV | 0 | 3,5 | 3,5 | 3,5 | 7 | 14 |\n| Торпеды | 0 | 0 | 0 | 0 | 10 | 10 |\n| Турель | 1,6 | 4 | 4,8 | 5,6 | 10,4 | 16,8 |\n| Мина (в цель) | 0 | 2,5 | 2,5 | 2,5 | 5 | 10 |\n\nС **тяжёлым поясом**:\n\n| Установка | Катерок (4) | Ялик (7) | Плоскодонка (9) | Гонщик (10) | Патрульный (17) | Канонерка (27) |\n|---|---|---|---|---|---|---|\n| Ракеты I / Нос. I / дрон | 2 | 6 | 8 | 8 | 16 | 26 |\n| Ракеты II / Нос. II | 2,5 | 5 | 5 | 7,5 | 12,5 | 20 |\n| Ракеты III | 0 | 3 | 6 | 6 | 12 | 18 |\n| Ракеты IV | 0 | 3,5 | 3,5 | 3,5 | 10,5 | 17,5 |\n| Торпеды | 0 | 0 | 0 | 0 | 10 | 20 |\n| Турель | 2,4 | 4,8 | 6,4 | 7,2 | 12,8 | 20,8 |\n| Мина (в цель) | 0 | 2,5 | 2,5 | 2,5 | 7,5 | 12,5 |\n\nМина считается как бьющая в цель с полной силой: сила спадает с расстоянием до корпуса, и ей нужно, чтобы цель на неё наехала. Дрон считается одним: второй, с другого борта, удваивает темп, но дрон ещё должен долететь. Запасы припасов брони (раздел 5) в таблицу не входят.\n\n## 3. Прочий вред\n\n### Таран\nИсточник: `game/combat/Ramming.cs`, `Ramming.Land`; `Parts.Ram`.\n- Удар корпусов разных сторон: попаданий `= импульс × (1 − 3 ÷ скорость сближения) ÷ 10`, и **такое же число обоим корпусам** (`Gentle` = 3 м/с — слабее толчок ничего не бьёт, `PerStrike` = 10 т·м/с). Большой корпус выдерживает удар, который топит ялик.\n- Таран (`Parts.Ram`, 0,4 т, 180 монет): удар, пришедшийся в нос за корнем тарана, не бьёт свою лодку (`Hurt.OnRam`); чужую бьёт как всегда. Удар в борт или корму вред как обычно.\n- Удар носовой четвертью с горящим нитро (`Ramming.Charging`): своя лодка получает ×0,5 (`Braced`), чужая ×1,5 (`Driven`).\n- Толчок внутри одной стороны ничего не бьёт.\n\n### Прицел турели и дронов\n- Турель: берёт ближайшую лодку другой стороны в пределах 45 м, не сквозь дым (`Turrets.Reach`, `Screens.Sees`); голова поворачивается на 2,5 рад/с и стреляет, когда отклонена меньше чем на 3° (`Turrets`).\n- Дроны (`Wing`, `Wingman`): сами идут на лодку другой стороны в пределах 30 м от носителя (`Threat`), держат цель, пока она в 45 м (`Chased`); посланный на цель отпускает её дальше 70 м от носителя (`Wingman.Reaching` = `Leash` 60 + `Passing` 10) плюс 15 м, если она его добыча (`Letting`). Возвращаются домой с последним попаданием корпуса (`Spent` = 1). Принятый на борт дрон чинится 5 с (`Mending`), потерянный строится 20 с.\n\n### Мины\nИсточник: `game/combat/Floaters.cs`, `Floater.cs`, `Parts.MineRail`.\n- На плаву у лодки не больше шести (`Floaters.Keep`): седьмая топит самую старую без взрыва.\n- Взводится через 1,2 с (`Arming`), тонет сама через 45 с (`Life`).\n- Взрывается под живым корпусом другой стороны или от снаряда; своей стороны не бьёт. Взрыв — 5 попаданий у корпуса, спад к 6 м (`Burst`).\n- Цепочка: взрыв поджигает мины в радиусе взрыва через 0,1–0,25 с (`Mines.Fuse`), и это относится и к чужим, и к своим минам на плаву. Охотник считает жёлоб «досягаемым» на 25 м позади (`Floaters.Reach`).\n\n### Дым\nИсточник: `game/ships/Smoke.cs`; `Parts.SmokeGenerator`.\n- Дымогенератор (0,3 т, 240 монет) ставит завесу 5 с (`Smoke.Lasting`) и перезаряжается 25 с (`Smoke.Recharging`) — после выстрела в целом 30 с до следующей. Охотники и турель сквозь неё не видят; тепловизор (180 монет) видит.\n\n### Плотники\nИсточник: `game/combat/Carpenters.cs`; `Parts.Carpenters`.\n- За каждую лодку, потопленную снарядом или тараном, чинят четверть её попаданий (`Share` 0,25 × её `Stood`), но не больше, чем выбрано. Плотники 0,35 т, 210 монет.\n\n## 4. Огонь охотников\n\nИсточник: `game/ai/Crew.cs` (`Crew.Green` и остальные), `Boat` (`_reload = Reload × slowness`), `Captain.Aim`, `missions/Director.cs`.\n\nМастерство — три числа: `Tick`, секунды между мыслями капитана; `Slack`, на сколько метров мимо цели снаряд может пройти, чтобы капитан стрелял; `Slowness`, во сколько раз его перезарядка больше, чем у игрока.\n\n| Экипаж (код) | Реакция (`Tick`), с | Прицел (`Slack`), м | Перезарядка (`Slowness`), × |\n|---|---|---|---|\n| Новички (`Green`) | 0,5 | 5 | 2,2 |\n| Бывалые (`Seasoned`) | 0,35 | 2,5 | 1,9 |\n| Ветераны (`Veteran`) | 0,25 | 0 | 1,6 |\n| Асы (`Ace`) | 0,15 | 0 | 1,2 |\n\nВыстрел проверяется каждые 0,05 с (`Captain.Aiming`); `Slack` прибавляется к запасу касания снаряда. Перезарядка ×`Slowness` касается всех установок охотника, в секундах:\n\n| Установка | Игрок | Новички | Бывалые | Ветераны | Асы |\n|---|---|---|---|---|---|\n| Ракеты I | 2 | 6 | 8 | 8 | 16 | 26 |\n| Ракеты II | 2,5 | 5 | 5 | 7,5 | 12,5 | 20 |\n| Ракеты III | 0 | 3 | 6 | 6 | 12 | 18 |\n| Ракеты IV | 0 | 3,5 | 3,5 | 3,5 | 10,5 | 17,5 |\n| Торпеды | 10 | 22 | 19 | 16 | 12 |\n| Турель | 0,8 | 1,76 | 1,52 | 1,28 | 0,96 |\n| Минный жёлоб | 2,5 | 5,5 | 4,75 | 4,0 | 3,0 |\n\nДиректор берёт экипаж по угрозе (`Director`): ниже 60 — новички, ниже 100 — бывалые, ниже 160 — ветераны, выше — асы. Миссии задают экипаж своим охотникам прямо (`missions/Cargo.cs` и другие). Вопрос: [Q29](../questions/combat.md#q29).\n\n## 5. Припасы\n\nИсточник: `game/pickups/Pickups.cs` (`Pickups.Take`, `Pickups.Mending`), `game/ships/Nitro.cs`.\n\n| Припас | Что даёт |\n|---|---|\n| Ремонт | Чинит `⌈Stood × 1/3⌉` попаданий (`Boat.Mend`), где `Stood` — все попадания лодки с поясом |\n| Броня | Пополняет запас брони до `⌈Stood × 1/3⌉` (не прибавляет, а доводит до этого; `Boat.Reinforce`); он снимается раньше плит и корпуса |\n| Нитро | Заполняет шкалу (`Nitro.Fill`); это два рывка (`Nitro`, [лодки](boats.md)) |\n\nПрипас лежит 30 с, последние 5 мигает (`Lasting`, `Blinking`); берёт любая лодка, чей корпус подошёл к нему на 1,8 м (`Reach`). Ремонт и броня за подбор, для лодок без пояса:\n\n| Корпус | Катерок | Ялик | Плоскодонка | Гонщик | Патрульный | Канонерка |\n|---|---|---|---|---|---|---|\n| Попаданий | 1 | 2 | 2 | 2 | 4 | 6 |\n\nС поясом: 1, 2, 3, 3, 5, 8; с тяжёлым: 2, 3, 3, 4, 6, 9. Решение: [Припасы](../gameplay/pickups.md).\n\n## 6. Опасности\n\nИсточник: `game/areas/`. Силу даёт `Blasts.Burst`: попаданий у корпуса, спад к нулю на радиусе; взрывы задевают все стороны.\n\n| Опасность (код) | Вред корпусу |\n|---|---|\n| Мины (`Mines`) | 8 попаданий у корпуса, радиус 10 м; корпус, коснувшийся мины, или снаряд взрывает её; цепочка за 0,1–0,25 с |\n| Бочки (`Drums`) | 5 попаданий, радиус 7 м; взрыв от снаряда, взрыва рядом или от встречи корпуса с бочкой на скорости сближения больше 6 м/с |\n| Нефтяные пятна (`Slicks`) | Горящее пятно: 0,6 попадания в секунду, пока часть корпуса над огнём (`Scorching`); поджигает бочки внутри; поджигает его снаряд или взрыв |\n| Обстрелы (`Barrages`) | Падение 1,25 попадания у корпуса, радиус 9 м; предупреждение кольцом 1,4 с, падение ещё 0,7 с |\n| Батареи (`Batteries`) | Залп 4 красных ракеты (по 1 попаданию) раз в 6 с; сама батарея стоит 16 попаданий, а добитая рвётся (2 попадания, радиус 6 м) |\n| Импульсные башни (`Towers`) | Кольцо раз в импульс (заряд 1,5 с, ход 20 м/с): 1 попадание у основания, 0,4 у края радиуса; выбрасывает корпус наружу; в кольце до двух щелей |\n| Боны (`Booms`) | Не бьют: закрытые держат как стена. Лебёдочная будка стоит 4 попадания снарядов — разбитая отпускает бон насовсем |\n| Прожекторы (`Searchlights`) | Не бьют, только замечают лодку игрока (вне дыма) |\n| Течения (`Currents`) | Не бьют, несут лодки и всё на плаву |\n\nСтраница темы: [Зоны и опасности](../world/areas.md).\n\n## 7. Заметки\n\n- Ракеты: попаданий в секунду на борт растёт всё медленнее: 1,00 → 1,20 → 1,33 → 1,43 (+0,20, +0,13, +0,10), а цена идёт 40 → 75 → 120 → 210. Четвёртый уровень почти втрое дороже третьего ради +0,14.\n- Носовые стойки I и II бьют тем же, что Ракеты I и II, но стоят 90 и 170 против 40 и 75. Их единственное отличие — стрельба вперёд, и Катерок не может их нести вовсе.\n- Турель, бесплатная и весом 0,3 т, даёт 1,25 попадания в секунду одной стойкой, чуть больше, чем Ракеты II на борт (1,20). Платой служит досягаемость 45 м против 80.\n- Мина — самый плотный вред на секунду на борт (2,00) при цене 300, но бьёт только по лодке, наехавшей на неё; в таблице времени «Мина (в цель)» оптимистична.\n- Торпеда: 12 попаданий за снаряд топят любой корпус без пояса, кроме Канонерки (16), одним попаданием; с броневым поясом одним не топится уже Патрульный катер (14). Взамен она перезаряжается 10 с, идёт ≈7,6 с и стоит 450 монет и 0,8 т. Канонерке с тяжёлым поясом (27) нужны три залпа.\n- Дрон бьёт в том же темпе, что Ракеты I (0,50), а пара с люлькой стоит 480 монет против 40; взамен он стреляет сам, не требует вывода борта, но стоит всего два попадания и должен долететь до цели.\n- Охотник даже ас стреляет в 1,2 раза медленнее игрока с такой же установкой, а новичок в 2,2 раза. Потому охотнику той же установки нужно больше времени: например, Ракеты IV ас бьёт 0,95 попадания в секунду против 1,14 у игрока.\n- Мина (5 у корпуса) и бочка (5) равны и бьют сильнее ракеты в пять раз; мина-ловушка поля (8) сильнее любой мины игрока (5).\n- Тяжёлый пояс на Катерке — +2 при 2 попаданиях корпуса, то есть вдвое больше; на Канонерке +11 из 16.\n- Разрыв между сборками велик: Канонерку без пояса Торпеды топят за два залпа (10 с), мины — за четыре (7,5 с), а Ракеты I — за 30 с.\n"}, {"id": "base-boatyard", "path": "base/boatyard.md", "title": "Верфь", "section": "base", "date": "2026-11-10", "md": "# Верфь\n\nВерфь — экран у пирса, где лодка собирается из деталей. Открывается только на базе. Цены и массы деталей — в [Балансе лодок](../balance/boats.md) и [Балансе оружия](../balance/weapons.md).\n\n## Решения владельца\n- 2026-11-10: вид сверху не годится, верфь смотрят низко, сбоку и немного сверху. Вход на верфь — плавный переход камеры с лёгким приближением, лодка сама подъезжает в кадр. Выбор детали почти не двигает камеру: игрок крутит вид сам.\n- Верфь у пирса: лодка настраивается там, где стоит, на живой воде. Не в открытом море.\n- Верфь — нижняя лента, как гараж NFS: категории плитками вдоль низа, над ними ряд карточек деталей с ценой и весом, показатели справа, кошелёк; мышь, клавиши и геймпад. Значков на лодке, по которым надо щёлкать, нет.\n- Верфь открывается только на базе, никогда в море.\n- Верфь показывает монеты на руках в углу, на глянцевой табличке-кошельке рядом с жетоном-монетой: монеты везде выглядят одинаково. Счёт убывает по мере покупки детали, а каждая цена показывает, хватает ли монет. Деталь, на которую наведён фокус в ряду, имеет фокус меню, светится аква под аквамариновым кольцом; оранжевым отмечена только установленная деталь.\n- Деталь, на которую наведён фокус, стоит на лодке призраком: прозрачным и светящимся аква, корпус показан призраком целиком, и лодка сидит в воде так, как села бы с ней. Если снова навести на установленную деталь или выйти, лодка возвращается к установленному. Установленная деталь встаёт с небольшой осадкой и бликом.\n- Статистика верфи сохраняет тёмный подсвеченный экран в футляре, как карточка на столе: плотный глянцевый аквамариновый пластик с лентой и наклейками.\n- Отполированный экран статистики лодки.\n- Выход с верфи: «Готово», Esc и Tab оставляют лодку как построена. Проект, который утонул бы, сперва предупреждает, потом оставляет последний проект за визит, который держался на плаву.\n\n## Как устроено\nОткрывается только на базе: `Boatyard` держит лодку, как она спроектирована, на её месте у пирса (`Dock.Berth`) на живой воде, поэтому вес виден по осадке, дифференту и опрокидыванию.\n`camera/YardCamera.cs` (`OrbitView`, как и круговой вид демо) стоит над водой у пирса (`Dock.Room`) и показывает всю лодку низко, под небольшим углом над горизонтом, в левой части экрана между краем экрана и статистикой, над карточками. Объектив смещён от оси (сдвиг усечённой пирамиды), поэтому лодка лежит в этой доле экрана и остаётся прямой; там, где комната держит вид близко, объектив расширяется, а угол не растёт. Первый вид — с солнечной стороны, где вид стоит дальше всего ([Q66](../questions/interface.md#q66)).\nВход — переход от вида базы (`Dock.View`) к виду верфи за секунду с небольшим приближением; лодка в это время сама подходит к причалу из моря и разворачивается. Выход возвращает вид назад, а `Esc` сразу после входа не ломает переход. Только вид местного игрока: мир не останавливается.\nВыбор места или детали вид не двигает. Игрок крутит его сам: перетаскивание мышью вне интерфейса, правый стик, Q и E (рыскание свободно, наклон зажат низко над водой); колесо, триггеры, R и F приближают в небольших пределах.\n\nМеста лодки — плитки ленты вдоль низа (`ui/Ribbon.cs`): корпус, мотор, броня, станции и снаряжение, каждая с пиктограммой; выбранная светится аква, вид при этом остаётся на месте. Над лентой ряд карточек деталей этого места (`Choices`), каждая с весом; установленная обведена оранжевым, не купленная лежит матовой под замком с ценой, зелёной, если монет хватает. A и D меняют место, W и S ходят по карточкам, Enter ставит. Выноска предлагает деталь, и второе нажатие покупает и ставит её; монеты убывают в кошельке рядом с «Готово» (`ui/Purse.cs`). Enter только ставит. Корпус с большим числом станций возвращает детали, которые держали его станции за этот визит (`Design.WithHull`). Снаряжение — свои плитки ленты («Снаряжение 1, 2, 3», по числу мест корпуса, `Place.Gear`): каждое заполняется снаряжением или остаётся пустым, а вид, уже стоящий на другом месте, в ряду не предлагается. Смена корпуса сохраняет снаряжение по местам, а то, что не поместилось, снимается. Экран статистики перечисляет снаряжение по местам.\nСтатистика на подсвеченном экране в глянцевом корпусе карточки верстака (`Gloss.Case`, `StatsPanel`), гоночный номер корпуса на наклейке, в единицах самой детали, зелёным там, где лучше, красным там, где хуже, на светящихся сегментах ([Q52](../questions/interface.md#q52)); сцепление, где нет ни лучше, ни хуже, показывает у подсвеченной детали белым. Блоки нагрузки идут дальше того, что корпус держит на плаву, красным; вес, который добавляет подсвеченная деталь, обведён, а то, что она снимает, остаётся пустыми рамками. Строки на плаву показывают каждое изменение. Экран растёт вместе со словами детали, а лампа под ним говорит всё: лодка годна к морю или почему утонет. «Готово» — глянцевая `Pill`. Выход делает проект лодкой следующей миссии; та, что утонула бы, предупреждает выноской, а повторный выход оставляет последний проект за визит, который держался на плаву, или лодку как была.\n\nЛодка у пирса — подсвеченный проект, поэтому она держится на воде так, как держался бы он. То, что у неё есть сверх установленного, рисуется отдельно (`Boat.Mark`) в `yard/ghost.gdshader`, аквамариновым стеклом прицела (`ui/glow_glass.gdshaderinc`), скрытым за лодкой и под водой; установленная деталь сохраняет его, угасая, и лодка оседает. Почему сама лодка: одна сборка и держит её на воде, и рисует её.\n\nЧто хранит `Progress` и как сохраняется, см. в [Прогресс и сохранения](../gameplay/progression.md).\n"}, {"id": "base-pier", "path": "base/pier.md", "title": "База: пирс", "section": "base", "date": "2026-11-11", "md": "# База: пирс\n\n![Пирс на базе, рядом лодки товарищей](../img/pier.jpg)\n\nБаза — открытый деревянный пирс в лагуне у острова посреди открытого мира (`Home cay` на карте арены), к которому нужно доплыть из моря. Это главный хаб: здесь сдаётся добыча, чинится и заправляется лодка, и отсюда открываются верфь, кооператив, судовой журнал, меню и выход обратно в море.\n\n## Решения владельца\n- База — простой открытый пирс и лодка игрока у него, как гараж в Rocket League или NFS. Эллинга нет. Пирс деревянный, без крыши, в бирюзовой лагуне: пальмы, кнехты, кранцы, фонари, вымпел; лодка стоит на живой воде. Смоделирован в Blender.\n- База сделана красиво: это главный хаб игрока.\n- Игра начинается сразу в открытом мире в море, а в гавань у пирса нужно приплыть самому и пришвартоваться на `Space` (или D-pad Вниз на геймпаде), сбавив ход вдали от охотников (2026-11-10).\n- Лодки товарищей по кооперативу видны на заднем плане, у соседних мест того же пирса, до трёх, над каждой имя игрока.\n- На базе кнопки, как в NFS или World of Warships, а не предметы, по которым надо щёлкать. Списка-меню на главном экране нет.\n- Плитки базы стоят одним рядом с равными промежутками; монеты показаны жетоном и числом, без подписи. Выход с пирса сразу возвращает лодку от причала в то же живое море.\n\n## Как устроено\n`tools/dock.py` моделирует пирс в Blender и пишет `base/dock.glb`: цвет и фактура каждой грани лежат в вершинах, как у лодок, поэтому `surface.gdshader` рисует его в едином свете сцены. В модели есть также вид базы (камера), четыре места у пирса, коробки настилов и точка, откуда смотрит верфь.\n\n- **Пирс** (`Dock`): настил от пляжа и четыре пальца с местами (`Dock.Berths`, `Dock.Berth`). Его настилы входят в землю для столкновений, снарядов и щупов охотников (`World.Ground`), но не для глубины моря. Лодки стоят носом к морю.\n- **Экран** (`Hub`, `ui/Ribbon.cs`): вид с воды на лодку игрока у первого места. Вдоль низа экрана лента глянцевых плиток: «Верфь», «Кооператив», «Журнал», «Меню», справа большая оранжевая «На арену», она подсвечена сначала. Курсор или A и D подсвечивают плитку, выноска говорит, что она делает; щелчок или Enter открывает. Tab открывает верфь, Esc меню. Монеты в кошельке вверху справа. Лента — решение без владельца ([Q25](../questions/interface.md#q25)).\n- **Товарищи** (`Hub.Moor`, `Say.Moored`): каждый игрок говорит свой проект и имя, когда связывается и когда приходит на базу; хост пересылает слова гостей остальным. Лодки стоят у мест за лодкой игрока в порядке пиров, имя на бумажной бирке над каждой. Имя берётся из Steam, в локальной сети — имя пользователя компьютера. Переоснащение видно, когда товарищ выходит из верфи, а не по детали ([Q140](../questions/online.md#q140)).\n\nСм. также: [Верфь](boatyard.md), [Экраны и меню](../interface/screens.md), [Кооператив](../online.md).\n"}, {"id": "base-testing-ground", "path": "base/testing-ground.md", "title": "Полигон", "section": "base", "date": "2026-11-08", "md": "# Полигон\n\nПолигон — место у базы, куда «Испытать» на верфи выводит лодку проверить в деле.\n\n## Решения владельца\n- «Испытать» на верфи выводит лодку на полигон у базы и после него возвращает на верфь. Его мишени-макеты — фанерные макеты лодок на пластиковых бочках, жёлто-чёрные с белым номером. Некоторые ходят кругами; ни одна не стреляет. Потопленная мишень через некоторое время снова поднимается из моря в пене. Топлива там лодка не жжёт, а потопленная сразу снова на воде. Появляются только припасы.\n\n## Как устроено\n«Испытать» (T) на верфи выводит лодку на полигон у базы, который оформляется как миссия (`Game.Try`).\n`TestingGround` ставит шесть мишеней-макетов (`Designs.Dummy`, корпус вне списков верфи, `Outfit.Mockup`) впереди и мористее старта: четыре стоят на якоре бортом к нему, две ходят по кругу. Они на отдельной стороне (`TestingGround.Side`), враги для каждого игрока, и ничего не стреляют. Мишень, ушедшая под воду, снова поднимается на своём месте (`Boat.Raise`) до того, как мир её отпустит, а потопленная лодка игрока поднимается сразу на старте. Почему поднимается, а не выводится заново: зеркало гостя хранит ту же лодку. Поднявшаяся лодка выходит из моря в кипении пены (`Boat.Rise`, `Afloat`), и пока она не поднялась, её никто не таранит. Выходов с полигона нет: «На базу» в меню Esc, без предупреждения, возвращает на верфь. Бак остаётся полным; припасы появляются как в любом выходе ([Q76](..
